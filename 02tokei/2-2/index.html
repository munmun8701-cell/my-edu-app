<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>じこくと時間　２時間目　②</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
    <div class="tabs">
        <button class="tab-btn active" id="tab2" onclick="switchProblem(2)">問題 ②</button>
        <button class="tab-btn" id="tab3" onclick="switchProblem(3)">問題 ③</button>
    </div>

    <div class="question-box" id="questionText">
        問題②：10時30分から11時10分までの時間をもとめよう。
    </div>

    <div class="clock-area">
        <div class="clock" id="clockFace">
            <div class="center-dot"></div>
            <div class="hand hour" id="hourHand"></div>
            <div class="hand minute" id="minuteHand"></div>
        </div>
        <div id="timeDisplay" style="font-weight: bold; font-size: 22px; margin-top: 10px; color: #0056b3;">10:30</div>
    </div>

    <div class="message-box" id="msg">11時まで何分かな？数字を入力して「確認」をおしてね。</div>

    <div class="timeline-container">
        <div class="timeline">
            <div class="time-point" id="startLabel">10時30分</div>
            <div class="arrow-box">
                <input type="number" id="in1" class="input-mini" placeholder="?">
                <button class="btn-check" id="btn1" onclick="checkStep1()">確認</button>
                <div class="arrow-line"></div>
            </div>
            <div class="time-point">11時00分</div>
            <div class="arrow-box">
                <input type="number" id="in2" class="input-mini" placeholder="?" disabled>
                <button class="btn-check" id="btn2" onclick="checkStep2()" disabled>確認</button>
                <div class="arrow-line"></div>
            </div>
            <div class="time-point" id="endLabel">11時10分</div>
        </div>
    </div>

    <div class="total-area" id="totalArea" style="opacity: 0.3;">
        ぜんぶで：<input type="number" id="inTotal" class="total-input" placeholder="?" disabled> 分
        <button class="btn-check" id="btnTotal" onclick="checkTotal()" disabled>答え合わせ</button>
    </div>

    <br>
    <button class="btn-reset" onclick="resetCurrent()">この問題をやりなおす</button>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>時刻と時間　４時間目①</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
  <div class="tabs">
    <button class="tab-btn active" id="tab-prob4" onclick="loadProblem(4)">問題④</button>
    <button class="tab-btn" id="tab-prob5" onclick="loadProblem(5)">問題⑤</button>
  </div>

  <div class="question-text" id="questionText">
    ④ 11時30分から40分前の時こくをもとめましょう。
  </div>

  <div class="clock-container">
    <div class="clock" id="clockFace">
      <div class="center-dot"></div>
      <div class="hand hour" id="hourHand"></div>
      <div class="hand minute" id="minuteHand"></div>
    </div>
    <h2 id="timeDisplay">11時30分</h2>
  </div>

  <div id="instruction" class="instruction-box">
    まずは「ちょうどの時こく（11時）」にもどそう。<br>何分もどればいいかな？
  </div>

  <div class="timeline-container">
    <div class="timeline-row">
      <div class="time-point" id="tp-answer">？時？分</div>
      
      <div class="arrow-container">
        <div class="input-group" id="group-step2" style="visibility: hidden;">
          <input type="number" id="in-step2" class="num-input" min="0" max="60"> 分
          <button class="btn-check" id="btn-step2" onclick="checkStep2()">かくにん</button>
        </div>
        <div class="arrow-line-left"></div>
      </div>
      
      <div class="time-point" id="tp-mid">11時00分</div>
      
      <div class="arrow-container">
        <div class="input-group" id="group-step1">
          <input type="number" id="in-step1" class="num-input" min="0" max="60"> 分
          <button class="btn-check" id="btn-step1" onclick="checkStep1()">かくにん</button>
        </div>
        <div class="arrow-line-left"></div>
      </div>
      
      <div class="time-point" id="tp-start">11時30分</div>
    </div>
  </div>

  <div class="buttons">
    <button class="btn-reset" onclick="resetApp()">この問題をやり直す</button>
  </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

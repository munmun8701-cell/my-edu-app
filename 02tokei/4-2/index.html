<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>じこくと時間　４時間目　②</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
    <div class="header-title">🌟 時間の計算を考えよう 🌟</div>

    <div class="question-box">
        <div class="q-header">町の様子を調べに行くのに歩いた時間は、右のとおりです。</div>
        <div class="q-layout">
            <div class="q-text">歩いた時間は、全部で<br>何時間何分ですか。</div>
            <div class="q-table">
                <div class="t-row"><span>学校から商店がい</span><span>30分</span></div>
                <div class="t-row"><span>商店がいから公園</span><span>20分</span></div>
                <div class="t-row"><span>公園から学校</span><span>30分</span></div>
            </div>
        </div>
    </div>

    <div class="nav-board" id="nav-board">
        <div class="nav-title" id="nav-title">ステップ ①：ぜんぶで何分？</div>
        <div class="nav-msg" id="nav-msg">
            まずは「分」だけで、歩いた時間をぜんぶたしてみよう。<br>
            マスに数字を入れて「かくにん」をおしてね。
        </div>
    </div>

    <div class="workspace">
        <div class="step-section" id="step1-area">
            <div class="calc-row justify-center">
                <input type="text" id="val1" class="num-input" maxlength="2" placeholder="?"> 分 ＋ 
                <input type="text" id="val2" class="num-input" maxlength="2" placeholder="?"> 分 ＋ 
                <input type="text" id="val3" class="num-input" maxlength="2" placeholder="?"> 分 ＝ 
                <input type="text" id="total-min" class="num-input highlight-input" maxlength="2" placeholder="?"> 分
            </div>
            <div class="action-area">
                <button class="btn-check" id="btn-step1" onclick="checkStep1()">かくにん</button>
            </div>
        </div>

        <div class="step-section hidden" id="step2-area">
            <div class="blocks-container">
                <div class="blocks-desc">「10分ブロック」が 8こ（80分）あるよ。</div>
                
                <div class="time-zones">
                    <div class="zone hour-zone" id="hour-zone">
                        <div class="zone-label">1時間（60分）のへや</div>
                        <div class="block-grid" id="hour-grid">
                            </div>
                    </div>

                    <div class="zone min-zone" id="min-zone">
                        <div class="zone-label">分のへや</div>
                        <div class="block-grid" id="min-grid">
                            <div class="time-block c-blue">10</div><div class="time-block c-blue">10</div><div class="time-block c-blue">10</div>
                            <div class="time-block c-green">10</div><div class="time-block c-green">10</div>
                            <div class="time-block c-yellow">10</div><div class="time-block c-yellow">10</div><div class="time-block c-yellow">10</div>
                        </div>
                    </div>
                </div>

                <div class="action-area">
                    <button class="btn-action" id="btn-group" onclick="groupBlocks()">
                        🔄 60分を「1時間」のへやにまとめよう！
                    </button>
                </div>
            </div>
        </div>

        <div class="step-section hidden" id="step3-area">
            <div class="calc-row justify-center final-ans-box">
                答え： 
                <input type="text" id="ans-h" class="num-input" maxlength="1" placeholder="?"> 時間 
                <input type="text" id="ans-m" class="num-input" maxlength="2" placeholder="?"> 分
                <button class="btn-check ml-10" id="btn-step3" onclick="checkStep3()">答え合わせ</button>
            </div>
        </div>
    </div>

    <button class="btn-reset" onclick="resetApp()">最初からやりなおす</button>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

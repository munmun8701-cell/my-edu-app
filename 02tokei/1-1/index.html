<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>時刻と時間　１時間目</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
  <div class="question-text">
    学校を 8時40分 に出て、30分 歩くと商店がいに着きました。<br>着いた時こくは何時何分ですか。
  </div>

  <div class="clock-container">
    <div class="clock" id="clockFace">
      <div class="center-dot"></div>
      <div class="hand hour" id="hourHand"></div>
      <div class="hand minute" id="minuteHand"></div>
    </div>
    <h2 id="timeDisplay">8時40分</h2>
  </div>

  <div id="instruction" class="instruction-box">
    まずは「ちょうどの時こく（9時）」まで進めよう。<br>9時にするには、何分進めればいいかな？
  </div>

  <div class="timeline-container">
    <div class="timeline-row">
      
      <div class="time-point" id="tp-start">8時40分</div>
      
      <div class="arrow-container">
        <div class="input-group" id="group-step1">
          <input type="number" id="in-step1" class="num-input" min="0" max="60"> 分
          <button class="btn-check" id="btn-step1" onclick="checkStep1()">すすめる</button>
        </div>
        <div class="arrow-line-right"></div>
      </div>
      
      <div class="time-point" id="tp-mid">9時00分</div>
      
      <div class="arrow-container">
        <div class="input-group" id="group-step2" style="visibility: hidden;">
          <input type="number" id="in-step2" class="num-input" min="0" max="60"> 分
          <button class="btn-check" id="btn-step2" onclick="checkStep2()">すすめる</button>
        </div>
        <div class="arrow-line-right"></div>
      </div>
      
      <div class="time-point" id="tp-answer">？時？分</div>
      
    </div>
  </div>

  <div class="buttons">
    <button class="btn-reset" onclick="resetApp()">最初からやり直す</button>
  </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

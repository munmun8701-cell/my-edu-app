<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>時刻と時間　２時間目　①</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
  <div class="question-text">
    商店がいを 9時50分 に出て、公園に 10時10分 に着きました。<br>商店がいから公園まで、かかった時間は何分ですか。
  </div>

  <div class="clock-container">
    <div class="clock" id="clockFace">
      <div class="center-dot"></div>
      <div class="hand hour" id="hourHand"></div>
      <div class="hand minute" id="minuteHand"></div>
    </div>
    <h2 id="timeDisplay">9時50分</h2>
  </div>

  <div id="instruction" class="instruction-box">
    まずは「ちょうどの時こく（10時）」で区切って考えよう。<br>9時50分から10時までは、何分かな？
  </div>

  <div class="timeline-container">
    <div class="timeline-row">
      
      <div class="time-point">9時50分</div>
      
      <div class="arrow-container">
        <div class="input-group" id="group-step1">
          <input type="number" id="in-step1" class="num-input" min="0" max="60"> 分
          <button class="btn-check" id="btn-step1" onclick="checkStep1()">かくにん</button>
        </div>
        <div class="arrow-line-right"></div>
      </div>
      
      <div class="time-point">10時00分</div>
      
      <div class="arrow-container">
        <div class="input-group" id="group-step2" style="visibility: hidden;">
          <input type="number" id="in-step2" class="num-input" min="0" max="60"> 分
          <button class="btn-check" id="btn-step2" onclick="checkStep2()">かくにん</button>
        </div>
        <div class="arrow-line-right"></div>
      </div>
      
      <div class="time-point">10時10分</div>
      
    </div>
    
    <div class="total-container" id="group-step3" style="visibility: hidden;">
      あわせて <input type="number" id="in-step3" class="num-input total-input" min="0" max="60"> 分
      <button class="btn-check" id="btn-step3" onclick="checkStep3()">こたえあわせ</button>
    </div>
  </div>

  <div class="buttons">
    <button class="btn-reset" onclick="resetApp()">最初からやり直す</button>
  </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

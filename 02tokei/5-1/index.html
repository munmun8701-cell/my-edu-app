<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>時刻と時間　５時間目　①</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
    <div class="question-box">
        紙ひこうきがとんでいる時間の表し方を調べましょう。
    </div>

    <div class="step-card" id="step1-card">
        <div class="step-title">① 1分より短い時間の表し方を調べよう</div>
        
        <div class="calc-row">
            1分より短い時間のたんいに、
            <input type="text" id="in-unit" class="text-input" placeholder="？"> があります。
            <button class="btn-check" id="btn-step1" onclick="checkStep1()">確認</button>
        </div>
        
        <div class="calc-row hidden" id="conversion-row">
            <div class="highlight-box">
                1分 ＝ <input type="number" id="in-sec" class="num-input" placeholder="？"> 秒
            </div>
            <button class="btn-check" id="btn-step1-2" onclick="checkStep1_2()">確認</button>
        </div>
    </div>

    <div class="step-card disabled-card" id="step2-card">
        <div class="step-title">② ストップウォッチは何秒を表していますか？</div>
        <div class="hint-text" id="stopwatch-hint">針や数字が動いて止まるよ。よく見てね！</div>
        
        <div class="stopwatch-container">
            <div class="sw-wrapper">
                <div class="sw-label">㋐ アナログ</div>
                <div class="analog-sw">
                    <div class="sw-center-dot"></div>
                    <div class="sw-hand" id="sw-hand-a"></div>
                    <div class="sw-number top">60</div>
                    <div class="sw-number right">15</div>
                    <div class="sw-number bottom">30</div>
                    <div class="sw-number left">45</div>
                </div>
                <div class="ans-row">
                    ㋐ <input type="number" id="in-ans-a" class="num-input" placeholder="?"> 秒
                    <button class="btn-check" id="btn-ans-a" onclick="checkAnalog()">確認</button>
                </div>
            </div>

            <div class="sw-wrapper">
                <div class="sw-label">㋑ デジタル</div>
                <div class="digital-sw">
                    <div class="digital-display" id="digital-display">00:00:00</div>
                </div>
                <div class="ans-row">
                    ㋑ <input type="number" id="in-ans-i" class="num-input" placeholder="?"> 秒
                    <button class="btn-check" id="btn-ans-i" onclick="checkDigital()">確認</button>
                </div>
            </div>
        </div>
    </div>

    <div class="step-card hidden" id="step3-card" style="background-color: #f0fdf4; border-color: #22c55e;">
        <div class="step-title" style="color: #15803d;">③ 自分でストップウォッチを動かしてみよう！</div>
        <div style="display: flex; justify-content: center; gap: 10px; margin-top: 10px;">
            <button class="btn-action start" onclick="startFreePlay()">スタート</button>
            <button class="btn-action stop" onclick="stopFreePlay()">ストップ</button>
            <button class="btn-action reset" onclick="resetFreePlay()">リセット</button>
        </div>
    </div>

    <div class="message-box" id="msg">
        1分より短い時間のたんいを、ひらがな か 漢字で入力してね。
    </div>

    <button class="btn-reset-all" onclick="resetApp()">最初からやりなおす</button>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

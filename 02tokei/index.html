<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>時計と時間</title>
  <style>
    body {
      margin: 0;
      display: flex;
      height: 100vh;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: #f5ffff; /* さらに明るい水色 */
    }
    #sidebar {
      width: 25%;
      background-color: #e0ffff; /* パステルライトブルー */
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto; /* メニューが多いのでスクロールできるように設定 */
      border-right: 3px solid #b0e0e6;
    }
    #content {
      width: 75%;
      height: 100vh;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    h2 {
      text-align: center;
      color: #333;
      font-size: 1.2rem;
      margin-bottom: 20px;
    }
    .menu-btn {
      display: block;
      width: 100%;
      padding: 12px; /* ボタンが多いので少しスリムに */
      margin-bottom: 10px;
      background-color: white;
      border: 2px solid #87ceeb; /* スカイブルーの枠線 */
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      color: #333;
      font-weight: bold;
      cursor: pointer;
      box-sizing: border-box;
      transition: all 0.2s;
    }
    .menu-btn:hover {
      background-color: #87cefa;
      color: white;
      transform: translateY(-2px);
    }
    .back-btn {
      background-color: #ffb6c1;
      border-color: #ff69b4;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>時計と時間</h2>
    
    <a href="./1-1/index.html" target="content-frame" class="menu-btn">1時間目</a>

    <a href="./2-2/index.html" target="content-frame" class="menu-btn">2時間目 ②</a>
    <a href="./3-1/index.html" target="content-frame" class="menu-btn">3時間目 ①</a>
    <a href="./3-2/index.html" target="content-frame" class="menu-btn">3時間目 ②</a>
    <a href="./4-1/index.html" target="content-frame" class="menu-btn">4時間目 ①</a>
    <a href="./4-2/index.html" target="content-frame" class="menu-btn">4時間目 ②</a>
    <a href="./5-1/index.html" target="content-frame" class="menu-btn">5時間目 ①</a>
    <a href="./5-2/index.html" target="content-frame" class="menu-btn">5時間目 ②</a>
    <a href="./6-1/index.html" target="content-frame" class="menu-btn">6時間目</a>

  <div id="content">
    <iframe name="content-frame" src="./1-1/index.html"></iframe>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>時刻と時間　３時間目　②</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
    <div class="tabs">
        <button class="tab-btn active" id="tab4" onclick="switchProblem(4)">問題 ④</button>
        <button class="tab-btn" id="tab5" onclick="switchProblem(5)">問題 ⑤</button>
    </div>

    <div class="question-box" id="questionText">
        11時30分から40分前の時こくをもとめましょう。
    </div>

    <div class="clock-area">
        <div class="clock" id="clockFace">
            <div class="center-dot"></div>
            <div class="hand hour" id="hourHand"></div>
            <div class="hand minute" id="minuteHand"></div>
        </div>
        <div id="timeDisplay" class="digital-time">11:30</div>
    </div>

    <div class="message-box" id="msg">
        まずは、ちょうどの時こく（11時00分）まで何分もどればいいかな？
    </div>

    <div class="timeline-container">
        <div class="timeline">
            <div class="time-point" id="finalTimeLabel">？時？分</div>
            <div class="arrow-box">
                <input type="number" id="in2" class="input-mini" placeholder="?" disabled>
                <button class="btn-check" id="btn2" onclick="checkStep2()" disabled>確認</button>
                <div class="arrow-line-left"></div>
            </div>
            <div class="time-point" id="midTimeLabel">11時00分</div>
            <div class="arrow-box">
                <input type="number" id="in1" class="input-mini" placeholder="?">
                <button class="btn-check" id="btn1" onclick="checkStep1()">確認</button>
                <div class="arrow-line-left"></div>
            </div>
            <div class="time-point" id="startTimeLabel">11時30分</div>
        </div>
    </div>

    <div class="answer-area" id="answerArea" style="opacity: 0.3;">
        こたえ：
        <input type="number" id="ansH" class="ans-input" placeholder="時" disabled> 時
        <input type="number" id="ansM" class="ans-input" placeholder="分" disabled> 分
        <button class="btn-check" id="btnFinal" onclick="checkFinal()" disabled>答え合わせ</button>
    </div>

    <br>
    <button class="btn-reset" onclick="resetCurrent()">この問題をやりなおす</button>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

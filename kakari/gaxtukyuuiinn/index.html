<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学級委員マスターコンソール v4</title>
  <style>
    :root {
      --bg-dark: #0a0510;
      --card-bg: rgba(20, 10, 35, 0.8);
      --card-border: rgba(255, 170, 0, 0.3);
      --gold: #ffaa00;
      --gold-glow: rgba(255, 170, 0, 0.5);
      --cyan: #00f3ff;
      --cyan-glow: rgba(0, 243, 255, 0.5);
      --red: #ff0055;
      --red-glow: rgba(255, 0, 85, 0.5);
      --green: #00ff88;
      --pink: #ff7ad9;
      --text-main: #f0f0f5;
      --text-sub: #aa99bb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'BIZ UDPGothic', Meiryo, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* ===== ふりがな ===== */
    rt { display: none; }
    body.furigana-mode rt { display: ruby-text; font-size: 0.55em; color: var(--gold); font-weight: normal; }
    body.furigana-mode .step-text, body.furigana-mode .pr-text { line-height: 2; }

    #bg-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; background: radial-gradient(circle at center, #150a20 0%, #05020a 100%); }
    #alert-overlay { position: fixed; inset: 0; background: rgba(255, 0, 85, 0.3); z-index: 3000; pointer-events: none; opacity: 0; display: none; }
    .flash-anim { animation: flashRed 0.5s infinite; display: block !important; }
    @keyframes flashRed { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

    #cue-overlay { position: fixed; inset: 0; z-index: 3500; display: none; align-items: center; justify-content: center; font-size: clamp(3rem, 14vw, 10rem); font-weight: 900; color: #fff; background: rgba(10, 5, 20, 0.88); text-shadow: 0 0 30px var(--gold); pointer-events: none; text-align: center; }
    #cue-overlay.show { display: flex; animation: pop 0.25s ease; }
    @keyframes pop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    #toast-root { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 4000; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
    .toast { background: rgba(0, 0, 0, 0.9); border: 1px solid var(--cyan); color: var(--cyan); padding: 8px 18px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; animation: pop 0.2s ease; box-shadow: 0 0 12px var(--cyan-glow); }
    .toast.warn { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 12px var(--gold-glow); }

    /* ===== トップバー ===== */
    .top-bar { width: 100%; max-width: 1560px; display: flex; justify-content: space-between; align-items: center; background: rgba(10, 5, 20, 0.85); border: 1px solid var(--gold); border-radius: 12px; padding: 12px 20px; margin-bottom: 14px; box-shadow: 0 0 18px var(--gold-glow); backdrop-filter: blur(10px); flex-wrap: wrap; gap: 12px; }
    .title-area h1 { font-size: 1.5rem; color: var(--gold); text-shadow: 0 0 10px var(--gold-glow); }
    .exp-bar-container { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--cyan); }
    .exp-bar-bg { width: 130px; height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 5px; overflow: hidden; }
    .exp-bar-fill { height: 100%; background: var(--cyan); width: 0%; transition: width 0.5s; box-shadow: 0 0 10px var(--cyan-glow); }
    .goal-box { flex: 1; min-width: 260px; max-width: 520px; background: rgba(0, 243, 255, 0.07); border: 1px solid var(--cyan); border-radius: 10px; padding: 6px 12px; }
    .goal-box label { font-size: 0.8rem; color: var(--cyan); font-weight: bold; }
    .goal-box input { border-color: transparent; background: rgba(0, 0, 0, 0.4); color: var(--cyan); font-weight: bold; font-size: 1.05rem; }
    #prev-goal { font-size: 0.78rem; color: var(--text-sub); min-height: 1em; }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* ===== ボタン ===== */
    .btn { background: rgba(255, 170, 0, 0.15); color: var(--gold); border: 1px solid var(--gold); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s; font-size: 0.9rem; font-family: inherit; }
    .btn:hover { background: rgba(255, 170, 0, 0.32); box-shadow: 0 0 10px var(--gold-glow); }
    .btn:active { transform: scale(0.96); }
    .btn-cyan { background: rgba(0, 243, 255, 0.13); color: var(--cyan); border-color: var(--cyan); }
    .btn-cyan:hover { background: rgba(0, 243, 255, 0.3); box-shadow: 0 0 10px var(--cyan-glow); }
    .btn-red { background: rgba(255, 0, 85, 0.13); color: var(--red); border-color: var(--red); }
    .btn-red:hover { background: rgba(255, 0, 85, 0.3); box-shadow: 0 0 10px var(--red-glow); }
    .btn-green { background: rgba(0, 255, 136, 0.13); color: var(--green); border-color: var(--green); }
    .btn-green:hover { background: rgba(0, 255, 136, 0.3); }
    .btn.sm { padding: 3px 9px; font-size: 0.78rem; }
    .btn.big { padding: 11px 20px; font-size: 1.05rem; }
    .btn.wide { width: 100%; }
    .mini { background: rgba(255, 255, 255, 0.08); color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 5px; padding: 1px 7px; cursor: pointer; font-size: 0.75rem; font-family: inherit; }
    .mini:hover { background: rgba(255, 255, 255, 0.2); }
    .mini.red { color: var(--red); border-color: var(--red); }
    .mini.on { background: var(--gold); color: #000; }

    /* ===== レイアウト ===== */
    .dashboard-grid { width: 100%; max-width: 1560px; display: grid; grid-template-columns: 1fr 1.9fr 1fr; gap: 14px; align-items: start; }
    .column { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    @media (max-width: 1150px) { .dashboard-grid { grid-template-columns: 1fr 1fr; } .col-center { grid-column: 1 / -1; order: -1; } }
    @media (max-width: 700px) { .dashboard-grid { grid-template-columns: 1fr; } body { padding: 8px; } }

    .panel { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 10px; }
    .panel-header { font-size: 1.05rem; color: var(--cyan); border-bottom: 1px solid rgba(0, 243, 255, 0.3); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .hdr-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .hint { font-size: 0.78rem; color: var(--text-sub); font-weight: normal; }
    .empty { font-size: 0.85rem; color: var(--text-sub); text-align: center; padding: 10px; border: 1px dashed rgba(255, 255, 255, 0.2); border-radius: 8px; }
    .row { display: flex; gap: 6px; align-items: center; }
    .row.wrap { flex-wrap: wrap; }
    .grow { flex: 1; min-width: 0; }

    input[type="text"], input[type="number"], input[type="date"], textarea, select {
      width: 100%; padding: 7px 8px; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--text-sub); color: var(--text-main); border-radius: 6px; font-family: inherit; font-size: 0.95rem;
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 8px var(--gold-glow); }
    textarea { resize: vertical; min-height: 54px; }
    select { cursor: pointer; }
    input[type="checkbox"] { width: auto; accent-color: var(--gold); cursor: pointer; }
    input.num { width: 64px; text-align: center; }
    label { font-size: 0.85rem; color: var(--text-sub); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
    ::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 3px; }

    /* ===== 議題リスト ===== */
    #agenda-list { display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow-y: auto; }
    .ag-item { display: flex; align-items: center; gap: 6px; padding: 7px 8px; background: rgba(0, 0, 0, 0.4); border: 1px solid transparent; border-left: 4px solid var(--text-sub); border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
    .ag-item:hover { background: rgba(255, 255, 255, 0.08); }
    .ag-item.cur { border-color: var(--gold); box-shadow: 0 0 10px var(--gold-glow); }
    .ag-item.st-done { opacity: 0.6; border-left-color: var(--green); }
    .ag-item.st-doing { border-left-color: var(--gold); }
    .ag-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ag-st { color: var(--gold); }
    .ag-btns { display: flex; gap: 3px; }

    /* ===== タスク ===== */
    .task-list { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; }
    .task-item { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 7px; background: rgba(0, 0, 0, 0.4); border-left: 4px solid var(--text-sub); border-radius: 6px; font-size: 0.9rem; }
    .task-item.pri-high { border-left-color: var(--red); }
    .task-item.pri-med { border-left-color: var(--gold); }
    .task-item.pri-low { border-left-color: var(--cyan); }
    .task-item.done { opacity: 0.5; text-decoration: line-through; border-left-color: var(--green); }

    /* ===== DB ===== */
    .db-item { background: rgba(0, 0, 0, 0.4); border: 1px dashed var(--text-sub); padding: 8px; border-radius: 6px; display: flex; flex-direction: column; gap: 5px; }
    .db-item textarea { font-size: 0.85rem; min-height: 50px; }
    #db-container { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; }

    /* ===== 中央：議題ヘッダー ===== */
    .start-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
    .start-card { background: rgba(0, 0, 0, 0.45); border: 2px solid var(--c, var(--cyan)); border-radius: 14px; padding: 18px 12px; text-align: center; cursor: pointer; transition: all 0.2s; color: var(--text-main); font-family: inherit; }
    .start-card:hover { transform: translateY(-3px); box-shadow: 0 0 18px var(--c); background: rgba(255, 255, 255, 0.07); }
    .start-card .ico { font-size: 2.4rem; display: block; }
    .start-card .nm { font-size: 1.15rem; font-weight: bold; color: var(--c); display: block; margin: 4px 0; }
    .start-card .ds { font-size: 0.8rem; color: var(--text-sub); }

    .ag-head { display: flex; flex-direction: column; gap: 6px; }
    .ag-head label { display: flex; align-items: center; gap: 6px; }
    .ag-head select { width: auto; }
    .ag-head .row { flex-wrap: wrap; }
    #m-title { min-width: 200px; }
    .ag-head label { white-space: nowrap; }
    #m-title { font-size: 1.15rem; font-weight: bold; color: var(--gold); }

    .stepper { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 8px; }
    .pill { flex: 0 0 auto; background: rgba(0, 0, 0, 0.5); color: var(--text-sub); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 20px; padding: 5px 12px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; font-family: inherit; }
    .pill.past { color: var(--green); border-color: rgba(0, 255, 136, 0.5); }
    .pill.on { background: var(--gold); color: #000; border-color: var(--gold); font-weight: bold; box-shadow: 0 0 12px var(--gold-glow); }
    .pill.on rt { color: #000; }

    .step-card { background: rgba(0, 0, 0, 0.4); border: 2px solid var(--tc, var(--cyan)); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .step-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .step-no { background: var(--gold); color: #000; font-weight: bold; border-radius: 12px; padding: 1px 10px; font-size: 0.85rem; }
    .script-speaker { color: var(--gold); font-weight: bold; font-size: 1.2rem; flex: 1; }
    .step-text { font-size: 1.25rem; line-height: 1.8; }
    .script-guide { font-size: 0.88rem; color: var(--text-sub); background: rgba(255, 255, 255, 0.05); border-radius: 6px; padding: 6px 10px; }
    .step-nav { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
    .ph { color: var(--cyan); border-bottom: 2px solid var(--cyan); font-weight: bold; padding: 0 2px; }
    .ph.empty { color: var(--text-sub); border-bottom-style: dashed; border-color: var(--text-sub); }
    .say-box { background: rgba(255, 170, 0, 0.12); border: 2px dashed var(--gold); border-radius: 10px; padding: 10px 12px; font-size: 1.3rem; font-weight: bold; color: #fff; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
    .say-box .lbl { font-size: 0.75rem; color: var(--gold); display: block; }

    /* ===== 手順エディタ ===== */
    .editor { background: rgba(255, 170, 0, 0.06); border: 1px dashed var(--gold); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .ed-step { background: rgba(0, 0, 0, 0.4); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 5px; border-left: 4px solid var(--text-sub); }
    .ed-step.cur { border-left-color: var(--gold); }
    .ed-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .ed-row select { width: auto; }
    .ed-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* ===== ことばバンク ===== */
    .phrase-bank { border: 1px solid rgba(0, 243, 255, 0.35); border-radius: 10px; padding: 8px 10px; background: rgba(0, 243, 255, 0.04); }
    .phrase-bank summary { cursor: pointer; color: var(--cyan); font-weight: bold; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { background: rgba(255, 255, 255, 0.08); color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 16px; padding: 4px 11px; font-size: 0.85rem; cursor: pointer; font-family: inherit; }
    .chip:hover { background: rgba(255, 255, 255, 0.2); }
    .chip.on { background: var(--cyan); color: #000; border-color: var(--cyan); font-weight: bold; }
    .chip.say { border-color: var(--gold); color: var(--gold); }

    /* ===== 作業タブ ===== */
    .work-tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid rgba(255, 255, 255, 0.2); padding-bottom: 6px; }
    .wtab { background: rgba(0, 0, 0, 0.4); color: var(--text-sub); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 8px 8px 0 0; padding: 7px 14px; cursor: pointer; font-weight: bold; font-family: inherit; font-size: 0.92rem; }
    .wtab.on { background: var(--cyan); color: #000; border-color: var(--cyan); }
    .wtab .bd { background: var(--red); color: #fff; border-radius: 10px; padding: 0 6px; font-size: 0.72rem; margin-left: 4px; }
    .work-pane { display: none; flex-direction: column; gap: 10px; }
    .work-pane.on { display: flex; }

    /* 意見 */
    .op-input { display: grid; grid-template-columns: auto 1fr 90px auto; gap: 6px; }
    .op-input select { width: auto; }
    @media (max-width: 600px) { .op-input { grid-template-columns: 1fr 1fr; } .op-input #op-text { grid-column: 1 / -1; } }
    #op-list { display: flex; flex-direction: column; gap: 6px; max-height: 340px; overflow-y: auto; }
    .op-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; background: rgba(0, 0, 0, 0.45); border-left: 5px solid var(--tg, var(--cyan)); }
    .op-item.star { background: rgba(255, 170, 0, 0.18); }
    .op-text { flex: 1; font-size: 1rem; word-break: break-word; }
    .op-who { font-size: 0.78rem; color: var(--text-sub); }
    .op-btns { display: flex; gap: 3px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
    .tag-idea { --tg: var(--cyan); } .tag-agree { --tg: var(--green); } .tag-disagree { --tg: var(--red); } .tag-question { --tg: var(--gold); } .tag-worry { --tg: var(--pink); }

    /* 投票 */
    .vote-top { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .vote-summary { font-size: 0.9rem; color: var(--text-sub); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .warn { color: var(--gold); font-weight: bold; }
    .vote-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
    .vote-card { background: rgba(0, 0, 0, 0.5); border: 1px solid var(--cyan); border-radius: 10px; padding: 10px; position: relative; display: flex; flex-direction: column; gap: 6px; }
    .vote-card.lead { border-color: var(--gold); box-shadow: 0 0 14px var(--gold-glow); }
    .vote-card.spot { border-color: var(--green); box-shadow: 0 0 22px var(--green); }
    .vote-title-input { font-weight: bold; color: var(--gold); text-align: center; min-height: 44px; padding-right: 22px; }
    .vote-memo { font-size: 0.82rem; min-height: 46px; }
    .rank { position: absolute; top: -9px; left: -6px; background: var(--gold); color: #000; font-weight: bold; border-radius: 10px; padding: 0 8px; font-size: 0.8rem; }
    .del-vote-btn { position: absolute; top: -8px; right: -8px; background: var(--red); color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; line-height: 1; }
    .vote-count-row { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .vote-count-row input { width: 70px; text-align: center; font-size: 1.6rem; font-weight: bold; color: var(--cyan); }
    .vote-count-row .btn { font-size: 1.2rem; padding: 2px 14px; }
    .bar-bg { height: 8px; background: rgba(255, 255, 255, 0.12); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--cyan); transition: width 0.3s; }
    .lead .bar-fill { background: var(--gold); }
    .crit { display: flex; flex-wrap: wrap; gap: 4px; }
    .crit .chip { font-size: 0.75rem; padding: 2px 8px; }
    .banner { border-radius: 8px; padding: 8px 12px; font-weight: bold; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .banner.win { background: rgba(255, 170, 0, 0.15); border: 1px solid var(--gold); color: var(--gold); }
    .banner.tie { background: rgba(255, 0, 85, 0.12); border: 1px solid var(--red); color: var(--red); }

    /* ===== 右カラム ===== */
    .timer-display { font-size: 3.4rem; font-family: monospace; color: var(--gold); text-shadow: 0 0 10px var(--gold-glow); line-height: 1; text-align: center; }
    .timer-display.low { color: var(--red); text-shadow: 0 0 14px var(--red-glow); }
    .timer-bar { height: 6px; background: rgba(255, 255, 255, 0.12); border-radius: 3px; overflow: hidden; }
    #timer-bar { height: 100%; width: 100%; background: var(--gold); transition: width 0.3s linear; }
    #timer-label { text-align: center; font-size: 0.85rem; color: var(--cyan); min-height: 1.2em; }
    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.88rem; }
    .setting-row input, .setting-row select { width: 100px; text-align: right; }
    .setting-row .wide-in { width: 140px; text-align: left; }
    #rng-result { font-size: 3rem; color: var(--gold); text-align: center; font-weight: bold; min-height: 1.2em; }
    .group-result { background: rgba(0, 0, 0, 0.6); border: 1px dashed var(--cyan); padding: 8px; font-size: 0.9rem; max-height: 220px; overflow-y: auto; border-radius: 6px; }

    /* ===== モーダル ===== */
    .modal-back { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); z-index: 2500; display: flex; align-items: center; justify-content: center; padding: 14px; }
    .modal { background: #160c26; border: 1px solid var(--gold); border-radius: 14px; padding: 18px; width: min(460px, 100%); max-height: 92vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 0 30px var(--gold-glow); }
    .modal.large { width: min(920px, 100%); height: 90vh; }
    .modal h3 { color: var(--gold); }
    .m-msg { line-height: 1.6; }
    .m-btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    .note-item { background: rgba(0, 0, 0, 0.45); border-left: 4px solid var(--gold); border-radius: 8px; padding: 9px 12px; display: flex; flex-direction: column; gap: 4px; }
    .note-item .ni-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
    .note-item .ni-sub { font-size: 0.8rem; color: var(--text-sub); }
    .note-item pre { white-space: pre-wrap; font-family: inherit; font-size: 0.88rem; color: var(--text-main); }
    .note-item.done { opacity: 0.6; }
    .notes-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; }
    .stars span { cursor: pointer; font-size: 1.4rem; color: var(--gold); }
    kbd { background: #333; border: 1px solid #666; border-radius: 4px; padding: 0 6px; font-family: monospace; font-size: 0.85em; }

    /* ===== 発表モード ===== */
    #presenter { position: fixed; inset: 0; z-index: 2000; background: radial-gradient(circle at center, #1a0d2c 0%, #05020a 100%); padding: 22px 30px; overflow-y: auto; display: none; flex-direction: column; gap: 18px; }
    #presenter.open { display: flex; }
    .pr-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

  <script>
    'use strict';
    // =====================================================
    // 0. ユーティリティ
    // =====================================================
    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const uid = () => Math.random().toString(36).slice(2, 9);
    const todayStr = () => new Date().toLocaleDateString('ja-JP');
    const monthKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    const prevMonthKey = () => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); return monthKey(d); };
    const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const clone = o => JSON.parse(JSON.stringify(o));

    const KEY = 'gakkyuV4';
    const memStore = {};
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch (e) { return memStore[k] == null ? null : memStore[k]; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) { memStore[k] = v; } }
    };

    function toast(msg, kind) {
      const el = document.createElement('div');
      el.className = 'toast ' + (kind || '');
      el.textContent = msg;
      $('toast-root').appendChild(el);
      setTimeout(() => el.remove(), 2600);
    }

    async function copyText(t) {
      t = String(t == null ? '' : t);
      try { await navigator.clipboard.writeText(t); }
      catch (e) {
        const ta = document.createElement('textarea');
        ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (_) { }
        ta.remove();
      }
      toast('📋 コピーしました');
    }

    function download(name, text, mime) {
      const b = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    }

    // ---- モーダル（prompt/confirm の代わり：埋め込み環境でも動く）
    function openModal(html, cls, onClose) {
      const back = document.createElement('div');
      back.className = 'modal-back';
      back.innerHTML = `<div class="modal ${cls || ''}" role="dialog">${html}</div>`;
      back._onClose = onClose || null;
      back.addEventListener('mousedown', e => { if (e.target === back) closeModal(back); });
      $('modal-root').appendChild(back);
      return back;
    }
    function closeModal(back) { if (!back || !back.parentNode) return; back.remove(); if (back._onClose) back._onClose(); }
    function topModal() { const m = $('modal-root').querySelectorAll('.modal-back'); return m.length ? m[m.length - 1] : null; }

    function askChoice(title, msg, buttons) {
      return new Promise(res => {
        let done = false;
        const fin = v => { if (done) return; done = true; res(v); };
        const b = openModal(`<h3>${esc(title)}</h3><p class="m-msg">${esc(msg).replace(/\n/g, '<br>')}</p><div class="m-btns">${buttons.map((l, i) => `<button class="btn ${i === 0 ? '' : 'btn-cyan'}" data-i="${i}">${esc(l)}</button>`).join('')}</div>`, '', () => fin(-1));
        b.querySelectorAll('[data-i]').forEach(btn => btn.onclick = () => { fin(+btn.dataset.i); b.remove(); });
      });
    }
    async function askConfirm(msg, ok) { return (await askChoice('かくにん', msg, [ok || 'はい', 'キャンセル'])) === 0; }

    function askText(title, def, multi) {
      return new Promise(res => {
        let done = false;
        const fin = v => { if (done) return; done = true; res(v); };
        const b = openModal(`<h3>${esc(title)}</h3>${multi ? `<textarea id="ask-in" rows="6">${esc(def || '')}</textarea>` : `<input type="text" id="ask-in" value="${esc(def || '')}">`}<div class="m-btns"><button class="btn" id="ask-ok">OK</button><button class="btn btn-cyan" id="ask-cancel">キャンセル</button></div>`, '', () => fin(null));
        const inp = b.querySelector('#ask-in');
        setTimeout(() => { inp.focus(); if (inp.select) inp.select(); }, 30);
        b.querySelector('#ask-ok').onclick = () => { fin(inp.value); b.remove(); };
        b.querySelector('#ask-cancel').onclick = () => { fin(null); b.remove(); };
        inp.addEventListener('keydown', e => { if (e.key === 'Enter' && (!multi || e.ctrlKey)) { e.preventDefault(); fin(inp.value); b.remove(); } });
      });
    }

    // ---- 音
    let actx;
    function ac() {
      if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; actx = new C(); }
      if (actx.state === 'suspended') actx.resume();
      return actx;
    }
    function tone(freq, dur, vol, delay) {
      const c = ac(); if (!c) return;
      const t = c.currentTime + (delay || 0);
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.15, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + (dur || 0.15));
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + (dur || 0.15));
    }
    const playBeep = () => tone(880, 0.12, 0.1);
    const playChime = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.9, 0.18, i * 0.28));
    const playFanfare = () => [523.25, 659.25, 783.99, 659.25, 1046.5].forEach((f, i) => tone(f, 0.35, 0.16, i * 0.14));

    let cueT;
    function showCue(text, sound) {
      const el = $('cue-overlay');
      el.textContent = text; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
      clearTimeout(cueT); cueT = setTimeout(() => el.classList.remove('show'), 2200);
      if (sound === 'chime') playChime(); else if (sound === 'beep') playBeep(); else if (sound === 'fanfare') playFanfare();
    }
    function triggerFlare() {
      const o = $('alert-overlay'); o.classList.add('flash-anim'); playBeep();
      setTimeout(() => o.classList.remove('flash-anim'), 2000);
    }

    // =====================================================
    // 1. 定数：議題の種類・手順テンプレート・ことば
    // =====================================================
    const TYPES = {
      rule: { label: 'クラスのきまり', icon: '📏', color: 'var(--cyan)', desc: '生活のきまり・ルールを決める', criteria: ['守れる', '具体的', 'みんなのため', '続けられる'] },
      goal: { label: '今月のめあて', icon: '🎯', color: 'var(--gold)', desc: '月のめあてを決める・ふりかえる', criteria: ['具体的', '毎日できる', 'みんなでできる', '成長につながる'] },
      rec: { label: '学級レク', icon: '🎉', color: 'var(--pink)', desc: 'レクの内容・ルール・役割を決める', criteria: ['安全', '全員参加', '時間内', '道具がある', 'ルールがわかる'] },
      free: { label: '自由な話し合い', icon: '💬', color: 'var(--green)', desc: 'そのほか、なんでも話し合う', criteria: [] }
    };
    const TAGS = {
      idea: { icon: '💡', label: 'アイデア' }, agree: { icon: '👍', label: '賛成' }, disagree: { icon: '👎', label: '反対' },
      question: { icon: '❓', label: '質問' }, worry: { icon: '😟', label: '心配' }
    };
    const TOOLS = { none: '（なし）', opinions: '意見ボード', vote: '案と投票', decision: '決定', minutes: '議事録・ふりかえり' };
    const TOOL_TAB = { opinions: 'opinions', vote: 'vote', decision: 'decision', minutes: 'minutes' };

    const S1 = { title: 'はじめの言葉', tool: 'none', min: 0, text: '「これから、第{{回}}[回|かい] 学級会を始めます。今日の議題は『{{議題}}』です。」', guide: '司会は{{司会}}さん、副司会は{{副司会}}さん、書記は{{書記}}さんです。' };
    const SQ = { title: '質問タイム', tool: 'none', min: 2, text: '「今の提案について、わからないことや、くわしく聞きたいことはありますか？」', guide: '質問は「意見」ではなく、わからないことを聞く時間だよ。' };
    const SV = { title: '多数決', tool: 'vote', min: 0, text: '「それでは、決を採ります。みなさん、机に伏せてください。」\n「〇〇の案によいと思う人は、手をあげてください。」', guide: '「案と投票」タブでカウント！ 同数のときは決選投票かくじ。' };
    const SE = { title: 'ふりかえり・終わり', tool: 'minutes', min: 0, text: '「今日の話し合いで、よかったことや、次にがんばることはありますか？」\n「これで、第{{回}}[回|かい] 学級会を終わります。」', guide: 'ふりかえりは「議事録」タブに書いておくと、あとで見返せるよ。' };

    const TPL = {
      free: [
        S1,

    let DICT_RE, DICT_MAP;
    function buildDict() {
      DICT_MAP = {}; const keys = [];
      RUBY_DICT.forEach(e => {
        const key = e.replace(/\{[^}]*\}/g, '');
        DICT_MAP[key] = e.replace(/([一-龠々〆]+)\{([^}]*)\}/g, (m, k, r) => `<ruby>${k}<rt>${r}</rt></ruby>`);
        keys.push(key);
      });
      keys.sort((a, b) => b.length - a.length);
      DICT_RE = new RegExp(keys.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'g');
    }
    function dictRb(t) { return t ? esc(t).replace(DICT_RE, m => DICT_MAP[m]) : ''; }
    function rbPlain(t) {
      let out = '', last = 0, m; const re = /\[([^\[\]|]+)\|([^\[\]]+)\]/g;
      while ((m = re.exec(t))) { out += dictRb(t.slice(last, m.index)) + `<ruby>${esc(m[1])}<rt>${esc(m[2])}</rt></ruby>`; last = m.index + m[0].length; }
      return out + dictRb(t.slice(last));
    }
    // {{議題}} などを差し込み、ふりがなを付けたHTMLを返す
    function rb(text, a) {
      if (text == null) return '';
      const c = ctx(a === undefined ? cur() : a);
      const phs = [];
      const t = String(text).replace(/\{\{([^}]+)\}\}/g, (m, k) => {
        const v = String(c[k.trim()] == null ? '' : c[k.trim()]).trim();
        phs.push({ v, empty: !v });
        return '\u0001' + (phs.length - 1) + '\u0002';
      });
      return rbPlain(t)
        .replace(/\u0001(\d+)\u0002/g, (m, i) => { const p = phs[+i]; return `<span class="ph${p.empty ? ' empty' : ''}">${p.empty ? '〇〇' : rbPlain(p.v)}</span>`; })
        .replace(/\n/g, '<br>');
    }
    function plain(text, a) { // 文章としてのテキスト（議事録用）
      const c = ctx(a === undefined ? cur() : a);
      return String(text || '').replace(/\{\{([^}]+)\}\}/g, (m, k) => c[k.trim()] || '〇〇').replace(/\[([^\[\]|]+)\|([^\[\]]+)\]/g, '$1');

      const inp = $('class-goal'); if (document.activeElement !== inp) { const g = getGoal(monthKey()); inp.value = g ? g.text : ''; }

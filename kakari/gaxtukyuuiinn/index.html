      $('prev-goal').innerHTML = pg && pg.text ? `先月：${esc(pg.text)} <span style="color:var(--gold)">${'★'.repeat(pg.rating || 0)}${'☆'.repeat(5 - (pg.rating || 0))}</span>` : '';
    }

    // =====================================================
    // 4. 議題（アジェンダ）
    // =====================================================
    function cloneSteps(type) { return (S.customTemplates[type] || TPL[type]).map(s => ({ ...s, id: uid() })); }
    function newAgenda(type, title) {
      return {
        id: uid(), type, title: title || '', proposer: '', reason: '', status: 'todo', stepIdx: 0, steps: cloneSteps(type),
        opinions: [], options: [], criteria: TYPES[type].criteria.slice(), oneVote: true, round: 1,
        decision: '', detail: '', when: '', setGoal: true, memo: '', reflect: '', minutesText: '', regId: null, created: Date.now()
      };
    }
    function addAgenda() {
      const title = $('ag-title').value.trim();
      const a = newAgenda($('ag-type').value, title);
      S.agendas.push(a); $('ag-title').value = '';
      updateExp(5);
      selectAgenda(a.id);
    }
    function quickStart(type) {
      const a = newAgenda(type, ''); S.agendas.push(a); selectAgenda(a.id);
      setTimeout(() => { const t = $('m-title'); if (t) t.focus(); }, 50);
    }
    function selectAgenda(id) {
      S.curId = id; const a = cur();
      if (a && a.status === 'todo') a.status = 'doing';
      renderAgendaList(); buildMeeting(); touch();
    }
    function moveAgenda(i, d) {
      const j = i + d; if (j < 0 || j >= S.agendas.length) return;
      [S.agendas[i], S.agendas[j]] = [S.agendas[j], S.agendas[i]]; renderAgendaList(); save();
    }
    async function deleteAgenda(id) {
      const a = S.agendas.find(x => x.id === id); if (!a) return;
      if (!(await askConfirm(`議題「${a.title || '（未入力）'}」を消しますか？\n（出た意見や投票もいっしょに消えます）`, '消す'))) return;
      S.agendas = S.agendas.filter(x => x.id !== id);
      if (S.curId === id) S.curId = S.agendas.length ? S.agendas[0].id : null;
      renderAgendaList(); buildMeeting(); touch();
    }
    function renderAgendaList() {
      const box = $('agenda-list');
      if (!S.agendas.length) { box.innerHTML = '<div class="empty">議題がありません。上から追加するか、中央の「はじめる」から種類を選んでね。</div>'; return; }
      box.innerHTML = S.agendas.map((a, i) => `<div class="ag-item ${a.id === S.curId ? 'cur' : ''} st-${a.status}" onclick="selectAgenda('${a.id}')" style="border-left-color:${a.status === 'done' ? 'var(--green)' : TYPES[a.type].color}">
        <span>${TYPES[a.type].icon}</span><span class="ag-title">${esc(a.title || '（議題未入力）')}</span>
        <span class="ag-st">${{ todo: '○', doing: '▶', done: '✔' }[a.status]}</span>
        <span class="ag-btns"><button class="mini" onclick="event.stopPropagation();moveAgenda(${i},-1)">▲</button><button class="mini" onclick="event.stopPropagation();moveAgenda(${i},1)">▼</button><button class="mini red" onclick="event.stopPropagation();deleteAgenda('${a.id}')">✖</button></span></div>`).join('');
    }

    // =====================================================
    // 5. 学級会コア（中央）
    // =====================================================
    let editMode = false, workTab = 'opinions', opFilter = 'all', phraseCat = 0, sayText = '';

    function startHtml() {
      return `<div class="panel" id="meeting-core-panel">
        <div class="panel-header"><span>🎙️ <span data-rb="学級会"></span>コア</span></div>
        <div class="hint">話し合う内容をえらぶと、それに合った進め方（手順）が出ます。手順は、いつでも自由に書きかえ・入れかえできます。</div>
        <div class="start-grid">${Object.entries(TYPES).map(([k, t]) => `<button class="start-card" style="--c:${t.color}" onclick="quickStart('${k}')"><span class="ico">${t.icon}</span><span class="nm">${rb(t.label, null)}</span><span class="ds">${rb(t.desc, null)}</span></button>`).join('')}</div>
        <div class="hint">※ 議題の名前は、はじめてから入力してもOKです。左の「議題リスト」に先に並べておくこともできます。</div>
      </div>`;
    }

    function buildMeeting() {
      const a = cur(), root = $('meeting-root');
      if (!a) { root.innerHTML = startHtml(); applyStaticRuby(); return; }
      workTab = S.workTab || 'opinions';
      root.innerHTML = `<div class="panel" id="meeting-core-panel">
        <div class="panel-header"><span>🎙️ <span data-rb="学級会"></span>コア</span>
          <div class="hdr-btns"><button class="btn btn-cyan sm" onclick="togglePresenter()">📺 発表モード</button><button class="btn sm" id="btn-edit" onclick="toggleEdit()">✏️ 手順を編集</button><button class="btn btn-green sm" onclick="openNotes('rule')">📒 ノート</button></div></div>
        <div class="ag-head">
          <div class="row">
            <select id="m-type" onchange="changeType(this.value)">${Object.entries(TYPES).map(([k, t]) => `<option value="${k}">${t.icon} ${t.label}</option>`).join('')}</select>
            <input type="text" id="m-title" class="grow" placeholder="議題を入力（例：給食のならび方について）" oninput="onTitle(this.value)">
            <select id="m-status" onchange="onStatus(this.value)"><option value="todo">まだ</option><option value="doing">話し合い中</option><option value="done">おわり</option></select>
          </div>
          <div class="row wrap">
            <label class="row">提案者 <input type="text" id="m-proposer" style="width:120px" oninput="onProposer(this.value)"></label>
            <label class="row grow">提案理由 <input type="text" id="m-reason" oninput="cur().reason=this.value;save()" placeholder="なぜ話し合いたいか"></label>
          </div>
        </div>
        <div class="stepper" id="m-stepper"></div>
        <div class="step-card" id="m-step"></div>
        <div id="m-editor"></div>
        <details class="phrase-bank" id="m-phrase" open></details>
        <div class="work-tabs" id="w-tabs"></div>

        <div class="work-pane" id="w-opinions">
          <div class="op-input">
            <select id="op-tag">${Object.entries(TAGS).map(([k, t]) => `<option value="${k}">${t.icon} ${t.label}</option>`).join('')}</select>
            <input type="text" id="op-text" placeholder="出た意見をサッと入力して Enter" onkeydown="if(event.key==='Enter')addOpinion()">
            <input type="text" id="op-who" placeholder="だれ（番号/名前）" onkeydown="if(event.key==='Enter')addOpinion()">
            <button class="btn" onclick="addOpinion()">追加</button>
          </div>
          <div class="chips" id="op-filter" style="margin-top:0"></div>
          <div id="op-list"></div>
        </div>

        <div class="work-pane" id="w-vote">
          <div class="vote-top">
            <button class="btn" onclick="addOption()">+ 案を追加</button>
            <button class="btn btn-cyan sm" onclick="resetAllVotes()">票を0にもどす</button>
            <button class="btn btn-cyan sm" onclick="saveVoteToHistory()">💾 履歴に保存</button>
            <label class="row"><input type="checkbox" id="v-onevote" onchange="cur().oneVote=this.checked;save();renderVotes()"> 1人1票</label>
          </div>
          <div class="vote-summary" id="v-summary"></div>
          <div class="crit-edit row wrap" id="v-crit"></div>
          <div id="v-banner"></div>
          <div class="vote-container" id="v-cards"></div>
        </div>

        <div class="work-pane" id="w-decision">
          <label>📌 決まったこと（ひと言で）</label>
          <textarea id="m-decision" rows="2" placeholder="例：給食は、時間までに静かに並ぶ。" oninput="onDecision(this.value)"></textarea>
          <label>くわしい内容（役割・ルール・持ち物・期限など）</label>
          <textarea id="m-detail" rows="3" placeholder="例：係は〇〇さんと△△さん。持ち物：ボール。ルール：…" oninput="cur().detail=this.value;save()"></textarea>
          <div class="row wrap">
            <label class="row">実施日・期限 <input type="date" id="m-when" style="width:auto" onchange="cur().when=this.value;save()"></label>
            <label class="row" id="m-setgoal-wrap"><input type="checkbox" id="m-setgoal" onchange="cur().setGoal=this.checked;save()"> 今月のめあてにも設定する</label>
          </div>
          <div class="row wrap"><button class="btn btn-green big" onclick="registerDecision()">✅ 決定ノートに登録する</button><span class="hint" id="reg-state"></span></div>
        </div>

        <div class="work-pane" id="w-minutes">
          <label>🗣️ ふりかえり（よかったこと・次にがんばること）</label>
          <textarea id="m-reflect" rows="3" oninput="cur().reflect=this.value;save()"></textarea>
          <label>✍️ 書記メモ（決定事項・細かいルールなど）</label>
          <textarea id="m-memo" rows="3" placeholder="決定事項や細かいルールをしっかり記録しよう..." oninput="cur().memo=this.value;save()"></textarea>
          <div class="row wrap"><button class="btn btn-cyan" onclick="makeMinutes()">📄 議事録を自動作成</button><button class="btn sm" onclick="copyText($('m-minutes').value)">コピー</button><button class="btn sm" onclick="downloadMinutes()">⬇ 保存(.txt)</button><button class="btn btn-green sm" onclick="storeMinutes(true)">📥 ノートに保存</button></div>
          <textarea id="m-minutes" rows="12" placeholder="「議事録を自動作成」を押すと、ここに今日の話し合いがまとまります。自由に直せます。" oninput="cur().minutesText=this.value;save()"></textarea>
        </div>
      </div>`;
      $('m-type').value = a.type; $('m-title').value = a.title; $('m-status').value = a.status;
      $('m-proposer').value = a.proposer; $('m-reason').value = a.reason;
      $('v-onevote').checked = a.oneVote;
      $('m-decision').value = a.decision; $('m-detail').value = a.detail; $('m-when').value = a.when || '';
      $('m-setgoal').checked = a.setGoal; $('m-setgoal-wrap').style.display = a.type === 'goal' ? '' : 'none';
      $('m-reflect').value = a.reflect; $('m-memo').value = a.memo; $('m-minutes').value = a.minutesText;
      editMode = false; sayText = '';
      applyStaticRuby();
      renderStepper(); renderStep(); renderEditor(); renderPhrases(); renderOpinions(); renderVotes(); renderRegState(); showTab(workTab);
    }

    // ---- ヘッダー入力
    function onTitle(v) { const a = cur(); a.title = v; renderAgendaList(); renderStep(); touch(); }
    function onProposer(v) { cur().proposer = v; renderStep(); touch(); }
    function onStatus(v) { cur().status = v; renderAgendaList(); save(); }
    function onDecision(v) { cur().decision = v; renderStep(); touch(); }
    async function changeType(t) {
      const a = cur(); if (t === a.type) return;
      const c = await askChoice('種類をかえる', `「${TYPES[t].label}」に変えます。\n進め方（手順）も入れかえますか？`, ['手順も入れかえる', '種類だけ変える', 'やめる']);
      if (c === 0 || c === 1) {
        const oldDef = TYPES[a.type].criteria;
        if (JSON.stringify(a.criteria) === JSON.stringify(oldDef)) a.criteria = TYPES[t].criteria.slice();
        a.type = t;
        if (c === 0) { a.steps = cloneSteps(t); a.stepIdx = 0; }
        renderAgendaList(); buildMeeting(); touch();
      } else $('m-type').value = a.type;
    }

    // ---- ステップ
    function renderStepper() {
      const a = cur(); if (!a) return; const box = $('m-stepper');
      box.innerHTML = a.steps.map((s, i) => `<button class="pill ${i === a.stepIdx ? 'on' : ''} ${i < a.stepIdx ? 'past' : ''}" onclick="goStep(${i})">${i < a.stepIdx ? '✔' : i + 1}. ${rb(s.title, a)}</button>`).join('');
      const on = box.querySelector('.pill.on');
      if (on) box.scrollLeft = on.offsetLeft - box.clientWidth / 2 + on.clientWidth / 2;
    }
    function renderStep() {
      const a = cur(); if (!a) return; const s = a.steps[a.stepIdx]; const box = $('m-step');
      if (!s) { box.innerHTML = '<div class="empty">手順がありません。「手順を編集」から追加できます。</div>'; return; }
      const last = a.stepIdx >= a.steps.length - 1;
      box.style.setProperty('--tc', TYPES[a.type].color);
      box.innerHTML = `<div class="step-top"><span class="step-no">${a.stepIdx + 1} / ${a.steps.length}</span><div class="script-speaker">${rb(s.title, a)}</div>
          ${s.min ? `<button class="btn btn-cyan sm" onclick="startStepTimer()">⏱ ${s.min}分タイマー</button>` : ''}
          ${s.tool && s.tool !== 'none' ? `<button class="btn sm" onclick="showTab('${TOOL_TAB[s.tool]}')">→ ${TOOLS[s.tool]}</button>` : ''}</div>
        <div class="step-text">${rb(s.text, a)}</div>
        ${s.guide ? `<div class="script-guide">💡 ${rb(s.guide, a)}</div>` : ''}
        ${sayText ? `<div class="say-box"><div><span class="lbl">📢 いま言うこと</span>${rb(sayText, a)}</div><div class="row"><button class="mini" onclick="copyText(plain(sayText))">コピー</button><button class="mini red" onclick="saySelect('')">✖</button></div></div>` : ''}
        <div class="step-nav"><button class="btn" onclick="prevStep()" ${a.stepIdx === 0 ? 'disabled style="opacity:.4"' : ''}>◀ 前へ</button>
          <button class="btn btn-green big" onclick="nextStep()">${last ? '✅ 話し合いをおわる' : '次へ ▶'}</button></div>`;
    }
    function goStep(i) {
      const a = cur(); if (!a || i < 0 || i >= a.steps.length) return;
      const fwd = i > a.stepIdx; a.stepIdx = i;
      const s = a.steps[i];
      if (TOOL_TAB[s.tool]) showTab(TOOL_TAB[s.tool]);
      if (s.min && !T.running) setTimer(s.min * 60, s.title);
      if (fwd) updateExp(2);
      renderStepper(); renderStep(); if (editMode) renderEditor(); touch();
    }
    const prevStep = () => goStep(cur().stepIdx - 1);
    function nextStep() {
      const a = cur(); if (!a) return;
      if (a.stepIdx < a.steps.length - 1) return goStep(a.stepIdx + 1);
      finishAgenda();
    }
    function finishAgenda() {
      const a = cur(); a.status = 'done'; storeMinutes(false); updateExp(10); playFanfare();
      const next = S.agendas.find(x => x.status !== 'done');
      toast('🎉 おつかれさま！ 話し合いが終わりました');
      renderAgendaList(); $('m-status').value = 'done'; touch();
      if (next) toast('次の議題：' + (next.title || '（未入力）') + '（左のリストから選べます）', 'warn');
    }
    function startStepTimer() {
      const a = cur(), s = a.steps[a.stepIdx]; if (!s || !s.min) return;
      setTimer(s.min * 60, s.title); startTimer();
    }

    // ---- 手順の編集
    function toggleEdit() { editMode = !editMode; $('btn-edit').textContent = editMode ? '✏️ 編集をとじる' : '✏️ 手順を編集'; renderEditor(); }
    function renderEditor() {
      const box = $('m-editor'); if (!box) return;
      if (!editMode) { box.innerHTML = ''; return; }
      const a = cur();
      box.innerHTML = `<div class="editor">
        <div class="hint">✏️ 進める手順を自由に書きかえできます。<b>{{議題}} {{提案者}} {{司会}} {{副司会}} {{書記}} {{決定}} {{今月のめあて}} {{先月のめあて}}</b> は自動で入ります。ふりがなは <b>[漢字|かんじ]</b> と書くと付きます。</div>
        ${a.steps.map((s, i) => `<div class="ed-step ${i === a.stepIdx ? 'cur' : ''}">
          <div class="ed-row"><b>${i + 1}</b>
            <input type="text" class="grow" value="${esc(s.title)}" oninput="edStep(${i},'title',this.value)" placeholder="手順の名前">
            <select onchange="edStep(${i},'tool',this.value)">${Object.entries(TOOLS).map(([k, v]) => `<option value="${k}" ${s.tool === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
            <label class="row">⏱<input type="number" class="num" min="0" value="${s.min || 0}" onchange="edStep(${i},'min',+this.value)">分</label>
            <button class="mini" onclick="moveStep(${i},-1)">▲</button><button class="mini" onclick="moveStep(${i},1)">▼</button><button class="mini" onclick="goStep(${i})">ここへ</button><button class="mini red" onclick="delStep(${i})">✖</button></div>
          <textarea rows="2" oninput="edStep(${i},'text',this.value)" placeholder="司会が読む言葉">${esc(s.text)}</textarea>
          <input type="text" value="${esc(s.guide || '')}" placeholder="💡 司会へのメモ（任意）" oninput="edStep(${i},'guide',this.value)">
        </div>`).join('')}
        <div class="ed-actions"><button class="btn sm" onclick="addStep()">＋ 手順を追加</button>
          <button class="btn btn-cyan sm" onclick="saveTemplate()">💾 この手順を「${esc(TYPES[a.type].label)}」の基本にする</button>
          <button class="btn btn-red sm" onclick="resetSteps()">↩ はじめの手順にもどす</button></div></div>`;
    }
    function edStep(i, f, v) {
      const a = cur(); a.steps[i][f] = v;
      if (f === 'title') renderStepper();
      if (f === 'tool' || f === 'min' || f === 'text' || f === 'guide' || f === 'title') { if (i === a.stepIdx) renderStep(); }
      touch();
    }
    function moveStep(i, d) {
      const a = cur(), j = i + d; if (j < 0 || j >= a.steps.length) return;
      [a.steps[i], a.steps[j]] = [a.steps[j], a.steps[i]];
      if (a.stepIdx === i) a.stepIdx = j; else if (a.stepIdx === j) a.stepIdx = i;
      renderStepper(); renderStep(); renderEditor(); touch();
    }
    async function delStep(i) {
      const a = cur(); if (a.steps.length <= 1) return toast('手順は1つ以上必要です', 'warn');
      if (!(await askConfirm(`手順「${a.steps[i].title}」を消しますか？`, '消す'))) return;
      a.steps.splice(i, 1); if (a.stepIdx >= a.steps.length) a.stepIdx = a.steps.length - 1;
      renderStepper(); renderStep(); renderEditor(); touch();
    }
    function addStep() {
      const a = cur(); const at = a.stepIdx + 1;
      a.steps.splice(at, 0, { id: uid(), title: '新しい手順', text: '', guide: '', tool: 'none', min: 0 });
      a.stepIdx = at; renderStepper(); renderStep(); renderEditor(); touch();
    }
    function saveTemplate() {
      const a = cur(); S.customTemplates[a.type] = a.steps.map(s => { const c = { ...s }; delete c.id; return c; });
      save(); toast(`✅ 次から「${TYPES[a.type].label}」はこの手順で始まります`);
    }
    async function resetSteps() {
      const a = cur();
      if (!(await askConfirm('この議題の手順を、はじめの手順にもどしますか？', 'もどす'))) return;
      a.steps = TPL[a.type].map(s => ({ ...s, id: uid() })); a.stepIdx = 0;
      renderStepper(); renderStep(); renderEditor(); touch();
    }

    // ---- ことばバンク
    function phraseCats(a) {
      const cats = PHRASES_BASE.map(c => ({ name: c.name, list: c.list }));
      if (PHRASES_TYPE[a.type]) cats.unshift({ name: TYPES[a.type].label + '向け', list: PHRASES_TYPE[a.type] });
      cats.push({ name: '自分の言葉', list: S.customPhrases, custom: true });
      return cats;
    }
    function renderPhrases() {
      const a = cur(); const box = $('m-phrase'); if (!a || !box) return;
      const cats = phraseCats(a); if (phraseCat >= cats.length) phraseCat = 0;
      const c = cats[phraseCat];
      box.innerHTML = `<summary>💬 司会のことばバンク <span class="hint">（タップすると「いま言うこと」に大きく出ます）</span></summary>
        <div class="chips">${cats.map((x, i) => `<button class="chip ${i === phraseCat ? 'on' : ''}" onclick="setPhraseCat(${i})">${esc(x.name)}</button>`).join('')}</div>
        <div class="chips">${c.list.map((p, i) => `<button class="chip say" onclick="saySelect(phraseCats(cur())[${phraseCat}].list[${i}])">${rb(p, a)}</button>${c.custom ? `<button class="mini red" onclick="delPhrase(${i})">✖</button>` : ''}`).join('')}
          ${c.custom ? `<button class="chip" onclick="addPhrase()">＋ 言葉を追加</button>` : ''}</div>
        ${c.custom && !c.list.length ? '<div class="hint">よく使う言葉を登録しておけます。</div>' : ''}`;
    }
    function setPhraseCat(i) { phraseCat = i; renderPhrases(); }
    function saySelect(t) { sayText = t; renderStep(); if (presenterOpen) renderPresenter(); }
    async function addPhrase() {
      const t = await askText('登録する言葉（{{議題}} なども使えます）', ''); if (!t || !t.trim()) return;
      S.customPhrases.push(t.trim()); save(); renderPhrases();
    }
    function delPhrase(i) { S.customPhrases.splice(i, 1); save(); renderPhrases(); }

    // ---- 作業タブ
    function renderWorkTabs() {
      const a = cur(); const box = $('w-tabs'); if (!a || !box) return;
      const tabs = [['opinions', '💭 意見', a.opinions.length], ['vote', '📊 案と投票', a.options.length], ['decision', '✅ 決定', a.regId ? '✔' : 0], ['minutes', '📝 議事録', 0]];
      box.innerHTML = tabs.map(([k, l, n]) => `<button class="wtab ${workTab === k ? 'on' : ''}" onclick="showTab('${k}')">${l}${n ? `<span class="bd">${n}</span>` : ''}</button>`).join('');
    }
    function showTab(k) {
      workTab = k; S.workTab = k;
      ['opinions', 'vote', 'decision', 'minutes'].forEach(t => { const e = $('w-' + t); if (e) e.classList.toggle('on', t === k); });
      renderWorkTabs(); save();
    }

    // ---- 意見ボード
    function addOpinion() {
      const a = cur(), t = $('op-text'), text = t.value.trim(); if (!text) return;
      const tag = $('op-tag').value; S.lastTag = tag;
      a.opinions.push({ id: uid(), text, who: $('op-who').value.trim(), tag, star: false, plus: 0 });
      t.value = ''; $('op-who').value = ''; t.focus();
      renderOpinions(); touch(); updateExp(1);
    }
    function setOpFilter(k) { opFilter = k; renderOpinions(); }
    function renderOpinions() {
      const a = cur(); if (!a || !$('op-list')) return;
      if ($('op-tag').dataset.init !== a.id) { $('op-tag').value = S.lastTag || 'idea'; $('op-tag').dataset.init = a.id; }
      const cnt = {}; a.opinions.forEach(o => cnt[o.tag] = (cnt[o.tag] || 0) + 1);
      $('op-filter').innerHTML = [['all', 'すべて', a.opinions.length], ...Object.entries(TAGS).map(([k, t]) => [k, t.icon + t.label, cnt[k] || 0])]
        .map(([k, l, n]) => `<button class="chip ${opFilter === k ? 'on' : ''}" onclick="setOpFilter('${k}')">${l} ${n}</button>`).join('');
      const list = a.opinions.filter(o => opFilter === 'all' || o.tag === opFilter).slice().reverse();
      $('op-list').innerHTML = list.length ? list.map(o => `<div class="op-item tag-${o.tag} ${o.star ? 'star' : ''}">
        <span>${TAGS[o.tag].icon}</span>
        <div class="op-text">${esc(o.text)} ${o.who ? `<span class="op-who">（${esc(o.who)}）</span>` : ''} ${o.plus ? `<span class="op-who">👥+${o.plus}</span>` : ''}</div>
        <div class="op-btns"><button class="mini ${o.star ? 'on' : ''}" onclick="opAct('${o.id}','star')" title="注目">★</button><button class="mini" onclick="opAct('${o.id}','plus')" title="同じ意見">👥+1</button><button class="mini" onclick="opAct('${o.id}','toOpt')" title="投票の案にする">→案</button><button class="mini" onclick="opAct('${o.id}','edit')">✎</button><button class="mini red" onclick="opAct('${o.id}','del')">✖</button></div></div>`).join('')
        : '<div class="empty">まだ意見がありません。上の入力欄に、出た意見をどんどん入れよう。</div>';
    }
    async function opAct(id, act) {
      const a = cur(), o = a.opinions.find(x => x.id === id); if (!o) return;
      if (act === 'star') o.star = !o.star;
      else if (act === 'plus') o.plus = (o.plus || 0) + 1;
      else if (act === 'del') a.opinions = a.opinions.filter(x => x !== o);
      else if (act === 'toOpt') { addOption(o.text, '', true); toast('📊 「案と投票」に追加しました'); }
      else if (act === 'edit') { const t = await askText('意見をなおす', o.text); if (t && t.trim()) o.text = t.trim(); }
      renderOpinions(); touch();
    }

    // ---- 案と投票
    function leaders(a) {
      if (!a || !a.options.length) return [];
      const mx = Math.max(...a.options.map(o => o.count));
      return mx > 0 ? a.options.filter(o => o.count === mx) : [];
    }
    function addOption(name, memo, silent) {
      const a = cur(); if (!a) return;
      a.options.push({ id: uid(), name: name || `案${a.options.length + 1}`, memo: memo || '', count: 0, checks: [] });
      renderVotes(); touch();
      if (!silent) setTimeout(() => { const els = document.querySelectorAll('.vote-title-input'); if (els.length) els[els.length - 1].focus(); }, 30);
    }
    function removeOption(id) { const a = cur(); a.options = a.options.filter(o => o.id !== id); renderVotes(); touch(); }
    function updateOpt(id, f, v) { const o = cur().options.find(x => x.id === id); if (o) { o[f] = v; save(); if (presenterOpen) renderPresenter(); } }
    function changeVote(id, d) { const o = cur().options.find(x => x.id === id); if (o) { o.count = Math.max(0, o.count + d); renderVotes(); touch(); } }
    function setVote(id, v) { const o = cur().options.find(x => x.id === id); if (o) { o.count = Math.max(0, parseInt(v) || 0); renderVotes(); touch(); } }
    function toggleCheck(id, c) {
      const o = cur().options.find(x => x.id === id); if (!o) return;
      const i = o.checks.indexOf(c); if (i >= 0) o.checks.splice(i, 1); else o.checks.push(c);
      renderVotes(); touch();
    }
    async function resetAllVotes() {
      const a = cur(); if (!a.options.length) return;
      if (await askConfirm('すべての票を0にもどしますか？', 'もどす')) { a.options.forEach(o => o.count = 0); renderVotes(); touch(); }
    }
    function addCrit() { const i = $('crit-in'); const v = i.value.trim(); if (!v) return; const a = cur(); if (!a.criteria.includes(v)) a.criteria.push(v); renderVotes(); touch(); setTimeout(() => $('crit-in') && $('crit-in').focus(), 20); }
    function delCrit(i) { const a = cur(); const c = a.criteria[i]; a.criteria.splice(i, 1); a.options.forEach(o => o.checks = o.checks.filter(x => x !== c)); renderVotes(); touch(); }

    function renderVotes() {
      const a = cur(); if (!a || !$('v-cards')) return;
      const total = a.options.reduce((s, o) => s + o.count, 0), head = S.headcount;
      let note = '';
      if (a.oneVote && head > 0 && total > head) note = `<span class="warn">⚠ 合計が点呼人数(${head}人)より多いです</span>`;
      else if (a.oneVote && head > 0 && total > 0 && total < head) note = `<span>あと${head - total}人分（白票・保留？）</span>`;
      $('v-summary').innerHTML = `<span>投票の合計：<b style="color:var(--gold)">${total}</b>票</span><span>点呼：${head}人</span><span>${a.round > 1 ? `🔁 ${a.round}回目の投票` : ''}</span>${note}`;
      $('v-crit').innerHTML = `<span class="hint">確かめる観点：</span>${a.criteria.map((c, i) => `<span class="chip">${esc(c)} <b style="cursor:pointer;color:var(--red)" onclick="delCrit(${i})">×</b></span>`).join('')}<input type="text" id="crit-in" placeholder="観点を追加" style="width:130px" onkeydown="if(event.key==='Enter')addCrit()"><button class="mini" onclick="addCrit()">＋</button>`;
      const ld = leaders(a), ids = new Set(ld.map(o => o.id));
      let banner = '';
      if (ld.length > 1) banner = `<div class="banner tie">⚖ 同数です！（${ld.map(o => esc(o.name)).join(' / ')}）<button class="btn btn-red sm" onclick="runoff()">🔁 決選投票</button><button class="btn btn-cyan sm" onclick="drawLots()">🎲 くじで決める</button></div>`;
      else if (ld.length === 1) banner = `<div class="banner win">👑 いちばん多い案：${esc(ld[0].name)}（${ld[0].count}票）<button class="btn btn-green sm" onclick="decideOption('${ld[0].id}')">この案に決定</button></div>`;
      $('v-banner').innerHTML = banner;
      const sorted = a.options.slice().sort((x, y) => y.count - x.count);
      $('v-cards').innerHTML = a.options.length ? a.options.map(o => {
        const pct = total ? Math.round(o.count / total * 100) : 0;
        const rank = total ? sorted.findIndex(x => x.count === o.count) + 1 : 0;
        return `<div class="vote-card ${ids.has(o.id) ? 'lead' : ''}" id="vc-${o.id}">
          ${rank ? `<span class="rank">${rank}位</span>` : ''}<button class="del-vote-btn" onclick="removeOption('${o.id}')">×</button>
          <textarea class="vote-title-input" onchange="updateOpt('${o.id}','name',this.value)" oninput="updateOpt('${o.id}','name',this.value)" placeholder="案の名前">${esc(o.name)}</textarea>
          <textarea class="vote-memo" oninput="updateOpt('${o.id}','memo',this.value)" placeholder="内容メモ（ルール・理由など）">${esc(o.memo)}</textarea>
          ${a.criteria.length ? `<div class="crit">${a.criteria.map(c => `<button class="chip ${o.checks.includes(c) ? 'on' : ''}" onclick="toggleCheck('${o.id}',${JSON.stringify(c).replace(/"/g, '&quot;')})">${o.checks.includes(c) ? '✔' : '○'} ${esc(c)}</button>`).join('')}</div>` : ''}
          <div class="vote-count-row"><button class="btn" onclick="changeVote('${o.id}',-1)">－</button><input type="number" min="0" value="${o.count}" onchange="setVote('${o.id}',this.value)"><button class="btn" onclick="changeVote('${o.id}',1)">＋</button></div>
          <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div><div class="hint" style="text-align:center">${pct}%${a.criteria.length ? `　観点 ${o.checks.length}/${a.criteria.length}` : ''}</div>
          <button class="btn btn-green sm" onclick="decideOption('${o.id}')">👑 この案に決定</button></div>`;
      }).join('') : '<div class="empty" style="grid-column:1/-1">「+ 案を追加」を押すか、意見ボードの「→案」、お役立ちデータベースの「案にする」で案を作ろう。</div>';
    }
    function decideOption(id) {
      const a = cur(), o = a.options.find(x => x.id === id); if (!o) return;
      a.decision = o.name; if (o.memo && !a.detail) a.detail = o.memo;
      $('m-decision').value = a.decision; $('m-detail').value = a.detail;
      const di = a.steps.findIndex(s => s.tool === 'decision');
      if (di >= 0 && a.stepIdx < di) goStep(di);
      showTab('decision'); renderStep(); touch(); toast('📌 「決まったこと」に入れました。内容を整えて登録しよう');
    }
    async function runoff() {
      const a = cur(), ld = leaders(a); if (ld.length < 2) return;
      pushHistory(`${a.title || '多数決'}（${a.round}回目）`, a);
      a.options = ld.map(o => ({ ...o, count: 0 })); a.round++;
      renderVotes(); touch(); toast('🔁 同数の案だけ残しました。もう一度投票しよう', 'warn');
    }
    function drawLots() {
      const a = cur(), ld = leaders(a); if (ld.length < 2) return;
      let n = 0; const pick = ld[Math.floor(Math.random() * ld.length)];
      const iv = setInterval(() => {
        document.querySelectorAll('.vote-card').forEach(c => c.classList.remove('spot'));
        const o = n >= 14 ? pick : ld[n % ld.length];
        const el = $('vc-' + o.id); if (el) el.classList.add('spot'); tone(600 + (n % 5) * 80, 0.08, 0.08);
        if (++n > 14) { clearInterval(iv); playFanfare(); toast('🎲 くじの結果：' + pick.name); }
      }, 130);
    }
    function pushHistory(title, a) {
      S.voteHistory.push({ id: uid(), date: todayStr(), title, agendaTitle: a.title || '', data: a.options.map(o => ({ name: o.name, count: o.count })) });
    }
    async function saveVoteToHistory() {
      const a = cur(); if (!a.options.length) return toast('保存する案がありません', 'warn');
      const t = await askText('この投票結果の名前', `${a.title || '多数決'}（${a.round}回目）`); if (!t) return;
      pushHistory(t, a); save(); toast('💾 履歴に保存しました（ノート →「投票」で見られます）');
    }

    // ---- 決定・議事録
    function renderRegState() { const a = cur(); if (a && $('reg-state')) $('reg-state').textContent = a.regId ? '✔ 登録ずみ（もう一度押すと内容を更新します）' : ''; }
    function registerDecision() {
      const a = cur(), text = a.decision.trim();
      if (!text) { toast('「決まったこと」を書いてください', 'warn'); $('m-decision').focus(); return; }
      const rec = { type: a.type, title: a.title, text, detail: a.detail.trim(), when: a.when || '', date: todayStr() };
      let d = S.decisions.find(x => x.id === a.regId);
      if (d) Object.assign(d, rec); else { d = { id: uid(), done: false, ...rec }; S.decisions.push(d); a.regId = d.id; updateExp(20); }
      if (a.type === 'goal' && a.setGoal) { setGoal(monthKey(), text); renderGoalBar(); }
      a.status = 'done'; $('m-status').value = 'done';
      if (!a.minutesText.trim()) { a.minutesText = buildMinutesText(a); $('m-minutes').value = a.minutesText; }
      storeMinutes(false); renderRegState(); renderAgendaList(); touch();
      showCue('🎉 決定！', 'fanfare');
    }
    const TAG_JA = { idea: 'アイデア', agree: '賛成', disagree: '反対', question: '質問', worry: '心配' };
    function buildMinutesText(a) {
      const R = S.roles, L = [];
      L.push('【学級会 議事録】');
      L.push(`日時：${new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' })}`);
      L.push(`第${S.meetingNo || 1}回　議題：${a.title || '（未入力）'}（${TYPES[a.type].label}）`);
      L.push(`司会：${R.chair || '　'}　副司会：${R.vice || '　'}　書記：${R.scribe || '　'}　提案者：${a.proposer || '　'}`);
      if (a.reason) L.push('', '■ 提案理由', a.reason);
      if (a.opinions.length) {
        L.push('', '■ 出た意見');
        a.opinions.forEach(o => L.push(`・[${TAG_JA[o.tag]}] ${o.text}${o.who ? `（${o.who}）` : ''}${o.plus ? ` 同じ意見+${o.plus}` : ''}${o.star ? ' ★' : ''}`));
      }
      if (a.options.length) {
        const tot = a.options.reduce((s, o) => s + o.count, 0);
        L.push('', `■ 案と投票結果（${a.round}回目・合計${tot}票）`);
        a.options.forEach(o => L.push(`・${o.name}　${o.count}票${o.checks.length ? `　観点：${o.checks.join('・')}` : ''}${o.memo ? `\n　　${o.memo.replace(/\n/g, ' ')}` : ''}`));
      }
      L.push('', '■ 決まったこと', a.decision || '（まだ決まっていません）');
      if (a.detail) L.push('', '■ くわしい内容', a.detail);
      if (a.when) L.push(`実施日・期限：${a.when}`);
      if (a.memo) L.push('', '■ 書記メモ', a.memo);
      if (a.reflect) L.push('', '■ ふりかえり', a.reflect);
      return L.join('\n');
    }
    function makeMinutes() { const a = cur(); a.minutesText = buildMinutesText(a); $('m-minutes').value = a.minutesText; save(); toast('📄 議事録を作りました。自由に直せます'); }
    function downloadMinutes() { const a = cur(); download(`議事録_${a.title || '学級会'}.txt`, $('m-minutes').value || buildMinutesText(a)); }
    function storeMinutes(msg) {
      const a = cur(); if (!a) return;
      const text = a.minutesText.trim() ? a.minutesText : buildMinutesText(a);
      let m = S.minutes.find(x => x.agendaId === a.id);
      if (m) { m.text = text; m.title = a.title; } else S.minutes.push({ id: uid(), agendaId: a.id, date: todayStr(), title: a.title || '（議題未入力）', type: a.type, text });
      save(); if (msg) toast('📥 議事録をノートに保存しました');
    }

    // =====================================================
    // 6. 決定ノート（きまり・めあて・レク・議事録・投票）
    // =====================================================
    let notesTab = 'rule', notesBack = null;
    function openNotes(tab) {
      notesTab = tab || notesTab;
      if (!notesBack || !notesBack.parentNode) notesBack = openModal(`<div id="notes-inner" style="display:flex;flex-direction:column;gap:10px;height:100%"></div>`, 'large');
      renderNotes();
    }
    function renderNotes() {
      const root = document.getElementById('notes-inner'); if (!root) return;
      const tabs = [['rule', '📏 きまり'], ['goal', '🎯 めあて'], ['rec', '🎉 レク'], ['free', '💬 その他'], ['minutes', '📄 議事録'], ['votes', '📊 投票']];
      root.innerHTML = `<div class="row" style="justify-content:space-between"><h3>📒 学級会ノート</h3><div class="row no-print"><button class="btn btn-cyan sm" onclick="copyNotes()">コピー</button><button class="btn sm" onclick="printNotes()">🖨 印刷</button><button class="btn btn-red sm" onclick="closeModal(notesBack)">閉じる</button></div></div>
        <div class="work-tabs no-print">${tabs.map(([k, l]) => `<button class="wtab ${notesTab === k ? 'on' : ''}" onclick="notesTab='${k}';renderNotes()">${l}</button>`).join('')}</div>
        <div class="notes-list" id="notes-list"></div>`;
      const L = $('notes-list');
      if (['rule', 'rec', 'free'].includes(notesTab)) {
        const items = S.decisions.filter(d => d.type === notesTab);
        L.innerHTML = `<div class="no-print"><button class="btn sm" onclick="addManualDecision('${notesTab}')">＋ 手入力で追加</button></div>` + (items.length ? items.slice().reverse().map(d => `<div class="note-item ${d.done ? 'done' : ''}">
          <div class="ni-head"><b style="font-size:1.05rem">${esc(d.text)}</b><span class="ni-sub">${esc(d.date)}</span></div>
          <div class="ni-sub">議題：${esc(d.title || '—')}${d.when ? `　／　実施日・期限：${esc(d.when)}` : ''}${d.done ? '　✔済' : ''}</div>
          ${d.detail ? `<pre>${esc(d.detail)}</pre>` : ''}
          <div class="row no-print">${notesTab === 'rec' ? `<button class="mini" onclick="toggleDecDone('${d.id}')">${d.done ? '↩ 未実施にする' : '✔ 実施した'}</button>` : ''}<button class="mini" onclick="editDecision('${d.id}')">✎ なおす</button><button class="mini red" onclick="delDecision('${d.id}')">✖ 消す</button></div></div>`).join('') : '<div class="empty">まだありません。学級会で決めて「決定ノートに登録」すると、ここに並びます。</div>');
      } else if (notesTab === 'goal') {
        const gs = S.goals.slice().sort((a, b) => b.month.localeCompare(a.month));
        L.innerHTML = gs.length ? gs.map(g => `<div class="note-item"><div class="ni-head"><b style="font-size:1.05rem">${g.month.replace('-', '年')}月</b><span class="stars no-print">${[1, 2, 3, 4, 5].map(n => `<span onclick="rateGoal('${g.id}',${n})">${n <= (g.rating || 0) ? '★' : '☆'}</span>`).join('')}</span></div>
          <input type="text" value="${esc(g.text)}" oninput="editGoal('${g.id}','text',this.value)" placeholder="めあて">
          <input type="text" value="${esc(g.note || '')}" oninput="editGoal('${g.id}','note',this.value)" placeholder="ふりかえり（どうだった？ 次にどうする？）"></div>`).join('') : '<div class="empty">今月のめあてを、画面上の入力欄に書くか、「今月のめあて」の学級会で決めよう。月ごとに★で自己評価できます。</div>';
      } else if (notesTab === 'minutes') {
        L.innerHTML = S.minutes.length ? S.minutes.slice().reverse().map(m => `<div class="note-item"><div class="ni-head"><b>${TYPES[m.type] ? TYPES[m.type].icon : ''} ${esc(m.title)}</b><span class="ni-sub">${esc(m.date)}</span></div>
          <details><summary class="ni-sub" style="cursor:pointer">議事録を見る</summary><pre>${esc(m.text)}</pre></details>
          <div class="row no-print"><button class="mini" onclick="copyMinutes('${m.id}')">コピー</button><button class="mini" onclick="dlMinutes('${m.id}')">保存</button><button class="mini red" onclick="delMinutes('${m.id}')">✖</button></div></div>`).join('') : '<div class="empty">議事録はまだありません。話し合いを終えたり決定を登録すると、自動で保存されます。</div>';
      } else {
        L.innerHTML = S.voteHistory.length ? S.voteHistory.slice().reverse().map(h => `<div class="note-item"><div class="ni-head"><b>${esc(h.title)}</b><span class="ni-sub">${esc(h.date)}</span></div>
          <pre>${h.data.map(d => `${d.name}：${d.count}票`).join('\n')}</pre><div class="row no-print"><button class="mini red" onclick="delVoteHist('${h.id}')">✖</button></div></div>`).join('') : '<div class="empty">投票の履歴はありません。</div>';
      }
    }
    async function addManualDecision(type) {
      const t = await askText('決まったこと', ''); if (!t || !t.trim()) return;
      S.decisions.push({ id: uid(), type, title: '手入力', text: t.trim(), detail: '', when: '', date: todayStr(), done: false }); save(); renderNotes();
    }
    async function editDecision(id) {
      const d = S.decisions.find(x => x.id === id); if (!d) return;
      const t = await askText('決まったこと', d.text); if (t == null) return;
      const dt = await askText('くわしい内容', d.detail, true); if (dt == null) return;
      d.text = t.trim() || d.text; d.detail = dt; save(); renderNotes();
    }
    async function delDecision(id) { if (!(await askConfirm('このきまりを消しますか？', '消す'))) return; S.decisions = S.decisions.filter(x => x.id !== id); S.agendas.forEach(a => { if (a.regId === id) a.regId = null; }); save(); renderNotes(); renderRegState(); renderWorkTabs(); }
    function toggleDecDone(id) { const d = S.decisions.find(x => x.id === id); if (d) { d.done = !d.done; save(); renderNotes(); } }
    function rateGoal(id, n) { const g = S.goals.find(x => x.id === id); if (g) { g.rating = g.rating === n ? 0 : n; save(); renderNotes(); renderGoalBar(); } }
    function editGoal(id, f, v) { const g = S.goals.find(x => x.id === id); if (g) { g[f] = v; save(); if (f === 'text') renderGoalBar(); } }
    function copyMinutes(id) { const m = S.minutes.find(x => x.id === id); if (m) copyText(m.text); }
    function dlMinutes(id) { const m = S.minutes.find(x => x.id === id); if (m) download(`議事録_${m.title}.txt`, m.text); }
    async function delMinutes(id) { if (await askConfirm('この議事録を消しますか？', '消す')) { S.minutes = S.minutes.filter(x => x.id !== id); save(); renderNotes(); } }
    function delVoteHist(id) { S.voteHistory = S.voteHistory.filter(x => x.id !== id); save(); renderNotes(); }
    function notesText() {
      if (['rule', 'rec', 'free'].includes(notesTab)) {
        const head = { rule: '【クラスのきまり】', rec: '【学級レク】', free: '【決まったこと】' }[notesTab];
        return head + '\n' + S.decisions.filter(d => d.type === notesTab).map((d, i) => `${i + 1}. ${d.text}${d.detail ? '\n   ' + d.detail.replace(/\n/g, '\n   ') : ''}${d.when ? `\n   （${d.when}）` : ''}`).join('\n');
      }
      if (notesTab === 'goal') return '【月ごとのめあて】\n' + S.goals.slice().sort((a, b) => b.month.localeCompare(a.month)).map(g => `${g.month}：${g.text}　${'★'.repeat(g.rating || 0)}${g.note ? '　' + g.note : ''}`).join('\n');
      if (notesTab === 'minutes') return S.minutes.map(m => m.text).join('\n\n----------------\n\n');
      return S.voteHistory.map(h => `${h.date} ${h.title}\n` + h.data.map(d => `  ${d.name}：${d.count}票`).join('\n')).join('\n\n');
    }
    function copyNotes() { copyText(notesText()); }
    function printNotes() { document.body.classList.add('printing'); window.print(); }
    window.addEventListener('afterprint', () => document.body.classList.remove('printing'));

    // =====================================================
    // 7. 発表モード（大型モニター用）
    // =====================================================
    let presenterOpen = false;
    function togglePresenter() {
      presenterOpen = !presenterOpen;
      $('presenter').classList.toggle('open', presenterOpen);
      if (presenterOpen) { ac(); renderPresenter(); }
    }
    function renderPresenter() {
      const root = $('presenter'), a = cur();
      if (!a) { root.innerHTML = `<div class="pr-top"><div class="pr-agenda">議題がありません</div><button class="btn btn-red" onclick="togglePresenter()">✕ とじる</button></div>`; return; }
      const s = a.steps[a.stepIdx] || { title: '', text: '', tool: 'none' };
      let work = '';
      const tool = s.tool;
      if (tool === 'opinions') {
        const list = a.opinions;
        work = list.length ? list.map(o => `<div class="pr-chip tag-${o.tag}">${TAGS[o.tag].icon} ${esc(o.text)}${o.plus ? ` <small>👥+${o.plus}</small>` : ''}${o.star ? ' ★' : ''}</div>`).join('') : '';
      } else if (tool === 'vote' && a.options.length) {
        const tot = a.options.reduce((x, o) => x + o.count, 0), ids = new Set(leaders(a).map(o => o.id));
        work = `<div class="pr-bars">${a.options.map(o => `<div class="pr-bar-row ${ids.has(o.id) ? 'lead' : ''}"><span>${esc(o.name)}</span><div class="bar-bg"><div class="bar-fill" style="width:${tot ? o.count / tot * 100 : 0}%"></div></div><b>${o.count}票</b></div>`).join('')}</div>`;
      } else if (tool === 'decision' || (a.decision && a.stepIdx >= a.steps.length - 2 && tool !== 'vote')) {
        work = a.decision ? `<div class="pr-decision">📌 ${esc(a.decision)}</div>` : '';
        if (a.detail) work += `<div class="pr-text" style="width:100%;font-size:clamp(1.1rem,2.4vw,1.8rem);white-space:pre-wrap">${esc(a.detail)}</div>`;
      }
      root.innerHTML = `<div class="pr-top"><div class="pr-agenda">${TYPES[a.type].icon} ${a.title ? rb(a.title, a) : '（議題）'}</div><div class="pr-timer timer-text">${fmt(T.remaining)}</div><button class="btn btn-red" onclick="togglePresenter()">✕ とじる (Esc)</button></div>
        <div class="pr-step" style="--tc:${TYPES[a.type].color}"><div class="pr-title">${a.stepIdx + 1}. ${rb(s.title, a)}</div><div class="pr-text">${rb(s.text, a)}</div></div>
        ${sayText ? `<div class="pr-say">📢 ${rb(sayText, a)}</div>` : ''}
        ${work ? `<div class="pr-work">${work}</div>` : ''}
        <div class="pr-nav"><button class="btn" onclick="prevStep()">◀ 前へ</button><button class="btn btn-green" onclick="nextStep()">次へ ▶</button></div>`;
      updateTimerUI();
    }

    // =====================================================
    // 8. タイマー
    // =====================================================
    const T = { total: 300, remaining: 300, running: false, endAt: 0, label: '', iv: null };
    function fmt(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
    function updateTimerUI() {
      document.querySelectorAll('.timer-text').forEach(e => { e.textContent = fmt(T.remaining); e.classList.toggle('low', T.total > 0 && T.remaining <= 10 && (T.running || T.remaining === 0)); });
      $('timer-bar').style.width = (T.total ? T.remaining / T.total * 100 : 0) + '%';
      $('timer-label').textContent = T.label || '';
      $('btn-timer-toggle').textContent = T.running ? '⏸ とめる' : '▶ スタート';
    }
    function setTimer(sec, label) {
      stopTimerInterval(); T.total = T.remaining = Math.max(0, sec); T.label = label || '';
      $('t-min').value = Math.floor(sec / 60); $('t-sec').value = sec % 60; updateTimerUI();
    }
    function applyCustomTimer() { setTimer((parseInt($('t-min').value) || 0) * 60 + (parseInt($('t-sec').value) || 0), ''); }
    function quickTimer(sec) { setTimer(sec, ''); startTimer(); }
    function stopTimerInterval() { clearInterval(T.iv); T.running = false; }
    function startTimer() {
      if (T.remaining <= 0) T.remaining = T.total; if (T.remaining <= 0) return;
      ac(); T.running = true; T.endAt = Date.now() + T.remaining * 1000;
      clearInterval(T.iv); T.iv = setInterval(tick, 200); updateTimerUI();
    }
    function pauseTimer() { if (T.running) { T.remaining = Math.max(0, Math.ceil((T.endAt - Date.now()) / 1000)); } stopTimerInterval(); updateTimerUI(); }
    function toggleTimer() { T.running ? pauseTimer() : startTimer(); }
    function resetTimer() { stopTimerInterval(); T.remaining = T.total; updateTimerUI(); }
    function tick() {
      const left = Math.max(0, Math.ceil((T.endAt - Date.now()) / 1000));
      if (left !== T.remaining) { T.remaining = left; updateTimerUI(); if (left > 0 && left <= 3) playBeep(); }
      if (left <= 0) { stopTimerInterval(); updateTimerUI(); triggerFlare(); showCue('⏰ 時間です', 'chime'); }
    }

    // =====================================================
    // 9. メンバー・ガチャ・班分け
    // =====================================================
    function parseNums(str) {
      const set = new Set();
      String(str || '').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).split(/[,、\s]+/).forEach(tok => {
        if (!tok) return; const m = tok.match(/^(\d+)[-〜~ー](\d+)$/);
        if (m) { for (let i = +m[1]; i <= +m[2] && i < 500; i++) set.add(i); } else if (/^\d+$/.test(tok)) set.add(+tok);
      });
      return set;
    }
    function presentList() { const ab = parseNums(S.absent), r = []; for (let i = 1; i <= S.maxStudents; i++) if (!ab.has(i)) r.push(i); return r; }
    function saveMembers(keepFocus) {
      S.maxStudents = Math.max(1, parseInt($('max-students').value) || 35); S.absent = $('absent-input').value;
      if (S.headcount > S.maxStudents) S.headcount = S.maxStudents;
      renderMembers(!keepFocus); save();
    }
    function renderMembers(rebuildSelect) {
      $('present-info').textContent = `出席見込み：${presentList().length}人`;
      if (rebuildSelect !== false) {
        const sel = $('headcount-select'); sel.innerHTML = '';
        for (let i = 0; i <= S.maxStudents; i++) sel.add(new Option(i + '人', i));
        sel.value = S.headcount;
      }
      $('used-info').textContent = S.usedNums.length ? '当たり済み：' + S.usedNums.join(', ') : '';
      if (cur() && $('v-summary')) renderVotes();
    }
    function changeHeadcount(v) { S.headcount = parseInt(v) || 0; save(); if (cur()) renderVotes(); }
    function autoHeadcount() { S.headcount = presentList().length; $('headcount-select').value = S.headcount; save(); if (cur()) renderVotes(); toast(`点呼人数を ${S.headcount}人 にしました`); }
    function resetUsed() { S.usedNums = []; save(); renderMembers(false); }
    function spinRoulette() {
      const pool = presentList().filter(n => !S.noRepeat || !S.usedNums.includes(n));
      if (!pool.length) {
        if (S.usedNums.length) { S.usedNums = []; toast('全員が当たったので、はじめからにします', 'warn'); return spinRoulette(); }
        return toast('出席番号がありません', 'warn');
      }
      const final = pool[Math.floor(Math.random() * pool.length)], el = $('rng-result'); let c = 0;
      const iv = setInterval(() => {
        el.textContent = pool[Math.floor(Math.random() * pool.length)]; tone(500 + c * 20, 0.05, 0.05);
        if (++c > 15) {
          clearInterval(iv); el.textContent = final; playBeep();
          if (S.noRepeat) S.usedNums.push(final); renderMembers(false); save();
        }
      }, 55);
    }
    let lastGroupsText = '';
    function generateGroups() {
      const list = shuffle(presentList()); if (!list.length) return toast('出席者がいません', 'warn');
      const val = Math.max(1, parseInt($('group-count').value) || 1);
      const n = $('group-mode').value === 'count' ? Math.min(val, list.length) : Math.ceil(list.length / val);
      const groups = Array.from({ length: n }, () => []); list.forEach((x, i) => groups[i % n].push(x));
      const leader = $('group-leader').checked;
      lastGroupsText = groups.map((g, i) => `第${i + 1}班：${g.map((x, j) => leader && j === 0 ? `${x}(班長)` : x).join(', ')}`).join('\n');
      $('group-result').innerHTML = groups.map((g, i) => `<div style="margin-bottom:5px"><strong style="color:var(--gold)">第${i + 1}班（${g.length}人）:</strong> ${g.map((x, j) => leader && j === 0 ? `<b style="color:var(--cyan)">${x}★</b>` : x).join(', ')}</div>`).join('');
      playBeep();
    }

    // =====================================================
    // 10. タスク・DB・各種入力
    // =====================================================
    function renderTasks() {
      const c = $('task-list-container');
      c.innerHTML = S.tasks.length ? S.tasks.map((t, i) => `<div class="task-item ${t.priority} ${t.done ? 'done' : ''}"><span>${esc(t.text)}</span><span class="row"><button class="mini" onclick="toggleTask(${i})">✔</button><button class="mini red" onclick="deleteTask(${i})">✖</button></span></div>`).join('') : '<div class="empty">やることを入れておこう</div>';
      save();
    }
    function addTask() { const i = $('task-input'); if (!i.value.trim()) return; S.tasks.push({ text: i.value.trim(), priority: $('task-pri').value, done: false }); i.value = ''; renderTasks(); updateExp(5); }
    function toggleTask(i) { S.tasks[i].done = !S.tasks[i].done; if (S.tasks[i].done) updateExp(10); renderTasks(); }
    function deleteTask(i) { S.tasks.splice(i, 1); renderTasks(); }
    function clearDoneTasks() { S.tasks = S.tasks.filter(t => !t.done); renderTasks(); }

    function renderDb() {
      const q = $('db-search').value.trim().toLowerCase(), cf = $('db-cat-filter').value;
      const list = S.db.filter(d => (cf === 'all' || d.cat === cf) && (!q || (d.title + d.detail).toLowerCase().includes(q)));
      $('db-container').innerHTML = list.length ? list.map(d => `<div class="db-item">
        <div class="row"><select style="width:auto" onchange="updateDb('${d.id}','cat',this.value)">${Object.entries(DB_CATS).map(([k, v]) => `<option value="${k}" ${d.cat === k ? 'selected' : ''}>${v}</option>`).join('')}</select><input type="text" value="${esc(d.title)}" oninput="updateDb('${d.id}','title',this.value)" placeholder="タイトル"></div>
        <textarea oninput="updateDb('${d.id}','detail',this.value)" placeholder="詳しい内容（ルール・時間・道具など）">${esc(d.detail)}</textarea>
        <div class="row" style="justify-content:flex-end"><button class="btn btn-cyan sm" onclick="dbToOption('${d.id}')">→ 案にする</button><button class="btn btn-red sm" onclick="deleteDbItem('${d.id}')">削除</button></div></div>`).join('') : '<div class="empty">該当するものがありません</div>';
    }
    function addDbItem() { S.db.unshift({ id: uid(), cat: 'etc', title: '', detail: '' }); $('db-search').value = ''; $('db-cat-filter').value = 'all'; renderDb(); save(); }
    function updateDb(id, f, v) { const d = S.db.find(x => x.id === id); if (d) { d[f] = v; save(); } }
    async function deleteDbItem(id) { if (await askConfirm('このメモを消しますか？', '消す')) { S.db = S.db.filter(d => d.id !== id); renderDb(); save(); } }
    function dbToOption(id) {
      const d = S.db.find(x => x.id === id); if (!d) return;
      if (!cur()) return toast('先に議題をえらんでね', 'warn');
      addOption(d.title, d.detail, true); toast('📊 「案と投票」に追加しました');
    }

    function onRole(k, v) { S.roles[k] = v; save(); if (cur()) { renderStep(); renderStepper(); if (presenterOpen) renderPresenter(); } }
    function onMeetingNo(v) { S.meetingNo = Math.max(1, parseInt(v) || 1); save(); if (cur()) renderStep(); }

    // =====================================================
    // 11. 設定・バックアップ・終礼リセット
    // =====================================================
    function toggleFurigana() { S.furigana = !S.furigana; document.body.classList.toggle('furigana-mode', S.furigana); save(); }
    function fontStep(d) { S.fontScale = Math.min(1.6, Math.max(0.8, Math.round((S.fontScale + d) * 10) / 10)); document.documentElement.style.fontSize = (16 * S.fontScale) + 'px'; save(); }

    function openSettings() {
      const b = openModal(`<h3>⚙ せってい・つかいかた</h3>
        <div><b>⌨ キーボード</b><div class="hint" style="line-height:1.9"><kbd>←</kbd> <kbd>→</kbd> 手順を前後に　<kbd>P</kbd> 発表モード　<kbd>T</kbd> タイマー開始/停止　<kbd>Esc</kbd> とじる</div></div>
        <div><b>💡 ひと言ガイド</b><div class="hint" style="line-height:1.7">・議題を選ぶ → 手順に沿って「次へ」で進行<br>・「手順を編集」で、読む言葉や順番を自由に変更（議題ごとに変えられます）<br>・意見は「意見」タブに入力 →「→案」で投票の案に<br>・決まったら「決定」タブで登録 → 決定ノートに残ります<br>・データはこのブラウザに自動保存されます</div></div>
        <div class="m-btns" style="justify-content:flex-start">
          <button class="btn btn-cyan" onclick="exportData()">⬇ バックアップを保存</button>
          <button class="btn btn-cyan" onclick="$('import-file').click()">⬆ バックアップから復元</button>
          <input type="file" id="import-file" accept=".json,application/json" style="display:none" onchange="importData(this.files[0])">
        </div>
        <div class="m-btns" style="justify-content:flex-start"><button class="btn sm" onclick="resetTemplates()">自分用の手順を初期化</button><button class="btn btn-red sm" onclick="wipeAll()">全データを消す</button></div>
        <div class="m-btns"><button class="btn" id="set-close">閉じる</button></div>`);
      b.querySelector('#set-close').onclick = () => b.remove();
    }
    function exportData() { flush(); download(`学級委員コンソール_バックアップ_${monthKey()}.json`, JSON.stringify(S, null, 1), 'application/json'); toast('⬇ 保存しました'); }
    function importData(file) {
      if (!file) return;
      const r = new FileReader();
      r.onload = async () => {
        try {
          const d = JSON.parse(r.result); if (!d || typeof d !== 'object' || !Array.isArray(d.agendas)) throw new Error('形式がちがいます');
          if (!(await askConfirm('いまのデータを、バックアップの内容で置きかえます。よろしいですか？', '復元する'))) return;
          S = Object.assign(defaultState(), d); S.roles = Object.assign(defaultState().roles, d.roles || {}); flush(); location.reload();
        } catch (e) { toast('読みこめませんでした：' + e.message, 'warn'); }
      };
      r.readAsText(file);
    }
    async function resetTemplates() { if (await askConfirm('編集して保存した「自分用の手順」を、すべて初期にもどしますか？\n（すでに作った議題には影響しません）', 'もどす')) { S.customTemplates = {}; save(); toast('初期の手順にもどしました'); } }
    async function wipeAll() {
      if (!(await askConfirm('すべてのデータ（議題・ノート・めあて・メモ）を消します。\n先にバックアップを保存することをおすすめします。', '全部消す'))) return;
      S = defaultState(); flush(); location.reload();
    }
    async function resetDay() {
      const c = await askChoice('終礼リセット', '今日の分をリセットします。\n・完了したタスク、先生への報告、点呼、欠席、ガチャ記録をクリア\n・「おわり」にした議題を片づけ（決定ノート・議事録は残ります）\n・未完了の議題は次回に持ち越し\n・学級会の回数を +1', ['リセットする', 'やめる']);
      if (c !== 0) return;
      S.tasks = S.tasks.filter(t => !t.done); S.daily = ''; $('daily-memo').value = '';
      S.headcount = 0; S.absent = ''; $('absent-input').value = ''; S.usedNums = [];
      storeAllDoneMinutes();
      S.agendas = S.agendas.filter(a => a.status !== 'done');
      if (!S.agendas.find(a => a.id === S.curId)) S.curId = S.agendas.length ? S.agendas[0].id : null;
      S.meetingNo = (S.meetingNo || 1) + 1; $('meeting-no').value = S.meetingNo;
      renderTasks(); renderMembers(true); renderAgendaList(); buildMeeting(); updateExp(20); touch();
      toast('お疲れさまでした！ボーナスEXPを獲得 🎉');
    }
    function storeAllDoneMinutes() {
      S.agendas.filter(a => a.status === 'done').forEach(a => {
        const text = a.minutesText.trim() ? a.minutesText : buildMinutesText(a);
        const m = S.minutes.find(x => x.agendaId === a.id);
        if (m) m.text = text; else S.minutes.push({ id: uid(), agendaId: a.id, date: todayStr(), title: a.title || '（議題未入力）', type: a.type, text });
      });
    }

    // =====================================================
    // 12. 初期化・キーボード・背景
    // =====================================================
    function applyStaticRuby() { document.querySelectorAll('[data-rb]').forEach(el => { el.innerHTML = rb(el.dataset.rb, null); }); }
    function initUI() {
      $('date-display').textContent = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
      document.body.classList.toggle('furigana-mode', !!S.furigana);
      document.documentElement.style.fontSize = (16 * (S.fontScale || 1)) + 'px';
      $('ag-type').innerHTML = Object.entries(TYPES).map(([k, t]) => `<option value="${k}">${t.icon} ${t.label}</option>`).join('');
      $('db-cat-filter').innerHTML = '<option value="all">すべて</option>' + Object.entries(DB_CATS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
      $('daily-memo').value = S.daily; $('max-students').value = S.maxStudents; $('absent-input').value = S.absent;
      $('meeting-no').value = S.meetingNo || 1; $('no-repeat').checked = S.noRepeat !== false;
      ['chair', 'vice', 'scribe', 'timekeeper'].forEach(k => $('role-' + k).value = S.roles[k] || '');
      applyStaticRuby();
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { const m = topModal(); if (m) return closeModal(m); if (presenterOpen) return togglePresenter(); }
      const tg = e.target.tagName; if (/INPUT|TEXTAREA|SELECT/.test(tg) || e.ctrlKey || e.metaKey || e.altKey || topModal()) return;
      if (e.key === 'ArrowRight' && cur()) { e.preventDefault(); nextStep(); }
      else if (e.key === 'ArrowLeft' && cur()) { e.preventDefault(); prevStep(); }
      else if (e.key === 'p' || e.key === 'P') togglePresenter();
      else if (e.key === 't' || e.key === 'T') toggleTimer();
    });

    // 背景パーティクル
    (function () {
      const canvas = $('bg-canvas'), ctx2 = canvas.getContext('2d'); if (!ctx2) return;
      const resize = () => { canvas.width = innerWidth; canvas.height = innerHeight; };
      addEventListener('resize', resize); resize();
      const ps = Array.from({ length: 45 }, () => ({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 2 + 0.5, vx: Math.random() * 0.2 - 0.1, vy: Math.random() * 0.2 - 0.1, o: Math.random(), f: Math.random() > 0.5 ? 0.005 : -0.005 }));
      (function anim() {
        ctx2.clearRect(0, 0, canvas.width, canvas.height);
        ps.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.o += p.f; if (p.o >= 1 || p.o <= 0.1) p.f *= -1;
          if (p.x > canvas.width) p.x = 0; if (p.x < 0) p.x = canvas.width; if (p.y > canvas.height) p.y = 0; if (p.y < 0) p.y = canvas.height;
          ctx2.fillStyle = `rgba(255,170,0,${p.o * 0.5})`; ctx2.beginPath(); ctx2.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx2.fill();
        });
        requestAnimationFrame(anim);
      })();
    })();

    // ---- 起動
    loadState();
    buildDict();
    initUI();
    updateExp(0);
    renderGoalBar();
    renderTasks();
    renderDb();
    renderMembers(true);
    renderAgendaList();
    if (!S.curId && S.agendas.length) S.curId = S.agendas[0].id;
    buildMeeting();
    updateTimerUI();
  </script>
</body>

</html>

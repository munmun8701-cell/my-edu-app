  <!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>宿題提出管理ツール - CYBERPUNK EDITION</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* サイバーパンク カラーパレット */
            --bg-base: #090a0f;
            --bg-panel: #12161f;
            --bg-surface: #1a1f2b;
            --neon-cyan: #00f3ff;
            --neon-blue: #0088ff;
            --neon-pink: #ff007f;
            --neon-green: #39ff14;
            --neon-yellow: #fcee0a;
            --text-main: #e0e6ed;
            --text-muted: #8b9eb0;
            --border-dim: rgba(0, 243, 255, 0.2);
        }

        /* 全体のベース設定 */
        body { 
            font-family: 'Share Tech Mono', 'Noto Sans JP', sans-serif; 
            padding: 15px; 
            color: var(--text-main); 
            background-color: var(--bg-base); 
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            margin: 0;
        }

        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 4px; }

        .container { 
            max-width: 1400px; 
            margin: auto; 
            background: var(--bg-panel); 
            padding: 25px; 
            border-radius: 8px; 
            border: 1px solid var(--border-dim);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1); 
        }

        h2 { 
            border-left: 5px solid var(--neon-cyan); 
            padding-left: 15px; 
            margin-bottom: 25px;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            font-size: 1.8em;
            letter-spacing: 2px;
        }
        
        /* 表示切り替えパネル */
        .toggle-panel { 
            background-color: var(--bg-surface); 
            padding: 15px; 
            margin-bottom: 20px; 
            border-radius: 5px; 
            border: 1px solid var(--border-dim); 
            font-weight: bold; 
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .toggle-panel span { color: var(--neon-yellow); text-shadow: 0 0 5px rgba(252, 238, 10, 0.5); }
        .toggle-panel label { 
            cursor: pointer; user-select: none; transition: 0.3s; 
            display: flex; align-items: center; gap: 5px;
        }
        .toggle-panel label:hover { color: var(--neon-cyan); }
        input[type="checkbox"] { accent-color: var(--neon-cyan); transform: scale(1.2); cursor: pointer; }
        
        /* 設定パネル */
        .control-panel { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; }
        .config-group { 
            background: var(--bg-surface); 
            padding: 15px; 
            border-radius: 5px; 
            border: 1px solid var(--border-dim); 
            min-width: 250px; 
            flex: 1; 
            transition: 0.3s;
        }
        .config-group:hover { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }
        .config-group.basic { border-left: 3px solid var(--neon-blue); }
        .config-group h4 { margin: 0 0 12px 0; color: var(--neon-cyan); font-size: 1.1em; border-bottom: 1px dashed var(--border-dim); padding-bottom: 8px;}
        
        /* 共通入力UI（インプット・セレクト） */
        input[type="number"], input[type="text"], select {
            background: var(--bg-base);
            border: 1px solid var(--border-dim);
            color: var(--neon-cyan);
            padding: 6px;
            border-radius: 4px;
            font-family: inherit;
            transition: 0.3s;
        }
        input:focus, select:focus { outline: none; border-color: var(--neon-cyan); box-shadow: 0 0 8px rgba(0, 243, 255, 0.5); }
        .name-input { width: 90px; }

        /* ＋－ボタン周り */
        .setting-adjust-row { display: flex; align-items: center; margin-bottom: 12px; font-size: 0.95em; gap: 8px; }
        .btn-adjust {
            width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
            background: transparent; border: 1px solid var(--border-dim); border-radius: 4px; 
            font-size: 1.2em; cursor: pointer; color: var(--text-main); padding: 0; transition: 0.3s;
        }
        .btn-adjust:hover { background: var(--neon-cyan); color: var(--bg-base); border-color: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); }
        .max-num-display { display: inline-block; width: 40px; text-align: center; font-size: 1.3em; font-weight: bold; color: var(--neon-yellow); text-shadow: 0 0 5px rgba(252, 238, 10, 0.3); }

        /* ボタン全般 */
        button { 
            border: 1px solid var(--border-dim); cursor: pointer; border-radius: 4px; 
            font-weight: bold; font-size: 0.85em; padding: 6px 12px; background: transparent; color: var(--text-main);
            transition: all 0.3s ease; text-transform: uppercase; font-family: inherit;
        }
        button:hover { transform: translateY(-1px); }

        /* アクションバー */
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border-dim); }
        .btn-print-list { border-color: var(--neon-pink); color: var(--neon-pink); }
        .btn-print-list:hover { background: var(--neon-pink); color: var(--bg-base); box-shadow: 0 0 15px var(--neon-pink); }

        /* テーブル系ボタン */
        .btn-today { border-color: var(--neon-cyan); color: var(--neon-cyan); margin-right: 4px; }
        .btn-today:hover { background: var(--neon-cyan); color: var(--bg-base); box-shadow: 0 0 10px var(--neon-cyan); }
        .btn-add-past { border-color: var(--neon-blue); color: var(--neon-blue); padding: 6px 10px;}
        .btn-add-past:hover { background: var(--neon-blue); color: var(--bg-base); box-shadow: 0 0 10px var(--neon-blue); }
        .btn-save { border-color: var(--neon-green); color: var(--neon-green); }
        .btn-save:hover { background: var(--neon-green); color: var(--bg-base); box-shadow: 0 0 10px var(--neon-green); }
        .reset-btn { border-color: var(--neon-pink); color: var(--neon-pink); margin-top: 25px; width: 100%; padding: 12px;}
        .reset-btn:hover { background: var(--neon-pink); color: var(--bg-base); box-shadow: 0 0 15px var(--neon-pink); }

        /* グラフコンテナ */
        .chart-container { width: 100%; height: 220px; margin-bottom: 25px; padding: 15px; border: 1px solid var(--border-dim); border-radius: 5px; background: var(--bg-surface); box-sizing: border-box; }
        
        /* テーブル */
        .table-responsive { width: 100%; overflow-x: auto; border: 1px solid var(--border-dim); border-radius: 5px; }
        table { border-collapse: collapse; width: 100%; font-size: 0.9em; min-width: 900px; background: var(--bg-panel); }
        th, td { border: 1px solid rgba(255, 255, 255, 0.05); padding: 10px; text-align: left; vertical-align: top; }
        th { background-color: var(--bg-surface); color: var(--neon-cyan); position: sticky; top: 0; z-index: 10; font-weight: bold; letter-spacing: 1px; border-bottom: 2px solid var(--neon-cyan); }
        tr { transition: background-color 0.2s; }
        tr:nth-child(even) { background-color: rgba(255, 255, 255, 0.02); }
        tr:hover { background-color: rgba(0, 243, 255, 0.05); }
        
        /* 未提出アラート状態の行 */
        tr.has-missing { background-color: rgba(255, 0, 127, 0.05); }
        tr.has-missing:hover { background-color: rgba(255, 0, 127, 0.1); }
        
        /* 日付タグ */
        .date-tag { display: inline-block; background: rgba(0, 243, 255, 0.1); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 2px 8px; margin: 3px 3px 0 0; border-radius: 12px; font-size: 0.85em; box-shadow: 0 0 5px rgba(0,243,255,0.2); }
        .delete-btn { color: var(--neon-pink); cursor: pointer; margin-left: 6px; font-weight: bold; transition: 0.2s;}
        .delete-btn:hover { text-shadow: 0 0 8px var(--neon-pink); transform: scale(1.2); }
        
        /* バッジ（ドリル・プリント） */
        .drill-container { display: flex; flex-wrap: wrap; gap: 4px; }
        .drill-badge { 
            width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; 
            font-size: 0.8em; border-radius: 4px; background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted); 
            cursor: pointer; user-select: none; transition: 0.2s; font-weight: bold;
        }
        .drill-badge:hover { border-color: var(--text-main); color: var(--text-main); }
        
        /* バッジ状態：提出済 */
        .drill-badge.done { 
            background: rgba(57, 255, 20, 0.15); border-color: var(--neon-green); color: var(--neon-green); 
            box-shadow: 0 0 8px rgba(57, 255, 20, 0.4); 
        }
        /* バッジ状態：未提出（目標範囲内） */
        .drill-badge.missing { 
            background: rgba(255, 0, 127, 0.15); border-color: var(--neon-pink); color: var(--neon-pink); 
            box-shadow: 0 0 8px rgba(255, 0, 127, 0.4); animation: pulse 2s infinite;
        }

        /* アニメーション */
        @keyframes pulse {
            0% { box-shadow: 0 0 5px rgba(255,0,127,0.3); }
            50% { box-shadow: 0 0 12px rgba(255,0,127,0.7); }
            100% { box-shadow: 0 0 5px rgba(255,0,127,0.3); }
        }

        .missing-text { color: var(--neon-pink); font-size: 0.85em; font-weight: bold; line-height: 1.5; text-shadow: 0 0 3px rgba(255,0,127,0.3); }
        .status-complete { color: var(--neon-green); font-weight: bold; text-shadow: 0 0 5px rgba(57,255,20,0.5); }
    </style>
</head>
<body>

<div class="container">
    <h2>SYS.APP // 宿題提出管理</h2>

    <div class="toggle-panel">
        <span style="margin-right: 15px;">MODULES_ACTIVE:</span>
        <label><input type="checkbox" id="show-kanjiNote" onchange="toggleModule()"> 漢字ノート</label>
        <label><input type="checkbox" id="show-reading" onchange="toggleModule()"> 音読カード</label>
        <label><input type="checkbox" id="show-kanjiDrill" onchange="toggleModule()"> 漢字ドリル</label>
        <label><input type="checkbox" id="show-calcDrill" onchange="toggleModule()"> 計算ドリル</label>
        <label><input type="checkbox" id="show-print" onchange="toggleModule()"> プリント</label>
    </div>

    <div class="control-panel" id="main-config-area">
        <div class="config-group basic">
            <h4>[ SYS.CONFIG ]</h4>
            <div style="display: flex; align-items: center; gap: 10px; margin-top: 15px;">
                クラス人数: 
                <input type="number" id="student-count-input" min="1" max="50" style="width:60px;"> 人
                <button class="btn-save" onclick="updateStudentCount()">APPLY</button>
            </div>
        </div>
        <div id="dynamic-config-panel" style="display: contents;"></div>
    </div>

    <div class="action-bar">
        <div style="font-weight: bold; color: var(--neon-cyan); letter-spacing: 1px;">> STATUS_MONITOR</div>
        <button class="btn-print-list" onclick="printMissingList()">[🖨️] EXPORT MISSING_LIST</button>
    </div>

    <div class="chart-container" id="chart-wrapper">
        <canvas id="submissionChart"></canvas>
    </div>

    <div class="table-responsive">
        <table>
            <thead id="table-head"></thead>
            <tbody id="student-list"></tbody>
        </table>
    </div>

    <button class="reset-btn" onclick="clearAllData()">⚠ FORMAT ALL DATA SYSTEM ⚠</button>
</div>

<script>
    // Chart.js のサイバーパンクデフォルト設定
    Chart.defaults.color = '#8b9eb0';
    Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.05)';
    Chart.defaults.font.family = "'Share Tech Mono', monospace";

    let students = [];
    let chartInstance = null;
    const DEFAULT_STUDENT_COUNT = 30;

    const modules = {
        kanjiNote: { id: 'kanjiNote', name: '漢字ノート', type: 'date', active: true },
        reading: { id: 'reading', name: '音読カード', type: 'date', active: true },
        kanjiDrill: { id: 'kanjiDrill', name: '漢字ドリル', type: 'badge', active: true, nums: [], prefix: '漢' },
        calcDrill: { id: 'calcDrill', name: '計算ドリル', type: 'badge', active: true, nums: [], prefix: '計' },
        print: { id: 'print', name: 'プリント', type: 'badge', active: true, nums: [], prefix: 'プ' }
    };

    function initData() {
        const savedModules = JSON.parse(localStorage.getItem('modules9_cyber'));
        if (savedModules) {
            Object.keys(modules).forEach(k => {
                if(savedModules[k]) {
                    modules[k].active = savedModules[k].active;
                    if(modules[k].type === 'badge') modules[k].nums = savedModules[k].nums;
                }
            });
        } else {
            modules.kanjiDrill.nums = [1,2,3,4,5];
            modules.calcDrill.nums = [1,2,3,4,5];
            modules.print.nums = [1,2,3];
        }

        const savedData = localStorage.getItem('homeworkData9_cyber');
        if (savedData) {
            students = JSON.parse(savedData);
        } else {
            for (let i = 1; i <= DEFAULT_STUDENT_COUNT; i++) students.push(createNewStudent(i));
        }

        document.getElementById('student-count-input').value = students.length;
        Object.keys(modules).forEach(k => {
            document.getElementById(`show-${k}`).checked = modules[k].active;
        });

        renderAll();
    }

    function createNewStudent(id) {
        return {
            id: id, name: "",
            kanjiNoteDates: [], readingDates: [],
            kanjiDrillDone: [], calcDrillDone: [], printDone: []
        };
    }

    function updateStudentCount() {
        const newCount = parseInt(document.getElementById('student-count-input').value);
        if (isNaN(newCount) || newCount < 1) return;
        const currentCount = students.length;
        if (newCount > currentCount) {
            for (let i = currentCount + 1; i <= newCount; i++) students.push(createNewStudent(i));
        } else if (newCount < currentCount) {
            if (confirm(`出席番号 ${newCount + 1} 番以降のデータを削除しますか？`)) {
                students = students.slice(0, newCount);
            } else {
                document.getElementById('student-count-input').value = currentCount;
                return;
            }
        }
        saveData(); renderAll();
    }

    function toggleModule() {
        Object.keys(modules).forEach(k => {
            modules[k].active = document.getElementById(`show-${k}`).checked;
        });
        saveData(); renderAll();
    }

    function renderAll() {
        renderConfig();
        renderTable();
    }

    function renderConfig() {
        const panel = document.getElementById('dynamic-config-panel');
        panel.innerHTML = '';

        Object.keys(modules).forEach(k => {
            const mod = modules[k];
            if (!mod.active) return;
            const div = document.createElement('div');
            div.className = 'config-group';

            if (mod.type === 'date') {
                const totalKey = `total-${k}9_cyber`;
                const currentVal = localStorage.getItem(totalKey) || 0;
                div.innerHTML = `<h4>[ ${mod.name} ]</h4>
                <div style="margin-top:10px;">目標総回数: <input type="number" id="${totalKey}" value="${currentVal}" min="0" onchange="saveConfig('${totalKey}', this.value)" style="width:50px;"> 回</div>`;
            } else {
                const targetKey = `target-${k}9_cyber`;
                const currentTarget = localStorage.getItem(targetKey) || 0;
                let selectHtml = `<select id="${targetKey}" onchange="saveConfig('${targetKey}', this.value)"><option value="0">なし</option>`;
                mod.nums.forEach(n => selectHtml += `<option value="${n}" ${n == currentTarget ? 'selected' : ''}>${n}番</option>`);
                selectHtml += `</select>`;
                const maxNum = mod.nums.length > 0 ? Math.max(...mod.nums) : 0;
                div.innerHTML = `
                    <h4>[ ${mod.name} ]</h4>
                    <div class="setting-adjust-row">出題範囲: 
                        <button class="btn-adjust" onclick="adjustNums('${k}', -1)">-</button>
                        <span class="max-num-display">${maxNum}</span>
                        <button class="btn-adjust" onclick="adjustNums('${k}', 1)">+</button>
                    </div>
                    <div>目標設定: ${selectHtml}まで</div>
                `;
            }
            panel.appendChild(div);
        });
    }

    function adjustNums(key, delta) {
        const mod = modules[key];
        if (delta === 1) {
            const nextNum = mod.nums.length > 0 ? Math.max(...mod.nums) + 1 : 1;
            mod.nums.push(nextNum);
        } else if (delta === -1) {
            if (mod.nums.length > 0) mod.nums.pop();
        }
        saveData(); renderAll();
    }

    function saveConfig(key, val) {
        localStorage.setItem(key, val);
        renderTable();
    }

    function saveData() {
        const moduleSettingsToSave = {};
        Object.keys(modules).forEach(k => {
            moduleSettingsToSave[k] = { active: modules[k].active, nums: modules[k].nums || [] };
        });
        localStorage.setItem('modules9_cyber', JSON.stringify(moduleSettingsToSave));
        localStorage.setItem('homeworkData9_cyber', JSON.stringify(students));
    }

    function renderTable() {
        const thead = document.getElementById('table-head');
        const tbody = document.getElementById('student-list');
        let headHtml = `<tr><th style="width: 8%;">ID / NAME</th>`;
        Object.keys(modules).forEach(k => { if (modules[k].active) headHtml += `<th>${modules[k].name}</th>`; });
        headHtml += `<th style="width: 15%;">ERROR_LOG (未提出)</th></tr>`;
        thead.innerHTML = headHtml;
        tbody.innerHTML = '';

        students.forEach((s, idx) => {
            const tr = document.createElement('tr');
            let missingTexts = [];
            let html = `<td>
                <span style="font-size:0.85em;color:var(--text-muted); display:inline-block; margin-bottom:4px;">No.${s.id}</span><br>
                <input type="text" class="name-input" value="${s.name}" placeholder="氏名" onchange="updateName(${idx},this.value)">
            </td>`;

            Object.keys(modules).forEach(k => {
                if (!modules[k].active) return;
                const mod = modules[k];
                if (mod.type === 'date') {
                    const total = parseInt(localStorage.getItem(`total-${k}9_cyber`)) || 0;
                    const list = k === 'kanjiNote' ? s.kanjiNoteDates : s.readingDates;
                    const missed = Math.max(0, total - list.length);
                    if (missed > 0) missingTexts.push(`${mod.name.substring(0,2)}未:${missed}回`);
                    html += `<td>
                        <div style="margin-bottom:6px;">
                            <button class="btn-today" onclick="addDate(${idx}, '${k}')">TODAY</button>
                            <button class="btn-add-past" onclick="addPastDate(${idx}, '${k}')" title="日付を指定して記録">+</button>
                            <span style="font-size:0.85em;margin-left:8px;color:var(--text-muted);">[済:${list.length}]</span>
                        </div>
                        <div>${list.map((d,di)=>`<span class="date-tag">${d}<span class="delete-btn" onclick="delDate(${idx},${di},'${k}')">×</span></span>`).join('')}</div>
                    </td>`;
                } else {
                    const target = parseInt(localStorage.getItem(`target-${k}9_cyber`)) || 0;
                    const listKey = k + 'Done';
                    const list = s[listKey];
                    let missedNums = [];
                    let bHtml = '<div class="drill-container">';
                    mod.nums.forEach(n => {
                        const isDone = list.includes(n);
                        if (!isDone && n <= target) missedNums.push(n);
                        const badgeClass = isDone ? 'done' : (!isDone && n <= target ? 'missing' : '');
                        bHtml += `<span class="drill-badge ${badgeClass}" onclick="toggleBadge(${idx}, ${n}, '${listKey}')" title="${mod.name} ${n}番">${n}</span>`;
                    });
                    bHtml += '</div>';
                    if (missedNums.length > 0) missingTexts.push(`${mod.prefix}:${missedNums.join(',')}`);
                    html += `<td>${bHtml}</td>`;
                }
            });

            if (missingTexts.length > 0) {
                tr.className = 'has-missing';
                html += `<td class="missing-text">> ${missingTexts.join('<br>> ')}</td>`;
            } else {
                html += `<td><span class="status-complete">ALL CLEAR</span></td>`;
            }
            tr.innerHTML = html;
            tbody.appendChild(tr);
        });
        updateChart();
    }

    function addPastDate(idx, type) {
        const val = window.prompt("提出した日付を入力してください（例: 4/25）", "");
        if (val) {
            const list = type === 'kanjiNote' ? students[idx].kanjiNoteDates : students[idx].readingDates;
            if (!list.includes(val)) {
                list.push(val);
                list.sort((a, b) => {
                    const [am, ad] = a.split('/').map(Number);
                    const [bm, bd] = b.split('/').map(Number);
                    return am !== bm ? am - bm : ad - bd;
                });
                saveData(); renderTable();
            }
        }
    }

    function addDate(idx, type) {
        const d = new Date(); const f = `${d.getMonth()+1}/${d.getDate()}`;
        const list = type === 'kanjiNote' ? students[idx].kanjiNoteDates : students[idx].readingDates;
        if (!list.includes(f)) { list.push(f); saveData(); renderTable(); }
    }

    function delDate(sIdx, dIdx, type) {
        if(confirm('この記録をDELETEしますか？')){
            const list = type === 'kanjiNote' ? students[sIdx].kanjiNoteDates : students[sIdx].readingDates;
            list.splice(dIdx,1); saveData(); renderTable();
        }
    }

    function toggleBadge(sIdx, num, listKey) {
        const list = students[sIdx][listKey];
        const index = list.indexOf(num);
        if (index > -1) list.splice(index, 1); else { list.push(num); list.sort((a,b)=>a-b); }
        saveData(); renderTable();
    }

    function updateName(i, v) { students[i].name = v; saveData(); renderTable(); }

    function updateChart() {
        const wrapper = document.getElementById('chart-wrapper');
        const ctx = document.getElementById('submissionChart').getContext('2d');
        if (!modules.kanjiNote.active && !modules.reading.active) { wrapper.style.display = 'none'; return; }
        wrapper.style.display = 'block';
        const labels = students.map(s => s.name || 'No.'+s.id);
        let datasets = [];
        
        // ネオンカラーをChart.jsに適用
        if (modules.kanjiNote.active) datasets.push({ 
            label: '漢字ノート', 
            data: students.map(s => s.kanjiNoteDates.length), 
            backgroundColor: 'rgba(0, 243, 255, 0.7)',
            borderColor: '#00f3ff',
            borderWidth: 1
        });
        if (modules.reading.active) datasets.push({ 
            label: '音読カード', 
            data: students.map(s => s.readingDates.length), 
            backgroundColor: 'rgba(57, 255, 20, 0.7)',
            borderColor: '#39ff14',
            borderWidth: 1
        });
        
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: { labels: labels, datasets: datasets },
            options: { 
                responsive: true, maintainAspectRatio: false, 
                scales: { 
                    y: { beginAtZero:true, ticks: { stepSize:1 } },
                    x: { grid: { display: false } }
                },
                plugins: {
                    legend: { labels: { color: '#e0e6ed' } }
                }
            }
        });
    }

    function printMissingList() {
        let missingData = [];
        students.forEach((s) => {
            let missingTexts = [];
            Object.keys(modules).forEach(k => {
                if (!modules[k].active) return;
                const mod = modules[k];
                if (mod.type === 'date') {
                    const total = parseInt(localStorage.getItem(`total-${k}9_cyber`)) || 0;
                    const list = k === 'kanjiNote' ? s.kanjiNoteDates : s.readingDates;
                    const missed = Math.max(0, total - list.length);
                    if (missed > 0) missingTexts.push(`【${mod.name}】あと ${missed} 回`);
                } else {
                    const target = parseInt(localStorage.getItem(`target-${k}9_cyber`)) || 0;
                    const listKey = k + 'Done';
                    const list = s[listKey];
                    let missedNums = [];
                    mod.nums.forEach(n => { if (!list.includes(n) && n <= target) missedNums.push(`${n}番`); });
                    if (missedNums.length > 0) missingTexts.push(`【${mod.name}】${missedNums.join(', ')}`);
                }
            });
            if (missingTexts.length > 0) missingData.push({ id: s.id, name: s.name || '未設定', missing: missingTexts });
        });
        
        if (missingData.length === 0) { alert("SYSTEM MSG: 未提出の児童はいません。ALL CLEAR."); return; }
        
        const printWindow = window.open('', '_blank');
        const today = new Date();
        const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
        
        // 印刷用は視認性（エコ）を考慮して白黒・モノトーンに
        let printHtml = `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>未提出者リスト</title>
        <style>
            body { font-family: sans-serif; padding: 20px; color: #000; background: #fff; } 
            table { width: 100%; border-collapse: collapse; margin-top: 20px; } 
            th, td { border: 1px solid #333; padding: 10px; text-align: left; } 
            th { background: #eee; }
            h1 { border-bottom: 2px solid #000; padding-bottom: 10px; }
        </style></head>
        <body>
            <h1>宿題 未提出者リスト [DATE: ${dateStr}]</h1>
            <table><thead><tr><th style="width:10%;">番号</th><th style="width:20%;">氏名</th><th>未提出内容</th></tr></thead><tbody>`;
        
        missingData.forEach(d => { printHtml += `<tr><td>${d.id}</td><td>${d.name}</td><td>${d.missing.join('<br>')}</td></tr>`; });
        printHtml += `</tbody></table><script>window.onload = function() { window.print(); window.close(); };<\/script></body></html>`;
        printWindow.document.write(printHtml); printWindow.document.close();
    }

    function clearAllData() { 
        if (confirm('!!! WARNING !!!\nすべてのローカルデータを完全に消去します。\nよろしいですか？')) { 
            localStorage.removeItem('modules9_cyber');
            localStorage.removeItem('homeworkData9_cyber');
            // 既存の設定キーも削除する場合
            Object.keys(modules).forEach(k => {
                localStorage.removeItem(`total-${k}9_cyber`);
                localStorage.removeItem(`target-${k}9_cyber`);
            });
            location.reload(); 
        } 
    }
    
    window.onload = initData;
</script>

</body>

<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>音楽係</title>
    <meta name="viewport" content="width=device-width"><link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">

  <body>
  <!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音響・音楽制御モジュール</title>
  <style>
    :root {
      --bg-dark: #0f0515;
      --card-bg: rgba(25, 10, 35, 0.7);
      --card-border: rgba(255, 0, 170, 0.3);
      --cyan: #00f3ff;
      --cyan-glow: rgba(0, 243, 255, 0.5);
      --magenta: #ff00aa;
      --magenta-glow: rgba(255, 0, 170, 0.6);
      --green: #00ff88;
      --green-glow: rgba(0, 255, 136, 0.5);
      --text-main: #ffffff;
      --text-sub: #aa99bb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      transition: background-color 0.5s;
    }

    /* 背景アニメーション用キャンバス */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(circle at center, #150520 0%, #05010a 100%);
    }

    /* フリガナ（ルビ）の制御 */
    rt {
      opacity: 0;
      font-size: 0;
      transition: all 0.3s ease;
      line-height: 0;
      display: block;
      text-align: center;
    }

    ruby {
      ruby-align: center;
    }

    body.hiragana-mode rt {
      opacity: 1;
      font-size: 0.65em;
      line-height: 1;
      color: var(--cyan);
      margin-bottom: 2px;
    }

    body.hiragana-mode ruby {
      margin: 0 2px;
    }

    /* 上部ナビゲーション */
    .top-nav {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 12px 20px;
      background: rgba(15, 5, 25, 0.8);
      border: 1px solid var(--magenta);
      border-radius: 30px;
      box-shadow: 0 0 15px rgba(255, 0, 170, 0.2);
      backdrop-filter: blur(5px);
      z-index: 10;
      flex-wrap: wrap;
      gap: 15px;
      transition: all 0.3s;
    }

    body.hiragana-mode .top-nav {
      border-color: var(--cyan);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }

    .nav-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: transparent;
      color: var(--text-sub);
      border: 1px solid var(--text-sub);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      transition: all 0.3s;
    }

    .nav-btn.active {
      background: rgba(255, 0, 170, 0.15);
      color: var(--magenta);
      border-color: var(--magenta);
      box-shadow: 0 0 10px var(--magenta-glow);
    }

    body.hiragana-mode .nav-btn.active {
      background: rgba(0, 243, 255, 0.15);
      color: var(--cyan);
      border-color: var(--cyan);
      box-shadow: 0 0 10px var(--cyan-glow);
    }

    .nav-btn:hover:not(.active) {
      color: var(--text-main);
      border-color: var(--text-main);
    }

    .lang-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lang-label {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--text-sub);
      transition: color 0.3s;
    }

    .active-lang {
      color: var(--magenta);
      text-shadow: 0 0 8px var(--magenta-glow);
    }

    body.hiragana-mode .active-lang {
      color: var(--cyan);
      text-shadow: 0 0 8px var(--cyan-glow);
    }

    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      background: rgba(255, 0, 170, 0.1);
      border: 1px solid var(--magenta);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .toggle-knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      background: var(--magenta);
      border-radius: 50%;
      transition: all 0.3s;
      box-shadow: 0 0 8px var(--magenta-glow);
    }

    body.hiragana-mode .toggle-switch {
      border-color: var(--cyan);
      background: rgba(0, 243, 255, 0.1);
    }

    body.hiragana-mode .toggle-knob {
      left: 22px;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan-glow);
    }

    .screen-container {
      width: 100%;
      max-width: 1000px;
      display: none;
      flex-direction: column;
      align-items: center;
      z-index: 1;
      animation: fadeIn 0.4s ease-out;
    }

    .screen-container.active {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ヘッダー */
    .header {
      text-align: center;
      margin-bottom: 40px;
      width: 100%;
    }

    h1 {
      font-size: 2.2rem;
      color: var(--text-main);
      text-shadow: 0 0 10px var(--magenta-glow), 0 0 20px var(--magenta-glow);
      margin-bottom: 15px;
      letter-spacing: 2px;
      transition: all 0.3s;
    }

    body.hiragana-mode h1 {
      text-shadow: 0 0 10px var(--cyan-glow), 0 0 20px var(--cyan-glow);
    }

    #date-display {
      font-size: 1.1rem;
      color: var(--magenta);
      background: rgba(255, 0, 170, 0.1);
      border: 1px solid var(--magenta);
      display: inline-block;
      padding: 6px 20px;
      border-radius: 30px;
      box-shadow: 0 0 15px rgba(255, 0, 170, 0.2);
      transition: all 0.3s;
    }

    body.hiragana-mode #date-display {
      color: var(--cyan);
      background: rgba(0, 243, 255, 0.1);
      border-color: var(--cyan);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }

    /* メイン画面：タスクリスト */
    #task-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .task-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 25px;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
    }

    .task-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--magenta);
      box-shadow: 0 0 10px var(--magenta);
      transition: all 0.3s;
    }

    body.hiragana-mode .task-card::before {
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
    }

    .task-card.done-card::before {
      background: var(--green);
      box-shadow: 0 0 15px var(--green);
    }

    .card-header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .icon-box {
      width: 50px;
      height: 50px;
      background: rgba(255, 0, 170, 0.1);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      border: 1px solid rgba(255, 0, 170, 0.3);
      margin-right: 15px;
    }

    body.hiragana-mode .icon-box {
      background: rgba(0, 243, 255, 0.1);
      border-color: rgba(0, 243, 255, 0.3);
    }

    .task-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--text-main);
    }

    .task-person {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-top: 5px;
    }

    .person-name {
      color: var(--magenta);
      font-weight: bold;
    }

    body.hiragana-mode .person-name {
      color: var(--cyan);
    }

    .done-card .person-name {
      color: var(--green);
    }

    .check-btn {
      width: 100%;
      font-size: 1rem;
      font-weight: bold;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: auto;
    }

    .btn-not-done {
      background: transparent;
      border: 1px solid var(--magenta);
      color: var(--magenta);
    }

    body.hiragana-mode .btn-not-done {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .btn-done {
      background: rgba(0, 255, 136, 0.15);
      border: 1px solid var(--green);
      color: var(--green);
      box-shadow: 0 0 15px var(--green-glow);
    }

    .btn-disabled {
      background: transparent;
      border: 1px dashed var(--text-sub);
      color: var(--text-sub);
      cursor: not-allowed;
    }

    /* 記録エリア */
    .record-area {
      width: 100%;
      max-width: 800px;
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .save-btn {
      background: transparent;
      color: var(--magenta);
      border: 2px solid var(--magenta);
      font-size: 1.2rem;
      font-weight: bold;
      padding: 15px 40px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 170, 0.3);
      margin-bottom: 30px;
      transition: all 0.3s;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    body.hiragana-mode .save-btn {
      color: var(--cyan);
      border-color: var(--cyan);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }

    .save-btn:hover {
      transform: scale(1.05);
    }

    /* 履歴ボックス */
    #history-box {
      background: rgba(15, 5, 25, 0.8);
      border: 1px solid rgba(255, 0, 85, 0.3);
      border-left: 4px solid #ff0055;
      border-radius: 8px;
      padding: 20px;
      width: 100%;
      text-align: left;
      font-family: 'Consolas', 'Courier New', monospace;
    }

    #history-alert-title {
      margin-top: 0;
      font-size: 1.1rem;
      color: #ff0055;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .history-item {
      font-size: 0.95rem;
      color: #cccccc;
      padding: 10px 0;
      border-bottom: 1px dashed rgba(255, 0, 85, 0.2);
      line-height: 1.6;
    }

    .history-item strong {
      color: var(--text-main);
    }

    .history-item:last-child {
      border-bottom: none;
    }

    /* 評価マトリクス画面 */
    .stats-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .stat-name {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--magenta);
    }

    body.hiragana-mode .stat-name {
      color: var(--cyan);
    }

    .stat-numbers {
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    .stat-bar-bg {
      width: 100%;
      height: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
    }

    .stat-bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 1s ease-out;
    }

    .stat-perfect {
      border-color: var(--green);
      box-shadow: 0 0 15px var(--green-glow);
    }

    .stat-perfect .stat-name {
      color: var(--green);
    }

    /* 設定画面 */
    .settings-section {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--magenta);
      padding: 25px;
      border-radius: 16px;
      margin-bottom: 25px;
    }

    body.hiragana-mode .settings-section {
      border-color: var(--cyan);
    }

    .settings-title {
      color: var(--magenta);
      font-size: 1.3rem;
      border-bottom: 1px solid rgba(255, 0, 170, 0.3);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    body.hiragana-mode .settings-title {
      color: var(--cyan);
      border-bottom-color: rgba(0, 243, 255, 0.3);
    }

    .role-setup-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .role-input-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .role-input {
      flex: 1;
      padding: 10px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--text-sub);
      color: var(--text-main);
      border-radius: 6px;
    }

    .role-input:focus {
      outline: none;
      border-color: var(--magenta);
    }

    body.hiragana-mode .role-input:focus {
      border-color: var(--cyan);
    }

    .table-wrapper {
      overflow-x: auto;
      margin-top: 15px;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    .data-table th,
    .data-table td {
      border: 1px solid rgba(255, 0, 170, 0.2);
      padding: 10px;
      text-align: center;
    }

    body.hiragana-mode .data-table th,
    body.hiragana-mode .data-table td {
      border-color: rgba(0, 243, 255, 0.2);
    }

    .data-table th {
      background: rgba(255, 0, 170, 0.1);
      color: var(--magenta);
    }

    body.hiragana-mode .data-table th {
      background: rgba(0, 243, 255, 0.1);
      color: var(--cyan);
    }

    .cell-input {
      width: 90%;
      padding: 6px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--text-sub);
      color: white;
      text-align: center;
      border-radius: 4px;
    }

    .cell-input:focus {
      border-color: var(--magenta);
      outline: none;
    }

    body.hiragana-mode .cell-input:focus {
      border-color: var(--cyan);
    }

    .action-btn {
      padding: 12px 30px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      background: rgba(255, 0, 170, 0.15);
      color: var(--magenta);
      border: 1px solid var(--magenta);
    }

    body.hiragana-mode .action-btn {
      background: rgba(0, 243, 255, 0.15);
      color: var(--cyan);
      border-color: var(--cyan);
    }

    .action-btn:hover {
      box-shadow: 0 0 15px var(--magenta-glow);
    }

    body.hiragana-mode .action-btn:hover {
      box-shadow: 0 0 15px var(--cyan-glow);
    }

    .danger-btn {
      background: rgba(255, 0, 85, 0.1);
      color: #ff0055;
      border: 1px solid #ff0055;
      font-size: 0.85rem;
      padding: 8px 15px;
      margin-top: 10px;
    }

    .del-role-btn {
      background: rgba(255, 0, 85, 0.2);
      color: #ff0055;
      border: 1px solid #ff0055;
      border-radius: 6px;
      padding: 8px;
      cursor: pointer;
    }

    .del-role-btn:hover {
      background: rgba(255, 0, 85, 0.4);
    }
  </style>
</head>

<body>

  <canvas id="bg-canvas"></canvas>

  <!-- 上部ナビゲーション -->
  <div class="top-nav">
    <div class="nav-buttons">
      <button class="nav-btn active" id="nav-main" onclick="switchTab('main')">💻 ミッション</button>
      <button class="nav-btn" id="nav-stats" onclick="switchTab('stats')">📊 評価マトリクス</button>
      <button class="nav-btn" id="nav-settings" onclick="switchTab('settings')">⚙️ システム設定</button>
    </div>
    <div class="lang-toggle">
      <span class="lang-label active-lang" id="label-kanji">漢字</span>
      <div class="toggle-switch" onclick="toggleLanguage()">
        <div class="toggle-knob"></div>
      </div>
      <span class="lang-label" id="label-hiragana">ひらがな</span>
    </div>
  </div>

  <!-- ================= メイン画面 ================= -->
  <div id="screen-main" class="screen-container active">
    <div class="header">
      <h1 id="title-main">音響・音楽制御モジュール</h1>
      <div id="date-display"></div>
    </div>

    <div id="task-list"></div>

    <div class="record-area">
      <button class="save-btn" id="btn-record" onclick="saveAndReset()">▶ ミッションログを記録して終了する</button>

      <div id="history-box">
        <h2 id="history-alert-title"><span style="font-size: 1.4rem;">⚠️</span> SYSTEM ALERT: ミッション履歴</h2>
        <div id="history-list"></div>
      </div>
    </div>
  </div>

  <!-- ================= 評価マトリクス画面 ================= -->
  <div id="screen-stats" class="screen-container">
    <div class="header">
      <h1 id="title-stats">クルー評価マトリクス</h1>
      <p style="color: var(--text-sub);" id="desc-stats">> 各クルーのミッション達成率を可視化しています。</p>
    </div>
    <div class="stats-container" id="stats-list"></div>
  </div>

  <!-- ================= 設定画面 ================= -->
  <div id="screen-settings" class="screen-container">
    <div class="header">
      <h1 id="title-settings">システム構造定義（管理者用）</h1>
    </div>

    <!-- 役割の設定（動的に増減可能） -->
    <div class="settings-section">
      <h2 class="settings-title" id="title-role-setup">📝 ミッションの定義</h2>
      <p style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 15px;" id="desc-role-setup">
        > 音楽係の人数に合わせて役割を追加・削除できます。（例：終わりの歌、楽器の片付け など）
      </p>
      <div class="role-setup-grid" id="role-setup-container"></div>
      <button class="action-btn" style="margin-top: 15px; padding: 8px 15px; font-size: 0.9rem;" onclick="addRole()">+ その他の役割を追加</button>
    </div>

    <!-- スケジュールの設定 -->
    <div class="settings-section">
      <h2 class="settings-title" id="title-schedule-setup">📅 スケジュール・データベース</h2>
      <p style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 15px;" id="desc-schedule-setup">
        > 誰がいつ担当するか入力してください。「なし」や「OFFLINE」でスキップできます。
      </p>
      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr id="schedule-thead-tr">
              <!-- JSで動的生成 -->
            </tr>
          </thead>
          <tbody id="schedule-tbody">
            <!-- JSで動的生成 -->
          </tbody>
        </table>
      </div>
    </div>

    <button class="action-btn" id="btn-save-config" onclick="saveConfiguration()">💾 データベースを上書き保存する</button>

    <!-- データリセット -->
    <div style="margin-top: 40px; text-align: center; border-top: 1px dashed var(--text-sub); padding-top: 20px; width: 100%;">
      <p style="color: var(--text-sub); font-size: 0.85rem;" id="desc-reset">> 評価データ（達成率）をすべてゼロに戻す場合は以下を実行してください。</p>
      <button class="action-btn danger-btn" id="btn-reset-stats" onclick="resetStats()">⚠️ 評価データを初期化</button>
    </div>
  </div>

  <script>
    // --- 初期データ構造（音楽係用） ---
    const defaultRoles = [{
        id: "task1",
        name: "朝の歌の準備",
        icon: "🎵"
      },
      {
        id: "task2",
        name: "音楽室の移動誘導",
        icon: "🚶"
      },
      {
        id: "task3",
        name: "指揮者",
        icon: "🎼"
      }
    ];
    // 2~3人を想定したデフォルト配置
    const defaultSchedule = {
      "月": {
        task1: "Aさん",
        task2: "Bさん",
        task3: "Cさん"
      },
      "火": {
        task1: "Cさん",
        task2: "Aさん",
        task3: "Bさん"
      },
      "水": {
        task1: "Bさん",
        task2: "Cさん",
        task3: "Aさん"
      },
      "木": {
        task1: "Aさん",
        task2: "Bさん",
        task3: "なし"
      }, // 2人の日の例
      "金": {
        task1: "Cさん",
        task2: "Aさん",
        task3: "なし"
      },
      "土": {},
      "日": {}
    };
    // --- データ読み込み ---
    let appConfig = JSON.parse(localStorage.getItem('musicDutyConfig')) || {
      roles: defaultRoles,
      schedule: defaultSchedule
    };
    let appStats = JSON.parse(localStorage.getItem('musicDutyStats')) || {};
    let historyData = JSON.parse(localStorage.getItem('musicDutyHistory')) || [];
    let currentMode = localStorage.getItem('musicDutyLang') || 'kanji';
    let taskState = {};
    const daysKey = ["日", "月", "火", "水", "木", "金", "土"];
    const today = new Date();
    const dayOfWeekKey = daysKey[today.getDay()];
    let todaysAssigns = appConfig.schedule[dayOfWeekKey] || {};
    // --- 言語ディクショナリ ---
    const i18n = {
      kanji: {
        navMain: "💻 ミッション",
        navStats: "📊 評価マトリクス",
        navSettings: "⚙️ システム設定",
        titleMain: "音響・音楽制御モジュール",
        btnRecord: "▶ ミッションログを記録して終了する",
        titleStats: "クルー評価マトリクス",
        descStats: "> 各クルーのミッション達成率を可視化しています。",
        titleSettings: "システム構造定義（管理者用）",
        titleRole: "📝 ミッションの定義",
        descRole: "> 音楽係の人数に合わせて役割を追加・削除できます。（例：終わりの歌、楽器の片付け など）",
        titleSch: "📅 スケジュール・データベース",
        descSch: "> 誰がいつ担当するか入力してください。「なし」や「OFFLINE」でスキップできます。",
        btnSaveConfig: "💾 データベースを上書き保存する",
        descReset: "> 評価データ（達成率）をすべてゼロに戻す場合は以下を実行してください。",
        btnReset: "⚠️ 評価データを初期化",
        dayNames: ["日", "月", "火", "水", "木", "金", "土"],
        operator: "担当",
        none: "なし",
        btnCheck: "実行する ▶",
        btnDone: "システム完了！",
        msgOffline: "本日のシステムはオフライン（お休み）です。",
        sysOffline: "SYSTEM OFFLINE",
        msgMissed: "[未完了]",
        msgSuccess: "[SUCCESS] 全ミッションが正常に完了しました。",
        historyTitle: "SYSTEM ALERT: ミッション履歴",
        msgNoLog: "> ログデータがありません。正常稼働中です。",
        msgSaved: "ミッションログと評価データを記録しました！",
        msgConfigSaved: "システム設定を保存しました。",
        msgReset: "評価データをすべて初期化しました。"
      },
      hiragana: {
        navMain: "💻 ミッション",
        navStats: "📊 みんなの がんばり",
        navSettings: "⚙️ せってい（せんせい）",
        titleMain: "おんがくがかり ミッション・コントロール",
        btnRecord: "▶ ミッションログをきろくして おわる",
        titleStats: "クルー がんばりデータ",
        descStats: "> みんなが どれくらい ミッションを できたか わかります。",
        titleSettings: "システム せってい（せんせいよう）",
        titleRole: "📝 ミッションの なまえを きめる",
        descRole: "> かかりの にんずうに あわせて、やくわりを ふやしたり へらしたり できます。",
        titleSch: "📅 １しゅうかんの よてい",
        descSch: "> だれが いつ やるか いれてください。「なし」や「おやすみ」で おやすみに なります。",
        btnSaveConfig: "💾 データベースを うわがきする",
        descReset: "> がんばりデータを ぜんぶ ゼロに もどすときは ここを おしてください。",
        btnReset: "⚠️ データを ゼロに 戻す",
        dayNames: ["にち", "げつ", "か", "すい", "もく", "きん", "ど"],
        operator: "たんとう",
        none: "なし",
        btnCheck: "かくにんする ▶",
        btnDone: "ミッションかんりょう！",
        msgOffline: "ほんじつの システムは オフライン（おやすみ）です。",
        sysOffline: "おやすみ",
        msgMissed: "[みかんりょう]",
        msgSuccess: "[SUCCESS] すべての ミッションが かんりょう しました。",
        historyTitle: "SYSTEM ALERT: これまでの きろく",
        msgNoLog: "> ログデータが ありません。",
        msgSaved: "ミッションログを きろくしました！",
        msgConfigSaved: "せっていを ほぞんしました。",
        msgReset: "がんばりデータを ぜんぶ ゼロに もどしました。"
      }
    };

    function switchTab(tabId) {
      document.querySelectorAll('.screen-container').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(`screen-${tabId}`).classList.add('active');
      document.getElementById(`nav-${tabId}`).classList.add('active');
      if (tabId === 'main') renderMain();
      if (tabId === 'stats') renderStats();
      if (tabId === 'settings') renderSettings();
    }

    function renderMain() {
      const t = i18n[currentMode];
      const taskListDiv = document.getElementById('task-list');
      taskListDiv.innerHTML = "";
      let activeTaskCount = 0;
      appConfig.roles.forEach(role => {
        // Hiragana translation fallback for default roles if needed (optional, keeping it simple by displaying what's saved)
        let displayName = role.name;
        if (currentMode === 'hiragana') {
          if (role.id === 'task1' && role.name === "朝の歌の準備") displayName = "あさのうたの じゅんび";
          if (role.id === 'task2' && role.name === "音楽室の移動誘導") displayName = "おんがくしつへの いどう";
          if (role.id === 'task3' && role.name === "指揮者") displayName = "しきしゃ・ばんそう";
        }
        if (!role.name.trim()) return;
        activeTaskCount++;
        const person = todaysAssigns[role.id] || t.none;
        const isOffline = person === t.none || person.toUpperCase() === "OFFLINE" || person === "おやすみ" || person === "なし";
        if (taskState[role.id] === undefined) taskState[role.id] = false;
        const isDone = taskState[role.id];
        const btnText = isOffline ? t.sysOffline : (isDone ? t.btnDone : t.btnCheck);
        const btnClass = isOffline ? 'btn-disabled' : (isDone ? 'btn-done' : 'btn-not-done');
        const cardHTML = `
          <div class="task-card ${isDone ? 'done-card' : ''}" style="opacity: ${isOffline ? 0.4 : 1}">
            <div class="card-header">
              <div class="icon-box">${role.icon || "🎵"}</div>
              <div>
                <div class="task-title">${displayName}</div>
                <div class="task-person">${t.operator}: <span class="person-name">${isOffline ? t.none : person}</span></div>
              </div>
            </div>
            <button class="check-btn ${btnClass}" onclick="toggleTask('${role.id}', ${isOffline})" ${isOffline ? 'disabled' : ''}>
              ${btnText}
            </button>
          </div>
        `;
        taskListDiv.insertAdjacentHTML('beforeend', cardHTML);
      });
      if (activeTaskCount === 0) {
        taskListDiv.innerHTML = `<p style="color: var(--text-sub);">※ 現在、設定されているミッションがありません。</p>`;
      }
      renderHistory();
    }
    window.toggleTask = function(taskId, isOffline) {
      if (isOffline) return;
      taskState[taskId] = !taskState[taskId];
      renderMain();
    };

    function renderHistory() {
      const t = i18n[currentMode];
      const historyListDiv = document.getElementById('history-list');
      if (historyData.length === 0) {
        historyListDiv.innerHTML = `<div class="history-item">${t.msgNoLog}</div>`;
        return;
      }
      historyListDiv.innerHTML = "";
      [...historyData].reverse().forEach(record => {
        historyListDiv.insertAdjacentHTML('beforeend', `<div class="history-item">> ${record.replace(/\n/g, '<br>> ')}</div>`);
      });
    }
    window.saveAndReset = function() {
      const t = i18n[currentMode];
      let hasTaskToday = false;
      let missedTasks = [];
      appConfig.roles.forEach(role => {
        if (!role.name.trim()) return;
        const person = todaysAssigns[role.id];
        if (person && person !== "なし" && person !== "おやすみ" && person.toUpperCase() !== "OFFLINE") {
          hasTaskToday = true;
          if (!appStats[person]) appStats[person] = {
            total: 0,
            done: 0
          };
          appStats[person].total++;
          if (taskState[role.id]) {
            appStats[person].done++;
          } else {
            let displayName = role.name;
            if (currentMode === 'hiragana') {
              if (role.id === 'task1' && role.name === "朝の歌の準備") displayName = "あさのうたの じゅんび";
              if (role.id === 'task2' && role.name === "音楽室の移動誘導") displayName = "おんがくしつへの いどう";
              if (role.id === 'task3' && role.name === "指揮者") displayName = "しきしゃ・ばんそう";
            }
            missedTasks.push(`${t.msgMissed} ${displayName} (${t.operator}: ${person})`);
          }
        }
      });
      if (!hasTaskToday) {
        alert(t.msgOffline);
        return;
      }
      const y = today.getFullYear();
      const m = String(today.getMonth() + 1).padStart(2, '0');
      const d = String(today.getDate()).padStart(2, '0');
      const dateStringLog = `${y}.${m}.${d}`;
      if (missedTasks.length > 0) {
        const recordString = `<strong>[LOG: ${dateStringLog}]</strong>\n` + missedTasks.join('\n');
        historyData.push(recordString);
      } else {
        historyData.push(`<strong>[LOG: ${dateStringLog}]</strong>\n${t.msgSuccess}`);
      }
      localStorage.setItem('musicDutyStats', JSON.stringify(appStats));
      localStorage.setItem('musicDutyHistory', JSON.stringify(historyData));
      appConfig.roles.forEach(role => taskState[role.id] = false);
      alert(t.msgSaved);
      renderMain();
    };

    function renderStats() {
      const container = document.getElementById('stats-list');
      container.innerHTML = "";
      const persons = Object.keys(appStats);
      if (persons.length === 0) {
        container.innerHTML = `<p style="color: var(--text-sub); text-align:center;">> データがありません。</p>`;
        return;
      }
      persons.sort((a, b) => {
        const rateA = appStats[a].total > 0 ? (appStats[a].done / appStats[a].total) : 0;
        const rateB = appStats[b].total > 0 ? (appStats[b].done / appStats[b].total) : 0;
        return rateB - rateA;
      });
      persons.forEach(person => {
        const stat = appStats[person];
        const rate = stat.total > 0 ? Math.round((stat.done / stat.total) * 100) : 0;
        let barColor = 'var(--magenta)';
        let shadow = 'var(--magenta-glow)';
        let isPerfect = false;
        if (currentMode === 'hiragana') {
          barColor = 'var(--cyan)';
          shadow = 'var(--cyan-glow)';
        }
        if (rate === 100 && stat.total >= 1) {
          barColor = 'var(--green)';
          shadow = 'var(--green-glow)';
          isPerfect = true;
        } else if (rate < 50) {
          barColor = '#ff0055';
          shadow = 'rgba(255,0,85,0.5)';
        }
        const html = `
          <div class="stat-card ${isPerfect ? 'stat-perfect' : ''}">
            <div class="stat-header">
              <span class="stat-name">${person}</span>
              <span class="stat-numbers">達成: ${stat.done} / 割当: ${stat.total} ( <strong>${rate}%</strong> )</span>
            </div>
            <div class="stat-bar-bg">
              <div class="stat-bar-fill" style="width: ${rate}%; background: ${barColor}; box-shadow: 0 0 10px ${shadow};"></div>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
      });
    }
    window.addRole = function() {
      const newId = 'task' + Date.now();
      appConfig.roles.push({
        id: newId,
        name: "",
        icon: "🎵"
      });
      renderSettings();
    };
    window.removeRole = function(id) {
      if (confirm("この役割を削除しますか？")) {
        appConfig.roles = appConfig.roles.filter(r => r.id !== id);
        renderSettings();
      }
    };

    function renderSettings() {
      const roleContainer = document.getElementById('role-setup-container');
      roleContainer.innerHTML = "";
      appConfig.roles.forEach((role, index) => {
        roleContainer.insertAdjacentHTML('beforeend', `
          <div class="role-input-group">
            <span style="color: var(--cyan); width: 60px;">役割${index + 1}</span>
            <input type="text" class="role-input" id="cfg-icon-${role.id}" value="${role.icon}" style="max-width: 60px;" placeholder="絵文字">
            <input type="text" class="role-input" id="cfg-name-${role.id}" value="${role.name}" placeholder="ミッションの名前">
            <button class="del-role-btn" onclick="removeRole('${role.id}')">✖</button>
          </div>
        `);
      });
      const theadTr = document.getElementById('schedule-thead-tr');
      theadTr.innerHTML = "<th>CYCLE</th>";
      appConfig.roles.forEach((role, index) => {
        theadTr.insertAdjacentHTML('beforeend', `<th>${role.name || `役割${index+1}`}</th>`);
      });
      const tbody = document.getElementById('schedule-tbody');
      tbody.innerHTML = "";
      const daysList = ["月", "火", "水", "木", "金"];
      daysList.forEach(day => {
        let trHTML = `<tr><td style="font-weight: bold; color: inherit;">${day}</td>`;
        appConfig.roles.forEach(role => {
          const val = (appConfig.schedule[day] && appConfig.schedule[day][role.id]) ? appConfig.schedule[day][role.id] : "";
          trHTML += `<td><input type="text" class="cell-input" id="cfg-sch-${day}-${role.id}" value="${val}" placeholder="なし"></td>`;
        });
        trHTML += `</tr>`;
        tbody.insertAdjacentHTML('beforeend', trHTML);
      });
    }
    window.saveConfiguration = function() {
      const t = i18n[currentMode];
      appConfig.roles.forEach(role => {
        const iconInput = document.getElementById(`cfg-icon-${role.id}`);
        const nameInput = document.getElementById(`cfg-name-${role.id}`);
        if (iconInput) role.icon = iconInput.value || "🎵";
        if (nameInput) role.name = nameInput.value;
      });
      const daysList = ["月", "火", "水", "木", "金"];
      daysList.forEach(day => {
        if (!appConfig.schedule[day]) appConfig.schedule[day] = {};
        appConfig.roles.forEach(role => {
          const cellInput = document.getElementById(`cfg-sch-${day}-${role.id}`);
          if (cellInput) {
            appConfig.schedule[day][role.id] = cellInput.value;
          }
        });
      });
      localStorage.setItem('musicDutyConfig', JSON.stringify(appConfig));
      todaysAssigns = appConfig.schedule[dayOfWeekKey] || {};
      alert(t.msgConfigSaved);
      applyLanguage();
    };
    window.resetStats = function() {
      const t = i18n[currentMode];
      if (confirm(t.descReset + "\n本当によろしいですか？")) {
        appStats = {};
        localStorage.setItem('musicDutyStats', JSON.stringify(appStats));
        alert(t.msgReset);
        renderSettings();
      }
    }

    function toggleLanguage() {
      currentMode = currentMode === 'kanji' ? 'hiragana' : 'kanji';
      localStorage.setItem('musicDutyLang', currentMode);
      applyLanguage();
    }

    function applyLanguage() {
      const t = i18n[currentMode];
      if (currentMode === 'hiragana') {
        document.body.classList.add('hiragana-mode');
        document.getElementById('label-hiragana').classList.add('active-lang');
        document.getElementById('label-kanji').classList.remove('active-lang');
      } else {
        document.body.classList.remove('hiragana-mode');
        document.getElementById('label-kanji').classList.add('active-lang');
        document.getElementById('label-hiragana').classList.remove('active-lang');
      }
      document.getElementById('nav-main').innerText = t.navMain;
      document.getElementById('nav-stats').innerText = t.navStats;
      document.getElementById('nav-settings').innerText = t.navSettings;
      document.getElementById('title-main').innerText = t.titleMain;
      document.getElementById('btn-record').innerText = t.btnRecord;
      document.getElementById('history-alert-title').innerHTML = `<span style="font-size: 1.4rem;">⚠️</span> ${t.historyTitle}`;
      document.getElementById('title-stats').innerText = t.titleStats;
      document.getElementById('desc-stats').innerText = t.descStats;
      document.getElementById('title-settings').innerText = t.titleSettings;
      document.getElementById('title-role-setup').innerText = t.titleRole;
      document.getElementById('desc-role-setup').innerText = t.descRole;
      document.getElementById('title-schedule-setup').innerText = t.titleSch;
      document.getElementById('desc-schedule-setup').innerText = t.descSch;
      document.getElementById('btn-save-config').innerText = t.btnSaveConfig;
      document.getElementById('desc-reset').innerText = t.descReset;
      document.getElementById('btn-reset-stats').innerText = t.btnReset;
      const y = today.getFullYear();
      const m = String(today.getMonth() + 1).padStart(2, '0');
      const d = String(today.getDate()).padStart(2, '0');
      document.getElementById('date-display').innerText = `CURRENT CYCLE: ${y}.${m}.${d} [${t.dayNames[today.getDay()]}]`;
      if (document.getElementById('screen-main').classList.contains('active')) renderMain();
      if (document.getElementById('screen-stats').classList.contains('active')) renderStats();
      if (document.getElementById('screen-settings').classList.contains('active')) renderSettings();
    }
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    const particles = [];
    for (let i = 0; i < 70; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 1.5 + 0.5,
        speedX: Math.random() * 0.4 - 0.2,
        speedY: Math.random() * 0.4 - 0.2,
        opacity: Math.random(),
        fade: Math.random() > 0.5 ? 0.005 : -0.005
      });
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;
        p.opacity += p.fade;
        if (p.opacity >= 1 || p.opacity <= 0.1) p.fade *= -1;
        if (p.x > canvas.width) p.x = 0;
        if (p.x < 0) p.x = canvas.width;
        if (p.y > canvas.height) p.y = 0;
        if (p.y < 0) p.y = canvas.height;
        ctx.fillStyle = currentMode === 'hiragana' ? `rgba(0, 243, 255, ${p.opacity})` : `rgba(255, 0, 170, ${p.opacity})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
    applyLanguage();
  </script>
</body>

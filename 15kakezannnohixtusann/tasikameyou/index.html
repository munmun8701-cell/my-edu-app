<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Simple Responsive Form</title>
    <meta name="viewport" content="width=device-width"><link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">
<link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
  <header>
    <h1>学習のしあげ「たしかめよう」</h1>
    <div class="notebook-prompt">
      ✏️ 今までの学習を思い出して、ぜんぶの問題をクリアしよう！
    </div>
  </header>

  <div class="mission-bar">
    <span class="mission-label">📖 メニュー：</span>
    <button class="btn btn-outline active-prob" onclick="switchTab('q1')">大問1（文章問題）</button>
    <button class="btn btn-outline" onclick="switchTab('q2')">大問2（まちがいさがし）</button>
    <button class="btn btn-outline" onclick="switchTab('q3')">大問3（計算15問）</button>
  </div>

  <main class="visual-sandbox">
    <div class="visual-container">
      <div class="vis-header">
        位をそろえて、正しく計算しよう！
        <div class="support-toggle">
          <input type="checkbox" id="support-check" onchange="toggleSupport()">
          <label for="support-check">🔰 おたすけモード</label>
        </div>
      </div>

      <div class="data-controls">
        <button class="btn btn-green" onclick="saveData()">💾 セーブする（きろくする）</button>
        <button class="btn btn-blue" onclick="loadData()">📂 ロードする（よみこむ）</button>
      </div>

      <!-- 大問1: 文章問題 -->
      <div id="vis-q1" class="visual-content active">
        <div class="prob-selector-container">
          <select id="q1-select" class="prob-select" onchange="loadQ1()">
            <option value="1">① 1m 80円のリボン</option>
            <option value="2">② 1本 73円のえんぴつ</option>
          </select>
        </div>
        
        <div class="word-problem-text" id="q1-text"></div>
        <div id="q1-hint" class="prac-hint-msg help-text" style="display:none;"></div>

        <div class="practice-stage">
          <!-- 式入力エリア -->
          <div id="q1-eq-area-1" class="equation-area">
            <div>
              <span class="eq-label">式：</span>
              <input type="text" id="q1-eq1-a" class="num-input-large" oninput="handleInput(event)"> ×
              <input type="text" id="q1-eq1-b" class="num-input-large" oninput="handleInput(event)"> ＝
              <input type="text" id="q1-eq1-ans" class="num-input-large" oninput="handleInput(event)">
            </div>
            <div style="margin-top: 10px;">
              <span class="eq-label">答え：</span>
              <input type="text" id="q1-ans1" class="num-input-large ans-input" oninput="handleInput(event)"> 円
            </div>
          </div>

          <div id="q1-eq-area-2" class="equation-area" style="display:none; flex-direction:column; gap:10px;">
            <div>
              <span class="eq-label">かけ算の式：</span>
              <input type="text" id="q1-eq2-a" class="num-input-large" oninput="handleInput(event)"> ×
              <input type="text" id="q1-eq2-b" class="num-input-large" oninput="handleInput(event)"> ＝
              <input type="text" id="q1-eq2-ans" class="num-input-large" oninput="handleInput(event)">
            </div>
            <div>
              <span class="eq-label">ひき算の式：</span>
              <input type="text" id="q1-eq3-a" class="num-input-large" oninput="handleInput(event)"> －
              <input type="text" id="q1-eq3-b" class="num-input-large" oninput="handleInput(event)"> ＝
              <input type="text" id="q1-eq3-ans" class="num-input-large" oninput="handleInput(event)">
            </div>
            <div>
              <span class="eq-label">答え：</span>
              <input type="text" id="q1-ans2" class="num-input-large ans-input" oninput="handleInput(event)"> 円
            </div>
          </div>

          <!-- 筆算グリッド -->
          <div class="math-grid clean-grid" id="q1-grid">
            <div class="mg-row memo-row">
              <div class="mg-cell"></div><div class="mg-cell"></div>
              <div class="mg-cell"><input type="text" id="q1-memo-100" class="memo-box" maxlength="1"></div>
              <div class="mg-cell"><input type="text" id="q1-memo-10" class="memo-box" maxlength="1"></div>
              <div class="mg-cell"><input type="text" id="q1-memo-1" class="memo-box" maxlength="1"></div>
            </div>
            <div class="mg-row">
              <div class="mg-cell"></div><div class="mg-cell"></div>
              <div class="mg-cell val" id="q1-a-100"></div><div class="mg-cell val" id="q1-a-10"></div><div class="mg-cell val" id="q1-a-1"></div>
            </div>
            <div class="mg-row border-bottom">
              <div class="mg-cell"></div><div class="mg-cell val">×</div>
              <div class="mg-cell"></div><div class="mg-cell val" id="q1-b-10"></div><div class="mg-cell val" id="q1-b-1"></div>
            </div>
            <div class="mg-row" id="q1-row-p1">
              <div class="mg-cell"></div>
              <div class="mg-cell"><input type="text" id="q1-p1-1000" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <div class="mg-cell"><input type="text" id="q1-p1-100" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <div class="mg-cell"><input type="text" id="q1-p1-10" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <div class="mg-cell"><input type="text" id="q1-p1-1" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <span class="side-note help-text">← <span id="q1-h-a1"></span> × <span id="q1-h-b1"></span></span>
            </div>
            <div class="mg-row border-bottom" id="q1-row-p2">
              <div class="mg-cell"><input type="text" id="q1-p2-10000" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <div class="mg-cell"><input type="text" id="q1-p2-1000" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <div class="mg-cell"><input type="text" id="q1-p2-100" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <div class="mg-cell"><input type="text" id="q1-p2-10" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <div class="mg-cell help-zero">0</div>
              <span class="side-note help-text">← <span id="q1-h-a2"></span> × <span id="q1-h-b2"></span></span>
            </div>
            <div class="mg-row">
              <div class="mg-cell"><input type="text" id="q1-sum-10000" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <div class="mg-cell"><input type="text" id="q1-sum-1000" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <div class="mg-cell"><input type="text" id="q1-sum-100" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <div class="mg-cell"><input type="text" id="q1-sum-10" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <div class="mg-cell"><input type="text" id="q1-sum-1" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
            </div>
          </div>
        </div>
        <div class="advice-controls"><button class="btn btn-yellow" onclick="giveAdvice('q1')">🤖 アドバイスをもらう</button></div>
        <div id="q1-advice-msg" class="advice-msg"></div>
        <div id="q1-feedback" class="feedback-msg"></div>
      </div>

      <!-- 大問2: まちがいさがし -->
      <div id="vis-q2" class="visual-content">
        <div class="prob-selector-container">
          <select id="q2-select" class="prob-select" onchange="loadQ2()">
            <option value="1">① 48 × 32 のまちがい</option>
            <option value="2">② 705 × 40 のまちがい</option>
          </select>
        </div>

        <div class="mistake-stage">
          <div class="mistake-bad">
            <div class="bad-title">まちがった計算 ❌</div>
            <div id="q2-bad-math" class="bad-math"></div>
          </div>
          <div class="mistake-good practice-stage">
            <div class="good-title">見当をつけて、正しく計算しよう ⭕</div>
            <div class="estimate-area" style="margin-bottom:15px; background:#fff9db; padding:10px; border-radius:8px; font-size:1.3rem; font-weight:bold;">
              答えの見当： <span id="q2-est-a"></span> × <span id="q2-est-b"></span> ＝
              <input type="text" id="q2-est-ans" class="num-input-large" style="width:90px;" oninput="handleInput(event)">
            </div>
            
            <!-- 筆算グリッド -->
            <div class="math-grid clean-grid" id="q2-grid">
              <div class="mg-row memo-row">
                <div class="mg-cell"></div><div class="mg-cell"></div>
                <div class="mg-cell"><input type="text" id="q2-memo-100" class="memo-box" maxlength="1"></div>
                <div class="mg-cell"><input type="text" id="q2-memo-10" class="memo-box" maxlength="1"></div>
                <div class="mg-cell"><input type="text" id="q2-memo-1" class="memo-box" maxlength="1"></div>
              </div>
              <div class="mg-row">
                <div class="mg-cell"></div><div class="mg-cell"></div>
                <div class="mg-cell val" id="q2-a-100"></div><div class="mg-cell val" id="q2-a-10"></div><div class="mg-cell val" id="q2-a-1"></div>
              </div>
              <div class="mg-row border-bottom">
                <div class="mg-cell"></div><div class="mg-cell val">×</div>
                <div class="mg-cell"></div><div class="mg-cell val" id="q2-b-10"></div><div class="mg-cell val" id="q2-b-1"></div>
              </div>
              <div class="mg-row" id="q2-row-p1">
                <div class="mg-cell"></div>
                <div class="mg-cell"><input type="text" id="q2-p1-1000" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
                <div class="mg-cell"><input type="text" id="q2-p1-100" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
                <div class="mg-cell"><input type="text" id="q2-p1-10" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
                <div class="mg-cell"><input type="text" id="q2-p1-1" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
                <span class="side-note help-text">← <span id="q2-h-a1"></span> × <span id="q2-h-b1"></span></span>
              </div>
              <div class="mg-row border-bottom" id="q2-row-p2">
                <div class="mg-cell"><input type="text" id="q2-p2-10000" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
                <div class="mg-cell"><input type="text" id="q2-p2-1000" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
                <div class="mg-cell"><input type="text" id="q2-p2-100" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
                <div class="mg-cell"><input type="text" id="q2-p2-10" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
                <div class="mg-cell help-zero">0</div>
                <span class="side-note help-text">← <span id="q2-h-a2"></span> × <span id="q2-h-b2"></span></span>
              </div>
              <div class="mg-row">
                <div class="mg-cell"><input type="text" id="q2-sum-10000" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
                <div class="mg-cell"><input type="text" id="q2-sum-1000" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
                <div class="mg-cell"><input type="text" id="q2-sum-100" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
                <div class="mg-cell"><input type="text" id="q2-sum-10" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
                <div class="mg-cell"><input type="text" id="q2-sum-1" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="advice-controls"><button class="btn btn-yellow" onclick="giveAdvice('q2')">🤖 アドバイスをもらう</button></div>
        <div id="q2-advice-msg" class="advice-msg"></div>
        <div id="q2-feedback" class="feedback-msg"></div>
      </div>

      <!-- 大問3: 計算問題 -->
      <div id="vis-q3" class="visual-content">
        <div class="prob-selector-container">
          <select id="q3-select" class="prob-select" onchange="loadQ3()">
            <option value="1">① 6 × 70</option><option value="2">② 3 × 26</option>
            <option value="3">③ 32 × 40</option><option value="4">④ 50 × 90</option>
            <option value="5">⑤ 14 × 23</option><option value="6">⑥ 21 × 19</option>
            <option value="7">⑦ 30 × 28</option><option value="8">⑧ 62 × 95</option>
            <option value="9">⑨ 76 × 49</option><option value="10">⑩ 86 × 57</option>
            <option value="11">⑪ 18 × 63</option><option value="12">⑫ 532 × 24</option>
            <option value="13">⑬ 978 × 48</option><option value="14">⑭ 609 × 34</option>
            <option value="15">⑮ 214 × 80</option>
          </select>
        </div>
        <div id="q3-hint" class="prac-hint-msg help-text" style="display:none;"></div>

        <div class="practice-stage">
          <!-- 筆算グリッド -->
          <div class="math-grid clean-grid" id="q3-grid">
            <div class="mg-row memo-row">
              <div class="mg-cell"></div><div class="mg-cell"></div>
              <div class="mg-cell"><input type="text" id="q3-memo-100" class="memo-box" maxlength="1"></div>
              <div class="mg-cell"><input type="text" id="q3-memo-10" class="memo-box" maxlength="1"></div>
              <div class="mg-cell"><input type="text" id="q3-memo-1" class="memo-box" maxlength="1"></div>
            </div>
            <div class="mg-row">
              <div class="mg-cell"></div><div class="mg-cell"></div>
              <div class="mg-cell val" id="q3-a-100"></div><div class="mg-cell val" id="q3-a-10"></div><div class="mg-cell val" id="q3-a-1"></div>
            </div>
            <div class="mg-row border-bottom">
              <div class="mg-cell"></div><div class="mg-cell val">×</div>
              <div class="mg-cell"></div><div class="mg-cell val" id="q3-b-10"></div><div class="mg-cell val" id="q3-b-1"></div>
            </div>
            <div class="mg-row" id="q3-row-p1">
              <div class="mg-cell"></div>
              <div class="mg-cell"><input type="text" id="q3-p1-1000" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <div class="mg-cell"><input type="text" id="q3-p1-100" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <div class="mg-cell"><input type="text" id="q3-p1-10" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <div class="mg-cell"><input type="text" id="q3-p1-1" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <span class="side-note help-text">← <span id="q3-h-a1"></span> × <span id="q3-h-b1"></span></span>
            </div>
            <div class="mg-row border-bottom" id="q3-row-p2">
              <div class="mg-cell"><input type="text" id="q3-p2-10000" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <div class="mg-cell"><input type="text" id="q3-p2-1000" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <div class="mg-cell"><input type="text" id="q3-p2-100" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <div class="mg-cell"><input type="text" id="q3-p2-10" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <div class="mg-cell help-zero">0</div>
              <span class="side-note help-text">← <span id="q3-h-a2"></span> × <span id="q3-h-b2"></span></span>
            </div>
            <div class="mg-row">
              <div class="mg-cell"><input type="text" id="q3-sum-10000" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <div class="mg-cell"><input type="text" id="q3-sum-1000" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <div class="mg-cell"><input type="text" id="q3-sum-100" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <div class="mg-cell"><input type="text" id="q3-sum-10" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
              <div class="mg-cell"><input type="text" id="q3-sum-1" class="num-box" maxlength="1" oninput="handleInput(event)"></div>
            </div>
          </div>
        </div>
        <div class="advice-controls"><button class="btn btn-yellow" onclick="giveAdvice('q3')">🤖 アドバイスをもらう</button></div>
        <div id="q3-advice-msg" class="advice-msg"></div>
        <div id="q3-feedback" class="feedback-msg"></div>
      </div>

    </div>
  </main>
</div>
    <script src='//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script><script  src="./script.js"></script>

  </body>
  
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>こくご ワールド 2ねんせい ｜ むん先生の学習クエスト</title>
<style>
:root{--bg:#050914;--panel:#0b1a2e;--panel2:#0f2440;--line:#1f4468;--cy:#3ef0ff;--gr:#5cff9d;--yl:#ffd166;--rd:#ff6b8a;--tx:#e6f7ff;--mut:#8aa6c2;--padbg:#071224;--ink:#ffffff;--fs:19px}
body.t-forest{--bg:#04110a;--panel:#0b2216;--panel2:#10301f;--line:#22573a;--cy:#7dffb0;--padbg:#061a10}
body.t-sakura{--bg:#14070f;--panel:#2a0f22;--panel2:#3a1530;--line:#6a2b58;--cy:#ff9ad5;--padbg:#1d0a17}
body.t-sunset{--bg:#130903;--panel:#29150a;--panel2:#3a1f0e;--line:#6a3a18;--cy:#ffb26b;--padbg:#1c0e05}
body.t-gold{--bg:#0d0b03;--panel:#211c08;--panel2:#30290c;--line:#5e5216;--cy:#ffe066;--padbg:#171404}
body.big{--fs:23px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font-family:"BIZ UDPGothic","BIZ UDゴシック","UD デジタル 教科書体 N-R","Yu Gothic UI","Hiragino Sans",Meiryo,sans-serif;font-size:var(--fs);line-height:1.75;min-height:100vh;background-image:linear-gradient(rgba(62,240,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(62,240,255,.045) 1px,transparent 1px);background-size:32px 32px}
[hidden]{display:none!important}
button{font-family:inherit}
header{position:sticky;top:0;z-index:20;padding:10px 16px 8px;background:color-mix(in srgb,var(--bg) 94%,transparent);border-bottom:1px solid var(--line)}
.sys{font-size:11px;letter-spacing:.18em;color:var(--cy);opacity:.8;font-family:monospace}
h1{margin:0;font-size:20px;color:var(--cy);text-shadow:0 0 12px color-mix(in srgb,var(--cy) 45%,transparent)}
h1 rt{font-size:9px;color:var(--mut)}
.pstrip{display:flex;align-items:center;gap:10px;margin-top:6px}
.avatar{font-size:30px;line-height:1}
.pinfo{flex:1;min-width:0}
.ptitle{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle b{color:var(--tx);font-size:16px}
.bar{height:11px;background:#0a1830;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--gr));transition:width .6s}
.chip{font-size:14px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 12px 0;max-width:1000px;margin:0 auto}
.tab{min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--mut);font-size:15px;cursor:pointer;line-height:1.25;padding:4px}
.tab span{display:block;font-size:22px}
.tab[aria-selected="true"]{border-color:var(--cy);color:var(--tx);box-shadow:0 0 14px color-mix(in srgb,var(--cy) 25%,transparent)}
main{max-width:1000px;margin:0 auto;padding:12px 14px 70px}
h2.sec{font-size:20px;margin:22px 0 10px;border-left:4px solid var(--cy);padding-left:10px}
.btn{font-size:18px;min-height:52px;padding:8px 18px;border-radius:14px;border:2px solid var(--cy);background:var(--panel2);color:var(--tx);cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,.card:focus-visible{outline:3px solid var(--yl);outline-offset:2px}
.btn.sm{min-height:44px;font-size:16px;padding:4px 14px;border-color:var(--line)}
.btn.primary{background:var(--cy);color:#04111f;font-weight:700}
.btn.ghost{border-color:var(--line);color:var(--mut)}
.btn.on{border-color:var(--yl);color:var(--yl)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.center{justify-content:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.note{font-size:15px;color:var(--mut)}
.robo{display:flex;gap:12px;align-items:flex-start}
.robo .face{font-size:44px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.bubble{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;position:relative}
.bubble:before{content:"";position:absolute;left:-8px;top:16px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.mis{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.mis:last-child{border-bottom:0}
.mis .mt{flex:1}
.mis .mb{width:110px}
.mis.done .mt{color:var(--gr)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{position:relative;text-align:left;color:var(--tx);background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;min-height:140px;transition:transform .15s,border-color .15s;font-size:inherit}
.card:hover{transform:translateY(-2px);border-color:var(--cy)}
.card.cleared{border-color:var(--gr)}
.card.boss{border-style:dashed;border-color:var(--yl)}
.card.locked{opacity:.5;cursor:not-allowed;transform:none}
.ce{font-size:32px;line-height:1.2}
.cname{font-weight:700;font-size:17px;margin-top:4px}
.cskill{font-size:13px;color:var(--mut)}
.stars{margin-top:6px;color:var(--yl);letter-spacing:2px;font-size:16px}
.badge{position:absolute;top:8px;right:8px;font-size:12px;background:var(--yl);color:#1a1200;border-radius:999px;padding:2px 9px;font-weight:700}
.lvhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-left:4px solid var(--cy);padding-left:10px;margin:22px 0 10px}
.lvhead h2{margin:0;font-size:20px}
.lvno{font-family:monospace;color:var(--cy);font-size:13px}
.prog{margin-left:auto;color:var(--mut);font-size:14px}
.big3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.bigbtn{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--panel);color:var(--tx);cursor:pointer;font-size:17px;min-height:72px}
.bigbtn .ic{font-size:32px}
.bigbtn small{display:block;color:var(--mut);font-size:13px}
.bigbtn.hot{border-color:var(--yl)}
/* kana table */
.seg{display:flex;gap:8px;margin:6px 0 12px}
.ktable{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;max-width:560px}
.kc{position:relative;aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--tx);font-size:clamp(22px,6vw,34px);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.kc img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:contain;opacity:.95}
.kc .lv{position:absolute;right:2px;bottom:0;font-size:14px;line-height:1}
.kc.empty{visibility:hidden}
.kc.l1{border-color:#a07b3a}.kc.l2{border-color:var(--yl)}.kc.l3{border-color:var(--gr)}.kc.l4{border-color:var(--gr);box-shadow:0 0 10px color-mix(in srgb,var(--gr) 50%,transparent)}
.kcount{display:flex;gap:12px;flex-wrap:wrap;font-size:15px;color:var(--mut);margin-bottom:8px}
/* practice */
.prhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prhead h2{margin:0;font-size:22px;flex:1}
.steps{display:flex;gap:6px;margin:8px 0}
.stp{flex:1;text-align:center;font-size:14px;padding:6px 4px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--mut);cursor:pointer}
.stp.on{border-color:var(--cy);color:var(--tx)}
.stp.ok{color:var(--gr)}
.pword{text-align:center;font-size:24px;margin:4px 0}
.pword .em{font-size:40px;vertical-align:middle}
.padwrap{display:flex;justify-content:center}
#pad{touch-action:none;border-radius:18px;border:3px solid var(--line);background:var(--padbg);width:min(92vw,440px,58vh);height:min(92vw,440px,58vh);cursor:crosshair}
.ptools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
/* quest */
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.qhead h2{margin:0;font-size:19px;color:var(--cy);flex:1}
.qcount{font-family:monospace;color:var(--mut);font-size:15px}
.combo{font-weight:700;color:var(--yl);font-size:16px}
.qbar{height:10px;background:#0a1830;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.qbar>i{display:block;height:100%;width:0;background:var(--gr);transition:width .3s}
.boss-box{border:2px dashed var(--yl);border-radius:14px;padding:8px 14px;margin-bottom:12px;background:rgba(255,209,102,.06)}
.boss-hp{height:12px;background:#2a2100;border-radius:8px;overflow:hidden;margin:6px 0}
.boss-hp>i{display:block;height:100%;background:var(--rd);transition:width .4s}
.qcard{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px}
.passage{font-size:calc(var(--fs) + 1px);background:var(--padbg);border-radius:12px;padding:12px 14px;margin-bottom:12px;border-left:4px solid var(--cy)}
.emoji{font-size:64px;text-align:center;line-height:1.2}
.bigchar{font-size:96px;text-align:center;line-height:1.15;font-family:"UD デジタル 教科書体 N-R","UD Digi Kyokasho N-R","BIZ UDPGothic",sans-serif}
.prompt{font-size:calc(var(--fs) + 3px);font-weight:700;text-align:center;margin:8px 0 12px}
.sen{font-size:calc(var(--fs) + 6px);text-align:center;margin:8px 0 12px;padding:10px;background:var(--padbg);border-radius:12px;letter-spacing:.06em}
.blank{display:inline-block;min-width:3em;border-bottom:3px solid var(--yl);color:var(--yl);font-weight:700;padding:0 6px}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hint{margin-top:10px;padding:10px;border-radius:10px;background:color-mix(in srgb,var(--cy) 9%,transparent);color:var(--cy);text-align:center}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.choice{font-size:calc(var(--fs) + 4px);min-height:66px;background:var(--panel2)}
.choice.kana{font-size:44px;min-height:90px;font-family:"UD デジタル 教科書体 N-R","UD Digi Kyokasho N-R","BIZ UDPGothic",sans-serif}
.choice.right{background:#0d3d24;border-color:var(--gr);color:var(--gr)}
.choice.wrong{background:#3d0f1e;border-color:var(--rd);color:var(--rd)}
.slot{min-height:64px;margin-top:14px;padding:10px;border:2px dashed var(--line);border-radius:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.slot .ph{color:var(--mut);font-size:16px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px;min-height:60px}
.tk{font-size:calc(var(--fs) + 3px);min-width:52px;min-height:52px;padding:6px 12px;border-radius:12px;border:2px solid var(--cy);background:var(--panel2);color:var(--tx);cursor:pointer}
.tk.on{background:color-mix(in srgb,var(--cy) 15%,var(--panel2))}
.fb{margin-top:14px;padding:14px;border-radius:14px}
.fb.ok{background:rgba(92,255,157,.1);border:2px solid var(--gr)}
.fb.ng{background:rgba(255,107,138,.1);border:2px solid var(--rd)}
.fbt{font-size:22px;font-weight:700;margin-bottom:4px}
.fb.ok .fbt{color:var(--gr);animation:pop .5s}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.result{text-align:center;padding:22px 14px}
.result .bigst{font-size:52px;color:var(--yl);letter-spacing:4px}
.result h2{color:var(--cy)}
.tabar{height:16px;background:#0a1830;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.tabar>i{display:block;height:100%;background:linear-gradient(90deg,var(--rd),var(--yl));transition:width .25s linear}
/* weak */
.wline{display:flex;flex-direction:column;gap:4px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.wtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:17px}
.wbar{height:14px;background:#0a1830;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.wbar>i{display:block;height:100%;width:0;transition:width .5s}
.r-low>i{background:var(--rd)}.r-mid>i{background:var(--yl)}.r-high>i{background:var(--gr)}
.tag{font-size:14px;padding:2px 10px;border-radius:999px;border:1px solid}
.t-low{color:var(--rd);border-color:var(--rd)}.t-mid{color:var(--yl);border-color:var(--yl)}.t-high{color:var(--gr);border-color:var(--gr)}.t-na{color:var(--mut);border-color:var(--line)}
/* badges & calendar */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.bd{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.bd .bi{font-size:34px;line-height:1.2}
.bd .bn{font-size:14px;font-weight:700}
.bd .bx{font-size:12px;color:var(--mut);line-height:1.4}
.bd.lock{opacity:.45;filter:grayscale(1)}
.bd.got{border-color:var(--yl)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:460px}
.cal div{aspect-ratio:1;border-radius:8px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--mut)}
.cal .h{background:none;border:0;font-weight:700;aspect-ratio:auto;padding:2px}
.cal .st{font-size:18px;line-height:1}
.cal .today{border-color:var(--cy);color:var(--tx)}
.cal .pad{visibility:hidden}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--cy)}
table.tb{width:100%;border-collapse:collapse;font-size:15px}
.tb th,.tb td{border-bottom:1px solid var(--line);padding:6px;text-align:left}
.setrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px dashed var(--line)}
.setrow .sl{flex:1;min-width:160px}
/* modal, toast, fx */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--panel);border:2px solid var(--cy);border-radius:20px;padding:20px;max-width:440px;width:100%;text-align:center;max-height:90vh;overflow:auto;animation:pop .35s}
.mbox .mi{font-size:60px;line-height:1.2}
.mbox h3{margin:6px 0;color:var(--cy);font-size:22px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.ts{background:var(--panel2);border:2px solid var(--yl);color:var(--tx);border-radius:999px;padding:8px 18px;font-size:16px;animation:pop .3s;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.about{font-size:15px;background:rgba(255,209,102,.08);border:1px solid rgba(255,209,102,.4);color:#ffe6a8;border-radius:12px;padding:8px 12px;margin-bottom:10px}
.dinfo{font-size:16px;color:var(--mut);margin-bottom:10px;text-align:center}
.dinfo b{color:var(--yl)}
.sents{display:flex;flex-direction:column;gap:6px}
.sent{display:block;width:100%;text-align:left;font-size:var(--fs);line-height:1.7;color:var(--tx);background:var(--padbg);border:2px solid var(--line);border-left-width:6px;border-radius:12px;padding:8px 12px;cursor:pointer}
button.sent:hover{border-color:var(--cy)}
.sent.first{cursor:default}
.sent.on{border-color:var(--yl);background:#1c1a08;margin-top:12px}
.sent.start{margin-top:14px}
.sent.pu{text-indent:1em}
.sent.g0{border-left-color:var(--cy)}.sent.g1{border-left-color:var(--yl)}.sent.g2{border-left-color:var(--gr)}.sent.g3{border-left-color:#c49bff}
.sent.right{border-color:var(--gr);background:#0d3d24}.sent.wrong{border-color:var(--rd);background:#3d0f1e}
.mk{display:block;font-size:14px;font-weight:700;color:var(--yl);margin-bottom:2px}
.mk.hit{color:var(--gr)}.mk.miss{color:var(--yl)}.mk.bad{color:var(--rd)}
.passage.story{max-height:50vh;overflow:auto}
.scene+.scene{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.slabel{font-size:13px;color:var(--cy);font-family:monospace}
.para{margin:4px 0;text-indent:1em}
.theme{font-size:15px;border:1px solid var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--cy) 10%,transparent),transparent);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.theme b{color:var(--cy)}
.refl{text-align:left;margin:18px auto 4px;max-width:640px}
.rq{font-weight:700;margin-bottom:6px}
.refl textarea{width:100%;font:inherit;line-height:1.7;color:var(--tx);background:var(--padbg);border:2px solid var(--line);border-radius:12px;padding:10px}
.refl textarea:focus{outline:none;border-color:var(--cy)}
.ktable .kc{font-family:"UD デジタル 教科書体 N-R","UD Digi Kyokasho N-R","BIZ UDPGothic",sans-serif}
footer{max-width:1000px;margin:0 auto;padding:0 16px 40px;color:var(--mut);font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){.tab{font-size:12px}.tab span{font-size:20px}}
</style>
</head>
<body>
<header>
  <div class="sys">MUN-SENSEI OS // こくご ワールド 2ねんせい</div>
  <h1>むん<ruby>先生<rt>せんせい</rt></ruby>の 学習クエスト</h1>
  <div class="pstrip">
    <div class="avatar" id="pAv">🥚</div>
    <div class="pinfo"><div class="ptitle" id="pTitle"></div><div class="bar"><i id="xpBar"></i></div></div>
    <span class="chip" id="pStreak">🔥 0にち</span>
  </div>
</header>
<nav id="tabs">
  <button class="tab" data-tab="map"><span>🗺️</span>マップ</button>
  <button class="tab" data-tab="write"><span>✍️</span>かん字を 書く</button>
  <button class="tab" data-tab="zukan"><span>📖</span>ずかん</button>
  <button class="tab" data-tab="record"><span>🏅</span>きろく</button>
  <button class="tab" data-tab="settings"><span>⚙️</span>せってい</button>
</nav>
<main>
  <section id="vMap"></section>
  <section id="vWrite" hidden></section>
  <section id="vPractice" hidden></section>
  <section id="vZukan" hidden></section>
  <section id="vRecord" hidden></section>
  <section id="vSettings" hidden></section>
  <section id="vParent" hidden></section>
  <section id="vWeak" hidden></section>
  <section id="vQuest" hidden>
    <div class="qhead"><h2 id="qTitle"></h2><span class="combo" id="qCombo"></span><span class="qcount" id="qCount"></span><button class="btn sm ghost" id="btnQuit">やめる</button></div>
    <div class="tabar" id="taBar" hidden><i id="taFill"></i></div>
    <div class="qbar" id="qBarWrap"><i id="qBar"></i></div>
    <div class="boss-box" id="bossBox" hidden><div id="bossHpTxt"></div><div class="boss-hp"><i id="bossHp"></i></div></div>
    <div class="qcard" id="qBody"></div>
  </section>
  <section id="vRes" hidden></section>
</main>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox" role="dialog" aria-modal="true"></div></div>
<div id="toast" aria-live="polite"></div>
<canvas id="fx"></canvas>
<footer>きろくは この たんまつ（ブラウザ）の 中だけに のこります。インターネットには そうしんしません。</footer>
<script>
(()=>{
'use strict';
const SKILLS={
  kanji_yomi:'かんじの よみ（2年までの かんじ）',
  kanji_kaki:'かんじの かき（1年の かんじ）',
  bun2:'しゅごと じゅつご',
  joshi2:'じょし（が・に・で・と・の・を）',
  teinei:'ていねいな いいかた（です・ます）',
  goi2:'ことばの まとまり',
  hantai:'はんたいの ことば',
  youso:'ようすを あらわす ことば',
  hanashi2:'はなす（じゅんばん・つたわる はなしかた）',
  kaku2:'かく（けいけん・かんそう）',

function confetti(n=120){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=[css('--cy'),css('--gr'),css('--yl'),css('--rd'),'#c49bff'];
  const ps=Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.3,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:4+Math.random()*5,a:Math.random()*6,c:pick(cols)}));
  let f=0;(function step(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore();});if(++f<150)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height);})();
}

/* ================= かん字の もんだいを つくる ================= */
function hideWord(k){return k.w.replace(k.c,'□');}
function distract(c,n,onlySimilar){
  const sim=SIMILAR.filter(g=>g.includes(c)).flat().filter(x=>x!==c);
  let out=shuffle([...new Set(sim)]).slice(0,n);
  if(!onlySimilar||out.length<n){const rest=shuffle(ORDER.all.filter(x=>x!==c&&!out.includes(x)));while(out.length<n)out.push(rest.pop());}
  return out;
}
function readDistract(k,n){
  const sims=SIMILAR.filter(g=>g.includes(k.c)).flat().filter(x=>x!==k.c&&KANA[x]).map(x=>KANA[x].r);
  const out=shuffle([...new Set(sims)]).filter(r=>r!==k.r).slice(0,n);
  const rest=shuffle([...new Set(KJ.map(x=>x[2]))].filter(r=>r!==k.r&&!out.includes(r)));
  while(out.length<n)out.push(rest.pop());
  return out;
}
function makeKana(mode,c){
  const k=KANA[c];
  if(mode==='yomi')return {id:`k:yomi:${c}`,f:'p',disp:k.w,q:'この ことばの よみは どれ？',c:[k.r,...readDistract(k,2)],a:k.r,w:`「${k.w}」は「${k.r}」と よみます。`,s:'kj_yomi',st:'k1',say:k.r};
  return {id:`k:${mode}:${c}`,f:'p',kana:true,disp:`${hideWord(k)}（${k.r}）`,q:'□に 入る かん字は どれ？',c:[c,...distract(c,2,mode==='nite')],a:c,
    w:`「${k.r}」は「${k.w}」と 書きます。${mode==='nite'?'にている かん字と、ちがう ところを よく 見よう。':''}`,s:mode==='nite'?'kj_nite':'kj_kaki',st:mode==='nite'?'k3':'k2',say:k.r};
}
function weightPick(list,n){
  const w=list.map(c=>{const lv=S.kana[c]?.lv||0;return 4-Math.min(lv,3);});
  const out=[];const pool=list.slice(),ws=w.slice();
  while(out.length<n&&pool.length){let r=Math.random()*ws.reduce((a,b)=>a+b,0);let i=0;while(i<ws.length-1&&(r-=ws[i])>0)i++;out.push(pool.splice(i,1)[0]);ws.splice(i,1);}
  return out;
}
function genKana(mode,n){
  const pool=mode==='nite'?ORDER.all.filter(c=>SIMILAR.some(g=>g.includes(c))):ORDER.all;
  return weightPick(pool,n).map(c=>makeKana(mode,c));
}

function glyph(x,ch,S0,color,dil){

function strokesTo(x,strokes,S0,w,color){
  x.strokeStyle=color;x.fillStyle=color;x.lineCap='round';x.lineJoin='round';x.lineWidth=w;
  for(const s of strokes){
    if(s.length===1){x.beginPath();x.arc(s[0][0]*S0,s[0][1]*S0,w/2,0,Math.PI*2);x.fill();continue;}
    x.beginPath();s.forEach((p,i)=>i?x.lineTo(p[0]*S0,p[1]*S0):x.moveTo(p[0]*S0,p[1]*S0));x.stroke();
  }
}
function maskOf(draw){const c=document.createElement('canvas');c.width=c.height=JS;const x=c.getContext('2d');draw(x);const d=x.getImageData(0,0,JS,JS).data,m=new Uint8Array(JS*JS);for(let i=0;i<m.length;i++)m[i]=d[i*4+3]>100?1:0;return m;}
function judge(ch,strokes,pw){
  const rc=JS*.035,rp=JS*.07,w=pw*JS;
  const T=maskOf(x=>glyph(x,ch,JS,'#000',0)),Td=maskOf(x=>glyph(x,ch,JS,'#000',2*rp));
  const D=maskOf(x=>strokesTo(x,strokes,JS,w,'#000')),Dd=maskOf(x=>strokesTo(x,strokes,JS,w+2*rc,'#000'));
  let t=0,tc=0,d=0,dc=0;const miss=new Uint8Array(JS*JS);
  for(let i=0;i<T.length;i++){if(T[i]){t++;if(Dd[i])tc++;else miss[i]=1;}if(D[i]){d++;if(Td[i])dc++;}}

  const cov=tc/t,prec=dc/d;

  if(need&&stars>0){if(got<=Math.max(1,Math.floor(need*.25))&&need>1){stars=0;kaku=`画数は ${need}画だよ（いまは ${got}画）。一画ずつ 書こう。`;}else if(got<Math.ceil(need*.6)||got>need*1.6+1){stars=Math.min(stars,1);kaku=`画数は ${need}画だよ（いまは ${got}画）。一画ずつ ていねいに 書こう。`;}else if(got!==need){stars=Math.min(stars,2);kaku=`おしい！ 画数は ${need}画だよ（いまは ${got}画）。`;}}

function setupPad(){

function bindOrder(it){
  const need=orderTokens(it).length;let slot=[],bank=shuffle(orderTokens(it).map((t,i)=>({t,i})));
  const draw=()=>{
    $('#slot').innerHTML=slot.length?slot.map((x,k)=>`<button class="tk on" data-k="${k}">${esc(x.t)}</button>`).join(''):'<span class="ph">ことばを タップして ならべよう</span>';
    $('#bank').innerHTML=bank.map((x,k)=>`<button class="tk" data-k="${k}">${esc(x.t)}</button>`).join('');
    $('#slot').querySelectorAll('.tk').forEach(b=>b.onclick=()=>{if(Q.answered)return;bank.push(slot.splice(+b.dataset.k,1)[0]);sfx('tap');draw();});
    $('#bank').querySelectorAll('.tk').forEach(b=>b.onclick=()=>{if(Q.answered)return;slot.push(bank.splice(+b.dataset.k,1)[0]);sfx('tap');draw();});
  };
  $('#bCheck').onclick=()=>{if(Q.answered)return;if(slot.length<need){$('#fb').innerHTML='<div class="note">ぜんぶ ならべてから おしてね。</div>';return;}
    const ok=slot.map(x=>x.t).join('')===orderAns(it);$('#bank').innerHTML='';record(it,ok);};
  $('#bReset').onclick=()=>{if(Q.answered)return;bank=shuffle([...bank,...slot]);slot=[];draw();};
  draw();
}

const WORD={scene:'ばめん',para:'だんらく',kozo:'まとまり'};
function divideHTML(it){
  const word=WORD[it.kind], unitW=it.unit==='para'?'だんらく':'文';
  const about={
    scene:'💡 ばめん とは、「いつ」「どこ」が おなじ まとまりの ことです。いつ や どこ が かわると、あたらしい ばめんに なります。',
    para:'💡 だんらく とは、ないようの まとまりの ことです。だんらくの はじめは、1ます あけて かきます。',
    kozo:'💡 せつめいの 文しょうは、「はじめ（たずねる）」「なか（くわしい せつめい）」「おわり（まとめ）」に わけられます。'
  }[it.kind];
  const info=it.names
    ?`<b>${it.names.join('・')}</b>の ${it.n}つに わかれます。<br>「${it.names.slice(1).join('」と「')}」が はじまる ${unitW}を タップしてね。`
    :`ぜんぶで <b>${it.n}つ</b>の ${word}に わかれます。<br>あたらしい ${word}が はじまる ${unitW}を タップしてね。`;
  return `<div class="about">${about}</div><div class="dinfo">${info}<span id="dleft"></span></div><div class="sents" id="sents"></div><div class="row" style="justify-content:center"><button class="btn sm ghost" id="bReset">やりなおす</button><button class="btn primary" id="bCheck">これで いい？</button></div>`;
}
function bindDivide(it){
  const word=WORD[it.kind];
  const lbl=g=>it.names?it.names[g]:word+(g+1);
  const pu=it.unit==='para'?' pu':'';
  const need=it.n-1;
  let marks=new Set();
  const box=$('#sents');
  const draw=result=>{
    const sorted=[...marks].sort((a,b)=>a-b);
    box.innerHTML=it.sents.map((s,i)=>{
      if(result){
        const g=it.ans.filter(a=>a<=i).length;
        let mk='';
        if(i===0) mk=`<span class="mk hit">${lbl(0)}</span>`;
        else if(it.ans.includes(i)) mk=marks.has(i)?`<span class="mk hit">⭕ ここから ${lbl(g)}</span>`:`<span class="mk miss">👉 ここからが ${lbl(g)}</span>`;
        else if(marks.has(i)) mk='<span class="mk bad">✖ ここでは わかれないよ</span>';
        return `<div class="sent${pu} g${g%4}${i>0&&it.ans.includes(i)?' start':''}">${mk}${esc(s)}</div>`;
      }
      if(i===0) return `<div class="sent first${pu} g0"><span class="mk">${lbl(0)}</span>${esc(s)}</div>`;
      const k=sorted.indexOf(i);
      return `<button class="sent${pu}${k>=0?' on':''}" data-i="${i}">${k>=0?`<span class="mk">ここから ${lbl(k+1)}</span>`:''}${esc(s)}</button>`;
    }).join('');
    if(result)return;
    const left=need-marks.size;
    $('#dleft').textContent=left>0?`（あと ${left}こ）`:left===0?'（ぜんぶ えらんだよ）':`（${-left}こ おおいよ）`;
    box.querySelectorAll('button.sent').forEach(b=>b.onclick=()=>{
      if(Q.answered)return;
      const i=+b.dataset.i;
      if(marks.has(i))marks.delete(i);else marks.add(i);
      draw();
    });
  };
  $('#bCheck').onclick=()=>{
    if(Q.answered)return;
    if(marks.size!==need){$('#fb').innerHTML=`<div class="note">${it.names?'はじまりを':word+'の はじまりを'} ${need}こ えらんでから おしてね。</div>`;return;}
    const ok=it.ans.every(a=>marks.has(a));
    draw(true);$('#dleft').textContent='';
    record(it,ok);
  };
  $('#bReset').onclick=()=>{if(Q.answered)return;marks=new Set();draw();};
  draw();
}
function bindPick(it){
  document.querySelectorAll('#qBody .sent').forEach(b=>b.onclick=()=>{
    if(Q.answered)return;
    const i=+b.dataset.i, ok=it.ans.includes(i);
    document.querySelectorAll('#qBody .sent').forEach(x=>{
      const j=+x.dataset.i;
      if(it.ans.includes(j))x.classList.add('right');
      else if(x===b)x.classList.add('wrong');
    });
    record(it,ok);
  });
}


function record(it,ok){
  Q.answered=true;
  const day=touchDay();day.q++;S.stats.answered++;
  const sk=S.skills[it.s]||(S.skills[it.s]={t:0,c:0});sk.t++;
  ev('answer');
  if(ok){
    sk.c++;Q.c++;S.stats.correct++;Q.combo++;
    S.stats.comboMax=Math.max(S.stats.comboMax,Q.combo);
    let gain=10;
    const r=S.review[it.id];
    if(r&&r.due<=Date.now()){r.box++;if(r.box>=3){delete S.review[it.id];S.stats.learned++;toast('🧠 おぼえた！ ふくしゅう クリア');}else r.due=Date.now()+BOXDAYS[r.box]*DAY;gain+=5;ev('reviewok');}
    if(Q.combo===3||Q.combo===5||Q.combo%10===0){const b=Q.combo>=10?10:Q.combo;gain+=b;toast(`🔥 ${Q.combo}れんぞく！ ボーナス +${b}`);}
    if(Q.combo===5)ev('combo5');
    if(Q.mode==='boss')Q.hp--;
    ev('correct');sfx('ok');addXP(gain);
  }else{
    Q.combo=0;S.review[it.id]={box:0,due:Date.now()+(Q.mode==='review'?10*60000:0)};sfx('ng');
  }
  save();renderHead();
  $('#qCombo').textContent=Q.combo>=2?`🔥${Q.combo}れんぞく`:'';
  document.querySelectorAll('#qBody button:not(.sm)').forEach(b=>b.disabled=true);
  if(Q.mode==='ta'){
    $('#qCount').textContent=`${Q.c} もん せいかい`;
    setTimeout(()=>{if(Q.done)return;Q.list.push(Q.pool());Q.idx++;renderQ();},ok?350:900);
    return;
  }
  const last=Q.idx+1>=Q.list.length||(Q.mode==='boss'&&Q.hp<=0);
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'ng'}"><div class="fbt">${ok?pick(['せいかい！ 🎉','やったね！ ✨','すごい！ 🌟']):'おしい！ もういちど みてみよう'}</div><div>${esc(it.w)}</div>${ok?'':it.f==='d'?'<div>いろの かわる ところが こたえです。上の 文で たしかめよう。</div><div class="note">この もんだいは「ふくしゅう」に 入ったよ。</div>':`<div>こたえは「${esc(answerText(it))}」</div><div class="note">この もんだいは「ふくしゅう」に 入ったよ。</div>`}</div><div class="row center"><button class="btn primary" id="bNext">${last?'けっかを みる':'つぎへ →'}</button></div>`;
  $('#bNext').onclick=()=>{Q.idx++;if(Q.idx>=Q.list.length||(Q.mode==='boss'&&Q.hp<=0))finish();else renderQ();};
  $('#bNext').focus({preventScroll:true});
  $('#fb').scrollIntoView({behavior:'smooth',block:'center'});
}
function finish(){
  Q.done=true;clearInterval(Q.timer);
  let h='',btns=[];const answered=Q.mode==='ta'?Q.idx+(Q.answered?1:0):Q.idx;
  if(Q.mode==='stage'){
    const c=Q.c,rt=answered?c/answered:0,stars=rt>=1?3:rt>=.8?2:rt>=.6?1:0,prev=S.stars[Q.stageId]||0;
    if(stars>prev)S.stars[Q.stageId]=stars;
    let bonus=0;if(!prev&&stars>0){bonus=20;}
    if(stars>0){ev('stageclear');confetti(stars*40);}
    const stg=STAGES.find(s=>s.id===Q.stageId);
    const lv=LEVELS.find(l=>l.stages.includes(Q.stageId)),nextId=lv.stages[lv.stages.indexOf(Q.stageId)+1];
    const cleared=lv.stages.every(id=>(S.stars[id]||0)>0);
    h=`<div class="bigst">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><h2>${stars?'ステージ クリア！':'おしい！ もういちど いこう'}</h2><p>${c} / ${answered} もん せいかい</p>${bonus?`<p class="note">はじめての クリア ボーナス +${bonus} EXP</p>`:''}${stg.ask?`<div class="refl"><div class="rq">✏️ ${esc(stg.ask)}</div><textarea id="refl" rows="4" maxlength="400" placeholder="ここに 書こう（書かなくても だいじょうぶ）">${esc((S.notes||{})[Q.stageId]||'')}</textarea><div class="note">書いた ことは、この たんまつに のこります。ともだちや 先生と 話しあって みよう。</div></div>`:''}`;
    btns.push({label:'もういちど',fn:()=>startStage(Q.stageId)});
    if(nextId)btns.push({label:'つぎの ステージ →',fn:()=>startStage(nextId),cls:'primary'});
    if(cleared&&!S.bossWin[lv.id])btns.push({label:`${lv.emoji} ボスに ちょうせん`,fn:()=>startBoss(lv.id),cls:'primary'});
    if(bonus)addXP(bonus);
  }else if(Q.mode==='boss'){
    const win=Q.hp<=0;let bonus=0;
    if(win&&!S.bossWin[Q.lv]){S.bossWin[Q.lv]=true;bonus=50;}
    if(win)confetti(180);
    h=`<div class="bigst">${win?'🏆':'💪'}</div><h2>${win?'ボスを たおした！':'あと すこし！ もういちど いこう'}</h2><p>${Q.c} / ${answered} もん せいかい</p>${bonus?`<p class="note">ボス さいしょの しょうり +${bonus} EXP</p>`:''}`;
    btns.push({label:'もういちど',fn:()=>startBoss(Q.lv)});
    if(bonus)addXP(bonus);
  }else if(Q.mode==='review'){
    h=`<div class="bigst">🔁</div><h2>ふくしゅう おつかれさま！</h2><p>${Q.c} / ${answered} もん せいかい</p><p class="note">せいかいした もんだいは、日を あけて もう一ど でるよ。3かい せいかいで「おぼえた！」</p>`;
    if(dueReviews().length)btns.push({label:'つづけて ふくしゅう',fn:startReview,cls:'primary'});
  }else{
    const best=S.best.ta,nb=Q.c>best;if(nb)S.best.ta=Q.c;S.stats.ta++;ev('ta');
    if(nb&&Q.c>0)confetti(120);
    h=`<div class="bigst">⏱️</div><h2>${Q.c} もん せいかい！</h2><p>${nb&&best?'🎉 じこベスト こうしん！':`じこベスト：${S.best.ta}もん`}</p>`;
    btns.push({label:'もういちど',fn:startTA,cls:'primary'});
    if(Q.c)addXP(Q.c*3);
  }
  save();checkBadges();
  btns.push({label:'マップへ',fn:()=>show('map'),cls:'ghost'});

  btns.forEach(b=>{const el=document.createElement('button');el.className='btn '+(b.cls||'');el.textContent=b.label;el.onclick=b.fn;$('#rbtns').appendChild(el);});
  const ta=$('#refl');

  show('res');
}

  <div class="setrow"><span class="sl">🔠 もじの 大きさ</span><button class="btn sm${!st.big?' on':''}" data-big="0">ふつう</button><button class="btn sm${st.big?' on':''}" data-big="1">大きい</button></div>
  <div class="setrow"><span class="sl">⏰ やすけいの おしらせ（15ぷん ごと）</span><button class="btn sm${st.rest?' on':''}" data-set="rest">${st.rest?'オン':'オフ'}</button></div>
  <div class="setrow"><span class="sl">🎨 きせかえ（レベルで ふえる）</span>${THEMES.map(t=>`<button class="btn sm${st.theme===t[0]?' on':''}" data-theme="${t[0]}" ${lv>=t[2]?'':'disabled'}>${lv>=t[2]?'':'🔒'}${t[1]}${lv>=t[2]?'':`（Lv${t[2]}）`}</button>`).join('')}</div>
  </div>
  <div class="row"><button class="btn" id="sParent">👪 おうちの方・先生へ（きろく）</button></div>
  ${storageOK?'':'<p class="note">⚠️ この ブラウザでは きろくを ほぞん できない せっていに なって います。</p>'}`;
  const v=vEl('settings');
  v.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{st[b.dataset.set]=!st[b.dataset.set];save();renderSettings();sfx('tap');});
  v.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{st.rate=+b.dataset.rate;save();renderSettings();});
  v.querySelectorAll('[data-big]').forEach(b=>b.onclick=()=>{st.big=b.dataset.big==='1';save();renderHead();renderSettings();});
  v.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{st.theme=b.dataset.theme;save();renderHead();renderSettings();});
  $('#sTest').onclick=()=>speak('むん先生の 学習クエスト。いっしょに がんばろう。');
  $('#sParent').onclick=()=>show('parent');
}
function renderParent(){
  const st=S.stats,acc=st.answered?Math.round(st.correct/st.answered*100):0,studied=Object.keys(S.days).length;
  const min=Math.round(st.sec/60);
  const skillRows=Object.keys(SKILLS).map(k=>{const r=S.skills[k];return r&&r.t?`<tr><td>${esc(SKILLS[k])}</td><td>${r.c}/${r.t}</td><td>${Math.round(r.c/r.t*100)}%</td></tr>`:'';}).join('');
  const weakChars=Object.entries(S.kana).filter(([c,k])=>k.tries).sort((a,b)=>(a[1].best||0)-(b[1].best||0)).slice(0,10).map(([c,k])=>`${c}（★${k.best||0}）`).join('　');
  vEl('parent').innerHTML=`<div class="prhead"><button class="btn sm ghost" id="pBack2">← せってい</button><h2>👪 おうちの方・先生へ</h2></div>
  <p class="note">この 画面の きろくは、この たんまつの 中だけに あります。どこにも 送られません。</p>
  <div class="stat"><div><b>Lv ${lvInfo(S.xp).lv}</b>レベル</div><div><b>${studied}</b>学習した日</div><div><b>${streak()}</b>れんぞく日数</div><div><b>${min}</b>学習時間（分）</div>
  <div><b>${st.answered}</b>答えた問題</div><div><b>${acc}%</b>正答率</div><div><b>${st.written}</b>書いた文字</div><div><b>${st.learned}</b>復習で覚えた</div>
  <div><b>${kanaCount('all',3)}/160</b>漢字🐔以上</div><div><b>${kanaCount('all',1)}/160</b>漢字🥚以上</div><div><b>${BADGES.filter(b=>S.badges[b.id]).length}</b>バッジ</div><div><b>${dueReviews().length}</b>復習待ち</div></div>
  <h2 class="sec">分野ごとの 正答率</h2><div class="panel">${skillRows?`<table class="tb"><tr><th>分野</th><th>正解/回答</th><th>正答率</th></tr>${skillRows}</table>`:'<span class="note">まだ 記録が ありません。</span>'}</div>
  <h2 class="sec">書く練習で 星が 少ない 文字</h2><div class="panel">${weakChars||'<span class="note">まだ 記録が ありません。</span>'}</div>
  <h2 class="sec">記録の 管理</h2><div class="panel"><p class="note">記録を すべて 消すと、もとに もどせません。</p><button class="btn sm ghost" id="pReset">記録を すべて 消す</button></div>`;
  $('#pBack2').onclick=()=>show('settings');
  $('#pReset').onclick=()=>modal({icon:'⚠️',title:'記録を すべて 消しますか？',html:'<p>レベル・バッジ・書いた文字も すべて 消えます。<br>もとに もどせません。</p>',buttons:[{label:'やめる',cls:'primary'},{label:'消す',cls:'ghost',fn:()=>modal({icon:'⚠️',title:'ほんとうに 消しますか？',buttons:[{label:'やめる',cls:'primary'},{label:'すべて 消す',cls:'ghost',fn:()=>{const keep=S.settings;S=clone(DEF);S.settings=keep;S.migrated=true;save();show('map');toast('記録を 消しました');}}]})}]});
}

/* ================= じかん・やすけい・ログイン ================= */
let lastAct=Date.now(),sinceRest=0;
['pointerdown','keydown'].forEach(e=>addEventListener(e,()=>{lastAct=Date.now();},{passive:true}));
setInterval(()=>{
  if(document.hidden||Date.now()-lastAct>120000)return;
  S.stats.sec+=30;touchDay().sec+=30;sinceRest+=30;save();
  if(S.settings.rest&&sinceRest>=900){sinceRest=0;modal({icon:'🌿',title:'ひとやすみ しよう',html:'<p>15ふん がんばったね！<br>とおくを 見て、目を やすめよう。<br>おみずも のもうね。</p>',buttons:[{label:'やすんだよ',cls:'primary'}]});}
},30000);

function startup(){
  ensureMissions();
  const k=today();
  if(migratedNote)modal({icon:'📦',title:'まえの きろくを ひきついだよ',html:`<p>EXP ${migratedNote.xp}・クリアした ステージ ${migratedNote.stages}こ<br>まちがえた もんだいは「ふくしゅう」に 入って いるよ。</p>`});
  if(S.lastLogin!==k){
    const first=!S.lastLogin;S.lastLogin=k;touchDay();save();
    modal({icon:'🎁',title:first?'ようこそ！':'ログイン ボーナス',html:`<p>${first?'きょうから いっしょに がんばろう！<br>':''}+10 EXP　🔥 ${streak()}にち れんぞく</p>`,buttons:[{label:'うけとる',cls:'primary',fn:()=>{addXP(10);checkBadges();}}]});
  }
  show('map');
}
startup();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クラスで人狼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ub:clamp(1px,calc(0.25px + 0.075vw),1.6px);--k:1;--u:calc(var(--ub) * var(--k))}
html{font-size:calc(16 * var(--u))}
body.lg{--u:calc(var(--ub) * 1.3 * var(--k))}

:root{
  /* layout: sticky top bar; each phase = one big "stage" card topped by a code-drawn scene; palette shifts day / night / dawn / dusk */
  --font-display:"Dela Gothic One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --font-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --bg:#e7f2ff; --panel:#ffffff; --ink:#13244a; --muted:#566789; --line:#c9d9f2;
  --accent:#ff8a1f; --accent-ink:#2b1600; --shadow:0 calc(6 * var(--u)) 0 rgba(19,36,74,.09);
  --wolf:#d6334a; --seer:#7a4fd6; --knight:#1f7fd1; --villager:#2a9a5e;
  --good:#1f8a52; --bad:#d6334a;
  color-scheme:light;
}
body[data-phase="night"]{--bg:#0b1030;--panel:#161d4a;--ink:#eef1ff;--muted:#a7b0dc;--line:#2b3676;--accent:#ffd45c;--accent-ink:#2a2100;--shadow:0 calc(6 * var(--u)) 0 rgba(0,0,0,.3);--wolf:#ff7184;--seer:#b79bff;--knight:#62b6ff;--villager:#62d89c;--good:#62d89c;--bad:#ff7184;color-scheme:dark}
body[data-phase="dawn"]{--bg:#fff0dc;--panel:#fffaf3;--ink:#3a2410;--muted:#7a5a35;--line:#f1d3a6;--accent:#ff7a3d;--accent-ink:#2b1000;--shadow:0 calc(6 * var(--u)) 0 rgba(120,70,0,.1)}
body[data-phase="dusk"]{--bg:#25102e;--panel:#371a45;--ink:#fff1f6;--muted:#d6b2cf;--line:#5a2d68;--accent:#ff6b57;--accent-ink:#2a0700;--shadow:0 calc(6 * var(--u)) 0 rgba(0,0,0,.3);--wolf:#ff7d8e;--seer:#c4a6ff;--knight:#7cc2ff;--villager:#74e0a8;--good:#74e0a8;--bad:#ff7d8e;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:calc(18 * var(--u));line-height:1.65;transition:background-color .6s,color .6s;-webkit-tap-highlight-color:transparent}
body.lg{font-size:calc(22 * var(--u))}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:calc(1120 * var(--u));margin:0 auto;padding:calc(16 * var(--u))}
body.lg .wrap{max-width:calc(1340 * var(--u))}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:calc(3 * var(--u)) solid var(--accent);outline-offset:calc(3 * var(--u))}
ruby rt{font-size:.5em;font-weight:500;letter-spacing:0}
body.noruby rt{display:none}
.muted{color:var(--muted)}
.hide{display:none!important}
svg{display:block}

@keyframes rise{from{opacity:0;transform:translateY(calc(16 * var(--u)))}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes flip{from{transform:perspective(calc(800 * var(--u))) rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-calc(8 * var(--u)))}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-calc(40 * var(--u)))}to{transform:translateX(calc(60 * var(--u)))}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes grow{from{width:0}}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(720deg)}}
@keyframes cur{0%{opacity:0}12%{opacity:1}78%{opacity:1}100%{opacity:0}}
@keyframes ctext{0%{transform:scale(.7);opacity:0}20%{transform:scale(1.05);opacity:1}30%{transform:scale(1)}100%{transform:scale(1.04)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}50%{box-shadow:0 0 0 calc(14 * var(--u)) transparent}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 0 calc(14 * var(--u)) var(--rc))}}
.tw{animation:tw 3s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.drift{animation:drift 26s ease-in-out infinite alternate}
.drift2{animation:drift 38s ease-in-out infinite alternate-reverse}
.bob{animation:float 3.5s ease-in-out infinite}

/* buttons */
.btn{min-height:calc(56 * var(--u));padding:calc(10 * var(--u)) calc(22 * var(--u));border-radius:calc(16 * var(--u));border:calc(2 * var(--u)) solid var(--line);background:var(--panel);font-weight:700;line-height:1.3;box-shadow:var(--shadow);transition:transform .08s}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:0 calc(5 * var(--u)) 0 rgba(0,0,0,.25)}
.btn.xl{min-height:calc(78 * var(--u));font-size:1.35rem;padding:calc(14 * var(--u)) calc(44 * var(--u));border-radius:calc(24 * var(--u));font-weight:900}
.btn.go{animation:pulse 2s infinite}
.btn.sm{min-height:calc(44 * var(--u));padding:calc(6 * var(--u)) calc(14 * var(--u));font-size:.88rem;border-radius:calc(12 * var(--u));box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;animation:none}
.btn:active:not(:disabled){transform:translateY(calc(3 * var(--u)));box-shadow:none}
.btn.hold{position:relative;overflow:hidden}
.btn.hold::before{content:"";position:absolute;inset:0;background:var(--accent);opacity:.35;transform:scaleX(0);transform-origin:left}
.btn.hold.holding::before{transform:scaleX(1);transition:transform 1.4s linear}
.actions{display:flex;flex-wrap:wrap;gap:calc(12 * var(--u));justify-content:center;align-items:center}

/* top bar */
.topbar{background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(calc(8 * var(--u)));border-bottom:calc(2 * var(--u)) solid var(--line);position:sticky;top:0;z-index:6}
.bar{display:flex;flex-wrap:wrap;gap:calc(8 * var(--u)) calc(14 * var(--u));align-items:center;padding-top:calc(8 * var(--u));padding-bottom:calc(8 * var(--u))}
.brand{font-family:var(--font-display);font-size:1.1rem}
.chips{display:flex;gap:calc(8 * var(--u));flex-wrap:wrap;flex:1;align-items:center}
.chip{padding:calc(3 * var(--u)) calc(14 * var(--u));border-radius:calc(999 * var(--u));border:calc(2 * var(--u)) solid var(--line);font-weight:700;font-size:.92rem;white-space:nowrap}
.chip.phase{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.tools{display:flex;gap:calc(6 * var(--u));flex-wrap:wrap}

/* scenes & art */
.scene{width:100%;height:clamp(calc(110 * var(--u)),20vw,calc(180 * var(--u)));border-radius:calc(22 * var(--u));overflow:hidden;flex:none}
.scene svg{width:100%;height:100%}
.art{--rc:var(--villager);width:min(calc(220 * var(--u)),58vw);aspect-ratio:1;border-radius:24%;overflow:hidden;box-shadow:0 calc(10 * var(--u)) 0 rgba(0,0,0,.18),0 0 0 calc(5 * var(--u)) var(--rc);flex:none;animation:glow 3s ease-in-out infinite}
.art svg{width:100%;height:100%}
.art.sm{width:calc(64 * var(--u));border-radius:calc(20 * var(--u));box-shadow:0 0 0 calc(3 * var(--u)) var(--rc);animation:none}
.art.md{width:calc(120 * var(--u))}
.r-wolf{--rc:var(--wolf)}.r-seer{--rc:var(--seer)}.r-knight{--rc:var(--knight)}.r-villager{--rc:var(--villager)}

/* hero */
.hero{position:relative;border-radius:calc(30 * var(--u));overflow:hidden;min-height:clamp(calc(220 * var(--u)),38vw,calc(340 * var(--u)));box-shadow:var(--shadow);margin-top:calc(6 * var(--u))}
.hero .scene{position:absolute;inset:0;height:100%;border-radius:0}
.hero-in{position:relative;padding:clamp(calc(18 * var(--u)),4vw,calc(40 * var(--u)));display:flex;flex-direction:column;gap:calc(10 * var(--u));justify-content:flex-end;min-height:inherit;color:#fff;text-shadow:0 calc(3 * var(--u)) 0 rgba(0,0,0,.35)}
.hero h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2.6rem,9vw,5rem);line-height:1.1}
.hero h1 em{font-style:normal;color:#ffd45c}
.hero p{font-size:1.05rem;max-width:36em;font-weight:700}
.hero-roles{display:flex;gap:calc(10 * var(--u));flex-wrap:wrap}
.hero-roles .art{width:clamp(calc(54 * var(--u)),9vw,calc(80 * var(--u)));border-radius:calc(22 * var(--u));animation:float 3.5s ease-in-out infinite}
.hero-roles .art:nth-child(2){animation-delay:.4s}.hero-roles .art:nth-child(3){animation-delay:.8s}.hero-roles .art:nth-child(4){animation-delay:1.2s}

/* setup */
.panel{background:var(--panel);border:calc(2 * var(--u)) solid var(--line);border-radius:calc(24 * var(--u));padding:clamp(calc(16 * var(--u)),3vw,calc(28 * var(--u)));display:flex;flex-direction:column;gap:calc(16 * var(--u));box-shadow:var(--shadow)}
.panel h2{font-size:1.2rem;font-weight:900;display:flex;gap:calc(12 * var(--u));align-items:center}
.panel h2 .no{width:calc(36 * var(--u));height:calc(36 * var(--u));border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--font-display);font-size:1rem;flex:none}
.stack{display:flex;flex-direction:column;gap:calc(16 * var(--u))}
.row{display:flex;flex-wrap:wrap;gap:calc(10 * var(--u)) calc(18 * var(--u));align-items:center}
.row > .lbl{font-weight:700;min-width:10.5em}
.seg{display:inline-flex;flex-wrap:wrap;border:calc(2 * var(--u)) solid var(--line);border-radius:calc(14 * var(--u));overflow:hidden;background:var(--panel)}
.segbtn{border:0;background:transparent;padding:calc(8 * var(--u)) calc(16 * var(--u));min-height:calc(48 * var(--u));font-weight:700}
.segbtn.on{background:var(--ink);color:var(--bg)}
.stepper{display:inline-flex;align-items:center;gap:calc(8 * var(--u))}
.step{min-width:calc(52 * var(--u));height:calc(52 * var(--u));border-radius:calc(14 * var(--u));border:calc(2 * var(--u)) solid var(--line);background:var(--panel);font-size:1.15rem;font-weight:900;padding:0 calc(8 * var(--u))}
.step:disabled{opacity:.35;cursor:not-allowed}
.stepper output{min-width:2.6ch;text-align:center;font-family:var(--font-display);font-size:2.2rem;font-variant-numeric:tabular-nums}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(200 * var(--u)),1fr));gap:calc(10 * var(--u))}
.preset{border:calc(2 * var(--u)) solid var(--line);border-radius:calc(18 * var(--u));background:var(--bg);padding:calc(12 * var(--u)) calc(14 * var(--u));text-align:left;display:flex;flex-direction:column;gap:calc(2 * var(--u))}
.preset b{font-size:1.1rem}
.preset span{font-size:.85rem;color:var(--muted)}
.preset.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel))}
.hosts{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(250 * var(--u)),1fr));gap:calc(12 * var(--u))}
.host{border:calc(3 * var(--u)) solid var(--line);border-radius:calc(20 * var(--u));background:var(--bg);padding:calc(14 * var(--u)) calc(16 * var(--u));text-align:left;display:flex;flex-direction:column;gap:calc(4 * var(--u))}
.host.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.host b{font-size:1.15rem}
.host span{font-size:.9rem;color:var(--muted)}
textarea{width:100%;min-height:calc(120 * var(--u));border-radius:calc(16 * var(--u));border:calc(2 * var(--u)) solid var(--line);background:var(--bg);color:var(--ink);padding:calc(12 * var(--u)) calc(14 * var(--u));resize:vertical}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(220 * var(--u)),1fr));gap:calc(14 * var(--u))}
.rcard{border:calc(2 * var(--u)) solid var(--line);border-radius:calc(22 * var(--u));padding:calc(14 * var(--u));display:flex;flex-direction:column;gap:calc(10 * var(--u));background:var(--bg)}
.rhead{display:flex;gap:calc(12 * var(--u));align-items:center}
.rname{font-family:var(--font-display);font-size:1.5rem;line-height:1.2;color:var(--rc)}
.rdesc{font-size:.92rem;color:var(--muted)}
.rcount{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.auto{font-weight:700;color:var(--muted);font-size:.9rem}
.sumline{font-weight:900;font-variant-numeric:tabular-nums}
.warn{background:var(--bad);color:#fff;border-radius:calc(14 * var(--u));padding:calc(10 * var(--u)) calc(16 * var(--u));font-weight:700}
.hint{border-left:calc(6 * var(--u)) solid var(--accent);background:var(--bg);border-radius:calc(10 * var(--u));padding:calc(8 * var(--u)) calc(14 * var(--u));font-size:.92rem}
.rules{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:calc(6 * var(--u))}
.win2{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(260 * var(--u)),1fr));gap:calc(12 * var(--u))}
.win2 > div{border-radius:calc(16 * var(--u));padding:calc(12 * var(--u)) calc(16 * var(--u));background:var(--bg);font-size:.95rem}
.win2 b{display:block;font-size:1.05rem}
.startbar{position:sticky;bottom:0;padding:calc(16 * var(--u)) 0 calc(14 * var(--u));display:flex;flex-direction:column;gap:calc(10 * var(--u));align-items:center;background:linear-gradient(transparent,var(--bg) 35%);z-index:3}
.resume{background:var(--accent);color:var(--accent-ink);border-radius:calc(20 * var(--u));padding:calc(14 * var(--u)) calc(18 * var(--u));display:flex;flex-wrap:wrap;gap:calc(10 * var(--u)) calc(16 * var(--u));align-items:center;justify-content:space-between;font-weight:900}
details.how summary{cursor:pointer;font-weight:900;font-size:1.1rem;min-height:calc(44 * var(--u));display:flex;align-items:center}
ol.howl{margin:calc(8 * var(--u)) 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:calc(6 * var(--u));text-align:left}

/* player tiles */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(104 * var(--u)),1fr));gap:calc(12 * var(--u));width:100%}
.stage .pgrid:not(.sm){grid-template-columns:repeat(auto-fit,minmax(calc(104 * var(--u)),calc(150 * var(--u))));justify-content:center}
.pgrid.sm{grid-template-columns:repeat(auto-fill,minmax(calc(84 * var(--u)),1fr));gap:calc(8 * var(--u))}
.pt{position:relative;border-radius:calc(20 * var(--u));border:calc(2 * var(--u)) solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:calc(4 * var(--u));padding:calc(10 * var(--u)) calc(4 * var(--u)) calc(8 * var(--u));min-width:0;box-shadow:var(--shadow);transition:transform .12s}
.pgrid.sm .pt{padding:calc(6 * var(--u)) calc(2 * var(--u));box-shadow:none}
.av{width:calc(64 * var(--u));height:calc(64 * var(--u));border-radius:50%;overflow:hidden;box-shadow:0 0 0 calc(3 * var(--u)) var(--sc);flex:none}
.pgrid.sm .av{width:calc(46 * var(--u));height:calc(46 * var(--u))}
.av svg{width:100%;height:100%}
.pnum{position:absolute;top:calc(4 * var(--u));left:calc(6 * var(--u));min-width:calc(26 * var(--u));height:calc(26 * var(--u));border-radius:calc(13 * var(--u));background:var(--sc);color:#fff;font-family:var(--font-display);font-size:.85rem;display:grid;place-items:center;padding:0 calc(5 * var(--u));text-shadow:0 calc(1 * var(--u)) 0 rgba(0,0,0,.3)}
.pnm{font-weight:900;font-size:.98rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3;padding:0 calc(4 * var(--u))}
.pgrid.sm .pnm{font-size:.82rem}
.pt.sel{background:var(--accent);color:var(--accent-ink);border-color:transparent;transform:scale(1.07);animation:pop .25s}
.pt.out{opacity:.35;box-shadow:none;filter:grayscale(1)}
.pt.out .pnm{text-decoration:line-through}
.pt.seen{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--panel))}
.pt.seen::after{content:"見た";position:absolute;top:calc(4 * var(--u));right:calc(8 * var(--u));font-size:.7rem;font-weight:900;color:var(--good)}
.pt.lock{opacity:.4}
button.pt:active:not(.out){transform:scale(.95)}
.mk{font-size:.72rem;font-weight:900;padding:calc(1 * var(--u)) calc(10 * var(--u));border-radius:calc(99 * var(--u));color:#fff;background:var(--rc);white-space:nowrap}
.pt.kspin{background:var(--accent);color:var(--accent-ink);transform:scale(1.08)}

/* stage */
.main{flex:1;display:flex;flex-direction:column;gap:calc(16 * var(--u))}
.stage{background:var(--panel);border:calc(2 * var(--u)) solid var(--line);border-radius:calc(30 * var(--u));padding:clamp(calc(14 * var(--u)),3vw,calc(30 * var(--u)));text-align:center;display:flex;flex-direction:column;gap:calc(16 * var(--u));align-items:center;box-shadow:var(--shadow);animation:rise .35s ease both}
.stage h1{font-family:var(--font-display);font-weight:400;font-size:clamp(1.8rem,5vw,3rem);line-height:1.3;text-wrap:balance}
.big{font-size:clamp(1.15rem,2.7vw,1.8rem);font-weight:900;text-wrap:balance}
.note{color:var(--muted);max-width:46em;font-size:.95rem}
.tag{padding:calc(4 * var(--u)) calc(18 * var(--u));border-radius:calc(999 * var(--u));background:var(--rc,var(--ink));color:var(--bg);font-weight:900;font-size:.95rem}
.picked{font-weight:900;font-size:1.2rem;min-height:1.8em}
.result{font-family:var(--font-display);font-size:clamp(1.9rem,6.5vw,3.6rem);line-height:1.25;animation:pop .5s}
.result.is-wolf{color:var(--wolf)}
.result.is-safe{color:var(--good)}
.dots{display:flex;gap:calc(10 * var(--u));align-items:center;flex-wrap:wrap;justify-content:center}
.dot{padding:calc(3 * var(--u)) calc(14 * var(--u));border-radius:calc(99 * var(--u));border:calc(2 * var(--u)) solid var(--line);font-size:.85rem;font-weight:700;color:var(--muted)}
.dot.on{background:var(--rc);border-color:transparent;color:var(--bg)}
.dot.done{opacity:.45}
.bigav{width:clamp(calc(120 * var(--u)),26vw,calc(170 * var(--u)));height:clamp(calc(120 * var(--u)),26vw,calc(170 * var(--u)));border-radius:50%;overflow:hidden;box-shadow:0 0 0 calc(8 * var(--u)) var(--sc),0 calc(12 * var(--u)) 0 rgba(0,0,0,.18);animation:pop .4s}
.bigav svg{width:100%;height:100%}
.bigav.ghost{filter:grayscale(1);opacity:.7}
.hist{width:100%;max-width:calc(520 * var(--u));text-align:left;background:var(--bg);border-radius:calc(16 * var(--u));padding:calc(10 * var(--u)) calc(16 * var(--u));font-size:.95rem}
.hist li{margin:calc(2 * var(--u)) 0}
.countbar{width:100%;max-width:calc(520 * var(--u));height:calc(10 * var(--u));border-radius:calc(99 * var(--u));background:var(--bg);overflow:hidden}
.countbar span{display:block;height:100%;background:var(--accent);width:100%}
.progress{width:100%;height:calc(14 * var(--u));border-radius:calc(99 * var(--u));background:var(--bg);overflow:hidden;border:calc(2 * var(--u)) solid var(--line)}
.progress span{display:block;height:100%;background:var(--good);transition:width .3s}
.tips{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(220 * var(--u)),1fr));gap:calc(10 * var(--u));text-align:left}
.tips div{background:var(--bg);border-radius:calc(14 * var(--u));padding:calc(10 * var(--u)) calc(14 * var(--u));font-size:.95rem}
.codebig{font-family:var(--font-display);font-size:clamp(2.4rem,9vw,5rem);letter-spacing:.08em;font-variant-numeric:tabular-nums;color:var(--accent)}

/* discuss */
.ringwrap{position:relative;width:clamp(calc(200 * var(--u)),44vw,calc(300 * var(--u)));aspect-ratio:1}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .rt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:clamp(2.8rem,10vw,4.6rem);font-variant-numeric:tabular-nums}
.ringwrap.low .rt{color:var(--bad)}
#ring{transition:stroke-dashoffset .25s linear}
.talk{font-family:var(--font-display);font-size:clamp(1.3rem,4vw,2rem);min-height:1.6em}
.legend{display:flex;flex-wrap:wrap;gap:calc(8 * var(--u));align-items:center}

/* vote */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(140 * var(--u)),1fr));gap:calc(12 * var(--u));width:100%}

}

.amb{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.amb i{position:absolute;bottom:-4%;width:calc(6 * var(--u) * var(--s));height:calc(6 * var(--u) * var(--s));border-radius:50%;background:var(--amb-c,#fff);box-shadow:0 0 calc(10 * var(--u)) var(--amb-c,#fff);opacity:0;animation:ambUp linear infinite}

@keyframes ambUp{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}50%{transform:translate(calc(18 * var(--u)),-55vh)}90%{opacity:.6}100%{transform:translate(calc(-10 * var(--u)),-110vh);opacity:0}}

/* =========================================================

  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object'){const c=Object.assign({},DEF,s,{counts:Object.assign({},DEF.counts,s.counts||{})});c.n=Math.min(40,Math.max(4,Number(c.n)||30));if(!['tablet','teacher'].includes(c.host))c.host='teacher';return c;}}catch(e){}
  return JSON.parse(JSON.stringify(DEF));
}
function saveCfg(){try{localStorage.setItem(KEY,JSON.stringify(S.cfg));}catch(e){}}

  timer:{left:300,total:300,running:false,endAt:0},hist:[],modal:null,saved:null,me:null};
const SKIP=['cfg','hist','modal','saved','me'];
function snapJSON(){const o={};Object.keys(S).forEach(k=>{if(!SKIP.includes(k))o[k]=S[k];});return JSON.stringify(o);}
function pushHist(){if(S.host!=='teacher')return;S.hist.push(snapJSON());if(S.hist.length>80)S.hist.shift();}
function undo(){
  if(!S.hist.length)return;
  Object.assign(S,JSON.parse(S.hist.pop()));
  S.modal=null;S.timer.running=false;lastCurtain=curtainKey();render();toast('ひとつ前にもどしました');
}
function saveGame(){
  if(S.screen==='me')return;
  try{
    if(S.screen==='setup'||S.screen==='end'){localStorage.removeItem(GKEY);return;}
    localStorage.setItem(GKEY,JSON.stringify({state:JSON.parse(snapJSON()),hist:S.hist}));
  }catch(e){}
}
function loadSaved(){try{const g=JSON.parse(localStorage.getItem(GKEY));if(g&&g.state&&g.state.players&&g.state.players.length)return g;}catch(e){}return null;}

/* =========================================================

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function R(t){return String(t).replace(RB_RE,w=>`<ruby>${w}<rt>${RB[w]}</rt></ruby>`);}
function rubyify(html){
  const holds=[];
  html=html.replace(/<textarea[\s\S]*?<\/textarea>|<svg[\s\S]*?<\/svg>/g,m=>{holds.push(m);return '\u0000'+(holds.length-1)+'\u0000';});
  html=html.replace(/>([^<>]+)</g,(m,t)=>'>'+R(t)+'<');
  return html.replace(/\u0000(\d+)\u0000/g,(m,i)=>holds[i]);
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function note(f,t,d,type,vol){const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.05);}
function hit(t,d,vol,hp){const s=ac.createBufferSource();s.buffer=noise();const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t);s.stop(t+d+.05);}
const FX={
  tick(t){note(950,t,.06,'sine',.12);},
  ok(t){note(620,t,.09);note(880,t+.08,.14);},
  howl(t){
    const o=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain();
    o.type='sawtooth';const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=1400;

    l.frequency.value=5.5;lg.gain.value=10;l.connect(lg);lg.connect(o.frequency);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.09,t+.35);g.gain.setValueAtTime(.09,t+1.5);g.gain.exponentialRampToValueAtTime(.0001,t+2.3);
    o.connect(f);f.connect(g);g.connect(ac.destination);o.start(t);l.start(t);o.stop(t+2.4);l.stop(t+2.4);

  chime(t){[523,659,784,1047].forEach((f,i)=>note(f,t+i*.14,.6,'triangle',.18));},
  drum(t){for(let i=0;i<26;i++)hit(t+i*.065,.06,.08+i*.006,400);hit(t+26*.065,1.2,.35,3000);note(98,t+26*.065,.5,'sine',.4);},

  fanfare(t){[[523,.15],[523,.15],[523,.15],[659,.5],[587,.15],[659,.15],[784,.8]].reduce((tt,[f,d])=>{note(f,tt,d,'triangle',.2);note(f/2,tt,d,'sine',.12);return tt+d*.9;},t);},
  lose(t){[392,370,349,330].forEach((f,i)=>note(f,t+i*.35,.45,'sawtooth',.06));},
  warn(t){note(660,t,.15);note(660,t+.22,.15);},
  bell(t){[0,.35,.7].forEach(d=>note(880,t+d,.5,'triangle',.25));},
  out(t){note(330,t,.3,'triangle');note(247,t+.25,.6,'triangle');},

const avCache={};
function avatar(id){
  if(avCache[id])return avCache[id];
  const r=mulberry(id*7919+101),pk=a=>a[Math.floor(r()*a.length)];
  const bg=seatColor(id),skin=pk(SKIN),hair=pk(HAIR),shirt=pk(SHIRT);
  const hs=(id*5+Math.floor(r()*3))%6,ey=Math.floor(r()*4),mo=Math.floor(r()*4),acc=Math.floor(r()*6);
  let back='',front='';
  const short=`<path d="M27 48 C25 28 37 22 50 22 C63 22 75 28 73 48 C70 38 62 33 50 34 C40 33 31 38 27 48Z" fill="${hair}"/>`;
  if(hs===0)front=short;

  if(hs===5){back=`<circle cx="31" cy="25" r="9" fill="${hair}"/><circle cx="69" cy="25" r="9" fill="${hair}"/>`;front=short;}
  let eyes='';

function starsSVG(seed,n,h){const r=mulberry(seed);let s='';for(let i=0;i<n;i++){s+=`<circle class="tw" cx="${(r()*800).toFixed(0)}" cy="${(r()*h).toFixed(0)}" r="${(0.7+r()*1.6).toFixed(1)}" fill="#fff" style="animation-delay:${(r()*3).toFixed(2)}s"/>`;}return s;}

/* =========================================================
   seeded deal (same code => same roles on every device)
   ========================================================= */
function dealRoles(n,w,se,k,seed){
  const roles=[].concat(Array(w).fill('wolf'),Array(se).fill('seer'),Array(k).fill('knight'),Array(n-w-se-k).fill('villager'));
  const rnd=mulberry(seed*7919+12345);
  for(let i=roles.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[roles[i],roles[j]]=[roles[j],roles[i]];}
  return roles;
}
function pad(x,l){return String(x).padStart(l,'0');}
function makeCode(n,w,se,k,seed){return pad(n,2)+pad(w,2)+se+k+pad(seed,2);}
function parseCode(c){
  if(!/^\d{8}$/.test(c))return null;
  const o={n:+c.slice(0,2),w:+c.slice(2,4),se:+c[4],k:+c[5],seed:+c.slice(6,8)};
  if(o.n<4||o.n>60||o.w<1||o.w*2>=o.n||o.n-o.w-o.se-o.k<0)return null;
  return o;
}
function fmtCode(c){return c.slice(0,4)+' '+c.slice(4);}

/* =========================================================
   setup logic
   ========================================================= */
function names(){return S.cfg.names.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(0,40);}
function effN(){return S.cfg.n;}
function villN(){const c=S.cfg.counts;return effN()-c.wolf-c.seer-c.knight;}
function recommend(n){const w=n<=7?1:(n<=11?2:Math.max(2,Math.round(n/5)));const sk=n>=16?2:1;return {wolf:w,seer:sk,knight:n>=5||n===4?sk:0};}
function applyAuto(){if(S.cfg.auto)S.cfg.counts=recommend(effN());}
function problem(){
  const n=effN(),c=S.cfg.counts,v=villN();
  if(n<4)return '4人以上であそべます。';
  if(c.wolf<1)return '人狼は1人以上、必要です。';
  if(c.wolf*2>=n)return '人狼が多すぎます。人狼は、人数の半分より少なくしてください。';
  if(v<0)return '役職の合計が、人数をこえています。';
  if(S.cfg.host==='teacher'&&S.cfg.deal==='device'&&(c.seer>9||c.knight>9))return '児童の端末で見る場合、占い師と騎士は9人までです。';
  return '';
}

function tile(p,o){
  o=o||{};

  if(o.act&&!o.disabled)return `<button class="${cls}" data-act="${o.act}" data-id="${p.id}" aria-label="${esc(nm(p))}">${inner}</button>`;
  return `<div class="${cls}">${inner}</div>`;
}
function stage(o){return `<main class="wrap main"><section class="stage">${o.scene?sceneBox(o.scene):''}${o.top||''}${o.title?`<h1>${o.title}</h1>`:''}${o.big?`<p class="big">${o.big}</p>`:''}${o.note?`<p class="note">${o.note}</p>`:''}${o.extra||''}</section>${o.after||''}</main>`;}

    let body;
    if(r==='seer'){const t=byId(P.pick),w=t.role==='wolf';body=`${bigAv(t)}<div class="result ${w?'is-wolf':'is-safe'}">${who(t)}は<br>${w?'人狼です！':'人狼ではありません'}</div>${seerHist(p.id)}`;}
    else body=`${art(r,'md')}<div class="result">${{wolf:'おそう人を<br>決めました',knight:'守る人を<br>決めました',villager:'おやすみ<br>なさい'}[r]}</div>`;
    return header()+stage({title:'夜のけっか',big:'あなただけが、見てください。',extra:`${body}<button class="btn primary xl" data-act="p-next">見ました（かくす）</button>`});
  }
  const T={wolf:['おそう人をえらぶ','人狼のあなたは、今夜おそう人を1人えらびます。'],seer:['占う人をえらぶ','占い師のあなたは、人狼かどうか知りたい人を1人えらびます。'],knight:['守る人をえらぶ','騎士のあなたは、今夜守る人を1人えらびます。自分も守れます。'],villager:['あやしい人をえらぶ','村人のあなたは、ねむっています。あやしいと思う人を1人えらびましょう（ゲームには関係しません）。']}[r];
  let extra='';
  if(r==='wolf'){
    const mates=S.players.filter(q=>q.role==='wolf'&&q.id!==p.id);
    if(mates.length){
      const chosen=mates.filter(m=>S.acts.wolfBy[m.id]).map(m=>`${lab(m)}→${who(byId(S.acts.wolfBy[m.id]))}`);
      extra+=`<p class="mates">なかまの人狼：${mates.map(q=>lab(q)+(q.alive?'':'（ぬけた）')).join('、')}</p>${chosen.length?`<p class="hint">なかまのえらび：${chosen.join('、')}</p>`:''}`;
    }
    if(S.day===1&&!S.cfg.firstAttack)extra+='<p class="note">最初の夜なので、だれもおそいません。えらんでも、ゲームには関係しません。</p>';
  }
  if(r==='seer')extra+=seerHist(p.id);
  if(r==='knight'&&!S.cfg.guardRepeat&&S.lastGuard[p.id])extra+=`<p class="note">きのうの夜に守った ${who(byId(S.lastGuard[p.id]))}は、今夜は守れません。</p>`;
  return header()+stage({top:`<span class="tag">${p.id}番さん</span>`,title:T[0],big:T[1],extra:extra+pickGrid(targetsFor(p),'p-pick',P.pick,'p-done')});
}
function viewNightTeacher(){
  const N=S.tn;
  if(N.step===-1)return header()+stage({scene:'night',title:'夜になりました',big:'全員、目を閉じて、顔をふせてください。',note:'先生：しずかになったら「はじめる」を押します。このあとは、呼ばれた役職の人だけが目を開けます。',extra:'<button class="btn primary xl go" data-act="tn-next">はじめる</button>'});
  if(N.step>2)return header()+stage({scene:'dawn',title:'夜が明けます',big:'全員、顔を上げて、目を開けてください。',extra:'<button class="btn primary xl go" data-act="dawn">朝にする</button>'});
  const st=NIGHT[N.step],T=STEP[st];
  const dots=`<div class="dots">${NIGHT.map((s,i)=>`<span class="dot r-${s}${i===N.step?' on':''}${i<N.step?' done':''}">${STEP[s].short}</span>`).join('')}</div>`;
  const top=sceneBox('night')+dots;
  if(N.sub==='closed')return header()+stage({top,title:T.close,note:'先生：目を閉じたのを、見とどけてから進みます。',extra:`<button class="btn primary xl" data-act="tn-next">${T.next}</button>`});
  if(N.sub==='result'){
    const t=byId(S.acts.seer[S.acts.seer.length-1]),w=t.role==='wolf';
    return header()+stage({top,title:'占いの結果',big:'占い師だけが、画面を見てください。',extra:`${bigAv(t)}<div class="result ${w?'is-wolf':'is-safe'}">${who(t)}は<br>${w?'人狼です！':'人狼ではありません'}</div>${seerHist(null)}<button class="btn primary xl" data-act="tn-close">占い師は目を閉じました</button>`});
  }
  const living=S.players.some(p=>p.alive&&p.role===st);
  if(!living)return header()+stage({top,title:T.open,big:'（少し待ってから進みます）',note:`先生だけ読んでください：${T.short}は、もういません。目を開けた人がいるように見せるため、5秒ほど待ってから進みます。`,extra:`<button class="btn primary xl" data-act="tn-skip">${T.next}</button>`});
  if(st==='wolf'&&!(S.day>1||S.cfg.firstAttack))return header()+stage({top,title:T.open,big:'最初の夜なので、だれもおそいません。',note:'なかまの顔を、目で たしかめてください。',extra:'<button class="btn primary xl" data-act="tn-skip">たしかめた</button>'});
  const many=st!=='wolf'&&S.players.filter(p=>p.alive&&p.role===st).length>1?`<p class="note">${T.short}が2人以上いるときは、相談して1人を指さします。</p>`:'';
  const blocked=st==='knight'&&!S.cfg.guardRepeat?S.lastGuard.t:null;
  const list=S.players.map(p=>{
    const dis=!p.alive||(blocked&&p.id===blocked);
    return tile(p,{act:dis?null:'tn-pick',sel:N.pick===p.id,lock:blocked&&p.id===blocked});
  }).join('');
  return header()+stage({top,title:T.open,big:T.how,extra:`${many}${blocked?`<p class="note">きのう守った ${who(byId(blocked))}は、今夜は守れません。</p>`:''}<div class="pgrid">${list}</div><div class="picked">${N.pick?'えらんだ人：'+who(byId(N.pick)):'指でさされた人を、押してください'}</div><button class="btn primary xl" data-act="tn-confirm" ${N.pick?'':'disabled'}>${st==='seer'?'占う':'決定'}</button>`});
}

/* ---------- morning ---------- */
function viewMorning(){
  const m=S.morning;
  if(m.sub==='wait')return header()+stage({scene:'dawn',title:'朝になりました',big:'ゆうべ、村では…',note:'全員、顔を上げて、画面を見てください。',extra:'<button class="btn primary xl go" data-act="m-reveal">発表！</button>'});

  else extra=`<div class="result is-safe">平和な朝！</div><p class="big">ゆうべは、だれもおそわれませんでした。</p>${m.saved?'<p class="note">だれかが、だれかを守ったのかも…？</p>':''}`;
  return header()+stage({scene:'dawn',extra:extra+`<button class="btn primary xl go" data-act="m-next">${S.winner?'けっかを見る':'話し合いにすすむ'}</button>`});
}

/* ---------- discuss ---------- */
function composition(){const c={};S.players.forEach(p=>c[p.role]=(c[p.role]||0)+1);return `人狼 ${c.wolf||0}人・占い師 ${c.seer||0}人・騎士 ${c.knight||0}人・村人 ${c.villager||0}人`;}
function viewDiscuss(){
  const t=S.timer,done=t.left<=0,C=552.9,frac=t.total?Math.min(1,t.left/t.total):0;
  const legend=MARKS.filter(Boolean).map(m=>`<span class="mk r-${m.c}">${m.t}</span>`).join('');
  const gone=S.players.filter(p=>!p.alive);
  return header()+`<main class="wrap main split">
  <section class="stage">${sceneBox('day')}<h1>だれが人狼？</h1><p class="big">理由もいっしょに話そう！</p>
    <div class="ringwrap${t.left<=30?' low':''}" id="ringwrap"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke="var(--line)" stroke-width="14"/><circle id="ring" cx="100" cy="100" r="88" fill="none" stroke="${t.left<=30?'var(--bad)':'var(--good)'}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${(C*(1-frac)).toFixed(1)}"/></svg><div class="rt" id="timer">${fmt(t.left)}</div></div>
    <div class="actions"><button class="btn" data-act="timer-toggle" ${done?'disabled':''}>${t.running?'一時停止':'スタート'}</button><button class="btn" data-act="timer-add">＋1分</button><button class="btn" data-act="timer-reset">もどす</button></div>
    <div class="actions"><button class="btn" data-act="talk">話す人をくじで決める</button><span class="talk" id="talk">${S.talk?who(byId(S.talk))+'から話そう！':''}</span></div>
    <button class="btn primary xl${done?' go':''}" data-act="to-vote">投票にすすむ</button>
  </section>
  <section class="panel"><h2>しるしメモ</h2><p class="muted">名前をタップするたびに、しるしが かわります。</p><div class="legend">${legend}</div>
    <div class="pgrid">${alive().map(p=>tile(p,{act:'mark',mark:S.marks[p.id]||0})).join('')}</div></section>
  <section class="panel"><div class="tips"><div><b>はなしかた1</b><br>「だれが あやしい？ どうして？」をセットで言う</div><div><b>はなしかた2</b><br>占い師や騎士だと言う人は、本当かどうか、たしかめる</div><div><b>はなしかた3</b><br>しずかな人にも「どう思う？」と聞いてみる</div></div>
    <p class="muted">この村の役職（はじめ）：${composition()}</p>
    ${gone.length?`<p class="muted">ぬけた人：${gone.map(p=>lab(p)+(S.cfg.reveal?'（'+ROLE[p.role].name+'）':'')).join('、')}</p>`:''}</section></main>`;
}

/* ---------- vote ---------- */
function leadIds(counts,cands){const mx=Math.max(0,...cands.map(id=>counts[id]||0));return mx>0?cands.filter(id=>(counts[id]||0)===mx):[];}
function viewVote(){
  const v=S.vote;
  const head=v.round===2?'決選投票！':'追放する人を決めます';
  if(S.host==='tablet'){
    const P=S.pass,p=curP();
    if(P.sub==='intro')return header()+stage({scene:'dusk',title:head,big:v.round===2?`同数でした。${v.cands.map(id=>who(byId(id))).join('・')}の中から、もう一度 投票します。`:'タブレットを回して、1人ずつ、ひみつで投票します。',note:'ほかの人の画面は見ないでね。だれが だれに入れたかは、発表されません。',extra:'<button class="btn primary xl go" data-act="p-begin">投票をはじめる</button>'});
    if(P.sub==='turn')return header()+turnScreen(p,'タブレットを受け取ってください。ほかの人は、見ないでね。','');
    return header()+stage({top:`<span class="tag">${p.id}番さんの投票</span>`,title:'追放したい人は？',big:'いちばん あやしいと思う人を、えらびましょう。',extra:pickGrid(alive().filter(q=>q.id!==p.id&&v.cands.includes(q.id)),'p-pick',P.pick,'p-done','投票する')});
  }
  const lead=leadIds(v.counts,v.cands);
  const tiles=v.cands.map(id=>{const p=byId(id);return `<div class="vtile${lead.includes(id)?' lead':''}" data-id="${id}"><button class="vmain" data-act="v-inc" data-id="${id}" aria-label="${esc(nm(p))}に1票">${av(p)}<span class="vname">${lab(p)}</span><span class="vcount" id="vc-${id}">${v.counts[id]||0}</span></button><button class="vminus" data-act="v-dec" data-id="${id}" aria-label="${esc(nm(p))}の票を1つ減らす">−1</button></div>`;}).join('');
  const total=Object.values(v.counts).reduce((a,b)=>a+b,0),a=alive().length;
  return header()+`<main class="wrap main"><section class="stage">${sceneBox('dusk')}<h1>${head}</h1>
    ${v.round===2?'<p class="big">同数でした。同数の人だけで、もう一度 投票します。</p>':''}
    <p class="note">全員、目を閉じて、顔をふせます。先生が名前を呼んだら、追放したい人に1回だけ手をあげます。手の数を数えて、その人をタップしてください。</p>
    <div class="vgrid">${tiles}</div>
    <div id="vsum" class="vsum${total!==a?' off':''}">票の合計 ${total} / 生きている人 ${a}</div>
    <button class="btn primary xl" data-act="v-decide">開票する</button></section></main>`;
}
function viewReveal(){
  const rv=S.reveal;
  if(rv.sub==='drum')return header()+stage({scene:'dusk',title:'開票…',extra:BOX});
  const mx=Math.max(1,...rv.tally.map(t=>t[1]));
  const rows=rv.tally.filter(t=>t[1]>0).map((t,i)=>{const p=byId(t[0]);return `<div class="trow${rv.top.includes(t[0])?' top':''}"><span class="who">${av(p)}${lab(p)}</span><div class="bar2"><span style="width:${t[1]/mx*100}%;animation-delay:${i*.12}s"></span></div><b>${t[1]}</b></div>`;}).join('');
  let res,btn;
  if(rv.top.length===1){const p=byId(rv.top[0]);res=`<div class="result is-wolf">${who(p)}に<br>決まりました</div>`;btn='追放へ';}
  else if(rv.round===1){res='<div class="result">同数！</div><p class="big">決選投票をします</p>';btn='決選投票へ';}
  else if(S.cfg.tie==='kuji'){res='<div class="result">また同数！</div><p class="big">くじ引きで決めます</p>';btn='くじ引きへ';}
  else{res='<div class="result">また同数！</div><p class="big">今日は、だれも追放しません</p>';btn='つぎへ';}
  return header()+stage({scene:'dusk',title:'投票のけっか',extra:`<div class="tally">${rows}</div>${res}<button class="btn primary xl go" data-act="rv-next">${btn}</button>`});
}
function viewKuji(){
  const K=S.kuji;
  return header()+stage({scene:'dusk',title:'くじ引き！',big:K.sub==='done'?`${who(byId(K.winner))}に決まりました`:'だれになるかな…',extra:`<div class="pgrid" id="kgrid" style="max-width:640px">${K.cands.map(id=>tile(byId(id),{sel:K.sub==='done'&&id===K.winner})).join('')}</div>${K.sub==='done'?'<button class="btn primary xl go" data-act="kj-next">追放へ</button>':''}`});
}
function viewExpelled(){
  const e=S.expel;
  if(!e.id)return header()+stage({scene:'dusk',title:'今日は、だれも追放されません',extra:`<button class="btn primary xl go" data-act="ex-next">${S.winner?'けっかを見る':'夜にすすむ'}</button>`});
  const p=byId(e.id),lw=S.lw;
  const lwHtml=S.cfg.lastWords?`<div class="hist" style="text-align:center"><b>さいごのひとこと</b><p>${who(p)}、みんなに ひとこと どうぞ！</p><div class="talk" id="lwt">${lw&&lw.running?fmt(Math.max(0,Math.ceil((lw.endAt-Date.now())/1000))):(lw&&lw.done?'おしまい':'0:15')}</div>${lw&&(lw.running||lw.done)?'':'<button class="btn" data-act="lw-start">ひとことタイム スタート</button>'}</div>`:'';
  return header()+stage({scene:'dusk',extra:`${bigAv(p,true)}<div class="result">${who(p)}が<br>追放されました</div>${S.cfg.reveal?`<p class="big">役職は… <span style="color:var(--${p.role})">${ROLE[p.role].name}</span> でした</p>`:''}${lwHtml}<button class="btn primary xl go" data-act="ex-next">${S.winner?'けっかを見る':'夜にすすむ'}</button>`});
}

/* ---------- end ---------- */
function awards(){
  const out=[];
  const surv=alive();
  out.push(`<div class="award"><b>さいごまで生きのこった人</b>${surv.length?surv.map(p=>lab(p)).join('、'):'なし'}</div>`);
  const hits=S.seerLog.filter(x=>x.wolf).length;
  out.push(`<div class="award"><b>占い師の大発見</b>人狼を ${hits}回 見やぶった</div>`);
  out.push(`<div class="award"><b>騎士のファインプレー</b>人狼から ${S.stats.saves}回 守りきった</div>`);
  if(S.winner==='wolf'){const ws=S.players.filter(p=>p.role==='wolf'&&p.alive);out.push(`<div class="award"><b>正体をかくし通した人狼</b>${ws.map(p=>lab(p)).join('、')||'なし'}</div>`);}
  out.push(`<div class="award"><b>ゲームの長さ</b>${S.day}日間</div>`);
  return out.join('');
}
function viewEnd(){
  const village=S.winner==='village';
  const order=['wolf','seer','knight','villager'];
  const cards=S.players.slice().sort((a,b)=>order.indexOf(a.role)-order.indexOf(b.role)||a.id-b.id).map((p,i)=>`<div class="endcard r-${p.role}${p.alive?'':' dead'}" style="animation-delay:${Math.min(i,30)*.06}s"><div class="row1">${av(p)}${art(p.role,'sm')}</div><span class="nm2">${p.id}番 ${p.name?lab(p):''}</span><b>${ROLE[p.role].name}${p.alive?'':'（ぬけた）'}</b></div>`).join('');
  return header()+`<main class="wrap main"><section class="stage">${sceneBox(village?'villwin':'wolfwin')}
  <div class="banner" style="color:var(--${village?'villager':'wolf'})">${village?'村人チームの勝利！':'人狼チームの勝利！'}</div>
  <p class="big">${village?'人狼を、ぜんいん追放しました。村に平和がもどった！':'人狼が、村を乗っ取りました…！'}</p>
  <h2 style="font-family:var(--font-display);font-weight:400;font-size:1.5rem">みんなの正体</h2>
  <div class="endgrid">${cards}</div>
  <div class="awards">${awards()}</div>
  <div class="tips"><div><b>ふりかえり1</b><br>うそをついた人は、どんな気持ちだった？</div><div><b>ふりかえり2</b><br>あの人を信じたのは、どうして？</div><div><b>ふりかえり3</b><br>よい話し合いだったのは、どんなところ？</div></div>
  <div class="actions"><button class="btn primary xl go" data-act="again">同じメンバーで もう1回</button><button class="btn" data-act="back-setup">設定にもどる</button></div>
  <details style="width:100%;text-align:left"><summary class="muted" style="cursor:pointer;min-height:44px">ゲームのできごと</summary><ol class="log">${S.log.map(l=>`<li>${esc(l)}</li>`).join('')||'<li>なし</li>'}</ol></details>
  </section></main>`;
}

/* ---------- student device ---------- */
function slots(v,len){let h='<div class="slots">';for(let i=0;i<len;i++)h+=`<span class="slot${len===8&&i===4?' gap':''}${i===v.length?' cur':''}">${v[i]||''}</span>`;return h+'</div>';}
function keypad(){const k=d=>`<button class="key" data-act="me-key" data-d="${d}">${d}</button>`;return `<div class="keypad">${[1,2,3,4,5,6,7,8,9].map(k).join('')}<button class="key fn" data-act="me-del">消す</button>${k(0)}<button class="key fn ok" data-act="me-ok">OK</button></div>`;}
function viewMe(){
  const m=S.me;let body='';
  if(m.step==='code')body=`${sceneBox('night')}<h1>自分の役職を見る</h1><p class="big">先生の「配役コード」8けたを入れてください</p>${slots(m.code,8)}${keypad()}`;
  else if(m.step==='num')body=`<h1>自分の番号を入れる</h1><p class="big">出席番号（または先生に言われた番号）</p>${slots(m.num,2)}${keypad()}<p class="note">この端末では、入れた番号の役職だけが見られます。まちがえないでね。</p>`;
  else if(m.step==='confirm')body=`<h1>${m.num}番さん</h1><p class="big">まわりの人は、目をそらしてください。</p><button class="btn primary xl go" data-act="me-view">役職を見る</button>`;
  else if(m.step==='card'){
    const r=m.role,info=ROLE[r],winTxt=info.team==='village'?'人狼をぜんいん追放したら、勝ち！':'人狼の数が、村人チームと同じか多くなったら、勝ち！';
    body=`<p class="muted">${m.num}番さんの役職</p><div class="rolecard r-${r}">${art(r)}<div class="rname">${info.name}</div><p>${info.desc}</p>${r==='wolf'?`<p class="mates">${m.mates.length?'なかまの人狼：'+m.mates.map(x=>x+'番').join('、'):'人狼は あなた1人です'}</p>`:''}<p class="muted">${winTxt}</p></div><div class="countbar"><span id="rbar"></span></div><button class="btn primary xl" data-act="me-hide">見ました（かくす）</button>`;
  }else body=`<h1>かくしました</h1><p class="big">役職は、だれにも言わないでね。</p><div class="actions"><button class="btn" data-act="me-confirm">もう一度見る</button><button class="btn primary" data-act="me-back">おわり</button></div>`;
  return `<div class="topbar"><div class="wrap bar"><div class="brand">${art('wolf','ic')}人狼ゲーム</div><div class="chips"><span class="chip phase">自分の役職</span></div><div class="tools"><button class="btn sm" data-act="ruby-toggle">ふりがな ${S.cfg.ruby?'ON':'OFF'}</button><button class="btn sm" data-act="me-back">もどる</button></div></div></div><main class="wrap main"><section class="stage">${body}</section></main>`;
}

/* ---------- modals ---------- */
function roleGroups(){
  return ['wolf','seer','knight','villager'].map(r=>{const ps=S.players.filter(p=>p.role===r);return `<div class="group r-${r}"><b>${ROLE[r].name}（${ps.length}人）</b><div class="ppl">${ps.map(p=>`<span class="${p.alive?'':'dead'}">${p.id}番 ${p.name?lab(p):''}</span>`).join('')||'<span class="muted">なし</span>'}</div></div>`;}).join('');
}
function viewModal(){
  const m=S.modal;let body='';
  if(m.type==='reveal'){

let autoKey='',autoT=null;
function scheduleAuto(){

function spinKuji(){

/* 1画面に収める：内容が画面より高いときは、全体の大きさを下げて、ちょうど収まる大きさを探す */
function fit(){
  const root=document.documentElement,app=$app;
  if(!app)return;
  const V=window.innerHeight;
  const set=k=>root.style.setProperty('--k',k.toFixed(4));
  const H=k=>{set(k);return app.offsetHeight;};
  if(H(1)<=V+1){set(1);return;}
  let lo=.42,hi=1;
  for(let i=0;i<9;i++){const mid=(lo+hi)/2;if(H(mid)<=V+1)lo=mid;else hi=mid;}
  set(lo);
}

window.addEventListener('resize',()=>{cancelAnimationFrame(fitT);fitT=requestAnimationFrame(fit);});

function checkWin(){const a=alive(),w=a.filter(p=>p.role==='wolf').length;if(w===0)return 'village';if(w>=a.length-w)return 'wolf';return null;}
function resetGame(){S.day=1;S.pass=null;S.tn=null;S.acts=null;S.morning=null;S.vote=null;S.reveal=null;S.kuji=null;S.expel=null;S.winner=null;S.log=[];S.marks={};S.seerLog=[];S.lastGuard={};S.stats={saves:0};S.talk=null;S.lw=null;S.hist=[];S.modal=null;lastCurtain='';}
function startGame(){
  const n=effN(),c=S.cfg.counts,nms=names();
  S.host=S.cfg.host;
  let roles=[].concat(Array(c.wolf).fill('wolf'),Array(c.seer).fill('seer'),Array(c.knight).fill('knight'),Array(n-c.wolf-c.seer-c.knight).fill('villager'));
  if(S.host==='teacher'&&S.cfg.deal==='device'){const seed=Math.floor(Math.random()*100);roles=dealRoles(n,c.wolf,c.seer,c.knight,seed);S.code=makeCode(n,c.wolf,c.seer,c.knight,seed);}
  else{shuffle(roles);S.code=null;}
  S.players=roles.map((role,i)=>({id:i+1,name:(nms[i]||'').slice(0,10),role,alive:true,seen:false}));
  resetGame();
  if(S.host==='tablet')S.pass={kind:'deal',order:S.players.map(p=>p.id),i:-1,sub:'intro',pick:null,until:0};
  S.screen='deal';
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}

function startNight(){
  S.acts={wolfBy:{},seer:[],guards:[]};
  if(S.host==='tablet')S.pass={kind:'night',order:alive().map(p=>p.id),i:-1,sub:'intro',pick:null};
  else S.tn={step:-1,sub:'pick',pick:null};
  S.screen='night';
}
function resolveNight(){
  const A2=S.acts,picks=Object.values(A2.wolfBy);
  let target=null;
  if((S.day>1||S.cfg.firstAttack)&&picks.length){
    const cnt={};picks.forEach(t=>cnt[t]=(cnt[t]||0)+1);
    const mx=Math.max(...Object.values(cnt)),top=Object.keys(cnt).filter(k=>cnt[k]===mx).map(Number);
    target=top[Math.floor(Math.random()*top.length)];
  }
  const guarded=target!=null&&A2.guards.includes(target)&&S.players.some(p=>p.alive&&p.role==='knight');
  let victim=null;
  if(target!=null&&!guarded){victim=target;byId(victim).alive=false;S.log.push(`${S.day}日目の夜：${nm(byId(victim))}さんが おそわれた`);}
  else{if(guarded){S.stats.saves++;S.log.push(`${S.day}日目の夜：騎士が ${nm(byId(target))}さんを 守った`);}else S.log.push(`${S.day}日目の夜：だれも おそわれなかった`);}
  S.morning={victim,saved:guarded,sub:'wait'};
  S.winner=checkWin();
  S.screen='morning';
}
function enterDiscuss(){
  const d=S.cfg.discuss;S.talk=null;
  S.timer={left:d,total:d,running:S.host==='tablet',endAt:S.host==='tablet'?Date.now()+d*1000:0};
  S.screen='discuss';
}
function startVote(round,cands){
  S.vote={round,cands,counts:{}};
  if(S.host==='tablet')S.pass={kind:'vote',order:alive().map(p=>p.id),i:-1,sub:'intro',pick:null,ballots:{}};
  S.screen='vote';
}
function openReveal(counts){
  const v=S.vote,tally=v.cands.map(id=>[id,counts[id]||0]).sort((a,b)=>b[1]-a[1]);
  S.vote.counts=counts;
  S.reveal={round:v.round,tally,top:leadIds(counts,v.cands),sub:'drum'};

function expel(id){
  if(id){const p=byId(id);p.alive=false;S.log.push(`${S.day}日目の昼：${nm(p)}さんを 追放`);tone('out');}

function passAdvance(){
  const P=S.pass;P.i++;P.pick=null;
  if(P.i<P.order.length){P.sub='turn';render();return;}

    P.sub='res';render();
  },
  'p-next'(){passAdvance();},
  'p-ready'(){startNight();render();},
  /* teacher night */
  'tn-next'(){const N=S.tn;N.step++;N.sub='pick';N.pick=null;render();},
  'tn-skip'(){const N=S.tn;N.sub='closed';render();},
  'tn-pick'(el){
    const id=Number(el.dataset.id),N=S.tn,st=NIGHT[N.step],p=byId(id);
    if(!p||!p.alive)return;
    if(st==='wolf'&&p.role==='wolf'){toast('人狼どうしは、おそえません');return;}
    N.pick=N.pick===id?null:id;tone('tick');render();
  },
  'tn-confirm'(){
    const N=S.tn,st=NIGHT[N.step];if(N.pick==null)return;
    if(st==='wolf')S.acts.wolfBy.t=N.pick;
    else if(st==='seer'){const t=byId(N.pick);S.acts.seer.push(N.pick);S.seerLog.push({day:S.day,seer:0,target:N.pick,wolf:t.role==='wolf'});}
    else{S.acts.guards.push(N.pick);S.lastGuard.t=N.pick;}
    N.pick=null;N.sub=st==='seer'?'result':'closed';tone('ok');render();
  },
  'tn-close'(){S.tn.sub='closed';render();},
  'dawn'(){resolveNight();render();},
  /* morning */
  'm-reveal'(){S.morning.sub='drum';tone('drum');render();},
  'm-next'(){if(S.winner)endGame();else enterDiscuss();render();},
  /* discuss */
  'mark'(el){const id=Number(el.dataset.id);S.marks[id]=((S.marks[id]||0)+1)%MARKS.length;tone('tick');render();},
  'talk'(){
    const al=alive(),win=al[Math.floor(Math.random()*al.length)],el=$('#talk');let i=0;
    (function go(){if(!el)return;if(i<14){el.textContent=nm(al[Math.floor(Math.random()*al.length)])+'…';tone('spin');i++;setTimeout(go,60+i*12);}else{S.talk=win.id;el.innerHTML=R(who(win)+'から話そう！');tone('ok');saveGame();}})();
  },
  'timer-toggle'(){const t=S.timer;if(t.running){t.left=Math.max(0,Math.ceil((t.endAt-Date.now())/1000));t.running=false;}else if(t.left>0){t.endAt=Date.now()+t.left*1000;t.running=true;}render();},
  'timer-add'(){const t=S.timer;t.total+=60;if(t.running){t.endAt+=60000;t.left=Math.max(0,Math.ceil((t.endAt-Date.now())/1000));}else t.left+=60;render();},
  'timer-reset'(){const d=S.cfg.discuss;S.timer={left:d,total:d,running:false,endAt:0};render();},
  'to-vote'(){S.timer.running=false;startVote(1,alive().map(p=>p.id));render();},
  /* teacher vote */
  'v-inc'(el){voteChange(Number(el.dataset.id),1);},
  'v-dec'(el){voteChange(Number(el.dataset.id),-1);},
  'v-decide'(){const total=Object.values(S.vote.counts).reduce((a,b)=>a+b,0);if(!total){S.hist.pop();toast('まだ票が入っていません');return;}openReveal(Object.assign({},S.vote.counts));render();},
  /* reveal / kuji / expel */
  'rv-next'(){
    const rv=S.reveal;
    if(rv.top.length===1)expel(rv.top[0]);
    else if(rv.round===1)startVote(2,rv.top.slice());
    else if(S.cfg.tie==='kuji'){S.kuji={cands:rv.top.slice(),winner:rv.top[Math.floor(Math.random()*rv.top.length)],sub:'spin'};S.screen='kuji';}
    else expel(null);
    render();
  },
  'kj-next'(){expel(S.kuji.winner);render();},
  'lw-start'(){S.lw={running:true,endAt:Date.now()+15000,done:false};render();},
  'ex-next'(){if(S.winner){endGame();render();return;}S.day++;startNight();render();},
  /* end */
  'again'(){startGame();},
  'back-setup'(){S.screen='setup';S.modal=null;S.hist=[];S.pass=null;render();},
  /* student */
  'me-open'(){meNew();S.screen='me';try{location.hash='me';}catch(e){}render();},
  'me-back'(){S.screen='setup';S.me=null;try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}render();},
  'me-key'(el){const m=S.me,d=el.dataset.d;if(m.step==='code'){if(m.code.length<8)m.code+=d;}else if(m.step==='num'){if(m.num.length<2)m.num+=d;}else return;render();},
  'me-del'(){const m=S.me;if(m.step==='code')m.code=m.code.slice(0,-1);else if(m.step==='num')m.num=m.num.slice(0,-1);render();},
  'me-ok'(){
    const m=S.me;
    if(m.step==='code'){const c=parseCode(m.code);if(!c){toast('コードがちがいます。もう一度たしかめてね');m.code='';render();return;}m.cfg=c;if(m.lock&&m.lock.code===m.code){m.num=String(m.lock.num);m.step='confirm';}else{m.step='num';m.num='';}render();}
    else if(m.step==='num'){const n=Number(m.num);if(!n||n<1||n>m.cfg.n){toast(`番号は 1〜${m.cfg.n} です`);m.num='';render();return;}try{localStorage.setItem(MEKEY,JSON.stringify({code:m.code,num:n}));}catch(e){}meShow();render();}
  },
  'me-view'(){meShow();render();},
  'me-confirm'(){S.me.step='confirm';render();},
  'me-hide'(){S.me.step='hidden';S.me.role=null;S.me.mates=[];render();}
};
function voteChange(id,d){
  const v=S.vote;v.counts[id]=Math.max(0,(v.counts[id]||0)+d);
  if(d>0)tone('tick');
  const c=document.getElementById('vc-'+id);if(c)c.textContent=v.counts[id];
  const total=Object.values(v.counts).reduce((a,b)=>a+b,0),a=alive().length;
  const s=document.getElementById('vsum');if(s){s.textContent=`票の合計 ${total} / 生きている人 ${a}`;s.classList.toggle('off',total!==a);}
  const lead=leadIds(v.counts,v.cands);
  document.querySelectorAll('.vtile').forEach(t=>t.classList.toggle('lead',lead.includes(Number(t.dataset.id))));
  saveGame();
}
function doBegin(){pushHist();S.day=1;startNight();render();}
function doQuit(){S.screen='setup';S.modal=null;S.hist=[];S.saved=null;S.pass=null;try{localStorage.removeItem(GKEY);speechSynthesis.cancel();}catch(e){}render();}

document.addEventListener('click',e=>{
  if(e.target.closest('#curtain')){$('#curtain').hidden=true;return;}
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  const name=el.dataset.act,f=A[name];
  if(!f)return;
  if(UNDOABLE.includes(name))pushHist();
  f(el);
});
let holdT=null;
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-hold]');if(!el)return;
  el.classList.add('holding');
  holdT=setTimeout(()=>{el.classList.remove('holding');const f=A[el.dataset.hold];if(f)f(el);},1500);
});
['pointerup','pointerleave','pointercancel'].forEach(t=>document.addEventListener(t,()=>{clearTimeout(holdT);document.querySelectorAll('.holding').forEach(x=>x.classList.remove('holding'));},true));
document.addEventListener('input',e=>{
  if(e.target&&e.target.id==='names'){
    S.cfg.names=e.target.value;saveCfg();
    const k=names().length,el=document.getElementById('names-count');if(el)el.textContent=`名前 ${k}人分 ／ 人数 ${S.cfg.n}人`;
    const b=document.querySelector('[data-act="fit-names"]');if(b)b.disabled=!(k>=4&&k!==S.cfg.n);
  }
});

/* =========================================================
   ticking timers
   ========================================================= */
let warned=false;
function cardTimer(until,onEnd){const left=until-Date.now(),b=document.getElementById('rbar');if(b)b.style.width=Math.max(0,left/100)+'%';if(left<=0)onEnd();}
setInterval(()=>{
  const m=S.modal;
  if(m&&m.type==='reveal'&&m.shown&&m.until)cardTimer(m.until,()=>{byId(m.id).seen=true;S.modal=null;render();toast('自動でかくしました');});
  if(S.host==='tablet'&&S.screen==='deal'&&S.pass&&S.pass.sub==='card')cardTimer(S.pass.until,()=>passAdvance());
  if(S.screen==='me'&&S.me&&S.me.step==='card')cardTimer(S.me.until,()=>{S.me.step='hidden';S.me.role=null;S.me.mates=[];render();});
  if(S.screen==='expelled'&&S.lw&&S.lw.running){
    const left=Math.max(0,Math.ceil((S.lw.endAt-Date.now())/1000)),el=document.getElementById('lwt');
    if(el)el.textContent=fmt(left);
    if(left<=0){S.lw.running=false;S.lw.done=true;tone('bell');render();}
  }
  if(S.screen!=='discuss'||!S.timer.running){return;}
  const t=S.timer;
  t.left=Math.max(0,Math.ceil((t.endAt-Date.now())/1000));
  const el=document.getElementById('timer');if(el)el.textContent=fmt(t.left);
  const ring=document.getElementById('ring');if(ring){ring.setAttribute('stroke-dashoffset',(552.9*(1-Math.min(1,t.left/(t.total||1)))).toFixed(1));ring.setAttribute('stroke',t.left<=30?'var(--bad)':'var(--good)');}
  const rw=document.getElementById('ringwrap');if(rw)rw.classList.toggle('low',t.left<=30);
  if(t.left===30&&!warned){warned=true;tone('warn');}
  if(t.left>30)warned=false;
  if(t.left<=0){t.running=false;tone('bell');speak('時間です。投票に、すすみましょう。');toast('時間です。投票にすすみましょう');render();}
},200);

/* =========================================================
   boot
   ========================================================= */
function start(data){
  if(data&&data.screen&&data.players){Object.assign(S,data);S.timer.running=false;lastCurtain=curtainKey();}
  else{applyAuto();S.saved=loadSaved();}
  if(location.hash==='#me'){meNew();S.screen='me';}
  render();
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>JSON.parse(snapJSON()));}catch(e){}
try{
  if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
  else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
}catch(e){start({});}
window.__ww={S,A,render};
})();
</script>

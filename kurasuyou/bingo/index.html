<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>ルーレットアプリ</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container" id="appContainer">
  <header>
    <div class="header-left">
      <h1>🎲 クラス・ルーレット 🎲</h1>
    </div>
    <div class="header-right">
      <button id="fullscreenBtn" class="icon-btn" title="全画面切り替え">📺</button>
      <div class="sound-control">
        <span id="soundLabel">🔊 ON</span>
        <label class="switch">
          <input type="checkbox" id="soundToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </header>
  
  <main>
    <div class="roulette-section">
      <div class="canvas-container">
        <canvas id="canvas" width="500" height="500"></canvas>
        <div class="arrow"></div>
      </div>
      <button id="spinBtn" class="spin-btn">スタート！</button>
      <div id="resultText" class="result">ここに結果が表示されます</div>
      
      <div class="winner-board">
        <h3>🏆 当選履歴</h3>
        <ul id="winnerList"></ul>
      </div>
    </div>

    <div class="settings-section">
      <div class="custom-settings">
        <div class="input-group">
          <label for="eventTitle">🎯 ルーレットの目的（タイトル）</label>
          <input type="text" id="eventTitle" value="レクリエーション" placeholder="例: 掃除当番、席替え...">
        </div>
        <div class="input-group">
          <label for="effectSelect">✨ 決定時の演出</label>
          <select id="effectSelect">
            <option value="confetti">🎉 紙吹雪（コンフェッティ）</option>
            <option value="fireworks">🎆 花火（打ち上げ）</option>
            <option value="none">なし</option>
          </select>
        </div>
      </div>

      <div class="list-header">
        <label for="itemsInput">
          <strong>項目リスト</strong>
          <small>（改行区切り。現在: <span id="itemCount">0</span>件）</small>
        </label>
        <button id="shuffleBtn" class="small-btn" title="順番をランダムに入れ替えます">🔀 並べ替え</button>
      </div>
      
      <textarea id="itemsInput" rows="8" placeholder="ここに候補を入力してください..."></textarea>
      <button id="updateBtn" class="update-btn">リストを更新してリセット</button>

      <div class="history-area">
        <strong>💾 履歴・テンプレート</strong>
        <div class="load-area">
          <select id="historySelect">
            <option value="">履歴を選択...</option>
          </select>
          <button id="loadHistoryBtn" class="load-btn">読込</button>
        </div>
        <button id="saveHistoryBtn" class="save-btn">現在のリストを履歴に保存</button>
      </div>
    </div>
  </main>
</div>

<div id="resultModal" class="modal-overlay">
  <div class="modal-content">
    <h2 id="modalTitle">今回の〇〇は...</h2>
    <div class="modal-winner-box">
      <span class="sparkle-icon">✨</span>
      <div id="modalWinner" class="modal-winner">結果</div>
      <span class="sparkle-icon">✨</span>
    </div>
    <p class="modal-desc">です！</p>
    
    <div class="modal-actions">
      <button id="modalCloseBtn" class="modal-btn btn-delete">
        確認して次へ<br><small>（自動的にリストから削除されました）</small>
      </button>
    </div>
  </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

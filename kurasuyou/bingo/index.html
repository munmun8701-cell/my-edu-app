<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>ビンゴゲーム</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container" id="appContainer">
  <header>
    <h1>🌟 わくわくクラスビンゴ 🌟</h1>
    <div class="header-right">
      <button id="fullscreenBtn" class="icon-btn" title="全画面切り替え">📺</button>
      <div class="sound-control">
        <span id="soundLabel">🔊 ON</span>
        <label class="switch">
          <input type="checkbox" id="soundToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </header>

  <main>
    <div id="modeSelection" class="view-section active">
      <h2>どちらの画面をひらきますか？</h2>
      <div class="mode-buttons">
        <button id="btnTeacherMode" class="mode-btn teacher-btn">
          👩‍🏫 先生モード<br><small>（数字を回す・テレビに映す用）</small>
        </button>
        <button id="btnStudentMode" class="mode-btn student-btn">
          👦👧 子どもモード<br><small>（ビンゴカードであそぶ用）</small>
        </button>
      </div>
    </div>

    <div id="teacherView" class="view-section">
      <div class="teacher-layout">
        <div class="draw-area">
          <div class="drawn-number-box">
            <span class="sparkle">✨</span>
            <div id="currentNumber" class="current-number">?</div>
            <span class="sparkle">✨</span>
          </div>
          <button id="drawBtn" class="spin-btn">数字を引く！</button>
          <div id="drawResultText" class="result">スタートを押してね！</div>
          <button id="resetTeacherBtn" class="danger-btn" style="margin-top: 30px;">⚠️ 最初からやり直す（リセット）</button>
        </div>
        
        <div class="board-area">
          <h3>出た数字ボード（1〜99）</h3>
          <div id="numberBoard" class="number-board"></div>
        </div>
      </div>
      <button class="back-btn" onclick="location.reload()">◀ 最初の画面にもどる</button>
    </div>

    <div id="studentView" class="view-section">
      <div class="student-controls">
        <button id="generateCardBtn" class="update-btn">新しいカードを作る</button>
        <button id="bingoBtn" class="bingo-btn" disabled>BINGO!! 🎉</button>
      </div>
      
      <div class="bingo-card-wrapper">
        <div class="bingo-card">
          <div class="bingo-header">
            <div>B</div><div>I</div><div>N</div><div>G</div><div>O</div>
          </div>
          <div id="bingoGrid" class="bingo-grid">
            </div>
        </div>
      </div>
      
      <button class="back-btn" onclick="location.reload()" style="margin-top:20px;">◀ 最初の画面にもどる</button>
    </div>
  </main>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

<!doctype html>
<html>

<head>
  <meta charset=utf8>
  <meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    :root {
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      padding: 0;
      font: 14px -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #000
    }

    img {
      max-width: 100%
    }

    [hidden]:not([hidden=until-found i]) {
      display: none !important
    }
  </style>
</head>

<body>
  <title>板書ボード</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho&family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700&display=swap">
  <style>
    /* Layout: the board fills the middle like a blackboard on a classroom wall; the tool rail is the chalk tray
   on the left, the lesson file sits on top, pages run along the bottom. Panels float on a desk-colored ground. */
    :root {
      --desk: #e4e8e2;
      --panel: #fbfcfa;
      --panel-2: #eef2ec;
      --ink: #1b2a22;
      --ink-2: #46574d;
      --muted: #74847a;
      --line: #d5dcd3;
      --accent: #1f6b47;
      --accent-ink: #ffffff;
      --accent-soft: #dcefe2;
      --chalk: #e9b10f;
      --danger: #c43d3d;
      --danger-soft: #fbe4e4;
      --focus: #2f80ed;
      --overlay: rgba(14, 22, 18, .46);
      --shadow: 0 1px 2px rgba(27, 42, 34, .08), 0 8px 24px rgba(27, 42, 34, .09);
      --shadow-lg: 0 2px 6px rgba(27, 42, 34, .1), 0 18px 48px rgba(27, 42, 34, .18);
      --font-ui: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", "Noto Sans JP", "Noto Sans CJK JP", system-ui, sans-serif;
      --font-display: "Klee One", "UD デジタル 教科書体 N-R", "UD Digi Kyokasho N-R", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", "Noto Serif CJK JP", serif;
      --r: 12px;
      --r-sm: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --desk: #101613;
        --panel: #19211c;
        --panel-2: #222c26;
        --ink: #e6eee8;
        --ink-2: #b6c3bb;
        --muted: #87968d;
        --line: #2e3a33;
        --accent: #4dba85;
        --accent-ink: #0b1a12;
        --accent-soft: #1d3a2b;
        --chalk: #f3cd45;
        --danger: #ee6c6c;
        --danger-soft: #3b2020;
        --focus: #6aa8ff;
        --overlay: rgba(0, 0, 0, .6);
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
        --shadow-lg: 0 2px 6px rgba(0, 0, 0, .4), 0 18px 48px rgba(0, 0, 0, .55);
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --desk: #101613;
      --panel: #19211c;
      --panel-2: #222c26;
      --ink: #e6eee8;
      --ink-2: #b6c3bb;
      --muted: #87968d;
      --line: #2e3a33;
      --accent: #4dba85;
      --accent-ink: #0b1a12;
      --accent-soft: #1d3a2b;
      --chalk: #f3cd45;
      --danger: #ee6c6c;
      --danger-soft: #3b2020;
      --focus: #6aa8ff;
      --overlay: rgba(0, 0, 0, .6);
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
      --shadow-lg: 0 2px 6px rgba(0, 0, 0, .4), 0 18px 48px rgba(0, 0, 0, .55);
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--desk);
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: 14px;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .ic {
      width: 20px;
      height: 20px;
      flex: none;
      display: block;
    }

    kbd {
      font-family: var(--font-ui);
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 5px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--ink-2);
    }

    code {
      font-family: var(--font-display);
      background: var(--panel-2);
      padding: 1px 6px;
      border-radius: 5px;
    }

    #app {
      height: 100%;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: "top top" "rail stage" "rail bottom";
      gap: 10px;
      padding-block: 10px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }

    .bar {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow);
    }

    /* ---------- top bar ---------- */
    #topbar {
      grid-area: top;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      min-width: 0;
    }

    .tb {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 11px;
      border: 0;
      border-radius: var(--r-sm);
      background: transparent;
      color: var(--ink-2);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .tb:hover:not(:disabled) {
      background: var(--panel-2);
      color: var(--ink);
    }

    .tb:disabled {
      opacity: .35;
      cursor: default;
    }

    .tb.on {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .tb.accent {
      background: var(--accent);
      color: var(--accent-ink);
    }

    .tb.accent:hover {
      background: var(--accent);
      filter: brightness(1.08);
      color: var(--accent-ink);
    }

    .tb.icon-only {
      padding: 0 9px;
    }

    .tb-group {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .spacer {
      flex: 1;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 0 1 420px;
      padding: 0 6px;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    #boardTitle {
      min-width: 0;
      flex: 1;
      border: 1px solid transparent;
      background: transparent;
      border-radius: var(--r-sm);
      padding: 6px 8px;
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 600;
      color: var(--ink);
      text-overflow: ellipsis;
    }

    #boardTitle:hover {
      border-color: var(--line);
    }

    #boardTitle:focus {
      border-color: var(--focus);
      outline: none;
      background: var(--panel-2);
    }

    .save-state {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .save-state::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }

    .save-state[data-state="dirty"]::before,
    .save-state[data-state="saving"]::before {
      background: var(--chalk);
    }

    .save-state[data-state="error"],
    .save-state[data-state="memory"] {
      color: var(--danger);
    }

    .save-state[data-state="error"]::before,
    .save-state[data-state="memory"]::before {
      background: var(--danger);
    }

    /* ---------- tool rail ---------- */
    #rail {
      grid-area: rail;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 2px;
      padding: 6px;
      width: 76px;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
    }

    .rt {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-height: 52px;
      padding: 5px 2px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--ink-2);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.15;
      text-align: center;
    }

    .rt .ic {
      width: 23px;
      height: 23px;
    }

    .rt:hover {
      background: var(--panel-2);
      color: var(--ink);
    }

    .rt.on,
    .rt.open {
      background: var(--accent);
      color: var(--accent-ink);
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .16);
    }

    .rail-sep {
      height: 1px;
      background: var(--line);
      margin: 4px 8px;
      flex: none;
    }

    /* ---------- stage ---------- */
    #stage {
      grid-area: stage;
      position: relative;
      min-width: 0;
      min-height: 0;
      border-radius: var(--r);
      overflow: hidden;
      touch-action: none;
    }

    #stage .canvas-container,
    #stage canvas {
      touch-action: none;
    }

    #stage .canvas-container {
      position: absolute !important;
      inset: 0;
    }

    #fx {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
      z-index: 5;
    }

    .floating {
      position: absolute;
      z-index: 10;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow-lg);
    }

    /* property bar */
    .props {
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 14px;
      padding: 7px 12px;
      max-width: calc(100% - 20px);
      width: max-content;
    }

    .pg {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .pg-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: .04em;
    }

    .pg.hint {
      font-size: 12.5px;
      color: var(--ink-2);
      padding: 3px 2px;
    }

    .sw-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sw {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--panel);
      padding: 0;
      background: var(--sw);
      box-shadow: 0 0 0 1px var(--line);
      position: relative;
      flex: none;
    }

    .sw.on {
      box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--ink);
    }

    .sw-pick {
      background: conic-gradient(#e53935, #f08c00, #ffe14d, #2e9d4a, #1e63d6, #8e44ad, #e53935);
      overflow: hidden;
      cursor: pointer;
    }

    .sw-pick input {
      opacity: 0;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      border: 0;
      padding: 0;
    }

    .seg {
      display: inline-flex;
      background: var(--panel-2);
      border-radius: 9px;
      padding: 2px;
      gap: 2px;
    }

    .seg>button {
      border: 0;
      background: transparent;
      border-radius: 7px;
      min-width: 34px;
      height: 30px;
      padding: 0 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: var(--ink-2);
      font-size: 12.5px;
      font-weight: 700;
    }

    .seg>button:hover {
      color: var(--ink);
    }

    .seg>button.on,
    .seg>button.active {
      background: var(--panel);
      color: var(--accent);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .14);
    }

    .seg.widths>button {
      width: 34px;
      padding: 0;
    }

    .seg .dot {
      display: block;
      border-radius: 50%;
      background: currentColor;
    }

    .seg.mini>button {
      height: 26px;
      font-size: 11.5px;
    }

    .tog {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      height: 30px;
      padding: 0 11px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-2);
    }

    .tog.on {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .sel {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      height: 32px;
      padding: 0 8px;
      font-size: 13px;
      color: var(--ink);
      max-width: 100%;
    }

    .stamp-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-width: 640px;
    }

    .stp {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      height: 36px;
      min-width: 36px;
      padding: 0 6px;
      font-size: 20px;
      line-height: 1;
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", var(--font-ui);
    }

    .stp.sym {
      color: #e53935;
      font-family: var(--font-ui);
      font-weight: 700;
    }

    .stp.word {
      font-size: 12px;
      font-family: var(--font-display);
      font-weight: 600;
      color: #e53935;
      padding: 0 9px;
    }

    .stp.on {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
      background: var(--accent-soft);
    }

    /* selection bar */
    .selbar {
      left: 0;
      top: 0;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      transition: opacity .12s;
    }

    .sb {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 36px;
      min-width: 36px;
      padding: 0 8px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--ink-2);
      font-size: 12.5px;
      font-weight: 700;
      justify-content: center;
    }

    .sb:hover {
      background: var(--panel-2);
      color: var(--ink);
    }

    .sb.danger:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .sb-sep {
      width: 1px;
      height: 22px;
      background: var(--line);
      margin: 0 2px;
    }

    /* inline editor */
    .editor {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 8;
      transform-origin: 0 0;
      margin: 0;
      border: 0;
      resize: none;
      overflow: hidden;
      background: rgba(255, 255, 255, .55);
      outline: 2px dashed var(--focus);
      outline-offset: 0;
      border-radius: 4px;
      caret-color: var(--focus);
      text-orientation: mixed;
      line-break: strict;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .editor.on-dark {
      background: rgba(0, 0, 0, .25);
    }

    .editor.on-fill {
      background: transparent;
    }

    .editor::placeholder {
      color: rgba(80, 90, 85, .45);
    }

    .edbar {
      left: 0;
      top: 0;
      display: flex;
      gap: 2px;
      padding: 4px;
    }

    .eb {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 36px;
      padding: 0 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--ink-2);
      font-size: 12.5px;
      font-weight: 700;
    }

    .eb:hover {
      background: var(--panel-2);
      color: var(--ink);
    }

    .eb.primary {
      background: var(--accent);
      color: var(--accent-ink);
    }

    .ruby-ic {
      font-family: var(--font-display);
      font-size: 15px;
      position: relative;
      padding-top: 6px;
    }

    .ruby-ic small {
      position: absolute;
      top: -3px;
      left: 2px;
      font-size: 9px;
    }

    .dir-ic {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 600;
    }

    .rubypop {
      left: 0;
      top: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
    }

    .rubypop input {
      border: 1px solid var(--line);
      border-radius: 8px;
      height: 34px;
      padding: 0 10px;
      width: 150px;
      background: var(--panel);
    }

    .rp-label {
      font-size: 12.5px;
      color: var(--ink-2);
      white-space: nowrap;
    }

    .rp-label b {
      font-family: var(--font-display);
      font-size: 15px;
      color: var(--ink);
    }

    .drop-hint {
      position: absolute;
      inset: 14px;
      z-index: 20;
      border: 3px dashed var(--accent);
      border-radius: var(--r);
      background: color-mix(in srgb, var(--accent-soft) 70%, transparent);
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      pointer-events: none;
    }

    .boot-error {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      text-align: center;
      padding: 24px;
      gap: 6px;
      color: var(--ink-2);
    }

    .boot-error h2 {
      font-family: var(--font-display);
      color: var(--ink);
      margin: 0;
    }

    .boot-error p {
      max-width: 36em;
      margin: 0;
      line-height: 1.7;
    }

    /* ---------- bottom bar ---------- */
    #bottombar {
      grid-area: bottom;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      min-width: 0;
    }

    .pages {
      display: flex;
      align-items: center;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }

    .page-list {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: thin;
      min-width: 0;
      padding: 2px;
      max-width: 46vw;
    }

    .pchip {
      flex: none;
      min-width: 36px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      font-weight: 700;
      color: var(--ink-2);
      font-variant-numeric: tabular-nums;
    }

    .pchip:hover {
      border-color: var(--ink-2);
    }

    .pchip.on {
      background: var(--ink);
      color: var(--panel);
      border-color: var(--ink);
    }

    .bg-pick {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink-2);
    }

    .zoom {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .zoom-label {
      min-width: 62px;
      justify-content: center;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- flyout (parts) ---------- */
    .flyout {
      position: fixed;
      z-index: 40;
      width: min(400px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow-lg);
      padding: 14px;
      display: grid;
      gap: 14px;
    }

    .fly-sec {
      display: grid;
      gap: 8px;
    }

    .fly-sec.row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .fly-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-2);
      letter-spacing: .04em;
    }

    .fly-title small {
      font-weight: 400;
      color: var(--muted);
      margin-left: 6px;
      letter-spacing: 0;
    }

    .frame-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .frame-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 2px 7px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      color: var(--ink-2);
      font-size: 10.5px;
      font-weight: 700;
    }

    .frame-btn b {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--fc);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 17px;

      position: absolute;

    .tm-track {

    .tm-prog {

    function debounce(fn, ms) {
      let t;
      return (...a) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...a), ms);

    const LS = {
      get(k, d) {
        try {
          const v = localStorage.getItem(k);
          return v == null ? d : JSON.parse(v);
        } catch (e) {
          return d;
        }
      },
      set(k, v) {
        try {
          localStorage.setItem(k, JSON.stringify(v));

          /* ignore */
        }
      },
    };

    function hexToRgb(hex) {
      let h = String(hex || '').trim().replace('#', '');
      if (h.length === 3) h = h.split('').map(c => c + c).join('');
      const n = parseInt(h.slice(0, 6), 16);
      if (isNaN(n)) return {
        r: 0,
        g: 0,
        b: 0
      };
      return {
        r: (n >> 16) & 255,
        g: (n >> 8) & 255,
        b: n & 255
      };
    }

    function rgba(hex, a) {
      const {
        r,
        g,
        b
      } = hexToRgb(hex);
      return `rgba(${r},${g},${b},${a})`;
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      } [c]));
    }

    function fmtDate(ts) {
      const d = new Date(ts);
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;

    /* =====================================================================

    const Store = (() => {
      let db = null;
      const mem = {
        boards: new Map(),
        meta: new Map(),
        kv: new Map()
      };
      const reqP = (r) => new Promise((res, rej) => {
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });

      function open() {
        return new Promise((resolve) => {
          let done = false;
          const finish = (v) => {
            if (!done) {
              done = true;
              resolve(v);
            }
          };
          try {
            const req = indexedDB.open('bansho-board', 1);
            req.onupgradeneeded = () => {
              const d = req.result;
              if (!d.objectStoreNames.contains('boards')) d.createObjectStore('boards', {
                keyPath: 'id'
              });
              if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', {
                keyPath: 'id'
              });
              if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
            };
            req.onsuccess = () => {
              db = req.result;
              finish(true);
            };
            req.onerror = () => finish(false);
            req.onblocked = () => finish(false);
            setTimeout(() => finish(false), 4000);
          } catch (e) {
            finish(false);
          }
        });
      }

      function t(stores, mode) {
        return db.transaction(stores, mode);
      }
      const api = {
        get persistent() {
          return !!db;
        },
        open,
        async listMeta() {
          if (!db) return Array.from(mem.meta.values());
          return reqP(t('meta', 'readonly').objectStore('meta').getAll());
        },
        async getBoard(id) {
          if (!db) return mem.boards.get(id) || null;
          return (await reqP(t('boards', 'readonly').objectStore('boards').get(id))) || null;
        },
        async putBoard(board, meta) {
          if (!db) {
            mem.boards.set(board.id, JSON.parse(JSON.stringify(board)));
            mem.meta.set(meta.id, meta);
            return;
          }
          await new Promise((res, rej) => {
            const tx = t(['boards', 'meta'], 'readwrite');
            tx.objectStore('boards').put(board);
            tx.objectStore('meta').put(meta);
            tx.oncomplete = () => res();
            tx.onerror = () => rej(tx.error);
            tx.onabort = () => rej(tx.error || new Error('abort'));
          });
        },
        async deleteBoard(id) {
          if (!db) {
            mem.boards.delete(id);
            mem.meta.delete(id);
            return;
          }
          await new Promise((res, rej) => {
            const tx = t(['boards', 'meta'], 'readwrite');
            tx.objectStore('boards').delete(id);
            tx.objectStore('meta').delete(id);
            tx.oncomplete = () => res();
            tx.onerror = () => rej(tx.error);
          });
        },
        async kvGet(k) {
          if (!db) return mem.kv.get(k);
          try {
            return await reqP(t('kv', 'readonly').objectStore('kv').get(k));
          } catch (e) {
            return undefined;
          }

        async kvSet(k, v) {

            mem.kv.set(k, v);
            return;

          try {
            await new Promise((res, rej) => {
              const tx = t('kv', 'readwrite');
              tx.objectStore('kv').put(v, k);
              tx.oncomplete = res;
              tx.onerror = () => rej(tx.error);

            /* ignore */
          }
        },

      return api;
    })();

    function extractAssets(objects, assets) {

          if (!j.assetId && j.src && String(j.src).startsWith('data:')) {
            j.assetId = uid('a');

          if (j.assetId) j.src = '';

        if (Array.isArray(j.objects)) j.objects.forEach(walk);
      };
      (objects || []).forEach(walk);

      const clone = JSON.parse(JSON.stringify(objects || []));

        if (j && Array.isArray(j.objects)) j.objects.forEach(walk);

    const Sound = (() => {
      let ac = null;

      function bell(freq, at, dur = 1.6, vol = 0.28) {
        const c = ctx();
        if (!c) return;
        const t0 = c.currentTime + at;
        [1, 2.01, 3.02].forEach((m, i) => {
          const o = c.createOscillator(),
            g = c.createGain();
          o.type = 'sine';
          o.frequency.value = freq * m;
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.exponentialRampToValueAtTime(vol / (i + 1), t0 + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur / (i + 1));
          o.connect(g).connect(c.destination);
          o.start(t0);
          o.stop(t0 + dur);
        });
      }

        unlock() {
          ctx();
        },
        chime() {
          bell(784, 0);
          bell(659, 0.42);
          bell(523, 0.84, 2.2);

        tick() {
          const c = ctx();
          if (!c) return;
          const o = c.createOscillator(),

          g.gain.setValueAtTime(0.08, c.currentTime);

    const Timer = (() => {
      const st = {

      let raf = null;
      const el = () => $('#timerWidget');

      function fmt(sec) {
        sec = Math.max(0, Math.ceil(sec));
        const m = Math.floor(sec / 60),
          s = sec % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      function current() {
        if (!st.running) return st.mode === 'down' ? st.left : st.base;
        const el = (performance.now() - st.startAt) / 1000;
        return st.mode === 'down' ? st.left - el : st.base + el;
      }

      function render() {
        const w = el();
        if (!w || w.hidden) return;
        const v = current();
        $('#tmDigits').textContent = st.mode === 'down' ? fmt(v) : fmtUp(v);
        const ring = $('#tmRing');
        const frac = st.mode === 'down' ? clamp(v / Math.max(1, st.total), 0, 1) : (v % 60) / 60;
        const C = 2 * Math.PI * 52;
        ring.style.strokeDasharray = `${C}`;
        ring.style.strokeDashoffset = `${C * (1 - frac)}`;
        w.classList.toggle('warn', st.mode === 'down' && st.running && v <= 10 && v > 0);
        w.classList.toggle('done', st.done);

      function fmtUp(sec) {

          s = Math.floor(sec % 60),

        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${d}`;

      function loop() {
        raf = null;
        if (!st.running) {
          render();
          return;
        }
        if (st.mode === 'down' && current() <= 0) {
          st.running = false;
          st.left = 0;
          st.done = true;
          Sound.chime();
          setTimeout(() => Sound.chime(), 2300);
          render();
          return;
        }
        render();
        raf = requestAnimationFrame(loop);

      function setTotal(sec) {
        st.total = st.left = clamp(Math.round(sec), 1, 99 * 60 + 59);

          if (st.mode === 'down' && (st.left <= 0 || st.done)) {

            st.done = false;

          st.startAt = performance.now();
          st.running = true;
          st.done = false;

        if (!raf) raf = requestAnimationFrame(loop);

      function reset() {

        if (st.rolling) return;

        for (let i = 1; i <= st.n; i++)

        const steps = 16;
        const spin = () => {
          out.textContent = pool[Math.floor(Math.random() * pool.length)];

            out.textContent = result;
            out.classList.add('hit');

    const Speech = (() => {
      function guessLang(s) {
        if (/[぀-ヿ㐀-鿿]/.test(s)) return /[぀-ヿ]/.test(s) || !/[一-鿿]{2,}[^぀-ヿ]*$/.test(s) ? 'ja-JP' : 'ja-JP';
        if (/[Ѐ-ӿ]/.test(s)) return 'mn-MN';
        if (/[가-힯]/.test(s)) return 'ko-KR';
        if (/[ऀ-ॿ]/.test(s)) return 'ne-NP';
        if (/[ăâđêôơưạảấầẩẫậắằẳẵặẹẻẽếềểễệỉịọỏốồổỗộớờởỡợụủứừửữựỳỵỷỹ]/i.test(s)) return 'vi-VN';
        if (/[ãõç]/i.test(s)) return 'pt-BR';
        if (/[ñ¿¡]/i.test(s)) return 'es-ES';
        return 'en-US';
      }

      function voiceFor(lang) {
        const vs = speechSynthesis.getVoices();
        const pre = lang.split('-')[0];
        return vs.find(v => v.lang === lang) || vs.find(v => v.lang && v.lang.toLowerCase().startsWith(pre)) || null;
      }

      function speak(text) {
        if (!('speechSynthesis' in window)) {
          Toast.show('この端末では読み上げが使えません');
          return;
        }
        speechSynthesis.cancel();
        const plain = TE.stripRuby(text, true);
        const parts = plain.split(/\n\s*---\s*\n|^---$/m).map(s => s.trim()).filter(Boolean);
        let missing = [];
        for (const p of parts) {
          const lang = guessLang(p);
          const v = voiceFor(lang);
          if (!v && speechSynthesis.getVoices().length && lang !== 'ja-JP') {
            missing.push(lang);
            continue;
          }
          const u = new SpeechSynthesisUtterance(p);
          u.lang = lang;
          if (v) u.voice = v;
          u.rate = lang === 'ja-JP' ? 0.95 : 0.9;
          speechSynthesis.speak(u);
        }
        if (missing.length) {
          const names = {
            'mn-MN': 'モンゴル語',
            'ko-KR': '韓国語',
            'ne-NP': 'ネパール語',
            'vi-VN': 'ベトナム語',
            'pt-BR': 'ポルトガル語',
            'es-ES': 'スペイン語',
            'en-US': '英語'

        }

        try {
          speechSynthesis.getVoices();
          speechSynthesis.onvoiceschanged = () => {};
        } catch (e) {
          /* ignore */
        }
      }
      return {
        speak
      };

      flush() {

            y: (pts[0].y + pts[1].y) / 2

    const FX = {

      size() {

        this.el.style.height = st.clientHeight + 'px';

      pointer(e) {

            x,
            y

            y,

      kick() {
        if (!this.raf) this.raf = requestAnimationFrame(() => this.frame());

      frame() {
        this.raf = null;
        const c = this.ctx,
          dpr = window.devicePixelRatio || 1;
        c.setTransform(1, 0, 0, 1, 0, 0);
        c.clearRect(0, 0, this.el.width, this.el.height);
        c.setTransform(dpr, 0, 0, dpr, 0, 0);

          life = 700;
        this.trail = this.trail.filter(p => now - p.t < life);

          c.lineCap = 'round';
          c.lineJoin = 'round';

              b = this.trail[i],
              k = 1 - (now - b.t) / life;

            c.lineWidth = 2 + 8 * k;
            c.shadowColor = 'rgba(255,0,0,0.9)';
            c.shadowBlur = 16 * k;

            c.moveTo(a.x, a.y);
            c.lineTo(b.x, b.y);

          g.addColorStop(0.3, 'rgba(255,60,60,0.95)');

          c.shadowBlur = 0;
          c.fillStyle = g;
          c.beginPath();
          c.arc(h.x, h.y, 16, 0, Math.PI * 2);

      cur: null,

        const color = S.color,

        else if (S.shape === 'arrow' || S.shape === 'darrow') o = new fabric.Arrow([p.x, p.y, p.x, p.y], Object.assign({
          headEnd: true,
          headStart: S.shape === 'darrow'

        else if (S.shape === 'rect') o = new fabric.Rect(Object.assign({
          left: p.x,
          top: p.y,
          width: 1,
          height: 1,
          rx: 4,
          ry: 4,
          fill: this.fillFor(color)

        else if (S.shape === 'ellipse') o = new fabric.Ellipse(Object.assign({
          left: p.x,
          top: p.y,
          rx: 1,
          ry: 1,
          fill: this.fillFor(color)

        else o = new fabric.Triangle(Object.assign({
          left: p.x,
          top: p.y,
          width: 1,
          height: 1,
          fill: this.fillFor(color)

        this.cur = o;
        canvas.add(o);
      },
      move(p, e) {
        const o = this.cur;

          let dx = p.x - this.ox,
            dy = p.y - this.oy;
          const len = Math.hypot(dx, dy);

          const step = e && e.shiftKey ? Math.PI / 12 : Math.PI / 4;
          const snapped = Math.round(a / step) * step;
          if ((e && e.shiftKey) || Math.abs(snapped - a) < (4 * Math.PI / 180)) a = snapped;
          if ((e && e.shiftKey) || Math.abs(snapped - a) < 1e-9) {
            dx = Math.cos(a) * len;
            dy = Math.sin(a) * len;
          }
          o.set({
            x2: this.ox + dx,
            y2: this.oy + dy

          let w = p.x - this.ox,
            h = p.y - this.oy;

            h = (h < 0 ? -1 : 1) * s;

            top = Math.min(this.oy, this.oy + h);

            left,
            top,
            rx: Math.abs(w) / 2,
            ry: Math.abs(h) / 2
          });

            left,
            top,
            width: Math.abs(w),
            height: Math.abs(h)

      end() {

      },
      cancel() {
        if (this.cur) {
          canvas.remove(this.cur);

        }
      },
    };
    /* ---------- stroke eraser ---------- */
    function distSeg(p, a, b) {
      const vx = b.x - a.x,
        vy = b.y - a.y,
        l2 = vx * vx + vy * vy;
      let t = l2 ? ((p.x - a.x) * vx + (p.y - a.y) * vy) / l2 : 0;
      t = clamp(t, 0, 1);
      return Math.hypot(p.x - (a.x + t * vx), p.y - (a.y + t * vy));

    function scenePoly(o) {
      const m = o.calcTransformMatrix(),
        tp = (x, y) => fabric.util.transformPoint(new fabric.Point(x, y), m);
      if (o.type === 'path') {
        const off = o.pathOffset,
          pts = [];
        for (const c of o.path)
          for (let i = 1; i + 1 < c.length; i += 2) pts.push(tp(c[i] - off.x, c[i + 1] - off.y));

          pts,
          closed: false
        };
      }
      if (o.type === 'line' || o.type === 'arrow') {
        const p = o.calcLinePoints();
        return {
          pts: [tp(p.x1, p.y1), tp(p.x2, p.y2)],
          closed: false
        };
      }
      const w = o.width / 2,
        h = o.height / 2;
      if (o.type === 'triangle') return {
        pts: [tp(0, -h), tp(w, h), tp(-w, h)],
        closed: true
      };
      if (o.type === 'ellipse' || o.type === 'circle') {

          ry = o.type === 'circle' ? o.radius : o.ry;

          pts,
          closed: true
        };
      }
      return {
        pts: [tp(-w, -h), tp(w, -h), tp(w, h), tp(-w, h)],
        closed: true
      };
    }

      const br = o.getBoundingRect(true, true);

      if (!STROKE_TYPES.includes(o.type)) return o.containsPoint(p, null, true, true);
      if (AREA_TYPES.includes(o.type) && o.fill && o.fill !== 'transparent' && o.containsPoint(p, null, true, true)) return true;
      const {
        pts,
        closed
      } = scenePoly(o);
      const tol = r + (o.strokeWidth || 1) * ((o.scaleX + o.scaleY) / 2 || 1) / 2;
      if (pts.length === 1) return Math.hypot(p.x - pts[0].x, p.y - pts[0].y) <= tol;
      for (let i = 1; i < pts.length; i++)

      removed: 0,
      erasable(o) {

    /* ---------- images ---------- */
    function downscale(file) {
      return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onerror = reject;
        fr.onload = () => {
          const src = fr.result;
          if (file.type === 'image/svg+xml') return resolve(src);
          const im = new Image();
          im.onerror = reject;
          im.onload = () => {
            const max = 2000,
              w = im.naturalWidth,
              h = im.naturalHeight;
            const isPng = /png|gif|webp/.test(file.type);
            if (isPng && file.size < 1.5e6 && Math.max(w, h) <= max) return resolve(src);
            const s = Math.min(1, max / Math.max(w, h));
            const c = document.createElement('canvas');
            c.width = Math.max(1, Math.round(w * s));
            c.height = Math.max(1, Math.round(h * s));
            const g = c.getContext('2d');
            if (!isPng) {
              g.fillStyle = '#ffffff';
              g.fillRect(0, 0, c.width, c.height);
            }
            g.drawImage(im, 0, 0, c.width, c.height);
            resolve(isPng ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.88));
          };
          im.src = src;
        };
        fr.readAsDataURL(file);
      });
    }
    async function addImageFile(file, at) {
      if (!file || !/^image\//.test(file.type)) return;
      let url;
      try {
        url = await downscale(file);
      } catch (e) {
        Toast.show('画像を読み込めませんでした', 'error');
        return;
      }
      const id = uid('a');
      S.assets[id] = url;
      fabric.Image.fromURL(url, img => {
        if (!img || !img.width) {
          Toast.show('画像を読み込めませんでした', 'error');
          return;
        }
        img.set({
          assetId: id,
          objectId: uid()
        });
        const b = S.board,
          s = Math.min(1, b.pageW * 0.6 / img.width, b.pageH * 0.7 / img.height);
        img.scale(s);
        const c = at || View.centerScene();
        img.setPositionByOrigin(new fabric.Point(c.x, c.y), 'center', 'center');
        if (S.tool !== 'select') setTool('select');
        canvas.add(applyFlags(img));
        canvas.setActiveObject(img);
        canvas.requestRenderAll();
        Hist.commit();
      });
    }
    /* ---------- clipboard / duplicate ---------- */
    const CLIP = {

    function snapshotSelection() {
      const objs = canvas.getActiveObjects();
      if (!objs.length) return null;
      const sorted = objs.slice().sort((a, b) => canvas.getObjects().indexOf(a) - canvas.getObjects().indexOf(b));
      const json = sorted.map(serializeObj);
      const assets = {};
      usedAssetIds([{
        objects: json
      }]).forEach(id => {
        if (S.assets[id]) assets[id] = S.assets[id];
      });
      return {
        json,
        assets
      };
    }
    async function pasteJSON(data, offset) {
      Object.assign(S.assets, data.assets || {});
      const json = JSON.parse(JSON.stringify(data.json));
      const walk = j => {
        j.objectId = uid();
        if (Array.isArray(j.objects)) j.objects.forEach(walk);
      };
      json.forEach(j => {
        walk(j);
        j.left = (j.left || 0) + offset;
        j.top = (j.top || 0) + offset;
        j.locked = false;
        j.isBackground = false;
      });
      const objs = await enliven(json);
      if (!objs.length) return;
      if (S.tool !== 'select') setTool('select');
      canvas.discardActiveObject();
      Hist.suspended++;
      objs.forEach(o => canvas.add(applyFlags(o)));
      Hist.suspended--;
      canvas.setActiveObject(objs.length > 1 ? new fabric.ActiveSelection(objs, {
        canvas
      }) : objs[0]);
      canvas.requestRenderAll();
      Hist.commit();
    }

    function copySel() {
      const s = snapshotSelection();
      if (!s) return false;
      CLIP.data = s;
      CLIP.id = uid('c');
      CLIP.n = 0;
      return true;
    }

    function pasteClip() {
      if (!CLIP.data) return;
      CLIP.n++;
      pasteJSON(CLIP.data, 28 * CLIP.n);
    }

    function duplicateSel() {
      const s = snapshotSelection();
      if (s) pasteJSON(s, 28);
    }

    function deleteSel() {
      const objs = canvas.getActiveObjects();
      if (!objs.length) return;
      canvas.discardActiveObject();
      Hist.suspended++;
      objs.forEach(o => canvas.remove(o));
      Hist.suspended--;
      canvas.requestRenderAll();
      Hist.commit();
    }
    /* ---------- ink conversion when switching light ↔ chalkboard ---------- */
    const DARK_INKS = ['#1f1f1f', '#000000', '#000', '#333', '#333333', '#222222', 'rgb(0,0,0)', 'black'];

    function convertInks(toDark) {
      const from = toDark ? DARK_INKS : ['#f5f5ef'],
        to = toDark ? '#f5f5ef' : '#1f1f1f';
      let n = 0;
      const fix = (o) => {
        if (o.type === 'group') {
          o.getObjects().forEach(fix);
          return;
        }
        if (o.type === 'boardText') {
          if (o.kind !== 'sticky' && o.kind !== 'cover' && from.includes(normHex(o.fill))) {
            o.set('fill', to);
            n++;
          }
        } else if (o.isStamp) {
          if (from.includes(normHex(o.fill))) {
            o.set('fill', to);
            n++;
          }
        } else if (STROKE_TYPES.includes(o.type) && !o.isMarker && from.includes(normHex(o.stroke))) {
          o.set('stroke', to);
          n++;
        }
      };
      canvas.getObjects().forEach(fix);
      const iL = INK_LIGHT.findIndex(x => normHex(x.c) === normHex(S.color)),
        iD = INK_DARK.findIndex(x => normHex(x.c) === normHex(S.color));
      if (toDark && iL >= 0) S.color = INK_DARK[iL].c;
      else if (!toDark && iD >= 0) S.color = INK_LIGHT[iD].c;
      configureBrush();
      if (n) {
        canvas.requestRenderAll();
        Hist.commit();
        Toast.show(toDark ? '黒い字を白いチョーク色に変えました（もどすで取り消せます）' : '白い字を黒に変えました（もどすで取り消せます）');
      }
    }

    function setPageBg(key) {
      const p = curPage();
      const was = BG.isDark(p.bg);
      p.bg = BG.key(key);
      if (was !== BG.isDark(p.bg)) convertInks(BG.isDark(p.bg));
      $('#bgSelect').value = p.bg;
      canvas.requestRenderAll();
      Props.render();
      updateDock();
      scheduleSave();
    }
    /* ---------- pages ---------- */
    let loadToken = 0;
    async function loadPage(i) {
      const token = ++loadToken;
      S.loading = true;
      Hist.suspended++;
      try {
        const objs = await enliven(S.board.pages[i].objects || []);
        if (token !== loadToken) return false;
        canvas.discardActiveObject();
        canvas.renderOnAddRemove = false;
        canvas.remove(...canvas.getObjects());
        objs.forEach(o => canvas.add(applyFlags(o)));
        canvas.renderOnAddRemove = true;
      } finally {
        if (token === loadToken) S.loading = false;
        Hist.suspended--;
      }
      Hist.ensure();
      $('#bgSelect').value = curPage().bg;
      canvas.requestRenderAll();
      Props.render();
      Selbar.refresh();
      updateDock();
      return true;
    }
    async function gotoPage(i, force) {

      if (i === S.pageIndex && !force) return;
      Editor.close();
      Hist.flush();

      S.pageIndex = i;

    async function deletePage() {

    async function movePage(d) {

        i = S.pageIndex,

      if (j < 0 || j >= b.pages.length) return;

    async function clearPage() {
      if (!canvas.getObjects().length) return;
      if (!(await Modal.confirm(`${S.pageIndex + 1}ページの内容を全部消しますか？\n（「もどす」で元にもどせます）`, {

    function renderPages() {
      const b = S.board;
      if (!b) return;
      $('#pageList').innerHTML = b.pages.map((p, i) => `<button class="pchip ${i === S.pageIndex ? 'on' : ''}" data-act="page" data-v="${i}" aria-label="${i + 1}ページ" ${i === S.pageIndex ? 'aria-current="page"' : ''}>${i + 1}</button>`).join('');
      const on = $('#pageList .on');
      if (on) on.scrollIntoView({
        block: 'nearest',
        inline: 'nearest'
      });
      $$('[data-act="page-prev"]').forEach(x => x.disabled = S.pageIndex === 0);
      $$('[data-act="page-next"]').forEach(x => x.disabled = S.pageIndex >= b.pages.length - 1);
      updateDock();
    }

    function updateDock() {
      const b = S.board;
      if (!b) return;
      const pl = $('#dockPage');
      if (pl) pl.textContent = `${S.pageIndex + 1} / ${b.pages.length}`;
      const d = $('#dockInks');
      if (d) d.innerHTML = inkPalette().slice(0, 3).map(c => `<button class="dink ${S.tool === 'pen' && normHex(c.c) === normHex(S.color) ? 'on' : ''}" style="--sw:${c.c}" data-act="dock-ink" data-v="${c.c}" title="ペン（${c.n}）" aria-label="ペン（${c.n}）"></button>`).join('');
    }
    /* ---------- rendering pages for thumbnails & export ---------- */
    function renderPage(page, targetW) {
      const b = S.board,
        W = b.pageW,
        H = b.pageH,
        m = targetW ? targetW / W : 1;
      return new Promise(resolve => {
        const el = document.createElement('canvas');
        const sc = new fabric.StaticCanvas(el, {
          width: Math.round(W * m),
          height: Math.round(H * m),
          enableRetinaScaling: false,
          renderOnAddRemove: false
        });
        sc.setViewportTransform([m, 0, 0, m, 0, 0]);
        sc.on('before:render', e => BG.draw(e.ctx, sc, page.bg, W, H, null));
        fabric.util.enlivenObjects(hydrateJSON(page.objects, S.assets), objs => {
          objs.filter(Boolean).forEach(o => sc.add(o));
          RENDER.exporting = true;
          try {
            sc.renderAll();
          } finally {
            RENDER.exporting = false;
          }
          resolve(el);
        }, '');
      });
    }
    async function exportPNG() {
      Editor.close();

    async function exportPDF(all) {
      if (!window.jspdf || !window.jspdf.jsPDF) {
        Toast.show('PDFの部品を読み込めませんでした。インターネット接続を確認してください', 'error');
        return;

        W = b.pageW,
        H = b.pageH,
        pages = all ? b.pages : [curPage()];
      Toast.show(`PDFを作っています（${pages.length}ページ）…`);
      const pw = W * 0.5,
        ph = H * 0.5,

      const pdf = new window.jspdf.jsPDF({

    /* ---------- boards ---------- */
    function normalizeBoard(b) {

      b.pageW = b.pageW || 1920;

      b.assets = b.assets || {};
      if (!Array.isArray(b.pages) || !b.pages.length) b.pages = [{
        id: uid('p'),
        bg: 'grid',
        objects: []
      }];
      b.pages.forEach(p => {
        p.id = p.id || uid('p');
        p.bg = BG.key(p.bg);
        p.objects = extractAssets(p.objects || [], b.assets);
      });
      b.createdAt = b.createdAt || Date.now();
      b.updatedAt = b.updatedAt || Date.now();

              close();

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {

          await document.documentElement.requestFullscreen();

      } catch (e) {
        Toast.show('この画面では全画面にできません。「授業モード」をお使いください');

    /* ---------- actions (event delegation) ---------- */
    const ACT = {
      tool(v) {
        setTool(v);
      },
      'open-parts'(v, el) {
        Fly.open(el, partsHTML());
      },
      'open-image'() {
        $('#imgInput').click();
      },
      ink(v) {
        S.color = v;
        if (inSelectMode()) eachSel(o => setInk(o, v));
        configureBrush();
        savePrefs();
        Props.render();
        updateDock();
      },
      'dock-ink'(v) {
        S.color = v;
        setTool('pen');
        updateDock();
      },
      'pen-w'(v) {
        S.penWidth = Number(v);
        configureBrush();
        savePrefs();
        Props.render();
      },
      'stroke-w'(v) {
        eachSel(o => {
          if (STROKE_TYPES.includes(o.type)) o.set('strokeWidth', Number(v));
        });
        Props.render();
      },
      'marker-c'(v) {
        S.markerColor = v;
        if (inSelectMode()) eachSel(o => {
          if (o.isMarker) o.set('stroke', rgba(v, 0.42));
        });
        configureBrush();
        savePrefs();
        Props.render();
      },
      'marker-w'(v) {
        S.markerWidth = Number(v);
        if (inSelectMode()) eachSel(o => {
          if (o.isMarker) o.set('strokeWidth', Number(v));
        });
        configureBrush();
        savePrefs();
        Props.render();
      },
      'eraser-w'(v) {
        S.eraserSize = Number(v);
        savePrefs();
        Props.render();
      },
      async 'erase-ink'() {
        const ink = canvas.getObjects().filter(o => o.type === 'path' && !o.locked);
        if (!ink.length) {
          Toast.show('このページに手書きの線はありません');
          return;
        }
        if (!(await Modal.confirm(`このページの手書きの線（${ink.length}本）を全部消しますか？\n文字・枠・画像は残ります。`, {
            ok: '消す',
            danger: true,
            title: '手書きを消す'
          }))) return;
        Hist.suspended++;
        ink.forEach(o => canvas.remove(o));
        Hist.suspended--;
        canvas.requestRenderAll();
        Hist.commit();
      },
      shape(v) {
        S.shape = v;
        savePrefs();
        Props.render();
      },
      'shape-w'(v) {
        S.shapeWidth = Number(v);
        savePrefs();
        Props.render();
      },
      'shape-fill'(v) {
        if (inSelectMode()) {
          eachSel(o => {
            if (AREA_TYPES.includes(o.type)) {
              const c = colorToHex(o.stroke);
              o.set('fill', v === 'solid' ? c : v === 'soft' ? rgba(c, 0.16) : 'transparent');
            }
          });
        } else S.shapeFill = v;
        savePrefs();
        Props.render();
      },
      'shape-dash'() {
        S.shapeDash = !S.shapeDash;
        savePrefs();
        Props.render();
      },
      'pen-only'() {
        S.penOnly = !S.penOnly;
        savePrefs();
        Props.render();
        Toast.show(S.penOnly ? '指でなぞると画面が動きます（ペンだけで描けます）' : '指でも描けるようにしました');
      },
      stamp(v) {
        S.stamp = v;
        savePrefs();
        Props.render();
      },
      'stamp-size'(v) {
        const n = Number(v);
        if (inSelectMode()) eachSel(o => {
          if (o.isStamp) {
            const c = o.getCenterPoint();
            o.set({
              fontSize: n,
              scaleX: 1,
              scaleY: 1
            });
            o.setPositionByOrigin(c, 'center', 'center');
          }
        });
        else S.stampSize = n;
        savePrefs();
        Props.render();
      },
      dir(v) {
        const vert = v === 'v';
        if (inSelectMode()) {
          eachSel(o => {
            if (o.type !== 'boardText' || o.vertical === vert) return;
            const tl = o.translateToOriginPoint(o.getCenterPoint(), 'left', 'top');
            if (vert) {
              o.boxH = o.boxW > 0 ? Math.max(o.fontSize * 5, Math.min(o.boxW, S.board.pageH * 0.8)) : 0;
              o.boxW = 0;
            } else {
              o.boxW = o.boxH > 0 ? o.boxH : 0;
              o.boxH = 0;
            }
            [o.minW, o.minH] = [o.minH, o.minW];
            o.vertical = vert;
            o.relayout(false);
            o.setPositionByOrigin(tl, 'left', 'top');
          });
        } else {
          S.text.vertical = vert;
          savePrefs();
        }
        Props.render();

        canvas.requestRenderAll();

      'sel-back'() {
        const objs = canvas.getActiveObjects();
        objs.slice().sort((a, b) => canvas.getObjects().indexOf(b) - canvas.getObjects().indexOf(a)).forEach(o => canvas.sendToBack(o));
        canvas.requestRenderAll();

      'sel-lock'() {
        const objs = canvas.getActiveObjects();
        const lock = !objs.every(o => o.locked);
        canvas.discardActiveObject();
        objs.forEach(o => {
          o.locked = lock;
          applyFlags(o);
        });
        canvas.setActiveObject(objs.length > 1 ? new fabric.ActiveSelection(objs, {
          canvas
        }) : objs[0]);
        canvas.requestRenderAll();
        Hist.commit();
        Selbar.refresh();
        Props.render();
        Toast.show(lock ? '固定しました（動かなくなります）' : '固定をはずしました');

      'ed-dir'() {
        const o = Editor.obj;
        if (!o) return;
        const tl = o.translateToOriginPoint(o.getCenterPoint(), 'left', 'top');
        const vert = !o.vertical;
        if (vert) {
          o.boxH = o.boxW > 0 ? Math.max(o.fontSize * 5, o.boxW) : 0;
          o.boxW = 0;
        } else {
          o.boxW = o.boxH > 0 ? o.boxH : 0;
          o.boxH = 0;
        } [o.minW, o.minH] = [o.minH, o.minW];
        o.vertical = vert;
        o.relayout(false);
        o.setPositionByOrigin(tl, 'left', 'top');
        Editor.style();
        Editor.renderBar();

        canvas.requestRenderAll();

      'ed-size'(v) {
        const o = Editor.obj;
        if (!o) return;
        const sizes = FONT_SIZES.map(s => s.v);
        let i = sizes.findIndex(s => s >= o.fontSize - 0.5);
        if (i < 0) i = sizes.length - 1;
        const n = sizes[clamp(i + Number(v), 0, sizes.length - 1)];
        if (n === o.fontSize) return;
        const k = n / o.fontSize;
        o.set({
          fontSize: n,
          boxW: o.boxW * k,
          boxH: o.boxH * k,
          minW: o.minW * k,
          minH: o.minH * k
        });
        o.relayout(true);
        Editor.style();
        Editor.position();
        canvas.requestRenderAll();

    };
    /* ---------- events ---------- */
    function bindEvents() {
      document.addEventListener('click', e => {
        const b = e.target.closest('[data-act]');
        if (!b || b.disabled) return;
        const fn = ACT[b.dataset.act];
        if (!fn) return;
        e.preventDefault();
        fn(b.dataset.v, b, e);
      });
      const onInputEl = (e) => {
        const el = e.target,
          k = el.dataset && el.dataset.input;
        if (!k) return;
        if (k === 'font') {
          if (inSelectMode()) eachSel(o => {
            if (o.type === 'boardText') o.set('fontKey', el.value);
          });
          else {
            S.text.fontKey = el.value;
            savePrefs();
          }
        } else if (k === 'size') {
          const n = Number(el.value);
          if (inSelectMode()) eachSel(o => {
            if (o.type !== 'boardText') return;
            const cur = o.fontSize * (o.scaleX || 1),
              r = n / cur;
            o.set({
              fontSize: n,
              scaleX: 1,
              scaleY: 1,
              boxW: o.boxW * r * (o.scaleX || 1),
              boxH: o.boxH * r * (o.scaleY || 1),
              minW: o.minW * r * (o.scaleX || 1),
              minH: o.minH * r * (o.scaleY || 1)
            });
          });
          else {
            S.text.fontSize = n;
            savePrefs();
          }
        } else if (ACT[k]) {
          ACT[k](el.value);
          return;
        }
        Props.render();
      };
      $('#props').addEventListener('change', onInputEl);
      $('#props').addEventListener('input', e => {
        if (e.target.type === 'color') {
          const k = e.target.dataset.input;
          if (k === 'ink') {
            S.color = e.target.value;
            configureBrush();
          } else if (k === 'marker-c') {
            S.markerColor = e.target.value;
            configureBrush();
          }
        }
      });
      $('#boardTitle').addEventListener('change', e => {
        const t = e.target.value.trim() || '無題のボード';
        e.target.value = t;
        S.board.title = t;
        document.title = `${t} | 板書ボード`;
        scheduleSave(300);
      });
      $('#boardTitle').addEventListener('keydown', e => {
        if (e.key === 'Enter') e.target.blur();
      });
      $('#bgSelect').innerHTML = Object.entries(BG.LIST).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('');
      $('#bgSelect').addEventListener('change', e => setPageBg(e.target.value));
      $('#imgInput').addEventListener('change', e => {
        Array.from(e.target.files || []).forEach(f => addImageFile(f));
        e.target.value = '';
      });
      $('#jsonInput').addEventListener('change', e => {
        const f = e.target.files && e.target.files[0];
        if (f) importBoardFile(f);
        e.target.value = '';
      });
      canvas.on('mouse:down:before', opt => {
        if (Editor.obj) Editor.close();
        const ae = document.activeElement;
        if (ae && ae !== document.body && ae !== Editor.ta && ae.blur) ae.blur();
        S.downWasActive = canvas.getActiveObject() || null;
        const e = opt.e;
        S.down = {
          x: e.clientX,
          y: e.clientY
        };
        S.moved = false;
        S.gestured = false;
      });
      canvas.on('mouse:down', opt => {
        const p = opt.absolutePointer;
        if (S.tool === 'shape') Shapes.start(p);
        else if (S.tool === 'eraser') Eraser.start(p);
        else if (S.tool === 'stamp') placeStamp(p);
        else if (S.tool === 'laser') {
          FX.pressed = true;
          FX.pointer(opt.e);
        }
      });
      canvas.on('mouse:move', opt => {
        const e = opt.e;
        if (S.down && !S.moved && Math.hypot(e.clientX - S.down.x, e.clientY - S.down.y) > 6) S.moved = true;
        FX.pointer(e);
        if (!S.down) return;
        const p = opt.absolutePointer;
        if (S.tool === 'shape') Shapes.move(p, e);
        else if (S.tool === 'eraser') Eraser.move(p);
      });
      canvas.on('mouse:up', opt => {
        const moved = S.moved,
          gest = S.gestured;
        S.down = null;
        if (S.tool === 'shape') Shapes.end();
        else if (S.tool === 'eraser') Eraser.end();
        else if (S.tool === 'laser') FX.pressed = false;
        if (gest) {
          S.gestured = false;
          return;
        }
        if (S.tool === 'text' && !moved) textClick(opt.absolutePointer);
        else if (S.tool === 'select' && !moved && opt.target) {
          const t = opt.target;
          if (t.type === 'boardText' && t.kind === 'cover') {
            toggleCover(t);
            canvas.discardActiveObject();
            canvas.requestRenderAll();
          } else if (t.type === 'boardText' && S.downWasActive === t && !t.locked) Editor.open(t);
        }
        if (S.transforming) {
          S.transforming = false;
          Selbar.refresh();
        }
      });
      canvas.on('mouse:out', () => {
        FX.cursor = null;
        FX.kick();
      });
      canvas.on('mouse:dblclick', opt => {
        const t = opt.target;
        if (S.tool === 'select' && t && t.type === 'boardText' && t.kind !== 'cover') Editor.open(t);
      });
      canvas.on('path:created', ({
        path
      }) => {
        if (Gest.discardPath) {
          Gest.discardPath = false;
          canvas.remove(path);
          return;
        }
        path.set({
          objectId: uid(),
          perPixelTargetFind: true
        });
        if (S.tool === 'marker') path.isMarker = true;
        const br = path.getBoundingRect(true, true);
        if (br.width < 10 && br.height < 10) {
          const c = new fabric.Point(br.left + br.width / 2, br.top + br.height / 2);
          const cover = canvas.getObjects().slice().reverse().find(o => o.kind === 'cover' && o.containsPoint(c, null, true, true));
          if (cover) {
            Hist.suspended++;
            canvas.remove(path);
            Hist.suspended--;
            toggleCover(cover);
            return;
          }
        }
        Hist.schedule();
      });
      canvas.on('object:added', e => {
        if (!e.target._temp && !Hist.suspended) Hist.schedule();
      });
      canvas.on('object:removed', e => {
        if (!e.target._temp && !Hist.suspended) Hist.schedule();
      });
      canvas.on('object:modified', e => {
        S.transforming = false;
        bakeScale(e.target);
        Hist.schedule();
        Selbar.refresh();
        Props.render();
      });
      ['object:moving', 'object:scaling', 'object:rotating', 'object:resizing'].forEach(ev => canvas.on(ev, () => {
        if (!S.transforming) {
          S.transforming = true;
          Selbar.position();
        }
      }));
      ['selection:created', 'selection:updated', 'selection:cleared'].forEach(ev => canvas.on(ev, () => {
        Selbar.refresh();
        Props.render();
      }));
      canvas.upperCanvasEl.addEventListener('mousedown', e => e.preventDefault());
      const stage = $('#stage');
      stage.addEventListener('wheel', e => {
        if (e.target.closest('#props,#selbar,#edbar,#rubyPop')) return;
        e.preventDefault();
        const r = canvas.upperCanvasEl.getBoundingClientRect(),
          pt = {
            x: e.clientX - r.left,
            y: e.clientY - r.top
          };
        if (e.ctrlKey || e.metaKey) View.zoomTo(canvas.getZoom() * Math.pow(0.992, e.deltaY), pt);
        else View.panBy(-(e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX), e.shiftKey && !e.deltaX ? 0 : -e.deltaY);
      }, {
        passive: false
      });
      const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
      stage.addEventListener('dragover', e => {
        if (hasFiles(e)) {
          e.preventDefault();
          $('#dropHint').hidden = false;
        }
      });
      stage.addEventListener('dragleave', e => {
        if (e.target === stage || !stage.contains(e.relatedTarget)) $('#dropHint').hidden = true;
      });
      stage.addEventListener('drop', e => {
        if (!hasFiles(e)) return;
        e.preventDefault();
        $('#dropHint').hidden = true;
        const at = View.toScene(e.clientX, e.clientY);
        Array.from(e.dataTransfer.files).forEach((f, i) => {
          if (/^image\//.test(f.type)) addImageFile(f, new fabric.Point(at.x + i * 30, at.y + i * 30));
          else if (/json/.test(f.type) || /\.json$/i.test(f.name)) importBoardFile(f);
        });
      });
      new ResizeObserver(() => {
        const w = stage.clientWidth,
          h = stage.clientHeight;
        if (!w || !h) return;
        canvas.setDimensions({
          width: w,
          height: h
        });
        FX.size();
        if (S.isFit) View.fit();
        else View.changed();
      }).observe(stage);
      document.addEventListener('keydown', e => {
        if (Modal.isOpen) {
          if (e.key === 'Escape') {
            e.preventDefault();
            Modal.close(undefined);
          }
          return;
        }
        if (Menu.isOpen && e.key === 'Escape') {
          Menu.close();
          return;
        }
        if (Editor.obj) {
          if (e.key === 'Escape' || (e.key === 'Enter' && (e.ctrlKey || e.metaKey))) {
            e.preventDefault();
            Editor.close({
              select: true
            });
          }
          return;
        }
        if (isTyping(e.target)) return;
        const mod = e.ctrlKey || e.metaKey,
          key = e.key,
          k = key.length === 1 ? key.toLowerCase() : key;
        if (mod) {
          if (k === 'z') {
            e.preventDefault();
            e.shiftKey ? Hist.redo() : Hist.undo();
          } else if (k === 'y') {
            e.preventDefault();
            Hist.redo();
          } else if (k === 'd') {
            e.preventDefault();
            duplicateSel();
          } else if (k === 'a') {
            e.preventDefault();
            setTool('select');
            const objs = canvas.getObjects().filter(o => o.selectable && o.evented);
            if (objs.length) {
              canvas.setActiveObject(new fabric.ActiveSelection(objs, {
                canvas
              }));
              canvas.requestRenderAll();
            }
          } else if (k === '=' || k === '+' || k === ';') {
            e.preventDefault();
            ACT['zoom-in']();
          } else if (k === '-') {
            e.preventDefault();
            ACT['zoom-out']();
          } else if (k === '0') {
            e.preventDefault();
            View.fit();
          }
          return;
        }
        const a = canvas.getActiveObject();
        if (key === 'Delete' || key === 'Backspace') {
          if (a) {
            e.preventDefault();
            deleteSel();
          }
          return;
        }
        if (key === 'Escape') {
          Fly.close();
          if (a) {
            canvas.discardActiveObject();
            canvas.requestRenderAll();
          } else if (document.body.classList.contains('focus-mode')) toggleFocus(false);
          else if (S.tool !== 'select') setTool('select');
          return;
        }
        if (key === ' ' && (e.target === document.body || e.target.tagName === 'CANVAS')) {
          e.preventDefault();
          if (!S.spaceDown) {
            S.spaceDown = true;
            canvas.upperCanvasEl.style.cursor = 'grab';
          }
          return;
        }
        if (key === 'Enter' && a && a.type === 'boardText') {
          e.preventDefault();
          Editor.open(a);
          return;
        }
        if (a && key.startsWith('Arrow')) {
          e.preventDefault();
          const d = e.shiftKey ? 20 : 2;
          if (key === 'ArrowLeft') a.left -= d;
          if (key === 'ArrowRight') a.left += d;
          if (key === 'ArrowUp') a.top -= d;
          if (key === 'ArrowDown') a.top += d;
          a.setCoords();
          canvas.requestRenderAll();
          Selbar.position();
          Hist.schedule();
          return;
        }
        if (key === 'PageDown' || key === 'ArrowRight' || key === 'ArrowDown') {
          e.preventDefault();
          gotoPage(S.pageIndex + 1);
          return;
        }
        if (key === 'PageUp' || key === 'ArrowLeft' || key === 'ArrowUp') {
          e.preventDefault();
          gotoPage(S.pageIndex - 1);
          return;
        }
        const map = {
          v: 'select',
          p: 'pen',
          m: 'marker',
          e: 'eraser',
          t: 'text',
          s: 'shape',
          k: 'laser',
          h: 'hand',
          i: 'stamp'
        };
        const shp = {
          a: 'arrow',
          r: 'rect',
          o: 'ellipse',
          l: 'line'
        };
        if (map[k]) {
          setTool(map[k]);
          return;
        }
        if (shp[k]) {
          S.shape = shp[k];
          setTool('shape');
          return;
        }
        if (k === 'f') {
          toggleFocus();
          return;
        }
        if (k === '?') {
          helpDialog();
        }
      });
      document.addEventListener('keyup', e => {
        if (e.key === ' ') {
          S.spaceDown = false;
          canvas.upperCanvasEl.style.cursor = canvas.defaultCursor;
        }
      });
      document.addEventListener('copy', e => {
        if (isTyping(document.activeElement) || Editor.obj || !canvas.getActiveObject()) return;
        if (copySel()) {
          e.clipboardData.setData('text/plain', 'bansho-board:' + CLIP.id);
          e.preventDefault();
          Toast.show('コピーしました');
        }
      });
      document.addEventListener('cut', e => {
        if (isTyping(document.activeElement) || Editor.obj || !canvas.getActiveObject()) return;
        if (copySel()) {
          e.clipboardData.setData('text/plain', 'bansho-board:' + CLIP.id);
          e.preventDefault();
          deleteSel();
        }
      });
      document.addEventListener('paste', e => {
        if (isTyping(document.activeElement) || Editor.obj || Modal.isOpen) return;
        const dt = e.clipboardData;
        if (!dt) return;
        const text = dt.getData('text/plain') || '';
        if (CLIP.data && text === 'bansho-board:' + CLIP.id) {
          e.preventDefault();
          pasteClip();
          return;
        }
        const files = Array.from(dt.files || []).filter(f => /^image\//.test(f.type));
        if (files.length) {
          e.preventDefault();
          files.forEach(f => addImageFile(f));
          return;
        }
        if (text.trim()) {
          e.preventDefault();
          const o = new fabric.BoardText(Object.assign(textDefaults(), {
            kind: 'text',
            text: text.replace(/\r\n?/g, '\n').slice(0, 4000),
            vertical: S.text.vertical,
            fill: S.color,
            boxW: S.text.vertical ? 0 : (text.length > 30 ? S.text.fontSize * 20 : 0),
            boxH: S.text.vertical && text.length > 20 ? S.text.fontSize * 14 : 0,
            objectId: uid()
          }));
          placeNew(o, {
            edit: false
          });
        } else if (CLIP.data) {
          e.preventDefault();
          pasteClip();
        }
      });
      window.addEventListener('beforeunload', () => {
        if (saveTimer) saveNow({
          thumb: false
        });
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') saveNow({
          thumb: false
        });
      });
      document.addEventListener('fullscreenchange', () => {
        $$('[data-act="fullscreen"]').forEach(b => b.classList.toggle('on', !!document.fullscreenElement));
      });
      const mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
      const readDesk = () => {
        deskColor = getComputedStyle(document.documentElement).getPropertyValue('--desk').trim() || '#e6e9e4';
        if (canvas) canvas.requestRenderAll();
      };
      if (mq && mq.addEventListener) mq.addEventListener('change', readDesk);
      new MutationObserver(readDesk).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['data-theme']
      });
      readDesk();
    }
    /* ---------- boot ---------- */
    async function boot() {
      hydrateIcons();
      defineObjects();
      fabric.Object.prototype.set({
        borderColor: '#2f80ed',
        cornerColor: '#ffffff',
        cornerStrokeColor: '#2f80ed',
        cornerStyle: 'circle',
        transparentCorners: false,
        cornerSize: 13,
        touchCornerSize: 34,
        borderScaleFactor: 1.6,
        padding: 6,
      });
      const stage = $('#stage');
      canvas = new fabric.Canvas('c', {
        width: stage.clientWidth || 800,
        height: stage.clientHeight || 600,
        preserveObjectStacking: true,
        enablePointerEvents: true,
        stopContextMenu: true,
        fireMiddleClick: true,
        selectionColor: 'rgba(47,128,237,0.08)',
        selectionBorderColor: '#2f80ed',
        selectionLineWidth: 1.5,
        targetFindTolerance: 8,
        uniformScaling: true,
        backgroundColor: null,
      });
      canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
      canvas.freeDrawingBrush.decimate = 1.6;
      canvas.on('before:render', e => {
        if (!S.board) return;
        BG.draw(e.ctx, canvas, curPage().bg, S.board.pageW, S.board.pageH, {
          desk: deskColor,
          dpr: canvas._isRetinaScaling() ? fabric.devicePixelRatio : 1
        });
      });
      window.App = {
        relayoutAll() {
          if (!canvas) return;
          canvas.getObjects().forEach(o => {
            if (o.type === 'boardText') o.relayout(true);
          });
          Editor.position();
          canvas.requestRenderAll();
        }
      };
      FX.init();
      Gest.init();
      Editor.init();
      bindEvents();
      Timer.init();
      Kuji.init();
      FileOut.warm();
      const ok = await Store.open();
      if (ok && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      let metas = [];
      try {
        metas = await Store.listMeta();
      } catch (e) {
        metas = [];
      }
      // bring over boards saved by the previous version of this app
      let migrated = 0;
      try {
        const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || 'null');
        const done = (await Store.kvGet('legacyDone')) || LS.get('bb.legacyDone', []);
        if (legacy && typeof legacy === 'object') {
          for (const [id, s] of Object.entries(legacy)) {
            if (done.includes(id)) continue;
            const b = normalizeBoard(legacySaveToBoard(id, s));
            await Store.putBoard(b, {
              id: b.id,
              title: b.title,
              createdAt: b.createdAt,
              updatedAt: b.updatedAt,
              pages: b.pages.length,
              thumb: '',
              pageW: b.pageW,
              pageH: b.pageH
            });
            done.push(id);
            migrated++;
          }
          await Store.kvSet('legacyDone', done);
          LS.set('bb.legacyDone', done);
          if (migrated) metas = await Store.listMeta();
        }
      } catch (e) {
        console.warn('legacy migration skipped', e);
      }
      let board = null;
      const lastId = (await Store.kvGet('last')) || LS.get('bb.last', null);
      if (lastId) board = await Store.getBoard(lastId);
      if (!board && metas.length) {
        metas.sort((a, b) => b.updatedAt - a.updatedAt);
        board = await Store.getBoard(metas[0].id);
      }
      if (!board) board = sampleBoard();
      setTool(S.tool || 'pen');
      await openBoard(board);
      await saveNow();
      if (migrated) Toast.show(`以前のアプリで保存した${migrated}件のボードを引き継ぎました（ボード一覧から開けます）`);
      else if (!ok) Toast.show('このブラウザでは自動保存ができません。「ファイルに保存」をご利用ください', 'error');
      document.body.classList.add('ready');
    }
    window.addEventListener('DOMContentLoaded', () => {
      if (!window.fabric) {
        document.body.classList.add('ready');
        $('#bootError').hidden = false;
        return;
      }
      boot().catch(e => {
        console.error(e);
        Toast.show('起動中に問題が起きました: ' + e.message, 'error');
        document.body.classList.add('ready');
      });
    });
  </script>

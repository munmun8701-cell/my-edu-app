<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>係掲示　児童用</title>

  <!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>係ポスターメーカー ULTIMATE v3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Mochiy+Pop+One&family=Yusei+Magic&family=Hachi+Maru+Pop&family=Klee+One:wght@400;600&family=Yomogi&family=Dela+Gothic+One&family=Rampart+One&family=Yuji+Syuku&family=DotGothic16&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <style>
    :root {
      --board: #1f4d3d;
      --board-2: #2a6150;
      --chalk: #f7f3e3;
      --chalk-yellow: #f6d84a;
      --ink: #22302b;
      --ink-2: #5d6c66;
      --line: #dbe3df;
      --paper: #ffffff;
      --desk: #e6edf0;
      --soft: #f3f6f4;
      --accent: #e8553e;
      --accent-dark: #b83a26;
      --focus: #2b7de9;
      --font: 'M PLUS Rounded 1c', system-ui, -apple-system, 'Hiragino Maru Gothic ProN', 'Meiryo', sans-serif;
      --header-h: 58px;
      --rail-w: 80px;
      --panel-w: 304px;
      --props-w: 304px;
      --tabbar-h: 66px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: var(--font);
      font-weight: 500;
      color: var(--ink);
      background: var(--desk);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font-family: inherit;
      color: inherit;
      cursor: pointer;
    }

    input,
    select,
    textarea {
      font-family: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    [hidden] {
      display: none !important;
    }

    ::-webkit-scrollbar {
      width: 9px;
      height: 9px;
    }

    ::-webkit-scrollbar-thumb {
      background: #c5d0cb;
      border-radius: 6px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    /* ---------- ヘッダー ---------- */
    .topbar {
      height: var(--header-h);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      position: relative;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: 4px;
      min-width: 0;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--board);
      color: var(--chalk-yellow);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 21px;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .28);
      flex-shrink: 0;
    }

    .brand-name {
      font-weight: 800;
      font-size: 15px;
      white-space: nowrap;
      line-height: 1.2;
    }

    .brand-name small {
      display: block;
      font-size: 10.5px;
      color: var(--ink-2);
      font-weight: 500;
    }

    .tb-group {
      display: flex;
      gap: 2px;
      align-items: center;
      padding-left: 8px;
      margin-left: 2px;
      border-left: 1px solid var(--line);
    }

    .tb-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 40px;
      padding: 0 10px;
      border: 1px solid transparent;
      background: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .tb-btn:hover {
      background: var(--soft);
      border-color: var(--line);
    }

    .tb-btn:disabled {
      opacity: .32;
      cursor: default;
      background: none;
      border-color: transparent;
    }

    .tb-btn i {
      font-size: 15px;
    }

    .tb-btn.icon {
      width: 36px;
      justify-content: center;
      padding: 0;
    }

    .zoom-val {
      min-width: 60px;
      justify-content: center;
      font-variant-numeric: tabular-nums;
    }

    .tb-spacer {
      flex: 1;
    }

    .save-state {
      font-size: 11px;
      color: var(--ink-2);
      white-space: nowrap;
      margin-right: 4px;
    }

    .save-state i {
      color: #3f9a6b;
      margin-right: 3px;
    }

    .tb-primary {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 42px;
      padding: 0 18px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      white-space: nowrap;
      box-shadow: 0 3px 0 var(--accent-dark);
    }

    .tb-primary:hover {
      filter: brightness(1.05);
    }

    .tb-primary:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--accent-dark);
    }

    /* ---------- 全体レイアウト ---------- */
    .app {
      display: flex;
      height: calc(100vh - var(--header-h));
      height: calc(100dvh - var(--header-h));
      position: relative;
    }

    .rail {
      width: var(--rail-w);
      flex-shrink: 0;
      background-color: var(--board);
      background-image: radial-gradient(rgba(255, 255, 255, .045) 1px, transparent 1.2px);
      background-size: 7px 7px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 8px;
      z-index: 20;
      overflow-y: auto;
    }

    .rail-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 10px 2px 9px;
      border: none;
      border-radius: 12px;
      background: none;
      color: rgba(247, 243, 227, .8);
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: .02em;
      flex-shrink: 0;
    }

    .rail-btn i {
      font-size: 19px;
    }

    .rail-btn:hover {
      background: rgba(255, 255, 255, .08);
      color: #fff;
    }

    .rail-btn.active {
      background: var(--chalk-yellow);
      color: var(--board);
      box-shadow: 0 3px 0 rgba(0, 0, 0, .28);
    }

    .panel,
    .props {
      width: var(--panel-w);
      flex-shrink: 0;
      background: var(--paper);
      display: flex;
      flex-direction: column;
      min-height: 0;
      z-index: 15;
    }

    .panel {
      border-right: 1px solid var(--line);
    }

    .props {
      border-left: 1px solid var(--line);
      width: var(--props-w);
    }

    body.panel-collapsed .panel {
      display: none;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 14px 14px 10px 18px;
      border-bottom: 1px solid var(--line);
      min-height: 54px;
    }

    .panel-head h2 {
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .panel-head h2 span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-x {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      border: none;
      background: none;
      color: var(--ink-2);
      font-size: 17px;
      flex-shrink: 0;
    }

    .icon-x:hover {
      background: var(--soft);
      color: var(--ink);
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px 32px;
      overscroll-behavior: contain;
    }

    /* ---------- ステージ ---------- */
    .stage-wrap {
      flex: 1;
      min-width: 0;
      position: relative;
      background-color: var(--desk);
      background-image:
        linear-gradient(rgba(40, 90, 120, .07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(40, 90, 120, .07) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .stage {
      position: absolute;
      inset: 0;
      overflow: auto;
      display: flex;
      padding: 40px;
    }

    .sheet {
      margin: auto;
      position: relative;
      flex-shrink: 0;
      box-shadow: 0 1px 2px rgba(25, 45, 38, .2), 0 16px 36px -12px rgba(25, 45, 38, .4);
      background: #fff;
    }

    .pin {
      position: absolute;
      top: -10px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
      box-shadow: 0 4px 5px rgba(0, 0, 0, .28), inset -3px -4px 0 rgba(0, 0, 0, .18);
    }

    .pin::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 4px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .75);
    }

    .pin-l {
      left: 26px;
      background: var(--accent);
    }

    .pin-r {
      right: 26px;
      background: #f2c230;
    }

    .empty-hint {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      text-align: center;
      background: rgba(255, 255, 255, .92);
      border: 2px dashed #9fb3aa;
      border-radius: 16px;
      padding: 18px 22px;
      color: var(--ink-2);
      font-size: 14px;
      line-height: 1.8;
      font-weight: 800;
      max-width: min(360px, 80%);
    }

    .empty-hint i {
      display: block;
      font-size: 28px;
      color: #9fb3aa;
      margin-bottom: 6px;
    }

    .draw-banner {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      background: #6d28d9;
      color: #fff;
      border-radius: 999px;
      padding: 6px 8px 6px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 6px 16px rgba(80, 30, 160, .35);
      white-space: nowrap;
    }

    .draw-banner button {
      border: none;
      background: #fff;
      color: #6d28d9;
      border-radius: 999px;
      padding: 6px 14px;
      font-weight: 800;
      font-size: 13px;
    }

    /* ---------- 選択中ツールバー ---------- */
    .floatbar {
      position: fixed;
      z-index: 30;
      display: flex;
      gap: 2px;
      padding: 4px;
      background: var(--ink);
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .28);
    }

    .floatbar button {
      border: none;
      background: none;
      color: #fff;
      height: 38px;
      min-width: 38px;
      padding: 0 10px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .floatbar button:hover {
      background: rgba(255, 255, 255, .15);
    }

    .floatbar button.hi {
      background: var(--chalk-yellow);
      color: var(--board);
    }

    .floatbar button.hi:hover {
      filter: brightness(1.05);
    }

    .floatbar .sep {
      width: 1px;
      background: rgba(255, 255, 255, .18);
      margin: 6px 2px;
    }

    /* ---------- パネル内部品 ---------- */
    .lead {
      font-size: 13px;
      line-height: 1.75;
      color: var(--ink-2);
      margin-bottom: 4px;
    }

    .p-h {
      font-size: 13.5px;
      font-weight: 800;
      margin: 20px 0 9px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .p-h:first-child {
      margin-top: 0;
    }

    .p-h .step {
      width: 21px;
      height: 21px;
      border-radius: 50%;
      background: var(--board);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 11.5px;
      flex-shrink: 0;
    }

    .grid {
      display: grid;
      gap: 8px;
    }

    .g2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .g3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .g4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .g5 {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .tile {
      border: 2px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 7px 4px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      font-weight: 800;
      text-align: center;
      line-height: 1.25;
      transition: border-color .12s, transform .1s;
      min-width: 0;
    }

    .tile:hover {
      border-color: #9fb3aa;
    }

    .tile:active {
      transform: scale(.96);
    }

    .tile.sel {
      border-color: var(--board);
      box-shadow: 0 0 0 3px rgba(31, 77, 61, .16);
    }

    .tile .em {
      font-size: 30px;
      line-height: 1.15;
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    }

    .tile .nm {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }

    .thumb {
      width: 100%;
      aspect-ratio: 3 / 2;
      border-radius: 8px;
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(0, 0, 0, .08);
    }

    .thumb.tall {
      aspect-ratio: 5 / 7;
    }

    .theme-prev {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, .08);
      display: grid;
      place-items: center;
      font-size: 26px;
      line-height: 1;
      overflow: hidden;
      background-size: cover;
    }

    .emoji-btn {
      border: none;
      background: #fff;
      border-radius: 10px;
      aspect-ratio: 1;
      font-size: 27px;
      line-height: 1;
      display: grid;
      place-items: center;
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      transition: transform .1s, background .1s;
    }

    .emoji-btn:hover {
      background: var(--soft);
      transform: scale(1.12);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      border: 1.5px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chip.sel {
      background: var(--board);
      border-color: var(--board);
      color: #fff;
    }

    .chip input {
      accent-color: var(--board);
    }

    .tool-btn {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 8px;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: #fff;
      font-size: 14px;
      font-weight: 800;
      text-align: left;
    }

    .tool-btn:hover {
      border-color: #9fb3aa;
    }

    .tool-btn:active {
      transform: scale(.985);
    }

    .tool-btn .ic {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .tool-btn small {
      display: block;
      font-size: 11.5px;
      color: var(--ink-2);
      font-weight: 500;
      margin-top: 1px;
    }

    .tool-btn.on {
      border-color: #6d28d9;
      background: #f5f3ff;
    }

    .hint {
      font-size: 12px;
      color: var(--ink-2);
      line-height: 1.75;
      background: var(--soft);
      border-radius: 10px;
      padding: 10px 12px;
      margin-top: 12px;
    }

    .hint b {
      color: var(--ink);
    }

    .hint code {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 0 4px;
      font-family: inherit;
      font-weight: 800;
      color: var(--ink);
    }

    .style-btn {
      border: 2px solid var(--line);
      border-radius: 12px;
      background: #fff;
      height: 62px;
      display: grid;
      place-items: center;
      font-size: 24px;
      line-height: 1;
      overflow: hidden;
    }

    .style-btn:hover {
      border-color: #9fb3aa;
    }

    .big-upload {
      width: 100%;
      border: 2.5px dashed #9fb3aa;
      border-radius: 14px;
      background: var(--soft);
      padding: 22px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 800;
    }

    .big-upload i {
      font-size: 30px;
      color: var(--board);
    }

    .big-upload small {
      font-size: 11.5px;
      color: var(--ink-2);
      font-weight: 500;
    }

    .big-upload:hover {
      border-color: var(--board);
    }

    /* ---------- プロパティ ---------- */
    .pp-sec {
      padding: 14px 0;
      border-bottom: 1px dashed var(--line);
    }

    .pp-sec:first-child {
      padding-top: 0;
    }

    .pp-sec:last-child {
      border-bottom: none;
    }

    .pp-h {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pp-h i {
      color: var(--ink-2);
      font-size: 12px;
    }

    .pp-row {
      margin-bottom: 11px;
    }

    .pp-row:last-child {
      margin-bottom: 0;
    }

    .pp-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
      font-weight: 800;
      color: var(--ink-2);
      margin-bottom: 6px;
    }

    .pp-label b {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .sw {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(0, 0, 0, .13);
      padding: 0;
      flex-shrink: 0;
    }

    .sw.sel {
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink);
    }

    .sw.none {
      background: linear-gradient(135deg, #fff 44%, #e5484d 44% 56%, #fff 56%) !important;
    }

    .sw-custom {
      position: relative;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: conic-gradient(#f43f5e, #f59e0b, #facc15, #22c55e, #0ea5e9, #6366f1, #a855f7, #f43f5e);
      border: 2px solid rgba(0, 0, 0, .13);
    }

    .sw-custom input {
      position: absolute;
      inset: -8px;
      width: 44px;
      height: 44px;
      opacity: 0;
      cursor: pointer;
      border: none;
    }

    .seg {
      display: flex;
      background: var(--soft);
      border-radius: 11px;
      padding: 3px;
      gap: 3px;
    }

    .seg button {
      flex: 1;
      min-width: 0;
      border: none;
      background: none;
      border-radius: 8px;
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 800;
      color: var(--ink-2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
    }

    .seg button.sel {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .14);
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--board);
      height: 26px;
      cursor: pointer;
    }

    .pp-btns {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
      gap: 6px;
    }

    .pbtn {
      border: 1.5px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 8px 2px 7px;
      font-size: 11.5px;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .pbtn i {
      font-size: 14px;
    }

    .pbtn:hover {
      border-color: #9fb3aa;
    }

    .pbtn.danger {
      color: #c2410c;
    }

    .pbtn.danger:hover {
      background: #fff4ed;
      border-color: #fdba74;
    }

    .pbtn.on {
      background: var(--board);

    #toastRoot {

      flex-direction: column;

      align-items: center;
      pointer-events: none;

    .toast {

      color: #fff;
      padding: 11px 18px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 800;

      text-align: center;
    }

    .toast.warn {
      background: #9a3412;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(.98);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    /* ---------- 中くらいの画面（タブレット・小さめのノートPC） ---------- */
    @media (max-width: 1279px) {
      .props {
        display: none;
      }

      body.has-sel .props {
        display: flex;
      }

      .brand-name small {
        display: none;
      }
    }

    @media (max-width: 1100px) {
      .tb-btn span.lbl {
        display: none;
      }

      .tb-btn {
        padding: 0 9px;
      }
    }

    /* ---------- スマホ・たてのタブレット ---------- */
    @media (max-width: 859px) {
      :root {
        --header-h: 54px;
      }

      .brand-name {
        display: none;
      }

      .save-state {
        display: none;
      }

      .tb-group {
        padding-left: 4px;
      }

      .tb-primary {
        padding: 0 12px;
      }

      .tb-primary span {
        display: none;
      }

      .zoom {
        display: none;
      }

      .app {
        flex-direction: column;
      }

      .rail {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        top: auto;
        width: 100%;
        height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));

        z-index: 60;

        letter-spacing: 0;

      .rail-btn i {

      }

      .panel,
      .props {

        left: 0;
        right: 0;
        top: auto;

        bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom));

        z-index: 55;

        z-index: 56;
        display: flex;
      }

      body.panel-collapsed .panel {

      }

      body.has-sel .props {
        transform: none;

        width: 16px;
        height: 16px;
        top: -8px;
      }
    }
  </style>
</head>

              const s = 0.6 + r() * 1.6;
              x.fillRect(r() * T, r() * T, s, s);

            x.strokeStyle = rgba(b, 0.03);
            x.lineWidth = 7;
            x.lineCap = 'round';
            for (let i = 0; i < 5; i++) {
              x.beginPath();
              const sx = r() * T,
                sy = r() * T;
              x.moveTo(sx, sy);

              const sx = r() * T,
                sy = r() * T,
                ang = r() * Math.PI,
                len = 3 + r() * 9;

      function bgFill(cfg) {
        const def = BG_TYPES[cfg.type] || BG_TYPES.solid;
        if (def.grad) return new fabric.Gradient({
          type: 'linear',
          gradientUnits: 'percentage',
          coords: {
            x1: 0,
            y1: 0,
            x2: 0,
            y2: 1
          },
          colorStops: [{
            offset: 0,
            color: cfg.c1
          }, {
            offset: 1,
            color: cfg.c2
          }]
        });
        if (!def.draw) return cfg.c1;
        return patternFrom(tileCanvas(`bg|${cfg.type}|${cfg.c1}|${cfg.c2}`, def.T, (x, T) => def.draw(x, T, cfg.c1, cfg.c2)));
      }

      function bgThumb(type, c1, c2) {
        const def = BG_TYPES[type];
        const c = document.createElement('canvas');
        c.width = 120;
        c.height = 80;
        const x = c.getContext('2d');
        if (def.grad) {
          const g = x.createLinearGradient(0, 0, 0, 80);
          g.addColorStop(0, c1);
          g.addColorStop(1, c2);
          x.fillStyle = g;
        } else if (def.draw) {
          const t = tileCanvas(`bg|${type}|${c1}|${c2}`, def.T, (xx, T) => def.draw(xx, T, c1, c2));
          const p = x.createPattern(t, 'repeat');
          const m = new DOMMatrix([1 / RES, 0, 0, 1 / RES, 0, 0]);
          p.setTransform(m);
          x.fillStyle = p;
        } else x.fillStyle = c1;
        x.fillRect(0, 0, 120, 80);
        return c.toDataURL();
      }

      function tapeTile(color, pat) {
        return tileCanvas(`tape|${color}|${pat}`, 24, (x, T) => {
          x.fillStyle = color;
          x.fillRect(0, 0, T, T);
          x.fillStyle = 'rgba(255,255,255,0.55)';
          if (pat === 'stripe') {
            x.beginPath();
            x.moveTo(0, T);
            x.lineTo(T, 0);
            x.lineTo(T, T * 0.35);
            x.lineTo(T * 0.35, T);
            x.closePath();
            x.fill();
            x.beginPath();
            x.moveTo(0, 0);
            x.lineTo(T * 0.35, 0);
            x.lineTo(0, T * 0.35);
            x.closePath();
            x.fill();
          } else if (pat === 'dot') {
            x.beginPath();
            x.arc(T / 4, T / 4, 3, 0, 7);
            x.arc(T * 3 / 4, T * 3 / 4, 3, 0, 7);
            x.fill();
          } else if (pat === 'check') {
            x.fillStyle = 'rgba(255,255,255,0.4)';
            x.fillRect(0, 0, T / 2, T);
            x.fillRect(0, 0, T, T / 2);
          } else if (pat === 'heart') {
            heartPath(x, T / 2, T / 2 + 1, 6);
            x.fill();
          } else {
            x.fillStyle = 'rgba(255,255,255,0.18)';
            x.fillRect(0, 2, T, 3);
          }
        });
      }

      /* ---- 拡大・縮小 ---- */

      /* ---- 背景とフレーム ---- */
      function renderBackground() {

      const bgCount = () => canvas.getObjects().filter(o => o.isBgElement).length;
      /* ---- ロック ---- */
      function setLock(o, v) {
        v = !!v;
        o.set({
          locked: v,
          lockMovementX: v,
          lockMovementY: v,
          lockScalingX: v,
          lockScalingY: v,
          lockRotation: v,
          hasControls: !v,
          borderDashArray: v ? [6, 4] : null
        });
      }
      /* =========================================================
         ほぞん形式・れきし（もどす／すすむ）・自動ほぞん
         ========================================================= */
      function walkImages(o, fn) {
        if (!o) return;
        if (o.type === 'image') fn(o);
        (o.objects || []).forEach(c => walkImages(c, fn));
      }

      function serialize(forHistory) {
        const objects = userObjects().map(o => {
          const j = o.toObject(PROPS);
          if (forHistory) walkImages(j, im => {
            if (im.imgId && imageStore[im.imgId]) im.src = '@' + im.imgId;
          });
          return j;
        });
        return {
          app: APP_ID,
          v: VERSION,
          orient: state.orient,
          bg: {
            ...state.bg
          },
          frame: {
            ...state.frame
          },
          theme: state.theme,
          objects
        };
      }

      function deserialize(st, done) {
        H_.lock++;
        quietSel++;
        canvas.discardActiveObject();
        quietSel--;
        canvas.getObjects().slice().forEach(o => canvas.remove(o));
        const o2 = st.orient === 'landscape' ? 'landscape' : 'portrait';
        if (o2 !== state.orient) {
          state.orient = o2;
          W = SIZES[o2].w;
          H = SIZES[o2].h;
          if (fitMode) fitZoom();
          else setZoom(zoom);
        }
        state.bg = {
          ...BG_TYPES.grid,
          type: 'grid',
          ...(st.bg || {})
        };
        delete state.bg.n;
        delete state.bg.T;
        delete state.bg.draw;
        state.bg = {
          type: state.bg.type,
          c1: state.bg.c1,
          c2: state.bg.c2
        };
        state.frame = {
          type: 'none',
          c1: '#f43f5e',
          c2: '#38bdf8',
          ...(st.frame || {})
        };
        if (st.theme && THEMES[st.theme]) state.theme = st.theme;
        renderBackground();
        renderFrame();
        const objs = deep(st.objects || []).filter(o => o && typeof o === 'object' && o.type);
        const fixText = (o) => {
          if (['i-text', 'textbox', 'text'].includes(o.type)) {
            if (!Array.isArray(o.styles)) o.styles = [];
            if (typeof o.text !== 'string') o.text = String(o.text || '');
          }(o.objects || []).forEach(fixText);
        };
        objs.forEach(fixText);
        objs.forEach(o => walkImages(o, im => {
          if (typeof im.src !== 'string') return;
          if (im.src[0] === '@') im.src = imageStore[im.src.slice(1)] || '';
          else if (im.src.startsWith('data:')) {
            im.imgId = im.imgId || uid();
            imageStore[im.imgId] = im.src;
          }
        }));
        fabric.util.enlivenObjects(objs, (enl) => {
          enl.filter(Boolean).forEach(o => {
            if (o.selectable === false && !o.isBgElement) {
              o.selectable = true;
              o.evented = true;
              o.locked = true;
            }
            setLock(o, !!o.locked);
            canvas.add(o);
          });
          canvas.requestRenderAll();
          H_.lock--;
          refreshAllSmart(true);
          done && done();
        }, 'fabric');
      }
      const H_ = {
        stack: [],
        idx: -1,
        lock: 0,
        t: null,
        snap() {
          return JSON.stringify(serialize(true));
        },
        reset() {
          this.stack = [this.snap()];
          this.idx = 0;
          updateUndoUI();
        },
        commit() {
          clearTimeout(this.t);
          this.t = null;
          if (this.lock || restoring) return;
          const s = this.snap();
          if (s === this.stack[this.idx]) return;
          this.stack.splice(this.idx + 1);
          this.stack.push(s);
          if (this.stack.length > 60) this.stack.shift();
          this.idx = this.stack.length - 1;
          updateUndoUI();
          autosaveSoon();
          afterChange();
        },
        schedule(ms = 220) {
          if (this.lock || restoring) return;
          clearTimeout(this.t);
          this.t = setTimeout(() => this.commit(), ms);
        },
        flush() {
          if (this.t) this.commit();
        },
        undo() {
          if (restoring) return;
          this.flush();
          if (this.idx <= 0) return;
          this.idx--;
          this.restore();
        },
        redo() {
          if (restoring) return;
          this.flush();
          if (this.idx >= this.stack.length - 1) return;
          this.idx++;
          this.restore();
        },
        restore() {
          restoring = true;
          deserialize(JSON.parse(this.stack[this.idx]), () => {
            restoring = false;
            updateUndoUI();
            renderProps();
            buildFloatbar();
            autosaveSoon();
            afterChange();
            syncPanel();
          });
        }
      };

      /* =========================================================
         スマートパーツの組み立て直し

      function copyLook(a, b) {
        ['angle', 'scaleX', 'scaleY', 'flipX', 'flipY', 'opacity', 'visible', 'name', 'role'].forEach(k => {
          if (a[k] !== undefined) b.set(k, a[k]);

      function rebuild(old, data, opt = {}) {
        const def = SMART[old.kind];
        if (!def) return old;
        const idx = canvas.getObjects().indexOf(old);
        if (idx < 0) return old;
        const anchor = opt.anchor || 'top';
        const pt = anchor === 'center' ? old.getCenterPoint() : old.translateToOriginPoint(old.getCenterPoint(), 'center', 'top');
        const fresh = def.build(data, {
          old
        });
        copyLook(old, fresh);
        fresh.setPositionByOrigin(pt, 'center', anchor === 'center' ? 'center' : 'top');
        fresh.setCoords();
        const wasActive = canvas.getActiveObject() === old;
        H_.lock++;
        quietSel++;
        canvas.remove(old);
        canvas.insertAt(fresh, idx);
        if (wasActive) canvas.setActiveObject(fresh);
        quietSel--;
        H_.lock--;
        canvas.requestRenderAll();
        positionFloatbar();
        return fresh;

      let cascade = 0;

      function viewCenter() {
        const st = $('#stage').getBoundingClientRect();

        let x = (st.left + st.width / 2 - cr.left) / zoom,
          y = (st.top + st.height / 2 - cr.top) / zoom;

        y = clamp(y, H * 0.15, H * 0.85);

          const c = o.getCenterPoint();
          return Math.hypot(c.x - x, c.y - y) < 10;
        });
        if (near) {
          cascade = (cascade % 5) + 1;
          x += cascade * 26;
          y += cascade * 26;
        } else cascade = 0;
        return {
          x,
          y
        };
      }

      function placeStack(blocks, cx, y0, y1, maxGap = 64) {
        blocks = blocks.filter(Boolean);
        if (!blocks.length) return;
        let hs = blocks.map(b => b.getScaledHeight());
        let sum = hs.reduce((a, b) => a + b, 0);
        const avail = y1 - y0;
        const minGap = 18;
        if (sum + minGap * (blocks.length + 1) > avail) {
          const f = (avail - minGap * (blocks.length + 1)) / sum;
          blocks.forEach(b => b.set({
            scaleX: b.scaleX * f,
            scaleY: b.scaleY * f
          }));
          hs = blocks.map(b => b.getScaledHeight());
          sum = hs.reduce((a, b) => a + b, 0);
        }
        const gap = clamp((avail - sum) / (blocks.length + 1), minGap, maxGap);
        let y = y0 + Math.max(0, (avail - sum - gap * (blocks.length - 1)) / 2);
        blocks.forEach((b, i) => {
          b.setPositionByOrigin(new fabric.Point(cx, y), 'center', 'top');
          b.setCoords();
          y += hs[i] + gap;
        });
      }

        const w = o.getScaledWidth();
        if (w > maxW) {
          const f = maxW / w;
          o.set({
            scaleX: o.scaleX * f,
            scaleY: o.scaleY * f
          });
        }

        const add = (o) => {

        [title, goal, job, mem, table].forEach(add);
        const tb = title.getBoundingRect(true, true);

        const e1 = new fabric.Text(k.e, {

      function applyTheme(themeId) {
        const th = THEMES[themeId] || THEMES.pop;
        state.theme = themeId;
        H_.lock++;
        state.bg = {
          ...th.bg
        };
        state.frame = {
          ...th.frame
        };
        renderBackground();
        renderFrame();
        let bi = 0;
        canvas.getObjects().slice().forEach(o => {
          if (o.isBgElement || !o.kind || !SMART[o.kind]) return;
          const d = {
            ...o.data
          };
          switch (o.kind) {
            case 'text':
              if (d.role === 'title') Object.assign(d, pickStyle(th.title));
              else {
                d.font = th.body.font;
                if (!d.s1w && !d.s2w) d.color = th.onBg;
              }
              break;
            case 'box':
              Object.assign(d, {
                variant: th.box,
                color: th.accents[bi++ % th.accents.length],
                fill: th.boxFill,
                textColor: th.box === 'chalk' ? '#ffffff' : th.body.color,
                font: th.body.font,
                bullet: d.bullet === 'none' ? 'none' : th.bullet
              });
              o.shadow = th.box === 'chalk' ? null : (o.shadow || softShadow());
              break;
            case 'table':
              Object.assign(d, {
                color: th.accents[3],
                titleColor: th.onBg,
                font: th.body.font
              });
              break;
            case 'members':
              Object.assign(d, {
                color: th.accents[2],
                titleColor: th.onBg,
                font: th.body.font
              });
              break;
            case 'ribbon':
              Object.assign(d, {
                color: th.accents[1],
                textColor: lum(th.accents[1]) > 0.6 ? '#1f2937' : '#ffffff',
                font: th.body.font
              });
              break;
            case 'bubble':
              d.font = th.body.font;
              break;
            default:
              break;
          }
          rebuild(o, d, {
            anchor: 'center'
          });
        });
        H_.lock--;
        canvas.requestRenderAll();
        H_.commit();
        renderProps();
        toast(`「${th.n}」のデザインにしました`);

      function outlineShadow(st, k) {
        const w1 = (st.s1w || 0) * k,
          w2 = (st.s2w || 0) * k;
        const ring = (r, c) => {
          const out = [];
          for (let i = 0; i < 16; i++) {
            const a = i / 16 * Math.PI * 2;
            out.push(`${(Math.cos(a) * r).toFixed(1)}px ${(Math.sin(a) * r).toFixed(1)}px 0 ${c}`);
          }
          return out;
        };
        let list = [];
        if (w1 > 0) list = list.concat(ring(w1, st.s1c || '#fff'), ring(w1 * 0.5, st.s1c || '#fff'));
        if (w2 > 0) list = list.concat(ring(w1 + w2, st.s2c || '#333'));
        return list.join(',') || 'none';
      }

      function styleSample(st, text, px, k) {
        const sp = h('span', {
          style: {
            fontFamily: `"${st.font}", var(--font)`,
            fontWeight: st.bold ? '800' : '400',
            fontSize: px + 'px',
            textShadow: outlineShadow(st, k),
            lineHeight: '1'
          }
        }, text);
        if (st.colorMode === 'rainbow') {
          sp.textContent = '';
          graphemes(text).forEach((g, i) => sp.append(h('span', {
            style: {
              color: RAINBOW[i % RAINBOW.length]
            }
          }, g)));
        } else if (st.colorMode === 'grad') {
          sp.style.color = st.color;
          sp.style.background = `linear-gradient(${st.color}, ${st.color2})`;
          sp.style.webkitBackgroundClip = 'text';
          sp.style.backgroundClip = 'text';
          sp.style.webkitTextFillColor = 'transparent';
          sp.style.textShadow = 'none';
          sp.style.filter = st.s1w ? `drop-shadow(0 0 1px ${st.s1c}) drop-shadow(0 0 1px ${st.s2c || '#334155'})` : '';
        } else sp.style.color = st.color;
        return sp;
      }

      function swatches(value, onPick, opt = {}) {
        const colors = opt.colors || PALETTE;
        const wrap = h('div', {

        const isNone = (v) => !v || v === 'transparent' || v === 'none';
        if (opt.none) wrap.append(h('button', {

        }));
        colors.forEach(c => wrap.append(h('button', {
          class: 'sw' + (norm(value) === norm(c) ? ' sel' : ''),
          style: {
            background: c

          title: c,

          'data-c': c,
          onclick: () => {

        let v0 = isHex(value) ? value : '#ff6699';
        if (v0.length === 4) v0 = '#' + v0.slice(1).split('').map(x => x + x).join('');
        const inp = h('input', {

      function addRuby(ta, onChange) {
        const s = ta.selectionStart,

        const ins = `{${sel}|}`;
        ta.value = v.slice(0, s) + ins + v.slice(e);
        const pos = s + ins.length - 1;
        ta.focus();
        ta.setSelectionRange(pos, pos);
        onChange(ta.value, false);

      function hanamaruPath() {
        const R = 90,
          n = 10;
        let d = '';
        for (let i = 0; i < n; i++) {
          const a0 = i / n * 2 * Math.PI - Math.PI / 2,
            a1 = (i + 1) / n * 2 * Math.PI - Math.PI / 2,
            am = (a0 + a1) / 2;
          const p0 = [Math.cos(a0) * R, Math.sin(a0) * R],
            p1 = [Math.cos(a1) * R, Math.sin(a1) * R],
            c = [Math.cos(am) * R * 1.42, Math.sin(am) * R * 1.42];
          if (i === 0) d += `M ${p0[0].toFixed(1)} ${p0[1].toFixed(1)} `;
          d += `Q ${c[0].toFixed(1)} ${c[1].toFixed(1)} ${p1[0].toFixed(1)} ${p1[1].toFixed(1)} `;
        }
        d += 'Z ';
        const steps = 110,
          turns = 2.7;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps,
            a = t * turns * 2 * Math.PI - Math.PI / 2,
            r = 5 + t * 66;
          d += (i ? 'L ' : 'M ') + (Math.cos(a) * r).toFixed(1) + ' ' + (Math.sin(a) * r).toFixed(1) + ' ';
        }
        return d;
      }

      function applyBrush() {
        const b = state.brush;
        let br;
        if (b.type === 'spray') {
          br = new fabric.SprayBrush(canvas);
          br.width = b.width * 3;
          br.density = 22;
          br.dotWidth = Math.max(1, b.width / 5);
        } else if (b.type === 'dots') {
          br = new fabric.CircleBrush(canvas);
          br.width = Math.max(4, b.width * 1.4);
        } else {
          br = new fabric.PencilBrush(canvas);
          br.width = b.type === 'marker' ? b.width * 2.6 : b.width;
          br.decimate = 2;
          br.strokeLineCap = 'round';
          br.strokeLineJoin = 'round';
        }
        br.color = b.type === 'marker' ? rgba(b.color, 0.42) : b.color;
        canvas.freeDrawingBrush = br;
      }

      function readImageFile(file) {
        return new Promise((res, rej) => {
          if (!file || !/^image\//.test(file.type)) {
            rej(new Error('type'));
            return;
          }
          const fr = new FileReader();
          fr.onerror = () => rej(new Error('read'));
          fr.onload = () => {
            const img = new Image();
            img.onerror = () => rej(new Error('decode'));
            img.onload = () => {
              const max = 1200,
                s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
              if (s >= 1 && file.size < 900 * 1024) {
                res(fr.result);
                return;
              }
              const c = document.createElement('canvas');
              c.width = Math.round(img.naturalWidth * s);
              c.height = Math.round(img.naturalHeight * s);
              const x = c.getContext('2d');
              x.imageSmoothingQuality = 'high';
              x.drawImage(img, 0, 0, c.width, c.height);
              res(file.type === 'image/png' || file.type === 'image/gif' || file.type === 'image/webp' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.88));
            };
            img.src = fr.result;
          };

      function alignPage(mode) {
        const o = cur();
        if (!o) return;
        const r = o.getBoundingRect(true, true),
          m = 36;
        let dx = 0,
          dy = 0;
        if (mode === 'left') dx = m - r.left;
        if (mode === 'right') dx = W - m - (r.left + r.width);
        if (mode === 'centerH') dx = W / 2 - (r.left + r.width / 2);
        if (mode === 'top') dy = m - r.top;
        if (mode === 'bottom') dy = H - m - (r.top + r.height);
        if (mode === 'centerV') dy = H / 2 - (r.top + r.height / 2);
        o.set({
          left: o.left + dx,
          top: o.top + dy
        });
        o.setCoords();
        canvas.requestRenderAll();
        positionFloatbar();
        H_.schedule(0);
      }

      function alignSel(mode) {
        const objs = canvas.getActiveObjects();
        if (objs.length < 2) return;
        quietSel++;
        canvas.discardActiveObject();
        quietSel--;
        const rs = objs.map(o => o.getBoundingRect(true, true));
        const L = Math.min(...rs.map(r => r.left)),
          R = Math.max(...rs.map(r => r.left + r.width)),
          T = Math.min(...rs.map(r => r.top)),
          B = Math.max(...rs.map(r => r.top + r.height));
        objs.forEach((o, i) => {
          const r = rs[i];
          let dx = 0,
            dy = 0;
          if (mode === 'left') dx = L - r.left;
          if (mode === 'right') dx = R - (r.left + r.width);
          if (mode === 'centerH') dx = (L + R) / 2 - (r.left + r.width / 2);
          if (mode === 'top') dy = T - r.top;
          if (mode === 'bottom') dy = B - (r.top + r.height);
          if (mode === 'centerV') dy = (T + B) / 2 - (r.top + r.height / 2);
          o.set({
            left: o.left + dx,
            top: o.top + dy
          });
          o.setCoords();
        });
        reselect(objs);
        H_.schedule(0);
      }

      function distributeSel(axis) {
        const objs = canvas.getActiveObjects();
        if (objs.length < 3) {
          toast('3こ以上えらぶと、同じ間かくにならべられます');
          return;
        }
        quietSel++;
        canvas.discardActiveObject();
        quietSel--;
        const items = objs.map(o => ({
          o,
          r: o.getBoundingRect(true, true)
        }));
        const key = axis === 'h' ? 'left' : 'top',
          size = axis === 'h' ? 'width' : 'height';
        items.sort((a, b) => a.r[key] - b.r[key]);
        const start = items[0].r[key],
          end = items[items.length - 1].r[key] + items[items.length - 1].r[size];
        const total = items.reduce((a, b) => a + b.r[size], 0);
        const gap = (end - start - total) / (items.length - 1);
        let pos = start;
        items.forEach(it => {
          const d = pos - it.r[key];
          if (axis === 'h') it.o.set('left', it.o.left + d);
          else it.o.set('top', it.o.top + d);
          it.o.setCoords();
          pos += it.r[size] + gap;
        });
        reselect(objs);
        H_.schedule(0);
      }

      function snapObject(e) {
        const o = e.target;
        guides = [];
        if (!o || (e.e && e.e.altKey)) return;
        const th = 7 / zoom;
        const r = o.getBoundingRect(true, true);
        const cx = r.left + r.width / 2,
          cy = r.top + r.height / 2;
        const xs = [W / 2],
          ys = [H / 2];
        const inSel = (t) => o.type === 'activeSelection' && o.contains(t);
        canvas.getObjects().forEach(t => {
          if (t === o || t.isBgElement || t.visible === false || inSel(t)) return;
          const b = t.getBoundingRect(true, true);
          xs.push(b.left + b.width / 2);
          ys.push(b.top + b.height / 2);
        });
        let bx = null,
          by = null,
          best = th;
        xs.forEach(x => {
          const d = Math.abs(x - cx);
          if (d < best) {
            best = d;
            bx = x;
          }
        });
        best = th;
        ys.forEach(y => {
          const d = Math.abs(y - cy);
          if (d < best) {
            best = d;
            by = y;
          }

        if (bx !== null) {
          o.left += bx - cx;
          guides.push({
            x: bx

      /* =========================================================

      function hiResCanvas(longSide) {
        const mult = (longSide / Math.max(W, H)) / zoom;

        guides = [];
        dirty();
        let el;
        try {
          el = canvas.toCanvasElement(mult);

          fabric.perfLimitSizeTotal = saved[0];
          fabric.maxCacheSideLimit = saved[1];
          guides = g;
          dirty();
          canvas.requestRenderAll();
        }
        return el;
      }

      function exportDataURL(fmt, q, longSide) {

      function busy(msg, fn) {

              return;
            }
            downloadBlob(b, `${fileBase()}.${fmt === 'png' ? 'png' : 'jpg'}`);

            toast('PDFをほぞんしました');
          } catch (e) {
            toast('PDFをつくれませんでした。「印刷する」からPDFとしてほぞんできます', 'warn', 5000);
          }
        });
      }

      function printPoster() {
        busy('印刷のじゅんびをしています…', () => {
          const el = hiResCanvas(3508);
          el.toBlob(blob => {
            if (!blob) {
              toast('印刷できませんでした', 'warn');
              return;
            }
            const url = URL.createObjectURL(blob);
            const fr = document.createElement('iframe');
            fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
            document.body.append(fr);
            const portrait = state.orient === 'portrait';
            const doc = fr.contentWindow.document;
            doc.open();
            doc.write(`<!doctype html><html><head><title>${posterTitle()}</title><style>@page{size:${portrait ? 'portrait' : 'landscape'};margin:0}html,body{margin:0;padding:0;height:100%}body{display:flex;align-items:center;justify-content:center}img{max-width:100vw;max-height:100vh;width:auto;height:auto;display:block}</style></head><body><img id="p" src="${url}"></body></html>`);
            doc.close();
            const img = doc.getElementById('p');
            const go = () => {
              try {
                fr.contentWindow.focus();
                fr.contentWindow.print();
              } catch (e) {
                toast('印刷できませんでした。画像でほぞんしてから印刷してください', 'warn', 5000);
              }
              setTimeout(() => {
                fr.remove();
                URL.revokeObjectURL(url);
              }, 60000);
            };
            if (img.complete) go();
            else img.onload = go;
          }, 'image/jpeg', 0.95);
        });
      }

      function openExport() {
        canvas.discardActiveObject();
        canvas.requestRenderAll();
        const item = (icon, bg, label, sub, fn) => h('button', {
          class: 'export-item',
          onclick: () => {
            m.close();
            fn();
          }
        }, h('span', {
          class: 'ic',
          style: {
            background: bg
          }
        }, ic(icon)), h('span', {}, label, h('small', {}, sub)));
        const body = h('div', {
            class: 'export-list'
          },
          item('fas fa-print', '#fde2e1', '印刷する', 'A4・A3・B4など、どの紙でも同じ形で印刷できます（ポスターの形は紙と同じ比率です）', printPoster),
          item('fas fa-image', '#dbeefe', '画像でほぞん（PNG・きれい）', '大きく印刷してもきれいな高画質。掲示用におすすめ', () => exportImage('png')),
          item('fas fa-file-image', '#e7f6e7', '画像でほぞん（JPEG・かるい）', 'ファイルが小さく、メールやクラウドで共有しやすい', () => exportImage('jpeg')),
          item('fas fa-file-pdf', '#fff1c2', 'PDFでほぞん（A4）', 'プリンターのある別のパソコンで印刷するときに便利', exportPDF),
          item('fas fa-floppy-disk', '#f3e8ff', 'データをほぞん', 'あとで「ひらく」から続きを作れるファイルです', saveProject)
        );
        const m = modal({
          title: '印刷・画像にする',
          body
        });
      }
      /* =========================================================
         データのほぞん・よみこみ
         ========================================================= */
      function saveProject() {
        H_.flush();
        const json = JSON.stringify(serialize(false));
        downloadBlob(new Blob([json], {
          type: 'application/json'
        }), `${fileBase()}.json`);
        toast('データをほぞんしました。「ひらく」から続きを作れます', '', 3200);
      }

      function loadProjectFile(file) {
        const fr = new FileReader();
        fr.onload = () => {
          let data;
          try {
            data = JSON.parse(fr.result);
          } catch (e) {
            toast('このファイルはひらけません', 'warn');
            return;
          }
          loadProjectData(data);
        };
        fr.readAsText(file);
      }

      function loadProjectData(data, opt = {}) {
        let st;
        if (data && data.app === APP_ID && Array.isArray(data.objects)) st = data;
        else if (data && Array.isArray(data.objects)) {
          const bgColor = typeof data.background === 'string' && data.background ? data.background : null;
          st = {
            orient: (data.width || 0) > (data.height || 1) ? 'landscape' : 'portrait',
            bg: bgColor ? {
              type: 'solid',
              c1: bgColor,
              c2: bgColor
            } : {
              type: 'grid',
              c1: '#ffffff',
              c2: '#cfe0f3'
            },
            frame: {
              type: 'none',
              c1: '#f43f5e',
              c2: '#38bdf8'
            },
            objects: data.objects.filter(o => !o.isBgElement)
          };
        } else {
          toast('このファイルはひらけません', 'warn');
          return;
        }
        restoring = true;
        deserialize(st, () => {
          restoring = false;
          if (opt.reset) H_.reset();
          else H_.commit();
          renderProps();
          buildFloatbar();
          syncPanel();
          afterChange();
          if (fitMode) fitZoom();
          toast(opt.reset ? 'つづきから作れます' : 'データをひらきました');
        });
      }

      function newPoster() {
        const go = () => {
          H_.lock++;
          quietSel++;
          canvas.discardActiveObject();
          quietSel--;
          userObjects().forEach(o => canvas.remove(o));
          state.bg = {
            type: 'grid',
            c1: '#ffffff',
            c2: '#cfe0f3'
          };
          state.frame = {
            type: 'none',
            c1: '#f43f5e',
            c2: '#38bdf8'
          };
          renderBackground();
          renderFrame();
          H_.lock--;
          canvas.requestRenderAll();
          H_.commit();
          renderProps();
          syncPanel();
          afterChange();
          state.tab = 'template';
          renderPanel();
          openPanel();
        };
        if (userObjects().length) ask('いまのポスターをけして、まっさらにしますか？（「もどす」で元にもどせます）', 'まっさらにする', 'red').then(ok => ok && go());
        else go();
      }
      /* =========================================================
         ようこそ・つかいかた
         ========================================================= */
      function showWelcome(saved) {
        const body = h('div');
        body.append(h('p', {
          class: 'lead',
          style: {
            fontSize: '14px'
          }
        }, '係のポスターを、かんたんに作って印刷できます。どこからはじめますか？'));
        const grid = h('div', {
          class: 'welcome-grid'
        });
        let m, chosen = false;
        const pick = (fn) => () => {
          chosen = true;
          m.close();
          fn();
        };
        if (saved) {
          let thumb = null;
          try {
            thumb = localStorage.getItem(LS_THUMB);
          } catch (e) {
            /* noop */ }
          const d = new Date(saved.t);
          grid.append(h('button', {
              class: 'welcome-card main',
              onclick: pick(() => loadProjectData(saved.state, {
                reset: true
              }))
            },
            thumb ? h('img', {
              src: thumb,
              alt: ''
            }) : ic('fas fa-clock-rotate-left'),
            'つづきから作る', h('small', {}, `${d.getMonth() + 1}月${d.getDate()}日 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} のポスター`)));
        }
        grid.append(
          h('button', {
            class: 'welcome-card' + (saved ? '' : ' main'),
            onclick: pick(() => {
              state.tab = 'template';
              renderPanel();
              openPanel();
            })
          }, ic('fas fa-wand-magic-sparkles'), 'テンプレートから', h('small', {}, '係をえらぶだけで、ポスターのできあがり')),
          h('button', {
            class: 'welcome-card',
            onclick: pick(() => newPosterSilent())
          }, ic('far fa-file'), 'まっさらから', h('small', {}, '白い紙から自由に作る')),
          h('button', {
            class: 'welcome-card',
            onclick: pick(() => $('#fileJson').click())
          }, ic('fas fa-folder-open'), 'データをひらく', h('small', {}, '前にほぞんしたファイル（.json）'))
        );
        body.append(grid);
        m = modal({
          title: '係ポスターメーカーへようこそ',
          body,
          wide: true,
          onClose: () => {
            if (!chosen && saved) loadProjectData(saved.state, {
              reset: true
            });
          }
        });
      }

      function newPosterSilent() {
        H_.lock++;
        userObjects().forEach(o => canvas.remove(o));
        state.bg = {
          type: 'grid',
          c1: '#ffffff',
          c2: '#cfe0f3'
        };
        state.frame = {
          type: 'none',
          c1: '#f43f5e',
          c2: '#38bdf8'
        };
        renderBackground();
        renderFrame();
        H_.lock--;
        canvas.requestRenderAll();
        H_.commit();
        renderProps();
        afterChange();
        state.tab = 'text';
        renderPanel();
        openPanel();
      }

      function showHelp() {
        const kbd = (k) => h('kbd', {}, k);
        const row = (keys, desc) => h('tr', {}, h('td', {}, ...keys.flatMap((k, i) => i ? [' + ', kbd(k)] : [kbd(k)])), h('td', {}, desc));
        const body = h('div', {
            class: 'help'
          },
          h('h3', {}, 'かんたん3ステップ'),
          h('ol', {},
            h('li', {}, '左の「テンプレ」で、デザインと係をえらびます。'),
            h('li', {}, 'ポスターの文字をクリック（タップ）して、右のらんで書きかえます。'),
            h('li', {}, '右上の「印刷・画像にする」で印刷します。')),
          h('h3', {}, 'ふりがなをつける'),
          h('p', {}, '文字のらんで漢字をなぞってえらび、「ふりがな」ボタンをおします。', h('b', {}, '{黒板|こくばん}'), ' のようになるので、「|」と「}」のあいだによみがなを書きます。'),
          h('h3', {}, 'ほぞんについて'),
          h('p', {}, '作ったポスターは、このパソコン（タブレット）のブラウザに自動でほぞんされます。別の端末で続きを作るときや、きちんと残したいときは「ほぞん」でデータファイルにしてください。'),
          h('h3', {}, '便利なワザ'),
          h('ul', {},
            h('li', {}, 'ダブルクリック（ダブルタップ）で、すぐに書きかえられます。'),
            h('li', {}, '動かすと、まん中や他の部品とそろう位置でピタッと止まります（Altキーを押しながらだと止まりません）。'),
            h('li', {}, '写真は、ドラッグ＆ドロップやコピー＆はりつけでも入れられます。'),
            h('li', {}, '背景や動かしたくない部品は「ロック」すると安心です。')),
          h('h3', {}, 'ショートカットキー'),
          h('table', {},
            row(['Ctrl', 'Z'], 'もとにもどす'), row(['Ctrl', 'Y'], 'やりなおす'),
            row(['Ctrl', 'C'], 'コピー'), row(['Ctrl', 'V'], 'はりつけ'), row(['Ctrl', 'D'], 'その場でコピー'),
            row(['Delete'], 'けす'), row(['Enter'], '文字を書きかえる'), row(['矢印'], '少しずつ動かす（Shiftで大きく）'),
            row(['Ctrl', 'G'], 'グループにする／かいじょ'), row(['Ctrl', 'S'], 'データをほぞん'), row(['Ctrl', 'P'], '印刷'),
            row(['Ctrl', '0'], '画面に合わせる'))
        );
        modal({
          title: 'つかいかた',
          body,
          wide: true
        });
      }

      function afterChange() {
        $('#emptyHint').hidden = userObjects().length > 0 || state.drawing;
        if (!cur() && !quietSel && !restoring) renderProps();
      }
      /* =========================================================
         ボタンの登録
         ========================================================= */
      $$('.rail-btn').forEach(b => b.addEventListener('click', () => openTab(b.dataset.tab)));
      $('#panelClose').addEventListener('click', closePanel);
      $('#propsClose').addEventListener('click', () => {
        canvas.discardActiveObject();
        canvas.requestRenderAll();
      });
      $('#btnUndo').addEventListener('click', () => H_.undo());
      $('#btnRedo').addEventListener('click', () => H_.redo());
      $('#btnZoomIn').addEventListener('click', () => setZoom(zoom * 1.2));
      $('#btnZoomOut').addEventListener('click', () => setZoom(zoom / 1.2));
      $('#btnZoomFit').addEventListener('click', fitZoom);
      $('#btnNew').addEventListener('click', newPoster);
      $('#btnOpen').addEventListener('click', () => $('#fileJson').click());
      $('#btnSave').addEventListener('click', saveProject);
      $('#btnHelp').addEventListener('click', showHelp);
      $('#btnExport').addEventListener('click', openExport);
      $('#btnDrawEnd').addEventListener('click', () => setDrawing(false));
      $('#fileImage').addEventListener('change', (e) => {
        const f = e.target.files[0];
        e.target.value = '';
        if (f) addPhotoFromFile(f);
        else replacingPhoto = null;
      });
      $('#fileJson').addEventListener('change', (e) => {
        const f = e.target.files[0];
        e.target.value = '';
        if (f) loadProjectFile(f);
      });
      /* =========================================================
         はじまり
         ========================================================= */
      function init() {
        renderBackground();
        renderFrame();
        fitZoom();
        const saved = readAutosave();
        if (isMobile()) {
          document.body.classList.remove('panel-open');
        } else document.body.classList.remove('panel-collapsed');
        state.tab = 'template';
        renderPanel();
        syncRail();
        if (!saved) {
          buildPoster(KAKARI[0], 'pop', state.tplOpts, true);
          H_.reset();
        } else {
          H_.reset();
        }
        renderProps();
        afterChange();
        showWelcome(saved);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
          scheduleFontRefresh();
          refitSoon();
        });
        setTimeout(fitZoom, 300);
      }
      window.__poster = {
        canvas,
        state,
        SMART,
        H: H_,
        serialize,
        buildPoster,
        applyTheme,
        KAKARI,
        THEMES,
        rebuild,
        cur,
        exportDataURL,
        hiResCanvas,
        loadProjectData
      };
      init();
    })();
  </script>
</body>

  <!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クラス係ポスターメーカー ULTIMATE v2.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=M+PLUS+Rounded+1c:wght@500;700;900&family=Yusei+Magic&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <style>
    :root {
      --primary: #4e8cff;
      --primary-hover: #3b6bce;
      --secondary: #ff8fa3;
      --surface: #ffffff;
      --bg-app: #f0f4f8;
      --border: #cbd5e1;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --font-ui: 'M PLUS Rounded 1c', sans-serif;
      --radius: 10px;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-ui);
      background-color: var(--bg-app);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .sidebar {
      background: var(--surface);
      display: flex;
      flex-direction: column;
      z-index: 10;
      flex-shrink: 0;
    }

    .left-sidebar {
      width: 340px;
      border-right: 1px solid var(--border);
      box-shadow: 2px 0 20px rgba(0, 0, 0, 0.04);
    }

    .right-sidebar {
      width: 340px;
      border-left: 1px solid var(--border);
      box-shadow: -2px 0 20px rgba(0, 0, 0, 0.04);
    }

    .sidebar-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      text-align: center;
      background: linear-gradient(135deg, #f8fafc, #f1f5f9);
    }

    .sidebar-header h1 {
      font-size: 1.2rem;
      color: var(--text-main);
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .scroll-container {
      flex: 1;
      overflow-y: auto;
      padding: 15px 20px;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 900;
      color: #334155;
      margin-bottom: 12px;
      margin-top: 25px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 5px;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    .magic-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);
      transition: 0.2s;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .magic-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(245, 158, 11, 0.4);
    }

    .bg-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .bg-btn {
      height: 60px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: 0.2s;
      position: relative;
      overflow: hidden;
    }

    .bg-btn:hover {
      border-color: var(--primary);
      transform: scale(1.05);
      z-index: 2;
      box-shadow: var(--shadow);
    }

    .bg-btn span {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.8);
      text-align: center;
      font-size: 0.65rem;
      font-weight: bold;
      color: #333;
      padding: 2px 0;
    }

    .action-btn {
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 8px;
      background: var(--surface);
      border: 2px solid #e2e8f0;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.2s;
    }

    .action-btn:hover {
      border-color: var(--primary);
      background: #f0f7ff;
      color: var(--primary);
    }

    .action-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .grid-2col .action-btn {
      margin-bottom: 0;
      justify-content: center;
      padding: 8px;
      font-size: 0.85rem;
    }

    .grid-3col {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }

    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .top-bar {
      height: 55px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 8px;
      overflow-x: auto;
      flex-shrink: 0;
    }

    .icon-btn {
      background: none;
      border: 1px solid #e2e8f0;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 6px;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .icon-btn:hover {
      background: #f8fafc;
      color: var(--text-main);
      border-color: #cbd5e1;
    }

    .icon-btn.danger:hover {
      background: #fef2f2;
      color: #ef4444;
      border-color: #fca5a5;
    }

    .notice {
      margin-left: auto;
      font-size: 0.85rem;
      color: #0369a1;
      font-weight: bold;
      background: #e0f2fe;
      padding: 6px 14px;
      border-radius: 20px;
      white-space: nowrap;
      border: 1px solid #bae6fd;
    }

    .canvas-scroll-area {
      flex: 1;
      overflow: auto;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 20px 20px;
    }

    #scaler-container {
      position: relative;
      transition: width 0.1s, height 0.1s;
    }

    .canvas-wrapper {
      background: white;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      border-radius: 2px;
      transform-origin: top left;
      position: absolute;
      top: 0;
      left: 0;
    }

    .empty-state {
      text-align: center;
      color: var(--text-sub);
      margin-top: 50px;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .empty-state i {
      font-size: 3rem;
      color: #e2e8f0;
      margin-bottom: 15px;
      display: block;
    }

    .prop-group {
      margin-bottom: 18px;
      background: #f8fafc;
      padding: 15px;
      border-radius: var(--radius);
      border: 1px solid #e2e8f0;
    }

    .prop-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-main);
      margin-bottom: 10px;
      font-weight: 900;
    }

    .prop-control {
      width: 100%;
      padding: 10px;
      border: 2px solid #e2e8f0;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text-main);
      background: #fff;
      transition: 0.2s;
    }

    .prop-control:focus {
      outline: none;
      border-color: var(--primary);
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      cursor: pointer;
      padding: 0;
      background: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 2px solid #cbd5e1;
      border-radius: 8px;
    }

    .range-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--primary);
    }

    .range-val {
      font-size: 0.85rem;
      font-weight: bold;
      width: 40px;
      text-align: right;
    }

    .toggle-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .toggle-wrap label {
      margin-bottom: 0;
    }
  </style>
</head>

<body>

  <aside class="sidebar left-sidebar">
    <div class="sidebar-header">
      <h1><i class="fas fa-rocket"></i> 係ポスターメーカー ULTIMATE</h1>
    </div>

    <div class="scroll-container">
      <div class="section-title"><i class="fas fa-wand-magic-sparkles"></i> 魔法のテンプレート</div>
      <button class="magic-btn" id="btnMagicPop"><i class="fas fa-star"></i> ポップ＆カラフル 自動作成！</button>

      <div class="section-title"><i class="fas fa-image"></i> 背景デザイン</div>
      <div class="bg-grid">
        <button class="bg-btn" id="bgGrid" style="background-color: #f0f8ff; border-top: 8px solid #FFF6A0;"><span>マス目</span></button>
        <button class="bg-btn" id="bgBlackboard" style="background-color: #1e4a3b; border: 4px solid #8b5a2b;"><span>黒板</span></button>
        <button class="bg-btn" id="bgCork" style="background-color: #d2b48c; border: 4px solid #a0522d;"><span>コルク</span></button>
        <button class="bg-btn" id="bgDot" style="background-color: #fff0f5; background-image: radial-gradient(#ffb6c1 20%, transparent 20%); background-size: 15px 15px;"><span>水玉(ピンク)</span></button>
        <button class="bg-btn" id="bgStripe" style="background: repeating-linear-gradient(45deg, #e0f2fe, #e0f2fe 10px, #ffffff 10px, #ffffff 20px);"><span>ストライプ</span></button>
        <button class="bg-btn" id="bgWhite" style="background-color: #ffffff;"><span>無地(白)</span></button>
      </div>

      <div class="section-title"><i class="fas fa-shapes"></i> 基本パーツ</div>
      <button class="action-btn" id="btnAddTitle"><i class="fas fa-heading" style="color: #ef4444;"></i> 目立つタイトル枠</button>
      <button class="action-btn" id="btnAddJobDesc"><i class="fas fa-clipboard-list" style="color: #f59e0b;"></i> 仕事内容の枠</button>
      <button class="action-btn" id="btnAddTable"><i class="fas fa-table" style="color: #10b981;"></i> 当番表をつくる (自動生成)</button>

      <div class="section-title"><i class="fas fa-pen-nib"></i> 自由にかきこむ</div>
      <div class="grid-2col">
        <button class="action-btn" id="btnAddText"><i class="fas fa-font" style="color: #6366f1;"></i> 文字</button>
        <button class="action-btn" id="btnAddMember"><i class="fas fa-camera" style="color: #3b82f6;"></i> 写真<input type="file" id="fileInput" accept="image/*" style="display: none;"></button>
      </div>
      <button class="action-btn" id="btnToggleDraw"><i class="fas fa-pencil-alt" style="color: #8b5cf6;"></i> お絵かきモード (手書き)</button>

      <div class="section-title"><i class="fas fa-star"></i> かざり（NEW!）</div>
      <div class="grid-2col">
        <button class="action-btn" id="btnAddTape"><i class="fas fa-tape" style="color: #f43f5e;"></i> マステ</button>
        <button class="action-btn" id="btnAddRibbon"><i class="fas fa-ribbon" style="color: #eab308;"></i> リボン</button>
        <button class="action-btn" id="btnAddStar"><i class="fas fa-star" style="color: #fbbf24;"></i> 星</button>
        <button class="action-btn" id="btnAddHanamaru"><i class="far fa-circle" style="color: #ef4444;"></i> はなまる</button>
      </div>

      <div class="section-title" style="margin-top:30px;"><i class="fas fa-folder-open"></i> データと保存</div>
      <button class="action-btn" id="btnExport" style="background:#10b981; color:white; border-color:#059669; justify-content:center; font-size:1rem;"><i class="fas fa-print"></i> 印刷用に保存 (JPEG)</button>
      <div class="grid-2col" style="margin-top: 8px;">
        <button class="action-btn" id="btnSaveProject"><i class="fas fa-download"></i> データ保存</button>
        <button class="action-btn" id="btnLoadProject"><i class="fas fa-upload"></i> 読込<input type="file" id="loadJsonInput" accept=".json" style="display: none;"></button>
      </div>
    </div>
  </aside>

  <main class="workspace">
    <div class="top-bar">
      <button class="icon-btn" id="btnUndo" title="元に戻す"><i class="fas fa-undo"></i></button>
      <button class="icon-btn" id="btnRedo" title="やり直す"><i class="fas fa-redo"></i></button>
      <div style="width: 1px; height: 20px; background: var(--border); margin: 0 5px;"></div>

      <button class="icon-btn" id="btnGroup" style="display: none;"><i class="fas fa-object-group"></i> <span>グループ化</span></button>
      <button class="icon-btn" id="btnClone"><i class="fas fa-copy"></i> コピー</button>
      <button class="icon-btn" id="btnFront"><i class="fas fa-layer-group"></i> 前へ</button>
      <button class="icon-btn" id="btnBack"><i class="fas fa-layer-group" style="transform: rotate(180deg);"></i> 後ろ</button>
      <button class="icon-btn danger" id="btnDelete"><i class="fas fa-trash"></i> 削除</button>

      <div style="width: 1px; height: 20px; background: var(--border); margin: 0 5px;"></div>
      <button class="icon-btn" id="btnUnlockAll"><i class="fas fa-unlock"></i> 全ロック解除</button>

      <span class="notice"><i class="fas fa-lightbulb"></i> 文字や表はダブルクリックで編集！</span>
    </div>

    <div class="canvas-scroll-area">
      <div id="scaler-container">
        <div class="canvas-wrapper" id="wrapper">
          <canvas id="mainCanvas"></canvas>
        </div>
      </div>
    </div>
  </main>

  <aside class="sidebar right-sidebar">
    <div class="sidebar-header">
      <h1><i class="fas fa-sliders-h"></i> プロパティパネル</h1>
    </div>
    <div class="scroll-container">

      <div id="noSelectionMsg" class="empty-state">
        <i class="fas fa-mouse-pointer"></i>
        ポスター上の文字や図形を<br>クリックして選択すると、<br>ここで細かく編集できます。
      </div>

      <div id="drawProps" style="display: none;">
        <div class="prop-group" style="border-color: #8b5cf6; background: #f5f3ff;">
          <label style="color: #6d28d9;"><i class="fas fa-pencil-alt"></i> ペンの設定</label>
          <div class="color-picker-wrapper" style="margin-bottom: 15px;">
            <input type="color" id="brushColor" value="#ef4444">
            <span style="font-size: 0.85rem;" id="brushColorHex">#EF4444</span>
          </div>
          <label>ペンの太さ</label>
          <div class="range-wrapper">
            <input type="range" id="brushWidth" min="1" max="50" value="8">
            <span id="brushWidthVal" class="range-val">8</span>
          </div>
        </div>
      </div>

      <div id="propertyPanel" style="display: none;">
        <div class="prop-group">
          <label><i class="fas fa-align-center"></i> 用紙に合わせる</label>
          <div class="grid-3col" style="margin-bottom:0;">
            <button class="icon-btn" id="btnAlignLeft" style="justify-content:center;"><i class="fas fa-align-left"></i></button>
            <button class="icon-btn" id="btnAlignCenter" style="justify-content:center;"><i class="fas fa-align-center"></i></button>
            <button class="icon-btn" id="btnAlignRight" style="justify-content:center;"><i class="fas fa-align-right"></i></button>
          </div>
        </div>

        <!-- テキスト設定 -->
        <div id="textProps" style="display: none;">
          <div class="prop-group">
            <label>フォント（書体）</label>
            <select id="fontFamily" class="prop-control">
              <option value="M PLUS Rounded 1c">丸ゴシック (やさしい)</option>
              <option value="Yusei Magic">油性マジック (手書き風)</option>
              <option value="Klee One">えんぴつ (教科書体風)</option>
              <option value="sans-serif">ゴシック体 (標準)</option>
            </select>
          </div>

          <div class="prop-group">
            <label>文字の大きさ</label>
            <div class="range-wrapper">
              <input type="range" id="fontSize" min="12" max="200" value="24">
              <span id="fontSizeVal" class="range-val">24</span>
            </div>
          </div>

          <div class="prop-group">
            <label>文字の色</label>
            <div class="color-picker-wrapper">
              <input type="color" id="textColor" value="#000000">
              <span style="font-size: 0.85rem;" id="textColorHex">#000000</span>
            </div>
          </div>

          <!-- NEW: 袋文字設定 -->
          <div class="prop-group" style="background: #fffbeb; border-color: #fde68a;">
            <label style="color: #d97706;"><i class="fas fa-font"></i> 袋文字（フチどり）</label>
            <div class="color-picker-wrapper" style="margin-bottom: 10px;">
              <input type="color" id="textStrokeColor" value="#ffffff">
              <button id="btnTextStrokeNone" class="icon-btn">フチなし</button>
            </div>
            <label>フチの太さ</label>
            <div class="range-wrapper">
              <input type="range" id="textStrokeWidth" min="0" max="30" value="0">
              <span id="textStrokeWidthVal" class="range-val">0</span>
            </div>
          </div>
        </div>

        <!-- 図形設定 -->
        <div id="shapeProps" style="display: none;">
          <div class="prop-group">
            <label>図形の色</label>
            <div class="color-picker-wrapper">
              <input type="color" id="fillColor" value="#ffffff">
              <button id="btnTransparentFill" class="icon-btn">透明</button>
            </div>
          </div>
          <div class="prop-group">
            <label>わく線の色</label>
            <div class="color-picker-wrapper">
              <input type="color" id="strokeColor" value="#000000">
              <button id="btnTransparentStroke" class="icon-btn">なし</button>
            </div>
          </div>
          <div class="prop-group">
            <label>わく線の太さ</label>
            <div class="range-wrapper">
              <input type="range" id="strokeWidth" min="0" max="30" value="2">
              <span id="strokeWidthVal" class="range-val">2</span>
            </div>
          </div>
        </div>

        <div class="prop-group">
          <div class="toggle-wrap" style="margin-bottom: 10px;">
            <label><i class="fas fa-eye-slash"></i> すける (透明度)</label>
          </div>
          <div class="range-wrapper" style="margin-bottom: 15px;">
            <input type="range" id="opacity" min="0" max="100" value="100">
            <span id="opacityVal" class="range-val">100%</span>
          </div>

          <div class="toggle-wrap" style="margin-bottom: 15px; border-top: 1px dashed #cbd5e1; padding-top: 15px;">
            <label><i class="fas fa-clone"></i> 影をつける</label>
            <input type="checkbox" id="toggleShadow" style="width: 18px; height: 18px; cursor: pointer;">
          </div>

          <div style="border-top: 1px dashed #cbd5e1; padding-top: 15px;">
            <button class="action-btn" id="btnLockObj" style="margin: 0; justify-content: center; background: #fff1f2; color: #e11d48; border-color: #fecdd3;">
              <i class="fas fa-lock"></i> 位置をロックする
            </button>
          </div>
        </div>

      </div>
    </div>
  </aside>

  <script>
    fabric.Object.prototype.set({
      transparentCorners: false,
      cornerColor: '#3b82f6',
      cornerStrokeColor: '#ffffff',
      borderColor: '#3b82f6',
      cornerSize: 12,
      padding: 8,
      cornerStyle: 'circle'
    });
    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 1131;
    const canvas = new fabric.Canvas('mainCanvas', {
      width: CANVAS_WIDTH,
      height: CANVAS_HEIGHT,
      backgroundColor: '#ffffff',
      preserveObjectStacking: true,
      selection: true
    });

    function scaleCanvasToFit() {
      const wrapper = document.getElementById('wrapper');
      const scaler = document.getElementById('scaler-container');
      const container = document.querySelector('.canvas-scroll-area');
      const padding = 60;
      const scaleX = (container.clientWidth - padding) / CANVAS_WIDTH;
      const scaleY = (container.clientHeight - padding) / CANVAS_HEIGHT;
      const scale = Math.min(scaleX, scaleY, 1.2);
      wrapper.style.transform = `scale(${scale})`;
      scaler.style.width = `${CANVAS_WIDTH * scale}px`;
      scaler.style.height = `${CANVAS_HEIGHT * scale}px`;
    }
    window.addEventListener('resize', scaleCanvasToFit);
    setTimeout(scaleCanvasToFit, 100);
    let stateHistory = [];
    let historyIndex = -1;
    let isHistoryAction = false;
    const extraProps = ['isBgElement', 'lockMovementX', 'lockMovementY', 'lockRotation', 'lockScalingX', 'lockScalingY', 'hasControls', 'selectable', 'id'];

    function saveState() {
      if (isHistoryAction || canvas.isDrawingMode) return;
      stateHistory = stateHistory.slice(0, historyIndex + 1);
      stateHistory.push(JSON.stringify(canvas.toJSON(extraProps)));
      historyIndex++;
      if (stateHistory.length > 30) {

        canvas.requestRenderAll();
        const pointer = canvas.getPointer(e.e);
        const objects = sel.getObjects();
        let clickedObj = null;
        for (let i = objects.length - 1; i >= 0; i--) {

    function updatePropsContext() {
      const obj = getAct();
      const noSel = document.getElementById('noSelectionMsg');
      const propPanel = document.getElementById('propertyPanel');
      const drawProps = document.getElementById('drawProps');
      if (canvas.isDrawingMode) {
        noSel.style.display = 'none';
        propPanel.style.display = 'none';
        drawProps.style.display = 'block';
        return;
      } else {
        drawProps.style.display = 'none';
      }
      if (!obj) {
        propPanel.style.display = 'none';
        noSel.style.display = 'block';
        btnGroup.style.display = 'none';
        return;
      }
      noSel.style.display = 'none';
      propPanel.style.display = 'block';
      if (obj.type === 'activeSelection') {
        btnGroup.style.display = 'flex';
        btnGroup.querySelector('span').innerText = 'グループ化';
      } else if (obj.type === 'group') {
        btnGroup.style.display = 'flex';
        btnGroup.querySelector('span').innerText = 'グループ解除';
      } else {
        btnGroup.style.display = 'none';
      }
      const isText = obj.type === 'i-text' || obj.type === 'textbox';
      if (isText) {
        document.getElementById('textProps').style.display = 'block';
        document.getElementById('fontFamily').value = obj.fontFamily || 'M PLUS Rounded 1c';
        document.getElementById('fontSize').value = obj.fontSize || 24;
        document.getElementById('fontSizeVal').innerText = obj.fontSize;
        let color = obj.fill || '#000000';
        if (color === 'transparent') color = '#ffffff';
        document.getElementById('textColor').value = color;
        document.getElementById('textColorHex').innerText = color.toUpperCase();
        // 袋文字
        let strokeColor = obj.stroke || '#ffffff';
        document.getElementById('textStrokeColor').value = strokeColor === 'transparent' ? '#ffffff' : strokeColor;
        document.getElementById('textStrokeWidth').value = obj.strokeWidth || 0;
        document.getElementById('textStrokeWidthVal').innerText = obj.strokeWidth || 0;
      } else {
        document.getElementById('textProps').style.display = 'none';
      }
      if (obj.type !== 'group' && obj.type !== 'activeSelection') {
        document.getElementById('shapeProps').style.display = 'block';
        let fill = obj.fill || '#ffffff';
        let stroke = obj.stroke || '#000000';
        document.getElementById('fillColor').value = fill === 'transparent' ? '#ffffff' : fill;
        document.getElementById('strokeColor').value = stroke === 'transparent' ? '#000000' : stroke;
        document.getElementById('strokeWidth').value = obj.strokeWidth || 0;
        document.getElementById('strokeWidthVal').innerText = obj.strokeWidth || 0;
      } else {
        document.getElementById('shapeProps').style.display = 'none';
      }
      const op = Math.round((obj.opacity !== undefined ? obj.opacity : 1) * 100);
      document.getElementById('opacity').value = op;
      document.getElementById('opacityVal').innerText = op + '%';
      document.getElementById('toggleShadow').checked = !!obj.shadow;
    }
    const applyProp = (prop, val, extra = {}) => {
      const obj = getAct();
      if (!obj) return;
      if (obj.type === 'activeSelection') obj.forEachObject(o => o.set({
        [prop]: val,
        ...extra
      }));
      else obj.set({
        [prop]: val,
        ...extra
      });

    function createTableGroup(rowCount) {
      const cols = 5;
      const rows = rowCount + 1;
      const cellW = 120;
      const cellH = 60;
      const totalW = cols * cellW;
      const totalH = rows * cellH;
      const startX = -totalW / 2;
      const startY = -totalH / 2;
      const items = [];
      items.push(new fabric.Rect({
        width: totalW,
        height: totalH,
        fill: '#ffffff',
        stroke: '#cbd5e1',
        strokeWidth: 3,
        rx: 10,
        ry: 10,
        left: startX,
        top: startY
      }));
      items.push(new fabric.Rect({
        width: totalW,
        height: cellH,
        fill: '#e0f2fe',
        rx: 10,
        ry: 10,
        left: startX,
        top: startY
      }));
      for (let i = 1; i < cols; i++) items.push(new fabric.Line([startX + i * cellW, startY, startX + i * cellW, startY + totalH], {
        stroke: '#cbd5e1',
        strokeWidth: 2
      }));
      for (let j = 1; j < rows; j++) items.push(new fabric.Line([startX, startY + j * cellH, startX + totalW, startY + j * cellH], {
        stroke: '#cbd5e1',
        strokeWidth: 2
      }));
      ['月', '火', '水', '木', '金'].forEach((day, i) => {
        items.push(new fabric.IText(day, {
          fontFamily: 'M PLUS Rounded 1c',
          fontSize: 26,
          fontWeight: 'bold',
          fill: '#0369a1',
          left: startX + i * cellW + cellW / 2,
          top: startY + cellH / 2,
          originX: 'center',
          originY: 'center'
        }));
      });
      for (let r = 1; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          items.push(new fabric.IText('名前', {
            fontFamily: 'Klee One',
            fontSize: 24,
            fill: '#64748b',
            left: startX + c * cellW + cellW / 2,
            top: startY + r * cellH + cellH / 2,
            originX: 'center',
            originY: 'center'
          }));
        }
      }
      return new fabric.Group(items, {
        left: CANVAS_WIDTH / 2,
        top: CANVAS_HEIGHT - 300,
        originX: 'center',
        originY: 'center',
        shadow: new fabric.Shadow({
          color: 'rgba(0,0,0,0.1)',
          offsetX: 4,
          offsetY: 4,
          blur: 8
        })
      });
    }

    fileInput.onchange = (e) => {
      if (!e.target.files[0]) return;
      const reader = new FileReader();
      reader.onload = (f) => {
        fabric.Image.fromURL(f.target.result, (img) => {
          const scale = 200 / img.width;
          img.set({
            originX: 'center',
            originY: 'top',
            scaleX: scale,
            scaleY: scale,
            stroke: '#ffffff',
            strokeWidth: 10,
            shadow: new fabric.Shadow({
              color: 'rgba(0,0,0,0.2)',
              offsetX: 4,
              offsetY: 4,
              blur: 6
            })
          });
          const text = new fabric.IText('なまえ', {
            fontFamily: 'Yusei Magic',
            fontSize: 32,
            fill: '#000000',
            stroke: '#ffffff',
            strokeWidth: 6,
            paintFirst: 'stroke',
            top: img.height * scale + 15,
            originX: 'center',
            originY: 'top'
          });
          const group = new fabric.Group([img, text], {
            left: CANVAS_WIDTH / 2,
            top: 300,
            originX: 'center',
            originY: 'top'
          });
          canvas.add(group);
          canvas.setActiveObject(group);
          saveState();
        });
      };
      reader.readAsDataURL(e.target.files[0]);
      e.target.value = '';
    };
    // --- スタンプ群 ---
    document.getElementById('btnAddTape').onclick = () => {
      const tape = new fabric.Rect({
        width: 180,
        height: 35,
        fill: 'rgba(255, 182, 193, 0.7)',
        angle: -5,
        left: CANVAS_WIDTH / 2,
        top: CANVAS_HEIGHT / 2,
        originX: 'center',
        originY: 'center'
      });
      canvas.add(tape);
      canvas.setActiveObject(tape);
      saveState();
    };
    document.getElementById('btnAddRibbon').onclick = () => {
      const ribbon = new fabric.Path('M 0 20 L 30 0 L 270 0 L 300 20 L 270 40 L 30 40 Z', {
        fill: '#fbbf24',
        stroke: '#d97706',
        strokeWidth: 2,
        left: CANVAS_WIDTH / 2,
        top: CANVAS_HEIGHT / 2,
        originX: 'center',
        originY: 'center'
      });
      const text = new fabric.IText('リボン', {
        fontFamily: 'M PLUS Rounded 1c',
        fontSize: 22,
        fill: '#ffffff',
        left: CANVAS_WIDTH / 2,
        top: CANVAS_HEIGHT / 2,
        originX: 'center',
        originY: 'center'
      });
      const group = new fabric.Group([ribbon, text], {
        left: CANVAS_WIDTH / 2,
        top: CANVAS_HEIGHT / 2,
        originX: 'center',
        originY: 'center',
        shadow: new fabric.Shadow({
          color: 'rgba(0,0,0,0.15)',
          offsetX: 3,
          offsetY: 3,
          blur: 5
        })
      });
      canvas.add(group);
      canvas.setActiveObject(group);
      saveState();
    };
    document.getElementById('btnAddStar').onclick = () => {
      const star = new fabric.Polygon([{
        x: 0,
        y: -50
      }, {
        x: 14,
        y: -15
      }, {
        x: 50,
        y: -15
      }, {
        x: 21,
        y: 7
      }, {
        x: 32,
        y: 40
      }, {
        x: 0,
        y: 20
      }, {
        x: -32,
        y: 40
      }, {
        x: -21,
        y: 7
      }, {
        x: -50,
        y: -15
      }, {
        x: -14,
        y: -15
      }], {
        fill: '#fbbf24',
        stroke: '#d97706',
        strokeWidth: 2,
        left: CANVAS_WIDTH / 2,
        top: CANVAS_HEIGHT / 2,
        originX: 'center',
        originY: 'center',
        scaleX: 1.2,
        scaleY: 1.2
      });
      canvas.add(star);
      canvas.setActiveObject(star);
      saveState();
    };
    document.getElementById('btnAddHanamaru').onclick = () => {
      const path = "M 50,0 C 70,0 80,20 100,20 C 120,20 130,0 150,0 C 170,0 180,20 200,30 C 220,40 240,30 250,50 C 260,70 240,80 250,100 C 260,120 280,130 270,150 C 260,170 240,160 220,180 C 200,200 210,220 190,230 C 170,240 150,220 130,240 C 110,260 90,240 70,230 C 50,220 60,200 40,180 C 20,160 0,170 -10,150 C -20,130 0,120 10,100 C 20,80 0,70 10,50 C 20,30 40,40 50,0 Z";
      const flower = new fabric.Path(path, {
        fill: 'transparent',
        stroke: '#ef4444',
        strokeWidth: 8,
        left: CANVAS_WIDTH / 2,
        top: CANVAS_HEIGHT / 2,
        originX: 'center',
        originY: 'center',
        scaleX: 0.4,
        scaleY: 0.4
      });
      canvas.add(flower);
      canvas.setActiveObject(flower);
      saveState();
    };
    // --- データ保存 ---
    document.getElementById('btnSaveProject').onclick = () => {
      const json = JSON.stringify(canvas.toJSON(extraProps));
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([json], {
        type: 'application/json'
      }));
      a.download = `ポスターデータ_${new Date().toLocaleDateString('ja-JP').replace(/\//g,'')}.json`;
      a.click();
    };
    document.getElementById('btnLoadProject').onclick = () => document.getElementById('loadJsonInput').click();
    document.getElementById('loadJsonInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (f) => {
        isHistoryAction = true;
        canvas.loadFromJSON(f.target.result, () => {
          canvas.renderAll();
          isHistoryAction = false;
          saveState();
        }, reviver);
      };
      reader.readAsText(file);
      e.target.value = '';
    };
    document.getElementById('btnExport').onclick = () => {
      canvas.discardActiveObject();
      canvas.renderAll();
      const a = document.createElement('a');
      a.download = `クラス係ポスター_${new Date().toLocaleDateString('ja-JP').replace(/\//g,'')}.jpg`;
      a.href = canvas.toDataURL({
        format: 'jpeg',
        quality: 1
      });
      a.click();
    };
    document.getElementById('bgGrid').click();
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>係掲示</title>
    <meta name="viewport" content="width=device-width"><link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">


  </head>
    
  <body>
  <!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クラス係ポスターメーカー ULTIMATE</title>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=M+PLUS+Rounded+1c:wght@500;700;900&family=Yusei+Magic&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <style>
    :root {
      --primary: #4e8cff;
      --primary-hover: #3b6bce;
      --secondary: #ff8fa3;
      --surface: #ffffff;
      --bg-app: #f0f4f8;
      --border: #e2e8f0;
      --text-main: #334155;
      --text-sub: #64748b;
      --font-ui: 'M PLUS Rounded 1c', sans-serif;
      --radius: 8px;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-ui);
      background-color: var(--bg-app);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* スクロールバーのカスタマイズ */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* サイドバー */
    .sidebar {
      background: var(--surface);
      display: flex;
      flex-direction: column;
      z-index: 10;
      flex-shrink: 0;
    }

    .left-sidebar {
      width: 320px;
      border-right: 1px solid var(--border);
      box-shadow: 2px 0 15px rgba(0, 0, 0, 0.03);
    }

    .right-sidebar {
      width: 320px;
      border-left: 1px solid var(--border);
      box-shadow: -2px 0 15px rgba(0, 0, 0, 0.03);
    }

    .sidebar-header {
      padding: 15px 20px;
      border-bottom: 1px solid var(--border);
      text-align: center;
      background: #fafaf9;
    }

    .sidebar-header h1 {
      font-size: 1.1rem;
      color: var(--text-main);
      font-weight: 900;
    }

    .scroll-container {
      flex: 1;
      overflow-y: auto;
      padding: 15px 20px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 10px;
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    /* 背景デザインボタン */
    .bg-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .bg-btn {
      height: 55px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: 0.2s;
      position: relative;
      overflow: hidden;
    }

    .bg-btn:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .bg-btn span {
      position: absolute;
      bottom: 2px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 0.7rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
    }

    /* ボタン類 */
    .action-btn {
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.2s;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
    }

    .action-btn:hover {
      border-color: var(--primary);
      background: #f0f7ff;
      color: var(--primary);
    }

    .action-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .action-btn.active i {
      color: white !important;
    }

    .primary-btn {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      justify-content: center;
      margin-top: 10px;
    }

    .primary-btn:hover {
      background: var(--primary-hover);
      color: white;
    }

    .success-btn {
      background: #10b981;
      color: white;
      border-color: #10b981;
      justify-content: center;
    }

    .success-btn:hover {
      background: #059669;
    }

    .action-btn i {
      font-size: 1.1rem;
      width: 20px;
      text-align: center;
    }

    /* グリッドレイアウト */
    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .grid-2col .action-btn {
      margin-bottom: 0;
      justify-content: center;
      padding: 8px;
      font-size: 0.85rem;
    }

    .grid-3col {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }

    /* 中央ワークスペース */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      /* overflow防止 */
    }

    /* トップバー：画面幅が狭い場合でも折り返さずスクロールさせる */
    .top-bar {
      height: 50px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 15px;
      gap: 6px;
      overflow-x: auto;
      flex-shrink: 0;
    }

    .top-bar::-webkit-scrollbar {
      height: 4px;
    }

    .icon-btn {
      background: none;
      border: 1px solid transparent;
      font-size: 0.85rem;
      font-family: inherit;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .icon-btn:hover {
      background: var(--bg-app);
      color: var(--text-main);
      border-color: var(--border);
    }

    .icon-btn.danger:hover {
      background: #fee2e2;
      color: #dc2626;
      border-color: #fca5a5;
    }

    .icon-btn.action {
      background: #e0f2fe;
      color: #0284c7;
      border-color: #bae6fd;
    }

    .notice {
      margin-left: auto;
      font-size: 0.8rem;
      color: #0369a1;
      font-weight: bold;
      background: #e0f2fe;
      padding: 4px 12px;
      border-radius: 20px;
      white-space: nowrap;
    }

    /* キャンバスエリア */
    .canvas-scroll-area {
      flex: 1;
      overflow: auto;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 20px 20px;
    }

    #scaler-container {
      position: relative;
      transition: width 0.1s, height 0.1s;
    }

    .canvas-wrapper {
      background: white;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      border-radius: 2px;
      transform-origin: top left;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* プロパティパネル */
    .empty-state {
      text-align: center;
      color: var(--text-sub);
      margin-top: 40px;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .empty-state i {
      font-size: 2.5rem;
      color: var(--border);
      margin-bottom: 15px;
      display: block;
    }

    .prop-group {
      margin-bottom: 15px;
      background: #f8fafc;
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .prop-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 8px;
      font-weight: bold;
    }

    .prop-control {
      width: 100%;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text-main);
      background: #fff;
    }

    .prop-control:focus {
      outline: 2px solid var(--primary);
      border-color: transparent;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      cursor: pointer;
      padding: 0;
      background: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 2px solid #cbd5e1;
      border-radius: 6px;
    }

    .range-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--primary);
    }

    .range-val {
      font-size: 0.8rem;
      font-weight: bold;
      width: 35px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .toggle-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .toggle-wrap label {
      margin-bottom: 0;
    }
  </style>
</head>

<body>

  <!-- 左側ツールバー (パーツ・ファイル管理) -->
  <aside class="sidebar left-sidebar">
    <div class="sidebar-header">
      <h1><i class="fas fa-palette"></i> 係ポスターメーカー</h1>
    </div>

    <div class="scroll-container">
      <!-- 1. 背景 -->
      <div class="section-title"><i class="fas fa-image"></i> 背景をえらぶ (A4/B5縦)</div>
      <div class="bg-grid">
        <button class="bg-btn" id="bgGrid" style="background-color: #f0f8ff; border-top: 12px solid #FFF6A0;"><span style="color: #333; text-shadow: none;">マス目</span></button>
        <button class="bg-btn" id="bgBlackboard" style="background-color: #2c5e4f; border: 5px solid #8b5a2b;"><span>黒板</span></button>
        <button class="bg-btn" id="bgStripe" style="background: repeating-linear-gradient(45deg, #e0f2fe, #e0f2fe 10px, #ffffff 10px, #ffffff 20px);"><span style="color: #333; text-shadow: none;">ストライプ</span></button>
        <button class="bg-btn" id="bgCork" style="background-color: #deb887; border: 5px solid #a0522d; background-image: radial-gradient(#d2b48c 15%, transparent 16%), radial-gradient(#d2b48c 15%, transparent 16%); background-size: 15px 15px; background-position: 0 0, 7px 7px;"><span>コルク</span></button>
        <button class="bg-btn" id="bgDot" style="background-color: #fff0f5; background-image: radial-gradient(#ffb6c1 15%, transparent 16%); background-size: 15px 15px;"><span style="color: #333; text-shadow: none;">水玉</span></button>
        <button class="bg-btn" id="bgWhite" style="background-color: #ffffff;"><span style="color: #333; text-shadow: none;">無地 (白)</span></button>
      </div>

      <!-- 2. 基本パーツ -->
      <div class="section-title"><i class="fas fa-shapes"></i> 基本のパーツ</div>
      <button class="action-btn" id="btnAddTitle"><i class="fas fa-heading" style="color: #ef4444;"></i> タイトル枠</button>
      <button class="action-btn" id="btnAddJobDesc"><i class="fas fa-clipboard-list" style="color: #f59e0b;"></i> 仕事内容の枠</button>
      <button class="action-btn" id="btnAddTable"><i class="fas fa-table" style="color: #10b981;"></i> 当番表をつくる (自動生成)</button>

      <!-- 3. 追加要素（文字・写真・ペン） -->
      <div class="section-title"><i class="fas fa-pen-nib"></i> 自由にかきこむ</div>
      <button class="action-btn" id="btnAddText"><i class="fas fa-font" style="color: #6366f1;"></i> 自由な文字</button>
      <button class="action-btn" id="btnAddMember"><i class="fas fa-image" style="color: #3b82f6;"></i> 写真を追加<input type="file" id="fileInput" accept="image/*" style="display: none;"></button>
      <button class="action-btn" id="btnToggleDraw"><i class="fas fa-pencil-alt" style="color: #8b5cf6;"></i> お絵かきモード (手書き)</button>

      <!-- 4. スタンプ -->
      <div class="section-title"><i class="fas fa-star"></i> かざり（スタンプ）</div>
      <div class="grid-2col">
        <button class="action-btn" id="btnAddStar"><i class="fas fa-star" style="color: #fbbf24;"></i> 星</button>
        <button class="action-btn" id="btnAddHeart"><i class="fas fa-heart" style="color: #ec4899;"></i> ハート</button>
        <button class="action-btn" id="btnAddHanamaru"><i class="far fa-circle" style="color: #ef4444;"></i> はなまる</button>
        <button class="action-btn" id="btnAddMusic"><i class="fas fa-music" style="color: #06b6d4;"></i> 音符</button>
        <button class="action-btn" id="btnAddBubble"><i class="fas fa-comment" style="color: #8b5cf6;"></i> ふきだし</button>
        <button class="action-btn" id="btnAddPin"><i class="fas fa-thumbtack" style="color: #ef4444;"></i> ピン</button>
      </div>

      <!-- 5. 保存・書き出し (上にあったものを移動して整理) -->
      <div class="section-title" style="margin-top:30px; border-top: 2px dashed var(--border); padding-top: 15px;"><i class="fas fa-folder-open"></i> データと保存</div>
      <button class="action-btn success-btn" id="btnExport"><i class="fas fa-print"></i> 画像として保存 (印刷用)</button>
      <div class="grid-2col" style="margin-top: 8px;">
        <button class="action-btn" id="btnSaveProject" title="来年も使えるようにデータを保存"><i class="fas fa-download"></i> データ保存</button>
        <button class="action-btn" id="btnLoadProject"><i class="fas fa-upload"></i> 読み込み
          <input type="file" id="loadJsonInput" accept=".json" style="display: none;">
        </button>
      </div>
    </div>
  </aside>

  <!-- 中央ワークスペース -->
  <main class="workspace">
    <!-- トップバー（オブジェクト操作ツール） -->
    <div class="top-bar">
      <button class="icon-btn" id="btnUndo" title="元に戻す"><i class="fas fa-undo"></i></button>
      <button class="icon-btn" id="btnRedo" title="やり直す"><i class="fas fa-redo"></i></button>
      <div style="width: 1px; height: 20px; background: var(--border); margin: 0 5px;"></div>

      <button class="icon-btn action" id="btnGroup" style="display: none;"><i class="fas fa-object-group"></i> <span>グループ化</span></button>
      <button class="icon-btn" id="btnClone"><i class="fas fa-copy"></i> コピー</button>
      <button class="icon-btn" id="btnFront"><i class="fas fa-layer-group"></i> 前へ</button>
      <button class="icon-btn" id="btnBack"><i class="fas fa-layer-group" style="transform: rotate(180deg);"></i> 後ろへ</button>
      <button class="icon-btn danger" id="btnDelete"><i class="fas fa-trash"></i> 削除</button>

      <div style="width: 1px; height: 20px; background: var(--border); margin: 0 5px;"></div>
      <button class="icon-btn" id="btnUnlockAll" title="ロックされた背景や図形を動かせるようにします"><i class="fas fa-unlock"></i> 全てロック解除</button>

      <span class="notice"><i class="fas fa-lightbulb"></i> 表はダブルクリックで文字を編集！</span>
    </div>

    <!-- キャンバス本体 -->
    <div class="canvas-scroll-area">
      <div id="scaler-container">
        <div class="canvas-wrapper" id="wrapper">
          <canvas id="mainCanvas"></canvas>
        </div>
      </div>
    </div>
  </main>

  <!-- 右側プロパティパネル (整列・色・影・透明度など) -->
  <aside class="sidebar right-sidebar">
    <div class="sidebar-header">
      <h1><i class="fas fa-sliders-h"></i> 編集パネル</h1>
    </div>
    <div class="scroll-container">

      <!-- 未選択時 -->
      <div id="noSelectionMsg" class="empty-state">
        <i class="fas fa-mouse-pointer"></i>
        ポスター上の文字や図形を<br>クリックして選択すると、<br>ここで細かく編集できます。
      </div>

      <!-- お絵かきモード時 -->
      <div id="drawProps" style="display: none;">
        <div class="prop-group" style="border-color: #8b5cf6; background: #f5f3ff;">
          <label style="color: #6d28d9;"><i class="fas fa-pencil-alt"></i> ペンの設定</label>
          <div class="color-picker-wrapper" style="margin-bottom: 15px;">
            <input type="color" id="brushColor" value="#ef4444">
            <span style="font-size: 0.85rem;" id="brushColorHex">#EF4444</span>
          </div>
          <label>ペンの太さ</label>
          <div class="range-wrapper">
            <input type="range" id="brushWidth" min="1" max="50" value="8">
            <span id="brushWidthVal" class="range-val">8</span>
          </div>
        </div>
      </div>

      <!-- オブジェクト選択時 -->
      <div id="propertyPanel" style="display: none;">

        <!-- 整列・配置ツール (新規) -->
        <div class="prop-group">
          <label><i class="fas fa-align-center"></i> 用紙に合わせる</label>
          <div class="grid-3col" style="margin-bottom:0;">
            <button class="icon-btn" id="btnAlignLeft" style="border:1px solid #cbd5e1; justify-content:center;" title="左揃え"><i class="fas fa-align-left"></i></button>
            <button class="icon-btn" id="btnAlignCenter" style="border:1px solid #cbd5e1; justify-content:center;" title="中央揃え"><i class="fas fa-align-center"></i></button>
            <button class="icon-btn" id="btnAlignRight" style="border:1px solid #cbd5e1; justify-content:center;" title="右揃え"><i class="fas fa-align-right"></i></button>
          </div>
        </div>

        <!-- テキスト設定 -->
        <div id="textProps" style="display: none;">
          <div class="prop-group">
            <label>フォント（書体）</label>
            <select id="fontFamily" class="prop-control">
              <option value="M PLUS Rounded 1c">丸ゴシック (やさしい)</option>
              <option value="Yusei Magic">油性マジック (手書き風)</option>
              <option value="Klee One">えんぴつ (教科書体風)</option>
              <option value="sans-serif">ゴシック体 (標準)</option>
            </select>
          </div>
          <div class="prop-group">
            <label>文字の大きさ</label>
            <div class="range-wrapper">
              <input type="range" id="fontSize" min="12" max="150" value="24">
              <span id="fontSizeVal" class="range-val">24</span>
            </div>
          </div>
          <div class="prop-group">
            <label>文字の色</label>
            <div class="color-picker-wrapper">
              <input type="color" id="textColor" value="#000000">
              <span style="font-size: 0.85rem;" id="textColorHex">#000000</span>
            </div>
          </div>
        </div>

        <!-- 図形設定 -->
        <div id="shapeProps" style="display: none;">
          <div class="prop-group">
            <label>図形の色（ぬりつぶし）</label>
            <div class="color-picker-wrapper">
              <input type="color" id="fillColor" value="#ffffff">
              <button id="btnTransparentFill" class="icon-btn" style="border: 1px solid var(--border); padding: 4px 8px; font-size: 0.75rem;">透明にする</button>
            </div>
          </div>
          <div class="prop-group">
            <label>わく線の色</label>
            <div class="color-picker-wrapper">
              <input type="color" id="strokeColor" value="#000000">
              <button id="btnTransparentStroke" class="icon-btn" style="border: 1px solid var(--border); padding: 4px 8px; font-size: 0.75rem;">線なし</button>
            </div>
          </div>
          <div class="prop-group">
            <label>わく線の太さ</label>
            <div class="range-wrapper">
              <input type="range" id="strokeWidth" min="0" max="30" value="2">
              <span id="strokeWidthVal" class="range-val">2</span>
            </div>
          </div>
        </div>

        <!-- 共通高度設定 (透明度・影・ロック) -->
        <div class="prop-group">
          <div class="toggle-wrap" style="margin-bottom: 15px;">
            <label><i class="fas fa-eye-slash"></i> 透明度 (すける)</label>
          </div>
          <div class="range-wrapper" style="margin-bottom: 15px;">
            <input type="range" id="opacity" min="0" max="100" value="100">
            <span id="opacityVal" class="range-val">100%</span>
          </div>

          <div class="toggle-wrap" style="margin-bottom: 15px; border-top: 1px dashed #cbd5e1; padding-top: 15px;">
            <label><i class="fas fa-clone"></i> 影をつける</label>
            <input type="checkbox" id="toggleShadow" style="width: 18px; height: 18px; cursor: pointer;">
          </div>

          <div style="border-top: 1px dashed #cbd5e1; padding-top: 15px;">
            <button class="action-btn" id="btnLockObj" style="margin: 0; justify-content: center; background: #fff1f2; color: #e11d48; border-color: #fecdd3;">
              <i class="fas fa-lock"></i> 位置をロックする
            </button>
            <p style="font-size: 0.65rem; color: var(--text-sub); margin-top: 6px; text-align: center;">※背景や表を固定すると文字入力が楽になります</p>
          </div>
        </div>

      </div>
    </div>
  </aside>

  <script>
    // --- Fabric.js 初期設定 ---
    fabric.Object.prototype.set({
      transparentCorners: false,
      cornerColor: '#4e8cff',
      cornerStrokeColor: '#ffffff',
      borderColor: '#4e8cff',
      cornerSize: 10,
      padding: 8,
      cornerStyle: 'circle'
    });
    // A4/B5比率の高解像度ベース
    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 1131;
    const canvas = new fabric.Canvas('mainCanvas', {
      width: CANVAS_WIDTH,
      height: CANVAS_HEIGHT,
      backgroundColor: '#ffffff',
      preserveObjectStacking: true,
      selection: true
    });
    // リサイズとセンタリング（スクロール領域への完璧なフィット）
    function scaleCanvasToFit() {
      const wrapper = document.getElementById('wrapper');
      const scaler = document.getElementById('scaler-container');
      const container = document.querySelector('.canvas-scroll-area');
      const padding = 60;
      const scaleX = (container.clientWidth - padding) / CANVAS_WIDTH;
      const scaleY = (container.clientHeight - padding) / CANVAS_HEIGHT;
      const scale = Math.min(scaleX, scaleY, 1.2);
      wrapper.style.transform = `scale(${scale})`;
      scaler.style.width = `${CANVAS_WIDTH * scale}px`;
      scaler.style.height = `${CANVAS_HEIGHT * scale}px`;
    }
    window.addEventListener('resize', scaleCanvasToFit);
    setTimeout(scaleCanvasToFit, 100);
    // --- 履歴管理 ---
    let stateHistory = [];
    let historyIndex = -1;
    let isHistoryAction = false;
    // 保存時のプロパティ指定（ロック状態なども記録）
    const extraProps = ['isBgElement', 'lockMovementX', 'lockMovementY', 'lockRotation', 'lockScalingX', 'lockScalingY', 'hasControls', 'selectable', 'id'];

    function saveState() {
      if (isHistoryAction || canvas.isDrawingMode) return;
      stateHistory = stateHistory.slice(0, historyIndex + 1);
      stateHistory.push(JSON.stringify(canvas.toJSON(extraProps)));
      historyIndex++;
      if (stateHistory.length > 30) {
        stateHistory.shift();
        historyIndex--;
      }
    }
    document.fonts.ready.then(() => {
      canvas.requestRenderAll();
      setTimeout(saveState, 500);
    });
    canvas.on('object:modified', saveState);
    canvas.on('object:added', (e) => {
      if (!e.target.excludeFromHistory && !isHistoryAction && !canvas.isDrawingMode) saveState();
    });
    canvas.on('object:removed', () => {
      if (!isHistoryAction && !canvas.isDrawingMode) saveState();
    });
    // お絵かき終了時に履歴保存
    canvas.on('path:created', () => {
      saveState();
    });
    document.getElementById('btnUndo').onclick = () => {
      if (historyIndex > 0) {
        isHistoryAction = true;
        historyIndex--;
        canvas.loadFromJSON(stateHistory[historyIndex], () => {
          canvas.renderAll();
          isHistoryAction = false;
          updatePropsContext();
        }, reviver);
      }
    };
    document.getElementById('btnRedo').onclick = () => {
      if (historyIndex < stateHistory.length - 1) {
        isHistoryAction = true;
        historyIndex++;
        canvas.loadFromJSON(stateHistory[historyIndex], () => {
          canvas.renderAll();
          isHistoryAction = false;
          updatePropsContext();
        }, reviver);
      }
    };
    // ロックされたオブジェクトの制御を復元するための関数
    const reviver = (o, obj) => {
      if (!obj.selectable) {
        obj.set({
          evented: false
        });
      }
    };
    const getAct = () => canvas.getActiveObject();
    // --- データ保存・読み込み (先生のための超重要機能！) ---
    document.getElementById('btnSaveProject').onclick = () => {
      const json = JSON.stringify(canvas.toJSON(extraProps));
      const blob = new Blob([json], {
        type: 'application/json'
      });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `ポスターデータ_${new Date().toLocaleDateString('ja-JP').replace(/\//g,'')}.json`;
      a.click();
    };
    document.getElementById('btnLoadProject').onclick = () => document.getElementById('loadJsonInput').click();
    document.getElementById('loadJsonInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (f) => {
        isHistoryAction = true;
        canvas.loadFromJSON(f.target.result, () => {
          canvas.renderAll();
          isHistoryAction = false;
          saveState(); // 読み込み直後の状態を履歴0にするか追加する
        }, reviver);
      };
      reader.readAsText(file);
      e.target.value = ''; // リセット
    };
    // --- トップバーアクション ---
    document.getElementById('btnDelete').onclick = () => {
      const activeObjects = canvas.getActiveObjects();
      if (activeObjects.length) {
        activeObjects.forEach(obj => {
          if (obj.selectable) canvas.remove(obj);
        });
        canvas.discardActiveObject();
        saveState();
      }
    };
    window.addEventListener('keydown', (e) => {
      if ((e.key === 'Delete' || e.key === 'Backspace') && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
        const o = getAct();
        if (o && !o.isEditing) document.getElementById('btnDelete').click();
      }
    });
    document.getElementById('btnClone').onclick = () => {
      const o = getAct();
      if (o) {
        o.clone(cloned => {
          cloned.set({
            left: cloned.left + 20,
            top: cloned.top + 20
          });
          canvas.add(cloned);
          canvas.setActiveObject(cloned);
          saveState();
        }, extraProps);
      }
    };
    document.getElementById('btnFront').onclick = () => {
      const o = getAct();
      if (o) {
        canvas.bringToFront(o);
        saveState();
      }
    };
    document.getElementById('btnBack').onclick = () => {
      const o = getAct();
      if (o) {
        canvas.sendToBack(o);
        const bgElements = canvas.getObjects().filter(obj => obj.isBgElement);
        bgElements.forEach(bg => canvas.sendToBack(bg));
        saveState();
      }
    };
    // --- グループ化 / ダブルクリック ---
    const btnGroup = document.getElementById('btnGroup');
    btnGroup.onclick = () => {
      const obj = getAct();
      if (!obj) return;
      if (obj.type === 'activeSelection') {
        obj.toGroup();
        canvas.requestRenderAll();
        saveState();
      } else if (obj.type === 'group') {
        obj.toActiveSelection();
        canvas.requestRenderAll();
        saveState();
      }
      updatePropsContext();
    };
    canvas.on('mouse:dblclick', (e) => {
      const target = e.target;
      if (target && target.type === 'group') {
        const sel = target.toActiveSelection();
        canvas.requestRenderAll();
        const pointer = canvas.getPointer(e.e);
        const objects = sel.getObjects();
        let clickedObj = null;
        for (let i = objects.length - 1; i >= 0; i--) {
          if (objects[i].containsPoint(pointer)) {
            clickedObj = objects[i];
            break;
          }
        }
        if (clickedObj) {
          canvas.setActiveObject(clickedObj);
          if (clickedObj.isType('i-text') || clickedObj.isType('textbox')) {
            clickedObj.enterEditing();
            clickedObj.selectAll();
          }
        }
        saveState();
      }
    });
    // --- お絵かきモード (新規) ---
    let isDrawing = false;
    const btnToggleDraw = document.getElementById('btnToggleDraw');
    const drawProps = document.getElementById('drawProps');
    // 初期ブラシ設定
    canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
    canvas.freeDrawingBrush.color = '#ef4444';
    canvas.freeDrawingBrush.width = 8;
    btnToggleDraw.onclick = () => {
      isDrawing = !isDrawing;
      canvas.isDrawingMode = isDrawing;
      btnToggleDraw.classList.toggle('active', isDrawing);
      if (isDrawing) {
        canvas.discardActiveObject();
        updatePropsContext(); // パネル切り替え
      } else {
        updatePropsContext();
      }
    };
    document.getElementById('brushColor').oninput = (e) => {
      canvas.freeDrawingBrush.color = e.target.value;
      document.getElementById('brushColorHex').innerText = e.target.value.toUpperCase();
    };
    document.getElementById('brushWidth').oninput = (e) => {
      canvas.freeDrawingBrush.width = parseInt(e.target.value, 10);
      document.getElementById('brushWidthVal').innerText = e.target.value;
    };
    // --- 整列・ロック・パネル連動 ---
    canvas.on('selection:created', updatePropsContext);
    canvas.on('selection:updated', updatePropsContext);
    canvas.on('selection:cleared', updatePropsContext);

    function updatePropsContext() {
      const obj = getAct();
      const noSel = document.getElementById('noSelectionMsg');
      const propPanel = document.getElementById('propertyPanel');
      // お絵かきモード優先表示
      if (canvas.isDrawingMode) {
        noSel.style.display = 'none';
        propPanel.style.display = 'none';
        drawProps.style.display = 'block';
        return;
      } else {
        drawProps.style.display = 'none';
      }
      if (!obj) {
        propPanel.style.display = 'none';
        noSel.style.display = 'block';
        btnGroup.style.display = 'none';
        return;
      }
      noSel.style.display = 'none';
      propPanel.style.display = 'block';
      // グループボタン
      const btnGroupSpan = btnGroup.querySelector('span');
      const btnGroupIcon = btnGroup.querySelector('i');
      if (obj.type === 'activeSelection') {
        btnGroup.style.display = 'flex';
        btnGroupSpan.innerText = 'グループ化';
        btnGroupIcon.className = 'fas fa-object-group';
      } else if (obj.type === 'group') {
        btnGroup.style.display = 'flex';
        btnGroupSpan.innerText = 'グループ解除';
        btnGroupIcon.className = 'fas fa-object-ungroup';
      } else {
        btnGroup.style.display = 'none';
      }
      // テキスト/図形プロパティ
      const isText = obj.type === 'i-text' || obj.type === 'textbox' || obj.type === 'text';
      if (isText) {
        document.getElementById('textProps').style.display = 'block';
        document.getElementById('fontFamily').value = obj.fontFamily || 'M PLUS Rounded 1c';
        document.getElementById('fontSize').value = obj.fontSize || 24;
        document.getElementById('fontSizeVal').innerText = obj.fontSize || 24;
        let color = obj.fill || '#000000';
        if (color === 'transparent') color = '#ffffff';
        document.getElementById('textColor').value = color;
        document.getElementById('textColorHex').innerText = color.toUpperCase();
      } else {
        document.getElementById('textProps').style.display = 'none';
      }
      if (obj.type !== 'group' && obj.type !== 'activeSelection') {
        document.getElementById('shapeProps').style.display = 'block';
        let fill = obj.fill || '#ffffff';
        let stroke = obj.stroke || '#000000';
        document.getElementById('fillColor').value = fill === 'transparent' ? '#ffffff' : fill;
        document.getElementById('strokeColor').value = stroke === 'transparent' ? '#000000' : stroke;
        document.getElementById('strokeWidth').value = obj.strokeWidth || 0;
        document.getElementById('strokeWidthVal').innerText = obj.strokeWidth || 0;
      } else {
        document.getElementById('shapeProps').style.display = 'none';
      }
      // 共通プロパティ (透明度・影)
      const op = Math.round((obj.opacity !== undefined ? obj.opacity : 1) * 100);
      document.getElementById('opacity').value = op;
      document.getElementById('opacityVal').innerText = op + '%';
      document.getElementById('toggleShadow').checked = !!obj.shadow;
    }
    const applyProp = (prop, val) => {
      const obj = getAct();
      if (!obj) return;
      if (obj.type === 'activeSelection') obj.forEachObject(o => o.set(prop, val));
      else obj.set(prop, val);
      canvas.requestRenderAll();
      saveState();
    };
    // プロパティイベントリスナー
    document.getElementById('fontFamily').onchange = (e) => applyProp('fontFamily', e.target.value);
    document.getElementById('fontSize').oninput = (e) => {
      document.getElementById('fontSizeVal').innerText = e.target.value;
      applyProp('fontSize', parseInt(e.target.value, 10));
    };
    document.getElementById('textColor').oninput = (e) => {
      document.getElementById('textColorHex').innerText = e.target.value.toUpperCase();
      applyProp('fill', e.target.value);
    };
    document.getElementById('fillColor').oninput = (e) => applyProp('fill', e.target.value);
    document.getElementById('btnTransparentFill').onclick = () => applyProp('fill', 'transparent');
    document.getElementById('strokeColor').oninput = (e) => applyProp('stroke', e.target.value);
    document.getElementById('btnTransparentStroke').onclick = () => applyProp('stroke', 'transparent');
    document.getElementById('strokeWidth').oninput = (e) => {
      document.getElementById('strokeWidthVal').innerText = e.target.value;
      applyProp('strokeWidth', parseInt(e.target.value, 10));
    };
    document.getElementById('opacity').oninput = (e) => {
      const val = parseInt(e.target.value, 10);
      document.getElementById('opacityVal').innerText = val + '%';
      applyProp('opacity', val / 100);
    };
    document.getElementById('toggleShadow').onchange = (e) => {
      const obj = getAct();
      if (!obj) return;
      const hasShadow = e.target.checked;
      const shadowObj = hasShadow ? new fabric.Shadow({
        color: 'rgba(0,0,0,0.25)',
        offsetX: 4,
        offsetY: 4,
        blur: 5
      }) : null;
      if (obj.type === 'activeSelection') obj.forEachObject(o => o.set('shadow', shadowObj));
      else obj.set('shadow', shadowObj);
      canvas.requestRenderAll();
      saveState();
    };
    // 整列アクション
    document.getElementById('btnAlignLeft').onclick = () => {
      const o = getAct();
      if (o) {
        o.set({
          left: 0,
          originX: 'left'
        });
        o.setCoords();
        canvas.requestRenderAll();
        saveState();
      }
    };
    document.getElementById('btnAlignCenter').onclick = () => {
      const o = getAct();
      if (o) {
        o.centerH();
        o.setCoords();
        canvas.requestRenderAll();
        saveState();
      }
    };
    document.getElementById('btnAlignRight').onclick = () => {
      const o = getAct();
      if (o) {
        o.set({
          left: CANVAS_WIDTH,
          originX: 'right'
        });
        o.setCoords();
        canvas.requestRenderAll();
        saveState();
      }
    };
    // ロック機能
    document.getElementById('btnLockObj').onclick = () => {
      const obj = getAct();
      if (obj) {
        if (obj.type === 'activeSelection') {
          obj.forEachObject(o => o.set({
            lockMovementX: true,
            lockMovementY: true,
            lockRotation: true,
            lockScalingX: true,
            lockScalingY: true,
            hasControls: false,
            selectable: false,
            evented: false
          }));
        } else {
          obj.set({
            lockMovementX: true,
            lockMovementY: true,
            lockRotation: true,
            lockScalingX: true,
            lockScalingY: true,
            hasControls: false,
            selectable: false,
            evented: false
          });
        }
        canvas.discardActiveObject();
        canvas.requestRenderAll();
        saveState();
      }
    };
    document.getElementById('btnUnlockAll').onclick = () => {
      canvas.getObjects().forEach(o => {
        if (!o.isBgElement) { // 背景ベース枠はロックのまま
          o.set({
            lockMovementX: false,
            lockMovementY: false,
            lockRotation: false,
            lockScalingX: false,
            lockScalingY: false,
            hasControls: true,
            selectable: true,
            evented: true
          });
        }
      });
      canvas.requestRenderAll();
      saveState();
      alert("すべてのロックを解除しました。");
    };
    // --- 背景パターンの生成 ---
    function clearBackground() {
      canvas.setBackgroundImage(null, canvas.renderAll.bind(canvas));
      canvas.backgroundColor = '#ffffff';
      canvas.getObjects().forEach(obj => {
        if (obj.isBgElement) canvas.remove(obj);
      });
    }
    document.getElementById('bgGrid').onclick = () => {
      clearBackground();
      const pCanvas = document.createElement('canvas');
      pCanvas.width = 40;
      pCanvas.height = 40;
      const pCtx = pCanvas.getContext('2d');
      pCtx.fillStyle = '#f8fbff';
      pCtx.fillRect(0, 0, 40, 40);
      pCtx.strokeStyle = '#dbeafe';
      pCtx.lineWidth = 2;
      pCtx.beginPath();
      pCtx.moveTo(0, 0);
      pCtx.lineTo(40, 0);
      pCtx.moveTo(0, 0);
      pCtx.lineTo(0, 40);
      pCtx.stroke();
      const header = new fabric.Rect({
        left: 0,
        top: 0,
        width: CANVAS_WIDTH,
        height: 120,
        fill: '#FFF6A0',
        selectable: false,
        evented: false,
        excludeFromHistory: true,
        isBgElement: true
      });
      canvas.backgroundColor = new fabric.Pattern({
        source: pCanvas,
        repeat: 'repeat'
      });
      canvas.add(header);
      canvas.sendToBack(header);
      canvas.renderAll();
      saveState();
    };
    document.getElementById('bgBlackboard').onclick = () => {
      clearBackground();
      canvas.backgroundColor = '#2c5e4f';
      const frame = new fabric.Rect({
        left: 15,
        top: 15,
        width: CANVAS_WIDTH - 30,
        height: CANVAS_HEIGHT - 30,
        fill: 'transparent',
        stroke: '#8b5a2b',
        strokeWidth: 15,
        selectable: false,
        evented: false,
        isBgElement: true
      });
      canvas.add(frame);
      canvas.sendToBack(frame);
      canvas.renderAll();
      saveState();
    };
    document.getElementById('bgStripe').onclick = () => {
      clearBackground();
      const pCanvas = document.createElement('canvas');
      pCanvas.width = 40;
      pCanvas.height = 40;
      const pCtx = pCanvas.getContext('2d');
      pCtx.fillStyle = '#ffffff';
      pCtx.fillRect(0, 0, 40, 40);
      pCtx.fillStyle = '#e0f2fe';
      pCtx.beginPath();
      pCtx.moveTo(0, 40);
      pCtx.lineTo(40, 0);
      pCtx.lineTo(40, 10);
      pCtx.lineTo(10, 40);
      pCtx.fill();
      pCtx.beginPath();
      pCtx.moveTo(0, 10);
      pCtx.lineTo(10, 0);
      pCtx.lineTo(0, 0);
      pCtx.fill();
      canvas.backgroundColor = new fabric.Pattern({
        source: pCanvas,
        repeat: 'repeat'
      });
      canvas.renderAll();
      saveState();
    };
    document.getElementById('bgCork').onclick = () => {
      clearBackground();
      canvas.backgroundColor = '#deb887';
      const frame = new fabric.Rect({
        left: 10,
        top: 10,
        width: CANVAS_WIDTH - 20,
        height: CANVAS_HEIGHT - 20,
        fill: 'transparent',
        stroke: '#a0522d',
        strokeWidth: 12,
        selectable: false,
        evented: false,
        isBgElement: true
      });
      canvas.add(frame);
      canvas.sendToBack(frame);
      canvas.renderAll();
      saveState();
    };
    document.getElementById('bgDot').onclick = () => {
      clearBackground();
      const pCanvas = document.createElement('canvas');
      pCanvas.width = 30;
      pCanvas.height = 30;
      const pCtx = pCanvas.getContext('2d');
      pCtx.fillStyle = '#fff0f5';
      pCtx.fillRect(0, 0, 30, 30);
      pCtx.fillStyle = '#ffb6c1';
      pCtx.beginPath();
      pCtx.arc(15, 15, 4, 0, Math.PI * 2);
      pCtx.fill();
      canvas.backgroundColor = new fabric.Pattern({
        source: pCanvas,
        repeat: 'repeat'
      });
      canvas.renderAll();
      saveState();
    };
    document.getElementById('bgWhite').onclick = () => {
      clearBackground();
      canvas.renderAll();
      saveState();
    };
    // --- パーツの追加 ---
    document.getElementById('btnAddTitle').onclick = () => {
      const rect = new fabric.Rect({
        width: 440,
        height: 90,
        fill: '#ffffff',
        stroke: '#334155',
        strokeWidth: 4,
        rx: 20,
        ry: 20,
        originX: 'center',
        originY: 'center',
        shadow: new fabric.Shadow({
          color: 'rgba(0,0,0,0.15)',
          offsetX: 5,
          offsetY: 5,
          blur: 0
        })
      });
      const text = new fabric.IText('係の名前', {
        fontFamily: 'Yusei Magic',
        fontSize: 50,
        fill: '#334155',
        originX: 'center',
        originY: 'center'
      });
      const group = new fabric.Group([rect, text], {
        left: CANVAS_WIDTH / 2,
        top: 150,
        originX: 'center',
        originY: 'center'
      });
      canvas.add(group);
      canvas.setActiveObject(group);
      saveState();
    };
    document.getElementById('btnAddJobDesc').onclick = () => {
      const mainRect = new fabric.Rect({
        width: 540,
        height: 220,
        fill: '#ffffff',
        stroke: '#ff8fa3',
        strokeWidth: 6,
        rx: 15,
        ry: 15,
        originX: 'center',
        originY: 'center'
      });
      const tagRect = new fabric.Rect({
        width: 160,
        height: 46,
        fill: '#ff8fa3',
        stroke: 'transparent',
        strokeWidth: 0,
        rx: 23,
        ry: 23,
        top: -110,
        originX: 'center',
        originY: 'center'
      });
      const tagText = new fabric.IText('仕事内容', {
        fontFamily: 'M PLUS Rounded 1c',
        fontSize: 22,
        fontWeight: '700',
        fill: '#ffffff',
        top: -110,
        originX: 'center',
        originY: 'center'
      });
      const contentText = new fabric.Textbox('・ここをダブルクリック\n・仕事の内容を\n・書いてください', {
        fontFamily: 'Klee One',
        fontSize: 26,
        fill: '#333333',
        width: 480,
        top: 10,
        originX: 'center',
        originY: 'center',
        textAlign: 'left',
        lineHeight: 1.4
      });
      const group = new fabric.Group([mainRect, tagRect, tagText, contentText], {
        left: CANVAS_WIDTH / 2,
        top: CANVAS_HEIGHT / 2 - 50,
        originX: 'center',
        originY: 'center'
      });
      canvas.add(group);
      canvas.setActiveObject(group);
      saveState();
    };
    document.getElementById('btnAddTable').onclick = () => {
      const input = prompt("1日あたりの当番の人数を入力してください\n（例: 3）", "3");
      if (input === null) return;
      const rowCount = parseInt(input, 10);
      if (isNaN(rowCount) || rowCount < 1 || rowCount > 15) {
        alert("1から15の間の数字を入力してください。");
        return;
      }
      const cols = 5;
      const rows = rowCount + 1;
      const cellW = 100;
      const cellH = 50;
      const totalW = cols * cellW;
      const totalH = rows * cellH;
      const startX = -totalW / 2;
      const startY = -totalH / 2;
      const items = [];
      items.push(new fabric.Rect({
        width: totalW,
        height: totalH,
        fill: '#ffffff',
        stroke: '#cbd5e1',
        strokeWidth: 2,
        left: startX,
        top: startY
      }));
      items.push(new fabric.Rect({
        width: totalW,
        height: cellH,
        fill: '#e0f2fe',
        stroke: '#cbd5e1',
        strokeWidth: 2,
        left: startX,
        top: startY
      }));
      for (let i = 1; i < cols; i++) items.push(new fabric.Line([startX + i * cellW, startY, startX + i * cellW, startY + totalH], {
        stroke: '#cbd5e1',
        strokeWidth: 2
      }));
      for (let j = 1; j < rows; j++) items.push(new fabric.Line([startX, startY + j * cellH, startX + totalW, startY + j * cellH], {
        stroke: '#cbd5e1',
        strokeWidth: 2
      }));
      ['月', '火', '水', '木', '金'].forEach((day, i) => {
        items.push(new fabric.IText(day, {
          fontFamily: 'M PLUS Rounded 1c',
          fontSize: 22,
          fontWeight: 'bold',
          fill: '#0369a1',
          left: startX + i * cellW + cellW / 2,
          top: startY + cellH / 2,
          originX: 'center',
          originY: 'center'
        }));
      });
      for (let r = 1; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          items.push(new fabric.IText('名前', {
            fontFamily: 'Klee One',
            fontSize: 20,
            fill: '#64748b',
            left: startX + c * cellW + cellW / 2,
            top: startY + r * cellH + cellH / 2,
            originX: 'center',
            originY: 'center'
          }));
        }
      }
      const tableGroup = new fabric.Group(items, {
        left: CANVAS_WIDTH / 2,
        top: CANVAS_HEIGHT - 250,
        originX: 'center',
        originY: 'center'
      });
      canvas.add(tableGroup);
      canvas.setActiveObject(tableGroup);
      saveState();
    };
    document.getElementById('btnAddText').onclick = () => {
      const text = new fabric.IText('自由に文字を入力', {
        fontFamily: 'Yusei Magic',
        fontSize: 36,
        fill: '#334155',
        left: CANVAS_WIDTH / 2,
        top: CANVAS_HEIGHT / 2,
        originX: 'center',
        originY: 'center'
      });
      canvas.add(text);
      canvas.setActiveObject(text);
      text.enterEditing();
      text.selectAll();
      saveState();
    };
    // 写真追加
    const fileInput = document.getElementById('fileInput');
    document.getElementById('btnAddMember').onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
      if (!e.target.files[0]) return;
      const reader = new FileReader();
      reader.onload = (f) => {
        fabric.Image.fromURL(f.target.result, (img) => {
          const scale = 180 / img.width;
          img.set({
            originX: 'center',
            originY: 'top',
            scaleX: scale,
            scaleY: scale,
            stroke: '#ffffff',
            strokeWidth: 8,
            shadow: new fabric.Shadow({
              color: 'rgba(0,0,0,0.2)',
              offsetX: 3,
              offsetY: 3,
              blur: 5
            })
          });
          const text = new fabric.IText('名前', {
            fontFamily: 'Yusei Magic',
            fontSize: 26,
            fill: '#000000',
            top: img.height * scale + 10,
            originX: 'center',
            originY: 'top',
            backgroundColor: 'rgba(255,255,255,0.8)'
          });
          const group = new fabric.Group([img, text], {
            left: CANVAS_WIDTH / 2,
            top: 300,
            originX: 'center',
            originY: 'top'
          });
          canvas.add(group);
          canvas.setActiveObject(group);
          saveState();
        });
      };
      reader.readAsDataURL(e.target.files[0]);
      e.target.value = '';
    };
    // スタンプ群
    document.getElementById('btnAddStar').onclick = () => {
      const star = new fabric.Polygon([{
        x: 0,
        y: -50
      }, {
        x: 14,
        y: -15
      }, {
        x: 50,
        y: -15
      }, {
        x: 21,
        y: 7
      }, {
        x: 32,
        y: 40
      }, {
        x: 0,
        y: 20
      }, {
        x: -32,
        y: 40
      }, {
        x: -21,
        y: 7
      }, {
        x: -50,
        y: -15
      }, {
        x: -14,
        y: -15
      }], {
        fill: '#fbbf24',
        stroke: '#d97706',
        strokeWidth: 2,
        left: CANVAS_WIDTH / 2,
        top: CANVAS_HEIGHT / 2,
        originX: 'center',
        originY: 'center',
        scaleX: 1.2,
        scaleY: 1.2
      });
      canvas.add(star);
      canvas.setActiveObject(star);
      saveState();
    };
    document.getElementById('btnAddHeart').onclick = () => {
      const heart = new fabric.Path("M 272.7,238.7 C 206.4,238.7 152.7,292.4 152.7,358.7 C 152.7,493.4 288.6,528.8 381.2,662.0 C 468.8,529.6 609.8,489.1 609.8,358.7 C 609.8,292.4 556.0,238.7 489.8,238.7 C 441.7,238.7 400.4,267.0 381.2,307.9 C 362.1,267.0 320.7,238.7 272.7,238.7 z", {
        fill: '#f43f5e',
        stroke: '#be123c',
        strokeWidth: 5,
        left: CANVAS_WIDTH / 2,
        top: CANVAS_HEIGHT / 2,
        originX: 'center',
        originY: 'center',
        scaleX: 0.3,
        scaleY: 0.3
      });
      canvas.add(heart);
      canvas.setActiveObject(heart);
      saveState();
    };
    document.getElementById('btnAddHanamaru').onclick = () => {
      // 桜/花丸風のパス
      const path = "M 50,0 C 70,0 80,20 100,20 C 120,20 130,0 150,0 C 170,0 180,20 200,30 C 220,40 240,30 250,50 C 260,70 240,80 250,100 C 260,120 280,130 270,150 C 260,170 240,160 220,180 C 200,200 210,220 190,230 C 170,240 150,220 130,240 C 110,260 90,240 70,230 C 50,220 60,200 40,180 C 20,160 0,170 -10,150 C -20,130 0,120 10,100 C 20,80 0,70 10,50 C 20,30 40,40 50,0 Z";
      const flower = new fabric.Path(path, {
        fill: 'transparent',
        stroke: '#ef4444',
        strokeWidth: 8,
        left: CANVAS_WIDTH / 2,
        top: CANVAS_HEIGHT / 2,
        originX: 'center',
        originY: 'center',
        scaleX: 0.4,
        scaleY: 0.4
      });
      canvas.add(flower);
      canvas.setActiveObject(flower);
      saveState();
    };
    document.getElementById('btnAddMusic').onclick = () => {
      const text = new fabric.IText('♪', {
        fontFamily: 'M PLUS Rounded 1c',
        fontSize: 60,
        fill: '#06b6d4',
        left: CANVAS_WIDTH / 2,
        top: CANVAS_HEIGHT / 2,
        originX: 'center',
        originY: 'center'
      });
      canvas.add(text);
      canvas.setActiveObject(text);
      saveState();
    };
    document.getElementById('btnAddBubble').onclick = () => {
      const bubble = new fabric.Path('M 0 0 L 120 0 L 120 60 L 30 60 L 15 80 L 15 60 L 0 60 Z', {
        fill: '#ffffff',
        stroke: '#8b5cf6',
        strokeWidth: 3,
        rx: 10,
        ry: 10,
        originX: 'center',
        originY: 'center',
        scaleX: 1.5,
        scaleY: 1.5
      });
      const text = new fabric.IText('よろしくね！', {
        fontFamily: 'Yusei Magic',
        fontSize: 24,
        fill: '#333',
        top: -5,
        originX: 'center',
        originY: 'center'
      });
      const group = new fabric.Group([bubble, text], {
        left: CANVAS_WIDTH / 2,
        top: CANVAS_HEIGHT / 2,
        originX: 'center',
        originY: 'center'
      });
      canvas.add(group);
      canvas.setActiveObject(group);
      saveState();
    };
    document.getElementById('btnAddPin').onclick = () => {
      const pin = new fabric.Circle({
        radius: 15,
        fill: '#ef4444',
        stroke: '#ffffff',
        strokeWidth: 3,
        shadow: new fabric.Shadow({
          color: 'rgba(0,0,0,0.3)',
          offsetX: 2,
          offsetY: 4,
          blur: 4
        }),
        left: CANVAS_WIDTH / 2,
        top: CANVAS_HEIGHT / 2,
        originX: 'center',
        originY: 'center'
      });
      canvas.add(pin);
      canvas.setActiveObject(pin);
      saveState();
    };
    // --- 画像保存 ---
    document.getElementById('btnExport').onclick = () => {
      canvas.discardActiveObject();
      canvas.renderAll();
      const a = document.createElement('a');
      a.download = `クラス係ポスター_${new Date().toLocaleDateString('ja-JP').replace(/\//g,'')}.jpg`;
      a.href = canvas.toDataURL({
        format: 'jpeg',
        quality: 1
      });
      a.click();
    };
    // 初期起動
    document.getElementById('bgGrid').click();
  </script>
</body>

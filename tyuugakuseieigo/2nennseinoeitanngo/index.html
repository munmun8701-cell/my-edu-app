<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>むん先生の英語クエスト｜中2の単語</title>
<style>
:root{--bg:#050812;--panel:#0c1530;--line:#1d3a6b;--cyan:#00f0ff;--mag:#ff2e9a;--lime:#b6ff3b;--yel:#ffe14d;--txt:#e6f1ff;--mute:#8aa0c8}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--txt);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;min-height:100vh;line-height:1.6;
background-image:linear-gradient(rgba(0,240,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.05) 1px,transparent 1px);background-size:32px 32px}
header.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;background:rgba(5,8,18,.92);border-bottom:1px solid var(--line)}
.logo{font-weight:800;color:var(--cyan);text-shadow:0 0 10px rgba(0,240,255,.6);letter-spacing:.04em}
.logo small{display:block;color:var(--mute);font-weight:400;font-size:.72rem;text-shadow:none}
.score{color:var(--yel);font-weight:700;text-shadow:0 0 8px rgba(255,225,77,.5)}
.screen{display:none;max-width:720px;margin:0 auto;padding:16px 16px 40px}
.screen.active{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 0 18px rgba(0,240,255,.07)}
h2{margin:.2em 0 .4em;color:var(--cyan);font-size:1.3rem}
h3{margin:.2em 0 .5em;font-size:1rem}
.kicker{color:var(--mag);font-size:.85rem;font-weight:700;letter-spacing:.08em}
.muted{color:var(--mute);font-size:.9rem}
.center{text-align:center}
.big{font-size:2.4rem;text-align:center;color:var(--yel);text-shadow:0 0 14px rgba(255,225,77,.6);letter-spacing:.2em}
button{font:inherit;color:var(--cyan);background:transparent;border:2px solid var(--cyan);border-radius:12px;padding:10px 14px;min-height:48px;cursor:pointer;transition:transform .08s,box-shadow .15s}
button:hover{box-shadow:0 0 12px rgba(0,240,255,.45)}
button:active{transform:scale(.97)}
button:disabled{opacity:.9;cursor:default;box-shadow:none}
button.primary{background:var(--cyan);color:#001018;font-weight:800;box-shadow:0 0 14px rgba(0,240,255,.55)}
button.ghost{border-color:var(--line);color:var(--mute)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btn-row button{flex:1 1 auto}
.back{border-color:var(--line);color:var(--mute);margin-bottom:8px}
.stage-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:10px 0;border-color:var(--cyan);color:var(--txt);background:var(--panel)}
.stage-card .num{flex:0 0 44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--cyan);color:#001018;font-weight:800;font-size:1.1rem;box-shadow:0 0 12px var(--cyan)}
.stage-card .info{display:flex;flex-direction:column}
.stage-card small{color:var(--mute)}
.stage-card.locked{border-color:var(--line);opacity:.55}
.stage-card.locked .num{background:var(--line);box-shadow:none;color:var(--mute)}
.stage-card.boss{border-color:var(--mag)}
.stage-card.boss .num{background:var(--mag);box-shadow:0 0 14px var(--mag);color:#fff}
.stage-card.perfect .num{background:var(--yel);box-shadow:0 0 14px var(--yel)}
.stars{color:var(--yel);letter-spacing:.1em}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.progress{height:8px;border-radius:99px;background:#08102a;border:1px solid var(--line);overflow:hidden}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--mag));transition:width .3s}
.q-ja{font-size:1.1rem;color:var(--mute);margin-bottom:6px}
.q-en{font-size:1.5rem;font-weight:700;margin:10px 0 16px;word-break:break-word;color:#fff}
.choices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.choice{width:100%;font-size:1.1rem;font-weight:700;border-color:var(--cyan)}
.choice.right{background:var(--lime);color:#0a1200;border-color:var(--lime);box-shadow:0 0 14px var(--lime)}
.choice.wrong{border-color:var(--mag);color:var(--mag);box-shadow:0 0 12px var(--mag)}
.slot{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:56px}
.chip{border-color:var(--mag);color:var(--txt);font-weight:700;padding:8px 12px;min-height:44px;background:#101a36}
.chip.on{background:rgba(255,46,154,.15)}
.ph{color:var(--mute);font-size:.9rem}
.typein{width:100%;font:inherit;font-size:1.25rem;padding:12px;border-radius:12px;border:2px solid var(--cyan);background:#071022;color:#fff;margin-top:8px}
.fb{margin-top:14px;border:2px solid var(--line);border-radius:14px;padding:12px;background:#08102a}
.fb.ok{border-color:var(--lime)}
.fb.ng{border-color:var(--mag)}
.fb-title{font-weight:800;font-size:1.15rem;margin-bottom:4px}
.fb.ok .fb-title{color:var(--lime)}
.fb.ng .fb-title{color:var(--mag)}
.ans{color:var(--yel)}
.hint{margin-top:8px}
.point{background:#08102a;border-left:4px solid var(--mag);border-radius:8px;padding:12px 14px;line-height:1.9}
.ex{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.ex:last-child{border-bottom:none}
.ex-ja{color:var(--mute);font-size:.92rem}
.ex-en{font-size:1.1rem;font-weight:700}
.ex button{grid-column:2;grid-row:1/3;min-height:44px;padding:8px 12px}
mark{background:none;color:var(--mag);font-weight:800;text-shadow:0 0 8px rgba(255,46,154,.6)}
.tagrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bar{height:12px;background:#08102a;border-radius:99px;overflow:hidden;border:1px solid var(--line);margin:6px 0}
.bar span{display:block;height:100%;width:0;background:var(--lime);box-shadow:0 0 10px var(--lime);transition:width .4s}
.bar span.lo{background:var(--mag);box-shadow:0 0 10px var(--mag)}
.bar span.mid{background:var(--yel);box-shadow:0 0 10px var(--yel)}
.tagwrap{display:flex;flex-wrap:wrap;gap:8px}
.tagbtn{min-height:40px;padding:6px 12px;border-color:var(--mag);color:var(--mag);font-size:.95rem}
.foot{color:var(--mute);font-size:.8rem;text-align:center;margin:24px 0}
@media (max-width:480px){.choices{grid-template-columns:1fr 1fr}}

</style>
<style>
  .col1{grid-template-columns:1fr !important}
  .q-word{font-size:2rem;font-weight:800;color:#fff;margin:10px 0 14px;text-align:center}
  .q-ja-big{font-size:1.5rem;font-weight:800;color:#fff;margin:10px 0 14px;text-align:center}
  .center-btn{display:flex;justify-content:center;margin:8px 0}
  .ex-en{font-size:1.1rem;font-weight:700}
  .ex-ja{color:var(--mute);font-size:.92rem}
  .grp{margin:18px 4px 6px;color:#7ff;font-size:1.05rem;font-weight:800}
</style>
</head>
<body>
<header class="top">
  <div class="logo">むん先生の英語クエスト<small>中2の単語 ｜ 通信なし・きろくはこの端末だけに保存</small></div>
  <div class="score">★ <span id="totalStars">0</span></div>
</header>

<main>
  <section id="scr-home" class="screen">
    <div class="card">
      <div class="kicker">VOCABULARY</div>
      <h2>中2の単語トレーニング</h2>
      <p class="muted">中2で習う単語500語を、50の単元（10語ずつ）で練習します。単元ごとに「おぼえる」→「れんしゅう」の順で進めましょう。<br>聞いて選ぶ練習もあります。🔊で英語の発音を聞けます。</p>
    </div>
    <div id="stageList"></div>
    <div class="btn-row"><button id="toMap">🗺 苦手マップ</button></div>
    <div class="btn-row"><button class="ghost" id="resetBtn">きろくをリセット</button></div>
  </section>

  <section id="scr-stage" class="screen"><div id="stageBody"></div></section>

  <section id="scr-learn" class="screen"><div id="learnBody"></div></section>

  <section id="scr-quiz" class="screen">
    <div class="qhead"><span id="qLabel" class="kicker"></span><button class="ghost" id="quitBtn">やめる</button></div>
    <div class="qhead"><span class="muted" id="qCount"></span></div>
    <div class="progress"><span id="qProg"></span></div>
    <div class="card" id="qBox"></div>
  </section>

  <section id="scr-result" class="screen"><div id="resultBody"></div></section>

  <section id="scr-map" class="screen"><div id="mapBody"></div></section>
</main>

<p class="foot">むん先生の学習クエスト ｜ 中2の単語 ｜ 通信は使いません</p>

{g:"科学・社会", name:"社会・世界の問題", words:[

{g:"科学・社会", name:"天気・災害", words:[

{g:"自然・生き物", name:"自然", words:[

{g:"自然・生き物", name:"生き物", words:[

{g:"大切なことば", name:"心・人生", words:[

]},
{g:"大切なことば", name:"いろいろな名詞", words:[
  {en:"way", ja:"方法", ex:"This is the best way to learn English."},
  {en:"reason", ja:"理由", ex:"Tell me the reason."},
  {en:"example", ja:"例", ex:"Can you give me an example?"},
  {en:"part", ja:"部分", ex:"The first part of the movie was boring."},
  {en:"place", ja:"場所", ex:"This is my favorite place."},

  {en:"page", ja:"ページ", ex:"Open your books to page 20."},
  {en:"piece", ja:"1切れ", ex:"Can I have a piece of cake?"},
  {en:"group", ja:"集団", ex:"We worked in groups."}
]}
);

</script>
<script>
// 中2の単語：アプリの動作（通信なし・きろくは端末内のlocalStorageのみ）
const $ = id => document.getElementById(id);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => s.toLowerCase().replace(/[.,!?'’"]/g, '').replace(/\s+/g, ' ').trim();
const starsFor = p => p >= 90 ? 3 : p >= 75 ? 2 : p >= 60 ? 1 : 0;
const starStr = n => '★'.repeat(n) + '☆'.repeat(3 - n);
const LVS = [1, 2, 3, 4];
const LVN = {1:'★1 日本語→英語（3択）', 2:'★2 英語→日本語（3択）', 3:'★3 聞いて選ぶ（3択）', 4:'★4 英語を書く（入力）'};

const ALLW = STAGES.flatMap((s, si) => s.words.map(w => ({...w, si, stage: s.name})));

// ---- きろく（端末内のみ）----
const KEY = 'munmun-eigo-vocab-g2-v1';
let P;
try { P = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { P = {}; }
P.st = P.st || {};
P.tags = P.tags || {};
function saveP() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }
function stBest(si, lv) { return (P.st[si] && P.st[si][lv]) || {stars:0, pct:0}; }
function stageStars(si) { return Math.max(...LVS.map(lv => stBest(si, lv).stars)); }
function totalStars() { let t = 0; STAGES.forEach((_, si) => LVS.forEach(lv => { t += stBest(si, lv).stars; })); return t; }
function recordTag(tag, ok) { const r = P.tags[tag] || {c:0, t:0}; r.t += 1; if (ok) r.c += 1; P.tags[tag] = r; saveP(); }

// ---- 共通の部品 ----
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'scr-' + id));
  $('totalStars').textContent = totalStars();
  window.scrollTo(0, 0);
}
function mk(html, cls, fn) {
  const b = document.createElement('button');
  if (cls) b.className = cls;
  b.innerHTML = html;
  if (fn) b.onclick = fn;
  return b;
}
function card(html) { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = html; return d; }
function goHome() { renderHome(); show('home'); }
function speak(t) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = 'en-US'; u.rate = 0.85;
  speechSynthesis.speak(u);
}
let AC = null;
function beep(ok) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime;
    const seq = ok ? [660, 880, 1320] : [220, 160];
    seq.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = ok ? 'triangle' : 'sawtooth';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i * 0.09);
      g.gain.exponentialRampToValueAtTime(0.12, t + i * 0.09 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + 0.12);
      o.connect(g).connect(AC.destination);
      o.start(t + i * 0.09); o.stop(t + i * 0.09 + 0.13);
    });
  } catch (e) {}
}

// ---- ホーム ----
function renderHome() {
  const list = $('stageList');
  list.innerHTML = '';
  let lastG = '';
  STAGES.forEach((s, si) => {
    if (s.g !== lastG) {
      lastG = s.g;
      const h = document.createElement('h3');
      h.className = 'grp';
      h.textContent = s.g;
      list.appendChild(h);
    }
    const bs = stageStars(si);
    list.appendChild(mk(`<span class="num">${si + 1}</span><span class="info"><b>${s.name}</b><small><span class="stars">${starStr(bs)}</span>　${s.words.length}語</small></span>`,
      'stage-card' + (bs === 3 ? ' perfect' : ''), () => openStage(si)));
  });
}

// ---- 単元（おぼえる・レベル選択）----
function openStage(si) {
  const s = STAGES[si];
  const body = $('stageBody');
  body.innerHTML = '';
  body.append(mk('← ホーム', 'back', goHome));
  body.append(card(`<div class="kicker">単元 ${si + 1}</div><h2>${s.name}</h2><p class="muted">まずは「おぼえる」で単語を確認してから、れんしゅうをしよう。</p>`));
  const row = document.createElement('div'); row.className = 'btn-row';
  row.append(mk('📖 おぼえる', 'primary', () => openLearn(si)));
  body.append(row);
  body.append(card('<h3>れんしゅうをえらぶ</h3>'));
  LVS.forEach(lv => {
    const r = stBest(si, lv);
    body.append(mk(`<span class="num">${lv}</span><span class="info"><b>${LVN[lv]}</b><small><span class="stars">${starStr(r.stars)}</span>　${r.pct ? 'ベスト ' + r.pct + '%' : 'まだ挑戦していません'}</small></span>`,
      'stage-card', () => startLevel(si, lv)));
  });
  show('stage');
}

// ---- おぼえる ----
function openLearn(si) {
  const s = STAGES[si];
  const body = $('learnBody');
  body.innerHTML = '';
  body.append(mk('← 単元へ', 'back', () => openStage(si)));
  body.append(card(`<div class="kicker">おぼえる｜単元 ${si + 1}</div><h2>${s.name}</h2><p class="muted">🔊 を押すと英語の発音を聞けます。</p>`));
  const box = card('');
  s.words.forEach(w => {
    const row = document.createElement('div'); row.className = 'ex';
    row.innerHTML = `<div class="ex-ja">${w.ja}</div><div class="ex-en">${w.en}</div><div class="muted">${w.ex}</div>`;
    row.append(mk('🔊', '', () => speak(w.en)));
    box.append(row);
  });
  body.append(box);
  const row = document.createElement('div'); row.className = 'btn-row';
  row.append(mk('✏️ れんしゅうへ', 'primary', () => openStage(si)));
  body.append(row);
  show('learn');
}

// ---- 苦手マップ（単元ごとの正答率）----
function openMap() {
  const body = $('mapBody');
  body.innerHTML = '';
  body.append(mk('← ホーム', 'back', goHome));
  const rows = STAGES.map((s, si) => ({si, name: s.name, r: P.tags[s.name]}))
    .filter(x => x.r && x.r.t > 0)
    .map(x => ({...x, pct: Math.round(x.r.c / x.r.t * 100)}))
    .sort((a, b) => a.pct - b.pct);
  body.append(card(`<div class="kicker">苦手マップ</div><h2>単元ごとの正答率</h2>
    <p class="muted">赤は苦手、黄色はもう少し、緑は得意です。苦手な単元は「おぼえる」で見直しましょう。</p>` +
    (rows.length ? '' : '<p class="muted">まだデータがありません。単元のれんしゅうをしてみよう！</p>')));
  rows.forEach(x => {
    const cls = x.pct < 60 ? 'lo' : x.pct < 80 ? 'mid' : '';
    const c = card(`<div class="tagrow"><b>${x.name}</b><span>${x.pct}%</span></div>
      <div class="bar"><span class="${cls}" style="width:${x.pct}%"></span></div>
      <div class="tagrow"><small class="muted">${x.r.c}/${x.r.t}問</small></div>`);
    c.append(mk('📖 この単元を見直す', '', () => openLearn(x.si)));
    body.append(c);
  });
  show('map');
}

// ---- クイズ ----
let Q = null;
function startLevel(si, lv) {
  const s = STAGES[si];
  const list = shuffle(s.words.map(w => ({...w, si, stage: s.name})));
  Q = {ctx:{si, lv, label:`${s.name}｜${LVN[lv]}`}, label:`${s.name}｜${LVN[lv]}`, list, i:0, c:0, wrong:[], answered:false};
  show('quiz');
  renderQ();
}
function nextQ() { if (!Q) return; Q.i++; renderQ(); }

// 同じ項目（英語 or 日本語）の、まちがいの選択肢を2つ選ぶ
function distract(w, key) {
  const vals = [];
  shuffle(ALLW.filter(x => x[key] !== w[key])).forEach(x => {
    if (vals.length < 2 && !vals.includes(x[key])) vals.push(x[key]);
  });
  return vals;
}

function renderQ() {
  if (Q.i >= Q.list.length) return finishQuiz();
  const w = Q.list[Q.i], lv = Q.ctx.lv;
  Q.answered = false;
  $('qLabel').textContent = Q.label;
  $('qCount').textContent = `${Q.i + 1} / ${Q.list.length}`;
  $('qProg').style.width = (Q.i / Q.list.length * 100) + '%';
  const box = $('qBox');
  box.innerHTML = '';

  if (lv === 4) {
    box.innerHTML = `<div class="q-ja-big">「${w.ja}」を英語で書こう</div>
      <input id="typeIn" class="typein" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="英語で入力してね">
      <div class="btn-row"><button id="btnHint">💡 ヒント</button><button class="primary" id="btnCheckType">こたえる</button></div>
      <div id="hintBox"></div><div id="fb"></div>`;
    $('btnHint').onclick = () => { $('hintBox').innerHTML = `<div class="hint">💡 最初の文字は「${w.en[0]}」、全部で${w.en.length}文字（スペースを含む）</div>`; };
    $('btnCheckType').onclick = () => { if (!Q.answered) judge(norm($('typeIn').value) === norm(w.en), w.en, w); };
    setTimeout(() => { const i = $('typeIn'); if (i) i.focus(); }, 50);
    return;
  }

  let question, choices, correct;
  if (lv === 1) {
    box.innerHTML = `<div class="q-ja-big">「${w.ja}」は英語で？</div>`;
    correct = w.en; choices = shuffle([w.en, ...distract(w, 'en')]);
  } else if (lv === 2) {
    box.innerHTML = `<div class="q-word">${w.en}</div><div class="q-ja-big">この英語の意味は？</div>`;
    correct = w.ja; choices = shuffle([w.ja, ...distract(w, 'ja')]);
  } else {
    box.innerHTML = `<div class="center-btn"><button class="primary" id="btnSpeak">🔊 もう一度聞く</button></div><div class="q-ja-big">聞こえた英語の意味は？</div>`;
    $('btnSpeak').onclick = () => speak(w.en);
    setTimeout(() => speak(w.en), 200);
    correct = w.ja; choices = shuffle([w.ja, ...distract(w, 'ja')]);
  }
  const wrap = document.createElement('div');
  wrap.className = 'choices col1'; wrap.id = 'choices';
  box.append(wrap);
  const fb = document.createElement('div'); fb.id = 'fb'; box.append(fb);
  choices.forEach(o => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = o;
    b.onclick = () => answerChoice(b, o, correct, w);
    wrap.appendChild(b);
  });
}

function answerChoice(btn, o, correct, w) {
  if (Q.answered) return;
  const ok = o === correct;
  document.querySelectorAll('#choices .choice').forEach(c => {
    c.disabled = true;
    if (c.textContent === correct) c.classList.add('right');
  });
  if (!ok) btn.classList.add('wrong');
  judge(ok, correct, w);
}

function judge(ok, correctText, w) {
  if (Q.answered) return;
  Q.answered = true;
  if (ok) Q.c += 1; else Q.wrong.push(w.en);
  recordTag(w.stage, ok);
  beep(ok);
  document.querySelectorAll('#qBox input').forEach(i => i.disabled = true);
  const last = Q.i + 1 >= Q.list.length;
  const fb = document.createElement('div');
  fb.className = 'fb ' + (ok ? 'ok' : 'ng');
  fb.innerHTML = `<div class="fb-title">${ok ? '⭕ せいかい！' : '❌ おしい！'}</div>` +
    (ok ? '' : `<div>正解：<b class="ans">${correctText}</b></div>`) +
    `<div class="hint">📝 ${w.en} ＝ ${w.ja}<br>例文：${w.ex}</div>`;
  const row = document.createElement('div'); row.className = 'btn-row';
  row.append(mk('🔊 もういちど聞く', '', () => speak(w.en)));
  row.append(mk(last ? 'けっかを見る ▶' : 'つぎへ ▶', 'primary', nextQ));
  fb.append(row);
  const holder = $('fb');
  if (holder) holder.replaceWith(fb);
  speak(w.en);
}

function finishQuiz() {
  const n = Q.list.length, pct = Math.round(Q.c / n * 100), stars = starsFor(pct), ctx = Q.ctx;
  const prev = stBest(ctx.si, ctx.lv);
  P.st[ctx.si] = P.st[ctx.si] || {};
  P.st[ctx.si][ctx.lv] = {stars: Math.max(prev.stars, stars), pct: Math.max(prev.pct, pct)};
  saveP();
  renderResult({pct, stars, c: Q.c, n, wrong: [...new Set(Q.wrong)], ctx});
  Q = null;
}

function renderResult(r) {
  const body = $('resultBody');
  body.innerHTML = '';
  const msg = r.pct >= 90 ? 'かんぺき！単語をしっかりおぼえています。'
    : r.pct >= 75 ? 'よくできました！'
    : r.pct >= 60 ? 'クリア！まちがえた単語をもう一度見直そう。'
    : 'だいじょうぶ。おぼえるで単語と発音を確かめてから、もう一度チャレンジしよう！';
  body.append(card(`<div class="kicker">けっか｜${r.ctx.label}</div><div class="big">${starStr(r.stars)}</div>
    <p class="center"><b style="font-size:1.6rem">${r.pct}%</b><br>${r.c} / ${r.n} 問 正解</p><p class="center">${msg}</p>`));
  if (r.wrong.length) {
    const c = card('<h3>🔍 まちがえた単語</h3>');
    const wrap = document.createElement('div'); wrap.className = 'tagwrap';
    r.wrong.forEach(en => {
      const w = ALLW.find(x => x.en === en);
      wrap.append(mk(`${w.en}（${w.ja}）`, 'tagbtn', () => speak(w.en)));
    });
    c.append(wrap);
    c.append(mk('📖 単元のおぼえるへ', 'primary', () => openLearn(r.ctx.si)));
    body.append(c);
  } else {
    body.append(card('<h3>🎉 まちがいなし！</h3><p class="muted">次のれんしゅうにチャレンジしよう！</p>'));
  }
  const row = document.createElement('div'); row.className = 'btn-row';
  row.append(mk('🔁 もう一度', 'primary', () => startLevel(r.ctx.si, r.ctx.lv)));
  if (r.ctx.lv < 4) row.append(mk('▶ つぎのレベル', '', () => startLevel(r.ctx.si, r.ctx.lv + 1)));
  row.append(mk('🗺 単元へ', '', () => openStage(r.ctx.si)));
  row.append(mk('🏠 ホームへ', 'ghost', goHome));
  body.append(row);
  show('result');
}

// ---- キーボード（Enterで次へ・答え合わせ）----
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !Q || e.target.tagName === 'BUTTON') return;
  if (!$('scr-quiz').classList.contains('active')) return;
  if (Q.answered) nextQ();
  else if ($('btnCheckType')) $('btnCheckType').click();
});

// ---- 初期化 ----
$('toMap').onclick = openMap;
$('quitBtn').onclick = () => { Q = null; goHome(); };
let resetArmed = 0;
$('resetBtn').onclick = () => {
  const b = $('resetBtn');
  if (Date.now() - resetArmed < 4000) {
    P = {st: {}, tags: {}};
    saveP();
    resetArmed = 0;
    b.textContent = 'きろくをリセット';
    goHome();
    return;
  }
  resetArmed = Date.now();
  b.textContent = 'もう一度押すと消えます';
};
goHome();

</script>

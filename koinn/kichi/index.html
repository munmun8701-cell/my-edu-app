<script type="module">
import * as THREE from 'three';
try { await Promise.race([document.fonts.load('900 60px "M PLUS Rounded 1c"'), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}

/* =========================================================
   保存
   ・mun_coins … サイト全体のコイン（買い物のときだけ へります）
   ・mun_kichi … ひみつ基地の へや・もちもの（この端末の中だけ）
   ・mun_world_avatar … むんワールドの キャラクター（読むだけ）
   ・mun_lab … むんラボの トロフィー・賞状（読むだけ）
========================================================= */
const LS = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const J = (k, d) => { try { const v = JSON.parse(LS.get(k)); return v == null ? d : v; } catch (e) { return d; } };
const SJ = (k, v) => LS.set(k, JSON.stringify(v));
const coins = () => parseInt(LS.get('mun_coins')) || 0;
const expv = () => parseInt(LS.get('mun_exp')) || 0;
const lvl = () => Math.floor(expv() / 100) + 1;
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const LOW = isTouch;
const ITEMS = { aura: [{ id: 'cyan', c: '#00e5ff' }, { id: 'pink', c: '#ec4899' }, { id: 'green', c: '#10b981' }, { id: 'gold', c: '#fbbf24' }, { id: 'rainbow', c: '#ffffff' }] };
const AV = Object.assign({ type: 'neko', body: '#00e5ff', fur: '#ffd166', hair: '#3b2a1a', hairStyle: 'short', eye: 'maru', cheek: true, hat: 'none', acc: 'scarf', pet: 'none', aura: 'cyan', name: '' }, J('mun_world_avatar', {}));
const LAB = J('mun_lab', {}) || {};
const WST = J('mun_world_state', {}) || {};

/* =========================================================
   three.js の ざいりょう
========================================================= */
const matCache = {};
function mat(color, o = {}) {
  const k = color + JSON.stringify(o);
  if (!matCache[k]) matCache[k] = new THREE.MeshStandardMaterial(Object.assign({ color, roughness: .6 }, o));
  return matCache[k];
}
const basic = (color, o = {}) => new THREE.MeshBasicMaterial(Object.assign({ color }, o));
function darker(hex, k = .7) { const c = new THREE.Color(hex); c.multiplyScalar(k); return '#' + c.getHexString(); }
function mesh(geo, m, x = 0, y = 0, z = 0, parent) { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); if (!LOW) o.castShadow = true; if (parent) parent.add(o); return o; }

/* ---- まるい 光のつぶ（キラキラ・雪で使う） ---- */
const dotTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.45, 'rgba(255,255,255,.9)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); const t = new THREE.CanvasTexture(c); return t; })();
const dotMat = (color, size, opacity = 1) => new THREE.PointsMaterial({ color, size, map: dotTex, transparent: true, opacity, depthWrite: false });

/* ---- 文字ラベル（スプライト） ---- */
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
const FONT = '"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif';
function makeLabel(text, sub, color, scale = 1) {
  const c = document.createElement('canvas'); const W = 640, H = 200; c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(5,9,20,.82)'; roundRect(g, 10, 20, W - 20, H - 40, 40); g.fill();
  g.strokeStyle = color; g.lineWidth = 8; roundRect(g, 10, 20, W - 20, H - 40, 40); g.stroke();
  g.fillStyle = '#fff'; g.font = `900 60px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  let fs = 60; while (g.measureText(text).width > W - 70 && fs > 30) { fs -= 4; g.font = `900 ${fs}px ${FONT}`; }
  g.fillText(text, W / 2, sub ? 82 : H / 2);
  if (sub) { g.fillStyle = color; g.font = `700 34px ${FONT}`; g.fillText(sub, W / 2, 142); }
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  s.scale.set(9.6 * scale, 3 * scale, 1);
  return s;
}
function makeEmoji(emoji, size = 2.2) {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  g.font = '190px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(emoji, 128, 140);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false })); s.scale.set(size, size, 1); return s;
}
// ふきだし（なかまの せりふ）
function makeBubble(text) {
  const c = document.createElement('canvas'); const W = 720, H = 300; c.width = W; c.height = H; const g = c.getContext('2d');
  g.font = `800 40px ${FONT}`;
  const lines = []; let cur = '';
  for (const ch of text) { if (g.measureText(cur + ch).width > W - 90) { lines.push(cur); cur = ch; } else cur += ch; }
  if (cur) lines.push(cur);
  const L = lines.slice(0, 4), bh = 60 + L.length * 52;
  g.fillStyle = 'rgba(255,255,255,.96)'; roundRect(g, 10, 10, W - 20, bh, 36); g.fill();
  g.beginPath(); g.moveTo(W / 2 - 24, bh + 8); g.lineTo(W / 2 + 24, bh + 8); g.lineTo(W / 2, bh + 44); g.closePath(); g.fill();
  g.fillStyle = '#0f172a'; g.textAlign = 'center'; g.textBaseline = 'middle';
  L.forEach((l, i) => g.fillText(l, W / 2, 10 + 30 + 26 + i * 52 - (L.length > 1 ? 0 : 0)));
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false }));
  s.scale.set(7.2, 3, 1); s.renderOrder = 10; return s;
}

/* =========================================================
   キャラクターを組み立てる
   （VRoid などの 3Dモデルに 入れかえるときは、この関数の かわりを 作ります）
========================================================= */
const G = {
  cap: (r, l) => new THREE.CapsuleGeometry(r, l, 4, 10),
  sph: r => new THREE.SphereGeometry(r, 18, 14),
  cone: (r, h, s = 12) => new THREE.ConeGeometry(r, h, s),
  box: (x, y, z) => new THREE.BoxGeometry(x, y, z),
  cyl: (a, b, h, s = 16) => new THREE.CylinderGeometry(a, b, h, s),
  tor: (r, t, a = Math.PI * 2) => new THREE.TorusGeometry(r, t, 8, 24, a)
};
function buildAvatar(cfg, opt = {}) {
  const root = new THREE.Group();
  const P = {};
  const bodyM = mat(cfg.body, { emissive: new THREE.Color(cfg.body).multiplyScalar(.12) });
  const furM = mat(cfg.fur, { roughness: .7, emissive: new THREE.Color(cfg.fur).multiplyScalar(.16) });
  const t = cfg.type;
  const black = mat('#111827', { roughness: .3 });
  // 足
  const legM = t === 'pengin' ? mat('#f59e0b') : mat(darker(cfg.body, .55));
  for (const s of [-1, 1]) {
    const pv = new THREE.Group(); pv.position.set(s * .2, .62, 0); root.add(pv);
    mesh(G.cap(.14, .32), legM, 0, -.3, 0, pv);
    mesh(G.sph(.16), legM, 0, -.5, .07, pv).scale.set(1, .6, 1.4);
    P[s < 0 ? 'legL' : 'legR'] = pv;
  }
  // からだ
  const body = t === 'robot' ? mesh(G.box(.95, .9, .7), mat(cfg.body, { metalness: .6, roughness: .35 }), 0, 1.08, 0, root)
    : mesh(G.cap(.45, .45), bodyM, 0, 1.08, 0, root);
  P.body = body;
  if (t === 'pengin') mesh(G.sph(.4), mat('#ffffff'), 0, 1.05, .14, root).scale.set(.9, 1.05, .8);
  // うで
  const armM = (t === 'pengin') ? furM : (t === 'robot' ? mat('#94a3b8', { metalness: .6, roughness: .3 }) : bodyM);
  for (const s of [-1, 1]) {
    const pv = new THREE.Group(); pv.position.set(s * .52, 1.42, 0); pv.rotation.z = s * .18; root.add(pv);
    if (t === 'pengin') mesh(G.sph(.2), armM, 0, -.32, 0, pv).scale.set(.45, 1.4, .9);
    else { mesh(G.cap(.12, .38), armM, 0, -.3, 0, pv); mesh(G.sph(.14), (t === 'hito') ? furM : (t === 'robot' ? armM : furM), 0, -.56, 0, pv); }
    P[s < 0 ? 'armL' : 'armR'] = pv;
  }
  // 頭
  const head = new THREE.Group(); head.position.y = 2.0; root.add(head); P.head = head;
  if (t === 'robot') {
    mesh(G.box(1.0, .9, .9), mat('#cbd5e1', { metalness: .5, roughness: .3 }), 0, 0, 0, head);
    mesh(G.box(.8, .28, .05), basic(cfg.fur), 0, .05, .46, head);
    mesh(G.cyl(.03, .03, .4, 6), mat('#64748b'), 0, .62, 0, head);
    mesh(G.sph(.1), basic(cfg.body), 0, .86, 0, head);
    for (const s of [-1, 1]) mesh(G.cyl(.14, .14, .14, 12), mat('#64748b'), s * .55, 0, 0, head).rotation.z = Math.PI / 2;
  } else {
    mesh(G.sph(.55), furM, 0, 0, 0, head);
    // 目
    for (const s of [-1, 1]) {
      const x = s * .2, y = .05, z = .49;
      if (cfg.eye === 'nikkori') { const e = mesh(G.tor(.08, .022, Math.PI), black, x, y - .02, z + .02, head); }
      else if (cfg.eye === 'neboke') { mesh(G.sph(.08), black, x, y - .02, z, head).scale.set(1.1, .3, .6); }
      else {
        mesh(G.sph(cfg.eye === 'kira' ? .1 : .075), black, x, y, z, head);
        if (cfg.eye === 'kira') { mesh(G.sph(.035), basic('#ffffff'), x + .03, y + .04, z + .08, head); }
      }
    }
    if (cfg.cheek) for (const s of [-1, 1]) { const ck = mesh(new THREE.CircleGeometry(.085, 16), basic('#fb7185', { transparent: true, opacity: .75 }), s * .32, -.1, .45, head); ck.rotation.y = s * .55; ck.castShadow = false; }
    // 口
    if (t !== 'pengin') { const m = mesh(G.tor(.06, .015, Math.PI), black, 0, -.12, .52, head); m.rotation.z = Math.PI; }
    // 種類ごと

function starShape(r) {

  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; const x = Math.cos(a) * rr, y = -Math.sin(a) * rr; i ? s.lineTo(x, y) : s.moveTo(x, y); }

}

const cell = (x, z) => [x - N / 2 + .5, z - N / 2 + .5];
const dims = (it, r) => (r % 2 ? [it.d || 1, it.w] : [it.w, it.d || 1]);
const objs = new Map(); // uid -> group
function placeObject(p) {
  const it = BY[p.id]; if (!it) return;
  const g = buildItem(p.id);
  if (it.wall) {
    // かべ：p.side = 'n'（おく）か 'w'（左）、p.k = はしからの マス
    const w = it.w;
    if (p.side === 'w') { g.position.set(-N / 2 + .06, 1.4, -N / 2 + p.k + w / 2); g.rotation.y = Math.PI / 2; }
    else { g.position.set(-N / 2 + p.k + w / 2, 1.4, -N / 2 + .06); }
  } else {
    const [w, d] = dims(it, p.r || 0); const cx = p.x + w / 2 - N / 2, cz = p.z + d / 2 - N / 2;
    g.position.set(cx, 0, cz); g.rotation.y = -(p.r || 0) * Math.PI / 2;

  g.userData.uid = p.u; g.traverse(o => { o.userData.uid = p.u; });

}

function occupied(ignoreU) {

  for (const p of K.placed) { const it = BY[p.id]; if (!it || it.wall || it.flat || p.u === ignoreU) continue; const [w, d] = dims(it, p.r || 0); for (let i = 0; i < w; i++) for (let j = 0; j < d; j++) if (o[p.z + j]) o[p.z + j][p.x + i] = 1; }

}

  const it = BY[id]; const [w, d] = dims(it, r);
  if (x < 0 || z < 0 || x + w > N || z + d > N) return false;
  if (it.flat) return true;
  const o = occupied(ignoreU);
  for (let i = 0; i < w; i++) for (let j = 0; j < d; j++) if (o[z + j][x + i]) return false;

}

  for (const p of K.placed) { if (p.u === ignoreU) continue; const it = BY[p.id]; if (!it || !it.wall || p.side !== side) continue; if (k < p.k + it.w && p.k < k + w) return false; }
  return true;
}

  if (it.wall) { const w = it.w; if (p.side === 'w') { ghost.position.set(-N / 2 + .08, 1.4, -N / 2 + p.k + w / 2); ghost.rotation.y = Math.PI / 2; } else { ghost.position.set(-N / 2 + p.k + w / 2, 1.4, -N / 2 + .08); ghost.rotation.y = 0; } place.ok = canWall(place.id, place.side, place.k, place.moving); }

  ghost.traverse(o => { if (o.isMesh && o.material.emissive) { o.material.emissive.copy(col).multiplyScalar(.45); } });

function confirmPlace() {

  const it = BY[place.id];
  if (place.moving) { const p = K.placed.find(q => q.u === place.moving); Object.assign(p, it.wall ? { side: place.side, k: place.k } : { x: place.x, z: place.z, r: place.r }); removeObject(p.u); placeObject(p); }

function endPlace() { if (place && place.moving && !objs.has(place.moving)) { const q = K.placed.find(x => x.u === place.moving); if (q) placeObject(q); }
  if (ghost) room.remove(ghost); ghost = null; place = null; pbar.classList.remove('on'); mode = editOn ? 'edit' : 'view'; setHint(editOn ? 'うごかしたい 物を タップしてね' : ''); }

}

function select(u) {
  clearSel(); const p = K.placed.find(q => q.u === u); if (!p) return; sel = p; const it = BY[p.id];
  selBox = new THREE.BoxHelper(objs.get(u), 0x00e5ff); room.add(selBox);
  pbar.innerHTML = `<b>${it.e} ${esc(it.name)}</b>${it.wall ? '' : '<button class="btn sub" type="button" id="sb-r">🔄 まわす</button>'}<button class="btn" type="button" id="sb-m">✋ うごかす</button><button class="btn red" type="button" id="sb-s">🎒 しまう</button><button class="btn sub" type="button" id="sb-x">✕</button>`;
  pbar.classList.add('on'); SND.play('pop');
  if (!it.wall) $('#sb-r').onclick = () => { const r = ((p.r || 0) + 1) % 4; if (!canPlace(p.id, p.x, p.z, r, p.u)) { toast('ここでは まわせないよ'); SND.play('ng'); return; } p.r = r; removeObject(p.u); placeObject(p); saveK(); select(p.u); };
  $('#sb-m').onclick = () => { const q = sel; clearSel(); removeObject(q.u); startPlace(q.id, q); };
  $('#sb-s').onclick = () => { removeObject(p.u); K.placed = K.placed.filter(q => q !== p); K.inv[p.id] = (K.inv[p.id] || 0) + 1; saveK(); clearSel(); toast(`${it.e} ${it.name} を もちものに しまったよ`); SND.play('pop'); };
  $('#sb-x').onclick = clearSel;
}

/* ---- タップ ---- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function hitAt(x, y) { ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); return ray; }
function pointerToPlace(x, y) {
  const r = hitAt(x, y), it = BY[place.id];
  if (it.wall) {
    const h = r.intersectObjects([wallN, wallW], false)[0]; if (!h) return false;
    if (h.object === wallN) { place.side = 'n'; place.k = Math.max(0, Math.min(N - it.w, Math.floor(h.point.x + N / 2 - it.w / 2 + .5))); }
    else { place.side = 'w'; place.k = Math.max(0, Math.min(N - it.w, Math.floor(h.point.z + N / 2 - it.w / 2 + .5))); }
  } else {
    const h = r.intersectObject(floor, false)[0]; if (!h) return false;
    const [w, d] = dims(it, place.r);
    place.x = Math.floor(h.point.x + N / 2 - w / 2 + .5); place.z = Math.floor(h.point.z + N / 2 - d / 2 + .5); clampPlace();
  }
  updateGhost(); return true;
}
let drag = false, dragId = null, lx = 0, ly = 0, moved = 0;
const pts = new Map(); let pinch0 = 0, dist0 = 0;
canvas.addEventListener('pointerdown', e => { pts.set(e.pointerId, [e.clientX, e.clientY]); if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); dist0 = dist; } drag = true; dragId = e.pointerId; lx = e.clientX; ly = e.clientY; moved = 0; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (pts.has(e.pointerId)) pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); dist = Math.max(9, Math.min(56, dist0 * pinch0 / d)); moved = 99; return; }
  if (!drag && mode === 'place' && !isTouch) { pointerToPlace(e.clientX, e.clientY); return; }
  if (!drag || e.pointerId !== dragId) return;
  const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
  if (moved > 8) { yaw = Math.max(-.2, Math.min(Math.PI / 2 + .2, yaw - dx * .006)); pitch = Math.max(.25, Math.min(1.25, pitch + dy * .004)); }
});
canvas.addEventListener('pointerup', e => { pts.delete(e.pointerId); if (e.pointerId !== dragId) return; drag = false; if (moved < 8) onTap(e.clientX, e.clientY); });
canvas.addEventListener('pointercancel', e => { pts.delete(e.pointerId); drag = false; });
canvas.addEventListener('wheel', e => { dist = Math.max(9, Math.min(56, dist + e.deltaY * .012)); }, { passive: true });
function onTap(x, y) {
  if (photo) return;
  if (mode === 'place') { if (pointerToPlace(x, y) && !isTouch && place.ok) confirmPlace(); return; }
  const r = hitAt(x, y);
  const h = r.intersectObjects([...objs.values()], true)[0];
  if (mode === 'edit') { if (h && h.object.userData.uid) select(h.object.userData.uid); else clearSel(); return; }
  // ふつうの時：家具を タップすると キャラが 反応、ゲートは ワールドへ
  if (h && h.object.userData.uid) {
    const p = K.placed.find(q => q.u === h.object.userData.uid);
    if (p && p.id === 'portal') { ask('🌀', 'むんワールドへ 行きますか？', () => { location.href = '../../world.html'; }); return; }
    if (p) { const it = BY[p.id]; toast(`${it.e} ${it.name}`); emote = 1.2; SND.play('pop'); }
  }
  const fh = r.intersectObject(floor, false)[0];
  if (fh) walkTo = new THREE.Vector3(Math.max(-N / 2 + .5, Math.min(N / 2 - .5, fh.point.x)), 0, Math.max(-N / 2 + .5, Math.min(N / 2 - .5, fh.point.z)));
}

/* ---- 下のボタン ---- */
let lightOn = K.light !== false, photo = false;
function applyLight() {
  hemi.intensity = lightOn ? 1.1 : .18; sun.intensity = lightOn ? 1.3 : .08;
  renderer.toneMappingExposure = lightOn ? 1 : 1.25; scene.background.set(lightOn ? 0x0b1026 : 0x02030a);
}
document.querySelectorAll('.db').forEach(b => b.addEventListener('click', () => {
  const a = b.dataset.act;
  if (mode === 'place') endPlace();
  if (a === 'shop') { panelKind === 'shop' ? closePanel() : openShop(); }
  if (a === 'inv') { panelKind === 'inv' ? closePanel() : openInv(); }
  if (a === 'theme') { panelKind === 'theme' ? closePanel() : openTheme(); }
  if (a === 'edit') { closePanel(); toggleEdit(); }
  if (a === 'light') { lightOn = !lightOn; K.light = lightOn; saveK(); applyLight(); SND.play('pop'); toast(lightOn ? '💡 でんきを つけた' : '🌙 でんきを けした。光る家具が きれいだよ'); }
  if (a === 'photo') { closePanel(); toggleEdit(false); photo = true; document.body.classList.add('photo'); toast('ドラッグで 角度を きめて「とる」を おしてね'); }
}));
$('#photo-x').onclick = () => { photo = false; document.body.classList.remove('photo'); };
$('#shutter').onclick = () => {
  renderer.render(scene, camera);
  const out = document.createElement('canvas'); out.width = canvas.width; out.height = canvas.height; const g = out.getContext('2d'); g.drawImage(canvas, 0, 0);
  const s = out.height / 900, d = new Date(); g.fillStyle = 'rgba(5,9,20,.7)'; roundRect(g, 20 * s, out.height - 90 * s, 560 * s, 70 * s, 20 * s); g.fill();
  g.fillStyle = '#fff'; g.font = `900 ${28 * s}px ${FONT}`; g.textBaseline = 'middle'; g.fillText(`${$('#t-name').textContent}  ${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`, 40 * s, out.height - 55 * s);
  const a = document.createElement('a'); a.download = `himitsukichi_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.png`; a.href = out.toDataURL('image/png'); a.click();
  const f = $('#flash'); f.classList.add('on'); setTimeout(() => f.classList.remove('on'), 60);
};
addEventListener('keydown', e => { if (e.key === 'Escape') { if (mode === 'place') endPlace(); else if (panelKind) closePanel(); else if (editOn) toggleEdit(false); } if ((e.key === 'r' || e.key === 'R') && mode === 'place' && !BY[place.id].wall) { place.r = (place.r + 1) % 4; clampPlace(); updateGhost(); } });
addEventListener('storage', e => { if (e.key === 'mun_coins') refreshCoin(); });

/* =========================================================
   ループ
========================================================= */
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, clock.getDelta()), t = clock.elapsedTime;
  for (const f of ANIM) f(t);
  // 歩く
  let moving = false;
  if (walkTo) { const dx = walkTo.x - player.position.x, dz = walkTo.z - player.position.z, d = Math.hypot(dx, dz); if (d < .08) walkTo = null; else { const sp = Math.min(d, 2.6 * dt); player.position.x += dx / d * sp; player.position.z += dz / d * sp; player.rotation.y = Math.atan2(dx, dz); walkT += dt * 10; moving = true; } }
  const P = avatar.userData.P;
  if (P) {
    const sw = moving ? Math.sin(walkT) * .7 : 0; P.legL.rotation.x = sw; P.legR.rotation.x = -sw; P.armL.rotation.x = -sw * .8; P.armR.rotation.x = sw * .8;
    if (emote > 0) { emote -= dt; P.armR.rotation.x = 0; P.armR.rotation.z = -2.6 + Math.sin(t * 12) * .35; avatar.position.y = Math.abs(Math.sin(t * 10)) * .15; } else { P.armR.rotation.z = -.18; avatar.position.y = moving ? Math.abs(Math.sin(walkT)) * .06 : 0; }
    if (P.tail) P.tail.rotation.z = Math.sin(t * 4) * .15; if (P.aura) { P.aura.rotation.z = t; if (P.rainbow) P.aura.material.color.setHSL((t * .25) % 1, .9, .6); }
  }
  if (pet) { const bx = player.position.x - Math.sin(player.rotation.y) * .9 + .5, bz = player.position.z - Math.cos(player.rotation.y) * .9; pet.position.x += (bx - pet.position.x) * Math.min(1, dt * 4); pet.position.z += (bz - pet.position.z) * Math.min(1, dt * 4); pet.position.y = (pet.userData.fly ? pet.userData.fly * .55 + Math.sin(t * 3) * .1 : Math.abs(Math.sin(t * 6)) * (moving ? .15 : .03)); pet.rotation.y = Math.atan2(player.position.x - pet.position.x, player.position.z - pet.position.z); if (pet.userData.rotors) pet.userData.rotors.forEach((r, i) => r.rotation.y = t * 30 + i); }
  if (selBox) selBox.update();
  placeCam();
  renderer.render(scene, camera);
}

/* ---- はじめ ---- */
applyTheme(); applyLight(); rebuildAll(); updatePlate(); refreshCoin(); placeCam(); loop();
$('#ld').textContent = 'じゅんびOK！';
$('#start').onclick = () => {
  $('#intro').style.display = 'none'; SND.play('buy');
  if (firstVisit) setTimeout(() => toast('🎁 はじめての プレゼント！ ベッド・つくえ・いす・しょくぶつ・ラグを おいたよ', 4200), 300);
  else toast('おかえり！ ショップで 家具を ふやそう', 2600);
};

</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060a18">
<title>そろばん（整数・小数の表し方と加減）｜むん先生の学習クエスト 4年算数</title>
<style>
:root{
  --bg:#060a18; --panel:#0f1830; --panel2:#131f3f; --panel3:#1a2852;
  --line:#25356a; --line2:#34488a;
  --ink:#f1f5ff; --ink2:#c2cdea; --muted:#8a97bd;
  --cyan:#22d3ee; --cyan2:#67e8f9; --mag:#f472b6; --lime:#a3e635; --amber:#fbbf24; --orange:#fb923c; --violet:#a78bfa;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --none:#4a5578;
  --ok:#4ade80; --ng:#fb7185;
  --lv1:#a3e635; --lv2:#22d3ee; --lv3:#fb923c;
  --r:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Meiryo",system-ui,sans-serif;
  line-height:1.65;
  background-image:
    radial-gradient(1100px 520px at 85% -10%,rgba(34,211,238,.13),transparent 60%),
    radial-gradient(900px 480px at -10% 110%,rgba(244,114,182,.10),transparent 60%),
    linear-gradient(rgba(34,211,238,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(34,211,238,.045) 1px,transparent 1px);
  background-size:auto,auto,32px 32px,32px 32px;
  min-height:100vh}
button{font-family:inherit}
b{font-weight:800}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
.center{text-align:center}
.muted{color:var(--muted)}
.mt{margin-top:14px}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 16px;
  background:rgba(6,10,24,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--ink);cursor:pointer;padding:4px;text-align:left}
.brand .logo{width:30px;height:30px;flex:0 0 30px}
.brand b{display:block;letter-spacing:.14em;color:var(--cyan);font-size:.95rem;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:.72rem;line-height:1.2}
.spacer{flex:1}
.stat{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);padding:4px 12px;border-radius:999px;font-weight:800;white-space:nowrap}
.stat .xpbar{width:46px;height:6px;border-radius:3px;background:#0a1330;overflow:hidden}
.stat .xpbar i{display:block;height:100%;background:var(--cyan)}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:1.15rem;cursor:pointer}
.icon-btn:hover{border-color:var(--cyan)}

/* ---------- buttons ---------- */
.btn{appearance:none;border:0;border-radius:12px;padding:10px 20px;font-size:1rem;font-weight:800;cursor:pointer;min-height:48px;
  color:#03141b;background:var(--cyan);box-shadow:0 6px 18px rgba(34,211,238,.22);transition:transform .08s,filter .2s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line2);box-shadow:none}
.btn.mag{background:var(--mag);color:#2a0716;box-shadow:0 6px 18px rgba(244,114,182,.22)}
.btn.lime{background:var(--lime);color:#142000;box-shadow:0 6px 18px rgba(163,230,53,.2)}
.btn.hint{background:rgba(251,191,36,.10);color:var(--amber);border:1.5px solid rgba(251,191,36,.55);box-shadow:none}
.btn.sm{min-height:42px;padding:6px 14px;font-size:.92rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}

/* ---------- depth chips ---------- */
.depth{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.depth .lbl{color:var(--ink2);font-weight:800;font-size:.9rem;align-self:center;margin-right:4px}
.chip{border:1.5px solid var(--line2);background:var(--panel);color:var(--ink2);border-radius:14px;padding:6px 14px;
  font-size:1rem;font-weight:800;cursor:pointer;min-height:48px;text-align:left;line-height:1.3}
.chip small{display:block;font-size:.7rem;font-weight:700;opacity:.85}
.chip[data-lv="1"].on{border-color:var(--lv1);color:#132000;background:var(--lv1)}
.chip[data-lv="2"].on{border-color:var(--lv2);color:#03141b;background:var(--lv2)}
.chip[data-lv="3"].on{border-color:var(--lv3);color:#2a1100;background:var(--lv3)}
.lvtag{display:inline-block;border-radius:999px;padding:2px 12px;font-weight:800;font-size:.85rem}
.lvtag.lv1{background:var(--lv1);color:#132000}.lvtag.lv2{background:var(--lv2);color:#03141b}.lvtag.lv3{background:var(--lv3);color:#2a1100}

/* ---------- hero / map ---------- */
.hero{position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--line);
  background:linear-gradient(160deg,#101a3a 0%,#0a1026 60%,#160d2e 100%);padding:22px 22px 120px;margin-bottom:18px}
.hero-city{position:absolute;left:0;right:0;bottom:0;height:130px;pointer-events:none;opacity:.95}
.hero-city svg{width:100%;height:100%;display:block}
.hero-in{position:relative;z-index:1}
.kicker{color:var(--cyan);font-weight:800;letter-spacing:.14em;font-size:.8rem}
.hero h1{margin:4px 0 6px;font-size:2rem;line-height:1.25}
.hero h1 span{display:block;font-size:1.05rem;color:var(--ink2);font-weight:700}
.hero .lead{margin:0 0 14px;color:var(--ink2)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:18px}
.qcardx{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center}
.qcardx .tx{flex:1}
.qcardx .tx b{display:block}
.qcardx .tx small{color:var(--muted)}
.sec-title{font-size:1.1rem;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.sec-title::before{content:"";width:8px;height:22px;border-radius:3px;background:var(--cyan)}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.stage{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;text-align:left;color:inherit;
  font-size:1rem;position:relative;transition:border-color .2s,transform .1s;display:flex;flex-direction:column;gap:6px}
.stage:hover{border-color:var(--cyan)}
.stage:active{transform:scale(.99)}
.stage .no{color:var(--cyan);font-weight:800;font-size:.8rem;letter-spacing:.08em}
.stage h3{margin:0;font-size:1.05rem;line-height:1.4}
.stage .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:.78rem}
.tk{border:1px solid var(--line2);border-radius:999px;padding:1px 8px;color:var(--muted)}
.tk.on{border-color:var(--ok);color:var(--ok)}
.stars{display:flex;gap:4px;font-size:1.1rem;letter-spacing:1px}
.stars .s{color:#2c3a66}
.stars .s.on1{color:var(--lv1)}.stars .s.on2{color:var(--lv2)}.stars .s.on3{color:var(--lv3)}
.stage.boss{border-color:rgba(244,114,182,.55);background:linear-gradient(135deg,rgba(244,114,182,.14),var(--panel) 60%)}
@media (min-width:760px){.stage.boss{grid-column:span 2}}
.stage .stline{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--ink2)}
.dotst{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 10px}
.teacher-note{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;color:var(--ink2);font-size:.9rem}
.teacher-note summary{cursor:pointer;font-weight:800;color:var(--ink)}

/* ---------- lesson shell ---------- */
.crumb{margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap}
.lesson-head{background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px}
.lno{display:inline-block;font-weight:800;color:var(--cyan);letter-spacing:.1em;font-size:.85rem}
.lesson-head h2{margin:0;font-size:1.45rem;line-height:1.35}
.meate{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--cyan);background:rgba(34,211,238,.07);border-radius:12px;padding:8px 12px;font-weight:800}
.meate .mk{flex:0 0 auto;background:var(--cyan);color:#03141b;border-radius:8px;padding:0 8px;font-size:.85rem;margin-top:2px}
.tabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--line);border-bottom:3px solid transparent;border-radius:12px 12px 0 0;
  color:var(--ink2);padding:12px 8px;font-size:.98rem;font-weight:800;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--cyan);background:var(--panel2)}
.tab .ck{color:var(--ok);margin-left:4px}
.tabbody{background:var(--panel2);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);padding:18px;min-height:320px}

/* ---------- steps ---------- */
.scene{margin-bottom:12px}
.step{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;animation:fadeIn .35s ease-out}
.step.active{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.13)}
.step.chal{border-color:var(--lv3);box-shadow:0 0 0 3px rgba(251,146,60,.13)}
.step-title{display:flex;gap:10px;align-items:center;font-weight:800;font-size:1.1rem;margin-bottom:10px}
.qn{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border-radius:9px;background:rgba(251,146,60,.14);color:var(--orange);border:1.5px solid var(--orange);font-weight:800;flex:0 0 auto}
.eqline{text-align:center;font-weight:800;font-size:1.2rem;margin:8px 0}
.ex{color:var(--cyan2);white-space:nowrap;font-weight:800}
.warnbox{background:rgba(251,113,133,.08);border:1.5px solid rgba(251,113,133,.6);border-radius:12px;padding:10px 14px;font-weight:800;text-align:center;margin:8px 0}
.found{text-align:center;margin-top:6px;font-weight:700}

/* ---------- talk ---------- */
.talk{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.talk .av{flex:0 0 54px;text-align:center;font-size:.72rem;color:var(--ink2);font-weight:800;line-height:1.2}
.talk .av svg{display:block;margin:0 auto 2px}
.talk .bub{position:relative;background:var(--panel3);border:1.5px solid var(--line2);border-radius:14px;padding:10px 44px 10px 14px;font-weight:700;flex:1;min-height:48px}
.talk.navi .bub{border-color:rgba(34,211,238,.55)}
.talk.piko .bub{border-color:rgba(244,114,182,.55)}
.talk.dot .bub{border-color:rgba(251,146,60,.55)}
.say{position:absolute;right:6px;top:6px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);cursor:pointer;font-size:.95rem}

/* ---------- ask ---------- */
.askbox{margin:10px 0}
.ask{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:1.2rem;font-weight:800;justify-content:center}
.nin{width:3.3em;min-height:50px;font-size:1.25rem;font-weight:800;text-align:center;border-radius:10px;border:2px solid var(--line2);background:#0a1330;color:var(--cyan2);font-family:inherit}
.nin.w4{width:4.3em}
.nin.w6{width:5.4em}
.nin.w8{width:7.2em}
.nin.w12{width:10.6em}
.nin:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.25)}
.nin.ok{border-color:var(--ok);color:var(--ok);background:rgba(74,222,128,.08)}
.nin.ng{border-color:var(--ng);color:var(--ng);background:rgba(251,113,133,.08);animation:shake .35s}
.nin.shown{border-color:var(--amber);color:var(--amber)}
.nin:disabled{opacity:1}
.slot{display:inline-grid;place-items:center;min-width:2.6em;min-height:50px;border:2px dashed var(--line2);border-radius:10px;color:var(--muted);padding:0 8px}
.slot.cur{border-color:var(--amber);color:var(--amber);animation:glow 1.4s infinite}
.slot.ok{border-style:solid;border-color:var(--ok);color:var(--ok)}
.ask-ctrl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.choices{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
.choice{min-width:80px;min-height:56px;padding:6px 14px;font-size:1.1rem;font-weight:800;border-radius:12px;border:2px solid var(--line2);background:var(--panel3);color:var(--ink);cursor:pointer}
.choice:hover{border-color:var(--cyan)}
.choice.ng{border-color:var(--ng);color:var(--ng);opacity:.55}
.choice.ok{border-color:var(--ok);background:rgba(74,222,128,.12);color:var(--ok)}
.fb{min-height:1.6em;font-weight:800;margin-top:8px;text-align:center}
.fb.ok{color:var(--ok)}.fb.ng{color:var(--ng)}
.hintbox{background:rgba(251,191,36,.08);border:1.5px dashed rgba(251,191,36,.6);color:#fde68a;border-radius:12px;padding:10px 14px;font-weight:700;margin:10px 0}
.matome{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--lime);background:rgba(163,230,53,.07);border-radius:14px;padding:12px 16px;font-weight:800;margin-top:12px;animation:pop .45s}
.matome .mtag{flex:0 0 auto;background:var(--lime);color:#132000;border-radius:8px;padding:0 8px;font-size:.82rem;margin-top:3px}

/* ---------- 図・操作 ---------- */
.dotpanel{display:flex;justify-content:center;margin:6px auto}
.dotpanel svg{max-width:100%;height:auto;overflow:visible;user-select:none;-webkit-user-select:none}
.slider{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:800;margin:6px 0;flex-wrap:wrap}
.slider input{width:min(320px,60vw);accent-color:var(--cyan);height:32px}
.slider .sv{font-size:1.3rem;color:var(--cyan2);min-width:3em;text-align:center}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.cmp-card{background:var(--panel2);border:1.5px solid var(--line2);border-radius:14px;padding:12px}
.cmp-card.piko{border-color:rgba(244,114,182,.5)}
.cmp-card.dot{border-color:rgba(251,146,60,.5)}
.cmp-card.navi{border-color:rgba(34,211,238,.5)}
.cmp-card .ask{font-size:1.05rem}
.cmp-card .nin{min-height:44px;font-size:1.05rem}
.cmp-name{display:flex;align-items:center;gap:8px;font-weight:800}
.info-line{background:#0a1330;border:1.5px solid var(--line2);border-radius:12px;padding:8px 12px;text-align:center;font-weight:700;margin:6px 0}

/* ---------- practice ---------- */
.prac-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.pips{display:flex;gap:6px}
.pips i{width:26px;height:10px;border-radius:5px;background:#24335f}
.pips i.cur{background:var(--amber)}
.pips i.ok{background:var(--ok)}
.pips i.ng{background:var(--ng)}
.qcard{background:var(--panel);border:1.5px solid var(--cyan);border-radius:16px;padding:16px;animation:fadeIn .3s}
.qmeta{color:var(--muted);font-weight:800;font-size:.85rem}
.qprompt{position:relative;font-weight:800;font-size:1.15rem;margin:6px 0 4px;padding-right:44px}
.qprompt .say{top:0}
.qexp{background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.4);border-radius:12px;padding:10px 14px;margin-top:10px;font-weight:700}
.result{text-align:center}
.result .score{font-size:2.6rem;font-weight:900;line-height:1.1}
.result .score small{font-size:1rem;color:var(--ink2)}
.bigstar{font-size:2.2rem}

/* ---------- boss ---------- */
.boss-stage{display:grid;justify-items:center;gap:6px;margin-bottom:10px}
.boss{width:min(220px,55vw);height:auto}
.boss.hit{animation:bossHit .5s}
.boss.win{animation:bossDown 1s forwards}
.hpbar{width:min(420px,90%);height:16px;border-radius:8px;background:#2a1030;border:1px solid #6b2d5c;overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mag),#f9a8d4);transition:width .5s}
.flash{animation:flashRed .5s}

/* ---------- report ---------- */
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h3{margin:0 0 2px;font-size:1.08rem}
.card .sub{color:var(--muted);font-size:.85rem;margin-bottom:10px}
.card.wide{grid-column:1/-1}
.radar{width:100%;max-width:440px;display:block;margin:0 auto}
.skrow{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.skrow .badge,.skrow .btn,.skrow .skval{justify-self:end}
.skmeta{color:var(--muted);font-size:.82rem}
.skval.dim{color:var(--muted)}
.skrow:first-child{border-top:0}
.skname{font-weight:800}
.skname small{color:var(--muted);font-weight:700;margin-left:6px}
.bar{position:relative;height:14px;background:#0a1330;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:0 4px 4px 0}
.skval{font-weight:900;font-size:1.05rem;font-variant-numeric:tabular-nums}
.lvdots{font-size:.85rem;letter-spacing:2px}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.85rem}
.tagrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.tagrow:first-of-type{border-top:0}
.tagcnt{flex:0 0 auto;min-width:46px;text-align:center;border-radius:10px;background:var(--panel3);font-weight:900;padding:4px 6px}
.reco{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.reco:first-of-type{border-top:0}
.reco .tx{flex:1;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.reflect label{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1.5px solid var(--line2);border-radius:12px;margin:6px 0;font-weight:700;cursor:pointer;min-height:48px}
.reflect input[type=checkbox],.reflect input[type=radio]{width:22px;height:22px;accent-color:var(--cyan)}
textarea{width:100%;min-height:96px;background:#0a1330;color:var(--ink);border:1.5px solid var(--line2);border-radius:12px;font-family:inherit;font-size:1rem;padding:10px}

/* ---------- blackboard ---------- */
.board-note{color:var(--muted);font-size:.85rem;margin-bottom:8px}
.board{background:#1d4a34;background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.05),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(0,0,0,.18),transparent 60%);
  border:12px solid #7a4a24;border-radius:10px;padding:18px;color:#f4f1e8;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;
  box-shadow:inset 0 0 40px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.4);font-size:1rem;line-height:1.7}
.board .col{border-right:1px dashed rgba(255,255,255,.25);padding-right:14px;display:flex;flex-direction:column;gap:8px}
.board .col:last-child{border-right:0;padding-right:0}
.bb-date{font-weight:800;opacity:.9}
.bb-q{background:#f4f1e8;color:#14261c;display:inline-block;padding:2px 10px;font-weight:800;width:fit-content}
.bb-meate{border:2px solid #fde047;border-radius:6px;padding:4px 8px;font-weight:800;color:#fef9c3}
.bb-meate .qm{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:2px solid #fde047;margin-right:6px;font-size:.8rem}
.bb-sub{font-weight:800;text-decoration:underline;text-underline-offset:4px}
.bb-matome{border:2px solid #fef08a;border-radius:8px;padding:6px 10px;font-weight:800;background:rgba(254,240,138,.06)}
.bb-matome::before{content:"まとめ ";color:#fde047}
.cy{color:#fde047}.cp{color:#f9a8d4}.cb{color:#93c5fd}
.chalk svg{max-width:100%;height:auto}

/* ---------- modal / toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;z-index:50;padding:16px;animation:fadeIn .2s}
.modal{background:var(--panel2);border:1px solid var(--line2);border-radius:18px;max-width:580px;width:100%;padding:18px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 8px}
.modal section{border-top:1px solid var(--line);padding:12px 0}
.modal section:first-of-type{border-top:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel3);border:1.5px solid var(--cyan);padding:10px 18px;border-radius:14px;font-weight:800;z-index:60;animation:toastIn .3s;max-width:92vw;text-align:center}
.coinpop{position:fixed;z-index:70;font-weight:900;color:var(--amber);pointer-events:none;animation:coinUp 1.1s ease-out forwards;text-shadow:0 0 8px rgba(251,191,36,.6);font-size:1.2rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.94);opacity:0}60%{transform:scale(1.02);opacity:1}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-4px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.0)}50%{box-shadow:0 0 0 4px rgba(251,191,36,.25)}}
@keyframes coinUp{0%{opacity:0;transform:translateY(0) scale(.8)}20%{opacity:1;transform:translateY(-10px) scale(1.1)}100%{opacity:0;transform:translateY(-60px) scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes bossHit{0%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-3deg);filter:brightness(2)}40%{transform:translateX(10px) rotate(3deg)}60%{transform:translateX(-6px)}100%{transform:none}}
@keyframes bossDown{to{transform:translateY(30px) scale(.6) rotate(-12deg);opacity:0}}
@keyframes flashRed{0%{box-shadow:inset 0 0 0 0 rgba(251,113,133,0)}30%{box-shadow:inset 0 0 0 6px rgba(251,113,133,.7)}100%{box-shadow:inset 0 0 0 0 rgba(251,113,133,0)}}

}

.info-line:empty{display:none}

<body>
<div id="app"></div>
<noscript>このアプリは JavaScript をつかっています。</noscript>
<script>
'use strict';
/* =====================================================================
   むん先生の学習クエスト ／ 4年 算数「そろばん（整数・小数の表し方と加法・減法）」
   ---------------------------------------------------------------------
   ・1ファイルで動きます（CodePen の HTML 欄にそのまま貼れます）
   ・外部ライブラリ／外部画像なし（図はすべて SVG コードで描画）
   ・データ保存キー：munQuest_g4math_soroban_v1
     → このキーだけを読み書きします。ほかのアプリのデータには一切ふれません。
   ・単元の流れ（全2時間の指導計画に対応）
       1時間目＝そろばんで整数や小数を表す（億・兆まで） ／ 2時間目＝そろばんで小数の加法・減法 ／ まとめ＝ボスバトル
   ・そろばんは 玉を タップ／上下ドラッグで 本当に 動かせます（Soro 部品）
   ===================================================================== */

const APP_KEY = 'munQuest_g4math_soroban_v1';
const UNIT_ID = 'g4_soroban';
let S = null;
let STORAGE_OK = true;

/* ---------------- 保存 ---------------- */
function defaultState() { return { v: 1, coins: 0, xp: 0, depth: 2, units: {} }; }
function loadState() {
  let saved = null;
  try { const raw = localStorage.getItem(APP_KEY); if (raw) saved = JSON.parse(raw); }
  catch (e) { STORAGE_OK = false; }
  S = Object.assign(defaultState(), saved && typeof saved === 'object' ? saved : {});
  if (![1, 2, 3].includes(S.depth)) S.depth = 2;
}
function saveState() {
  try { localStorage.setItem(APP_KEY, JSON.stringify(S)); STORAGE_OK = true; }
  catch (e) { STORAGE_OK = false; }
}
function U() {
  if (!S.units[UNIT_ID]) S.units[UNIT_ID] = { skills: {}, lessons: {}, boss: { best: 0, cleared: false, tries: 0 }, reflect: { checks: [], best: '', text: '', saved: false } };
  return S.units[UNIT_ID];
}
function LP(id) {
  const u = U();
  if (!u.lessons[id]) u.lessons[id] = { t1: false, t2: false, st: [false, false, false] };
  return u.lessons[id];
}
function record(skill, level, ok, tag, anchor) {
  const u = U();
  const sk = u.skills[skill] || (u.skills[skill] = { n: 0, ok: 0, recent: [], tags: {}, lv: { 1: [0, 0], 2: [0, 0], 3: [0, 0] } });
  sk.n++; if (ok) sk.ok++;
  sk.recent.push(level * 10 + (ok ? 1 : 0));
  if (sk.recent.length > 20) sk.recent.shift();
  sk.lv[level][0]++; if (ok) sk.lv[level][1]++;
  if (!ok && tag) sk.tags[tag] = (sk.tags[tag] || 0) + 1;
  if (ok) addCoins(level, anchor); else saveState();
}

/* ---------------- コイン・レベル ---------------- */
function playerLevel() { return 1 + Math.floor(S.xp / 100); }
function addCoins(n, anchor) {
  const before = playerLevel();
  S.coins += n; S.xp += n * 10;
  saveState(); updateTop();
  if (anchor && anchor.getBoundingClientRect) {
    const r = anchor.getBoundingClientRect();
    const p = document.createElement('div');
    p.className = 'coinpop';
    p.innerHTML = coinSVG(18) + ' +' + n;
    p.style.left = Math.max(8, r.left + r.width / 2 - 20) + 'px';
    p.style.top = Math.max(60, r.top - 6) + 'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1200);
  }
  if (playerLevel() > before) toast('⭐ レベルアップ！ Lv.' + playerLevel() + ' になったよ！');
}
function updateTop() {
  const c = document.getElementById('coins'); if (c) c.textContent = S.coins;
  const l = document.getElementById('lv'); if (l) l.textContent = 'Lv.' + playerLevel();
  const x = document.getElementById('xpfill'); if (x) x.style.width = (S.xp % 100) + '%';
}

/* ---------------- 引きつぎコード ---------------- */
function checksum(str) { let h = 0; for (let i = 0; i < str.length; i++) { h = (h * 31 + str.charCodeAt(i)) >>> 0; } return h.toString(36).slice(-4); }
function exportCode() {
  const b = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  return 'MQ1.' + b + '.' + checksum(b);
}
function importCode(code) {
  const c = String(code || '').replace(/\s+/g, '');
  const m = c.match(/^MQ1\.([A-Za-z0-9+/=]+)\.([a-z0-9]{1,4})$/);
  if (!m) return false;
  if (checksum(m[1]) !== m[2]) return false;
  try {
    const obj = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if (!obj || typeof obj !== 'object' || obj.v !== 1) return false;
    S = Object.assign(defaultState(), obj); saveState(); return true;
  } catch (e) { return false; }
}

/* ---------------- 小さな道具 ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function el(html) { const t = document.createElement('template'); t.innerHTML = String(html).trim(); return t.content.firstElementChild; }
function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function half(s) { return String(s == null ? '' : s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[\s　,，]/g, ''); }
function today() { const d = new Date(); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
function toast(msg, ms = 2200) {
  const t = el(`<div class="toast" role="status">${msg}</div>`);
  t.style.bottom = (22 + document.querySelectorAll('.toast').length * 58) + 'px';
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function coinSVG(s = 18) {
  return `<svg viewBox="0 0 20 20" width="${s}" height="${s}" aria-hidden="true" style="vertical-align:-3px"><circle cx="10" cy="10" r="8.5" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/><circle cx="10" cy="10" r="5.5" fill="none" stroke="#fde68a" stroke-width="1"/><text x="10" y="13.5" text-anchor="middle" font-size="9" font-weight="900" fill="#7c2d12">M</text></svg>`;
}

/* ---------------- 大きい数の道具 ---------------- */
const POS = ['一', '十', '百', '千', '万', '十万', '百万', '千万', '億', '十億', '百億', '千億', '兆'];
function dig(n, p) { return Math.floor(n / Math.pow(10, p)) % 10; }
/* 4けたごとに すきまを あけて 表示（例：3250000000 → 32 5000 0000） */
function fmt4(n) { const s = String(n), g = []; for (let i = s.length; i > 0; i -= 4) g.unshift(s.slice(Math.max(0, i - 4), i)); return g.join(' '); }
/* 読み上げ用：3250000000 → 32億5000万 */
function numToJa(s) {
  s = String(s).replace(/^0+(?=\d)/, '');
  const un = ['', '万', '億', '兆'], parts = []; let i = s.length;
  while (i > 0) { parts.push(s.slice(Math.max(0, i - 4), i)); i -= 4; }
  let out = ''; for (let k = parts.length - 1; k >= 0; k--) { const v = Number(parts[k]); if (v > 0) out += v + (un[k] || ''); }
  return out || '0';
}
const nx = n => `<span class="ex">${fmt4(n)}</span>`;

/* ---------------- 読み上げ ---------------- */
const canSpeak = typeof window !== 'undefined' && 'speechSynthesis' in window;
function speakText(text) {
  if (!canSpeak) return;
  const t = String(text)
    .replace(/\d+(?:\s\d{4})+/g, m => numToJa(m.replace(/\s/g, '')))
    .replace(/\d{5,}/g, m => numToJa(m))
    .replace(/1\/10/g, '10分の1')
    .replace(/×/g, ' かける ').replace(/÷/g, ' わる ')
    .replace(/＋|\+/g, ' たす ').replace(/−/g, ' ひく ')
    .replace(/＝|=/g, ' は ').replace(/□/g, ' しかく ').replace(/？/g, '？ ');
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; u.rate = 0.92;
    speechSynthesis.speak(u);
  } catch (e) { /* 読み上げできない端末 */ }
}
function sayBtn() { return canSpeak ? '<button class="say" type="button" aria-label="よみあげ">🔊</button>' : ''; }
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.say');
  if (!b) return;
  const box = b.parentElement.cloneNode(true);
  box.querySelectorAll('.say,input,button,svg').forEach(x => x.remove());
  speakText(box.textContent);
});

/* ---------------- キャラクター（SVG コードで描画） ---------------- */
const NAMES = { navi: 'ナビ', piko: 'ピコ', dot: 'ドット' };
function avatarSVG(who, size = 48) {
  if (who === 'navi') return `<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true">
    <line x1="32" y1="5" x2="32" y2="15" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="6" r="4" fill="#67e8f9"/>
    <rect x="9" y="15" width="46" height="36" rx="15" fill="#0f1830" stroke="#22d3ee" stroke-width="3"/>
    <rect x="15" y="24" width="34" height="15" rx="7.5" fill="#22d3ee" opacity=".22"/>
    <circle cx="25" cy="31.5" r="4.2" fill="#67e8f9"/><circle cx="39" cy="31.5" r="4.2" fill="#67e8f9"/>
    <path d="M26 44 q6 4 12 0" stroke="#67e8f9" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="21" y="52" width="22" height="8" rx="4" fill="#0e7490"/></svg>`;
  if (who === 'piko') return `<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true">
    <path d="M14 22 L10 6 L24 16 Z" fill="#f472b6"/><path d="M50 22 L54 6 L40 16 Z" fill="#f472b6"/>
    <circle cx="32" cy="34" r="22" fill="#1b0f2a" stroke="#f472b6" stroke-width="3"/>
    <ellipse cx="24" cy="32" rx="4.5" ry="5.5" fill="#f9a8d4"/><ellipse cx="40" cy="32" rx="4.5" ry="5.5" fill="#f9a8d4"/>
    <circle cx="25.5" cy="30.5" r="1.6" fill="#fff"/><circle cx="41.5" cy="30.5" r="1.6" fill="#fff"/>
    <path d="M28 43 q4 3 8 0" stroke="#f9a8d4" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="17" cy="40" r="3" fill="#f472b6" opacity=".45"/><circle cx="47" cy="40" r="3" fill="#f472b6" opacity=".45"/></svg>`;
  return `<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true">
    <path d="M32 3 L27 13 H33 L29 21 L39 10 H33 L36 3 Z" fill="#fbbf24"/>
    <rect x="10" y="18" width="44" height="38" rx="9" fill="#1f130a" stroke="#fb923c" stroke-width="3"/>
    <rect x="17" y="27" width="11" height="9" rx="2" fill="#fdba74"/><rect x="36" y="27" width="11" height="9" rx="2" fill="#fdba74"/>
    <rect x="20" y="29" width="4" height="4" fill="#1f130a"/><rect x="39" y="29" width="4" height="4" fill="#1f130a"/>
    <rect x="22" y="44" width="20" height="5" rx="2.5" fill="#fb923c"/>
    <circle cx="10" cy="37" r="3.5" fill="#fb923c"/><circle cx="54" cy="37" r="3.5" fill="#fb923c"/></svg>`;
}
function talk(who, html) {
  return `<div class="talk ${who}"><div class="av">${avatarSVG(who, 46)}${NAMES[who]}</div><div class="bub">${html}${sayBtn()}</div></div>`;
}
function talkEl(who, html) { return el(talk(who, html)); }

/* =====================================================================
   Ask：□に答える部品
   ・ふかさ1（じっくり）→ えらんで答える（タップのみ）
   ・ふかさ2/3          → 数字を入力して答える（forceChoice の問題は選択式）
   ・1回目の答えだけを記録（onFirst）。まちがえたら何度でもやり直せる
   ===================================================================== */
function B(a, ch, w, ex) { const o = { a, ch, w }; if (ex != null) o.ex = ex; return o; }
function C(v, tag) { return { v: String(v), tag }; }
function autoNums(n) { return shuffle([n + 1, n - 1, n + 2, n + 10, n - 2, n - 10, n + 5].filter(x => x >= 0 && x !== n)); }
function mkChoices(correct, pairs = []) {
  const out = [C(correct)]; const seen = new Set([String(correct)]);
  for (const [v, tag] of pairs) {
    const s = String(v);
    if (seen.has(s) || (typeof v === 'number' && (v < 0 || !Number.isFinite(v)))) continue;
    seen.add(s); out.push(C(v, tag)); if (out.length >= 4) break;
  }
  if (typeof correct === 'number') for (const v of autoNums(correct)) { if (out.length >= 4) break; if (!seen.has(String(v))) { seen.add(String(v)); out.push(C(v, 'calc')); } }
  return out;
}
/* すきま・カンマを とりのぞいてから くらべる（32 5000 0000 ＝ 3250000000） */
function eqAns(v, a) {
  if (String(a) === '*') return true;
  const x = String(v).replace(/[\s,，]/g, ''), y = String(a).replace(/[\s,，]/g, '');
  const nv = Number(x), na = Number(y);
  if (x !== '' && !isNaN(nv) && !isNaN(na)) return nv === na;
  return x === y;
}
const OK_WORDS = ['せいかい！', 'すばらしい！', 'ばっちり！', 'そのとおり！', 'いいね！'];

function Ask(spec) {
  const hasSor = spec.parts.some(p => p && typeof p === 'object' && p.sor);
  const mode = hasSor ? 'input' : ((spec.forceChoice || spec.depth === 1) ? 'choice' : 'input');
  const box = document.createElement('div'); box.className = 'askbox';
  const row = document.createElement('div'); row.className = 'ask';
  const blanks = [];
  spec.parts.forEach(p => {
    if (typeof p === 'string' || typeof p === 'number') { const s = document.createElement('span'); s.innerHTML = p; row.appendChild(s); return; }
    let node;
    if (mode === 'input' && p.sor) { node = Soro(Object.assign({ interactive: true }, p.sor)); }
    else if (mode === 'input') {
      node = document.createElement('input');
      node.className = 'nin ' + (p.w || (String(p.a).length >= 3 ? 'w4' : ''));
      node.setAttribute('inputmode', 'decimal'); node.setAttribute('autocomplete', 'off'); node.setAttribute('aria-label', 'こたえ');
    } else { node = document.createElement('span'); node.className = 'slot'; node.textContent = '？'; }
    row.appendChild(node); blanks.push({ p, node });
  });
  box.appendChild(row);
  const ctrl = el('<div class="ask-ctrl"></div>');
  const fb = el('<div class="fb" aria-live="polite"></div>');
  const hintBox = el('<div class="hintbox" hidden></div>');
  let reported = false, wrongs = 0, solved = false;

  const report = (ok, vals, tag) => { if (reported) return; reported = true; if (spec.onFirst) spec.onFirst(ok, vals, tag); };
  const advice = tag => (tag && tag !== 'calc' && typeof TAGS !== 'undefined' && TAGS[tag]) ? `⚠ <b>${TAGS[tag].label}</b>かも？ ${TAGS[tag].advice}` : '';
  const showHint = extra => {
    const list = []; if (extra) list.push(extra); if (spec.hint) list.push('💡 ' + spec.hint);
    if (list.length) { hintBox.innerHTML = list.join('<br>'); hintBox.hidden = false; }
  };
  const win = vals => {
    solved = true; fb.className = 'fb ok';
    fb.innerHTML = '⭕ ' + pick(OK_WORDS) + (spec.okMsg ? ' ' + spec.okMsg : '');
    hintBox.hidden = true; if (mode === 'input') ctrl.innerHTML = ''; report(true, vals, null);
    if (spec.onOk) spec.onOk(vals);
  };

  if (mode === 'input') {
    const btn = el('<button class="btn" type="button">たしかめる</button>');
    ctrl.appendChild(btn);
    if (spec.hint) {
      const hb = el('<button class="btn hint sm" type="button">💡 ヒント</button>');
      hb.onclick = () => { if (hintBox.hidden) showHint(); else hintBox.hidden = true; };
      ctrl.appendChild(hb);
    }
    const check = () => {
      if (solved) return;
      const vals = blanks.map(b => half(b.node.value));
      if (vals.some(v => v === '')) { fb.className = 'fb'; fb.textContent = '□を ぜんぶ うめてね'; return; }
      const oks = spec.checkEach ? spec.checkEach(vals) : blanks.map((b, i) => eqAns(vals[i], b.p.a));
      blanks.forEach((b, i) => { b.node.classList.remove('ok', 'ng'); void b.node.offsetWidth; b.node.classList.add(oks[i] ? 'ok' : 'ng'); });
      if (oks.every(Boolean)) { blanks.forEach(b => b.node.disabled = true); btn.remove(); win(vals); return; }
      wrongs++;
      const wr = oks.map((o, i) => o ? -1 : i).filter(i => i >= 0);
      const tag = spec.diagnose ? (spec.diagnose(vals, wr) || 'calc') : 'calc';
      report(false, vals, tag);
      fb.className = 'fb ng';
      fb.innerHTML = '❌ ' + (spec.ngText ? spec.ngText(vals) : 'おしい！ 赤いところを もう一度 考えよう。');
      const adv = advice(tag);
      if (adv || wrongs >= 2) showHint(adv);
      if (wrongs >= 2 && spec.canReveal !== false && !ctrl.querySelector('.reveal')) {
        const rv = el('<button class="btn ghost sm reveal" type="button">こたえを見る</button>');
        rv.onclick = () => box.reveal(); ctrl.appendChild(rv);
      }
      if (spec.onWrong) spec.onWrong(vals, tag, wrongs);
    };
    btn.onclick = check;
    blanks.forEach((b, i) => b.node.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || e.isComposing) return;
      e.preventDefault();
      const nx2 = blanks[i + 1];
      if (nx2 && nx2.node.value === '') nx2.node.focus(); else check();
    }));
    box.reveal = () => {
      if (solved) return;
      blanks.forEach(b => { b.node.value = b.p.ex != null ? b.p.ex : (String(b.p.a) === '*' ? '' : b.p.a); b.node.disabled = true; b.node.classList.remove('ng'); b.node.classList.add('shown'); });
      btn.remove(); const rv = ctrl.querySelector('.reveal'); if (rv) rv.remove();
      solved = true; report(false, [], 'calc');
      fb.className = 'fb'; fb.innerHTML = '黄色が こたえだよ。つぎに いかそう！';
      if (spec.onOk) spec.onOk(null, true);
    };
  } else {
    let cur = 0;
    const chWrap = el('<div class="choices"></div>');
    const renderChoices = () => {
      chWrap.innerHTML = '';
      blanks.forEach((b, i) => b.node.classList.toggle('cur', i === cur));
      const b = blanks[cur];

const ST = {

function statusOf(score, n) { if (score == null) return 'none'; if (n < 3) return 'few'; return score >= 80 ? 'good' : score >= 50 ? 'warn' : 'crit'; }
function skillStat(sk) {
  const s = U().skills[sk];

function radarSVG(stats) {
  const N = stats.length, W = 470, H = 400, cx = 235, cy = 200, R = 118;
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / N;
  const P = (i, v) => [cx + Math.cos(ang(i)) * R * v, cy + Math.sin(ang(i)) * R * v];
  let s = `<svg class="radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="とくい度のレーダーチャート">`;
  [0.25, 0.5, 0.75, 1].forEach(v => { s += `<polygon points="${stats.map((_, i) => P(i, v).map(n => n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${v === 1 ? '#34488a' : '#22305e'}" stroke-width="1"/>`; });
  stats.forEach((_, i) => { const [x, y] = P(i, 1); s += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#22305e" stroke-width="1"/>`; });
  s += `<text x="${cx + 5}" y="${cy - R * 0.5 + 4}" class="rd-tick">50</text><text x="${cx + 5}" y="${cy - R + 12}" class="rd-tick">100</text>`;
  const pts = stats.map((st, i) => P(i, (st.score || 0) / 100));
  if (stats.some(st => st.score != null)) s += `<polygon points="${pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ')}" fill="rgba(34,211,238,.14)" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round"/>`;
  stats.forEach((st, i) => {
    const m = ST[st.status];
    if (st.score != null) { const [x, y] = pts[i]; s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6" fill="${m.color}" stroke="#0f1830" stroke-width="2"><title>${SKILLS[st.s].name}：${st.score}%</title></circle>`; }
    const a = ang(i), cs = Math.cos(a), sn = Math.sin(a);
    const lx = cx + cs * (R + 24), ly = cy + sn * (R + 24);
    const anchor = Math.abs(cs) < 0.3 ? 'middle' : (cs > 0 ? 'start' : 'end');
    const lines = SKILLS[st.s].radar, total = lines.length + 1;
    let y0 = ly - (total - 1) * 8 + 5; if (sn > 0.5) y0 = ly + 8; if (sn < -0.5) y0 = ly - (total - 1) * 16;
    const xs = lx.toFixed(1);
    s += `<text x="${xs}" y="${y0.toFixed(1)}" text-anchor="${anchor}" class="rd-lab">${lines.map((t, k) => `<tspan x="${xs}" dy="${k ? 16 : 0}">${t}</tspan>`).join('')}<tspan x="${xs}" dy="17" class="rd-val">${m.icon} ${st.score == null ? 'まだ' : st.score + '%'}</tspan></text>`;
  });
  return s + '</svg>';
}

function sorTask(host, ctx, num, title, cfg, targets, onDone) {
  const s = addStep(host, step(num, title)); let idx = 0, done = false;
  const tgt = el('<div style="font-weight:800;text-align:center;margin:6px 0;line-height:1.6"></div>'), info = el('<div class="info-line"></div>');
  const zero = () => new Array(cfg.rods).fill(0);
  const so = Soro(Object.assign({ interactive: true, onChange: v => check(v) }, cfg));
  const wrap = el('<div class="dotpanel"></div>'); wrap.append(so);
  const bar = el('<div style="display:flex;gap:8px;justify-content:center;margin-top:6px;flex-wrap:wrap"></div>');
  const bReset = el('<button class="btn ghost sm" type="button">↺ はじめに もどす</button>'), bHint = el('<button class="btn hint sm" type="button">💡 ヒント</button>');
  bar.append(bReset, bHint);
  const hintBox = el('<div class="hintbox" hidden></div>');
  s.append(tgt, wrap, bar, hintBox, info);
  function show() {
    const t = targets[idx]; tgt.innerHTML = t.msg + (targets.length > 1 ? `　<span class="muted">（${idx + 1}/${targets.length}）</span>` : '');
    so.setDigits(t.init ? t.init : zero()); hintBox.hidden = true; hintBox.innerHTML = t.hint ? '💡 ' + t.hint : ''; bHint.style.display = t.hint ? '' : 'none';
  }
  function check(v) {
    if (done) return; const t = targets[idx];
    if (Number(v) === Number(t.val)) {
      ctx.coin(1, s); idx++;
      if (idx >= targets.length) { done = true; so.lock(true); tgt.innerHTML = '⭕ ぜんぶ できた！'; bar.remove(); hintBox.hidden = true; info.innerHTML = ''; onDone(s); }
      else { info.innerHTML = '⭕ せいかい！ つぎへ…'; so.lock(true); setTimeout(() => { so.lock(false); info.innerHTML = ''; show(); }, 900); }
    }
  }
  bReset.onclick = () => { if (!done) show(); };
  bHint.onclick = () => { hintBox.hidden = !hintBox.hidden; };
  show(); return s;
}

function recommendations(stats) {
  const out = [];
  const tried = stats.filter(s => s.score != null && s.recentN >= 3).sort((a, b) => a.score - b.score);
  tried.filter(s => s.status === 'crit').slice(0, 2).forEach(s => out.push({ txt: `${lessonNo(SKILLS[s.s].lesson)}時間目「${SKILLS[s.s].name}」を <b>🌱じっくり</b> でもう一度。まずは「① 考えよう」の操作で しくみを たしかめよう。`, go: [SKILLS[s.s].lesson, 1, 1] }));
  tried.filter(s => s.status === 'warn').slice(0, 1).forEach(s => out.push({ txt: `「${SKILLS[s.s].name}」は あと少し！ <b>⚡ふつう</b> で もう1セット。`, go: [SKILLS[s.s].lesson, 3, 2] }));
  const un = stats.filter(s => s.n === 0);
  if (un.length) out.push({ txt: `まだ やっていない：${un.slice(0, 3).map(s => SKILLS[s.s].name).join('、')}${un.length > 3 ? ' など' : ''}`, go: [SKILLS[un[0].s].lesson, 1, null] });
  if (!out.length) out.push({ txt: 'すごい！ ぜんぶ「とくい」だよ。🔥チャレンジ や ボスバトル に ちょうせんしよう！', go: ['L3', 1, 3] });
  return out.slice(0, 4);
}

let VIEW = { name: 'map' };
function go(name, arg, tab) {

}
function route() {
  const h = decodeURIComponent(location.hash.slice(1)); let mm;
  if (h === 'report') VIEW = { name: 'report' };
  else if ((mm = h.match(/^(L\d+)-(\d)$/)) && LESSONS_BY[mm[1]]) VIEW = { name: 'lesson', arg: mm[1], tab: +mm[2] };
  else VIEW = { name: 'map' };
  render(); window.scrollTo(0, 0);
}
function render() {
  try { if (canSpeak) speechSynthesis.cancel(); } catch (e) { }

}
function viewLesson(m, id, tab) {
  const L = LESSONS_BY[id]; if (!L) { go('map'); return; }
  const tabs = L.tabs || DEFAULT_TABS;
  let cur = Math.min(Math.max(1, tab || 1), tabs.length);
  const crumb = el('<div class="crumb"><button class="btn ghost sm" type="button" data-c="map">◀ マップ</button><button class="btn ghost sm" type="button" data-c="report">📊 弱点チェック</button></div>');
  crumb.addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b) go(b.dataset.c); });
  const no = L.no === 3 ? 'まとめ' : L.no + '時間目';
  const head = el(`<div class="lesson-head"><span class="lno">${no}</span><h2>${L.title}</h2>
    <div class="meate"><span class="mk">めあて</span><span>${L.meate}</span></div><div class="dp"></div></div>`);
  const tabsEl = el('<div class="tabs" role="tablist"></div>'), body = el('<div class="tabbody" role="tabpanel"></div>');
  m.append(crumb, head, tabsEl, body);
  const drawDepth = () => { $('.dp', head).innerHTML = depthChips(S.depth); };
  const drawTabs = () => {
    const lp = LP(id);
    tabsEl.innerHTML = tabs.map(([lab, key], k) => {
      let ck = '';
      if (key === 't1') ck = lp.t1 ? '✓' : '';
      if (key === 'boss') ck = U().boss.cleared ? '✓' : '';
      if (key === 't2' || key === 'reflect') ck = lp.t2 ? '✓' : '';
      if (key === 'prac') ck = lp.st.map(x => x ? '★' : '').join('');
      return `<button class="tab ${k + 1 === cur ? 'on' : ''}" type="button" role="tab" aria-selected="${k + 1 === cur}" data-t="${k + 1}">${lab}${ck ? `<span class="ck">${ck}</span>` : ''}</button>`;
    }).join('');
  };
  const open = (n, scroll) => {
    cur = n; drawTabs(); body.innerHTML = '';
    try { if (canSpeak) speechSynthesis.cancel(); } catch (e) { }
    try { history.replaceState(null, '', `#${id}-${n}`); } catch (e) { }
    const key = tabs[n - 1][1], lp = LP(id);
    const was = key === 't1' ? lp.t1 : (key === 't2' || key === 'reflect') ? lp.t2 : false;
    const ctx = {
      d: S.depth, lesson: L,
      done: k => { const p = LP(id); if (!p[k]) { p[k] = true; saveState(); drawTabs(); } },
      coin: (k, anchor) => { if (!was) addCoins(k, anchor); },
      setDepth: () => drawDepth(),
      refreshTabs: () => drawTabs()
    };
    if (typeof L[key] === 'function' && key !== 'board') L[key](body, ctx);
    else if (key === 'prac') practiceTab(body, ctx, L);
    else if (key === 'board') { body.append(el('<div class="board-note">板書の例（ノートのまとめにもつかえるよ）</div>'), el(`<div class="board">${L.board()}</div>`)); }
    else if (key === 'boss') bossTab(body, ctx);
    else if (key === 'reflect') reflectTab(body, ctx);
    else if (key === 'report') renderReport(body, true);
    if (scroll) window.scrollTo({ top: tabsEl.getBoundingClientRect().top + window.scrollY - 70, behavior: 'smooth' });
  };
  tabsEl.addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b) open(+b.dataset.t, false); });
  body.addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) open(+b.dataset.tab, true); });
  head.addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    const lv = +c.dataset.lv; if (lv === S.depth) return;
    S.depth = lv; saveState(); drawDepth(); open(cur, false);
    toast(`${DEPTH[lv].icon} ${DEPTH[lv].name} にかえたよ`, 1400);
  });
  drawDepth(); open(cur, false);
}
function viewReport(m) {
  const crumb = el('<div class="crumb"><button class="btn ghost sm" type="button">◀ マップ</button></div>');
  $('button', crumb).onclick = () => go('map');
  m.append(crumb);
  renderReport(m, false);
}
function openSettings() {
  const bg = el(`<div class="modal-bg" role="dialog" aria-modal="true" aria-label="せってい"><div class="modal">
    <h3>⚙ せってい</h3>
    <section><b>ひきつぎコード</b>
      <p class="muted" style="margin:4px 0 8px;font-size:.9rem">タブレットがかわるときや、進級するときにつかうよ。「コードを出す」でコピーして、新しいタブレットの「コードを入れる」にはりつけてね。</p>
      <div class="btnrow" style="justify-content:flex-start;margin-top:0"><button class="btn sm" type="button" data-a="exp">コードを出す</button><button class="btn ghost sm" type="button" data-a="imp">コードを入れる</button></div>
      <div class="io" style="margin-top:8px"></div></section>
    <section><b>データ</b>
      <p class="muted" style="margin:4px 0 8px;font-size:.9rem">ほぞん先：このブラウザ（キー：${APP_KEY}）。ほかのアプリのデータにはふれません。${STORAGE_OK ? '' : '<br>⚠ いまはほぞんできない状態です（プライベートモードなど）。'}</p>
      <button class="btn ghost sm" type="button" data-a="reset">このアプリのデータをリセット</button><div class="rs" style="margin-top:8px"></div></section>
    <div class="center"><button class="btn" type="button" data-a="close">とじる</button></div></div></div>`);
  document.body.append(bg);
  const io = $('.io', bg), rs = $('.rs', bg);
  bg.addEventListener('click', e => {
    if (e.target === bg) { bg.remove(); return; }
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a;
    if (a === 'close') bg.remove();
    if (a === 'exp') {
      io.innerHTML = `<textarea readonly aria-label="ひきつぎコード">${exportCode()}</textarea><div class="btnrow" style="justify-content:flex-start"><button class="btn sm" type="button" data-a="copy">コピー</button></div>`;
    }
    if (a === 'copy') {
      const ta = $('textarea', io); ta.select();
      const okMsg = () => toast('コピーしたよ！');
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(okMsg, () => { try { document.execCommand('copy'); okMsg(); } catch (_) { toast('長おしして コピーしてね'); } });
      else { try { document.execCommand('copy'); okMsg(); } catch (_) { toast('長おしして コピーしてね'); } }
    }
    if (a === 'imp') {
      io.innerHTML = `<textarea placeholder="MQ1. ではじまるコードをはりつけてね" aria-label="コードを入れる"></textarea><div class="btnrow" style="justify-content:flex-start"><button class="btn sm" type="button" data-a="load">よみこむ</button></div>`;
    }
    if (a === 'load') {
      const ok = importCode($('textarea', io).value);
      if (ok) { toast('よみこんだよ！'); bg.remove(); render(); }
      else toast('コードが正しくないみたい。もう一度コピーしてね。');
    }
    if (a === 'reset') {
      rs.innerHTML = `<div class="warnbox">ほんとうにリセットする？ コイン・レベル・弱点チェックのきろくがきえるよ。<div class="btnrow"><button class="btn mag sm" type="button" data-a="doreset">はい、リセット</button><button class="btn ghost sm" type="button" data-a="noreset">やめる</button></div></div>`;
    }
    if (a === 'noreset') rs.innerHTML = '';
    if (a === 'doreset') {
      try { localStorage.removeItem(APP_KEY); } catch (_) { }
      S = defaultState(); saveState(); bg.remove(); toast('リセットしたよ'); go('map');
    }
  });
}
function boot() {
  loadState();
  const app = $('#app');
  app.innerHTML = `<header class="topbar">
      <button class="brand" type="button" data-top="map" aria-label="マップへ">${logoSVG()}<span><b>MUN QUEST</b><small>4年 算数 ／ そろばん</small></span></button>
      <div class="spacer"></div>
      <div class="stat" title="レベル">⭐ <span id="lv">Lv.1</span><span class="xpbar"><i id="xpfill"></i></span></div>
      <div class="stat" title="コイン">${coinSVG(18)} <span id="coins">0</span></div>
      <button class="icon-btn" type="button" data-top="report" aria-label="弱点チェック">📊</button>
      <button class="icon-btn" type="button" data-top="set" aria-label="せってい">⚙</button>
    </header><main id="main" class="wrap"></main>`;
  $('.topbar', app).addEventListener('click', e => {
    const b = e.target.closest('[data-top]'); if (!b) return;
    if (b.dataset.top === 'set') openSettings(); else go(b.dataset.top);
  });
  window.addEventListener('hashchange', route);
  route();
}
boot();
</script>

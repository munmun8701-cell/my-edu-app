<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>4年　　そろばん　1時間目</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
  <header>
    <div class="title-area">
      <div class="icon">🌱</div>
      <h1>そろばんシミュレーター</h1>
    </div>
    <p class="header-desc">いろいろな大きさの数を、そろばんに入れてみよう。</p>
  </header>

  <main>
    <div class="controls">
      <button class="mode-btn active" onclick="setMode('free')">自由に使う</button>
      <button class="mode-btn" onclick="setMode('q1')">練習① 人口</button>
      <button class="mode-btn" onclick="setMode('q2')">練習② 予算</button>
      <button class="mode-btn" onclick="setMode('q3')">練習③ 厚さ</button>
    </div>

    <div id="question-area" class="panel hidden">
      <div class="question-header">
        <span class="question-mark">💡</span>
        <h2>そろばんに、下の数を入れましょう。</h2>
      </div>
      <div class="question-content">
        <span id="q-number" class="highlight-number"></span>
        <span id="q-desc" class="desc-text"></span>
      </div>
      
      <div class="hint-section">
        <button id="hint-btn" onclick="showHint()">ヒントを見る</button>
        <p id="hint-text" class="hidden"></p>
      </div>
    </div>

    <div id="free-input-area" class="panel">
      <label for="free-input">好きな数を入れてみよう（全角・半角どちらでもOK）:</label>
      <input type="text" id="free-input" placeholder="例: 123.45" onchange="handleFreeInput()">
      <button onclick="handleFreeInput()">設定</button>
    </div>

    <div class="soroban-wrapper">
      <div class="soroban" id="soroban">
        <div class="beam" id="beam"></div>
        <div class="rods-container" id="rods-container"></div>
      </div>
    </div>

    <div class="display-area">
      <div class="speech-bubble">
        <p class="bubble-title">現在の数</p>
        <div id="current-val" class="current-number">0</div>
      </div>
    </div>

    <div id="success-msg" class="success-overlay hidden">
      <div class="success-box">
        <h3>🎉 大正解！ 🎉</h3>
        <p>よくできました！次の問題にも挑戦してみよう。</p>
        <button onclick="closeSuccess()">とじる</button>
      </div>
    </div>
  </main>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

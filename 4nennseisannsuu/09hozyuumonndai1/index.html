<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4年 算数 補充問題｜むん先生の学習クエスト</title>
<style>
:root{--bg:#0a1130;--panel:#121c46;--panel2:#18255a;--line:#2d3f86;--tx:#eef2ff;--sub:#9fb0e6;--cy:#22d3ee;--am:#fbbf24;--ok:#34d399;--ng:#f87171;--pk:#f472b6}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#1b2a6b,var(--bg));color:var(--tx);font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;line-height:1.6;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 80px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0}
header h1{font-size:1.1rem;margin:0;line-height:1.3}
header h1 small{display:block;color:var(--sub);font-size:.75rem;font-weight:600}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;white-space:nowrap}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:14px;padding:8px 12px;font:inherit;font-weight:800;cursor:pointer;min-width:84px;text-align:center}
.tab small{display:block;font-size:.68rem;color:var(--sub);font-weight:600}
.tab.on{background:var(--cy);color:#06223a;border-color:var(--cy)}
.tab.on small{color:#06223a}
.ttl{display:flex;align-items:center;justify-content:space-between;margin:6px 0 4px}
.ttl h2{margin:0;font-size:1.15rem}
.bar{height:8px;background:#0d1740;border-radius:99px;overflow:hidden;border:1px solid var(--line);margin:4px 0 10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--ok));width:0;transition:width .4s}
.lead{color:var(--sub);font-size:.85rem;margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.card.done{border-color:var(--ok)}
.chead{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.lv{font-weight:800;font-size:.78rem;border-radius:8px;padding:2px 8px}
.lv.A{background:#164e63;color:#a5f3fc}.lv.B{background:#5b2a6b;color:#f5d0fe}
.chead b{font-size:1rem}
.star{margin-left:auto;font-size:1.2rem;opacity:.25}.done .star{opacity:1}
.item{border-top:1px dashed var(--line);padding:10px 0}
.item:first-of-type{border-top:0}
.item.ok{background:rgba(52,211,153,.08);border-radius:10px}
.item.ng{background:rgba(248,113,113,.10);border-radius:10px}
.q{font-size:1rem;margin-bottom:6px}
.q .no{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:50%;width:1.6em;height:1.6em;text-align:center;line-height:1.5em;font-weight:800;margin-right:6px;font-size:.85em}
.flds{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.fl{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.ip{font:inherit;font-weight:800;font-size:1.05rem;color:#fff;background:#0b1440;border:2px solid var(--line);border-radius:10px;padding:6px 8px;width:5.8em;text-align:center}
.ip.w{width:8em}.ip.s{width:4.2em}
select.ip{width:auto;min-width:5em}
.ip:focus{outline:none;border-color:var(--cy)}
.ip.ok{border-color:var(--ok)}.ip.ng{border-color:var(--ng)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:800;color:var(--tx);background:#0b1440;border:2px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;min-width:2.6em}
.chip.on{background:var(--cy);color:#06223a;border-color:var(--cy)}
.chip.ok{box-shadow:0 0 0 2px var(--ok)}.chip.ng{box-shadow:0 0 0 2px var(--ng)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:9px 14px;cursor:pointer;color:#06223a;background:var(--cy)}
.btn.g{background:var(--panel2);color:var(--tx);border:1px solid var(--line)}
.msg{margin-top:8px;font-weight:800}
.msg.ok{color:var(--ok)}.msg.ng{color:var(--ng)}
.reveal{margin-top:8px;background:#0b1440;border:1px solid var(--am);border-radius:12px;padding:8px 12px;font-size:.92rem}
.reveal b{color:var(--am)}
.fig{width:100%;max-width:360px;display:block;margin:6px auto;background:#0b1440;border-radius:12px;border:1px solid var(--line)}
table.tb{border-collapse:collapse;margin:6px auto}
table.tb td,table.tb th{border:1px solid var(--line);padding:6px 12px;text-align:center;font-weight:800}
table.tb th{background:var(--panel2);color:var(--sub)}
.pyr{display:flex;flex-direction:column;align-items:center;gap:4px;margin:8px 0;font-weight:800}
.pyr div{display:flex;gap:6px}.pyr span{min-width:4.4em;text-align:center;border:1px solid var(--line);background:#0b1440;border-radius:8px;padding:4px 6px}
.pyr span.u{color:var(--am);border-color:var(--am)}
.note{color:var(--sub);font-size:.8rem}
footer{margin-top:24px;color:var(--sub);font-size:.8rem;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header><h1>むん先生の 補充問題<small>4年 算数 ／ ほじゅうの もんだい（数字は 毎回 かわります）</small></h1><div style="display:flex;gap:6px"><span class="pill" id="stars">⭐0</span><span class="pill" id="coins">🪙0</span></div></header>
<div class="tabs" id="tabs"></div>
<div id="main"></div>
<footer>△＝にている問題　◇＝少しむずかしい問題。全部 できたら ⭐と 🪙が もらえるよ！<br>あまりが ない ときは「あまり」に 0 を 入れてね。</footer>
</div>
<script>
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const fm=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const g4=n=>String(n).replace(/\B(?=(\d{4})+(?!\d))/g,' ');
const until=(f,max)=>{for(let i=0;i<(max||5000);i++){const v=f();if(v)return v}throw new Error('until failed')};
const decStr=(n,p)=>{const s=String(n).padStart(p+1,'0');return p?s.slice(0,-p)+'.'+s.slice(-p):s};
const trimD=s=>s.includes('.')?s.replace(/0+$/,'').replace(/\.$/,''):s;
const dv=(n,p)=>n/Math.pow(10,p);
const N=(ans,pre,suf,w)=>({t:'num',ans,pre:pre||'',suf:suf||'',w:w||''});
const S=(ans,opts,pre,suf)=>({t:'sel',ans,opts,pre:pre||'',suf:suf||''});
const M=(ans,opts)=>({t:'multi',ans,opts:opts.map(o=>typeof o==='object'?o:{v:String(o),l:String(o)})});
const QR=(q,r)=>[N(q,'商 '),N(r,'あまり ')];
const dig=(a,b)=>{const o=[];for(let i=a;i<=b;i++)o.push({v:String(i),l:String(i)});return o};
const roundTo=(n,p)=>Math.floor(n/p+0.5)*p;
const topRound=(n,k)=>{const l=String(n).length;return roundTo(n,Math.pow(10,l-k))};
const CIRC='①②③④⑤⑥⑦⑧';

/* ===== 単元1 1億より大きい数 ===== */
const dispW=w=>{const a=Math.floor(w/1e8),b=Math.floor(w%1e8/1e4),c=w%1e4;return (a?a+'兆':'')+(b?b+'億':'')+(c?c+'万':'')||'0'};
const w3=w=>[N(Math.floor(w/1e8),'','兆','s'),N(Math.floor(w%1e8/1e4),'','億','s'),N(w%1e8%1e4,'','万','s')];
const mulItems=(d1,d2)=>{const its=[];for(let i=0;i<3;i++){const z=i===2;let a,b;until(()=>{a=rnd(Math.pow(10,d1-1),Math.pow(10,d1)-1);b=rnd(Math.pow(10,d2-1),Math.pow(10,d2)-1);const mid=s=>String(s).slice(1,-1).includes('0');return z?(mid(a)||mid(b)):(!mid(a)&&!mid(b)&&a%10&&b%10)});its.push({q:`${fm(a)} × ${fm(b)}`,fields:[N(a*b)],exp:`${fm(a)}×${fm(b)}＝${fm(a*b)}`})}return its};
const U1=[
{lv:'A',title:'□に あてはまる数',make(){const k=rnd(120,980),m=rnd(2,9)*10+rnd(1,9),n=m*1e7;const pr=pick([['1兆','100億',100],['1兆','1000億',10],['1億','100万',100],['1億','1000万',10],['1兆','10億',1000]]);
 return{items:[{q:`1億を ${k} こ集めた数は、□億です。`,fields:[N(k,'','億')],exp:`1億が ${k}こ → ${k}億`},
 {q:`${g4(n)} は、100万を □こ集めた数です。`,fields:[N(m*10,'','こ')],exp:`${g4(n)}＝${dispW(n/1e4)}。100万が ${m*10}こ分`},
 {q:`${pr[0]}は、${pr[1]}の □倍です。`,fields:[N(pr[2],'','倍')],exp:`${pr[0]}は ${pr[1]}の ${pr[2]}倍`}]}}},
{lv:'B',title:'□に あてはまる数（少しむずかしい）',make(){const k=rnd(2,18)*10,u=pick([1,10,100]),M2=rnd(12,97)*pick([1,10,100]),n=u*M2*1e4;
 const pr=pick([['1兆','億',10000],['1億','万',10000],['1兆','万',100000000]]);
 return{items:[{q:`1000万を ${k} こ集めた数は、□億です。`,fields:[N(k/10,'','億')],exp:`1000万が10こで1億 → ${k}こで ${k/10}億`},
 {q:`${g4(n)} は、□万を ${fm(M2)} こ集めた数です。`,fields:[N(u,'','万')],exp:`${g4(n)}＝${fm(n/1e4)}万 ＝ ${u}万×${fm(M2)}`},
 {q:`${pr[0]}は、□${pr[1]} の ${fm(pr[2])}倍です。`,fields:[N(1)],exp:`${pr[0]}は 1${pr[1]}の ${fm(pr[2])}倍 → □は 1`}]}}},
{lv:'A',title:'10倍した数',make(){const bs=[rnd(11,99)*1e4,rnd(2,9)*1000*1e4,rnd(2,9)*1e8];return{items:bs.map(b=>({q:`${dispW(b)} を 10倍した数は？（ない位は 0）`,fields:w3(b*10),exp:`10倍 → ${dispW(b*10)}`}))}}},
{lv:'B',title:'1/10 にした数',make(){const bs=[rnd(11,99)*1e4,rnd(11,99)*100*1e4,rnd(2,9)*1e8+rnd(1,9)*1000*1e4];return{items:bs.map(b=>({q:`${dispW(b)} を 1/10 にした数は？（ない位は 0）`,fields:w3(b/10),exp:`1/10 → ${dispW(b/10)}`}))}}},
{lv:'A',title:'3けた × 3けた',make(){return{items:mulItems(3,3)}}},
{lv:'B',title:'4けた × 3けた',make(){return{items:mulItems(4,3)}}}
];

/* ===== 単元2 グラフや表 ===== */
const TL=['午前6時','午前8時','午前10時','午後0時','午後2時','午後4時','午後6時'];
const TOPT=TL.map(t=>({v:t,l:t}));
const IOPT=TL.slice(0,6).map((t,i)=>({v:t+'〜'+TL[i+1],l:t+'〜'+TL[i+1]}));
const mkSer=(lo,hi)=>until(()=>{const v=[rnd(lo,lo+5)];for(let i=1;i<7;i++)v.push(Math.max(lo,Math.min(hi,v[i-1]+rnd(-4,6))));const mx=Math.max(...v),mn=Math.min(...v);if(v.filter(x=>x===mx).length!==1||v.filter(x=>x===mn).length!==1)return null;const d=v.slice(1).map((x,i)=>x-v[i]);const dm=Math.max(...d),dn=Math.min(...d);if(d.filter(x=>x===dm).length!==1||dm<3||d.filter(x=>x===dn).length!==1||dn>-2)return null;return v},3000);
function lineSVG(A,B,na,nb){const x0=48,x1=322,y0=26,y1=214,X=i=>x0+i*(x1-x0)/6,Y=v=>y1-(v-10)/20*(y1-y0);let s='<svg viewBox="0 0 340 252" class="fig">';
 for(let v=10;v<=30;v++){s+=`<line x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v%5?'#1e2d6a':'#3b4fa0'}" stroke-width="${v%5?.6:1}"/>`;if(v%5===0)s+=`<text x="${x0-6}" y="${Y(v)+4}" fill="#9fb0e6" font-size="11" text-anchor="end">${v}</text>`}
 s+='<text x="6" y="14" fill="#9fb0e6" font-size="11">(度)</text>';
 TL.forEach((t,i)=>{s+=`<line x1="${X(i)}" x2="${X(i)}" y1="${y0}" y2="${y1}" stroke="#1e2d6a" stroke-width=".6"/>`;const l=t.replace('午前','').replace('午後','');s+=`<text x="${X(i)}" y="${y1+16}" fill="#9fb0e6" font-size="11" text-anchor="middle">${l.replace('時','')}</text>`});
 s+=`<text x="${X(0)-14}" y="${y1+32}" fill="#9fb0e6" font-size="10">午前</text><text x="${X(3)-8}" y="${y1+32}" fill="#9fb0e6" font-size="10">午後</text><text x="${x1+8}" y="${y1+16}" fill="#9fb0e6" font-size="10">(時)</text>`;
 const line=(v,c)=>{s+=`<polyline fill="none" stroke="${c}" stroke-width="2.5" points="${v.map((q,i)=>X(i)+','+Y(q)).join(' ')}"/>`;v.forEach((q,i)=>s+=`<circle cx="${X(i)}" cy="${Y(q)}" r="3.6" fill="${c}"/>`)};
 line(A,'#22d3ee');line(B,'#fbbf24');
 s+=`<text x="${x0+4}" y="${y0-8}" fill="#22d3ee" font-size="12" font-weight="800">━ ${na}</text><text x="${x0+110}" y="${y0-8}" fill="#fbbf24" font-size="12" font-weight="800">━ ${nb}</text></svg>`;return s}
const gMax=v=>v.indexOf(Math.max(...v)),gMin=v=>v.indexOf(Math.min(...v));
const gDiff=v=>v.slice(1).map((x,i)=>x-v[i]);
const U2=[
{lv:'A',title:'折れ線グラフを 読み取ろう',make(){const A=mkSer(14,30),B=mkSer(10,26),na='あさひ市',nb='ゆき市',t=rnd(1,6),d=gDiff(A),im=d.indexOf(Math.max(...d));
 return{items:[{q:`<div>${lineSVG(A,B,na,nb)}</div>${na}の 気温が いちばん 高いのは 何時で、何度ですか。`,fields:[S(TL[gMax(A)],TOPT),N(Math.max(...A),'','度')],exp:`${na}の 最高は ${TL[gMax(A)]}の ${Math.max(...A)}度`},
 {q:`${na}の 気温の 上がり方が いちばん 大きいのは、いつからいつの 間ですか。また、その間に 何度 上がりましたか。`,fields:[S(IOPT[im].v,IOPT),N(d[im],'','度')],exp:`${IOPT[im].v}に ${A[im]}度→${A[im+1]}度で ${d[im]}度 上がった`},
 {q:`${TL[t]}の ${na}と ${nb}の 気温の ちがいは 何度ですか。`,fields:[N(Math.abs(A[t]-B[t]),'','度')],exp:`${A[t]}度と ${B[t]}度の ちがい ＝ ${Math.abs(A[t]-B[t])}度`}],_g:{A,B}}}},
{lv:'B',title:'下がり方・ちがいを 調べよう',make(){let A,B,df,dm;until(()=>{A=mkSer(14,30);B=mkSer(10,26);df=A.map((x,i)=>Math.abs(x-B[i]));const m=Math.max(...df);dm=df.indexOf(m);return df.filter(x=>x===m).length===1});
 const nb='ゆき市',na='あさひ市',d=gDiff(B),im=d.indexOf(Math.min(...d));
 return{items:[{q:`<div>${lineSVG(A,B,na,nb)}</div>${nb}の 気温が いちばん 低いのは 何時で、何度ですか。`,fields:[S(TL[gMin(B)],TOPT),N(Math.min(...B),'','度')],exp:`${nb}の 最低は ${TL[gMin(B)]}の ${Math.min(...B)}度`},
 {q:`${nb}の 気温の 下がり方が いちばん 大きいのは、いつからいつの 間ですか。また、何度 下がりましたか。`,fields:[S(IOPT[im].v,IOPT),N(-d[im],'','度')],exp:`${IOPT[im].v}に ${B[im]}度→${B[im+1]}度で ${-d[im]}度 下がった`},
 {q:`2つの市の 気温の ちがいが いちばん 大きいのは 何時で、そのとき 何度 ちがいますか。`,fields:[S(TL[dm],TOPT),N(df[dm],'','度')],exp:`${TL[dm]}に ${A[dm]}度と ${B[dm]}度 → ${df[dm]}度の ちがい`}]}}},
{lv:'A',title:'2つの ことがらの 表',make(){const a=rnd(3,9),b=rnd(3,9),c=rnd(3,9),d=rnd(2,8),T=a+b+c+d;
 const tb=`<table class="tb"><tr><th></th><th>イヌ ○</th><th>イヌ ×</th><th>合計</th></tr><tr><th>ネコ ○</th><td>${a}</td><td>${b}</td><td>ア</td></tr><tr><th>ネコ ×</th><td>${c}</td><td>イ</td><td>${c}＋？</td></tr><tr><th>合計</th><td>ウ</td><td>${'？'}</td><td>${T}</td></tr></table>`.replace(`<td>${c}＋？</td>`,'<td>？</td>');
 return{items:[{q:`ネコ ○ の 人の 合計（ア）は 何人ですか。<div>${tb}</div>`,fields:[N(a+b,'ア ','人')],exp:`${a}＋${b}＝${a+b}`},
 {q:`イヌも ネコも かっていない 人（イ）は 何人ですか。（全体は ${T}人）`,fields:[N(d,'イ ','人')],exp:`${T}−${a}−${b}−${c}＝${d}`},
 {q:`イヌを かっている 人（ウ）は 何人ですか。`,fields:[N(a+c,'ウ ','人')],exp:`${a}＋${c}＝${a+c}`}]}}},
{lv:'B',title:'表の ?を うめよう',make(){const a=rnd(3,9),b=rnd(3,9),c=rnd(3,9),d=rnd(2,8),T=a+b+c+d,P=a+c,Q=a+b;
 const tb=`<table class="tb"><tr><th></th><th>イヌ ○</th><th>イヌ ×</th><th>合計</th></tr><tr><th>ネコ ○</th><td>${a}</td><td>ア</td><td>${Q}</td></tr><tr><th>ネコ ×</th><td>イ</td><td>ウ</td><td>？</td></tr><tr><th>合計</th><td>${P}</td><td>？</td><td>${T}</td></tr></table>`;
 return{items:[{q:`ア・イ・ウに あてはまる 人数を 答えましょう。<div>${tb}</div>`,fields:[N(b,'ア ','人'),N(c,'イ ','人'),N(d,'ウ ','人')],exp:`ア＝${Q}−${a}＝${b}、イ＝${P}−${a}＝${c}、ウ＝${T}−${a}−${b}−${c}＝${d}`}]}}}
];

/* ===== 単元3 わり算（1けた） ===== */
const divItems=(n,gen)=>Array.from({length:n},(_,i)=>{const [a,b]=gen(i);return{q:`${a} ÷ ${b}`,fields:QR(Math.floor(a/b),a%b),exp:`${a}÷${b}＝${Math.floor(a/b)}${a%b?' あまり '+a%b:''}`}});
const wrongItem=(w,d,q,r)=>{const n=w*q+r;return{q:`ある数を ${d}で わるのを、まちがえて ${w}で わったので、商が ${q}、あまりが ${r}に なりました。正しい 答えを 求めましょう。`,fields:QR(Math.floor(n/d),n%d),exp:`ある数 ＝ ${w}×${q}＋${r}＝${n}。${n}÷${d}＝${Math.floor(n/d)}${n%d?' あまり '+n%d:''}`}};
const U3=[
{lv:'A',title:'2けた ÷ 1けた',make(){return{items:divItems(4,()=>{const b=rnd(2,9);return[rnd(20,99),b]})}}},
{lv:'A',title:'わりきれる 数字',make(){const d=pick([3,4,5,6,7,8,9]),t=rnd(1,9),ans=[];for(let x=0;x<10;x++)if((t*10+x)%d===0)ans.push(String(x));
 return{items:[{q:`右の わり算で、わりきれるのは、□が どんな 数字の ときですか。（あてはまる 数字を すべて）<div style="font-weight:800;font-size:1.2rem">${d} ) ${t}□</div>`,fields:[M(ans,dig(0,9))],exp:`${t}0〜${t}9 の うち ${d}で わりきれるのは ${ans.map(x=>t+x).join('、')}`}]}}},
{lv:'A',title:'3けた ÷ 1けた',make(){return{items:divItems(4,()=>{const b=rnd(2,9);return[rnd(200,999),b]})}}},
{lv:'B',title:'まちがえた わり算',make(){const w=rnd(5,9),d=pick([4,5,6,7,8,9].filter(x=>x!==w)),q=rnd(11,29),r=rnd(1,w-1);return{items:[wrongItem(w,d,q,r)]}}},

{lv:'B',title:'一万の位までの がい数に なる 数',make(){const X=rnd(3,8)*10000,Y=X+pick([10000,20000]);let opts,a1,a2;until(()=>{const s=new Set([X-5001,X-5000+rnd(0,200),X+4999-rnd(0,200),X+5000+rnd(0,200),Y-5001,Y-5000+rnd(0,200),Y+4999-rnd(0,200),Y+5000+rnd(0,200)]);opts=[...s].sort((a,b)=>a-b);a1=opts.filter(n=>roundTo(n,10000)===X);a2=opts.filter(n=>roundTo(n,10000)===Y);return opts.length===8&&a1.length>=1&&a2.length>=1});
 const ol=opts.map(n=>({v:String(n),l:fm(n)}));return{items:[{q:`四捨五入して 一万の位までの がい数に すると 次の ①、② に なる 数を、それぞれ すべて 選びましょう。<div class="note">選べる 数： ${opts.map(fm).join('　')}</div>① ${fm(X)}　② ${fm(Y)}`,fields:[M(a1.map(String),ol),M(a2.map(String),ol)],exp:`① ${fm(X-5000)}以上 ${fm(X+5000)}未満： ${a1.map(fm).join('、')}　② ${fm(Y-5000)}以上 ${fm(Y+5000)}未満： ${a2.map(fm).join('、')}`}]}}},
{lv:'B',title:'上から 1けた と 2けた',make(){let C2,C1,opts,ans;until(()=>{C2=rnd(30,48)*1000+rnd(0,9)*0;C1=topRound(C2,1);if(C1===C2)return null;const s=new Set([C2-501,C2-500,C2+499,C2+500,C2,C1-rnd(5,15)*100]);opts=[...s].sort((a,b)=>a-b);ans=opts.filter(n=>topRound(n,1)===C1&&topRound(n,2)===C2);return opts.length===6&&ans.length>=2&&ans.length<=4});
 return{items:[{q:`四捨五入して 上から 1けたの がい数に すると ${fm(C1)}に なり、上から 2けたの がい数に すると ${fm(C2)}に なる 数を、下から すべて 選びましょう。`,fields:[M(ans.map(String),opts.map(n=>({v:String(n),l:fm(n)})))],exp:`上から2けたで ${fm(C2)}に なる 範囲 ${fm(C2-500)}以上 ${fm(C2+500)}未満 の うち、上から1けたで ${fm(C1)}に なる もの： ${ans.map(fm).join('、')}`}]}}},
{lv:'B',title:'見積もりの 文章題',make(){const a=rnd(12,98),pa=rnd(120,880);const x=rnd(2,4),qq=rnd(2,Math.floor(9/x)),bTop=x*10,b=bTop+rnd(-4,4),Ttop=x*qq*100,T=Ttop+rnd(-40,40);return{items:[{q:`1こ ${pa}円の ケーキを ${a}こ 買います。上から 1けたの がい数に して、代金を 見積もりましょう。`,fields:[N(topRound(pa,1)*topRound(a,1),'約 ','円')],exp:`${topRound(pa,1)}×${topRound(a,1)}＝${fm(topRound(pa,1)*topRound(a,1))}`},{q:`色紙が ${T}まい あります。${b}人で 同じ 数ずつ 分けます。上から 1けたの がい数に して、1人分を 見積もりましょう。`,fields:[N(qq*10,'約 ','まい')],exp:`${Ttop}÷${bTop}＝${qq*10}`}]}}}
];
/* ===== UI ===== */
const UNITS=[null,
 {no:1,name:'1億より大きい数',sub:'大きい数',cards:U1},
 {no:2,name:'グラフや表',sub:'グラフ・表',cards:U2},
 {no:3,name:'わり算（1けた）',sub:'わり算',cards:U3},
 {no:4,name:'角の大きさ',sub:'角',cards:U4},
 {no:5,name:'小数のしくみ',sub:'小数',cards:U5},
 {no:6,name:'わり算の筆算',sub:'2けた',cards:U6},
 {no:7,name:'およその数',sub:'がい数',cards:U7}];
const KEY='munQuest_g4math_hojuu_v1';
let ST={stars:{},coins:0,unit:1};
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&typeof r==='object'){ST.stars=r.stars||{};ST.coins=+r.coins||0;ST.unit=+r.unit||1}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}};
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const norm=s=>String(s).replace(/[０-９．，－]/g,c=>({'．':'.','，':'','－':'-'}[c]||String.fromCharCode(c.charCodeAt(0)-65248))).replace(/[,\s]/g,'');
const fmtAns=a=>String(+(+a).toFixed(6));
let CUR=[];
function fieldEl(f,ii,fi){
 if(f.t==='num')return el(`<label class="fl">${f.pre}<input class="ip ${f.w}" inputmode="decimal" autocomplete="off" data-ii="${ii}" data-fi="${fi}">${f.suf}</label>`);
 if(f.t==='sel')return el(`<label class="fl">${f.pre}<select class="ip" data-ii="${ii}" data-fi="${fi}"><option value="">えらぶ</option>${f.opts.map(o=>`<option value="${o.v}">${o.l}</option>`).join('')}</select>${f.suf}</label>`);
 const d=el(`<div class="chips" data-ii="${ii}" data-fi="${fi}">${f.opts.map(o=>`<button type="button" class="chip" data-v="${o.v}">${o.l}</button>`).join('')}</div>`);
 $$('.chip',d).forEach(b=>b.onclick=()=>b.classList.toggle('on'));return d;
}
function grade(f,node){
 if(f.t==='num'){const inp=$('input',node)||node;const v=norm(inp.value);const ok=v!==''&&!isNaN(Number(v))&&Math.abs(Number(v)-f.ans)<1e-9;inp.classList.toggle('ok',ok);inp.classList.toggle('ng',!ok);return ok}
 if(f.t==='sel'){const s=$('select',node);const ok=s.value===f.ans;s.classList.toggle('ok',ok);s.classList.toggle('ng',!ok);return ok}
 const on=$$('.chip.on',node).map(b=>b.dataset.v).sort(),want=f.ans.slice().sort();let ok=on.length===want.length&&on.every((v,i)=>v===want[i]);
 $$('.chip',node).forEach(b=>{const sel=b.classList.contains('on'),should=want.includes(b.dataset.v);b.classList.toggle('ok',sel&&should);b.classList.toggle('ng',sel!==should)});return ok;
}
const ansText=f=>f.t==='num'?`${f.pre}${fmtAns(f.ans)}${f.suf}`:f.t==='sel'?`${f.pre}${(f.opts.find(o=>o.v===f.ans)||{}).l}${f.suf}`:(f.ans.length?f.opts.filter(o=>f.ans.includes(o.v)).map(o=>o.l).join('、'):'なし');
function renderCard(u,idx,def){
 const p=def.make();const id=u+'-'+idx;
 const card=el(`<section class="card ${ST.stars[id]?'done':''}"><div class="chead"><span class="lv ${def.lv}">${def.lv==='A'?'△ にている問題':'◇ 少しむずかしい'}</span><b>${def.title}</b><span class="star">⭐</span></div></section>`);
 const nodes=[];
 p.items.forEach((it,ii)=>{
  const mark=p.items.length>1?`<span class="no">${CIRC[ii]}</span>`:'';
  const item=el(`<div class="item"><div class="q">${mark}${it.q}</div><div class="flds"></div></div>`);
  nodes[ii]=it.fields.map((f,fi)=>{const n=fieldEl(f,ii,fi);$('.flds',item).append(n);return n});
  card.append(item);
 });
 const msg=el('<div class="msg"></div>'),rev=el('<div class="reveal" hidden></div>');
 const btns=el('<div class="btns"><button class="btn" type="button">答え合わせ</button><button class="btn g" type="button">📖 答えを見る</button><button class="btn g" type="button">🔄 新しい数字で</button></div>');
 card.append(msg,rev,btns);
 const [bc,bs,bn]=$$('button',btns);let revealed=false;
 bc.onclick=()=>{let all=true;const items=$$('.item',card);p.items.forEach((it,ii)=>{const ok=it.fields.map((f,fi)=>grade(f,nodes[ii][fi])).every(Boolean);items[ii].classList.toggle('ok',ok);items[ii].classList.toggle('ng',!ok);if(!ok)all=false});
  if(all){msg.className='msg ok';msg.textContent='🎉 ぜんぶ せいかい！';if(!ST.stars[id]&&!revealed){ST.stars[id]=1;ST.coins+=10;save();card.classList.add('done');refresh()}}
  else{msg.className='msg ng';msg.textContent='おしい！ ✗の ところを もういちど 見なおそう。'}};
 bs.onclick=()=>{rev.hidden=false;revealed=true;rev.innerHTML='<b>こたえ</b><br>'+p.items.map((it,ii)=>`${p.items.length>1?CIRC[ii]+' ':''}${it.fields.map(ansText).join('　')}${it.exp?`<div class="note">${it.exp}</div>`:''}`).join('')};
 bn.onclick=()=>{const n=renderCard(u,idx,def);card.replaceWith(n);CUR[idx]=n.__p};
 card.__p=p;return card;
}
function refresh(){const done=Object.keys(ST.stars).length;$('#stars').textContent='⭐'+done;$('#coins').textContent='🪙'+ST.coins;
 const u=ST.unit,n=UNITS[u].cards.length,d=UNITS[u].cards.filter((_,i)=>ST.stars[u+'-'+i]).length;const b=$('#bar');if(b){b.style.width=(100*d/n)+'%';$('#bartx').textContent=d+' / '+n}
 $$('.tab').forEach((t,i)=>{const k=i+1,nn=UNITS[k].cards.length,dd=UNITS[k].cards.filter((_,j)=>ST.stars[k+'-'+j]).length;$('small',t).textContent=dd+'/'+nn})}
function show(u){
 ST.unit=u;save();CUR=[];const U=UNITS[u],m=$('#main');m.innerHTML='';
 m.append(el(`<div><div class="ttl"><h2>${u} ${U.name}</h2><span class="note" id="bartx"></span></div><div class="bar"><i id="bar"></i></div><p class="lead">答えを 入れて「答え合わせ」。ぜんぶ せいかいで ⭐と 🪙10！ 「新しい数字で」で 何回でも れんしゅうできるよ。</p></div>`));
 U.cards.forEach((d,i)=>{const c=renderCard(u,i,d);m.append(c);CUR[i]=c.__p});
 $$('.tab').forEach((t,i)=>t.classList.toggle('on',i+1===u));refresh();window.scrollTo(0,0);
}
function boot(){
 const tb=$('#tabs');for(let u=1;u<=7;u++){const b=el(`<button class="tab" type="button">${u} ${UNITS[u].sub}<small></small></button>`);b.onclick=()=>show(u);tb.append(b)}
 show(UNITS[ST.unit]?ST.unit:1);
}
boot();
</script>
</body>

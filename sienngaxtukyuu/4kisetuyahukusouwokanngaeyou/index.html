<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050914">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ふくそうじゅんび">
<meta name="description" content="特別支援学級の子どもたちが、天気予報（天気・気温・降水確率）を読んで、季節や天気に合う服装と持ち物を選ぶ練習ができるアプリ。明日の準備ツールつき。1〜6年生対応。">
<title>きせつの ふくそう・もちもの｜むん先生の学習クエスト</title>
<style>

:root{
  --fs:18px;
  --font-goth:"BIZ UDPGothic","BIZ UDPゴシック","Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Hiragino Sans","Meiryo",system-ui,sans-serif;
  --font-kyo:"UD Digi Kyokasho NK-B","UD デジタル 教科書体 NK-B","UD Digi Kyokasho NK-R","UD デジタル 教科書体 NK-R","Hiragino Maru Gothic ProN","Meiryo",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Courier New",monospace;
}
body[data-theme="cyber"]{
  --bg:#050914;--panel:#0d1834;--panel2:#13244a;--line:#24427d;
  --text:#eef6ff;--muted:#a3b8da;--accent:#3fe0ff;--accent-ink:#04121f;--accent2:#ffd84d;
  --ok:#45e39c;--soft:#ff9ec4;--bubble:#f3f8ff;--bubble-ink:#14203a;
  --glow:0 0 0 1px rgba(63,224,255,.30),0 0 16px rgba(63,224,255,.14);
  --shadow:0 8px 24px rgba(0,0,0,.45);
}
body[data-theme="soft"]{
  --bg:#fff7ea;--panel:#ffffff;--panel2:#f2f7ff;--line:#d5e1f2;
  --text:#25303f;--muted:#5d6a82;--accent:#2a7fd4;--accent-ink:#ffffff;--accent2:#e8930c;
  --ok:#17955c;--soft:#d9476d;--bubble:#ffffff;--bubble-ink:#25303f;
  --glow:0 0 0 2px #d5e1f2;
  --shadow:0 4px 14px rgba(40,60,90,.12);
}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:var(--font-goth);background:var(--bg);color:var(--text);line-height:1.7;word-break:keep-all;overflow-wrap:break-word;overflow-wrap:anywhere;line-break:strict}
.cbtn>span,.bub,.ask h2,.fb-why,.fb-title,.slot>span,.lvbtn>span{min-width:0}
body[data-font="kyo"]{font-family:var(--font-kyo)}
body[data-theme="cyber"]{
  background:
    radial-gradient(ellipse at 50% -10%,rgba(63,224,255,.13),transparent 60%),
    linear-gradient(rgba(63,224,255,.045) 1px,transparent 1px) 0 0/34px 34px,
    linear-gradient(90deg,rgba(63,224,255,.045) 1px,transparent 1px) 0 0/34px 34px,
    var(--bg);
  background-attachment:fixed;
}
ruby{ruby-position:over}
rt{font-size:.52em;font-weight:500;letter-spacing:0}
body.nofuri rt{display:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}
h2[tabindex="-1"]:focus,main:focus{outline:none}
a{color:var(--accent)}
.sys{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;color:var(--accent);opacity:.9}
body[data-theme="soft"] .sys{letter-spacing:.08em}

/* ---------- header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.6rem;padding:.55rem max(.9rem,env(safe-area-inset-left)) .55rem max(.9rem,env(safe-area-inset-right));background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.brand{flex:1;min-width:0;line-height:1.25}
.brand h1{margin:.1rem 0 0;font-size:1.12rem;line-height:1.35}
@media(max-width:520px){.brand .sys{display:none}.brand h1{font-size:1rem}.tbtn{min-width:56px}}
.tbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;min-height:52px;padding:.25rem .5rem;border-radius:14px;border:2px solid var(--line);background:var(--panel);font-size:1.15rem;line-height:1.1}
.tbtn small{font-size:.58rem;font-weight:700;color:var(--muted);margin-top:.15rem}
main{max-width:1180px;margin:0 auto;padding:1rem max(.9rem,env(safe-area-inset-left)) 2.5rem max(.9rem,env(safe-area-inset-right))}

/* ---------- common */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:58px;padding:.55rem 1.2rem;border-radius:16px;border:2px solid var(--line);background:var(--panel);font-weight:700;font-size:1.05rem;box-shadow:var(--glow);line-height:1.4}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:68px;font-size:1.2rem;padding:.6rem 1.6rem}
.btn:active,.cbtn:active,.lvbtn:active,.thbtn:active{transform:translateY(2px)}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:22px;box-shadow:var(--glow)}
.step{display:flex;align-items:center;gap:.6rem;margin:1.3rem 0 .7rem;font-size:1.3rem}
.step .tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;padding:.15rem .55rem;border-radius:8px;background:var(--accent);color:var(--accent-ink)}
.note{color:var(--muted);font-size:.92rem;margin:.6rem 0 0}
.backlink{display:inline-flex;align-items:center;gap:.3rem;min-height:48px;padding:.3rem .9rem;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-weight:700;font-size:.95rem}

/* ---------- home */
.hero{display:grid;gap:1rem;align-items:center;padding:1rem;overflow:hidden}
.hero .art{border-radius:16px;overflow:hidden;border:2px solid var(--line);background:#bfe8ff}
.hero .art svg{display:block;width:100%;height:auto}
.hero .lead{margin:0;font-size:1.22rem;font-weight:700;line-height:1.9}
.hero .lead em{font-style:normal;color:var(--accent2)}
@media(min-width:820px){.hero{grid-template-columns:1.1fr 1fr;padding:1.2rem 1.4rem}}
.levels{display:grid;gap:.8rem}
@media(min-width:820px){.levels{grid-template-columns:repeat(3,1fr)}}
.lvbtn{position:relative;display:flex;align-items:center;gap:.9rem;text-align:left;width:100%;min-height:96px;padding:.9rem 1rem;border-radius:20px;border:2px solid var(--lc);background:var(--panel);box-shadow:0 0 0 1px color-mix(in srgb,var(--lc) 40%,transparent),0 0 18px color-mix(in srgb,var(--lc) 18%,transparent)}
.lvbtn .num{flex:0 0 auto;width:3.4rem;height:3.4rem;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;font-weight:800;background:var(--lc);color:#05121f;line-height:1}
.lvbtn .num small{display:block;font-size:.5rem;letter-spacing:.08em;font-family:var(--mono)}
.lvbtn b{display:block;font-size:1.2rem}
.lvbtn .d{display:block;font-size:.88rem;color:var(--muted);line-height:1.5}
.lvbtn .stars{color:var(--lc);letter-spacing:.1em;font-size:.9rem}
.homefoot{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.4rem;align-items:center}
.minicard{display:flex;align-items:center;gap:.6rem}
.portal{margin-top:1.6rem;text-align:center;font-size:.85rem;color:var(--muted)}

/* ---------- themes */
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem}
@media(min-width:820px){.themes{grid-template-columns:repeat(4,1fr)}}
.thbtn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;min-height:150px;padding:1rem .6rem;border-radius:20px;border:2px solid var(--line);background:var(--panel);box-shadow:var(--glow);text-align:center}
.thbtn .ic{font-size:2.6rem;line-height:1.1}
.thbtn b{font-size:1.15rem;line-height:1.4}
.thbtn .d{font-size:.85rem;color:var(--muted);line-height:1.4}
.thbtn.mix{grid-column:1/-1;flex-direction:row;min-height:84px;gap:.8rem}
.clear{position:absolute;top:.45rem;right:.45rem;font-size:.7rem;font-weight:800;padding:.05rem .45rem;border-radius:999px;background:var(--ok);color:#04150d}
.lvchip{display:inline-flex;align-items:center;gap:.3rem;padding:.1rem .7rem;border-radius:999px;font-weight:800;font-size:.85rem;background:var(--lc);color:#05121f}

/* ---------- play */
.playbar{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem;flex-wrap:wrap}
.dots{display:flex;gap:.35rem;flex:1;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);display:block}
.dots i.done{background:var(--accent)}
.dots i.now{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.count{font-family:var(--mono);font-weight:700;color:var(--muted);font-size:.9rem}
.playgrid{display:grid;gap:1rem}
@media(min-width:900px){.playgrid{grid-template-columns:1.08fr 1fr;align-items:start}}
.scene{border-radius:18px;overflow:hidden;border:2px solid var(--accent);box-shadow:var(--glow);background:#bfe8ff}
body[data-theme="soft"] .scene{border-color:var(--line)}
.scene svg{display:block;width:100%;height:auto}
.story{display:flex;flex-direction:column;gap:.55rem;margin-top:.8rem}
.ln{display:flex;gap:.55rem;align-items:flex-start}
.ln .ava{flex:0 0 52px;height:52px;border-radius:50%;background:#fff;border:2px solid var(--line);overflow:hidden}
.ln .ava svg{width:100%;height:100%;display:block}
.bub{position:relative;flex:1;padding:.55rem .9rem;border-radius:16px;background:var(--bubble);color:var(--bubble-ink);font-size:1.12rem;line-height:2;font-weight:600}
.bub .who{display:block;font-size:.78rem;font-weight:800;color:#3d5a8a;line-height:1.3}
.ln.mine .bub{background:#fff6cf}
.ln.narr .bub{background:transparent;color:var(--text);border:2px dashed var(--line)}
.ask{display:flex;align-items:center;gap:.6rem;margin-bottom:.7rem}
.ask h2{flex:1;margin:0;font-size:1.4rem;line-height:1.9}
.saybtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:.25rem;min-height:56px;padding:.3rem .9rem;border-radius:16px;border:2px solid var(--accent2);background:var(--panel);font-weight:800;font-size:1rem;color:var(--text)}
.saybtn.speaking,.say-mini.speaking{background:var(--accent2);color:#1d1600}
body.notts .saybtn,body.notts .say-mini,body.notts .fb-say{display:none!important}
.answers{display:flex;flex-direction:column;gap:.7rem}
.choice{display:flex;gap:.5rem;align-items:stretch}
.say-mini{flex:0 0 52px;border-radius:14px;border:2px solid var(--line);background:var(--panel);font-size:1.15rem}
.cbtn{flex:1;display:flex;align-items:center;gap:.8rem;text-align:left;min-height:76px;padding:.6rem 1rem;border-radius:18px;border:2px solid var(--line);background:var(--panel);font-size:1.16rem;font-weight:700;line-height:1.95;box-shadow:var(--glow)}
.cbtn:hover{border-color:var(--accent)}
.mk{flex:0 0 auto;width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;font-size:1.05rem;font-weight:800;line-height:1;color:#10131c}
.mk0{background:#ffd84d}.mk1{background:#ff9ec4}.mk2{background:#7beab1}
.cbtn.off{opacity:.38;filter:grayscale(.7);box-shadow:none}
.offtag{margin-left:auto;font-size:.72rem;padding:.05rem .5rem;border-radius:999px;border:1px solid var(--muted);color:var(--muted);white-space:nowrap}
/* line game */
.ghost{cursor:pointer}
.ghost .gs{fill:rgba(255,255,255,.62);stroke:#ff4fa0;stroke-width:3;stroke-dasharray:7 5}
.ghost .gl{font-size:26px;font-weight:800;fill:#c2185b;font-family:var(--font-goth)}
.ghost:hover .gs,.ghost:focus .gs{fill:#fff3fa}
.ghost.off{pointer-events:none;opacity:.25}
.ghost:focus{outline:none}
@media(prefers-reduced-motion:no-preference){.ghost:not(.off) .gs{animation:breathe 2.2s ease-in-out infinite}}
@keyframes breathe{50%{fill:rgba(255,230,244,.95)}}
/* order game */
.slots{list-style:none;margin:0 0 .9rem;padding:0;display:flex;flex-direction:column;gap:.45rem}
.slot{display:flex;align-items:center;gap:.7rem;min-height:56px;padding:.35rem .8rem;border-radius:14px;border:2px dashed var(--line);font-weight:700;line-height:1.9}
.slot .no{flex:0 0 auto;width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-weight:800;border:2px solid var(--line)}
.slot.next{border-color:var(--accent2)}
.slot.next .no{background:var(--accent2);color:#1d1600;border-color:var(--accent2)}
.slot.done{border-style:solid;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.slot.done .no{background:var(--ok);color:#04150d;border-color:var(--ok)}
.slot .q{color:var(--muted)}
.cbtn.card{font-size:1.08rem}
.cbtn.hint{border-color:var(--accent2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent2) 55%,transparent),0 0 20px color-mix(in srgb,var(--accent2) 35%,transparent)}
.omsg{min-height:1.8em;margin:.2rem 0 .6rem;font-weight:700;color:var(--accent2)}
@media(prefers-reduced-motion:no-preference){.shake{animation:shake .4s}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* ---------- feedback sheet / modal */
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,5,14,.62)}
@media(min-width:720px){.overlay{align-items:center;padding:1rem}}
.sheet{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--panel);border-radius:26px 26px 0 0;padding:1.2rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));border-top:5px solid var(--accent);box-shadow:var(--shadow)}
@media(min-width:720px){.sheet{border-radius:26px;border:2px solid var(--line);border-top:5px solid var(--accent)}}
@media(prefers-reduced-motion:no-preference){.sheet{animation:up .25s ease-out}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet.ok{border-top-color:var(--ok)}
.sheet.re{border-top-color:var(--accent2)}
.fb-top{display:flex;gap:1rem;align-items:center}
.fb-face{flex:0 0 auto;width:112px;height:112px;border-radius:50%;background:#fff;border:3px solid var(--line);overflow:hidden}
.fb-face svg{width:100%;height:100%;display:block}
.fb-title{margin:0;font-size:1.7rem;font-weight:800;line-height:1.4}
.sheet.ok .fb-title{color:var(--ok)}
.sheet.re .fb-title{color:var(--accent2)}
.fb-feel{margin:.3rem 0 0;font-weight:700;font-size:1rem;line-height:2}
.pill{display:inline-block;padding:0 .8rem;border-radius:999px;background:var(--panel2);border:2px solid var(--line);font-size:1.08rem;margin-left:.2rem}
.fb-why{margin:1rem 0 .4rem;font-size:1.2rem;font-weight:700;line-height:2.05}
.fb-sub{margin:.2rem 0 0;color:var(--muted);font-weight:700}
.fb-stamp{display:flex;align-items:center;gap:.6rem;margin:.8rem 0 0;padding:.5rem .8rem;border-radius:14px;background:var(--panel2);font-weight:800}
.fb-btns{display:flex;gap:.7rem;margin-top:1.1rem;flex-wrap:wrap}
.fb-btns .primary{flex:1}
.stamp{display:inline-grid;place-items:center;width:3rem;height:3rem;border-radius:50%;background:#fff;border:3px solid #ffd84d;font-size:1.6rem;line-height:1}
@media(prefers-reduced-motion:no-preference){.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--panel);border-radius:24px 24px 0 0;padding:1.2rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));box-shadow:var(--shadow);border-top:5px solid var(--accent)}
@media(min-width:720px){.modal{border-radius:24px;border:2px solid var(--line);border-top:5px solid var(--accent)}}
.modal h2{margin:0 0 .6rem;font-size:1.35rem}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;padding:.65rem 0;border-bottom:1px solid var(--line)}
.setrow .lbl{font-weight:800}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;flex-wrap:wrap}
.seg button{min-height:48px;min-width:64px;padding:.2rem .8rem;border:0;background:transparent;font-weight:700;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.guide p,.guide li{line-height:1.85;font-size:.98rem}
.guide h3{margin:1.1rem 0 .3rem;font-size:1.05rem;color:var(--accent)}
.guide ul{padding-left:1.2rem;margin:.3rem 0}
.btnrow{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.1rem}
.btnrow .btn{flex:1 1 180px}
.danger{border-color:#e06c6c!important;color:#ff9b9b}
body[data-theme="soft"] .danger{color:#c03434}

/* ---------- result / stamps */
.result{text-align:center;padding:1.4rem 1rem}
.result h2{margin:.2rem 0 .4rem;font-size:2rem}
.gotrow{display:flex;justify-content:center;flex-wrap:wrap;gap:.5rem;margin:.8rem 0}
.pointcard{text-align:left;margin:1.2rem auto 0;max-width:640px;padding:1rem 1.1rem;border-radius:18px;border:2px solid var(--accent2);background:var(--panel2)}
.pointcard .h{display:flex;align-items:center;justify-content:space-between;gap:.5rem;font-weight:800;color:var(--accent2)}
.pointcard p{margin:.4rem 0 0;font-size:1.2rem;font-weight:700;line-height:2.05}
.medal{margin:.6rem auto 0;display:inline-block;padding:.4rem 1rem;border-radius:999px;background:#ffd84d;color:#2a1f00;font-weight:800}
.card20{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem;max-width:420px;margin:1rem auto}
.card20 span{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;border:2px dashed var(--line);background:var(--panel2)}
.card20 span.on{border:3px solid #ffd84d;background:#fff}
.cleartable{width:100%;max-width:640px;margin:.6rem auto 0;border-collapse:separate;border-spacing:4px;font-size:.88rem}
.cleartable th,.cleartable td{padding:.35rem .3rem;border-radius:10px;background:var(--panel2);text-align:center;font-weight:700}
.cleartable th.tn{text-align:left;padding-left:.6rem;width:52%}
.cleartable th.lvh{white-space:nowrap;border-bottom:3px solid var(--lc)}
.cleartable td.y{background:color-mix(in srgb,var(--ok) 30%,var(--panel2))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 17：ふくそう・もちもの ---------- */
[hidden]{display:none!important}
.fc{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .9rem;padding:.8rem 1rem;border-radius:18px;background:var(--panel2);border:2px solid var(--line);margin-top:.8rem}
.fc .wi{font-size:3rem;line-height:1}
.fc .wn{font-size:1.3rem;font-weight:800}
.fc .tag2{display:inline-flex;align-items:center;gap:.3rem;padding:.15rem .7rem;border-radius:999px;font-weight:800;font-size:1rem;background:var(--panel);border:2px solid var(--line)}
.fc .hi{color:#ff6b6b;border-color:#ff6b6b}
.fc .lo{color:#4aa8ff;border-color:#4aa8ff}
.fc .rp{color:var(--accent)}
.fc .ev{flex-basis:100%;font-weight:800;font-size:1.05rem}
.kidwrap{border-radius:18px;overflow:hidden;border:2px solid var(--accent);box-shadow:var(--glow)}
body[data-theme="soft"] .kidwrap{border-color:var(--line)}
.kidwrap svg{display:block;width:100%;height:auto;max-height:52vh}
.slot2{margin-bottom:.9rem}
.slot2 h3 .st{white-space:nowrap}
@media(min-width:900px){.playgrid>section:first-child{position:sticky;top:84px}}
@media(max-width:899px){.kidwrap svg{max-height:36vh}}
.slot2 h3{display:flex;align-items:center;gap:.5rem;margin:0 0 .4rem;font-size:1.05rem}
.slot2 h3 .st{font-size:.8rem;padding:.05rem .5rem;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.slot2 h3 .st.ng{background:#ffd84d;color:#1d1600;border-color:#ffd84d}
.opts{display:flex;flex-wrap:wrap;gap:.5rem}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;min-width:84px;min-height:92px;padding:.4rem .5rem;border-radius:16px;border:2px solid var(--line);background:var(--panel);font-weight:800;font-size:.88rem;line-height:1.3;text-align:center}
.opt svg{width:44px;height:44px}
.opt .em{font-size:2rem;line-height:1.3}
.opt[aria-pressed="true"]{border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 16%,var(--panel));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent2) 45%,transparent)}
.multi-note{font-size:.8rem;color:var(--muted);font-weight:700}

<script>
(function(){
'use strict';
/* ====== サイト設定（必要なら変更してください） ====== */
const STORE_KEY='munq_life17_fuku_v1';  // この端末の中だけに保存（ほかのアプリのデータには触れません）
const PORTAL_URL='/';                   // 「サイトへもどる」のリンク先

const N=t=>({t});
/* ====== テーマ・レベル ====== */
const THEMES={
 junban:{name:'じゅんばん',sub:'ならぶ・まつ',icon:'🚶',
   point:'{並|なら}ぶときは、いちばん{後|うし}ろ。{待|ま}つときは、{心|こころ}の{中|なか}で{数|かず}をかぞえよう。'},
 kashikari:{name:'かしかり',sub:'かして・どうぞ',icon:'🤝',
   point:'「かして」「いいよ」「ありがとう」。{借|か}りたものは、「ありがとう」と{言|い}って{返|かえ}そう。'},
 asobi:{name:'あそびの ルール',sub:'かちまけ・こうたい',icon:'🎲',
   point:'{負|ま}けても「つぎ がんばろう」。ルールを{守|まも}ると、みんなが{楽|たの}しいね。'},
 hanashi:{name:'はなす じゅんばん',sub:'はっぴょう・かいわ',icon:'🙋',
   point:'{話|はな}したいときは、{手|て}をあげて{待|ま}とう。{友|とも}だちの{話|はなし}は{最後|さいご}まで{聞|き}こう。'},
 mix:{name:'まぜこぜ',sub:'いろいろな ばめんから 5もん',icon:'🌈',
   point:'{相手|あいて}の{気持|きも}ちを{考|かんが}えると、みんなが{気持|きも}ちよくすごせるね。'}
};
const THEME_KEYS=['junban','kashikari','asobi','hanashi'];
const LEVELS={
 1:{name:'はじめの いっぽ',d:'2つから えらぶ・ひらがな',grade:'1・2ねんせい',stars:'★',c:'#45e39c'},
 2:{name:'なかよし チャレンジ',d:'3つから えらぶ・ふりがな つき',grade:'3・4ねんせい',stars:'★★',c:'#3fe0ff'},
 3:{name:'リーダー チャレンジ',d:'3つから えらぶ・じゅんばん ならべ',grade:'5・6ねんせい',stars:'★★★',c:'#b794ff'}
};
const MARK=['●','▲','■'], MARK_READ=['まる','さんかく','しかく'];
const STAMPS=['⭐','🌸','🍀','🌈','🎵','🍎','🐟','🌻','🚀','💎','🐣','🍙','🦋','🍩','🎈','🐬'];
const GOOD=['できたね！','やったね！','すてき！','ばっちり！','すばらしい！'];

/* ====== キャラクター ====== */
const CH={
 me:{name:'あなた',short:'あなた',hair:'#2b2320',shirt:'#2f7de1',skin:'#f7d4b5',style:'cap'},
 haru:{name:'はるとさん',short:'はると',hair:'#3a2618',shirt:'#f08a24',skin:'#f3cba6',style:'short'},
 saki:{name:'さきさん',short:'さき',hair:'#6b3b1c',shirt:'#e5507a',skin:'#f8d7bd',style:'pigtail'},
 sota:{name:'そうたさん',short:'そうた',hair:'#1d1d1f',shirt:'#2aa866',skin:'#eec39d',style:'spiky'},

};

/* ====== 便利関数 ====== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ruby=s=>esc(s).replace(/\{([^|{}]+)\|([^{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');
const plain=s=>String(s).replace(/\{([^|{}]+)\|([^{}]+)\}/g,'$2');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ====== 保存（この端末の中だけ） ====== */
const DEF_SET={auto:false,slow:true,sound:true,furi:true,size:1,theme:'cyber',font:'goth'};
const store=(function(){
  let d=null;
  try{d=JSON.parse(localStorage.getItem(STORE_KEY)||'null');}catch(e){d=null;}
  if(!d||typeof d!=='object')d={};
  d.settings=Object.assign({},DEF_SET,d.settings||{});
  if(!Array.isArray(d.stamps))d.stamps=[];
  if(typeof d.medals!=='number')d.medals=0;
  if(typeof d.total!=='number')d.total=0;
  if(!d.clear||typeof d.clear!=='object')d.clear={};
  return d;
})();
const S=store.settings;
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(store));}catch(e){}}

function applySettings(){
  const b=document.body;
  b.dataset.theme=S.theme==='soft'?'soft':'cyber';
  b.dataset.font=S.font==='kyo'?'kyo':'goth';
  b.classList.toggle('nofuri',!S.furi);
  document.documentElement.style.setProperty('--fs',([16,18,21,24][S.size]||18)+'px');
  const m=document.querySelector('meta[name="theme-color"]');
  if(m)m.content=S.theme==='soft'?'#fff7ea':'#050914';
}

/* ====== 読み上げ ====== */
const TTS={
  ok:('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window),
  voice:null,btn:null,
  pickVoice(){
    if(!this.ok)return;
    const vs=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));
    this.voice=vs.find(v=>v.localService&&/Nanami|Kyoko|O-ren|Haruka|Ayumi|Sayaka/i.test(v.name))||vs.find(v=>v.localService)||vs[0]||null;
  },
  speak(text,btn){
    if(!this.ok||!text)return;
    this.stop();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ja-JP'; if(this.voice)u.voice=this.voice;
    u.rate=S.slow?0.82:1.0; u.pitch=1.05;
    if(btn){this.btn=btn;btn.classList.add('speaking');}
    const done=()=>{if(btn)btn.classList.remove('speaking');};
    u.onend=done;u.onerror=done;
    setTimeout(()=>{try{speechSynthesis.speak(u);}catch(e){done();}},60);
  },
  stop(){
    if(!this.ok)return;
    try{speechSynthesis.cancel();}catch(e){}
    document.querySelectorAll('.speaking').forEach(b=>b.classList.remove('speaking'));
  }
};
if(TTS.ok){
  TTS.pickVoice();
  try{speechSynthesis.addEventListener('voiceschanged',()=>TTS.pickVoice());}catch(e){}
  // iPad等：最初のタッチで読み上げを使えるようにする
  const unlock=()=>{try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}document.removeEventListener('pointerdown',unlock);};
  document.addEventListener('pointerdown',unlock);
}else{document.body.classList.add('notts');}

/* ====== 効果音（やさしい音） ====== */
let actx=null;
function sfx(type){
  if(!S.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const t0=actx.currentTime+0.02;
    const seq={ok:[[784,0],[988,.12],[1175,.24]],retry:[[523,0],[440,.16]],tap:[[880,0]],stamp:[[1319,0],[1760,.09]]}[type]||[[660,0]];
    seq.forEach(([f,t])=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t0+t);
      g.gain.exponentialRampToValueAtTime(type==='tap'?0.08:0.16,t0+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+t+0.38);
      o.connect(g);g.connect(actx.destination);o.start(t0+t);o.stop(t0+t+0.42);
    });
  }catch(e){}
}

function headSVG(id,ex){

  else if(ex==='surprised')s+=`<circle cx="-8.5" cy="-2" r="3.8" fill="${ink}"/><circle cx="8.5" cy="-2" r="3.8" fill="${ink}"/><circle cx="-7.3" cy="-3.3" r="1.2" fill="#fff"/><circle cx="9.7" cy="-3.3" r="1.2" fill="#fff"/>`;
  else s+=`<ellipse cx="-8.5" cy="-1" rx="2.7" ry="3.5" fill="${ink}"/><ellipse cx="8.5" cy="-1" rx="2.7" ry="3.5" fill="${ink}"/><circle cx="-7.6" cy="-2.2" r=".9" fill="#fff"/><circle cx="9.4" cy="-2.2" r=".9" fill="#fff"/>`;
  if(c.style==='teacher')s+=`<g stroke="#34363f" stroke-width="1.8" fill="none"><circle cx="-8.5" cy="-1" r="6.2"/><circle cx="8.5" cy="-1" r="6.2"/><path d="M-2.3,-1 H2.3"/></g>`;
  // ほお

  // くち
  const mouth={
    normal:`<path d="M-5,9 Q0,12.5 5,9" stroke="${ink}" stroke-width="2" fill="none" stroke-linecap="round"/>`,

    surprised:`<ellipse cx="0" cy="10.5" rx="3.6" ry="4.6" fill="#c8323c"/>`

  s+=mouth;

function lineSpots(q){

function sceneSVG(q,opt){
  opt=opt||{};const sc=q.sc;const faces=opt.faces||{};
  let s=BG[sc.bg]();
  const prop=sc.prop&&PROP[sc.prop];
  if(prop)s+=prop.back();
  if(q.type==='line'){
    const seq=lineSpots(q);const L='あいう';let li=0;
    const xs=seq.map((k,i)=>130+(372-130)*i/(seq.length-1));
    seq.forEach((k,i)=>{
      if(k[0]==='c'){const [id,ex]=sc.ch[+k[1]];s+=fig(id,faces[id]||ex,xs[i],176,.8);}
      else{
        if(opt.chosen===k)s+=fig('me',q.sp[k].ok?'happy':'normal',xs[i],176,.8);
        else s+=ghost(k,L[li],xs[i],opt.off&&opt.off.has(k));
        li++;
      }
    });
  }else{
    const n=sc.ch.length;
    const x0=prop?150:46,x1=prop?388:354;
    const xs=sc.ch.map((c,i)=>c[2]!=null?c[2]:x0+(x1-x0)*(i+.5)/n);
    const scale=n>=4?.86:1;
    sc.ch.forEach(([id,ex],i)=>{s+=fig(id,faces[id]||ex,xs[i],176,id==='yui'&&sc.prop==='swing'?.92:scale);});
    if(prop&&prop.front)s+=prop.front();
    if(sc.item){const ix=n>=2?(xs[0]+xs[1])/2:xs[0]+95;s+=itemBubble(sc.item,ix,40);}
  }
  const alt=plain(q.st.map(l=>(l.who?CH[l.who].name+'「'+l.t+'」':l.t)).join(' '));
  return `<svg viewBox="0 0 400 200" role="img" aria-label="${esc(alt)}">${s}</svg>`;
}

/* ====== はんてい（ルール） ====== */
function cond(f){
  const raining=f.w==='ame'||f.rain>=50, snow=f.w==='yuki';
  return {raining,snow,hot:f.hi>=25,sunHot:f.w==='hare'&&f.hi>=25,midRain:f.rain>=30&&f.rain<50&&f.w!=='ame'};
}
function judge(f,s,lv){
  const c=cond(f),out={};
  const add=(k,ok,msg)=>{out[k]={ok,msg};};
  // うえ
  if(s.top==='short')add('top',f.hi>=23,`さいこう きおんが ${f.hi}どだと、はんそでは さむいよ。`);
  else add('top',f.hi<=28,`さいこう きおんが ${f.hi}どだと、ながそでは あつくて あせを かくよ。`);
  // した
  if(s.bottom==='shorts')add('bottom',f.hi>=22,`${f.hi}どだと、はんズボンは あしが さむいよ。`);
  else add('bottom',f.hi<=30,`${f.hi}どだと、ながズボンは とても あついよ。`);
  // うわぎ
  const o=s.outer;
  if(o==='kappa')add('outer',c.raining,'あめが ふらない ひに、かっぱは いらないよ。');
  else if(o==='none')add('outer',f.hi>=20&&f.lo>=12,`さいてい きおんが ${f.lo}どだよ。 うわぎが ないと さむいよ。`);
  else if(o==='jacket')add('outer',f.hi>=12&&f.hi<=24,f.hi>24?'あつい ひに うわぎは いらないよ。':`${f.hi}どは とても さむいよ。 うすい うわぎでは さむいかも。`);
  else add('outer',f.hi<=14,'この きおんだと、あつい コートでは あつすぎるよ。');
  // あたま（L3）／ぼうし（L2は もちもの）
  const hat=lv===3?s.head:(s.items.has('boushi')?'cap':'none');
  if(lv===3){
    if(hat==='cap')add('head',!c.snow,'ゆきの ひは、ぼうしより あたたかい ニットぼうが いいよ。');
    else if(hat==='knit')add('head',f.hi<=12,'この きおんで ニットぼうは あつすぎるよ。');
    else add('head',!c.sunHot,'はれて あつい ひは、ねっちゅうしょうを ふせぐ ために ぼうしを かぶろう。');
    // くつ
    const needBoots=c.snow||f.w==='ame';
    if(s.shoes==='boots')add('shoes',needBoots||c.raining,'はれの ひに ながぐつは、あつくて あるきにくいよ。');
    else add('shoes',!needBoots,c.snow?'ゆきの ひは、すべりにくい ながぐつが いいよ。':'あめの ひは、くつが ぬれない ながぐつが いいよ。');
  }
  // もちもの
  const it=s.items,miss=[],extra=[];
  if(!it.has('hankachi'))miss.push('ハンカチ・ティッシュは まいにち もって いこう。');
  if(c.raining&&!it.has('kasa'))miss.push(`あめの かくりつが ${f.rain}%。 かさを わすれずに。`);
  if(lv===3&&c.midRain&&!it.has('oritatami')&&!it.has('kasa'))miss.push(`あめの かくりつが ${f.rain}%。 ふるかも しれないので、おりたたみがさが あると あんしん。`);
  if(it.has('kasa')&&!c.raining&&!c.snow&&!(lv===3&&c.midRain))extra.push(`あめの かくりつが ${f.rain}%。 かさは いらないよ。`);
  if(c.hot&&!it.has('suito'))miss.push(`${f.hi}どの あつい ひ。 すいとうを もって、こまめに みずを のもう。`);
  if(lv===2&&c.sunHot&&!it.has('boushi'))miss.push('はれて あつい ひは、ねっちゅうしょうを ふせぐ ために ぼうしを かぶろう。');
  const needGlove=f.hi<=8||c.snow;
  if(needGlove&&!it.has('tebukuro'))miss.push('とても さむい ひ。 てぶくろ・マフラーで あたたかく しよう。');
  if(it.has('tebukuro')&&f.hi>=18)extra.push('この きおんで てぶくろ・マフラーは あつすぎるよ。');
  add('items',!miss.length&&!extra.length,miss.concat(extra).join(' '));
  return out;
}
function recommend(f,lv){

  const s={top:f.hi>=25?'short':'long',bottom:f.hi>=25?'shorts':'long',

  if(s.outer==='jacket'&&f.hi>24)s.outer='none';

}

    sheet({ok:true,title:pick(GOOD),why,act:'toitem',btn:'つぎは もちもの ▶'});}
  else{qz.wrong.add(k);sfx('retry');
    sheet({ok:false,title:'ちょっと まって！',why:f.feel.indexOf('さむい')>=0?'さむい ひに その ふくだと、からだが ひえて しまうよ。':'その ふくだと、あつすぎて あせを かいて しまうよ。',act:'retry1',btn:'もういちど えらぶ'});}
}
function pickItem1(k){
  const f=qcur();
  const why={boushi:'ぼうしを かぶると、あつい ひざしから あたまを まもれるね。',tebukuro:'てぶくろと マフラーで、あたたかく でかけられるね。',kasa:'かさが あれば、ぬれないで いけるね。',suito:'すいとうが あれば、こまめに みずを のめるね。',hankachi:'ハンカチ・ティッシュは まいにち もって いこう。'};
  const ng={boushi:'この てんきだと、ぼうしより ほかの ものが ひつようだよ。',tebukuro:'あつい ひに てぶくろは いらないよ。',kasa:'あめは ふらないので、かさは いらないよ。',suito:'',hankachi:''};
  if(k===f.item[0]){qz.sel.items=new Set([k]);qz.ex='happy';refreshKid();sfx('ok');const stamp=qzStamp();
    sheet({ok:true,title:pick(GOOD),why:why[k],stamp,act:'qznext',btn:lastQ()?'けっかを みる ▶':'つぎへ ▶'});}
  else{qz.wrong.add(k);sfx('retry');sheet({ok:false,title:'ちょっと まって！',why:ng[k]||'ほかの ものを かんがえて みよう。',act:'retry1',btn:'もういちど えらぶ'});}
}
function check(){
  const f=qcur(),res=judge(f,qz.sel,qz.lv);qz.res=res;
  const keys=SLOTS[qz.lv];
  const bad=keys.filter(k=>!res[k].ok);
  if(!bad.length){
    qz.ex='happy';refreshKid();sfx('ok');const stamp=qzStamp();
    const tip=f.hi-f.lo>=10?`あさと ひるの きおんの さが ${f.hi-f.lo}ど。 ぬいだり きたり できる ふくが べんりだよ。`:'てんきよほうを よく みて えらべたね。';
    sheet({ok:true,title:pick(GOOD),sub:'ぜんぶ ぴったり！',why:tip,stamp,act:'qznext',btn:lastQ()?'けっかを みる ▶':'つぎへ ▶'});
  }else{
    qz.ex='trouble';refreshKid();sfx('retry');
    const list=`<ul class="issues">${bad.map(k=>`<li><b>${OPT[k].label}：</b><span>${esc(res[k].msg)}</span></li>`).join('')}</ul>`;
    sheet({ok:false,title:'あと すこし！',sub:`${keys.length-bad.length} / ${keys.length} こ OK`,list,say:'あと すこし。 '+bad.map(k=>OPT[k].label+'。 '+res[k].msg).join(' '),act:'retry2',btn:'えらびなおす'});
  }
}
R.qz_result=function(){
  const point='てんきの マーク・きおん・あめの かくりつを みて、ふくと もちものを えらぼう。';
  qz.point=point;sayText='';
  screen.innerHTML=`
  <section class="panel result">
    <div class="sys">CLEAR // LEVEL ${qz.lv}</div><h2>チャレンジ クリア！</h2>
    <div class="gotrow">${qz.got.map((i,n)=>`<span class="stamp pop" style="animation-delay:${n*.12}s">${i}</span>`).join('')}</div>
    <p style="font-weight:800;font-size:1.15rem;margin:.2rem 0">スタンプを ${qz.got.length}こ ゲット！</p>
    ${qz.medalUp?'<div class="medal">🏅 スタンプカードが いっぱいに なって メダルを ゲット！</div>':''}
    <div class="pointcard"><div class="h"><span>📌 おぼえて おこう</span><button class="saybtn" data-act="saypoint" aria-label="よみあげる">🔊</button></div><p>${ruby(point)}</p></div>
    <div class="btnrow" style="max-width:640px;margin-left:auto;margin-right:auto">
      <button class="btn primary big" data-act="qzagain">🔁 もういちど</button>
      <button class="btn big" data-act="prep">🎒 あしたの じゅんび</button>
      <button class="btn big" data-act="home">🏠 ホーム</button>
    </div>
  </section>`;
  if(S.auto)TTS.speak('チャレンジ クリア！ '+point,$('[data-act="saypoint"]'));
};

/* ---- あしたの じゅんび */
function stepper(key,val,unit){return `<div class="stepper"><button data-step="${key}" data-d="-1" aria-label="へらす">－</button><span class="val">${val}${unit}</span><button data-step="${key}" data-d="1" aria-label="ふやす">＋</button></div>`;}
R.prep=function(){
  if(!prep)prep={w:'hare',hi:20,lo:12,rain:10,m:new Date().getMonth()+1,phase:'in',chk:{}};
  if(prep.phase==='in'){
    sayText='あしたの じゅんび。 テレビや しんぶんの てんきよほうを みて、てんき、さいこう きおん、さいてい きおん、あめの かくりつを いれてね。';
    screen.innerHTML=`
    <button class="backlink" data-act="home">◀ ホーム</button>
    <section class="panel prep" style="margin-top:.8rem;padding:1.1rem">
      <div class="ask"><h2 style="margin:0">🎒 あしたの じゅんび</h2>${sayBtn}</div>
      <p class="note" style="margin-top:0">テレビや しんぶんの よほうを みて いれてね。（おうちの ひとと いっしょに）</p>
      <h3>① てんき</h3><div class="wbtns">${Object.keys(WEATHER).map(k=>`<button data-pw="${k}" aria-pressed="${prep.w===k}"><span aria-hidden="true">${WEATHER[k][0]}</span>${WEATHER[k][1]}</button>`).join('')}</div>
      <h3>② <span style="color:#ff6b6b">さいこう きおん</span></h3>${stepper('hi',prep.hi,'℃')}
      <h3>③ <span style="color:#4aa8ff">さいてい きおん</span></h3>${stepper('lo',prep.lo,'℃')}
      <h3>④ ☔ あめの ふる かくりつ</h3>${stepper('rain',prep.rain,'%')}
      <div class="btnrow"><button class="btn primary big" data-act="prepgo">しらべる ▶</button></div>
    </section>`;
    return;
  }
  const f={w:prep.w,hi:prep.hi,lo:prep.lo,rain:prep.rain};
  const s=recommend(f,3);
  const items=[...s.items];
  const list=[['top',s.top],['bottom',s.bottom]].concat(s.outer!=='none'?[['outer',s.outer]]:[]).concat(s.head!=='none'?[['head',s.head]]:[]).concat([['shoes',s.shoes]]).concat(items.map(i=>['items',i]));
  const all=list.every(([k,v])=>prep.chk[k+v]);
  const tip=f.hi-f.lo>=10?`あさと ひるの きおんの さが ${f.hi-f.lo}ど。 ぬいだり きたり できる うわぎが べんり。`:'';
  sayText='あしたの おすすめ。 '+list.map(([k,v])=>OPT[k].o[v]).join('、')+'。 '+tip;
  screen.innerHTML=`
  <button class="backlink" data-act="prepback">◀ よほうを いれなおす</button>
  <div class="playgrid" style="margin-top:.8rem">
    <section><div class="kidwrap">${kidSVG(normalize(s,3),f.w,all?'happy':'normal')}</div>
      <div class="fc"><span class="wi" aria-hidden="true">${WEATHER[f.w][0]}</span><span class="wn">${WEATHER[f.w][1]}</span><span class="tag2 hi">さいこう ${f.hi}℃</span><span class="tag2 lo">さいてい ${f.lo}℃</span><span class="tag2 rp">☔ ${f.rain}%</span></div></section>
    <section>
      <div class="ask"><h2>あしたの おすすめ</h2>${sayBtn}</div>
      ${tip?`<p class="fb-sub" style="margin:-.3rem 0 .6rem">💡 ${tip}</p>`:''}
      <p class="note" style="margin-top:0">よういが できたら ✔ しよう。</p>
      <div class="checklist">${list.map(([k,v])=>`<button class="chk" data-pc="${k+v}" aria-pressed="${!!prep.chk[k+v]}"><span class="bx">${prep.chk[k+v]?'✔':''}</span>${mini(k+':'+v)}<span>${OPT[k].label}：${OPT[k].o[v]}</span></button>`).join('')}</div>
      <div class="btnrow"><button class="btn primary big" data-act="prepdone"${all?'':' disabled'}>${all?'じゅんび かんりょう！ 🎉':'ぜんぶ ✔ したら おせるよ'}</button></div>
      <p class="note">これは めやすだよ。 かぜや たいちょうに あわせて、おうちの ひとと かんがえよう。</p>
    </section>
  </div>`;
};

/* ---- おとなの方へ */
function openGuide(){
  openModal(`<div class="guide">
    <h2>👪 先生・おうちの方へ</h2>
    <p>天気予報（天気マーク・最高／最低気温・降水確率）を読み取り、<b>季節や天気に合った服装と持ち物を自分で選ぶ</b>練習をするアプリです。選んだ服がキャラクターにそのまま反映されます。</p>
    <h3>3つの機能</h3>
    <ul>
      <li><b>きせかえ チャレンジ</b>：レベル1は「暑い・寒い」の言葉と天気マークから服のセットと持ち物を選びます。レベル2は気温を見て、上・下・上着・持ち物を選びます。レベル3は帽子・靴・かっぱ・折りたたみ傘も加わり、降水確率や寒暖差も考えます。答えは気温などのルールで判定するので、正解が1つとは限りません。</li>
      <li><b>あしたの じゅんび</b>：テレビや新聞の予報を入力すると、おすすめの服装と持ち物のチェックリストが出ます。前の晩の準備に使えます（インターネットから天気は取得しません）。</li>
      <li><b>よほうの みかた</b>：天気マーク、気温と服の目安、降水確率と傘の目安をまとめています。</li>
    </ul>
    <h3>判定の目安</h3>
    <ul>
      <li>半袖：最高23℃以上／長袖：28℃以下（その間はどちらも可）</li>
      <li>上着なし：最高20℃以上かつ最低12℃以上／薄い上着：最高12〜24℃／コート：最高14℃以下</li>
      <li>傘：降水確率50%以上または雨／折りたたみ傘：30〜40%（レベル3）</li>
      <li>水筒：最高25℃以上／帽子：晴れて25℃以上／手袋・マフラー：最高8℃以下または雪</li>
    </ul>
    <p>地域や学校のきまり（制服・体操服・黄色い帽子など）とちがう場合は、お子さんに合わせて補ってください。</p>
    <h3>記録について</h3>
    <p>スタンプは、この端末の中だけに保存されます。外部への送信はありません。</p>
    <div class="btnrow"><button class="btn primary big" data-act="close">とじる</button></div>
  </div>`);
}

/* ====== 操作 ====== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-slot],[data-set1],[data-item1],[data-pw],[data-step],[data-pc],[data-set]');
  if(!t||t.disabled)return;
  const d=t.dataset;
  if(d.set!==undefined){let v=d.val;v=v==='true'?true:v==='false'?false:/^\d+$/.test(v)?+v:v;S[d.set]=v;save();applySettings();openSettings();const b=layer.querySelector(`[data-set="${d.set}"][data-val="${d.val}"]`);if(b)b.focus();return;}
  if(d.slot!==undefined){
    const k=d.slot,v=d.v;sfx('tap');
    if(k==='items'){if(qz.sel.items.has(v))qz.sel.items.delete(v);else qz.sel.items.add(v);}else qz.sel[k]=v;
    if(qz.res)delete qz.res[k];
    qz.ex='normal';
    const sc=window.scrollY;R.qz_play();window.scrollTo(0,sc);
    const b=$(`[data-slot="${k}"][data-v="${v}"]`);if(b)b.focus({preventScroll:true});
    return;
  }
  if(d.set1!==undefined){pickSet1(d.set1);return;}
  if(d.item1!==undefined){pickItem1(d.item1);return;}
  if(d.pw!==undefined){prep.w=d.pw;if(d.pw==='ame'&&prep.rain<50)prep.rain=80;if(d.pw==='yuki'&&prep.hi>5){prep.hi=3;prep.lo=-1;}const sc=window.scrollY;R.prep();window.scrollTo(0,sc);return;}
  if(d.step!==undefined){
    const k=d.step,dd=+d.d;
    if(k==='rain')prep.rain=Math.max(0,Math.min(100,prep.rain+dd*10));
    else{prep[k]=Math.max(-10,Math.min(40,prep[k]+dd));if(prep.lo>prep.hi){if(k==='hi')prep.lo=prep.hi;else prep.hi=prep.lo;}}
    sfx('tap');const sc=window.scrollY;R.prep();window.scrollTo(0,sc);const b=$(`[data-step="${k}"][data-d="${d.d}"]`);if(b)b.focus({preventScroll:true});return;
  }
  if(d.pc!==undefined){prep.chk[d.pc]=!prep.chk[d.pc];sfx('tap');const sc=window.scrollY;R.prep();window.scrollTo(0,sc);const b=$(`[data-pc="${d.pc}"]`);if(b)b.focus({preventScroll:true});return;}
  const a=d.act;
  if(a==='bg'){if(e.target===t){TTS.stop();closeLayer();}return;}
  switch(a){
    case 'home':go('home');break;
    case 'qz':go('qz_level');break;
    case 'qzlv':startQuiz(+d.lv);break;
    case 'qzagain':startQuiz(qz.lv);break;
    case 'howto':go('howto');break;
    case 'stamps':go('stamps');break;
    case 'prep':prep=null;go('prep');break;
    case 'prepgo':prep.phase='out';prep.chk={};go('prep');break;
    case 'prepback':prep.phase='in';go('prep');break;
    case 'prepdone':{const r=award();sfx('ok');setTimeout(()=>sfx('stamp'),420);
      openModal(`<div style="text-align:center"><div style="font-size:4rem">🎒</div><h2>じゅんび かんりょう！</h2><div class="fb-stamp" style="justify-content:center"><span class="stamp pop">${r.icon}</span>スタンプ ゲット！${r.medal?' 🏅メダルも！':''}</div><p class="note">あしたの あさも、てんきを たしかめて から でかけよう。</p><div class="btnrow"><button class="btn primary big" data-act="home">🏠 ホーム</button></div></div>`);
      if(S.auto)TTS.speak('じゅんび かんりょう！');break;}
    case 'check':check();break;
    case 'toitem':closeLayer();qz.phase='item';qz.wrong=new Set();go('qz_play');break;
    case 'retry1':closeLayer();TTS.stop();R.qz_play();break;
    case 'retry2':closeLayer();TTS.stop();qz.ex='normal';{const sc=window.scrollY;R.qz_play();window.scrollTo(0,sc);}break;
    case 'qznext':closeLayer();TTS.stop();if(lastQ())go('qz_result');else{qz.idx++;qz.chosenSet=null;prepQz();go('qz_play');}break;
    case 'sayh':TTS.speak(sayText,t);break;
    case 'sayq':TTS.speak(qzSpeech(),t);break;
    case 'sayfb':TTS.speak(qz.fbText,t);break;
    case 'saypoint':TTS.speak(plain(qz.point),t);break;
    case 'quit':openModal(`<h2>🏠 ホームに もどる？</h2><p>ここまでの スタンプは のこるよ。</p><div class="btnrow"><button class="btn big" data-act="close">つづける</button><button class="btn primary big" data-act="home">もどる</button></div>`);break;
    case 'close':TTS.stop();closeLayer();resetArmed=false;break;
    case 'reset':
      if(!resetArmed){resetArmed=true;openSettings();layer.querySelector('[data-act="reset"]').focus();}
      else{store.stamps=[];store.medals=0;store.total=0;save();resetArmed=false;openSettings();live.textContent='スタンプを けしました';if(view==='home')R.home();}
      break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&layer.querySelector('.modal')){TTS.stop();closeLayer();}});
$('#btnSet').addEventListener('click',()=>{resetArmed=false;openSettings();});
$('#btnGuide').addEventListener('click',openGuide);

applySettings();
go('home',{nofocus:true});
if(location.hash==='#selftest')window.__F={L1,L2,L3,judge,recommend,startQuiz,prepQz,go,st:()=>({qz,prep,view}),store};
})();
</script>

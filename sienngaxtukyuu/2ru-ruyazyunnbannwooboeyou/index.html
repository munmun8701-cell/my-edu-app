<!DOCTYPE html>

<head>

<title>ルール・じゅんばんクエスト｜むん先生の学習クエスト</title>
<style>
:root{
  --fs:18px;
  --font-goth:"BIZ UDPGothic","BIZ UDPゴシック","Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Hiragino Sans","Meiryo",system-ui,sans-serif;

}
body[data-theme="cyber"]{

  --text:#eef6ff;--muted:#a3b8da;--accent:#3fe0ff;--accent-ink:#04121f;--accent2:#ffd84d;

}
body[data-theme="soft"]{
  --bg:#fff7ea;--panel:#ffffff;--panel2:#f2f7ff;--line:#d5e1f2;
  --text:#25303f;--muted:#5d6a82;--accent:#2a7fd4;--accent-ink:#ffffff;--accent2:#e8930c;

html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:var(--font-goth);background:var(--bg);color:var(--text);line-height:1.7;word-break:keep-all;overflow-wrap:break-word;overflow-wrap:anywhere;line-break:strict}

body[data-theme="cyber"]{

}
ruby{ruby-position:over}
rt{font-size:.52em;font-weight:500;letter-spacing:0}

button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}

/* ---------- header */

.scene svg{display:block;width:100%;height:auto}
.story{display:flex;flex-direction:column;gap:.55rem;margin-top:.8rem}
.ln{display:flex;gap:.55rem;align-items:flex-start}

.bub{position:relative;flex:1;padding:.55rem .9rem;border-radius:16px;background:var(--bubble);color:var(--bubble-ink);font-size:1.12rem;line-height:2;font-weight:600}

.saybtn.speaking,.say-mini.speaking{background:var(--accent2);color:#1d1600}
body.notts .saybtn,body.notts .say-mini,body.notts .fb-say{display:none!important}
.answers{display:flex;flex-direction:column;gap:.7rem}
.choice{display:flex;gap:.5rem;align-items:stretch}
.say-mini{flex:0 0 52px;border-radius:14px;border:2px solid var(--line);background:var(--panel);font-size:1.15rem}
.cbtn{flex:1;display:flex;align-items:center;gap:.8rem;text-align:left;min-height:76px;padding:.6rem 1rem;border-radius:18px;border:2px solid var(--line);background:var(--panel);font-size:1.16rem;font-weight:700;line-height:1.95;box-shadow:var(--glow)}
.cbtn:hover{border-color:var(--accent)}
.mk{flex:0 0 auto;width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;font-size:1.05rem;font-weight:800;line-height:1;color:#10131c}
.mk0{background:#ffd84d}.mk1{background:#ff9ec4}.mk2{background:#7beab1}
.cbtn.off{opacity:.38;filter:grayscale(.7);box-shadow:none}
.offtag{margin-left:auto;font-size:.72rem;padding:.05rem .5rem;border-radius:999px;border:1px solid var(--muted);color:var(--muted);white-space:nowrap}
/* line game */
.ghost{cursor:pointer}
.ghost .gs{fill:rgba(255,255,255,.62);stroke:#ff4fa0;stroke-width:3;stroke-dasharray:7 5}
.ghost .gl{font-size:26px;font-weight:800;fill:#c2185b;font-family:var(--font-goth)}
.ghost:hover .gs,.ghost:focus .gs{fill:#fff3fa}
.ghost.off{pointer-events:none;opacity:.25}
.ghost:focus{outline:none}
@media(prefers-reduced-motion:no-preference){.ghost:not(.off) .gs{animation:breathe 2.2s ease-in-out infinite}}
@keyframes breathe{50%{fill:rgba(255,230,244,.95)}}
/* order game */
.slots{list-style:none;margin:0 0 .9rem;padding:0;display:flex;flex-direction:column;gap:.45rem}
.slot{display:flex;align-items:center;gap:.7rem;min-height:56px;padding:.35rem .8rem;border-radius:14px;border:2px dashed var(--line);font-weight:700;line-height:1.9}
.slot .no{flex:0 0 auto;width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-weight:800;border:2px solid var(--line)}
.slot.next{border-color:var(--accent2)}
.slot.next .no{background:var(--accent2);color:#1d1600;border-color:var(--accent2)}
.slot.done{border-style:solid;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.slot.done .no{background:var(--ok);color:#04150d;border-color:var(--ok)}
.slot .q{color:var(--muted)}
.cbtn.card{font-size:1.08rem}
.cbtn.hint{border-color:var(--accent2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent2) 55%,transparent),0 0 20px color-mix(in srgb,var(--accent2) 35%,transparent)}
.omsg{min-height:1.8em;margin:.2rem 0 .6rem;font-weight:700;color:var(--accent2)}
@media(prefers-reduced-motion:no-preference){.shake{animation:shake .4s}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* ---------- feedback sheet / modal */
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,5,14,.62)}
@media(min-width:720px){.overlay{align-items:center;padding:1rem}}
.sheet{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--panel);border-radius:26px 26px 0 0;padding:1.2rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));border-top:5px solid var(--accent);box-shadow:var(--shadow)}
@media(min-width:720px){.sheet{border-radius:26px;border:2px solid var(--line);border-top:5px solid var(--accent)}}
@media(prefers-reduced-motion:no-preference){.sheet{animation:up .25s ease-out}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet.ok{border-top-color:var(--ok)}
.sheet.re{border-top-color:var(--accent2)}
.fb-top{display:flex;gap:1rem;align-items:center}
.fb-face{flex:0 0 auto;width:112px;height:112px;border-radius:50%;background:#fff;border:3px solid var(--line);overflow:hidden}
.fb-face svg{width:100%;height:100%;display:block}
.fb-title{margin:0;font-size:1.7rem;font-weight:800;line-height:1.4}
.sheet.ok .fb-title{color:var(--ok)}
.sheet.re .fb-title{color:var(--accent2)}
.fb-feel{margin:.3rem 0 0;font-weight:700;font-size:1rem;line-height:2}
.pill{display:inline-block;padding:0 .8rem;border-radius:999px;background:var(--panel2);border:2px solid var(--line);font-size:1.08rem;margin-left:.2rem}
.fb-why{margin:1rem 0 .4rem;font-size:1.2rem;font-weight:700;line-height:2.05}

.fb-stamp{display:flex;align-items:center;gap:.6rem;margin:.8rem 0 0;padding:.5rem .8rem;border-radius:14px;background:var(--panel2);font-weight:800}
.fb-btns{display:flex;gap:.7rem;margin-top:1.1rem;flex-wrap:wrap}
.fb-btns .primary{flex:1}
.stamp{display:inline-grid;place-items:center;width:3rem;height:3rem;border-radius:50%;background:#fff;border:3px solid #ffd84d;font-size:1.6rem;line-height:1}
@media(prefers-reduced-motion:no-preference){.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--panel);border-radius:24px 24px 0 0;padding:1.2rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));box-shadow:var(--shadow);border-top:5px solid var(--accent)}
@media(min-width:720px){.modal{border-radius:24px;border:2px solid var(--line);border-top:5px solid var(--accent)}}
.modal h2{margin:0 0 .6rem;font-size:1.35rem}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;padding:.65rem 0;border-bottom:1px solid var(--line)}

.btnrow{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.1rem}

.result{text-align:center;padding:1.4rem 1rem}
.result h2{margin:.2rem 0 .4rem;font-size:2rem}
.gotrow{display:flex;justify-content:center;flex-wrap:wrap;gap:.5rem;margin:.8rem 0}

</style>

<body data-theme="cyber" data-font="goth">
<header class="top">
  <div class="brand">
    <div class="sys">MUN-QUEST // LIFE SKILL 20</div>
    <h1>ルール・じゅんばん クエスト</h1>
  </div>
  <button class="tbtn" id="btnGuide" aria-label="先生・おうちの方へ">👪<small>おとなの方へ</small></button>
  <button class="tbtn" id="btnSet" aria-label="せってい">⚙️<small>せってい</small></button>
</header>
<main id="screen" tabindex="-1"></main>
<div id="layer"></div>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(function(){
'use strict';
/* ====== サイト設定（必要なら変更してください） ====== */
const STORE_KEY='munq_life20_rule_v1';   // この端末の中だけに保存（ほかのアプリのデータには触れません）
const PORTAL_URL='/';                    // 「サイトへもどる」のリンク先

// ===== 問題データ =====
// {漢字|よみ} はふりがな付きで表示され、読み上げでは「よみ」が使われます。
const N=t=>({t});
const SAY=(who,t)=>({who,t});
const O=(t,f,fl,w,who)=>({t,ok:true,f,fl,w,who});
const X=(t,f,fl,w,who)=>({t,ok:false,f,fl,w,who});

const Q=[
/* ================= じゅんばん ================= */
// ---- レベル1
{th:'junban',lv:1,type:'line',who:'sota',
 sc:{bg:'park',prop:'slide',ch:[['haru','happy'],['saki','normal'],['sota','normal']]},
 st:[N('すべりだいで あそびたいな。 ともだちが ならんで いるよ。')],
 q:'あなたは どこに ならぶ？',
 sp:{front:X('','angry','いやな きもち','まえに はいると、さきに まって いた ともだちが いやな きもちに なるよ。','haru'),
     end:O('','happy','うれしい','いちばん うしろに ならぶと、みんなが きもちよく あそべるね。','sota')}},
{th:'junban',lv:1,who:'saki',
 sc:{bg:'hall',prop:'fountain',ch:[['saki','normal',122],['me','normal',290]]},
 st:[N('みずを のみたいな。 さきさんが さきに のんで いるよ。')],

/* ====== 便利関数 ====== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ruby=s=>esc(s).replace(/\{([^|{}]+)\|([^{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');
const plain=s=>String(s).replace(/\{([^|{}]+)\|([^{}]+)\}/g,'$2');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];

const DEF_SET={auto:false,slow:true,sound:true,furi:true,size:1,theme:'cyber',font:'goth'};
const store=(function(){
  let d=null;
  try{d=JSON.parse(localStorage.getItem(STORE_KEY)||'null');}catch(e){d=null;}
  if(!d||typeof d!=='object')d={};
  d.settings=Object.assign({},DEF_SET,d.settings||{});
  if(!Array.isArray(d.stamps))d.stamps=[];
  if(typeof d.medals!=='number')d.medals=0;

  if(!d.clear||typeof d.clear!=='object')d.clear={};
  return d;
})();

function applySettings(){
  const b=document.body;
  b.dataset.theme=S.theme==='soft'?'soft':'cyber';
  b.dataset.font=S.font==='kyo'?'kyo':'goth';

/* ====== 読み上げ ====== */
const TTS={
  ok:('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window),
  voice:null,btn:null,
  pickVoice(){
    if(!this.ok)return;
    const vs=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));
    this.voice=vs.find(v=>v.localService&&/Nanami|Kyoko|O-ren|Haruka|Ayumi|Sayaka/i.test(v.name))||vs.find(v=>v.localService)||vs[0]||null;
  },
  speak(text,btn){
    if(!this.ok||!text)return;
    this.stop();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ja-JP'; if(this.voice)u.voice=this.voice;
    u.rate=S.slow?0.82:1.0; u.pitch=1.05;
    if(btn){this.btn=btn;btn.classList.add('speaking');}
    const done=()=>{if(btn)btn.classList.remove('speaking');};
    u.onend=done;u.onerror=done;
    setTimeout(()=>{try{speechSynthesis.speak(u);}catch(e){done();}},60);
  },
  stop(){
    if(!this.ok)return;
    try{speechSynthesis.cancel();}catch(e){}
    document.querySelectorAll('.speaking').forEach(b=>b.classList.remove('speaking'));
  }
};
if(TTS.ok){
  TTS.pickVoice();
  try{speechSynthesis.addEventListener('voiceschanged',()=>TTS.pickVoice());}catch(e){}
  // iPad等：最初のタッチで読み上げを使えるようにする
  const unlock=()=>{try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}document.removeEventListener('pointerdown',unlock);};
  document.addEventListener('pointerdown',unlock);
}else{document.body.classList.add('notts');}

/* ====== 効果音（やさしい音） ====== */
let actx=null;
function sfx(type){
  if(!S.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const t0=actx.currentTime+0.02;
    const seq={ok:[[784,0],[988,.12],[1175,.24]],retry:[[523,0],[440,.16]],tap:[[880,0]],stamp:[[1319,0],[1760,.09]]}[type]||[[660,0]];
    seq.forEach(([f,t])=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t0+t);
      g.gain.exponentialRampToValueAtTime(type==='tap'?0.08:0.16,t0+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+t+0.38);
      o.connect(g);g.connect(actx.destination);o.start(t0+t);o.stop(t0+t+0.42);
    });
  }catch(e){}
}

function itemBubble(item,x,y){
  return `<g transform="translate(${x} ${y})"><circle r="25" fill="#fff" stroke="#ffd84d" stroke-width="3"/><text text-anchor="middle" dominant-baseline="central" font-size="28" y="1">${item}</text></g>`;

function ghost(k,letter,x,off){
  return `<g class="ghost${off?' off':''}" data-spot="${k}" role="button" tabindex="${off?-1:0}" aria-label="${letter}の ばしょ" transform="translate(${x} 176) scale(.8)">`+
    `<rect x="-30" y="-130" width="60" height="150" fill="transparent"/>`+

    `<text class="gl" y="-79" text-anchor="middle" dominant-baseline="central">${letter}</text></g>`;
}
function lineSpots(q){
  const seq=q.lv===1?['front','c0','c1','c2','end']:['front','c0','mid','c1','c2','end'];
  return seq.filter(k=>k[0]==='c'||q.sp[k]);
}
function sceneSVG(q,opt){
  opt=opt||{};const sc=q.sc;const faces=opt.faces||{};
  let s=BG[sc.bg]();
  const prop=sc.prop&&PROP[sc.prop];
  if(prop)s+=prop.back();
  if(q.type==='line'){
    const seq=lineSpots(q);const L='あいう';let li=0;
    const xs=seq.map((k,i)=>130+(372-130)*i/(seq.length-1));
    seq.forEach((k,i)=>{
      if(k[0]==='c'){const [id,ex]=sc.ch[+k[1]];s+=fig(id,faces[id]||ex,xs[i],176,.8);}
      else{
        if(opt.chosen===k)s+=fig('me',q.sp[k].ok?'happy':'normal',xs[i],176,.8);
        else s+=ghost(k,L[li],xs[i],opt.off&&opt.off.has(k));
        li++;
      }
    });
  }else{
    const n=sc.ch.length;
    const x0=prop?150:46,x1=prop?388:354;
    const xs=sc.ch.map((c,i)=>c[2]!=null?c[2]:x0+(x1-x0)*(i+.5)/n);
    const scale=n>=4?.86:1;
    sc.ch.forEach(([id,ex],i)=>{s+=fig(id,faces[id]||ex,xs[i],176,id==='yui'&&sc.prop==='swing'?.92:scale);});
    if(prop&&prop.front)s+=prop.front();
    if(sc.item){const ix=n>=2?(xs[0]+xs[1])/2:200;s+=itemBubble(sc.item,ix,40);}
  }
  const alt=plain(q.st.map(l=>(l.who?CH[l.who].name+'「'+l.t+'」':l.t)).join(' '));
  return `<svg viewBox="0 0 400 200" role="img" aria-label="${esc(alt)}">${s}</svg>`;
}
function faceSVG(id,ex){return `<svg viewBox="-34 -38 68 70" aria-hidden="true">${headSVG(id,ex)}</svg>`;}

function startQuest(level,theme){
  let list=theme==='mix'?shuffle(Q.filter(q=>q.lv===level)).slice(0,5):Q.filter(q=>q.lv===level&&q.th===theme);
  st={level,theme,list,idx:0,got:[],medalUp:false};
  prepQ();go('play');
}
const cur=()=>st.list[st.idx];
function prepQ(){
  const q=cur();
  st.wrong=new Set();st.faces={};st.chosen=null;st.omsg='';
  if(q.type==='order'){st.placed=[];st.deck=shuffle(q.steps.map((_,i)=>i));
    // 正しい順のままにならないように
    if(st.deck.every((v,i)=>v===i))st.deck.reverse();
    st.miss=0;st.hint=-1;}
  else if(q.type!=='line'){st.corder=shuffle(q.ch.map((_,i)=>i));}
}
function storyHTML(q){
  return q.st.map(l=>{
    if(!l.who)return `<div class="ln narr"><div class="bub">${ruby(l.t)}</div></div>`;
    return `<div class="ln${l.who==='me'?' mine':''}"><div class="ava">${faceSVG(l.who,'normal')}</div><div class="bub"><span class="who">${esc(CH[l.who].name)}</span>${ruby(l.t)}</div></div>`;
  }).join('');
}
function renderPlay(){
  const q=cur(),n=st.list.length,T=THEMES[st.theme],L=LEVELS[st.level];
  const dots=st.list.map((_,i)=>`<i class="${i<st.idx?'done':''}${i===st.idx?' now':''}"></i>`).join('');
  screen.innerHTML=`
  <div class="playbar">
    <button class="backlink" data-act="quit">🏠 やめる</button>
    <div class="dots" aria-hidden="true">${dots}</div>
    <span class="count">${st.idx+1} / ${n}</span>
  </div>
  <div class="playgrid">
    <section>
      <div class="scene" id="scene">${sceneSVG(q,{faces:st.faces,chosen:st.chosen,off:st.wrong})}</div>
      <div class="story">${storyHTML(q)}</div>
    </section>
    <section>
      <div class="ask"><h2 id="qtitle">${ruby(q.q)}</h2><button class="saybtn" data-act="sayq" aria-label="もんだいを よみあげる">🔊 よむ</button></div>
      <div id="answers">${answersHTML(q)}</div>
      <p class="note"><span class="lvchip" style="--lc:${L.c}">レベル${st.level}</span> ${esc(T.icon)} ${esc(T.name)}</p>
    </section>
  </div>`;
  if(S.auto)TTS.speak(questionText(q),$('[data-act="sayq"]'));
}
function answersHTML(q){
  if(q.type==='line'){
    const sp=lineSpots(q).filter(k=>k[0]!=='c');const L='あいう';
    return `<p class="fb-sub" style="margin:0 0 .5rem">え の なかの ○ か、したの ボタンを タッチしてね。</p><div class="answers">`+
      sp.map((k,i)=>{const off=st.wrong.has(k);
        return `<div class="choice"><button class="cbtn${off?' off':''}" data-spot="${k}"${off?' disabled':''}><span class="mk mk${i}">${L[i]}</span><span>${L[i]} の ばしょに ならぶ</span>${off?'<span class="offtag">えらんだ</span>':''}</button></div>`;}).join('')+`</div>`;
  }
  if(q.type==='order'){
    const n=q.steps.length;
    let slots='';
    for(let i=0;i<n;i++){
      if(i<st.placed.length)slots+=`<li class="slot done"><span class="no">${i+1}</span><span>${ruby(q.steps[st.placed[i]])}</span></li>`;
      else slots+=`<li class="slot${i===st.placed.length?' next':''}"><span class="no">${i+1}</span><span class="q">？</span></li>`;
    }
    const deck=st.deck.filter(k=>!st.placed.includes(k)).map(k=>
      `<div class="choice"><button class="say-mini" data-sayk="${k}" aria-label="カードを よみあげる">🔊</button><button class="cbtn card${st.hint===k?' hint':''}" data-card="${k}"><span>${ruby(q.steps[k])}</span></button></div>`).join('');
    return `<ol class="slots" aria-label="ならべた じゅんばん">${slots}</ol><p class="omsg" aria-live="polite">${ruby(st.omsg||'')}</p><div class="answers">${deck}</div>`;
  }
  return `<div class="answers">`+st.corder.map((ci,pos)=>{const c=q.ch[ci];const off=st.wrong.has(ci);
    return `<div class="choice"><button class="say-mini" data-sayc="${ci}" aria-label="${MARK_READ[pos]}を よみあげる">🔊</button><button class="cbtn${off?' off':''}" data-ch="${ci}"${off?' disabled':''}><span class="mk mk${pos}" aria-label="${MARK_READ[pos]}">${MARK[pos]}</span><span>${ruby(c.t)}</span>${off?'<span class="offtag">えらんだ</span>':''}</button></div>`;}).join('')+`</div>`;
}
function questionText(q){
  let t=q.st.map(l=>(l.who?CH[l.who].name+'。 ':'')+plain(l.t)).join(' ')+' '+plain(q.q)+'。';
  if(q.type==='line'){const k=lineSpots(q).filter(k=>k[0]!=='c');t+=' '+('あいう'.slice(0,k.length).split('').join('、'))+' から えらんでね。';}
  else if(q.type==='order')t+=' カードを、する じゅんばんに タッチしてね。';
  else t+=' '+st.corder.filter(ci=>!st.wrong.has(ci)).map(ci=>MARK_READ[st.corder.indexOf(ci)]+'、'+plain(q.ch[ci].t)).join('。 ')+'。';
  return t;
}
function refreshScene(){const el=$('#scene');if(el)el.innerHTML=sceneSVG(cur(),{faces:st.faces,chosen:st.chosen,off:st.wrong});}
function refreshAnswers(){const el=$('#answers');if(el)el.innerHTML=answersHTML(cur());}

function award(){
  const icon=pick(STAMPS);st.got.push(icon);
  store.stamps.push(icon);store.total++;
  if(store.stamps.length>=20){store.medals++;store.stamps=[];st.medalUp=true;}
  save();return icon;
}
function choose(ci){
  const q=cur(),c=q.ch[ci];if(!c||st.wrong.has(ci))return;
  if(c.ok)feedback(true,c);else{st.wrong.add(ci);feedback(false,c);}
}
function chooseSpot(k){
  const q=cur(),c=q.sp[k];if(!c||st.wrong.has(k))return;
  st.chosen=k;
  if(c.ok)feedback(true,c);else{st.wrong.add(k);feedback(false,c);}
}
function tapCard(k,el){
  const q=cur();
  if(k===st.placed.length){
    st.placed.push(k);st.miss=0;st.hint=-1;
    if(st.placed.length===q.steps.length){st.omsg='';refreshAnswers();feedback(true,{ok:true,who:q.who,f:'happy',fl:q.fl||'うれしい',w:q.w});return;}
    sfx('tap');st.omsg=st.placed.length+'ばんめ、OK！ つぎは どれかな？';refreshAnswers();
    live.textContent=plain(st.omsg);
  }else{
    st.miss++;sfx('retry');
    st.omsg=(st.placed.length+1)+'ばんめに する ことは どれかな？';
    if(st.miss>=2){st.hint=st.placed.length;st.omsg+=' ひかって いる カードを みてね。';}
    refreshAnswers();live.textContent=plain(st.omsg);
    const nb=$(`[data-card="${k}"]`);if(nb){nb.classList.add('shake');setTimeout(()=>nb.classList.remove('shake'),450);}
    if(S.auto)TTS.speak(plain(st.omsg));
  }
}
function feedback(ok,c){
  const q=cur();const who=c.who||q.who;
  st.faces={};st.faces[who]=c.f;refreshScene();
  let stampHTML='';
  if(ok){const icon=award();sfx('ok');setTimeout(()=>sfx('stamp'),420);
    stampHTML=`<div class="fb-stamp"><span class="stamp pop">${icon}</span>スタンプ ゲット！</div>`;}
  else sfx('retry');
  const last=st.idx===st.list.length-1;
  const name=CH[who].name;
  const title=ok?pick(GOOD):'ちょっと まって！';
  layer.innerHTML=`
  <div class="overlay">
    <div class="sheet ${ok?'ok':'re'}" role="dialog" aria-modal="true" aria-labelledby="fbT">
      <div class="fb-top">
        <div class="fb-face">${faceSVG(who,c.f)}</div>
        <div><p class="fb-title" id="fbT">${ok?'⭕':'💭'} ${title}</p>
        <p class="fb-feel">${esc(name)}の きもち<span class="pill">${ruby(c.fl)}</span></p></div>
      </div>
      <p class="fb-why">${ruby(c.w)}</p>
      ${ok?'':'<p class="fb-sub">ほかの えらびかたを かんがえて みよう。</p>'}
      ${stampHTML}
      <div class="fb-btns">
        <button class="btn fb-say" data-act="sayfb">🔊 よむ</button>
        <button class="btn primary big" data-act="${ok?'next':'retry'}">${ok?(last?'けっかを みる ▶':'つぎへ ▶'):'もういちど えらぶ'}</button>
      </div>
    </div>
  </div>`;
  st.fbText=name+'の きもちは、'+plain(c.fl)+'。 '+plain(c.w)+(ok?'':' ほかの えらびかたを かんがえて みよう。');
  const p=layer.querySelector('.btn.primary');if(p)p.focus();
  if(S.auto)setTimeout(()=>TTS.speak(st.fbText,layer.querySelector('[data-act="sayfb"]')),ok?650:350);
}
function nextQ(){
  closeLayer();TTS.stop();
  if(st.idx>=st.list.length-1){store.clear[st.level+'-'+st.theme]=true;save();go('result');return;}
  st.idx++;prepQ();go('play');
}
function retryQ(){
  closeLayer();TTS.stop();
  st.faces={};st.chosen=null;refreshScene();refreshAnswers();
  const b=$('#answers .cbtn:not(.off)');if(b)b.focus();
}

/* ---- けっか */
function renderResult(){
  const T=THEMES[st.theme];
  screen.innerHTML=`
  <section class="panel result">
    <div class="sys">QUEST CLEAR // LEVEL ${st.level}</div>
    <h2>クエスト クリア！</h2>
    <div class="gotrow">${st.got.map((i,n)=>`<span class="stamp pop" style="animation-delay:${n*.12}s">${i}</span>`).join('')}</div>
    <p style="font-weight:800;font-size:1.15rem;margin:.2rem 0">スタンプを ${st.got.length}こ ゲット！</p>
    ${st.medalUp?'<div class="medal">🏅 スタンプカードが いっぱいに なって メダルを ゲット！</div>':''}
    <div class="pointcard">
      <div class="h"><span>📌 おぼえて おこう</span><button class="saybtn" data-act="saypoint" aria-label="よみあげる">🔊</button></div>
      <p>${ruby(T.point)}</p>
    </div>
    <div class="btnrow" style="max-width:640px;margin-left:auto;margin-right:auto">
      <button class="btn primary big" data-act="again">🔁 もういちど</button>
      <button class="btn big" data-act="themes">📚 テーマを えらぶ</button>
      <button class="btn big" data-act="stamps">🎫 スタンプカード</button>
    </div>
  </section>`;
  if(S.auto)TTS.speak('クエスト クリア！ おぼえて おこう。 '+plain(T.point),$('[data-act="saypoint"]'));
}

/* ---- スタンプカード */
function renderStamps(){
  const slots=Array.from({length:20},(_,i)=>store.stamps[i]?`<span class="on">${store.stamps[i]}</span>`:`<span aria-hidden="true"></span>`).join('');
  const rows=THEME_KEYS.concat('mix').map(k=>`<tr><th class="tn">${THEMES[k].icon} ${esc(THEMES[k].name)}</th>${[1,2,3].map(lv=>store.clear[lv+'-'+k]?'<td class="y">✔</td>':'<td>－</td>').join('')}</tr>`).join('');
  screen.innerHTML=`
  <button class="backlink" data-act="${st&&view==='stamps'&&st.fromResult?'result':'home'}">◀ もどる</button>
  <section class="panel result" style="margin-top:.8rem">
    <div class="sys">STAMP CARD</div>
    <h2>スタンプカード</h2>
    <p style="font-weight:700;margin:.2rem 0">あと ${20-store.stamps.length}こで メダル！ ${store.medals?` 🏅×${store.medals}`:''}</p>
    <div class="card20" aria-label="スタンプ ${store.stamps.length}こ">${slots}</div>
    <p class="note">これまでに あつめた スタンプ：${store.total}こ</p>
    <h3 style="margin:1.2rem 0 .2rem">クリアした クエスト</h3>
    <div style="overflow-x:auto"><table class="cleartable">
      <tr><th></th>${[1,2,3].map(lv=>`<th class="lvh" style="--lc:${LEVELS[lv].c}">Lv.${lv}</th>`).join('')}</tr>${rows}
    </table></div>
  </section>`;
}

/* ====== ポップアップ ====== */
function closeLayer(){layer.innerHTML='';}
function openModal(html){
  layer.innerHTML=`<div class="overlay" data-act="bg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const f=layer.querySelector('.modal button');if(f)f.focus();
}
let resetArmed=false;
function seg(key,opts){
  return `<div class="seg" role="group">`+opts.map(([v,l])=>`<button data-set="${key}" data-val="${v}" aria-pressed="${String(S[key])===String(v)}">${l}</button>`).join('')+`</div>`;
}
function openSettings(){
  openModal(`
    <h2>⚙️ せってい</h2>
    <div class="setrow"><span class="lbl">🔊 じどうで よみあげ</span>${seg('auto',[['true','オン'],['false','オフ']])}</div>
    <div class="setrow"><span class="lbl">🐢 よむ はやさ</span>${seg('slow',[['true','ゆっくり'],['false','ふつう']])}</div>
    ${TTS.ok?'':'<p class="note">この たんまつでは よみあげが つかえません。</p>'}
    <div class="setrow"><span class="lbl">🎵 こうかおん</span>${seg('sound',[['true','オン'],['false','オフ']])}</div>
    <div class="setrow"><span class="lbl">あ ふりがな</span>${seg('furi',[['true','オン'],['false','オフ']])}</div>
    <div class="setrow"><span class="lbl">🔠 もじの おおきさ</span>${seg('size',[['0','小'],['1','中'],['2','大'],['3','特大']])}</div>
    <div class="setrow"><span class="lbl">🎨 いろ</span>${seg('theme',[['cyber','サイバー'],['soft','やさしい いろ']])}</div>
    <div class="setrow"><span class="lbl">✏️ もじの かたち</span>${seg('font',[['goth','ゴシック'],['kyo','きょうかしょ']])}</div>
    <div class="setrow"><span class="lbl">🗑 スタンプの きろく</span><button class="btn danger" data-act="reset">${resetArmed?'ほんとうに けす？（もういちど おす）':'ぜんぶ けす'}</button></div>
    <div class="btnrow"><button class="btn primary big" data-act="close">とじる</button></div>`);
}
function openGuide(){
  openModal(`<div class="guide">
    <h2>👪 先生・おうちの方へ</h2>
    <p>順番を待つ・物を貸し借りする・遊びのルールを守る・話す順番を守る、という生活の場面で、<b>「相手の気持ち」を手がかりに望ましい行動を選ぶ</b>練習をするアプリです。</p>
    <h3>レベルの選び方</h3>
    <ul>
      <li>レベル1：2択。分かち書きのひらがなで、短い文です。</li>
      <li>レベル2：3択。漢字にはふりがなが付きます。</li>
      <li>レベル3：3択に加えて、行動の手順を並べる問題があります。</li>
    </ul>
    <p>学年は目安です。お子さんの読む力や経験に合わせて選んでください。1つのテーマは4問（まぜこぜは5問）、3〜5分ほどで終わります。</p>
    <h3>間違えても大丈夫なつくり</h3>
    <p>減点はありません。選んだ行動で相手がどんな気持ちになるかを、表情と言葉で示します。選んだ答えは選べなくなるので、最後は必ず正しい行動にたどり着き、成功体験で終われます。</p>
    <h3>読み上げ・見やすさ</h3>
    <p>🔊ボタンで文や選択肢を読み上げます（端末の音声機能を使います）。「せってい」で自動読み上げ、読む速さ、ふりがな、文字の大きさ、色、文字の形（教科書体）を変えられます。</p>
    <h3>声かけの例</h3>
    <ul>
      <li>「この子は、どんな気持ちかな？」</li>
      <li>「学校（おうち）の、どんなときに使えそう？」</li>
      <li>実際の場面で「アプリでやった、いちばん後ろに並ぶ、だね」と思い出せるように声をかけると、生活につながりやすくなります。</li>
    </ul>
    <h3>記録について</h3>
    <p>スタンプとクリアの記録は、この端末の中だけに保存されます。外部への送信はありません。</p>
    <p class="note">場面の答えは一例です。学級やご家庭のルール、お子さんの特性に合わせて補ってください。</p>
    <div class="btnrow"><button class="btn primary big" data-act="close">とじる</button></div>
  </div>`);
}

/* ====== 操作 ====== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-ch],[data-spot],[data-card],[data-sayc],[data-sayk],[data-set]');
  if(!t)return;
  if(t.dataset.set!==undefined){
    let v=t.dataset.val;v=v==='true'?true:v==='false'?false:/^\d+$/.test(v)?+v:v;
    S[t.dataset.set]=v;save();applySettings();openSettings();
    const b=layer.querySelector(`[data-set="${t.dataset.set}"][data-val="${t.dataset.val}"]`);if(b)b.focus();
    return;
  }
  if(t.dataset.ch!==undefined){choose(+t.dataset.ch);return;}
  if(t.dataset.spot!==undefined){chooseSpot(t.dataset.spot);return;}
  if(t.dataset.card!==undefined){tapCard(+t.dataset.card,t);return;}
  if(t.dataset.sayc!==undefined){const q=cur();const pos=st.corder.indexOf(+t.dataset.sayc);TTS.speak(MARK_READ[pos]+'。 '+plain(q.ch[+t.dataset.sayc].t),t);return;}
  if(t.dataset.sayk!==undefined){TTS.speak(plain(cur().steps[+t.dataset.sayk]),t);return;}
  const a=t.dataset.act;
  if(a==='bg'){if(e.target===t){TTS.stop();closeLayer();}return;}
  switch(a){
    case 'level':selLevel=+t.dataset.lv;go('themes');break;
    case 'theme':startQuest(selLevel,t.dataset.th);break;
    case 'home':go('home');break;
    case 'themes':selLevel=st?st.level:selLevel;go('themes');break;
    case 'again':startQuest(st.level,st.theme);break;
    case 'stamps':if(st&&view==='result')st.fromResult=true;else if(st)st.fromResult=false;go('stamps');break;
    case 'result':go('result');break;
    case 'sayq':TTS.speak(questionText(cur()),t);break;
    case 'sayfb':TTS.speak(st.fbText,t);break;
    case 'saypoint':TTS.speak(plain(THEMES[st.theme].point),t);break;
    case 'next':nextQ();break;
    case 'retry':retryQ();break;
    case 'quit':
      openModal(`<h2>🏠 ホームに もどる？</h2><p>ここまでの スタンプは のこるよ。</p><div class="btnrow"><button class="btn big" data-act="close">つづける</button><button class="btn primary big" data-act="home">もどる</button></div>`);break;
    case 'close':TTS.stop();closeLayer();resetArmed=false;break;
    case 'reset':
      if(!resetArmed){resetArmed=true;openSettings();layer.querySelector('[data-act="reset"]').focus();}
      else{store.stamps=[];store.medals=0;store.total=0;store.clear={};save();resetArmed=false;openSettings();live.textContent='きろくを けしました';if(view==='home')renderHome();}
      break;
  }
});
document.addEventListener('keydown',e=>{
  const g=e.target.closest&&e.target.closest('.ghost');
  if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();chooseSpot(g.dataset.spot);}
});
$('#btnSet').addEventListener('click',()=>{resetArmed=false;openSettings();});
$('#btnGuide').addEventListener('click',openGuide);

applySettings();
go('home',{nofocus:true});
if(location.hash==='#selftest')window.__RQ={Q,THEMES,startQuest,choose,chooseSpot,tapCard,nextQ,retryQ,st:()=>st,store};
})();
</script>

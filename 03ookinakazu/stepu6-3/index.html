<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>筆算　6時間目　③　</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
  <h1>こたえが 9000 になる たし算</h1>
  <p class="instruction">□ に すきな数を 入れて、答えが 9000 になる 筆算（ひっさん）を つくろう！</p>
  
  <div class="math-board">
    <div class="grid-background">
      <div class="row">
        <span class="operator"></span>
        <input type="text" inputmode="numeric" maxlength="1" id="t1000" class="box" placeholder="">
        <input type="text" inputmode="numeric" maxlength="1" id="t100" class="box" placeholder="">
        <input type="text" inputmode="numeric" maxlength="1" id="t10" class="box" placeholder="">
        <input type="text" inputmode="numeric" maxlength="1" id="t1" class="box" placeholder="">
      </div>
      <div class="row">
        <span class="operator">＋</span>
        <input type="text" inputmode="numeric" maxlength="1" id="b1000" class="box" placeholder="">
        <input type="text" inputmode="numeric" maxlength="1" id="b100" class="box" placeholder="">
        <input type="text" inputmode="numeric" maxlength="1" id="b10" class="box" placeholder="">
        <input type="text" inputmode="numeric" maxlength="1" id="b1" class="box" placeholder="">
      </div>
      <div class="line"></div>
      <div class="row result-row">
        <span class="operator"></span>
        <div class="box result-box">9</div>
        <div class="box result-box">0</div>
        <div class="box result-box">0</div>
        <div class="box result-box">0</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="btn-hint" class="btn hint-btn">💡 ヒントをみる</button>
    <button id="btn-check" class="btn check-btn">こたえあわせ</button>
  </div>

  <div id="message-area" class="message-area hidden"></div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>大きな数の筆算　３時間目　①</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
    <div class="header-title">🌟 筆算のしかたを考えよう 🌟</div>

    <div class="question-box">
        もえさんは <strong>315円</strong> 持っています。<br>
        <strong>194円</strong> のスティックのりを買うと、何円のこりますか。
    </div>

    <div class="nav-board" id="nav-board">
        <div class="nav-title" id="nav-title">ステップ ①：式をたてよう</div>
        <div class="nav-msg" id="nav-msg">
            のこりはいくらかをもとめる式を書いて、「かくにん」をおそう！
        </div>
    </div>

    <div class="section-card" id="section-formula">
        <div class="calc-row justify-center">
            式： 
            <input type="text" id="f-op1" class="num-input" style="width: 70px;" maxlength="3">
            <span style="margin: 0 10px; font-weight: bold; font-size: 20px;">－</span>
            <input type="text" id="f-op2" class="num-input" style="width: 70px;" maxlength="3">
            <button class="btn-check" id="btn-formula" onclick="checkFormula()">かくにん</button>
        </div>
    </div>

    <div class="section-card hidden" id="section-calc">
        <div class="split-layout">
            
            <div class="calc-workspace">
                <div class="grid-paper">
                    <div class="cell blank"></div>
                    <div class="cell carry-wrapper"><input type="text" id="memo-100" class="carry-input hidden" maxlength="1" placeholder="2"></div>
                    <div class="cell carry-wrapper"><input type="text" id="memo-10" class="carry-input hidden" maxlength="2" placeholder="10"></div>
                    <div class="cell blank"></div>

                    <div class="cell blank"></div>
                    <div class="cell num-cell col-100" id="op1-100">3</div>
                    <div class="cell num-cell col-10" id="op1-10">1</div>
                    <div class="cell num-cell col-1" id="op1-1">5</div>

                    <div class="cell sign">－</div>
                    <div class="cell num-cell col-100 line">1</div>
                    <div class="cell num-cell col-10 line">9</div>
                    <div class="cell num-cell col-1 line">4</div>

                    <div class="cell blank"></div>
                    <div class="cell input-wrapper" id="wrap-100"><input type="text" id="ans-100" class="ans-input col-100" maxlength="1" disabled></div>
                    <div class="cell input-wrapper" id="wrap-10"><input type="text" id="ans-10" class="ans-input col-10" maxlength="1" disabled></div>
                    <div class="cell input-wrapper" id="wrap-1"><input type="text" id="ans-1" class="ans-input col-1" maxlength="1" disabled></div>
                </div>
                <button class="btn-check mt-15" id="btn-calc" onclick="processCalc()">一の位をかくにん</button>
            </div>

            <div class="blocks-workspace">
                <div class="blocks-title">お金のブロックで考えよう</div>
                
                <div class="block-row">
                    <div class="block-label">百の位</div>
                    <div class="block-area" id="blocks-100">
                        <div class="coin coin-100">100</div><div class="coin coin-100">100</div><div class="coin coin-100">100</div>
                    </div>
                </div>

                <div class="block-row">
                    <div class="block-label">十の位</div>
                    <div class="block-area" id="blocks-10">
                        <div class="coin coin-10">10</div>
                    </div>
                </div>

                <div class="block-row">
                    <div class="block-label">一の位</div>
                    <div class="block-area" id="blocks-1">
                        <div class="coin coin-1">1</div><div class="coin coin-1">1</div><div class="coin coin-1">1</div><div class="coin coin-1">1</div><div class="coin coin-1">1</div>
                    </div>
                </div>

                <button class="btn-action hidden" id="btn-borrow" onclick="doBorrow()">
                    🔄 百の位から「100」をかりて、十の位「10こ」に両がえする
                </button>
            </div>
        </div>
    </div>

    <div class="section-card hidden" id="section-check">
        <div class="character-hint">
            <div class="avatar">👦 こうた</div>
            <div class="bubble">答えのたしかめをしよう。<br><strong>194 ＋ [答え] ＝ 315</strong> になるかな？</div>
        </div>
        <div class="calc-row justify-center">
            たしかめ： 194 ＋ 
            <input type="text" id="check-ans" class="num-input" style="width: 70px;" maxlength="3">
            ＝ 315
            <button class="btn-check" id="btn-check-ans" onclick="checkFinal()">かくにん</button>
        </div>
    </div>

    <button class="btn-reset" onclick="resetApp()">最初からやりなおす</button>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

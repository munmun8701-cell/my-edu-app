<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>大きな数の筆算　１時間目　②</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
    <div class="header-title">🌟 筆算のしかたを考えよう 🌟</div>

    <div class="problem-area">
        <div class="character-hint">
            <div class="avatar">👦 みさき</div>
            <div class="bubble">
                ２けたの数のたし算と<br>
                <span class="highlight-text">同じように考える</span>と<br>
                <strong>65 ＋ 72</strong> のときは…。
            </div>
        </div>

        <div class="eq-label">365 ＋ 472 ＝ <span id="final-ans-display">？</span></div>
    </div>

    <div class="nav-board" id="nav-board">
        <div class="nav-title" id="nav-title">ステップ ① ： 一の位（いちのくらい）</div>
        <div class="nav-msg" id="nav-msg">
            まずは一番右の「一の位」から計算しよう。<br>
            <strong>5 ＋ 2 ＝ ？</strong><br>
            ピンクのマスに答えを入れて、「かくにん」を押してね。
        </div>
    </div>

    <div class="calc-workspace">
        <div class="grid-paper">
            <div class="cell blank"></div>
            <div class="cell carry" id="carry-100"></div>
            <div class="cell carry" id="carry-10"></div>
            <div class="cell blank"></div>

            <div class="cell blank"></div>
            <div class="cell num-cell col-100">3</div>
            <div class="cell num-cell col-10">6</div>
            <div class="cell num-cell col-1">5</div>

            <div class="cell sign">＋</div>
            <div class="cell num-cell col-100 line">4</div>
            <div class="cell num-cell col-10 line">7</div>
            <div class="cell num-cell col-1 line">2</div>

            <div class="cell blank"></div>
            <div class="cell input-wrapper">
                <input type="text" id="ans-100" class="ans-input col-100-input" maxlength="1" disabled>
            </div>
            <div class="cell input-wrapper">
                <input type="text" id="ans-10" class="ans-input col-10-input" maxlength="1" disabled>
            </div>
            <div class="cell input-wrapper active-col">
                <input type="text" id="ans-1" class="ans-input col-1-input" maxlength="1">
            </div>
        </div>

        <div class="action-area">
            <button class="btn-check" id="btn-check" onclick="checkCurrentStep()">かくにん</button>
        </div>
    </div>

    <button class="btn-reset" onclick="resetApp()">最初からやりなおす</button>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

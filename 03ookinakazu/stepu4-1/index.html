<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>筆算　4時間目　①</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
    <div class="header-title">✨ 筆算のしかたを考えよう ✨</div>

    <div class="nav-board" id="nav-board">
        <div class="nav-title" id="nav-title">話し合ってみよう！</div>
        <div class="nav-msg" id="nav-msg">
            「2－5」はできないね。十の位からかりようとしたけど、十の位は「0」だ！<br>
            <strong>こんなとき、どうすれば計算できるかな？</strong><br>
            左の数カードをさわって、友だちとためしてみよう！
        </div>
    </div>

    <div class="workspace">
        <div class="cards-area">
            <div class="area-title">数カードを操作してみよう</div>
            <div class="cards-instruction">
                💡 100のカードをさわると 10のカード10まいに、<br>
                10のカードをさわると 1のカード10まいに <strong>両がえ</strong> できるよ！
            </div>
            
            <div class="card-columns">
                <div class="card-col">
                    <div class="col-header bg-100">百のくらい</div>
                    <div class="col-cards" id="col-100"></div>
                </div>
                <div class="card-col">
                    <div class="col-header bg-10">十のくらい</div>
                    <div class="col-cards" id="col-10"></div>
                </div>
                <div class="card-col">
                    <div class="col-header bg-1">一のくらい</div>
                    <div class="col-cards" id="col-1"></div>
                </div>
            </div>
            <button class="btn-reset-cards" onclick="resetCards()">🔄 カードを最初の「402」にもどす</button>
        </div>

        <div class="hissan-area">
            <div class="area-title">筆算で書いてみよう</div>
            
            <div class="hissan-grid">
                <div class="cell blank"></div>
                <div class="cell memo-wrapper"><input type="text" class="memo-input" id="memo-top-100"></div>
                <div class="cell memo-wrapper"><input type="text" class="memo-input" id="memo-top-10"></div>
                <div class="cell memo-wrapper"><input type="text" class="memo-input" id="memo-top-1"></div>

                <div class="cell blank"></div>
                <div class="cell memo-wrapper"><input type="text" class="memo-input" id="memo-mid-100"></div>
                <div class="cell memo-wrapper"><input type="text" class="memo-input" id="memo-mid-10"></div>
                <div class="cell memo-wrapper"><input type="text" class="memo-input" id="memo-mid-1"></div>

                <div class="cell blank"></div>
                <div class="cell num-base" id="base-100">4</div>
                <div class="cell num-base" id="base-10">0</div>
                <div class="cell num-base" id="base-1">2</div>

                <div class="cell sign">－</div>
                <div class="cell num-sub line">1</div>
                <div class="cell num-sub line">7</div>
                <div class="cell num-sub line">5</div>

                <div class="cell blank"></div>
                <div class="cell input-wrapper"><input type="text" inputmode="numeric" id="ans-100" class="ans-input" maxlength="1"></div>
                <div class="cell input-wrapper"><input type="text" inputmode="numeric" id="ans-10" class="ans-input" maxlength="1"></div>
                <div class="cell input-wrapper"><input type="text" inputmode="numeric" id="ans-1" class="ans-input" maxlength="1"></div>
            </div>

            <div class="action-btn-area">
                <button class="btn-check" onclick="checkAnswer()">答え合わせ</button>
            </div>
        </div>
    </div>

    <div class="matome-box hidden" id="matome-box">
        <div class="matome-label">まとめ</div>
        十の位からくり下げられないときは、<br>
        <strong>百の位からくり下げて</strong> 計算すればいいね！
    </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

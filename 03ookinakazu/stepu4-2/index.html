<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>筆算　4時間目　②</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
    <div class="header-title">✨ ひき算の筆算れんしゅう（12問） ✨</div>

    <div class="top-controls">
        <div class="problem-selector">
            もんだいをえらぼう：
            <select id="prob-select" onchange="loadProblem()">
                <option value="1">① 408 － 279</option>
                <option value="2">② 905 － 608</option>
                <option value="3">③ 603 － 219</option>
                <option value="4">④ 702 － 644</option>
                <option value="5">⑤ 405 － 347</option>
                <option value="6">⑥ 300 － 292</option>
                <option value="7">⑦ 503 － 76</option>
                <option value="8">⑧ 206 － 18</option>
                <option value="9">⑨ 307 － 69</option>
                <option value="10">⑩ 801 － 3</option>
                <option value="11">⑪ 600 － 8</option>
                <option value="12">⑫ 905 － 7</option>
            </select>
        </div>
    </div>

    <div class="nav-board" id="nav-board">
        <div class="nav-title" id="nav-title">めあて：くり下がりに気をつけて計算しよう</div>
        <div class="nav-msg" id="nav-msg">
            筆算の数字（百の位や十の位）をタップすると、<strong>ノートのように斜線が引けて、くり下がりの数字が出るよ！</strong><br>
            もし計算のしかたが分からなくなったら、下の「💡 ヒント」ボタンをおしてね！
        </div>
    </div>

    <div class="workspace">
        <div class="hissan-area">
            <div class="area-title">筆算</div>
            <div class="hissan-grid">
                <div class="cell blank"></div>
                <div class="cell memo-wrapper"><input type="text" inputmode="numeric" class="memo-input" id="memo-top-100" maxlength="2"></div>
                <div class="cell memo-wrapper"><input type="text" inputmode="numeric" class="memo-input" id="memo-top-10" maxlength="2"></div>
                <div class="cell memo-wrapper"><input type="text" inputmode="numeric" class="memo-input" id="memo-top-1" maxlength="2"></div>

                <div class="cell blank"></div>
                <div class="cell memo-wrapper"><input type="text" inputmode="numeric" class="memo-input" id="memo-mid-100" maxlength="2"></div>
                <div class="cell memo-wrapper"><input type="text" inputmode="numeric" class="memo-input" id="memo-mid-10" maxlength="2"></div>
                <div class="cell memo-wrapper"><input type="text" inputmode="numeric" class="memo-input" id="memo-mid-1" maxlength="2"></div>

                <div class="cell blank"></div>
                <div class="cell num-base" id="base-100" onclick="handleCross(this, 100)"></div>
                <div class="cell num-base" id="base-10" onclick="handleCross(this, 10)"></div>
                <div class="cell num-base" id="base-1"></div>

                <div class="cell sign">－</div>
                <div class="cell num-sub line" id="sub-100"></div>
                <div class="cell num-sub line" id="sub-10"></div>
                <div class="cell num-sub line" id="sub-1"></div>

                <div class="cell blank"></div>
                <div class="cell input-wrapper"><input type="text" inputmode="numeric" id="ans-100" class="ans-input" maxlength="1"></div>
                <div class="cell input-wrapper"><input type="text" inputmode="numeric" id="ans-10" class="ans-input" maxlength="1"></div>
                <div class="cell input-wrapper"><input type="text" inputmode="numeric" id="ans-1" class="ans-input" maxlength="1"></div>
            </div>

            <div class="action-btn-area">
                <button class="btn-check" id="btn-check" onclick="checkAnswer()">答え合わせ</button>
            </div>
            
            <button class="btn-hint-toggle" id="btn-hint-toggle" onclick="toggleHint()">
                💡 ヒント（数カードを操作する）
            </button>
        </div>

        <div class="hint-area hidden" id="hint-area">
            <div class="hint-header">
                <div class="area-title" style="margin-bottom: 5px;">数カードで考えよう</div>
                <div class="hint-desc">① 両がえして数をばらす ➡ ② 引く数だけカードをけす ➡ ③ のこりを数える</div>
            </div>

            <div class="mode-tabs">
                <button class="mode-btn active" id="mode-exchange" onclick="setMode('exchange')">
                    🔄 両がえモード (100→10, 10→1)
                </button>
                <button class="mode-btn" id="mode-subtract" onclick="setMode('subtract')">
                    ❌ けすモード (ひき算)
                </button>
            </div>

            <div class="card-columns">
                <div class="card-col">
                    <div class="col-header bg-100">百のくらい <span class="count-badge" id="count-100"></span></div>
                    <div class="col-cards" id="col-100"></div>
                </div>
                <div class="card-col">
                    <div class="col-header bg-10">十のくらい <span class="count-badge" id="count-10"></span></div>
                    <div class="col-cards" id="col-10"></div>
                </div>
                <div class="card-col">
                    <div class="col-header bg-1">一のくらい <span class="count-badge" id="count-1"></span></div>
                    <div class="col-cards" id="col-1"></div>
                </div>
            </div>
            <button class="btn-reset-cards" onclick="resetCards()">🔄 はじめの数にもどす</button>
        </div>
    </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

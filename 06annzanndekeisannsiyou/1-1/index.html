<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>暗算で計算しよう　1時間目</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
  <h1>💰100円玉をもって お買い物に行こう！</h1>
  <p class="instruction">すきなお菓子を <strong>2つ</strong> えらんでね。</p>

  <div id="item-grid" class="item-grid"></div>

  <div id="action-area" class="action-area hidden">
    <h2 id="selected-summary"></h2>
    
    <div class="calc-box">
      <label for="answer-input">合計はいくらになるかな？</label>
      <input type="number" id="answer-input" placeholder="こたえ"> 円
      <button id="check-btn" class="btn primary-btn">たしかめる</button>
    </div>
    <p id="result-message" class="message"></p>

    <div class="hint-box">
      <h3>💡 暗算（あんざん）のヒント</h3>
      <p>じぶんのやりやすい方法で考えてみよう！</p>
      <div class="hint-buttons">
        <button id="hint-split-btn" class="btn hint-btn">数を分ける</button>
        <button id="hint-round-btn" class="btn hint-btn">何十とみる</button>
      </div>
      <p id="hint-text" class="hint-text"></p>
    </div>
  </div>

  <button id="reset-btn" class="btn reset-btn">🔄 べつのお菓子をえらぶ</button>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

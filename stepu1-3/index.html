<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>大きな数の筆算　１時間目　③</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
    <div class="header-title">🌟 筆算のれんしゅう 🌟</div>

    <div class="tabs">
        <button class="tab-btn active" id="btn-tab1" onclick="switchTab(1)">問１：位のいみ</button>
        <button class="tab-btn" id="btn-tab2" onclick="switchTab(2)">問２：計算れんしゅう</button>
    </div>

    <div class="tab-content active-content" id="tab1">
        <div class="problem-card">
            <div class="step-title">1️⃣ 筆算の「位（くらい）」のいみを考えよう。</div>
            <div class="concept-layout">
                
                <div class="display-grid">
                    <div class="cell blank"></div><div class="cell col-100 filled">5</div><div class="cell col-10 filled">0</div><div class="cell col-1 filled">2</div>
                    <div class="cell sign">＋</div><div class="cell col-100 filled line">4</div><div class="cell col-10 filled line">7</div><div class="cell col-1 filled line">1</div>
                    <div class="cell blank"></div><div class="cell col-100 filled highlight-yellow">9</div><div class="cell col-10 filled">7</div><div class="cell col-1 filled">3</div>
                </div>

                <div class="concept-q">
                    右の筆算で、黄色のマスの <strong>９</strong> は、どんな数が９こあることを表していますか。<br><br>
                    <div class="calc-row">
                        答え： <input type="text" id="ans-concept" class="num-input" style="width:80px;" placeholder="？"> が９こ
                        <button class="btn-check" id="btn-concept" onclick="checkConcept()">かくにん</button>
                    </div>
                    <div class="msg" id="msg-concept">「一」「十」「百」のどれの位かな？</div>
                </div>
            </div>
        </div>
    </div>

    <div class="tab-content" id="tab2">
        <div class="problem-selector">
            もんだいをえらぼう：
            <select id="prob-select" onchange="loadProblem()">
                <option value="1">① 243 ＋ 625</option>
                <option value="2">② 327 ＋ 164</option>
                <option value="3">③ 408 ＋ 369</option>
                <option value="4">④ 134 ＋ 592</option>
                <option value="5">⑤ 743 ＋ 65（★ちゅうい）</option>
                <option value="6">⑥ 81 ＋ 630（★ちゅうい）</option>
            </select>
        </div>

        <div class="nav-board" id="nav-board">
            <div class="nav-title" id="nav-title">ステップ ①：式をたてよう</div>
            <div class="nav-msg" id="nav-msg">
                上の問題を見て、マスに数字を入れよう。<br>
                <strong>右はし（一の位）をピタッとそろえる</strong>のがポイントだよ！
            </div>
        </div>

        <div class="calc-workspace">
            <div class="grid-paper">
                <div class="cell blank"></div>
                <div class="cell blank carry-box-wrapper"><input type="text" id="carry-100" class="carry-input hidden" maxlength="1"></div>
                <div class="cell blank carry-box-wrapper"><input type="text" id="carry-10" class="carry-input hidden" maxlength="1"></div>
                <div class="cell blank"></div>

                <div class="cell blank"></div>
                <div class="cell input-wrapper"><input type="text" id="op1-100" class="ans-input col-100" maxlength="1"></div>
                <div class="cell input-wrapper"><input type="text" id="op1-10" class="ans-input col-10" maxlength="1"></div>
                <div class="cell input-wrapper"><input type="text" id="op1-1" class="ans-input col-1" maxlength="1"></div>

                <div class="cell sign">＋</div>
                <div class="cell input-wrapper line"><input type="text" id="op2-100" class="ans-input col-100" maxlength="1"></div>
                <div class="cell input-wrapper line"><input type="text" id="op2-10" class="ans-input col-10" maxlength="1"></div>
                <div class="cell input-wrapper line"><input type="text" id="op2-1" class="ans-input col-1" maxlength="1"></div>

                <div class="cell blank"></div>
                <div class="cell input-wrapper"><input type="text" id="ans-100" class="ans-input ans-box" maxlength="1" disabled></div>
                <div class="cell input-wrapper"><input type="text" id="ans-10" class="ans-input ans-box" maxlength="1" disabled></div>
                <div class="cell input-wrapper"><input type="text" id="ans-1" class="ans-input ans-box" maxlength="1" disabled></div>
            </div>

            <div class="action-area">
                <button class="btn-check" id="btn-calc" onclick="processStep()">かくにん</button>
            </div>
        </div>
    </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

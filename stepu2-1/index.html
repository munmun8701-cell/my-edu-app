<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>大きな数の筆算の仕方　２時間目　①</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
    <div class="header-title">🌟 右の筆算をしましょう 🌟</div>

    <div class="tabs">
        <button class="tab-btn active" id="btn-tab1" onclick="loadProblem(1)">(1) 347 ＋ 178</button>
        <button class="tab-btn" id="btn-tab2" onclick="loadProblem(2)">(2) 763 ＋ 459</button>
    </div>

    <div class="nav-board" id="nav-board">
        <div class="nav-title" id="nav-title">ステップ ①：一の位（いちのくらい）</div>
        <div class="nav-msg" id="nav-msg">
            まずは一番右の「一の位」から計算しよう！<br>
            ピンクのマスに答えを入れてね。10をこえたら…？
        </div>
    </div>

    <div class="calc-workspace">
        <div class="grid-paper">
            <div class="cell blank"></div>
            <div class="cell carry-wrapper"><input type="text" id="carry-1000" class="carry-input hidden" disabled></div>
            <div class="cell carry-wrapper"><input type="text" id="carry-100" class="carry-input hidden" maxlength="1" placeholder="1"></div>
            <div class="cell carry-wrapper"><input type="text" id="carry-10" class="carry-input hidden" maxlength="1" placeholder="1"></div>
            <div class="cell blank"></div>

            <div class="cell blank"></div>
            <div class="cell blank" id="op1-1000"></div>
            <div class="cell num-cell" id="op1-100">3</div>
            <div class="cell num-cell" id="op1-10">4</div>
            <div class="cell num-cell" id="op1-1">7</div>

            <div class="cell sign">＋</div>
            <div class="cell blank line" id="op2-1000"></div>
            <div class="cell num-cell line" id="op2-100">1</div>
            <div class="cell num-cell line" id="op2-10">7</div>
            <div class="cell num-cell line" id="op2-1">8</div>

            <div class="cell blank"></div>
            <div class="cell input-wrapper" id="wrap-1000"><input type="text" id="ans-1000" class="ans-input col-1000" maxlength="1" disabled></div>
            <div class="cell input-wrapper" id="wrap-100"><input type="text" id="ans-100" class="ans-input col-100" maxlength="1" disabled></div>
            <div class="cell input-wrapper" id="wrap-10"><input type="text" id="ans-10" class="ans-input col-10" maxlength="1" disabled></div>
            <div class="cell input-wrapper active-col" id="wrap-1"><input type="text" id="ans-1" class="ans-input col-1" maxlength="1"></div>
        </div>

        <div class="action-area">
            <button class="btn-check" id="btn-calc" onclick="processStep()">かくにん</button>
        </div>
    </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>３年　まるい形を調べよう　７時間目</title>
    <meta name="viewport" content="width=device-width"><link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">


  </head>
    
  <body>
  <!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>円と球 (第8時) 学習のしあげ ツールボックス</title>
  <style>
    :root {
      --color-a: #4dabf7;
      --color-b: #ff922b;
      --color-c: #e03131;
      --success: #40c057;
      --warning: #fcc419;
      --danger: #fa5252;
      --bg: #f4f6f8;
      --border: #ced4da;
      --theme: #d9480f;
      /* しあげページに合わせたブラウン・オレンジ系 */
      --theme-light: #fff4e6;
      --text-main: #343a40;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      color: var(--text-main);
    }

    .app-container {
      background: white;
      max-width: 900px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    /* Header */
    header {
      background: var(--theme-light);
      padding: 15px;
      text-align: center;
      border-bottom: 3px solid var(--theme);
    }

    .sub-title {
      font-size: 0.9rem;
      color: white;
      font-weight: bold;
      margin: 0;
      background: #8b4513;
      /* 学習のしあげ アイコン色 */
      display: inline-block;
      padding: 6px 15px;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px;
      color: #8b4513;
      font-size: 1.6rem;
    }

    .notebook-prompt {
      display: inline-block;
      background: white;
      border: 2px solid #ff922b;
      color: #d9480f;
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: bold;
    }

    /* Tabs & Story */
    .mission-bar {
      background: #f8f9fa;
      padding: 15px;
      border-bottom: 1px solid var(--border);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 8px 15px;
      background: white;
      border: 2px solid #adb5bd;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      color: #495057;
      font-size: 1rem;
      transition: 0.2s;
    }

    .tab-btn:hover {
      background: #e9ecef;
    }

    .tab-btn.active {
      border-color: var(--theme);
      background: var(--theme);
      color: white;
    }

    .story-problem {
      background: white;
      border: 2px solid var(--theme);
      border-left: 8px solid var(--theme);
      padding: 15px;
      font-size: 1.2rem;
      line-height: 1.6;
      font-weight: bold;
      border-radius: 4px;
    }

    .keyword {
      background: #fff3cd;
      border: 2px solid #ffeeba;
      color: #d9480f;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: bold;
      display: inline-block;
    }

    /* Controls */
    .global-controls {
      display: flex;
      gap: 15px;
      padding: 15px 20px;
      background: white;
      border-bottom: 3px dashed var(--border);
      justify-content: center;
      align-items: center;
      min-height: 80px;
      flex-wrap: wrap;
    }

    .btn-action {
      background: var(--theme);
      color: white;
      font-size: 1.1rem;
      padding: 12px 25px;
      border-radius: 30px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: 0.2s;
    }

    .btn-action:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }

    /* Visual Sandbox */
    .visual-container {
      padding: 20px;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 400px;
    }

    .stage-wrapper {
      width: 100%;
      max-width: 600px;
      background: #fffdf0;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.05);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .grid-bg {
      background-size: 20px 20px;
      background-image: linear-gradient(to right, #e9ecef 1px, transparent 1px), linear-gradient(to bottom, #e9ecef 1px, transparent 1px);
    }

    svg.draw-layer {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Result Message */
    .result-message {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--danger);
      background: #ffe3e3;
      padding: 10px 20px;
      border-radius: 30px;
      border: 2px dashed #ffa8a8;
      text-align: center;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .result-message.show {
      opacity: 1;
    }

    /* Form Elements */
    .sel-box {
      font-size: 1.1rem;
      padding: 5px;
      margin: 0 5px;
      border: 2px solid #ced4da;
      border-radius: 6px;
      font-weight: bold;
      color: #495057;
    }

    .input-box {
      width: 80px;
      font-size: 1.2rem;
      padding: 5px;
      text-align: center;
      border: 2px solid #ced4da;
      border-radius: 6px;
      font-weight: bold;
    }

    /* Layouts */
    .flex-row {
      display: flex;
      gap: 20px;
      justify-content: center;
      width: 100%;
      flex-wrap: wrap;
    }

    .hidden {
      display: none !important;
    }

    /* Animations */
    .fade-in {
      animation: fadeIn 0.5s forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .draw-circle-anim {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawLine 1.5s forwards ease-in-out;
    }

    @keyframes drawLine {
      to {
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>

<body>

  <div class="app-container">
    <header>
      <div class="sub-title">学習のしあげ (第8時)</div>
      <h1>たしかめよう</h1>
      <div class="notebook-prompt">
        ✏️ 円と球の学習で わかったことを、ぜんぶ たしかめよう！
      </div>
    </header>

    <div class="mission-bar">
      <div class="tabs">
        <button class="tab-btn active" onclick="setMode(1)">1⃣ 名まえ</button>
        <button class="tab-btn" onclick="setMode(2)">2⃣ 円をかく</button>
        <button class="tab-btn" onclick="setMode(3)">3⃣ もよう</button>
        <button class="tab-btn" onclick="setMode(4)">4⃣ 箱の長さ</button>
      </div>
      <div class="story-problem" id="story-text"></div>
    </div>

    <div class="global-controls" id="controls-area"></div>

    <main class="visual-sandbox">
      <div class="visual-container">
        <!-- SVG表示エリア (高さ固定) -->
        <div class="stage-wrapper" id="stage" style="height: 350px;">
          <svg class="draw-layer" id="draw-layer" viewBox="0 0 600 350"></svg>
        </div>

        <!-- 操作用UIエリア (モードごとに中身が変わる) -->
        <div id="ui-area" style="width: 100%; margin-bottom: 20px;"></div>

        <div class="result-message" id="result-message"></div>
      </div>
    </main>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setMode(1);
    });

    function setMode(mode) {
      document.getElementById('result-message').classList.remove('show');
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        if (idx + 1 === mode) btn.classList.add('active');
        else btn.classList.remove('active');
      });
      const story = document.getElementById('story-text');
      const controls = document.getElementById('controls-area');
      const stage = document.getElementById('stage');
      const svg = document.getElementById('draw-layer');
      const uiArea = document.getElementById('ui-area');
      svg.innerHTML = '';
      uiArea.innerHTML = '';
      controls.innerHTML = '';
      if (mode === 1) {
        stage.classList.remove('grid-bg');
        story.innerHTML = `①、②の図の ㋐～㋕ の<span class="keyword">名前</span>を答えましょう。`;
        // --- タブ1: 図形の名前 ---
        svg.innerHTML = `
          <!-- ① 円 -->
          <circle cx="150" cy="180" r="100" fill="none" stroke="#343a40" stroke-width="3"/>
          <circle cx="150" cy="180" r="5" fill="#e03131"/>
          
          <line x1="50" y1="180" x2="250" y2="180" stroke="#e03131" stroke-width="2" stroke-dasharray="4"/>
          <line x1="150" y1="180" x2="90" y2="100" stroke="#4dabf7" stroke-width="2"/>
          
          <text x="142" y="210" font-size="16" font-weight="bold" fill="#e03131">㋐</text>
          <text x="100" y="130" font-size="16" font-weight="bold" fill="#4dabf7">㋑</text>
          <text x="200" y="170" font-size="16" font-weight="bold" fill="#e03131">㋒</text>
          <text x="150" y="60" font-size="18" font-weight="bold" text-anchor="middle">① 円</text>

          <!-- ② 球 (半分に切った図) -->
          <defs>
            <radialGradient id="sphereGrad" cx="30%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#99e9f2" />
              <stop offset="100%" stop-color="#0b7285" />
            </radialGradient>
          </defs>
          <path d="M 350 180 A 100 100 0 0 0 550 180 Z" fill="url(#sphereGrad)"/>
          <ellipse cx="450" cy="180" rx="100" ry="30" fill="#e3fafc" stroke="#15aabf" stroke-width="2"/>
          
          <circle cx="450" cy="180" r="5" fill="#e03131"/>
          <line x1="350" y1="180" x2="550" y2="180" stroke="#e03131" stroke-width="2" stroke-dasharray="4"/>
          <line x1="450" y1="180" x2="500" y2="155" stroke="#4dabf7" stroke-width="2"/>

          <text x="442" y="210" font-size="16" font-weight="bold" fill="#e03131">㋓</text>
          <text x="470" y="150" font-size="16" font-weight="bold" fill="#4dabf7">㋔</text>
          <text x="500" y="195" font-size="16" font-weight="bold" fill="#e03131">㋕</text>
          <text x="450" y="60" font-size="18" font-weight="bold" text-anchor="middle">② 球（半分に切った図）</text>
        `;
        uiArea.innerHTML = `
          <div class="flex-row">
            <div>
              <strong>① 円</strong><br>
              ㋐ <select id="q1-a" class="sel-box"><option value="">えらぶ</option><option value="中心">中心</option><option value="半径">半径</option><option value="直径">直径</option></select><br>
              ㋑ <select id="q1-i" class="sel-box"><option value="">えらぶ</option><option value="中心">中心</option><option value="半径">半径</option><option value="直径">直径</option></select><br>
              ㋒ <select id="q1-u" class="sel-box"><option value="">えらぶ</option><option value="中心">中心</option><option value="半径">半径</option><option value="直径">直径</option></select>
            </div>
            <div>
              <strong>② 球</strong><br>
              ㋓ <select id="q1-e" class="sel-box"><option value="">えらぶ</option><option value="中心">中心</option><option value="半径">半径</option><option value="直径">直径</option></select><br>
              ㋔ <select id="q1-o" class="sel-box"><option value="">えらぶ</option><option value="中心">中心</option><option value="半径">半径</option><option value="直径">直径</option></select><br>
              ㋕ <select id="q1-ka" class="sel-box"><option value="">えらぶ</option><option value="中心">中心</option><option value="半径">半径</option><option value="直径">直径</option></select>
            </div>
          </div>
          <div style="text-align:center; margin-top:15px;">
            <button class="btn-action" onclick="checkProb1()">こたえあわせ</button>
          </div>
        `;
      } else if (mode === 2) {
        stage.classList.remove('grid-bg');
        story.innerHTML = `コンパスを使って、下の①、②の円をかきましょう。<br>① <span class="keyword">半径</span> が 3cm の円  ② <span class="keyword">直径</span> が 10cm の円`;
        // --- タブ2: 円をかく ---
        svg.innerHTML = `
          <!-- 定規のイラスト -->
          <rect x="50" y="280" width="500" height="40" fill="#fcc419" stroke="#e67700" stroke-width="2"/>
          <line x1="100" y1="280" x2="100" y2="295" stroke="#343a40" stroke-width="2"/>
          <text x="95" y="315" font-size="14" font-weight="bold">0</text>
          
          <line x1="200" y1="280" x2="200" y2="295" stroke="#343a40" stroke-width="2"/>
          <text x="195" y="315" font-size="14" font-weight="bold">5</text>
          
          <line x1="300" y1="280" x2="300" y2="295" stroke="#343a40" stroke-width="2"/>
          <text x="290" y="315" font-size="14" font-weight="bold">10</text>
        `;
        uiArea.innerHTML = `
          <div class="flex-row">
            <div style="background:#e7f5ff; padding:15px; border-radius:8px; border:2px solid #74c0fc;">
              <strong>① 半径が 3cm の円</strong><br>
              コンパスを <select id="q2-r1" class="sel-box"><option value="">?</option><option value="3">3</option><option value="6">6</option></select> cm に開く<br>
              <button class="btn-action" style="margin-top:10px; background:#4dabf7;" onclick="drawCircleProb(1)">①をかく</button>
            </div>
            <div style="background:#fff4e6; padding:15px; border-radius:8px; border:2px solid #ff922b;">
              <strong>② 直径が 10cm の円</strong><br>
              コンパスを <select id="q2-r2" class="sel-box"><option value="">?</option><option value="10">10</option><option value="5">5</option></select> cm に開く<br>
              <button class="btn-action" style="margin-top:10px; background:#ff922b;" onclick="drawCircleProb(2)">②をかく</button>
            </div>
          </div>
        `;
      } else if (mode === 3) {
        stage.classList.add('grid-bg');
        story.innerHTML = `コンパスを使って、下のもようをかきましょう。<br>（どこに はりをさしているか <span style="color:#e03131;">●</span> をさがそう！）`;
        uiArea.innerHTML = `
          <div style="text-align:center;">
            <button class="btn-action" style="background:#20c997;" onclick="drawPattern(1)">もよう① をかく</button>
            <button class="btn-action" style="background:#845ef7; margin-left:10px;" onclick="drawPattern(2)">もよう② をかく</button>
            <button class="btn-action" style="background:#adb5bd; margin-left:10px;" onclick="setMode(3)">クリア</button>
          </div>
        `;
      } else if (mode === 4) {
        stage.classList.remove('grid-bg');
        story.innerHTML = `右のように、<span class="keyword">半径 4cm</span> のボールが 6こ ぴったり入っている箱があります。この箱の <span class="keyword">たて</span> と <span class="keyword">横</span> の長さは、それぞれ何cmですか。`;
        svg.innerHTML = `
          <!-- 箱の底面 -->
          <rect x="150" y="50" width="300" height="200" fill="#e9ecef" stroke="#868e96" stroke-width="8"/>
          
          <!-- ボール6個 (半径:見た目30、実際の設定は4cm) -->
          <!-- 上段 -->
          <circle cx="200" cy="100" r="48" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>
          <circle cx="300" cy="100" r="48" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>
          <circle cx="400" cy="100" r="48" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>
          <!-- 下段 -->
          <circle cx="200" cy="200" r="48" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>
          <circle cx="300" cy="200" r="48" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>
          <circle cx="400" cy="200" r="48" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>

          <!-- 寸法線 -->
          <path d="M 130 50 L 130 250" stroke="#343a40" stroke-width="2" stroke-dasharray="4"/>
          <text x="80" y="155" font-size="16" font-weight="bold">たて</text>

          <path d="M 150 30 L 450 30" stroke="#343a40" stroke-width="2" stroke-dasharray="4"/>
          <text x="290" y="20" font-size="16" font-weight="bold">横</text>
        `;
        uiArea.innerHTML = `
          <div style="background:#fff9db; padding:20px; border-radius:8px; border:2px solid #fcc419; text-align:center;">
            💡 ヒント：ボール１個の<span style="color:#d9480f; font-weight:bold;">直径</span>（はしからはしまで）は何cmかな？<br><br>
            <div style="font-size:1.2rem; font-weight:bold;">
              たて： <input type="number" id="box-v" class="input-box"> cm  
              横： <input type="number" id="box-h" class="input-box"> cm
            </div>
            <button class="btn-action" style="margin-top:15px;" onclick="checkProb4()">こたえあわせ</button>
          </div>
        `;
      }
    }
    // --- Mode 1 Logic ---
    function checkProb1() {
      const a = document.getElementById('q1-a').value;
      const i = document.getElementById('q1-i').value;
      const u = document.getElementById('q1-u').value;
      const e = document.getElementById('q1-e').value;
      const o = document.getElementById('q1-o').value;
      const ka = document.getElementById('q1-ka').value;
      const msg = document.getElementById('result-message');
      if (!a || !i || !u || !e || !o || !ka) {
        msg.innerHTML = "ぜんぶ えらんでね！";
        msg.className = "result-message show";
        return;
      }
      if (a === "中心" && i === "半径" && u === "直径" && e === "中心" && o === "半径" && ka === "直径") {
        msg.innerHTML = "🎉 大正解！ 円も球も、名前は同じだね！";
        msg.style.background = "#ebfbee";
        msg.style.color = "#2b8a3e";
        msg.style.borderColor = "#40c057";
      } else {
        msg.innerHTML = "✕ まちがっているところがあるよ。もういちど 考えてみよう！";
        msg.style.background = "#ffe3e3";
        msg.style.color = "#fa5252";
        msg.style.borderColor = "#ffa8a8";
      }
      msg.classList.add('show');
    }
    // --- Mode 2 Logic ---
    function drawCircleProb(num) {
      const sel = document.getElementById(`q2-r${num}`).value;
      const msg = document.getElementById('result-message');
      const svg = document.getElementById('draw-layer');
      if (!sel) {
        msg.innerHTML = "コンパスを 何cmに開くか えらんでね。";
        msg.className = "result-message show";
        return;
      }
      if ((num === 1 && sel === "3") || (num === 2 && sel === "5")) {
        // 正解アニメーション
        msg.innerHTML = num === 1 ? "大正解！ 半径と同じ長さに開くね！" : "大正解！ 直径の半分（半径）の長さに開くね！";
        msg.style.background = "#ebfbee";
        msg.style.color = "#2b8a3e";
        msg.style.borderColor = "#40c057";
        msg.classList.add('show');
        // 定規の上にコンパスの長さを表示して、円を描く
        const rVisual = sel * 20; // 見た目の半径サイズ
        const cx = num === 1 ? 200 : 400;
        const cy = 120;
        const color = num === 1 ? "#4dabf7" : "#ff922b";
        svg.innerHTML += `
          <!-- 定規で開くアニメーション（線） -->
          <line x1="100" y1="270" x2="${100 + rVisual}" y2="270" stroke="${color}" stroke-width="4" stroke-dasharray="4" class="fade-in"/>
          <text x="${100 + rVisual/2 - 10}" y="260" font-weight="bold" fill="${color}" class="fade-in">${sel}cm</text>
          
          <!-- 円の描画 -->
          <circle cx="${cx}" cy="${cy}" r="4" fill="#e03131" class="fade-in" style="animation-delay: 1s;"/>
          <circle cx="${cx}" cy="${cy}" r="${rVisual}" fill="none" stroke="${color}" stroke-width="3" class="draw-circle-anim" transform="rotate(-90 ${cx} ${cy})" style="animation-delay: 1.5s;"/>
        `;
      } else {
        msg.innerHTML = num === 1 ? "おしい！「半径」はそのままの長さだよ。" : "おしい！「直径が10cm」のとき、半径（コンパスを開く長さ）は半分になるよ。";
        msg.style.background = "#ffe3e3";
        msg.style.color = "#fa5252";
        msg.style.borderColor = "#ffa8a8";
        msg.classList.add('show');
      }
    }
    // --- Mode 3 Logic ---
    function drawPattern(num) {
      const svg = document.getElementById('draw-layer');
      const msg = document.getElementById('result-message');
      svg.innerHTML = '';
      if (num === 1) {
        // もよう① (方眼上の円と弧)
        // 中心座標 (300, 150) を基準に描画
        let html = `
          <!-- 中心点(針を刺す場所) -->
          <circle cx="200" cy="150" r="5" fill="#e03131" class="fade-in" style="animation-delay: 0s;"/>
          <circle cx="400" cy="150" r="5" fill="#e03131" class="fade-in" style="animation-delay: 0.2s;"/>
          
          <!-- メインの円2つ -->
          <circle cx="200" cy="150" r="100" fill="none" stroke="#495057" stroke-width="3" class="draw-circle-anim" style="animation-delay: 0.5s;"/>
          <circle cx="400" cy="150" r="100" fill="none" stroke="#495057" stroke-width="3" class="draw-circle-anim" style="animation-delay: 2s;"/>

          <!-- 枠（参考） -->
          <rect x="100" y="50" width="400" height="200" fill="none" stroke="#4dabf7" stroke-width="3" class="fade-in" style="animation-delay: 3.5s;"/>
        `;
        svg.innerHTML = html;
        msg.innerHTML = "針を刺す場所（中心）と、コンパスを開く長さ（半径）を マス目でかぞえよう！";
        msg.className = "result-message show";
        msg.style.background = "#e6fcf5";
        msg.style.color = "#087f5b";
        msg.style.borderColor = "#20c997";
      } else if (num === 2) {
        // もよう② (花模様)
        const cx = 300,
          cy = 150,
          r = 100;
        let html = `
          <!-- メインの円と中心 -->
          <circle cx="${cx}" cy="${cy}" r="5" fill="#e03131" class="fade-in"/>
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#495057" stroke-width="3" class="draw-circle-anim" style="animation-delay: 0.5s;"/>
        `;
        // 6つの花びら（円周上の点を中心とした円弧）
        for (let i = 0; i < 6; i++) {
          let angle = (i * 60) * Math.PI / 180;
          let px = cx + r * Math.cos(angle);
          let py = cy + r * Math.sin(angle);
          // 中心点
          html += `<circle cx="${px}" cy="${py}" r="5" fill="#e03131" class="fade-in" style="animation-delay: ${2 + i*0.8}s;"/>`;
          // 円弧 (重なりを表現するため全円を描画してクリップするか、完全な円を薄く描く。ここではシンプルに円を描く)
          html += `<circle cx="${px}" cy="${py}" r="${r}" fill="none" stroke="#845ef7" stroke-width="2" class="draw-circle-anim" style="animation-delay: ${2.3 + i*0.8}s;"/>`;
        }
        svg.innerHTML = html;
        msg.innerHTML = "円のまわりの線の上に 針を刺して、同じ半径のまま 円をかいていくんだね！";
        msg.className = "result-message show";
        msg.style.background = "#e6fcf5";
        msg.style.color = "#087f5b";
        msg.style.borderColor = "#20c997";
      }
    }
    // --- Mode 4 Logic ---
    function checkProb4() {
      const v = parseInt(document.getElementById('box-v').value);
      const h = parseInt(document.getElementById('box-h').value);
      const msg = document.getElementById('result-message');
      if (isNaN(v) || isNaN(h)) {
        msg.innerHTML = "数字を入力してね！";
        msg.className = "result-message show";
        return;
      }
      if (v === 16 && h === 24) {
        msg.innerHTML = "🎉 大正解！ 直径(8cm) × 2こ ＝ たて 16cm、直径(8cm) × 3こ ＝ 横 24cm だね！";
        msg.style.background = "#ebfbee";
        msg.style.color = "#2b8a3e";
        msg.style.borderColor = "#40c057";
      } else {
        msg.innerHTML = "✕ おしい！ ボール１個の「直径」は 半径の２倍（8cm）だよ。";
        msg.style.background = "#ffe3e3";
        msg.style.color = "#fa5252";
        msg.style.borderColor = "#ffa8a8";
      }
      msg.classList.add('show');
    }
  </script>

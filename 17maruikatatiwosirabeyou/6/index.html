<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>３年　まるい形を調べよう　６時間目</title>
    <meta name="viewport" content="width=device-width"><link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">


  </head>
    
  <body>
  <!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>円と球 (第6時) 球 ツールボックス</title>
  <style>
    :root {
      --color-a: #4dabf7;
      --bg-a: #e7f5ff;
      --color-b: #ff922b;
      --bg-b: #fff4e6;
      --color-c: #e03131;
      --success: #40c057;
      --warning: #fcc419;
      --danger: #fa5252;
      --bg: #f4f6f8;
      --border: #ced4da;
      --theme: #20c997;
      --theme-light: #e6fcf5;
      --text-main: #343a40;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      color: var(--text-main);
    }

    .app-container {
      background: white;
      max-width: 900px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    /* Header */
    header {
      background: var(--theme-light);
      padding: 15px;
      text-align: center;
      border-bottom: 3px solid var(--theme);
    }

    .sub-title {
      font-size: 0.9rem;
      color: #087f5b;
      font-weight: bold;
      margin: 0;
      background: #96f2d7;
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0 0 10px;
      color: #087f5b;
      font-size: 1.6rem;
    }

    .notebook-prompt {
      display: inline-block;
      background: white;
      border: 2px solid #38d9a9;
      color: #087f5b;
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: bold;
    }

    /* Tabs & Story */
    .mission-bar {
      background: #f8f9fa;
      padding: 15px;
      border-bottom: 1px solid var(--border);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 8px 15px;
      background: white;
      border: 2px solid #adb5bd;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      color: #495057;
      font-size: 1rem;
      transition: 0.2s;
    }

    .tab-btn:hover {
      background: #e9ecef;
    }

    .tab-btn.active {
      border-color: var(--theme);
      background: var(--theme);
      color: white;
    }

    .story-problem {
      background: white;
      border: 2px solid var(--theme);
      border-left: 8px solid var(--theme);
      padding: 15px;
      font-size: 1.2rem;
      line-height: 1.6;
      font-weight: bold;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .keyword {
      background: #fff3cd;
      border: 2px solid #ffeeba;
      color: #d9480f;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: bold;
      display: inline-block;
    }

    /* Controls */
    .global-controls {
      display: flex;
      gap: 15px;
      padding: 15px 20px;
      background: white;
      border-bottom: 3px dashed var(--border);
      justify-content: center;
      align-items: center;
      min-height: 80px;
      flex-wrap: wrap;
    }

    .btn-action {
      background: var(--color-a);
      color: white;
      font-size: 1.1rem;
      padding: 12px 25px;
      border-radius: 30px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-action:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }

    .btn-action:disabled {
      background: #adb5bd;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .btn-reset {
      background: white;
      border: 2px solid var(--border);
      color: #495057;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Visual Sandbox */
    .visual-container {
      padding: 20px;
      background: white;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 400px;
    }

    .stage-wrapper {
      width: 100%;
      max-width: 600px;
      aspect-ratio: 16 / 9;
      background: #fffdf0;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.05);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg.draw-layer {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Message */
    .result-message {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--danger);
      background: #ffe3e3;
      padding: 10px 20px;
      border-radius: 30px;
      border: 2px dashed #ffa8a8;
      text-align: center;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .result-message.show {
      opacity: 1;
    }

    /* 話し合いボード */
    .discussion-area {
      background: #f8f9fa;
      padding: 20px;
      border-top: 3px dashed var(--border);
    }

    .discussion-topic {
      background: #e6fcf5;
      border: 2px solid #20c997;
      border-left: 8px solid #20c997;
      color: #087f5b;
      padding: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 6px;
      margin-bottom: 0;
    }

    .textbook-tip {
      font-size: 1.05rem;
      background: white;
      padding: 15px;
      border-radius: 6px;
      margin-top: 15px;
      border: 2px solid #ffc078;
      color: #495057;
      line-height: 1.8;
    }

    /* Support Tool */
    .notebook-guide {
      background: #fff9db;
      padding: 20px;
      border-top: 3px dashed #fcc419;
    }

    .guide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .guide-header h3 {
      margin: 0;
      color: #d4a017;
    }

    .btn-support {
      background: #fff;
      border: 2px dashed #f59f00;
      color: #d9480f;
      padding: 8px 15px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .template-box {
      background: #fdfaf0;
      border: 2px solid #fcc419;
      border-radius: 8px;
      padding: 20px;
      font-size: 1.15rem;
      line-height: 2.2;
      color: #343a40;
      margin-top: 15px;
    }

    .sel-box {
      font-size: 1.1rem;
      padding: 5px;
      margin: 0 5px;
      border: 2px solid #ced4da;
      border-radius: 6px;
      background: #fff;
      font-weight: bold;
      color: #495057;
      cursor: pointer;
    }

    /* Presentation Board */
    .btn-presentation {
      background: #e67700;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      float: right;
      box-shadow: 0 2px 4px rgba(230, 119, 0, 0.3);
    }

    .presentation-board {
      background: #fff;
      border: 4px solid #e67700;
      border-radius: 12px;
      padding: 25px;
      margin: 0 20px 20px 20px;
      position: relative;
      animation: fadeIn 0.4s;
    }

    .presentation-board-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 2px dashed #ffd8a8;
      padding-bottom: 10px;
    }

    .presentation-board-header h3 {
      margin: 0;
      color: #e67700;
      font-size: 1.3rem;
    }

    .btn-close-board {
      background: #fff4e6;
      border: 2px solid #ffc078;
      color: #d9480f;
      padding: 5px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .presentation-text {
      font-size: 1.4rem;
      line-height: 1.8;
      color: #343a40;
      font-weight: bold;
    }

    .presentation-text span {
      color: #d9480f;
      border-bottom: 4px solid #fcc419;
      padding: 0 5px;
    }

    /* Practice Section */
    .free-progress-section {
      background: #e3fafc;
      padding: 20px;
      border-top: 5px solid #15aabf;
      border-radius: 0 0 12px 12px;
    }

    .fp-header h2 {
      color: #0b7285;
      margin-top: 0;
      font-size: 1.3rem;
      text-align: center;
    }

    .practice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
    }

    .practice-card {
      background: white;
      border: 2px solid #99e9f2;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .pc-title {
      font-weight: bold;
      color: #0b7285;
      margin-bottom: 10px;
      font-size: 1.1rem;
      border-bottom: 1px dashed #99e9f2;
      padding-bottom: 5px;
    }

    .pc-content {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .pc-select,
    .pc-input {
      height: 40px;
      font-size: 1.1rem;
      font-weight: bold;
      border: 2px solid #ced4da;
      border-radius: 6px;
      padding: 0 5px;
    }

    .pc-mark {
      font-size: 1.8rem;
      font-weight: bold;
      width: 30px;
      text-align: center;
      margin-left: auto;
    }

    .hidden {
      display: none !important;
    }

    /* Animations */
    .fade-in {
      animation: fadeIn 0.5s forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .pulse-anim {
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      from {
        stroke-width: 2;
        opacity: 0.8;
      }

      to {
        stroke-width: 6;
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div class="app-container">
    <header>
      <div class="sub-title">円と球 (第6時)</div>
      <h1>ボールのような まるい形（球）</h1>
      <div class="notebook-prompt">
        ✏️ いろいろな向きから見たり、切り口を調べたりして、まるい形のひみつを見つけよう！
      </div>
    </header>

    <div class="mission-bar">
      <div class="tabs">
        <button class="tab-btn active" onclick="setMode(1)">① ボールの形（球）</button>
        <button class="tab-btn" onclick="setMode(2)">② 切り口を調べよう</button>
        <button class="tab-btn" onclick="setMode(3)">③ 【適応】球の直径</button>
      </div>
      <div class="story-problem" id="story-text"></div>
    </div>

    <div class="global-controls" id="controls-area"></div>

    <main class="visual-sandbox">
      <div class="visual-container">
        <div class="stage-wrapper" id="stage">
          <svg class="draw-layer" id="draw-layer" viewBox="0 0 600 300"></svg>
        </div>
        <div class="result-message" id="result-message"></div>
      </div>

      <!-- はっぴょうボード -->
      <div id="presentation-board" class="presentation-board hidden">
        <div class="presentation-board-header">
          <h3>📢 わたしの考え（図をつかって説明しよう）</h3>
          <button class="btn-close-board" onclick="closePresentation()">✖ 閉じる</button>
        </div>
        <div class="presentation-text" id="presentation-text"></div>
      </div>

      <!-- 話し合いボード -->
      <div class="discussion-area">
        <div class="discussion-topic" id="discussion-topic"></div>
        <div class="textbook-tip" id="textbook-tip"></div>
      </div>

      <!-- サポートツール -->
      <div class="notebook-guide">
        <div class="guide-header">
          <h3>📓 ノートに 自分の言葉で まとめよう</h3>
          <button class="btn btn-support" onclick="toggleSupportTool()">🆘 言葉のヒント（せつめいメーカー）</button>
        </div>
        <div id="support-tool" class="template-box hidden">
          <button class="btn-presentation" onclick="showPresentation()">📢 発表ボードへ</button>
          <div id="template-content"></div>
        </div>
      </div>
    </main>

    <!-- 練習問題 -->
    <div class="free-progress-section">
      <div class="fp-header">
        <h2>🌟 まとめと練習問題</h2>
      </div>
      <div class="practice-grid">
        <div class="practice-card">
          <div class="pc-title">① どこから見ても 円に見える形を 何といいますか。</div>
          <div class="pc-content">
            <select class="pc-select" id="prac1-sel" onchange="checkPrac(1, 'kyu')">
              <option value="">えらぶ</option>
              <option value="en">円（えん）</option>
              <option value="kyu">球（きゅう）</option>
              <option value="enchu">筒（つつ）</option>
            </select>
            <span class="pc-mark" id="prac1-mark"></span>
          </div>
        </div>
        <div class="practice-card">
          <div class="pc-title">② 球の切り口が いちばん大きくなるのは、どのように切ったときですか。</div>
          <div class="pc-content">
            <select class="pc-select" id="prac2-sel" onchange="checkPrac(2, 'hanbun')">
              <option value="">えらぶ</option>
              <option value="haji">はじのほうを切ったとき</option>
              <option value="hanbun">ちょうど半分に切ったとき</option>
            </select>
            <span class="pc-mark" id="prac2-mark"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentMode = 1;
    document.addEventListener('DOMContentLoaded', () => {
      setMode(1);
    });

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('result-message').classList.remove('show');
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        if (idx + 1 === mode) btn.classList.add('active');
        else btn.classList.remove('active');
      });
      const story = document.getElementById('story-text');
      const topic = document.getElementById('discussion-topic');
      const tip = document.getElementById('textbook-tip');
      const controls = document.getElementById('controls-area');
      if (mode === 1) {
        story.innerHTML = `ボールのような まるい形について 調べましょう。<br>ドッジボール、ラグビーボール、かん を <span class="keyword">真上</span> や <span class="keyword">真横</span> から見ると、どんな形に見えるかな？`;
        topic.innerHTML = `🗣️ ドッジボールと「かん」は、見え方に どんなちがいがあるかな？`;
        tip.innerHTML = `💡 <strong>まとめ：</strong><br>・ドッジボールは、真上から見ても 真横から見ても「円」に見えます。<br>・このように、<span style="color:#d9480f; font-weight:bold;">どこから見ても 円に見える形を、球（きゅう）</span>といいます。`;
        controls.innerHTML = `
          <button class="btn-action" style="background:#20c997;" onclick="drawTab1('3d')">📦 もとの形</button>
          <button class="btn-action" style="background:#4dabf7;" onclick="drawTab1('top')">🚁 真上から見る</button>
          <button class="btn-action" style="background:#ff922b;" onclick="drawTab1('side')">👀 真横から見る</button>
        `;
        drawTab1('3d');
      } else if (mode === 2) {
        story.innerHTML = `球（きゅう）を スパッと切ったときの <span class="keyword">切り口</span> の形や 大きさについて 調べましょう。`;
        topic.innerHTML = `🗣️ 球の切り口は、どこを切っても 同じ大きさになるかな？`;
        tip.innerHTML = `💡 <strong>まとめ：</strong><br>・球のどこを切っても、<span style="color:#d9480f; font-weight:bold;">切り口はいつも「円」</span>になります。<br>・球の切り口は、<span style="color:#d9480f; font-weight:bold;">半分に切ったとき いちばん大きく</span> なります。`;
        controls.innerHTML = `
          <button class="btn-action" style="background:#845ef7;" onclick="sliceSphere('top')">🔪 はじのほうを切る</button>
          <button class="btn-action" style="background:#e03131;" onclick="sliceSphere('middle')">🔪 ちょうど半分に切る</button>
        `;
        drawTab2('base');
      } else if (mode === 3) {
        story.innerHTML = `身の回りにある 球（きゅう）の <span class="keyword">直径（ちょっけい）</span> について 調べましょう。`;
        topic.innerHTML = `🗣️ まるいボールの「直径」を、ものさしで 正確にはかるには どうすればいいかな？`;
        tip.innerHTML = `💡 <strong>ヒント：</strong><br>ボールを はかる時は、辞書のような「安定したもの」で 両側から まっすぐ・ぴったり とはさみます。<br>ものさしは、はさむものと 垂直（すいちょく）になるように 置こう。`;
        controls.innerHTML = `
          <button class="btn-action" style="background:#20c997;" onclick="showAppProblem(1)">📦 箱に入ったボール</button>
          <button class="btn-action" style="background:#4dabf7;" onclick="showAppProblem(2)">📏 辞書ではかる</button>
        `;
        showAppProblem(1);
      }
      closePresentation();
      document.getElementById('support-tool').classList.add('hidden');
      buildTemplate();
    }
    // --- Mode 1: 見え方 ---
    function drawTab1(viewType) {
      const svg = document.getElementById('draw-layer');
      const msg = document.getElementById('result-message');
      let html = '';
      // Gradients for 3D look
      html += `
        <defs>
          <radialGradient id="grad-ball" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#74c0fc" />
            <stop offset="100%" stop-color="#1864ab" />
          </radialGradient>
          <radialGradient id="grad-rugby" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffd8a8" />
            <stop offset="100%" stop-color="#d9480f" />
          </radialGradient>
          <linearGradient id="grad-can" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f8f9fa" />
            <stop offset="50%" stop-color="#ced4da" />
            <stop offset="100%" stop-color="#868e96" />
          </linearGradient>
        </defs>
      `;
      if (viewType === '3d') {
        html += `
          <!-- ドッジボール -->
          <circle cx="150" cy="150" r="60" fill="url(#grad-ball)"/>
          <text x="150" y="240" font-size="16" font-weight="bold" text-anchor="middle">ドッジボール</text>
          
          <!-- ラグビーボール -->
          <ellipse cx="300" cy="150" rx="40" ry="70" fill="url(#grad-rugby)" transform="rotate(30 300 150)"/>
          <text x="300" y="240" font-size="16" font-weight="bold" text-anchor="middle">ラグビーボール</text>

          <!-- かん -->
          <ellipse cx="450" cy="110" rx="30" ry="10" fill="#e9ecef" stroke="#adb5bd"/>
          <rect x="420" y="110" width="60" height="80" fill="url(#grad-can)"/>
          <ellipse cx="450" cy="190" rx="30" ry="10" fill="#adb5bd"/>
          <text x="450" y="240" font-size="16" font-weight="bold" text-anchor="middle">かん</text>
        `;
        msg.classList.remove('show');
      } else if (viewType === 'top') {
        html += `
          <circle cx="150" cy="150" r="60" fill="#e7f5ff" stroke="#339af0" stroke-width="4" class="fade-in"/>
          <text x="150" y="155" font-size="20" font-weight="bold" fill="#339af0" text-anchor="middle" class="fade-in">円</text>
          
          <circle cx="300" cy="150" r="40" fill="#fff4e6" stroke="#ff922b" stroke-width="4" class="fade-in"/>
          <text x="300" y="155" font-size="20" font-weight="bold" fill="#ff922b" text-anchor="middle" class="fade-in">円</text>

          <circle cx="450" cy="150" r="30" fill="#f8f9fa" stroke="#868e96" stroke-width="4" class="fade-in"/>
          <text x="450" y="155" font-size="20" font-weight="bold" fill="#868e96" text-anchor="middle" class="fade-in">円</text>
        `;
        msg.innerHTML = `真上から見ると、ぜんぶ <span class="keyword">円</span> に見えるね！`;
        msg.classList.add('show');
      } else if (viewType === 'side') {
        html += `
          <circle cx="150" cy="150" r="60" fill="#e7f5ff" stroke="#339af0" stroke-width="4" class="fade-in"/>
          <text x="150" y="155" font-size="20" font-weight="bold" fill="#339af0" text-anchor="middle" class="fade-in">円</text>
          
          <ellipse cx="300" cy="150" rx="40" ry="70" fill="#fff4e6" stroke="#ff922b" stroke-width="4" class="fade-in"/>
          <text x="300" y="155" font-size="16" font-weight="bold" fill="#ff922b" text-anchor="middle" class="fade-in">円ではない</text>

          <rect x="420" y="90" width="60" height="120" fill="#f8f9fa" stroke="#868e96" stroke-width="4" class="fade-in"/>
          <text x="450" y="155" font-size="16" font-weight="bold" fill="#868e96" text-anchor="middle" class="fade-in">長方形</text>
        `;
        msg.innerHTML = `真横から見ても <span class="keyword">円</span> なのは、ドッジボール（球）だけだ！`;
        msg.classList.add('show');
      }
      svg.innerHTML = html;
    }
    // --- Mode 2: 切り口 ---
    function drawTab2(state) {
      const svg = document.getElementById('draw-layer');
      const msg = document.getElementById('result-message');
      let html = `
        <defs>
          <radialGradient id="grad-sphere" cx="40%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#99e9f2" />
            <stop offset="100%" stop-color="#0b7285" />
          </radialGradient>
        </defs>
        <!-- ベースの球 -->
        <circle cx="300" cy="150" r="100" fill="url(#grad-sphere)"/>
      `;
      if (state === 'base') {
        // 切る前の点線
        html += `
          <line x1="180" y1="90" x2="420" y2="90" stroke="#fff" stroke-width="2" stroke-dasharray="5"/>
          <line x1="150" y1="150" x2="450" y2="150" stroke="#fff" stroke-width="2" stroke-dasharray="5"/>
        `;
        msg.classList.remove('show');
      } else if (state === 'top') {
        html += `
          <!-- 上部切り口 -->
          <ellipse cx="300" cy="90" rx="80" ry="25" fill="#e3fafc" stroke="#15aabf" stroke-width="3" class="fade-in"/>
          <circle cx="300" cy="90" r="4" fill="#e03131" class="fade-in"/>
        `;
        msg.innerHTML = `はじのほうを切ると、切り口（円）は <span class="keyword">小さい</span> ね。`;
        msg.classList.add('show');
      } else if (state === 'middle') {
        html += `
          <!-- 中心切り口 -->
          <ellipse cx="300" cy="150" rx="100" ry="35" fill="#e3fafc" stroke="#15aabf" stroke-width="3" class="fade-in"/>
          <circle cx="300" cy="150" r="5" fill="#e03131" class="fade-in"/>
          
          <!-- 半径・直径ラベル -->
          <line x1="300" y1="150" x2="400" y2="150" stroke="#e03131" stroke-width="2" class="fade-in"/>
          <text x="340" y="145" font-size="14" font-weight="bold" fill="#e03131" class="fade-in">半径</text>
          
          <line x1="200" y1="160" x2="400" y2="160" stroke="#e03131" stroke-width="2" stroke-dasharray="4" class="fade-in"/>
          <text x="280" y="175" font-size="14" font-weight="bold" fill="#e03131" class="fade-in">直径</text>
          
          <text x="290" y="140" font-size="14" font-weight="bold" fill="#e03131" class="fade-in">中心</text>
        `;
        msg.innerHTML = `ちょうど半分に切ったときが <span class="keyword">いちばん大きく</span> なる！<br>この切り口の 円の中心・半径・直径 が、<span style="color:#d9480f;">球の中心・半径・直径</span> だよ。`;
        msg.classList.add('show');
      }
      svg.innerHTML = html;
    }

    function sliceSphere(pos) {
      drawTab2(pos);
    }
    // --- Mode 3: 適応問題 ---
    function showAppProblem(num) {
      const svg = document.getElementById('draw-layer');
      const msg = document.getElementById('result-message');
      let html = '';
      if (num === 1) {
        html = `
          <!-- 箱 -->
          <rect x="200" y="50" width="200" height="200" fill="#f1f3f5" stroke="#adb5bd" stroke-width="6"/>
          <!-- ボール -->
          <circle cx="300" cy="150" r="95" fill="#a5d8ff" stroke="#339af0" stroke-width="4"/>
          <!-- 半径のヒント -->
          <circle cx="300" cy="150" r="5" fill="#e03131"/>
          <line x1="300" y1="150" x2="395" y2="150" stroke="#e03131" stroke-width="3"/>
          <text x="320" y="140" font-size="18" font-weight="bold" fill="#e03131">半径 9cm</text>
          
          <!-- 箱のたてと横 -->
          <path d="M 180 50 L 180 250" stroke="#495057" stroke-width="2" stroke-dasharray="4"/>
          <text x="140" y="155" font-size="16" font-weight="bold">たて？</text>
          
          <path d="M 200 30 L 400 30" stroke="#495057" stroke-width="2" stroke-dasharray="4"/>
          <text x="280" y="20" font-size="16" font-weight="bold">横？</text>

          <foreignObject x="420" y="100" width="160" height="150">
            <div style="font-size:1.1rem; font-weight:bold; color:#343a40;">
              たて：<input type="number" id="box-v" style="width:60px; height:30px; font-size:1rem;"> cm<br><br>
              横： <input type="number" id="box-h" style="width:60px; height:30px; font-size:1rem;"> cm<br><br>
              <button onclick="checkBoxAns()" style="padding:5px 10px; background:#40c057; color:white; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">こたえあわせ</button>
            </div>
          </foreignObject>
        `;
        msg.innerHTML = `ボールが ぴったり入っているよ。箱のたてと横の長さは、ボールの <span class="keyword">何と同じ</span> かな？`;
        msg.classList.add('show');
      } else if (num === 2) {
        html = `
          <!-- 定規 -->
          <rect x="100" y="220" width="400" height="25" fill="#fcc419" stroke="#e67700" stroke-width="2"/>
          <text x="120" y="238" font-size="12" font-weight="bold">0</text>
          <text x="220" y="238" font-size="12" font-weight="bold">10</text>
          <text x="320" y="238" font-size="12" font-weight="bold">20</text>
          <text x="420" y="238" font-size="12" font-weight="bold">30</text>

          <!-- 辞書とボール -->
          <rect x="150" y="70" width="40" height="150" fill="#ffec99" stroke="#f08c00" stroke-width="3"/>
          <text x="155" y="150" font-size="16" font-weight="bold" writing-mode="vertical-rl">国語辞典</text>
          
          <circle cx="270" cy="140" r="80" fill="#339af0" stroke="#1864ab" stroke-width="3"/>
          
          <rect x="350" y="70" width="40" height="150" fill="#ffec99" stroke="#f08c00" stroke-width="3"/>
          <text x="355" y="150" font-size="16" font-weight="bold" writing-mode="vertical-rl">国語辞典</text>
          
          <!-- 注釈ハイライト -->
          <line x1="190" y1="220" x2="190" y2="200" stroke="#e03131" stroke-width="4" class="pulse-anim"/>
          <line x1="350" y1="220" x2="350" y2="200" stroke="#e03131" stroke-width="4" class="pulse-anim"/>
          <path d="M 190 200 L 350 200" stroke="#e03131" stroke-width="4" stroke-dasharray="6" class="fade-in"/>
          <text x="250" y="190" font-size="16" font-weight="bold" fill="#e03131" class="fade-in">直径</text>
        `;
        msg.innerHTML = `安定したもの（辞書など）で <span class="keyword">まっすぐ立てて ぴったり</span> はさむのがポイント！<br>ものさしは 垂直（すいちょく）に置こう。`;
        msg.classList.add('show');
      }
      svg.innerHTML = html;
    }

    function checkBoxAns() {
      const v = parseInt(document.getElementById('box-v').value);
      const h = parseInt(document.getElementById('box-h').value);
      const msg = document.getElementById('result-message');
      if (v === 18 && h === 18) {
        msg.innerHTML = `大正解！🎉 たても横も、ボールの <span class="keyword">直径（半径の２つ分）</span> と同じ長さになるね！`;
        msg.style.background = "#ebfbee";
        msg.style.color = "#2b8a3e";
        msg.style.borderColor = "#40c057";
      } else {
        msg.innerHTML = `おしい！ 半径が 9cm ということは、直径（端から端まで）は何cmになるかな？`;
        msg.style.background = "#ffe3e3";
        msg.style.color = "#fa5252";
        msg.style.borderColor = "#ffa8a8";
      }
    }
    // --- せつめいメーカー ---
    function toggleSupportTool() {
      document.getElementById('support-tool').classList.toggle('hidden');
    }

    function buildTemplate() {
      const box = document.getElementById('template-content');
      if (currentMode === 1) {
        box.innerHTML = `
          ドッジボールを 真上から見ると「<select id="sel-1" class="sel-box"></select>」に見えます。<br>
          真横から見ても「<select id="sel-2" class="sel-box"></select>」に見えます。<br>
          このように、どこから見ても 円に見える形を「<select id="sel-3" class="sel-box"></select>」といいます。
        `;
        populateSelect('sel-1', shuffleArray(['?', '円', '四角', '長まる']));
        populateSelect('sel-2', shuffleArray(['?', '円', '四角', '長まる']));
        populateSelect('sel-3', shuffleArray(['?', '球（きゅう）', '円（えん）']));
      } else if (currentMode === 2) {
        box.innerHTML = `
          球の どこを切っても、切り口はいつも「<select id="sel-1" class="sel-box"></select>」になります。<br>
          また、切り口が いちばん大きくなるのは、球を「<select id="sel-2" class="sel-box"></select>」ときです。<br>
          この切り口の円の半径が、「<select id="sel-3" class="sel-box"></select>」の半径と同じになります。
        `;
        populateSelect('sel-1', shuffleArray(['?', '円', '四角']));
        populateSelect('sel-2', shuffleArray(['?', 'ちょうど半分に切った', 'はじのほうを切った']));
        populateSelect('sel-3', shuffleArray(['?', '球', '箱']));
      } else if (currentMode === 3) {
        box.innerHTML = `
          箱に ボールがぴったり入っているとき、箱のたてと横の長さは どちらも ボールの「<select id="sel-1" class="sel-box"></select>」と同じになります。<br>
          だから、半径が 9cm のボールなら、箱の長さは 9 × 2 ＝「<select id="sel-2" class="sel-box"></select>」cm になります。
        `;
        populateSelect('sel-1', shuffleArray(['?', '直径', '半径', '中心']));
        populateSelect('sel-2', shuffleArray(['?', '18', '9', '27']));
      }
    }

    function populateSelect(elementId, values) {
      const select = document.getElementById(elementId);
      if (!select) return;
      select.innerHTML = '';
      const defaultOpt = document.createElement('option');
      defaultOpt.value = "?";
      defaultOpt.innerText = "❓";
      select.appendChild(defaultOpt);
      values.forEach(val => {
        if (val !== '?') {
          let opt = document.createElement('option');
          opt.value = val;
          opt.innerText = val;
          select.appendChild(opt);
        }
      });
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }
    // --- はっぴょうボード ---
    function showPresentation() {
      let textHTML = "";
      if (currentMode === 1) {
        let v1 = document.getElementById('sel-1').value;
        let v2 = document.getElementById('sel-2').value;
        let v3 = document.getElementById('sel-3').value;
        textHTML = `
          ドッジボールを 真上から見ると「<span>${v1}</span>」に見えます。<br>
          真横から見ても「<span>${v2}</span>」に見えます。<br>
          このように、どこから見ても 円に見える形を「<span>${v3}</span>」といいます。
        `;
      } else if (currentMode === 2) {
        let v1 = document.getElementById('sel-1').value;
        let v2 = document.getElementById('sel-2').value;
        let v3 = document.getElementById('sel-3').value;
        textHTML = `
          球の どこを切っても、切り口はいつも「<span>${v1}</span>」になります。<br>
          また、切り口が いちばん大きくなるのは、球を「<span>${v2}</span>」ときです。<br>
          この切り口の円の半径が、「<span>${v3}</span>」の半径と同じになります。
        `;
      } else if (currentMode === 3) {
        let v1 = document.getElementById('sel-1').value;
        let v2 = document.getElementById('sel-2').value;
        textHTML = `
          箱にボールがぴったり入っているとき、箱のたてと横の長さはどちらもボールの「<span>${v1}</span>」と同じになります。<br>
          だから、半径が 9cm のボールなら、箱の長さは 9 × 2 ＝「<span>${v2}</span>」cm になります。
        `;
      }
      document.getElementById('presentation-text').innerHTML = textHTML;
      const board = document.getElementById('presentation-board');
      board.classList.remove('hidden');
      board.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
      });
    }

    function closePresentation() {
      document.getElementById('presentation-board').classList.add('hidden');
    }
    // --- 練習問題判定 ---
    function checkPrac(num, correctVal) {
      const sel = document.getElementById(`prac${num}-sel`).value;
      const mark = document.getElementById(`prac${num}-mark`);
      if (sel === "") {
        mark.innerText = "";
        return;
      }
      if (sel === correctVal) {
        mark.innerText = "〇";
        mark.style.color = "#40c057";
      } else {
        mark.innerText = "✕";
        mark.style.color = "#fa5252";
      }
    }
  </script>

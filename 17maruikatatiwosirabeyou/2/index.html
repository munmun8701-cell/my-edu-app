<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>３年　まるい形を調べよう　２時間目</title>
    <meta name="viewport" content="width=device-width"><link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">


  </head>
    
  <body>
  <!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>円と球 (第2時) まるい形をかこう ツールボックス</title>
  <style>
    :root {
      --color-a: #4dabf7;
      /* ブルー */
      --bg-a: #e7f5ff;
      --color-b: #ff922b;
      /* オレンジ */
      --bg-b: #fff4e6;
      --success: #40c057;
      --warning: #fcc419;
      --danger: #fa5252;
      --bg: #f4f6f8;
      --border: #ced4da;
      --theme: #20c997;
      /* メインテーマ（緑系） */
      --theme-light: #e6fcf5;
      --text-main: #343a40;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      color: var(--text-main);
    }

    .app-container {
      background: white;
      max-width: 900px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    /* Header */
    header {
      background: var(--theme-light);
      padding: 15px;
      text-align: center;
      border-bottom: 3px solid var(--theme);
    }

    .sub-title {
      font-size: 0.9rem;
      color: #087f5b;
      font-weight: bold;
      margin: 0;
      background: #96f2d7;
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0 0 10px;
      color: #087f5b;
      font-size: 1.6rem;
    }

    .notebook-prompt {
      display: inline-block;
      background: white;
      border: 2px solid #38d9a9;
      color: #087f5b;
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: bold;
    }

    /* Tabs & Story */
    .mission-bar {
      background: #f8f9fa;
      padding: 15px;
      border-bottom: 1px solid var(--border);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 8px 15px;
      background: white;
      border: 2px solid #adb5bd;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      color: #495057;
      font-size: 1rem;
      transition: 0.2s;
    }

    .tab-btn:hover {
      background: #e9ecef;
    }

    .tab-btn.active {
      border-color: var(--theme);
      background: var(--theme);
      color: white;
    }

    .story-problem {
      background: white;
      border: 2px solid var(--theme);
      border-left: 8px solid var(--theme);
      padding: 15px;
      font-size: 1.2rem;
      line-height: 1.6;
      font-weight: bold;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Keywords */
    .keyword {
      background: #fff3cd;
      border: 2px solid #ffeeba;
      color: #d9480f;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: bold;
      display: inline-block;
    }

    /* Controls */
    .global-controls {
      display: flex;
      gap: 20px;
      padding: 15px;
      background: white;
      border-bottom: 3px dashed var(--border);
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .control-group {
      padding: 10px 20px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 2px solid var(--border);
      background: #f8f9fa;
      align-items: center;
    }

    .group-title {
      font-weight: bold;
      font-size: 1rem;
      color: #495057;
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 8px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      transition: transform 0.1s;
    }

    .btn:active {
      transform: translateY(2px);
    }

    .btn-primary {
      background: #4dabf7;
      color: white;
    }

    .btn-gray {
      background: #dee2e6;
      color: #495057;
    }

    .btn-action {
      background: #ff922b;
      color: white;
      font-size: 1.1rem;
      padding: 12px 25px;
      border-radius: 30px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(255, 146, 43, 0.3);
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-action:hover {
      background: #f76707;
      transform: translateY(-2px);
    }

    .btn-action:disabled {
      background: #adb5bd;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .val-badge {
      font-size: 1.2rem;
      font-weight: bold;
      color: #343a40;
    }

    .val-badge span {
      color: var(--danger);
      font-size: 1.6rem;
      margin: 0 5px;
    }

    /* Visual Sandbox */
    .visual-container {
      padding: 20px;
      background: white;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 450px;
    }

    .stage-wrapper {
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1 / 1;
      background: #fffdf0;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.05);
    }

    /* SVG Layer */
    svg.draw-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Compass / Thumbtack elements */
    .center-pin {
      width: 20px;
      height: 20px;
      background: #e03131;
      border-radius: 50%;
      border: 3px solid #c92a2a;
      box-shadow: 2px 4px 6px rgba(0, 0, 0, 0.3);
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .center-pin::after {
      content: '';
      width: 4px;
      height: 4px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 3px;
      left: 3px;
    }

    .compass-arm {
      position: absolute;
      top: 50%;
      left: 50%;
      height: 2px;
      background: transparent;
      transform-origin: 0% 50%;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .compass-string {
      position: absolute;
      left: 0;
      top: 0;
      height: 2px;
      width: 100%;
      border-top: 2px dashed #868e96;
    }

    .pencil-icon {
      font-size: 1.8rem;
      transform: translate(50%, -50%) rotate(135deg);
      position: relative;
      z-index: 6;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
    }

    /* Animations */
    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .anim-spin {
      animation: spin 2s linear forwards;
    }

    .result-message {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--danger);
      background: #ffe3e3;
      padding: 10px 20px;
      border-radius: 30px;
      border: 2px dashed #ffa8a8;
      text-align: center;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .result-message.show {
      opacity: 1;
    }

    /* 話し合いボード */
    .discussion-area {
      background: #f8f9fa;
      padding: 20px;
      border-top: 3px dashed var(--border);
    }

    .discussion-topic {
      background: #e6fcf5;
      border: 2px solid #20c997;
      border-left: 8px solid #20c997;
      color: #087f5b;
      padding: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 6px;
      margin-bottom: 0;
    }

    .textbook-tip {
      font-size: 1.1rem;
      background: white;
      padding: 15px;
      border-radius: 6px;
      margin-top: 15px;
      border: 2px solid #ffc078;
      color: #495057;
      line-height: 1.8;
    }

    /* Support Tool */
    .notebook-guide {
      background: #fff9db;
      padding: 20px;
      border-top: 3px dashed #fcc419;
    }

    .guide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .guide-header h3 {
      margin: 0;
      color: #d4a017;
    }

    .btn-support {
      background: #fff;
      border: 2px dashed #f59f00;
      color: #d9480f;
      padding: 8px 15px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .template-box {
      background: #fdfaf0;
      border: 2px solid #fcc419;
      border-radius: 8px;
      padding: 20px;
      font-size: 1.15rem;
      line-height: 2.2;
      color: #343a40;
      margin-top: 15px;
    }

    .sel-box {
      font-size: 1.1rem;
      padding: 5px;
      margin: 0 5px;
      border: 2px solid #ced4da;
      border-radius: 6px;
      background: #fff;
      font-weight: bold;
      color: #495057;
      cursor: pointer;
    }

    /* Presentation Board */
    .btn-presentation {
      background: #e67700;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      float: right;
      box-shadow: 0 2px 4px rgba(230, 119, 0, 0.3);
    }

    .presentation-board {
      background: #fff;
      border: 4px solid #e67700;
      border-radius: 12px;
      padding: 25px;
      margin: 0 20px 20px 20px;
      position: relative;
      animation: fadeIn 0.4s;
    }

    .presentation-board-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 2px dashed #ffd8a8;
      padding-bottom: 10px;
    }

    .presentation-board-header h3 {
      margin: 0;
      color: #e67700;
      font-size: 1.3rem;
    }

    .btn-close-board {
      background: #fff4e6;
      border: 2px solid #ffc078;
      color: #d9480f;
      padding: 5px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .presentation-text {
      font-size: 1.4rem;
      line-height: 1.8;
      color: #343a40;
      font-weight: bold;
    }

    .presentation-text span {
      color: #d9480f;
      border-bottom: 4px solid #fcc419;
      padding: 0 5px;
    }

    /* Practice Section */
    .free-progress-section {
      background: #e3fafc;
      padding: 20px;
      border-top: 5px solid #15aabf;
      border-radius: 0 0 12px 12px;
    }

    .fp-header h2 {
      color: #0b7285;
      margin-top: 0;
      font-size: 1.3rem;
      text-align: center;
    }

    .practice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
    }

    .practice-card {
      background: white;
      border: 2px solid #99e9f2;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .pc-title {
      font-weight: bold;
      color: #0b7285;
      margin-bottom: 10px;
      font-size: 1.1rem;
      border-bottom: 1px dashed #99e9f2;
      padding-bottom: 5px;
    }

    .pc-content {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .pc-select {
      height: 40px;
      font-size: 1.1rem;
      font-weight: bold;
      border: 2px solid #ced4da;
      border-radius: 6px;
      padding: 0 5px;
      width: 100%;
    }

    .pc-mark {
      font-size: 1.8rem;
      font-weight: bold;
      width: 30px;
      text-align: center;
      margin-left: auto;
    }

    .hidden {
      display: none !important;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div class="app-container">
    <header>
      <div class="sub-title">円と球 (第2時)</div>
      <h1>まるい形を かこう ツールボックス</h1>
      <div class="notebook-prompt">
        ✏️ 簡易コンパスをつかって、きれいな円がかける理由をさぐろう！
      </div>
    </header>

    <div class="mission-bar">
      <div class="tabs">
        <button class="tab-btn active" onclick="setMode(1)">① 円をかく</button>
        <button class="tab-btn" onclick="setMode(2)">② 半径を調べる</button>
        <button class="tab-btn" onclick="setMode(3)">③ 円じゃない形</button>
      </div>

      <div class="story-problem" id="story-text">
        <!-- JSで挿入 -->
      </div>
    </div>

    <div class="global-controls" id="controls-area">
      <!-- JSで挿入 -->
    </div>

    <main class="visual-sandbox">
      <div class="visual-container">

        <div class="stage-wrapper" id="stage">
          <svg class="draw-layer" id="draw-layer"></svg>

          <div class="center-pin" id="center-pin" title="中心（画鋲）"></div>

          <div class="compass-arm" id="compass-arm">
            <div class="compass-string" id="compass-string"></div>
            <div class="pencil-icon" id="pencil-icon">✏️</div>
          </div>
        </div>

        <div class="action-area" id="action-area">
          <!-- ボタンはJSで生成 -->
        </div>

        <div class="result-message" id="result-message">
          <!-- JSで結果を表示 -->
        </div>

      </div>

      <!-- はっぴょうボード -->
      <div id="presentation-board" class="presentation-board hidden">
        <div class="presentation-board-header">
          <h3>📢 わたしの考え（図をつかって説明しよう）</h3>
          <button class="btn-close-board" onclick="closePresentation()">✖ 閉じる</button>
        </div>
        <div class="presentation-text" id="presentation-text"></div>
      </div>

      <!-- 話し合いボード -->
      <div class="discussion-area">
        <div class="discussion-topic" id="discussion-topic"></div>
        <div class="textbook-tip" id="textbook-tip"></div>
      </div>

      <!-- サポートツール -->
      <div class="notebook-guide">
        <div class="guide-header">
          <h3>📓 ノートに 自分の言葉で まとめよう</h3>
          <button class="btn btn-support" onclick="toggleSupportTool()">🆘 言葉のヒント（せつめいメーカー）</button>
        </div>

        <div id="support-tool" class="template-box hidden">
          <button class="btn-presentation" onclick="showPresentation()">📢 発表ボードへ</button>
          <div id="template-content"></div>
        </div>
      </div>
    </main>

    <!-- 練習問題 -->
    <div class="free-progress-section">
      <div class="fp-header">
        <h2>🌟 練習問題（まとめのクイズ）</h2>
      </div>

      <div class="practice-grid">
        <div class="practice-card">
          <div class="pc-title">① 1つの点から長さが等しくなるようにかいた、まるい形を何といいますか。</div>
          <div class="pc-content">
            <select class="pc-select" id="prac1-sel" onchange="checkPrac(1, 'circle')">
              <option value="">えらぶ</option>
              <option value="square">四角形</option>
              <option value="circle">円（えん）</option>
              <option value="sphere">球（きゅう）</option>
            </select>
            <span class="pc-mark" id="prac1-mark"></span>
          </div>
        </div>

        <div class="practice-card">
          <div class="pc-title">② 円の真ん中の点と、中心から円のまわりまでひいた直線をそれぞれ何といいますか。</div>
          <div class="pc-content">
            真ん中の点：
            <select class="pc-select" style="width:120px;" id="prac2a-sel" onchange="checkPrac2()">
              <option value="">えらぶ</option>
              <option value="center">中心（ちゅうしん）</option>
              <option value="radius">半径（はんけい）</option>
            </select>
            <br>
            ひいた直線：
            <select class="pc-select" style="width:120px;" id="prac2b-sel" onchange="checkPrac2()">
              <option value="">えらぶ</option>
              <option value="center">中心（ちゅうしん）</option>
              <option value="radius">半径（はんけい）</option>
            </select>
            <span class="pc-mark" id="prac2-mark"></span>
          </div>
        </div>

        <div class="practice-card">
          <div class="pc-title">③ 身のまわりで、円の形をしたものをさがしましょう。（あてはまるもの）</div>
          <div class="pc-content">
            <select class="pc-select" id="prac3-sel" onchange="checkPrac(3, 'ok')">
              <option value="">えらぶ</option>
              <option value="ok">車のタイヤ、ボタン、時計の文字盤</option>
              <option value="ng">テレビの画面、本、つくえ</option>
            </select>
            <span class="pc-mark" id="prac3-mark"></span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // --- 状態管理 ---
    let currentMode = 1;
    let radiusCm = 4; // ひもの長さ (cm)
    let isDrawn = false; // 円が描かれたか
    const PX_PER_CM = 25; // 1cmあたりのピクセル数
    // --- 初期化 ---
    document.addEventListener('DOMContentLoaded', () => {
      setMode(1);
    });
    // --- モード切替 ---
    function setMode(mode) {
      currentMode = mode;
      isDrawn = false;
      document.getElementById('result-message').classList.remove('show');
      document.getElementById('draw-layer').innerHTML = '';
      // UIリセット
      const arm = document.getElementById('compass-arm');
      arm.classList.remove('anim-spin');
      arm.style.display = 'none'; // 初期は非表示
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        if (idx + 1 === mode) btn.classList.add('active');
        else btn.classList.remove('active');
      });
      const story = document.getElementById('story-text');
      const topic = document.getElementById('discussion-topic');
      const tip = document.getElementById('textbook-tip');
      const controls = document.getElementById('controls-area');
      const actionArea = document.getElementById('action-area');
      if (mode === 1) {
        radiusCm = 4;
        story.innerHTML = `画鋲とひも（簡易コンパス）を使って、いろいろな大きさのまるい形をかきましょう。`;
        topic.innerHTML = `🗣️ きれいなまるい形（<span class="keyword">円</span>）がかける理由を考えよう。`;
        tip.innerHTML = `
          1つの点から長さが等しくなるようにかいた まるい形を <span class="keyword">円</span> といいます。<br>
          その真ん中の点を 円の <span class="keyword">中心</span>、<br>
          中心から円のまわりまでひいた直線を <span class="keyword">半径</span> といいます。
        `;
        controls.innerHTML = `
          <div class="control-group">
            <div class="group-title">ひもの長さ (半径) をえらぶ</div>
            <div class="btn-row">
              <button class="btn btn-gray" onclick="changeRadius(-1)">－ 1cm</button>
              <div class="val-badge"><span id="radius-disp">${radiusCm}</span> cm</div>
              <button class="btn btn-primary" onclick="changeRadius(1)">＋ 1cm</button>
            </div>
          </div>
        `;
        actionArea.innerHTML = `<button class="btn-action" onclick="drawCircle()">✏️ 円をかく</button>`;
        updateArmLength();
        arm.style.display = 'flex';
      } else if (mode === 2) {
        radiusCm = 5;
        story.innerHTML = `かいた円に、中心からまわりまで直線をいくつもひいて、長さをたしかめましょう。`;
        topic.innerHTML = `🗣️ 1つの円では、半径の長さはどうなっているかな？`;
        tip.innerHTML = `💡 <strong>まとめ：</strong> 1つの円では、<span class="keyword">半径</span>の長さは みんな等しくなります。`;
        controls.innerHTML = `
          <div class="control-group" style="flex-direction:row; align-items:center; gap:20px;">
             <div class="group-title">いまの半径：</div>
             <div class="val-badge"><span>${radiusCm}</span> cm</div>
          </div>
        `;
        actionArea.innerHTML = `<button class="btn-action" style="background:#4dabf7;" onclick="drawRadii()">📏 半径をたくさんひく</button>`;
        // 既に円が描いてある状態にする
        drawCircleInstant();
      } else if (mode === 3) {
        story.innerHTML = `〇やたまごのような形（だ円）は、「円」と言えるでしょうか。`;
        topic.innerHTML = `🗣️ だ円は「円」じゃないの？ その理由を 中心からの長さ で説明しよう。`;
        tip.innerHTML = `💡 <strong>ポイント：</strong> 円のきまりは「中心からの長さがすべて等しい」こと。だ円はどうなっているか、線をひいてたしかめよう！`;
        controls.innerHTML = ``; // コントロールなし
        actionArea.innerHTML = `<button class="btn-action" style="background:#fa5252;" onclick="drawOvalRadii()">📏 中心からの長さをはかる</button>`;
        // だ円を描いておく
        drawOvalInstant();
      }
      closePresentation();
      document.getElementById('support-tool').classList.add('hidden');
      buildTemplate();
    }
    // --- 半径の変更 ---
    function changeRadius(amount) {
      radiusCm += amount;
      if (radiusCm < 2) radiusCm = 2;
      if (radiusCm > 8) radiusCm = 8;
      document.getElementById('radius-disp').innerText = radiusCm;
      // リセット
      isDrawn = false;
      document.getElementById('draw-layer').innerHTML = '';
      document.getElementById('result-message').classList.remove('show');
      const arm = document.getElementById('compass-arm');
      arm.classList.remove('anim-spin');
      updateArmLength();
    }

    function updateArmLength() {
      const arm = document.getElementById('compass-arm');
      arm.style.width = `${radiusCm * PX_PER_CM}px`;
    }
    // --- モード1: 円を描くアニメーション ---
    function drawCircle() {
      if (isDrawn) return;
      isDrawn = true;
      const svg = document.getElementById('draw-layer');
      svg.innerHTML = '';
      const arm = document.getElementById('compass-arm');
      arm.style.display = 'flex';
      // アニメーションをリセットして再トリガー
      arm.classList.remove('anim-spin');
      void arm.offsetWidth;
      arm.classList.add('anim-spin');
      const r = radiusCm * PX_PER_CM;
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', '50%');
      circle.setAttribute('cy', '50%');
      circle.setAttribute('r', r);
      circle.setAttribute('fill', 'none');
      circle.setAttribute('stroke', '#3b5bdb'); // 鉛筆の線の色（青系）
      circle.setAttribute('stroke-width', '4');
      // 描画アニメーションの設定
      const circumference = 2 * Math.PI * r;
      circle.style.strokeDasharray = circumference;
      circle.style.strokeDashoffset = circumference;
      circle.style.transition = 'stroke-dashoffset 2s linear';
      // SVGを中心から-90度回転（時計の12時や、アームの初期位置に合わせるため）
      // アームは右(0度)から始まるので、円も右から描画させる
      circle.setAttribute('transform', 'rotate(0 250 250)'); // stage width=500, cx=250
      svg.appendChild(circle);
      // 少し遅らせてアニメーション開始
      setTimeout(() => {
        circle.style.strokeDashoffset = 0;
      }, 50);
      setTimeout(() => {
        const msg = document.getElementById('result-message');
        msg.innerHTML = `きれいな <span class="keyword">円</span> がかけたね！`;
        msg.classList.add('show');
      }, 2100);
    }
    // --- モード2: 即座に円を描画して待機 ---
    function drawCircleInstant() {
      const svg = document.getElementById('draw-layer');
      const r = radiusCm * PX_PER_CM;
      svg.innerHTML = `
        <circle cx="50%" cy="50%" r="${r}" fill="#f8f9fa" stroke="#3b5bdb" stroke-width="4"></circle>
        <circle cx="50%" cy="50%" r="4" fill="#e03131"></circle>
      `;
    }

    function drawRadii() {
      if (isDrawn) return;
      isDrawn = true;
      const svg = document.getElementById('draw-layer');
      const r = radiusCm * PX_PER_CM;
      const numLines = 6;
      for (let i = 0; i < numLines; i++) {
        let angle = (Math.PI * 2 * i) / numLines;
        let x2 = 50 + (r * Math.cos(angle) / 500) * 100; // 500はstageの想定幅(500pxに対する%)
        let y2 = 50 + (r * Math.sin(angle) / 500) * 100;
        let line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', '50%');
        line.setAttribute('y1', '50%');
        line.setAttribute('x2', `${x2}%`);
        line.setAttribute('y2', `${y2}%`);
        line.setAttribute('stroke', '#ff922b');
        line.setAttribute('stroke-width', '3');
        line.setAttribute('stroke-dasharray', '200');
        line.setAttribute('stroke-dashoffset', '200');
        line.style.transition = `stroke-dashoffset 0.5s ease-out ${i * 0.2}s`;
        svg.appendChild(line);
        setTimeout(() => {
          line.style.strokeDashoffset = 0;
        }, 50);
      }
      setTimeout(() => {
        const msg = document.getElementById('result-message');
        msg.innerHTML = `1つの円では、<span class="keyword">半径</span> の長さは <span style="color:#fa5252;">みんな等しい</span> ね！`;
        msg.classList.add('show');
      }, 1500);
    }
    // --- モード3: だ円の描画と検証 ---
    function drawOvalInstant() {
      const svg = document.getElementById('draw-layer');
      svg.innerHTML = `
        <ellipse cx="50%" cy="50%" rx="150" ry="90" fill="#f8f9fa" stroke="#868e96" stroke-width="4"></ellipse>
        <circle cx="50%" cy="50%" r="4" fill="#e03131"></circle>
      `;
    }

    function drawOvalRadii() {
      if (isDrawn) return;
      isDrawn = true;
      const svg = document.getElementById('draw-layer');
      // 横と縦の線を引く
      const lines = [{
          x2: '50%',
          y2: '14%',
          color: '#ff922b',
          label: '短い'
        }, // 上
        {
          x2: '80%',
          y2: '50%',
          color: '#4dabf7',
          label: '長い'
        } // 右
      ];
      lines.forEach((l, i) => {
        let line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', '50%');
        line.setAttribute('y1', '50%');
        line.setAttribute('x2', l.x2);
        line.setAttribute('y2', l.y2);
        line.setAttribute('stroke', l.color);
        line.setAttribute('stroke-width', '4');
        line.setAttribute('stroke-dasharray', '200');
        line.setAttribute('stroke-dashoffset', '200');
        line.style.transition = `stroke-dashoffset 0.8s ease-out ${i * 0.8}s`;
        svg.appendChild(line);
        setTimeout(() => {
          line.style.strokeDashoffset = 0;
        }, 50);
      });
      setTimeout(() => {
        const msg = document.getElementById('result-message');
        msg.innerHTML = `中心からの長さが <span style="color:#fa5252;">ちがう</span> から、これは「円」ではないよ！`;
        msg.classList.add('show');
      }, 1800);
    }
    // --- せつめいメーカー ---
    function toggleSupportTool() {
      document.getElementById('support-tool').classList.toggle('hidden');
    }

    function buildTemplate() {
      const box = document.getElementById('template-content');
      box.innerHTML = `
        「<select id="sel-1" class="sel-box"></select>」をさした場所が「<select id="sel-2" class="sel-box"></select>」で、<br>
        その点から長さが「<select id="sel-3" class="sel-box"></select>」なるようにかいたから、「<select id="sel-4" class="sel-box"></select>」がかけたんだね。
      `;
      populateSelect('sel-1', shuffleArray(['?', '画鋲', 'えんぴつ']));
      populateSelect('sel-2', shuffleArray(['?', '中心', '半径']));
      populateSelect('sel-3', shuffleArray(['?', '等しく', 'ちがうように']));
      populateSelect('sel-4', shuffleArray(['?', '円', '四角形']));
    }

    function populateSelect(elementId, values) {
      const select = document.getElementById(elementId);
      if (!select) return;
      select.innerHTML = '';
      const defaultOpt = document.createElement('option');
      defaultOpt.value = "?";
      defaultOpt.innerText = "❓";
      select.appendChild(defaultOpt);
      values.forEach(val => {
        if (val !== '?') {
          let opt = document.createElement('option');
          opt.value = val;
          opt.innerText = val;
          select.appendChild(opt);
        }
      });
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }
    // --- はっぴょうボード ---
    function showPresentation() {
      let v1 = document.getElementById('sel-1').value;
      let v2 = document.getElementById('sel-2').value;
      let v3 = document.getElementById('sel-3').value;
      let v4 = document.getElementById('sel-4').value;
      let textHTML = `
        「<span>${v1}</span>」をさした場所が「<span>${v2}</span>」で、<br>
        その点から長さが「<span>${v3}</span>」なるようにかいたから、「<span>${v4}</span>」がかけたんだね。
      `;
      document.getElementById('presentation-text').innerHTML = textHTML;
      const board = document.getElementById('presentation-board');
      board.classList.remove('hidden');
      board.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
      });
    }

    function closePresentation() {
      document.getElementById('presentation-board').classList.add('hidden');
    }
    // --- クイズ判定 ---
    function checkPrac(num, correctVal) {
      const sel = document.getElementById(`prac${num}-sel`).value;
      const mark = document.getElementById(`prac${num}-mark`);
      if (sel === "") {
        mark.innerText = "";
        return;
      }
      if (sel === correctVal) {
        mark.innerText = "〇";
        mark.style.color = "#40c057";
      } else {
        mark.innerText = "✕";
        mark.style.color = "#fa5252";
      }
    }

    function checkPrac2() {
      const sela = document.getElementById('prac2a-sel').value;
      const selb = document.getElementById('prac2b-sel').value;
      const mark = document.getElementById('prac2-mark');
      if (sela === "" || selb === "") {
        mark.innerText = "";
        return;
      }
      if (sela === "center" && selb === "radius") {
        mark.innerText = "〇";
        mark.style.color = "#40c057";
      } else {
        mark.innerText = "✕";
        mark.style.color = "#fa5252";
      }
    }
  </script>
</body>

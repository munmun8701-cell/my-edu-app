<html lang="en">

    <meta charset="UTF-8">
    <title>３年　三角形を調べよう　１時間目</title>

  <body>
  <!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三角形マスターアプリ（全単元・たしかめよう）</title>
  <style>
    :root {
      --primary: #2b8a3e;
      --primary-light: #ebfbee;
      --secondary: #20c997;
      --accent: #ff922b;
      --danger: #fa5252;
      --bg-light: #f8f9fa;
      --border: #ced4da;
      --text: #343a40;
      --blue: #4dabf7;
    }

    * {
      box-sizing: border-box;
      font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
    }

    body {
      background-color: #f4f6f8;
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      color: var(--text);
    }

    .app-container {
      background: white;
      max-width: 900px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 90vh;
    }

    /* Header & Main Tabs */
    header {
      background: var(--primary-light);
      padding: 15px;
      text-align: center;
      border-bottom: 3px solid var(--primary);
    }

    h1 {
      margin: 0 0 10px;
      color: var(--primary);
      font-size: 1.6rem;
    }

    .notebook-prompt {
      display: inline-block;
      background: white;
      border: 2px solid #8ce99a;
      color: var(--primary);
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: bold;
    }

    .main-tabs {
      display: flex;
      background: var(--text);
    }

    .main-tab {
      flex: 1;
      padding: 15px;
      border: none;
      background: transparent;
      color: #adb5bd;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .main-tab:hover {
      background: #495057;
      color: white;
    }

    .main-tab.active {
      background: white;
      color: var(--primary);
      border-top: 4px solid var(--primary);
    }

    .section {
      display: none;
      padding: 20px;
      animation: fadeIn 0.4s;
    }

    .section.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* =========================================
       📖 学習モード (Learning Section)
       ========================================= */
    .learn-intro {
      background: #e6fcf5;
      border: 2px solid var(--secondary);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: bold;
      font-size: 1.1rem;
      color: #087f5b;
      text-align: center;
    }

    /* 三角形はつめい機 (Triangle Builder) */
    .builder-area {
      background: white;
      border: 3px dashed var(--blue);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .builder-title {
      text-align: center;
      color: var(--blue);
      font-size: 1.3rem;
      margin-top: 0;
      margin-bottom: 15px;
    }

    .condition-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .condition-label {
      font-weight: bold;
      font-size: 1.1rem;
      color: var(--text);
      border-left: 5px solid var(--accent);
      padding-left: 10px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-cond {
      flex: 1;
      min-width: 120px;
      padding: 12px;
      background: white;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text);
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 3px 0 var(--border);
    }

    .btn-cond:active {
      transform: translateY(3px);
      box-shadow: none;
    }

    .btn-cond.active {
      background: #fff4e6;
      border-color: var(--accent);
      color: #d9480f;
      box-shadow: 0 3px 0 var(--accent);
    }

    .result-display {
      background: var(--bg-light);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      min-height: 200px;
      flex-wrap: wrap;
    }

    .svg-container {
      width: 150px;
      height: 150px;
    }

    .triangle-name {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--danger);
      text-align: center;
      background: white;
      padding: 10px 20px;
      border-radius: 30px;
      border: 3px solid var(--danger);
      box-shadow: 0 4px 10px rgba(250, 82, 82, 0.2);
      animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .triangle-desc {
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 10px;
      color: #495057;
      max-width: 250px;
    }

    @keyframes pop {
      0% {
        transform: scale(0.8);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* 図鑑エリア */
    .dictionary-area {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .dict-card {
      background: white;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }

    .dict-card h3 {
      margin: 0 0 10px 0;
      color: var(--primary);
      border-bottom: 2px dashed var(--primary-light);
      padding-bottom: 5px;
    }

    .dict-svg {
      width: 100px;
      height: 100px;
      margin: 0 auto;
    }

    /* =========================================
       🏆 たしかめようモード (Test Section)
       ========================================= */
    .progress-header {
      background: #fff9db;
      border: 3px solid #fcc419;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .progress-text {
      font-size: 1.4rem;
      font-weight: bold;
      color: #d4a017;
    }

    .progress-bar-bg {
      flex-grow: 1;
      height: 20px;
      background: white;
      border-radius: 10px;
      border: 2px solid #fcc419;
      overflow: hidden;
      min-width: 200px;
    }

    .progress-bar-fill {
      height: 100%;
      background: #fcc419;
      width: 0%;
      transition: width 0.5s ease;
    }

    .btn-reset-data {
      background: white;
      border: 2px solid var(--danger);
      color: var(--danger);
      padding: 5px 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .test-card {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      transition: 0.3s;
    }

    .test-card.cleared {
      border-color: var(--secondary);
      background: #f8fffb;
      box-shadow: 0 4px 15px rgba(32, 201, 151, 0.2);
    }

    .test-badge {
      display: inline-block;
      background: var(--text);
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    .test-card.cleared .test-badge {
      background: var(--secondary);
    }

    .test-question {
      font-size: 1.25rem;
      font-weight: bold;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    /* 選択肢ボタン */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .options-grid.img-mode {
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-option {
      background: var(--bg-light);
      border: 2px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      text-align: left;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-option:hover {
      background: #e9ecef;
    }

    .btn-option.img-opt {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 140px;
      height: 140px;
    }

    /* 判定結果スタイル */
    .btn-option.correct {
      background: #ebfbee;
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-option.wrong {
      background: #ffe3e3;
      border-color: var(--danger);
      color: var(--danger);
      opacity: 0.7;
    }

    .feedback-msg {
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 15px;
      min-height: 28px;
      transition: 0.3s;
    }

    .feedback-msg.success {
      color: var(--secondary);
    }

    .feedback-msg.error {
      color: var(--danger);
    }

    /* SVG 共通スタイル */
    .svg-shape {
      fill: none;
      stroke: var(--text);
      stroke-width: 3;
      stroke-linejoin: round;
    }

    .svg-tick {
      stroke: var(--danger);
      stroke-width: 3;
    }

    .svg-right-angle {
      fill: none;
      stroke: var(--blue);
      stroke-width: 2;
    }

    .svg-bg-circle {
      fill: none;
      stroke: #a5d8ff;
      stroke-width: 1;
      stroke-dasharray: 4;
    }
  </style>
</head>

<body>

  <div class="app-container">
    <header>
      <h1>📐 三角形マスターアプリ</h1>
      <div class="notebook-prompt">✏️ はつめい機で図形を作り、10問のテストにちょうせんしよう！</div>
    </header>

    <div class="main-tabs">
      <button class="main-tab active" onclick="switchMainTab('learning', this)">📖 学習モード (はつめい機)</button>
      <button class="main-tab" onclick="switchMainTab('test', this)">🏆 たしかめよう (全10問)</button>
    </div>

    <!-- ========================================== -->
    <!-- 📖 学習モード (Learning)                   -->
    <!-- ========================================== -->
    <div id="learning" class="section active">
      <div class="learn-intro">
        辺の長さに注目して、三角形をなかま分けしよう！<br>
        ボタンを組み合わせて、どんな三角形ができるか調べてみてね。
      </div>

      <!-- 三角形はつめい機 -->
      <div class="builder-area">
        <h2 class="builder-title">⚙️ 三角形はつめい機</h2>

        <div class="condition-group">
          <div class="condition-label">① 辺の長さはどうする？</div>
          <div class="btn-row">
            <button class="btn-cond active" id="cond1-diff" onclick="setCondition(1, 'diff')">ぜんぶちがう</button>
            <button class="btn-cond" id="cond1-iso" onclick="setCondition(1, 'iso')">2つが同じ</button>
            <button class="btn-cond" id="cond1-eq" onclick="setCondition(1, 'eq')">3つが同じ</button>
          </div>
        </div>

        <div class="condition-group">
          <div class="condition-label">② 直角（90度）はある？</div>
          <div class="btn-row">
            <button class="btn-cond active" id="cond2-none" onclick="setCondition(2, 'none')">ない</button>
            <button class="btn-cond" id="cond2-right" onclick="setCondition(2, 'right')">ある</button>
          </div>
        </div>

        <div class="result-display" id="builder-result">
          <!-- JSで動的に書き換えます -->
        </div>
      </div>

      <h2 style="color:var(--text); border-bottom:3px solid var(--border); padding-bottom:5px;">📚 三角形ずかん</h2>
      <div class="dictionary-area">
        <div class="dict-card">
          <h3>二等辺三角形</h3>
          <div class="dict-svg" id="dict-iso"></div>
          <p style="font-size:0.95rem; font-weight:bold;">2つの辺の長さが等しい</p>
        </div>
        <div class="dict-card">
          <h3>正三角形</h3>
          <div class="dict-svg" id="dict-eq"></div>
          <p style="font-size:0.95rem; font-weight:bold;">3つの辺の長さが<br>どれも等しい</p>
        </div>
        <div class="dict-card">
          <h3>直角二等辺三角形</h3>
          <div class="dict-svg" id="dict-right-iso"></div>
          <p style="font-size:0.95rem; font-weight:bold;">直角のある<br>二等辺三角形</p>
        </div>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- 🏆 たしかめようモード (Test)               -->
    <!-- ========================================== -->
    <div id="test" class="section" style="background: var(--bg-light);">
      <div class="progress-header">
        <div class="progress-text">🏆 クリア状況: <span id="cleared-count">0</span> / 10 問</div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <button class="btn-reset-data" onclick="resetAllData()">データをリセット</button>
      </div>

      <div id="test-list-container">
        <!-- JSで問題カードが生成されます -->
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // SVG描画用データ定義
    // ==========================================
    const svgData = {
      // 不等辺三角形
      diff: `<svg viewBox="0 0 100 100" width="100%" height="100%"><polygon class="svg-shape" points="10,90 90,70 40,10" /></svg>`,
      // 不等辺・直角（直角三角形）
      diff_right: `<svg viewBox="0 0 100 100" width="100%" height="100%">
        <polygon class="svg-shape" points="20,90 80,90 20,30" />
        <polyline class="svg-right-angle" points="20,75 35,75 35,90" />
      </svg>`,
      // 二等辺三角形
      iso: `<svg viewBox="0 0 100 100" width="100%" height="100%">
        <polygon class="svg-shape" points="20,90 80,90 50,15" />
        <line class="svg-tick" x1="30" y1="52.5" x2="40" y2="52.5" transform="rotate(-68, 35, 52.5)" />
        <line class="svg-tick" x1="60" y1="52.5" x2="70" y2="52.5" transform="rotate(68, 65, 52.5)" />
      </svg>`,
      // 直角二等辺三角形
      iso_right: `<svg viewBox="0 0 100 100" width="100%" height="100%">
        <polygon class="svg-shape" points="20,80 80,80 20,20" />
        <polyline class="svg-right-angle" points="20,65 35,65 35,80" />
        <line class="svg-tick" x1="45" y1="80" x2="55" y2="80" transform="rotate(90, 50, 80)" />
        <line class="svg-tick" x1="20" y1="45" x2="20" y2="55" transform="rotate(0, 20, 50)" />
      </svg>`,
      // 正三角形
      eq: `<svg viewBox="0 0 100 100" width="100%" height="100%">
        <circle class="svg-bg-circle" cx="50" cy="55" r="40" />
        <polygon class="svg-shape" points="15.3,75 84.7,75 50,15" />
        <line class="svg-tick" x1="47" y1="75" x2="53" y2="75" transform="rotate(90, 50, 75)" />
        <line class="svg-tick" x1="27.6" y1="45" x2="33.6" y2="45" transform="rotate(-60, 30.6, 45)" />
        <line class="svg-tick" x1="66.4" y1="45" x2="72.4" y2="45" transform="rotate(60, 69.4, 45)" />
      </svg>`,
      // 存在しない（エラー）
      error: `<div style="font-size:3rem;">🤔</div>`
    };
    // ==========================================
    // 📖 学習モード (はつめい機)
    // ==========================================
    let cond1 = 'diff'; // diff, iso, eq
    let cond2 = 'none'; // none, right
    function setCondition(group, val) {
      if (group === 1) {
        cond1 = val;
        document.getElementById('cond1-diff').classList.remove('active');
        document.getElementById('cond1-iso').classList.remove('active');
        document.getElementById('cond1-eq').classList.remove('active');
        document.getElementById(`cond1-${val}`).classList.add('active');
      } else {
        cond2 = val;
        document.getElementById('cond2-none').classList.remove('active');
        document.getElementById('cond2-right').classList.remove('active');
        document.getElementById(`cond2-${val}`).classList.add('active');
      }
      updateBuilder();
    }

    function updateBuilder() {
      const res = document.getElementById('builder-result');
      let svg = "";
      let name = "";
      let desc = "";
      if (cond1 === 'diff' && cond2 === 'none') {
        svg = svgData.diff;
        name = "ただの三角形";
        desc = "辺の長さがぜんぶちがう、ふつうの三角形だよ。";
      } else if (cond1 === 'diff' && cond2 === 'right') {
        svg = svgData.diff_right;
        name = "直角三角形";
        desc = "1つの角が直角（90度）になっている三角形だよ。";
      } else if (cond1 === 'iso' && cond2 === 'none') {
        svg = svgData.iso;
        name = "二等辺三角形";
        desc = "2つの辺の長さが等しい三角形！<br>赤い「しるし」に注目してね。";
      } else if (cond1 === 'iso' && cond2 === 'right') {
        svg = svgData.iso_right;
        name = "直角二等辺三角形";
        desc = "直角があって、2つの辺が等しい特別な三角形だよ。";
      } else if (cond1 === 'eq' && cond2 === 'none') {
        svg = svgData.eq;
        name = "正三角形";
        desc = "3つの辺の長さがどれも等しい、いちばん整った形の三角形！";
      } else if (cond1 === 'eq' && cond2 === 'right') {
        svg = svgData.error;
        name = "作れません！";
        desc = "直角がある正三角形は、この世界には存在しないんだ。条件を変えてみて！";
      }
      res.innerHTML = `
        <div class="svg-container">${svg}</div>
        <div>
          <div class="triangle-name">${name}</div>
          <div class="triangle-desc">${desc}</div>
        </div>
      `;
    }
    // 図鑑の初期化
    document.addEventListener('DOMContentLoaded', () => {
      updateBuilder();
      document.getElementById('dict-iso').innerHTML = svgData.iso;
      document.getElementById('dict-eq').innerHTML = svgData.eq;
      document.getElementById('dict-right-iso').innerHTML = svgData.iso_right;
      initTestMode();
    });
    // ==========================================
    // 🏆 たしかめよう (Test Section)
    // ==========================================
    const testProblems = [{
        id: 1,
        type: "text",
        q: "① 2つの辺の長さが等しい三角形を、何といいますか。",
        opts: ["正三角形", "二等辺三角形", "直角三角形"],
        ans: 1
      },
      {
        id: 2,
        type: "text",
        q: "② 3つの辺の長さがどれも等しい三角形を、何といいますか。",
        opts: ["二等辺三角形", "直角二等辺三角形", "正三角形"],
        ans: 2
      },
      {
        id: 3,
        type: "image",
        q: "③ 次の図の中で、「正三角形」はどれですか。",
        opts: [svgData.iso, svgData.diff, svgData.eq],
        ans: 2
      },
      {
        id: 4,
        type: "image",
        q: "④ 次の図の中で、「二等辺三角形」はどれですか。",
        opts: [svgData.diff_right, svgData.iso, svgData.eq], // 正三角形も広義には入るが、小学生向けには典型的isoを正解とする
        ans: 1
      },
      {
        id: 5,
        type: "text",
        q: "⑤ 直角のある二等辺三角形を、何といいますか。",
        opts: ["直角二等辺三角形", "正三角形", "長方形"],
        ans: 0
      },
      {
        id: 6,
        type: "text",
        q: "⑥ 三角形の辺についている「//」や「|」などの赤いしるしは、何を表していますか。",
        opts: ["角が直角であること", "辺の長さが等しいこと", "線がまっすぐなこと"],
        ans: 1
      },
      {
        id: 7,
        type: "text",
        q: "⑦ 辺の長さが「4cm、4cm、5cm」の三角形は、どのなかまに入りますか。",
        opts: ["正三角形", "二等辺三角形", "ただの三角形"],
        ans: 1
      },
      {
        id: 8,
        type: "text",
        q: "⑧ 辺の長さが「6cm、6cm、6cm」の三角形は、どのなかまに入りますか。",
        opts: ["正三角形", "直角三角形", "二等辺三角形でも正三角形でもない"],
        ans: 0
      },
      {
        id: 9,
        type: "text",
        q: "⑨ すずさんは三角形を「辺の長さ」に注目して分けました。いくつになかま分けできましたか。",
        opts: ["2つ (直角があるかないか)", "3つ (二等辺、正、その他)", "4つ"],
        ans: 1
      },
      {
        id: 10,
        type: "image",
        q: "⑩ 円の中心から、まわりの点に直線を引いて三角形を作ると、必ずどんな三角形ができますか。<br>（ヒント：円の半径はどれも同じ長さだよ）",
        opts: [svgData.diff, svgData.iso, svgData.diff_right],
        ans: 1
      }
    ];
    let userProgress = {};

    function initTestMode() {
      loadProgress();
      renderTestList();
      updateProgressBar();
    }

    function renderTestList() {
      const container = document.getElementById('test-list-container');
      container.innerHTML = '';
      testProblems.forEach(p => {
        let isCleared = userProgress[p.id] === true;
        // 選択肢HTML生成
        let optsHTML = '';
        let optClass = p.type === 'image' ? 'btn-option img-opt' : 'btn-option';
        let gridClass = p.type === 'image' ? 'options-grid img-mode' : 'options-grid';
        p.opts.forEach((optText, idx) => {
          // すでにクリア済みなら、正解だけハイライトして他は選べなくする
          let btnStateClass = "";
          let disabled = isCleared ? "disabled" : "";
          if (isCleared && idx === p.ans) btnStateClass = "correct";
          else if (isCleared) btnStateClass = "wrong";
          let displayOpt = p.type === 'image' ? `<div style="width:80px;height:80px;">${optText}</div>` : optText;
          optsHTML += `<button class="${optClass} ${btnStateClass}" id="btn-${p.id}-${idx}" onclick="checkAnswer(${p.id}, ${idx})" ${disabled}>
            ${p.type === 'text' ? `<span style="display:inline-block; width:25px; height:25px; background:white; border:2px solid var(--border); border-radius:50%; text-align:center; line-height:21px;">${idx+1}</span>` : ''}
            ${displayOpt}
          </button>`;
        });
        let cardHTML = `
          <div class="test-card ${isCleared ? 'cleared' : ''}" id="card-${p.id}">
            <div class="test-badge">${p.type === 'image' ? '図形もんだい' : 'ことばのもんだい'}</div>
            <div class="test-question">${p.q}</div>
            <div class="${gridClass}">
              ${optsHTML}
            </div>
            <div class="feedback-msg" id="fb-${p.id}">${isCleared ? '🎉 おみごと！ 正解です！' : ''}</div>
          </div>
        `;
        container.innerHTML += cardHTML;
      });
    }

    function checkAnswer(probId, selectedIdx) {
      const p = testProblems.find(x => x.id === probId);
      const fb = document.getElementById(`fb-${probId}`);
      // 全ボタンリセット
      p.opts.forEach((_, i) => {
        document.getElementById(`btn-${probId}-${i}`).className = p.type === 'image' ? 'btn-option img-opt' : 'btn-option';
      });
      if (selectedIdx === p.ans) {
        document.getElementById(`btn-${probId}-${selectedIdx}`).classList.add('correct');
        fb.innerText = "🎉 大正解！ ばっちりだね！（セーブしました）";
        fb.className = "feedback-msg success";
        userProgress[probId] = true;
        saveProgress();
        updateProgressBar();
        // カードをクリア状態にして再描画
        setTimeout(() => {
          renderTestList();
        }, 800);
      } else {
        document.getElementById(`btn-${probId}-${selectedIdx}`).classList.add('wrong');
        fb.innerText = "❌ おしい！ もう一度教科書や図鑑を思い出してみよう。";
        fb.className = "feedback-msg error";
      }
    }
    // ==========================================
    // タブ切り替え ＆ LocalStorage (Save/Load)
    // ==========================================
    function switchMainTab(sectionId, btnElem) {
      document.querySelectorAll('.main-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      btnElem.classList.add('active');
      document.getElementById(sectionId).classList.add('active');
    }

    function loadProgress() {
      try {
        let saved = localStorage.getItem('triangle_master_progress');
        if (saved) userProgress = JSON.parse(saved);
      } catch (e) {}
    }

    function saveProgress() {
      try {
        localStorage.setItem('triangle_master_progress', JSON.stringify(userProgress));
      } catch (e) {}
    }

    function updateProgressBar() {
      let cleared = Object.keys(userProgress).length;
      document.getElementById('cleared-count').innerText = cleared;
      let percent = (cleared / 10) * 100;
      document.getElementById('progress-fill').style.width = `${percent}%`;
    }

    function resetAllData() {
      if (confirm("ほんとうにすべてのデータを消して、最初からやり直しますか？")) {
        userProgress = {};
        saveProgress();
        initTestMode();
      }
    }
  </script>

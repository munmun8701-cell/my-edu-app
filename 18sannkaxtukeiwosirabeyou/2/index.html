<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">

  <!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【体験型】二等辺三角形のかき方マスター</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00bcd4;
      --primary-dark: #0097a7;
      --accent: #ff4081;
      --success: #00e676;
      --warning: #ff9800;
      --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-main: #2c3e50;
      --grid-color: rgba(0, 188, 212, 0.15);
    }

    * {
      box-sizing: border-box;
      font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* メインコンテナ */
    .app-container {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 900px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.8);
      position: relative;
    }

    /* ヘッダー */
    .header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      padding: 25px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .header h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 800;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    /* タブ */
    .tabs {
      display: flex;
      padding: 20px;
      gap: 15px;
      background: rgba(0, 0, 0, 0.02);
      justify-content: center;
    }

    .tab {
      flex: 1;
      max-width: 250px;
      padding: 15px;
      text-align: center;
      font-weight: 800;
      cursor: pointer;
      border: none;
      background: white;
      color: #95a5a6;
      border-radius: 50px;
      font-size: 1.1rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      transition: all 0.3s;
    }

    .tab:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
    }

    .tab.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 8px 15px rgba(0, 188, 212, 0.3);
    }

    /* コンテンツエリア */
    .content-area {
      padding: 30px;
      display: none;
      animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .content-area.active {
      display: block;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* インストラクション */
    .instruction-bubble {
      position: relative;
      background: white;
      border: 3px solid var(--primary);
      padding: 20px 30px;
      border-radius: 20px;
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 20px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .instruction-bubble::before {
      content: '👨‍🏫';
      font-size: 2.5rem;
    }

    /* インタラクティブ・キャンバス */
    .canvas-container {
      position: relative;
      width: 100%;
      height: 480px;
      background-color: #fff;
      background-image:
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 20px 20px;
      border-radius: 16px;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.02), 0 10px 20px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
      border: 4px solid #e0f7fa;
    }

    /* キャンバス上のナビゲーション指示 */
    .canvas-prompt {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 30px;
      border-radius: 50px;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--accent);
      border: 3px solid var(--accent);
      box-shadow: 0 5px 15px rgba(255, 64, 129, 0.2);
      pointer-events: none;
      z-index: 10;
      white-space: nowrap;
      transition: all 0.3s;
    }

    .canvas-prompt.done {
      color: var(--success);
      border-color: var(--success);
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* SVG 要素のスタイリング */
    .point {
      fill: var(--primary-dark);
    }

    .line {
      stroke: var(--text-main);
      stroke-width: 5;
      stroke-linecap: round;
    }

    .line-dashed {
      stroke: #bdc3c7;
      stroke-width: 5;
      stroke-dasharray: 8 8;
      stroke-linecap: round;
    }

    .line-hitbox {
      stroke: transparent;
      stroke-width: 40;
      cursor: pointer;
    }

    .line-hitbox:hover {
      stroke: rgba(0, 188, 212, 0.2);
    }

    .arc {
      stroke: var(--accent);
      stroke-width: 4;
      fill: none;
      stroke-linecap: round;
      filter: drop-shadow(0 0 5px rgba(255, 64, 129, 0.4));
    }

    .text-label {
      font-size: 22px;
      font-weight: 800;
      fill: var(--primary-dark);
      user-select: none;
    }

    .text-length {
      font-size: 16px;
      font-weight: 800;
      fill: #7f8c8d;
      user-select: none;
      background: white;
    }

    /* タップを促す波紋アニメーション */
    .pulse-circle {
      fill: var(--accent);
      cursor: pointer;
      animation: pulseAnim 1s infinite alternate;
    }

    .pulse-circle:hover {
      fill: #ffeb3b;
    }

    @keyframes pulseAnim {
      0% {
        r: 15px;
        opacity: 0.8;
      }

      100% {
        r: 25px;
        opacity: 0.3;
      }
    }

    /* 板書・まとめ */
    .board-plan {
      background: #2c3e50;
      color: white;
      border: 6px solid #8e44ad;
      padding: 25px;
      border-radius: 12px;
      margin-top: 20px;
      text-align: center;
      font-weight: 800;
      font-size: 1.4rem;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
      display: none;
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.8);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .highlight {
      color: #f1c40f;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    /* 練習問題用UI */
    .practice-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .practice-card {
      background: white;
      padding: 20px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 3px solid transparent;
      transition: all 0.3s;
    }

    .practice-card:hover {
      border-color: var(--primary);
      transform: translateY(-3px);
    }

    .practice-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary-dark);
    }

    /* 底辺選択UI（モーダル風インライン） */
    .base-selector {
      background: #e1f5fe;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      display: none;
      animation: popIn 0.4s ease;
      border: 3px solid var(--primary);
    }

    .base-selector h2 {
      color: var(--primary-dark);
      margin-top: 0;
    }

    .base-options {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .base-btn {
      padding: 15px 40px;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
      background: white;
      border: 4px solid var(--primary);
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .base-btn:hover {
      background: var(--primary);
      color: white;
      transform: scale(1.05);
    }

    /* メッセージフィードバック */
    #feedback-msg {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--accent);
      margin-top: 20px;
      min-height: 2rem;
    }

    /* ボタン群 */
    .btn {
      padding: 12px 30px;
      font-size: 1.2rem;
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, var(--text-main), #576574);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
      transition: all 0.2s;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.3);
    }

    .btn-action {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 8px 15px rgba(0, 188, 212, 0.3);
    }

    /* パーティクル（紙吹雪） */
    #confetti-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
    }

    .confetti {
      position: absolute;
      width: 15px;
      height: 15px;
      animation: fall 3s linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div id="confetti-container"></div>

  <div class="app-container">
    <div class="header">
      <h1>📐 二等辺三角形のかき方マスター</h1>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('main')">① かき方を考えよう</button>
      <button class="tab" onclick="switchTab('practice')">② 練習しよう</button>
    </div>

    <!-- タブ1: メイン授業 -->
    <div id="main" class="content-area active">
      <div class="instruction-bubble">
        <span>辺の長さが <strong>3cm、4cm、4cm</strong> の二等辺三角形をかこう！<br>キャンバスを直接タップして、作図を進めてね。</span>
      </div>

      <div class="canvas-container" id="main-canvas-wrapper">
        <div class="canvas-prompt" id="main-prompt">準備中...</div>
        <svg id="main-svg"></svg>
      </div>

      <div id="main-board-plan" class="board-plan">
        💡 まとめ：コンパスを使って、長さをうつしとれば<br><span class="highlight">「ウ」の点を正確に決められる</span>ね！
      </div>
    </div>

    <!-- タブ2: 練習問題 -->
    <div id="practice" class="content-area">
      <div class="instruction-bubble">
        <span>下の二等辺三角形をかきましょう。<br>まずは、<strong>どの長さを「はじめにかく辺（底辺）」にするか</strong>えらんでね。</span>
      </div>

      <!-- 問題リスト -->
      <div id="practice-list" class="practice-grid">
        <div class="practice-card">
          <div class="practice-title">① 辺の長さが 7cm、8cm、8cm</div>
          <button class="btn btn-action" onclick="showBaseSelector(1, 7, 8, 8)">作図にちょうせん</button>
        </div>
        <div class="practice-card">
          <div class="practice-title">② 辺の長さが 10cm、10cm、7cm</div>
          <button class="btn btn-action" onclick="showBaseSelector(2, 7, 10, 10)">作図にちょうせん</button>
        </div>
        <div class="practice-card">
          <div class="practice-title">③ 辺の長さが 5cm、7cm、5cm</div>
          <button class="btn btn-action" onclick="showBaseSelector(3, 7, 5, 5)">作図にちょうせん</button>
        </div>
      </div>

      <!-- 底辺選択UI -->
      <div id="base-selector" class="base-selector">
        <h2>どの長さを、はじめにかく辺（底辺）にしますか？</h2>
        <div id="base-options" class="base-options"></div>
        <div id="feedback-msg"></div>
      </div>

      <!-- 練習用キャンバス -->
      <div id="practice-canvas-area" style="display:none;">
        <div class="canvas-container" id="practice-canvas-wrapper">
          <div class="canvas-prompt" id="practice-prompt">準備中...</div>
          <svg id="practice-svg"></svg>
        </div>
        <div style="text-align: center;">
          <button class="btn" onclick="resetPractice()">↩️ 別の問題を選ぶ</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ------------------------------------
    // 共通ユーティリティ
    // ------------------------------------
    function switchTab(tabId) {
      document.querySelectorAll('.content-area').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
      if (tabId === 'main' && !mainEngineStarted) {
        startMainEngine();
        mainEngineStarted = true;
      }
    }

    function createSVGElement(name, attrs) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", name);
      for (let key in attrs) el.setAttribute(key, attrs[key]);
      return el;
    }

    function throwConfetti() {
      const container = document.getElementById('confetti-container');
      const colors = ['#00bcd4', '#ff4081', '#ff9800', '#00e676', '#9c27b0'];
      for (let i = 0; i < 70; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        const shape = Math.random();
        if (shape < 0.3) confetti.style.borderRadius = '50%';
        else if (shape < 0.6) confetti.style.clipPath = 'polygon(50% 0%, 0% 100%, 100% 100%)';
        confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
        confetti.style.animationDelay = (Math.random() * 0.5) + 's';
        container.appendChild(confetti);
        setTimeout(() => confetti.remove(), 5000);
      }
    }
    // ------------------------------------
    // インタラクティブ作図エンジン（二等辺三角形対応版）
    // ------------------------------------
    class InteractiveTriangleBuilder {
      constructor(svgId, promptId, config) {
        this.svg = document.getElementById(svgId);
        this.prompt = document.getElementById(promptId);
        this.config = config; // { scale, lenBase, lenSide, pLeft, labelL, labelR, labelU, onComplete }
        const scale = config.scale;
        this.pA = config.pLeft;
        this.lenBase = config.lenBase;
        this.lenSide = config.lenSide;
        this.rPx = this.lenSide * scale;
        this.pI = {
          x: this.pA.x + (this.lenBase * scale),
          y: this.pA.y
        };
        // 二等辺三角形の交点（ウ）の計算
        let d = this.pI.x - this.pA.x;
        let x = d / 2; // 底辺の中点上に必ず来る
        // ピタゴラスの定理で高さを出す
        let y = Math.sqrt(Math.abs(this.rPx * this.rPx - x * x));
        this.pU = {
          x: this.pA.x + x,
          y: this.pA.y - y
        };
        this.linesDrawn = 0;
        this.initCanvas();
      }
      setPrompt(text, isDone = false) {
        this.prompt.textContent = text;
        if (isDone) this.prompt.classList.add('done');
        else this.prompt.classList.remove('done');
      }
      initCanvas() {
        this.svg.innerHTML = '';
        // 底辺を描画
        this.svg.appendChild(createSVGElement('line', {
          x1: this.pA.x,
          y1: this.pA.y,
          x2: this.pI.x,
          y2: this.pI.y,
          class: 'line'
        }));
        this.svg.appendChild(createSVGElement('circle', {
          cx: this.pA.x,
          cy: this.pA.y,
          r: 6,
          class: 'point'
        }));
        this.svg.appendChild(createSVGElement('circle', {
          cx: this.pI.x,
          cy: this.pI.y,
          r: 6,
          class: 'point'
        }));
        // ラベル（ア、イ）
        if (this.config.labelL) {
          this.svg.appendChild(createSVGElement('text', {
            x: this.pA.x - 30,
            y: this.pA.y + 20,
            class: 'text-label'
          })).textContent = this.config.labelL;
          this.svg.appendChild(createSVGElement('text', {
            x: this.pI.x + 10,
            y: this.pI.y + 20,
            class: 'text-label'
          })).textContent = this.config.labelR;
        }
        // 底辺の長さテキスト
        const bg = createSVGElement('rect', {
          x: (this.pA.x + this.pI.x) / 2 - 30,
          y: this.pA.y + 15,
          width: 60,
          height: 25,
          fill: 'white',
          rx: 5
        });
        const label = createSVGElement('text', {
          x: (this.pA.x + this.pI.x) / 2,
          y: this.pA.y + 32,
          class: 'text-length',
          'text-anchor': 'middle'
        });
        label.textContent = `${this.lenBase} cm`;
        this.svg.appendChild(bg);
        this.svg.appendChild(label);
        // 動的グループ
        this.dynamicGroup = createSVGElement('g', {});
        this.svg.appendChild(this.dynamicGroup);
        this.startStep1();
      }
      createPulse(cx, cy, onClick) {
        const pulse = createSVGElement('circle', {
          cx,
          cy,
          class: 'pulse-circle'
        });
        pulse.onclick = () => {
          pulse.remove();
          onClick();
        };
        this.dynamicGroup.appendChild(pulse);
      }
      drawArcAnim(cx, cy, targetPoint, callback) {
        const angle = Math.atan2(targetPoint.y - cy, targetPoint.x - cx);
        const startAngle = angle - 0.45;
        const endAngle = angle + 0.45;
        const startX = cx + this.rPx * Math.cos(startAngle);
        const startY = cy + this.rPx * Math.sin(startAngle);
        const endX = cx + this.rPx * Math.cos(endAngle);
        const endY = cy + this.rPx * Math.sin(endAngle);
        const sweep = startAngle < endAngle ? 1 : 0;
        const arc = createSVGElement('path', {
          d: `M ${startX} ${startY} A ${this.rPx} ${this.rPx} 0 0 ${sweep} ${endX} ${endY}`,
          class: 'arc'
        });
        this.dynamicGroup.appendChild(arc);
        const length = arc.getTotalLength();
        arc.style.strokeDasharray = length;
        arc.style.strokeDashoffset = length;
        const anim = arc.animate([{
          strokeDashoffset: length
        }, {
          strokeDashoffset: 0
        }], {
          duration: 800,
          fill: 'forwards',
          easing: 'ease-out'
        });
        anim.onfinish = callback;
      }
      startStep1() {
        this.setPrompt(`【手順１】左の点をタップして、コンパスを使おう！`);
        this.createPulse(this.pA.x, this.pA.y, () => {
          this.drawArcAnim(this.pA.x, this.pA.y, this.pU, () => this.startStep2());
          const txt = createSVGElement('text', {
            x: this.pA.x - 30,
            y: this.pU.y + 40,
            class: 'text-length',
            fill: '#ff4081'
          });
          txt.textContent = `左から${this.lenSide}cm`;
          this.dynamicGroup.appendChild(txt);
        });
      }
      startStep2() {
        this.setPrompt(`【手順２】右の点をタップして、コンパスを使おう！`);
        this.createPulse(this.pI.x, this.pI.y, () => {
          this.drawArcAnim(this.pI.x, this.pI.y, this.pU, () => this.startStep3());
          const txt = createSVGElement('text', {
            x: this.pI.x - 30,
            y: this.pU.y + 40,
            class: 'text-length',
            fill: '#ff4081'
          });
          txt.textContent = `右から${this.lenSide}cm`;
          this.dynamicGroup.appendChild(txt);
        });
      }
      startStep3() {
        this.setPrompt(`【手順３】線が交わったところをタップして、「頂点」を打とう！`);
        this.createPulse(this.pU.x, this.pU.y, () => {
          const pointU = createSVGElement('circle', {
            cx: this.pU.x,
            cy: this.pU.y,
            r: 0,
            fill: '#ff4081'
          });
          this.dynamicGroup.appendChild(pointU);
          pointU.animate([{
            r: 0
          }, {
            r: 8
          }], {
            duration: 300,
            fill: 'forwards',
            easing: 'ease-out'
          });
          if (this.config.labelU) {
            const txt = createSVGElement('text', {
              x: this.pU.x - 12,
              y: this.pU.y - 20,
              class: 'text-label'
            });
            txt.textContent = this.config.labelU;
            this.dynamicGroup.appendChild(txt);
          }
          this.startStep4();
        });
      }
      startStep4() {
        this.setPrompt(`【手順４】点線をタップして、定規で直線を引こう！`);
        // ★ 直線を引く処理（修正ポイント） ★
        const drawInteractiveLine = (pStart, pEnd) => {
          const group = createSVGElement('g', {});
          const dashed = createSVGElement('line', {
            x1: pStart.x,
            y1: pStart.y,
            x2: pEnd.x,
            y2: pEnd.y,
            class: 'line-dashed'
          });
          const hitbox = createSVGElement('line', {
            x1: pStart.x,
            y1: pStart.y,
            x2: pEnd.x,
            y2: pEnd.y,
            class: 'line-hitbox'
          });
          group.appendChild(dashed);
          group.appendChild(hitbox);
          this.dynamicGroup.appendChild(group);
          hitbox.onclick = () => {
            group.remove(); // 案内用の点線を消す
            // strokeDashoffsetを使って確実に線をアニメーション描画する
            const solid = createSVGElement('line', {
              x1: pStart.x,
              y1: pStart.y,
              x2: pEnd.x,
              y2: pEnd.y,
              class: 'line'
            });
            // 線の長さを計算
            const lineLength = Math.hypot(pEnd.x - pStart.x, pEnd.y - pStart.y);
            solid.style.strokeDasharray = lineLength;
            solid.style.strokeDashoffset = lineLength;
            this.dynamicGroup.appendChild(solid);
            const anim = solid.animate(
              [{
                strokeDashoffset: lineLength
              }, {
                strokeDashoffset: 0
              }], {
                duration: 400,
                fill: 'forwards',
                easing: 'ease-out'
              }
            );
            anim.onfinish = () => {
              // 辺の長さラベルを追加
              const bg = createSVGElement('rect', {
                x: (pStart.x + pEnd.x) / 2 - 30,
                y: (pStart.y + pEnd.y) / 2 - 15,
                width: 60,
                height: 25,
                fill: 'white',
                rx: 5
              });
              const lbl = createSVGElement('text', {
                x: (pStart.x + pEnd.x) / 2,
                y: (pStart.y + pEnd.y) / 2 + 3,
                class: 'text-length',
                'text-anchor': 'middle'
              });
              lbl.textContent = `${this.lenSide} cm`;
              this.dynamicGroup.appendChild(bg);
              this.dynamicGroup.appendChild(lbl);
              this.linesDrawn++;
              if (this.linesDrawn === 2) this.complete();
            };
          };
        };
        drawInteractiveLine(this.pA, this.pU);
        drawInteractiveLine(this.pI, this.pU);
      }
      complete() {
        this.setPrompt(`🎉 直線が引けました！二等辺三角形の完成です！`, true);
        throwConfetti();
        if (this.config.onComplete) setTimeout(this.config.onComplete, 800);
      }
    }
    // ------------------------------------
    // タブ制御と実行ロジック
    // ------------------------------------
    let mainEngineStarted = false;

    function startMainEngine() {
      new InteractiveTriangleBuilder('main-svg', 'main-prompt', {
        scale: 50,
        lenBase: 3,
        lenSide: 4, // 3cm, 4cm, 4cm
        pLeft: {
          x: 300,
          y: 380
        },
        labelL: 'ア',
        labelR: 'イ',
        labelU: 'ウ',
        onComplete: () => {
          document.getElementById('main-board-plan').style.display = 'block';
        }
      });
    }
    // ------------------------------------
    // 練習問題ロジック
    // ------------------------------------
    let currentPractice = null;

    function showBaseSelector(id, base, side1, side2) {
      currentPractice = {
        id,
        base,
        side1,
        side2
      };
      document.getElementById('practice-list').style.display = 'none';
      document.getElementById('base-selector').style.display = 'block';
      document.getElementById('feedback-msg').textContent = "";
      const options = [...new Set([base, side1, side2])].sort((a, b) => a - b);
      const container = document.getElementById('base-options');
      container.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'base-btn';
        btn.textContent = `${opt} cm`;
        btn.onclick = () => checkBaseAnswer(opt);
        container.appendChild(btn);
      });
    }

    function checkBaseAnswer(selectedBase) {
      const msgDiv = document.getElementById('feedback-msg');
      if (selectedBase === currentPractice.base) {
        msgDiv.style.color = 'var(--success)';
        msgDiv.textContent = "せいかい！ １つだけちがう長さの辺を底辺にすると、かきやすいね。";
      } else {
        msgDiv.style.color = 'var(--warning)';
        msgDiv.textContent = `それでもかけるけど、まずは１つだけちがう長さ（${currentPractice.base}cm）を底辺にしてみよう！`;
      }
      // 1.5秒後に作図キャンバスへ移動
      setTimeout(() => {
        document.getElementById('base-selector').style.display = 'none';
        startPracticeCanvas();
      }, 1800);
    }

    function startPracticeCanvas() {
      document.getElementById('practice-canvas-area').style.display = 'block';
      const pScale = 35; // 画面に収めるためのスケール調整
      const basePx = currentPractice.base * pScale;
      // 中央寄せのためのX座標計算（キャンバス幅700px想定）
      const startX = 350 - (basePx / 2);
      new InteractiveTriangleBuilder('practice-svg', 'practice-prompt', {
        scale: pScale,
        lenBase: currentPractice.base,
        lenSide: currentPractice.side1,
        pLeft: {
          x: startX,
          y: 400
        },
        labelL: '',
        labelR: '',
        labelU: '',
        onComplete: null
      });
    }

    function resetPractice() {
      document.getElementById('practice-canvas-area').style.display = 'none';
      document.getElementById('base-selector').style.display = 'none';
      document.getElementById('practice-list').style.display = 'grid';
      currentPractice = null;
    }
    window.onload = () => {
      startMainEngine();
      mainEngineStarted = true;
    };
  </script>

<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>社会　暮らしを守る</title>
    <meta name="viewport" content="width=device-width"><link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">

  <body>
  <!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>くらしを守るミッション</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&family=Klee+One:wght@400;600&display=swap">
  <style>
    /* Layout: 出動ボード — 2つの単元（119 消防 / 110 警察）に8時間分の授業カードをならべ、1時間＝問い→予想→調べる→まとめのミッション画面 */
    :root {
      --bg: #EDF1F5;
      --surface: #FFFFFF;
      --surface-2: #F4F6F9;
      --ink: #172131;
      --muted: #556073;
      --line: #D3DAE4;
      --fire: #C9331F;
      --fire-soft: #FBE4E0;
      --police: #2350A0;
      --police-soft: #E1E8F7;
      --signal: #E3A300;
      --signal-soft: #FFF2C6;
      --ok: #16774A;
      --ok-soft: #DCF1E5;
      --ng: #B9470D;
      --ng-soft: #FCE7D9;
      --on-accent: #FFFFFF;
      --pic-bg: #DDE7F0;
      --pic-ink: #1D2738;
      --p1: #C2410C;
      --p2: #1D4ED8;
      --p3: #15803D;
      --p4: #7E22CE;
      --p5: #A16207;
      --p6: #0E7490;
      --accent: var(--fire);
      --accent-soft: var(--fire-soft);
      --f-display: "Dela Gothic One", "BIZ UDPGothic", "Hiragino Sans", sans-serif;
      --f-body: "Klee One", "BIZ UDPGothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
      --f-ui: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      --r: 14px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0F141B;
        --surface: #171F2A;
        --surface-2: #1E2734;
        --ink: #E8EDF4;
        --muted: #A0ABBC;
        --line: #2C394B;
        --fire: #FF7466;
        --fire-soft: #3A1E1A;
        --police: #8AACF3;
        --police-soft: #1B2842;
        --signal: #F1C232;
        --signal-soft: #363016;
        --ok: #52C48F;
        --ok-soft: #163224;
        --ng: #F49D68;
        --ng-soft: #3A2517;
        --on-accent: #10161F;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #0F141B;
      --surface: #171F2A;
      --surface-2: #1E2734;
      --ink: #E8EDF4;
      --muted: #A0ABBC;
      --line: #2C394B;
      --fire: #FF7466;
      --fire-soft: #3A1E1A;
      --police: #8AACF3;
      --police-soft: #1B2842;
      --signal: #F1C232;
      --signal-soft: #363016;
      --ok: #52C48F;
      --ok-soft: #163224;
      --ng: #F49D68;
      --ng-soft: #3A2517;
      --on-accent: #10161F;
      color-scheme: dark;
    }

    html {
      font-size: 17px
    }

    html.big {
      font-size: 20px
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--f-body);
      font-size: 1rem;
      line-height: 1.85;
      -webkit-text-size-adjust: 100%
    }

    body.lock {
      overflow: hidden
    }

    button {
      font: inherit;
      color: inherit
    }

    :focus-visible {
      outline: 3px solid var(--signal);
      outline-offset: 2px
    }

    rt {
      font-size: .5em;
      font-family: var(--f-ui);
      font-weight: 400;
      letter-spacing: 0
    }

    .noruby rt {
      display: none
    }

    .u-fire {
      --accent: var(--fire);
      --accent-soft: var(--fire-soft)
    }

    .u-police {
      --accent: var(--police);
      --accent-soft: var(--police-soft)
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-block: 18px 56px
    }

    h1,
    h2,
    h3,
    h4 {
      text-wrap: balance
    }

    /* ---------- home ---------- */
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: end;
      padding-block: 8px 18px;
      border-bottom: 3px solid var(--ink)
    }

    .kicker {
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: .8rem;
      letter-spacing: .14em;
      color: var(--muted);
      margin: 0
    }

    .hero h1 {
      font-family: var(--f-display);
      font-weight: 400;
      font-size: clamp(2.3rem, 7vw, 4.4rem);
      line-height: 1.1;
      margin: 2px 0 6px;
      letter-spacing: .03em
    }

    .hero h1 span {
      color: var(--fire)
    }

    .hero .sub {
      margin: 0;
      font-size: 1.02rem;
      color: var(--muted)
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end
    }

    .tbtn {
      font-family: var(--f-ui);
      font-size: .82rem;
      font-weight: 700;
      border: 1.5px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: 6px 13px;
      cursor: pointer;
      min-height: 38px;
      line-height: 1.3
    }

    .tbtn[aria-pressed="true"] {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--bg)
    }

    @media (max-width:640px) {
      .hero {
        grid-template-columns: 1fr
      }

      .tools {
        justify-content: flex-start
      }
    }

    .progress {
      font-family: var(--f-ui);
      font-size: .85rem;
      color: var(--muted);
      margin: 12px 0 0
    }

    .progress b {
      color: var(--ink)
    }

    .unit {
      margin-top: 30px
    }

    .unit-h {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap
    }

    .unit-no {
      font-family: var(--f-display);
      font-size: 2.4rem;
      line-height: 1;
      color: var(--accent);
      letter-spacing: .02em
    }

    .unit-h h2 {
      font-family: var(--f-display);
      font-weight: 400;
      font-size: 1.45rem;
      margin: 0
    }

    .unit-h .span {
      font-family: var(--f-ui);
      color: var(--muted);
      font-size: .85rem
    }

    .lgrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(232px, 1fr));
      gap: 14px;
      margin-top: 12px
    }

    .lcard {
      position: relative;
      text-align: left;
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      padding: 16px 16px 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 178px;
      transition: transform .15s, border-color .15s
    }

    .lcard:hover {
      border-color: var(--accent);
      transform: translateY(-2px)
    }

    .lcard .no {
      font-family: var(--f-display);
      color: var(--accent);
      font-size: .95rem;
      line-height: 1
    }

    .lcard .no b {
      font-size: 2.1rem;
      font-weight: 400;
      margin: 0 2px
    }

    .lcard h3 {
      margin: 4px 0 0;
      font-size: 1.14rem;
      font-weight: 600;
      line-height: 1.55
    }

    .lcard .pg {
      font-family: var(--f-ui);
      font-size: .76rem;
      color: var(--muted)
    }

    .lcard .qq {
      font-size: .86rem;
      color: var(--muted);
      line-height: 1.75;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin: 0
    }

    .stamp {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 54px;
      height: 54px;
      border: 3px double var(--accent);
      color: var(--accent);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--f-display);
      font-size: .82rem;
      transform: rotate(-14deg);
      line-height: 1.1;
      text-align: center
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
      gap: 14px;
      margin-top: 12px
    }

    .gtile {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      background: var(--ink);
      color: var(--bg);
      border: 0;
      border-radius: var(--r);
      padding: 14px 16px;
      text-align: left;
      cursor: pointer;
      transition: transform .15s
    }

    .gtile:hover {
      transform: translateY(-2px)
    }

    .gtile .gi {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: var(--pic-bg);
      display: grid;
      place-items: center;
      overflow: hidden
    }

    .gtile .gi svg {
      width: 76px;
      height: 76px
    }

    .gtile h3 {
      font-family: var(--f-display);
      font-weight: 400;
      font-size: 1.3rem;
      margin: 0;
      line-height: 1.3
    }

    .gtile p {
      margin: 4px 0 0;
      font-size: .9rem;
      line-height: 1.7;
      opacity: .85
    }

    .gtile .best {
      font-family: var(--f-ui);
      font-size: .78rem;
      opacity: .75
    }

    .foot {
      margin-top: 36px;
      font-family: var(--f-ui);
      font-size: .8rem;
      color: var(--muted);
      line-height: 1.7
    }

    /* ---------- lesson ---------- */
    .lhead {
      display: flex;
      align-items: center;
      gap: 10px 14px;
      flex-wrap: wrap;
      padding-block: 4px 14px;
      border-bottom: 3px solid var(--accent)
    }

    .back {
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: .88rem;
      border: 1.5px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      min-height: 40px
    }

    .lno {
      font-family: var(--f-display);
      color: var(--accent);
      font-size: 1rem;
      white-space: nowrap
    }

    .lno b {
      font-size: 1.7rem;
      font-weight: 400
    }

    .ltitle {
      font-family: var(--f-display);
      font-weight: 400;
      font-size: clamp(1.3rem, 3.4vw, 1.85rem);
      margin: 0;
      line-height: 1.35;
      flex: 1 1 240px;
      min-width: 0
    }

    .lpg {
      font-family: var(--f-ui);
      font-size: .8rem;
      color: var(--muted);
      white-space: nowrap
    }

    .steps {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 14px auto 16px;
      max-width: 880px
    }

    .step {
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: .88rem;
      border: 1.5px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      min-height: 40px;
      display: inline-flex;
      gap: 6px;
      align-items: center
    }

    .step i {
      font-style: normal;
      font-family: var(--f-display);
      font-weight: 400
    }

    .step.seen {
      border-color: var(--accent)
    }

    .step[aria-current="step"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent)
    }

    .stage {
      max-width: 880px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px
    }

    .toi {
      background: var(--accent-soft);
      border-radius: var(--r);
      padding: 18px 20px
    }

    .toi .lab {
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: .78rem;
      letter-spacing: .12em;
      color: var(--accent);
      margin: 0
    }

    .toi p.q {
      font-size: 1.38rem;
      font-weight: 600;
      margin: 4px 0 0;
      line-height: 1.9
    }

    .blk {
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0
    }

    .tag {
      align-self: flex-start;
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: .74rem;
      letter-spacing: .08em;
      color: var(--accent);
      border: 1.5px solid var(--accent);
      border-radius: 999px;
      padding: 1px 10px;
      line-height: 1.7
    }

    .bq {
      font-size: 1.16rem;
      font-weight: 600;
      margin: 0;
      line-height: 1.9
    }

    .hint {
      font-family: var(--f-ui);
      font-size: .82rem;
      color: var(--muted);
      margin: -6px 0 0
    }

    .opts {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr));
      gap: 8px
    }

    .opt {
      display: flex;
      gap: 10px;
      align-items: center;
      text-align: left;
      border: 2px solid var(--line);
      background: var(--surface-2);
      border-radius: 12px;
      padding: 9px 12px;
      cursor: pointer;
      min-height: 54px;
      line-height: 1.65
    }

    .opt .mk {
      flex: 0 0 22px;
      height: 22px;
      border: 2px solid var(--muted);
      border-radius: 50%
    }

    .opts.multi .opt .mk {
      border-radius: 6px
    }

    .opt.on {
      border-color: var(--accent);
      background: var(--accent-soft)
    }

    .opt.on .mk {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: inset 0 0 0 3px var(--surface)
    }

    .opt.good {
      border-color: var(--ok);
      background: var(--ok-soft)
    }

    .opt.good .mk {
      background: var(--ok);
      border-color: var(--ok)
    }

    .opt.bad {
      border-color: var(--ng);
      background: var(--ng-soft)
    }

    .opt.bad .mk {
      background: var(--ng);
      border-color: var(--ng)
    }

    .opt.miss {
      border-style: dashed;
      border-color: var(--ok)
    }

    .opt:disabled {
      cursor: default
    }

    .btn {
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: .95rem;
      border: 2px solid var(--ink);
      background: var(--surface);
      border-radius: 999px;
      padding: 8px 20px;
      min-height: 46px;
      cursor: pointer;
      line-height: 1.3
    }

    .btn.pri {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent)
    }

    .btn.big {
      font-size: 1.1rem;
      padding: 12px 28px;
      min-height: 56px
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    .acts {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center
    }

    .fb {
      border-radius: 12px;
      padding: 12px 16px;
      background: var(--surface-2);
      line-height: 1.9
    }

    .fb.good {
      background: var(--ok-soft)
    }

    .fb.try {
      background: var(--ng-soft)
    }

    .fb.note {
      background: var(--signal-soft)
    }

    .fb .v {
      font-family: var(--f-display);
      font-weight: 400;
      font-size: 1.15rem;
      margin-right: 8px
    }

    .fb .ex {
      margin: 6px 0 0
    }

    .fb ul {
      margin: 6px 0 0;
      padding-left: 1.2em
    }

    .ta,
    .inp {
      width: 100%;
      box-sizing: border-box;
      font: inherit;
      font-size: 1rem;
      border: 2px solid var(--line);
      background: var(--surface-2);
      color: var(--ink);
      border-radius: 10px;
      padding: 8px 12px;
      line-height: 1.7
    }

    .ta:focus,
    .inp:focus {
      border-color: var(--accent);
      outline: none
    }

    .rlab {
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: -6px
    }

    .say {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .line {
      display: flex;
      gap: 10px;
      align-items: flex-start
    }

    .av {
      flex: 0 0 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--f-display);
      color: #fff;
      font-size: 1rem
    }

    .bub {
      background: var(--surface-2);
      border-radius: 4px 14px 14px 14px;
      padding: 7px 14px;
      line-height: 1.85;
      min-width: 0
    }

    .bub small {
      display: block;
      font-family: var(--f-ui);
      font-size: .74rem;
      color: var(--muted);
      line-height: 1.4
    }

    .note {
      background: var(--signal-soft);
      border-radius: var(--r);
      padding: 14px 18px;
      line-height: 1.9
    }

    .note .lab {
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: .78rem;
      letter-spacing: .1em;
      margin: 0
    }

    .plan {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr));
      gap: 10px
    }

    .plan div {
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 10px 12px;
      line-height: 1.7
    }

    .plan b {
      font-family: var(--f-display);
      font-weight: 400;
      color: var(--accent);
      display: block;
      font-size: .9rem
    }

    .lnav {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 24px auto 0;
      max-width: 880px;
      flex-wrap: wrap
    }

    /* slider */
    .slv {
      font-family: var(--f-display);
      font-size: 2.4rem;
      color: var(--accent);
      line-height: 1.2;
      font-variant-numeric: tabular-nums
    }

    .slv small {
      font-size: 1rem;
      margin-left: 4px
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--accent);
      height: 36px;
      margin: 0
    }

    .slscale {
      display: flex;
      justify-content: space-between;
      font-family: var(--f-ui);
      font-size: .8rem;
      color: var(--muted);
      margin-top: -8px
    }

    /* chart */
    .chartbox {
      overflow-x: auto
    }

    .chart {
      width: 100%;
      max-width: 600px;
      height: auto;
      display: block
    }

    .chart text {
      font-family: var(--f-ui);
      fill: var(--ink)
    }

    .chart .grid {
      stroke: var(--line)
    }

    .chart .bar {
      fill: var(--accent)
    }

    .chart .bar2 {
      fill: var(--muted)
    }

    .chart .pred {
      stroke: var(--signal);
      stroke-width: 3;
      stroke-dasharray: 8 6
    }

    .chart .predt {
      fill: var(--ink);
      font-weight: 700
    }

    .cap {
      font-family: var(--f-ui);
      font-size: .78rem;
      color: var(--muted);
      margin: 0
    }

    /* sort */
    .pool {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 54px;
      padding: 10px;
      border: 2px dashed var(--line);
      border-radius: 12px;
      align-content: flex-start
    }

    .pool:empty::after {
      content: "ぜんぶ分けられたね！";
      font-family: var(--f-ui);
      font-size: .85rem;
      color: var(--muted);
      align-self: center
    }

    .chip {
      border: 2px solid var(--line);
      background: var(--surface);
      border-radius: 10px;
      padding: 5px 12px;
      cursor: pointer;
      line-height: 1.7;
      text-align: left;
      font-size: .98rem
    }

    .chip.sel {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 0 3px var(--accent-soft)
    }

    .chip.user {
      border-style: dashed
    }

    .chip.good {
      border-color: var(--ok);
      background: var(--ok-soft)
    }

    .chip.bad {
      border-color: var(--ng);
      background: var(--ng-soft)
    }

    .cats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr));
      gap: 10px
    }

    .cat {
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--surface-2);
      cursor: pointer;
      min-width: 0
    }

    .cat.ready {
      border-color: var(--accent);
      border-style: dashed
    }

    .cat h4 {
      margin: 0;
      font-family: var(--f-ui);
      font-size: .92rem;
      line-height: 1.5;
      display: flex;
      justify-content: space-between;
      gap: 6px;
      align-items: center
    }

    .cat .put {
      font-family: var(--f-ui);
      font-size: .74rem;
      font-weight: 700;
      border: 0;
      background: var(--accent);
      color: var(--on-accent);
      border-radius: 999px;
      padding: 3px 10px;
      cursor: pointer;
      white-space: nowrap
    }

    .cat .in {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .addrow {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .addrow .inp {
      flex: 1 1 220px;
      width: auto
    }

    /* order */
    .seq {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .seq li {
      display: flex;
      gap: 10px;
      align-items: center
    }

    .seq .n {
      flex: 0 0 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--bg);
      display: grid;
      place-items: center;
      font-family: var(--f-display);
      font-size: .95rem
    }

    .seq .slot {
      flex: 1;
      border: 2px dashed var(--line);
      border-radius: 10px;
      min-height: 46px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      text-align: left;
      background: none;
      cursor: pointer;
      line-height: 1.6;
      min-width: 0
    }

    .seq .slot.fill {
      border-style: solid;
      background: var(--surface-2)
    }

    .seq .slot.good {
      border-color: var(--ok);
      background: var(--ok-soft)
    }

    .seq .slot.bad {
      border-color: var(--ng);
      background: var(--ng-soft)
    }

    /* match */
    .match {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
      gap: 8px 12px
    }

    .mcol {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0
    }

    .mcol h4 {
      margin: 0;
      font-family: var(--f-ui);
      font-size: .78rem;
      color: var(--muted)
    }

    .mi {
      display: flex;
      gap: 8px;
      align-items: center;
      text-align: left;
      border: 2px solid var(--line);
      background: var(--surface-2);
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      min-height: 52px;
      line-height: 1.6
    }

    .mi .pt {
      flex: 0 0 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--f-display);
      font-size: .8rem;
      border: 2px dashed var(--line);
      color: #fff
    }

    .mi .pt.p {
      border: 0;
      background: var(--pc)
    }

    .mi.sel {
      border-color: var(--accent);
      background: var(--accent-soft)
    }

    .mi.good {
      border-color: var(--ok)
    }

    .mi.bad {
      border-color: var(--ng)
    }

    /* fill */
    .fill {
      font-size: 1.14rem;
      line-height: 2.6;
      margin: 0
    }

    .blank {
      display: inline-block;
      min-width: 5em;
      text-align: center;
      border: 0;
      border-bottom: 3px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 6px 6px 0 0;
      padding: 0 8px;
      margin: 0 3px;
      cursor: pointer;
      line-height: 1.8;
      font-weight: 600
    }

    .blank.sel {
      outline: 3px solid var(--signal)
    }

    .blank.good {
      border-color: var(--ok);
      background: var(--ok-soft)
    }

    .blank.bad {
      border-color: var(--ng);
      background: var(--ng-soft)
    }

    .bank {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    .word {
      border: 2px solid var(--ink);
      background: var(--surface);
      border-radius: 999px;
      padding: 4px 14px;
      cursor: pointer;
      font-weight: 600;
      line-height: 1.7
    }

    .word:disabled {
      opacity: .3;
      cursor: default
    }

    /* reflect */
    .rates {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .rate {
      border: 2px solid var(--line);
      background: var(--surface-2);
      border-radius: 12px;
      padding: 8px 14px;
      cursor: pointer;
      font-family: var(--f-ui);
      font-weight: 700;
      min-height: 48px
    }

    .rate[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent-soft)
    }

    .saved {
      font-family: var(--f-ui);
      font-size: .78rem;
      color: var(--muted)
    }

    .list {
      margin: 0;
      padding-left: 1.3em
    }

    .list li {
      line-height: 1.8
    }

    .list button {
      font-family: var(--f-ui);
      font-size: .75rem;
      border: 0;
      background: none;
      color: var(--muted);
      cursor: pointer;
      text-decoration: underline
    }

    .exrow {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    /* pictures */
    .pic {
      background: var(--pic-bg);
      border-radius: 12px;
      padding: 8px;
      overflow-x: auto
    }

    .pic svg {
      display: block;
      width: 100%;
      height: auto
    }

    .pic svg.wide {
      min-width: 620px
    }

    .pic svg text {
      font-family: var(--f-ui)
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      font-family: var(--f-ui);
      font-size: .8rem;
      color: var(--muted)
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px
    }

    .legend i {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      display: inline-block
    }

    .sched {
      display: grid;
      grid-template-columns: auto 1fr 1fr;
      gap: 4px;
      font-family: var(--f-ui);
      font-size: .88rem;
      min-width: 420px
    }

    .sched div {
      padding: 8px 10px;
      border-radius: 8px;
      text-align: center
    }

    .sched .h {
      color: var(--muted);
      font-size: .78rem
    }

    .sched .w {
      background: var(--fire-soft);
      font-weight: 700
    }

    .sched .o {
      background: var(--police-soft)
    }

    .netcap {
      min-height: 3.6em;
      line-height: 1.8
    }

    .pop {
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--surface-2)
    }

    .pop .opts {
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr))
    }

    /* memo & overlay */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: var(--bg);
      overflow-y: auto;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    .ghead {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: space-between;
      flex-wrap: wrap;
      padding-block: 4px 12px;
      border-bottom: 3px solid var(--fire);
      margin-bottom: 16px
    }

    .ghead h2 {
      font-family: var(--f-display);
      font-weight: 400;
      font-size: clamp(1.3rem, 4vw, 1.9rem);
      margin: 0
    }

    .memo-bg {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(10, 14, 20, .45);
      display: flex;
      justify-content: flex-end
    }

    .memo {
      background: var(--surface);
      width: min(440px, 100%);
      height: 100%;
      overflow-y: auto;
      box-sizing: border-box;
      padding: calc(18px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) 24px 20px;
      font-family: var(--f-ui);
      line-height: 1.8
    }

    .memo h3 {
      margin: 0 0 4px;
      font-size: 1.1rem
    }

    .memo h4 {
      margin: 14px 0 2px;
      font-size: .85rem;
      color: var(--accent)
    }

    .memo ol {
      padding-left: 1.3em;
      margin: 0
    }

    .memo p {
      margin: 0
    }

    /* record */
    .rec {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 880px;
      margin: 0 auto
    }

    .rec section {
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      padding: 14px 18px
    }

    .rec h3 {
      margin: 0 0 6px;
      font-size: 1.05rem
    }

    .rec dl {
      margin: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 4px
    }

    .rec dt {
      font-family: var(--f-ui);
      font-size: .78rem;
      color: var(--muted);
      margin-top: 6px
    }

    .rec dd {
      margin: 0;
      line-height: 1.8
    }

    .confirm {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      font-family: var(--f-ui)
    }

    /* ---------- dress game ---------- */
    .mission {
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 760px;
      margin: 0 auto
    }

    .alarm {
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--fire);
      color: #fff;
      border-radius: 12px;
      padding: 12px 16px;
      font-family: var(--f-ui);
      font-weight: 700;
      line-height: 1.6
    }

    .alarm b {
      font-family: var(--f-display);
      font-weight: 400;
      font-size: 1.6rem;
      line-height: 1
    }

    .dg {
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
      gap: 16px;
      align-items: start
    }

    @media (max-width:760px) {
      .dg {
        grid-template-columns: 1fr
      }
    }

    .dstage {
      background: var(--pic-bg);
      color: var(--pic-ink);
      border-radius: var(--r);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
      min-height: 300px
    }

    .fig {
      width: min(100%, 250px);
      height: auto
    }

    .fig .ly {
      opacity: 0;
      transform: translateY(-12px);
      transition: opacity .25s, transform .25s
    }

    .fig .ly.on {
      opacity: 1;
      transform: none
    }

    .fig .base-shoes.off {
      opacity: 0
    }

    .timer {
      font-family: var(--f-display);
      font-size: 2.3rem;
      line-height: 1;
      font-variant-numeric: tabular-nums
    }

    .timer small {
      font-size: 1rem
    }

    .tbar {
      width: 100%;
      height: 12px;
      border-radius: 6px;
      background: rgba(29, 39, 56, .12);
      overflow: hidden;
      position: relative
    }

    .tbar i {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      background: #2F9E5B;
      transition: width .2s linear
    }

    .tbar i.over {
      background: #C9331F
    }

    .tlab {
      font-family: var(--f-ui);
      font-size: .78rem;
      display: flex;
      justify-content: space-between;
      width: 100%
    }

    .slots {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center
    }

    .slots span {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px dashed rgba(29, 39, 56, .35);
      display: grid;
      place-items: center;
      font-family: var(--f-display);
      font-size: .8rem
    }

    .slots span.on {
      background: #2F9E5B;
      border: 0;
      color: #fff
    }

    .dcards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px
    }

    .dcard {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      border: 2px solid var(--line);
      background: var(--surface);
      border-radius: 14px;
      padding: 10px 6px;
      cursor: pointer;
      min-height: 118px;
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: .86rem;
      text-align: center;
      line-height: 1.45
    }

    .dcard svg {
      width: 62px;
      height: 62px;
      flex: 0 0 auto
    }

    .dcard .icbg {
      background: var(--pic-bg);
      border-radius: 50%;
      padding: 4px;
      display: grid;
      place-items: center
    }

    .dcard.used {
      opacity: .22;
      pointer-events: none
    }

    .dcard.shake {
      animation: shake .36s
    }

    @keyframes shake {
      20% {
        transform: translateX(-6px)
      }

      40% {
        transform: translateX(6px)
      }

      60% {
        transform: translateX(-4px)
      }

      80% {
        transform: translateX(4px)
      }
    }

    .dmsg {
      margin-top: 12px;
      border-radius: 12px;
      padding: 12px 16px;
      background: var(--surface-2);
      line-height: 1.85;
      min-height: 4.2em
    }

    .dmsg.good {
      background: var(--ok-soft)
    }

    .dmsg.bad {
      background: var(--ng-soft)
    }

    .gobtn {
      font-family: var(--f-display);
      font-weight: 400;
      font-size: 1.8rem;
      background: var(--fire);
      color: #fff;
      border: 0;
      border-radius: 999px;
      padding: 12px 40px;
      cursor: pointer;
      animation: pulse 1s infinite;
      margin-top: 6px
    }

    @keyframes pulse {
      50% {
        transform: scale(1.06)
      }
    }

    .truck-run {
      position: absolute;
      bottom: 14px;
      left: -70%;
      width: 68%;
      animation: run 1.9s ease-in forwards
    }

    @keyframes run {
      to {
        left: 115%
      }
    }

    .flash {
      animation: flash .5s steps(2) infinite
    }

    @keyframes flash {
      50% {
        opacity: .25
      }
    }

    .result {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-start
    }

    .bigtime {
      font-family: var(--f-display);
      font-size: 3rem;
      line-height: 1.1;
      color: var(--fire);
      font-variant-numeric: tabular-nums
    }

    .stars {
      font-family: var(--f-display);
      font-size: 1.6rem;
      color: var(--signal);
      letter-spacing: .1em
    }

    /* ---------- fire game ---------- */
    .fg {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 290px;
      gap: 14px;
      align-items: start
    }

    @media (max-width:920px) {
      .fg {
        grid-template-columns: 1fr
      }
    }

    .cvwrap {
      position: relative;
      border-radius: var(--r);
      overflow: hidden;
      background: #2E3A50
    }

    .cvwrap canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16/9;
      touch-action: none;
      cursor: crosshair;
      max-width: 100%
    }

    .ftoast {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      align-items: center
    }

    .ftoast div {
      background: rgba(14, 19, 27, .86);
      color: #fff;
      font-family: var(--f-ui);
      font-size: .9rem;
      padding: 8px 14px;
      border-radius: 10px;
      max-width: 560px;
      line-height: 1.6;
      animation: tin .25s
    }

    @keyframes tin {
      from {
        opacity: 0;
        transform: translateY(-6px)
      }
    }

    .fpanel {
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-family: var(--f-ui)
    }

    .fpanel h4 {
      margin: 4px 0 0;
      font-size: .82rem;
      color: var(--muted);
      letter-spacing: .06em
    }

    .frow {
      display: flex;
      justify-content: space-between;
      align-items: baseline
    }

    .frow b {
      font-family: var(--f-display);
      font-weight: 400;
      font-size: 1.5rem;
      font-variant-numeric: tabular-nums
    }

    .meter .bar {
      height: 12px;
      border-radius: 6px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      overflow: hidden
    }

    .meter .bar i {
      display: block;
      height: 100%;
      background: var(--fire);
      transition: width .2s
    }

    .meter .bar.w i {
      background: #2E86DE
    }

    .meter small {
      font-size: .76rem;
      color: var(--muted)
    }

    .mlist {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: .88rem
    }

    .mlist li {
      display: flex;
      gap: 8px;
      align-items: center;
      line-height: 1.5
    }

    .mlist li::before {
      content: "";
      flex: 0 0 16px;
      height: 16px;
      border-radius: 4px;
      border: 2px solid var(--line)
    }

    .mlist li.ok {
      color: var(--ok);
      font-weight: 700
    }

    .mlist li.ok::before {
      background: var(--ok);
      border-color: var(--ok)
    }

    .coop {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px
    }

    .cbtn {
      border: 2px solid var(--line);
      background: var(--surface-2);
      border-radius: 12px;
      padding: 8px 10px;
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: .86rem;
      cursor: pointer;
      text-align: left;
      line-height: 1.4;
      min-height: 58px
    }

    .cbtn small {
      display: block;
      font-weight: 400;
      color: var(--muted);
      font-size: .74rem;
      margin-top: 2px
    }

    .cbtn.on {
      border-color: var(--ok);
      background: var(--ok-soft);
      cursor: default
    }

    .ctrl {
      font-size: .8rem;
      color: var(--muted);
      line-height: 1.7;
      margin: 0;
      padding-left: 1.1em
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important
      }
    }
  </style>

  <style>
    body {
      margin: 0
    }

    [hidden] {
      display: none !important
    }

    img {
      max-width: 100%
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div id="overlay" hidden></div>
  <div id="memo-root"></div>

  <script>
    (function() {
      "use strict";
      /* ================= state ================= */
      var KEY = 'kurashi-mission-v1';

      function load() {
        try {
          return JSON.parse(localStorage.getItem(KEY)) || {}

          return {}
        }

      S.prefs = Object.assign({
        ruby: true,
        big: false,
        sound: true
      }, S.prefs || {});

      function save() {
        try {
          localStorage.setItem(KEY, JSON.stringify(S))
        } catch (e) {}
      }
      /* ================= ruby (ふりがな) ================= */

        '救急車': 'きゅうきゅうしゃ',
        '救急隊': 'きゅうきゅうたい',
        '警察官': 'けいさつかん',
        '消火栓': 'しょうかせん',

        '誘導灯': 'ゆうどうとう',

        '交差点': 'こうさてん',
        '保護者': 'ほごしゃ',
        '町内会': 'ちょうないかい',
        '市役所': 'しやくしょ',
        '流山市': 'ながれやまし',

          var h = tagHTML(b, 'まとめよう') + '<p class="hint" style="margin:0">' + R('ことばをタップして、□に入れよう。□をタップすると、もどせるよ。') + '</p><p class="fill">';
          var bi = 0;
          parts.forEach(function(p, i) {
            if (i % 2 === 0) {
              h += R(p)
            } else {
              var v = st.f[bi];
              var c = 'blank' + (sel === bi ? ' sel' : '');
              if (st.done) c += (v != null && bank[v] === ans[bi] ? ' good' : ' bad');
              h += '<button type="button" class="' + c + '" data-b="' + bi + '"' + (st.done ? ' disabled' : '') + '>' + (v != null ? R(bank[v]) : '？') + '</button>';
              bi++
            }
          });
          h += '</p>';
          if (!st.done) h += '<div class="bank">' + bank.map(function(t, i) {
            return '<button type="button" class="word" data-w="' + i + '"' + (st.f.indexOf(i) >= 0 ? ' disabled' : '') + '>' + R(t) + '</button>'
          }).join('') + '</div>';
          var full = ans.every(function(a, i) {
            return st.f[i] != null
          });
          h += '<div class="acts">' + (!st.done ? '<button type="button" class="btn pri" data-a="ok"' + (full ? '' : ' disabled') + '>たしかめる</button>' : '<button type="button" class="btn" data-a="re">もういちど</button>') + '</div>';
          if (st.done) {
            var ok = ans.every(function(a, i) {
              return bank[st.f[i]] === a
            });
            h += '<div class="fb ' + (ok ? 'good' : 'try') + '"><span class="v">' + (ok ? 'よくできました！' : 'おしい！') + '</span>' + (ok ? R('ノートにも書いておこう。') : R('赤いところをもういちど考えてみよう。こたえ：') + ans.map(function(a) {
              return '「' + R(a) + '」'
            }).join(' ')) + '</div>'
          }
          w.innerHTML = h;
        }
        w.addEventListener('click', function(e) {
          var a = e.target.closest('[data-a]');
          if (a) {
            if (a.dataset.a === 'ok') {
              st.done = true;
              save();
              ans.every(function(x, i) {
                return bank[st.f[i]] === x
              }) ? sGood() : sBad()
            } else {
              st.done = false;
              st.f = [];
              save()
            }
            draw();
            return
          }
          if (st.done) return;
          var bl = e.target.closest('[data-b]');
          if (bl) {
            var i = +bl.dataset.b;
            if (st.f[i] != null) {
              st.f[i] = null;
              sel = i
            } else sel = (sel === i ? null : i);
            save();
            draw();
            return
          }
          var wd = e.target.closest('[data-w]');
          if (wd) {
            var wi = +wd.dataset.w;
            var tgt = sel != null && st.f[sel] == null ? sel : -1;
            if (tgt < 0) {
              for (var j = 0; j < ans.length; j++)
                if (st.f[j] == null) {
                  tgt = j;
                  break
                }
            }
            if (tgt >= 0) {
              st.f[tgt] = wi;
              sel = null;
              save();
              draw()
            }
          }
        });
        draw();
        return w;
      }

      function bReflect(b) {
        var w = el('section', 'blk');
        var st = S.a[b.id] || (S.a[b.id] = {
          rate: null,
          text: ''
        });
        var RT = ['よくわかった', 'だいたいわかった', 'もう少し'];
        w.innerHTML = tagHTML({
            tag: 'ふりかえり'
          }) + '<p class="bq">' + R(b.q || 'この時間の学習をふりかえろう') + '</p><div class="rates">' + RT.map(function(r, i) {

          }).join('') + '</div>' +
          '<label class="rlab" for="' + b.id + '-t">' + R('わかったこと・考えたこと・もっと知りたいこと') + '</label><textarea id="' + b.id + '-t" class="ta" rows="4" placeholder="今日の学習で、〜がわかった。〜だと思った。">' + escH(st.text) + '</textarea><span class="saved">' + R('書いたことは、この端末に自動で記録されます。') + '</span>';

          save();
          w.querySelectorAll('.rate').forEach(function(x) {
            x.setAttribute('aria-pressed', x === r)
          })
        });
        w.addEventListener('input', function(e) {
          if (e.target.tagName === 'TEXTAREA') {
            st.text = e.target.value;
            save()
          }
        });
        return w;
      }

      function bList(b) {
        var w = el('section', 'blk');
        var st = S.a[b.id] || (S.a[b.id] = {
          items: []
        });

        function draw() {
          w.innerHTML = tagHTML(b, '書こう') + '<p class="bq">' + R(b.q) + '</p>' + (st.items.length ? '<ol class="list">' + st.items.map(function(t, i) {

            }).join('') + '</ol>' : '') +
            '<div class="addrow"><input class="inp" id="' + b.id + '-in" placeholder="' + escH(b.ph || '') + '" maxlength="60"><button type="button" class="btn" data-a="add">ついか</button></div>' +
            (b.ex ? '<p class="hint" style="margin:0">' + R('れい（タップでついか）') + '</p><div class="exrow">' + b.ex.map(function(x, i) {
              return '<button type="button" class="chip" data-x="' + i + '">' + R(x) + '</button>'
            }).join('') + '</div>' : '');
        }

        function add(v) {
          v = (v || '').trim();
          if (!v) return;
          st.items.push(v);
          save();
          draw();
          var i = w.querySelector('.inp');
          if (i) i.focus()
        }
        w.addEventListener('click', function(e) {
          var d = e.target.closest('[data-d]');
          if (d) {
            st.items.splice(+d.dataset.d, 1);
            save();
            draw();
            return
          }
          var x = e.target.closest('[data-x]');
          if (x) {
            add(b.ex[+x.dataset.x]);
            return
          }
          if (e.target.closest('[data-a="add"]')) add(w.querySelector('.inp').value)
        });
        w.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' && e.target.classList.contains('inp')) {

            add(e.target.value)
          }
        });
        draw();
        return w;
      }

      }

        view = v;
        window.scrollTo(0, 0);

      }

        if (view.name === 'record') return renderRecord();

      }

        h += '<div class="confirm" id="clr"><button type="button" class="btn" data-clr="ask">きろくをすべてけす</button></div></div></div>';

      function openMemo() {
        var L = LESSONS.filter(function(x) {
          return x.id === view.id
        })[0];

      }
      document.addEventListener('click', function(e) {
        var t;
        if ((t = e.target.closest('[data-p]'))) {
          var k = t.dataset.p;

          save();
          if (k === 'sound' && S.prefs.sound) sGood();
          render();
          return
        }

          go({
            name: t.dataset.go
          });
          return
        }

          go({

            id: t.dataset.l,
            step: 0
          });
          return
        }
        if ((t = e.target.closest('[data-g]')) && t.classList.contains('gtile')) {
          openGame(t.dataset.g);
          return
        }

          cv = overlay.querySelector('#fcv');

        function resize() {
          if (!cv) return;

        function update(dt) {
          G.t += dt;
          var hasWater = G.hyd || G.tank > 0;
          var mult = 1 - (G.co.gas ? 0.4 : 0) - (G.co.elec ? 0.15 : 0);
          if (G.spray && hasWater) {
            if (!G.hyd) {
              G.tank = Math.max(0, G.tank - 8.5 * dt);
              if (G.tank <= 0) toast('タンクの水がなくなった！ 黄色い「消火栓」マークをタップして、ホースをつなごう。', 'empty')
            }
            G.fires.forEach(function(f) {
              if (f.hp > 0 && Math.hypot(f.x - G.tx, f.y - G.ty) < f.r + 26) {
                f.hp = Math.max(0, f.hp - 40 * dt);
                f.lh = G.t;
                if (Math.random() < dt * 10) G.sm.push({
                  x: f.x + (Math.random() - .5) * 30,
                  y: f.y,
                  vx: 10,
                  vy: -50,
                  l: 0,
                  m: 1.6,
                  s: 24,

                })
              }
            });
            var nz = noz();
            G.emitAcc += dt * 70;
            while (G.emitAcc > 1) {
              G.emitAcc--;
              emitWater(nz[0], nz[1], G.tx, G.ty, G.wa)
            }
          }
          if (G.co.dan) {
            var tg = null;
            G.fires.forEach(function(f) {
              if (f.hp > 0 && (!tg || f.hp > tg.hp)) tg = f
            });
            if (tg) {
              tg.hp = Math.max(0, tg.hp - 16 * dt);

            }
          }
          G.fires.forEach(function(f) {
            if (f.hp > 0 && G.t - f.lh > 0.6) f.hp = Math.min(100, f.hp + 5.5 * mult * dt);
            if (f.hp <= 0) {
              var near = G.fires.some(function(o) {
                return o !== f && o.hp > 85 && Math.hypot(o.x - f.x, o.y - f.y) < 120
              });

              }
            }

            })
          }

          if (G.t > 9 && !G.hyd) toast('ヒント：消防車の左の歩道に、黄色い「消火栓」マークがあるよ。', 'h1');
          if (G.t > 18 && !Object.keys(G.co).length) toast('ヒント：右の「協力をよびかける」ボタンも使ってみよう。', 'h2');
          if (totalFire() <= 0 && G.res === 4 && !G.over) {

            vx: (tx - x0) / T + (Math.random() - .5) * 30,
            vy: (ty - y0) / T - 0.5 * g * T + (Math.random() - .5) * 30,

        }

        function upd(a, dt) {
          for (var i = a.length - 1; i >= 0; i--) {

            p.y += p.vy * dt;
            if (p.l > p.m) a.splice(i, 1)
          }
          if (a.length > 600) a.splice(0, a.length - 600)
        }

          ctx.fillRect(x - 11, y - 14, 22, 36);
          ctx.fillStyle = '#F2C9A0';
          ctx.beginPath();
          ctx.arc(x, y - 22, 9, 0, 7);
          ctx.fill();
          ctx.fillStyle = '#1B2C5A';
          ctx.fillRect(x - 11, y - 34, 22, 8);
          ctx.strokeStyle = '#555';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(x - 10, y - 6);
          ctx.lineTo(x - 34, y - 30);
          ctx.stroke();
          ctx.fillStyle = '#E0322B';
          ctx.fillRect(x - 48, y - 44, 16, 12);
          lbl('交通規制', x, y + 60, '#fff', 12)
        }

        function drawAmb(x, y) {
          ctx.fillStyle = '#F7F7F7';
          ctx.fillRect(x, y, 160, 60);
          ctx.fillRect(x - 30, y + 16, 34, 44);
          ctx.fillStyle = '#BFE3F5';
          ctx.fillRect(x - 24, y + 20, 22, 18);
          ctx.fillStyle = '#E0322B';
          ctx.fillRect(x, y + 34, 160, 6);
          ctx.fillRect(x + 70, y + 8, 8, 22);
          ctx.fillRect(x + 63, y + 15, 22, 8);
          ctx.fillStyle = (Math.floor(G.t * 4) % 2) ? '#FF3B30' : '#7a1a14';
          ctx.fillRect(x + 10, y - 8, 30, 8);
          ctx.fillStyle = '#222';
          ctx.beginPath();
          ctx.arc(x + 10, y + 62, 12, 0, 7);
          ctx.arc(x + 130, y + 62, 12, 0, 7);
          ctx.fill();
          lbl('救急', x + 120, y + 26, '#E0322B', 14)
        }

        function drawFx() {
          var i, p, a;
          for (i = 0; i < G.sm.length; i++) {
            p = G.sm[i];
            a = (1 - p.l / p.m);
            var s = p.s + p.l * 40;
            ctx.globalAlpha = (p.c ? 0.5 : 0.32) * a;
            ctx.drawImage(p.c ? spB : spS, p.x - s / 2, p.y - s / 2, s, s)
          }
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'lighter';
          G.fires.forEach(function(f) {
            if (f.hp <= 0) return;
            var s = f.hp / 100;
            var r = f.r * 1.9 * (0.5 + s);
            ctx.globalAlpha = 0.45 * s;
            ctx.drawImage(spA, f.x - r, f.y - r * .8, r * 2, r * 2)
          });
          for (i = 0; i < G.fl.length; i++) {
            p = G.fl[i];
            a = 1 - p.l / p.m;
            var sz = p.s * (0.45 + 0.55 * a);
            ctx.globalAlpha = a;
            ctx.drawImage(p.l / p.m < 0.4 ? spA : spC, p.x - sz / 2, p.y - sz / 2, sz, sz)
          }
          for (i = 0; i < G.sp.length; i++) {
            p = G.sp[i];
            ctx.globalAlpha = 1 - p.l / p.m;
            ctx.fillStyle = '#FFE45C';
            ctx.fillRect(p.x, p.y, 3, 3)
          }
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 1;
          ctx.fillStyle = 'rgba(150,205,255,.9)';
          [G.wa, G.dw].forEach(function(arr) {
            for (var j = 0; j < arr.length; j++) {
              var w = arr[j];
              var t = Math.min(w.t, w.T);
              var x = w.x0 + w.vx * t,
                y = w.y0 + w.vy * t + 450 * t * t;
              ctx.beginPath();
              ctx.arc(x, y, 3.6, 0, 7);
              ctx.fill()
            }
          });
          if (G.spray) {
            ctx.strokeStyle = 'rgba(255,255,255,.85)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(G.tx, G.ty, 22, 0, 7);
            ctx.stroke()
          }
          if (G.spray && !G.hyd && G.tank <= 0) {
            lbl('水がない！', G.tx, G.ty - 30, '#fff', 16)
          }
        }
        var spC = null;

        function frame(now) {
          if (!running) return;
          var dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          if (!G.over || G.t < 1e9) update(dt);
          if (!spA) {
            spA = mkSprite('rgba(255,250,215,1)', 'rgba(255,175,50,.9)', 'rgba(255,90,0,0)');
            spC = mkSprite('rgba(255,190,80,.9)', 'rgba(235,70,20,.75)', 'rgba(200,30,0,0)');
            spS = mkSprite('rgba(70,70,75,.9)', 'rgba(80,80,85,.5)', 'rgba(90,90,95,0)');
            spB = mkSprite('rgba(255,255,255,.9)', 'rgba(240,245,250,.5)', 'rgba(255,255,255,0)')
          }
          ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
          drawScene();
          drawFx();
          panel();
          raf = requestAnimationFrame(frame)
        }
        var pT = 0;

        function panel() {
          pT++;
          if (pT % 6) return;
          var q = function(s) {
            return overlay.querySelector(s)
          };
          if (!q('#ftime')) return;
          q('#ftime').textContent = Math.floor(G.t) + '秒';
          var tf = totalFire() / (G.fires.length * 100);
          q('#ffire').style.width = (tf * 100) + '%';
          q('#fwater').style.width = (G.hyd ? 100 : G.tank) + '%';
          q('#fwt').textContent = G.hyd ? '消火栓からたっぷり' : '消防車のタンクの水';
          q('#m1').classList.toggle('ok', G.hyd);
          q('#m2').classList.toggle('ok', tf <= 0);
          q('#m3').classList.toggle('ok', G.res >= 2);
          q('#m4').classList.toggle('ok', G.res >= 4)
        }

        function result() {
          if (!alive) return;
          running = false;
          cancelAnimationFrame(raf);
          var tt = Math.round(G.t);
          var best = S.a['g-fire-best'];
          if (!best || tt < best) {
            S.a['g-fire-best'] = tt;
            save()
          }
          var nco = Object.keys(G.co).length;
          var stars = 1 + (nco === 5 ? 1 : 0) + (tt <= 120 ? 1 : 0);
          var WHYNOT = {
            police: '警察が交通規制をしないと、車が近づいてあぶないし、救急車も通りにくくなるよ。',
            gas: 'ガスを止めないと、火が大きくなったり、また燃え広がったりしやすいよ。',
            elec: '電気を止めないと、放水したときに感電するおそれがあるよ。',
            amb: '救急隊がいないと、けが人を病院へ運べないよ。',
            dan: '消防団は、地域の人たちでつくる消防のチーム。いっしょに消火を手伝ってくれるよ。'
          };
          sSiren(1.2);
          overlay.innerHTML = '<div class="wrap">' + gHead('消火活動ゲーム') + '<div class="mission"><div class="result"><span class="tag">ミッション クリア！</span><div class="bigtime">' + tt + '秒</div><div class="stars" aria-label="ほし' + stars + 'つ">' + '★★★'.slice(0, stars) + '<span style="opacity:.25">' + '★★★'.slice(stars) + '</span></div>' +
            '<p class="bq">' + R('火を消して、にげおくれた人を助けることができたね！') + '</p>' +
            '<div class="blk" style="width:100%;box-sizing:border-box"><span class="tag">協力してくれた人</span><ul class="mlist">' + COOP.map(function(c) {
              return '<li class="' + (G.co[c.k] ? 'ok' : '') + '">' + R(c.n + '（' + c.d + '）') + '</li>'
            }).join('') + '</ul>' +
            (nco < 5 ? '<div class="fb try"><span class="v">よばなかった人は？</span><ul>' + COOP.filter(function(c) {
              return !G.co[c.k]
            }).map(function(c) {
              return '<li>' + R(WHYNOT[c.k]) + '</li>'
            }).join('') + '</ul></div>' : '<div class="fb good"><span class="v">かんぺき！</span>' + R('みんなが協力したから、早く安全に消火できたね。') + '</div>') + '</div>' +
            '<div class="fb note" style="width:100%;box-sizing:border-box"><span class="v">考えよう</span>' + R('火事のとき、もし協力してくれる人がいなかったら、どんなことにこまるかな？') + '</div>' +
            '<div class="acts"><button type="button" class="btn pri big" id="fagain">もういちど</button><button type="button" class="btn" data-x="1">とじる</button></div></div></div></div>';
          overlay.querySelector('#fagain').addEventListener('click', start);
        }
        gameStop = function() {
          alive = false;
          running = false;
          cancelAnimationFrame(raf);
          if (ro) ro.disconnect()
        };
        intro();
      }
      /* ================= init ================= */
      (function() {
        var h = (location.hash || '').replace('#', '');
        if (/^l[1-8]$/.test(h)) view = {
          name: 'lesson',
          id: h,
          step: 0
        };
        else if (h === 'record') view = {
          name: 'record'
        }
      })();
      render();
    })();
  </script>

</body>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050913">
<title>歴史カードクエスト 第8章 江戸時代①｜むん先生の学習クエスト</title>
<!--
==========================================================================
  むん先生の 歴史カードクエスト  第8章「江戸時代①」
--------------------------------------------------------------------------
  ■ ファイルの構成
    [A] 時代データ … この時代だけの内容（ステージ・カード・CPU）
                     → 次の時代のアプリでは、ここだけを書きかえる
    [B] 共通コア   … 全時代アプリで同じ（連携・クイズ・デッキ・バトル・画面）
                     → 直したときは、全時代のアプリに同じものをコピーする

  ■ 時代アプリどうしの連携のしくみ
    ・記録はブラウザの localStorage「munRekishi.v1」1か所に保存（全時代共通）
    ・同じドメイン（例：munmungstudymax.com）の下に置いたアプリどうしで、
      カード・デッキ・学習記録・バトル記録が自動で共有される
        例）/rekishi/kodai/index.html と /rekishi/akebono/index.html → 共有される
            サブドメインや別ドメイン（kids.〜 / 〜.github.io）→ 共有されない
    ・カードを手に入れると、そのカードのデータ（性能・問題・豆知識）も保存される
      → ほかの時代のアプリでも、デッキに入れて戦える・クイズに出る
    ・アプリをひらくと「どの時代のアプリがどこにあるか」を登録する
      → 「時代をつなぐ」画面から、ほかの時代のアプリへ移動できる
    ・記録は端末の外へは送信しない（引き継ぎコードなし）
    ・サイトの既存データ（コイン・レベルなど別のキー）にはさわらない

  ■ 次の時代のアプリの作り方
    1. このファイルをコピーする
    2. [A] の ERA を書きかえる
       ・id は下の SERIES の id を使う（例：'akebono'）
       ・カードの id は「時代id-番号」（例：'akebono-01'）。一度決めたら変えない
       ・効果(fx)は共通コアにある種類だけを使う（下の FX一覧）
    3. [B] は変更しない
    4. このアプリと同じドメインの下に置く
==========================================================================
-->
<style>
:root{--bg:#050913;--panel:rgba(10,20,46,.9);--panel2:rgba(16,30,66,.94);--line:rgba(0,229,255,.32);--cyan:#00e5ff;--pink:#ff3df2;--gold:#ffd54a;--green:#3dffa8;--red:#ff4d6d;--text:#e9f5ff;--sub:#8fb3d9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background-color:var(--bg);background-image:radial-gradient(ellipse at 15% -10%,rgba(0,229,255,.2),transparent 50%),radial-gradient(ellipse at 100% 110%,rgba(255,61,242,.16),transparent 50%),linear-gradient(rgba(0,229,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.05) 1px,transparent 1px);background-size:auto,auto,34px 34px,34px 34px;background-attachment:fixed;color:var(--text);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Meiryo",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
a{color:inherit;text-decoration:none}
#app{max-width:1000px;margin:0 auto;padding:0 12px 28px}
h3.h{margin:0 0 10px;font-size:17px;color:#7ff6ff}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 2px;background:linear-gradient(var(--bg) 72%,transparent)}
.back{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:20px;color:var(--cyan);flex:none}
.top h2{margin:0;font-size:20px;flex:1;text-shadow:0 0 10px rgba(0,229,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:14px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel);white-space:nowrap;font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:inset 0 0 18px rgba(0,229,255,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:10px 22px;border-radius:14px;font-weight:900;font-size:18px;background:linear-gradient(135deg,#00b8d4,#0062ff);box-shadow:0 0 16px rgba(0,229,255,.45);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn.pink{background:linear-gradient(135deg,#ff3df2,#7b2bff);box-shadow:0 0 16px rgba(255,61,242,.45)}
.btn.gold{background:linear-gradient(135deg,#ffd54a,#ff8a00);color:#2a1300;box-shadow:0 0 14px rgba(255,190,60,.5)}
.btn.ghost{background:var(--panel);box-shadow:none;border:1px solid var(--line);color:var(--cyan)}
.btn.sm{min-height:46px;font-size:15px;padding:6px 14px;border-radius:12px}
.btn:disabled{filter:grayscale(1) brightness(.55);box-shadow:none;cursor:default}
.btn:active:not(:disabled),.mbtn:active,.stile:active,.choice:active{transform:scale(.97)}
.sub{color:var(--sub)}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.mt{margin-top:14px}
.warnbox{border-color:var(--gold);color:#ffe9a8;font-size:14px;line-height:1.6}
/* ---------- ホーム ---------- */
.hero{text-align:center;padding:24px 10px 6px}
.hero .series{font-size:14px;color:var(--sub);letter-spacing:.2em}
.hero .chap{display:inline-block;margin-top:10px;font-size:12px;font-weight:900;letter-spacing:.3em;color:var(--pink);border:1px solid var(--pink);padding:3px 12px;border-radius:4px;text-shadow:0 0 8px var(--pink)}
.hero h1{margin:8px 0 4px;font-size:clamp(34px,7vw,54px);letter-spacing:.08em;background:linear-gradient(90deg,#7ff6ff,#fff,#ff9df8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(0,229,255,.5))}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--cyan)}
.stat span{font-size:12px;color:var(--sub)}
.menu-main{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu-sub{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.mbtn{min-height:104px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:900;font-size:17px;padding:8px}
.mbtn i{font-style:normal;font-size:36px;line-height:1.1}
.mbtn small{font-weight:400;font-size:12px;color:var(--sub)}
.mbtn.big{min-height:130px;font-size:22px;flex-direction:row;gap:14px;background:linear-gradient(135deg,rgba(0,184,212,.35),rgba(0,98,255,.25));border-color:var(--cyan);box-shadow:0 0 18px rgba(0,229,255,.3)}
.mbtn.big.b2{background:linear-gradient(135deg,rgba(255,61,242,.32),rgba(123,43,255,.28));border-color:var(--pink);box-shadow:0 0 18px rgba(255,61,242,.3)}
.mbtn.big i{font-size:48px}
.mbtn.big small{font-size:13px;display:block;margin-top:4px}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}.menu-main{grid-template-columns:1fr}.menu-sub{grid-template-columns:repeat(2,1fr)}}
/* ---------- ステージ ---------- */
.stage-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.stile{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);min-height:96px;width:100%}
.stile .ic{font-size:40px;width:56px;text-align:center;flex:none}
.stile .f1{flex:1;min-width:0}
.stile .no{font-size:12px;color:var(--pink);font-weight:900;letter-spacing:.15em}
.stile .tt{font-weight:900;font-size:18px}
.stile.boss{border-color:var(--pink);box-shadow:0 0 16px rgba(255,61,242,.25);background:linear-gradient(135deg,rgba(255,61,242,.16),rgba(10,20,46,.9))}
.stile.lock{opacity:.5}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width .4s}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;font-weight:900;vertical-align:middle}
.b-clear{background:rgba(61,255,168,.15);color:var(--green);border:1px solid var(--green)}
.b-perfect{background:rgba(255,213,74,.15);color:var(--gold);border:1px solid var(--gold)}
.points{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.points li{background:rgba(5,12,30,.6);border:1px solid var(--line);border-left:4px solid var(--cyan);border-radius:10px;padding:12px 14px;font-size:17px;line-height:1.8}
.points b{color:#7ff6ff}
.cardrow,.cardgrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
/* ---------- クイズ ---------- */
.qhead{display:flex;align-items:center;gap:10px}
.qhead .bar{flex:1;margin:0}
.qbox{margin-top:12px;font-size:21px;font-weight:900;line-height:1.6;padding:20px;min-height:96px;display:flex;align-items:center}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.choices.long{grid-template-columns:1fr}
.choice{min-height:64px;padding:12px 16px;border-radius:14px;background:var(--panel2);border:2px solid var(--line);font-size:19px;font-weight:900;text-align:left;line-height:1.45;display:flex;align-items:center}
.choices.long .choice{font-size:16px;font-weight:700}
.choice .k{display:inline-block;flex:none;width:1.8em;color:var(--cyan);font-weight:900}
.choice.ok{border-color:var(--green);background:rgba(61,255,168,.2)}
.choice.ng{border-color:var(--red);background:rgba(255,77,109,.2)}
.choice.dim{opacity:.4}
.fb{margin-top:14px;display:flex;gap:14px;align-items:flex-start}
.fb .f1{flex:1;min-width:0}
.fb .msg{font-size:24px;font-weight:900}
.fb.okk{border-color:var(--green)}.fb.okk .msg{color:var(--green)}
.fb.ngg{border-color:var(--red)}.fb.ngg .msg{color:var(--red)}
.ans{color:#7ff6ff}
.get{margin-top:6px;font-weight:900;color:var(--gold);text-shadow:0 0 8px rgba(255,213,74,.6)}
.trivia{background:rgba(255,213,74,.07);border:1px solid rgba(255,213,74,.5);border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.75}
.trivia h4{margin:0 0 4px;color:var(--gold);font-size:14px}
.bosshead{display:flex;align-items:center;gap:14px}
.bossic{font-size:56px;filter:drop-shadow(0 0 14px var(--pink))}
.bosshead .f1{flex:1}
.bosshead .bar{height:14px}
.bosshead .bar>div{background:linear-gradient(90deg,#ff4d6d,#ff3df2)}
.hearts{font-size:22px;letter-spacing:2px}
.rtitle{font-size:30px;font-weight:900;text-shadow:0 0 14px var(--cyan)}
.score{font-size:64px;font-weight:900;color:var(--cyan);text-shadow:0 0 18px var(--cyan)}
.score small{font-size:26px;color:var(--sub)}
@media(max-width:620px){.choices{grid-template-columns:1fr}.fb{flex-direction:column;align-items:center}}
/* ---------- カード ---------- */
.card{--cw:112px;--tc:#b07bff;--tg:rgba(176,123,255,.5);position:relative;width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.09);border:2px solid var(--tc);background:linear-gradient(165deg,#17295c 0%,#0a1230 55%,#050915 100%);box-shadow:0 0 10px var(--tg),inset 0 0 14px rgba(0,0,0,.7);font-size:calc(var(--cw)*.12);display:flex;flex-direction:column;align-items:center;overflow:hidden;flex:none;line-height:1.2;text-align:center;transition:transform .15s}
.card.xs{--cw:58px}.card.sm{--cw:80px}.card.md{--cw:116px}.card.lg{--cw:min(230px,58vw)}
.t-person{--tc:#ff7a45;--tg:rgba(255,122,69,.5)}
.t-heritage{--tc:#2fa8ff;--tg:rgba(47,168,255,.5)}
.t-culture{--tc:#b07bff;--tg:rgba(176,123,255,.5)}
.c-cost{position:absolute;top:.3em;left:.3em;width:1.75em;height:1.75em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8ff8ff,#0090b8);color:#001018;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 0 6px #00e5ff;font-size:1.05em;z-index:2}
.c-rar{position:absolute;top:.4em;right:.35em;font-size:.68em;font-weight:900;padding:.05em .35em;border-radius:.3em;background:rgba(0,0,0,.55);border:1px solid currentColor;z-index:2}
.r-N .c-rar{color:#9fb3c8}.r-R .c-rar{color:#00e5ff}.r-SR .c-rar{color:#ffd54a}.r-LR .c-rar{color:#ff8af5}
.c-icon{font-size:2.9em;margin-top:.62em;line-height:1.15;filter:drop-shadow(0 0 6px var(--tg))}
.c-name{font-weight:900;font-size:.96em;padding:0 .3em;margin-top:.12em;height:2.45em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.c-type{font-size:.66em;padding:.08em .7em;border-radius:1em;background:var(--tc);color:#050915;font-weight:900;margin-top:.1em}
.c-stats{position:absolute;bottom:.3em;left:.35em;right:.35em;display:flex;justify-content:space-between;font-weight:900;font-size:1.02em}
.c-atk{color:#ffb38a}.c-hp{color:#7dffb5}.c-hp.low{color:#ff4d6d}.c-atk.up{color:#ffd54a}
.c-fx{position:absolute;bottom:.35em;left:.35em;right:.35em;font-size:.62em;color:#dccfff;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
.card.xs .c-fx,.card.sm .c-fx,.card.f .c-fx,.card.h .c-fx{display:none}
.c-star{position:absolute;bottom:1.7em;left:0;right:0;font-size:.62em;color:var(--gold);letter-spacing:.05em}
.t-culture .c-star{bottom:.5em}
.card.md.t-culture .c-star,.card.lg.t-culture .c-star{bottom:auto;top:2.25em}
.c-badge{position:absolute;top:.35em;left:50%;transform:translateX(-50%);padding:.12em .55em;border-radius:1em;font-size:.66em;font-weight:900;background:var(--pink);color:#fff;box-shadow:0 0 10px var(--pink);z-index:3;white-space:nowrap;animation:badge 1.2s ease-in-out infinite alternate}
.c-badge.in{background:var(--green);color:#002a18;box-shadow:0 0 10px var(--green)}
.c-sleep{position:absolute;top:1.9em;right:.25em;font-size:1em;z-index:2}
.r-SR{box-shadow:0 0 14px rgba(255,213,74,.55),inset 0 0 14px rgba(0,0,0,.7)}
.r-SR::after,.r-LR::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.18) 45%,transparent 55%);background-size:250% 100%;animation:shine 3.2s linear infinite;pointer-events:none}
.r-LR{border-color:transparent;background:linear-gradient(165deg,#17295c 0%,#0a1230 55%,#050915 100%) padding-box,linear-gradient(90deg,#ff3df2,#00e5ff,#ffd54a,#3dffa8,#ff3df2) border-box;background-size:100% 100%,300% 100%;animation:lr 3s linear infinite;box-shadow:0 0 16px rgba(255,61,242,.5),inset 0 0 14px rgba(0,0,0,.7)}
.card.locked{--tc:#24365a;--tg:transparent;background:#08101f;box-shadow:none;animation:none}
.card.locked::after{display:none}
.card.locked .c-icon,.card.locked .c-name{color:#3a5480}
.card.locked .c-cost{background:#1b2a47;color:#5b77a6;box-shadow:none}
.card.locked .c-type{background:#1b2a47;color:#5b77a6}
.card.ghost{opacity:.55}
.card.indeck{outline:3px solid var(--green);outline-offset:2px}
.cardgrid .card,.cardrow .card{cursor:pointer}
.flip{animation:flipIn .7s both}
/* ---------- 図鑑・デッキ ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.tab{padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);white-space:nowrap;font-weight:900;font-size:15px;color:var(--sub)}
.tab.on{background:linear-gradient(135deg,#00b8d4,#0062ff);color:#fff;border-color:transparent;box-shadow:0 0 12px rgba(0,229,255,.4)}
.erah{margin:16px 0 8px;font-weight:900;color:#7ff6ff;font-size:15px;border-bottom:1px solid var(--line);padding-bottom:4px}
.deckbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.deckbar .cnt{font-size:28px;font-weight:900;color:var(--cyan)}
.deckbar .cnt.ng{color:var(--gold)}
.tpill{font-size:13px;padding:3px 10px;border-radius:10px;font-weight:900}
.tp-person{background:rgba(255,122,69,.2);color:#ffb38a}.tp-heritage{background:rgba(47,168,255,.2);color:#8fd0ff}.tp-culture{background:rgba(176,123,255,.2);color:#d6bdff}
/* ---------- バトル選択・連携 ---------- */
.cpu-list{display:grid;gap:12px}
.cpu-tile{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:left;width:100%}
.cpu-tile .ic{font-size:50px;width:64px;text-align:center;flex:none}
.cpu-tile .f1{flex:1;min-width:0}
.cpu-tile .nm{font-size:20px;font-weight:900}
.cpu-tile .lv{color:var(--gold);font-size:14px}
.cpu-tile.lock{opacity:.5}
.cpu-tile .rw{text-align:center;font-size:11px;color:var(--sub)}
.linkrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:rgba(5,12,30,.6);border:1px solid var(--line);margin-top:8px}
.linkrow .ic{font-size:32px}
.linkrow .f1{flex:1;min-width:0}
.srow{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px dashed rgba(0,229,255,.15);font-size:15px;color:var(--sub)}
.srow span{width:4.5em;flex:none;font-weight:900}
.srow em{margin-left:auto;font-style:normal;font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid #3a5480}
.srow.on{color:var(--text)}
.srow.on em{border-color:var(--green);color:var(--green)}
.info-list{margin:0;padding-left:1.2em;line-height:1.8;font-size:15px}
/* ---------- バトル ---------- */
.bt{--fw:clamp(72px,12.6vh,108px);--hw:clamp(64px,10.6vh,90px);display:flex;flex-direction:column;gap:6px;max-width:760px;margin:0 auto;padding-top:8px}
.card.f{--cw:var(--fw)}.card.h{--cw:var(--hw)}
.bt-top{display:flex;align-items:center;gap:8px}
.bt-top .back{width:40px;height:40px}
.turnlbl{margin-left:auto;font-weight:900;font-size:15px;padding:6px 14px;border-radius:20px}
.turnlbl.me{background:rgba(0,229,255,.18);color:#7ff6ff;border:1px solid var(--cyan)}
.turnlbl.cpu{background:rgba(255,61,242,.16);color:#ff9df8;border:1px solid var(--pink)}
.sidebar{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);flex-wrap:wrap}
.sidebar.cpu{border-color:rgba(255,61,242,.45)}
.sidebar .who{font-weight:900;white-space:nowrap;font-size:15px}
.lifebox{flex:1;min-width:110px}
.lifebox .num{font-weight:900;font-size:15px}
.lifebar{height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:2px}
.lifebar>div{height:100%;background:linear-gradient(90deg,#ff4d6d,#ff3df2);transition:width .4s}
.me .lifebar>div{background:linear-gradient(90deg,#3dffa8,#00e5ff)}
.mini{font-size:13px;color:var(--sub);white-space:nowrap}
.cp{font-weight:900;color:#7ff6ff;white-space:nowrap;font-size:18px;text-shadow:0 0 8px var(--cyan)}
.cp small{font-size:13px;color:var(--sub)}
.field{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;justify-items:center;padding:8px;border-radius:14px;border:1px dashed rgba(0,229,255,.22);background:rgba(0,10,30,.35)}
.field.cpu{border-color:rgba(255,61,242,.25)}
.lane{width:var(--fw);height:calc(var(--fw)*1.4);border-radius:10px;border:2px dashed rgba(0,229,255,.18);display:flex;align-items:center;justify-content:center;color:#7ff6ff;font-size:13px;font-weight:900;padding:4px}
.field.cpu .lane{border-color:rgba(255,61,242,.15)}
.lane.can{border-color:var(--cyan);background:rgba(0,229,255,.14);animation:pulse 1s infinite}
.msgbar{text-align:center;font-weight:900;font-size:16px;min-height:24px;text-shadow:0 0 8px var(--cyan)}

/* ---------- 保存（全時代共通） ---------- */
const Store = (() => {
  let mem = null, usable = true;
  try { const k = STORE_KEY + '.test'; localStorage.setItem(k, '1'); localStorage.removeItem(k); } catch (e) { usable = false; }
  const blank = () => ({ schema: 1, createdAt: Date.now(), updatedAt: 0, owned: {}, defs: {},
    decks: [{ name: 'デッキ1', cards: [] }, { name: 'デッキ2', cards: [] }, { name: 'デッキ3', cards: [] }],
    activeDeck: 0, eras: {}, battle: {}, apps: {}, stats: { answered: 0, correct: 0 }, settings: { furi: true } });
  function fix(d) {
    const b = blank();
    for (const k in b) if (d[k] === undefined || d[k] === null) d[k] = b[k];
    if (!Array.isArray(d.decks)) d.decks = b.decks;
    while (d.decks.length < 3) d.decks.push({ name: 'デッキ' + (d.decks.length + 1), cards: [] });
    d.decks.forEach(dk => { if (!Array.isArray(dk.cards)) dk.cards = []; });
    if (typeof d.activeDeck !== 'number' || !d.decks[d.activeDeck]) d.activeDeck = 0;
    return d;
  }
  function read() {
    if (!usable) return mem || (mem = blank());
    let raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) { usable = false; return mem || (mem = blank()); }
    if (!raw) return blank();
    try { return fix(JSON.parse(raw)); }
    catch (e) {
      // こわれたデータは別名で残してから、新しく始める（元データは消さない）
      const b = blank();
      try { localStorage.setItem(STORE_KEY + '.broken-' + Date.now(), raw); localStorage.setItem(STORE_KEY, JSON.stringify(b)); } catch (_) {}
      return b;
    }
  }
  function write(d) {
    d.updatedAt = Date.now();
    if (usable) { try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); return; } catch (e) { usable = false; } }
    mem = d;
  }
  return {
    get: read,
    update(fn) { const d = read(); fn(d); write(d); return d; },   // いつも最新を読んでから書く（別のタブとぶつからない）
    usable: () => usable,
    size: () => { try { return (localStorage.getItem(STORE_KEY) || '').length; } catch (e) { return 0; } }
  };
})();

function registerEra() {
  Store.update(d => {
    d.apps[ERA.id] = { id: ERA.id, title: ERA.title, ch: ERA.chapter, icon: ERA.icon, url: location.href.split(/[?#]/)[0],
                       total: ERA_CARDS.length, stages: ERA.stages.length, v: ERA.version, core: CORE_VERSION, seen: Date.now() };
    if (!d.eras[ERA.id]) d.eras[ERA.id] = { stages: {}, boss: {} };
    ERA_CARDS.forEach(c => { if (d.owned[c.id]) d.defs[c.id] = packDef(c); });   // 持っているカードのデータを最新に
  });
}
const defOf = (id, d) => ERA_MAP[id] || (d || Store.get()).defs[id] || null;
const starOf = ok => ok >= 6 ? 3 : ok >= 3 ? 2 : 1;
const nextStarAt = ok => ok < 3 ? 3 : ok < 6 ? 6 : null;
function eraRec(d) { if (!d.eras[ERA.id]) d.eras[ERA.id] = { stages: {}, boss: {} }; const r = d.eras[ERA.id]; r.stages = r.stages || {}; r.boss = r.boss || {}; return r; }
function deckIds(d, slot) { const s = slot == null ? d.activeDeck : slot; return ((d.decks[s] || {}).cards || []).filter(id => d.owned[id] && defOf(id, d)); }
function allKnownDefs(d) { const m = Object.assign({}, d.defs); ERA_CARDS.forEach(c => { m[c.id] = c; }); return Object.values(m).filter(x => x && x.name); }
function eraOrder(e, d) { const a = d.apps[e]; if (a && a.ch) return a.ch; const s = SERIES.find(x => x.id === e); return s ? s.ch : 99; }
function eraTitle(e, d) { const a = d.apps[e]; if (a && a.title) return a.title; const s = SERIES.find(x => x.id === e); return s ? s.title : e; }
function unitStats(def, star) { let atk = def.atk || 0, hp = def.hp || 0; if (def.type !== 'culture' && star) { hp += star - 1; if (def.type === 'person' && star >= 3) atk += 1; } return { atk, hp }; }

function recordAnswer(def, ok, opt) {
  opt = opt || {};
  let isNew = false, starUp = false;
  Store.update(d => {
    d.stats.answered = (d.stats.answered || 0) + 1;
    if (!ok) return;
    d.stats.correct = (d.stats.correct || 0) + 1;
    const o = d.owned[def.id];
    if (o) { const before = starOf(o.ok || 1); o.ok = (o.ok || 1) + 1; if (starOf(o.ok) > before) starUp = true; }
    else if (opt.acquire) { d.owned[def.id] = { at: Date.now(), ok: 1, era: def.era }; isNew = true; }
    if (def.era === ERA.id && d.owned[def.id]) d.defs[def.id] = packDef(def);
  });
  return { isNew, starUp };
}
function grantCard(id) {
  Store.update(d => { if (!d.owned[id]) { d.owned[id] = { at: Date.now(), ok: 1, era: ERA.id }; d.defs[id] = packDef(ERA_MAP[id]); } });
}

/* ---------- 効果の文 ---------- */
function fxLines(def) {
  const L = [], unit = def.type !== 'culture', pre = unit ? '出《だ》したとき：' : '';
  (def.fx || []).forEach(f => {
    const n = f.n;
    switch (f.t) {
      case 'draw': L.push(`${pre}カードを${n}枚《まい》引《ひ》く`); break;
      case 'cp': L.push(`${pre}このターン💠+${n}`); break;
      case 'heal': L.push(`${pre}自分《じぶん》のライフ+${n}`); break;
      case 'dmg': L.push(`${pre}相手《あいて》のいちばん強《つよ》いカードに${n}ダメージ（いなければ相手《あいて》ライフに）`); break;
      case 'dmgAll': L.push(`${pre}相手《あいて》の場《ば》のカードぜんぶに${n}ダメージ`); break;
      case 'direct': L.push(`${pre}相手《あいて》のライフに${n}ダメージ`); break;
      case 'buffAtk': L.push(`${pre}味方《みかた》の人物《じんぶつ》ぜんぶ こうげき+${n}`); break;
      case 'buffHp': L.push(`${pre}味方《みかた》の場《ば》のカードぜんぶ たいりょく+${n}`); break;
      case 'auraAtk': L.push(`【場《ば》にいる間《あいだ》】味方《みかた》の人物《じんぶつ》 こうげき+${n}`); break;
      case 'regen': L.push(`【毎《まい》ターン】自分《じぶん》のライフ+${n}`); break;
      case 'cpTurn': L.push(`【毎《まい》ターン】💠+${n}`); break;
      case 'rush': L.push('【速攻《そっこう》】出《だ》したターンからこうげきできる'); break;
      case 'pierce': L.push('【貫通《かんつう》】たおしたあまりのダメージを相手《あいて》ライフに'); break;
      default: L.push('（このアプリでは使《つか》えない効果《こうか》）');
    }
  });
  if (!L.length) L.push(def.type === 'heritage' && !def.atk ? 'こうげきはしないが、正面《しょうめん》の相手《あいて》をくいとめる' : '特別《とくべつ》な効果《こうか》なし');
  return L;
}
const hasFx = (def, t) => (def.fx || []).some(f => f.t === t);

/* ---------- カードの見た目 ---------- */
function cardHTML(def, o) {
  o = o || {};
  if (!def) return '';
  const size = o.size || 'md';
  const act = o.act ? ` data-act="${o.act}" data-arg="${esc(o.arg != null ? o.arg : def.id)}"` : '';
  const uid = o.uid ? ` data-uid="${o.uid}"` : '';
  const style = o.style ? ` style="${o.style}"` : '';
  const cls = `card ${size} t-${esc(def.type)} r-${esc(def.rarity)} ${o.cls || ''}`;
  if (o.locked) return `<div class="${cls} locked"${act}${uid}${style}><div class="c-cost">?</div><div class="c-icon">？</div><div class="c-name">？？？</div><div class="c-type">${TYPE_LABEL[def.type] || ''}</div></div>`;
  const unit = def.type !== 'culture', star = o.star || 0;
  let atk, hp, hpCls = '', atkCls = '';
  if (o.inst) { atk = o.atk != null ? o.atk : o.inst.atk; hp = o.inst.hp; if (o.inst.hp < o.inst.maxHp) hpCls = ' low'; if (atk > o.inst.atk) atkCls = ' up'; }
  else { const s = unitStats(def, star); atk = s.atk; hp = s.hp; }
  return `<div class="${cls}"${act}${uid}${style}>
    <div class="c-cost">${esc(def.cost)}</div><div class="c-rar">${esc(def.rarity)}</div>
    <div class="c-icon">${esc(def.icon || '❔')}</div>
    <div class="c-name">${esc(def.name)}</div>
    <div class="c-type">${TYPE_LABEL[def.type] || ''}</div>
    ${unit ? `<div class="c-stats"><span class="c-atk${atkCls}">⚔${atk}</span><span class="c-hp${hpCls}">❤${hp}</span></div>` : `<div class="c-fx">${esc(fxLines(def)[0])}</div>`}
    ${star ? `<div class="c-star">${'★'.repeat(star)}${'☆'.repeat(3 - star)}</div>` : ''}
    ${o.badge ? `<div class="c-badge ${o.badgeCls || ''}">${o.badge}</div>` : ''}
    ${o.sleep ? '<div class="c-sleep">💤</div>' : ''}
  </div>`;
}

function storageWarn() {

function howToGet(def) {

    if (ERA.boss.reward === def.id) return `${ERA.stages.length}つのステージをクリアして、ボス「${ERA.boss.title}」に勝《か》つと手《て》に入《はい》る。`;

  }

}

/* ---------- 問題づくり ---------- */
function makeQ(def, mode, pool) {
  if (mode === 'rev' && def.desc) {
    const others = shuffle(pool.filter(x => x.id !== def.id && x.desc && x.desc !== def.desc)).slice(0, 3).map(x => x.desc);
    if (others.length === 3) return { def, mode: 'rev', text: `「${def.name}」の説明《せつめい》として正《ただ》しいものは？`, choices: shuffle([def.desc].concat(others)), answer: def.desc };
  }
  const ans = def.a || def.name;
  let wrong = (def.wrong || []).filter(w => w !== ans).slice(0, 3);
  if (wrong.length < 3) wrong = wrong.concat(shuffle(pool.filter(x => x.id !== def.id && x.name !== ans && !wrong.includes(x.name)).map(x => x.name)).slice(0, 3 - wrong.length));
  return { def, mode: 'fwd', text: def.q || `「${def.desc}」にあてはまるものは？`, choices: shuffle([ans].concat(wrong)), answer: ans };
}

function startBoss() {

function answerQ(i) {
  if (!Q || Q.answered) return;
  const q = Q.list[Q.i], ok = q.choices[i] === q.answer;
  const r = recordAnswer(q.def, ok, { acquire: true });
  Q.answered = { idx: i, ok, isNew: r.isNew, starUp: r.starUp };
  if (ok) Q.correct++;
  if (r.isNew) Q.news.push(q.def.id);
  if (r.starUp) Q.ups.push(q.def.id);
  if (Q.kind === 'boss') { if (ok) Q.bossHp--; else Q.hearts--; }
  render();
  const fbEl = $app.querySelector('.fb');
  if (fbEl && fbEl.scrollIntoView) fbEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function nextQ() {
  if (!Q || !Q.answered) return;
  if (Q.kind === 'boss') {
    if (Q.bossHp <= 0 || Q.hearts <= 0) return finishQuiz();
    Q.list.push(nextBossQ());
  }
  Q.i++; Q.answered = null;
  if (Q.i >= Q.list.length) return finishQuiz();
  render(); window.scrollTo(0, 0);
}
function finishQuiz() {
  if (Q.kind === 'stage') {
    const total = Q.list.length, sc = Q.correct, clear = sc / total >= 0.7, perfect = sc === total;
    Store.update(d => {
      const er = eraRec(d), o = er.stages[Q.sid] || (er.stages[Q.sid] = { best: 0, total, clear: false, perfect: false, plays: 0 });
      o.plays = (o.plays || 0) + 1; o.total = total; o.best = Math.max(o.best || 0, sc);
      if (clear) o.clear = true; if (perfect) o.perfect = true; o.last = Date.now();
    });
    Q.result = { sc, total, clear, perfect };
  } else {
    const win = Q.bossHp <= 0; let reward = null;
    Store.update(d => { const b = eraRec(d).boss; b.plays = (b.plays || 0) + 1; if (win) { b.clear = true; b.wins = (b.wins || 0) + 1; } });
    if (win && !Store.get().owned[ERA.boss.reward]) { grantCard(ERA.boss.reward); reward = ERA.boss.reward; }
    Q.result = { win, reward, sc: Q.correct };
  }
  go('result');
}

SCREENS.deck = () => {

  if (S.deckSlot == null || !d.decks[S.deckSlot]) S.deckSlot = d.activeDeck;
  const slot = S.deckSlot, ids = deckIds(d, slot), set = new Set(ids);
  const cnt = { person: 0, heritage: 0, culture: 0 }; let costSum = 0;
  ids.forEach(id => { const c = defOf(id, d); cnt[c.type] = (cnt[c.type] || 0) + 1; costSum += c.cost; });

// おまかせ：人物7・遺産3・文化5を目安に、強いカードを選びつつ、軽いカード（コスト2以下）も4枚以上入れる
function autoDeck(slot) {
  Store.update(d => {
    const owned = Object.keys(d.owned).map(id => defOf(id, d)).filter(Boolean);
    const scm = {};
    owned.forEach(c => { scm[c.id] = RAR_ORDER[c.rarity] * 2 + starOf(d.owned[c.id].ok) * 1.5 + Math.random() * 1.5 - (c.cost >= 5 ? 1 : 0); });
    const by = t => owned.filter(c => c.type === t).sort((a, b) => scm[b.id] - scm[a.id]);
    const pools = { person: by('person'), heritage: by('heritage'), culture: by('culture') };
    const want = { person: 7, heritage: 3, culture: 5 };
    let pick = [];
    for (const t in want) pick = pick.concat(pools[t].slice(0, want[t]));
    const rest = owned.filter(c => !pick.includes(c)).sort((a, b) => scm[b.id] - scm[a.id]);
    while (pick.length < DECK_MAX && rest.length) pick.push(rest.shift());
    const cheap = () => pick.filter(c => c.cost <= 2).length;
    const cheapRest = rest.filter(c => c.cost <= 2);
    while (cheap() < 4 && cheapRest.length) {
      const heavy = pick.filter(c => c.cost >= 3).sort((a, b) => scm[a.id] - scm[b.id])[0];
      if (!heavy) break;
      pick[pick.indexOf(heavy)] = cheapRest.shift();
    }
    d.decks[slot].cards = pick.slice(0, DECK_MAX).map(c => c.id);
  });
}

/* ======================================================================
   バトル
   ====================================================================== */
let UID = 0;
function inst(def, star) { const s = unitStats(def, star); return { uid: ++UID, def, star, atk: s.atk, hp: s.hp, maxHp: s.hp, buff: 0, sleep: true }; }
function newSide(name, icon, life, deck) { return { name, icon, life, maxLife: life, cp: 0, maxCp: 0, deck, hand: [], field: [null, null, null], discard: [], turns: 0, quiz: false }; }
const opp = k => k === 'p' ? 'c' : 'p';
const alive = () => B && !B.finished && !B.aborted && !B.winner;
const sideName = k => k === 'p' ? 'あなた' : B.c.name;

function buildCpuDeck(cpu) {
  const pool = STAGE_CARDS.filter(c => cpu.rarity.includes(c.rarity));
  const units = shuffle(pool.filter(c => c.type !== 'culture')), cults = shuffle(pool.filter(c => c.type === 'culture'));
  const nu = Math.min(units.length, Math.round(cpu.size * 0.6));
  let deck = units.slice(0, nu).concat(cults.slice(0, cpu.size - nu));
  if (deck.length < cpu.size) deck = deck.concat(units.slice(nu)).slice(0, cpu.size);
  return deck;
}
function startBattle(cpuId) {
  const d = Store.get(), cpu = ERA.cpu.find(c => c.id === cpuId), ids = deckIds(d);
  if (!cpu) return;
  if (ids.length < DECK_MIN) return toast(`デッキを${DECK_MIN}枚《まい》以上《いじょう》にしよう`);
  if (B) B.aborted = true;
  const pDeck = shuffle(ids.map(id => inst(defOf(id, d), starOf(d.owned[id].ok))));
  const cDeck = shuffle(buildCpuDeck(cpu).map(def => inst(def, cpu.star || 1)));
  B = { cpu, deckIds: ids, p: newSide('あなた', '🎓', START_LIFE, pDeck), c: newSide(cpu.name, cpu.icon, cpu.life, cDeck),
        turn: null, sel: null, busy: true, msg: '', total: 0, first: Math.random() < 0.5 ? 'p' : 'c', flash: null };
  for (let i = 0; i < 4; i++) { draw('p', true); draw('c', true); }
  draw(opp(B.first), true);   // 後攻は1枚多く
  go('battle');
  const me = B;
  (async () => {
    say(B.first === 'p' ? '⚔️ バトル開始《かいし》！ あなたの先攻《せんこう》！' : `⚔️ バトル開始《かいし》！ ${cpu.name}の先攻《せんこう》！`); render();
    await sleep(1200);
    if (B === me && alive()) startTurn(B.first);
  })();
}
function say(m) { if (B) B.msg = m; }
function draw(k, silent) {
  const s = B[k];
  if (!s.deck.length) {
    if (!s.discard.length) return;
    s.deck = shuffle(s.discard); s.discard = [];
    if (!silent) say(`${sideName(k)}の捨《す》て札《ふだ》を山《やま》札《ふだ》にもどした`);
  }
  const c = s.deck.pop();
  if (s.hand.length >= HAND_MAX) { s.discard.push(c); return; }
  s.hand.push(c);
}
function atkOf(k, u) {
  let a = u.atk + u.buff;
  if (u.def.type === 'person') B[k].field.forEach(v => { if (v && v !== u) (v.def.fx || []).forEach(f => { if (f.t === 'auraAtk') a += f.n; }); });
  return Math.max(0, a);
}
function strongestLane(k) { let best = -1, bv = -1; B[k].field.forEach((u, i) => { if (!u) return; const v = atkOf(k, u) * 10 + u.hp; if (v > bv) { bv = v; best = i; } }); return best; }

function floatAt(sel, text, cls) {
  const el = document.querySelector(sel); if (!el || SPEED === 0) return;
  const r = el.getBoundingClientRect(), f = document.createElement('div');
  f.className = 'float ' + (cls || ''); f.textContent = text;
  f.style.left = (r.left + r.width / 2) + 'px'; f.style.top = (r.top + r.height * 0.25) + 'px';
  document.body.appendChild(f); setTimeout(() => f.remove(), 950);
}
function anim(sel, cls) { const el = document.querySelector(sel); if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

function heal(k, n) { const s = B[k], b = s.life; s.life = Math.min(s.maxLife, s.life + n); if (s.life > b) floatAt('#life-' + k, '+' + (s.life - b), 'heal'); }
function hurtLife(k, n) {
  const s = B[k]; if (n <= 0) return;
  floatAt('#life-' + k, '-' + n); anim('#side-' + k, 'hit');
  s.life = Math.max(0, s.life - n);
  if (s.life <= 0 && !B.winner) B.winner = opp(k);
}
function hurtUnit(k, lane, n) {
  const s = B[k], u = s.field[lane]; if (!u) return 0;
  floatAt(`[data-uid="${u.uid}"]`, '-' + n); anim(`[data-uid="${u.uid}"]`, 'hit');
  u.hp -= n;
  if (u.hp <= 0) { const over = -u.hp; s.field[lane] = null; s.discard.push(inst(u.def, u.star)); say(`「${u.def.name}」をたおした！`); return over; }
  return 0;
}

async function startTurn(k) {
  if (!alive()) return;
  B.turn = k; B.sel = null;
  const s = B[k]; s.turns++; B.total++;
  if (B.total > TURN_LIMIT) { B.result = B.p.life > B.c.life ? 'win' : B.p.life < B.c.life ? 'lose' : 'draw'; B.limit = true; return finish(); }
  s.maxCp = Math.min(s.turns + 1, MAX_CP); s.cp = s.maxCp; s.quiz = false;   // 1ターン目は💠2から
  let regen = 0;
  s.field.forEach(u => { if (!u) return; u.sleep = false; (u.def.fx || []).forEach(f => { if (f.t === 'cpTurn') s.cp += f.n; if (f.t === 'regen') regen += f.n; }); });
  if (B.total !== 1) draw(k);
  say(k === 'p' ? '🔷 あなたのターン' : `🔶 ${s.name}のターン`);
  render();
  if (regen) { heal(k, regen); render(); }
  if (B.total > STORM_START) {   // 時空のあらし：おたがい10ターンをすぎると、毎ターンライフが減る
    await sleep(500); if (!alive()) return;
    say(`🌪️ 時空《じくう》のあらし！ ${sideName(k)}のライフ-${STORM_DMG}`); hurtLife(k, STORM_DMG); render();
    await sleep(700);
    if (B && B.winner) return finish();
    if (!alive()) return;
  }
  if (k === 'c') { await sleep(800); if (alive()) await cpuTurn(); }
  else { B.busy = false; render(); }
}
async function endTurn() {
  if (!alive()) return;
  const k = B.turn; B.busy = true; B.sel = null;
  say(k === 'p' ? '⚔️ あなたのこうげき！' : `⚔️ ${B[k].name}のこうげき！`); render();
  await sleep(450);
  await attackPhase(k);
  if (B.winner) return finish();
  if (!alive()) return;
  await sleep(300);
  await startTurn(opp(k));
}
async function attackPhase(k) {
  const s = B[k], ok = opp(k), o = B[ok];
  for (let i = 0; i < FIELD; i++) {
    if (!alive()) return;
    const u = s.field[i]; if (!u || u.sleep) continue;
    const a = atkOf(k, u); if (a <= 0) continue;
    anim(`[data-uid="${u.uid}"]`, k === 'p' ? 'lunge-up' : 'lunge-down');
    await sleep(260);
    if (!alive()) return;
    const t = o.field[i];
    if (t) {
      say(`「${u.def.name}」が「${t.def.name}」をこうげき！`);
      const over = hurtUnit(ok, i, a);
      if (over > 0 && hasFx(u.def, 'pierce')) hurtLife(ok, over);
    } else { say(`「${u.def.name}」が直接《ちょくせつ》こうげき！`); hurtLife(ok, a); }
    render();
    await sleep(450);
  }
}
async function playCard(k, hi, lane) {
  const s = B[k], u = s.hand[hi]; if (!u) return;
  const def = u.def; if (def.cost > s.cp) return;
  if (def.type !== 'culture' && (lane == null || s.field[lane])) return;
  s.cp -= def.cost; s.hand.splice(hi, 1);
  if (def.type === 'culture') {
    say(`${sideName(k)}は「${def.name}」を使《つか》った！`); B.flash = { k, def }; render();
    await sleep(900); if (!B) return; B.flash = null;
    await applyFx(k, def);
    s.discard.push(inst(def, u.star));
  } else {
    s.field[lane] = u; u.sleep = !hasFx(def, 'rush');
    say(`${sideName(k)}は「${def.name}」を出《だ》した！`); render(); anim(`[data-uid="${u.uid}"]`, 'spawn');
    await sleep(450);
    await applyFx(k, def, u);
  }
  if (B) render();
}
async function applyFx(k, def) {
  const s = B[k], ok = opp(k), o = B[ok];
  for (const f of def.fx || []) {
    if (!alive()) return;
    const n = f.n || 0;
    switch (f.t) {
      case 'draw': for (let i = 0; i < n; i++) draw(k); break;
      case 'cp': s.cp += n; break;
      case 'heal': heal(k, n); break;
      case 'dmg': { const li = strongestLane(ok); if (li < 0) hurtLife(ok, n); else hurtUnit(ok, li, n); break; }
      case 'dmgAll': o.field.forEach((u, i) => { if (u) hurtUnit(ok, i, n); }); break;
      case 'direct': hurtLife(ok, n); break;
      case 'buffAtk': s.field.forEach(u => { if (u && u.def.type === 'person') u.buff += n; }); break;
      case 'buffHp': s.field.forEach(u => { if (u) { u.hp += n; u.maxHp += n; } }); break;
      default: continue;   // 場にいる間の効果・知らない効果はここでは何もしない
    }
    render(); await sleep(380);
  }
}

/* ---------- CPUの考え方 ---------- */
function laneScore(k, u, l) {
  const ok = opp(k), e = B[ok].field[l], a = u.atk + u.buff;
  if (a > 0) { let v = 0; if (!e) v += 4; else { v += a >= e.hp ? 5 : 1; if (atkOf(ok, e) >= u.hp) v -= 3; } return v; }
  if (e) { const ea = atkOf(ok, e); return ea > 0 ? 3 + ea : 0; }
  return -1;
}
function cultureValue(k, u) {
  const s = B[k], ok = opp(k), o = B[ok], def = u.def; let v = 0;
  (def.fx || []).forEach(f => {
    const n = f.n || 0;
    if (f.t === 'draw') v += s.hand.length <= 3 ? 3 * n : 1.5 * n;
    else if (f.t === 'cp') {
      const left = s.cp - def.cost, after = left + n;
      const en = s.hand.filter(h => h !== u && h.def.cost > left && h.def.cost <= after && (h.def.type === 'culture' || s.field.some(x => !x)));
      v += en.length ? 5 + Math.max.apply(null, en.map(h => h.def.cost)) * 2 : -2;
    }
    else if (f.t === 'heal') { const lost = s.maxLife - s.life; v += lost >= n ? n * 1.5 : lost > 0 ? 1 : -1; }
    else if (f.t === 'dmg') { const li = strongestLane(ok); v += li < 0 ? 2 * n : (n >= o.field[li].hp ? 7 + o.field[li].def.cost : 3); }
    else if (f.t === 'dmgAll') { let h = 0, kk = 0; o.field.forEach(x => { if (x) { h++; if (n >= x.hp) kk++; } }); v += h ? kk * 4 + h * 1.5 : -1; }
    else if (f.t === 'direct') v += 2 * n;
    else if (f.t === 'buffAtk') { const c = s.field.filter(x => x && x.def.type === 'person').length; v += c ? c * 2.5 * n : -1; }
    else if (f.t === 'buffHp') { const c = s.field.filter(Boolean).length; v += c ? c * 1.5 * n : -1; }
  });
  return v;
}
function chooseMove(k, ai) {
  const s = B[k], opts = [];
  s.hand.forEach((u, idx) => {
    if (u.def.cost > s.cp) return;
    if (u.def.type === 'culture') { const v = cultureValue(k, u); if (v > 0) opts.push({ idx, lane: null, v }); }
    else for (let l = 0; l < FIELD; l++) { if (s.field[l]) continue; const v = u.def.cost * 2 + laneScore(k, u, l); if (v > 0) opts.push({ idx, lane: l, v }); }
  });
  if (!opts.length) return null;
  if (ai === 'easy') return opts[Math.floor(Math.random() * opts.length)];
  opts.sort((a, b) => b.v - a.v); return opts[0];
}
async function cpuTurn() {
  for (let g = 0; g < 12; g++) {
    if (!alive()) break;
    const m = chooseMove('c', B.cpu.ai); if (!m) break;
    await playCard('c', m.idx, m.lane);
    if (B && B.winner) return finish();
    await sleep(500);
  }
  if (B && B.winner) return finish();
  if (!alive()) return;
  await endTurn();
}

async function finish() {

  B.finished = true; B.busy = true; B.flash = null;

  if (res === 'win' && B.cpu.reward && !Store.get().owned[B.cpu.reward]) { grantCard(B.cpu.reward); reward = B.cpu.reward; }
  B.res = res; B.reward = reward;
  say(res === 'win' ? '🏆 勝利《しょうり》！' : res === 'lose' ? '💥 敗北《はいぼく》…' : '🤝 引《ひ》き分《わ》け'); render();

  openModal(`<div class="center"><div class="res-${res}">${res === 'win' ? '🏆 WIN!' : res === 'lose' ? '💥 LOSE…' : '🤝 DRAW'}</div>
    <p style="line-height:1.7">${B.limit ? 'ターンの上限《じょうげん》になったので、ライフの多《おお》いほうの勝《か》ち。<br>' : ''}${msg}</p>
    ${rdef ? `<div class="get">🎁 初《はつ》勝利《しょうり》ボーナス！ 新《あたら》しいカードをゲット！</div><div class="cardrow mt">${cardHTML(rdef, { size: 'md', star: 1, badge: 'NEW', cls: 'flip' })}</div><div class="trivia mt" style="text-align:left"><h4>💡 豆《まめ》知識《ちしき》「${esc(rdef.name)}」</h4>${esc(rdef.trivia)}</div>` : ''}

}

  },
  furi: () => { Store.update(d => { d.settings = d.settings || {}; d.settings.furi = !furiOn(); }); render(); },
  quitYes: () => { if (B) B.aborted = true; B = null; go('battleSelect'); }
};
function onClick(e) {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (f) f(el.dataset.arg, el, e);
}
$app.addEventListener('click', onClick);
$modal.addEventListener('click', onClick);
// 別のタブで別の時代アプリが記録を変えたら、表示を更新
window.addEventListener('storage', e => {
  if (e.key === STORE_KEY && ['home', 'collection', 'deck', 'link', 'stages', 'battleSelect'].includes(S.screen) && !$modal.innerHTML) render();
});

/* ---------- スタート ---------- */
registerEra();
render();
</script>
</body>
</html>

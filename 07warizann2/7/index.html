<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Untitled</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-wrapper">
  <!-- ヘッダー（キャラクターのつぶやき） -->
  <header class="header">
    <div class="character-area">
      <div class="character-icon">🦉</div>
      <div class="speech-bubble" id="character-message">
        まずは左から問題を選んでみよう！
      </div>
    </div>
  </header>

  <main class="main-content">
    <!-- 左側：問題選択パネル -->
    <aside class="sidebar">
      <h2>もんだい を えらぼう</h2>
      
      <div class="problem-group">
        <label>1. わりきれないのはどれ？</label>
        <select id="q1-select" class="problem-select">
          <option value="">-- えらぶ --</option>
          <option value="16,2">ア 16 ÷ 2</option>
          <option value="35,5">イ 35 ÷ 5</option>
          <option value="31,6">ウ 31 ÷ 6</option>
          <option value="14,5">エ 14 ÷ 5</option>
          <option value="38,9">オ 38 ÷ 9</option>
          <option value="56,8">カ 56 ÷ 8</option>
          <option value="63,7">キ 63 ÷ 7</option>
          <option value="50,6">ク 50 ÷ 6</option>
          <option value="24,7">ケ 24 ÷ 7</option>
        </select>
      </div>

      <div class="problem-group">
        <label>2. クッキーの もんだい</label>
        <button class="problem-btn" data-dividend="38" data-divisor="5" data-hint="「38まい」を「5まい」ずつ わけてみよう。">38 ÷ 5 をシミュレート</button>
      </div>

      <div class="problem-group">
        <label>3. わりざんの けいさん</label>
        <select id="q3-select" class="problem-select">
          <option value="">-- えらぶ --</option>
          <option value="8,3">① 8 ÷ 3</option>
          <option value="11,2">② 11 ÷ 2</option>
          <option value="48,5">③ 48 ÷ 5</option>
          <option value="39,8">④ 39 ÷ 8</option>
          <option value="15,6">⑤ 15 ÷ 6</option>
          <option value="29,4">⑥ 29 ÷ 4</option>
          <option value="76,9">⑦ 76 ÷ 9</option>
          <option value="30,8">⑧ 30 ÷ 8</option>
          <option value="41,7">⑨ 41 ÷ 7</option>
        </select>
      </div>

      <div class="problem-group">
        <label>4. あめの もんだい</label>
        <button class="problem-btn" data-dividend="18" data-divisor="7" data-hint="「あめの数」と「人」にちゅうもく！32円はひっかけかも？">18 ÷ 7 をシミュレート</button>
      </div>

      <div class="problem-group">
        <label>5. たしかめの しき</label>
        <select id="q5-select" class="problem-select">
          <option value="">-- えらぶ --</option>
          <option value="41,5">① 41 ÷ 5</option>
          <option value="54,9">② 54 ÷ 9</option>
          <option value="75,8">③ 75 ÷ 8</option>
        </select>
      </div>

      <div class="problem-group">
        <label>6. ボールの もんだい</label>
        <button class="problem-btn" data-dividend="32" data-divisor="6" data-hint="あまったボールも しまうには、はこ はいくついるかな？">32 ÷ 6 をシミュレート</button>
      </div>
    </aside>

    <!-- 右側：シミュレーター（複線化） -->
    <section class="simulator-area">
      <!-- ツール切り替えタブ -->
      <div class="tabs">
        <button class="tab-btn active" data-target="tool-blocks">① ブロック（具体物）</button>
        <button class="tab-btn" data-target="tool-line">② 数直線（テープ）</button>
        <button class="tab-btn" data-target="tool-check">③ しき・たしかめ</button>
      </div>

      <!-- 現在の問題表示 -->
      <div class="current-equation">
        <span id="eq-dividend">?</span> ÷ <span id="eq-divisor">?</span>
      </div>

      <!-- ツール1：ブロック分け -->
      <div id="tool-blocks" class="tool-content active">
        <div class="tool-controls">
          <button id="group-btn" class="action-btn">
            <span id="btn-divisor-val">?</span>こ ずつ まとめる
          </button>
          <button id="reset-blocks-btn" class="reset-btn">やりなおす</button>
        </div>
        <div class="blocks-workspace">
          <div class="pool-area">
            <h3>バラバラのブロック (<span id="pool-count">0</span>こ)</h3>
            <div id="block-pool" class="dots-container"></div>
          </div>
          <div class="groups-area">
            <h3>まとまり (<span id="group-count">0</span>グループ)</h3>
            <div id="block-groups" class="groups-container"></div>
          </div>
        </div>
      </div>

      <!-- ツール2：数直線 -->
      <div id="tool-line" class="tool-content">
        <div class="tool-controls">
          <button id="jump-btn" class="action-btn">
            <span id="btn-jump-val">?</span> ずつ すすむ
          </button>
          <button id="reset-line-btn" class="reset-btn">やりなおす</button>
        </div>
        <div class="number-line-workspace">
          <div class="line-container">
            <!-- CSSとJSで厳密に配置される数直線 -->
            <div class="number-line"></div>
            <div id="jump-arcs" class="jump-arcs"></div>
            <div class="line-labels">
              <span class="label-start">0</span>
              <span class="label-end" id="line-max-val">?</span>
            </div>
          </div>
          <div class="line-status">
            すすんだ数: <span id="jumped-total">0</span> / あまり: <span id="jump-remain">0</span>
          </div>
        </div>
      </div>

      <!-- ツール3：たしかめ算 -->
      <div id="tool-check" class="tool-content">
        <div class="check-workspace">
          <p>ブロックや数直線でわかった 答えを 入れてみよう！</p>
          <div class="equation-inputs">
            <span id="check-div">?</span> ÷ <span id="check-dsr">?</span> ＝ 
            <input type="text" id="input-quotient" class="num-input" placeholder="こたえ">
            あまり
            <input type="text" id="input-remainder" class="num-input" placeholder="あまり">
          </div>
          
          <div class="check-formula-area">
            <p>【たしかめの しき】</p>
            <div class="formula-box">
              わる数 × こたえ ＋ あまり ＝ わられる数<br>
              <span id="check-dsr-2">?</span> × <span id="mirror-quotient">?</span> ＋ <span id="mirror-remainder">?</span> ＝ <span id="calc-result">?</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- フッター（ノートへの誘導） -->
  <footer class="footer">
    <div class="notebook-message">
      ✎ わかったこと、気づいたこと、図のようすを、<strong>ノートにかいて まとめよう！</strong>
    </div>
  </footer>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

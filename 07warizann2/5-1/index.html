<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>０８　割り算を考えよう　5時間目　練習問題</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div id="app">
  <header>
    <h1>わり算 最後のしれん！（第5時）</h1>
    <div class="step-indicator" id="progress-text">もんだい 1 / 4</div>
  </header>

  <section class="visualizer">
    <div class="area-label">
      <span><span id="item-name">アイテム</span>（ぜんぶで <span id="total-count">0</span>）</span>
      <div class="vis-controls">
        <button id="btn-auto-group" class="btn-small btn-magic">🪄 1グループ 自動でつくる</button>
        <button id="btn-reset-items" class="btn-small">🔄 はじめにもどす</button>
      </div>
    </div>
    
    <div class="pool-container">
      <div class="pool-status">のこり： <strong id="pool-num">0</strong></div>
      <div class="pool" id="pool"></div>
    </div>
    
    <div class="area-label" style="margin-top: 15px;">分ける場所（1つに <span id="divisor-count">0</span> ずつ）</div>
    <div class="groups" id="groups"></div>
  </section>

  <section class="question-board">
    <div class="question-card">
      <h2 id="q-title">📝 もんだい</h2>
      <p id="q-text" class="question-text"></p>
      
      <div class="hint-area hidden" id="hint-area">
        <strong>💡 ヒント：</strong> <span id="hint-text"></span>
      </div>

      <div id="standard-answer-area" class="input-section">
        <div class="answer-box">
          <span id="eq-left" class="eq-left"></span>
          <input type="text" inputmode="numeric" id="input-q" placeholder="？" class="input-quotient"> あまり 
          <input type="text" inputmode="numeric" id="input-r" placeholder="？" class="input-remainder">
        </div>
      </div>

      <div id="shiho-judgment-area" class="input-section hidden">
        <div class="judgment-box">
          <p>しほさんの せつめいは 正しいかな？</p>
          <div class="action-buttons" style="margin-top: 10px;">
            <button id="btn-shiho-correct" class="btn-judge btn-cross">⭕ 正しい</button>
            <button id="btn-shiho-wrong" class="btn-judge btn-circle">❌ 正しくない</button>
          </div>
        </div>
      </div>
      
      <div id="shiho-correction-area" class="input-section hidden">
        <div class="reason-box">
          <p>なぜ 正しくないのかな？</p>
          <select id="shiho-reason">
            <option value="">えらんでね ▼</option>
            <option value="calc">たしかめの 計算が まちがっているから</option>
            <option value="remainder">あまり(5) が わる数(3) より 大きいから</option>
            <option value="zero">17 ÷ 3 が わりきれるから</option>
          </select>
        </div>
        <div class="answer-box" style="margin-top: 15px;">
          <span class="eq-left">正しい こたえ： 17 ÷ 3 ＝ </span>
          <input type="text" inputmode="numeric" id="shiho-input-q" placeholder="？" class="input-quotient"> あまり 
          <input type="text" inputmode="numeric" id="shiho-input-r" placeholder="？" class="input-remainder">
        </div>
      </div>

      <div class="action-buttons" id="main-actions">
        <button id="btn-hint" class="btn-hint">💡 ヒントをみる</button>
        <button id="btn-check" class="btn-primary">こたえあわせ ✨</button>
      </div>
      
      <button id="btn-next" class="btn-next hidden">つぎの もんだいへ ➡</button>

      <div id="msg" class="msg hidden"></div>
    </div>
  </section>

  <section id="clear-screen" class="clear-screen hidden">
    <div class="clear-content">
      <div class="crown">🎓</div>
      <h2>わり算 マスター 認定！！</h2>
      <p>あまりが 0 のときも、数が 大きくても、<br>ひっかけ問題でも、ぜんぶ 完璧に できたね！<br>すばらしい！</p>
      <button onclick="location.reload()" class="btn-primary" style="margin-top: 30px;">もういちど やる</button>
    </div>
  </section>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

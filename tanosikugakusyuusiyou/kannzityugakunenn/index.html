<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>漢字クエスト 3・4年｜むん先生の学習クエスト</title>
<meta name="description" content="小学3・4年の漢字を、書き順チェック・クイズ・書き取り・熟語づくりで、自分のレベルに合わせて学べる無料の漢字学習アプリ。">
<meta name="theme-color" content="#0B1026">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=M+PLUS+1:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1026;        /* 墨夜：背景 */
  --ink2:#10173A;
  --panel:#141C42;      /* 盤 */
  --panel2:#1A2352;
  --line:rgba(62,240,224,.22);
  --cyan:#3EF0E0;       /* 電光シアン */
  --cyan-d:#1BB8AA;
  --shu:#FF5A3C;        /* 朱：はなまる・はんこ */
  --gold:#FFD23F;       /* マスター */
  --lime:#7CFF6B;       /* せいかい */
  --violet:#A98BFF;
  --text:#E8ECFF;
  --muted:#8E97C9;
  --dim:#5B6499;
  --r-panel:16px; --r-btn:12px;
  --f-ui:"M PLUS 1","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  --f-kanji:"UD Digi Kyokasho N-R","UD デジタル 教科書体 N-R","Klee One","YuKyokasho","Hiragino Mincho ProN",serif;
  --f-logo:"Orbitron","M PLUS 1",sans-serif;
  --fs:17px;
}
html.big{--fs:20px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--f-ui);font-size:var(--fs);line-height:1.6;color:var(--text);
  background-color:var(--ink);
  background-image:
    radial-gradient(1200px 600px at 85% -10%,rgba(169,139,255,.16),transparent 60%),
    radial-gradient(900px 500px at -10% 110%,rgba(62,240,224,.10),transparent 60%),
    linear-gradient(rgba(62,240,224,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(62,240,224,.045) 1px,transparent 1px);
  background-size:auto,auto,48px 48px,48px 48px;
  background-attachment:fixed;
  min-height:100vh;-webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:1rem;color:var(--text)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.kj{font-family:var(--f-kanji)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 48px}
.hide{display:none!important}
.muted{color:var(--muted)}
.small{font-size:.85em}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(11,16,38,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 6px;border-radius:10px;text-align:left}
.logo-mark{width:38px;height:38px;border:2px solid var(--cyan);border-radius:8px;display:grid;place-items:center;font-family:var(--f-kanji);font-size:24px;color:var(--cyan);position:relative;box-shadow:0 0 14px rgba(62,240,224,.35)}
.logo-mark::before,.logo-mark::after{content:"";position:absolute;background:rgba(62,240,224,.25)}
.logo-mark::before{left:50%;top:3px;bottom:3px;width:1px}
.logo-mark::after{top:50%;left:3px;right:3px;height:1px}
.logo-txt b{display:block;font-family:var(--f-logo);font-size:15px;letter-spacing:.08em;color:#fff}
.logo-txt>span{display:block;font-size:11px;color:var(--muted);line-height:1.2}
.logo-g{display:inline-block;margin-left:6px;font-family:var(--f-ui);font-size:12px;font-weight:900;color:#06222a;background:var(--cyan);border-radius:6px;padding:0 6px;letter-spacing:0;vertical-align:2px}
.hud{display:flex;align-items:center;gap:8px;margin-left:auto}
.hud-pill{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;font-weight:700;white-space:nowrap}
.hud-pill .pet{font-size:24px;line-height:1}
.hud-pill .cr{font-family:var(--f-logo);font-size:14px;color:var(--gold)}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:20px}
.icon-btn:hover{border-color:var(--cyan)}

/* ---------- common parts ---------- */
.panel{background:linear-gradient(180deg,var(--panel),var(--ink2));border:1px solid var(--line);border-radius:var(--r-panel);padding:18px}
h1,h2,h3{margin:0;line-height:1.35}
h1{font-size:1.6em;font-weight:900}
h2{font-size:1.25em;font-weight:900}
h3{font-size:1.05em;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:var(--r-btn);border:1px solid var(--cyan);background:var(--cyan);color:#06222a;font-weight:900;text-decoration:none;transition:transform .08s,box-shadow .15s}
.btn:hover{box-shadow:0 0 18px rgba(62,240,224,.45)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--cyan)}
.btn.shu{background:var(--shu);border-color:var(--shu);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2a2000}
.btn.dark{background:var(--panel2);border-color:var(--line);color:var(--text)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:.9em}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-weight:700}
.chip[aria-pressed="true"]{background:rgba(62,240,224,.16);border-color:var(--cyan);color:var(--cyan)}
.back{background:none;border:0;color:var(--muted);font-weight:700;padding:8px 4px;display:inline-flex;gap:6px;align-items:center}
.back:hover{color:var(--cyan)}
.tag{display:inline-block;font-size:.75em;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid currentColor}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap}
.stars i{font-style:normal;color:var(--dim)}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;display:flex}
.bar>span{display:block;height:100%}

/* 田の字ガイド */
.tagrid{position:relative;background:#0A0F2A;border:2px solid rgba(62,240,224,.55);border-radius:10px}
.tagrid::before,.tagrid::after{content:"";position:absolute;pointer-events:none}
.tagrid::before{left:50%;top:0;bottom:0;border-left:2px dashed rgba(62,240,224,.18)}
.tagrid::after{top:50%;left:0;right:0;border-top:2px dashed rgba(62,240,224,.18)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:22px;align-items:center;margin:22px 0}
.hero-kanji{display:block;aspect-ratio:1;width:100%;cursor:pointer;padding:0}
.hero-kanji svg{position:absolute;inset:0;width:100%;height:100%}
.hero-cap{display:flex;justify-content:space-between;margin-top:8px;font-size:.9em;color:var(--muted)}
.hero h1{font-size:clamp(1.5em,3.4vw,2.2em)}
.hero .lead{color:var(--muted);margin:6px 0 16px}
.streak{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.streak .s{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700}
.streak .s b{font-size:1.3em;color:var(--gold);margin-right:2px}
.mission{display:flex;align-items:center;gap:14px;border-left:4px solid var(--shu);background:rgba(255,90,60,.08);border-radius:12px;padding:12px 14px}
.mission .ic{font-size:30px}
.mission p{margin:0;font-weight:700}
.mission .muted{font-weight:400;font-size:.85em}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:30px 0 12px}
.sec-h .muted{font-size:.9em}
.grades{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.grades.g2{grid-template-columns:repeat(2,1fr)}
.grades.g2 .gtile{padding:18px 20px 16px}
.grades.g2 .gtile .num{font-size:60px}
.applinks{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
a.qbtn{text-decoration:none}
.gtile{color:var(--text);position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-panel);padding:14px 14px 12px;transition:border-color .15s,transform .1s}
.gtile:hover{border-color:var(--cyan);transform:translateY(-2px)}
.gtile .num{font-family:var(--f-logo);font-size:44px;font-weight:900;line-height:1;color:#fff}
.gtile .num small{font-family:var(--f-ui);font-size:16px;margin-left:2px;color:var(--muted)}
.gtile .cnt{color:var(--muted);font-size:.85em;margin:4px 0 8px}
.gtile .ng{position:absolute;top:10px;right:10px;font-size:.75em;font-weight:900;color:var(--shu)}
.gtile[data-g="1"] .num{color:#7CE7FF}.gtile[data-g="2"] .num{color:#7CFFB2}.gtile[data-g="3"] .num{color:#FFE27C}
.gtile[data-g="4"] .num{color:#FFA37C}.gtile[data-g="5"] .num{color:#FF8AD8}.gtile[data-g="6"] .num{color:#B49CFF}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.qbtn{color:var(--text);display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-panel);padding:14px}
.qbtn:hover{border-color:var(--cyan)}
.qbtn .ic{font-size:28px}
.qbtn b{display:block}
.qbtn span{display:block;font-size:.8em;color:var(--muted);line-height:1.35}
.foot{margin-top:40px;font-size:.78em;color:var(--dim);line-height:1.7}
.foot a{color:var(--muted)}

/* ---------- grade hub ---------- */
.hubhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:10px 0 16px}
.hubhead h1 small{font-size:.55em;color:var(--muted);font-weight:700;margin-left:8px}
.mastery-sum{min-width:260px;flex:1}
.mastery-sum .legend{display:flex;gap:14px;font-size:.8em;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.hubgrid{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
.path{position:relative;display:flex;flex-direction:column;gap:14px}
.path::before{content:"";position:absolute;left:27px;top:30px;bottom:30px;width:3px;background:linear-gradient(var(--cyan),var(--violet),var(--shu));opacity:.5;border-radius:3px}
.step{position:relative;display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:start}
.step .lv{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--ink);border:3px solid var(--cyan);font-family:var(--f-logo);font-weight:900;font-size:13px;line-height:1.1;text-align:center;z-index:1}
.step .lv b{display:block;font-size:20px}
.step[data-lv="2"] .lv{border-color:#6FD3FF}.step[data-lv="3"] .lv{border-color:var(--violet)}
.step[data-lv="4"] .lv{border-color:#FF8AD8}.step[data-lv="5"] .lv{border-color:var(--shu)}
.step .body{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-panel);padding:12px 14px}
.step .body h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step .who{font-size:.82em;color:var(--muted);margin:2px 0 10px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.mode{display:flex;align-items:center;gap:10px;text-align:left;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:60px}
.mode:hover{border-color:var(--cyan);background:rgba(62,240,224,.08)}
.mode .ic{font-size:26px}
.mode b{display:block;line-height:1.3;color:#fff}
.mode span{display:block;font-size:.75em;color:var(--muted);line-height:1.3}
.reco{color:var(--gold);border-color:var(--gold)}
.side{display:flex;flex-direction:column;gap:14px}
.side .panel h3{margin-bottom:8px}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(3,6,20,.72);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:12px}
@media(min-width:700px){.modal-bg{align-items:center}}
.modal{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--cyan);border-radius:20px;padding:20px;box-shadow:0 0 40px rgba(62,240,224,.25)}
.modal h2{margin-bottom:4px}
.field{margin:16px 0}
.field>label,.field>.lab{display:block;font-weight:900;margin-bottom:6px}
.field .hint{font-size:.8em;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
select.sel,input.inp,textarea.inp{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea.inp{min-height:80px;resize:vertical}

/* ---------- zukan ---------- */
.ztools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 14px}
.ztools .inp{max-width:260px}
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.ztile{position:relative;aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-family:var(--f-kanji);font-size:34px;display:grid;place-items:center;padding:0}
.ztile:hover{border-color:var(--cyan)}
.ztile .mk{position:absolute;bottom:3px;left:0;right:0;font-family:var(--f-ui);font-size:9px;color:var(--gold);letter-spacing:0}
.ztile.m0{color:#C9CFF0}
.ztile.m1,.ztile.m2{border-color:rgba(111,211,255,.6);color:#bfeaff}
.ztile.m3,.ztile.m4{border-color:rgba(124,255,107,.6);color:#d7ffd0;background:rgba(124,255,107,.06)}
.ztile.m5{border-color:var(--gold);color:var(--gold);background:rgba(255,210,63,.08)}
.ztile.ng::after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--shu)}
.ztile.sel{outline:3px solid var(--cyan);background:rgba(62,240,224,.18)}
.selbar{position:sticky;bottom:10px;margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--cyan);border-radius:14px;padding:10px 14px}

/* ---------- detail ---------- */
.detail{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:22px;align-items:start;margin-top:8px}
.kvbox{aspect-ratio:1;width:100%}
.kvbox svg{position:absolute;inset:0;width:100%;height:100%}
.kvctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.big-k{font-family:var(--f-kanji);font-size:64px;line-height:1}
.rd{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0}
.rd dt{font-weight:900;color:var(--muted)}
.rd dd{margin:0}
.yomi-chip{display:inline-block;margin:0 6px 4px 0;padding:2px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.yomi-chip.on{color:#9FE8FF}
.okuri{color:var(--dim)}
.exlist{list-style:none;margin:6px 0 0;padding:0}
.exlist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.exlist .sent{flex:1}
.exlist .sent ruby{ruby-position:over}
.exlist rt{font-size:.6em;color:var(--cyan)}
.hl{color:var(--cyan);font-weight:900}
.speak{background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;flex:none}
.parts-eq{font-family:var(--f-kanji);font-size:1.4em}

/* ---------- play ---------- */
.playtop{display:flex;align-items:center;gap:10px;margin:10px 0}
.dots{display:flex;gap:4px;flex-wrap:wrap;flex:1;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.12);display:block}
.dots i.ok{background:var(--lime)}.dots i.half{background:var(--gold)}.dots i.ng{background:var(--shu)}.dots i.cur{outline:2px solid var(--cyan);outline-offset:1px}
.goalchip{font-size:.8em;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:2px 10px}
.combo{font-family:var(--f-logo);font-weight:900;color:var(--lime);min-width:70px;text-align:right}
.stage{background:linear-gradient(180deg,var(--panel),var(--ink2));border:1px solid var(--line);border-radius:20px;padding:20px 16px;text-align:center;position:relative;min-height:380px}
.qhead{font-size:.9em;color:var(--muted);font-weight:700;margin-bottom:6px}
.sentence{font-size:clamp(1.4em,4.2vw,2.1em);font-weight:700;line-height:2.1;margin:8px 0 14px;word-break:keep-all;overflow-wrap:anywhere}
.sentence .tg{color:var(--cyan);border-bottom:4px solid var(--cyan);padding:0 4px;font-family:var(--f-kanji)}
.sentence .blank{display:inline-block;border:2px dashed var(--cyan);border-radius:10px;background:rgba(62,240,224,.08);padding:0 8px;line-height:1.35;color:var(--cyan);letter-spacing:.1em}
.sentence ruby rt{font-size:.45em;color:var(--gold);font-weight:700}
.meaning{display:inline-block;font-size:.9em;color:#BFC7F5;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin-bottom:8px}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:620px;margin:14px auto 0}
.choice{min-height:72px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);font-size:1.5em;font-weight:900;padding:8px}
.choice.kj{font-size:2em;font-weight:600}
.choice:hover:not(:disabled){border-color:var(--cyan)}
.choice.ok{border-color:var(--lime);background:rgba(124,255,107,.14);color:var(--lime)}
.choice.ng{border-color:var(--shu);background:rgba(255,90,60,.14);color:var(--shu)}
.choice:disabled{cursor:default}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.tool{min-height:44px;padding:6px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:700}
.tool:hover:not(:disabled){border-color:var(--cyan)}
.tool[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.tool:disabled{opacity:.4}
.conf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px;margin:16px auto 0}
.conf button{min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);font-weight:900;line-height:1.25}
.conf button span{display:block;font-size:1.5em}
.conf button:hover{border-color:var(--cyan)}
.judge{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px;margin:14px auto 0}
.judge button{min-height:68px;border-radius:14px;font-weight:900;font-size:1.05em;border:2px solid}
.judge .j-ok{border-color:var(--lime);background:rgba(124,255,107,.12);color:var(--lime)}
.judge .j-half{border-color:var(--gold);background:rgba(255,210,63,.10);color:var(--gold)}
.judge .j-ng{border-color:var(--shu);background:rgba(255,90,60,.10);color:var(--shu)}
.judge button b{display:block;font-size:1.6em;line-height:1}
.checklist{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.feedback{margin-top:14px;font-weight:900;font-size:1.1em;min-height:1.6em}
.feedback.ok{color:var(--lime)}.feedback.ng{color:var(--shu)}.feedback.half{color:var(--gold)}
.explain{margin:12px auto 0;max-width:620px;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.92em}
.reason{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.nextrow{margin-top:16px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

/* writing pad */
.pad{position:relative;box-sizing:content-box;margin:6px auto 0;touch-action:none;user-select:none;-webkit-user-select:none;background:#0A0F2A;border:2px solid rgba(62,240,224,.55);border-radius:10px;overflow:hidden}
.pad svg.guide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pad .cells{position:absolute;inset:0;display:flex}
.pad .cell{flex:1;position:relative;border-right:2px dashed rgba(62,240,224,.25)}
.pad .cell:last-child{border-right:0}
.pad .cell::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed rgba(62,240,224,.14)}
.pad .cell::after{content:"";position:absolute;top:50%;left:0;right:0;border-top:1px dashed rgba(62,240,224,.14)}
.pad .cell.kana{background:rgba(255,255,255,.02)}
.pad .model{position:absolute;inset:0;display:flex;pointer-events:none}
.pad .model>div{flex:1;position:relative}
.pad .model svg{position:absolute;inset:6%;width:88%;height:88%}
.pad .model .txt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-kanji);color:rgba(255,255,255,.22)}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.pad.frozen canvas{cursor:default}
.pad.side-by-side{display:block}
.compare{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.compare .mbox{width:110px;height:110px;position:relative}
.compare .mbox svg{position:absolute;inset:6%;width:88%;height:88%}
.compare .mbox .txt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-kanji);font-size:80px}
.scount{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px;font-size:.88em}
.scount span{padding:2px 10px;border-radius:999px;border:1px solid var(--line)}
.scount .eq{border-color:var(--lime);color:var(--lime)}
.scount .ne{border-color:var(--gold);color:var(--gold)}

/* trace */
.trace-wrap{position:relative;margin:8px auto 0}
.trace-wrap svg.guide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.trace-msg{min-height:1.7em;font-weight:900;margin-top:10px}

/* stamp */
.stamp{position:absolute;right:18px;top:14px;width:96px;height:96px;pointer-events:none;opacity:0}
.stamp.show{animation:stamp .45s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stamp{0%{opacity:0;transform:scale(2.2) rotate(-25deg)}100%{opacity:1;transform:scale(1) rotate(-12deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--cyan);border-radius:14px;padding:10px 18px;font-weight:900;z-index:80;box-shadow:0 0 24px rgba(62,240,224,.3);max-width:90vw}
.float-cr{position:fixed;z-index:85;font-family:var(--f-logo);font-weight:900;color:var(--gold);pointer-events:none;animation:floatup 1s ease-out forwards;font-size:20px}
@keyframes floatup{to{transform:translateY(-60px);opacity:0}}

/* boss */
.boss{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:10px}
.boss .mon{font-size:56px;line-height:1;filter:drop-shadow(0 0 12px rgba(255,90,60,.6))}
.boss .mon.hit{animation:hit .35s}
@keyframes hit{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hpbar{width:220px;height:14px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid rgba(255,90,60,.6)}
.hpbar span{display:block;height:100%;background:linear-gradient(90deg,var(--shu),#ff9a3c);transition:width .4s}
.hearts{font-size:20px;letter-spacing:2px}

/* jukugo */
.jk-center{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0}
.jk-slot{width:84px;height:84px;border-radius:14px;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-kanji);font-size:52px}
.jk-slot.c{border:2px solid var(--cyan);color:var(--cyan);background:rgba(62,240,224,.08)}
.jk-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px;margin:12px auto}
.jk-tile{aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:var(--panel2);font-family:var(--f-kanji);font-size:40px}
.jk-tile:hover:not(:disabled){border-color:var(--cyan)}
.jk-tile.used{opacity:.3}
.jk-tile.shake{animation:hit .35s;border-color:var(--shu)}
.jk-found{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.jk-found span{padding:4px 12px;border-radius:10px;border:1px solid var(--lime);color:var(--lime);font-family:var(--f-kanji);font-size:1.2em}
.jk-found span small{font-family:var(--f-ui);font-size:.6em;color:var(--muted);margin-left:4px}

/* parts */
.parts-q{font-family:var(--f-kanji);font-size:clamp(2.4em,8vw,3.6em);display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:10px 0}
.parts-q .pp{min-width:1.3em;text-align:center}
.parts-q .op{font-family:var(--f-ui);color:var(--muted);font-size:.6em}
.parts-q .qm{color:var(--cyan);border-bottom:4px solid var(--cyan);min-width:1.2em}
.pname{display:block;font-family:var(--f-ui);font-size:12px;color:var(--muted);text-align:center}

/* result */
.result{max-width:760px;margin:20px auto}
.result .score{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.result .score .big{font-family:var(--f-logo);font-size:56px;font-weight:900;color:#fff;line-height:1}
.result .score .big small{font-size:24px;color:var(--muted)}
.kchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.kchips button,.kchips span{font-family:var(--f-kanji);font-size:1.4em;min-width:48px;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:inline-grid;place-items:center}
.kchips .up{border-color:var(--gold);color:var(--gold)}
.kchips .down{border-color:var(--shu);color:var(--shu)}
.suggest{border:1px solid var(--violet);background:rgba(169,139,255,.08);border-radius:14px;padding:12px 14px;margin-top:14px}

/* records */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:330px}
.cal i{aspect-ratio:1;border-radius:5px;background:rgba(255,255,255,.06);display:block;font-style:normal;font-size:10px;color:var(--dim);text-align:right;padding:2px 3px}
.cal i.l1{background:rgba(62,240,224,.25)}.cal i.l2{background:rgba(62,240,224,.5)}.cal i.l3{background:var(--cyan);color:#06222a}
.cal i.today{outline:2px solid var(--gold)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.6em;font-family:var(--f-logo);color:#fff}
.stat span{font-size:.8em;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:var(--panel2)}
.badge .bi{font-size:30px}
.badge b{display:block;font-size:.88em}
.badge span{display:block;font-size:.72em;color:var(--muted);line-height:1.35}
.badge.off{opacity:.38;filter:grayscale(1)}
.rlist{list-style:none;padding:0;margin:0}
.rlist li{padding:8px 0;border-bottom:1px dashed var(--line);font-size:.92em}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mbars .r{display:grid;grid-template-columns:44px 1fr 70px;gap:10px;align-items:center;margin:6px 0;font-size:.9em}

/* make */
.preview{background:var(--ink);border:1px dashed var(--cyan);border-radius:12px;padding:12px;text-align:center}
.myqlist{list-style:none;padding:0;margin:0}
.myqlist li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.myqlist li .s{flex:1}
code.share{display:block;word-break:break-all;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.75em;max-height:120px;overflow:auto}

/* evolution */
.evo{position:fixed;inset:0;z-index:90;background:rgba(3,6,20,.86);display:grid;place-items:center;text-align:center}
.evo .p{font-size:120px;animation:evo 1.2s ease-out}
@keyframes evo{0%{transform:scale(.2) rotate(-200deg);filter:brightness(4)}60%{transform:scale(1.2)}100%{transform:scale(1)}}

/* print */
#print-area{display:none}
@media print{
  body{background:#fff!important;color:#000}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block;color:#000;font-family:var(--f-ui)}
  .pp-page{page-break-after:always;padding:10mm}
  .pp-page:last-child{page-break-after:auto}
  .pp-head{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:4mm;margin-bottom:6mm}
  .pp-q{display:flex;align-items:center;gap:4mm;margin:5mm 0;font-size:15pt}
  .pp-q .no{width:10mm;font-weight:700}
  .pp-box{display:inline-flex;flex-direction:column;align-items:center;margin:0 1mm;vertical-align:middle}
  .pp-box rt,.pp-box .r{font-size:9pt}
  .pp-box .b{width:16mm;height:16mm;border:1.5px solid #000;background-image:linear-gradient(#bbb,#bbb),linear-gradient(#bbb,#bbb);background-size:1px 100%,100% 1px;background-position:center;background-repeat:no-repeat}
  .pp-ans{font-family:var(--f-kanji);font-size:16pt}
}

/* responsive */
@media(max-width:980px){
  .grades{grid-template-columns:repeat(3,1fr)}
  .grades.g2{grid-template-columns:repeat(2,1fr)}
  .quick{grid-template-columns:repeat(2,1fr)}
  .hubgrid{grid-template-columns:1fr}
}
@media(max-width:720px){
  .hero{grid-template-columns:1fr}
  .hero-kanji{max-width:240px;margin:0 auto}
  .detail{grid-template-columns:1fr}
  .kvbox{max-width:320px;margin:0 auto}
  .cols2{grid-template-columns:1fr}
  .logo-txt>span{display:none}
}
@media(max-width:480px){
  .wrap{padding:0 12px 40px}
  .grades{grid-template-columns:repeat(2,1fr)}
  .quick{grid-template-columns:1fr}
  .applinks{grid-template-columns:1fr}
  .choices{grid-template-columns:1fr}
  .judge button,.conf button{font-size:.9em}
  .hud-pill{padding:3px 10px 3px 4px}
  .logo-txt b{font-size:13px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
html.calm *{animation-duration:.01ms!important;transition-duration:.01ms!important}

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];
const isKanji = c => /[一-鿿々]/.test(c);
const kata2hira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const DAY = 86400000;
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const today = () => ymd(new Date());
function dateAdd(s, n) { const [y, m, d] = s.split('-').map(Number); return ymd(new Date(y, m - 1, d + n)); }
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

/* ---------------- 漢字データ ---------------- */
const GRADES = APP.grades;   // このアプリの学年
const GRADE_OF = {};          // 小学校の全1026字 -> 学年
for (const g in ALLG) for (const c of ALLG[g]) GRADE_OF[c] = +g;
const KDB = {};            // 字 -> {k,g,on,kun,mean,items,sc}（ref:下の学年の字＝読みと画数だけ）
const GK = {};             // 学年 -> [字]
const ITEMS = [];          // 漢字データの例文問題
const READVAR = new Map(); // 読み(音変化ふくむ) -> Set(字)

function splitN(s, n) { const out = []; let i = 0; for (let c = 0; c < n; c++) { const j = s.indexOf('|', i); out.push(s.slice(i, j)); i = j + 1; } out.push(s.slice(i)); return out; }
const ITEM_RE = /^(.*?)\[([^|\]]+)\|([^\]]+)\](.*)$/;
const VOICE = { か: 'が', き: 'ぎ', く: 'ぐ', け: 'げ', こ: 'ご', さ: 'ざ', し: 'じ', す: 'ず', せ: 'ぜ', そ: 'ぞ', た: 'だ', ち: 'ぢ', つ: 'づ', て: 'で', と: 'ど', は: 'ば', ひ: 'び', ふ: 'ぶ', へ: 'べ', ほ: 'ぼ' };
const HANDAKU = { は: 'ぱ', ひ: 'ぴ', ふ: 'ぷ', へ: 'ぺ', ほ: 'ぽ' };
const UNVOICE = {}; for (const [a, b] of Object.entries(VOICE)) UNVOICE[b] = a; for (const [a, b] of Object.entries(HANDAKU)) UNVOICE[b] = a;

function baseReadings(ch) {
  const k = KDB[ch]; if (!k) return [];
  const s = new Set();
  k.on.forEach(o => s.add(kata2hira(o)));
  k.kun.forEach(u => s.add(u.split('.')[0]));
  return [...s].filter(Boolean);
}
function soundVariants(r) {
  const out = new Set([r]);
  if (VOICE[r[0]]) out.add(VOICE[r[0]] + r.slice(1));
  if (HANDAKU[r[0]]) out.add(HANDAKU[r[0]] + r.slice(1));
  for (const v of [...out]) {
    if (v.length >= 2 && 'つちくきう'.includes(v[v.length - 1])) out.add(v.slice(0, -1) + 'っ');
    if (v.endsWith('ゅう')) out.add(v.slice(0, -1) + 'っ');
  }
  return [...out];
}

(function parseKanji() {
  for (const g of GRADES) {
    GK[g] = [];
    for (const line of KRAW[g].split('\n')) {
      const ln = line.trim();
      if (!ln || ln[0] === '#') continue;
      const [k, on, kun, mean, items] = splitN(ln, 4);
      const e = { k, g, on: on ? on.split('・') : [], kun: kun ? kun.split('・') : [], mean, items: [], sc: (STROKES[k] || []).length };
      items.split('/').forEach((it, i) => {
        const m = it.match(ITEM_RE); if (!m) return;
        const q = { id: 'db_' + k + '_' + i, src: 'db', g, k, pre: m[1], target: m[2], yomi: m[3], post: m[4], meaning: mean };
        e.items.push(q); ITEMS.push(q);
      });
      KDB[k] = e; GK[g].push(k);
    }
  }
  for (const line of KREF.split('\n')) {
    if (!line) continue;
    const [k, g, on, kun, sc] = line.split('|');
    KDB[k] = { k, g: +g, on: on ? on.split('・') : [], kun: kun ? kun.split('・') : [], mean: '', items: [], sc: +sc, ref: true };
  }
  for (const k in KDB) {
    for (const r of baseReadings(k)) for (const v of soundVariants(r)) {
      if (!READVAR.has(v)) READVAR.set(v, new Set());
      READVAR.get(v).add(k);
    }
  }
})();

function partName(p, idx, len) { if (p === '阝') return idx === len - 1 ? 'おおざと' : 'こざとへん'; return PART_NAME[p] || ''; }
(function parseParts() {
  for (const line of PRAW.split('\n')) {

  for (let j = i + 1; j < SM.length; j++) if (meanDist(d, SM[j].pts) < thr) return { ok: false, reason: 'order', j };

/* ---- 手書きパッド ---- */
class Pad {
  /** host にパッドを作る。cells:マス数 / chars:答えの文字（かなのマスは色を変える） */
  constructor(host, o = {}) {
    this.host = host; this.n = o.cells || 1; this.chars = o.chars || [];
    this.max = o.max || 168; this.onStroke = o.onStroke || null; this.grid = o.grid !== false;
    this.ink = o.ink || '#3EF0E0'; this.strokes = []; this.cur = null; this.frozen = false;
    const el = document.createElement('div'); el.className = 'pad';
    el.innerHTML = (o.under || '') + (this.grid ? `<div class="cells">${Array.from({ length: this.n }, (_, i) => `<div class="cell${this.chars[i] && !isKanji(this.chars[i]) ? ' kana' : ''}"></div>`).join('')}</div>` : '') + '<div class="model"></div><canvas aria-label="ここに書きます"></canvas>';
    host.appendChild(el);
    this.el = el; this.cv = $('canvas', el); this.ctx = this.cv.getContext('2d'); this.modelEl = $('.model', el);
    this.layout();
    this._ro = new ResizeObserver(() => this.layout()); this._ro.observe(host);
    const cv = this.cv;
    cv.addEventListener('pointerdown', e => this.down(e));
    cv.addEventListener('pointermove', e => this.move(e));
    cv.addEventListener('pointerup', e => this.up(e));
    cv.addEventListener('pointercancel', e => this.up(e));
    cv.addEventListener('contextmenu', e => e.preventDefault());
  }
  layout() {
    const w = this.host.clientWidth || 300;
    const cell = Math.floor(Math.min(this.max, (w - 4) / this.n));
    if (cell === this.cell) return;
    this.cell = cell;
    this.el.style.width = cell * this.n + 'px'; this.el.style.height = cell + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    this.cv.width = cell * this.n * dpr; this.cv.height = cell * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.redraw();
    if (this.onLayout) this.onLayout(cell);
  }
  pos(e) { const r = this.cv.getBoundingClientRect(); return [clamp((e.clientX - r.left) / r.width, 0, 1), clamp((e.clientY - r.top) / r.height, 0, 1)]; }
  down(e) {
    if (this.frozen) return;

  }
  move(e) {

  }

  }

  redraw() {
    const c = this.ctx; c.clearRect(0, 0, this.W(), this.cell);

  clear() { this.strokes = []; this.redraw(); }
  freeze(v = true) { this.frozen = v; this.el.classList.toggle('frozen', v); }
  isEmpty() { return this.strokes.length === 0; }
  cellOf(st) { const cx = st.pts.reduce((s, p) => s + p[0], 0) / st.pts.length; return clamp(Math.floor(cx * this.n), 0, this.n - 1); }
  counts() { const c = Array(this.n).fill(0); this.strokes.forEach(st => c[this.cellOf(st)]++); return c; }
  /** マスの中の 0〜109 座標に変換 */
  to109(st, cellIdx = 0) { return st.pts.map(([x, y]) => [(x * this.n - cellIdx) * 109, y * 109]); }
  /** お手本を うすく表示。until:各字 何画目まで */
  showModel(chars, o = {}) {
    this.modelEl.innerHTML = chars.map(ch => {
      if (STROKES[ch]) return `<div>${kvgSVG(ch, { color: o.color || 'rgba(255,255,255,.28)', width: 5, until: o.until ? Math.ceil(STROKES[ch].length * o.until) : null })}</div>`;
      return `<div><span class="txt" style="font-size:${Math.round(this.cell * .7)}px">${o.until ? '' : esc(ch)}</span></div>`;
    }).join('');
  }
  hideModel() { this.modelEl.innerHTML = ''; }
  destroy() { if (this._ro) this._ro.disconnect(); }
}

/* ---------------- 学ぶ はんい ---------------- */
function poolOf(g) {

function groupsOf(pool) {

  for (let i = 0; i < cs.length; i += size) { const part = cs.slice(i, i + size); out.push({ label: `${i + 1}〜${i + part.length}（${part[0]}〜${part[part.length - 1]}）`, chars: part }); }

/* ---------------- 読みの分け方（熟語 → 1字ずつ） ---------------- */
function segment(target, yomi) {
  const chars = [...target]; const res = [];
  const rec = (ci, pos) => {
    if (ci === chars.length) return pos === yomi.length;
    const c = chars[ci];
    if (!isKanji(c)) { if (yomi.startsWith(c, pos)) { res.push(c); if (rec(ci + 1, pos + 1)) return true; res.pop(); } return false; }
    if (!KDB[c]) return false;
    const cands = new Set(); baseReadings(c).forEach(r => soundVariants(r).forEach(v => cands.add(v)));
    for (const v of [...cands].sort((a, b) => b.length - a.length)) {
      if (v && yomi.startsWith(v, pos)) { res.push(v); if (rec(ci + 1, pos + v.length)) return true; res.pop(); }
    }
    return false;
  };
  return rec(0, 0) ? res.slice() : null;
}
/** よくある 読みまちがい（にごる・小さい っ・のばす音） */
function tweaks(y) {
  const out = new Set();
  for (let i = 0; i < y.length; i++) {
    const c = y[i];
    if (VOICE[c] && i > 0) out.add(y.slice(0, i) + VOICE[c] + y.slice(i + 1));
    if (UNVOICE[c]) out.add(y.slice(0, i) + UNVOICE[c] + y.slice(i + 1));
  }
  if (y.includes('っ')) { out.add(y.replace('っ', 'つ')); out.add(y.replace('っ', '')); }
  else for (let i = 0; i < y.length - 1; i++) if ('くきつち'.includes(y[i])) out.add(y.slice(0, i) + 'っ' + y.slice(i + 1));
  const lv = /([おこそとのほもよろごぞどぼぽょゅ])う/;
  if (lv.test(y)) out.add(y.replace(lv, '$1'));
  else { const m = y.search(/[こそとほもよろょゅ]/); if (m >= 0 && m < y.length) out.add(y.slice(0, m + 1) + 'う' + y.slice(m + 1)); }
  if (/[ゃゅょ]/.test(y)) out.add(y.replace(/[ゃゅょ]/, c => ({ ゃ: 'や', ゅ: 'ゆ', ょ: 'よ' }[c])));
  out.delete(y);
  return [...out].filter(okKana);

/** ありえない かなの ならび（「っ」で始まる など）を のぞく */
function okKana(v) {
  if (/^[っゃゅょー]/.test(v) || /っ$/.test(v)) return false;
  for (let i = 0; i < v.length - 1; i++) if (v[i] === 'っ' && !'かきくけこさしすせそたちつてとぱぴぷぺぽがぎぐげござじずぜぞだぢづでどばびぶべぼ'.includes(v[i + 1])) return false;
  return true;
}
function uniqPush(arr, v, bad) { if (v && !arr.includes(v) && !bad(v)) arr.push(v); }

/** 読みクイズの選択肢 */
function makeYomiChoices(q, diff) {
  const n = diff === 'easy' ? 3 : 4;
  const bad = v => v === q.yomi || WORDSET.has(q.target + '|' + v) || !/^[ぁ-ゖー]+$/.test(v) || !okKana(v);
  const near = [], tw = tweaks(q.yomi), far = [];
  const cs = [...q.target];
  if (cs.length === 1 && KDB[q.target]) baseReadings(q.target).forEach(r => uniqPush(near, r, bad));
  const seg = segment(q.target, q.yomi);
  if (seg) cs.forEach((c, i) => { if (!KDB[c]) return; baseReadings(c).forEach(r => { if (r !== seg[i]) { const alt = seg.slice(); alt[i] = r; uniqPush(near, alt.join(''), bad); } }); });
  const L = q.yomi.length;
  shuffle(ITEMS).slice(0, 300).forEach(it => { if (Math.abs(it.yomi.length - L) <= 1) uniqPush(far, it.yomi, bad); });
  const opts = [];
  const take = (src, k) => { for (const v of shuffle(src)) { if (opts.length >= n - 1 || k <= 0) break; if (!opts.includes(v)) { opts.push(v); k--; } } };
  if (diff === 'hard') { take(near, 2); take(tw, 3); take(near, 3); take(far, 3); }
  else if (diff === 'normal') { take(near, 2); take(tw, 1); take(far, 3); take(near, 3); take(tw, 3); }
  else { take(far, 1); take(near, 1); take(far, 3); take(tw, 3); }

/** 漢字クイズの選択肢（同じ読み・にた形の字を 入れかえる） */
function makeKanjiChoices(q, diff, maxG) {
  const t = [...q.target];

  const myParts = PARTS_OF[focus] || [];

  if (PARTS_OF[focus]) PARTS_OF[focus].forEach(p => ok(p) && look.push(p));
  const sc = KDB[focus].sc;
  (GK[KDB[focus].g] || APPK).forEach(c => { if (ok(c) && Math.abs(KDB[c].sc - sc) <= 2) rand.push(c); });

/* ---------------- 漢字たし算 ---------------- */
function partsPool(pool, chars) {
  const set = new Set(chars || pool.chars);
  let list = PARTS.filter(e => set.has(e.k));
  if (list.length < 6 && typeof pool.grade === 'number') list = PARTS.filter(e => KDB[e.k].g <= pool.grade);
  return list;
}
function makePartsQ(e, diff, maxG) {
  const reverse = diff === 'hard' ? Math.random() < .6 : diff === 'normal' ? Math.random() < .3 : false;
  const n = diff === 'easy' ? 3 : 4;

    const share = PARTS.filter(x => x.k !== e.k && KDB[x.k].g <= Math.max(maxG, KDB[e.k].g) && x.parts.some(p => e.parts.includes(p))).map(x => x.k);
    const others = PARTS.filter(x => x.k !== e.k && KDB[x.k].g <= Math.max(maxG, KDB[e.k].g)).map(x => x.k);
    const opts = [];
    for (const c of shuffle(diff === 'easy' ? others : share)) { if (opts.length >= n - 1) break; if (!opts.includes(c)) opts.push(c); }
    for (const c of shuffle(others)) { if (opts.length >= n - 1) break; if (!opts.includes(c)) opts.push(c); }

/* ---------------- 熟語メーカー ---------------- */

  const partners = [...new Set(words.map(w => w.w[0] === c ? w.w[1] : w.w[0]))];
  const tiles = partners.slice();
  const pool = Object.keys(KDB).filter(x => KDB[x].g <= maxG && x !== c && !W2SET.has(x + c) && !W2SET.has(c + x));
  for (const x of shuffle(pool)) { if (tiles.length >= 8) break; if (!tiles.includes(x)) tiles.push(x); }
  return { c, words, tiles: shuffle(tiles), found: [] };
}

/* ---------------- セッション ---------------- */
function startMode(mode, g, setup) {
  const pool = poolOf(g); let items = [];
  const chars = () => priority(charsIn(pool, setup.range));
  if (mode === 'trace') items = chars().slice(0, setup.count).map(k => ({ kind: 'trace', k }));
  else if (mode === 'qy' || mode === 'qk' || mode === 'write' || mode === 'yomi') items = questionsFor(pool, setup).map(q => ({ kind: mode, q }));
  else if (mode === 'parts') items = shuffle(partsPool(pool, charsIn(pool, setup.range))).slice(0, setup.count).map(e => ({ kind: 'parts', e }));
  else if (mode === 'jukugo') {
    let cs = chars().filter(c => wordsWith(c, pool.grade).length >= 2);
    if (!cs.length) cs = priority(pool.chars).filter(c => wordsWith(c, pool.grade).length >= 2);
    items = cs.slice(0, setup.count).map(c => ({ kind: 'jukugo', c }));
  } else if (mode === 'boss') items = bossItems(pool, setup);
  if (!items.length) { toast('この はんいでは 問題が 作れません。はんいを かえてみよう'); return; }
  startSession(mode, pool, setup, items);
}
function bossItems(pool, setup) {

      $('#after', st).innerHTML = `<div class="explain">${sentHTML(q, 'ruby')}${q.k ? '<hr style="border:0;border-top:1px dashed var(--line);margin:10px 0">' + kanjiCardHTML(q.k) : ''}</div>${ok ? '' : reasonHTML()}${nextBtn()}`;

      $$('.judge button', st).forEach(b => b.onclick = () => {

/* なぞり書き（1画ずつ チェック） */
R.trace = (it, st) => {
  const ch = it.k; const k = KDB[ch]; const diff = SES.setup.diff;
  const N = (STROKES[ch] || []).length;
  st.innerHTML = `<div class="qhead">${modeName(it)}</div>
    <div class="row" style="justify-content:center;gap:16px"><span class="kj" style="font-size:2.2em">${ch}</span><span class="small muted" style="text-align:left">${k.on.map(esc).join('・')}${k.on.length && k.kun.length ? ' ／ ' : ''}${k.kun.map(okuriHTML).join('・')}<br>${esc(k.mean)} ・ ${N}画</span></div>
    <div id="padhost" style="max-width:380px;margin:0 auto"></div>
    <div class="trace-msg" id="tmsg">${diff === 'hard' ? 'お手本なし！ 1画目から 書いてみよう' : '光っている ところを、番号の じゅんに なぞろう'}</div>
    <div class="tools"><button class="tool" id="show">▶ 書き順を 見る</button><button class="tool" id="redo">↺ さいしょから</button><button class="tool" id="spk">🔊</button></div>
    <div id="after"></div><div class="stamp" id="stamp"></div>`;
  const guide = diff === 'hard' ? '' : kvgSVG(ch, { cls: 'guide g-ghost', color: 'rgba(255,255,255,.16)', width: 7, nums: diff === 'easy', numColor: 'rgba(255,210,63,.8)' });
  const done = `<svg viewBox="0 0 109 109" class="guide g-done"><g fill="none" stroke="#3EF0E0" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"></g><g class="g-next" fill="none" stroke="#FFD23F" stroke-width="7" stroke-linecap="round" opacity=".55"></g><circle class="g-start" r="3.2" fill="#FF5A3C" opacity="0"/></svg>`;
  const pad = new Pad($('#padhost', st), { cells: 1, max: 360, under: guide + done, ink: '#E8ECFF' }); PADS.push(pad);
  let i = 0, miss = 0, missHere = 0, finished = false, practice = false;
  const doneG = $('.g-done g', st), nextG = $('.g-next', st), startDot = $('.g-start', st);
  const P = STROKES[ch] || [];
  const showNext = () => {
    nextG.innerHTML = ''; startDot.setAttribute('opacity', 0);
    if (diff !== 'easy' || i >= N) return;
    nextG.innerHTML = `<path d="${P[i]}"/>`;
    const [x, y] = strokeStart(P[i]); startDot.setAttribute('cx', x); startDot.setAttribute('cy', y); startDot.setAttribute('opacity', 1);
  };
  const reset = () => { if (finished) practice = true; i = 0; miss = 0; missHere = 0; finished = false; doneG.innerHTML = ''; pad.clear(); pad.freeze(false); $('#after', st).innerHTML = ''; showNext(); };
  showNext();
  const msg = (t, cls) => { const m = $('#tmsg', st); m.textContent = t; m.className = 'trace-msg ' + (cls ? 'feedback ' + cls : ''); };
  pad.onStroke = s => {
    if (finished) return;
    const r = judgeStroke(ch, i, pad.to109(s), diff === 'hard');
    pad.strokes = []; pad.redraw();
    if (r.ok) {
      beep('stroke');
      doneG.insertAdjacentHTML('beforeend', `<path d="${P[i]}"/>`);
      i++; missHere = 0;
      if (i >= N) return complete();
      msg(`${i}画目 OK！ つぎは ${i + 1}画目`, 'ok'); showNext();
    } else {
      miss++; missHere++;
      const t = r.reason === 'rev' ? '書く むきが はんたいかも！ 赤い点から 書き始めよう'
        : r.reason === 'order' ? `書き順に 注意！ いまは ${i + 1}画目だよ`
          : r.reason === 'short' ? 'もう少し 長く 書こう' : 'おしい！ もう一度';
      msg(t, 'ng');
      if (missHere >= 2) {
        nextG.innerHTML = `<path d="${P[i]}"/>`;
        const [x, y] = strokeStart(P[i]); startDot.setAttribute('cx', x); startDot.setAttribute('cy', y); startDot.setAttribute('opacity', 1);
        const p = $('path', nextG); if (p && p.animate && !calm()) { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: 700, fill: 'forwards' }); }
      }
    }
  };
  const complete = () => {
    finished = true; pad.freeze(); showNext();
    if (practice) { msg(miss === 0 ? 'パーフェクト！ よく 覚えたね' : `できた！（ミス ${miss}回）`, 'ok'); $('#after', st).innerHTML = nextBtn(); return; }
    const res = miss === 0 ? 'ok' : miss <= 3 ? 'ok' : 'half';
    msg(miss === 0 ? '書き順 パーフェクト！' : miss <= 3 ? `できた！（ミス ${miss}回）` : `さいごまで 書けたね（ミス ${miss}回）。もう一度 ためしてみよう`, miss <= 3 ? 'ok' : 'half');
    finishItem(res, { kanji: [ch], xp: miss === 0 ? 12 : miss <= 3 ? 8 : 4, anchor: $('#tmsg', st) });
    if (miss === 0) showStamp('ok');
    $('#after', st).innerHTML = nextBtn();
  };
  $('#redo', st).onclick = () => reset();
  $('#spk', st).onclick = () => speak([...k.kun.map(u => u.replace('.', '')), ...k.on.map(kata2hira)].slice(0, 3).join('、'));
  $('#show', st).onclick = () => {
    const svg = document.createElement('div');
    svg.innerHTML = kvgSVG(ch, { cls: 'guide', nums: true, width: 5 });
    const s = svg.firstChild; $('.pad', st).appendChild(s);
    animateStrokes(s, { onDone: () => later(() => s.remove(), 700) });
  };
};

/* 熟語メーカー */
R.jukugo = (it, st) => {
  const diff = SES.setup.diff; const maxG = SES.pool.grade;
  const rd = makeJukugoRound(it.c, maxG, diff);
  let given = false; let showY = diff === 'easy';
  const draw = () => {
    const left = rd.words.filter(w => !rd.found.includes(w.w));
    st.innerHTML = `<div class="qhead">${modeName(it)}</div>
      <p class="muted small">まん中の 漢字と つなげて、熟語（2字の 言葉）を つくろう。タイルを えらぶと、前と うしろの どちらでも ためすよ。</p>
      <div class="jk-center"><div class="jk-slot" id="sl">？</div><div class="jk-slot c">${rd.c}</div><div class="jk-slot" id="sr">？</div></div>
      <p><b>かくれた熟語 ${rd.found.length} / ${rd.words.length}</b>${showY && left.length ? `<span class="small muted">　さがす読み：${left.map(w => esc(w.yomi)).join('・')}</span>` : ''}</p>
      <div class="jk-tiles">${rd.tiles.map(x => `<button class="jk-tile${rd.used && rd.used.includes(x) ? ' used' : ''}" data-x="${x}" ${given || (rd.used && rd.used.includes(x)) ? 'disabled' : ''}>${x}</button>`).join('')}</div>
      <div class="jk-found">${rd.found.map(w => `<span>${w}<small>${esc(W2SET.get(w).yomi)}</small></span>`).join('')}</div>
      <div class="tools">${!showY && !given ? '<button class="tool" id="yh">💡 読みを 見る</button>' : ''}${!given && left.length ? '<button class="tool" id="give">こたえを 見る</button>' : ''}</div>
      <div class="feedback" id="fb"></div><div id="after"></div><div class="stamp" id="stamp"></div>`;
    const yh = $('#yh', st); if (yh) yh.onclick = () => { showY = true; draw(); };
    const gv = $('#give', st); if (gv) gv.onclick = () => { given = true; finishRound(); };
    $$('.jk-tile', st).forEach(b => b.onclick = () => {
      const x = b.dataset.x; const cands = [x + rd.c, rd.c + x].filter(w => W2SET.has(w) && W2SET.get(w).g <= Math.max(maxG, KDB[rd.c].g));
      if (cands.length) {
        beep('ok'); rd.used = (rd.used || []).concat(x);
        cands.forEach(w => { if (!rd.found.includes(w)) { rd.found.push(w); if (!rd.words.some(v => v.w === w)) rd.words.push(W2SET.get(w)); } });
        addPoints(8, b);
        const first = cands[0];
        draw();
        $('#sl', st).textContent = first[0] === rd.c ? '' : first[0];
        $('#sr', st).textContent = first[1] === rd.c ? '' : first[1];
        $('#fb', st).className = 'feedback ok'; $('#fb', st).textContent = cands.map(w => `${w}（${W2SET.get(w).yomi}）`).join('　') + ' ができた！';
        if (rd.words.every(w => rd.found.includes(w.w))) finishRound();
      } else {
        beep('ng'); b.classList.add('shake'); setTimeout(() => b.classList.remove('shake'), 400);
        $('#fb', st).className = 'feedback ng'; $('#fb', st).textContent = `「${x}${rd.c}」も「${rd.c}${x}」も、この ゲームの 熟語には ないよ`;
      }
    });
  };
  const finishRound = () => {
    const all = rd.words.length, f = rd.found.length;
    const res = f >= 1 ? 'ok' : 'half';
    $$('.jk-tile', st).forEach(b => b.disabled = true);
    finishItem(res, { kanji: [rd.c], xp: f === all ? 5 : 0, combo: false });
    const miss = rd.words.filter(w => !rd.found.includes(w.w));
    $('#after', st).innerHTML = `<div class="explain"><b>${f === all ? 'ぜんぶ 見つけた！' : `${f} / ${all} 見つけたよ`}</b>
      ${miss.length ? `<p class="small" style="margin:6px 0 0">のこりの 熟語：${miss.map(w => `<span class="kj" style="font-size:1.3em">${w.w}</span>（${esc(w.yomi)}）`).join('　')}</p>` : ''}
      ${(rd.words.find(w => w.q) || {}).q ? `<p class="small muted" style="margin:6px 0 0">例：${sentHTML(rd.words.find(w => w.q).q, 'ruby')}</p>` : ''}</div>${nextBtn()}`;
  };
  draw();
};

/* ---------------- 結果・ふりかえり ---------------- */
function finishSession(quit) {
  if (!SES || SES.done) return;
  SES.done = true; SES.quit = !!quit;
  if (SES.mode === 'boss') {
    const g = SES.pool.grade; const win = SES.hp <= 0.5;
    const b = S.boss[g] || (S.boss[g] = { win: 0, tries: 0 });
    b.tries++;
    if (win) { const first = !b.win; b.win++; addPoints(first ? 200 : 100); SES.xp += first ? 200 : 100; SES.bossWin = true; }
  }
  if (SES.mode === 'diag') {
    const sc = SES.res.filter(r => r === 'ok').length;
    const lv = sc <= 4 ? 1 : sc <= 6 ? 2 : sc <= 8 ? 3 : 4;
    S.diag[SES.pool.g] = { score: sc, lv, ts: Date.now() }; SES.diagLv = lv; SES.diagScore = sc;
  }
  save(); checkBadges();
  go('result', {}, { replace: true });
}

      <div class="panel"><h3>せってい</h3>
        <div class="field"><label for="nm">ニックネーム（あいさつに 出ます）</label><input class="inp" id="nm" maxlength="12" value="${esc(S.name)}" placeholder="なくても だいじょうぶ"></div>
        <div class="chips">${sw('sound', '効果音')}${sw('speech', 'よみあげ')}${sw('big', '文字を 大きく')}${sw('calm', 'うごきを へらす')}</div>
      </div>
      <div class="panel" style="margin-top:16px"><h3>このアプリの 使い方</h3>
        <ul class="rlist small">
          <li><b>5つの レベル</b>：LV1 しる・なぞる → LV2 えらぶ → LV3 かく → LV4 つかう → LV5 ためす。子どもが 自分で えらべます。迷ったら「レベル診断」（10問）で おすすめが 出ます。</li>
          <li><b>むずかしさ・はんい・めあて</b>を 毎回 自分で えらびます。終わりに めあての ふりかえりを 書けます（きろくに たまります）。</li>
          <li><b>★マスター</b>：字ごとに ★0〜5。クイズで★2、書き取りで★4まで、ヒントなしの「むずかしい」書き取りか ボスバトルで★5に なります。まちがえると「にがて」に 入り、2回つづけて 正解すると 外れます。少し時間を あけた ふくしゅうも 自動で 出ます。</li>
          <li><b>書き取りは 自己採点</b>：お手本の かさね表示・書き順・画数の くらべを 見て、◎○✕を 自分で えらびます。「✕」にも ポイントが 入るので、正直に つけるほど 得を します。</li>
          <li><b>なぞり書き</b>は 1画ずつ、むき・書き順・形を 自動で チェックします（むずかしいは お手本なし）。</li>
          <li><b>セットを 配る</b>：漢字ずかんで「えらんで練習」→ 字を えらんで「リンクを コピー」。リンクを ひらいた子は、その字だけで 全モードを 練習できます。</li>
          <li><b>プリント</b>：学年の画面の「プリントを 作る」で、書き取りテスト（答えつき）を 印刷できます。</li>
          <li><b>3つの アプリ</b>：1・2年／3・4年／5・6年に 分かれています（これは ${APP.title}）。同じサイトに 置けば、コイン・ペット・きろく・バッジは 3つの アプリで 共通です。</li>
          <li><b>1〜3年の「先生の問題」</b>は、これまでの 問題を そのまま 入れています。前の バージョンの コイン・進み具合も 引きついでいます。</li>
        </ul>
      </div>
      <div class="panel" style="margin-top:16px"><h3>データの バックアップ</h3>
        <p class="small muted">きろくは この たんまつの ブラウザに 保存されます。たんまつを かえる時や、ブラウザの データを 消す前に、コードで 保存して ください。</p>
        <div class="row"><button class="btn sm ghost" data-act="bkmake">バックアップコードを つくる</button><button class="btn sm dark" data-act="bkfile">ファイルに 保存</button></div>
        <div id="bk-out" style="margin-top:8px"></div>
        <textarea class="inp" id="bk-in" placeholder="バックアップコードを はりつけて「もどす」" style="margin-top:10px"></textarea>
        <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn sm" data-act="bkload">この コードで もどす</button></div>
      </div>
      <div class="panel" style="margin-top:16px"><h3>データを 消す</h3><p class="small muted">コイン・ペット・すべての きろくが 消えます。元に もどせません。</p><button class="btn sm shu" data-act="reset">すべての データを 消す</button></div>
      <p class="foot">書き順：<a href="https://kanjivg.tagaini.net/" target="_blank" rel="noopener">KanjiVG</a> © Ulrich Apel（<a href="https://creativecommons.org/licenses/by-sa/3.0/deed.ja" target="_blank" rel="noopener">CC BY-SA 3.0</a>）のデータを もとに 作成しています。書き順は 教科書と 一部 ちがう場合が あります。<br>熟語・読みの チェックに <a href="https://www.edrdg.org/jmdict/j_jmdict.html" target="_blank" rel="noopener">JMdict</a>（EDRDG, CC BY-SA 4.0）を 使っています。<br>読み・例文は 小学校の 配当漢字（2020年度〜）に もとづいています。</p>
    </div>`;
  },
  mount() { $('#nm').oninput = e => { S.name = e.target.value.trim(); save(); }; }
};
ACT.setsw = t => { const k = t.dataset.k; S.set[k] = !S.set[k]; applySettings(); save(); render(); };
function applySettings() { document.documentElement.classList.toggle('big', !!S.set.big); document.documentElement.classList.toggle('calm', !!S.set.calm); }
function backupCode() { return 'KQB1:' + b64enc(JSON.stringify({ at: Date.now(), prog: lsGet(LS.prog), pts: String(points), v4: JSON.stringify(S) })); }
ACT.bkmake = () => { save(true); const c = backupCode(); $('#bk-out').innerHTML = `<code class="share">${esc(c)}</code><button class="btn sm" style="margin-top:6px" data-act="bkcopy">コピー</button>`; $('#bk-out').dataset.code = c; };
ACT.bkcopy = async () => { const ok = await copyText($('#bk-out').dataset.code); toast(ok ? 'コピーしました' : 'コードを 長おしして コピーしてね'); };
ACT.bkfile = () => { save(true); const blob = new Blob([backupCode()], { type: 'text/plain' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `kanji-quest-backup-${today()}.txt`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
ACT.bkload = async () => {
  const raw = $('#bk-in').value.trim();
  let o; try { if (!raw.startsWith('KQB1:')) throw 0; o = JSON.parse(b64dec(raw.slice(5))); if (!o || !o.v4) throw 0; JSON.parse(o.v4); } catch (e) { toast('コードが 読めませんでした'); return; }
  if (!await ask('この コードで もどす？', `${new Date(o.at).toLocaleString('ja-JP')} の データに おきかわります。いまの データは 消えます。`, 'もどす', 'やめる')) return;
  if (o.prog != null) lsSet(LS.prog, o.prog); lsSet(LS.pts, o.pts || '0'); lsSet(LS.v4, o.v4);
  location.reload();
};
ACT.reset = () => {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><h2>すべての データを 消す</h2><p class="small muted">本当に 消す時は、下に「けす」と 入力して ください。</p><input class="inp" id="rs-in"><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn dark" data-act="closemodal">やめる</button><button class="btn shu" id="rs-ok">消す</button></div></div>`;
  document.body.appendChild(bg);
  $('#rs-ok', bg).onclick = () => {
    if ($('#rs-in', bg).value.trim() !== 'けす') { toast('「けす」と 入力して ください'); return; }
    [LS.prog, LS.pts, LS.v4].forEach(k => { try { localStorage.removeItem(k); } catch (e) { } });
    location.reload();
  };
};

/* ---------------- プリント ---------------- */
ACT.print = t => {
  const g = t.dataset.g === 'my' ? 'my' : +t.dataset.g; const pool = poolOf(g);
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  const groups = groupsOf(pool); const units = unitsOf(pool);
  bg.innerHTML = `<div class="modal"><h2>🖨️ プリントを 作る</h2><p class="small muted">${esc(pool.title)} の 書き取りテスト（2ページめに 答え）</p>
    <div class="field"><label for="pr-r">はんい</label><select class="sel" id="pr-r"><option value="all">ぜんぶから</option><option value="ng">にがての字</option>${groups.map((gr, i) => `<option value="g${i}">${esc(gr.label)}</option>`).join('')}${units.map(u => `<option value="u:${esc(u)}">先生の問題：${esc(u)}</option>`).join('')}</select></div>
    <div class="field"><label for="pr-n">問題数</label><select class="sel" id="pr-n"><option>10</option><option selected>15</option><option>20</option></select></div>
    <div class="row" style="justify-content:flex-end"><button class="btn dark" data-act="closemodal">やめる</button><button class="btn" id="pr-go">印刷する</button></div></div>`;
  document.body.appendChild(bg);
  $('#pr-go', bg).onclick = () => {
    const v = $('#pr-r', bg).value, n = +$('#pr-n', bg).value;
    const range = v === 'all' ? { type: 'all' } : v === 'ng' ? { type: 'ng' } : v[0] === 'g' ? { type: 'group', i: +v.slice(1) } : { type: 'unit', unit: v.slice(2) };
    let qs = questionsFor(pool, { range, count: n, order: 'rand' });
    if (!qs.length) { toast('問題が ありません'); return; }
    bg.remove(); printSheet(pool, qs);
  };
};
function printSheet(pool, qs) {
  const boxes = q => [...q.target].map(c => `<span class="pp-box">${isKanji(c) ? '<span class="b"></span>' : `<span style="font-size:15pt;padding:0 1mm">${esc(c)}</span>`}</span>`).join('');
  const head = sub => `<div class="pp-head"><div><b style="font-size:16pt">${esc(pool.title)} 漢字テスト</b> <span>${sub}</span></div><div>名前 ＿＿＿＿＿＿＿＿＿　　　／${qs.length}</div></div>`;
  const page1 = `<div class="pp-page">${head('（ ）の 読みの 漢字を 書きましょう')}${qs.map((q, i) => `<div class="pp-q"><span class="no">${i + 1}</span><span>${esc(q.pre)}</span><span style="display:inline-flex;flex-direction:column;align-items:center"><span class="r" style="font-size:10pt">${esc(q.yomi)}</span><span>${boxes(q)}</span></span><span>${esc(q.post)}</span></div>`).join('')}</div>`;
  const page2 = `<div class="pp-page">${head('答え')}${qs.map((q, i) => `<div class="pp-q"><span class="no">${i + 1}</span><span>${esc(q.pre)}<b class="pp-ans">${esc(q.target)}</b>${esc(q.post)}（${esc(q.yomi)}）</span></div>`).join('')}<p style="font-size:9pt;margin-top:8mm">むん先生の学習クエスト 漢字クエスト</p></div>`;
  $('#print-area').innerHTML = page1 + page2;
  setTimeout(() => window.print(), 100);
}

/* ---------------- 起動 ---------------- */
function readHash() {
  const h = location.hash.slice(1); if (!h) return false;
  const p = new URLSearchParams(h); const set = p.get('set');
  if (!set) return false;
  const chars = [...new Set([...set].filter(own))].slice(0, 200);
  history.replaceState(null, '', location.pathname + location.search);
  if (!chars.length) { setTimeout(() => toast(`この リンクの 字は ${APP.title}の アプリには ありません`, 3500), 600); return false; }
  S.mySet = { title: (p.get('t') || '先生からの セット').slice(0, 30), chars, ts: Date.now() }; save();
  toast(`「${S.mySet.title}」（${chars.length}字）を 読みこみました`);
  return true;
}
/** 前のバージョンで クリアした問題を ★に うつす（1回だけ） */
function migrateLegacy() {
  if (S.mig[APP.id]) return;
  S.mig[APP.id] = Date.now();
  const byId = {}; ORIG.forEach(q => byId[q.id] = q);
  let n = 0;
  const lift = (ids, m) => ids.forEach(id => { const q = byId[id]; if (!q) return; [...q.target].filter(c => KDB[c]).forEach(c => { const s = kset(c); if (s.m < m) { s.m = m; s.d = Date.now() + INTERVAL[m]; n++; } }); });
  lift(legacy.yomi, 1); lift(legacy.kaki, 2);
  save();
  if (n) setTimeout(() => toast(`前の バージョンの きろくを 引きついだよ（${n}字に ★）`, 3500), 800);
}
function onExternalChange() { updateHud(); if (CUR.name !== 'play') render(); }
function boot() {
  applySettings();
  migrateLegacy();
  history.replaceState({ kq: 0 }, '');
  const fromLink = readHash();
  render();
  if (fromLink) go('grade', { g: 'my' });
  window.addEventListener('hashchange', () => { if (readHash()) go('grade', { g: 'my' }); });
}

boot();

</script>
</body>
</html>

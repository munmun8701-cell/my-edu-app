<!-- ゲーム画面 -->
<div id="game-container">
  <canvas id="gameCanvas"></canvas>
  <div id="screen-fx-layer"></div>
  <div id="floating-ui-layer"></div>
</div>

<!-- 上部UI（ステータス＆コントロール） -->
<div id="top-ui" class="ui-layer">
  <div class="glass-panel stats-box pointer-auto">
    <div class="stats-header">
      <div class="mayor-badge">
        <span class="mayor-level" id="mayor-level">Mayor Lv.1</span>
      </div>
      <span id="town-title" class="town-title-badge">🌱 開拓村</span>
    </div>
    <div class="exp-bar-bg">
      <div class="exp-bar-fill" id="exp-bar"></div>
    </div>
    <div class="stats-body">
      <div class="stat-item coin-text">💰 <span id="coin-display">500</span>G</div>
      <div class="stat-item pop-text">👥 <span id="pop-display">0</span></div>
    </div>
    <div class="stats-footer">
      <span id="env-display">🌸 Spring | ☀️ Clear</span>
      <span id="time-display" class="time-text">🕒 Day 1 - 08:00</span>
    </div>
  </div>

  <div class="top-right-controls pointer-auto">
    <div class="glass-panel tool-group">
      <button class="btn-icon active-btn" id="btn-play" title="等倍速">▶️</button>
      <button class="btn-icon" id="btn-fast" title="早送り">⏩</button>
      <button class="btn-icon" id="btn-pause" title="一時停止">⏸️</button>
    </div>
    <div class="glass-panel tool-group">
      <button class="btn-icon" id="btn-achieve" title="実績">🏆</button>
      <button class="btn-icon" id="btn-dict" title="単語帳">📖</button>
      <button class="btn-icon" id="btn-settings" title="設定">⚙️</button>
    </div>
    <div class="glass-panel tool-group">
      <button class="btn-icon" id="btn-zoom-in" title="拡大">➕</button>
      <button class="btn-icon" id="btn-zoom-out" title="縮小">➖</button>
      <button class="btn-icon" id="btn-rotate" title="回転">🔄</button>
    </div>
  </div>
</div>

<!-- 建物の詳細情報ツールチップ -->
<div id="info-panel" class="ui-layer pointer-auto glass-panel tooltip-panel" style="display:none;">
  <h3 id="info-title">建物名</h3>
  <p id="info-desc">詳細情報</p>
  <div id="info-req" class="req-level"></div>
</div>

<!-- 左下UI（クイズパネル） -->
<div id="bottom-left-ui" class="ui-layer pointer-auto">
  <div id="quiz-panel" class="glass-panel main-panel">
    <div id="quiz-menu">
      <div class="panel-header">
        <span class="header-text">✏️ ステージ選択</span>
      </div>
      <div class="stage-grid" id="stage-grid"></div>
    </div>

    <div id="quiz-active" style="display:none;">
      <div class="quiz-header">
        <span id="quiz-progress" class="quiz-badge">Stage 1: Q 1/7</span>
        <button class="btn-danger-small" id="btn-retire">中止</button>
      </div>
      <div id="word-display-container">
        <div id="word-display">Apple</div>
        <div id="combo-display"></div>
      </div>
      <div class="answers-grid" id="answers-grid"></div>
    </div>

    <div id="quiz-result" style="display:none; text-align:center;">
      <div class="result-header">🏁 CLEAR!</div>
      <div class="result-score" id="result-score">7 / 7</div>
      <div class="result-reward-box" id="result-reward">+140G / +50 EXP</div>
      <button class="btn-action" id="btn-next-stage">次へ / 戻る</button>
    </div>
  </div>
</div>

<!-- 右下UI（建築パネル） -->
<div id="build-panel" class="ui-layer pointer-auto glass-panel main-panel">
  <div class="panel-header">
    <span class="header-text">🔨 建築メニュー</span>
    <button class="btn-danger-outline" id="demolish-btn">🚜 取壊しモード</button>
  </div>
  <div class="build-items" id="build-items"></div>
</div>

<!-- 通知エリア -->
<div class="toast-area" id="toast-area"></div>

<!-- モーダル群 -->
<div id="dict-modal" class="modal-overlay">
  <div class="modal-content glass-modal">
    <div class="modal-title">
      <h2>📖 学習済み単語帳</h2><button class="btn-close close-modal-btn">✖</button>
    </div>
    <div class="progress-container">解放状況: <span id="dict-progress">0</span> / 700語</div>
    <div class="word-list" id="dict-list"></div>
  </div>
</div>

<div id="achieve-modal" class="modal-overlay">
  <div class="modal-content glass-modal">
    <div class="modal-title">
      <h2>🏆 実績・ミッション</h2><button class="btn-close close-modal-btn">✖</button>
    </div>
    <div id="achieve-list" class="achieve-list"></div>
  </div>
</div>

<div id="settings-modal" class="modal-overlay">
  <div class="modal-content glass-modal">
    <div class="modal-title">
      <h2>⚙️ 設定</h2><button class="btn-close close-modal-btn">✖</button>
    </div>
    <div class="settings-list">
      <label class="setting-item"><input type="checkbox" id="chk-bgm" checked> <span class="toggle-switch"></span> BGMを再生</label>
      <label class="setting-item"><input type="checkbox" id="chk-se" checked> <span class="toggle-switch"></span> SE・音声</label>
      <label class="setting-item"><input type="checkbox" id="chk-particles" checked> <span class="toggle-switch"></span> 演出(天候/エフェクト)</label>
      <hr class="modal-hr">
      <button class="btn-action" id="btn-export">データ書き出し</button>
      <button class="btn-action" id="btn-import">データ読み込み</button>
      <button class="btn-danger" id="btn-reset-data" style="margin-top:10px;">⚠️ 全データをリセット</button>
    </div>
  </div>
</div>

<div id="custom-modal" class="modal-overlay">
  <div class="modal-content glass-modal" style="max-width: 320px; text-align:center;">
    <h2 style="color:#fca5a5; margin-top:0;">⚠️ 確認</h2>
    <p id="modal-text" style="margin-bottom: 25px;">本当に実行しますか？</p>
    <div style="display: flex; gap: 15px; justify-content: center;">
      <button class="btn-danger" id="modal-yes" style="flex:1;">はい</button>
      <button class="btn-action close-modal-btn" style="flex:1;">いいえ</button>
    </div>
  </div>
</div>

<!-- 初期スタート画面 -->
<div id="start-screen">
  <div class="start-content">
    <h1 class="game-title">English Town Simulator</h1>
    <p class="game-subtitle">Ultimate Edition V3</p>
    <button class="btn-start" id="btn-start-game">Game Start</button>
  </div>
</div>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>算数クエスト</title>
  <style>
    body {
      margin: 0;
      display: flex;
      height: 100vh;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: #f8f4ff; /* ほんのり薄い紫色 */
    }
    #sidebar {
      width: 25%;
      background-color: #eee9ff; /* パステルパープル */
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
      border-right: 3px solid #dcd0ff;
    }
    #content {
      width: 75%;
      height: 100vh;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    h2 {
      text-align: center;
      color: #5e4b8a; /* 濃いめの紫 */
      font-size: 1.2rem;
      margin-bottom: 20px;
    }
    .menu-btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      background-color: white;
      border: 2px solid #a894ff; /* 紫色の枠線 */
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      color: #333;
      font-weight: bold;
      cursor: pointer;
      box-sizing: border-box;
      transition: all 0.2s;
    }
    .menu-btn:hover {
      background-color: #a894ff;
      color: white;
      transform: translateY(-2px);
    }
    .back-btn {
      background-color: #ffb6c1;
      border-color: #ff69b4;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>算数クエスト ⚔️</h2>
    
    <a href="./1-1/index.html" target="content-frame" class="menu-btn">ステージ 1</a>
    <a href="./2-1/index.html" target="content-frame" class="menu-btn">ステージ 2</a>
    <a href="./3-1/index.html" target="content-frame" class="menu-btn">ステージ 3</a>

    <a href="../portal.html" class="menu-btn back-btn">🏠 もどる</a>
  </div>

  <div id="content">
    <iframe name="content-frame" src="./1-1/index.html"></iframe>
  </div>

</body>
</html>

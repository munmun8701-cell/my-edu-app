<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>漢字クエスト一・二年生</title>
    <meta name="viewport" content="width=device-width"><link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">

  <body>
  <!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>漢字クエスト 1・2年｜むん先生の学習クエスト</title>
  <meta name="description" content="小学1・2年の漢字を、書き順チェック・クイズ・書き取り・熟語づくりで、自分のレベルに合わせて学べる無料の漢字学習アプリ。">
  <meta name="theme-color" content="#0B1026">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=M+PLUS+1:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0B1026;
      /* 墨夜：背景 */
      --ink2: #10173A;
      --panel: #141C42;
      /* 盤 */
      --panel2: #1A2352;
      --line: rgba(62, 240, 224, .22);
      --cyan: #3EF0E0;
      /* 電光シアン */
      --cyan-d: #1BB8AA;
      --shu: #FF5A3C;
      /* 朱：はなまる・はんこ */
      --gold: #FFD23F;
      /* マスター */
      --lime: #7CFF6B;
      /* せいかい */
      --violet: #A98BFF;
      --text: #E8ECFF;
      --muted: #8E97C9;
      --dim: #5B6499;
      --r-panel: 16px;
      --r-btn: 12px;
      --f-ui: "M PLUS 1", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
      --f-kanji: "UD Digi Kyokasho N-R", "UD デジタル 教科書体 N-R", "Klee One", "YuKyokasho", "Hiragino Mincho ProN", serif;
      --f-logo: "Orbitron", "M PLUS 1", sans-serif;
      --fs: 17px;
    }

    html.big {
      --fs: 20px
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      padding: 0
    }

    body {
      font-family: var(--f-ui);
      font-size: var(--fs);
      line-height: 1.6;
      color: var(--text);
      background-color: var(--ink);
      background-image:
        radial-gradient(1200px 600px at 85% -10%, rgba(169, 139, 255, .16), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, rgba(62, 240, 224, .10), transparent 60%),
        linear-gradient(rgba(62, 240, 224, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(62, 240, 224, .045) 1px, transparent 1px);
      background-size: auto, auto, 48px 48px, 48px 48px;
      background-attachment: fixed;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
      cursor: pointer
    }

    input,
    textarea,
    select {
      font-family: inherit;
      font-size: 1rem;
      color: var(--text)
    }

    :focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px
    }

    .kj {
      font-family: var(--f-kanji)
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 16px 48px
    }

    .hide {
      display: none !important
    }

    .muted {
      color: var(--muted)
    }

    .small {
      font-size: .85em
    }

    .center {
      text-align: center
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap
    }

    .spacer {
      flex: 1
    }

    /* ---------- header ---------- */
    .top {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(11, 16, 38, .88);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line)
    }

    .top .wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 10px;
      padding-bottom: 10px
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: 0;
      padding: 4px 6px;
      border-radius: 10px;
      text-align: left
    }

    .logo-mark {
      width: 38px;
      height: 38px;
      border: 2px solid var(--cyan);
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-family: var(--f-kanji);
      font-size: 24px;
      color: var(--cyan);
      position: relative;
      box-shadow: 0 0 14px rgba(62, 240, 224, .35)
    }

    .logo-mark::before,
    .logo-mark::after {
      content: "";
      position: absolute;
      background: rgba(62, 240, 224, .25)
    }

    .logo-mark::before {
      left: 50%;
      top: 3px;
      bottom: 3px;
      width: 1px
    }

    .logo-mark::after {
      top: 50%;
      left: 3px;
      right: 3px;
      height: 1px
    }

    .logo-txt b {
      display: block;
      font-family: var(--f-logo);
      font-size: 15px;
      letter-spacing: .08em;
      color: #fff
    }

    .logo-txt>span {
      display: block;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.2
    }

    .logo-g {
      display: inline-block;
      margin-left: 6px;
      font-family: var(--f-ui);
      font-size: 12px;
      font-weight: 900;
      color: #06222a;
      background: var(--cyan);
      border-radius: 6px;
      padding: 0 6px;
      letter-spacing: 0;
      vertical-align: 2px
    }

    .hud {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto
    }

    .hud-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 12px 4px 6px;
      font-weight: 700;
      white-space: nowrap
    }

    .hud-pill .pet {
      font-size: 24px;
      line-height: 1
    }

    .hud-pill .cr {
      font-family: var(--f-logo);
      font-size: 14px;
      color: var(--gold)
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      display: grid;
      place-items: center;
      font-size: 20px
    }

    .icon-btn:hover {
      border-color: var(--cyan)
    }

    /* ---------- common parts ---------- */
    .panel {
      background: linear-gradient(180deg, var(--panel), var(--ink2));
      border: 1px solid var(--line);
      border-radius: var(--r-panel);
      padding: 18px
    }

    h1,
    h2,
    h3 {
      margin: 0;
      line-height: 1.35
    }

    h1 {
      font-size: 1.6em;
      font-weight: 900
    }

    h2 {
      font-size: 1.25em;
      font-weight: 900
    }

    h3 {
      font-size: 1.05em;
      font-weight: 700
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 10px 20px;
      border-radius: var(--r-btn);
      border: 1px solid var(--cyan);
      background: var(--cyan);
      color: #06222a;
      font-weight: 900;
      text-decoration: none;
      transition: transform .08s, box-shadow .15s
    }

    .btn:hover {
      box-shadow: 0 0 18px rgba(62, 240, 224, .45)
    }

    .btn:active {
      transform: translateY(1px)
    }

    .btn.ghost {
      background: transparent;
      color: var(--cyan)
    }

    .btn.shu {
      background: var(--shu);
      border-color: var(--shu);
      color: #fff
    }

    .btn.gold {
      background: var(--gold);
      border-color: var(--gold);
      color: #2a2000
    }

    .btn.dark {
      background: var(--panel2);
      border-color: var(--line);
      color: var(--text)
    }

    .btn.sm {
      min-height: 38px;
      padding: 6px 14px;
      font-size: .9em
    }

    .btn.wide {
      width: 100%
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed;
      box-shadow: none
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel2);
      font-weight: 700
    }

    .chip[aria-pressed="true"] {
      background: rgba(62, 240, 224, .16);
      border-color: var(--cyan);
      color: var(--cyan)
    }

    .back {
      background: none;
      border: 0;
      color: var(--muted);
      font-weight: 700;
      padding: 8px 4px;
      display: inline-flex;
      gap: 6px;
      align-items: center
    }

    .back:hover {
      color: var(--cyan)
    }

    .tag {
      display: inline-block;
      font-size: .75em;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 999px;
      border: 1px solid currentColor
    }

    .stars {
      color: var(--gold);
      letter-spacing: 1px;
      white-space: nowrap
    }

    .stars i {
      font-style: normal;
      color: var(--dim)
    }

    .bar {
      height: 10px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .08);
      overflow: hidden;
      display: flex
    }

    .bar>span {
      display: block;
      height: 100%
    }

    /* 田の字ガイド */
    .tagrid {
      position: relative;
      background: #0A0F2A;
      border: 2px solid rgba(62, 240, 224, .55);
      border-radius: 10px
    }

    .tagrid::before,
    .tagrid::after {
      content: "";
      position: absolute;
      pointer-events: none
    }

    .tagrid::before {
      left: 50%;
      top: 0;
      bottom: 0;
      border-left: 2px dashed rgba(62, 240, 224, .18)
    }

    .tagrid::after {
      top: 50%;
      left: 0;
      right: 0;
      border-top: 2px dashed rgba(62, 240, 224, .18)
    }

    /* ---------- home ---------- */
    .hero {
      display: grid;
      grid-template-columns: minmax(220px, 300px) 1fr;
      gap: 22px;
      align-items: center;
      margin: 22px 0
    }

    .hero-kanji {
      display: block;
      aspect-ratio: 1;
      width: 100%;
      cursor: pointer;
      padding: 0
    }

    .hero-kanji svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%
    }

    .hero-cap {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: .9em;
      color: var(--muted)
    }

    .hero h1 {
      font-size: clamp(1.5em, 3.4vw, 2.2em)
    }

    .hero .lead {
      color: var(--muted);
      margin: 6px 0 16px
    }

    .streak {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px
    }

    .streak .s {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 14px;
      font-weight: 700
    }

    .streak .s b {
      font-size: 1.3em;
      color: var(--gold);
      margin-right: 2px
    }

    .mission {
      display: flex;
      align-items: center;
      gap: 14px;
      border-left: 4px solid var(--shu);
      background: rgba(255, 90, 60, .08);
      border-radius: 12px;
      padding: 12px 14px
    }

    .mission .ic {
      font-size: 30px
    }

    .mission p {
      margin: 0;
      font-weight: 700
    }

    .mission .muted {
      font-weight: 400;
      font-size: .85em
    }

    .sec-h {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 30px 0 12px
    }

    .sec-h .muted {
      font-size: .9em
    }

    .grades {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px
    }

    .grades.g2 {
      grid-template-columns: repeat(2, 1fr)
    }

    .grades.g2 .gtile {
      padding: 18px 20px 16px
    }

    .grades.g2 .gtile .num {
      font-size: 60px
    }

    .applinks {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px
    }

    a.qbtn {
      text-decoration: none
    }

    .gtile {
      color: var(--text);
      position: relative;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r-panel);
      padding: 14px 14px 12px;
      transition: border-color .15s, transform .1s
    }

    .gtile:hover {
      border-color: var(--cyan);
      transform: translateY(-2px)
    }

    .gtile .num {
      font-family: var(--f-logo);
      font-size: 44px;
      font-weight: 900;
      line-height: 1;
      color: #fff
    }

    .gtile .num small {
      font-family: var(--f-ui);
      font-size: 16px;
      margin-left: 2px;
      color: var(--muted)
    }

    .gtile .cnt {
      color: var(--muted);
      font-size: .85em;
      margin: 4px 0 8px
    }

    .gtile .ng {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: .75em;
      font-weight: 900;
      color: var(--shu)
    }

    .gtile[data-g="1"] .num {
      color: #7CE7FF
    }

    .gtile[data-g="2"] .num {
      color: #7CFFB2
    }

    .gtile[data-g="3"] .num {
      color: #FFE27C
    }

    .gtile[data-g="4"] .num {
      color: #FFA37C
    }

    .gtile[data-g="5"] .num {
      color: #FF8AD8
    }

    .gtile[data-g="6"] .num {
      color: #B49CFF
    }

    .quick {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 12px
    }

    .qbtn {
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r-panel);
      padding: 14px
    }

    .qbtn:hover {
      border-color: var(--cyan)
    }

    .qbtn .ic {
      font-size: 28px
    }

    .qbtn b {
      display: block
    }

    .qbtn span {
      display: block;
      font-size: .8em;
      color: var(--muted);
      line-height: 1.35
    }

    .foot {
      margin-top: 40px;
      font-size: .78em;
      color: var(--dim);
      line-height: 1.7
    }

    .foot a {
      color: var(--muted)
    }

    /* ---------- grade hub ---------- */
    .hubhead {
      display: flex;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
      margin: 10px 0 16px
    }

    .hubhead h1 small {
      font-size: .55em;
      color: var(--muted);
      font-weight: 700;
      margin-left: 8px
    }

    .mastery-sum {
      min-width: 260px;
      flex: 1
    }

    .mastery-sum .legend {
      display: flex;
      gap: 14px;
      font-size: .8em;
      color: var(--muted);
      margin-top: 6px;
      flex-wrap: wrap
    }

    .legend i {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: 4px;
      vertical-align: middle
    }

    .hubgrid {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 18px;
      align-items: start
    }

    .path {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    .path::before {
      content: "";
      position: absolute;
      left: 27px;
      top: 30px;
      bottom: 30px;
      width: 3px;
      background: linear-gradient(var(--cyan), var(--violet), var(--shu));
      opacity: .5;
      border-radius: 3px
    }

    .step {
      position: relative;
      display: grid;
      grid-template-columns: 58px 1fr;
      gap: 12px;
      align-items: start
    }

    .step .lv {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--ink);
      border: 3px solid var(--cyan);
      font-family: var(--f-logo);
      font-weight: 900;
      font-size: 13px;
      line-height: 1.1;
      text-align: center;
      z-index: 1
    }

    .step .lv b {
      display: block;
      font-size: 20px
    }

    .step[data-lv="2"] .lv {
      border-color: #6FD3FF
    }

    .step[data-lv="3"] .lv {
      border-color: var(--violet)
    }

    .step[data-lv="4"] .lv {
      border-color: #FF8AD8
    }

    .step[data-lv="5"] .lv {
      border-color: var(--shu)
    }

    .step .body {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r-panel);
      padding: 12px 14px
    }

    .step .body h3 {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap
    }

    .step .who {
      font-size: .82em;
      color: var(--muted);
      margin: 2px 0 10px
    }

    .modes {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px
    }

    .mode {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      color: var(--text);
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      min-height: 60px
    }

    .mode:hover {
      border-color: var(--cyan);
      background: rgba(62, 240, 224, .08)
    }

    .mode .ic {
      font-size: 26px
    }

    .mode b {
      display: block;
      line-height: 1.3;
      color: #fff
    }

    .mode span {
      display: block;
      font-size: .75em;
      color: var(--muted);
      line-height: 1.3
    }

    .reco {
      color: var(--gold);
      border-color: var(--gold)
    }

    .side {
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    .side .panel h3 {
      margin-bottom: 8px
    }

    /* ---------- modal ---------- */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 20, .72);
      z-index: 60;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 12px
    }

    @media(min-width:700px) {
      .modal-bg {
        align-items: center
      }
    }

    .modal {
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--cyan);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 0 40px rgba(62, 240, 224, .25)
    }

    .modal h2 {
      margin-bottom: 4px
    }

    .field {
      margin: 16px 0
    }

    .field>label,
    .field>.lab {
      display: block;
      font-weight: 900;
      margin-bottom: 6px
    }

    .field .hint {
      font-size: .8em;
      color: var(--muted);
      margin-top: 4px
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    select.sel,
    input.inp,
    textarea.inp {
      width: 100%;
      background: var(--ink);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px
    }

    textarea.inp {
      min-height: 80px;
      resize: vertical
    }

    /* ---------- zukan ---------- */
    .ztools {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin: 8px 0 14px
    }

    .ztools .inp {
      max-width: 260px
    }

    .zgrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
      gap: 8px
    }

    .ztile {
      position: relative;
      aspect-ratio: 1;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      font-family: var(--f-kanji);
      font-size: 34px;
      display: grid;
      place-items: center;
      padding: 0
    }

    .ztile:hover {
      border-color: var(--cyan)
    }

    .ztile .mk {
      position: absolute;
      bottom: 3px;
      left: 0;
      right: 0;
      font-family: var(--f-ui);
      font-size: 9px;
      color: var(--gold);
      letter-spacing: 0
    }

    .ztile.m0 {
      color: #C9CFF0
    }

    .ztile.m1,
    .ztile.m2 {
      border-color: rgba(111, 211, 255, .6);
      color: #bfeaff
    }

    .ztile.m3,
    .ztile.m4 {
      border-color: rgba(124, 255, 107, .6);
      color: #d7ffd0;
      background: rgba(124, 255, 107, .06)
    }

    .ztile.m5 {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(255, 210, 63, .08)
    }

    .ztile.ng::after {
      content: "";
      position: absolute;
      top: 5px;
      right: 5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--shu)
    }

    .ztile.sel {
      outline: 3px solid var(--cyan);
      background: rgba(62, 240, 224, .18)
    }

    .selbar {
      position: sticky;
      bottom: 10px;
      margin-top: 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      background: var(--panel2);
      border: 1px solid var(--cyan);
      border-radius: 14px;
      padding: 10px 14px
    }

    /* ---------- detail ---------- */
    .detail {
      display: grid;
      grid-template-columns: minmax(260px, 360px) 1fr;
      gap: 22px;
      align-items: start;
      margin-top: 8px
    }

    .kvbox {
      aspect-ratio: 1;
      width: 100%
    }

    .kvbox svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%
    }

    .kvctl {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px
    }

    .big-k {
      font-family: var(--f-kanji);
      font-size: 64px;
      line-height: 1
    }

    .rd {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 14px;
      margin: 12px 0
    }

    .rd dt {
      font-weight: 900;
      color: var(--muted)
    }

    .rd dd {
      margin: 0
    }

    .yomi-chip {
      display: inline-block;
      margin: 0 6px 4px 0;
      padding: 2px 10px;
      border-radius: 8px;
      background: var(--panel2);
      border: 1px solid var(--line)
    }

    .yomi-chip.on {
      color: #9FE8FF
    }

    .okuri {
      color: var(--dim)
    }

    .exlist {
      list-style: none;
      margin: 6px 0 0;
      padding: 0
    }

    .exlist li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px dashed var(--line)
    }

    .exlist .sent {
      flex: 1
    }

    .exlist .sent ruby {
      ruby-position: over
    }

    .exlist rt {
      font-size: .6em;
      color: var(--cyan)
    }

    .hl {
      color: var(--cyan);
      font-weight: 900
    }

    .speak {
      background: none;
      border: 1px solid var(--line);
      border-radius: 10px;
      width: 40px;
      height: 40px;
      flex: none
    }

    .parts-eq {
      font-family: var(--f-kanji);
      font-size: 1.4em
    }

    /* ---------- play ---------- */
    .playtop {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0
    }

    .dots {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      flex: 1;
      justify-content: center
    }

    .dots i {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .12);
      display: block
    }

    .dots i.ok {
      background: var(--lime)
    }

    .dots i.half {
      background: var(--gold)
    }

    .dots i.ng {
      background: var(--shu)
    }

    .dots i.cur {
      outline: 2px solid var(--cyan);
      outline-offset: 1px
    }

    .goalchip {
      font-size: .8em;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 999px;
      padding: 2px 10px
    }

    .combo {
      font-family: var(--f-logo);
      font-weight: 900;
      color: var(--lime);
      min-width: 70px;
      text-align: right
    }

    .stage {
      background: linear-gradient(180deg, var(--panel), var(--ink2));
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px 16px;
      text-align: center;
      position: relative;
      min-height: 380px
    }

    .qhead {
      font-size: .9em;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 6px
    }

    .sentence {
      font-size: clamp(1.4em, 4.2vw, 2.1em);
      font-weight: 700;
      line-height: 2.1;
      margin: 8px 0 14px;
      word-break: keep-all;
      overflow-wrap: anywhere
    }

    .sentence .tg {
      color: var(--cyan);
      border-bottom: 4px solid var(--cyan);
      padding: 0 4px;
      font-family: var(--f-kanji)
    }

    .sentence .blank {
      display: inline-block;
      border: 2px dashed var(--cyan);
      border-radius: 10px;
      background: rgba(62, 240, 224, .08);
      padding: 0 8px;
      line-height: 1.35;
      color: var(--cyan);
      letter-spacing: .1em
    }

    .sentence ruby rt {
      font-size: .45em;
      color: var(--gold);
      font-weight: 700
    }

    .meaning {
      display: inline-block;
      font-size: .9em;
      color: #BFC7F5;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px 12px;
      margin-bottom: 8px
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 620px;
      margin: 14px auto 0
    }

    .choice {
      min-height: 72px;
      border-radius: 14px;
      border: 2px solid var(--line);
      background: var(--panel2);
      font-size: 1.5em;
      font-weight: 900;
      padding: 8px
    }

    .choice.kj {
      font-size: 2em;
      font-weight: 600
    }

    .choice:hover:not(:disabled) {
      border-color: var(--cyan)
    }

    .choice.ok {
      border-color: var(--lime);
      background: rgba(124, 255, 107, .14);
      color: var(--lime)
    }

    .choice.ng {
      border-color: var(--shu);
      background: rgba(255, 90, 60, .14);
      color: var(--shu)
    }

    .choice:disabled {
      cursor: default
    }

    .tools {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px
    }

    .tool {
      min-height: 44px;
      padding: 6px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel2);
      font-weight: 700
    }

    .tool:hover:not(:disabled) {
      border-color: var(--cyan)
    }

    .tool[aria-pressed="true"] {
      border-color: var(--gold);
      color: var(--gold)
    }

    .tool:disabled {
      opacity: .4
    }

    .conf {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 560px;
      margin: 16px auto 0
    }

    .conf button {
      min-height: 64px;
      border-radius: 14px;
      border: 2px solid var(--line);
      background: var(--panel2);
      font-weight: 900;
      line-height: 1.25
    }

    .conf button span {
      display: block;
      font-size: 1.5em
    }

    .conf button:hover {
      border-color: var(--cyan)
    }

    .judge {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 560px;
      margin: 14px auto 0
    }

    .judge button {
      min-height: 68px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 1.05em;
      border: 2px solid
    }

    .judge .j-ok {
      border-color: var(--lime);
      background: rgba(124, 255, 107, .12);
      color: var(--lime)
    }

    .judge .j-half {
      border-color: var(--gold);
      background: rgba(255, 210, 63, .10);
      color: var(--gold)
    }

    .judge .j-ng {
      border-color: var(--shu);
      background: rgba(255, 90, 60, .10);
      color: var(--shu)
    }

    .judge button b {
      display: block;
      font-size: 1.6em;
      line-height: 1
    }

    .checklist {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 12px
    }

    .feedback {
      margin-top: 14px;
      font-weight: 900;
      font-size: 1.1em;
      min-height: 1.6em
    }

    .feedback.ok {
      color: var(--lime)
    }

    .feedback.ng {
      color: var(--shu)
    }

    .feedback.half {
      color: var(--gold)
    }

    .explain {
      margin: 12px auto 0;
      max-width: 620px;
      text-align: left;
      background: rgba(255, 255, 255, .03);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: .92em
    }

    .reason {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px
    }

    .nextrow {
      margin-top: 16px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap
    }

    /* writing pad */
    .pad {
      position: relative;
      box-sizing: content-box;
      margin: 6px auto 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      background: #0A0F2A;
      border: 2px solid rgba(62, 240, 224, .55);
      border-radius: 10px;
      overflow: hidden
    }

    .pad svg.guide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none
    }

    .pad .cells {
      position: absolute;
      inset: 0;
      display: flex
    }

    .pad .cell {
      flex: 1;
      position: relative;
      border-right: 2px dashed rgba(62, 240, 224, .25)
    }

    .pad .cell:last-child {
      border-right: 0
    }

    .pad .cell::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      border-left: 1px dashed rgba(62, 240, 224, .14)
    }

    .pad .cell::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      border-top: 1px dashed rgba(62, 240, 224, .14)
    }

    .pad .cell.kana {
      background: rgba(255, 255, 255, .02)
    }

    .pad .model {
      position: absolute;
      inset: 0;
      display: flex;
      pointer-events: none
    }

    .pad .model>div {
      flex: 1;
      position: relative
    }

    .pad .model svg {
      position: absolute;
      inset: 6%;
      width: 88%;
      height: 88%
    }

    .pad .model .txt {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: var(--f-kanji);
      color: rgba(255, 255, 255, .22)
    }

    .pad canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair
    }

    .pad.frozen canvas {
      cursor: default
    }

    .pad.side-by-side {
      display: block
    }

    .compare {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
      flex-wrap: wrap
    }

    .compare .mbox {
      width: 110px;
      height: 110px;
      position: relative
    }

    .compare .mbox svg {
      position: absolute;
      inset: 6%;
      width: 88%;
      height: 88%
    }

    .compare .mbox .txt {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: var(--f-kanji);
      font-size: 80px
    }

    .scount {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 8px;
      font-size: .88em
    }

    .scount span {
      padding: 2px 10px;
      border-radius: 999px;
      border: 1px solid var(--line)
    }

    .scount .eq {
      border-color: var(--lime);
      color: var(--lime)
    }

    .scount .ne {
      border-color: var(--gold);
      color: var(--gold)
    }

    /* trace */
    .trace-wrap {
      position: relative;
      margin: 8px auto 0
    }

    .trace-wrap svg.guide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none
    }

    .trace-msg {
      min-height: 1.7em;
      font-weight: 900;
      margin-top: 10px
    }

    /* stamp */
    .stamp {
      position: absolute;
      right: 18px;
      top: 14px;
      width: 96px;
      height: 96px;
      pointer-events: none;
      opacity: 0
    }

    .stamp.show {
      animation: stamp .45s cubic-bezier(.2, 1.6, .4, 1) forwards
    }

    @keyframes stamp {
      0% {
        opacity: 0;
        transform: scale(2.2) rotate(-25deg)
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(-12deg)
      }
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: var(--panel2);
      border: 1px solid var(--cyan);
      border-radius: 14px;
      padding: 10px 18px;
      font-weight: 900;
      z-index: 80;
      box-shadow: 0 0 24px rgba(62, 240, 224, .3);
      max-width: 90vw
    }

    .float-cr {
      position: fixed;
      z-index: 85;
      font-family: var(--f-logo);
      font-weight: 900;
      color: var(--gold);
      pointer-events: none;
      animation: floatup 1s ease-out forwards;
      font-size: 20px
    }

    @keyframes floatup {
      to {
        transform: translateY(-60px);
        opacity: 0
      }
    }

    /* boss */
    .boss {
      display: flex;
      align-items: center;
      gap: 14px;
      justify-content: center;
      margin-bottom: 10px
    }

    .boss .mon {
      font-size: 56px;
      line-height: 1;
      filter: drop-shadow(0 0 12px rgba(255, 90, 60, .6))
    }

    .boss .mon.hit {
      animation: hit .35s
    }

    @keyframes hit {

      0%,
      100% {
        transform: translateX(0)
      }

      25% {
        transform: translateX(-8px)
      }

      75% {
        transform: translateX(8px)
      }
    }

    .hpbar {
      width: 220px;
      height: 14px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .1);
      overflow: hidden;
      border: 1px solid rgba(255, 90, 60, .6)
    }

    .hpbar span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--shu), #ff9a3c);
      transition: width .4s
    }

    .hearts {
      font-size: 20px;
      letter-spacing: 2px
    }

    /* jukugo */
    .jk-center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 10px 0
    }

    .jk-slot {
      width: 84px;
      height: 84px;
      border-radius: 14px;
      border: 2px dashed var(--line);
      display: grid;
      place-items: center;
      font-family: var(--f-kanji);
      font-size: 52px
    }

    .jk-slot.c {
      border: 2px solid var(--cyan);
      color: var(--cyan);
      background: rgba(62, 240, 224, .08)
    }

    .jk-tiles {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 420px;
      margin: 12px auto
    }

    .jk-tile {
      aspect-ratio: 1;
      border-radius: 14px;
      border: 2px solid var(--line);
      background: var(--panel2);
      font-family: var(--f-kanji);
      font-size: 40px
    }

    .jk-tile:hover:not(:disabled) {
      border-color: var(--cyan)
    }

    .jk-tile.used {
      opacity: .3
    }

    .jk-tile.shake {
      animation: hit .35s;
      border-color: var(--shu)
    }

    .jk-found {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px
    }

    .jk-found span {
      padding: 4px 12px;
      border-radius: 10px;
      border: 1px solid var(--lime);
      color: var(--lime);
      font-family: var(--f-kanji);
      font-size: 1.2em
    }

    .jk-found span small {
      font-family: var(--f-ui);
      font-size: .6em;
      color: var(--muted);
      margin-left: 4px
    }

    /* parts */
    .parts-q {
      font-family: var(--f-kanji);
      font-size: clamp(2.4em, 8vw, 3.6em);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 10px 0
    }

    .parts-q .pp {
      min-width: 1.3em;
      text-align: center
    }

    .parts-q .op {
      font-family: var(--f-ui);
      color: var(--muted);
      font-size: .6em
    }

    .parts-q .qm {
      color: var(--cyan);
      border-bottom: 4px solid var(--cyan);
      min-width: 1.2em
    }

    .pname {
      display: block;
      font-family: var(--f-ui);
      font-size: 12px;
      color: var(--muted);
      text-align: center
    }

    /* result */
    .result {
      max-width: 760px;
      margin: 20px auto
    }

    .result .score {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap
    }

    .result .score .big {
      font-family: var(--f-logo);
      font-size: 56px;
      font-weight: 900;
      color: #fff;
      line-height: 1
    }

    .result .score .big small {
      font-size: 24px;
      color: var(--muted)
    }

    .kchips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px
    }

    .kchips button,
    .kchips span {
      font-family: var(--f-kanji);
      font-size: 1.4em;
      min-width: 48px;
      min-height: 48px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel2);
      display: inline-grid;
      place-items: center
    }

    .kchips .up {
      border-color: var(--gold);
      color: var(--gold)
    }

    .kchips .down {
      border-color: var(--shu);
      color: var(--shu)
    }

    .suggest {
      border: 1px solid var(--violet);
      background: rgba(169, 139, 255, .08);
      border-radius: 14px;
      padding: 12px 14px;
      margin-top: 14px
    }

    /* records */
    .cal {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      max-width: 330px
    }

    .cal i {
      aspect-ratio: 1;
      border-radius: 5px;
      background: rgba(255, 255, 255, .06);
      display: block;
      font-style: normal;
      font-size: 10px;
      color: var(--dim);
      text-align: right;
      padding: 2px 3px
    }

    .cal i.l1 {
      background: rgba(62, 240, 224, .25)
    }

    .cal i.l2 {
      background: rgba(62, 240, 224, .5)
    }

    .cal i.l3 {
      background: var(--cyan);
      color: #06222a
    }

    .cal i.today {
      outline: 2px solid var(--gold)
    }

    .statgrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px
    }

    .stat {
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px
    }

    .stat b {
      display: block;
      font-size: 1.6em;
      font-family: var(--f-logo);
      color: #fff
    }

    .stat span {
      font-size: .8em;
      color: var(--muted)
    }

    .badges {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px
    }

    .badge {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      background: var(--panel2)
    }

    .badge .bi {
      font-size: 30px
    }

    .badge b {
      display: block;
      font-size: .88em
    }

    .badge span {
      display: block;
      font-size: .72em;
      color: var(--muted);
      line-height: 1.35
    }

    .badge.off {
      opacity: .38;
      filter: grayscale(1)
    }

    .rlist {
      list-style: none;
      padding: 0;
      margin: 0
    }

    .rlist li {
      padding: 8px 0;
      border-bottom: 1px dashed var(--line);
      font-size: .92em
    }

    .cols2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px
    }

    .mbars .r {
      display: grid;
      grid-template-columns: 44px 1fr 70px;
      gap: 10px;
      align-items: center;
      margin: 6px 0;
      font-size: .9em
    }

    /* make */
    .preview {
      background: var(--ink);
      border: 1px dashed var(--cyan);
      border-radius: 12px;
      padding: 12px;
      text-align: center
    }

    .myqlist {
      list-style: none;
      padding: 0;
      margin: 0
    }

    .myqlist li {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dashed var(--line)
    }

    .myqlist li .s {
      flex: 1
    }

    code.share {
      display: block;
      word-break: break-all;
      background: var(--ink);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      font-size: .75em;
      max-height: 120px;
      overflow: auto
    }

    /* evolution */
    .evo {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(3, 6, 20, .86);
      display: grid;
      place-items: center;
      text-align: center
    }

    .evo .p {
      font-size: 120px;
      animation: evo 1.2s ease-out
    }

    @keyframes evo {
      0% {
        transform: scale(.2) rotate(-200deg);
        filter: brightness(4)
      }

      60% {
        transform: scale(1.2)
      }

      100% {
        transform: scale(1)
      }
    }

    /* print */
    #print-area {
      display: none
    }

    @media print {
      body {
        background: #fff !important;
        color: #000
      }

      body>*:not(#print-area) {
        display: none !important
      }

      #print-area {
        display: block;
        color: #000;
        font-family: var(--f-ui)
      }

      .pp-page {
        page-break-after: always;
        padding: 10mm
      }

      .pp-page:last-child {
        page-break-after: auto
      }

      .pp-head {
        display: flex;
        justify-content: space-between;
        border-bottom: 2px solid #000;
        padding-bottom: 4mm;
        margin-bottom: 6mm
      }

      .pp-q {
        display: flex;
        align-items: center;
        gap: 4mm;
        margin: 5mm 0;
        font-size: 15pt
      }

      .pp-q .no {
        width: 10mm;
        font-weight: 700
      }

      .pp-box {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        margin: 0 1mm;
        vertical-align: middle
      }

      .pp-box rt,
      .pp-box .r {
        font-size: 9pt
      }

      .pp-box .b {
        width: 16mm;
        height: 16mm;
        border: 1.5px solid #000;
        background-image: linear-gradient(#bbb, #bbb), linear-gradient(#bbb, #bbb);
        background-size: 1px 100%, 100% 1px;
        background-position: center;
        background-repeat: no-repeat
      }

      .pp-ans {
        font-family: var(--f-kanji);
        font-size: 16pt
      }
    }

    /* responsive */
    @media(max-width:980px) {
      .grades {
        grid-template-columns: repeat(3, 1fr)
      }

      .grades.g2 {
        grid-template-columns: repeat(2, 1fr)
      }

      .quick {
        grid-template-columns: repeat(2, 1fr)
      }

      .hubgrid {
        grid-template-columns: 1fr
      }
    }

    @media(max-width:720px) {
      .hero {
        grid-template-columns: 1fr
      }

      .hero-kanji {
        max-width: 240px;
        margin: 0 auto
      }

      .detail {
        grid-template-columns: 1fr
      }

      .kvbox {
        max-width: 320px;
        margin: 0 auto
      }

      .cols2 {
        grid-template-columns: 1fr
      }

      .logo-txt>span {
        display: none
      }
    }

    @media(max-width:480px) {
      .wrap {
        padding: 0 12px 40px
      }

      .grades {
        grid-template-columns: repeat(2, 1fr)
      }

      .quick {
        grid-template-columns: 1fr
      }

      .applinks {
        grid-template-columns: 1fr
      }

      .choices {
        grid-template-columns: 1fr
      }

      .judge button,
      .conf button {
        font-size: .9em
      }

      .hud-pill {
        padding: 3px 10px 3px 4px
      }

      .logo-txt b {
        font-size: 13px
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important
      }
    }

    html.calm * {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important
    }
  </style>

          }).join('') + '</g>';

    }

    /** 1画ずつ 書き順アニメーション */
    function animateStrokes(svg, o = {}) {
      if (!svg) return;

      const paths = $$('path[data-i]', svg);
      const nums = $$('text[data-n]', svg);

      if (calm() || !paths[0] || !paths[0].animate) {
        paths.forEach(p => {
          p.style.opacity = 1;
          p.style.strokeDasharray = '';
          p.style.strokeDashoffset = '';
        });

      }
      paths.forEach((p, i) => {

        p.style.opacity = 1;
        p.style.strokeDasharray = L + ' ' + L;
        p.style.strokeDashoffset = L;

        const a = p.animate([{
          strokeDashoffset: L
        }, {
          strokeDashoffset: 0
        }], {
          duration: dur,
          delay,
          fill: 'forwards',
          easing: 'ease-in-out'
        });
        svg._anims.push(a);

          opacity: 0
        }, {
          opacity: 1
        }], {
          duration: 150,
          delay,
          fill: 'forwards'

        delay += dur + 140 / speed;

    /* ---- 画の形をサンプリング（KanjiVG座標 0〜109） ---- */
    let sampler = null;
    const SAMPLE_CACHE = {};
    const NS = 24;

    function samplesOf(ch) {
      if (SAMPLE_CACHE[ch]) return SAMPLE_CACHE[ch];
      if (!sampler) {
        sampler = document.createElementNS(SVGNS, 'svg');
        sampler.setAttribute('viewBox', '0 0 109 109');
        sampler.setAttribute('width', '109');
        sampler.setAttribute('height', '109');
        sampler.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden';
        document.body.appendChild(sampler);
      }
      const out = (STROKES[ch] || []).map(d => {
        const p = document.createElementNS(SVGNS, 'path');
        p.setAttribute('d', d);
        sampler.appendChild(p);
        const L = p.getTotalLength();
        const pts = [];
        for (let i = 0; i < NS; i++) {
          const pt = p.getPointAtLength(L * i / (NS - 1));
          pts.push([pt.x, pt.y]);
        }
        p.remove();
        return {
          pts,
          L
        };
      });
      SAMPLE_CACHE[ch] = out;
      return out;
    }

    function polyLen(pts) {
      let s = 0;
      for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      return s;
    }

    function resample(pts, n) {
      if (pts.length === 1) return Array.from({
        length: n
      }, () => pts[0].slice());
      const total = polyLen(pts);
      if (total < 1e-6) return Array.from({
        length: n
      }, () => pts[0].slice());
      const step = total / (n - 1);
      const out = [pts[0].slice()];
      let acc = 0,
        i = 1,
        prev = pts[0];
      while (out.length < n - 1 && i < pts.length) {
        const cur = pts[i];
        const seg = Math.hypot(cur[0] - prev[0], cur[1] - prev[1]);
        if (acc + seg >= step && seg > 0) {
          const t = (step - acc) / seg;
          const np = [prev[0] + t * (cur[0] - prev[0]), prev[1] + t * (cur[1] - prev[1])];
          out.push(np);
          prev = np;
          acc = 0;
        } else {
          acc += seg;
          prev = cur;
          i++;
        }
      }
      while (out.length < n) out.push(pts[pts.length - 1].slice());
      return out;
    }
    const meanDist = (a, b) => {
      let s = 0;
      for (let i = 0; i < a.length; i++) s += Math.hypot(a[i][0] - b[i][0], a[i][1] - b[i][1]);
      return s / a.length;
    };
    /** 書いた1画を i画目と くらべる */
    function judgeStroke(ch, i, drawn, lenient) {
      const SM = samplesOf(ch);
      const tgt = SM[i];
      if (!tgt) return {
        ok: false,
        reason: 'shape'
      };
      const d = resample(drawn, NS);
      const dl = polyLen(drawn);
      const thr = (lenient ? 21 : 15) + (tgt.L < 18 ? 5 : 0);
      const dist = meanDist(d, tgt.pts);
      if (dist < thr && !(tgt.L > 22 && dl < tgt.L * .3)) return {
        ok: true,
        dist
      };
      const rev = meanDist(d, tgt.pts.slice().reverse());
      if (rev < thr && rev < dist) return {
        ok: false,
        reason: 'rev'
      };
      for (let j = i + 1; j < SM.length; j++)
        if (meanDist(d, SM[j].pts) < thr) return {
          ok: false,
          reason: 'order',
          j
        };
      if (tgt.L > 22 && dl < tgt.L * .3) return {
        ok: false,
        reason: 'short'
      };
      return {
        ok: false,
        reason: 'shape'

    const later = (fn, ms) => {
      const t = setTimeout(fn, ms);
      TIMERS.push(t);
      return t;
    };

    function go(name, params = {}, opt = {}) {
      if (!opt.replace) {
        NAV.push(CUR);
        history.pushState({
          kq: NAV.length
        }, '');
      }
      CUR = {
        name,
        params
      };
      render();
    }

    function goBack() {
      if (NAV.length) history.back();
      else {
        CUR = {
          name: 'home',
          params: {}
        };
        render();
      }
    }
    window.addEventListener('popstate', () => {
      if (CUR.name === 'play' && SES && !SES.done) {
        history.pushState({
          kq: NAV.length
        }, '');
        quitSession();
        return;
      }
      CUR = NAV.pop() || {
        name: 'home',
        params: {}
      };
      render();
    });

    function cleanup() {
      PADS.forEach(p => p.destroy());
      PADS = [];
      TIMERS.forEach(clearTimeout);
      TIMERS = [];
      if ('speechSynthesis' in window) try {
        speechSynthesis.cancel();
      } catch (e) {}
    }

    function render() {
      cleanup();
      const sc = SCREENS[CUR.name] || SCREENS.home;
      app().innerHTML = sc.html(CUR.params || {});
      if (sc.mount) sc.mount(CUR.params || {});
      window.scrollTo(0, 0);
      updateHud();
      const h = $('h1', app());
      if (h) {
        h.setAttribute('tabindex', '-1');
      }
    }

    function updateHud() {
      $('#hud-pet').textContent = petOf(points);
      $('#hud-cr').textContent = points;
      $('#hud-lv').textContent = 'Lv' + (petLevel(points) + 1);
    }
    const ACT = {};
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-act]');
      if (!t || t.disabled) return;
      const fn = ACT[t.dataset.act];
      if (fn) {
        fn(t, e);
      }
    });
    const greet = () => {
      const h = new Date().getHours();
      return h < 10 ? 'おはよう' : h < 17 ? 'こんにちは' : 'こんばんは';
    };
    const starsHTML = m => `<span class="stars" aria-label="★${m}">${'★'.repeat(m)}<i>${'★'.repeat(5 - m)}</i></span>`;

    function okuriHTML(kun) {
      const [a, b] = kun.split('.');
      return esc(a) + (b ? `<span class="okuri">${esc(b)}</span>` : '');
    }

    function sentHTML(q, mode) {
      if (mode === 'blank') return `${esc(q.pre)}<span class="blank">（${esc(q.yomi)}）</span>${esc(q.post)}`;
      if (mode === 'ruby') return `${esc(q.pre)}<ruby><span class="hl kj">${esc(q.target)}</span><rt>${esc(q.yomi)}</rt></ruby>${esc(q.post)}`;
      return `${esc(q.pre)}<span class="tg">${esc(q.target)}</span>${esc(q.post)}`;
    }

    function stampSVG(type) {
      if (type === 'ok') {
        let petals = '';
        for (let i = 0; i < 10; i++) {
          const a = i / 10 * Math.PI * 2;
          petals += `<circle cx="${50 + 34 * Math.cos(a)}" cy="${50 + 34 * Math.sin(a)}" r="11"/>`;
        }
        return `<svg viewBox="0 0 100 100"><g fill="none" stroke="#FF5A3C" stroke-width="4.5" stroke-linecap="round">${petals}<path d="M50 50m-4 0a4 4 0 1 1 8 0a9 9 0 1 1-18 0a14 14 0 1 1 28 0a19 19 0 1 1-38 0"/></g></svg>`;
      }
      if (type === 'half') return '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" fill="none" stroke="#FFD23F" stroke-width="7"/></svg>';
      // ふたば（これから のびる）
      return '<svg viewBox="0 0 100 100"><g fill="none" stroke="#7CFF6B" stroke-width="5" stroke-linecap="round"><path d="M50 84 V48"/><path d="M50 52 C36 52 24 44 22 30 C36 28 48 36 50 52 Z"/><path d="M50 50 C58 36 70 30 82 32 C80 46 66 54 50 50 Z"/></g></svg>';
    }

    function showStamp(type) {
      const s = $('#stamp');
      if (!s || type === 'ng') return;
      s.innerHTML = stampSVG(type);
      s.classList.remove('show');
      void s.offsetWidth;
      s.classList.add('show');
    }
    /* ---------------- ホーム ---------------- */
    function dailyKanji() {
      const g = curGrade();
      const list = GK[g];
      return list[hashStr(today() + g) % list.length];
    }

    function mission() {
      const ng = ngList().length,
        due = dueList().length,
        g = curGrade();
      if (ng) return {
        ic: '🛡️',
        t: `にがての字が ${ng}字 あるよ`,
        s: 'にがて克服で とりもどそう。2回つづけて 正解すると にがてから 外れるよ。',
        act: 'mode',
        mode: 'review',
        g: 'all'
      };
      if (due) return {
        ic: '🔁',
        t: `ふくしゅうの 時期の字が ${due}字`,
        s: '少し時間を あけて ふくしゅうすると、わすれにくく なるよ。',
        act: 'mode',
        mode: 'review',
        g: 'all'
      };
      if (!S.diag[g]) return {
        ic: '🧭',
        t: `${g}年生の レベル診断を してみよう`,
        s: '10問で、どのレベルから 始めると いいか わかるよ。',
        act: 'mode',
        mode: 'diag',
        g
      };
      return {
        ic: '✍️',
        t: `きょうの一字「${dailyKanji()}」を なぞってみよう`,
        s: '1画ずつ 書き順を チェックできるよ。',
        act: 'traceone',
        k: dailyKanji()
      };
    }
    SCREENS.home = {
      html() {
        const dk = dailyKanji(),
          k = KDB[dk],
          st = streakNow(),
          td = S.log[today()] || {
            q: 0,
            ok: 0
          },
          ms = mission();
        const name = S.name ? esc(S.name) + 'さん、' : '';
        const tiles = GRADES.map(g => {
          const cs = GK[g],
            m3 = countM(3, cs),
            ng = ngList(cs).length;
          return `<button class="gtile" data-g="${g}" data-act="grade" data-v="${g}">
        ${ng ? `<span class="ng">にがて ${ng}</span>` : ''}
        <div class="num">${g}<small>年</small></div>
        <div class="cnt">${cs.length}字<br>★3以上 ${m3}</div>
        <div class="bar"><span style="width:${m3 / cs.length * 100}%;background:var(--lime)"></span></div></button>`;
        }).join('');
        return `<div class="wrap">
      <section class="hero">
        <div>
          <button class="tagrid hero-kanji" data-act="detail" data-k="${dk}" aria-label="きょうの一字 ${dk} をくわしく見る">${kvgSVG(dk, { width: 4.5 })}</button>
          <div class="hero-cap"><span>きょうの一字 ・ ${k.g}年</span><span>${k.sc}画</span></div>
        </div>
        <div>
          <h1>${greet()}、${name}<br>きょうも 1字ずつ つよくなろう</h1>
          <p class="lead">自分に合った レベルを えらんで、自分のペースで 進めよう。</p>
          <div class="streak">
            <div class="s"><b>${st}</b>日 れんぞく</div>
            <div class="s">きょう <b>${td.q}</b>問</div>
            <div class="s">★3以上 <b>${countM(3, APPK)}</b>字</div>
          </div>
          <button class="mission" data-act="${ms.act}" data-mode="${ms.mode || ''}" data-g="${ms.g || ''}" data-k="${ms.k || ''}" style="width:100%;text-align:left;border-top:0;border-right:0;border-bottom:0;color:inherit">
            <span class="ic">${ms.ic}</span><span><p>${ms.t}</p><p class="muted">${ms.s}</p></span>
          </button>
        </div>
      </section>
      <div class="sec-h"><h2>学年を えらぶ</h2><span class="muted">${GRADES.join('年と ')}年の 漢字が 学べるよ</span></div>
      <div class="grades g${GRADES.length}">${tiles}</div>
      <div class="quick">
        <button class="qbtn" data-act="mode" data-mode="review" data-g="all"><span class="ic">🛡️</span><span><b>にがて克服</b><span>${APP.title}の にがてを まとめて</span></span></button>
        <button class="qbtn" data-act="nav" data-to="records"><span class="ic">📊</span><span><b>きろく</b><span>カレンダー・バッジ・ふりかえり</span></span></button>
        <button class="qbtn" data-act="nav" data-to="make"><span class="ic">🛠️</span><span><b>問題を つくる</b><span>自分で 問題を 考えて 友だちと こうかん</span></span></button>
        <button class="qbtn" data-act="nav" data-to="settings"><span class="ic">🧑‍🏫</span><span><b>先生・おうちの方へ</b><span>使い方・バックアップ・せってい</span></span></button>
      </div>
      ${poolOf('my').chars.length ? `<div class="sec-h"><h2>マイセット</h2></div><button class="qbtn" data-act="grade" data-v="my" style="width:100%"><span class="ic">🎯</span><span><b>${esc(poolOf('my').title)}</b><span class="kj" style="font-size:1.2em;color:var(--text)">${esc(poolOf('my').chars.join(''))}</span></span></button>` : ''}
      ${APP.links.length ? `<div class="sec-h"><h2>ほかの学年の アプリ</h2><span class="muted">コインと ペットは どのアプリでも いっしょ</span></div><div class="applinks">${APP.links.map(l => `<a class="qbtn" href="${esc(l.href)}"><span class="ic">🚪</span><span><b>${esc(l.title)}の 漢字クエスト</b><span>${esc(l.title)}の 漢字を 学ぶ</span></span></a>`).join('')}</div>` : ''}
      ${!storageOK ? '<p class="mission" style="margin-top:16px">⚠️ このブラウザでは きろくが 保存されません（プライベートモードなど）。</p>' : ''}
      <p class="foot">書き順データ：<a href="https://kanjivg.tagaini.net/" target="_blank" rel="noopener">KanjiVG</a>（© Ulrich Apel, CC BY-SA 3.0）を もとに 作成。書き順は 教科書と ちがう場合が あります。<br>むん先生の学習クエスト</p>
    </div>`;
      },
      mount() {
        const svg = $('.hero-kanji svg');
        later(() => animateStrokes(svg, {
          speed: .9
        }), 250);
      }
    };
    ACT.grade = t => {
      const v = t.dataset.v;
      const g = v === 'my' ? 'my' : +v;
      if (typeof g === 'number') S.lastG[APP.id] = g;
      save();
      go('grade', {
        g
      });
    };
    ACT.nav = t => go(t.dataset.to, {});
    ACT.home = () => {
      NAV.length = 0;
      CUR = {
        name: 'home',
        params: {}
      };
      history.pushState({
        kq: 0
      }, '');
      render();
    };
    ACT.back = () => goBack();
    ACT.detail = t => go('detail', {
      k: t.dataset.k
    });
    ACT.traceone = t => startSession('trace1', poolOf(KDB[t.dataset.k].g), {
      diff: 'easy',
      count: 1
    }, [{
      kind: 'trace',
      k: t.dataset.k
    }]);
    MODES.trace1 = {
      ic: '✍️',
      name: 'なぞり書き',
      desc: ''
    };
    /* ---------------- 学年ハブ ---------------- */
    SCREENS.grade = {
      html({
        g
      }) {
        const pool = poolOf(g);
        const cs = pool.chars;
        if (!cs.length) return `<div class="wrap"><button class="back" data-act="back">← もどる</button><div class="panel" style="margin-top:12px"><h2>マイセットが まだ ありません</h2><p class="muted">漢字ずかんで「えらんで練習」を おすと、自分だけの セットが つくれます。先生から もらった リンクを ひらいても 入ります。</p></div></div>`;
        const b = [0, 0, 0, 0];
        cs.forEach(c => {
          const m = kget(c).m;
          b[m === 0 ? 0 : m <= 2 ? 1 : m <= 4 ? 2 : 3]++;
        });
        const ng = cs.filter(isNg).length,
          due = cs.filter(isDue).length;
        const dg = S.diag[g];
        const reco = dg ? dg.lv : 0;
        const units = unitsOf(pool);
        const legacyDone = units.length ? ORIG.filter(q => q.g === g && (legacy.kaki.includes(q.id))).length : 0;
        const legacyTotal = units.length ? ORIG.filter(q => q.g === g).length : 0;
        const steps = LEVELS.map(L => `<div class="step" data-lv="${L.lv}">
        <div class="lv">LV<b>${L.lv}</b></div>
        <div class="body"><h3>${L.name}${reco === L.lv ? '<span class="tag reco">あなたに おすすめ</span>' : ''}</h3>
        <div class="who">${L.who}</div>
        <div class="modes">${L.modes.map(m => `<button class="mode" data-act="mode" data-mode="${m}" data-g="${g}"><span class="ic">${MODES[m].ic}</span><span><b>${MODES[m].name}</b><span>${MODES[m].desc}</span></span></button>`).join('')}</div></div></div>`).join('');
        return `<div class="wrap">
      <button class="back" data-act="back">← もどる</button>
      <div class="hubhead">
        <h1>${esc(pool.title)}${g === 'my' ? '' : 'の漢字'}<small>${cs.length}字</small></h1>
        <div class="mastery-sum">
          <div class="bar" style="height:14px"><span style="width:${b[0] / cs.length * 100}%;background:#39406e"></span><span style="width:${b[1] / cs.length * 100}%;background:#6FD3FF"></span><span style="width:${b[2] / cs.length * 100}%;background:var(--lime)"></span><span style="width:${b[3] / cs.length * 100}%;background:var(--gold)"></span></div>
          <div class="legend"><span><i style="background:#39406e"></i>まだ ${b[0]}</span><span><i style="background:#6FD3FF"></i>★1〜2 ${b[1]}</span><span><i style="background:var(--lime)"></i>★3〜4 ${b[2]}</span><span><i style="background:var(--gold)"></i>★5 ${b[3]}</span></div>
        </div>
      </div>
      <div class="hubgrid">
        <div class="path">${steps}</div>
        <div class="side">
          <div class="panel"><h3>🛡️ にがて克服</h3><p class="small muted">まちがえた字 ${ng}字 ・ ふくしゅうの時期 ${due}字</p><button class="btn wide ${ng + due ? 'shu' : 'dark'}" data-act="mode" data-mode="review" data-g="${g}" ${ng + due ? '' : 'disabled'}>${ng + due ? 'とりもどしに いく' : 'いまは ありません'}</button></div>
          <div class="panel"><h3>🧭 どこから 始める？</h3><p class="small muted">${dg ? `前回の診断：10問中 ${dg.score}問 正解 → LV${dg.lv}が おすすめ` : '10問の レベル診断で、自分に合った レベルが わかるよ。'}</p><button class="btn wide ghost" data-act="mode" data-mode="diag" data-g="${g}">${dg ? 'もう一度 診断する' : 'レベル診断を する'}</button></div>
          ${units.length ? `<div class="panel"><h3>📘 先生の問題</h3><p class="small muted">${units.length}つの まとまり ・ 書き取りで クリア ${legacyDone}/${legacyTotal}問</p><p class="small muted">書き取り・読みクイズなどの「はんい」で えらべます。</p></div>` : ''}
          ${g === 'my' ? `<div class="panel"><h3>🔗 このセットを 配る</h3><p class="small muted">リンクを ひらくと、同じセットで 練習できます。</p><button class="btn wide ghost" data-act="copyset">リンクを コピー</button></div>` : `<div class="panel"><h3>🎯 字を えらんで 練習</h3><p class="small muted">ずかんで 好きな字を えらぶと、マイセットに なるよ。</p><button class="btn wide ghost" data-act="zukansel" data-g="${g}">字を えらぶ</button></div>`}
          <div class="panel"><h3>🖨️ プリントを 作る</h3><p class="small muted">書き取りテストを 印刷できます（答えつき）。</p><button class="btn wide dark" data-act="print" data-g="${g}">プリントを 作る</button></div>
        </div>
      </div></div>`;
      }
    };
    ACT.zukansel = t => go('zukan', {
      g: t.dataset.g === 'my' ? 'my' : +t.dataset.g,
      sel: true
    });
    /* ---------------- 学び方の せってい ---------------- */
    const DIFF_DESC = {
      trace: {
        easy: 'お手本と「つぎの画」が 光る',
        normal: 'お手本だけ 見える',
        hard: 'お手本なしの 書き順テスト（★2まで 上がる）'
      },
      qy: {
        easy: '3つから えらぶ・ヒントあり',
        normal: '4つから えらぶ',
        hard: 'にた読みばかり・ヒントなし（CR 1.5ばい）'
      },
      qk: {
        easy: '3つから えらぶ・ヒントあり',
        normal: '4つから えらぶ',
        hard: '同じ読み・にた形ばかり・ヒントなし（CR 1.5ばい）'
      },
      parts: {
        easy: 'パーツから 漢字を えらぶ',
        normal: 'ときどき パーツを さがす問題',
        hard: 'パーツを さがす問題が 多め（CR 1.5ばい）'
      },
      write: {
        easy: '意味つき・ヒント3回',
        normal: 'ヒント3回',
        hard: '意味なし・ヒントなし（★5まで 上がる・CR 1.5ばい）'
      },
      yomi: {
        easy: '意味つき・さいしょの1文字ヒント',
        normal: '意味つき',
        hard: '意味なし（CR 1.5ばい）'
      },
      jukugo: {
        easy: 'さがす熟語の 読みが 見える',
        normal: '読みは ヒントで 見られる',
        hard: '読みの ヒントなし'
      }
    };
    const GOALS = [
      ['ていねい', '✍️ ていねいに 書く'],
      ['スピード', '⚡ テンポよく'],
      ['ヒントなし', '🧠 ヒントなしで'],
      ['理由', '🔍 まちがいの理由を 考える'],
      ['にがて', '🎯 にがてを へらす']
    ];
    let SU = null;
    ACT.mode = t => {
      const mode = t.dataset.mode;
      const gv = t.dataset.g;
      const g = gv === 'my' ? 'my' : gv === 'all' ? 'all' : +gv;
      if (mode === 'zukan') return go('zukan', {
        g
      });
      if (mode === 'review') return startReview(g);
      if (mode === 'diag') return startDiag(g);
      if (mode === 'myq') return startMyQ();
      openSetup(mode, g);
    };

    function openSetup(mode, g) {
      const pool = poolOf(g);
      SU = Object.assign({
        mode,
        g,
        range: {
          type: 'all'
        },
        count: mode === 'jukugo' ? 5 : 10,
        diff: 'normal',
        goal: '',
        order: 'rand'
      }, S.last[mode] || {}, {
        mode,
        g
      });
      if (SU.range.type === 'unit' && !unitsOf(pool).includes(SU.range.unit)) SU.range = {
        type: 'all'
      };
      if (SU.range.type === 'group' && !groupsOf(pool)[SU.range.i]) SU.range = {
        type: 'all'
      };
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      bg.id = 'setup';
      bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="su-h"></div>';
      document.body.appendChild(bg);
      bg.addEventListener('click', e => {
        if (e.target === bg) bg.remove();
      });
      drawSetup();
    }

    function drawSetup() {
      const m = $('#setup .modal');
      if (!m) return;
      const pool = poolOf(SU.g);
      const mode = SU.mode;
      const groups = groupsOf(pool);
      const units = ['write', 'yomi', 'qy', 'qk', 'trace'].includes(mode) ? unitsOf(pool) : [];
      const ngN = pool.chars.filter(isNg).length,
        newN = pool.chars.filter(c => kget(c).m === 0).length,
        dueN = pool.chars.filter(c => isNg(c) || isDue(c)).length;
      const R = SU.range.type;
      const chip = (act, val, label, on, dis) => `<button class="chip" data-act="${act}" data-v="${val}" aria-pressed="${on}" ${dis ? 'disabled style="opacity:.4"' : ''}>${label}</button>`;
      const counts = mode === 'jukugo' ? [3, 5, 8] : mode === 'boss' ? [] : [5, 10, 20];
      m.innerHTML = `<h2 id="su-h">${MODES[mode].ic} ${MODES[mode].name}</h2><p class="muted small">${esc(pool.title)} ・ ${MODES[mode].desc}</p>
    <div class="field"><span class="lab">はんい</span><div class="chips">
      ${chip('su-range', 'all', `ぜんぶ（${pool.chars.length}字）`, R === 'all')}
      ${groups.length > 1 ? chip('su-range', 'group', 'グループ', R === 'group') : ''}
      ${units.length ? chip('su-range', 'unit', '先生の問題', R === 'unit') : ''}
      ${chip('su-range', 'ng', `にがて（${ngN}）`, R === 'ng', !ngN)}
      ${chip('su-range', 'new', `まだの字（${newN}）`, R === 'new', !newN)}
      ${chip('su-range', 'due', `ふくしゅう（${dueN}）`, R === 'due', !dueN)}
    </div>
    ${R === 'group' ? `<select class="sel" id="su-group" style="margin-top:8px">${groups.map((gr, i) => `<option value="${i}" ${SU.range.i == i ? 'selected' : ''}>${esc(gr.label)}</option>`).join('')}</select>` : ''}
    ${R === 'unit' ? `<select class="sel" id="su-unit" style="margin-top:8px">${units.map(u => `<option ${SU.range.unit === u ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select>
      ${mode !== 'trace' ? `<div class="chips" style="margin-top:8px">${chip('su-order', 'rand', 'ランダム', SU.order !== 'seq')}${chip('su-order', 'seq', 'じゅんばん', SU.order === 'seq')}</div>` : ''}` : ''}
    </div>
    ${counts.length ? `<div class="field"><span class="lab">問題の数</span><div class="chips">${counts.map(c => chip('su-count', c, c + '問', SU.count === c)).join('')}</div></div>` : ''}
    ${DIFF_DESC[mode] ? `<div class="field"><span class="lab">むずかしさ（自分で えらぼう）</span><div class="chips">
      ${chip('su-diff', 'easy', '🌱 やさしい', SU.diff === 'easy')}${chip('su-diff', 'normal', '🔥 ふつう', SU.diff === 'normal')}${chip('su-diff', 'hard', '⚡ むずかしい', SU.diff === 'hard')}
    </div><div class="hint">${DIFF_DESC[mode][SU.diff]}</div></div>` : '<p class="muted small">ヒントなしで 10問。❤️が 3つ なくなる前に ボスを たおそう！</p>'}
    <div class="field"><span class="lab">きょうの めあて</span><div class="chips">${GOALS.map(([v, l]) => chip('su-goal', v, l, SU.goal === v)).join('')}</div>
      <input class="inp" id="su-goaltxt" style="margin-top:8px" maxlength="40" placeholder="自分で めあてを 書いても いいよ" value="${GOALS.some(x => x[0] === SU.goal) ? '' : esc(SU.goal)}"></div>
    <div class="row" style="justify-content:flex-end;margin-top:6px"><button class="btn dark" data-act="su-close">やめる</button><button class="btn" data-act="su-start">スタート</button></div>`;
      const gs = $('#su-group');
      if (gs) gs.onchange = () => SU.range.i = +gs.value;
      const us = $('#su-unit');
      if (us) us.onchange = () => SU.range.unit = us.value;
      const gt = $('#su-goaltxt');
      gt.oninput = () => {
        if (gt.value.trim()) {
          SU.goal = gt.value.trim();
          $$('[data-act="su-goal"]').forEach(b => b.setAttribute('aria-pressed', 'false'));
        }
      };
    }
    ACT['su-range'] = t => {
      const v = t.dataset.v;
      const pool = poolOf(SU.g);
      SU.range = v === 'group' ? {
        type: 'group',
        i: 0
      } : v === 'unit' ? {
        type: 'unit',
        unit: unitsOf(pool)[0]
      } : {
        type: v
      };
      drawSetup();
    };
    ACT['su-count'] = t => {
      SU.count = +t.dataset.v;
      drawSetup();
    };
    ACT['su-diff'] = t => {
      SU.diff = t.dataset.v;
      drawSetup();
    };
    ACT['su-order'] = t => {
      SU.order = t.dataset.v;
      drawSetup();
    };
    ACT['su-goal'] = t => {
      SU.goal = SU.goal === t.dataset.v ? '' : t.dataset.v;
      drawSetup();
    };
    ACT['su-close'] = () => {
      const s = $('#setup');
      if (s) s.remove();
    };
    ACT['su-start'] = () => {
      const setup = {
        range: SU.range,
        count: SU.count,
        diff: SU.diff,
        goal: SU.goal,
        order: SU.order
      };
      S.last[SU.mode] = setup;
      save();
      const mode = SU.mode,
        g = SU.g;
      ACT['su-close']();
      startMode(mode, g, setup);
    };
    /* ---------------- セッション ---------------- */
    function startMode(mode, g, setup) {
      const pool = poolOf(g);
      let items = [];
      const chars = () => priority(charsIn(pool, setup.range));
      if (mode === 'trace') items = chars().slice(0, setup.count).map(k => ({
        kind: 'trace',
        k
      }));
      else if (mode === 'qy' || mode === 'qk' || mode === 'write' || mode === 'yomi') items = questionsFor(pool, setup).map(q => ({
        kind: mode,
        q
      }));
      else if (mode === 'parts') items = shuffle(partsPool(pool, charsIn(pool, setup.range))).slice(0, setup.count).map(e => ({
        kind: 'parts',
        e
      }));
      else if (mode === 'jukugo') {
        let cs = chars().filter(c => wordsWith(c, pool.grade).length >= 2);
        if (!cs.length) cs = priority(pool.chars).filter(c => wordsWith(c, pool.grade).length >= 2);
        items = cs.slice(0, setup.count).map(c => ({
          kind: 'jukugo',
          c
        }));
      } else if (mode === 'boss') items = bossItems(pool, setup);
      if (!items.length) {
        toast('この はんいでは 問題が 作れません。はんいを かえてみよう');
        return;
      }
      startSession(mode, pool, setup, items);
    }

    function bossItems(pool, setup) {
      const cs = shuffle(charsIn(pool, setup.range));
      const pp = shuffle(partsPool(pool, cs));
      const pattern = ['qk', 'qy', 'parts', 'qk', 'write', 'qy', 'qk', 'parts', 'write', 'qy'];
      return pattern.map((kind, i) => {
        const c = cs[i % cs.length];
        if (kind === 'parts') {
          const e = pp[i % Math.max(1, pp.length)];
          if (e) return {
            kind,
            e
          };
          return {
            kind: 'qk',
            q: itemFor(c, pool)
          };
        }
        return {
          kind,
          q: itemFor(c, pool)
        };
      });
    }

    function startReview(g) {
      const pool = poolOf(g === 'all' ? 'all' : g);
      const base = pool.chars;
      const cs = priority(base.filter(c => own(c) && (isNg(c) || isDue(c)))).slice(0, 10);
      if (!cs.length) {
        toast('にがても ふくしゅうも ありません。すごい！');
        return;
      }
      const items = cs.map(c => {
        const m = kget(c).m;
        const q = itemFor(c, poolOf(KDB[c].g));
        return {
          kind: m <= 1 ? 'qk' : m === 2 ? 'qy' : 'write',
          q
        };
      });
      startSession('review', pool, {
        diff: 'normal',
        count: items.length,
        goal: 'にがて'
      }, items);
    }

    function startDiag(g) {
      const pool = poolOf(g);
      const cs = shuffle(pool.chars);
      const singles = shuffle(ITEMS.filter(q => q.g === pool.grade && [...q.target].length === 1 && kata2hira(KDB[q.k].on[0] || '') !== q.yomi)).slice(0, 3);
      const jk = shuffle(ITEMS.filter(q => (pool.g === 'my' ? pool.chars.includes(q.k) : q.g === pool.grade) && [...q.target].length >= 2));
      const pp = shuffle(partsPool(pool));
      const items = [],
        used = new Set();
      const add = (kind, x, k) => {
        if (items.length >= 10 || used.has(k)) return;
        used.add(k);
        items.push(kind === 'parts' ? {
          kind,
          e: x
        } : {
          kind,
          q: x
        });
      };
      singles.forEach(q => add('qy', q, q.k));
      jk.filter(q => !used.has(q.k)).slice(0, 4).forEach(q => add('qk', q, q.k));
      pp.forEach(e => {
        if (items.filter(i => i.kind === 'parts').length < 2) add('parts', e, e.k);
      });
      jk.forEach(q => add('qy', q, q.k));
      while (items.length < 10 && cs.length) {
        const c = cs.pop();
        add('qk', itemFor(c, pool), c);
      }
      startSession('diag', pool, {
        diff: 'normal',
        count: items.length
      }, items);
    }

    function startMyQ() {
      const qs = shuffle(S.myq).slice(0, 10);
      if (!qs.length) {
        toast('まだ 自分の問題が ありません');
        return;
      }
      startSession('myq', poolOf('all'), {
        diff: 'normal',
        count: qs.length
      }, qs.map(q => ({
        kind: 'write',
        q: Object.assign({
          src: 'my',
          k: [...q.target].find(own) || null,
          meaning: q.meaning || ''
        }, q)
      })));
    }

    function startSession(mode, pool, setup, items) {
      SES = {
        mode,
        pool,
        setup,
        items,
        i: 0,
        res: [],
        combo: 0,
        maxCombo: 0,
        xp: 0,
        ups: {},
        ngs: {},
        hearts: 3,
        hp: 100,
        start: Date.now(),
        done: false,
        lockI: -1
      };
      go('play', {}, {
        replace: CUR.name === 'result' || CUR.name === 'play'
      });
    }
    SCREENS.play = {
      html() {
        if (!SES) return '<div class="wrap"><button class="back" data-act="home">← ホーム</button></div>';
        const goal = SES.setup.goal;
        return `<div class="wrap" style="max-width:900px">
      <div class="playtop"><button class="back" data-act="quit">✕ やめる</button><div class="dots" id="dots"></div>
      ${goal ? `<span class="goalchip">めあて：${esc(goal)}</span>` : ''}<span class="combo" id="combo"></span></div>
      <div class="stage" id="stage" aria-live="polite"></div></div>`;
      },
      mount() {
        if (SES) renderItem();
      }
    };
    ACT.quit = () => quitSession();
    async function quitSession() {
      if (!SES || SES.done) return goBack();
      if (!SES.res.length || await ask('とちゅうで やめる？', 'ここまでの きろくは のこるよ。', 'やめる', 'つづける')) finishSession(true);
    }

    function drawDots() {
      const d = $('#dots');
      if (!d) return;
      d.innerHTML = SES.items.map((_, i) => `<i class="${SES.res[i] || (i === SES.i ? 'cur' : '')}"></i>`).join('');
      $('#combo').textContent = SES.combo >= 2 ? 'COMBO ×' + SES.combo : '';
    }

    function renderItem() {
      drawDots();
      PADS.forEach(p => p.destroy());
      PADS = [];
      const it = SES.items[SES.i];
      const st = $('#stage');
      st.innerHTML = '';
      st.className = 'stage';
      (R[it.kind] || R.qk)(it, st);
    }

    function bossHead() {
      if (SES.mode !== 'boss') return '';
      const mon = ['👾', '🤖', '👻', '🐲', '🦂', '🌋'][(SES.pool.grade || 1) - 1];
      return `<div class="boss"><div class="mon" id="mon">${mon}</div><div><div class="hpbar"><span style="width:${Math.max(0, SES.hp)}%"></span></div><div class="hearts" aria-label="のこり ${SES.hearts}">${'❤️'.repeat(SES.hearts)}${'🤍'.repeat(3 - SES.hearts)}</div></div></div>`;
    }
    const gradeCap = q => SES.pool.g === 'all' ? (q.g || 1) : SES.pool.grade;
    const MULT = () => SES.setup.diff === 'hard' ? 1.5 : 1;

    function capFor(kind, extra) {
      let c = CAP[kind] || 2;
      if (kind === 'trace' && SES.setup.diff === 'hard') c = CAP.traceHard;
      if (kind === 'write' && extra && extra.hints) c = 3;
      if (kind === 'write' && SES.setup.diff === 'hard' && !(extra && extra.hints)) c = 5;
      if (SES.mode === 'boss') c = kind === 'write' ? 5 : Math.max(c, 3);
      if (SES.mode === 'diag') c = 1;
      return c;
    }
    /** 1問の おわり。res: ok / half / ng */
    function finishItem(res, o = {}) {
      const it = SES.items[SES.i];
      SES.res[SES.i] = res;
      logAnswer(res === 'ok');
      if (res === 'ok') {
        SES.combo++;
        SES.maxCombo = Math.max(SES.maxCombo, SES.combo);
      } else if (res === 'ng') SES.combo = 0;
      const ks = o.kanji || [];
      ks.forEach(ch => {
        const r = recordKanji(ch, res, capFor(it.kind, o));
        if (!r) return;
        if (r.after > r.before) SES.ups[ch] = r.after;
        if (res === 'ng') SES.ngs[ch] = 1;
      });
      const q = it.q;
      if (q && q.src === 'orig' && res === 'ok') {
        const list = it.kind === 'write' ? legacy.kaki : (it.kind === 'yomi' || it.kind === 'qy') ? legacy.yomi : null;
        if (list && !list.includes(q.id)) list.push(q.id);
      }
      let xp = Math.round((o.xp || 0) * MULT());
      if (res === 'ok' && SES.combo >= 3 && o.combo !== false) xp += Math.min(SES.combo, 6);
      if (SES.mode === 'diag') xp = res === 'ok' ? 5 : 0;
      SES.xp += xp;
      if (xp) addPoints(xp, o.anchor);
      if (SES.mode === 'boss') {
        if (res === 'ok') {
          SES.hp -= 100 / 7;
          const mon = $('#mon');
          if (mon) {
            mon.classList.remove('hit');
            void mon.offsetWidth;
            mon.classList.add('hit');
          }
          beep('hit');
        } else if (res === 'ng') SES.hearts--;
        const hb = $('.hpbar span');
        if (hb) hb.style.width = Math.max(0, SES.hp) + '%';
        const hs = $('.hearts');
        if (hs) hs.textContent = '❤️'.repeat(Math.max(0, SES.hearts)) + '🤍'.repeat(3 - Math.max(0, SES.hearts));
      }
      if (res === 'ok') beep('ok');
      else if (res === 'ng') beep('ng');
      showStamp(res);
      drawDots();
      save();
    }

    function nextItem() {
      if (!SES || SES.done || SES.lockI === SES.i) return;
      SES.lockI = SES.i;
      if (SES.mode === 'boss' && (SES.hp <= 0.5 || SES.hearts <= 0)) return finishSession();
      SES.i++;
      if (SES.i >= SES.items.length) return finishSession();
      renderItem();
    }

    function nextBtn(label = 'つぎへ') {
      return `<div class="nextrow"><button class="btn" id="nextbtn" data-act="next">${SES.i + 1 >= SES.items.length ? 'けっかを 見る' : label}</button></div>`;
    }
    ACT.next = () => nextItem();
    document.addEventListener('keydown', e => {
      if (CUR.name !== 'play' || !SES) return;
      if (e.target.matches('input,textarea')) return;
      if (e.key === 'Enter') {
        const nb = $('#nextbtn');
        if (nb) {
          e.preventDefault();
          nb.click();
        }
      }
      if (/^[1-4]$/.test(e.key)) {
        const c = $$('.choice:not(:disabled)')[+e.key - 1];
        if (c) c.click();
      }
    });
    const REASONS = [
      ['yomi', '読み方を かんちがい'],
      ['katachi', '形が にていた'],
      ['shiranai', 'まだ 知らなかった'],
      ['ukkari', 'うっかり']
    ];

    function reasonHTML() {
      return `<div class="explain" id="reasonbox"><b>どうして まちがえたと 思う？</b><span class="small muted">（えらぶと、きろくで ふりかえれるよ）</span><div class="reason">${REASONS.map(([v, l]) => `<button class="chip" data-act="reason" data-v="${v}">${l}</button>`).join('')}</div></div>`;
    }
    ACT.reason = t => {
      S.err[t.dataset.v] = (S.err[t.dataset.v] || 0) + 1;
      save();
      $$('#reasonbox .chip').forEach(b => {
        b.disabled = true;
        b.setAttribute('aria-pressed', b === t);
      });
      toast('まちがいの理由が わかると、つぎに いかせるね');
    };

    function kanjiCardHTML(ch) {
      const k = KDB[ch];
      if (!k) return '';
      return `<div class="row" style="align-items:flex-start"><span class="big-k" style="font-size:52px">${ch}</span><div>
    <div>${k.on.map(o => `<span class="yomi-chip on">${esc(o)}</span>`).join('')}${k.kun.map(u => `<span class="yomi-chip">${okuriHTML(u)}</span>`).join('')}</div>
    <div class="small muted">${esc(k.mean)} ・ ${k.sc}画 ・ ${k.g}年</div></div></div>`;
    }
    /* ---------------- 問題の画面（モードごと） ---------------- */
    const R = {};
    const modeName = it => (SES.mode === 'boss' ? 'ボスバトル ・ ' : SES.mode === 'review' ? 'にがて克服 ・ ' : SES.mode === 'diag' ? 'レベル診断 ・ ' : '') + (MODES[it.kind] || {}).name;
    /* 読みクイズ・漢字クイズ */
    function quizRender(it, st, kind) {
      const q = it.q;
      const diff = SES.mode === 'boss' || SES.mode === 'diag' ? 'normal' : SES.setup.diff;
      let mk = null,
        opts, answer;
      if (kind === 'qk') {
        mk = makeKanjiChoices(q, diff, gradeCap(q));
        if (!mk) kind = 'qy';
      }
      if (kind === 'qk') {
        opts = mk.options;
        answer = q.target;
      } else {
        opts = makeYomiChoices(q, diff);
        answer = q.yomi;
      }
      const canHint = diff !== 'hard' && SES.mode !== 'boss' && SES.mode !== 'diag';
      st.innerHTML = `${bossHead()}<div class="qhead">${modeName({ kind })}</div>
    <div class="sentence">${kind === 'qk' ? sentHTML(q, 'blank') : sentHTML(q)}</div>
    <p class="muted small">${kind === 'qk' ? '（　）に 入る 漢字は どれ？' : '色の ついた 漢字の 読み方は どれ？'}</p>
    <div id="hintbox"></div>
    <div class="choices">${opts.map(o => `<button class="choice${kind === 'qk' ? ' kj' : ''}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    ${canHint ? `<div class="tools"><button class="tool" id="hintbtn">💡 ヒント</button>${kind === 'qk' ? '<button class="tool" id="spk">🔊 よみあげ</button>' : ''}</div>` : ''}
    <div class="feedback" id="fb"></div><div id="after"></div><div class="stamp" id="stamp"></div>`;
      let hinted = false;
      const hb = $('#hintbtn', st);
      if (hb) hb.onclick = () => {
        hinted = true;
        hb.disabled = true;
        $('#hintbox', st).innerHTML = `<div class="meaning">💡 ${esc(q.meaning || (KDB[q.k] || {}).mean || '')}</div>`;
        if (diff === 'easy') {
          const wrong = $$('.choice', st).filter(b => b.dataset.v !== answer && !b.disabled);
          if (wrong.length > 1) {
            const w = pick(wrong);
            w.disabled = true;
            w.style.opacity = .3;
          }
        }
      };
      const sp = $('#spk', st);
      if (sp) sp.onclick = () => speak(q.pre + q.yomi + q.post);
      $$('.choice', st).forEach(b => b.onclick = () => {
        const ok = b.dataset.v === answer;
        $$('.choice', st).forEach(x => {
          x.disabled = true;
          if (x.dataset.v === answer) x.classList.add('ok');
        });
        if (!ok) b.classList.add('ng');
        if (hb) hb.disabled = true;
        const fb = $('#fb', st);
        fb.className = 'feedback ' + (ok ? 'ok' : 'ng');
        fb.textContent = ok ? pick(['せいかい！', 'すばらしい！', 'その通り！', 'ナイス！']) : `こたえは「${answer}」`;
        finishItem(ok ? 'ok' : 'ng', {
          kanji: q.k ? [q.k] : [],
          xp: ok ? (hinted ? 6 : 10) : 0,
          anchor: b
        });
        const focus = (mk && mk.focus) || q.k;
        $('#after', st).innerHTML = `<div class="explain"><div>${sentHTML(q, 'ruby')}</div>${focus ? '<hr style="border:0;border-top:1px dashed var(--line);margin:10px 0">' + kanjiCardHTML(focus) : ''}</div>${!ok && SES.mode !== 'boss' ? reasonHTML() : ''}${nextBtn()}`;
        if (ok && SES.mode === 'boss') later(nextItem, 900);
        const nb = $('#nextbtn');
        if (nb) nb.focus({
          preventScroll: true
        });
      });
    }
    R.qy = (it, st) => quizRender(it, st, 'qy');
    R.qk = (it, st) => quizRender(it, st, 'qk');
    /* 漢字たし算 */
    R.parts = (it, st) => {
      const diff = SES.mode === 'boss' || SES.mode === 'diag' ? 'normal' : SES.setup.diff;
      const P = makePartsQ(it.e, diff, SES.pool.g === 'all' ? KDB[it.e.k].g : SES.pool.grade);
      const e = it.e;
      const pp = (p, i) => `<span class="pp">${esc(p)}<span class="pname">${partName(p, i, e.parts.length)}</span></span>`;
      const eq = P.reverse ?
        `<span class="pp">${e.k}</span><span class="op">＝</span>` + e.parts.map((p, i) => i === P.hi ? '<span class="pp qm">？</span>' : pp(p, i)).join('<span class="op">＋</span>') :
        e.parts.map(pp).join('<span class="op">＋</span>') + '<span class="op">＝</span><span class="pp qm">？</span>';
      st.innerHTML = `${bossHead()}<div class="qhead">${modeName(it)}</div>
    <p class="muted small">${P.reverse ? '？に 入る パーツは どれ？' : 'パーツを 組み合わせると どの漢字？'}</p>
    <div class="parts-q">${eq}</div>
    <div class="choices">${P.options.map(o => `<button class="choice kj" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    <div class="feedback" id="fb"></div><div id="after"></div><div class="stamp" id="stamp"></div>`;
      $$('.choice', st).forEach(b => b.onclick = () => {
        const ok = b.dataset.v === P.answer;
        $$('.choice', st).forEach(x => {
          x.disabled = true;
          if (x.dataset.v === P.answer) x.classList.add('ok');
        });
        if (!ok) b.classList.add('ng');
        const fb = $('#fb', st);
        fb.className = 'feedback ' + (ok ? 'ok' : 'ng');
        fb.textContent = ok ? 'せいかい！ ' + e.parts.join(' ＋ ') + ' ＝ ' + e.k : `こたえは「${P.answer}」　${e.parts.join(' ＋ ')} ＝ ${e.k}`;
        finishItem(ok ? 'ok' : 'ng', {
          kanji: [e.k],
          xp: ok ? 10 : 0,
          anchor: b
        });
        $('#after', st).innerHTML = `<div class="explain">${kanjiCardHTML(e.k)}<p class="small" style="margin:8px 0 0">${(KDB[e.k].items[0] ? sentHTML(KDB[e.k].items[0], 'ruby') : '')}</p></div>${nextBtn()}`;
        if (ok && SES.mode === 'boss') later(nextItem, 900);
      });
    };
    /* 書き取り */
    R.write = (it, st) => {
      const q = it.q;
      const chars = [...q.target];
      const diff = SES.mode === 'boss' ? 'hard' : SES.setup.diff;
      const maxH = diff === 'hard' ? 0 : 3;
      let hints = 0;
      st.innerHTML = `${bossHead()}<div class="qhead">${modeName(it)}${q.unit ? ` <span class="tag">${esc(q.unit)}</span>` : ''}</div>
    <div class="sentence">${esc(q.pre)}<ruby><span class="blank">${'〇'.repeat(chars.length)}</span><rt>${esc(q.yomi)}</rt></ruby>${esc(q.post)}</div>
    ${diff !== 'hard' && q.meaning ? `<div class="meaning">${esc(q.meaning)}</div>` : ''}
    <div id="hintbox"></div><div id="padhost"></div>

/* ---------------- 結果・ふりかえり ---------------- */
function finishSession(quit) {
  if (!SES || SES.done) return;
  SES.done = true; SES.quit = !!quit;
  if (SES.mode === 'boss') {
    const g = SES.pool.grade; const win = SES.hp <= 0.5;
    const b = S.boss[g] || (S.boss[g] = { win: 0, tries: 0 });
    b.tries++;
    if (win) { const first = !b.win; b.win++; addPoints(first ? 200 : 100); SES.xp += first ? 200 : 100; SES.bossWin = true; }
  }
  if (SES.mode === 'diag') {
    const sc = SES.res.filter(r => r === 'ok').length;
    const lv = sc <= 4 ? 1 : sc <= 6 ? 2 : sc <= 8 ? 3 : 4;
    S.diag[SES.pool.g] = { score: sc, lv, ts: Date.now() }; SES.diagLv = lv; SES.diagScore = sc;
  }
  save(); checkBadges();
  go('result', {}, { replace: true });
}
SCREENS.result = {
  html() {
    if (!SES) return '<div class="wrap"><button class="back" data-act="home">← ホーム</button></div>';
    const n = SES.res.filter(Boolean).length, ok = SES.res.filter(r => r === 'ok').length, half = SES.res.filter(r => r === 'half').length;

        if (!q) return;
        [...q.target].filter(c => KDB[c]).forEach(c => {
          const s = kset(c);
          if (s.m < m) {
            s.m = m;
            s.d = Date.now() + INTERVAL[m];
            n++;
          }
        });
      });
      lift(legacy.yomi, 1);
      lift(legacy.kaki, 2);
      save();
      if (n) setTimeout(() => toast(`前の バージョンの きろくを 引きついだよ（${n}字に ★）`, 3500), 800);
    }

    function onExternalChange() {
      updateHud();
      if (CUR.name !== 'play') render();
    }

    function boot() {
      applySettings();
      migrateLegacy();
      history.replaceState({
        kq: 0
      }, '');
      const fromLink = readHash();
      render();
      if (fromLink) go('grade', {
        g: 'my'
      });
      window.addEventListener('hashchange', () => {
        if (readHash()) go('grade', {
          g: 'my'
        });
      });
    }
    boot();
  </script>
</body>

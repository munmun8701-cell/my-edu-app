<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>コトダマ・クロニクル 第3巻｜むん先生の学習クエスト</title>
<meta name="description" content="書いた漢字が世界をかえるRPG。小学3年生の漢字を、読み・書き順・使い方で学びながら、わすれた字たちを救う冒険。">
<meta name="theme-color" content="#0B1026">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Klee+One:wght@400;600&family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1026;--bg2:#121a46;--panel:rgba(14,20,56,.94);--line:rgba(124,247,255,.28);
  --cyan:#3EF0E0;--ice:#7CF7FF;--gold:#FFD23F;--shu:#FF5A3C;--pink:#FF7A9A;--violet:#A98BFF;--lime:#7CFF6B;
  --text:#EEF1FF;--muted:#9aa3d8;
  --f-ui:"M PLUS Rounded 1c","Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --f-logo:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;
  --f-k:"Klee One","UD デジタル 教科書体 N-R","UD Digi Kyokasho N-R","YuKyokasho","Hiragino Mincho ProN",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#05071a;color:var(--text);font-family:var(--f-ui);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer}
input,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 700px at 50% 0%,#1a2466,#05071a 70%)}
#stage{--u:1cqw;container-type:inline-size;position:relative;width:min(100vw,calc(100dvh*16/9),1280px);aspect-ratio:16/9;overflow:hidden;border-radius:12px;box-shadow:0 0 0 2px rgba(124,247,255,.25),0 20px 60px rgba(0,0,0,.6);background:#000}
#view{position:absolute;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#panel{position:absolute;inset:0;pointer-events:none;z-index:10}
#panel>*{pointer-events:auto}
@media (max-aspect-ratio:1/1){
  #stage{--u:2.3cqw;width:100vw;height:100dvh;aspect-ratio:auto;border-radius:0;display:flex;flex-direction:column}
  #view{position:relative;flex:none;aspect-ratio:16/9;width:100%}
  #panel{position:relative;inset:auto;flex:1;overflow-y:auto;pointer-events:auto;background:linear-gradient(#0b1030,#060818)}
  #dlg,#bt{position:relative!important;inset:auto!important;left:auto!important;right:auto!important;bottom:auto!important;top:auto!important;margin:calc(var(--u)*1)}
  #bt .bq,#bt .bcmd,#bt .btop,#bt .bstat,#bt .bmsg{position:relative!important;inset:auto!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;transform:none!important;width:auto!important;margin:calc(var(--u)*.8) 0}
  #bt .bq.write{grid-template-columns:1fr!important}
  #bt .bq.write .whost{justify-self:center}
}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:.85em}
.kj{font-family:var(--f-k)}
.big{font-size:1.3em}
.row{display:flex;gap:calc(var(--u)*.8);align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.col{display:flex;flex-direction:column;gap:calc(var(--u)*.8)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:calc(var(--u)*4.2);padding:calc(var(--u)*.7) calc(var(--u)*2);border-radius:calc(var(--u)*1.2);border:2px solid var(--cyan);background:linear-gradient(180deg,#5af5e6,#22c8b8);color:#04202a;font-weight:900;font-size:calc(var(--u)*1.8);box-shadow:0 0 calc(var(--u)*1.4) rgba(62,240,224,.35)}
.btn:active{transform:translateY(1px)}
.btn.sub{background:rgba(20,30,80,.8);color:var(--text);border-color:var(--line);box-shadow:none}
.btn.sm{min-height:calc(var(--u)*3.2);font-size:calc(var(--u)*1.4);padding:calc(var(--u)*.4) calc(var(--u)*1.2)}
.btn.big{font-size:calc(var(--u)*2.4);min-height:calc(var(--u)*5.6);padding:0 calc(var(--u)*4)}
.btn:disabled{opacity:.4;cursor:default}
.btn small{font-weight:500;margin-left:.3em;font-size:.75em}
.chip{min-height:calc(var(--u)*3.2);padding:calc(var(--u)*.3) calc(var(--u)*1.2);border-radius:99px;border:1px solid var(--line);background:rgba(20,30,80,.8);font-weight:700;font-size:calc(var(--u)*1.4)}
.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(255,210,63,.12)}
ruby rt{font-size:.5em;color:var(--gold);font-weight:700}

/* HUD */
#hud{position:absolute;top:1.4%;left:1.2%;right:1.2%;display:flex;gap:calc(var(--u)*.8);align-items:center;z-index:5;pointer-events:none;font-size:calc(var(--u)*1.5)}
#hud.off{display:none}
#hud>*{pointer-events:auto}
#hud-area{background:rgba(8,12,40,.78);border:1px solid var(--line);border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*.4) calc(var(--u)*1.2);display:flex;gap:calc(var(--u)*1);align-items:center;max-width:62%}
#hud-area b{white-space:nowrap}
#hud-area .dots{display:flex;flex-wrap:wrap;gap:2px;font-family:var(--f-k)}
#hud-area .dots i{font-style:normal;color:#5a6299;min-width:1.05em;text-align:center}
#hud-area .dots i.on{color:var(--gold);text-shadow:0 0 6px rgba(255,180,58,.8)}
.hpill{background:rgba(8,12,40,.78);border:1px solid var(--line);border-radius:99px;padding:calc(var(--u)*.3) calc(var(--u)*1.1);font-weight:900;white-space:nowrap}
#hud button{background:rgba(8,12,40,.85);border:1px solid var(--gold);color:var(--gold);border-radius:calc(var(--u)*1);width:calc(var(--u)*4.2);height:calc(var(--u)*4.2);font-size:calc(var(--u)*2)}
#prompt{position:absolute;left:50%;bottom:20%;transform:translate(-50%,10px);opacity:0;pointer-events:none;z-index:6;background:rgba(10,14,46,.9);border:2px solid var(--gold);color:var(--gold);font-weight:900;border-radius:99px;padding:calc(var(--u)*.6) calc(var(--u)*2.2);font-size:calc(var(--u)*1.8);transition:.2s;box-shadow:0 0 18px rgba(255,210,63,.35)}
#prompt.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#pad{position:absolute;bottom:2.5%;left:0;right:0;display:flex;justify-content:space-between;padding:0 2%;z-index:6;pointer-events:none}
#pad button{pointer-events:auto;width:calc(var(--u)*7);height:calc(var(--u)*7);border-radius:50%;border:2px solid rgba(124,247,255,.45);background:rgba(8,12,40,.55);font-size:calc(var(--u)*2.6);color:var(--ice);touch-action:none}
#pad #pa{margin-left:auto;margin-right:calc(var(--u)*2);border-color:var(--gold);color:var(--gold)}
@media (pointer:fine){#pad{opacity:.55}}
#toast{position:absolute;top:12%;left:50%;transform:translateX(-50%);background:rgba(10,14,46,.95);border:2px solid var(--gold);color:var(--gold);padding:calc(var(--u)*.8) calc(var(--u)*2.4);border-radius:calc(var(--u)*1.2);font-weight:900;font-size:calc(var(--u)*1.7);opacity:0;transition:.35s;pointer-events:none;z-index:90;max-width:90%;text-align:center}
#toast.on{opacity:1}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:85}
#savemark{position:absolute;right:1.5%;bottom:1.5%;font-style:normal;font-size:calc(var(--u)*1.2);color:var(--muted);opacity:0;transition:.4s;z-index:31}
#savemark.on{opacity:.9}
#card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:84;pointer-events:none}
#card .cin{text-align:center;opacity:0;transform:scale(.92);transition:.8s}
#card.on .cin{opacity:1;transform:scale(1)}
#card .ct{font-family:var(--f-logo);font-size:calc(var(--u)*5);color:#fff;text-shadow:0 0 18px var(--cyan),0 0 40px rgba(62,240,224,.6);letter-spacing:.06em}
#card .cs{margin-top:calc(var(--u)*1);font-size:calc(var(--u)*2);color:var(--gold);font-weight:900}

/* かいわ */
#dlg{position:absolute;left:2.5%;right:2.5%;bottom:3%;z-index:15;display:flex;gap:calc(var(--u)*1.4);align-items:flex-end;background:linear-gradient(180deg,rgba(18,26,74,.96),rgba(8,12,40,.97));border:2px solid var(--ice);border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*1.2) calc(var(--u)*1.6);box-shadow:0 0 24px rgba(62,240,224,.25);min-height:calc(var(--u)*11);cursor:pointer}
#dlg.narr{border-color:var(--violet)}
#dlg .pt{width:calc(var(--u)*9);height:calc(var(--u)*9);flex:none;border-radius:calc(var(--u)*1.2);background:radial-gradient(circle at 50% 40%,#1e2a70,#0a0f2a);border:1px solid var(--line);align-self:center}
#dlg .db{flex:1;min-width:0}
#dlg .nm{font-weight:900;color:var(--gold);font-size:calc(var(--u)*1.6);min-height:1.2em}
#dlg .tx{font-size:calc(var(--u)*2.2);line-height:1.75;font-weight:700;min-height:3.4em;word-break:keep-all;overflow-wrap:anywhere}
#dlg .nx{text-align:right;color:var(--ice);opacity:0;font-size:calc(var(--u)*1.4)}
#dlg.ready .nx{opacity:1;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#dlg.choice{cursor:default}
#dlg .chs{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1);margin-top:calc(var(--u)*.8)}
#dlg .ch{flex:1 1 40%;min-height:calc(var(--u)*4.6);border-radius:calc(var(--u)*1.2);border:2px solid var(--gold);background:rgba(255,210,63,.1);font-weight:900;font-size:calc(var(--u)*1.9);color:#fff}

/* バトル */
#bt{position:absolute;inset:0;z-index:12;pointer-events:none}
#bt>*{pointer-events:auto}
#bt.talk .bcmd,#bt.talk .bq{display:none}
#bt .btop{position:absolute;top:2%;left:50%;transform:translateX(-50%);text-align:center;background:rgba(8,10,34,.82);border:1px solid rgba(255,122,154,.5);border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*.5) calc(var(--u)*1.6)}
#bt .ename{font-weight:900;font-size:calc(var(--u)*1.8)}
#bt .segs{display:flex;gap:calc(var(--u)*1.4);justify-content:center;margin-top:2px}
#bt .seg{display:flex;gap:.35em;align-items:center;font-size:calc(var(--u)*1.3)}
#bt .pips{display:flex;gap:3px}
#bt .pips i{width:calc(var(--u)*1.6);height:calc(var(--u)*1.6);border-radius:50%;border:2px solid var(--c);background:rgba(120,90,255,.35);box-shadow:inset 0 0 6px rgba(160,120,255,.8)}
#bt .pips i.on{background:var(--c);box-shadow:0 0 10px var(--c)}
#bt .bstat{position:absolute;top:2%;left:1.5%;display:flex;flex-direction:column;gap:3px;align-items:flex-start;background:rgba(8,10,34,.82);border:1px solid var(--line);border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*.5) calc(var(--u)*1);font-weight:900;font-size:calc(var(--u)*1.5)}
#bt .hearts b{color:#ff5a7a;text-shadow:0 0 6px #ff3a5a}
#bt .hearts i{font-style:normal;color:#3a3f6a}
#bt .kp{color:var(--ice)}
#bt .lg{display:block;width:calc(var(--u)*12);height:calc(var(--u)*1);border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
#bt .lg i{display:block;height:100%;background:linear-gradient(90deg,#ffe27a,#ffb43a);box-shadow:0 0 8px #ffb43a}
#bt .cb{color:var(--lime)}
#bt .bf{font-size:.9em}
#bt .bmsg{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) scale(.95);opacity:0;transition:.25s;background:rgba(8,10,34,.9);border:2px solid var(--violet);border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*.8) calc(var(--u)*2);font-weight:900;font-size:calc(var(--u)*1.9);max-width:80%;text-align:center;pointer-events:none}
#bt .bmsg.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#bt .bcmd{position:absolute;left:2%;right:2%;bottom:3%;display:grid;grid-template-columns:repeat(3,1fr) repeat(3,auto);gap:calc(var(--u)*.8);align-items:stretch}
#bt .cmd{border-radius:calc(var(--u)*1.2);border:2px solid var(--c,var(--line));background:linear-gradient(180deg,rgba(24,34,90,.95),rgba(10,14,46,.96));padding:calc(var(--u)*.7) calc(var(--u)*1);text-align:left;min-height:calc(var(--u)*6)}
#bt .cmd b{display:block;font-size:calc(var(--u)*1.85)}
#bt .cmd small{display:block;color:var(--muted);font-size:calc(var(--u)*1.2)}
#bt .cmd.sm{--c:var(--line)}
#bt .cmd.sm b{font-size:calc(var(--u)*1.5)}
#bt .cmd.sp{--c:var(--gold);background:linear-gradient(180deg,#5a4a10,#2a2008);animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 18px rgba(255,210,63,.8)}}
#bt .cmd:disabled{opacity:.3}
#bt .bq{position:absolute;left:2.5%;right:2.5%;bottom:3%;max-height:62%;overflow:auto;background:linear-gradient(180deg,rgba(18,26,74,.97),rgba(8,12,40,.98));border:2px solid var(--ice);border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*1.2) calc(var(--u)*1.6)}
#bt .bq.write{display:grid;grid-template-columns:1fr auto;gap:calc(var(--u)*1.6);align-items:center;max-height:74%;top:20%;bottom:3%}
.qh{font-weight:900;color:var(--ice);font-size:calc(var(--u)*1.6);margin-bottom:calc(var(--u)*.5)}
.qs{font-size:calc(var(--u)*2.7);font-weight:900;line-height:2.1;margin:calc(var(--u)*.3) 0 calc(var(--u)*.6)}
.qs.small{font-size:calc(var(--u)*1.8);line-height:1.9}
.qs .tg{color:var(--gold);font-family:var(--f-k);border-bottom:4px solid var(--gold);padding:0 .12em}
.qs ruby.tg rt{font-family:var(--f-ui)}
.qs .blank{display:inline-flex;flex-direction:column;align-items:center;border:2px dashed var(--ice);border-radius:calc(var(--u)*.8);padding:0 .25em;line-height:1.2;color:var(--ice);vertical-align:middle;margin:0 .1em}
.qs .blank small{font-size:.45em;color:var(--gold)}
.qm{display:inline-block;color:#c9d0ff;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:calc(var(--u)*1.4);margin-bottom:calc(var(--u)*.6)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--u)*14),1fr));gap:calc(var(--u)*.8)}
.op{min-height:calc(var(--u)*5.4);border-radius:calc(var(--u)*1.2);border:2px solid var(--line);background:rgba(28,40,100,.9);font-size:calc(var(--u)*2.4);font-weight:900}
.opts.kj .op{font-family:var(--f-k);font-size:calc(var(--u)*3);font-weight:600}
.op.ok{border-color:var(--lime);background:rgba(124,255,107,.18);color:var(--lime)}
.op.ng{border-color:var(--shu);background:rgba(255,90,60,.18);color:var(--shu)}
.op.gone{opacity:.2}
.ans{margin-top:calc(var(--u)*.8);font-weight:900;font-size:calc(var(--u)*1.8)}
.ans b{color:var(--gold);font-size:1.3em}
.ans b.kj{font-family:var(--f-k)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*.8)}
.md{position:relative;border-radius:calc(var(--u)*1.2);border:2px solid var(--line);background:rgba(28,40,100,.9);padding:calc(var(--u)*1) calc(var(--u)*.6);min-height:calc(var(--u)*8)}
.md b{display:block;font-size:calc(var(--u)*2)}
.md small{display:block;color:var(--muted);font-size:calc(var(--u)*1.25)}
.md .st{display:block;color:var(--gold);font-size:calc(var(--u)*1.6)}
.md em{position:absolute;top:-.8em;right:.4em;font-style:normal;background:var(--gold);color:#2a2000;border-radius:99px;padding:0 .6em;font-size:calc(var(--u)*1.1);font-weight:900}
.wleft{min-width:0}
.wmsg{min-height:1.6em;font-weight:900;font-size:calc(var(--u)*1.7)}
.wmsg.ok{color:var(--lime)} .wmsg.ng{color:var(--shu)}
.wtools{display:flex;gap:calc(var(--u)*.6);margin-top:calc(var(--u)*.6)}
.tool{min-height:calc(var(--u)*3.6);padding:0 calc(var(--u)*1.2);border-radius:calc(var(--u)*1);border:1px solid var(--line);background:rgba(28,40,100,.9);font-weight:700;font-size:calc(var(--u)*1.4)}
.kj.big{font-size:1.6em;color:var(--gold)}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--u)*22),1fr));gap:calc(var(--u)*.8)}
.sk{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:calc(var(--u)*1);text-align:left;border-radius:calc(var(--u)*1.2);border:2px solid var(--line);background:rgba(28,40,100,.9);padding:calc(var(--u)*.7) calc(var(--u)*1)}
.sk .kj{grid-row:span 2;font-size:calc(var(--u)*3.4);align-self:center}
.sk b{font-size:calc(var(--u)*1.6)} .sk small{color:var(--muted);font-size:calc(var(--u)*1.2)}
.sk.back{display:block;text-align:center}
.sk:disabled{opacity:.35}
.rescue{text-align:center}
.rescue .rk{font-weight:900;color:var(--gold);font-size:calc(var(--u)*2.2);text-shadow:0 0 12px rgba(255,180,58,.7)}
.rbody{display:flex;gap:calc(var(--u)*2);align-items:center;justify-content:center;text-align:left;margin:calc(var(--u)*.8) 0}
.rglyph{width:calc(var(--u)*13);aspect-ratio:1;background:#0a0f2a;border:2px solid var(--gold);border-radius:calc(var(--u)*1.2);flex:none}
.rglyph svg{width:100%;height:100%}
.rinfo{font-size:calc(var(--u)*1.6)}
.yo{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:0 .5em;margin:0 .3em .3em 0;background:rgba(255,255,255,.05)}
.yo.on{color:#9fe8ff}
.rm{color:#c9d0ff;margin:.2em 0}
.rr{color:var(--gold);font-weight:900}

/* 手書きパッド */
.wpad{position:relative;width:min(calc(var(--u)*27),46vh);aspect-ratio:1;background:#0a0f2a;border:2px solid rgba(124,247,255,.6);border-radius:calc(var(--u)*1.2);overflow:hidden;touch-action:none;box-shadow:0 0 24px rgba(62,240,224,.25)}
@media (max-aspect-ratio:1/1){.wpad{width:min(78vw,46vh)}}
.wpad .wgrid{position:absolute;inset:0;background:linear-gradient(rgba(124,247,255,.18),rgba(124,247,255,.18)) 50% 0/2px 100% no-repeat,linear-gradient(90deg,rgba(124,247,255,.18),rgba(124,247,255,.18)) 0 50%/100% 2px no-repeat}
.wpad svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wpad .dn path{filter:drop-shadow(0 0 4px #7CF7FF)}
.wpad canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.wpad.fin{border-color:var(--gold);box-shadow:0 0 30px rgba(255,210,63,.6)}
#writeov{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(4,6,20,.55)}
.wbox{background:var(--panel);border:2px solid var(--gold);border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*1.4);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.6)}
.wbox .wq{font-weight:900;font-size:calc(var(--u)*2)}

/* オーバーレイ・カード */
.ov{position:absolute;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(4,6,20,.6);padding:2%}
.ov.full{align-items:stretch;justify-content:stretch;padding:0;background:rgba(4,6,20,.88)}
.card{background:linear-gradient(180deg,rgba(20,28,80,.98),rgba(9,13,42,.98));border:2px solid var(--ice);border-radius:calc(var(--u)*1.8);padding:calc(var(--u)*1.6) calc(var(--u)*2);max-width:min(96%,calc(var(--u)*80));max-height:96%;overflow:auto;box-shadow:0 0 40px rgba(62,240,224,.25);font-size:calc(var(--u)*1.6)}
.ov.full .card{max-width:none;max-height:none;width:100%;height:100%;border-radius:0}
.card h3{margin:0 0 calc(var(--u)*.6);font-size:calc(var(--u)*2.2)}
.card h4{margin:calc(var(--u)*1) 0 calc(var(--u)*.4);color:var(--ice)}
.card p{margin:calc(var(--u)*.4) 0}
.wcard{display:grid;grid-template-columns:1fr auto;gap:calc(var(--u)*2);align-items:center}

const guideRec = k => { const m = kget(k).m; return m <= 1 ? 'full' : m <= 3 ? 'first' : 'none'; };

/* ---- しかけ ---- */
async function castAtGate(g, secret) {
  F.lock++; showPrompt(null); if (TEST) window.__need = g.need;
  try {
    await runScript(g.intro || [`テン：${g.hint}`]);
    let hints = 0;
    while (true) {
      const list = compList();
      const pick = await new Promise(res => {
        const el = overlay(`<div class="card spell"><h3>${rubyHTML('✍️ ことだま[術|じゅつ] ― どの [字|じ]の ちからを つかう？')}</h3>
          <p class="muted">${rubyHTML(g.ask || 'この しかけを とくのに ぴったりの [字|じ]は どれかな？ いみを [考|かんが]えてみよう。')}</p>
          <div class="kgrid">${list.length ? list.map(k => `<button class="kc ${hints >= 3 && g.need.includes(k) ? 'glow' : ''}" data-k="${k}">${k}</button>`).join('') : `<p class="muted">${rubyHTML('まだ なかまの [字|じ]が いないよ。')}</p>`}</div>
          <div class="row"><button class="btn sub" data-k="?hint">💡 ヒント</button><button class="btn sub" data-k="?back">やめる</button></div>
          <div class="hintbox">${hintText(g, hints)}</div></div>`, 'mid');
        clickOnce(el, '[data-k]').then(b => res(b.dataset.k));
      });
      if (pick === '?back') { closeOverlay(); return; }
      if (pick === '?hint') { hints = Math.min(3, hints + 1); sfx('select'); continue; }
      if (!g.need.includes(pick)) {
        sfx('ng'); closeOverlay();
        const e = KDB[pick];
        await runScript([`テン：「${pick}」は ${e.mean.replace(/。$/, '')}って いみの [字|じ]だね。うーん、ここでは ちからが でないみたい…`, `テン：${g.hint}`]);
        continue;
      }
      const guide = await pickGuide(guideRec(pick));
      const r = await writeIn(pick, guide, `「${pick}」の [字|じ]を [書|か]いて、ちからを ときはなとう！`);
      recordK(pick, r.miss <= 2, guide === 'full' ? 2 : guide === 'first' ? 3 : 4);
      if (r.perfect) { G.album[pick] = packStrokes(r.pts); C.st.perfect++; }
      await spellEffect(g, pick, r);
      G.gates[g.id] = pick; g.k = pick; C.st.spells++; addExp(15 + (r.perfect ? 10 : 0)); save();
      if (secret && g.give) { const txt = giveReward(g.give); await runScript([`：ひみつの ばしょが ひらいた！ ${txt}`]); }
      await runScript(g.done || ['テン：やったね！ [字|じ]の ちからで みちが ひらけた！']);
      checkMedals();
      return;
    }
  } finally { F.lock = Math.max(0, F.lock - 1); }
}

async function bossSequence(a) {
  if (G.cleared[a.id]) return;
  F.lock++;
  try {
    await runScript(a.boss.pre || []);
    const r = await startBattle({ type: 'boss', boss: a.boss.battle });
    if (r !== 'win') { await runScript(a.boss.lose || ['テン：まけちゃった… でも だいじょうぶ。いずみで やすんで、もう いちど ちょうせんしよう！']); return; }
    G.cleared[a.id] = Date.now(); C.st.boss++; (a.next || []).forEach(id => { if (!G.unlocked.includes(id)) G.unlocked.push(id); }); save();
    if (a.boss.k && own(a.boss.k)) { const s = kset(a.boss.k); if (!s.res) { s.res = Date.now(); s.d = Date.now() + DAY; if (!G.comp.includes(a.boss.k)) G.comp.push(a.boss.k); C.st.rescue++; } }
    spawnEnemies(); updateHud();

}

/* ---- 合体（パーツを くっつけて 新しい字） ---- */
function piecesAvail() {
  const out = [];
  compList().forEach(k => out.push({ p: k, kind: 'comp' }));
  for (const s in G.shards) if (G.shards[s] > 0) out.push({ p: s, kind: 'shard' });
  if (G.flags.dot) out.push({ p: '、', kind: 'dot' });
  for (let g = 1; g < GRADE; g++) { const o = otherGrade(g); if (!o) continue; Object.keys(o.k || {}).forEach(k => { if (o.k[k].res && !out.some(x => x.p === k)) out.push({ p: k, kind: 'old', g }); }); }
  return out;
}
function matchRecipe(sel) {
  const key = sel.slice().sort().join('');
  return PARTS.filter(e => e.parts.slice().sort().join('') === key);
}

    const found = PARTS.filter(e => G.flags['fz_' + e.k]);

      <div class="kgrid">${av.map(x => `<button class="kc ${x.kind}" data-p="${esc(x.p)}">${esc(x.p)}${x.kind === 'shard' ? `<small>×${G.shards[x.p]}</small>` : x.kind === 'old' ? `<small>${x.g}ねん</small>` : x.kind === 'dot' ? '<small>テン</small>' : ''}</button>`).join('')}</div>
      <div class="row"><button class="btn" data-p="?go" ${sel.length >= 2 ? '' : 'disabled'}>⚡ がったい！</button><button class="btn sub" data-p="?clr">やりなおす</button><button class="btn sub" data-p="?back">とじる</button></div>
      <p class="muted small">${rubyHTML('[見|み]つけた [合体|がったい]')}：${found.length ? found.map(e => `${e.parts.join('＋')}＝${e.k}`).join('　') : 'まだ ない'}（ぜんぶで ${PARTS.length}）</p></div>`, 'mid');
    const b = await clickOnce(el, '[data-p]'); const p = b.dataset.p; sfx('select');
    if (p === '?back') { closeOverlay(); return; }
    if (p === '?clr') { sel = []; continue; }
    if (p !== '?go') { if (sel.length < 3) sel.push(p); continue; }
    const ms = matchRecipe(sel);
    if (sel.includes('、') && sel.length === 2) { closeOverlay(); await dotPlace(sel.find(x => x !== '、')); sel = []; continue; }
    if (!ms.length) { sfx('ng'); const near = PARTS.find(e => sel.some(s => e.parts.includes(s)) && !G.flags['fz_' + e.k]); toast(near ? `うまく くっつかない… 「${sel.find(s => near.parts.includes(s))}」は ほかの ぶひんと くっつきそう！` : 'うまく くっつかない…'); sel = []; continue; }

}
async function doFuse(e, sel) {
  const k = e.k;
  await runScript([`：「${sel.join('」と「')}」が ひかりながら ちかづいていく…！`]);
  const guide = await pickGuide(guideRec(k));
  const r = await writeIn(k, guide, `[合体|がったい]！ できあがる [字|じ]「${k}」を [書|か]こう`);
  sel.forEach(p => { if (G.shards[p]) G.shards[p]--; });
  const first = !rescued(k);
  const s = kset(k); recordK(k, r.miss <= 2, guide === 'none' ? 4 : 3);
  if (!s.res) { s.res = Date.now(); s.d = Date.now() + DAY; if (!G.comp.includes(k)) G.comp.push(k); C.st.rescue++; }
  G.flags['fz_' + k] = 1; C.st.fuse++; addExp(20); save(); sfx('rescue'); flash('#7CFF6B', .6);
  await runScript([`：がったい せいこう！ 「${e.parts.join('」＋「')}」＝「${k}」！`, first ? `テン：「${k}」が なかまに なったよ！ ${KDB[k].mean}` : `テン：「${k}」とは もう なかまだけど、[合体|がったい]の しかたを おぼえたね！`]);
  checkMedals();
}
/* テンの点つけ：点を どこに おくかで 字が かわる */
function dotPosOf(k) {
  const sm = samplesOf(k); if (!sm.length) return [54, 54];
  let best = sm[0]; sm.forEach(s => { if (s.L < best.L) best = s; });
  const c = best.pts.reduce((a, p) => [a[0] + p[0], a[1] + p[1]], [0, 0]); return [c[0] / best.pts.length, c[1] / best.pts.length];
}
async function dotPlace(base) {
  const rs = PARTS.filter(e => e.parts.length === 2 && e.parts.includes('、') && e.parts.includes(base));
  const cands = rs.map(e => ({ k: e.k, p: dotPosOf(e.k) }));
  const decoy = [[16, 16], [92, 92], [16, 92], [92, 16], [54, 100], [54, 6]].filter(d => !cands.some(c => Math.hypot(c.p[0] - d[0], c.p[1] - d[1]) < 26));
  const spots = shuffle([...cands.map(c => ({ p: c.p, k: c.k })), ...shuffle(decoy).slice(0, Math.max(2, 4 - cands.length)).map(p => ({ p, k: null }))]);
  const el = overlay(`<div class="card dot"><h3>${rubyHTML('・ テンの [点|てん]つけ')}</h3><p class="muted">${rubyHTML(`「${base}」の どこに テンを おく？ [点|てん]の ばしょで ちがう [字|じ]に なるよ！`)}</p>
    <div class="dotbox">${STROKES[base] ? kvgSVG(base, { color: '#ffffff', width: 6 }) : `<span class="kj">${esc(base)}</span>`}
    ${spots.map((s, i) => `<button class="dspot" data-i="${i}" style="left:${s.p[0] / 109 * 100}%;top:${s.p[1] / 109 * 100}%"></button>`).join('')}</div>
    <div class="row"><button class="btn sub" data-i="-1">やめる</button></div></div>`, 'mid');
  if (TEST) window.__dot = Math.max(spots.findIndex(s => s.k && own(s.k)), spots.findIndex(s => s.k));
  const b = await clickOnce(el, '[data-i]'); const i = +b.dataset.i; closeOverlay();
  if (i < 0) return;
  const s = spots[i]; sfx('dot');
  if (!s.k) { await runScript([`テン：うーん… そこに [点|てん]が ある [字|じ]は ないみたい。ほかの ばしょを ためしてみよう！`]); return; }
  C.st.dots++;
  await runScript([`：ちょん！ ${C.pName}が「${base}」に くっついた！`, `テン：「${base}」が「${s.k}」に なった！ [点|てん] ひとつで [字|じ]が かわるんだ！`]);
  if (!own(s.k)) { G.flags['fz_' + s.k] = 1; save(); await runScript([`テン：「${s.k}」は まえの ノートで あった [字|じ]だね！ [点|てん]の ばしょが ちがうと、べつの [字|じ]に なるんだ。`]); checkMedals(); return; }
  const e = PARTS.find(x => x.k === s.k); await doFuse(e, [base, '、']);
}

function questDef(id) { return (STORY.quests || []).find(q => q.id === id); }
function questState(id) { const q = questDef(id); if (!q) return 'none'; const s = G.quests[id]; if (!s) return 'new'; if (s === 'done') return 'done'; return q.need() ? 'ready' : 'active'; }

async function questTalk(id, npc) {
  const q = questDef(id), st = questState(id);
  if (st === 'new') { await runScript(q.intro, { npc }); G.quests[id] = 'active'; G.qb = G.qb || {}; G.qb[id] = clone(C.st); save(); toast(`📜 おねがい「${q.title}」を うけた！`); }
  else if (st === 'active') await runScript([`${npc.name}：${q.remind || 'まってるね！'}（${q.progress ? q.progress() : ''}）`], { npc });
  else if (st === 'ready') { await runScript(q.done, { npc }); G.quests[id] = 'done'; C.st.quests++; const txt = giveReward(q.reward); save(); await runScript([`：おれいに ${txt} を もらった！`]); checkMedals(); }
  else await runScript(q.after || [`${npc.name}：ほんとうに ありがとう！`], { npc });
}

const DTASK = [
  { id: 'rescue', t: 'まよい[字|じ]を 3[字|じ] たすける', st: 'rescue', n: 3 },
  { id: 'perfect', t: 'パーフェクトで 2かい [書|か]く', st: 'perfect', n: 2 },
  { id: 'spell', t: 'ことだま[術|じゅつ]か [合体|がったい]を 1かい', st: ['spells', 'fuse', 'dots'], n: 1 },
  { id: 'review', t: 'くもった [字|じ]を 2かい はらう', st: 'review', n: 2 },
  { id: 'blind', t: '[見|み]ないで パーフェクト 1かい', st: 'blind', n: 1 },
  { id: 'battles', t: 'まよい[字|じ]と 5かい あう', st: 'battles', n: 5 },
  { id: 'mini', t: 'あそびばで 1かい あそぶ', st: ['karuta', 'tower', 'touch'], n: 1 }
];
const stv = s => Array.isArray(s) ? s.reduce((a, k) => a + (C.st[k] || 0), 0) : (C.st[s] || 0);
function dailyRoll() {
  const d = today(); if (G.daily && G.daily.date === d) return;
  const R = rng(d + GRADE); const ids = shuffle(DTASK.map(x => x.id)).sort(() => R() - .5).slice(0, 3);
  const pool = GK.filter(k => !rescued(k) || isDue(k)); const k = (pool.length ? pool : GK)[Math.floor(R() * (pool.length || GK.length))];
  G.daily = { date: d, k, tasks: ids.map(id => ({ id, base: stv(DTASK.find(x => x.id === id).st) })), claimed: [], done: 0 };
  save();
}
function dailyProg(t) { const def = DTASK.find(x => x.id === t.id); return Math.min(def.n, stv(def.st) - t.base); }
function loginBonus() {
  const d = today(); if (C.login.last === d) return null;
  const y = dateAdd(d, -1); C.login.streak = C.login.last === y ? C.login.streak + 1 : 1; C.login.last = d; C.login.days++; C.login.best = Math.max(C.login.best, C.login.streak);
  const n = C.login.streak; const gift = { ink: 20 + Math.min(10, n) * 5 };
  if (n % 3 === 0) gift.item = 'drop'; if (n % 5 === 0) gift.item = 'brush';
  let acc = null; if (n % 7 === 0) { acc = Object.keys(ACC).find(a => !C.acc.own.includes(a) && ACC[a].p); if (acc) C.acc.own.push(acc); }
  C.ink += gift.ink; if (gift.item) C.items[gift.item] = (C.items[gift.item] || 0) + 1;
  save(); return { n, gift, acc };
}

        await dotPlace(base);
        if (rescued(k)) { G.gates[g.id] = k; save(); await runScript(['：まばゆい 光！ [字|じ]が ほんとうの すがたに もどった！', `{P}：「${base}」が「${k}」に！ [点|てん]の ばしょって、ほんとうに だいじなんだね！`]); }
      } finally { F.lock = Math.max(0, F.lock - 1); }

        '{N}：{P}——！！',
        'ナナシ：三つの [点|てん]と、まがった ひとふで。……これで わたしにも、心が……',

        '：……でも、それは うごかない。つめたく、しずかな まま。',

        { c: 'choice', q: 'ナナシに……', opts: [
          { t: '心は ぬすむ ものじゃ ない', kind: 1, then: ['{N}：心は、ぬすんで つくる ものじゃ ないよ。', '{N}：だれかと わらったり、ないたり、名前を よびあったり…… そうやって、すこしずつ できる ものなんだ。'] },
          { t: 'ぼくが [書|か]いて あげる', kind: 2, then: ['{N}：ナナシ。ぼくが、きみの 心を [書|か]いて あげる。', 'ナナシ：…………おまえが？ わたしの ために？'] }] },
        { c: 'if', flag: 'mask', then: ['：ナナシの かおで、おまつりの おめんが かすかに わらった ように 見えた。'] },
        { c: 'if', flag: 'crumb', then: ['{N}：……前の ページで、きみの けしくずを ひろったよ。あたたかかった。きみは さいしょから、ちゃんと あたたかかったんだ。'] },
        { c: 'write', k: '心', guide: 'full', prompt: 'ナナシの ために…… 心を こめて「心」を [書|か]こう！', noHint: true },
        { c: 'flash', color: '#ffffff', a: 1 }, { c: 'sfx', n: 'rescue' }, { c: 'bgm', n: 'sad' },
        '：きみの [書|か]いた「心」が、光に なって ナナシの むねに すいこまれた。',

        '{P}：……ちょん！ {N}！',

      setMode('map');
      if (r === 'win') { if (!C.acc.own.includes('crown')) C.acc.own.push('crown'); giveMedal('allg'); save(); await runScript(['ムン先生：……みごと！ 3年生の 200の [字|じ]は、もう きみの なかまだ。', 'ムン先生：つぎの ページでも、きっと だいじょうぶ。']); }

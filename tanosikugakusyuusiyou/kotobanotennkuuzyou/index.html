<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>言葉の天空城 -100階層の攻略-</title>
  <style>
    /* =========================================
       王道ファンタジー・RPG風 高品質UI
       ========================================= */
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --cyan: #38bdf8;
      --green: #4ade80;
      --red: #f87171;
      --gold: #fbbf24;
      --purple: #c084fc;
      --blue: #60a5fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      background-image: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
    }

    #game-container {
      width: 100%;
      max-width: 1100px;
      height: 96vh;
      background-color: rgba(30, 41, 59, 0.9);
      border: 3px solid var(--cyan);
      border-radius: 16px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.2);
      position: relative;
    }

    /* 画面エフェクト */
    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-8px);
      }

      40% {
        transform: translateX(8px);
      }

      60% {
        transform: translateX(-8px);
      }

      80% {
        transform: translateX(8px);
      }
    }

    .shake-effect {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes flashDamage {
      0% {
        box-shadow: inset 0 0 150px rgba(248, 113, 113, 0.8);
      }

      100% {
        box-shadow: inset 0 0 0 transparent;
      }
    }

    .flash-damage {
      animation: flashDamage 0.5s ease-out;
    }

    @keyframes timeLoop {
      0% {
        filter: hue-rotate(0deg) blur(0px);
        opacity: 1;
        transform: scale(1);
      }

      50% {
        filter: hue-rotate(180deg) blur(10px);
        opacity: 0;
        transform: scale(0.9);
      }

      100% {
        filter: hue-rotate(360deg) blur(0px);
        opacity: 1;
        transform: scale(1);
      }
    }

    .timeloop-effect {
      animation: timeLoop 2.5s forwards ease-in-out;
    }

    /* タイトルロゴ */
    .game-title {
      text-align: center;
      color: var(--gold);
      font-size: 2.5rem;
      margin: 0 0 15px 0;
      border-bottom: 2px dashed var(--cyan);
      padding-bottom: 10px;
      text-shadow: 0 0 15px rgba(251, 191, 36, 0.6);
      flex-shrink: 0;
      letter-spacing: 4px;
      font-weight: 900;
    }

    /* ステータスバー */
    #status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      background: rgba(15, 23, 42, 0.8);
      padding: 15px 25px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-weight: bold;
      color: #fff;
      border: 2px solid var(--border);
      font-size: 1.1rem;
      flex-shrink: 0;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
      gap: 15px;
    }

    .stat-group {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .bar-container {
      width: 220px;
      background-color: #000;
      border-radius: 8px;
      height: 22px;
      border: 2px solid var(--border);
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 5px #000;
    }

    .hp-fill {
      background: linear-gradient(90deg, #16a34a, #4ade80);
      height: 100%;
      width: 100%;
      transition: width 0.3s ease;
    }

    .mp-fill {
      background: linear-gradient(90deg, #2563eb, #60a5fa);
      height: 100%;
      width: 100%;
      transition: width 0.3s ease;
    }

    .bar-text {
      position: absolute;
      width: 100%;
      text-align: center;
      top: 0;
      font-size: 0.95rem;
      line-height: 18px;
      color: #fff;
      text-shadow: 1px 1px 3px #000;
      font-family: monospace;
    }

    .gold-display {
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 5px;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
      font-size: 1.4rem;
    }

    .weapon-badge {
      font-size: 1.1rem;
      color: var(--cyan);
      border: 1px solid var(--cyan);
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.5);
    }

    /* ボタン類 */
    .sys-btn {
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--cyan);
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      font-size: 1.1rem;
    }

    .sys-btn:hover {
      background: var(--cyan);
      color: #000;
      box-shadow: 0 0 15px var(--cyan);
      transform: translateY(-2px);
    }

    .action-btn {
      background: var(--gold);
      color: #000;
      border: none;
    }

    .action-btn:hover {
      background: #fde047;
      box-shadow: 0 0 20px var(--gold);
    }

    /* スキルボタン */
    .skill-btn {
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.3);
      padding: 8px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      text-shadow: 1px 1px 2px #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.3;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
    }

    .skill-btn span {
      font-size: 0.8rem;
      opacity: 0.9;
    }

    .skill-btn:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.05);
      filter: brightness(1.2);
    }

    .skill-btn:disabled {
      background: #334155 !important;
      color: #94a3b8;
      cursor: not-allowed;
      border-color: #1e293b;
      box-shadow: none;
      transform: none;
    }

    /* メインエリア・スクロール */
    #scroll-area {
      flex-grow: 1;
      overflow-y: auto;
      padding-right: 15px;
      display: flex;
      flex-direction: column;
    }

    #scroll-area::-webkit-scrollbar {
      width: 10px;
    }

    #scroll-area::-webkit-scrollbar-track {
      background: var(--bg);
      border-radius: 5px;
    }

    #scroll-area::-webkit-scrollbar-thumb {
      background: var(--cyan);
      border-radius: 5px;
    }

    .menu-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
      background: rgba(0, 0, 0, 0.5);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    /* フィルタータブ */
    .filter-tabs {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 15px;
    }

    .filter-btn {
      background: var(--panel);
      border: 2px solid var(--cyan);
      color: var(--cyan);
      border-radius: 20px;
      padding: 10px 22px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 1.1rem;
      font-weight: bold;
      transition: 0.2s;
    }

    .filter-btn:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    .filter-btn.active {
      background: var(--cyan);
      color: #000;
      box-shadow: 0 0 15px var(--cyan);
    }

    /* シナリオ表示エリア（長文対応） */
    #scenario-box {
      min-height: 380px;
      padding: 45px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 12px;
      margin-bottom: 25px;
      line-height: 2.3;
      font-size: 1.55rem;
      border-left: 8px solid var(--cyan);
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9);
      cursor: pointer;
      position: relative;
      letter-spacing: 1px;
      color: #f1f5f9;
    }

    .click-indicator {
      position: absolute;
      bottom: 15px;
      right: 25px;
      font-size: 1.1rem;
      color: var(--gold);
      animation: blink 1.5s infinite;
      font-weight: bold;
    }

    .typing-cursor {
      border-right: 4px solid var(--cyan);
      margin-left: 4px;
      animation: blink 1s infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    ruby {
      ruby-align: center;
    }

    rt {
      font-size: 0.55em;
      color: var(--gold);
      font-weight: normal;
    }

    /* 選択肢・階層リスト */
    #choices-box,
    #episode-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .choice-btn,
    .episode-btn {
      background: linear-gradient(90deg, #1e293b, #0f172a);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 22px 30px;
      font-size: 1.4rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      position: relative;
      overflow: hidden;
      line-height: 1.6;
    }

    .choice-btn:hover,
    .episode-btn:hover {
      background: #2a3a5c;
      border-color: var(--cyan);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      transform: translateX(6px);
    }

    .choice-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 6px;
      height: 100%;
      background: var(--cyan);
      opacity: 0;
      transition: 0.2s;
    }

    .choice-btn:hover::before {
      opacity: 1;
    }

    /* 未解放（ロック）状態のエピソード */
    .locked-episode {
      background: #0f172a !important;
      border-color: #334155 !important;
      opacity: 0.7;
      cursor: not-allowed;
    }

    .locked-episode:hover {
      transform: none !important;
      box-shadow: none !important;
    }

    .locked-episode::before {
      display: none;
    }

    .clear-badge {
      position: absolute;
      right: 25px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--gold);
      color: #000;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
    }

    .cat-badge {
      display: inline-block;
      background: #000;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 5px 15px;
      border-radius: 8px;
      margin-right: 15px;
      color: var(--cyan);
      border: 1px solid var(--cyan);
    }

    /* モーダル群 */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--panel);
      padding: 40px;
      border-radius: 16px;
      border: 3px solid var(--cyan);
      text-align: center;
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.4);
      max-width: 650px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
    }

    /* 拠点・魔法屋・ガチャUI */
    .shop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.5);
      padding: 25px;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: left;
    }

    .shop-buy-btn {
      background: var(--gold);
      color: #000;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      font-size: 1.2rem;
    }

    .shop-buy-btn:hover {
      filter: brightness(1.1);
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.8);
      transform: translateY(-2px);
    }

    .gacha-box {
      background: rgba(192, 132, 252, 0.1);
      border: 2px solid var(--purple);
      border-radius: 12px;
      padding: 30px;
      margin-top: 30px;
    }

    .gacha-btn {
      background: linear-gradient(45deg, var(--purple), var(--blue));
      color: white;
      font-size: 1.4rem;
      padding: 18px;
      width: 100%;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      text-shadow: 1px 1px 3px #000;
      transition: 0.2s;
    }

    .gacha-btn:hover {
      filter: brightness(1.2);
      box-shadow: 0 0 25px var(--purple);
      transform: scale(1.02);
    }

    .equip-display {
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1.2rem;
      text-align: left;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .equip-name {
      color: var(--green);
      font-size: 1.5rem;
      font-weight: bold;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="game-container">
    <h1 class="game-title">言葉の天空城 -100階層の攻略-</h1>

    <div id="status-bar" class="hidden">
      <div class="stat-group">
        <div style="font-size:1.5rem; color:var(--gold);">Lv.<span id="ui-level">1</span></div>
        <div>
          <div class="bar-container">
            <div id="ui-hp-fill" class="hp-fill"></div>
            <div class="bar-text">HP: <span id="ui-hp">50</span> / <span id="ui-maxhp">50</span></div>
          </div>
          <div class="bar-container" style="height:16px; margin-top:6px;">
            <div id="ui-mp-fill" class="mp-fill"></div>
            <div class="bar-text" style="line-height:16px; font-size:0.8rem;">MP: <span id="ui-mp">20</span> / <span id="ui-maxmp">20</span></div>
          </div>
        </div>
      </div>
      <div class="stat-group">
        <div class="weapon-badge" id="ui-weapon">剣: 初心者の剣</div>
        <div style="font-size:1.2rem; color:#94a3b8;">EXP: <span id="ui-exp">0</span></div>
        <div class="gold-display" style="font-size:1.6rem;">🪙<span id="ui-gold">0</span></div>
      </div>
      <div class="stat-group">
        <!-- スキルボタン群 -->
        <button id="btn-skill-heal" class="skill-btn" style="background:var(--green);" title="MP10消費: HP30回復">
          癒しの光<span>MP: 10</span>
        </button>
        <button id="btn-skill-analyze" class="skill-btn" style="background:var(--blue);" title="MP5消費: 敵の弱点(ヒント)を看破">
          ふくろうの瞳<span>MP: 5</span>
        </button>
        <button id="btn-skill-burst" class="skill-btn" style="background:var(--purple);" title="MP25消費: 強制クリア">
          星屑の剣技<span>MP: 25</span>
        </button>
        <button id="btn-back-title" class="sys-btn" style="margin-left:10px;">帰還</button>
      </div>
    </div>

    <div id="scroll-area">
      <!-- 拠点（タイトル）画面 -->
      <div id="episode-select">
        <div class="menu-bar">
          <div style="display:flex; gap:12px;">
            <button id="btn-toggle-ruby" class="sys-btn" style="border-color:var(--gold); color:var(--gold);">🔤 ふりがな: ON</button>
            <button id="btn-open-shop" class="sys-btn action-btn" style="font-size:1.2rem;">🏕️ 安全な拠点へ</button>
            <button id="btn-achievements" class="sys-btn" style="color:var(--cyan); border-color:var(--cyan);">🏆 冒険の記録</button>
          </div>
          <div style="display:flex; gap:12px; align-items:center;">
            <div class="gold-display" style="font-size:1.8rem; font-weight:bold; margin-right:20px;">🪙 所持金: <span id="title-gold">0</span> G</div>
            <button id="btn-save" class="sys-btn">💾 セーブ</button>
            <button id="btn-load" class="sys-btn">📂 ロード</button>
          </div>
        </div>

        <div class="filter-tabs" id="filter-container">
          <button class="filter-btn active" data-cat="all">全階層</button>
          <button class="filter-btn" data-cat="第一層">第一層：始まりの街</button>
          <button class="filter-btn" data-cat="第二層">第二層：草原の迷宮</button>
          <button class="filter-btn" data-cat="第三層">第三層：星空の大広間</button>
          <button class="filter-btn" data-cat="天空">天空の塔 (無限攻略)</button>
        </div>

        <div id="episode-list"></div>
      </div>

      <!-- 迷宮（プレイ）画面 -->
      <div id="play-screen" class="hidden">
        <div id="scenario-box">
          <div id="story-text" style="margin:0;"></div>
          <div class="click-indicator hidden" id="click-indicator">▼ クリックでテキストを全表示</div>
        </div>
        <div id="choices-box"></div>
      </div>
    </div>
  </div>

  <!-- ショップ・魔法陣 モーダル -->
  <div id="shop-modal" class="modal-overlay">
    <div class="modal-content">
      <h2 style="color:var(--cyan); margin-top:0; font-size:2.2rem; letter-spacing:2px;">安全な拠点 -武器と魔法の店-</h2>
      <p style="color:#94a3b8; margin-bottom:30px; font-size:1.3rem;">現在の所持金: <span id="shop-gold-display" style="color:var(--gold); font-weight:bold; font-size:1.6rem;">0</span> G</p>

      <div class="shop-item">
        <div>
          <h3 style="margin:0 0 10px 0; color:var(--green); font-size:1.6rem;">🛌 宿屋で休む</h3>
          <p style="margin:0; font-size:1.1rem; color:#cbd5e1;">ふかふかのベッドで、HPとMPを完全回復する。</p>
        </div>
        <button class="shop-buy-btn" onclick="buyHeal(40)">40 G 支払う</button>
      </div>

      <div class="gacha-box">
        <h3 style="margin:0 0 12px 0; color:var(--purple); font-size:1.7rem;">✨ 武器召喚の魔法陣 (ガチャ)</h3>
        <p style="margin:0 0 20px 0; font-size:1.1rem; color:#cbd5e1;">強力な武器を引き当てると、敵から受けるダメージを永続的に減らせるぞ。</p>
        <div class="equip-display">
          現在の装備：<span class="equip-name" id="shop-current-weapon">初心者の剣</span><br>
          <span style="font-size:1rem; color:#94a3b8;">(敵の攻撃を防ぐ力[ダメージ軽減]: <span id="shop-current-dmgred">0</span>)</span>
        </div>
        <button class="gacha-btn" onclick="drawGacha(150)">150 G で魔法陣にお祈りする</button>
      </div>

      <button id="btn-close-shop" class="sys-btn" style="margin-top:35px; width:100%; font-size:1.3rem; padding:18px;">冒険に戻る</button>
    </div>
  </div>

  <!-- 実績モーダル -->
  <div id="achievement-modal" class="modal-overlay">
    <div class="modal-content">
      <h2 style="color:var(--gold); margin-top:0; font-size:2.2rem;">🏆 冒険の記録</h2>
      <div id="achievement-list" style="text-align:left; margin-bottom:25px; line-height:1.7; max-height: 450px; overflow-y:auto; padding-right:15px;"></div>
      <button id="btn-close-achievements" class="sys-btn" style="width:100%; font-size:1.3rem; padding:18px;">閉じる</button>
    </div>
  </div>

  <!-- システムアラート モーダル -->
  <div id="alert-modal" class="modal-overlay" style="z-index: 200;">
    <div class="modal-content">
      <h2 id="alert-title" style="color:var(--cyan); margin-top:0; font-size:2.2rem; letter-spacing:2px;">お知らせ</h2>
      <p id="alert-message" style="font-size:1.4rem; line-height:1.8; color:#fff; padding: 20px 0;"></p>
      <button id="btn-close-alert" class="sys-btn action-btn" style="width:100%; margin-top:10px; font-size:1.3rem; padding:15px;">OK</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      /* =========================================
         1. コアシステムと状態管理
         ========================================= */
      const initialPlayerState = {
        level: 1,
        hp: 50,
        maxHp: 50,
        mp: 20,
        maxMp: 20,
        exp: 0,
        gold: 100,
        weapon: {
          name: "初心者の剣",
          damageReduction: 0
        },
        clearedEpisodes: [],
        achievements: []
      };
      const SAVE_KEY = "SkyCastleSave_v3"; // バージョン更新
      let player = JSON.parse(JSON.stringify(initialPlayerState));
      let isFuriganaOn = true;
      let currentFilter = "all";

      function showAlert(title, message) {
        document.getElementById("alert-title").innerText = title;
        document.getElementById("alert-message").innerHTML = message;

         ========================================= */
      let typeTimer = null;
      let skipTypingFunction = null;

      function applyRuby(rawText) {
        if (!rawText) return "";
        if (isFuriganaOn) {
          return rawText.replace(/\[([^:]+):([^\]]+)\]/g, "<ruby>$1<rt>$2</rt></ruby>");
        } else {
          return rawText.replace(/\[([^:]+):([^\]]+)\]/g, "$1");
        }
      }

      function typeTextRobust(targetElement, rawString, speed, onComplete) {
        clearInterval(typeTimer);
        targetElement.innerHTML = "";
        const htmlString = applyRuby(rawString);
        const regex = /<ruby>.*?<\/ruby>|<[^>]+>|[\s\S]/g;
        const tokens = [];
        let match;
        while ((match = regex.exec(htmlString)) !== null) {
          tokens.push(match[0]);
        }
        let index = 0;
        let currentHTML = "";
        document.getElementById("click-indicator").classList.remove("hidden");
        skipTypingFunction = () => {
          clearInterval(typeTimer);
          targetElement.innerHTML = htmlString;
          document.getElementById("click-indicator").classList.add("hidden");
          skipTypingFunction = null;
          if (onComplete) onComplete();
        };
        typeTimer = setInterval(() => {
          if (index < tokens.length) {
            currentHTML += tokens[index];
            targetElement.innerHTML = currentHTML + "<span class='typing-cursor'></span>";
            index++;
          } else {
            skipTypingFunction();
          }
        }, speed);
      }
      document.getElementById("scenario-box").onclick = () => {
        if (skipTypingFunction) skipTypingFunction();
      };

          "「お[前:まえ]の[作:つく]った[偽物:にせもの]の[世界:せかい]など、[僕:ぼく]が[壊:こわ]してやる！」<br>[僕:ぼく]が[魂:たましい]を込めて[叫:さけ]ぶと、[手:て]にした[剣:けん]がまばゆい[黄金:おうごん]の[光:ひか]りに[包:つつ]まれた。<br><br>それは、この『[言葉:ことば]の[天空城:てんくうじょう]』において、[強:つよ]い[意志:いし]の[力:ちから]を持った『言葉』そのものが、[強力:きょうりょく]な[魔法:まほう]の[力:ちから]へと[変換:へんかん]された[奇跡:きせき]の[瞬間:しゅんかん]だった。<br>「みんなの[想:おも]い……いけええええっ！！」<br>[黄金:おうごん]の[一撃:いちげき]が、[管理者:かんりしゃ]の[絶対的:ぜったいてき]なバリアを[粉砕:ふんさい]する！",
          "【問題】主人公の剣が光った理由は何ですか？", "主人公が何を言ったから光ったのかな？", "[主人公:しゅじんこう]の[強:つよ]い[言葉:ことば]の[力:ちから]が、[剣:けん]に[宿:やど]ったから", ["[管理者:かんりしゃ]が[間違:まちが]えて[魔法:まほう]をかけてしまったから", "そういう[仕様:しよう]のレアな[剣:けん]だったから"]
        )
      });
      // 【自動生成：11〜100章】
      const tpls = [{
          c: "天空",
          t: "トラップルーム",
          d: "接続詞",
          q: "[部屋:へや]の[扉:とびら]が[閉:し]まり、水が[溢:あふ]れ出してきた。（ ）[僕:ぼく]は[焦:あせ]らずに[氷:こおり]の[魔法:まほう]で水を凍らせた。",
          h: "逆の展開だよ",
          a: "しかし",
          w: ["だから", "なぜなら"]
        },
        {
          c: "天空",
          t: "亡霊の嘆き",
          d: "指示語",
          q: "「[頼:たの]む、[私:わたし]の大切な【[銀:ぎん]の[時計:とけい]】を[探:さが]して！『それ』がないと困るんだ！」と[幽霊:ゆうれい]が言った。『それ』とは？",
          h: "直前の言葉",
          a: "[銀:ぎん]の[時計:とけい]",
          w: ["[幽霊:ゆうれい]", "[魔法:まほう]"]
        },
        {
          c: "天空",
          t: "影の刺客",
          d: "主語",
          q: "『[夜空:よぞら]に[紛:まぎ]れた【[暗殺者:あんさつしゃ]】が、[背後:はいご]から[忍:しの]び[寄:よ]る』[忍:しの]び[寄:よ]るの誰？",
          h: "「〜が」",
          a: "[暗殺者:あんさつしゃ]",
          w: ["[夜空:よぞら]", "[背後:はいご]"]
        },
        {
          c: "天空",
          t: "死線の果てに",
          d: "心情",
          q: "[仲間:なかま]を[庇:かば]って[倒:たお]れた[騎士:きし]は、[静:しず]かに[微笑:ほほえ]みながら[目:め]を[閉:と]じた。どんな気持ち？",
          h: "満足している様子だよ",
          a: "[仲間:なかま]を[守:まも]り[切:き]って[満足:まんぞく]している",
          w: ["[痛:いた]くて[後悔:こうかい]している", "[敵:てき]に[怒:おこ]っている"]
        },
        {
          c: "天空",
          t: "封印の呪縛",
          d: "類義語",
          q: "この[宝箱:たからばこ]には[強力:きょうりょく]な【[呪縛:じゅばく]】の魔法がかけられている。同じ意味の言葉は？",
          h: "縛り付けること",
          a: "[束縛:そくばく]・[縛:しば]り",
          w: ["[解放:かいほう]・[自由:じゆう]", "[破壊:はかい]・[消滅:しょうめつ]"]
        }
      ];
      const sceneries = [
        "[見渡:みわた]す[限:かぎ]り[青空:あおぞら]が広がるガラスの[回廊:かいろう]。まるで[雲:くも]の[上:うえ]を[歩:ある]いているようで、とても[気持:きも]ちがいい。",
        "キラキラと[星:ほし]が[降:ふ]る[夜:よる]の[塔:とう]。[壁:かべ]には[綺麗:きれい]な[星座:せいざ]の[絵:え]が[描:えが]かれている。",
        "[大:おお]きな[歯車:はぐるま]がゆっくりと回る[時計:とけい]の[塔:とう]。カチコチと[心地:ここち]よい[音:おと]が[響:ひび]いている。",
        "[暖炉:だんろ]の[火:ひ]がポカポカと[暖:あたた]かい[図書館:としょかん]のような[部屋:へや]。たくさんの[本:ほん]が[空:そら]を[飛:と]んでいる。",
        "[色:いろ]とりどりのクリスタルが[輝:かがや]く[水晶:すいしょう]の[部屋:へや]。[光:ひかり]が[反射:はんしゃ]して[虹色:にじいろ]に[輝:かがや]いている。"
      ];
      for (let i = 11; i <= 100; i++) {
        let t = tpls[i % tpls.length];
        let scenery = sceneries[i % sceneries.length];
        let dmg = 15 + Math.floor(i / 4);
        let gld = 40 + Math.floor(i / 2);
        episodes.push({
          id: "ep" + i,
          category: t.c,
          title: `第${i}階：${t.t}`,
          description: `魔法の試練（${t.d}）`,
          nodes: makeScene(
            `ここは[第:だい]${i}[階層:かいそう]。${scenery}<br><br>${t.q}`,
            "先に進むための、正しい答えを選ぼう。", t.h, t.a, t.w, dmg, gld, 50
          )
        });
      }
      /* =========================================
         5. メインゲームループ・UI更新
         ========================================= */
      function updateUI() {
        document.getElementById("ui-level").innerText = player.level;
        document.getElementById("ui-hp").innerText = player.hp;
        document.getElementById("ui-maxhp").innerText = player.maxHp;
        document.getElementById("ui-mp").innerText = player.mp;
        document.getElementById("ui-maxmp").innerText = player.maxMp;
        document.getElementById("ui-gold").innerText = player.gold;
        document.getElementById("title-gold").innerText = player.gold;
        document.getElementById("ui-exp").innerText = player.exp;
        document.getElementById("ui-weapon").innerText = `剣: ${player.weapon.name}`;
        let hpPct = Math.max(0, (player.hp / player.maxHp) * 100);
        let hpFill = document.getElementById("ui-hp-fill");
        hpFill.style.width = hpPct + "%";
        hpFill.style.background = hpPct < 30 ? "linear-gradient(90deg, #b91c1c, #f87171)" : "linear-gradient(90deg, #16a34a, #4ade80)";
        let mpPct = Math.max(0, (player.mp / player.maxMp) * 100);
        document.getElementById("ui-mp-fill").style.width = mpPct + "%";
        document.getElementById("btn-skill-heal").disabled = (player.mp < 10 || player.hp >= player.maxHp);
        document.getElementById("btn-skill-analyze").disabled = (player.mp < 5 || !currentNode || !currentNode.hint);
        document.getElementById("btn-skill-burst").disabled = (player.mp < 25 || !currentNode);
      }
      let currentEpisodeId = "";
      let currentEpisodeNodes = [];
      let currentNode = null;
      // 拠点でのエピソード一覧描画（アンロックシステムの追加）
      function renderList() {
        document.getElementById("episode-select").classList.remove("hidden");
        document.getElementById("play-screen").classList.add("hidden");
        document.getElementById("status-bar").classList.add("hidden");
        const list = document.getElementById("episode-list");
        list.innerHTML = "";
        episodes.forEach((ep, index) => {
          if (currentFilter !== "all" && ep.category !== currentFilter) return;
          // 前の階層がクリアされているか判定 (第1層は常に解放)
          let isUnlocked = true;
          let realIndex = episodes.findIndex(e => e.id === ep.id);
          if (realIndex > 0) {
            let prevEpId = episodes[realIndex - 1].id;
            isUnlocked = player.clearedEpisodes.includes(prevEpId);
          }
          let btn = document.createElement("button");
          btn.className = "episode-btn" + (isUnlocked ? "" : " locked-episode");
          if (isUnlocked) {
            let badge = player.clearedEpisodes.includes(ep.id) ? `<span class="clear-badge">踏破済</span>` : "";
            btn.innerHTML = `<div style="margin-bottom:10px;"><span class="cat-badge">${ep.category}</span><strong style="color:var(--cyan); font-size:1.5rem;">${applyRuby(ep.title)}</strong></div>
                             <div style="font-size:1.15rem; color:#94a3b8;">${applyRuby(ep.description)}</div>${badge}`;
            btn.onclick = () => {
              startEpisode(ep.id);
            };
          } else {
            // 未解放の場合は鍵アイコンを表示し、クリック時にアラートを出す
            btn.innerHTML = `<div style="margin-bottom:10px;"><span class="cat-badge" style="border-color:#475569; color:#94a3b8;">${ep.category}</span><strong style="color:#64748b; font-size:1.5rem;">🔒 未解放の階層</strong></div>
                             <div style="font-size:1.15rem; color:#475569;">前の階層をクリアすると挑戦できます</div>`;
            btn.onclick = () => {
              showAlert("🔒 未解放", "前の階層をクリアすると、この物語のロックが解除されます！");
            };
          }
          list.appendChild(btn);
        });
        updateUI();
      }

      function startEpisode(epId) {
        currentEpisodeId = epId;
        currentEpisodeNodes = episodes.find(e => e.id === epId).nodes;
        document.getElementById("episode-select").classList.add("hidden");
        document.getElementById("play-screen").classList.remove("hidden");
        document.getElementById("status-bar").classList.remove("hidden");
        showScene(1);
      }

      function showScene(nodeId) {
        if (nodeId === "CLEAR") {
          if (!player.clearedEpisodes.includes(currentEpisodeId)) {
            player.clearedEpisodes.push(currentEpisodeId);
            localStorage.setItem(SAVE_KEY, JSON.stringify(player));
            checkAchievements();
          }
          showAlert("階層踏破！", "見事に試練をクリアし、多額のゴールドを獲得した！<br>（HPとMPが少し自然回復したよ）<br><br><b>新しい階層が解放されました！</b>");
          player.hp = Math.min(player.maxHp, player.hp + 20);
          player.mp = Math.min(player.maxMp, player.mp + 10);
          currentNode = null;
          renderList();
          return;
        }
        currentNode = currentEpisodeNodes.find(n => n.id === nodeId);
        document.getElementById("choices-box").innerHTML = "";
        if (currentNode.damage) {
          let actualDamage = Math.max(1, currentNode.damage - player.weapon.damageReduction);
          player.hp -= actualDamage;
          let c = document.getElementById("game-container");
          c.classList.add("shake-effect", "flash-damage");
          setTimeout(() => c.classList.remove("shake-effect", "flash-damage"), 600);
          if (player.hp <= 0) {
            player.hp = 0;
            updateUI();
            gameOver();
            return;
          }
        }
        if (currentNode.exp) {
          player.exp += currentNode.exp;
          player.gold += currentNode.gold;
          if (player.exp >= player.level * 60) {
            player.level++;
            player.maxHp += 20;
            player.maxMp += 10;
            player.hp = player.maxHp;
            player.mp = player.maxMp;
            setTimeout(() => showAlert("🆙 レベルアップ！", `Lv.${player.level}に到達！<br>最大HPとMPが大幅に増加し、全回復した！`), 300);
          }
        }
        updateUI();
        typeTextRobust(document.getElementById("story-text"), currentNode.text, 30, () => {
          renderChoices(currentNode.choices);
        });
      }

      function renderChoices(choices) {
        const box = document.getElementById("choices-box");
        box.innerHTML = "";
        choices.forEach(c => {
          let btn = document.createElement("button");
          btn.className = "choice-btn";
          btn.innerHTML = applyRuby(c.text);
          btn.onclick = (e) => {
            e.stopPropagation();
            showScene(c.nextId);
          };
          box.appendChild(btn);
        });
      }

      function gameOver() {
        document.getElementById("game-container").classList.add("timeloop-effect");
        document.getElementById("story-text").innerHTML = "<span style='color:var(--cyan); font-size:2.8rem; font-weight:bold;'>TIME REVERSAL...</span><br><br>HPが0になってしまった。意識が遠のく中、『時戻りの魔法』が発動する……。<br>（ペナルティなしで、安全な拠点へ強制送還されます）";
        document.getElementById("click-indicator").classList.add("hidden");
        document.getElementById("choices-box").innerHTML = `<button class="choice-btn" style="text-align:center; color:var(--gold);" onclick="respawn()">時を戻す (拠点へ)</button>`;
      }
      window.respawn = () => {
        document.getElementById("game-container").classList.remove("timeloop-effect");
        player.hp = player.maxHp;
        player.mp = player.maxMp;
        currentNode = null;
        renderList();
      };
      /* =========================================
         6. スキルシステム
         ========================================= */
      document.getElementById("btn-skill-heal").onclick = () => {
        if (player.mp >= 10 && player.hp < player.maxHp) {
          player.mp -= 10;
          player.hp = Math.min(player.maxHp, player.hp + 30);
          let c = document.getElementById("game-container");
          c.style.boxShadow = "inset 0 0 150px rgba(74, 222, 128, 0.8)";
          setTimeout(() => c.style.boxShadow = "0 0 50px rgba(56, 189, 248, 0.2)", 800);
          updateUI();
        }
      };
      document.getElementById("btn-skill-analyze").onclick = () => {
        if (player.mp >= 5 && currentNode && currentNode.hint) {
          player.mp -= 5;
          updateUI();
          showAlert("🦉 ふくろうの瞳 (ヒント)", applyRuby(currentNode.hint));
        }
      };
      document.getElementById("btn-skill-burst").onclick = () => {
        if (player.mp >= 25 && currentNode) {
          if (confirm("MPを25消費して、強力なソードスキルでこの問題を強制突破しますか？")) {
            player.mp -= 25;
            updateUI();
            if (skipTypingFunction) skipTypingFunction();
            document.getElementById("story-text").innerHTML += "<br><br><span style='color:var(--purple); font-weight:bold; font-size:1.8rem;'>「星屑の剣技（スターバースト）！！」</span><br>圧倒的な剣技が敵を粉砕し、強制的に道を切り拓いた！";
            document.getElementById("choices-box").innerHTML = `<button class="choice-btn" style="color:var(--cyan); text-align:center;" onclick="showScene('CLEAR')">次の階層へ進む（強制クリア）</button>`;
          }
        }
      };
      /* =========================================
         7. 拠点・ショップ・武器ガチャシステム
         ========================================= */
      document.getElementById("btn-open-shop").onclick = () => {
        document.getElementById("shop-gold-display").innerText = player.gold;
        document.getElementById("shop-current-weapon").innerText = player.weapon.name;
        document.getElementById("shop-current-dmgred").innerText = player.weapon.damageReduction;
        document.getElementById("shop-modal").classList.add("active");
      };
      document.getElementById("btn-close-shop").onclick = () => {
        document.getElementById("shop-modal").classList.remove("active");
        updateUI();
        renderList();
      };
      window.buyHeal = (cost) => {
        if (player.gold >= cost) {
          if (player.hp === player.maxHp && player.mp === player.maxMp) {
            showAlert("宿屋", "すでに全回復しているぞ。無理に休む必要はない。");
            return;
          }
          player.gold -= cost;
          player.hp = player.maxHp;
          player.mp = player.maxMp;
          document.getElementById("shop-gold-display").innerText = player.gold;
          showAlert("宿屋", "ふかふかのベッドで休み、HPとMPが完全回復した！");
        } else {
          showAlert("エラー", "ゴールドが足りない！");
        }
      };
      const weapons = [{
          name: "黒曜石の短剣",
          dmgRed: 5,
          prob: 50
        },
        {
          name: "白銀の騎士剣",
          dmgRed: 12,
          prob: 30
        },
        {
          name: "魔剣・ブラッドサースト",
          dmgRed: 25,
          prob: 15
        },
        {
          name: "神聖剣・エクスカリバー",
          dmgRed: 40,
          prob: 5
        }
      ];
      window.drawGacha = (cost) => {
        if (player.gold >= cost) {
          player.gold -= cost;
          document.getElementById("shop-gold-display").innerText = player.gold;
          let rand = Math.random() * 100;
          let sum = 0;
          let drewWeapon = null;
          for (let w of weapons) {
            sum += w.prob;
            if (rand <= sum) {
              drewWeapon = w;
              break;
            }
          }
          if (drewWeapon.dmgRed > player.weapon.damageReduction) {
            player.weapon = {
              name: drewWeapon.name,
              damageReduction: drewWeapon.dmgRed
            };
            showAlert("🎉 武器召喚 結果！", `<span style="color:var(--gold); font-size:2rem; font-weight:bold;">${drewWeapon.name}</span> を引き当てた！<br><br>敵から受けるダメージを永続的に <span style="color:var(--cyan); font-weight:bold;">${drewWeapon.dmgRed}</span> 軽減する！`);
          } else {
            showAlert("武器召喚 結果", `${drewWeapon.name} が出たが、今の武器の方が強いので捨てた。`);
          }
          document.getElementById("shop-current-weapon").innerText = player.weapon.name;
          document.getElementById("shop-current-dmgred").innerText = player.weapon.damageReduction;
        } else {
          showAlert("エラー", "ゴールドが足りない！");
        }
      };
      /* =========================================
         8. その他 UI・セーブ・実績 イベント
         ========================================= */
      document.getElementById("btn-toggle-ruby").onclick = (e) => {
        isFuriganaOn = !isFuriganaOn;
        e.target.innerText = isFuriganaOn ? "🔤 ふりがな: ON" : "🔤 ふりがな: OFF";
        renderList();
        if (!document.getElementById("play-screen").classList.contains("hidden") && currentNode) {
          if (skipTypingFunction) skipTypingFunction();
          document.getElementById("story-text").innerHTML = applyRuby(currentNode.text);
          renderChoices(currentNode.choices);
        }
      };
      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.onclick = (e) => {
          document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
          e.target.classList.add("active");
          currentFilter = e.target.getAttribute("data-cat");
          renderList();
        };
      });
      document.getElementById("btn-back-title").onclick = () => {
        if (confirm("迷宮から離脱して安全な拠点へ戻りますか？（ペナルティなし）")) {
          if (skipTypingFunction) skipTypingFunction();
          currentNode = null;
          renderList();
        }
      };
      document.getElementById("btn-save").onclick = () => {
        localStorage.setItem(SAVE_KEY, JSON.stringify(player));
        showAlert("セーブ", "現在の状態を冒険の書に保存しました。");
      };
      document.getElementById("btn-load").onclick = () => {
        let d = localStorage.getItem(SAVE_KEY);
        if (d) {
          player = JSON.parse(d);
          showAlert("ロード", "冒険の書からデータを復元しました。");
          renderList();
        } else showAlert("エラー", "データがありません。");
      };
      const achievementsList = [{
          id: "a1",
          req: 1,
          title: "生存の証明",
          desc: "初めて階層をクリアした証。"
        },
        {
          id: "a10",
          req: 10,
          title: "前線攻略組",
          desc: "10階層をクリアした証。"
        },
        {
          id: "a50",
          req: 50,
          title: "黒の剣士",
          desc: "50階層をクリアした証。"
        },
        {
          id: "a100",
          req: 100,
          title: "天空の星王",
          desc: "全100階層を制覇した！君こそが最強のプレイヤーだ！"
        }
      ];

      function checkAchievements() {
        let clears = player.clearedEpisodes.length;
        achievementsList.forEach(a => {
          if (clears >= a.req && !player.achievements.includes(a.id)) {
            player.achievements.push(a.id);
            showAlert("🏆 称号獲得！", `<h1 style="color:var(--gold); margin:10px 0;">${a.title}</h1><p>${a.desc}</p>`);
          }
        });
      }
      document.getElementById("btn-achievements").onclick = () => {
        const listDiv = document.getElementById("achievement-list");
        listDiv.innerHTML = `<p style="text-align:center; color:#94a3b8; font-size:1.3rem;">現在の踏破階層: ${player.clearedEpisodes.length} / 100</p>`;
        if (player.achievements.length === 0) listDiv.innerHTML += `<p style="text-align:center;">まだ獲得した称号はありません。</p>`;
        else player.achievements.forEach(id => {
          let a = achievementsList.find(x => x.id === id);
          listDiv.innerHTML += `<div style="background:var(--bg); padding:18px; margin-bottom:12px; border-left:6px solid var(--cyan); border-radius:8px;"><strong style="color:var(--cyan); font-size:1.4rem;">${a.title}</strong><br><span style="font-size:1.1rem; color:#94a3b8;">${a.desc}</span></div>`;
        });
        document.getElementById("achievement-modal").classList.add("active");
      };
      document.getElementById("btn-close-achievements").onclick = () => {
        document.getElementById("achievement-modal").classList.remove("active");
      };
      renderList();
    });
  </script>
</body>

</html>

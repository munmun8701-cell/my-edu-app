<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>言葉の天空上</title>
    <meta name="viewport" content="width=device-width"><link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">


  </head>
    
  <body>
  <!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070b1a">
  <title>言葉の天空城 -100階層の攻略-</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg0: #060a18;
      --bg1: #0b1430;
      --ink: #f1f5f9;
      --ink2: #cbd5e1;
      --mute: #8b9bb4;
      --panel: rgba(12, 19, 40, .80);
      --panel2: rgba(22, 32, 62, .88);
      --line: rgba(148, 163, 184, .18);
      --line2: rgba(148, 163, 184, .32);
      --gold: #fbbf24;
      --gold2: #fde68a;
      --cyan: #38bdf8;
      --green: #4ade80;
      --red: #f87171;
      --purple: #c084fc;
      --blue: #60a5fa;
      --ac: #38bdf8;
      --ac2: rgba(56, 189, 248, .25);
      --sky1: #0b1e3f;
      --sky2: #060a18;
      --r: 18px;
      --font: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Hiragino Kaku Gothic ProN', 'BIZ UDPGothic', Meiryo, sans-serif;
      --pix: 'DotGothic16', 'Zen Maru Gothic', monospace;
    }

    * {
      box-sizing: border-box
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg0);
      color: var(--ink);
      font-family: var(--font);
      font-weight: 500;
      font-size: clamp(15px, 1.25vw + 9px, 18px);
      line-height: 1.7;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent
    }

    button {
      font-family: inherit;
      color: inherit;
      cursor: pointer;
      border: 0;
      background: none;
      font-size: inherit
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px
    }

    .hidden {
      display: none !important
    }

    ruby {
      ruby-position: over
    }

    rt {
      font-size: .5em;
      color: var(--gold2);
      font-weight: 500;
      letter-spacing: 0;
      opacity: .95;
      margin-inline: -.3em
    }

    body.no-ruby rt {
      display: none
    }

    /* ===== sky background ===== */
    #sky {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: radial-gradient(120% 80% at 50% -10%, var(--sky1) 0%, var(--sky2) 70%);
      transition: background 1s
    }

    #sky .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #fff;
      opacity: .7;
      animation: twinkle var(--d, 3s) ease-in-out infinite;
      animation-delay: var(--dl, 0s)
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: .15;
        transform: scale(.8)
      }

      50% {
        opacity: .95;
        transform: scale(1.2)
      }
    }

    #sky .cloud {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(255, 255, 255, .10), transparent);
      filter: blur(6px);
      animation: drift var(--d, 80s) linear infinite
    }

    @keyframes drift {
      from {
        transform: translateX(-30vw)
      }

      to {
        transform: translateX(130vw)
      }
    }

    #sky .aurora {
      position: absolute;
      inset: -20% -10% auto -10%;
      height: 60%;
      background: conic-gradient(from 200deg at 50% 100%, transparent 0deg, var(--ac2) 60deg, transparent 120deg, rgba(192, 132, 252, .12) 200deg, transparent 260deg);
      filter: blur(40px);
      opacity: .7;
      animation: aur 18s ease-in-out infinite alternate
    }

    @keyframes aur {
      to {
        transform: translateX(6%) rotate(4deg)
      }
    }

    #app {
      position: relative;
      z-index: 1;
      max-width: 1140px;
      margin: 0 auto;
      padding: max(12px, env(safe-area-inset-top)) 16px 24px;
      min-height: 100vh;
      min-height: 100dvh
    }

    .screen {
      display: none;
      animation: fadeIn .45s ease
    }

    .screen.active {
      display: block
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    /* ===== common ===== */
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: 0 10px 40px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px)
    }

    .btn {
      display: inline-block;
      text-align: center;
      vertical-align: middle;
      line-height: 1.45;
      min-height: 48px;
      padding: .72em 1.3em;
      border-radius: 14px;
      font-weight: 700;
      background: linear-gradient(180deg, #24345e, #17223f);
      border: 1px solid var(--line2);
      box-shadow: 0 4px 0 #0a1124, 0 6px 16px rgba(0, 0, 0, .35);
      transition: transform .12s, filter .15s, box-shadow .12s;
      user-select: none
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0a1124
    }

    .btn.gold {
      background: linear-gradient(180deg, #fcd34d, #f59e0b);
      color: #1c1300;
      border-color: #fde68a;
      box-shadow: 0 4px 0 #a16207, 0 8px 22px rgba(251, 191, 36, .35)
    }

    .btn.gold:active {
      box-shadow: 0 1px 0 #a16207
    }

    .btn.gold rt,
    .btn.ac rt,
    .tab.on rt,
    .seg button.on rt,
    .t-speaker rt,
    .lv rt {
      color: #5a2a00;
      opacity: .85
    }

    .btn.ac {
      background: linear-gradient(180deg, color-mix(in srgb, var(--ac) 80%, #fff 0%), color-mix(in srgb, var(--ac) 60%, #000));
      color: #04101f;
      border-color: color-mix(in srgb, var(--ac) 60%, #fff)
    }

    .btn.danger {
      background: linear-gradient(180deg, #ef4444, #b91c1c);
      border-color: #fca5a5
    }

    .btn.ghost {
      background: transparent;
      box-shadow: none;
      border-color: var(--line2)
    }

    .btn.big {
      font-size: 1.15em;
      min-height: 58px;
      padding: .78em 1.8em;
      border-radius: 16px
    }

    .btn.wide {
      width: 100%
    }

    .btn:disabled {
      filter: grayscale(1) brightness(.6);
      cursor: not-allowed;
      transform: none
    }

    .ib {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .3em;
      min-height: 44px;
      min-width: 44px;
      padding: 0 .8em;
      border-radius: 12px;
      background: rgba(255, 255, 255, .06);
      border: 1px solid var(--line);
      font-weight: 700
    }

    .ib.on {
      border-color: var(--gold);
      color: var(--gold2)
    }

    .chip {
      display: inline-block;
      vertical-align: middle;
      line-height: 1.6;
      padding: .12em .7em;
      border-radius: 999px;
      font-size: .78em;
      font-weight: 700;
      border: 1px solid var(--line2);
      background: rgba(0, 0, 0, .25);
      white-space: nowrap
    }

    .bar {
      position: relative;
      height: 18px;
      border-radius: 999px;
      background: #050914;
      border: 1px solid var(--line2);
      overflow: hidden
    }

    .bar i {
      position: absolute;
      inset: 0 auto 0 0;
      width: 100%;
      border-radius: 999px;
      transition: width .45s cubic-bezier(.2, .8, .2, 1)
    }

    .bar i::after {
      content: "";
      position: absolute;
      inset: 0 0 50% 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, .35), transparent);
      border-radius: 999px
    }

    .bar b {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 700 11px/1 var(--pix);
      letter-spacing: .5px;
      text-shadow: 0 1px 2px #000
    }

    .bar.hp i {
      background: linear-gradient(90deg, #16a34a, #4ade80)
    }

    .bar.hp.low i {
      background: linear-gradient(90deg, #b91c1c, #f87171);
      animation: pulseLow 1s infinite
    }

    @keyframes pulseLow {
      50% {
        filter: brightness(1.4)
      }
    }

    .bar.mp i {
      background: linear-gradient(90deg, #2563eb, #60a5fa)
    }

    .bar.mp {
      height: 14px
    }

    .bar.exp {
      height: 8px
    }

    .bar.exp i {
      background: linear-gradient(90deg, #a16207, #fbbf24)
    }

    .gold-t {
      color: var(--gold);
      font-weight: 900;
      font-family: var(--pix);
      letter-spacing: .5px
    }

    /* ===== title ===== */
    #scr-title {
      text-align: center;
      padding-top: min(4vh, 40px)
    }

    .castle-wrap {
      position: relative;
      width: min(420px, 82vw);
      margin: 0 auto;
      animation: float 6s ease-in-out infinite
    }

    @keyframes float {
      50% {
        transform: translateY(-12px)
      }
    }

    .castle-wrap svg {
      width: 100%;
      height: auto;
      filter: drop-shadow(0 0 30px rgba(56, 189, 248, .35))
    }

    .logo {
      margin: .2em 0 0;
      font-weight: 900;
      font-size: clamp(2.1rem, 6.5vw, 4rem);
      line-height: 1.15;
      letter-spacing: .08em;
      background: linear-gradient(180deg, #fff7d6 10%, #fbbf24 55%, #b45309 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 3px 0 #3b2300) drop-shadow(0 0 22px rgba(251, 191, 36, .45))
    }

    .logo-sub {
      font-family: var(--pix);
      color: var(--cyan);
      letter-spacing: .35em;
      font-size: clamp(.95rem, 2.4vw, 1.25rem);
      margin: .3em 0 1.2em;
      text-shadow: 0 0 12px rgba(56, 189, 248, .7)
    }

    .save-card {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 12px 20px;
      margin: 0 auto 18px;
      text-align: left
    }

    .save-card .sc-ic {
      font-size: 2rem
    }

    .save-card .sc-n {
      font-weight: 900;
      font-size: 1.1em
    }

    .save-card .sc-d {
      color: var(--ink2);
      font-size: .88em
    }

    .title-btns {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px
    }

    .title-btns .btn.big {
      min-width: min(340px, 86vw)
    }

    .tap-hint {
      margin-top: 14px;
      color: var(--mute);
      font-size: .85em;
      animation: blink 2s infinite
    }

    @keyframes blink {
      50% {
        opacity: .35
      }
    }

    .credit {
      margin-top: 28px;
      color: var(--mute);
      font-size: .78em;
      letter-spacing: .08em
    }

    /* ===== hub ===== */
    .hud {
      position: sticky;
      top: max(8px, env(safe-area-inset-top));
      z-index: 20;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px 16px;
      align-items: center;
      padding: 10px 14px;
      margin-bottom: 14px
    }

    .hud-me {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0
    }

    .lv {
      font-family: var(--pix);
      background: linear-gradient(180deg, #fcd34d, #d97706);
      color: #1c1300;
      border-radius: 10px;
      padding: 2px 8px;
      font-size: .9em;
      white-space: nowrap;
      box-shadow: 0 2px 0 #92400e
    }

    .hud-name {
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 9em
    }

    .hud-bars {
      display: grid;
      gap: 4px;
      min-width: 0
    }

    .hud-right {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .hud-gold {
      font-size: 1.15em;
      white-space: nowrap
    }

    .hub-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 290px;
      gap: 16px;
      align-items: start
    }

    .hub-grid>*,
    .b-grid>* {
      min-width: 0
    }

    .cta {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden
    }

    .cta::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(80% 140% at 0% 50%, var(--ac2), transparent 60%);
      pointer-events: none
    }

    .cta-ic {
      font-size: 2.2rem;
      filter: drop-shadow(0 0 10px var(--ac))
    }

    .cta-t {
      flex: 1;
      min-width: 0;
      position: relative
    }

    .cta-t small {
      display: block;
      color: var(--ink2);
      font-size: .8em
    }

    .cta-t strong {
      font-size: 1.15em
    }

    .areas {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 2px 10px;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin
    }

    .area-card {
      flex: 0 0 auto;
      scroll-snap-align: start;
      width: 112px;
      padding: 10px 8px;
      border-radius: 14px;
      text-align: center;
      background: var(--panel2);
      border: 2px solid var(--line);
      transition: transform .15s, border-color .15s;
      position: relative
    }

    .area-card .ai {
      font-size: 1.9rem;
      line-height: 1.2
    }

    .area-card .an {
      font-weight: 900;
      font-size: .82em;
      line-height: 1.35;
      min-height: 2.7em;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .area-card .ap {
      font-family: var(--pix);
      font-size: .75em;
      color: var(--ink2)
    }

    .area-card.sel {
      border-color: var(--c);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 30%, transparent), 0 0 24px color-mix(in srgb, var(--c) 40%, transparent)
    }

    .area-card.locked {
      opacity: .45;
      filter: grayscale(.8)
    }

    .area-card.done::after {
      content: "✓";
      position: absolute;
      top: 4px;
      right: 8px;
      color: var(--gold);
      font-weight: 900
    }

    .area-panel {
      overflow: hidden
    }

    .area-banner {
      padding: 16px 18px 14px;
      background: linear-gradient(120deg, color-mix(in srgb, var(--ac) 35%, transparent), transparent 70%);
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 14px;
      align-items: center
    }

    .area-banner .ab-ic {
      font-size: 2.6rem;
      filter: drop-shadow(0 0 14px var(--ac))
    }

    .area-banner .ab-sub {
      font-family: var(--pix);
      color: var(--ac);
      font-size: .8em;
      letter-spacing: .2em
    }

    .area-banner h2 {
      margin: 0;
      font-size: 1.45em;
      line-height: 1.3
    }

    .area-banner p {
      margin: .2em 0 0;
      color: var(--ink2);
      font-size: .88em
    }

    .floors {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      padding: 14px
    }

    .fl {
      position: relative;
      min-height: clamp(78px, 10.5vw, 112px);
      border-radius: 14px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .02));
      border: 2px solid var(--line);
      transition: transform .15s, border-color .15s;
      text-align: center
    }

    .fl .fn {
      font-family: var(--pix);
      font-size: 1.2em;
      line-height: 1
    }

    .fl .fe {
      font-size: 1.5em;
      line-height: 1.1
    }

    .fl .fs {
      font-size: .72em;
      letter-spacing: -1px;
      color: var(--gold);
      min-height: 1.2em
    }

    .fl .fs .off {
      color: rgba(255, 255, 255, .18)
    }

    .fl.cleared {
      background: linear-gradient(180deg, color-mix(in srgb, var(--ac) 22%, transparent), rgba(255, 255, 255, .02))
    }

    .fl.next {
      border-color: var(--gold);
      animation: nextGlow 1.6s ease-in-out infinite
    }

    @keyframes nextGlow {
      50% {
        box-shadow: 0 0 0 4px rgba(251, 191, 36, .25), 0 0 22px rgba(251, 191, 36, .5)
      }
    }

    .fl.boss {
      border-style: double;
      border-width: 4px
    }

    .fl.boss .crown {
      position: absolute;
      top: 3px;
      right: 6px;
      font-size: .85em
    }

    .fl.locked {
      opacity: .4;
      cursor: not-allowed
    }

    .fl.locked .fe {
      filter: grayscale(1) brightness(.3)
    }

    .floor-hint {
      padding: 0 14px 14px;
      color: var(--mute);
      font-size: .82em
    }

    .menu {
      display: grid;
      gap: 10px
    }

    .mbtn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      text-align: left;
      transition: transform .12s, border-color .15s;
      position: relative;
      min-height: 62px
    }

    .mbtn .mi {
      font-size: 1.7rem;
      width: 1.6em;
      text-align: center
    }

    .mbtn .mt {
      font-weight: 900;
      line-height: 1.3
    }

    .mbtn .md {
      display: block;
      font-size: .76em;
      color: var(--mute);
      font-weight: 500
    }

    .mbtn .badge {
      position: absolute;
      top: 8px;
      right: 10px;
      background: var(--red);
      color: #fff;
      border-radius: 999px;
      font: 700 12px/20px var(--pix);
      min-width: 20px;
      padding: 0 6px;
      text-align: center
    }

    .mbtn.locked {
      opacity: .5
    }

    .mini-stats {
      padding: 12px 14px;
      font-size: .85em;
      color: var(--ink2);
      display: grid;
      gap: 4px
    }

    .mini-stats b {
      color: var(--ink)
    }

    /* ===== battle ===== */
    .b-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px
    }

    .b-head {
      flex: 1;
      min-width: 0;
      text-align: center
    }

    .b-area {
      font-family: var(--pix);
      font-size: .78em;
      color: var(--ac);
      letter-spacing: .15em
    }

    .b-floor {
      font-weight: 900;
      font-size: 1.15em;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .b-tools {
      display: flex;
      gap: 6px
    }

    .b-grid {
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 16px;
      align-items: start
    }

    .b-left {
      position: sticky;
      top: 12px;
      display: grid;
      gap: 12px
    }

    .arena {
      position: relative;
      padding: 18px 14px 14px;
      text-align: center;
      overflow: hidden;
      background: radial-gradient(90% 70% at 50% 40%, color-mix(in srgb, var(--ac) 22%, transparent), transparent 70%), var(--panel)
    }

    .arena::after {
      content: "";
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: 58px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(0, 0, 0, .55), transparent)
    }

    .e-wrap {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 0 auto 6px;
      display: grid;
      place-items: center;
      z-index: 1
    }

    .e-aura {
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      background: radial-gradient(closest-side, color-mix(in srgb, var(--ac) 45%, transparent), transparent);
      animation: auraP 2.4s ease-in-out infinite
    }

    @keyframes auraP {
      50% {
        transform: scale(1.12);
        opacity: .7
      }
    }

    .e-ring {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity .4s
    }

    .e-wrap.boss .e-ring {
      opacity: 1;
      animation: spin 14s linear infinite
    }

    .e-ring svg {
      width: 100%;
      height: 100%
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .e-sprite {
      position: relative;
      font-size: 96px;
      line-height: 1;
      animation: bob 2.6s ease-in-out infinite;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .5));
      user-select: none
    }

    .e-wrap.boss .e-sprite {
      font-size: 120px
    }

    @keyframes bob {
      50% {
        transform: translateY(-8px)
      }
    }

    .e-wrap.hit .e-sprite {
      animation: hitShake .45s ease
    }

    @keyframes hitShake {

      0%,
      100% {
        transform: none;
        filter: none
      }

      20% {
        transform: translateX(-12px) rotate(-6deg);
        filter: brightness(3) saturate(0)
      }

      40% {
        transform: translateX(10px) rotate(4deg)
      }

      60% {
        transform: translateX(-6px)
      }

      80% {
        transform: translateX(4px)
      }
    }

    .e-wrap.lunge .e-sprite {
      animation: lunge .45s ease
    }

    @keyframes lunge {
      40% {
        transform: scale(1.35) translateY(14px)
      }
    }

    .e-wrap.dead .e-sprite {
      animation: die .9s forwards
    }

    @keyframes die {
      0% {
        filter: brightness(3) saturate(0)
      }

      100% {
        transform: scale(.2) translateY(-40px);
        opacity: 0;
        filter: brightness(4) blur(6px)
      }
    }

    .slash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0
    }

    .slash::before,
    .slash::after {
      content: "";
      position: absolute;
      left: -10%;
      top: 50%;
      width: 120%;
      height: 6px;
      border-radius: 6px;
      background: linear-gradient(90deg, transparent, #fff, var(--gold2), transparent);
      box-shadow: 0 0 18px #fff, 0 0 30px var(--gold)
    }

    .slash::before {
      transform: rotate(-35deg)
    }

    .slash::after {
      transform: rotate(35deg);
      animation-delay: .08s
    }

    .e-wrap.hit .slash {
      animation: slashA .4s ease-out
    }

    @keyframes slashA {
      0% {
        opacity: 0;
        transform: scale(.4)
      }

      30% {
        opacity: 1
      }

      100% {
        opacity: 0;
        transform: scale(1.2)
      }
    }

    .e-name {
      font-weight: 900;
      font-size: 1.05em;
      position: relative;
      z-index: 1
    }

    .ehp {
      position: relative;
      height: 14px;
      margin: 6px 8px 0;
      border-radius: 999px;
      background: #050914;
      border: 1px solid var(--line2);
      overflow: hidden;
      z-index: 1
    }

    .ehp-fill {
      position: absolute;
      inset: 0;
      width: 100%;

    .ehp-segs {
      position: absolute;
      inset: 0;
      display: flex
    }

    .ehp-segs span {
      flex: 1;

    }

    .ehp-segs span:last-child {
      border-right: 0
    }

    .pcard {
      padding: 12px 14px;
      display: grid;
      gap: 6px
    }

    .pc-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px
    }

    .pc-name {
      font-weight: 900
    }

    .combo {
      font-family: var(--pix);
      color: var(--gold);
      text-shadow: 0 0 10px rgba(251, 191, 36, .7);

    }

    }

    @keyframes pop {

      }
    }

    .skills {

    .sk {

      justify-content: center;

      padding: 7px 2px 6px;

    }

    .sk .cost {

    .sk.heal {

      --c2: #14532d
    }

    .sk.owl {

      --c2: #1e3a8a
    }

    .sk.burst {
      --c1: #9333ea;
      --c2: #4c1d95
    }

    .sk.item {
      --c1: #0f766e;
      --c2: #134e4a
    }

    .tbox {
      position: relative;
      padding: 20px 22px 34px;
      min-height: 150px;
      cursor: pointer;
      border-left: 6px solid var(--ac)
    }

    .tbox.narr {
      border-left-color: rgba(148, 163, 184, .5)
    }

    .t-speaker {

    .t-text {

    .caret {

      height: 1.1em;
      vertical-align: -.15em;
      background: var(--ac);
      margin-left: 2px;

    }

    .t-next {

      color: var(--gold);

      font-size: 1.1em
    }

      50% {
        transform: translateY(4px)

    }

    .t-skip {

    .b-action {
      display: flex;
      justify-content: center;
      margin: 14px 0
    }

    .qpanel {
      padding: 18px 18px 16px;
      margin-top: 0
    }

    .q-skill {
      margin-bottom: 10px
    }

    .passage {
      position: relative;
      padding: 16px 18px;
      margin-bottom: 14px;
      border-radius: 14px;

    .passage::before {

    .question {

      font-size: 1.12em;
      line-height: 2;

      padding-left: .2em

    .question::before {

      color: var(--gold);
      margin-right: .4em

    .choices {

    .choice {

      align-items: center;
      gap: 12px;
      text-align: left;
      padding: 12px 16px 12px 12px;
      border-radius: 14px;

      background: linear-gradient(90deg, #1c2a50, #121c38);

      line-height: 1.9;

    .choice .k {

      background: rgba(255, 255, 255, .08);

    .choice.wrong {
      border-color: var(--red);
      background: linear-gradient(90deg, rgba(127, 29, 29, .55), rgba(69, 10, 10, .4));
      opacity: .75
    }

    .choice.wrong .t {
      text-decoration: line-through;
      text-decoration-color: rgba(248, 113, 113, .8)
    }

    .choice.wrong .k {
      position: relative;
      color: transparent;
      border-color: var(--red);
      background: rgba(248, 113, 113, .15)
    }

    .choice.wrong .k::after {
      content: "✕";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--red);
      font-weight: 900
    }

    .choice.elim {
      opacity: .3;
      filter: grayscale(1)
    }

    .choice.right {
      border-color: var(--green);
      background: linear-gradient(90deg, rgba(22, 101, 52, .75), rgba(20, 83, 45, .45));
      box-shadow: 0 0 0 3px rgba(74, 222, 128, .25), 0 0 26px rgba(74, 222, 128, .35);
      opacity: 1
    }

    .choice.right .k {
      background: var(--green);
      color: #052e16
    }

    .choice:disabled {
      cursor: default
    }

    .feedback {
      min-height: 0;

      border-radius: 12px;
      padding: 10px 14px
    }

    .feedback.miss {
      color: #fecaca;
      background: rgba(185, 28, 28, .15);
      border: 1px solid rgba(248, 113, 113, .35);
      border-radius: 12px;
      padding: 10px 14px
    }

    .explain {
      margin-top: 14px;
      padding: 16px 18px;
      border: 2px solid rgba(74, 222, 128, .5);
      background: linear-gradient(180deg, rgba(20, 83, 45, .55), rgba(12, 19, 40, .9));
      animation: fadeIn .35s ease
    }

    .ex-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px
    }

    .ex-owl {
      font-size: 2rem;
      animation: bob 2s ease-in-out infinite
    }

    .ex-title {
      font-weight: 900;
      font-size: 1.15em;
      color: var(--green)
    }

    .ex-ans {
      font-weight: 900;
      margin-bottom: 6px
    }

    .ex-body {
      color: var(--ink);
      line-height: 2.05
    }

    .ex-foot {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px
    }

    #flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 60;
      opacity: 0
    }

    #flash.dmg {
      animation: flashD .5s ease-out
    }

    @keyframes flashD {
      0% {
        opacity: 1;
        box-shadow: inset 0 0 160px rgba(248, 113, 113, .9)
      }

      100% {
        opacity: 0
      }
    }

    #flash.heal {
      animation: flashH .8s ease-out
    }

    @keyframes flashH {
      0% {
        opacity: 1;
        box-shadow: inset 0 0 160px rgba(74, 222, 128, .8)
      }

      100% {
        opacity: 0
      }
    }

    .shake {
      animation: shake .4s ease-in-out
    }

    @keyframes shake {
      20% {
        transform: translateX(-8px)
      }

      40% {
        transform: translateX(8px)
      }

      60% {
        transform: translateX(-6px)
      }

      80% {
        transform: translateX(6px)
      }
    }

    @media (hover:hover) {
      .btn:hover:not(:disabled) {
        filter: brightness(1.15)
      }

      .ib:hover {
        background: rgba(255, 255, 255, .12)
      }

      .area-card:hover {
        transform: translateY(-2px)
      }

      .fl:hover:not(.locked) {
        transform: translateY(-3px) scale(1.03);
        border-color: var(--ac)
      }

      .mbtn:hover {
        transform: translateX(3px);
        border-color: var(--ac)
      }

      .sk:hover:not(:disabled) {
        transform: translateY(-2px);
        filter: brightness(1.15)
      }

      .t-skip:hover {
        color: var(--ink)
      }

      .choice:hover:not(:disabled) {
        transform: translateX(4px);
        border-color: var(--ac);
        background: linear-gradient(90deg, #24366a, #152145)
      }
    }

    /* ===== fx ===== */
    #fx {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 70;
      overflow: hidden
    }

    .ft {
      position: absolute;
      font: 900 30px/1 var(--pix);
      transform: translate(-50%, -50%);
      text-shadow: 0 2px 0 #000, 0 0 12px currentColor;
      animation: ftUp 1.1s ease-out forwards;
      white-space: nowrap
    }

    .ft.dmg {
      color: #fde68a
    }

    .ft.hurt {
      color: #f87171
    }

    .ft.heal {
      color: #4ade80
    }

    .ft.mp {
      color: #93c5fd
    }

    .ft.gold {
      color: #fbbf24;
      font-size: 22px
    }

    @keyframes ftUp {
      0% {
        opacity: 0;
        transform: translate(-50%, -30%) scale(.6)
      }

      15% {
        opacity: 1;
        transform: translate(-50%, -60%) scale(1.25)
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -180%) scale(1)
      }
    }

    .pt {
      position: absolute;
      font-size: 20px;
      animation: ptFly var(--t, 1.2s) cubic-bezier(.15, .7, .3, 1) forwards
    }

    @keyframes ptFly {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(.6)
      }

      100% {
        opacity: 0;
        transform: translate(var(--x), var(--y)) scale(1.2) rotate(var(--r))
      }
    }

    #toasts {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 90;
      display: grid;
      gap: 8px;
      width: min(420px, 92vw);
      pointer-events: none
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-radius: 14px;
      background: rgba(15, 23, 42, .95);
      border: 1px solid var(--gold);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 0 20px rgba(251, 191, 36, .25);
      animation: toastIn .4s ease, toastOut .4s ease forwards;
      animation-delay: 0s, var(--life, 2.6s)
    }

    .toast .ti {
      font-size: 1.8rem
    }

    .toast .tt {
      font-weight: 900;
      line-height: 1.35
    }

    .toast .ts {
      font-size: .8em;
      color: var(--ink2)
    }

    .toast.err {
      border-color: var(--red)
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(-16px)
      }
    }

    @keyframes toastOut {
      to {
        opacity: 0;
        transform: translateY(-16px)
      }
    }

    /* ===== overlays ===== */
    #rev {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      place-items: center;
      text-align: center;
      background: radial-gradient(circle, rgba(56, 189, 248, .25), rgba(2, 6, 23, .96) 70%)
    }

    #rev.show {
      display: grid;
      animation: revA 2.4s ease forwards
    }

    @keyframes revA {
      0% {
        opacity: 0;
        filter: hue-rotate(0)
      }

      20% {
        opacity: 1
      }

      80% {
        opacity: 1;
        filter: hue-rotate(300deg)
      }

      100% {
        opacity: 0
      }
    }

    #rev .rv-t {
      font: 900 clamp(2rem, 8vw, 4.5rem)/1.1 var(--pix);
      color: var(--cyan);
      letter-spacing: .1em;
      text-shadow: 0 0 30px var(--cyan)
    }

    #rev .rv-c {
      font-size: 5rem;
      animation: spin 1.2s linear infinite reverse;
      display: inline-block
    }

    #rev .rv-s {
      color: var(--ink2);
      margin-top: 10px
    }

    #summon {
      position: fixed;
      inset: 0;
      z-index: 85;
      display: none;
      place-items: center;
      background: rgba(2, 6, 23, .92)
    }

    #summon.show {
      display: grid
    }

    #summon .circle {
      width: min(320px, 70vw);
      height: min(320px, 70vw);
      animation: spin 2.2s cubic-bezier(.4, 0, .2, 1) infinite;
      filter: drop-shadow(0 0 20px var(--sc, #c084fc))
    }

    #summon .beam {
      position: absolute;
      width: 120px;
      height: 100vh;
      background: linear-gradient(90deg, transparent, var(--sc, #c084fc), transparent);
      opacity: 0;
      filter: blur(8px)

    #summon.burst .beam {
      animation: beam .9s ease-out
    }

    @keyframes beam {
      0% {
        opacity: 0;
        transform: scaleX(.2)
      }

      30% {
        opacity: .95
      }

      100% {
        opacity: 0;
        transform: scaleX(6)
      }
    }

    #modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(2, 6, 23, .72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px)

      animation: fadeIn .25s ease

      margin-bottom: 14px;
      overflow-x: auto;
      padding-bottom: 4px
    }

    .tab {
      flex: 1 0 auto;
      padding: .5em 1em;

      background: rgba(255, 255, 255, .04);

    }

    .notice {

      margin-top: 8px;

      font-weight: 700
    }

    }

    .notice.area {
      background: rgba(56, 189, 248, .14);
      border: 1px solid rgba(56, 189, 248, .5);
      color: #bae6fd
    }

    .sk-group {
      margin-bottom: 16px
    }

    .sk-gh {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px
    }

    .sk-gh .gi {
      font-size: 1.6rem
    }

    .sk-gh b {
      flex: 1
    }

    .sk-gh .pct {
      font: 900 1.2em/1 var(--pix);
      color: var(--gold)
    }

    .sk-line {
      display: grid;
      grid-template-columns: 8.5em 1fr 4.8em;
      gap: 8px;
      align-items: center;
      font-size: .88em;
      padding: 3px 0
    }

    .sk-line .bar {
      height: 12px
    }

    .sk-line .bar i {
      background: linear-gradient(90deg, var(--ac), color-mix(in srgb, var(--ac) 60%, #fff))
    }

    .sk-line .st {
      text-align: right;
      color: var(--ink2);
      font-family: var(--pix);
      font-size: .85em;
      white-space: nowrap
    }

    .tag {
      font-size: .72em;
      padding: 0 .5em;
      border-radius: 6px;
      margin-left: .3em;
      font-weight: 900
    }

    .tag.good {
      background: rgba(74, 222, 128, .2);
      color: var(--green)
    }

    .tag.weak {
      background: rgba(248, 113, 113, .2);
      color: var(--red)
    }

    .ach-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px
    }

    .ach {
      padding: 12px 10px;
      border-radius: 14px;
      text-align: center;
      background: rgba(0, 0, 0, .28);
      border: 1px solid var(--line)
    }

    .ach .ai {
      font-size: 2rem
    }

    .ach b {
      display: block;
      font-size: .9em;
      line-height: 1.4;
      margin-top: 2px
    }

    .ach small {
      display: block;
      font-size: .72em;
      color: var(--ink2);
      line-height: 1.4;
      margin-top: 2px
    }

    .ach.got {
      border-color: rgba(251, 191, 36, .6);
      background: linear-gradient(180deg, rgba(251, 191, 36, .14), rgba(0, 0, 0, .2))
    }

    .ach.no {
      opacity: .5
    }

    .ach.no .ai {
      filter: grayscale(1) brightness(.5)
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px
    }

    .weap-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
      margin-top: 10px
    }

    .weap {
      padding: 10px 8px;
      border-radius: 12px;
      text-align: center;
      background: rgba(0, 0, 0, .28);
      border: 1px solid var(--line);
      font-size: .82em;
      line-height: 1.45
    }

    .weap .wr {
      font: 700 11px/1 var(--pix);
      display: inline-block;
      padding: 3px 6px;
      border-radius: 6px;
      margin-bottom: 4px
    }

    .weap.eq {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(251, 191, 36, .3)
    }

    .weap.unk {
      opacity: .45
    }

    .r-N {
      background: #475569
    }

    .r-R {
      background: #2563eb
    }

    .r-SR {
      background: #9333ea
    }

    .r-SSR {
      background: linear-gradient(90deg, #f59e0b, #ef4444)
    }

    .r-UR {
      background: linear-gradient(90deg, #22d3ee, #a855f7, #f43f5e);
      color: #fff
    }

    .w-card {
      text-align: center;
      padding: 8px
    }

    .w-card .wi {
      font-size: 4rem;
      animation: float 3s ease-in-out infinite
    }

    .w-card .wn {
      font-size: 1.5em;
      font-weight: 900;
      color: var(--gold2)
    }

    .inp {
      width: 100%;
      font: inherit;
      font-size: 1.2em;
      padding: .6em .8em;
      border-radius: 12px;
      border: 2px solid var(--line2);
      background: #0a1226;
      color: var(--ink);
      text-align: center
    }

    textarea.inp {
      font-size: .8em;
      text-align: left;
      min-height: 110px;
      font-family: monospace;
      word-break: break-all
    }

    .set-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line)
    }

    .set-row:last-child {
      border-bottom: 0
    }

    .seg {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: flex-end
    }

    .seg button {
      padding: .35em .8em;
      border-radius: 10px;
      border: 1px solid var(--line2);
      font-weight: 700;
      min-height: 40px
    }

    .seg button.on {
      background: var(--ac);
      color: #04101f;
      border-color: var(--ac)
    }

    .small {
      font-size: .82em;
      color: var(--ink2)
    }

    /* ===== story ===== */
    #scr-story {
      min-height: calc(100dvh - 40px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px 0
    }

    #scr-story.active {
      display: flex
    }

    .st-box {
      width: min(780px, 100%);
      padding: 30px 28px 44px;
      position: relative;
      cursor: pointer;
      min-height: 220px
    }

    .st-ic {
      font-size: 3rem;
      text-align: center;
      margin-bottom: 6px;
      min-height: 1.2em
    }

    .st-sp {
      text-align: center;
      font-weight: 900;
      color: var(--gold);
      margin-bottom: 6px;
      min-height: 1.5em
    }

    .st-tx {
      font-size: 1.25em;
      line-height: 2.2;
      text-align: center
    }

    .st-skip {
      margin-top: 16px
    }

    /* ===== certificate ===== */
    .cert {
      position: relative;
      padding: 34px 30px;
      border-radius: 12px;
      background: #fffdf5;
      color: #3b2a0a;
      text-align: center;
      border: 10px double #c79a3a;
      font-family: 'Zen Maru Gothic', serif
    }

    .cert h3 {
      font-size: 2.2em;
      margin: 0 0 .2em;
      letter-spacing: .3em;
      color: #8a5a00
    }

    .cert .cn {
      font-size: 1.9em;
      font-weight: 900;
      border-bottom: 2px solid #c79a3a;
      display: inline-block;
      padding: 0 1em;
      margin: .4em 0
    }

    .cert p {
      line-height: 2;
      font-size: 1.05em
    }

    .cert .cs {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      font-weight: 700;
      margin: .6em 0
    }

    .cert .seal {
      position: absolute;
      right: 22px;
      bottom: 18px;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 3px solid #b91c1c;
      color: #b91c1c;
      display: grid;
      place-items: center;
      font-weight: 900;
      transform: rotate(-12deg);
      font-size: .8em;
      line-height: 1.3
    }

    .cert rt {
      color: #9a3412
    }

    #print-area {
      display: none
    }

    @media print {
      body {
        background: #fff
      }

      #app,
      #sky,
      #modal,
      #fx,
      #toasts {
        display: none !important
      }

      #print-area {
        display: block;
        padding: 10mm
      }
    }

    /* ===== responsive ===== */
    @media (max-width:900px) {
      .hub-grid {
        grid-template-columns: minmax(0, 1fr)
      }

      .menu {
        grid-template-columns: 1fr 1fr
      }

      .b-grid {
        grid-template-columns: minmax(0, 1fr)
      }

      .b-left {
        position: static;
        grid-template-columns: 1fr;
        gap: 10px
      }

      .arena {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 12px;
        text-align: left;
        padding: 10px 14px
      }

      .arena::after {
        display: none
      }

      .e-wrap {
        width: 96px;
        height: 96px;
        margin: 0;
        grid-row: span 2
      }

      .e-sprite {
        font-size: 58px
      }

      .e-wrap.boss .e-sprite {
        font-size: 70px
      }

      .ehp {
        margin: 4px 0 0
      }
    }

    @media (max-width:560px) {
      #app {
        padding-left: 12px;
        padding-right: 12px
      }

      .hud {
        grid-template-columns: 1fr auto;
        padding: 8px 10px
      }

      .hud-bars {
        grid-column: 1/-1;
        grid-row: 2
      }

      .menu {
        grid-template-columns: 1fr
      }

      .floors {
        gap: 7px;
        padding: 10px
      }

      .fl .fe {
        font-size: 1.2em
      }

      .fl .fn {
        font-size: 1em
      }

      .skills {
        gap: 4px
      }

      .sk {
        min-height: 64px
      }

      .sk .nm {
        font-size: .56em
      }

      .tbox {
        padding: 16px 16px 32px
      }

      .t-text {
        font-size: 1.08em
      }

      .passage {
        padding: 14px;
        font-size: 1.05em
      }

      .sk-line {
        grid-template-columns: 7em 1fr 4.2em
      }

      .res-grid {
        grid-template-columns: 1fr 1fr
      }
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important
      }
    }
  </style>
</head>

<body>

    <div class="aurora"></div>
  </div>
  <div id="app">

    <!-- ===================== TITLE ===================== -->
    <section id="scr-title" class="screen active">

            <rect x="154" y="58" width="12" height="16" rx="6" />

            <rect x="224" y="136" width="10" height="14" rx="5" />
            <rect x="128" y="118" width="10" height="14" rx="5" />
            <rect x="182" y="118" width="10" height="14" rx="5" />
          </g>
          <path d="M146 184 L146 156 Q160 140 174 156 L174 184Z" fill="#1e293b" />

            <circle cx="40" cy="60" r="1.5" />

          <path d="M262 110 l10 -3 l-3 10z M48 96 l12 -2 l-5 11z" fill="#475a85" opacity=".9" />
        </svg>
      </div>
      <h1 class="logo">言葉の天空城</h1>
      <div class="logo-sub">- 100 FLOORS -</div>
      <div id="save-card" class="save-card panel hidden"></div>
      <div class="title-btns">
        <button class="btn gold big" id="btn-start">▶ <ruby>冒険<rt>ぼうけん</rt></ruby>をはじめる</button>
        <button class="btn ghost" id="btn-title-set">⚙ <ruby>設定<rt>せってい</rt></ruby>・<ruby>冒険<rt>ぼうけん</rt></ruby>の<ruby>書<rt>しょ</rt></ruby></button>

      function NM() {
        return esc(P.name || 'ゆうしゃ');

      function RB(s) {
        if (!s) return '';
        return s.replace(/\{N\}/g, NM()).replace(/\[([^\[\]:]+):([^\[\]:]+)\]/g, '<ruby>$1<rt>$2</rt></ruby>');
      }

      function plain(s) {
        return (s || '').replace(/\{N\}/g, P.name || 'ゆうしゃ').replace(/\[([^\[\]:]+):([^\[\]:]+)\]/g, '$1');

      const SPEEDS = [44, 24, 9, 0];
      let typing = null;

      function typeHTML(el, html) {
        return new Promise((res) => {
          const sp = SPEEDS[P.settings.speed] ?? 24;
          const tokens = html.match(/<ruby>.*?<\/ruby>|<[^>]+>|&[#a-z0-9]+;|[\s\S]/gi) || [];
          if (sp === 0 || !tokens.length) {
            el.innerHTML = html;
            res();
            return;
          }
          let i = 0,
            cur = '',
            n = 0;
          el.innerHTML = '';
          const finish = () => {
            clearInterval(tm);
            el.innerHTML = html;
            typing = null;
            res();
          };
          typing = {
            skip: finish
          };
          const tm = setInterval(() => {
            while (i < tokens.length) {
              const tk = tokens[i++];
              cur += tk;
              if (!(tk[0] === '<' && !tk.startsWith('<ruby'))) break;
            }
            el.innerHTML = cur + '<span class="caret"></span>';
            if (++n % 3 === 0) AU.play('tick');
            if (i >= tokens.length) finish();
          }, sp);
        });
      }

        P.exp += x;

        while (P.exp >= nextExp(P.level) && P.level < 99) {
          P.level++;
          P.maxHp += 20;
          P.maxMp += 10;
          up++;

        if (up) {
          P.hp = P.maxHp;

        $('sk-owl').disabled = !(inQ && P.mp >= 5 && !S.owlUsed && remainingWrong > 1);
        $('sk-burst').disabled = !(inQ && P.mp >= 30 && !S.burstUsed && S.mode !== 'review');
        $('sk-pot').disabled = !(S.mode && P.potions > 0 && P.hp < P.maxHp);

        b.className = 'btn gold big';
        b.innerHTML = label;
        b.onclick = () => {
          AU.play('click');
          a.classList.add('hidden');
          fn();
        };
        a.appendChild(b);
        a.classList.remove('hidden');

        }), 30);

      async function startFloor(i) {
        AU.init();
        const f = FL[i];
        const id = ++BID;

        Object.assign(S, {
          mode: 'floor',

          fi: i,
          qs: f.qs,
          qi: 0,
          mistakes: 0,
          hints: 0,
          burstUsed: false,
          qActive: false
        });
        S.eMax = f.boss ? 2000 + f.n * 150 : 300 + f.n * 40;

      function ask(id) {
        if (!alive(id)) return;
        const q = S.qs[S.qi];
        Object.assign(S, {
          q,
          qActive: true,
          first: true,
          owlUsed: false,
          wrongs: 0
        });
        UI.box.classList.add('hidden');
        $('explain').classList.add('hidden');
        const qp = $('qpanel');
        qp.classList.remove('hidden');
        const sk = D.skills[q.sk];
        const qn = S.qs.length > 1 ? `<span class="chip" style="margin-left:6px">${S.qi + 1} / ${S.qs.length}</span>` : '';
        $('q-skill').innerHTML = `<span class="chip" style="border-color:var(--ac);color:var(--ac)">${sk ? RB(sk.label) : ''}</span>${qn}` + (S.mode === 'review' ? '<span class="chip" style="margin-left:6px">⛲ <ruby>復習<rt>ふくしゅう</rt></ruby></span>' : '');
        const ps = $('passage');
        ps.innerHTML = RB(q.p);
        ps.classList.toggle('hidden', !q.p);
        $('question').innerHTML = RB(q.q);
        const fb = $('feedback');
        fb.innerHTML = '';
        fb.className = 'feedback';
        const ch = $('choices');
        ch.innerHTML = '';
        shuffle(q.c.map((c, ci) => ({
          c,
          ci
        }))).forEach((o, k) => {
          const b = document.createElement('button');
          b.className = 'choice';
          b.dataset.ci = o.ci;
          b.innerHTML = `<span class="k">${k + 1}</span><span class="t">${RB(o.c)}</span>`;

        renderPCard();
        qp.style.animation = 'none';

        if (window.innerWidth <= 900) setTimeout(() => qp.scrollIntoView({
          behavior: 'smooth',
          block: 'start'
        }), 60);

      function enemyDamage() {
        let base;
        if (S.mode === 'endless') base = 10 + S.efloor * 2.2;
        else base = (10 + S.f.n * 0.55) * (S.f.boss ? 1.4 : 1);
        const red = clamp(P.weapon.damageReduction || 0, 0, 60);
        return Math.max(1, Math.round(base * (1 - red / 100) * (0.9 + Math.random() * 0.2)));
      }
      async function playerHit(id) {
        const w = $('e-wrap');
        AU.play('slash');
        w.classList.remove('hit');
        void w.offsetWidth;
        w.classList.add('hit');
        const segs = S.qs.length;
        const dmg = S.qi === segs - 1 ? S.eHp : Math.round(S.eMax / segs * (0.95 + Math.random() * 0.1));
        S.eHp = Math.max(0, S.eHp - dmg);
        floatText($('e-sprite'), dmg, 'dmg');
        $('ehp-fill').style.width = (S.eHp / S.eMax * 100) + '%';
        await sleep(500);
      }
      async function enemyHit(id) {
        const w = $('e-wrap');
        w.classList.remove('lunge');
        void w.offsetWidth;
        w.classList.add('lunge');
        await sleep(220);
        if (!alive(id)) return;
        const dmg = enemyDamage();
        P.hp = Math.max(0, P.hp - dmg);
        AU.play('hurt');
        flash('dmg');
        shakeEl($('app'));
        floatText($('p-hpbar'), '-' + dmg, 'hurt');
        renderPCard();
        await sleep(350);
      }
      async function choose(btn, id) {
        if (!alive(id) || !S.qActive || btn.disabled) return;
        const q = S.q;
        const ok = btn.dataset.ci === '0';
        if (ok) {
          S.qActive = false;
          if (S.first) {
            record(q, true);
            combo++;
            P.maxCombo = Math.max(P.maxCombo, combo);
            if (S.mode === 'review') {
              removeMissed(q.id);
              P.reviewCleared++;
              P.gold += 10;
              S.cleared++;
            } else if (P.missed.includes(q.id)) removeMissed(q.id);
            if (combo >= 3 && combo % 1 === 0) {
              const c = $('combo');
              c.classList.remove('pop');
              void c.offsetWidth;
              c.classList.add('pop');
            }
          }
          P.mp = Math.min(P.maxMp, P.mp + 2);
          markRight(btn);
          AU.play('correct');
          await playerHit(id);
          if (!alive(id)) return;
          if (S.mode === 'endless') {
            P.gold += 5;
            S.earnG += 5;
            S.earnE += 6;
            gainExp(6);
            floatText($('p-hpbar'), '+5G', 'gold');
          }
          renderPCard();
          saveGame();
          showExplain(q, id, S.first ? '<ruby>正解<rt>せいかい</rt></ruby>！' : '<ruby>正解<rt>せいかい</rt></ruby>！ よくがんばったね');
        } else {
          if (S.first) {
            record(q, false);
            S.first = false;
          }
          S.mistakes++;
          S.wrongs++;
          combo = 0;
          btn.disabled = true;
          btn.classList.add('wrong');
          AU.play('wrong');
          const fb = $('feedback');
          if (S.wrongs >= 2 || S.mode === 'review') {
            fb.className = 'feedback hint';
            fb.innerHTML = '🦉 ポポのヒント：' + RB(q.h);
          } else {
            fb.className = 'feedback miss';
            fb.innerHTML = 'おしい！ もう<ruby>一度<rt>いちど</rt></ruby>、<ruby>文章<rt>ぶんしょう</rt></ruby>をよく<ruby>読<rt>よ</rt></ruby>んでみよう。';
          }
          if (S.mode === 'review') {
            fb.innerHTML += '<br><span class="small">⛲ <ruby>泉<rt>いずみ</rt></ruby>の<ruby>中<rt>なか</rt></ruby>では、ダメージを<ruby>受<rt>う</rt></ruby>けないよ</span>';
            renderPCard();
            saveGame();
            return;
          }
          await enemyHit(id);
          if (!alive(id)) return;
          saveGame();
          if (P.hp <= 0) {
            if (S.mode === 'endless') endlessEnd(id, true);
            else timeReversal(id);
            return;
          }
          updateSkills();
        }
      }

      function markRight(btn) {
        [...$('choices').children].forEach((b) => {
          b.disabled = true;
        });
        btn.classList.add('right');

        burst(c.x, c.y, 10);

      function showExplain(q, id, title) {
        $('feedback').innerHTML = '';
        $('feedback').className = 'feedback';
        $('ex-title').innerHTML = title;
        $('ex-ans').innerHTML = '✔ ' + RB(q.c[0]);
        $('ex-body').innerHTML = RB(q.e);
        const ex = $('explain');
        ex.classList.remove('hidden');
        const nb = $('ex-next');
        const last = S.mode === 'floor' && S.qi === S.qs.length - 1;
        nb.innerHTML = last ? '<ruby>勝利<rt>しょうり</rt></ruby> ▶' : 'つぎへ ▶';
        nb.onclick = () => {
          AU.play('click');
          afterExplain(id);
        };
        updateSkills();
        setTimeout(() => {
          ex.scrollIntoView({
            behavior: 'smooth',
            block: 'nearest'
          });
          nb.focus({
            preventScroll: true
          });

      async function afterExplain(id) {
        if (!alive(id) || S.busy) return;
        S.busy = true;
        $('explain').classList.add('hidden');
        const prev = S.qs[S.qi];
        S.qi++;
        try {
          if (S.mode === 'floor') {
            if (S.qi < S.qs.length) {
              if (prev.after && prev.after.length) {
                $('qpanel').classList.add('hidden');
                window.scrollTo({
                  top: 0,
                  behavior: 'smooth'
                });
                await lines(prev.after, id);
              }
              if (alive(id)) ask(id);
            } else await victory(id);
          } else if (S.mode === 'endless') await nextEndless(id);
          else await nextReview(id);
        } finally {
          S.busy = false;
        }
      }
      async function victory(id) {
        const f = S.f;
        $('qpanel').classList.add('hidden');
        const w = $('e-wrap');
        w.classList.add('dead');
        const c = centerOf($('e-sprite'));
        burst(c.x, c.y, 26);
        AU.play('victory');
        await sleep(1000);
        if (!alive(id)) return;
        if (f.outro.length) {
          window.scrollTo({
            top: 0,
            behavior: 'smooth'
          });
          await lines(f.outro, id);
          if (!alive(id)) return;
        }
        const first = !isCleared(f.id);
        const errs = S.mistakes + S.hints;
        const stars = S.burstUsed ? 1 : errs === 0 ? 3 : errs <= (f.boss ? 2 : 1) ? 2 : 1;
        const prevStars = P.stars[f.id] || 0;
        let exp = 30 + f.n,
          gold = 25 + Math.floor(f.n / 2);
        if (f.boss) {
          exp *= 3;
          gold *= 3;
        }
        if (!first) {
          exp = Math.max(5, Math.round(exp * 0.4));
          gold = Math.max(5, Math.round(gold * 0.4));
        }
        const starBonus = stars === 3 && prevStars < 3 ? 20 : 0;
        const comboBonus = Math.min(20, combo >= 3 ? combo : 0);
        P.gold += gold + starBonus + comboBonus;
        P.stars[f.id] = Math.max(prevStars, stars);
        P.hp = Math.min(P.maxHp, P.hp + 20);
        P.mp = Math.min(P.maxMp, P.mp + 10);
        if (first) P.clearedEpisodes.push(f.id);
        const up = gainExp(exp);
        let urMsg = '';
        if (first && f.n === 100) {
          P.ended = true;
          const ur = WEAP.find((x) => x.rar === 'UR');
          if (ur && !P.owned.includes(ur.name)) P.owned.push(ur.name);
          if (ur && ur.dr > P.weapon.damageReduction) P.weapon = {
            name: ur.name,
            damageReduction: ur.dr
          };
          urMsg = `<div class="notice lv">🗡️ <ruby>伝説<rt>でんせつ</rt></ruby>の<ruby>剣<rt>けん</rt></ruby>「${RB(ur.rname)}」を<ruby>手<rt>て</rt></ruby>に<ruby>入<rt>い</rt></ruby>れた！</div>`;
        }
        S.mode = null;
        saveGame();
        const starsHtml = [0, 1, 2].map((k) => `<span class="${k < stars ? 'on' : ''}" style="animation-delay:${0.15 + k * 0.22}s">⭐</span>`).join('');
        let notes = '';
        if (up) notes += `<div class="notice lv">🆙 レベルアップ！ Lv.${P.level}　<ruby>最大<rt>さいだい</rt></ruby>HP・MPがアップして<ruby>全<rt>ぜん</rt></ruby><ruby>回復<rt>かいふく</rt></ruby>した！</div>`;
        if (first && f.boss && f.n < 100) notes += `<div class="notice area">🗺️ <ruby>新<rt>しん</rt></ruby>エリア「${RB(D.areas[f.a + 1].name)}」が<ruby>開放<rt>かいほう</rt></ruby>された！</div>`;
        notes += urMsg;
        const extra = [starBonus ? `★3ボーナス +${starBonus}G` : '', comboBonus ? `コンボボーナス +${comboBonus}G` : ''].filter(Boolean).join('　');
        if (up) setTimeout(() => AU.play('level'), 700);
        const hasNext = S.fi + 1 < FL.length;
        checkAch();
        if (first && f.n === 100) {
          await modal({
            title: `🏆 <ruby>第<rt>だい</rt></ruby>${f.n}<ruby>階<rt>かい</rt></ruby> <ruby>踏破<rt>とうは</rt></ruby>！`,
            html: `<div class="res-stars">${starsHtml}</div><div class="res-grid"><div class="res-box"><small><ruby>経験値<rt>けいけんち</rt></ruby></small><b>+${exp}</b></div><div class="res-box"><small>ゴールド</small><b class="gold-t">+${gold + starBonus + comboBonus}G</b></div></div>${notes}`,
            buttons: [{
              label: 'エンディングへ ▶',
              value: 1,
              cls: 'gold'
            }],
            dismiss: false
          });
          await playStory(D.ending, 9);
          await certificate();
          goHub();
          return;
        }
        const v = await modal({
          title: `🏆 <ruby>第<rt>だい</rt></ruby>${f.n}<ruby>階<rt>かい</rt></ruby> <ruby>突破<rt>とっぱ</rt></ruby>！`,
          html: `<div class="res-stars">${starsHtml}</div>
      <div class="res-grid"><div class="res-box"><small><ruby>経験値<rt>けいけんち</rt></ruby></small><b>+${exp}</b></div><div class="res-box"><small>ゴールド</small><b class="gold-t">+${gold + starBonus + comboBonus}G</b></div></div>
      ${extra ? `<div class="small" style="text-align:center">${extra}</div>` : ''}
      ${!first ? '<div class="small" style="text-align:center">（<ruby>再<rt>さい</rt></ruby><ruby>挑戦<rt>ちょうせん</rt></ruby>のため、ほうびは<ruby>少<rt>すく</rt></ruby>なめ）</div>' : ''}
      ${stars < 3 ? '<div class="small" style="text-align:center">ノーミス・ヒントなしで★3をめざそう！</div>' : ''}${notes}`,
          buttons: [hasNext ? {
            label: '<ruby>次<rt>つぎ</rt></ruby>の<ruby>階<rt>かい</rt></ruby>へ ▶',
            value: 'next',
            cls: 'gold'
          } : null, {
            label: '🏕️ <ruby>拠点<rt>きょてん</rt></ruby>へ',
            value: 'hub',
            cls: hasNext ? '' : 'gold'
          }].filter(Boolean),
          dismiss: false,
        });
        if (v === 'next' && hasNext) startFloor(S.fi + 1);
        else goHub();
      }
      async function timeReversal(id) {
        BID++;
        S.qActive = false;
        S.mode = null;
        combo = 0;
        P.reversals++;
        P.hp = P.maxHp;
        P.mp = P.maxMp;
        saveGame();

        for (const w of pool) {
          r -= w.prob;
          if (r < 0) return w;
        }
        return pool[0];
      }

      function decodeSave(s) {
        s = (s || '').trim().replace(/\s+/g, '');
        if (!s.startsWith('TENKU1:')) throw new Error('bad');
        const o = JSON.parse(decodeURIComponent(escape(atob(s.slice(7)))));
        if (!o || !Array.isArray(o.clearedEpisodes)) throw new Error('bad');
        return migrate(o);
      }

        const story = $('scr-story').classList.contains('active');
        if (battle && /^[1-4]$/.test(e.key) && S.qActive) {
          const b = $('choices').children[Number(e.key) - 1];
          if (b) {
            e.preventDefault();
            b.click();
          }
          return;
        }
        if (e.key === 'Enter' || e.key === ' ') {
          if ((battle || story) && (typing || advWait)) {
            e.preventDefault();
            advance();
            return;
          }
          if (battle && !$('explain').classList.contains('hidden') && document.activeElement !== $('ex-next')) {
            e.preventDefault();
            $('ex-next').click();
            return;
          }
          if (battle && !$('b-action').classList.contains('hidden') && !document.activeElement.closest('#b-action')) {
            e.preventDefault();
            $('b-action').querySelector('button').click();
          }
        }
      });
      /* ============================================================
         15. 起動
         ============================================================ */
      buildSky();
      loadGame();
      applySettingsUI();
      renderTitle();
    })();
  </script>
</body>

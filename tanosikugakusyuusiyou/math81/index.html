    function renderTimer() {
      const el = $('g-timer');
      if (G.kind === 'survival') {
        el.innerHTML = `${Math.ceil(G.timeLeft)}<small>のこり びょう</small>`;
        el.classList.toggle('warn', G.timeLeft <= 10);
      } else {
        const t = (G.totalTime + (G.locked ? 0 : performance.now() - G.qStart)) / 1000;
        el.innerHTML = `${t.toFixed(1)}${G.kind === 'stage' ? `<small>めやす ${G.qs.length * COURSES[G.course].target}s</small>` : '<small>びょう</small>'}`;
      }
    }

    function nextQ() {
      if (!G || G.ended) return;
      G.idx++;
      if (G.kind !== 'survival' && G.idx >= G.qs.length) {
        finishGame();
        return;
      }
      G.cur = G.kind === 'survival' ? survivalQ(G.idx) : G.qs[G.idx];
      G.inputs = {
        ans: '',
        rem: ''
      };
      G.active = 'ans';
      G.qMiss = 0;
      G.revealed = false;
      G.locked = false;
      renderEq();
      setFb('');
      G.qStart = performance.now();
      G.lastTick = G.qStart;
      updateProgress();
    }

    function updateProgress() {
      if (G.kind === 'survival') {
        $('g-count').textContent = `${G.correct}もん`;
        $('g-bar').style.width = `${clamp(G.timeLeft / 60 * 100, 0, 100)}%`;
      } else {
        $('g-count').textContent = `${Math.min(G.idx + 1, G.qs.length)}/${G.qs.length}`;
        $('g-bar').style.width = `${G.idx / G.qs.length * 100}%`;
      }
    }

    function renderEq(good) {
      const q = G.cur;
      const box = k => {
        const v = G.inputs[k],
          ghost = G.revealed && !v ? `<span class="ghost">${k === 'ans' ? q.ans : q.rem}</span>` : '';
        return `<span class="ibox ${good ? 'good' : G.active === k ? 'on' : ''}" data-k="${k}">${v}${ghost}</span>`;
      };
      const el = $('g-eq');
      el.className = 'eq-line' + (q.rem != null ? ' rem' : '');
      el.innerHTML = `<span class="eq-txt">${q.text} =</span>${box('ans')}${q.rem != null ? `<span class="amari">あまり</span>${box('rem')}` : ''}`;
    }

    function setFb(html) {
      $('g-fb').innerHTML = html;
    }

    function press(k) {
      if (!G || G.locked || G.ended || G.paused) return;
      const keyEl = document.querySelector(`.key[data-k="${k}"]`);
      if (keyEl) restartAnim(keyEl, 'press');
      if (k === 'ok') {
        judge(true);
        return;
      }
      if (k === 'del') {
        G.inputs[G.active] = G.inputs[G.active].slice(0, -1);
        sfx('tap');
        renderEq();
        return;
      }
      if (G.inputs[G.active].length >= 3) return;
      sfx('tap');
      G.inputs[G.active] += k;
      renderEq();
      judge(false);
    }

    function judge(force) {
      const q = G.cur,
        k = G.active,
        v = G.inputs[k];
      if (!v) return;
      const target = k === 'ans' ? q.ans : q.rem;
      if (!force && v.length < String(target).length) return;
      if (+v === target) {
        if (k === 'ans' && q.rem != null) {
          G.active = 'rem';
          renderEq();
          if (G.qMiss >= 2 && !G.revealed) setFb(hintHTML(q, 'rem'));
          else if (!G.revealed) setFb(`<span class="fb-ok" style="font-size:.85rem">わる数 OK！ つぎは あまり</span>`);
        } else onCorrect();
      } else onWrong(k);
    }

    function onWrong(k) {
      const q = G.cur;
      G.qMiss++;
      G.mistakes++;
      G.combo = 0;
      G.inputs[k] = '';
      sfx('bad');
      flash('bad');
      restartAnim($('g-eq'), 'shake');
      restartAnim($('g-pet'), 'hurt');
      if (G.kind === 'survival') {
        G.timeLeft = Math.max(0, G.timeLeft - 3);
        floatText('-3s', 'bad');
      }
      if (G.qMiss >= 3 && !G.revealed) {
        G.revealed = true;
        setFb(`<span class="fb-ans">こたえは <b>${q.ans}${q.rem != null ? ` あまり ${q.rem}` : ''}</b> だよ。<br>入力して おぼえよう！</span>`);
      } else if (G.qMiss === 2 && !G.revealed) setFb(hintHTML(q, k));
      else if (!G.revealed) setFb(`<span class="fb-bad"><i class="fas fa-rotate-left"></i> おしい！ もういちど！</span>`);
      renderEq();
    }

    function dots(a, b) {
      let s = '<div class="dots">';
      for (let i = 0; i < b; i++) s += `<span class="grp">${'<i></i>'.repeat(a)}</span>`;
      return s + '</div>';
    }

    function hintHTML(q, part) {
      const ic = '<i class="fas fa-lightbulb"></i> ';
      if (q.course === 'mul') {
        const t = q.b > 1 ? `${q.a}×${q.b - 1} = ${q.a * (q.b - 1)} に ${q.a} をたすと？` : `${q.a} が 1こ分 だよ`;
        return `<div class="hint"><div class="hint-t">${ic}${t}</div>${q.b * q.a <= 81 ? dots(q.a, q.b) : ''}</div>`;
      }
      if (q.course === 'div') return `<div class="hint"><div class="hint-t">${ic}${q.a} × <b class="q">□</b> = ${q.x}　□は いくつ？</div><div class="hint-s">${q.a}のだん：${range(1, 9).map(i => q.a * i).join(' ・ ')}</div></div>`;
      if (part === 'rem') return `<div class="hint"><div class="hint-t">${ic}${q.x} − ${q.a * q.b} ＝ <b class="q">？</b></div><div class="hint-s">${q.a} × ${q.b} = ${q.a * q.b}　のこりが あまり</div></div>`;
      return `<div class="hint"><div class="hint-t">${ic}${q.a} × <b class="q">□</b> が ${q.x} を こえない<br>いちばん大きい □ は？</div><div class="hint-s">${q.a}のだん：${range(1, 9).map(i => q.a * i).join(' ・ ')}</div></div>`;
    }

    function readingHTML(q) {
      if (q.course === 'mul') return `<span class="fb-ok"><i class="fas fa-check"></i> ${q.a} × ${q.b} = ${q.ans}<small>${kuku(q.a, q.b)}</small></span>`;
      if (q.course === 'div') return `<span class="fb-ok"><i class="fas fa-check"></i> ${q.a} × ${q.b} = ${q.x} だから ${q.b}<small>${kuku(q.a, q.b)}</small></span>`;
      return `<span class="fb-ok"><i class="fas fa-check"></i> ${q.a} × ${q.b} = ${q.a * q.b}、${q.x} − ${q.a * q.b} = ${q.r}<small>こたえ ${q.b} あまり ${q.r}</small></span>`;
    }

    function onCorrect() {
      const q = G.cur;
      G.locked = true;
      const dt = performance.now() - G.qStart;
      G.totalTime += dt;
      const clean = G.qMiss === 0;
      G.correct++;
      if (clean) {
        G.combo++;
        G.maxCombo = Math.max(G.maxCombo, G.combo);
      } else G.combo = 0;
      if (!G.revealed) {
        const k = clean ? (dt < FAST[q.course] ? 'speed' : 'logic') : 'power';
        S.pet.stats[k]++;
      }
      recordFact(q, clean && !G.revealed);
      sfx('ok');
      flash('good');
      renderEq(true);
      setFb(readingHTML(q));
      hitEnemy();
      if (G.combo >= 3) {
        const c = $('g-combo');
        c.textContent = `${G.combo} COMBO!`;
        restartAnim(c, 'show');
      }
      if (G.kind === 'survival') {
        G.timeLeft = Math.min(G.timeLeft + 2, 60);
        floatText('+2s', 'good');
      }
      restartAnim($('g-pet'), 'jump');
      updateProgress();
      setTimeout(nextQ, clean ? 560 : 900);
    }

    function recordFact(q, clean) {
      const f = S.facts[q.course],
        k = q.a + 'x' + q.b;
      const r = f[k] || (f[k] = {
        n: 0,
        w: 0,
        s: 0,
        m: 0
      });
      r.n++;
      if (clean) {
        r.s++;
        if (r.s >= 3) r.m = 1;
      } else {
        r.w++;
        r.s = 0;
      }
    }

    function hitEnemy() {
      G.enemyHP = Math.max(0, G.enemyHP - 1);
      $('ehp').style.width = `${G.enemyHP / G.enemyMax * 100}%`;
      const z = document.createElement('div');
      z.className = 'zap';
      $('battle').appendChild(z);
      setTimeout(() => z.remove(), 400);
      const e = $('enemy');
      if (G.enemyHP <= 0) {
        restartAnim(e, 'boom');
        sfx('boom');
        if (G.kind === 'survival') setTimeout(() => {
          if (!G || G.ended) return;
          G.wave++;
          $('g-wave').textContent = `WAVE ${G.wave}`;
          setupEnemy();
        }, 600);
      } else restartAnim(e, 'hit');
    }

    function floatText(t, cls) {
      const d = document.createElement('div');
      d.className = 'ftxt ' + cls;
      d.textContent = t;
      $('battle').appendChild(d);
      setTimeout(() => d.remove(), 900);
    }

    function askQuit() {
      if (!G || G.ended) return;
      G.paused = true;
      const pauseAt = performance.now();
      modal({
        title: 'とちゅうで やめる？',
        body: 'いまの きろくは のこらないよ。',
        two: true,
        buttons: [{
            label: 'つづける',
            cls: 'btn-pri',
            onClick: () => {
              const d = performance.now() - pauseAt;
              G.qStart += d;
              G.lastTick = performance.now();
              G.paused = false;
            }
          },
          {
            label: 'やめる',
            cls: 'btn-red',
            onClick: () => {
              G.ended = true;
              clearInterval(gTimer);
              save();
              if (G.kind === 'stage') {
                renderStages();
                show('stages', COURSES[G.course].name);
              } else openHome();
            }
          },
        ]
      });
    }
    /* ---------- 結果 ---------- */
    function finishGame() {
      if (!G || G.ended) return;
      G.ended = true;
      G.locked = true;
      clearInterval(gTimer);
      const r = computeResult();
      applyRewards(r);
      save();
      showResult(r);
    }

    function computeResult() {
      const r = {
        kind: G.kind,
        course: G.course,
        stageId: G.stageId,
        mode: G.mode,
        correct: G.correct,
        mistakes: G.mistakes,
        time: G.totalTime / 1000,
        maxCombo: G.maxCombo,
        stars: 0,
        newBest: false,
        firstPerfect: false,
        highScore: false,
        bonuses: []
      };
      let exp, coins;
      if (G.kind === 'stage') {
        const n = G.qs.length;
        r.n = n;
        r.target = n * COURSES[G.course].target;
        r.stars = 1 + (G.mistakes <= 2 ? 1 : 0) + (G.mistakes === 0 && r.time <= r.target ? 1 : 0);
        const rec = getRec(G.course, G.stageId, G.mode);
        if (rec.best == null || r.time < rec.best) {
          if (rec.best != null) r.newBest = true;
          rec.best = Math.round(r.time * 10) / 10;
        }
        if (r.stars > rec.st) {
          if (r.stars === 3) r.firstPerfect = true;
          rec.st = r.stars;
        }
        exp = G.correct * 10 + r.stars * 10;
        coins = G.correct * 2 + r.stars * 3;
        if (r.newBest) {
          coins += 5;
          r.bonuses.push('ベストタイム更新！ +5コイン');
        }
        if (r.firstPerfect) {
          exp += 50;
          coins += 20;
          r.bonuses.push('はじめての★3！ +50EXP +20コイン');
        }
      } else if (G.kind === 'survival') {
        exp = G.correct * 8 + G.maxCombo * 2;
        coins = G.correct * 2;
        if (G.correct > S.best.survival) {
          if (S.best.survival > 0) {
            r.highScore = true;
            coins += 20;
            r.bonuses.push('ハイスコア更新！ +20コイン');
          }
          S.best.survival = G.correct;
        }
      } else {
        r.n = G.qs.length;
        exp = Math.round((G.correct * 10) * 1.5);
        coins = G.correct * 2;
        r.bonuses.push('にがてこくふくボーナス EXP×1.5');
      }
      const p = S.pet;
      if (p.form !== 'egg') {
        if (p.happy >= 70) {
          exp = Math.round(exp * 1.3);
          r.bonuses.push('ごきげんボーナス EXP×1.3');
        } else if (p.energy <= 10) {
          exp = Math.round(exp * .7);
          r.bonuses.push('おなかペコペコ… EXP×0.7（ごはんをあげよう）');
        }
      }
      r.exp = exp;
      r.coins = coins;
      return r;
    }

    function applyRewards(r) {
      const p = S.pet;
      S.coins += r.coins;
      S.plays++;
      r.lvBefore = p.lv;
      r.lvUps = addPetExp(r.exp);
      if (p.form !== 'egg') {
        p.energy = clamp(p.energy - 8, 0, 100);
        if (p.poops > 0) {
          p.stats.neglect += p.poops * 2;
          p.bond = clamp(p.bond - p.poops, 0, 100);
        }
        if (Math.random() < .3 && p.poops < 4) p.poops++;
      }
      p.last = Date.now();
    }

    function showResult(r) {
      const p = S.pet,
        isStage = r.kind === 'stage';
      const title = isStage ? 'STAGE CLEAR!' : r.kind === 'survival' ? 'TIME UP!' : 'とっくん クリア！';
      let sub = '';
      if (isStage) {
        const st = STAGES[r.course].find(s => s.id === r.stageId);
        sub = `${COURSES[r.course].name} ${st.label}${st.mix ? '' : ' ・ ' + MODES[r.mode]}`;
      } else if (r.kind === 'survival') sub = 'サバイバル';
      else sub = 'にがて特訓';
      let starsHtml = '',
        crit = '';
      if (isStage) {
        starsHtml = `<div class="res-stars">${[0, 1, 2].map(i => `<span class="${i < r.stars ? 'on' : ''}" style="animation-delay:${.25 + i * .28}s">★</span>`).join('')}</div>`;
        crit = r.stars < 3 ? `<div class="res-crit">${r.stars === 1 ? 'つぎは ★★：ミス2回まで' : `つぎは ★★★：ノーミス＆${r.target}秒いない`}</div>` : `<div class="res-crit" style="color:var(--yellow)">パーフェクト！ すごい！</div>`;
        [0, 1, 2].forEach(i => {
          if (i < r.stars) setTimeout(() => sfx('star'), 300 + i * 280);
        });
      }
      const stats = isStage || r.kind === 'weak' ? `
      <div class="rs"><small>タイム</small><b>${r.time.toFixed(1)}</b>s${r.newBest ? '<span class="newrec">BEST</span>' : ''}</div>
      <div class="rs"><small>ミス</small><b>${r.mistakes}</b> かい</div>
      <div class="rs"><small>せいかい</small><b>${r.correct}</b> / ${r.n}</div>
      <div class="rs"><small>さいだいコンボ</small><b>${r.maxCombo}</b></div>` : `
      <div class="rs"><small>さいだいコンボ</small><b>${r.maxCombo}</b></div>
      <div class="rs"><small>ミス</small><b>${r.mistakes}</b> かい</div>`;
      const big = r.kind === 'survival' ? `<div class="res-big">${r.correct}<span style="font-size:1rem"> もん</span></div>${r.highScore ? '<div><span class="newrec" style="font-size:.8rem">NEW RECORD</span></div>' : `<div class="res-crit">ベスト ${S.best.survival}もん</div>`}` : '';
      const nextBtn = isStage ? nextStageBtn(r) : '';
      const req = p.lv >= 100 ? 1 : needExp(p.lv);
      $('result').innerHTML = `<div class="res">
    <div class="res-title ${r.kind === 'weak' ? 'jp' : ''}">${title}</div>
    <div class="res-sub">${sub}</div>
    ${starsHtml}${crit}${big}
    <div class="res-stats">${stats}</div>
    <div class="card reward">
      <div class="pv">${charSVG(p.form, { noAura: true })}</div>
      <div class="rw">
        <div class="gain"><span class="e">+${r.exp} EXP</span><span class="c"><i class="fas fa-coins"></i> +${r.coins}</span></div>
        ${r.bonuses.map(b => `<div class="bonus">${b}</div>`).join('')}
        <div class="lvbox" style="margin-top:8px"><div class="top"><span>${esc(petName())}</span><b>Lv.${p.lv}</b></div>
        <div class="bar"><i style="width:${p.lv >= 100 ? 100 : p.exp / req * 100}%;--c:var(--yellow)"></i></div></div>
        ${r.lvUps ? `<div class="lvup">LEVEL UP! Lv.${r.lvBefore} → Lv.${p.lv}</div>` : ''}
      </div>
    </div>
    <div class="res-btns">
      ${nextBtn}
      <div class="row"><button class="btn" onclick="retry()"><i class="fas fa-rotate-right"></i> もういちど</button>
      <button class="btn" onclick="leaveResult()"><i class="fas fa-${isStage ? 'list' : 'house'}"></i> ${isStage ? 'ステージへ' : 'ホームへ'}</button></div>
    </div></div>`;
      show('result');
      if (r.lvUps) setTimeout(() => sfx('lvup'), 1200);
      setTimeout(() => {
        if (curScreen === 'result') checkEvo();
      }, 1700);
    }

    function nextStageBtn(r) {
      const list = STAGES[r.course],
        i = list.findIndex(s => s.id === r.stageId);
      if (i < 0 || i >= list.length - 1) return '';
      const nx = list[i + 1],
        m = nx.mix ? 'rnd' : r.mode;
      return `<button class="btn btn-pri" onclick="startStage('${r.course}','${nx.id}','${m}')">つぎへ：${nx.label} <i class="fas fa-arrow-right"></i></button>`;
    }

    function retry() {
      if (!G) return;
      if (G.kind === 'stage') startStage(G.course, G.stageId, G.mode);
      else if (G.kind === 'survival') startSurvival();
      else startWeak();
    }

    function leaveResult() {
      sfx('tap');
      if (G && G.kind === 'stage') {
        renderStages();
        show('stages', COURSES[G.course].name);
        updateHUD();
      } else openHome();
    }
    /* =========================================================
       進化演出
       ========================================================= */
    let evoPlaying = false;

    function checkEvo(after) {
      if (evoPlaying || !pendingEvolution()) {
        if (after) after();
        return;
      }
      playEvolution(after);
    }

    function playEvolution(after) {
      const p = S.pet,
        fromId = p.form,
        tier = targetTier(),
        toId = chooseForm(tier);
      if (!toId || toId === fromId) {
        if (after) after();
        return;
      }
      evoPlaying = true;
      const fromName = petName();
      const isNew = !S.dex[toId];
      p.form = toId;
      S.dex[toId] = S.dex[toId] || Date.now();
      if (tier >= 2) {
        const s = p.stats;
        s.speed = Math.floor(s.speed / 2);
        s.logic = Math.floor(s.logic / 2);
        s.power = Math.floor(s.power / 2);
        s.neglect = Math.floor(s.neglect / 2);
      }
      p.happy = clamp(p.happy + 20, 0, 100);
      p.energy = clamp(p.energy + 30, 0, 100);
      save();
      const ov = $('evo'),
        stg = $('evo-pet'),
        c = CHAR[toId];
      ov.classList.remove('hidden', 'revealed');
      $('evo-btn').classList.add('hidden');
      $('evo-info').innerHTML = '';
      $('evo-msg').textContent = fromId === 'egg' ? 'おや…？ タマゴが うごいている！' : `おや…？ ${fromName} の ようすが…！`;
      stg.className = 'evo-stage';
      stg.innerHTML = charSVG(fromId, {
        noAura: true
      });
      const T = [900, 1500, 2000, 2400, 2700, 2950, 3150, 3300, 3420, 3520, 3600, 3670];
      setTimeout(() => {
        stg.classList.add('charge', 'wsil');
        sfx('charge');
      }, 700);
      T.forEach((t, i) => setTimeout(() => {
        stg.innerHTML = charSVG(i % 2 === 0 ? toId : fromId, {
          noAura: true
        });
      }, t));
      setTimeout(() => $('evo-white').classList.add('on'), 3700);
      setTimeout(() => {
        $('evo-white').classList.remove('on');
        stg.className = 'evo-stage';
        stg.innerHTML = charSVG(toId);
        restartAnim(stg, 'reveal');
        ov.classList.add('revealed');
        sfx('evo');
        const tc = TYPES[c.type].color;
        $('evo-msg').textContent = fromId === 'egg' ? 'タマゴが かえった！' : `${fromName} は…`;
        $('evo-info').innerHTML = `<div class="evo-name">${c.name}</div><div style="font-weight:900;margin-top:2px">に ${fromId === 'egg' ? 'なった' : 'しんかした'}！</div>
      <div class="badges" style="justify-content:center;margin-top:8px"><span class="badge" style="color:${tc}">${TYPES[c.type].name}</span><span class="badge" style="color:#fff">${TIER_NAMES[c.tier]}</span></div>
      ${isNew ? '<div class="newtag">NEW！ ずかんに とうろく</div>' : ''}<div class="evo-desc">${c.desc}</div>`;
        $('evo-btn').classList.remove('hidden');
      }, 3950);
      $('evo-btn').onclick = () => {
        sfx('tap');
        ov.classList.add('hidden');
        evoPlaying = false;
        if (curScreen === 'home') renderHome();
        if (curScreen === 'pet') renderPet();
        if (after) after();
        else if (pendingEvolution()) setTimeout(checkEvo, 300);
      };
    }
    /* =========================================================
       ペットルーム
       ========================================================= */
    function openPet() {
      sfx('tap');
      offlineUpdate();
      renderPet();
      show('pet');
      setTimeout(checkEvo, 400);
    }

    function renderPet() {
      const p = S.pet,
        c = petChar(),
        tc = TYPES[c.type].color,
        egg = p.form === 'egg';
      const req = p.lv >= 100 ? 1 : needExp(p.lv);
      const nextEvo = c.tier < 5 ? EVO_LV[c.tier + 1] : (c.tier === 5 ? 100 : null);
      const evoTxt = nextEvo == null ? 'さいごの すがた' : c.tier === 5 ? (p.lv >= 100 ? 'でんせつの じょうけんを みたそう' : 'Lv100で なにかが…？') : `Lv${nextEvo}で しんか`;
      const s = p.stats,
        mx = Math.max(1, s.speed, s.logic, s.power);
      const trend = c.tier >= 1 && c.tier < 5 ? (() => {
        const t = determineType();
        return `<div class="trend">いまの けいこう：<span style="color:${TYPES[t].color}">${TYPES[t].name}タイプ</span>　<small style="color:var(--muted)">（つぎの しんかに えいきょう）</small></div>`;
      })() : '';
      $('pet').innerHTML = `
    <div class="card room">
      <div class="room-stage" style="--tg:${hexA(tc, .28)}">
        <div class="bubble pop" id="pet-bubble">${petMood()}</div>
        <div class="room-floor"></div>
        <div class="room-pet" id="room-pet" onclick="patTap()"><div class="float" style="width:100%;height:100%">${charSVG(p.form)}</div></div>
        <div class="poops">${'<i class="fas fa-poop"></i>'.repeat(p.poops)}</div>
      </div>
      <div class="room-name">
        <div class="nm">${esc(petName())} <button onclick="renamePet()" aria-label="なまえをかえる"><i class="fas fa-pen"></i></button></div>
        <div class="sp">No.${String(c.no).padStart(2, '0')} ${c.name}${p.gen > 1 ? `　・ ${p.gen}だいめ` : ''}</div>
        <div class="badges"><span class="badge" style="color:${tc}">${TYPES[c.type].name}</span><span class="badge" style="color:#fff">${TIER_NAMES[c.tier]}</span></div>
      </div>
      <div class="lvbox"><div class="top"><span>${evoTxt}</span><b>Lv.${p.lv}</b></div><div class="bar"><i style="width:${p.lv >= 100 ? 100 : p.exp / req * 100}%;--c:var(--yellow)"></i></div></div>
    </div>
    ${egg ? '' : `<div class="card stat-card"><h4>コンディション</h4><div class="bars">${bar('げんき', p.energy, '#22e4ff')}${bar('ごきげん', p.happy, '#ff6fb5')}${bar('なかよし', p.bond, '#ffd84d')}</div></div>`}
    <div class="card stat-card"><h4>そだちかた</h4><div class="bars">
      ${bar('スピード', s.speed / mx * 100, TYPES.speed.color).replace(/<span>\d+<\/span>$/, `<span>${s.speed}</span>`)}
      ${bar('ちえ', s.logic / mx * 100, TYPES.logic.color).replace(/<span>\d+<\/span>$/, `<span>${s.logic}</span>`)}
      ${bar('パワー', s.power / mx * 100, TYPES.power.color).replace(/<span>\d+<\/span>$/, `<span>${s.power}</span>`)}
    </div>${trend}</div>
    <div class="care-grid">
      <button class="care" ${egg ? 'disabled' : ''} onclick="care('feed')" style="border-color:rgba(255,225,77,.45);color:var(--yellow)"><i class="fas fa-bowl-food"></i>ごはん<small>🪙10</small></button>
      <button class="care" ${egg ? 'disabled' : ''} onclick="care('treat')" style="border-color:rgba(255,154,61,.45);color:var(--orange)"><i class="fas fa-cake-candles"></i>ごちそう<small>🪙40</small></button>
      <button class="care" ${egg ? 'disabled' : ''} onclick="care('clean')" style="border-color:rgba(34,228,255,.45);color:var(--cyan)"><i class="fas fa-broom"></i>おそうじ<small>うんち ${p.poops}</small></button>
      <button class="care" ${egg ? 'disabled' : ''} onclick="care('pat')" style="border-color:rgba(255,111,181,.45);color:#ff8ac4"><i class="fas fa-hand-sparkles"></i>なでる<small>ごきげん↑</small></button>
      <button class="care" ${egg ? 'disabled' : ''} onclick="care('train')" style="border-color:rgba(255,77,109,.45);color:var(--red)"><i class="fas fa-dumbbell"></i>とっくん<small>げんき-25</small></button>
      <button class="care" onclick="openZukan()" style="border-color:rgba(166,107,255,.45);color:var(--violet)"><i class="fas fa-book-open"></i>ずかん<small>${Object.keys(S.dex).filter(k => CHAR[k]).length}/${CHARS.length}</small></button>
    </div>
    ${c.tier >= 5 ? `<button class="btn btn-gold" style="width:100%;margin-top:12px" onclick="askRebirth()"><i class="fas fa-egg"></i> あたらしいタマゴを そだてる</button>` : ''}
    <p class="tip">こたえ方で しんか先が かわるよ！<br>⚡すばやく正解＝スピード　🧠じっくり正解＝ちえ　🔥まちがえても正解＝パワー<br>なかよし度が高く バランスよく育つと…？　お世話をわすれると…？</p>`;
    }

    function petSay(msg) {
      const b = $('pet-bubble');
      if (!b) return;
      b.textContent = msg;
      restartAnim(b, 'pop');
    }

    function animRoomPet(cls) {
      restartAnim($('room-pet'), cls);
    }

    function patTap() {
      if (S.pet.form === 'egg') {
        animRoomPet('wiggle');
        petSay('…コトコト（もうすぐ かえりそう？）');
        sfx('tap');
        return;
      }
      animRoomPet('jump');
      sfx('care');
      petSay(petMood());
    }

    function care(action) {
      offlineUpdate();
      const p = S.pet;
      let msg = '',
        anim = 'jump',
        ups = 0;
      if (action === 'feed' || action === 'treat') {
        const cost = action === 'feed' ? 10 : 40;
        if (p.energy >= 100) {
          petSay('おなか いっぱい！');
          animRoomPet('wiggle');
          return;
        }
        if (S.coins < cost) {
          toast('コインが たりないよ！ 問題をといて ためよう');
          return;
        }
        S.coins -= cost;
        restartAnim($('chip-coin'), 'bump');
        if (action === 'feed') {
          if (p.energy < 70) p.bond = clamp(p.bond + 3, 0, 100);
          p.energy = clamp(p.energy + 35, 0, 100);
          ups = addPetExp(10);
          if (Math.random() < .35 && p.poops < 4) p.poops++;
          msg = 'モグモグ… おいしい！';
        } else {
          p.energy = clamp(p.energy + 60, 0, 100);
          p.happy = clamp(p.happy + 25, 0, 100);
          p.bond = clamp(p.bond + 6, 0, 100);
          ups = addPetExp(40);
          if (Math.random() < .6 && p.poops < 4) p.poops++;
          msg = 'わぁ、ごちそうだ！ しあわせ〜！';
        }
      } else if (action === 'clean') {
        if (!p.poops) {
          petSay('トイレは もう ピカピカだよ！');
          animRoomPet('wiggle');
          return;
        }
        p.poops = 0;
        p.happy = clamp(p.happy + 15, 0, 100);
        p.bond = clamp(p.bond + 5, 0, 100);
        ups = addPetExp(15);
        msg = 'スッキリ！ ありがとう！';
      } else if (action === 'pat') {
        if (p.energy < 5) {
          petSay('つかれて ねむい…');
          animRoomPet('wiggle');
          return;
        }
        if (p.happy >= 100) {
          petSay('えへへ、とっても まんぞく！');
          animRoomPet('wiggle');
          return;
        }
        p.happy = clamp(p.happy + 12, 0, 100);
        p.energy = clamp(p.energy - 2, 0, 100);
        if (Date.now() - (p.lastPat || 0) > 20 * 60 * 1000) {
          p.bond = clamp(p.bond + 3, 0, 100);
          p.lastPat = Date.now();
        }
        msg = 'えへへ… うれしい！';
        anim = 'wiggle';
      } else if (action === 'train') {
        if (p.energy < 25) {
          petSay('げんきが たりなくて できないよ…');
          animRoomPet('wiggle');
          return;
        }
        p.energy -= 25;
        p.happy = clamp(p.happy - 8, 0, 100);
        p.stats.power += 2;
        ups = addPetExp(50);
        msg = 'ハァハァ… とっくん かんりょう！';
      }
      p.last = Date.now();
      sfx('care');
      save();
      updateHUD();
      renderPet();
      petSay(msg);
      animRoomPet(anim);
      if (ups) {
        sfx('lvup');
        toast(`LEVEL UP！ Lv.${p.lv}`);
      }
      if (pendingEvolution()) setTimeout(checkEvo, 900);
    }

    function renamePet() {
      sfx('tap');
      modal({
        title: 'なまえを つける',
        body: `<div>すきな なまえを つけてね（8文字まで）</div><input id="nick-in" class="m-input" maxlength="8" value="${esc(S.pet.nick)}" placeholder="${petChar().name}">`,
        two: true,
        buttons: [{
          label: 'やめる'
        }, {
          label: 'けってい',
          cls: 'btn-pri',
          onClick: () => {
            const v = ($('nick-in') ? $('nick-in').value : '').trim().slice(0, 8);
            S.pet.nick = v;
            save();
            renderPet();
          }
        }]
      });
      setTimeout(() => {
        const i = $('nick-in');
        if (i) i.focus();
      }, 100);
    }

    function askRebirth() {
      modal({
        title: 'あたらしいタマゴ',
        body: `<p>${esc(petName())} と おわかれして、あたらしいタマゴを そだてる？</p><p style="font-size:.8rem;color:var(--muted)">ずかん・ステージのきろく・コインは そのまま。<br>ペットは Lv1 の タマゴから やりなおし。<br>ちがう そだて方で、ちがう しんかを 見つけよう！</p>`,
        two: true,
        buttons: [{
          label: 'やめる'
        }, {
          label: 'そだてる',
          cls: 'btn-gold',
          onClick: () => {
            const gen = (S.pet.gen || 1) + 1;
            S.pet = freshPet(gen);
            save();
            renderPet();
            sfx('evo');
            toast(`${gen}だいめの タマゴが とどいた！`);
          }
        }]
      });
    }
    /* =========================================================
       ずかん
       ========================================================= */
    function openZukan() {
      sfx('tap');
      renderZukan();
      show('zukan');
    }

    function renderZukan() {
      const found = CHARS.filter(c => S.dex[c.id]).length;
      let html = `<div class="card dex-head"><div><div style="font-weight:900">はっけんした キャラ</div><div style="font-size:.7rem;color:var(--muted);font-weight:700">タップすると くわしく見られるよ</div></div><div><b>${found}</b> / ${CHARS.length}</div></div>`;
      for (let t = 0; t <= 6; t++) {
        const list = CHARS.filter(c => c.tier === t);
        html += `<div class="sec-title">${TIER_NAMES[t]}${t > 0 ? `<span style="font-family:var(--mono);letter-spacing:0">Lv${EVO_LV[t]}〜</span>` : ''}</div><div class="dex-grid">`;
        list.forEach(c => {
          const got = !!S.dex[c.id];
          html += `<button class="dex ${got ? '' : 'unk'} ${S.pet.form === c.id ? 'cur' : ''}" onclick="dexDetail('${c.id}')"><div class="sv">${charSVG(c.id, { sil: !got, noAura: true })}</div><div class="no">No.${String(c.no).padStart(2, '0')}</div><div class="nm">${got ? c.name : '？？？'}</div></button>`;
        });
        html += `</div>`;
      }
      $('zukan').innerHTML = html;
    }

    function dexDetail(id) {
      sfx('tap');
      const c = CHAR[id],
        got = !!S.dex[id],
        tc = TYPES[c.type].color;
      modal({
        title: got ? c.name : '？？？',
        body: `<div class="dex-big ${got ? '' : 'unk'}">${charSVG(id, { sil: !got })}</div>
    <div class="badges" style="justify-content:center;margin:6px 0 10px">${got ? `<span class="badge" style="color:${tc}">${TYPES[c.type].name}</span>` : ''}<span class="badge" style="color:#fff">${TIER_NAMES[c.tier]}</span><span class="badge" style="color:var(--muted)">No.${String(c.no).padStart(2, '0')}</span></div>
    ${got ? `<div>${c.desc}</div>` : `<div style="color:var(--yellow)"><i class="fas fa-lightbulb"></i> ヒント：${c.hint}</div>`}`,
        buttons: [{
          label: 'とじる',
          cls: 'btn-pri'
        }]
      });
    }
    /* =========================================================
       マスターマップ
       ========================================================= */
    let mapTab = 'mul';

    function openMap() {
      sfx('tap');
      renderMap();
      show('map');
    }

    function setMapTab(t) {
      mapTab = t;
      sfx('tap');
      renderMap();
    }

    function renderMap() {
      const c = mapTab,
        C = COURSES[c],
        rows = factRows(c);
      let html = `<div class="tabs">${['mul', 'div', 'rem'].map(k => `<button class="tab ${k === c ? 'on' : ''}" style="${k === c ? `background:${COURSES[k].color}` : ''}" onclick="setMapTab('${k}')">${COURSES[k].short}</button>`).join('')}</div>`;
      html += `<div class="card map-card"><div class="map-head"><span>${C.name}　<small style="color:var(--muted)">3回れんぞく ノーミスで マスター</small></span><span><b>${masterCount(c)}</b>/${factTotal(c)}</span></div>`;
      html += `<div class="map-grid"><div class="mc h">${c === 'mul' ? '×' : '÷'}</div>${range(1, 9).map(b => `<div class="mc h">${c === 'mul' ? b : '=' + b}</div>`).join('')}`;
      rows.forEach(a => {
        html += `<div class="mc h">${a}</div>`;
        range(1, 9).forEach(b => {
          const r = S.facts[c][a + 'x' + b],
            st = factStatus(r);
          const label = c === 'mul' ? a * b : c === 'div' ? a * b : `${a * b}+`;
          html += `<div class="mc cell st${st}" onclick="factInfo('${c}',${a},${b})">${label}</div>`;
        });
      });
      html += `</div><div class="legend"><span><i class="st0"></i>まだ</span><span><i class="st1"></i>にがて</span><span><i class="st2"></i>れんしゅう中</span><span><i class="st3"></i>マスター</span></div></div>`;
      html += `<div style="font-size:.7rem;color:var(--muted);text-align:center;margin-top:10px;line-height:1.6">${c === 'mul' ? 'たて＝だん、よこ＝かける数' : c === 'div' ? 'たて＝わる数、よこ＝答え（マスの数字は わられる数）' : 'たて＝わる数、よこ＝答え（マスは あまりの前の数）'}</div>`;
      const wk = weakFacts().length;
      html += `<button class="btn btn-pink" style="width:100%;margin-top:12px" ${wk ? '' : 'disabled'} onclick="startWeak()"><i class="fas fa-dumbbell"></i> にがて特訓（${wk}こ）</button>`;
      if (c !== 'rem') html += `<div class="card" style="padding:12px;margin-top:12px;font-size:.75rem;color:#cbd6ff;text-align:center;line-height:1.7"><i class="fas fa-dragon" style="color:var(--yellow)"></i> ${c === 'mul' ? '九九' : 'わり算'}81こを ぜんぶマスターすると、<br>Lv100で でんせつの なかまに 出会えるかも…？</div>`;
      $('map').innerHTML = html;
    }

    function factInfo(c, a, b) {
      const r = S.facts[c][a + 'x' + b] || {
        n: 0,
        w: 0,
        s: 0,
        m: 0
      };
      const st = factStatus(r),
        names = ['まだ ちょうせんしていない', 'にがて（さいごに まちがえた）', 'れんしゅう中', 'マスター！'];
      let eq = c === 'mul' ? `${a} × ${b} = ${a * b}` : c === 'div' ? `${a * b} ÷ ${a} = ${b}` : `${a * b}〜${a * b + a - 1} ÷ ${a} = ${b} あまり 0〜${a - 1}`;
      const yomi = c !== 'rem' ? `<div style="color:var(--cyan);font-weight:800;margin-top:4px">${kuku(a, b)}</div>` : '';
      modal({
        title: eq,
        body: `${yomi}<div style="margin-top:10px">${names[st]}</div><div style="font-size:.8rem;color:var(--muted);margin-top:6px">ちょうせん ${r.n}回 ・ まちがい ${r.w}回 ・ れんぞくせいかい ${r.s}回</div>`,
        buttons: [{
          label: 'とじる',
          cls: 'btn-pri'
        }]
      });
    }
    /* =========================================================
       せってい
       ========================================================= */
    function openSettings() {
      sfx('tap');
      modal({
        title: 'せってい',
        body: `<div style="display:grid;gap:8px">
      <button class="btn" id="snd-btn" onclick="toggleSound()"><i class="fas fa-volume-${S.sound ? 'high' : 'xmark'}"></i> サウンド：${S.sound ? 'ON' : 'OFF'}</button>
      <button class="btn" onclick="closeModal();howTo()"><i class="fas fa-circle-question"></i> あそびかた</button>
      <button class="btn btn-red" onclick="closeModal();askReset()"><i class="fas fa-trash"></i> データを リセット</button>
    </div><div style="font-size:.7rem;color:var(--muted);margin-top:12px">きろくは この端末のブラウザに ほぞんされます。</div>`,
        buttons: [{
          label: 'とじる',
          cls: 'btn-pri'
        }]
      });
    }

    function toggleSound() {
      S.sound = !S.sound;
      save();
      const b = $('snd-btn');
      if (b) b.innerHTML = `<i class="fas fa-volume-${S.sound ? 'high' : 'xmark'}"></i> サウンド：${S.sound ? 'ON' : 'OFF'}`;
      sfx('tap');
    }

    function howTo() {
      modal({
        title: 'あそびかた',
        body: `<div class="howto">
    <h5><i class="fas fa-calculator"></i> 問題をとく</h5>答えを入力すると 自動で 答え合わせ。2回まちがえると ヒント、3回で 答えが 出るよ。
    <h5><i class="fas fa-star"></i> ★を あつめる</h5>★クリア ★★ミス2回まで ★★★ノーミス＆めやすタイムいない。
    <h5><i class="fas fa-table-cells"></i> マスターマップ</h5>同じ問題を 3回れんぞく ノーミスで マスター。まちがえた問題は「にがて特訓」で れんしゅう！
    <h5><i class="fas fa-dragon"></i> ペットの しんか</h5>Lv3・10・25・45・70 で しんか。こたえ方（スピード／ちえ／パワー）と お世話で しんか先が かわるよ。ぜんぶで ${CHARS.length}たい！
    <h5><i class="fas fa-heart"></i> お世話</h5>ごきげんが高いと EXP 1.3ばい。うんちを ほうっておくと…？
  </div>`,
        buttons: [{
          label: 'わかった！',
          cls: 'btn-pri'
        }]
      });
    }

    function askReset() {
      modal({
        title: '⚠ データを リセット',
        body: 'ペット・ずかん・★・コイン が すべて きえます。<br>ほんとうに よいですか？',
        two: true,
        buttons: [{
            label: 'やめる',
            cls: 'btn-pri'
          },
          {
            label: 'リセット',
            cls: 'btn-red',
            onClick: () => modal({
              title: 'さいごの かくにん',
              body: 'もとに もどせません。リセットしますか？',
              two: true,
              buttons: [{
                  label: 'やめる',
                  cls: 'btn-pri'
                },
                {
                  label: 'リセットする',
                  cls: 'btn-red',
                  onClick: () => {
                    S = freshSave();
                    save();
                    openHome();
                    toast('データを リセットしました');
                  }
                }
              ]
            })
          }
        ]
      });
    }
    /* =========================================================
       入力・起動
       ========================================================= */
    document.querySelectorAll('#keypad .key').forEach(k => k.addEventListener('pointerdown', e => {
      e.preventDefault();
      press(k.dataset.k);
    }));
    $('g-eq').addEventListener('click', e => {
      const b = e.target.closest('.ibox');
      if (!b || !G || G.locked || !G.cur || G.cur.rem == null) return;
      if (b.dataset.k === 'ans' && G.active === 'rem') {
        G.active = 'ans';
        G.inputs = {
          ans: '',
          rem: ''
        };
        renderEq();
      }
    });
    document.addEventListener('keydown', e => {
      if (!$('modal').classList.contains('hidden')) {
        if (e.key === 'Escape') closeModal();
        return;
      }
      if (curScreen === 'title' && (e.key === 'Enter' || e.key === ' ')) {
        startApp();
        return;
      }
      if (curScreen !== 'game') return;
      if (e.key >= '0' && e.key <= '9') press(e.key);
      else if (e.key === 'Enter') press('ok');
      else if (e.key === 'Backspace') press('del');
      else if (e.key === 'Escape') askQuit();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) save();
    });
    setInterval(() => {
      offlineUpdate();
      if (curScreen === 'home' && !evoPlaying && $('modal').classList.contains('hidden')) renderHome();
    }, 60000);
    (function init() {
      const st = load();
      offlineUpdate();
      $('title-pet').innerHTML = charSVG(S.pet.form);
      updateHUD();
      if (st === 'migrated') setTimeout(() => toast('前のバージョンから コインとペットを ひきついだよ！'), 600);
    })();
  </script>
</body>

</html>
    <script src='//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
  </body>
  
</html>

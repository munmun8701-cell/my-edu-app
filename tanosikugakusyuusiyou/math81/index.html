  <!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#060918">
  <title>NEON MATH 81 : CYBER EVOLUTION</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #060918;
      --panel: rgba(18, 26, 62, .78);
      --panel2: rgba(255, 255, 255, .06);
      --line: rgba(120, 200, 255, .18);
      --cyan: #22e4ff;
      --pink: #ff4fd8;
      --yellow: #ffe14d;
      --green: #4dff9a;
      --red: #ff4d6d;
      --violet: #a66bff;
      --orange: #ff9a3d;
      --text: #eaf4ff;
      --muted: #8a98c8;
      --r: 18px;
      --font: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Meiryo', sans-serif;
      --mono: 'Orbitron', 'M PLUS Rounded 1c', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      height: 100%
    }

    body {
      background: #02040c;
      color: var(--text);
      font-family: var(--font);
      display: flex;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation
    }

    button {
      font-family: inherit;
      color: inherit;
      border: none;
      background: none;
      cursor: pointer;
      touch-action: manipulation
    }

    input {
      font-family: inherit
    }

    .hidden {
      display: none !important
    }

    #app {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: radial-gradient(120% 55% at 50% -5%, #1d2470 0%, transparent 60%), radial-gradient(70% 45% at 100% 100%, rgba(255, 79, 216, .16), transparent 60%), radial-gradient(60% 40% at 0% 80%, rgba(34, 228, 255, .10), transparent 60%), var(--bg);
      box-shadow: 0 0 80px rgba(34, 228, 255, .12)
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(34, 228, 255, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(34, 228, 255, .06) 1px, transparent 1px);
      background-size: 32px 32px;
      -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .9), rgba(0, 0, 0, .15));
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .9), rgba(0, 0, 0, .15))
    }

    .scanline {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 60;
      background: linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, .08) 50%);
      background-size: 100% 3px;
      opacity: .5
    }

    /* HUD */
    #hud {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      padding-top: max(10px, env(safe-area-inset-top))
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      flex: none;
      border-radius: 12px;
      background: var(--panel2);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      font-size: 1rem;
      transition: transform .1s
    }

    .icon-btn:active {
      transform: scale(.92)
    }

    .hud-title {
      flex: 1;
      font-weight: 900;
      font-size: 1.05rem;
      letter-spacing: .03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .hud-title.logo {
      font-family: var(--mono);
      font-size: .95rem;
      background: linear-gradient(90deg, var(--cyan), var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .35);
      border: 1px solid var(--line);
      font-family: var(--mono);
      font-weight: 700;
      font-size: .82rem
    }

    .chip-star i {
      color: var(--yellow)
    }

    .chip-coin i {
      color: #ffc93d
    }

    .chip.bump {
      animation: bump .4s
    }

    @keyframes bump {
      50% {
        transform: scale(1.18)
      }
    }

    #screens {
      position: relative;
      flex: 1;
      min-height: 0
    }

    .screen {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 4px 14px 28px;
      display: none;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch
    }

    .screen::-webkit-scrollbar {
      display: none
    }

    .screen.active {
      display: block;
      animation: scrIn .26s ease
    }

    @keyframes scrIn {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px)
    }

    .sec-title {
      font-size: .78rem;
      color: var(--muted);
      font-weight: 800;
      letter-spacing: .14em;
      margin: 18px 4px 8px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .sec-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--line), transparent)
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: .68rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid currentColor;
      background: rgba(0, 0, 0, .3);
      white-space: nowrap
    }

    .badges {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 4px
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 16px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 1rem;
      background: rgba(255, 255, 255, .07);
      border: 1px solid rgba(255, 255, 255, .14);
      transition: transform .1s
    }

    .btn:active {
      transform: scale(.96)
    }

    .btn-pri {
      background: linear-gradient(180deg, #5ff0ff, #16b4d6);
      color: #03131c;
      border: none;
      box-shadow: 0 4px 18px rgba(34, 228, 255, .35)
    }

    .btn-pink {
      background: linear-gradient(180deg, #ff7ae3, #e0309f);
      color: #fff;
      border: none;
      box-shadow: 0 4px 18px rgba(255, 79, 216, .35)
    }

    .btn-red {
      color: var(--red);
      border-color: rgba(255, 77, 109, .5)
    }

    .btn-gold {
      background: linear-gradient(180deg, #ffe98a, #ffb800);
      color: #3a2400;
      border: none
    }

    .btn[disabled] {
      opacity: .4;
      pointer-events: none
    }

    /* Bars */
    .bars {
      display: grid;
      gap: 5px;
      margin-top: 8px
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .66rem;
      color: var(--muted);
      font-weight: 800
    }

    .bar-row>span:first-child {
      width: 54px;
      flex: none;
      white-space: nowrap
    }

    .bar-row>span:last-child {
      width: 28px;
      text-align: right;
      font-family: var(--mono);
      font-size: .6rem
    }

    .bar {
      flex: 1;
      height: 8px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .08);
      overflow: hidden
    }

    .bar>i {
      display: block;
      height: 100%;
      border-radius: 99px;
      background: var(--c, var(--cyan));
      box-shadow: 0 0 8px var(--c, var(--cyan));
      transition: width .6s ease
    }

    /* Characters */
    .chr {
      width: 100%;
      height: 100%;
      overflow: visible
    }

    .chr .blink {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 5s infinite
    }

    @keyframes blink {

      0%,
      93%,
      100% {
        transform: scaleY(1)
      }

      96% {
        transform: scaleY(.12)
      }
    }

    .float {
      animation: float 3s ease-in-out infinite
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-8px)
      }
    }

    .jump {
      animation: jump .45s ease
    }

    @keyframes jump {

      0%,
      100% {
        transform: translateY(0) scale(1)
      }

      40% {
        transform: translateY(-22px) scale(1.06, .96)
      }
    }

    .hurt {
      animation: hurt .4s ease
    }

    @keyframes hurt {

      0%,
      100% {
        transform: none
      }

      25% {
        transform: translateX(-6px) rotate(-6deg)
      }

      75% {
        transform: translateX(6px) rotate(6deg)
      }
    }

    .wiggle {
      animation: wiggle .5s ease
    }

    @keyframes wiggle {

      0%,
      100% {
        transform: none
      }

      20% {
        transform: rotate(-8deg)
      }

      40% {
        transform: rotate(8deg)
      }

      60% {
        transform: rotate(-5deg)
      }

      80% {
        transform: rotate(5deg)
      }
    }

    /* Title */
    #scr-title {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px
    }

    #scr-title.active {
      display: flex
    }

    .logo-big {
      font-family: var(--mono);
      font-weight: 900;
      font-size: clamp(2.3rem, 11vw, 3.4rem);
      line-height: 1.05;
      background: linear-gradient(180deg, #fff 0%, #7ff3ff 45%, #22a8ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 14px rgba(34, 228, 255, .6))
    }

    .logo-big span {
      display: block;
      font-size: .38em;
      letter-spacing: .32em;
      margin-top: 8px;
      background: linear-gradient(90deg, var(--pink), var(--yellow));
      -webkit-background-clip: text;
      background-clip: text
    }

    .title-sub {
      margin-top: 14px;
      font-weight: 800;
      color: var(--muted);
      font-size: .9rem
    }

    .title-pet {
      width: 190px;
      height: 190px;
      margin: 22px auto 10px;
      position: relative
    }

    .holo {
      position: absolute;
      left: 50%;
      bottom: -6px;
      transform: translateX(-50%);
      width: 70%;
      height: 26px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(34, 228, 255, .55), transparent 70%)
    }

    .tap-start {
      margin-top: 16px;
      font-family: var(--mono);
      font-weight: 900;
      letter-spacing: .2em;
      color: var(--yellow);
      animation: pulse 1.4s infinite
    }

    @keyframes pulse {
      50% {
        opacity: .35
      }
    }

    .title-note {
      margin-top: 26px;
      font-size: .7rem;
      color: #5e6a99
    }

    /* Home */
    .pet-card {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px;
      width: 100%;
      text-align: left;
      position: relative;
      overflow: hidden
    }

    .pet-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(60% 90% at 15% 50%, var(--tg), transparent 70%);
      pointer-events: none
    }

    .pet-card .pv {
      width: 100px;
      height: 100px;
      flex: none;
      position: relative
    }

    .pet-card .info {
      flex: 1;
      min-width: 0;
      position: relative
    }

    .pet-name {
      font-size: 1.15rem;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .pet-card .go {
      color: var(--muted);
      position: relative
    }

    .mini-note {
      font-size: .75rem;
      color: var(--yellow);
      margin-top: 8px;
      font-weight: 800
    }

    .speech {
      display: inline-block;
      margin-top: 6px;
      font-size: .72rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .08)
    }

    .course {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      margin-bottom: 10px;
      width: 100%;
      text-align: left;
      border-radius: var(--r);
      border: 1px solid;
      transition: transform .1s;
      position: relative;
      overflow: hidden
    }

    .course:active {
      transform: scale(.98)
    }

    .course .ic {
      width: 54px;
      height: 54px;
      flex: none;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 1.9rem;
      font-weight: 900;
      color: #04121a
    }

    .course .tx {
      flex: 1;
      min-width: 0
    }

    .course .t1 {
      font-size: 1.08rem;
      font-weight: 900
    }

    .course .t2 {
      font-size: .72rem;
      color: var(--muted);
      font-weight: 700;
      margin-top: 3px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    .course .t2 b {
      color: var(--text)
    }

    .course .chev {
      color: var(--muted)
    }

    .prog-mini {
      height: 4px;
      border-radius: 9px;
      background: rgba(255, 255, 255, .08);
      margin-top: 7px;
      overflow: hidden
    }

    .prog-mini i {
      display: block;
      height: 100%
    }

    .duo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .tile {
      padding: 14px 12px;
      border-radius: var(--r);
      border: 1px solid;
      text-align: left;
      transition: transform .1s;
      position: relative;
      overflow: hidden
    }

    .tile:active {
      transform: scale(.97)
    }

    .tile i.big {
      font-size: 1.4rem
    }

    .tile .t1 {
      font-weight: 900;
      margin-top: 8px;
      font-size: .98rem
    }

    .tile .t2 {
      font-size: .7rem;
      color: var(--muted);
      font-weight: 700;
      margin-top: 2px
    }

    .tile[aria-disabled="true"] {
      opacity: .5
    }

    /* Stage select */
    .crit {
      font-size: .72rem;
      color: var(--muted);
      font-weight: 700;
      padding: 10px 12px;
      margin-bottom: 12px;
      line-height: 1.7
    }

    .crit b {
      color: var(--yellow)
    }

    .stage {
      display: flex;
      gap: 10px;
      align-items: stretch;
      padding: 10px;
      margin-bottom: 10px
    }

    .st-badge {
      width: 58px;
      flex: none;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #04121a;
      text-align: center
    }

    .st-badge b {
      font-size: 1.65rem;
      font-family: var(--mono);
      line-height: 1
    }

    .st-badge small {
      font-size: .58rem;
      margin-top: 3px
    }

    .st-badge.mix b {
      font-size: 1.1rem
    }

    .st-body {
      flex: 1;
      min-width: 0
    }

    .st-name {
      font-weight: 900;
      font-size: .98rem;
      margin: 1px 0 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px
    }

    .st-name small {
      font-size: .65rem;
      color: var(--muted);
      font-weight: 700
    }

    .modes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px
    }

    .modes.one {
      grid-template-columns: 1fr
    }

    .mode {
      padding: 7px 2px 6px;
      border-radius: 11px;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .1);
      font-size: .74rem;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: transform .1s
    }

    .mode:active {
      transform: scale(.94);
      background: rgba(34, 228, 255, .18)
    }

    .stars {
      font-size: .72rem;
      letter-spacing: 1px;
      color: #2f3766
    }

    .stars .on {
      color: var(--yellow);
      text-shadow: 0 0 6px rgba(255, 225, 77, .8)
    }

    .mode .bt {
      font-size: .58rem;
      color: var(--muted);
      font-family: var(--mono);
      min-height: .8em
    }

    .mode.perfect {
      border-color: rgba(255, 225, 77, .55);
      background: rgba(255, 225, 77, .08)
    }

    /* Game */
    #scr-game {
      padding: 0;
      display: none;
      flex-direction: column
    }

    #scr-game.active {
      display: flex
    }

    .g-top {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px 4px;
      padding-top: max(10px, env(safe-area-inset-top))
    }

    .g-mid {
      flex: 1;
      min-width: 0
    }

    .g-label {
      font-size: .7rem;
      color: var(--muted);
      font-weight: 800;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between
    }

    .g-label b {
      color: var(--text);
      font-family: var(--mono)
    }

    .g-mid .bar {
      height: 9px
    }

    .g-timer {
      font-family: var(--mono);
      font-weight: 900;
      font-size: 1.1rem;
      min-width: 62px;
      text-align: right
    }

    .g-timer small {
      display: block;
      font-size: .55rem;
      color: var(--muted)
    }

    .g-timer.warn {
      color: var(--red);
      animation: pulse .5s infinite
    }

    .battle {
      position: relative;
      height: clamp(104px, 19vh, 170px);
      flex: none
    }

    .battle::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 4px;
      height: 30%;
      background: linear-gradient(180deg, transparent, rgba(34, 228, 255, .06));
      border-bottom: 1px solid rgba(34, 228, 255, .18)
    }

    .enemy-wrap {
      position: absolute;
      right: 9%;
      top: 4px;
      width: clamp(78px, 15vh, 124px);
      text-align: center;
      z-index: 2
    }

    .enemy {
      width: 100%;
      aspect-ratio: 1
    }

    .enemy.appear {
      animation: appear .4s ease
    }

    @keyframes appear {
      from {
        transform: scale(0) rotate(-90deg);
        opacity: 0
      }
    }

    .enemy.hit {
      animation: ehit .3s ease
    }

    @keyframes ehit {
      0% {
        filter: brightness(3)
      }

      30% {
        transform: translateX(8px) scale(.92)
      }

      60% {
        transform: translateX(-5px)
      }

      100% {
        filter: none;
        transform: none
      }
    }

    .enemy.boom {
      animation: boom .55s ease forwards
    }

    @keyframes boom {
      0% {
        filter: brightness(3)
      }

      100% {
        transform: scale(1.6) rotate(40deg);
        opacity: 0
      }
    }

    .ehp {
      height: 6px;
      border-radius: 9px;
      background: rgba(255, 255, 255, .1);
      overflow: hidden;
      margin-top: -4px
    }

    .ehp i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #ff4d6d, #ffb000);
      transition: width .3s
    }

    .g-pet {
      position: absolute;
      left: 7%;
      bottom: 2px;
      width: clamp(70px, 13vh, 104px);
      aspect-ratio: 1;
      z-index: 2
    }

    .g-wave {
      position: absolute;
      left: 50%;
      top: 6px;
      transform: translateX(-50%);
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--muted);
      font-weight: 900;
      letter-spacing: .15em
    }

    .combo {
      position: absolute;
      left: 46%;
      top: 46%;
      transform: translate(-50%, -50%);
      font-family: var(--mono);
      font-weight: 900;
      font-size: 1.35rem;
      color: var(--yellow);
      text-shadow: 0 0 14px rgba(255, 225, 77, .9);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      z-index: 3
    }

    .combo.show {
      animation: comboPop .8s ease
    }

    @keyframes comboPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -30%) scale(.6)
      }

      25% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.15)
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -90%) scale(1)
      }
    }

    .ftxt {
      position: absolute;
      right: 20%;
      top: 30%;
      font-family: var(--mono);
      font-weight: 900;
      font-size: 1.1rem;
      pointer-events: none;
      animation: ftxt .9s ease forwards;
      z-index: 4
    }

    .ftxt.good {
      color: var(--green)
    }

    .ftxt.bad {
      color: var(--red)
    }

    @keyframes ftxt {
      to {
        transform: translateY(-36px);
        opacity: 0
      }
    }

    .zap {
      position: absolute;
      right: 16%;
      top: 22%;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff, rgba(255, 225, 77, .6) 40%, transparent 70%);
      pointer-events: none;
      animation: zap .35s ease forwards;
      z-index: 3
    }

    @keyframes zap {
      from {
        transform: scale(.3);
        opacity: 1
      }

      to {
        transform: scale(1.6);
        opacity: 0
      }
    }

    .eq-card {
      margin: 4px 14px 0;
      padding: 14px 8px;
      text-align: center
    }

    .eq-line {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px 8px;
      font-weight: 900;
      font-size: clamp(2rem, 9.5vw, 2.8rem);
      line-height: 1.2
    }

    .eq-line.rem {
      font-size: clamp(1.55rem, 7vw, 2.3rem)
    }

    .eq-txt {
      white-space: nowrap;
      text-shadow: 0 0 18px rgba(34, 228, 255, .45)
    }

    .ibox {
      min-width: 1.9em;
      height: 1.45em;
      padding: 0 .18em;
      border-radius: 12px;
      border: 2px dashed rgba(255, 255, 255, .25);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--yellow);
      font-family: var(--mono);
      font-size: .9em;
      transition: all .15s
    }

    .ibox.on {
      border-style: solid;
      border-color: var(--cyan);
      background: rgba(34, 228, 255, .12);
      box-shadow: 0 0 18px rgba(34, 228, 255, .35)
    }

    .ibox.on:empty::after {
      content: '';
      width: 3px;
      height: .85em;
      background: var(--cyan);
      animation: pulse 1s steps(1) infinite
    }

    .ibox.good {
      border-color: var(--green);
      border-style: solid;
      color: var(--green);
      background: rgba(77, 255, 154, .12);
      box-shadow: 0 0 18px rgba(77, 255, 154, .4)
    }

    .ibox .ghost {
      opacity: .28
    }

    .amari {
      font-size: .5em;
      color: var(--pink);
      white-space: nowrap
    }

    .shake {
      animation: shake .35s ease
    }

    @keyframes shake {

      0%,
      100% {
        transform: none
      }

      20% {
        transform: translateX(-10px)
      }

      40% {
        transform: translateX(10px)
      }

      60% {
        transform: translateX(-6px)
      }

      80% {
        transform: translateX(6px)
      }
    }

    .fb {
      min-height: 62px;
      margin: 8px 14px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 800;
      font-size: .95rem;
      line-height: 1.5
    }

    .fb-ok {
      color: var(--green)
    }

    .fb-ok small {
      display: block;
      color: #bfffd8;
      font-size: .82rem
    }

    .fb-bad {
      color: var(--pink)
    }

    .fb-ans {
      color: var(--yellow)
    }

    .fb-ans b {
      font-size: 1.2em
    }

    .hint {
      background: rgba(255, 225, 77, .08);
      border: 1px dashed rgba(255, 225, 77, .45);
      border-radius: 14px;
      padding: 8px 12px;
      width: 100%
    }

    .hint-t {
      color: var(--yellow);
      font-size: .88rem
    }

    .hint-t .q {
      color: var(--pink)
    }

    .hint-s {
      font-size: .75rem;
      color: var(--muted);
      margin-top: 3px;
      font-family: var(--mono);
      letter-spacing: .02em
    }

    .dots {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 7px;
      justify-content: center;
      margin-top: 6px
    }

    .dots .grp {
      display: inline-flex;
      gap: 2px;
      padding: 2px 3px;
      border-radius: 5px;
      background: rgba(34, 228, 255, .1)
    }

    .dots .grp i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      display: block
    }

    .keypad {
      margin-top: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 10px 14px;
      padding-bottom: max(14px, env(safe-area-inset-bottom))
    }

    .key {
      height: clamp(48px, 8vh, 66px);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .11), rgba(255, 255, 255, .04));
      border: 1px solid rgba(255, 255, 255, .12);
      font-size: 1.7rem;
      font-weight: 900;
      box-shadow: 0 3px 0 rgba(0, 0, 0, .45);
      font-family: var(--mono)
    }

    .key:active,
    .key.press {
      transform: translateY(2px);
      box-shadow: none;
      background: rgba(34, 228, 255, .25)
    }

    .key.k-del {
      color: var(--pink);
      font-size: 1.15rem
    }

    .key.k-ok {
      color: #03131c;
      background: linear-gradient(180deg, #5ff0ff, #16b4d6);
      font-size: 1.15rem;
      border: none
    }

    /* Flash */
    #flash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      z-index: 40;
      transition: opacity .12s
    }

    #flash.good {
      background: radial-gradient(circle, rgba(77, 255, 154, .0), rgba(77, 255, 154, .28))
    }

    #flash.bad {
      background: radial-gradient(circle, rgba(255, 77, 109, .0), rgba(255, 77, 109, .38))
    }

    /* Result */
    .res {
      text-align: center;
      padding-top: 10px
    }

    .res-title {
      font-family: var(--mono);
      font-weight: 900;
      font-size: clamp(1.6rem, 8vw, 2.2rem);
      color: var(--yellow);
      text-shadow: 0 0 18px rgba(255, 225, 77, .6);
      margin-top: 12px
    }

    .res-title.jp {
      font-family: var(--font)
    }

    .res-sub {
      color: var(--muted);
      font-weight: 800;
      font-size: .85rem;
      margin-top: 4px
    }

    .res-stars {
      font-size: 3rem;
      margin: 12px 0 2px;
      letter-spacing: 6px
    }

    .res-stars span {
      display: inline-block;
      color: #262c55;
      opacity: 0;
      animation: starIn .45s ease forwards
    }

    .res-stars span.on {
      color: var(--yellow);
      text-shadow: 0 0 18px rgba(255, 225, 77, .9)
    }

    @keyframes starIn {
      from {
        opacity: 0;
        transform: scale(2.4) rotate(-40deg)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .res-crit {
      font-size: .75rem;
      color: var(--muted);
      font-weight: 700
    }

    .res-big {
      font-family: var(--mono);
      font-size: 3.4rem;
      font-weight: 900;
      color: var(--cyan);
      text-shadow: 0 0 22px rgba(34, 228, 255, .6);
      margin: 10px 0 0
    }

    .res-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 14px 0 10px
    }

    .rs {
      padding: 10px;
      border-radius: 14px;
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .08)
    }

    .rs small {
      display: block;
      font-size: .66rem;
      color: var(--muted);
      font-weight: 800
    }

    .rs b {
      font-family: var(--mono);
      font-size: 1.25rem
    }

    .newrec {
      display: inline-block;
      font-size: .6rem;
      font-weight: 900;
      color: #03131c;
      background: var(--yellow);
      border-radius: 6px;
      padding: 1px 6px;
      margin-left: 4px;
      vertical-align: middle;
      animation: pulse 1s infinite
    }

    .reward {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px;
      text-align: left
    }

    .reward .pv {
      width: 76px;
      height: 76px;
      flex: none
    }

    .reward .rw {
      flex: 1;
      min-width: 0
    }

    .gain {
      display: flex;
      gap: 14px;
      font-family: var(--mono);
      font-weight: 900;
      font-size: 1.05rem
    }

    .gain .e {
      color: var(--pink)
    }

    .gain .c {
      color: #ffc93d
    }

    .bonus {
      font-size: .7rem;
      font-weight: 800;
      color: #ff9be8;
      margin-top: 4px
    }

    .lvup {
      color: var(--yellow);
      font-weight: 900;
      font-size: .85rem;
      margin-top: 4px;
      animation: pulse 1s infinite
    }

    .res-btns {
      display: grid;
      gap: 8px;
      margin-top: 16px
    }

    .res-btns .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px
    }

    /* Pet room */
    .room {
      padding: 12px;
      position: relative;
      overflow: hidden
    }

    .room-stage {
      position: relative;
      height: 230px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .room-stage::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 14px;
      background: radial-gradient(60% 60% at 50% 55%, var(--tg), transparent 70%)
    }

    .room-floor {
      position: absolute;
      bottom: 8px;
      left: 10%;
      right: 10%;
      height: 40px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(34, 228, 255, .45), transparent 70%);
      box-shadow: 0 0 30px rgba(34, 228, 255, .25)
    }

    .room-pet {
      width: 200px;
      height: 200px;
      position: relative;
      z-index: 2;
      cursor: pointer
    }

    .bubble {
      position: absolute;
      top: 2px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      color: #14183a;
      font-weight: 800;
      font-size: .8rem;
      padding: 7px 12px;
      border-radius: 14px;
      white-space: nowrap;
      z-index: 3;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .3);
      max-width: 92%;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      margin-left: -6px;
      border: 6px solid transparent;
      border-top-color: #fff;
      border-bottom: 0
    }

    .bubble.pop {
      animation: bpop .3s ease
    }

    @keyframes bpop {
      from {
        transform: translateX(-50%) scale(.6);
        opacity: 0
      }
    }

    .poops {
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 3;
      pointer-events: none
    }

    .poops i {
      color: #d4a373;
      font-size: 1.6rem;
      filter: drop-shadow(0 0 6px rgba(212, 163, 115, .7));
      animation: float 2s infinite
    }

    .room-name {
      text-align: center;
      margin-top: 4px
    }

    .room-name .nm {
      font-size: 1.35rem;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      gap: 8px
    }

    .room-name .nm button {
      font-size: .8rem;
      color: var(--muted)
    }

    .room-name .sp {
      font-size: .75rem;
      color: var(--muted);
      font-weight: 700
    }

    .room-name .badges {
      justify-content: center;
      margin-top: 6px
    }

    .lvbox {
      margin-top: 12px
    }

    .lvbox .top {
      display: flex;
      justify-content: space-between;
      font-size: .72rem;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 4px
    }

    .lvbox .top b {
      color: var(--text);
      font-family: var(--mono);
      font-size: .95rem
    }

    .lvbox .bar {
      height: 10px
    }

    .stat-card {
      padding: 12px;
      margin-top: 10px
    }

    .stat-card h4 {
      font-size: .75rem;
      color: var(--muted);
      font-weight: 800;
      letter-spacing: .1em;
      margin-bottom: 6px
    }

    .trend {
      margin-top: 10px;
      font-size: .78rem;
      font-weight: 800;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .05)
    }

    .care-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px
    }

    .care {
      padding: 12px 4px 10px;
      border-radius: 16px;
      border: 1px solid;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-weight: 900;
      font-size: .82rem;
      transition: transform .1s;
      background: rgba(255, 255, 255, .04)
    }

    .care:active {
      transform: scale(.94)
    }

    .care i {
      font-size: 1.35rem
    }

    .care small {
      font-size: .62rem;
      color: var(--muted);
      font-weight: 700
    }

    .care[disabled] {
      opacity: .35;
      pointer-events: none
    }

    .tip {
      font-size: .7rem;
      color: #6d79aa;
      text-align: center;
      margin-top: 14px;
      line-height: 1.7
    }

    /* Zukan */
    .dex-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px
    }

    .dex-head b {
      font-family: var(--mono);
      font-size: 1.4rem;
      color: var(--yellow)
    }

    .dex-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px
    }

    .dex {
      padding: 6px 4px 9px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      text-align: center;
      transition: transform .1s
    }

    .dex:active {
      transform: scale(.95)
    }

    .dex .sv {
      width: 100%;
      aspect-ratio: 1
    }

    .dex .nm {
      font-size: .7rem;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 2px
    }

    .dex .no {
      font-family: var(--mono);
      font-size: .56rem;
      color: var(--muted)
    }

    .dex.unk .sv svg {
      filter: brightness(0) drop-shadow(0 0 1px rgba(160, 190, 255, .8));
      opacity: .5
    }

    .dex.unk .nm {
      color: #5c6797
    }

    .dex.cur {
      border-color: var(--yellow);
      box-shadow: 0 0 12px rgba(255, 225, 77, .3)
    }

    .dex-big {
      width: 180px;
      height: 180px;
      margin: 0 auto
    }

    .dex-big.unk svg {
      filter: brightness(0) drop-shadow(0 0 1px rgba(160, 190, 255, .8));
      opacity: .5
    }

    /* Map */
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px
    }

    .tab {
      padding: 9px 4px;
      border-radius: 12px;
      font-weight: 900;
      font-size: .8rem;
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .1)
    }

    .tab.on {
      color: #04121a;
      border: none
    }

    .map-card {
      padding: 10px
    }

    .map-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 800;
      font-size: .8rem
    }

    .map-head b {
      font-family: var(--mono);
      font-size: 1.1rem;
      color: var(--yellow)
    }

    .map-grid {
      display: grid;
      grid-template-columns: 26px repeat(9, 1fr);
      gap: 3px
    }

    .mc {
      aspect-ratio: 1;
      border-radius: 6px;
      display: grid;
      place-items: center;
      font-size: clamp(.55rem, 2.6vw, .72rem);
      font-weight: 900;
      font-family: var(--mono)
    }

    .mc.h {
      color: var(--muted);
      font-size: .66rem
    }

    .mc.cell {
      cursor: pointer
    }

    .st0 {
      background: rgba(255, 255, 255, .05);
      color: #56628f
    }

    .st1 {
      background: rgba(255, 77, 109, .3);
      color: #ffd2da;
      box-shadow: inset 0 0 0 1px #ff4d6d
    }

    .st2 {
      background: rgba(255, 225, 77, .18);
      color: #fff2a8;
      box-shadow: inset 0 0 0 1px rgba(255, 225, 77, .4)
    }

    .st3 {
      background: linear-gradient(135deg, #ffe98a, #ffb000);
      color: #3a2400
    }

    .legend {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px;
      font-size: .66rem;
      font-weight: 800;
      color: var(--muted)
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 4px
    }

    .legend i {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      display: inline-block
    }

    /* Modal */
    .modal {
      position: absolute;
      inset: 0;
      z-index: 70;
      background: rgba(2, 4, 14, .72);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fade .2s
    }

    @keyframes fade {
      from {
        opacity: 0
      }
    }

    .modal-box {
      width: 100%;
      max-width: 380px;
      padding: 20px 18px 16px;
      max-height: 88%;
      overflow-y: auto;
      animation: mIn .25s ease
    }

    @keyframes mIn {
      from {
        transform: scale(.9);
        opacity: 0
      }
    }

    .m-title {
      font-weight: 900;
      font-size: 1.15rem;
      text-align: center;
      margin-bottom: 10px
    }

    .m-body {
      font-size: .88rem;
      line-height: 1.7;
      text-align: center;
      color: #cbd6ff
    }

    .m-body p+p {
      margin-top: 8px
    }

    .m-btns {
      display: grid;
      gap: 8px;
      margin-top: 16px
    }

    .m-btns.two {
      grid-template-columns: 1fr 1fr
    }

    .m-input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, .35);
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 800;
      text-align: center;
      margin-top: 8px;
      outline: none
    }

    .m-input:focus {
      border-color: var(--cyan)
    }

    .howto {
      text-align: left;
      font-size: .8rem
    }

    .howto h5 {
      color: var(--cyan);
      font-size: .85rem;
      margin: 10px 0 2px
    }

    /* Evolution */
    .evo {
      position: absolute;
      inset: 0;
      z-index: 80;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 42%, #1d1556 0%, #02030a 70%)
    }

    .evo .rays {
      position: absolute;
      left: 50%;
      top: 42%;
      width: 170vmax;
      height: 170vmax;
      margin: -85vmax 0 0 -85vmax;
      border-radius: 50%;
      background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, .09) 0 7deg, transparent 7deg 18deg);
      animation: spin 16s linear infinite;
      opacity: 0;
      transition: opacity .8s
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .evo.revealed .rays {
      opacity: 1
    }

    .evo-stage {
      width: 230px;
      height: 230px;
      position: relative;
      z-index: 2
    }

    .evo-stage.charge {
      animation: charge .14s infinite
    }

    @keyframes charge {

      0%,
      100% {
        transform: translateX(-2px)
      }

      50% {
        transform: translateX(2px)
      }
    }

    .evo-stage.wsil svg {
      filter: brightness(0) invert(1) drop-shadow(0 0 12px #fff)
    }

    .evo-stage.reveal {
      animation: revealPop .6s ease
    }

    @keyframes revealPop {
      from {
        transform: scale(.4)
      }

      60% {
        transform: scale(1.12)
      }
    }

    .evo-msg {
      font-weight: 900;
      font-size: 1.1rem;
      margin-bottom: 18px;
      min-height: 1.6em;
      position: relative;
      z-index: 2
    }

    .evo-info {
      position: relative;
      z-index: 2;
      margin-top: 12px;
      min-height: 120px
    }

    .evo-name {
      font-size: 1.9rem;
      font-weight: 900;
      color: var(--yellow);
      text-shadow: 0 0 18px rgba(255, 225, 77, .7)
    }

    .evo-desc {
      font-size: .82rem;
      color: #c9d3ff;
      margin-top: 8px;
      line-height: 1.6;
      max-width: 320px
    }

    .newtag {
      display: inline-block;
      background: var(--pink);
      color: #fff;

    const CHAR = {};
    CHARS.forEach((c, i) => {
      c.no = i + 1;
      CHAR[c.id] = c;
    });
    let _uid = 0;

    function fullPal(c) {
      const p = {
        ...c.pal
      };
      p.line = p.line || shade(p.main, -.62);
      p.belly = p.belly || shade(p.main, .5);
      p.wing = p.wing || p.sub;
      p.horn = p.horn || '#fff3c4';
      p.cape = p.cape || shade(p.sub, -.3);
      p.eye = p.eye || '#1b1240';
      p.gem = p.gem || p.accent;
      return p;
    }

    function charSVG(id, opts = {}) {
      const c = CHAR[id] || CHAR.egg,
        u = ++_uid,
        p = fullPal(c);
      const b = {
        ex: 11,
        ...BODY[c.body]
      };
      b.haloY = c.head.includes('crown') ? b.top - 24 : b.top - 12;
      const sc = [.8, .84, .9, .95, 1, 1.04, 1.06][c.tier];
      const aura = !opts.noAura && !opts.sil;
      let s = `<svg class="chr" viewBox="-12 -12 144 144" xmlns="http://www.w3.org/2000/svg">`;
      s += `<defs><linearGradient id="g${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shade(p.main, .3)}"/><stop offset="1" stop-color="${shade(p.main, -.2)}"/></linearGradient>`;
      s += `<radialGradient id="a${u}"><stop offset="0" stop-color="${p.accent}" stop-opacity=".5"/><stop offset="1" stop-color="${p.accent}" stop-opacity="0"/></radialGradient></defs>`;
      if (aura) {
        const r = 38 + c.tier * 4;
        s += `<circle cx="60" cy="64" r="${r}" fill="url(#a${u})"><animate attributeName="r" values="${r};${r + 4};${r}" dur="${c.type === 'dark' ? .8 : 2.4}s" repeatCount="indefinite"/></circle>`;
        if (c.tier >= 4) s += `<circle cx="60" cy="64" r="64" fill="none" stroke="${p.accent}" stroke-width="1.3" stroke-dasharray="2 9" opacity=".65"><animateTransform attributeName="transform" type="rotate" from="0 60 64" to="360 60 64" dur="14s" repeatCount="indefinite"/></circle>`;
      }
      s += `<g transform="translate(60 66) scale(${sc}) translate(-60 -66)">`;
      if (c.body === 'egg') s += `<g><animateTransform attributeName="transform" type="rotate" values="0 60 100;-5 60 100;5 60 100;0 60 100;0 60 100" keyTimes="0;.1;.2;.3;1" dur="2.6s" repeatCount="indefinite"/>`;
      c.back.forEach(k => s += BACK[k](b, p));
      c.head.forEach(k => {
        if (HEAD[k].back) s += HEAD[k].fn(b, p);
      });
      s += `<path d="${b.d}" fill="url(#g${u})" stroke="${p.line}" stroke-width="3" stroke-linejoin="round"/>`;
      const hlx = b.hlx ?? 60 - b.hw * .42,
        hly = b.hly ?? b.top + (b.eye - b.top) * .42;
      s += `<ellipse cx="${hlx}" cy="${hly}" rx="${b.hw * .2}" ry="${Math.max(3, (b.eye - b.top) * .14)}" transform="rotate(-30 ${hlx} ${hly})" fill="#fff" opacity=".3"/>`;
      c.front.forEach(k => {
        if (!FRONT_OVER.has(k)) s += FRONT[k](b, p);
      });
      s += EYES[c.eyes](b, p) + MOUTH[c.mouth](b, p);
      c.front.forEach(k => {
        if (FRONT_OVER.has(k)) s += FRONT[k](b, p);
      });
      c.head.forEach(k => {
        if (!HEAD[k].back) s += HEAD[k].fn(b, p);
      });
      if (c.body === 'egg') s += `</g>`;
      s += `</g></svg>`;
      return s;
    }

    function enemySVG(col) {
      const u = ++_uid;
      let sp = '';
      for (let i = 0; i < 10; i++) {
        const a = i * 36 * Math.PI / 180;
        const x1 = (60 + Math.cos(a) * 26).toFixed(1),
          y1 = (60 + Math.sin(a) * 26).toFixed(1),
          x2 = (60 + Math.cos(a) * 41).toFixed(1),
          y2 = (60 + Math.sin(a) * 41).toFixed(1);
        sp += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="4" stroke-linecap="round"/><circle cx="${x2}" cy="${y2}" r="4.6" fill="${col}"/>`;
      }
      const dk = shade(col, -.65);
      return `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;overflow:visible"><defs><radialGradient id="e${u}" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="${shade(col, .5)}"/><stop offset="1" stop-color="${shade(col, -.45)}"/></radialGradient></defs>
  <g><animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="10s" repeatCount="indefinite"/>${sp}</g>
  <circle cx="60" cy="60" r="29" fill="url(#e${u})" stroke="${dk}" stroke-width="3"/>
  <ellipse cx="50" cy="58" rx="6" ry="7" fill="#fff"/><ellipse cx="70" cy="58" rx="6" ry="7" fill="#fff"/>
  <circle cx="51.5" cy="60" r="3.4" fill="#111"/><circle cx="68.5" cy="60" r="3.4" fill="#111"/>
  <path d="M42,48 L56,53 M78,48 L64,53" stroke="${dk}" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M47,72 L52,69 L57,73 L62,69 L67,73 L73,70" fill="none" stroke="${dk}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
    }

      return {
        nick: '',
        form: 'egg',

        bond: 20,

    function freshSave() {
      return {
        v: 2,
        coins: 100,
        sound: true,
        prog: {
          mul: {},
          div: {},
          rem: {}
        },
        facts: {
          mul: {},
          div: {},

        },
        pet: freshPet(),

    let S = freshSave();

    function deepMerge(base, d) {
      for (const k in d) {
        if (d[k] && typeof d[k] === 'object' && !Array.isArray(d[k]) && base[k] && typeof base[k] === 'object') base[k] = deepMerge(base[k], d[k]);
        else base[k] = d[k];
      }
      return base;
    }

    function save() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(S));
      } catch (e) {
        /* ignore */ }
    }

    function load() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) {
          S = deepMerge(freshSave(), JSON.parse(raw));
          if (!CHAR[S.pet.form]) S.pet.form = 'egg';
          return 'ok';
        }
        const old = localStorage.getItem(OLD_KEY);
        if (old) {
          migrate(JSON.parse(old));
          save();
          return 'migrated';
        }
      } catch (e) {
        console.warn(e);
      }
      save();
      return 'new';
    }

    function migrate(o) {
      S = freshSave();
      S.coins = clamp(Math.floor(o.coins || 0), 0, 3000) + 100;
      if (o.pet) {
        const st = o.pet.stats || {};
        S.pet.lv = clamp(Math.floor(o.pet.stage || 1), 1, 99);
        S.pet.stats = {
          speed: Math.floor((st.speed || 0) / 2),
          logic: Math.floor((st.logic || 0) / 2),
          power: Math.floor((st.power || 0) / 2),
          neglect: Math.floor((st.neglect || 0) / 2)
        };
        S.pet.energy = clamp(o.pet.energy ?? 80, 0, 100);
        S.pet.happy = clamp(o.pet.happiness ?? 80, 0, 100);
        S.pet.poops = clamp(o.pet.poops || 0, 0, 4);
      }
    }
    /* ---------- 記録ヘルパー ---------- */
    function getRec(c, sid, m) {
      const pc = S.prog[c];
      pc[sid] = pc[sid] || {};
      pc[sid][m] = pc[sid][m] || {
        st: 0,
        best: null
      };
      return pc[sid][m];
    }

    function peekRec(c, sid, m) {
      return (S.prog[c][sid] || {})[m] || {
        st: 0,
        best: null
      };
    }

    function courseStars(c) {
      let n = 0;
      STAGES[c].forEach(st => stageModes(st).forEach(m => n += peekRec(c, st.id, m).st));
      return n;
    }

    function courseMaxStars(c) {
      let n = 0;
      STAGES[c].forEach(st => n += stageModes(st).length * 3);
      return n;
    }
    const totalStars = () => courseStars('mul') + courseStars('div') + courseStars('rem');
    const factRows = c => c === 'rem' ? range(2, 9) : range(1, 9);
    const factTotal = c => factRows(c).length * 9;

    function masterCount(c) {
      let n = 0;
      factRows(c).forEach(a => range(1, 9).forEach(b => {
        const r = S.facts[c][a + 'x' + b];
        if (r && r.m) n++;
      }));
      return n;
    }

    function factStatus(r) {
      if (!r || !r.n) return 0;
      if (r.s === 0) return 1;
      if (r.m) return 3;
      return 2;
    }

    function weakFacts() {
      const out = [];
      ['mul', 'div', 'rem'].forEach(c => factRows(c).forEach(a => range(1, 9).forEach(b => {
        const r = S.facts[c][a + 'x' + b];
        if (r && r.n && r.w > 0 && r.s < 3) out.push({
          course: c,
          a,
          b,
          s: r.s,
          w: r.w
        });
      })));
      return out.sort((x, y) => x.s - y.s || y.w - x.w);
    }
    /* =========================================================
       ペットのロジック
       ========================================================= */
    const needExp = lv => 30 + lv * 6;
    const petChar = () => CHAR[S.pet.form] || CHAR.egg;
    const petName = () => S.pet.nick || petChar().name;

    function addPetExp(amt) {
      const p = S.pet;
      let ups = 0;
      if (p.lv >= 100) return 0;
      p.exp += amt;
      while (p.lv < 100 && p.exp >= needExp(p.lv)) {
        p.exp -= needExp(p.lv);
        p.lv++;
        ups++;
      }
      if (p.lv >= 100) p.exp = 0;
      return ups;
    }

    function determineType() {
      const s = S.pet.stats,
        tot = s.speed + s.logic + s.power;
      if (s.neglect >= 12 && s.neglect > tot * 0.25) return 'dark';
      const mx = Math.max(s.speed, s.logic, s.power),
        mn = Math.min(s.speed, s.logic, s.power);
      if (tot >= 15 && (mx - mn) <= mx * 0.35 && S.pet.bond >= 60) return 'magic';
      if (mx === 0) return 'logic';
      if (s.speed === mx) return 'speed';
      if (s.logic === mx) return 'logic';
      return 'power';
    }

    function variantOf(type) {
      const s = S.pet.stats;
      if (type === 'speed') return s.logic >= s.power ? 'A' : 'B';
      if (type === 'logic') return s.speed >= s.power ? 'A' : 'B';
      if (type === 'power') return s.speed >= s.logic ? 'A' : 'B';
      if (type === 'magic') return s.speed >= s.logic ? 'A' : 'B';
      return s.power >= s.logic ? 'A' : 'B';
    }

    function legendCandidate() {
      if (masterCount('mul') >= 81) return 'kukurion';
      if (masterCount('div') >= 81) return 'divina';
      return null;
    }

    function targetTier() {
      let t = 0;
      for (let i = 0; i <= 5; i++)
        if (S.pet.lv >= EVO_LV[i]) t = i;
      if (S.pet.lv >= 100 && legendCandidate()) t = 6;
      return t;
    }

    function chooseForm(tier) {
      if (tier === 0) return 'egg';
      if (tier === 1) return 'pico';
      if (tier === 6) return legendCandidate();
      const type = determineType(),
        v = variantOf(type);
      const c = CHARS.find(x => x.tier === tier && x.type === type && (tier === 2 || tier === 5 || x.v === v));
      return c ? c.id : null;
    }
    const pendingEvolution = () => targetTier() > petChar().tier;

    function offlineUpdate() {
      const p = S.pet,
        now = Date.now();
      let h = (now - (p.last || now)) / 36e5;
      if (h < 0.02) return;
      h = Math.min(h, 48);
      if (p.form !== 'egg') {
        p.energy = clamp(p.energy - h * 4, 0, 100);
        p.happy = clamp(p.happy - h * 3 - p.poops * h, 0, 100);
        p.poopAcc = (p.poopAcc || 0) + h;
        while (p.poopAcc >= 3) {
          p.poopAcc -= 3;
          if (p.poops < 4) p.poops++;
        }
        if (p.poops > 0) p.stats.neglect += Math.min(8, p.poops * h * 0.4);
        if (p.energy <= 0) p.stats.neglect += Math.min(4, h * 0.3);
        if (p.happy < 30) p.bond = clamp(p.bond - h * 0.5, 0, 100);
      }
      p.last = now;
      save();
    }

    function petMood() {
      const p = S.pet;
      if (p.form === 'egg') return '問題をとくと タマゴがかえるよ！';
      if (p.poops >= 2) return 'トイレ… そうじしてほしいな…';
      if (p.energy <= 15) return 'おなか ペコペコだよ…';
      if (p.happy <= 25) return 'なんだか さみしいな…';
      if (p.poops > 0) return 'あっ、うんちが ひとつ…';
      if (p.energy < 40) return 'ちょっと おなかすいたかも';
      if (pendingEvolution()) return 'からだが あつい…！ しんかしそう！';
      if (p.happy >= 80) return pick(['いっしょに 九九しよう！', 'きょうも がんばろうね！', 'つぎの しんかが たのしみ！', 'わり算も まかせて！', 'きみと いると たのしい！']);
      return pick(['なにして あそぶ？', '問題、といてみようよ！', 'なでてくれると うれしいな']);
    }

    function sfx(name) {
      if (!S.sound) return;
      try {
        if (!actx) actx = new(window.AudioContext || window.webkitAudioContext)();
        if (actx.state === 'suspended') actx.resume();
        let t = actx.currentTime;
        SFX[name].forEach(([f, d, w]) => {
          const o = actx.createOscillator(),
            g = actx.createGain();
          o.type = w || 'triangle';
          o.frequency.value = f;
          const vol = name === 'tap' ? .04 : .13;
          g.gain.setValueAtTime(vol, t);
          g.gain.exponentialRampToValueAtTime(.0005, t + d);
          o.connect(g);
          g.connect(actx.destination);
          o.start(t);
          o.stop(t + d + .03);
          t += d * .9;
        });
      } catch (e) {

    /* =========================================================

      };
      $('home').innerHTML = `

    <div class="sec-title">がくしゅう</div>

    <div class="sec-title">チャレンジ</div>

        <i class="fas fa-book-open big" style="color:var(--yellow)"></i><div class="t1">ずかん</div><div class="t2">${Object.keys(S.dex).filter(k => CHAR[k]).length} / ${CHARS.length} たい</div></button>
      <button class="tile" onclick="openMap()" style="border-color:rgba(166,107,255,.4);background:linear-gradient(140deg,rgba(166,107,255,.2),rgba(18,26,62,.75))">
        <i class="fas fa-table-cells big" style="color:var(--violet)"></i><div class="t1">マスターマップ</div><div class="t2">81マスを うめよう</div></button>

    /* =========================================================
       ステージ選択

    let curCourse = 'mul';

    function openCourse(c) {
      sfx('tap');

    function renderStages() {
      const c = curCourse,
        C = COURSES[c];
      const fmt = t => t == null ? '' : t.toFixed(1) + 's';
      let html = `<div class="card crit"><b>★</b> クリア　<b>★★</b> ミス2回まで　<b>★★★</b> ノーミス＆1問 ${C.target}秒いない<br>まちがえても ヒントが出るよ。あきらめずに がんばろう！</div>`;
      STAGES[c].forEach(st => {

    /* =========================================================
       ゲーム本体

    let G = null,

    };
    const WAVE_COL = ['#ff4d6d', '#ff9a3d', '#ffe14d', '#4dff9a', '#22e4ff', '#a66bff', '#ff4fd8'];

    function startStage(course, sid, mode) {
      sfx('tap');
      const st = STAGES[course].find(s => s.id === sid);
      beginGame({
        kind: 'stage',
        course,
        stageId: sid,
        mode,
        qs: buildQuestions(course, st, mode),
        label: `${COURSES[course].short} ${st.label}${st.mix ? '' : ' ・ ' + MODES[mode]}`
      });

    function startSurvival() {
      sfx('tap');
      beginGame({
        kind: 'survival',

        qs: [],
        label: 'サバイバル'
      });

    function startWeak() {
      const list = weakFacts();
      if (!list.length) {
        toast('にがてな問題は まだないよ！<br>ステージで れんしゅうしよう');
        return;
      }
      sfx('tap');
      const base = list.slice(0, 10);
      const qs = base.map(f => makeQ(f.course, f.a, f.b));
      let i = 0;
      while (qs.length < 5) {
        const f = base[i++ % base.length];
        qs.push(makeQ(f.course, f.a, f.b));
      }
      beginGame({
        kind: 'weak',
        course: 'weak',
        qs: shuffle(qs),
        label: 'にがて特訓'
      });
    }

    function survivalQ(i) {
      const pool = ['mul'];
      if (i >= 8) pool.push('div');
      if (i >= 18) pool.push('rem');
      let q, guard = 0;
      do {
        const c = pick(pool);
        const a = c === 'rem' ? 2 + rnd(8) : (i < 4 ? 2 + rnd(4) : 2 + rnd(8));
        q = makeQ(c, a, 1 + rnd(9));
      } while (G.cur && q.text === G.cur.text && ++guard < 10);
      return q;
    }

    function beginGame(cfg) {
      offlineUpdate();
      G = {
        ...cfg,
        idx: -1,
        cur: null,
        inputs: {
          ans: '',

        active: 'ans',
        mistakes: 0,
        qMiss: 0,
        revealed: false,

        combo: 0,
        maxCombo: 0,

        locked: true,

        wave: 1,
        lastTick: performance.now(),
        qStart: performance.now()
      };
      $('g-title').textContent = cfg.label;
      $('g-wave').textContent = cfg.kind === 'survival' ? 'WAVE 1' : '';
      $('g-bar').style.setProperty('--c', cfg.kind === 'survival' ? 'var(--red)' : ENEMY_COL[cfg.course] || 'var(--cyan)');
      $('g-pet').innerHTML = charSVG(S.pet.form, {
        noAura: true
      });

    function setupEnemy() {
      G.enemyMax = G.kind === 'survival' ? 6 + G.wave * 2 : G.qs.length;
      G.enemyHP = G.enemyMax;

    function tick() {
      if (!G || G.ended || G.paused) return;
      const now = performance.now(),
        dt = (now - G.lastTick) / 1000;
      G.lastTick = now;
      if (G.kind === 'survival' && !G.locked) {
        G.timeLeft -= dt;
        if (G.timeLeft <= 0) {
          G.timeLeft = 0;

          finishGame();

      renderTimer();

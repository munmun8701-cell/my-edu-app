          <li><b>むずかしさ・はんい・めあて</b>を 毎回 自分で えらびます。終わりに めあての ふりかえりを 書けます（きろくに たまります）。</li>
          <li><b>★マスター</b>：字ごとに ★0〜5。クイズで★2、書き取りで★4まで、ヒントなしの「むずかしい」書き取りか ボスバトルで★5に なります。まちがえると「にがて」に 入り、2回つづけて 正解すると 外れます。少し時間を あけた ふくしゅうも 自動で 出ます。</li>
          <li><b>書き取りは 自己採点</b>：お手本の かさね表示・書き順・画数の くらべを 見て、◎○✕を 自分で えらびます。「✕」にも ポイントが 入るので、正直に つけるほど 得を します。</li>
          <li><b>なぞり書き</b>は 1画ずつ、むき・書き順・形を 自動で チェックします（むずかしいは お手本なし）。</li>
          <li><b>セットを 配る</b>：漢字ずかんで「えらんで練習」→ 字を えらんで「リンクを コピー」。リンクを ひらいた子は、その字だけで 全モードを 練習できます。</li>
          <li><b>プリント</b>：学年の画面の「プリントを 作る」で、書き取りテスト（答えつき）を 印刷できます。</li>
          <li><b>3つの アプリ</b>：1・2年／3・4年／5・6年に 分かれています（これは ${APP.title}）。同じサイトに 置けば、コイン・ペット・きろく・バッジは 3つの アプリで 共通です。</li>
          <li><b>1〜3年の「先生の問題」</b>は、これまでの 問題を そのまま 入れています。前の バージョンの コイン・進み具合も 引きついでいます。</li>
        </ul>
      </div>
      <div class="panel" style="margin-top:16px"><h3>データの バックアップ</h3>
        <p class="small muted">きろくは この たんまつの ブラウザに 保存されます。たんまつを かえる時や、ブラウザの データを 消す前に、コードで 保存して ください。</p>
        <div class="row"><button class="btn sm ghost" data-act="bkmake">バックアップコードを つくる</button><button class="btn sm dark" data-act="bkfile">ファイルに 保存</button></div>
        <div id="bk-out" style="margin-top:8px"></div>
        <textarea class="inp" id="bk-in" placeholder="バックアップコードを はりつけて「もどす」" style="margin-top:10px"></textarea>
        <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn sm" data-act="bkload">この コードで もどす</button></div>
      </div>
      <div class="panel" style="margin-top:16px"><h3>データを 消す</h3><p class="small muted">コイン・ペット・すべての きろくが 消えます。元に もどせません。</p><button class="btn sm shu" data-act="reset">すべての データを 消す</button></div>
      <p class="foot">書き順：<a href="https://kanjivg.tagaini.net/" target="_blank" rel="noopener">KanjiVG</a> © Ulrich Apel（<a href="https://creativecommons.org/licenses/by-sa/3.0/deed.ja" target="_blank" rel="noopener">CC BY-SA 3.0</a>）のデータを もとに 作成しています。書き順は 教科書と 一部 ちがう場合が あります。<br>熟語・読みの チェックに <a href="https://www.edrdg.org/jmdict/j_jmdict.html" target="_blank" rel="noopener">JMdict</a>（EDRDG, CC BY-SA 4.0）を 使っています。<br>読み・例文は 小学校の 配当漢字（2020年度〜）に もとづいています。</p>
    </div>`;
      },
      mount() {
        $('#nm').oninput = e => {
          S.name = e.target.value.trim();
          save();
        };
      }
    };
    ACT.setsw = t => {
      const k = t.dataset.k;
      S.set[k] = !S.set[k];
      applySettings();
      save();
      render();
    };

    function applySettings() {
      document.documentElement.classList.toggle('big', !!S.set.big);
      document.documentElement.classList.toggle('calm', !!S.set.calm);
    }

    function backupCode() {
      return 'KQB1:' + b64enc(JSON.stringify({
        at: Date.now(),
        prog: lsGet(LS.prog),
        pts: String(points),
        v4: JSON.stringify(S)
      }));
    }
    ACT.bkmake = () => {
      save(true);
      const c = backupCode();
      $('#bk-out').innerHTML = `<code class="share">${esc(c)}</code><button class="btn sm" style="margin-top:6px" data-act="bkcopy">コピー</button>`;
      $('#bk-out').dataset.code = c;
    };
    ACT.bkcopy = async () => {
      const ok = await copyText($('#bk-out').dataset.code);
      toast(ok ? 'コピーしました' : 'コードを 長おしして コピーしてね');
    };
    ACT.bkfile = () => {
      save(true);
      const blob = new Blob([backupCode()], {
        type: 'text/plain'
      });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `kanji-quest-backup-${today()}.txt`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    };
    ACT.bkload = async () => {
      const raw = $('#bk-in').value.trim();
      let o;
      try {
        if (!raw.startsWith('KQB1:')) throw 0;
        o = JSON.parse(b64dec(raw.slice(5)));
        if (!o || !o.v4) throw 0;
        JSON.parse(o.v4);
      } catch (e) {
        toast('コードが 読めませんでした');
        return;
      }
      if (!await ask('この コードで もどす？', `${new Date(o.at).toLocaleString('ja-JP')} の データに おきかわります。いまの データは 消えます。`, 'もどす', 'やめる')) return;
      if (o.prog != null) lsSet(LS.prog, o.prog);
      lsSet(LS.pts, o.pts || '0');
      lsSet(LS.v4, o.v4);
      location.reload();
    };
    ACT.reset = () => {
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      bg.innerHTML = `<div class="modal"><h2>すべての データを 消す</h2><p class="small muted">本当に 消す時は、下に「けす」と 入力して ください。</p><input class="inp" id="rs-in"><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn dark" data-act="closemodal">やめる</button><button class="btn shu" id="rs-ok">消す</button></div></div>`;
      document.body.appendChild(bg);
      $('#rs-ok', bg).onclick = () => {
        if ($('#rs-in', bg).value.trim() !== 'けす') {
          toast('「けす」と 入力して ください');
          return;
        }
        [LS.prog, LS.pts, LS.v4].forEach(k => {
          try {
            localStorage.removeItem(k);
          } catch (e) {}
        });
        location.reload();
      };
    };
    /* ---------------- プリント ---------------- */
    ACT.print = t => {
      const g = t.dataset.g === 'my' ? 'my' : +t.dataset.g;
      const pool = poolOf(g);
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      const groups = groupsOf(pool);
      const units = unitsOf(pool);
      bg.innerHTML = `<div class="modal"><h2>🖨️ プリントを 作る</h2><p class="small muted">${esc(pool.title)} の 書き取りテスト（2ページめに 答え）</p>
    <div class="field"><label for="pr-r">はんい</label><select class="sel" id="pr-r"><option value="all">ぜんぶから</option><option value="ng">にがての字</option>${groups.map((gr, i) => `<option value="g${i}">${esc(gr.label)}</option>`).join('')}${units.map(u => `<option value="u:${esc(u)}">先生の問題：${esc(u)}</option>`).join('')}</select></div>
    <div class="field"><label for="pr-n">問題数</label><select class="sel" id="pr-n"><option>10</option><option selected>15</option><option>20</option></select></div>
    <div class="row" style="justify-content:flex-end"><button class="btn dark" data-act="closemodal">やめる</button><button class="btn" id="pr-go">印刷する</button></div></div>`;
      document.body.appendChild(bg);
      $('#pr-go', bg).onclick = () => {
        const v = $('#pr-r', bg).value,
          n = +$('#pr-n', bg).value;
        const range = v === 'all' ? {
          type: 'all'
        } : v === 'ng' ? {
          type: 'ng'
        } : v[0] === 'g' ? {
          type: 'group',
          i: +v.slice(1)
        } : {
          type: 'unit',
          unit: v.slice(2)
        };
        let qs = questionsFor(pool, {
          range,
          count: n,
          order: 'rand'
        });
        if (!qs.length) {
          toast('問題が ありません');
          return;
        }
        bg.remove();
        printSheet(pool, qs);
      };
    };

    function printSheet(pool, qs) {
      const boxes = q => [...q.target].map(c => `<span class="pp-box">${isKanji(c) ? '<span class="b"></span>' : `<span style="font-size:15pt;padding:0 1mm">${esc(c)}</span>`}</span>`).join('');
      const head = sub => `<div class="pp-head"><div><b style="font-size:16pt">${esc(pool.title)} 漢字テスト</b> <span>${sub}</span></div><div>名前 ＿＿＿＿＿＿＿＿＿　　　／${qs.length}</div></div>`;
      const page1 = `<div class="pp-page">${head('（ ）の 読みの 漢字を 書きましょう')}${qs.map((q, i) => `<div class="pp-q"><span class="no">${i + 1}</span><span>${esc(q.pre)}</span><span style="display:inline-flex;flex-direction:column;align-items:center"><span class="r" style="font-size:10pt">${esc(q.yomi)}</span><span>${boxes(q)}</span></span><span>${esc(q.post)}</span></div>`).join('')}</div>`;
      const page2 = `<div class="pp-page">${head('答え')}${qs.map((q, i) => `<div class="pp-q"><span class="no">${i + 1}</span><span>${esc(q.pre)}<b class="pp-ans">${esc(q.target)}</b>${esc(q.post)}（${esc(q.yomi)}）</span></div>`).join('')}<p style="font-size:9pt;margin-top:8mm">むん先生の学習クエスト 漢字クエスト</p></div>`;
      $('#print-area').innerHTML = page1 + page2;
      setTimeout(() => window.print(), 100);
    }
    /* ---------------- 起動 ---------------- */
    function readHash() {
      const h = location.hash.slice(1);
      if (!h) return false;
      const p = new URLSearchParams(h);
      const set = p.get('set');
      if (!set) return false;
      const chars = [...new Set([...set].filter(own))].slice(0, 200);
      history.replaceState(null, '', location.pathname + location.search);
      if (!chars.length) {
        setTimeout(() => toast(`この リンクの 字は ${APP.title}の アプリには ありません`, 3500), 600);
        return false;
      }
      S.mySet = {
        title: (p.get('t') || '先生からの セット').slice(0, 30),
        chars,
        ts: Date.now()
      };
      save();
      toast(`「${S.mySet.title}」（${chars.length}字）を 読みこみました`);
      return true;
    }
    /** 前のバージョンで クリアした問題を ★に うつす（1回だけ） */
    function migrateLegacy() {
      if (S.mig[APP.id]) return;
      S.mig[APP.id] = Date.now();
      const byId = {};
      ORIG.forEach(q => byId[q.id] = q);
      let n = 0;
      const lift = (ids, m) => ids.forEach(id => {
        const q = byId[id];
        if (!q) return;
        [...q.target].filter(c => KDB[c]).forEach(c => {
          const s = kset(c);
          if (s.m < m) {
            s.m = m;
            s.d = Date.now() + INTERVAL[m];
            n++;
          }
        });
      });
      lift(legacy.yomi, 1);
      lift(legacy.kaki, 2);
      save();
      if (n) setTimeout(() => toast(`前の バージョンの きろくを 引きついだよ（${n}字に ★）`, 3500), 800);
    }

    function onExternalChange() {
      updateHud();
      if (CUR.name !== 'play') render();
    }

    function boot() {
      applySettings();
      migrateLegacy();
      history.replaceState({
        kq: 0
      }, '');
      const fromLink = readHash();
      render();
      if (fromLink) go('grade', {
        g: 'my'
      });
      window.addEventListener('hashchange', () => {
        if (readHash()) go('grade', {
          g: 'my'
        });
      });
    }
    boot();
  </script>
</body>

<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>漢字高学年</title>
    <meta name="viewport" content="width=device-width"><link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">


  </head>
    
  <body>
  <!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>漢字クエスト 5・6年｜むん先生の学習クエスト</title>
  <meta name="description" content="小学5・6年の漢字を、書き順チェック・クイズ・書き取り・熟語づくりで、自分のレベルに合わせて学べる無料の漢字学習アプリ。">
  <meta name="theme-color" content="#0B1026">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=M+PLUS+1:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0B1026;
      /* 墨夜：背景 */
      --ink2: #10173A;
      --panel: #141C42;
      /* 盤 */
      --panel2: #1A2352;
      --line: rgba(62, 240, 224, .22);
      --cyan: #3EF0E0;
      /* 電光シアン */
      --cyan-d: #1BB8AA;
      --shu: #FF5A3C;
      /* 朱：はなまる・はんこ */
      --gold: #FFD23F;
      /* マスター */
      --lime: #7CFF6B;
      /* せいかい */
      --violet: #A98BFF;
      --text: #E8ECFF;
      --muted: #8E97C9;
      --dim: #5B6499;
      --r-panel: 16px;
      --r-btn: 12px;
      --f-ui: "M PLUS 1", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
      --f-kanji: "UD Digi Kyokasho N-R", "UD デジタル 教科書体 N-R", "Klee One", "YuKyokasho", "Hiragino Mincho ProN", serif;
      --f-logo: "Orbitron", "M PLUS 1", sans-serif;
      --fs: 17px;
    }

    html.big {
      --fs: 20px
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      padding: 0
    }

    body {
      font-family: var(--f-ui);
      font-size: var(--fs);
      line-height: 1.6;
      color: var(--text);
      background-color: var(--ink);
      background-image:
        radial-gradient(1200px 600px at 85% -10%, rgba(169, 139, 255, .16), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, rgba(62, 240, 224, .10), transparent 60%),
        linear-gradient(rgba(62, 240, 224, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(62, 240, 224, .045) 1px, transparent 1px);
      background-size: auto, auto, 48px 48px, 48px 48px;
      background-attachment: fixed;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
      cursor: pointer
    }

    input,
    textarea,
    select {
      font-family: inherit;
      font-size: 1rem;
      color: var(--text)
    }

    :focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px
    }

    .kj {
      font-family: var(--f-kanji)
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 16px 48px
    }

    .hide {
      display: none !important
    }

    .muted {
      color: var(--muted)
    }

    .small {
      font-size: .85em
    }

    .center {
      text-align: center
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap
    }

    .spacer {
      flex: 1
    }

    /* ---------- header ---------- */
    .top {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(11, 16, 38, .88);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line)
    }

    .top .wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 10px;
      padding-bottom: 10px
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: 0;
      padding: 4px 6px;
      border-radius: 10px;
      text-align: left
    }

    .logo-mark {
      width: 38px;
      height: 38px;
      border: 2px solid var(--cyan);
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-family: var(--f-kanji);
      font-size: 24px;
      color: var(--cyan);
      position: relative;
      box-shadow: 0 0 14px rgba(62, 240, 224, .35)
    }

    .logo-mark::before,
    .logo-mark::after {
      content: "";
      position: absolute;
      background: rgba(62, 240, 224, .25)
    }

    .logo-mark::before {
      left: 50%;
      top: 3px;
      bottom: 3px;
      width: 1px
    }

    .logo-mark::after {
      top: 50%;
      left: 3px;
      right: 3px;
      height: 1px
    }

    .logo-txt b {
      display: block;
      font-family: var(--f-logo);
      font-size: 15px;
      letter-spacing: .08em;
      color: #fff
    }

    .logo-txt>span {
      display: block;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.2
    }

    .logo-g {
      display: inline-block;
      margin-left: 6px;
      font-family: var(--f-ui);
      font-size: 12px;
      font-weight: 900;
      color: #06222a;
      background: var(--cyan);
      border-radius: 6px;
      padding: 0 6px;
      letter-spacing: 0;
      vertical-align: 2px
    }

    .hud {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto
    }

    .hud-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 12px 4px 6px;
      font-weight: 700;
      white-space: nowrap
    }

    .hud-pill .pet {
      font-size: 24px;
      line-height: 1
    }

    .hud-pill .cr {
      font-family: var(--f-logo);
      font-size: 14px;
      color: var(--gold)
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      display: grid;
      place-items: center;
      font-size: 20px
    }

    .icon-btn:hover {
      border-color: var(--cyan)
    }

    /* ---------- common parts ---------- */
    .panel {
      background: linear-gradient(180deg, var(--panel), var(--ink2));
      border: 1px solid var(--line);
      border-radius: var(--r-panel);
      padding: 18px
    }

    h1,
    h2,
    h3 {
      margin: 0;
      line-height: 1.35
    }

    h1 {
      font-size: 1.6em;
      font-weight: 900
    }

    h2 {
      font-size: 1.25em;
      font-weight: 900
    }

    h3 {
      font-size: 1.05em;
      font-weight: 700
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 10px 20px;
      border-radius: var(--r-btn);
      border: 1px solid var(--cyan);
      background: var(--cyan);
      color: #06222a;
      font-weight: 900;
      text-decoration: none;
      transition: transform .08s, box-shadow .15s
    }

    .btn:hover {
      box-shadow: 0 0 18px rgba(62, 240, 224, .45)
    }

    .btn:active {
      transform: translateY(1px)
    }

    .btn.ghost {
      background: transparent;
      color: var(--cyan)
    }

    .btn.shu {
      background: var(--shu);
      border-color: var(--shu);
      color: #fff
    }

    .btn.gold {
      background: var(--gold);
      border-color: var(--gold);
      color: #2a2000
    }

    .btn.dark {
      background: var(--panel2);
      border-color: var(--line);
      color: var(--text)
    }

    .btn.sm {
      min-height: 38px;
      padding: 6px 14px;
      font-size: .9em
    }

    .btn.wide {
      width: 100%
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed;
      box-shadow: none
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel2);
      font-weight: 700
    }

    .chip[aria-pressed="true"] {
      background: rgba(62, 240, 224, .16);
      border-color: var(--cyan);
      color: var(--cyan)
    }

    .back {
      background: none;
      border: 0;
      color: var(--muted);
      font-weight: 700;
      padding: 8px 4px;
      display: inline-flex;
      gap: 6px;
      align-items: center
    }

    .back:hover {
      color: var(--cyan)
    }

    .tag {
      display: inline-block;
      font-size: .75em;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 999px;
      border: 1px solid currentColor
    }

    .stars {
      color: var(--gold);
      letter-spacing: 1px;
      white-space: nowrap
    }

    .stars i {
      font-style: normal;
      color: var(--dim)
    }

    .bar {
      height: 10px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .08);
      overflow: hidden;
      display: flex
    }

    .bar>span {
      display: block;
      height: 100%
    }

    /* 田の字ガイド */
    .tagrid {
      position: relative;
      background: #0A0F2A;
      border: 2px solid rgba(62, 240, 224, .55);
      border-radius: 10px
    }

    .tagrid::before,
    .tagrid::after {
      content: "";
      position: absolute;
      pointer-events: none
    }

    .tagrid::before {
      left: 50%;
      top: 0;
      bottom: 0;
      border-left: 2px dashed rgba(62, 240, 224, .18)
    }

    .tagrid::after {
      top: 50%;
      left: 0;
      right: 0;
      border-top: 2px dashed rgba(62, 240, 224, .18)
    }

    /* ---------- home ---------- */
    .hero {
      display: grid;
      grid-template-columns: minmax(220px, 300px) 1fr;
      gap: 22px;
      align-items: center;
      margin: 22px 0
    }

    .hero-kanji {
      display: block;
      aspect-ratio: 1;
      width: 100%;
      cursor: pointer;
      padding: 0
    }

    .hero-kanji svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%
    }

    .hero-cap {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: .9em;
      color: var(--muted)
    }

    .hero h1 {
      font-size: clamp(1.5em, 3.4vw, 2.2em)
    }

    .hero .lead {
      color: var(--muted);
      margin: 6px 0 16px
    }

    .streak {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px
    }

    .streak .s {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 14px;
      font-weight: 700
    }

    .streak .s b {
      font-size: 1.3em;
      color: var(--gold);
      margin-right: 2px
    }

    .mission {
      display: flex;
      align-items: center;
      gap: 14px;
      border-left: 4px solid var(--shu);
      background: rgba(255, 90, 60, .08);
      border-radius: 12px;
      padding: 12px 14px
    }

    .mission .ic {
      font-size: 30px
    }

    .mission p {
      margin: 0;
      font-weight: 700
    }

    .mission .muted {
      font-weight: 400;
      font-size: .85em
    }

    .sec-h {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 30px 0 12px
    }

    .sec-h .muted {
      font-size: .9em
    }

    .grades {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px
    }

    .grades.g2 {
      grid-template-columns: repeat(2, 1fr)
    }

    .grades.g2 .gtile {
      padding: 18px 20px 16px
    }

    .grades.g2 .gtile .num {
      font-size: 60px
    }

    .applinks {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px
    }

    a.qbtn {
      text-decoration: none
    }

    .gtile {
      color: var(--text);
      position: relative;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r-panel);
      padding: 14px 14px 12px;
      transition: border-color .15s, transform .1s
    }

    .gtile:hover {
      border-color: var(--cyan);
      transform: translateY(-2px)
    }

    .gtile .num {
      font-family: var(--f-logo);
      font-size: 44px;
      font-weight: 900;
      line-height: 1;
      color: #fff
    }

    .gtile .num small {
      font-family: var(--f-ui);
      font-size: 16px;
      margin-left: 2px;
      color: var(--muted)
    }

    .gtile .cnt {
      color: var(--muted);
      font-size: .85em;
      margin: 4px 0 8px
    }

    .gtile .ng {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: .75em;
      font-weight: 900;
      color: var(--shu)
    }

    .gtile[data-g="1"] .num {
      color: #7CE7FF
    }

    .gtile[data-g="2"] .num {
      color: #7CFFB2
    }

    .gtile[data-g="3"] .num {
      color: #FFE27C
    }

    .gtile[data-g="4"] .num {
      color: #FFA37C
    }

    .gtile[data-g="5"] .num {
      color: #FF8AD8
    }

    .gtile[data-g="6"] .num {
      color: #B49CFF
    }

    .quick {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 12px
    }

    .qbtn {
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r-panel);
      padding: 14px
    }

    .qbtn:hover {
      border-color: var(--cyan)
    }

    .qbtn .ic {
      font-size: 28px
    }

    .qbtn b {
      display: block
    }

    .qbtn span {
      display: block;
      font-size: .8em;
      color: var(--muted);
      line-height: 1.35
    }

    .foot {
      margin-top: 40px;
      font-size: .78em;
      color: var(--dim);
      line-height: 1.7
    }

    .foot a {
      color: var(--muted)
    }

    /* ---------- grade hub ---------- */
    .hubhead {
      display: flex;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
      margin: 10px 0 16px
    }

    .hubhead h1 small {
      font-size: .55em;
      color: var(--muted);
      font-weight: 700;
      margin-left: 8px
    }

    .mastery-sum {
      min-width: 260px;
      flex: 1
    }

    .mastery-sum .legend {
      display: flex;
      gap: 14px;
      font-size: .8em;
      color: var(--muted);
      margin-top: 6px;
      flex-wrap: wrap
    }

    .legend i {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: 4px;
      vertical-align: middle
    }

    .hubgrid {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 18px;
      align-items: start
    }

    .path {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    .path::before {
      content: "";
      position: absolute;
      left: 27px;
      top: 30px;
      bottom: 30px;
      width: 3px;
      background: linear-gradient(var(--cyan), var(--violet), var(--shu));
      opacity: .5;
      border-radius: 3px
    }

    .step {
      position: relative;
      display: grid;
      grid-template-columns: 58px 1fr;
      gap: 12px;
      align-items: start
    }

    .step .lv {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--ink);
      border: 3px solid var(--cyan);
      font-family: var(--f-logo);
      font-weight: 900;
      font-size: 13px;
      line-height: 1.1;
      text-align: center;
      z-index: 1
    }

    .step .lv b {
      display: block;
      font-size: 20px
    }

    .step[data-lv="2"] .lv {
      border-color: #6FD3FF
    }

    .step[data-lv="3"] .lv {
      border-color: var(--violet)
    }

    .step[data-lv="4"] .lv {
      border-color: #FF8AD8
    }

    .step[data-lv="5"] .lv {
      border-color: var(--shu)
    }

    .step .body {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r-panel);
      padding: 12px 14px
    }

    .step .body h3 {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap
    }

    .step .who {
      font-size: .82em;
      color: var(--muted);
      margin: 2px 0 10px
    }

    .modes {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px
    }

    .mode {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      color: var(--text);
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      min-height: 60px
    }

    .mode:hover {
      border-color: var(--cyan);
      background: rgba(62, 240, 224, .08)
    }

    .mode .ic {
      font-size: 26px
    }

    .mode b {
      display: block;
      line-height: 1.3;
      color: #fff
    }

    .mode span {
      display: block;
      font-size: .75em;
      color: var(--muted);
      line-height: 1.3
    }

    .reco {
      color: var(--gold);
      border-color: var(--gold)
    }

    .side {
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    .side .panel h3 {
      margin-bottom: 8px
    }

    /* ---------- modal ---------- */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 20, .72);
      z-index: 60;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 12px
    }

    @media(min-width:700px) {
      .modal-bg {
        align-items: center
      }
    }

    .modal {
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--cyan);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 0 40px rgba(62, 240, 224, .25)
    }

    .modal h2 {
      margin-bottom: 4px
    }

    .field {
      margin: 16px 0
    }

    .field>label,
    .field>.lab {
      display: block;
      font-weight: 900;
      margin-bottom: 6px
    }

    .field .hint {
      font-size: .8em;
      color: var(--muted);
      margin-top: 4px
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    select.sel,
    input.inp,
    textarea.inp {
      width: 100%;
      background: var(--ink);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px
    }

    textarea.inp {
      min-height: 80px;
      resize: vertical
    }

    /* ---------- zukan ---------- */
    .ztools {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin: 8px 0 14px
    }

    .ztools .inp {
      max-width: 260px
    }

    .zgrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
      gap: 8px
    }

    .ztile {
      position: relative;
      aspect-ratio: 1;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      font-family: var(--f-kanji);
      font-size: 34px;
      display: grid;
      place-items: center;
      padding: 0
    }

    .ztile:hover {
      border-color: var(--cyan)
    }

    .ztile .mk {
      position: absolute;
      bottom: 3px;
      left: 0;
      right: 0;
      font-family: var(--f-ui);
      font-size: 9px;
      color: var(--gold);
      letter-spacing: 0
    }

    .ztile.m0 {
      color: #C9CFF0
    }

    .ztile.m1,
    .ztile.m2 {
      border-color: rgba(111, 211, 255, .6);
      color: #bfeaff
    }

    .ztile.m3,
    .ztile.m4 {
      border-color: rgba(124, 255, 107, .6);
      color: #d7ffd0;
      background: rgba(124, 255, 107, .06)
    }

    .ztile.m5 {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(255, 210, 63, .08)
    }

    .ztile.ng::after {
      content: "";
      position: absolute;
      top: 5px;
      right: 5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--shu)
    }

    .ztile.sel {
      outline: 3px solid var(--cyan);
      background: rgba(62, 240, 224, .18)
    }

    .selbar {
      position: sticky;
      bottom: 10px;
      margin-top: 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      background: var(--panel2);
      border: 1px solid var(--cyan);
      border-radius: 14px;
      padding: 10px 14px
    }

    /* ---------- detail ---------- */
    .detail {
      display: grid;
      grid-template-columns: minmax(260px, 360px) 1fr;
      gap: 22px;
      align-items: start;
      margin-top: 8px
    }

    .kvbox {
      aspect-ratio: 1;
      width: 100%
    }

    .kvbox svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%
    }

    .kvctl {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px
    }

    .big-k {
      font-family: var(--f-kanji);
      font-size: 64px;
      line-height: 1
    }

    .rd {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 14px;
      margin: 12px 0
    }

    .rd dt {
      font-weight: 900;
      color: var(--muted)
    }

    .rd dd {
      margin: 0
    }

    .yomi-chip {
      display: inline-block;
      margin: 0 6px 4px 0;
      padding: 2px 10px;
      border-radius: 8px;
      background: var(--panel2);
      border: 1px solid var(--line)
    }

    .yomi-chip.on {
      color: #9FE8FF
    }

    .okuri {
      color: var(--dim)
    }

    .exlist {
      list-style: none;
      margin: 6px 0 0;
      padding: 0
    }

    .exlist li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px dashed var(--line)
    }

    .exlist .sent {
      flex: 1
    }

    .exlist .sent ruby {
      ruby-position: over
    }

    .exlist rt {
      font-size: .6em;
      color: var(--cyan)
    }

    .hl {
      color: var(--cyan);
      font-weight: 900
    }

    .speak {
      background: none;
      border: 1px solid var(--line);
      border-radius: 10px;
      width: 40px;
      height: 40px;
      flex: none
    }

    .parts-eq {
      font-family: var(--f-kanji);
      font-size: 1.4em
    }

    /* ---------- play ---------- */
    .playtop {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0
    }

    .dots {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      flex: 1;
      justify-content: center
    }

    .dots i {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .12);
      display: block
    }

    .dots i.ok {
      background: var(--lime)
    }

    .dots i.half {
      background: var(--gold)
    }

    .dots i.ng {
      background: var(--shu)
    }

    .dots i.cur {
      outline: 2px solid var(--cyan);
      outline-offset: 1px
    }

    .goalchip {
      font-size: .8em;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 999px;
      padding: 2px 10px
    }

    .combo {
      font-family: var(--f-logo);
      font-weight: 900;
      color: var(--lime);
      min-width: 70px;
      text-align: right
    }

    .stage {
      background: linear-gradient(180deg, var(--panel), var(--ink2));
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px 16px;
      text-align: center;
      position: relative;
      min-height: 380px
    }

    .qhead {
      font-size: .9em;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 6px
    }

    .sentence {
      font-size: clamp(1.4em, 4.2vw, 2.1em);
      font-weight: 700;
      line-height: 2.1;
      margin: 8px 0 14px;
      word-break: keep-all;
      overflow-wrap: anywhere
    }

    .sentence .tg {
      color: var(--cyan);
      border-bottom: 4px solid var(--cyan);
      padding: 0 4px;
      font-family: var(--f-kanji)
    }

    .sentence .blank {
      display: inline-block;
      border: 2px dashed var(--cyan);
      border-radius: 10px;
      background: rgba(62, 240, 224, .08);
      padding: 0 8px;
      line-height: 1.35;
      color: var(--cyan);
      letter-spacing: .1em
    }

    .sentence ruby rt {
      font-size: .45em;
      color: var(--gold);
      font-weight: 700
    }

    .meaning {
      display: inline-block;
      font-size: .9em;
      color: #BFC7F5;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px 12px;
      margin-bottom: 8px
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 620px;
      margin: 14px auto 0
    }

    .choice {
      min-height: 72px;
      border-radius: 14px;
      border: 2px solid var(--line);
      background: var(--panel2);
      font-size: 1.5em;
      font-weight: 900;
      padding: 8px
    }

    .choice.kj {
      font-size: 2em;
      font-weight: 600
    }

    .choice:hover:not(:disabled) {
      border-color: var(--cyan)
    }

    .choice.ok {
      border-color: var(--lime);
      background: rgba(124, 255, 107, .14);
      color: var(--lime)
    }

    .choice.ng {
      border-color: var(--shu);
      background: rgba(255, 90, 60, .14);
      color: var(--shu)
    }

    .choice:disabled {
      cursor: default
    }

    .tools {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px
    }

    .tool {
      min-height: 44px;
      padding: 6px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel2);
      font-weight: 700
    }

    .tool:hover:not(:disabled) {
      border-color: var(--cyan)
    }

    .tool[aria-pressed="true"] {
      border-color: var(--gold);
      color: var(--gold)
    }

    .tool:disabled {
      opacity: .4
    }

    .conf {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 560px;
      margin: 16px auto 0
    }

    .conf button {
      min-height: 64px;
      border-radius: 14px;
      border: 2px solid var(--line);
      background: var(--panel2);
      font-weight: 900;
      line-height: 1.25
    }

    .conf button span {
      display: block;
      font-size: 1.5em
    }

    .conf button:hover {
      border-color: var(--cyan)
    }

    .judge {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 560px;
      margin: 14px auto 0
    }

    .judge button {
      min-height: 68px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 1.05em;
      border: 2px solid
    }

    .judge .j-ok {
      border-color: var(--lime);
      background: rgba(124, 255, 107, .12);
      color: var(--lime)
    }

    .judge .j-half {
      border-color: var(--gold);
      background: rgba(255, 210, 63, .10);
      color: var(--gold)
    }

    .judge .j-ng {
      border-color: var(--shu);
      background: rgba(255, 90, 60, .10);
      color: var(--shu)
    }

    .judge button b {
      display: block;
      font-size: 1.6em;
      line-height: 1
    }

    .checklist {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 12px
    }

    .feedback {
      margin-top: 14px;
      font-weight: 900;
      font-size: 1.1em;
      min-height: 1.6em
    }

    .feedback.ok {
      color: var(--lime)
    }

    .feedback.ng {
      color: var(--shu)
    }

    .feedback.half {
      color: var(--gold)
    }

    .explain {
      margin: 12px auto 0;
      max-width: 620px;
      text-align: left;
      background: rgba(255, 255, 255, .03);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: .92em
    }

    .reason {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px
    }

    .nextrow {
      margin-top: 16px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap
    }

    /* writing pad */
    .pad {
      position: relative;
      box-sizing: content-box;
      margin: 6px auto 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      background: #0A0F2A;
      border: 2px solid rgba(62, 240, 224, .55);
      border-radius: 10px;
      overflow: hidden
    }

    .pad svg.guide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none
    }

    .pad .cells {
      position: absolute;
      inset: 0;
      display: flex
    }

    .pad .cell {
      flex: 1;
      position: relative;
      border-right: 2px dashed rgba(62, 240, 224, .25)
    }

    .pad .cell:last-child {
      border-right: 0
    }

    .pad .cell::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      border-left: 1px dashed rgba(62, 240, 224, .14)
    }

    .pad .cell::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      border-top: 1px dashed rgba(62, 240, 224, .14)
    }

    .pad .cell.kana {
      background: rgba(255, 255, 255, .02)
    }

    .pad .model {
      position: absolute;
      inset: 0;
      display: flex;
      pointer-events: none
    }

    .pad .model>div {
      flex: 1;
      position: relative
    }

    .pad .model svg {
      position: absolute;
      inset: 6%;
      width: 88%;
      height: 88%
    }

    .pad .model .txt {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: var(--f-kanji);
      color: rgba(255, 255, 255, .22)
    }

    .pad canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair
    }

    .pad.frozen canvas {
      cursor: default
    }

    .pad.side-by-side {
      display: block
    }

    .compare {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
      flex-wrap: wrap
    }

    .compare .mbox {
      width: 110px;
      height: 110px;
      position: relative
    }

    .compare .mbox svg {
      position: absolute;
      inset: 6%;
      width: 88%;
      height: 88%
    }

    .compare .mbox .txt {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: var(--f-kanji);
      font-size: 80px
    }

    .scount {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 8px;
      font-size: .88em
    }

    .scount span {
      padding: 2px 10px;
      border-radius: 999px;
      border: 1px solid var(--line)
    }

    .scount .eq {
      border-color: var(--lime);
      color: var(--lime)
    }

    .scount .ne {
      border-color: var(--gold);
      color: var(--gold)
    }

    /* trace */
    .trace-wrap {
      position: relative;
      margin: 8px auto 0
    }

    .trace-wrap svg.guide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none
    }

    .trace-msg {
      min-height: 1.7em;
      font-weight: 900;
      margin-top: 10px
    }

    /* stamp */
    .stamp {
      position: absolute;
      right: 18px;
      top: 14px;
      width: 96px;
      height: 96px;
      pointer-events: none;
      opacity: 0
    }

    .stamp.show {
      animation: stamp .45s cubic-bezier(.2, 1.6, .4, 1) forwards
    }

    @keyframes stamp {
      0% {
        opacity: 0;
        transform: scale(2.2) rotate(-25deg)
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(-12deg)
      }
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: var(--panel2);
      border: 1px solid var(--cyan);
      border-radius: 14px;
      padding: 10px 18px;
      font-weight: 900;
      z-index: 80;
      box-shadow: 0 0 24px rgba(62, 240, 224, .3);
      max-width: 90vw
    }

    .float-cr {
      position: fixed;
      z-index: 85;
      font-family: var(--f-logo);
      font-weight: 900;
      color: var(--gold);
      pointer-events: none;
      animation: floatup 1s ease-out forwards;
      font-size: 20px
    }

    @keyframes floatup {
      to {
        transform: translateY(-60px);
        opacity: 0
      }
    }

    /* boss */
    .boss {
      display: flex;
      align-items: center;
      gap: 14px;
      justify-content: center;
      margin-bottom: 10px
    }

    .boss .mon {
      font-size: 56px;
      line-height: 1;
      filter: drop-shadow(0 0 12px rgba(255, 90, 60, .6))
    }

    .boss .mon.hit {
      animation: hit .35s
    }

    @keyframes hit {

      0%,
      100% {
        transform: translateX(0)
      }

      25% {
        transform: translateX(-8px)
      }

      75% {
        transform: translateX(8px)
      }
    }

    .hpbar {
      width: 220px;
      height: 14px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .1);
      overflow: hidden;
      border: 1px solid rgba(255, 90, 60, .6)
    }

    .hpbar span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--shu), #ff9a3c);
      transition: width .4s
    }

    .hearts {
      font-size: 20px;
      letter-spacing: 2px
    }

    /* jukugo */
    .jk-center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 10px 0
    }

    .jk-slot {
      width: 84px;
      height: 84px;
      border-radius: 14px;
      border: 2px dashed var(--line);
      display: grid;
      place-items: center;
      font-family: var(--f-kanji);
      font-size: 52px
    }

    .jk-slot.c {
      border: 2px solid var(--cyan);
      color: var(--cyan);
      background: rgba(62, 240, 224, .08)
    }

    .jk-tiles {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 420px;
      margin: 12px auto
    }

    .jk-tile {
      aspect-ratio: 1;
      border-radius: 14px;
      border: 2px solid var(--line);
      background: var(--panel2);
      font-family: var(--f-kanji);
      font-size: 40px
    }

    .jk-tile:hover:not(:disabled) {
      border-color: var(--cyan)
    }

    .jk-tile.used {
      opacity: .3
    }

    .jk-tile.shake {
      animation: hit .35s;
      border-color: var(--shu)
    }

    .jk-found {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px
    }

    .jk-found span {
      padding: 4px 12px;
      border-radius: 10px;
      border: 1px solid var(--lime);
      color: var(--lime);
      font-family: var(--f-kanji);
      font-size: 1.2em
    }

    .jk-found span small {
      font-family: var(--f-ui);
      font-size: .6em;
      color: var(--muted);
      margin-left: 4px
    }

    /* parts */
    .parts-q {
      font-family: var(--f-kanji);
      font-size: clamp(2.4em, 8vw, 3.6em);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 10px 0
    }

    .parts-q .pp {
      min-width: 1.3em;
      text-align: center
    }

    .parts-q .op {
      font-family: var(--f-ui);
      color: var(--muted);
      font-size: .6em
    }

    .parts-q .qm {
      color: var(--cyan);
      border-bottom: 4px solid var(--cyan);
      min-width: 1.2em
    }

    .pname {
      display: block;
      font-family: var(--f-ui);
      font-size: 12px;
      color: var(--muted);
      text-align: center
    }

    /* result */
    .result {
      max-width: 760px;
      margin: 20px auto
    }

    .result .score {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap
    }

    .result .score .big {
      font-family: var(--f-logo);
      font-size: 56px;
      font-weight: 900;
      color: #fff;
      line-height: 1
    }

    .result .score .big small {
      font-size: 24px;
      color: var(--muted)
    }

    .kchips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px
    }

    .kchips button,
    .kchips span {
      font-family: var(--f-kanji);
      font-size: 1.4em;
      min-width: 48px;
      min-height: 48px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel2);
      display: inline-grid;
      place-items: center
    }

    .kchips .up {
      border-color: var(--gold);
      color: var(--gold)
    }

    .kchips .down {
      border-color: var(--shu);
      color: var(--shu)
    }

    .suggest {
      border: 1px solid var(--violet);
      background: rgba(169, 139, 255, .08);
      border-radius: 14px;
      padding: 12px 14px;
      margin-top: 14px
    }

    /* records */
    .cal {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      max-width: 330px
    }

    .cal i {
      aspect-ratio: 1;
      border-radius: 5px;
      background: rgba(255, 255, 255, .06);
      display: block;
      font-style: normal;
      font-size: 10px;
      color: var(--dim);
      text-align: right;
      padding: 2px 3px
    }

    .cal i.l1 {
      background: rgba(62, 240, 224, .25)
    }

    .cal i.l2 {
      background: rgba(62, 240, 224, .5)
    }

    .cal i.l3 {
      background: var(--cyan);
      color: #06222a
    }

    .cal i.today {
      outline: 2px solid var(--gold)
    }

    .statgrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px
    }

    .stat {
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px
    }

    .stat b {
      display: block;
      font-size: 1.6em;
      font-family: var(--f-logo);
      color: #fff
    }

    .stat span {
      font-size: .8em;
      color: var(--muted)
    }

    .badges {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px
    }

    .badge {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      background: var(--panel2)
    }

    .badge .bi {
      font-size: 30px
    }

    .badge b {
      display: block;
      font-size: .88em
    }

    .badge span {
      display: block;
      font-size: .72em;
      color: var(--muted);
      line-height: 1.35
    }

    .badge.off {
      opacity: .38;
      filter: grayscale(1)
    }

    .rlist {
      list-style: none;
      padding: 0;
      margin: 0
    }

    .rlist li {
      padding: 8px 0;
      border-bottom: 1px dashed var(--line);
      font-size: .92em
    }

    .cols2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px
    }

    .mbars .r {
      display: grid;
      grid-template-columns: 44px 1fr 70px;
      gap: 10px;
      align-items: center;
      margin: 6px 0;
      font-size: .9em
    }

    /* make */
    .preview {
      background: var(--ink);
      border: 1px dashed var(--cyan);
      border-radius: 12px;
      padding: 12px;
      text-align: center
    }

    .myqlist {
      list-style: none;
      padding: 0;
      margin: 0
    }

    .myqlist li {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dashed var(--line)
    }

    .myqlist li .s {
      flex: 1
    }

    code.share {
      display: block;
      word-break: break-all;
      background: var(--ink);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      font-size: .75em;
      max-height: 120px;
      overflow: auto
    }

    /* evolution */
    .evo {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(3, 6, 20, .86);
      display: grid;
      place-items: center;
      text-align: center
    }

    .evo .p {
      font-size: 120px;
      animation: evo 1.2s ease-out
    }

    @keyframes evo {
      0% {
        transform: scale(.2) rotate(-200deg);
        filter: brightness(4)
      }

      60% {
        transform: scale(1.2)
      }

      100% {
        transform: scale(1)
      }
    }

    /* print */
    #print-area {
      display: none
    }

      return chars.map(c => {
          const s = kget(c);
          return {
            c,
            w: (s.ng ? 6 : 0) + (5 - s.m) * 1.4 + (isDue(c) ? 3 : 0) + Math.random() * 4
          };
        })
        .sort((a, b) => b.w - a.w).map(x => x.c);
    }
    /** その字の問題を1つ（毎回ちがう例文が出るように 順番に） */
    function itemFor(ch, pool) {
      const list = KDB[ch].items.slice();
      if (pool && typeof pool.g === 'number' && pool.g <= 3 && ORIG_BY_K[ch]) list.push(...ORIG_BY_K[ch].filter(q => q.g === pool.g));
      const s = kset(ch);
      const it = list[s.ix % list.length];
      s.ix = (s.ix + 1) % 997;
      return it;
    }

    function questionsFor(pool, setup) {
      const n = setup.count || 10;
      if (setup.range && setup.range.type === 'unit') {
        const qs = ORIG.filter(q => q.g === pool.g && q.unit === setup.range.unit);
        return (setup.order === 'seq' ? qs : shuffle(qs)).slice(0, n);
      }
      const cs = priority(charsIn(pool, setup.range)).slice(0, n);
      return shuffle(cs).map(c => itemFor(c, pool));
    }
    /* ---------------- 読みの分け方（熟語 → 1字ずつ） ---------------- */
    function segment(target, yomi) {
      const chars = [...target];
      const res = [];
      const rec = (ci, pos) => {
        if (ci === chars.length) return pos === yomi.length;
        const c = chars[ci];
        if (!isKanji(c)) {
          if (yomi.startsWith(c, pos)) {
            res.push(c);
            if (rec(ci + 1, pos + 1)) return true;
            res.pop();
          }
          return false;
        }
        if (!KDB[c]) return false;
        const cands = new Set();
        baseReadings(c).forEach(r => soundVariants(r).forEach(v => cands.add(v)));
        for (const v of [...cands].sort((a, b) => b.length - a.length)) {
          if (v && yomi.startsWith(v, pos)) {
            res.push(v);
            if (rec(ci + 1, pos + v.length)) return true;
            res.pop();
          }
        }
        return false;
      };
      return rec(0, 0) ? res.slice() : null;
    }
    /** よくある 読みまちがい（にごる・小さい っ・のばす音） */
    function tweaks(y) {
      const out = new Set();
      for (let i = 0; i < y.length; i++) {
        const c = y[i];
        if (VOICE[c] && i > 0) out.add(y.slice(0, i) + VOICE[c] + y.slice(i + 1));
        if (UNVOICE[c]) out.add(y.slice(0, i) + UNVOICE[c] + y.slice(i + 1));
      }
      if (y.includes('っ')) {
        out.add(y.replace('っ', 'つ'));
        out.add(y.replace('っ', ''));
      } else
        for (let i = 0; i < y.length - 1; i++)
          if ('くきつち'.includes(y[i])) out.add(y.slice(0, i) + 'っ' + y.slice(i + 1));
      const lv = /([おこそとのほもよろごぞどぼぽょゅ])う/;
      if (lv.test(y)) out.add(y.replace(lv, '$1'));
      else {
        const m = y.search(/[こそとほもよろょゅ]/);
        if (m >= 0 && m < y.length) out.add(y.slice(0, m + 1) + 'う' + y.slice(m + 1));
      }
      if (/[ゃゅょ]/.test(y)) out.add(y.replace(/[ゃゅょ]/, c => ({
        ゃ: 'や',
        ゅ: 'ゆ',
        ょ: 'よ'
      } [c])));
      out.delete(y);
      return [...out].filter(okKana);
    }
    /** ありえない かなの ならび（「っ」で始まる など）を のぞく */
    function okKana(v) {
      if (/^[っゃゅょー]/.test(v) || /っ$/.test(v)) return false;
      for (let i = 0; i < v.length - 1; i++)
        if (v[i] === 'っ' && !'かきくけこさしすせそたちつてとぱぴぷぺぽがぎぐげござじずぜぞだぢづでどばびぶべぼ'.includes(v[i + 1])) return false;
      return true;
    }

    function uniqPush(arr, v, bad) {
      if (v && !arr.includes(v) && !bad(v)) arr.push(v);
    }
    /** 読みクイズの選択肢 */
    function makeYomiChoices(q, diff) {
      const n = diff === 'easy' ? 3 : 4;
      const bad = v => v === q.yomi || WORDSET.has(q.target + '|' + v) || !/^[ぁ-ゖー]+$/.test(v) || !okKana(v);
      const near = [],
        tw = tweaks(q.yomi),
        far = [];
      const cs = [...q.target];
      if (cs.length === 1 && KDB[q.target]) baseReadings(q.target).forEach(r => uniqPush(near, r, bad));
      const seg = segment(q.target, q.yomi);
      if (seg) cs.forEach((c, i) => {
        if (!KDB[c]) return;
        baseReadings(c).forEach(r => {
          if (r !== seg[i]) {
            const alt = seg.slice();
            alt[i] = r;
            uniqPush(near, alt.join(''), bad);
          }
        });
      });
      const L = q.yomi.length;
      shuffle(ITEMS).slice(0, 300).forEach(it => {
        if (Math.abs(it.yomi.length - L) <= 1) uniqPush(far, it.yomi, bad);
      });
      const opts = [];
      const take = (src, k) => {
        for (const v of shuffle(src)) {
          if (opts.length >= n - 1 || k <= 0) break;
          if (!opts.includes(v)) {
            opts.push(v);
            k--;
          }
        }
      };
      if (diff === 'hard') {
        take(near, 2);
        take(tw, 3);
        take(near, 3);
        take(far, 3);
      } else if (diff === 'normal') {
        take(near, 2);
        take(tw, 1);
        take(far, 3);
        take(near, 3);
        take(tw, 3);
      } else {
        take(far, 1);
        take(near, 1);
        take(far, 3);
        take(tw, 3);
      }
      return shuffle([q.yomi, ...opts.slice(0, n - 1)]);
    }
    /** 漢字クイズの選択肢（同じ読み・にた形の字を 入れかえる） */
    function makeKanjiChoices(q, diff, maxG) {
      const t = [...q.target];
      let pos = q.k ? t.indexOf(q.k) : -1;
      if (pos < 0) pos = t.findIndex(c => KDB[c]);
      if (pos < 0) return null;
      const focus = t[pos];
      const g = Math.max(maxG || 1, KDB[focus].g);
      const ok = c => c !== focus && KDB[c] && KDB[c].g <= g;
      const seg = segment(q.target, q.yomi);
      const segR = seg ? seg[pos] : null;
      const homo = [],
        look = [],
        rand = [];
      if (segR && READVAR.has(segR)) READVAR.get(segR).forEach(c => ok(c) && homo.push(c));
      KDB[focus].on.forEach(o => {
        const r = kata2hira(o);
        (READVAR.get(r) || []).forEach(c => ok(c) && !homo.includes(c) && homo.push(c));
      });
      const myParts = PARTS_OF[focus] || [];
      PARTS.forEach(e => {
        if (ok(e.k) && (e.parts.some(p => myParts.includes(p)) || e.parts.includes(focus))) look.push(e.k);
      });
      if (PARTS_OF[focus]) PARTS_OF[focus].forEach(p => ok(p) && look.push(p));
      const sc = KDB[focus].sc;
      (GK[KDB[focus].g] || APPK).forEach(c => {
        if (ok(c) && Math.abs(KDB[c].sc - sc) <= 2) rand.push(c);
      });
      const n = diff === 'easy' ? 3 : 4;
      const opts = [];
      const ans = q.target;
      const add = c => {
        const s = t.slice();
        s[pos] = c;
        const w = s.join('');
        if (w !== ans && !opts.includes(w) && !WORDSET.has(w + '|' + q.yomi)) {
          opts.push(w);
          return true;
        }
        return false;
      };
      const take = (src, k) => {
        for (const c of shuffle(src)) {
          if (opts.length >= n - 1 || k <= 0) break;
          if (add(c)) k--;
        }
      };
      if (diff === 'hard') {
        take(homo, 2);
        take(look, 2);
        take(homo, 3);
        take(look, 3);
        take(rand, 3);
      } else if (diff === 'normal') {
        take(homo, 2);
        take(look, 1);
        take(rand, 3);
        take(homo, 3);
      } else {
        take(rand, 1);
        take(look, 1);
        take(rand, 3);
        take(homo, 3);
      }
      if (opts.length < n - 1) take(Object.keys(KDB).filter(ok), 9);
      return {
        pos,
        focus,
        options: shuffle([ans, ...opts.slice(0, n - 1)])
      };
    }
    /* ---------------- 漢字たし算 ---------------- */
    function partsPool(pool, chars) {
      const set = new Set(chars || pool.chars);
      let list = PARTS.filter(e => set.has(e.k));
      if (list.length < 6 && typeof pool.grade === 'number') list = PARTS.filter(e => KDB[e.k].g <= pool.grade);
      return list;
    }

    function makePartsQ(e, diff, maxG) {
      const reverse = diff === 'hard' ? Math.random() < .6 : diff === 'normal' ? Math.random() < .3 : false;
      const n = diff === 'easy' ? 3 : 4;
      if (!reverse) {
        const share = PARTS.filter(x => x.k !== e.k && KDB[x.k].g <= Math.max(maxG, KDB[e.k].g) && x.parts.some(p => e.parts.includes(p))).map(x => x.k);
        const others = PARTS.filter(x => x.k !== e.k && KDB[x.k].g <= Math.max(maxG, KDB[e.k].g)).map(x => x.k);
        const opts = [];
        for (const c of shuffle(diff === 'easy' ? others : share)) {
          if (opts.length >= n - 1) break;
          if (!opts.includes(c)) opts.push(c);
        }
        for (const c of shuffle(others)) {
          if (opts.length >= n - 1) break;
          if (!opts.includes(c)) opts.push(c);
        }
        return {
          e,
          reverse: false,
          answer: e.k,
          options: shuffle([e.k, ...opts])
        };
      }
      const hi = Math.random() * e.parts.length | 0;
      const ans = e.parts[hi];
      const opts = [];
      for (const p of shuffle(ALLPARTS)) {
        if (opts.length >= n - 1) break;
        if (p !== ans && !opts.includes(p)) opts.push(p);
      }
      return {
        e,
        reverse: true,
        hi,
        answer: ans,
        options: shuffle([ans, ...opts])
      };
    }
    /* ---------------- 熟語メーカー ---------------- */
    function wordsWith(c, maxG) {
      return W2.filter(w => w.w.includes(c) && w.g <= maxG);
    }

    function makeJukugoRound(c, maxG, diff) {
      const words = shuffle(wordsWith(c, maxG)).slice(0, diff === 'hard' ? 6 : 5);
      const partners = [...new Set(words.map(w => w.w[0] === c ? w.w[1] : w.w[0]))];
      const tiles = partners.slice();
      const pool = Object.keys(KDB).filter(x => KDB[x].g <= maxG && x !== c && !W2SET.has(x + c) && !W2SET.has(c + x));
      for (const x of shuffle(pool)) {
        if (tiles.length >= 8) break;
        if (!tiles.includes(x)) tiles.push(x);
      }
      return {
        c,
        words,
        tiles: shuffle(tiles),
        found: []
      };
    }

          ${g === 'my' ? `<div class="panel"><h3>🔗 このセットを 配る</h3><p class="small muted">リンクを ひらくと、同じセットで 練習できます。</p><button class="btn wide ghost" data-act="copyset">リンクを コピー</button></div>` : `<div class="panel"><h3>🎯 字を えらんで 練習</h3><p class="small muted">ずかんで 好きな字を えらぶと、マイセットに なるよ。</p><button class="btn wide ghost" data-act="zukansel" data-g="${g}">字を えらぶ</button></div>`}

    ACT.zukansel = t => go('zukan', {

    /* ---------------- 学び方の せってい ---------------- */
    const DIFF_DESC = {

      },

        easy: '3つから えらぶ・ヒントあり',

      },
      parts: {
        easy: 'パーツから 漢字を えらぶ',

      },
      write: {

      },
      jukugo: {

        hard: '読みの ヒントなし'

    };
    const GOALS = [
      ['ていねい', '✍️ ていねいに 書く'],
      ['スピード', '⚡ テンポよく'],
      ['ヒントなし', '🧠 ヒントなしで'],
      ['理由', '🔍 まちがいの理由を 考える'],
      ['にがて', '🎯 にがてを へらす']
    ];
    let SU = null;
    ACT.mode = t => {
      const mode = t.dataset.mode;
      const gv = t.dataset.g;
      const g = gv === 'my' ? 'my' : gv === 'all' ? 'all' : +gv;

    function openSetup(mode, g) {
      const pool = poolOf(g);
      SU = Object.assign({

        range: {
          type: 'all'
        },
        count: mode === 'jukugo' ? 5 : 10,

      }, S.last[mode] || {}, {

      const groups = groupsOf(pool);

      const ngN = pool.chars.filter(isNg).length,

      const counts = mode === 'jukugo' ? [3, 5, 8] : mode === 'boss' ? [] : [5, 10, 20];

    <div class="field"><span class="lab">はんい</span><div class="chips">

      ${groups.length > 1 ? chip('su-range', 'group', 'グループ', R === 'group') : ''}
      ${units.length ? chip('su-range', 'unit', '先生の問題', R === 'unit') : ''}
      ${chip('su-range', 'ng', `にがて（${ngN}）`, R === 'ng', !ngN)}
      ${chip('su-range', 'new', `まだの字（${newN}）`, R === 'new', !newN)}
      ${chip('su-range', 'due', `ふくしゅう（${dueN}）`, R === 'due', !dueN)}
    </div>
    ${R === 'group' ? `<select class="sel" id="su-group" style="margin-top:8px">${groups.map((gr, i) => `<option value="${i}" ${SU.range.i == i ? 'selected' : ''}>${esc(gr.label)}</option>`).join('')}</select>` : ''}
    ${R === 'unit' ? `<select class="sel" id="su-unit" style="margin-top:8px">${units.map(u => `<option ${SU.range.unit === u ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select>
      ${mode !== 'trace' ? `<div class="chips" style="margin-top:8px">${chip('su-order', 'rand', 'ランダム', SU.order !== 'seq')}${chip('su-order', 'seq', 'じゅんばん', SU.order === 'seq')}</div>` : ''}` : ''}
    </div>
    ${counts.length ? `<div class="field"><span class="lab">問題の数</span><div class="chips">${counts.map(c => chip('su-count', c, c + '問', SU.count === c)).join('')}</div></div>` : ''}
    ${DIFF_DESC[mode] ? `<div class="field"><span class="lab">むずかしさ（自分で えらぼう）</span><div class="chips">
      ${chip('su-diff', 'easy', '🌱 やさしい', SU.diff === 'easy')}${chip('su-diff', 'normal', '🔥 ふつう', SU.diff === 'normal')}${chip('su-diff', 'hard', '⚡ むずかしい', SU.diff === 'hard')}
    </div><div class="hint">${DIFF_DESC[mode][SU.diff]}</div></div>` : '<p class="muted small">ヒントなしで 10問。❤️が 3つ なくなる前に ボスを たおそう！</p>'}
    <div class="field"><span class="lab">きょうの めあて</span><div class="chips">${GOALS.map(([v, l]) => chip('su-goal', v, l, SU.goal === v)).join('')}</div>
      <input class="inp" id="su-goaltxt" style="margin-top:8px" maxlength="40" placeholder="自分で めあてを 書いても いいよ" value="${GOALS.some(x => x[0] === SU.goal) ? '' : esc(SU.goal)}"></div>
    <div class="row" style="justify-content:flex-end;margin-top:6px"><button class="btn dark" data-act="su-close">やめる</button><button class="btn" data-act="su-start">スタート</button></div>`;
      const gs = $('#su-group');
      if (gs) gs.onchange = () => SU.range.i = +gs.value;
      const us = $('#su-unit');
      if (us) us.onchange = () => SU.range.unit = us.value;

          SU.goal = gt.value.trim();
          $$('[data-act="su-goal"]').forEach(b => b.setAttribute('aria-pressed', 'false'));
        }
      };
    }
    ACT['su-range'] = t => {
      const v = t.dataset.v;
      const pool = poolOf(SU.g);
      SU.range = v === 'group' ? {
        type: 'group',
        i: 0
      } : v === 'unit' ? {
        type: 'unit',
        unit: unitsOf(pool)[0]
      } : {
        type: v
      };
      drawSetup();
    };
    ACT['su-count'] = t => {
      SU.count = +t.dataset.v;
      drawSetup();
    };
    ACT['su-diff'] = t => {
      SU.diff = t.dataset.v;
      drawSetup();
    };
    ACT['su-order'] = t => {
      SU.order = t.dataset.v;
      drawSetup();
    };
    ACT['su-goal'] = t => {
      SU.goal = SU.goal === t.dataset.v ? '' : t.dataset.v;
      drawSetup();
    };
    ACT['su-close'] = () => {
      const s = $('#setup');
      if (s) s.remove();
    };
    ACT['su-start'] = () => {
      const setup = {
        range: SU.range,
        count: SU.count,
        diff: SU.diff,
        goal: SU.goal,
        order: SU.order
      };
      S.last[SU.mode] = setup;
      save();
      const mode = SU.mode,
        g = SU.g;
      ACT['su-close']();
      startMode(mode, g, setup);
    };
    /* ---------------- セッション ---------------- */
    function startMode(mode, g, setup) {
      const pool = poolOf(g);
      let items = [];
      const chars = () => priority(charsIn(pool, setup.range));
      if (mode === 'trace') items = chars().slice(0, setup.count).map(k => ({
        kind: 'trace',
        k
      }));
      else if (mode === 'qy' || mode === 'qk' || mode === 'write' || mode === 'yomi') items = questionsFor(pool, setup).map(q => ({
        kind: mode,
        q
      }));
      else if (mode === 'parts') items = shuffle(partsPool(pool, charsIn(pool, setup.range))).slice(0, setup.count).map(e => ({
        kind: 'parts',
        e
      }));
      else if (mode === 'jukugo') {
        let cs = chars().filter(c => wordsWith(c, pool.grade).length >= 2);
        if (!cs.length) cs = priority(pool.chars).filter(c => wordsWith(c, pool.grade).length >= 2);
        items = cs.slice(0, setup.count).map(c => ({
          kind: 'jukugo',
          c
        }));
      } else if (mode === 'boss') items = bossItems(pool, setup);
      if (!items.length) {
        toast('この はんいでは 問題が 作れません。はんいを かえてみよう');
        return;
      }
      startSession(mode, pool, setup, items);
    }

    function bossItems(pool, setup) {
      const cs = shuffle(charsIn(pool, setup.range));
      const pp = shuffle(partsPool(pool, cs));
      const pattern = ['qk', 'qy', 'parts', 'qk', 'write', 'qy', 'qk', 'parts', 'write', 'qy'];
      return pattern.map((kind, i) => {
        const c = cs[i % cs.length];
        if (kind === 'parts') {
          const e = pp[i % Math.max(1, pp.length)];
          if (e) return {
            kind,
            e
          };
          return {
            kind: 'qk',
            q: itemFor(c, pool)
          };
        }
        return {
          kind,
          q: itemFor(c, pool)
        };
      });
    }

    function startReview(g) {
      const pool = poolOf(g === 'all' ? 'all' : g);
      const base = pool.chars;
      const cs = priority(base.filter(c => own(c) && (isNg(c) || isDue(c)))).slice(0, 10);
      if (!cs.length) {
        toast('にがても ふくしゅうも ありません。すごい！');
        return;
      }
      const items = cs.map(c => {
        const m = kget(c).m;
        const q = itemFor(c, poolOf(KDB[c].g));
        return {
          kind: m <= 1 ? 'qk' : m === 2 ? 'qy' : 'write',
          q
        };
      });
      startSession('review', pool, {
        diff: 'normal',
        count: items.length,
        goal: 'にがて'
      }, items);
    }

    function startDiag(g) {
      const pool = poolOf(g);
      const cs = shuffle(pool.chars);
      const singles = shuffle(ITEMS.filter(q => q.g === pool.grade && [...q.target].length === 1 && kata2hira(KDB[q.k].on[0] || '') !== q.yomi)).slice(0, 3);
      const jk = shuffle(ITEMS.filter(q => (pool.g === 'my' ? pool.chars.includes(q.k) : q.g === pool.grade) && [...q.target].length >= 2));
      const pp = shuffle(partsPool(pool));
      const items = [],
        used = new Set();
      const add = (kind, x, k) => {
        if (items.length >= 10 || used.has(k)) return;
        used.add(k);
        items.push(kind === 'parts' ? {
          kind,
          e: x
        } : {
          kind,
          q: x
        });
      };
      singles.forEach(q => add('qy', q, q.k));
      jk.filter(q => !used.has(q.k)).slice(0, 4).forEach(q => add('qk', q, q.k));
      pp.forEach(e => {
        if (items.filter(i => i.kind === 'parts').length < 2) add('parts', e, e.k);
      });
      jk.forEach(q => add('qy', q, q.k));
      while (items.length < 10 && cs.length) {
        const c = cs.pop();
        add('qk', itemFor(c, pool), c);
      }
      startSession('diag', pool, {
        diff: 'normal',
        count: items.length
      }, items);
    }

    function startMyQ() {
      const qs = shuffle(S.myq).slice(0, 10);
      if (!qs.length) {
        toast('まだ 自分の問題が ありません');
        return;
      }
      startSession('myq', poolOf('all'), {
        diff: 'normal',
        count: qs.length
      }, qs.map(q => ({
        kind: 'write',
        q: Object.assign({
          src: 'my',
          k: [...q.target].find(own) || null,
          meaning: q.meaning || ''
        }, q)
      })));
    }

    function startSession(mode, pool, setup, items) {
      SES = {
        mode,
        pool,
        setup,
        items,
        i: 0,
        res: [],
        combo: 0,
        maxCombo: 0,
        xp: 0,
        ups: {},
        ngs: {},
        hearts: 3,
        hp: 100,
        start: Date.now(),
        done: false,
        lockI: -1
      };
      go('play', {}, {
        replace: CUR.name === 'result' || CUR.name === 'play'
      });
    }
    SCREENS.play = {
      html() {
        if (!SES) return '<div class="wrap"><button class="back" data-act="home">← ホーム</button></div>';
        const goal = SES.setup.goal;
        return `<div class="wrap" style="max-width:900px">
      <div class="playtop"><button class="back" data-act="quit">✕ やめる</button><div class="dots" id="dots"></div>
      ${goal ? `<span class="goalchip">めあて：${esc(goal)}</span>` : ''}<span class="combo" id="combo"></span></div>
      <div class="stage" id="stage" aria-live="polite"></div></div>`;
      },
      mount() {
        if (SES) renderItem();
      }
    };
    ACT.quit = () => quitSession();
    async function quitSession() {
      if (!SES || SES.done) return goBack();
      if (!SES.res.length || await ask('とちゅうで やめる？', 'ここまでの きろくは のこるよ。', 'やめる', 'つづける')) finishSession(true);
    }

    function drawDots() {
      const d = $('#dots');
      if (!d) return;
      d.innerHTML = SES.items.map((_, i) => `<i class="${SES.res[i] || (i === SES.i ? 'cur' : '')}"></i>`).join('');
      $('#combo').textContent = SES.combo >= 2 ? 'COMBO ×' + SES.combo : '';
    }

    function renderItem() {
      drawDots();
      PADS.forEach(p => p.destroy());
      PADS = [];
      const it = SES.items[SES.i];
      const st = $('#stage');
      st.innerHTML = '';
      st.className = 'stage';
      (R[it.kind] || R.qk)(it, st);
    }

    function bossHead() {
      if (SES.mode !== 'boss') return '';
      const mon = ['👾', '🤖', '👻', '🐲', '🦂', '🌋'][(SES.pool.grade || 1) - 1];
      return `<div class="boss"><div class="mon" id="mon">${mon}</div><div><div class="hpbar"><span style="width:${Math.max(0, SES.hp)}%"></span></div><div class="hearts" aria-label="のこり ${SES.hearts}">${'❤️'.repeat(SES.hearts)}${'🤍'.repeat(3 - SES.hearts)}</div></div></div>`;
    }
    const gradeCap = q => SES.pool.g === 'all' ? (q.g || 1) : SES.pool.grade;
    const MULT = () => SES.setup.diff === 'hard' ? 1.5 : 1;

    function capFor(kind, extra) {
      let c = CAP[kind] || 2;
      if (kind === 'trace' && SES.setup.diff === 'hard') c = CAP.traceHard;
      if (kind === 'write' && extra && extra.hints) c = 3;
      if (kind === 'write' && SES.setup.diff === 'hard' && !(extra && extra.hints)) c = 5;
      if (SES.mode === 'boss') c = kind === 'write' ? 5 : Math.max(c, 3);
      if (SES.mode === 'diag') c = 1;
      return c;
    }
    /** 1問の おわり。res: ok / half / ng */
    function finishItem(res, o = {}) {
      const it = SES.items[SES.i];
      SES.res[SES.i] = res;
      logAnswer(res === 'ok');
      if (res === 'ok') {
        SES.combo++;
        SES.maxCombo = Math.max(SES.maxCombo, SES.combo);
      } else if (res === 'ng') SES.combo = 0;
      const ks = o.kanji || [];
      ks.forEach(ch => {
        const r = recordKanji(ch, res, capFor(it.kind, o));
        if (!r) return;
        if (r.after > r.before) SES.ups[ch] = r.after;
        if (res === 'ng') SES.ngs[ch] = 1;
      });
      const q = it.q;
      if (q && q.src === 'orig' && res === 'ok') {
        const list = it.kind === 'write' ? legacy.kaki : (it.kind === 'yomi' || it.kind === 'qy') ? legacy.yomi : null;

      }
      let xp = Math.round((o.xp || 0) * MULT());

      if (SES.mode === 'boss') {
        if (res === 'ok') {

      if (res === 'ok') beep('ok');
      else if (res === 'ng') beep('ng');

      drawDots();
      save();
    }

    function nextItem() {
      if (!SES || SES.done || SES.lockI === SES.i) return;

      if (SES.mode === 'boss' && (SES.hp <= 0.5 || SES.hearts <= 0)) return finishSession();
      SES.i++;
      if (SES.i >= SES.items.length) return finishSession();
      renderItem();
    }

    function nextBtn(label = 'つぎへ') {
      return `<div class="nextrow"><button class="btn" id="nextbtn" data-act="next">${SES.i + 1 >= SES.items.length ? 'けっかを 見る' : label}</button></div>`;

    document.addEventListener('keydown', e => {

          e.preventDefault();
          nb.click();
        }

        if (c) c.click();
      }
    });
    const REASONS = [
      ['yomi', '読み方を かんちがい'],

      ['shiranai', 'まだ 知らなかった'],

    ];

    function reasonHTML() {
      return `<div class="explain" id="reasonbox"><b>どうして まちがえたと 思う？</b><span class="small muted">（えらぶと、きろくで ふりかえれるよ）</span><div class="reason">${REASONS.map(([v, l]) => `<button class="chip" data-act="reason" data-v="${v}">${l}</button>`).join('')}</div></div>`;

        b.setAttribute('aria-pressed', b === t);
      });

    function kanjiCardHTML(ch) {
      const k = KDB[ch];
      if (!k) return '';
      return `<div class="row" style="align-items:flex-start"><span class="big-k" style="font-size:52px">${ch}</span><div>
    <div>${k.on.map(o => `<span class="yomi-chip on">${esc(o)}</span>`).join('')}${k.kun.map(u => `<span class="yomi-chip">${okuriHTML(u)}</span>`).join('')}</div>
    <div class="small muted">${esc(k.mean)} ・ ${k.sc}画 ・ ${k.g}年</div></div></div>`;
    }
    /* ---------------- 問題の画面（モードごと） ---------------- */
    const R = {};
    const modeName = it => (SES.mode === 'boss' ? 'ボスバトル ・ ' : SES.mode === 'review' ? 'にがて克服 ・ ' : SES.mode === 'diag' ? 'レベル診断 ・ ' : '') + (MODES[it.kind] || {}).name;
    /* 読みクイズ・漢字クイズ */
    function quizRender(it, st, kind) {

        opts, answer;

    R.write = (it, st) => {

      if (hbtn) hbtn.onclick = () => {
        hints++;

        if (hints === 1) {
          box.innerHTML = '<div class="meaning">💡 ' + chars.map((c, i) => KDB[c] ? `${chars.length > 1 ? (i + 1) + '字目は ' : ''}${KDB[c].sc}画${PARTS_OF[c] ? '（' + PARTS_OF[c].join(' ＋ ') + '）' : ''}` : '').filter(Boolean).join(' ／ ') + '</div>';

            until: .34
          });

        } else {
          pad.showModel(chars);
          later(() => pad.showModel(chars, {
            until: .34
          }), 2200);
          box.innerHTML += '<div class="meaning">💡 ちらっと 見せたよ。よく 思い出してね</div>';
        }
        hbtn.textContent = `💡 ヒント（のこり ${maxH - hints}）`;
        if (hints >= maxH) hbtn.disabled = true;

      $$('.conf button', st).forEach(b => b.onclick = () => {
        const conf = b.dataset.c;
        if (pad.isEmpty() && conf !== 'lo') {

    function gradeWrite(st, pad, q, chars, conf, hints) {

    $ {

    } < button class = "j-ng"

    const ov = $('#ovl', st);
    ov.onclick = () => {

    };
    const an = $('#anim', st);
    if (an) an.onclick = () => $$('.compare svg', st).forEach((s, i) => animateStrokes(s, {
      delay: i * 300
    }));
    $$('.judge button', st).forEach(b => b.onclick = () => {
      const j = b.dataset.j;

      if (j === 'ng') S.honest++;

        r.innerHTML = reasonHTML() + nextBtn();
        $('#act', st).appendChild(r);
      } else later(nextItem, 1000);
    });
    }

    <div class="sentence">${sentHTML(q)}</div>

    <div class="chips" style="justify-content:center;margin:6px 0"><button class="chip" data-act="yinput" data-v="kb" aria-pressed="${mode === 'kb'}">⌨️ キーボード</button><button class="chip" data-act="yinput" data-v="hw" aria-pressed="${mode === 'hw'}">✏️ 手書き</button></div>
    ${diff === 'easy' ? `<div class="meaning">💡 さいしょの文字は「${esc(q.yomi[0])}」</div>` : ''}
    <div id="yarea"></div><div class="stamp" id="stamp"></div>`;

      const guide = diff === 'hard' ? '' : kvgSVG(ch, {
        cls: 'guide g-ghost',

        nums: diff === 'easy',

      });

        miss = 0,
        missHere = 0,
        finished = false,
        practice = false;

        startDot.setAttribute('cy', y);

      };

        if (finished) practice = true;

        missHere = 0;

        $('#after', st).innerHTML = '';

          beep('stroke');

            startDot.setAttribute('cy', y);

              p.style.strokeDasharray = L;

                strokeDashoffset: L

                strokeDashoffset: 0
              }], {

                fill: 'forwards'

      };
      const complete = () => {
        finished = true;

      const draw = () => {

      <div class="jk-tiles">${rd.tiles.map(x => `<button class="jk-tile${rd.used && rd.used.includes(x) ? ' used' : ''}" data-x="${x}" ${given || (rd.used && rd.used.includes(x)) ? 'disabled' : ''}>${x}</button>`).join('')}</div>
      <div class="jk-found">${rd.found.map(w => `<span>${w}<small>${esc(W2SET.get(w).yomi)}</small></span>`).join('')}</div>
      <div class="tools">${!showY && !given ? '<button class="tool" id="yh">💡 読みを 見る</button>' : ''}${!given && left.length ? '<button class="tool" id="give">こたえを 見る</button>' : ''}</div>
      <div class="feedback" id="fb"></div><div id="after"></div><div class="stamp" id="stamp"></div>`;

          showY = true;
          draw();
        };
        const gv = $('#give', st);
        if (gv) gv.onclick = () => {
          given = true;
          finishRound();
        };
        $$('.jk-tile', st).forEach(b => b.onclick = () => {
          const x = b.dataset.x;
          const cands = [x + rd.c, rd.c + x].filter(w => W2SET.has(w) && W2SET.get(w).g <= Math.max(maxG, KDB[rd.c].g));
          if (cands.length) {
            beep('ok');
            rd.used = (rd.used || []).concat(x);
            cands.forEach(w => {
              if (!rd.found.includes(w)) {
                rd.found.push(w);
                if (!rd.words.some(v => v.w === w)) rd.words.push(W2SET.get(w));
              }
            });
            addPoints(8, b);
            const first = cands[0];
            draw();
            $('#sl', st).textContent = first[0] === rd.c ? '' : first[0];
            $('#sr', st).textContent = first[1] === rd.c ? '' : first[1];
            $('#fb', st).className = 'feedback ok';
            $('#fb', st).textContent = cands.map(w => `${w}（${W2SET.get(w).yomi}）`).join('　') + ' ができた！';
            if (rd.words.every(w => rd.found.includes(w.w))) finishRound();

          }
        });
      };
      const finishRound = () => {
        const all = rd.words.length,
          f = rd.found.length;

        $$('.jk-tile', st).forEach(b => b.disabled = true);

          kanji: [rd.c],
          xp: f === all ? 5 : 0,
          combo: false
        });
        const miss = rd.words.filter(w => !rd.found.includes(w.w));
        $('#after', st).innerHTML = `<div class="explain"><b>${f === all ? 'ぜんぶ 見つけた！' : `${f} / ${all} 見つけたよ`}</b>

        style = "margin:6px 0 0" > 例： $ {
          sentHTML(rd.words.find(w => w.q).q, 'ruby')
        } < /p>` : ''}</div > $ {
          nextBtn()
        }
        `;
  };
  draw();
};

function finishSession(quit) {
  if (!SES || SES.done) return;
  SES.done = true; SES.quit = !!quit;
  if (SES.mode === 'boss') {
    const g = SES.pool.grade; const win = SES.hp <= 0.5;
    const b = S.boss[g] || (S.boss[g] = { win: 0, tries: 0 });
    b.tries++;
    if (win) { const first = !b.win; b.win++; addPoints(first ? 200 : 100); SES.xp += first ? 200 : 100; SES.bossWin = true; }
  }
  if (SES.mode === 'diag') {
    const sc = SES.res.filter(r => r === 'ok').length;
    const lv = sc <= 4 ? 1 : sc <= 6 ? 2 : sc <= 8 ? 3 : 4;
    S.diag[SES.pool.g] = { score: sc, lv, ts: Date.now() }; SES.diagLv = lv; SES.diagScore = sc;
  }
  save(); checkBadges();
  go('result', {}, { replace: true });
}

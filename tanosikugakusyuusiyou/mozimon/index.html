<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Simple Responsive Form</title>
    <meta name="viewport" content="width=device-width"><link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">


  </head>
    
  <body>
  <title>もじモン 大ぼうけん</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Klee+One:wght@600&display=swap">
<style>
/* レトロ携帯ゲーム風：15:11 のステージにフィールド・バトル・メニューを重ねる。夜の紺 × 金のアクセント */
:root{
  color-scheme:dark;
  --night:#0b1026;--navy:#1d2d62;--ink:#16213e;--paper:#fffdf5;--line:#1a1633;
  --gold:#ffd166;--red:#ef476f;--grn:#06d6a0;--sky:#7fc4f0;--mute:#cdd6f5;
  --ui:'DotGothic16','Hiragino Sans','Yu Gothic',sans-serif;
  --kj:'Klee One','UD デジタル 教科書体 N','Yu Kyokasho','Hiragino Mincho ProN',serif;
  --ctl:70px;
}
@media(pointer:coarse),(max-width:760px){:root{--ctl:240px}#pad{display:flex!important}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{color:#fff;background:radial-gradient(circle at 50% 0,var(--navy),var(--night) 70%);font-family:var(--ui);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding-inline:8px}
#stage{container-type:inline-size;position:relative;width:min(100%,calc((100dvh - var(--ctl) - 24px)*15/11),820px);aspect-ratio:15/11;max-width:100%;border:4px solid #eef1fa;border-radius:12px;box-shadow:0 0 0 4px #2b3a6b,0 14px 40px #000a;overflow:hidden;background:#000}
#stage.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
canvas#cv{width:100%;height:100%;display:block;image-rendering:pixelated}
img.px{image-rendering:pixelated}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;padding:2.5cqw;gap:1.5cqw}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .22s}
#hud{position:absolute;top:2cqw;left:2cqw;right:2cqw;display:flex;justify-content:space-between;align-items:center;pointer-events:none;gap:2cqw}
#hud .hs,#hud button{background:#0b1026d8;border:.4cqw solid #fff8;padding:.6cqw 2cqw;border-radius:2cqw;font-size:3cqw;color:#fff;display:flex;align-items:center;gap:1.2cqw;white-space:nowrap}
#hud img{width:5cqw;height:6.25cqw}
#hud button{pointer-events:auto;border-color:var(--gold);color:var(--gold)}
#sv{opacity:0;transition:opacity .3s}#sv.on{opacity:1}
#toast{position:absolute;top:11cqw;left:50%;transform:translateX(-50%);background:#0b1026e8;border:.5cqw solid var(--gold);color:var(--gold);font-size:3.4cqw;padding:1cqw 4cqw;border-radius:2cqw;white-space:nowrap;transition:opacity .4s;opacity:0;pointer-events:none;z-index:5}
#toast.on{opacity:1}
#dlg{position:absolute;left:3cqw;right:3cqw;bottom:3cqw;background:var(--paper);color:var(--ink);border:.7cqw solid var(--ink);border-radius:2cqw;padding:2cqw 3cqw;font-size:3.9cqw;line-height:1.6;min-height:15cqw;cursor:pointer;z-index:4}
#dlg i{float:right;animation:bk 1s infinite;font-style:normal}@keyframes bk{50%{opacity:0}}
.yn{display:flex;gap:2cqw;margin-top:1.5cqw}
.yn button{flex:1;background:var(--gold);border:.5cqw solid var(--ink);border-radius:2cqw;font-size:3.6cqw;padding:1.2cqw;color:var(--ink)}
.yn button+button{background:#e6e9f5}

/* ---------- バトル ---------- */
#bt{background:linear-gradient(#10224f,#2b1b5e);z-index:3}
#bt[data-th=town]{background:linear-gradient(#7fc7f5,#cdeffd 52%,#86cf6e 52%,#4e9f45)}
#bt[data-th=forest]{background:linear-gradient(#2e6b4a,#4f9a5c 52%,#2f7e3a 52%,#1d5b28)}
#bt[data-th=flower]{background:linear-gradient(#ffc7df,#fff0f6 52%,#a4dc86 52%,#5fb35a)}
#bt[data-th=beach]{background:linear-gradient(#5ab8ef,#c4ecff 52%,#efd9a0 52%,#d9b874)}
#bt[data-th=cave]{background:linear-gradient(#1b1726,#3a3346 52%,#2a2433 52%,#15121c)}
#bt[data-th=castle]{background:linear-gradient(#2b0f2e,#5a1f45 52%,#3b2347 52%,#160b1d)}
#bt.flash{animation:fl .5s}@keyframes fl{0%,40%{filter:brightness(4)}20%{filter:brightness(.3)}}
.top{display:flex;justify-content:space-between;align-items:center;font-size:3.2cqw;height:5.5cqw;gap:2cqw;background:#0b1026c8;border-radius:2cqw;padding:0 2cqw}
#bh{color:#ff7a98;letter-spacing:.2cqw}#be{color:var(--gold)}#b2{color:var(--mute);font-size:2.8cqw}
#mw{position:relative;flex:none;height:23cqw;min-height:0;display:flex;align-items:flex-end;justify-content:center;transition:flex-basis .25s}
#mw::after{content:'';position:absolute;bottom:.3cqw;left:50%;transform:translateX(-50%);width:36cqw;height:4cqw;border-radius:50%;background:#0003;z-index:0}
#bt.kk #mw{height:9cqw}
#bt.kk #q small{font-size:2.4cqw}
#bn{position:absolute;right:1cqw;top:.5cqw;font-size:2.8cqw;background:#0b1026c8;padding:.4cqw 1.6cqw;border-radius:1.5cqw;z-index:2}
#cmb{position:absolute;right:1cqw;top:5cqw;font-size:3cqw;color:#ffb347;text-shadow:0 0 1cqw #000;z-index:2}
#pw{position:absolute;left:1cqw;bottom:0;display:flex;flex-direction:column;align-items:center;gap:.4cqw;z-index:2}
#pw img{width:12cqw;height:15cqw}
#bt.kk #pw img{width:6cqw;height:7.5cqw}
#gauge{width:11cqw;height:1.4cqw;background:#0008;border-radius:1cqw;overflow:hidden;border:.25cqw solid #fff8}
#gauge i{display:block;height:100%;background:linear-gradient(90deg,#7d93ee,#ffd166);transition:width .3s}
#gauge.full{box-shadow:0 0 1.5cqw var(--gold)}
#monbox{position:relative;z-index:1;height:100%;display:flex;align-items:flex-end;transition:transform .25s;transform-origin:bottom center}
#bt.kk #monbox{transform:scale(.4)}
.pop{position:absolute;left:50%;top:20%;font-size:6cqw;color:#fff;text-shadow:0 0 .8cqw #000,0 0 .8cqw #000;animation:pop 1s forwards;pointer-events:none;z-index:5;white-space:nowrap}
.pop.r{color:#ff6b8a}
@keyframes pop{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-2cqw) scale(1.2);opacity:1}100%{transform:translate(-50%,-9cqw);opacity:0}}

/* もじモンのからだ */
.mm{--h:200;position:relative;width:32cqw;height:22cqw;display:flex;justify-content:center;align-items:flex-end;animation:fy 2.4s ease-in-out infinite}
@keyframes fy{50%{transform:translateY(-1.1cqw)}}
.mm .bd{position:relative;width:24cqw;height:17cqw;background:radial-gradient(circle at 35% 28%,hsl(var(--h) 90% 76%),hsl(var(--h) 72% 50%) 72%);border:.6cqw solid var(--line);border-radius:50% 50% 44% 44%/58% 58% 42% 42%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:1.3cqw;margin-bottom:1cqw}
.mm.s1 .bd{width:20cqw;height:19cqw;border-radius:46% 46% 40% 40%/52% 52% 48% 48%}
.mm.s2 .bd{width:28cqw;height:14.5cqw;border-radius:42%}
.mm.s3 .bd{border-radius:30% 30% 48% 48%/40% 40% 60% 60%}
.mm .ey{position:absolute;top:2.4cqw;width:2.8cqw;height:3.4cqw;background:var(--line);border-radius:50%;box-shadow:inset .7cqw .6cqw 0 #fff;animation:blink 4s infinite}
.mm .ey:nth-of-type(1){left:27%}.mm .ey:nth-of-type(2){right:27%}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.mm .kj{position:relative;background:var(--paper);color:var(--ink);font-family:var(--kj);font-size:8cqw;line-height:1;padding:.5cqw 1.4cqw;border-radius:2cqw;border:.4cqw solid var(--line);white-space:nowrap}
.mm .kj.l2{font-size:5.4cqw}.mm .kj.l3{font-size:3.8cqw}
.mm.e1 .bd::before,.mm.e1 .bd::after{content:'';position:absolute;top:-3.6cqw;border:2.2cqw solid transparent;border-bottom:3.6cqw solid hsl(var(--h) 72% 46%)}
.mm.e1 .bd::before{left:12%}.mm.e1 .bd::after{right:12%}
.mm.e2 .bd::before{content:'';position:absolute;top:-4cqw;left:calc(50% - .25cqw);width:.5cqw;height:4cqw;background:var(--line)}
.mm.e2 .bd::after{content:'';position:absolute;top:-5.6cqw;left:calc(50% - 1.3cqw);width:2.6cqw;height:2.6cqw;border-radius:50%;background:var(--gold);border:.4cqw solid var(--line)}
.mm .ft{position:absolute;bottom:0;left:calc(50% - 7.5cqw);width:5cqw;height:2.4cqw;background:hsl(var(--h) 55% 34%);border:.4cqw solid var(--line);border-radius:50%;box-shadow:10cqw 0 0 -.0cqw hsl(var(--h) 55% 34%)}
.mm.shy .bd{background:radial-gradient(circle at 35% 28%,#fffbe0,#f2b632 72%);box-shadow:0 0 3cqw #ffd166}
.mm.evil .bd{background:radial-gradient(circle at 35% 28%,#b37ad1,#4a1a5e 72%)}
.mm.evil .ey{background:#ff2d55;box-shadow:inset .7cqw .6cqw 0 #ffd0dc}
.mm.big{transform:scale(1.15)}
.mm.hit{animation:hit .45s}@keyframes hit{20%,60%{transform:translateX(-2cqw);filter:brightness(3)}40%,80%{transform:translateX(2cqw)}}
.mm.gone{animation:gone .6s forwards}@keyframes gone{to{transform:scale(.1) translateY(10cqw);opacity:0}}

#q{flex:0 0 auto;min-height:12.5cqw;background:var(--paper);color:var(--ink);border:.6cqw solid var(--ink);border-radius:2cqw;padding:1cqw 2.5cqw;font-size:3.5cqw;line-height:1.45;display:flex;flex-direction:column;justify-content:center;cursor:pointer;position:relative;z-index:2}
#q .qs{font-family:var(--kj);font-size:4.5cqw;line-height:1.7}
#q small{font-size:2.7cqw;color:#4a5272}
#q u{text-decoration-color:var(--red);text-decoration-thickness:.6cqw;color:#c0143c}
#tm{position:absolute;left:0;bottom:0;height:.8cqw;background:var(--grn);border-radius:0 0 0 1.5cqw;transition:width linear}
ruby.bl{color:var(--red);letter-spacing:.3cqw}rt{font-family:var(--ui);font-size:2.5cqw;color:#c0143c}
#act{flex:1;min-height:0;position:relative;z-index:2}
#act.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.3cqw}
#act.g3{grid-template-columns:1fr 1fr 1fr}
#act.grid button{background:#fff;color:var(--ink);border:.5cqw solid var(--ink);border-bottom-width:1cqw;border-radius:2cqw;font-size:4cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:.3cqw}
#act.grid button small{font-size:2.3cqw;color:#5a6280}
#act.grid button.k{background:var(--gold)}
#act.grid button.p{background:#cfd8ff}
#act.grid button.p.full{background:linear-gradient(90deg,#ffd166,#ff9ad5);animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 2cqw #ffd166}}
#act.grid button:disabled{opacity:.45}
#act.ch button{font-size:5cqw}
#act.kjc button{font-family:var(--kj);font-size:6cqw}
#act.grid button:active{transform:translateY(.5cqw)}
#act .ok{background:var(--grn)!important}#act .ng{background:var(--red)!important;color:#fff!important}
#act.kaki{display:flex;gap:2cqw;justify-content:center;align-items:center}
.kp{position:relative;display:flex;flex:none;background:#fff;border:.6cqw solid var(--ink);border-radius:1.5cqw;overflow:hidden}
.cell{flex:1;position:relative;display:flex;align-items:center;justify-content:center;border-right:.3cqw dashed #b9c0d6}
.cell:last-child{border-right:0}
.cell::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:.3cqw dashed #e2e6f0}
.cell::after{content:'';position:absolute;top:0;bottom:0;left:50%;border-left:.3cqw dashed #e2e6f0}
.cell span{font-family:var(--kj);color:var(--ink);opacity:.15;line-height:1;position:relative;z-index:1}
.kp.ov2 .cell span{opacity:.55;color:#e0103c}
.kp canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:2}
.ks{display:flex;flex-direction:column;gap:1.1cqw;width:24cqw}
.ks .r2{display:flex;gap:1cqw}.ks .r2 button{flex:1}
.ks button{font-size:3.2cqw;padding:1.3cqw .4cqw;border-radius:2cqw;border:.5cqw solid var(--ink);background:#fff;color:var(--ink)}
.ks .pri{background:var(--gold);font-size:3.9cqw}
.ans{background:var(--paper);color:var(--ink);border-radius:2cqw;text-align:center;padding:.5cqw;font-size:2.5cqw}
.ans b{display:block;font-family:var(--kj);line-height:1.15;white-space:nowrap}

/* ---------- メニュー系 ---------- */
.pn{background:linear-gradient(#10224f,#1c2a5c);overflow:auto;z-index:6}
.pn h2{margin:0;font-size:4.3cqw;color:var(--gold);font-weight:normal}
.hd{display:flex;align-items:center;gap:2cqw}.hd h2{flex:1}
.back{background:#2b3a6b;border:0;border-radius:2cqw;font-size:3cqw;padding:.8cqw 2.5cqw;color:#fff}
.card{display:flex;gap:3cqw;align-items:center;background:#0006;border-radius:2cqw;padding:1.6cqw 3cqw;font-size:3.1cqw;line-height:1.6}
.card img{width:14cqw;height:17.5cqw;flex:none}
.bdg{display:grid;grid-template-columns:repeat(6,1fr);gap:1.2cqw}
.bdg div{background:#0006;border:.4cqw solid #fff3;border-radius:2cqw;text-align:center;font-size:5.4cqw;padding:.8cqw 0;line-height:1.2}
.bdg div small{display:block;font-size:2cqw;color:var(--mute)}
.bdg .no{filter:grayscale(1);opacity:.25}
.obj{background:#fff1;border-left:1cqw solid var(--gold);padding:1cqw 2.5cqw;font-size:3cqw;border-radius:0 2cqw 2cqw 0;line-height:1.5}
.row{display:flex;gap:1.3cqw;flex-wrap:wrap}
.mg4{display:grid;grid-template-columns:repeat(4,1fr);gap:1.3cqw}
.btn{flex:1;background:var(--gold);border:0;border-radius:2cqw;font-size:3.3cqw;padding:1.4cqw 1.5cqw;color:var(--ink)}
.btn.sub{background:#2b3a6b;color:#fff}
.btn:disabled{opacity:.4}
.tiny{background:none;border:0;color:#ff9ab3;font-size:2.6cqw;text-decoration:underline;align-self:flex-end}
.lst{display:flex;flex-direction:column;gap:1.1cqw}
.it{display:flex;justify-content:space-between;align-items:center;gap:2cqw;background:#0006;border-radius:2cqw;padding:1.2cqw 2.5cqw;font-size:3.1cqw}
.it small{display:block;font-size:2.4cqw;color:var(--mute)}
.it button{background:var(--gold);color:var(--ink);border:0;border-radius:1.5cqw;font-size:3cqw;padding:1cqw 2.6cqw;flex:none}
.it.dn{opacity:.55}
.bar{height:1.6cqw;background:#0008;border-radius:1cqw;overflow:hidden;margin-top:.6cqw}.bar i{display:block;height:100%;background:var(--grn)}
.sw{display:flex;gap:1.5cqw}.sw button{width:6cqw;height:6cqw;border-radius:50%;border:.6cqw solid #fff4}.sw button.on{border-color:var(--gold)}
#zt{display:flex;gap:1cqw}#zt button{flex:1;background:#0006;border:.4cqw solid #fff4;border-radius:2cqw;font-size:3cqw;padding:.7cqw}
#zt button.on{background:var(--gold);color:var(--ink)}
#zg{flex:1;min-height:12cqw;overflow:auto;display:grid;grid-template-columns:repeat(10,1fr);gap:1cqw;align-content:start}
#zg button{aspect-ratio:1;background:#ffffff14;border:.3cqw solid #fff4;border-radius:1.2cqw;font-family:var(--kj);font-size:4cqw;padding:0;line-height:1;overflow:hidden;white-space:nowrap;position:relative}
#zg button.l2{font-size:2.4cqw}#zg button.l3{font-size:1.7cqw}
#zg button.no{color:#fff5;font-family:var(--ui)}
#zg button.weak{border-color:var(--red)}
#zg button.shy{background:#ffd16644}
#zd{flex:0 0 auto;min-height:13cqw;font-size:2.9cqw;line-height:1.55;background:#0006;border-radius:2cqw;padding:1.2cqw 2.5cqw;display:flex;gap:2.5cqw;align-items:center}
#zd .bigk{font-family:var(--kj);font-size:10cqw;color:var(--gold);line-height:1;flex:none}
#zd .zbtn{background:var(--gold);color:var(--ink);border:0;border-radius:1.5cqw;font-size:2.8cqw;padding:.8cqw 2cqw;margin-top:.6cqw}
.petbig{display:flex;gap:3cqw;align-items:center}
.petbig img{width:24cqw;height:30cqw;flex:none;background:radial-gradient(circle,#ffffff22,transparent 70%)}
.petbig input,#ti input{font-family:var(--ui);font-size:3.4cqw;width:30cqw;padding:.8cqw 2cqw;border-radius:1.5cqw;border:.5cqw solid var(--gold);background:var(--paper);color:var(--ink)}
.acc{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2cqw}
.acc button{background:#0006;border:.4cqw solid #fff4;border-radius:2cqw;font-size:2.9cqw;padding:1cqw}
.acc button.on{border-color:var(--gold);color:var(--gold)}
.help{font-size:3cqw;line-height:1.7}.help b{color:var(--gold);font-weight:normal}
#ti{background:radial-gradient(circle at 50% 30%,#2d4a9a,#0b1026 75%);align-items:center;justify-content:center;gap:1.8cqw;text-align:center;z-index:8}
#ti h1{margin:0;font-size:12cqw;color:var(--gold);font-weight:normal;text-shadow:0 .8cqw 0 #b5651d,0 0 4cqw #f9a825aa;letter-spacing:.5cqw;line-height:1}
#ti p{margin:0;font-size:3.4cqw;color:var(--mute)}
#ti .mons{font-family:var(--kj);font-size:5cqw;letter-spacing:2cqw;opacity:.8}
#ti label{font-size:3.2cqw;display:flex;gap:2cqw;align-items:center}
#ti .row{width:70cqw}
#ti .tp{width:12cqw;height:15cqw}
#en,#evo{background:radial-gradient(circle,#ffd16655,#0b1026 70%);align-items:center;justify-content:center;text-align:center;gap:2cqw;z-index:7}
#en h2{font-size:9cqw;color:var(--gold);margin:0;font-weight:normal}
#en p{font-size:3.4cqw;margin:0;line-height:1.7}
.cred{height:34cqw;overflow:hidden;position:relative;width:80cqw;mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent)}
.cred div{position:absolute;width:100%;animation:roll 22s linear forwards;font-size:3.2cqw;line-height:2}
@keyframes roll{from{transform:translateY(34cqw)}to{transform:translateY(-100%)}}
#evo img{width:30cqw;height:37.5cqw}
#evo .fx{animation:evf 2.4s steps(1) forwards}
@keyframes evf{0%,20%,40%,55%,68%,78%,86%,92%,96%{filter:brightness(1)}10%,30%,48%,62%,74%,82%,89%,94%,98%{filter:brightness(0) invert(1)}100%{filter:brightness(1)}}
#evo p{font-size:3.8cqw;margin:0}
#mg{background:linear-gradient(#2b1b5e,#10224f);z-index:6}
#mg .tbar{height:2cqw;background:#0008;border-radius:1cqw;overflow:hidden}#mg .tbar i{display:block;height:100%;background:var(--gold)}
#mg .mq{background:var(--paper);color:var(--ink);border-radius:2cqw;padding:2cqw;font-family:var(--kj);font-size:5cqw;text-align:center}
#mg .mq u{color:#c0143c;text-decoration-color:var(--red)}
#mg .mc{display:grid;grid-template-columns:1fr 1fr;gap:1.5cqw;flex:1}
#mg .mc button{background:#fff;color:var(--ink);border:.5cqw solid var(--ink);border-radius:2cqw;font-size:5cqw}
#mg .mc .ok{background:var(--grn)}#mg .mc .ng{background:var(--red);color:#fff}

#pad{display:none;width:min(100%,430px);justify-content:space-between;align-items:center;padding:0 12px}
.dp{display:grid;grid-template:repeat(3,52px)/repeat(3,52px)}
.dp button,.ab button{background:#2b3a6b;border:0;border-radius:12px;color:#fff;font-size:22px;box-shadow:0 4px 0 #111a3a;touch-action:none}
.ab{display:grid;grid-template-columns:auto auto;gap:10px 14px;align-items:center}

const BL='HCMGLD';
MAPS.forEach((m,mi)=>{
  m.t=m.mir?LAY[m.L].map(r=>[...r].reverse().join('')):LAY[m.L];
  if(m.mir){m.npcs.forEach(n=>{n.x=19-n.x;if(n.see)n.see={l:'r',r:'l'}[n.see]||n.see});(m.hid||[]).forEach(h=>h.x=19-h.x)}
  (m.hid||[]).forEach((h,i)=>h.id='h'+mi+'_'+i);
  m.signs={};let i=0;m.t.forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch=='i')m.signs[x+','+y]=m.sg[i++]||'…'}));
});
const isB=v=>v&&BL.includes(v);
const doorTypeOf=(m,x,y)=>{const l=m.t[y][x-1];return isB(l)&&l!='D'?l:m.t[y][x+1]};
function centerPos(mi){const m=MAPS[mi];if(mi==0)return{x:3,y:5};for(let y=0;y<m.t.length;y++)for(let x=0;x<20;x++)if(m.t[y][x]=='D'&&doorTypeOf(m,x,y)=='C')return{x,y:y+1};return{x:9,y:7}}

const held={u:0,d:0,l:0,r:0};let tapQ=null,lastK=null,pressT=0;
function press(k){if(held[k])return;held[k]=1;lastK=k;pressT=performance.now();tapQ=k}
function release(k){held[k]=0;if(lastK==k){lastK=Object.keys(held).find(q=>held[q])||null;if(lastK)pressT=performance.now()-200}}
function stopHeld(){for(const k in held)held[k]=0;tapQ=null;lastK=null}
function tick(){
  fr++;
  if(mode=='field'&&!busy){
    const sp=dash?4:2;
    if(mv){
      px+=Math.sign(tx*16-px)*sp;py+=Math.sign(ty*16-py)*sp;
      pet.px+=Math.sign(pet.x*16-pet.px)*Math.min(sp,Math.abs(pet.x*16-pet.px));pet.py+=Math.sign(pet.y*16-pet.py)*Math.min(sp,Math.abs(pet.y*16-pet.py));
      if(px==tx*16&&py==ty*16){mv=false;pet.px=pet.x*16;pet.py=pet.y*16;S.x=tx;S.y=ty;arrive()}
    }else{
      const now=performance.now(),q=tapQ;
      const k=q||(lastK&&held[lastK]&&now-pressT>170?lastK:null);
      if(k){tapQ=null;const[dx,dy]=DV[k];
        if(q&&(fx!=dx||fy!=dy)){fx=dx;fy=dy}
        else{fx=dx;fy=dy;tryStep(dx,dy)}}

  }
  draw();requestAnimationFrame(tick);
}

  if(!solid(nx,ny)){pet.x=S.x;pet.y=S.y;tx=nx;ty=ny;mv=true;return}

}

function setupPad(cvs){
  const r=cvs.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cvs.width=Math.max(1,r.width*dpr);cvs.height=Math.max(1,r.height*dpr);
  const x=cvs.getContext('2d');x.scale(dpr,dpr);x.lineCap=x.lineJoin='round';x.lineWidth=Math.max(3,r.height/[34,26,19][S.cfg.pen]);x.strokeStyle='#16213e';
  let d=false,lk=false,strokes=[],cur=null;
  const pt=e=>{const b=cvs.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  const redraw=()=>{x.clearRect(0,0,r.width,r.height);strokes.forEach(s=>{x.beginPath();x.moveTo(s[0][0],s[0][1]);s.forEach(p=>x.lineTo(p[0],p[1]));if(s.length==1)x.lineTo(s[0][0]+.1,s[0][1]+.1);x.stroke()})};
  cvs.onpointerdown=e=>{if(lk)return;e.preventDefault();try{cvs.setPointerCapture(e.pointerId)}catch(_){}d=true;cur=[pt(e)];strokes.push(cur);redraw()};
  cvs.onpointermove=e=>{if(!d)return;e.preventDefault();const p=pt(e),l=cur[cur.length-1];x.beginPath();x.moveTo(l[0],l[1]);x.lineTo(p[0],p[1]);x.stroke();cur.push(p)};
  cvs.onpointerup=cvs.onpointercancel=()=>{d=false};
  return{clear(){strokes=[];redraw()},undo(){strokes.pop();redraw()},get n(){return strokes.length},lock(){lk=true;d=false}};
}

  $('zr').innerHTML=S.zr<avail?`<button class="btn" id="zrb" style="width:100%">🎁 ずかんほうしゅう（${(S.zr+1)*10}%たっせい）を うけとる</button>`:`<div class="obj">🎁 つぎの ほうしゅう：${Math.min(100,(S.zr+1)*10)}%（あと ${Math.max(0,Math.ceil(TOTAL*(S.zr+1)/10)-caught())}しゅるい）</div>`;
  const zb=$('zrb');if(zb)zb.onclick=()=>{S.zr++;S.coin+=200;const it=['ii','fude','mitsu','cookie'][S.zr%4];S.it[it]++;if(S.zr==5)addAcc('ribbon');save();hud();sfx('win');renderZ();$('zd').textContent=`ほうしゅう：200コイン と ${ITEMS[it].n}${S.zr==5?' と リボン':''}！`};
  const g=$('zg');g.innerHTML='';
  const list=zg=='w'?KEYS.filter(k=>S.z[k]&&S.z[k].ng>S.z[k].ok):Object.keys(G[zg].m).map(t=>zg+':'+t);
  if(zg=='w'&&!list.length)g.innerHTML='<div style="grid-column:1/-1;font-size:3cqw;color:var(--mute)">にがてな 字は まだ ないよ！</div>';
  list.forEach(k=>{
    const t=kT(k),z=S.z[k],ok=z&&z.c,b=document.createElement('button'),n=[...t].length;
    b.textContent=ok||zg=='w'?t:'？';b.className=(ok||zg=='w'?(n>2?'l3':n>1?'l2':''):'no')+(z&&z.ng>z.ok?' weak':'')+(z&&z.sh?' shy':'');
    b.onclick=()=>{
      const zd=$('zd');
      if(!ok&&zg!='w'){zd.innerHTML=z?`まだ つかまえていない もじモン（せいかい ${z.ok}／まちがい ${z.ng}）`:'まだ 見たことが ない もじモン';return}
      const es=ents(k),ys=[...new Set(es.map(e=>e.yomi))];
      zd.innerHTML=`<span class="bigk">${t}</span><div>${kG(k)}年生　よみ：${ys.join('・')}${z.sh?'　✨いろちがい':''}<br>${es.slice(0,3).map(e=>e.pre+'<b style="color:var(--gold);font-weight:normal">'+e.target+'</b>'+e.post).join(' ／ ')}<br><small>${es[0].meaning}　せいかい ${z.ok}（手がき ${z.w}）／まちがい ${z.ng}</small><br><button class="zbtn" id="zfb">⚔️ この字と れんしゅうバトル</button></div>`;
      $('zfb').onclick=()=>{$('zk').hidden=true;mode='field';run(()=>fight({tr:{name:'れんしゅう',pool:[k],n:1,hp:2,coin:0,prac:1}}))};
    };
    g.append(b);
  });
  $('zd').textContent='もじを タップすると くわしく 見られるよ。 赤い わくは にがて、 金色は いろちがい。';
}
document.querySelectorAll('#zt button').forEach(b=>b.onclick=()=>{zg=b.dataset.g=='w'?'w':+b.dataset.g;renderZ()});
$('zx').onclick=()=>{$('zk').hidden=true;$('mn').hidden=false;panel('top')};
// ---- ショップ ----
let shopRes=null;
function shop(){mode='menu';renderShop();$('sh').hidden=false;return new Promise(r=>shopRes=r)}
function renderShop(m=''){
  const accs=['ribbon','cap'];
  $('sh').innerHTML=`<div class="hd"><h2>¥ フレンドリィショップ</h2><span style="font-size:3.2cqw">🪙${S.coin}</span></div>
  <div class="lst">${Object.entries(ITEMS).map(([k,v])=>`<div class="it"><div>${v.ic} ${v.n}（${S.it[k]}こ）<small>${v.d}</small></div><button data-b="${k}">${v.p}🪙</button></div>`).join('')}
  ${accs.map(a=>`<div class="it ${S.acc.own.includes(a)?'dn':''}"><div>🎀 ${ACC[a].n}（あいぼうの きせかえ）<small>メニューの あいぼう から つけられるよ</small></div>${S.acc.own.includes(a)?'<span>かった</span>':`<button data-ac="${a}">${ACC[a].p}🪙</button>`}</div>`).join('')}</div>
  <div class="obj" style="min-height:6cqw">${m||'てんいん「いらっしゃいませ！」'}</div><button class="btn sub" id="shx" style="flex:none">おみせを でる</button>`;
  $('sh').querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const k=b.dataset.b,v=ITEMS[k];if(S.coin<v.p)return renderShop('コインが たりないみたい… もじモンと たたかって あつめよう！');S.coin-=v.p;S.it[k]++;save();hud();sfx('coin');renderShop(`${v.n}を かった！ まいど ありがとう！`)});
  $('sh').querySelectorAll('[data-ac]').forEach(b=>b.onclick=()=>{const a=b.dataset.ac;if(S.coin<ACC[a].p)return renderShop('コインが たりないみたい…');S.coin-=ACC[a].p;addAcc(a);S.acc.on=a;save();hud();sfx('coin');renderShop(`${ACC[a].n}を かった！ さっそく {P}に つけてあげたよ！`.replace('{P}',S.pet.nick))});
  $('shx').onclick=()=>{$('sh').hidden=true;mode='field';chkTro();const r=shopRes;shopRes=null;r&&r()};
}
// ---- ミニゲーム ----
async function minigameEv(){
  const a=await ask(`ゲームマスター「よみかた タイムアタック！ 30びょうで いくつ こたえられるかな？（さいこう ${S.hi}てん）」`,['あそぶ','やめる']);
  if(a)return;
  mode='menu';const ov=$('mg');ov.hidden=false;
  const g=Math.min(3,1+Math.floor(S.b.length/2)),pl=QD.filter(q=>q.g<=g);
  let score=0;const end=performance.now()+30000;
  ov.innerHTML=`<div class="hd"><h2>⏱ よみかた タイムアタック</h2><span id="mgs" style="font-size:3.6cqw">0てん</span></div><div class="tbar"><i id="mgt" style="width:100%"></i></div><div class="mq" id="mgq"></div><div class="mc" id="mgc"></div>`;
  const tI=setInterval(()=>{$('mgt').style.width=Math.max(0,(end-performance.now())/300)+'%'},100);
  while(performance.now()<end){
    const e=rnd(pl),o=shuf([...G[e.g].y].filter(y=>y!==e.yomi)).slice(0,3);o.push(e.yomi);shuf(o);
    $('mgq').innerHTML=`${e.pre}<u>${e.target}</u>${e.post}`;
    const c=$('mgc');c.innerHTML='';
    const pick=await Promise.race([new Promise(r=>o.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>r(i);c.append(b)})),sleep(Math.max(0,end-performance.now())).then(()=>-1)]);
    if(pick<0)break;
    const bs=[...c.children];
    if(o[pick]===e.yomi){score++;bs[pick].className='ok';sfx('ok')}else{bs[pick].className='ng';bs.forEach((b,j)=>{if(o[j]===e.yomi)b.className='ok'});sfx('ng')}
    $('mgs').textContent=score+'てん';await sleep(o[pick]===e.yomi?250:700);
  }
  clearInterval(tI);
  const best=score>S.hi;if(best)S.hi=score;S.coin+=score*10;save();
  ov.innerHTML=`<div class="hd"><h2>⏱ けっか</h2></div><div class="mq">${score}てん${best?'<br>🎉 しんきろく！':''}</div><div class="obj">${score*10}コインを もらった！　さいこう ${S.hi}てん</div><button class="btn" id="mgx" style="flex:none">おわる</button>`;
  await new Promise(r=>$('mgx').onclick=r);
  ov.hidden=true;mode='field';hud();
}

// ===================== タイトル =====================
let col=S.col||0;
function renderTitle(){
  $('sw').innerHTML=COLS.map((c2,i)=>`<button style="background:${c2}" class="${i==col?'on':''}" data-i="${i}" aria-label="いろ ${i+1}"></button>`).join('');
  $('sw').querySelectorAll('button').forEach(b=>b.onclick=()=>{col=+b.dataset.i;renderTitle()});
  $('tp').src=petURL(hasSave&&S.f.egg?stg():1,hasSave?S.acc.on:null);
}
if(hasSave){$('tC').hidden=false;$('nm').value=S.name;$('pnm').value=S.pet.nick}
renderTitle();
let newArm=0;
function startCommon(lines){
  ac();$('ti').hidden=true;mode='field';hud();toast(M.nm);bgm(mapBgm());
  const d=daily();
  run(async()=>{if(lines)await talk(lines);if(d.length){sfx('coin');await talk(d)}});
}
$('tN').onclick=()=>{
  if(hasSave&&!newArm){newArm=1;$('tN').textContent='もういちど おすと さいしょから';return}
  const nm=($('nm').value||'').trim()||'ゆうしゃ',pn=($('pnm').value||'').trim()||'スミタマ';
  S=NEW();S.name=nm.slice(0,6);S.pet.nick=pn.slice(0,6);S.col=col;M=MAPS[0];place();save();
  startCommon(['ここは もじの国、 ナガレヤマ地方。','この せかいでは 漢字に いのちが やどり、「もじモン」として くらしている。','ところが さいきん、 なぞの「ケシゴム団」が もじモンを けして まわり、 町の かんばんから 文字が きえはじめた…','{N}は きょう、 むん先生に よばれている。','みぎの しろい たてもの「むん研究所」の とびらに ぶつかって 入ろう！']);
};
$('tC').onclick=()=>{S.col=col;M=MAPS[S.m]||MAPS[0];place();startCommon(null)};

// ===================== 入力 =====================
const km={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r',W:'u',S:'d',A:'l',D:'r'};
addEventListener('keydown',e=>{
  if(e.target.tagName=='INPUT')return;
  if(e.key=='Shift'){dash=true;$('bB').classList.add('on');return}
  const k=km[e.key];
  if(k){e.preventDefault();if(!e.repeat)press(k);return}
  if(e.key=='z'||e.key=='Z'||e.key=='Enter'||e.key==' '){e.preventDefault();if(e.repeat)return;if(mode=='battle'){skip&&skip()}else A()}
  else if(e.key=='x'||e.key=='X'||e.key=='Escape'){if(mode=='field')openMenu();else if(mode=='menu'&&!$('mn').hidden)closeMenu()}
  else if('123456'.includes(e.key)){
    if(mode=='battle'){const b=$('act').querySelectorAll('button')[+e.key-1];b&&!b.disabled&&b.click()}
    else if(mode=='ask'){const b=$('dlg').querySelectorAll('.yn button')[+e.key-1];b&&b.click()}
  }
});
addEventListener('keyup',e=>{if(e.key=='Shift'){dash=false;$('bB').classList.remove('on');return}const k=km[e.key];if(k)release(k)});
addEventListener('blur',stopHeld);
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  b.onpointerdown=e=>{e.preventDefault();ac();press(k)};
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b['on'+ev]=()=>release(k));
});
$('bA').onpointerdown=e=>{e.preventDefault();ac();if(mode=='battle')skip&&skip();else A()};
$('bB').onclick=()=>{dash=!dash;$('bB').classList.toggle('on',dash)};
$('bX').onclick=()=>{if(mode=='field')openMenu();else if(mode=='menu'&&!$('mn').hidden)closeMenu()};
$('mb').onclick=openMenu;$('dlg').onclick=()=>{if(mode=='talk')A()};
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopHeld();save()}});

place();hud();requestAnimationFrame(tick);
</script>

<style>
  .chap { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .lvls { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 6px; margin-bottom: 16px; }
  .lv { padding: 8px 4px; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); color: var(--bright); font-family: var(--mono); font-weight: 700; cursor: pointer; text-align: center; font-size: .95rem; transition: transform .12s; }
  .lv:hover:not(:disabled) { transform: translateY(-2px); }
  .lv small { display: block; color: var(--gold); font-size: .62rem; letter-spacing: .05em; min-height: 1em; }
  .lv.on { border-color: #38bdf8; box-shadow: 0 0 12px rgba(56,189,248,.4); }
  .lv:disabled { opacity: .35; cursor: not-allowed; }
  .rb-main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .board { position: relative; display: grid; gap: 4px; padding: 10px; border-radius: 18px; background: #030712; border: 1px solid rgba(56,189,248,.35); width: fit-content; max-width: 100%; margin: 0 auto; }
  .cell { width: var(--cs); height: var(--cs); border-radius: 8px; display: grid; place-items: center; background: rgba(56,189,248,.13); border: 1px solid rgba(56,189,248,.32); font-size: calc(var(--cs) * .45); position: relative; transition: background .2s; }
  .cell.wall { background: repeating-linear-gradient(135deg, #0b1120 0 5px, #1e293b 5px 10px); border-color: #0b1120; opacity: .9; }
  .cell .gem { color: #f472b6; filter: drop-shadow(0 0 6px #f472b6); animation: gemf 1.6s ease-in-out infinite; }
  @keyframes gemf { 50% { transform: translateY(-2px) scale(1.08); } }
  .cell .gem.got { animation: gemgot .45s forwards; }
  @keyframes gemgot { to { transform: translateY(-20px) scale(1.6); opacity: 0; } }
  .cell .goal { color: #34d399; filter: drop-shadow(0 0 6px #34d399); }
  .cell.trail { background: rgba(56,189,248,.3); border-color: rgba(56,189,248,.6); }
  .bot { position: absolute; left: 10px; top: 10px; width: var(--cs); height: var(--cs); display: grid; place-items: center; color: #e0f2fe; font-size: calc(var(--cs) * .55); filter: drop-shadow(0 0 8px #38bdf8); z-index: 2; transition: transform .28s cubic-bezier(.3,.8,.3,1); pointer-events: none; }
  .bot i { transition: transform .22s ease; }
  .bot.crash { color: #f87171; filter: drop-shadow(0 0 10px #ef4444); }
  .bot.crash i { animation: shake .4s; }
  .bot.win i { animation: botwin .8s ease; }
  @keyframes botwin { 40% { transform: scale(1.5) rotate(360deg); } }
  .pal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .cmd { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--card2); color: var(--bright); font: inherit; font-weight: 900; cursor: pointer; transition: transform .1s; }
  .cmd:active:not(:disabled) { transform: scale(.96); }
  .cmd:hover { border-color: #38bdf8; }
  .cmd:disabled { opacity: .4; cursor: not-allowed; }
  .cmd.f i { color: #38bdf8; } .cmd.r i { color: #fbbf24; } .cmd.l i { color: #a78bfa; } .cmd.loop i { color: #34d399; }
  .loopn { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .loopn button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--soft); color: var(--bright); font-weight: 900; cursor: pointer; }
  .loopn b { min-width: 2.2em; text-align: center; color: #34d399; font-family: var(--mono); font-size: 1.1rem; }
  .prog { min-height: 120px; padding: 10px; border-radius: 16px; background: var(--bg2); border: 1px dashed rgba(56,189,248,.35); display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
  .blk { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 10px; font-weight: 900; font-size: .82rem; color: #04121a; cursor: pointer; animation: blkin .2s; }
  @keyframes blkin { from { transform: scale(.6); opacity: 0; } }
  .blk.f { background: #38bdf8; } .blk.r { background: #fbbf24; } .blk.l { background: #c4b5fd; }
  .blk.run { outline: 3px solid #fff; box-shadow: 0 0 12px #fff; }
  .loopblk { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 6px 8px; border-radius: 12px; border: 2px solid #34d399; background: rgba(52,211,153,.1); }
  .loopblk .loopblk { border-color: #2dd4bf; background: rgba(45,212,191,.12); }
  .loopblk.edit { box-shadow: 0 0 0 3px rgba(52,211,153,.45); }
  .loopblk > .lh { color: #34d399; font-weight: 900; font-size: .78rem; cursor: pointer; }
  .lv-badge { display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 999px; font-size: .68rem; background: rgba(45,212,191,.15); color: #5eead4; border: 1px solid rgba(45,212,191,.4); }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; margin-top: 10px; font-size: .76rem; font-weight: 800; color: var(--dim); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .sw-wall { display: inline-block; width: 14px; height: 14px; border-radius: 4px; background: repeating-linear-gradient(135deg, #0b1120 0 3px, #1e293b 3px 6px); border: 1px solid #334155; }
  .speed { display: inline-flex; align-items: center; gap: 6px; }
  @media (max-width: 860px) { .rb-main { grid-template-columns: minmax(0, 1fr); } }
</style>
<main class="wrap">
  <div class="page-title" style="--c:#38bdf8"><span class="ic"><i class="fa-solid fa-robot"></i></span><h1><small>CODING PUZZLE // プログラミング</small>ロボットプログラミング</h1><p>命令ブロックをならべて、ロボットをゴールのはたまで動かそう。宝石はぜんぶ拾ってから！ 少ないブロックでクリアすると★3つ。全36ステージ：きほん → くりかえし → くりかえしの中のくりかえし。</p></div>
  <div class="chap seg" id="chap" style="--c:#38bdf8"></div>
  <div class="lvls" id="lvls"></div>
  <div class="rb-main">
    <section class="panel" style="margin:0"><div class="h2" style="--c:#38bdf8"><i class="fa-solid fa-map"></i><span id="lv-name"></span><small id="lv-par"></small></div><div id="board"></div><div class="legend"><span><i class="fa-solid fa-circle-up" style="color:#e0f2fe"></i> ロボット（矢印の向きに進む）</span><span><i class="fa-solid fa-gem" style="color:#f472b6"></i> 宝石</span><span><i class="fa-solid fa-flag-checkered" style="color:#34d399"></i> ゴール</span><span><i class="sw-wall"></i> かべ</span></div><p class="note" id="lv-hint" style="margin:10px 0 0"></p></section>
    <section class="panel" style="margin:0">
      <div class="h2" style="--c:#38bdf8"><i class="fa-solid fa-code"></i>プログラム<small id="blk-n"></small></div>
      <div class="prog" id="prog" aria-live="polite"></div>
      <p class="note" style="margin:6px 0 10px" id="pnote">ブロックをおすと消せます。「くりかえし」の中に入れているときは、緑のわくが光ります。</p>
      <div class="pal">
        <button class="cmd f" type="button" data-c="F"><i class="fa-solid fa-arrow-up"></i> 前へ</button>
        <button class="cmd r" type="button" data-c="R"><i class="fa-solid fa-rotate-right"></i> 右を向く</button>
        <button class="cmd l" type="button" data-c="L"><i class="fa-solid fa-rotate-left"></i> 左を向く</button>
        <div class="loopn"><button type="button" id="ln-m" aria-label="回数をへらす">−</button><b id="ln">2回</b><button type="button" id="ln-p" aria-label="回数をふやす">＋</button></div>
        <button class="cmd loop" type="button" id="loop"><i class="fa-solid fa-repeat"></i> くりかえし</button>
        <button class="cmd" type="button" id="close-loop" disabled><i class="fa-solid fa-right-from-bracket"></i> くりかえしを出る</button>
      </div>
      <div class="btns" style="margin-top:12px"><button class="btn" type="button" id="run"><i class="fa-solid fa-play"></i> 実行</button><button class="btn ghost" type="button" id="reset"><i class="fa-solid fa-rotate"></i> もどす</button><button class="btn ghost" type="button" id="clear"><i class="fa-solid fa-trash"></i> 全部けす</button><label class="note speed" style="margin:0"><input type="checkbox" id="fast"> はやく動かす</label></div>
      <div class="feedback" id="rb-fb"></div>
    </section>
  </div>
</main>
<script>
(function () {
  const { $, $$, esc, get, update, reward, toast, checkTrophies, FX } = LAB;
  const L = window.ROBOT_LEVELS;
  const CH = [['きほん', 0, 12, 'fa-shoe-prints'], ['くりかえし', 12, 24, 'fa-repeat'], ['二重ループ', 24, 36, 'fa-layer-group']];
  update(d => { d.robotTotal = L.length; });
  let li = 0, prog = [], path = [], loopN = 2, running = false, timer = null, ch = 0;
  const editLoop = () => { let cur = null, list = prog; for (const i of path) { cur = list[i]; list = cur.body; } return cur; };
  const DIR = { '^': 0, '>': 1, 'v': 2, '<': 3 };
  const stars = () => get().robot;
  const unlocked = i => i === 0 || (stars()[i - 1] || 0) > 0 || (stars()[i] || 0) > 0;
  { const s = stars(); for (let i = 0; i < L.length; i++) { li = i; if (!(s[i] > 0)) break; } ch = CH.findIndex(c => li >= c[1] && li < c[2]); }
  function chaps() {
    const s = stars();
    $('#chap').innerHTML = CH.map(([n, a, b, ic], k) => { const got = L.slice(a, b).reduce((t, _, j) => t + (s[a + j] || 0), 0); return `<button type="button" class="${k === ch ? 'on' : ''}" data-k="${k}"><i class="fa-solid ${ic}"></i> ${n}（${a + 1}〜${b}） ★${got}/${(b - a) * 3}</button>`; }).join('');
    $$('#chap button').forEach(b => b.addEventListener('click', () => { ch = +b.dataset.k; FX().play('tap'); chaps(); lvls(); }));
  }
  function lvls() {
    const s = stars(), [, a, b] = CH[ch];
    $('#lvls').innerHTML = L.slice(a, b).map((l, j) => { const i = a + j; return `<button type="button" class="lv ${i === li ? 'on' : ''}" data-i="${i}" ${unlocked(i) ? '' : 'disabled'} aria-label="ステージ${i + 1}">${i + 1}<small>${s[i] ? '★'.repeat(s[i]) : unlocked(i) ? '' : '<i class="fa-solid fa-lock"></i>'}</small></button>`; }).join('');
    $$('#lvls .lv').forEach(b => b.addEventListener('click', () => { if (running) return; li = +b.dataset.i; prog = []; path = []; FX().play('tap'); lvls(); load(); }));
  }
  let st = null, cs = 40;
  function initState() {
    const lv = L[li], g = lv.map.map(r => [...r]); let x = 0, y = 0, d = 1, gems = 0;
    g.forEach((r, yy) => r.forEach((c, xx) => { if (c in DIR) { x = xx; y = yy; d = DIR[c]; g[yy][xx] = '.'; } if (c === '*') gems++; }));
    st = { g, x, y, d, rot: d * 90, gems, got: 0, trail: new Set([`${x},${y}`]) };
  }
  function board() {
    const lv = L[li], W = lv.map[0].length;
    const avail = ($('#board').clientWidth || 320) - 22;
    cs = Math.max(24, Math.min(62, Math.floor((avail - 4 * (W - 1)) / W)));
    $('#board').innerHTML = `<div class="board" id="bd" style="--cs:${cs}px;grid-template-columns:repeat(${W},var(--cs))">${st.g.map((r, y) => r.map((c, x) => `<div class="cell ${c === '#' ? 'wall' : ''} ${st.trail.has(`${x},${y}`) ? 'trail' : ''}" data-xy="${x},${y}">${c === '*' ? '<i class="fa-solid fa-gem gem"></i>' : c === 'G' ? '<i class="fa-solid fa-flag-checkered goal"></i>' : ''}</div>`).join('')).join('')}<span class="bot" id="bot"><i class="fa-solid fa-circle-up"></i></span></div>`;
    place(true);
  }
  function place(instant) {
    const b = $('#bot'); if (!b) return;
    if (instant) { b.style.transition = 'none'; b.firstChild.style.transition = 'none'; }
    b.style.transform = `translate(${st.x * (cs + 4)}px, ${st.y * (cs + 4)}px)`; b.firstChild.style.transform = `rotate(${st.rot}deg)`;
    if (instant) { void b.offsetWidth; b.style.transition = ''; b.firstChild.style.transition = ''; }
  }
  function load() {
    const lv = L[li]; initState(); board();
    $('#lv-name').innerHTML = `ステージ${li + 1}：${esc(lv.name)}${lv.nest ? '<span class="lv-badge">二重ループOK</span>' : ''}`; $('#lv-par').textContent = `★3 は ${lv.par} ブロック以内`;
    $('#lv-hint').innerHTML = `<i class="fa-solid fa-lightbulb" style="color:#fbbf24"></i> ${esc(lv.hint)}`;
    $('#pnote').textContent = lv.nest ? 'このステージでは、くりかえしの中に、もう1つくりかえしを入れられます（2だんまで）。' : 'ブロックをおすと消せます。「くりかえし」の中に入れているときは、緑のわくが光ります。';
    $('#rb-fb').textContent = ''; $('#rb-fb').className = 'feedback'; renderProg();
  }
  const count = list => list.reduce((a, c) => a + (c.t === 'loop' ? 1 + count(c.body) : 1), 0);
  const NAME = { F: '前へ', R: '右', L: '左' }, CL = { F: 'f', R: 'r', L: 'l' };
  function renderProg(active) {
    let k = 0; const ed = editLoop();
    const html = (list, pre) => list.map((c, i) => { const p = pre.concat(i); if (c.t === 'loop') return `<span class="loopblk ${ed === c ? 'edit' : ''}"><span class="lh" data-p="${p.join('.')}" title="おすと消える">${c.n}回くりかえし：</span>${c.body.length ? html(c.body, p) : '<span class="note">（ここに入る）</span>'}</span>`; const idx = k++; return `<span class="blk ${CL[c.t]} ${active === idx ? 'run' : ''}" data-p="${p.join('.')}">${NAME[c.t]}</span>`; }).join('');
    $('#prog').innerHTML = prog.length ? html(prog, []) : '<span class="note">下のボタンで命令を入れよう（キーボードの ↑ → ← でも入る）</span>';
    $('#blk-n').textContent = `${count(prog)} ブロック`;
    $('#close-loop').disabled = !path.length;
    $('#loop').disabled = path.length >= (L[li].nest ? 2 : 1);
    if (!running) $$('#prog [data-p]').forEach(b => b.addEventListener('click', () => { const ps = b.dataset.p.split('.').map(Number); let list = prog; for (let j = 0; j < ps.length - 1; j++) list = list[ps[j]].body; const rm = list[ps[ps.length - 1]]; if (rm.t === 'loop') path = []; list.splice(ps[ps.length - 1], 1); FX().play('tap'); renderProg(); }));
  }
  function add(t) { if (running) return; if (count(prog) >= 40) return toast('ブロックは40こまでです', 'fa-circle-info'); const el = editLoop(); (el ? el.body : prog).push({ t }); FX().play(t === 'F' ? 'step' : 'turn'); renderProg(); }
  $$('.cmd[data-c]').forEach(b => b.addEventListener('click', () => add(b.dataset.c)));
  const setN = n => { loopN = Math.max(2, Math.min(9, n)); $('#ln').textContent = loopN + '回'; const el = editLoop(); if (el) { el.n = loopN; renderProg(); } FX().play('tap'); };
  $('#ln-m').addEventListener('click', () => setN(loopN - 1));
  $('#ln-p').addEventListener('click', () => setN(loopN + 1));
  $('#loop').addEventListener('click', () => { if (running) return; const max = L[li].nest ? 2 : 1; if (path.length >= max) return toast(max === 1 ? 'このステージでは、くりかえしの中に、くりかえしは入れられません' : 'くりかえしは2だんまでです', 'fa-circle-info'); const el = editLoop(), list = el ? el.body : prog; list.push({ t: 'loop', n: loopN, body: [] }); path = path.concat(list.length - 1); FX().play('turn'); renderProg(); });
  $('#close-loop').addEventListener('click', () => { path = path.slice(0, -1); renderProg(); });
  $('#clear').addEventListener('click', () => { if (running) return; prog = []; path = []; load(); });
  $('#reset').addEventListener('click', () => { clearTimeout(timer); running = false; initState(); board(); renderProg(); $('#rb-fb').textContent = ''; });
  addEventListener('keydown', e => { if (e.target.closest('input,textarea')) return; const k = { ArrowUp: 'F', ArrowRight: 'R', ArrowLeft: 'L' }[e.key]; if (k) { e.preventDefault(); add(k); } });
  function index(list, k) { list.forEach(c => { if (c.t === 'loop') index(c.body, k); else c.k = k.v++; }); }
  function expand(list) { const out = []; list.forEach(c => { if (c.t === 'loop') { const inner = expand(c.body); for (let r = 0; r < c.n; r++) out.push(...inner); } else out.push({ t: c.t, k: c.k }); }); return out; }
  $('#run').addEventListener('click', () => {
    if (running || !prog.length) return;
    path = []; initState(); board(); running = true; $('#rb-fb').textContent = ''; FX().play('go');
    index(prog, { v: 0 }); const flat = expand(prog);
    const sp = $('#fast').checked ? 140 : 330;
    let i = 0;
    const step = () => {
      if (i >= flat.length) { running = false; renderProg(); FX().play('ng'); return fb('ng', st.got < st.gems ? `宝石があと ${st.gems - st.got} こ のこっているよ` : 'ゴールまで、あと少し！'); }
      const c = flat[i++]; renderProg(c.k);
      if (c.t === 'R') { st.d = (st.d + 1) % 4; st.rot += 90; FX().play('turn'); place(); }
      else if (c.t === 'L') { st.d = (st.d + 3) % 4; st.rot -= 90; FX().play('turn'); place(); }
      else {
        const nx = st.x + [0, 1, 0, -1][st.d], ny = st.y + [-1, 0, 1, 0][st.d];
        if (ny < 0 || ny >= st.g.length || nx < 0 || nx >= st.g[ny].length || st.g[ny][nx] === '#') {
          const b = $('#bot'); b.style.transform = `translate(${(st.x + (nx - st.x) * .3) * (cs + 4)}px, ${(st.y + (ny - st.y) * .3) * (cs + 4)}px)`;
          setTimeout(() => { place(); b.classList.add('crash'); FX().play('crash'); FX().shake($('#bd')); }, 160);
          running = false; renderProg(); return fb('ng', 'ガシャン！ かべにぶつかった。プログラムを直そう。');
        }
        st.x = nx; st.y = ny; st.trail.add(`${nx},${ny}`); place(); FX().play('step');
        const cell = $(`#bd .cell[data-xy="${nx},${ny}"]`); if (cell) cell.classList.add('trail');
        if (st.g[ny][nx] === '*') { st.g[ny][nx] = '.'; st.got++; const gm = cell && cell.querySelector('.gem'); if (gm) gm.classList.add('got'); FX().play('key'); }
        if (st.g[ny][nx] === 'G' && st.got === st.gems) { running = false; renderProg(); return setTimeout(win, 300); }
      }
      timer = setTimeout(step, sp);
    };
    timer = setTimeout(step, 200);
  });
  function fb(cls, msg) { const el = $('#rb-fb'); el.className = 'feedback ' + cls; el.textContent = msg; }
  function win() {
    const lv = L[li], n = count(prog), s = n <= lv.par ? 3 : n <= lv.par + 2 ? 2 : 1, prev = stars()[li] || 0;
    $('#bot').classList.add('win'); FX().play('win'); FX().confetti(50);
    update(d => { d.robot[li] = Math.max(d.robot[li] || 0, s); }); LAB.track('robot');
    fb('ok', `ゴール！ ${'★'.repeat(s)}${'☆'.repeat(3 - s)}（${n}ブロック）${s < 3 ? `　${lv.par}ブロック以内なら★3！` : ''}`);
    if (!prev) reward({ coins: 150 + li * 20, exp: 8, reason: `ステージ${li + 1} クリア！` }); else if (s > prev) reward({ coins: 100, exp: 3, reason: '★がふえた！' });
    if (li === 11 || li === 23) FX().celebrate({ kicker: 'CHAPTER CLEAR', title: `「${CH[li === 11 ? 0 : 1][0]}」をクリア！`, sub: `つぎは「${CH[li === 11 ? 1 : 2][0]}」。${li === 23 ? 'くりかえしの中に、くりかえしを入れられるようになるよ。' : 'くりかえしを使いこなそう。'}`, icon: 'fa-robot', color: '#38bdf8' });
    if (li === 35 && !prev) FX().celebrate({ kicker: 'ALL CLEAR', title: '全36ステージ クリア！', sub: 'あなたは立派なプログラマーだ。★3をすべてそろえよう。', icon: 'fa-microchip', color: '#fbbf24', big: true });
    checkTrophies(); chaps(); lvls();
    if (li < L.length - 1) $('#rb-fb').insertAdjacentHTML('beforeend', ` <button class="btn sm" type="button" id="nx">次のステージへ</button>`);
    const nx = $('#nx'); if (nx) nx.addEventListener('click', () => { li++; ch = CH.findIndex(c => li >= c[1] && li < c[2]); prog = []; path = []; chaps(); lvls(); load(); });
  }
  addEventListener('resize', () => { if (!running && st) board(); });
  chaps(); lvls(); load();
})();
</script>

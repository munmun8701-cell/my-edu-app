<html lang="ja">

<body>
<script>LAB.header({ sub: "SEASONAL EVENT" });</script>
<style>
  .ev-hero { position: relative; overflow: hidden; padding: 24px; border-radius: 24px; background: linear-gradient(135deg, color-mix(in srgb, var(--ec) 22%, transparent), rgba(10,15,30,.9)); border: 1px solid color-mix(in srgb, var(--ec) 55%, transparent); margin-bottom: 16px; }
  .ev-hero small { font-family: var(--mono); letter-spacing: .2em; color: var(--ec); font-weight: 700; font-size: .72rem; }
  .ev-hero h2 { margin: 6px 0; color: #fff; font-size: clamp(1.4rem, 4vw, 2rem); display: flex; gap: 12px; align-items: center; }
  .ev-hero h2 i { color: var(--ec); }
  .ev-hero .big-ic { position: absolute; right: -10px; bottom: -20px; font-size: 9rem; color: var(--ec); opacity: .12; }
  .stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 8px; }
  .stamps div { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; border: 2px dashed rgba(148,163,184,.3); color: var(--dim); font-family: var(--mono); font-weight: 700; font-size: .8rem; }
  .stamps div.on { border: 2px solid var(--ec); background: color-mix(in srgb, var(--ec) 25%, transparent); color: #fff; box-shadow: 0 0 12px color-mix(in srgb, var(--ec) 45%, transparent); }
  .stamps div.on i { font-size: 1.3rem; color: var(--ec); }
  .doors { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
  .door2 { aspect-ratio: 1; border-radius: 14px; border: 1px solid rgba(34,197,94,.45); background: linear-gradient(160deg, #14532d, #052e16); color: #fff; font-family: var(--mono); font-size: 1.4rem; font-weight: 700; cursor: pointer; position: relative; }
  .door2:disabled { opacity: .35; cursor: not-allowed; }
  .door2.open { background: linear-gradient(160deg, #fbbf24, #b45309); color: #1a1200; }
  .door2 i { position: absolute; right: 6px; top: 6px; font-size: .8rem; }
  .kz-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; align-items: start; }
  .kz-canvas { position: relative; width: 100%; max-width: 420px; aspect-ratio: 3 / 4; margin: 0 auto; border-radius: 6px; background: #fffdf5; box-shadow: 0 10px 30px rgba(0,0,0,.4); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .kz-canvas canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .kz-canvas .model { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif; font-weight: 900; color: rgba(0,0,0,.08); line-height: 1.08; pointer-events: none; }
  .kz-canvas .model span { display: block; }
  .kz-works { display: flex; gap: 8px; flex-wrap: wrap; }
  .kz-works img { width: 72px; border-radius: 4px; border: 1px solid var(--line); background: #fffdf5; }
  .omi { text-align: center; }
  .omi .paper { display: inline-block; margin: 10px auto; padding: 22px 30px; border-radius: 8px; background: #fffdf5; color: #1f2937; box-shadow: 0 10px 30px rgba(0,0,0,.4); min-width: 240px; animation: esc .8s both; }
  .omi .paper b { display: block; font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; font-size: 3rem; color: #b91c1c; letter-spacing: .1em; }
  .omi .paper p { margin: 6px 0; font-weight: 700; text-align: left; }
  @keyframes esc { from { transform: translateY(20px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
  .gacha-card { padding: 20px; border-radius: 20px; background: linear-gradient(160deg, rgba(6,182,212,.14), rgba(10,15,30,.92)); border: 1px solid rgba(6,182,212,.5); animation: esc .6s both; }
  .gacha-card h3 { margin: 4px 0 8px; color: #fff; font-size: 1.3rem; }
  .gacha-card ol { margin: 6px 0 0 1.3em; padding: 0; }
  .cal { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .cal div { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--card2); border: 1px solid var(--line); }
  .cal div.now { border-color: var(--ec); }
  .cal i { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; background: rgba(148,163,184,.1); }
  .cal b { color: #fff; font-size: .88rem; display: block; }
  .cal small { color: var(--dim); font-size: .74rem; }
  @media (max-width: 760px) { .kz-wrap { grid-template-columns: 1fr; } }
</style>
<main class="wrap">
  <div class="page-title" style="--c:#f97316"><span class="ic"><i class="fa-solid fa-calendar-days"></i></span><h1><small>SEASONAL EVENT // 季節イベント</small>季節イベント</h1><p>季節ごとに、期間限定のイベントがひらかれます。開催中のイベントに参加して、限定のスタンプやごほうびを集めよう。</p></div>
  <div id="ev-tabs" class="seg" style="--c:#f97316;margin-bottom:12px" hidden></div>
  <div id="ev-main"></div>
  <section class="panel"><div class="h2"><i class="fa-solid fa-calendar"></i>1年間のイベントカレンダー</div><div class="cal" id="cal"></div></section>
</main>
<script>
(function () {
  const { $, $$, esc, get, update, reward, question, renderChoice, toast, checkTrophies, ymd, today, pick, rnd, shuffle } = LAB;
  const E = LAB_EVENTS_NOW();
  const T = ymd(today());
  const rec = key => get().events[key] || {};
  const save = (key, fn) => update(d => { const x = d.events[key] || {}; fn(x); d.events[key] = x; });

  $('#cal').innerHTML = E.all.map(ev => `<div class="${E.nowAll.some(n => n.id === ev.id) ? 'now' : ''}" style="--ec:${ev.c}"><i class="fa-solid ${ev.ic}" style="color:${ev.c}"></i><div><b>${esc(ev.name)}</b><small>${ev.label}</small></div></div>`).join('');
  if (!E.nowAll.length) {
    $('#ev-main').innerHTML = `<section class="ev-hero" style="--ec:${E.next.c}"><small>NEXT EVENT</small><h2><i class="fa-solid ${E.next.ic}"></i>${esc(E.next.name)}</h2><p style="margin:0">${E.next.label} からスタート！ ${esc(E.next.desc)}</p><i class="fa-solid ${E.next.ic} big-ic"></i></section>`;
    return;
  }
  let cur = E.nowAll[0];
  if (E.nowAll.length > 1) {
    $('#ev-tabs').hidden = false;
    $('#ev-tabs').innerHTML = E.nowAll.map((ev, i) => `<button type="button" class="${i ? '' : 'on'}" data-i="${i}">${esc(ev.name)}</button>`).join('');
    $$('#ev-tabs button').forEach(b => b.addEventListener('click', () => { cur = E.nowAll[+b.dataset.i]; $$('#ev-tabs button').forEach(x => x.classList.toggle('on', x === b)); show(); }));
  }
  function hero(ev) { return `<section class="ev-hero" style="--ec:${ev.c}"><small>NOW ON // ${ev.label}</small><h2><i class="fa-solid ${ev.ic}"></i>${esc(ev.name)}</h2><p style="margin:0">${esc(ev.desc)}</p><i class="fa-solid ${ev.ic} big-ic"></i></section>`; }
  function show() {
    const ev = cur;
    $('#ev-main').innerHTML = hero(ev) + `<section class="panel" id="ev-body" style="--ec:${ev.c}"></section>`;
    ({ rally, advent, kakizome, omikuji, grade, gacha })[ev.type](ev, $('#ev-body'));
  }

  /* ---------- ラリー（毎日3問でスタンプ） ---------- */
  function rally(ev, box) {
    const r = rec(ev.key), stamps = r.stamps || {}, n = Object.keys(stamps).length;
    const icon = { aki: 'fa-leaf', setsubun: 'fa-hand-fist', halloween: 'fa-candy-cane' }[ev.id] || 'fa-star';
    const word = { aki: 'もみじ', setsubun: '豆', halloween: 'おかし' }[ev.id] || 'スタンプ';
    const goals = [5, 10, 15];
    box.innerHTML = `<div class="h2"><i class="fa-solid ${icon}" style="color:${ev.c}"></i>${word}スタンプ ${n} こ<small>1日1回・3問中2問正解でスタンプ</small></div>
      <div class="stamps">${Array.from({ length: 15 }, (_, i) => `<div class="${i < n ? 'on' : ''}">${i < n ? `<i class="fa-solid ${icon}"></i>` : i + 1}</div>`).join('')}</div>
      <p class="note">スタンプ ${goals.map(g => `<b style="color:${n >= g ? '#34d399' : '#fff'}">${g}こ</b>`).join('・')} でボーナスコイン（500・1,000・2,000）！</p><div id="rq"></div>`;
    if (stamps[T] != null) { $('#rq').innerHTML = `<div class="empty">今日の分はおわり！ ${stamps[T]}問正解でスタンプをゲット。また明日きてね。</div>`; return; }
    let i = 0, score = 0;
    const one = () => {
      const q = question('mix', { choice: true });
      renderChoice($('#rq'), Object.assign(q, { s: `${q.s}（${i + 1}/3）` }), ok => {
        if (ok) score++;
        setTimeout(() => {
          i++; if (i < 3) return one();
          if (score >= 2) {
            save(ev.key, x => { x.stamps = Object.assign({}, x.stamps, { [T]: score }); });
            const nn = Object.keys(rec(ev.key).stamps).length, bonus = { 5: 500, 10: 1000, 15: 2000 }[nn] || 0;
            reward({ coins: 150 + bonus, exp: 10, reason: bonus ? `${word}${nn}こ達成ボーナス！` : `${word}スタンプ ゲット！` });
          } else { save(ev.key, x => { x.tries = Object.assign({}, x.tries, { [T]: score }); }); toast(`${score}問正解…。また明日チャレンジしよう！`, 'fa-rotate-right'); }
          checkTrophies(); show();
        }, 900);
      });
    };
    if ((r.tries || {})[T] != null) { $('#rq').innerHTML = `<div class="empty">今日は ${(r.tries || {})[T]} 問正解でした。また明日チャレンジしよう！</div>`; return; }
    $('#rq').innerHTML = `<div class="btns" style="justify-content:center"><button class="btn lg" type="button" id="go" style="background:linear-gradient(135deg,#fdba74,${ev.c})"><i class="fa-solid fa-play"></i> 今日の3問にチャレンジ</button></div>`;
    $('#go').addEventListener('click', one);
  }

  /* ---------- アドベントカレンダー ---------- */
  function advent(ev, box) {
    const r = rec(ev.key), opened = r.opened || {}, d = today(), dayN = (d.getMonth() === 11) ? d.getDate() : 0;
    box.innerHTML = `<div class="h2"><i class="fa-solid fa-gifts" style="color:${ev.c}"></i>12月のとびら（${Object.keys(opened).length} / 25）<small>今日のとびらまで、ひらけます</small></div>
      <div class="doors">${Array.from({ length: 25 }, (_, i) => `<button type="button" class="door2 ${opened[i + 1] ? 'open' : ''}" data-d="${i + 1}" ${i + 1 > dayN ? 'disabled' : ''}>${i + 1}${opened[i + 1] ? '<i class="fa-solid fa-check"></i>' : ''}</button>`).join('')}</div><div id="aq" style="margin-top:16px"></div>`;
    $$('.door2').forEach(b => b.addEventListener('click', () => {
      const n = +b.dataset.d, z = LAB_DATA.ZATSU[(n * 7) % LAB_DATA.ZATSU.length];
      if (opened[n]) { $('#aq').innerHTML = `<div class="empty"><b style="color:#fff">${n}日のおまけ雑学：${esc(z.t)}</b><br>${esc(z.d)}</div>`; return; }
      const q = question('mix', { choice: true });
      renderChoice($('#aq'), Object.assign(q, { s: `${n}日のとびら` }), ok => {
        save(ev.key, x => { x.opened = Object.assign({}, x.opened, { [n]: ok ? 2 : 1 }); });
        reward({ coins: ok ? 200 : 50, exp: ok ? 5 : 1, reason: ok ? `${n}日のプレゼント！` : `${n}日のとびら` });
        $('#aq').insertAdjacentHTML('beforeend', `<div class="empty" style="margin-top:12px"><b style="color:#fff"><i class="fa-solid fa-lightbulb" style="color:#fbbf24"></i> おまけ雑学：${esc(z.t)}</b><br>${esc(z.d)}</div>`);
        checkTrophies(); setTimeout(() => { const keep = $('#aq').innerHTML; show(); $('#aq').innerHTML = keep; }, 1200);
      });
    }));
  }

  /* ---------- 書き初め ---------- */
  function kakizome(ev, box) {
    const WORDS = ['夢', '友', '力', '希望', '挑戦', '努力', '元気', '笑顔', '前進', '一歩'];
    let word = WORDS[0];
    box.innerHTML = `<div class="kz-wrap"><div><div class="kz-canvas" id="kz"><div class="model" id="kz-m"></div><canvas id="kz-c" width="600" height="800" aria-label="書き初めの紙"></canvas></div></div>
      <div><div class="h2"><i class="fa-solid fa-paintbrush" style="color:${ev.c}"></i>お手本をえらぶ</div><div class="seg" id="kz-w" style="--c:${ev.c}">${WORDS.map((w, i) => `<button type="button" class="${i ? '' : 'on'}" data-w="${w}">${w}</button>`).join('')}</div>
      <p class="note">うすいお手本をなぞって書こう。ゆっくり動かすと太く、はやく動かすと細くなるよ。</p>
      <div class="btns"><button class="btn ghost" type="button" id="kz-clear"><i class="fa-solid fa-eraser"></i> 書きなおす</button><button class="btn pink" type="button" id="kz-done"><i class="fa-solid fa-stamp"></i> できた！</button></div>
      <div class="h2" style="margin-top:16px;font-size:.95rem"><i class="fa-solid fa-images"></i>これまでの作品</div><div class="kz-works" id="kz-works"></div></div></div>`;
    const c = $('#kz-c'), ctx = c.getContext('2d');
    const setModel = () => { const m = $('#kz-m'), k = $('#kz'); if (!m || !k) return; m.innerHTML = [...word].map(ch => `<span>${esc(ch)}</span>`).join(''); const w = k.clientWidth || 300, h = k.clientHeight || 400; m.style.fontSize = Math.round(word.length > 1 ? Math.min(w * .62, h * .42) : w * .72) + 'px'; };
    addEventListener('resize', setModel);
    setModel();
    $$('#kz-w button').forEach(b => b.addEventListener('click', () => { word = b.dataset.w; $$('#kz-w button').forEach(x => x.classList.toggle('on', x === b)); setModel(); }));
    let drawing = false, lx = 0, ly = 0, lt = 0, lw = 14;
    const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
    c.addEventListener('pointerdown', e => { drawing = true; c.setPointerCapture(e.pointerId); [lx, ly] = pos(e); lt = performance.now(); lw = 22; ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(lx, ly, lw / 2, 0, 7); ctx.fill(); });
    c.addEventListener('pointermove', e => {
      if (!drawing) return; const [x, y] = pos(e), now = performance.now(), dist = Math.hypot(x - lx, y - ly), v = dist / Math.max(1, now - lt);
      const w = Math.max(6, Math.min(30, 34 - v * 14)); lw = lw * .7 + w * .3;
      ctx.strokeStyle = '#111'; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(x, y); ctx.stroke();
      lx = x; ly = y; lt = now;
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => c.addEventListener(t, () => { drawing = false; }));
    $('#kz-clear').addEventListener('click', () => ctx.clearRect(0, 0, c.width, c.height));
    const works = () => { const w = rec(ev.key).works || []; $('#kz-works').innerHTML = w.length ? w.map(x => `<img src="${x.img}" alt="${esc(x.w)}">`).join('') : '<span class="note">まだありません</span>'; };
    works();
    $('#kz-done').addEventListener('click', () => {
      const s = document.createElement('canvas'); s.width = 180; s.height = 240; const sc = s.getContext('2d');
      sc.fillStyle = '#fffdf5'; sc.fillRect(0, 0, 180, 240); sc.drawImage(c, 0, 0, 180, 240);
      sc.fillStyle = '#b91c1c'; sc.fillRect(150, 206, 22, 22); sc.fillStyle = '#fff'; sc.font = 'bold 14px serif'; sc.fillText('む', 154, 223);
      const img = s.toDataURL('image/jpeg', .72);
      const already = (rec(ev.key).days || {})[T];
      save(ev.key, x => { x.works = [{ w: word, img, d: T }, ...(x.works || [])].slice(0, 6); x.days = Object.assign({}, x.days, { [T]: 1 }); });
      if (!already) reward({ coins: 200, exp: 10, reason: `書き初め「${word}」` }); else toast('作品を保存しました', 'fa-image');
      checkTrophies(); works();
    });
  }

  /* ---------- おみくじ ---------- */
  function omikuji(ev, box) {
    const r = rec(ev.key), done = (r.days || {})[T];
    const LUCK = { ok: [['大吉', .4], ['中吉', .3], ['小吉', .3]], ng: [['吉', .5], ['末吉', .5]] };
    const MSG = { study: ['毎日10分のつみかさねが大きな力に', '苦手な単元に、今年こそチャレンジ', '音読でことばの力がぐんと伸びる', '計算はていねいに。見直しで点がアップ', '分からないことは、すぐ質問すると吉'], health: ['早ね早起きで元気いっぱい', '外遊びで体力アップ', '画面を見たら、遠くの景色で目を休めて', 'よくかんで食べると集中力アップ'], word: ['「継続は力なり」', '「急がば回れ」', '「千里の道も一歩から」', '「失敗は成功のもと」', '「好きこそものの上手なれ」'] };
    const paper = res => `<div class="paper"><small style="color:#b91c1c;font-weight:900;letter-spacing:.3em">おみくじ</small><b>${res.l}</b><p>学業：${esc(res.s)}</p><p>健康：${esc(res.h)}</p><p>ことば：${esc(res.w)}</p></div>`;
    if (done) { box.innerHTML = `<div class="omi"><p class="note">今日のおみくじ</p>${paper(done)}<p class="note">おみくじは1日1回。また明日ひいてね。</p></div>`; return; }
    box.innerHTML = `<div class="omi"><p>1問に正解すると、いいことがあるかも…？</p><div id="oq"></div></div>`;
    const q = question('mix', { choice: true });
    renderChoice($('#oq'), Object.assign(q, { s: 'おみくじの1問' }), ok => {
      const list = LUCK[ok ? 'ok' : 'ng']; let x = Math.random(), l = list[list.length - 1][0]; for (const [n, p] of list) { if (x < p) { l = n; break; } x -= p; }
      const res = { l, s: pick(MSG.study), h: pick(MSG.health), w: pick(MSG.word) };
      save(ev.key, y => { y.days = Object.assign({}, y.days, { [T]: res }); });
      reward({ coins: l === '大吉' ? 300 : 120, exp: 5, reason: `おみくじ「${l}」` }); checkTrophies();
      setTimeout(() => { box.innerHTML = `<div class="omi">${paper(res)}</div>`; }, 900);
    });
  }

  /* ---------- 進級チャレンジ ---------- */
  function grade(ev, box) {
    const r = rec(ev.key), medals = r.medals || {};
    box.innerHTML = `<div class="h2"><i class="fa-solid fa-graduation-cap" style="color:${ev.c}"></i>学年をえらんでチャレンジ（10問）</div><div class="btns" id="gs">${[1, 2, 3, 4, 5, 6].map(g => `<button class="btn ${medals[g] ? 'gold' : 'ghost'}" type="button" data-g="${g}">${g}年${medals[g] ? ' <i class="fa-solid fa-medal"></i>' : ''}</button>`).join('')}</div><div id="gq" style="margin-top:16px"></div>`;
    $$('#gs button').forEach(b => b.addEventListener('click', () => {
      const g = +b.dataset.g; let i = 0, score = 0;
      const one = () => { const q = Math.random() < .6 ? LAB.mathQ(g) : LAB.bankQ(g); if (q.kind === 'num') { q.choices = LAB.numChoices(q.a); q.kind = 'choice'; } renderChoice($('#gq'), Object.assign(q, { s: `${g}年のまとめ（${i + 1}/10）` }), ok => { if (ok) score++; setTimeout(() => { i++; if (i < 10) one(); else end(); }, 800); }); };
      const end = () => {
        const perfect = score === 10;
        if (perfect && !medals[g]) { save(ev.key, x => { x.medals = Object.assign({}, x.medals, { [g]: T }); }); reward({ coins: 800, exp: 30, reason: `${g}年 進級メダル！` }); } else reward({ coins: 50 + score * 10, exp: 2, reason: `${score}/10 正解` });
        checkTrophies();
        $('#gq').innerHTML = `<div class="q-box"><div class="q-text">${score} / 10 正解${perfect ? '！ 進級メダル獲得！' : ''}</div><p class="note">${perfect ? 'つぎの学年でも、この調子！' : 'ぜんぶ正解で「進級メダル」。何度でもチャレンジできます。'}</p></div>`;
        setTimeout(() => grade(ev, box), perfect ? 2500 : 0);
      };
      one();
    }));
  }

  /* ---------- 自由研究テーマガチャ ---------- */
  const THEMES = [

<main class="wrap">

<script>
(function () {
  const { $, $$, esc, get, update, load, save, ymd, today, p2, checkTrophies, mondayOf, dayKeyParts, unitAcc } = LAB;
  const C = window.LAB_CARDS || [], BYID = {}; C.forEach(c => { BYID[c.id] = c; });
  const T0 = today();
  const NAME_KEY = 'mun_report_name';
  const shift = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
  const wd = '日月火水木金土';
  let mode = 'week', custom = { from: ymd(shift(T0, -6)), to: ymd(T0) };
  function range() {
    const mon = mondayOf(T0);
    if (mode === 'week') return { a: mon, b: shift(mon, 6) > T0 ? T0 : shift(mon, 6), label: '今週' };
    if (mode === 'last') return { a: shift(mon, -7), b: shift(mon, -1), label: '先週' };
    if (mode === 'month') return { a: new Date(T0.getFullYear(), T0.getMonth(), 1, 12), b: T0, label: `${T0.getMonth() + 1}月（きょうまで）` };
    if (mode === 'lastm') { const a = new Date(T0.getFullYear(), T0.getMonth() - 1, 1, 12); return { a, b: new Date(T0.getFullYear(), T0.getMonth(), 0, 12), label: `${a.getMonth() + 1}月` }; }
    let a = parse(custom.from), b = parse(custom.to); if (b < a) [a, b] = [b, a]; if ((b - a) / 864e5 > 61) b = shift(a, 61);
    return { a, b, label: 'えらんだ期間' };
  }
  const fmt = d => `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
  const fmtS = d => `${d.getMonth() + 1}/${d.getDate()}`;
  function subjOf(id) {
    const c = BYID[id]; if (!c) return null;
    if (/^math/.test(c.cat)) return '算数'; if (c.cat === 'kokugo') return '国語'; if (c.cat === 'social' || c.cat === 'history') return '社会・歴史';
    if (c.cat === 'game') return '学習ゲーム'; if (c.cat === 'support') return '支援学級'; if (c.cat === 'grade1') return '1年生';
    return c.label || 'そのほか';
  }
  /* ---------- 集計 ---------- */
  function collect(r) {
    const days = []; for (let d = new Date(r.a); d <= r.b; d = shift(d, 1)) days.push(ymd(d));
    const set = new Set(days);
    const exp = {}, min = {}, apps = {}, goals = load('mun_goal_days', {});
    Object.entries(load('mun_daily_exp', {})).forEach(([s, v]) => { const p = dayKeyParts(s); if (p) { const k = `${p.y}-${p2(p.m)}-${p2(p.d)}`; exp[k] = (exp[k] || 0) + (v || 0); } });
    Object.entries(load('mun_study_log', {})).forEach(([k, v]) => { min[k] = (min[k] || 0) + (v || 0) / 60; });
    Object.entries(load('mun_focus_days', {})).forEach(([k, v]) => { min[k] = (min[k] || 0) + (parseInt(v) || 0); });
    Object.entries(load('mun_visit_days', {})).forEach(([k, v]) => { apps[k] = Array.isArray(v) ? v : []; });
    const diary = load('mun_diary', {}), read = load('mun_read', []);
    const lab = get();
    const per = days.map(k => {
      const m = Math.round(min[k] || 0), e = exp[k] || 0, a = (apps[k] || []).length;
      return { k, m, e, a, ok: m > 0 || e > 0 || a > 0 || !!diary[k] };
    });
    let lessons = 0, stars = 0; const lessonsBy = {};
    Object.entries(load('mun_progress', {})).forEach(([id, u]) => Object.values((u && u.lessons) || {}).forEach(l => { if (l && set.has(String(l.date || '').slice(0, 10))) { lessons++; stars += l.stars || 0; } }));
    const cnt = {}, subj = {};
    days.forEach(k => (apps[k] || []).forEach(id => { cnt[id] = (cnt[id] || 0) + 1; const s = subjOf(id); if (s) subj[s] = (subj[s] || 0) + 1; }));
    const top = Object.entries(cnt).filter(([id]) => BYID[id]).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([id, n]) => ({ t: BYID[id].title, n }));
    let streak = 0, best = 0, run = 0; per.forEach(p => { run = p.ok ? run + 1 : 0; best = Math.max(best, run); }); streak = best;
    const units = []; Object.entries(lab.units || {}).forEach(([id, u]) => { if (u && u.t && set.has(u.t) && window.LAB_Q && LAB_Q.BYID[id]) { const x = unitAcc(id); if (x) units.push({ id, name: LAB_Q.BYID[id].name, s: LAB_Q.BYID[id].s, g: LAB_Q.BYID[id].g, n: x.n, acc: x.acc, recent: x.recent }); } });
    const trophies = Object.entries(lab.trophies || {}).filter(([, d]) => set.has(d)).map(([id]) => (LAB.TROPHIES.find(t => t.id === id) || {}).t).filter(Boolean);
    return {
      days, per, studied: per.filter(p => p.ok).length, min: per.reduce((a, p) => a + p.m, 0), exp: per.reduce((a, p) => a + p.e, 0),
      goal: days.filter(k => goals[k]).length, diary: days.filter(k => diary[k]).length, books: read.filter(x => x && set.has(x.date)).length,
      lessons, stars, top, subj, streak, units, trophies,
      kinds: new Set(days.flatMap(k => apps[k] || [])).size
    };
  }
  const nm = () => { try { return localStorage.getItem(NAME_KEY) || ''; } catch (e) { return ''; } };
  /* ---------- 1枚のレポート ---------- */
  function render() {
    const r = range(), s = collect(r), name = nm(), g = LAB.myGrade();
    const nd = s.days.length, showLab = $('#o-lab').checked, showVoice = $('#o-voice').checked, showCm = $('#o-cm').checked;
    const maxM = Math.max(30, ...s.per.map(p => p.m));
    const bars = s.per.map(p => `<div class="c ${p.ok ? '' : 'no'}" title="${p.k}：${p.m}分"><i style="height:${p.m ? Math.max(6, Math.round(p.m / maxM * 100)) : 0}%"></i></div>`).join('');
    const labels = s.per.map((p, i) => { const d = parse(p.k); return `<span>${nd <= 14 ? `${d.getMonth() + 1}/${d.getDate()}<br>${wd[d.getDay()]}` : (d.getDate() === 1 || d.getDay() === 1 ? `${d.getDate()}` : '')}</span>`; }).join('');
    const sj = Object.entries(s.subj).sort((a, b) => b[1] - a[1]); const sjMax = sj.length ? sj[0][1] : 1;
    const weak = s.units.filter(u => u.n >= 3 && u.acc < .7).sort((a, b) => a.acc - b.acc).slice(0, 4);
    const strong = s.units.filter(u => u.n >= 5 && u.acc >= .9).sort((a, b) => b.n - a.n).slice(0, 4);
    const good = [];
    if (s.studied) good.push(`${nd}日のうち <b>${s.studied}日</b> 学習しました。`);
    if (s.streak >= 3) good.push(`<b>${s.streak}日</b>つづけて学習した日がありました。`);
    if (s.lessons) good.push(`授業を <b>${s.lessons}回</b> クリアし、★を <b>${s.stars}こ</b> あつめました。`);
    if (s.top[0]) good.push(`いちばん使ったのは「<b>${esc(s.top[0].t)}</b>」でした。`);
    if (s.books) good.push(`本を <b>${s.books}さつ</b> 読みました。`);
    if (s.goal) good.push(`目標を <b>${s.goal}日</b> 達成しました。`);
    if (strong.length) good.push(`「${esc(strong[0].name)}」はとくいになりました。`);
    const voice = [];
    if (!s.studied) voice.push('この期間は、まだ記録がありません。まずは1日5分、好きなアプリから始めてみましょう。');
    else {
      if (s.studied >= Math.ceil(nd * .6)) voice.push('よく続けられています。「今週もがんばったね」と、続けられたこと自体をほめてあげてください。');
      else voice.push('学習した日が少なめです。短い時間（5〜10分）でよいので、決まった時間に1つだけ取り組む習慣づくりがおすすめです。');
      if (weak.length) voice.push(`「${esc(weak[0].name)}」はまだ練習中です。まちがえた問題の理由を、いっしょに声に出して確かめてみましょう。`);
      if (!Object.keys(s.subj).some(k => k === '国語') && Object.keys(s.subj).length) voice.push('国語の学習が見られませんでした。漢字や言葉のアプリも、ぜひ試してみてください。');
    }
    $('#sheet').innerHTML = `
      <div class="top"><h1><small>MUN-SENSEI GAKUSHU QUEST // REPORT</small>がんばりふりかえりレポート</h1>
        <div class="who">なまえ <b>${name ? esc(name) : '　　　　　　　　'}</b>${g ? `（${g}年）` : ''}<br><span style="color:var(--mut)">${fmt(r.a)} 〜 ${fmt(r.b)}（${r.label}）</span></div></div>
      <div class="kpi">
        <div><b>${s.studied}<span style="font-size:11px"> / ${nd}日</span></b><small>学習した日</small></div>
        <div><b>${s.min}<span style="font-size:11px">分</span></b><small>学習した時間</small></div>
        <div><b>${s.kinds}</b><small>ひらいたアプリ</small></div>
        <div><b>${s.lessons}</b><small>クリアした授業</small></div>
        <div><b>${s.stars}</b><small>あつめた★</small></div>
        <div><b>${s.streak}<span style="font-size:11px">日</span></b><small>つづけた最長日数</small></div>
      </div>
      <h2>毎日の学習時間（分）</h2>
      <div class="bars">${bars}</div><div class="lbl">${labels}</div>
      <div class="cols">
        <div><h2>教科ごとのとりくみ（ひらいた回数）</h2>${sj.length ? sj.map(([k, v]) => `<div class="sb"><span>${esc(k)}</span><span class="tr"><i style="width:${Math.round(v / sjMax * 100)}%"></i></span><em>${v}回</em></div>`).join('') : '<p class="empty">この期間の記録はまだありません。</p>'}</div>
        <div><h2>よく使ったアプリ</h2>${s.top.length ? `<ul>${s.top.map(t => `<li>${esc(t.t)}（${t.n}日）</li>`).join('')}</ul>` : '<p class="empty">この期間の記録はまだありません。</p>'}</div>
      </div>
      <div class="cols">
        <div><h2>がんばったこと</h2>${good.length ? `<ul>${good.map(x => `<li>${x}</li>`).join('')}</ul>` : '<p class="empty">学習をはじめると、ここに自動でまとまります。</p>'}</div>
        <div><h2>とくいな単元・練習中の単元</h2>${strong.length || weak.length ? `${strong.map(u => `<span class="tag g">${esc(u.name)}（${u.g}年）</span>`).join('')}${weak.map(u => `<span class="tag w">${esc(u.name)}（${u.g}年）正答率${Math.round(u.acc * 100)}%</span>`).join('')}<p class="empty" style="margin:4px 0 0">むんラボのミニテストなどの正答率から集計しています。</p>` : '<p class="empty">むんラボのミニテストをすると、単元ごとの正答率がここに出ます。</p>'}</div>
      </div>
      ${showLab ? `<h2>むんラボの記録</h2><p style="font-size:12px;margin:0">${s.exp ? `EXP <b>${s.exp}</b>　` : ''}${s.trophies.length ? `この期間にもらったトロフィー：${s.trophies.slice(0, 6).map(esc).join('、')}${s.trophies.length > 6 ? ` ほか${s.trophies.length - 6}こ` : ''}` : 'この期間に新しくもらったトロフィーはありません。'}</p>` : ''}
      ${showVoice ? `<h2>おうちの方へ（声かけのヒント）</h2><ul>${voice.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}
      ${showCm ? `<h2>コメント</h2><div class="cm" style="--n:3"><div>先生より</div><div>おうちの方より</div><div>ほんにんより（がんばりたいこと）</div></div>` : ''}
      <div class="foot"><span>むん先生の学習クエスト（munmungstudymax.com）／ むんラボ</span><span>この記録は、この端末の中だけで集計しています。作成日 ${fmt(T0)}</span></div>`;
  }
  /* ---------- 操作 ---------- */
  const R = [['week', '今週'], ['last', '先週'], ['month', '今月'], ['lastm', '先月'], ['custom', '日にちを選ぶ']];
  function ui() {
    $('#r-range').innerHTML = R.map(([k, l]) => `<button type="button" data-m="${k}" class="${k === mode ? 'on' : ''}">${l}</button>`).join('');
    $$('#r-range button').forEach(b => b.addEventListener('click', () => { mode = b.dataset.m; $('#r-custom').hidden = mode !== 'custom'; ui(); render(); }));
  }
  const inp = $('#r-name'); inp.value = nm();
  inp.addEventListener('input', () => { try { localStorage.setItem(NAME_KEY, inp.value.trim()); } catch (e) {} render(); });
  $('#r-from').value = custom.from; $('#r-to').value = custom.to;
  ['#r-from', '#r-to'].forEach(s => $(s).addEventListener('change', () => { if ($('#r-from').value) custom.from = $('#r-from').value; if ($('#r-to').value) custom.to = $('#r-to').value; render(); }));
  ['#o-lab', '#o-voice', '#o-cm'].forEach(s => $(s).addEventListener('change', render));
  $('#r-print').addEventListener('click', () => { render(); update(d => { d.reports = (d.reports || 0) + 1; }); checkTrophies(); setTimeout(() => print(), 60); });
  ui(); render();
  window.__repState = () => ({ mode });
})();
</script>

<body>
<script>LAB.header({ sub: "ZUKAN" });</script>
<style>
  .zk-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .zk-sum > div { padding: 12px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
  .zk-sum > div > b { display: block; font-family: var(--mono); font-size: 1.5rem; color: var(--bright); }
  .zk-sum > div > span { font-size: .78rem; font-weight: 800; color: var(--dim); }
  .zk-bar { height: 10px; border-radius: 999px; background: var(--soft); overflow: hidden; margin: 6px 0 4px; }
  .zk-bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--cyan), var(--purple)); transition: width .6s; }
  .zk-new { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 18px; margin-bottom: 14px; border: 1px solid rgba(251,191,36,.6); background: linear-gradient(135deg, rgba(251,191,36,.18), rgba(236,72,153,.1)); }
  .zk-new .big { font-size: 1.7rem; color: #fbbf24; }
  .zk-new b { color: var(--bright); }
  .zk-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .zk-tools select { font: inherit; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); color: var(--bright); }
  .zk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .zk { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 14px 10px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--card2); color: var(--text); font: inherit; cursor: pointer; min-height: 168px; }
  .zk .ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 1.4rem; color: rgba(148,163,184,.5); background: rgba(148,163,184,.1); }
  .zk b { color: var(--dim); font-size: .88rem; line-height: 1.35; }
  .zk small { color: var(--dim); font-size: .68rem; line-height: 1.4; }
  .zk .rr { font-size: .6rem; font-weight: 900; letter-spacing: .1em; color: var(--rc, var(--dim)); }
  .zk.got { border-color: color-mix(in srgb, var(--rc) 65%, transparent); box-shadow: 0 0 14px color-mix(in srgb, var(--rc) 22%, transparent); background: linear-gradient(170deg, color-mix(in srgb, var(--rc) 12%, var(--card2)), var(--card2)); }
  .zk.got .ic { color: #0b1020; background: radial-gradient(circle at 35% 30%, #fff, var(--rc)); box-shadow: 0 0 12px var(--rc); }
  .zk.got b { color: var(--bright); }
  .zk.got.p3 { background: linear-gradient(170deg, color-mix(in srgb, var(--rc) 20%, var(--card2)), var(--card2)); }
  .zk .newtag { position: absolute; top: -7px; right: -5px; padding: 2px 8px; border-radius: 999px; background: #ec4899; color: var(--bright); font-size: .62rem; font-weight: 900; letter-spacing: .08em; animation: zkp 1.2s ease-in-out infinite; }
  @keyframes zkp { 50% { transform: scale(1.12); } }
  .zk-more { display: block; margin: 14px auto 0; }
  .zk-modal .ic { width: 84px; height: 84px; margin: 0 auto 10px; border-radius: 24px; display: grid; place-items: center; font-size: 2.2rem; color: #0b1020; background: radial-gradient(circle at 35% 30%, #fff, var(--rc)); box-shadow: 0 0 22px var(--rc); }
  .zk-modal { text-align: center; }
  .zk-modal p { color: var(--text); line-height: 1.8; }
  @media (prefers-reduced-motion: reduce) { .zk .newtag { animation: none; } .zk-bar i { transition: none; } }
</style>
<main class="wrap">
  <div class="page-title" style="--c:#a78bfa"><span class="ic"><i class="fa-solid fa-book-bookmark"></i></span><h1><small>ZUKAN // コレクション図鑑</small>むんずかん</h1><p>アプリをひらいたり、雑学カードをあつめたりすると、カードが増えていきます。ひらいた回数が多いほど、カードがレアになるよ。記録はこの端末の中だけに保存されます。</p></div>
  <div class="zk-sum" id="zk-sum"></div>
  <div id="zk-new"></div>
  <section class="panel">
    <div class="zk-tools">
      <div class="seg" id="zk-tabs"></div>
      <select id="zk-shelf" aria-label="しぼりこみ"></select>
      <label class="ck"><input type="checkbox" id="zk-only"> もっているカードだけ</label>
    </div>
    <div class="zk-grid" id="zk-grid"></div>
    <button class="btn ghost zk-more" type="button" id="zk-more" hidden>もっと見る</button>
  </section>
  <div class="btns" style="justify-content:center;margin-top:16px"><a class="btn ghost" href="./zatsugaku.html"><i class="fa-solid fa-lightbulb"></i> 今日の雑学カード</a><a class="btn ghost" href="./certificate.html"><i class="fa-solid fa-award"></i> 賞状プリンター</a></div>
</main>
<div class="lab-modal" id="zk-md" hidden><div class="box zk-modal" id="zk-box"></div></div>
<script>
(function () {
  const { $, esc, get, update, checkTrophies } = LAB;
  const Z = LAB_ZK, RAR = Z.RAR;
  const TABS = [['all', 'ぜんぶ'], ['unit', '単元'], ['person', '歴史の人物'], ['zatsu', '雑学']];
  let tab = 'all', shelf = '', only = false, shown = 60, newSet = new Set();
  const all = Z.all();
  const known = (get().zukan || {}).known;
  const first = !known;
  const knownSet = new Set(known || []);
  all.forEach(x => { if (x.got && !first && !knownSet.has(x.key)) newSet.add(x.key); });
  update(d => { d.zukan = { known: all.filter(x => x.got).map(x => x.key) }; });
  checkTrophies();

  function sum() {
    const s = Z.stats(), pct = Math.round(s.got / s.total * 100);
    $('#zk-sum').innerHTML = `<div style="grid-column:span 2"><b>${s.got} / ${s.total}</b><span>ぜんぶのカード（${pct}%）</span><div class="zk-bar"><i style="width:${pct}%"></i></div></div>`
      + `<div><b>${s.unit[0]} / ${s.unit[1]}</b><span>単元カード</span></div><div><b>${s.person[0]} / ${s.person[1]}</b><span>歴史の人物</span></div><div><b>${s.zatsu[0]} / ${s.zatsu[1]}</b><span>雑学カード</span></div>`;
    $('#zk-new').innerHTML = newSet.size ? `<div class="zk-new"><span class="big"><i class="fa-solid fa-wand-magic-sparkles"></i></span><div><b>あたらしいカードが ${newSet.size} まい 増えたよ！</b><br><small style="color:var(--text)">「NEW」がついているカードを見てみよう。</small></div></div>`
      : first ? `<div class="zk-new" style="border-color:rgba(0,229,255,.4);background:rgba(0,229,255,.08)"><span class="big" style="color:#00e5ff"><i class="fa-solid fa-book-bookmark"></i></span><div><b>むんずかんへ ようこそ！</b><br><small style="color:var(--text)">これまでに学んだことが、カードになって入っています。これからも、どんどん集めよう。</small></div></div>` : '';
  }
  function tabs() {
    $('#zk-tabs').innerHTML = TABS.map(([k, n]) => `<button type="button" data-k="${k}" class="${k === tab ? 'on' : ''}">${n}</button>`).join('');
    const list = all.filter(x => tab === 'all' || x.kind === tab), shelves = [...new Set(list.map(x => x.shelf))];
    if (shelf && !shelves.includes(shelf)) shelf = '';
    $('#zk-shelf').innerHTML = `<option value="">すべて</option>` + shelves.map(s => `<option value="${esc(s)}" ${s === shelf ? 'selected' : ''}>${esc(s)}（${list.filter(x => x.shelf === s && x.got).length}/${list.filter(x => x.shelf === s).length}）</option>`).join('');
    $('#zk-shelf').hidden = tab === 'all';
  }
  function grid() {
    let list = all.filter(x => (tab === 'all' || x.kind === tab) && (!shelf || x.shelf === shelf) && (!only || x.got));
    list.sort((a, b) => (newSet.has(b.key) - newSet.has(a.key)) || (b.got - a.got) || (b.rar - a.rar));
    const more = list.length > shown;
    $('#zk-grid').innerHTML = list.slice(0, shown).map(x => {
      const r = x.got ? RAR[x.rar] : null;
      return `<button type="button" class="zk ${x.got ? 'got p' + x.rar : ''}" data-k="${esc(x.key)}" style="--rc:${r ? r[2] : '#64748b'}">${newSet.has(x.key) ? '<span class="newtag">NEW</span>' : ''}<span class="ic"><i class="fa-solid ${x.got ? x.ic : 'fa-question'}"></i></span><b>${x.got ? esc(x.title) : '？？？'}</b><small>${x.got ? esc(x.sub) : esc(x.shelf)}</small>${x.got ? `<span class="rr">${r[1]}</span>` : ''}</button>`;
    }).join('') || '<div class="empty">まだカードがありません。アプリをひらいてみよう！</div>';
    $('#zk-more').hidden = !more; $('#zk-more').textContent = `もっと見る（のこり ${list.length - shown} まい）`;
  }
  function open(k) {
    const x = all.find(a => a.key === k); if (!x) return;
    const r = x.got ? RAR[x.rar] : null;
    const link = x.href ? `<a class="btn" href="../${esc(x.href)}"><i class="fa-solid fa-play"></i> ${x.kind === 'person' ? 'この時代を学ぶ' : 'このアプリをひらく'}</a>` : (x.kind === 'zatsu' && !x.got ? '<a class="btn" href="./zatsugaku.html"><i class="fa-solid fa-lightbulb"></i> 雑学カードをあつめる</a>' : '');
    $('#zk-box').style.setProperty('--rc', r ? r[2] : '#64748b');
    $('#zk-box').innerHTML = x.got
      ? `<div class="ic"><i class="fa-solid ${x.ic}"></i></div><small style="color:${r[2]};font-weight:900;letter-spacing:.12em">${r[1]}</small><h2>${esc(x.title)}</h2>${x.read ? `<small style="color:var(--dim)">${esc(x.read)}</small>` : ''}<p>${esc(x.desc)}</p><small style="color:var(--dim)">${esc(x.sub)}${x.kind !== 'zatsu' ? ` ／ ひらいた回数 ${x.n} 回` : ''}</small>${x.kind !== 'zatsu' && x.rar < 3 ? `<br><small style="color:var(--dim)">あと ${[3, 10, 30][x.rar] - x.n} 回ひらくと、${RAR[x.rar + 1][1]}になるよ</small>` : ''}<div class="btns" style="justify-content:center;margin-top:14px">${link}<button class="btn ghost" type="button" data-close>とじる</button></div>`
      : `<div class="ic" style="background:rgba(148,163,184,.15);box-shadow:none;color:rgba(148,163,184,.6)"><i class="fa-solid fa-question"></i></div><h2>？？？</h2><p>${esc(x.hint)}</p><div class="btns" style="justify-content:center;margin-top:14px">${link}<button class="btn ghost" type="button" data-close>とじる</button></div>`;
    $('#zk-md').hidden = false;
  }
  $('#zk-tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; tab = b.dataset.k; shelf = ''; shown = 60; tabs(); grid(); });
  $('#zk-shelf').addEventListener('change', e => { shelf = e.target.value; shown = 60; grid(); });
  $('#zk-only').addEventListener('change', e => { only = e.target.checked; shown = 60; grid(); });
  $('#zk-more').addEventListener('click', () => { shown += 60; grid(); });
  $('#zk-grid').addEventListener('click', e => { const b = e.target.closest('.zk'); if (b) open(b.dataset.k); });
  $('#zk-md').addEventListener('click', e => { if (e.target.id === 'zk-md' || e.target.closest('[data-close]')) $('#zk-md').hidden = true; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#zk-md').hidden = true; });
  sum(); tabs(); grid();
})();
</script>

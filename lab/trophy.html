<body>
<script>LAB.header({ sub: "ACHIEVEMENTS" });</script>
<style>
  .tr-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .tr-sum div { padding: 12px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
  .tr-sum b { display: block; font-family: var(--mono); font-size: 1.5rem; color: var(--bright); }
  .tr-sum span { font-size: .78rem; font-weight: 800; color: var(--rc, var(--dim)); }
  .tr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .tr { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 16px; background: var(--card2); border: 1px solid var(--line); }
  .tr .ti { width: 50px; height: 50px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 1.25rem; color: rgba(148,163,184,.5); background: rgba(148,163,184,.08); border: 2px dashed rgba(148,163,184,.3); }
  .tr b { display: block; color: var(--dim); font-size: .92rem; }
  .tr small { display: block; color: var(--dim); font-size: .74rem; line-height: 1.5; }
  .tr .rr { font-size: .64rem; font-weight: 900; letter-spacing: .08em; color: var(--rc); }
  .tr.got { border-color: color-mix(in srgb, var(--rc) 60%, transparent); box-shadow: 0 0 14px color-mix(in srgb, var(--rc) 20%, transparent); }
  .tr.got .ti { color: #0b1020; background: radial-gradient(circle at 35% 30%, #fff, var(--rc)); border: 2px solid var(--rc); box-shadow: 0 0 14px var(--rc); }
  .tr.got b { color: var(--bright); }
  @media print { .tr { break-inside: avoid; } }
</style>
<main class="wrap">
  <div class="page-title" style="--c:#f472b6"><span class="ic"><i class="fa-solid fa-trophy"></i></span><h1><small>ACHIEVEMENTS // 実績</small>実績トロフィー</h1><p>学習やむんラボでの「ちょっとすごい」をトロフィーとして記録します。レアなトロフィーほど、もらえるコインが多くなります（ブロンズ300・シルバー800・ゴールド2,000・プラチナ5,000）。</p></div>
  <div class="tr-sum" id="tr-sum"></div>
  <section class="panel"><div class="h2"><i class="fa-solid fa-book-open"></i>学習のトロフィー</div><div class="tr-grid" id="g1"></div></section>
  <section class="panel"><div class="h2"><i class="fa-solid fa-flask"></i>むんラボのトロフィー</div><div class="tr-grid" id="g2"></div></section>
  <section class="panel"><div class="h2"><i class="fa-solid fa-user-secret"></i>ひみつのトロフィー<small>とるまで、条件はひみつ</small></div><div class="tr-grid" id="g3"></div></section>
  <div class="btns" style="justify-content:center"><button class="btn ghost" type="button" id="tr-print"><i class="fa-solid fa-print"></i> トロフィー一覧を印刷</button></div>
</main>
<script>
(function () {
  const { $, esc, get, TROPHIES, RAR, checkTrophies } = LAB;
  checkTrophies();
  function draw() {
    const got = get().trophies;
    const cnt = r => TROPHIES.filter(t => t.r === r && got[t.id]).length + ' / ' + TROPHIES.filter(t => t.r === r).length;
    $('#tr-sum').innerHTML = `<div><b>${Object.keys(got).length} / ${TROPHIES.length}</b><span>ぜんぶ</span></div>` + Object.entries(RAR).map(([k, v]) => `<div style="--rc:${v.c}"><b>${cnt(k)}</b><span>${v.n}</span></div>`).join('');
    const card = t => { const g = got[t.id], r = RAR[t.r], hide = t.h && !g; return `<div class="tr ${g ? 'got' : ''}" style="--rc:${r.c}"><span class="ti"><i class="fa-solid ${g ? t.ic : hide ? 'fa-question' : 'fa-lock'}"></i></span><div><span class="rr">${r.n}・${r.coin.toLocaleString()} C</span><b>${hide ? '？？？' : esc(t.t)}</b><small>${hide ? 'ある条件で手に入る、ひみつのトロフィー' : esc(t.d)}${g ? `<br>${g.replace(/-/g, '/')} 獲得` : ''}</small></div></div>`; };
    $('#g1').innerHTML = TROPHIES.filter(t => t.g === '学習').map(card).join('');
    $('#g2').innerHTML = TROPHIES.filter(t => t.g === 'ラボ').map(card).join('');
    $('#g3').innerHTML = TROPHIES.filter(t => t.g === 'ひみつ').map(card).join('');
  }
  $('#tr-print').addEventListener('click', () => print());
  draw(); setTimeout(draw, 3000);
})();
</script>

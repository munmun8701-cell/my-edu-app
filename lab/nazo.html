      { s: '漢字', ic: 'fa-pen-nib', q: 'モニターに4つの漢字。画数（かくすう）がいちばん多いのはどれ？', t: 'choice', c: ['森', '花', '草', '林'], a: ['森'], h: ['1画ずつ数えてみよう。', '「木」が3つ入っている漢字は？', '森は12画。'], e: '森12画、草9画、林8画、花7画。', k: [4, '黄'] },

  const D = LAB_DATA;

  let cur = Math.min(openCount() - 1, Math.max(0, (get().nazoLast || 0)));

      <div class="door ${sol.size < 4 ? 'locked' : ''}" id="door">

        <p class="note" style="margin:0">MUN-OS「鍵の数字を、<b style="color:#fff">${r.order.map(c => `<span style="color:${COL[c]}">${c}</span>`).join('・')}</b> の順にならべて入力してください」</p>
        <div class="code">${[0, 1, 2, 3].map(i => `<input inputmode="numeric" maxlength="1" aria-label="${i + 1}けため" ${sol.size < 4 ? 'disabled' : ''}>`).join('')}</div>
        <button class="btn pink" type="button" id="unlock" ${sol.size < 4 ? 'disabled' : ''}><i class="fa-solid fa-unlock"></i> ロックを解除</button>
        <p class="feedback" id="door-fb">${st.cleared ? `<span style="color:#34d399">この部屋は脱出ずみ！${st.hintUsed ? '' : '（ノーヒント）'}</span>` : sol.size < 4 ? `あと ${4 - sol.size} つのなぞを解こう` : 'すべての鍵がそろった！'}</p>
      </div>`;
    $$('#room .pzc').forEach(b => b.addEventListener('click', () => puzzle(+b.dataset.i)));
    const ins = $$('#door .code input');
    ins.forEach((inp, i) => { inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g, '').slice(-1); if (inp.value && ins[i + 1]) ins[i + 1].focus(); }); inp.addEventListener('keydown', e => { if (e.key === 'Backspace' && !inp.value && ins[i - 1]) ins[i - 1].focus(); if (e.key === 'Enter') $('#unlock').click(); }); });
    $('#unlock').addEventListener('click', () => {
      const code = ins.map(x => x.value).join(''), want = r.order.map(c => r.p.find(p => p.k[1] === c).k[0]).join('');
      if (code !== want) { $('#door-fb').className = 'feedback ng'; $('#door-fb').textContent = 'ブブー！ 番号がちがいます。色の順番をよく見て。'; ins.forEach(x => { x.classList.add('ng'); setTimeout(() => x.classList.remove('ng'), 400); }); return; }
      const first = !rec(cur).cleared, noHint = !Object.keys(rec(cur).hints || {}).length;
      update(d => { const x = d.nazo['r' + (cur + 1)] || { solved: [], hints: {} }; x.cleared = x.cleared || ymdNow(); x.hintUsed = !noHint; d.nazo['r' + (cur + 1)] = x; const oc = openCount(); d.nazoAllOpen = oc >= 3 && ROOMS.slice(0, oc).every((_, i) => d.nazo['r' + (i + 1)] && d.nazo['r' + (i + 1)].cleared); });
      $('#door').classList.add('escape');
      $('#door').innerHTML = `<h3 style="font-size:1.5rem"><i class="fa-solid fa-door-open" style="color:#34d399"></i> 脱出成功！</h3><p>MUN-OS「おみごと。ロックを解除しました。${cur < ROOMS.length - 1 ? '次の部屋で、また会いましょう。' : 'あなたは研究所から脱出しました！'}」</p>${noHint ? '<p class="pill" style="color:#fbbf24">ノーヒントボーナス！</p>' : ''}`;
      if (first) reward({ coins: 600 + (noHint ? 400 : 0), exp: 30 + (noHint ? 20 : 0), reason: '脱出成功！' });
      checkTrophies(); rooms();
    });
  }
  const ymdNow = () => LAB.ymd();
  function puzzle(i) {
    const r = ROOMS[cur], p = r.p[i], st = rec(cur), solved = (st.solved || []).includes(i);
    let shown = (st.hints || {})[i] || 0;
    const m = document.createElement('div'); m.className = 'lab-modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
    const body = () => `<div class="box"><div class="q-box" style="text-align:left"><span class="q-tag" style="--c:#f472b6">なぞ${i + 1}：${esc(p.s)}</span><div class="q-text" style="font-size:1.15rem;white-space:pre-line;text-align:left">${esc(p.q)}</div>
      ${solved ? `<p class="feedback ok">解けた！ 鍵の数字は <span class="digit" style="--kc:${COL[p.k[1]]}">${p.k[0]}</span>（${p.k[1]}）</p><p class="note">${esc(p.e)}</p>`
        : p.t === 'choice' ? `<div class="choices">${p.c.map((c, k) => `<button type="button" class="choice" data-v="${esc(c)}"><span class="k">${'ABCD'[k]}</span>${esc(c)}</button>`).join('')}</div>`
        : `<div class="ans-row"><input class="ans-in" id="pz-in" ${p.t === 'num' ? 'inputmode="decimal"' : ''} autocomplete="off" placeholder="${p.t === 'num' ? '数字' : 'ひらがな'}"><button class="btn" type="button" id="pz-ok">答える</button></div>`}
      <div class="feedback" id="pz-fb" aria-live="polite"></div>
      <div id="pz-h">${p.h.slice(0, shown).map((h, k) => `<div class="hint"><i class="fa-solid fa-lightbulb"></i> ヒント${k + 1}：${esc(h)}</div>`).join('')}</div>
      <div class="btns" style="justify-content:space-between;margin-top:14px">${solved ? '<span></span>' : `<button class="btn ghost sm" type="button" id="pz-hint" ${shown >= 3 ? 'disabled' : ''}><i class="fa-solid fa-lightbulb"></i> ヒント（${shown}/3）</button>`}<button class="btn ghost sm" type="button" data-x>とじる</button></div></div></div>`;
    m.innerHTML = body(); document.body.appendChild(m);
    const close = () => { m.remove(); room(); };
    m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-x]')) close(); });
    const ok = () => {
      update(d => { const x = d.nazo['r' + (cur + 1)] || { solved: [], hints: {} }; x.solved = [...new Set([...(x.solved || []), i])]; d.nazo['r' + (cur + 1)] = x; });
      answered(true); toast(`なぞ${i + 1} 解けた！ 鍵の数字「${p.k[0]}」（${p.k[1]}）`, 'fa-key');
      setTimeout(close, 900);
    };
    const ng = () => { answered(false); const fb = $('#pz-fb', m); fb.className = 'feedback ng'; fb.textContent = 'ちがうみたい…。ヒントも使ってみよう。'; };
    $$('.choice', m).forEach(b => b.addEventListener('click', () => { if (p.a.some(a => N(a) === N(b.dataset.v))) { b.classList.add('ok'); ok(); } else { b.classList.add('ng'); ng(); } }));
    const inp = $('#pz-in', m);
    if (inp) { inp.focus(); const go = () => { const v = N(inp.value); if (!v) return; if (p.a.some(a => N(a) === v || (p.t === 'num' && Number(a) === Number(v.replace(/^\./, '0.'))))) ok(); else { inp.classList.add('ng'); setTimeout(() => inp.classList.remove('ng'), 400); ng(); } }; $('#pz-ok', m).addEventListener('click', go); inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) go(); }); }
    const hb = $('#pz-hint', m);
    if (hb) hb.addEventListener('click', () => { shown = Math.min(3, shown + 1); update(d => { const x = d.nazo['r' + (cur + 1)] || { solved: [], hints: {} }; x.hints = Object.assign({}, x.hints, { [i]: shown }); d.nazo['r' + (cur + 1)] = x; }); $('#pz-h', m).innerHTML = p.h.slice(0, shown).map((h, k) => `<div class="hint"><i class="fa-solid fa-lightbulb"></i> ヒント${k + 1}：${esc(h)}</div>`).join(''); hb.innerHTML = `<i class="fa-solid fa-lightbulb"></i> ヒント（${shown}/3）`; hb.disabled = shown >= 3; });
  }
  rooms(); room();
})();
</script>

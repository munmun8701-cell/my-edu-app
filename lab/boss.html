<style>
  .bs-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .bs-top .grow { flex: 1; }
  .arena { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 18px; align-items: center; }
  .boss-box { position: relative; text-align: center; padding: 10px; border-radius: 22px; background: radial-gradient(circle at 50% 60%, color-mix(in srgb, var(--bc) 25%, transparent), transparent 65%); transition: background .4s; }
  .boss-box.rage { background: radial-gradient(circle at 50% 60%, rgba(239,68,68,.35), transparent 65%); }
  .boss-svg { width: min(320px, 100%); height: auto; animation: bob 2.6s ease-in-out infinite; transform-origin: 50% 80%; filter: drop-shadow(0 10px 18px var(--soft)); }
  .rage .boss-svg { animation: bob 1.1s ease-in-out infinite; filter: drop-shadow(0 0 14px rgba(239,68,68,.9)); }
  .boss-svg.hit { animation: hit .35s; }
  .boss-svg.dead { animation: dead 1.4s forwards; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes hit { 0% { filter: brightness(3) saturate(0); transform: translateX(-10px) rotate(-4deg); } 50% { transform: translateX(10px) rotate(4deg); } 100% { filter: none; transform: none; } }
  @keyframes dead { 30% { transform: scale(1.15); filter: brightness(3); } to { transform: scale(.1) rotate(40deg); opacity: 0; filter: brightness(5); } }
  .boss-name { font-weight: 900; color: var(--bright); font-size: 1.2rem; }
  .boss-line { color: var(--dim); font-size: .85rem; margin: 2px 0 8px; min-height: 1.3em; }
  .rage .boss-line { color: #fca5a5; font-weight: 900; }
  .hp { position: relative; height: 24px; border-radius: 999px; background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.5); overflow: hidden; }
  .hp > i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #ef4444, #f97316); transition: width .45s cubic-bezier(.2,.8,.2,1); }
  .hp > b { position: absolute; inset: 0 auto 0 0; background: rgba(255,255,255,.55); transition: width 1.1s .35s ease; }
  .hp span { position: relative; z-index: 1; display: block; text-align: center; font-family: var(--mono); font-weight: 700; font-size: .82rem; line-height: 24px; color: var(--bright); text-shadow: 0 1px 2px #000; }
  .combo { font-family: var(--mono); font-weight: 700; color: #fde047; font-size: 1.15rem; min-height: 1.5em; margin-top: 6px; }
  .combo.big { font-size: 1.5rem; color: #f472b6; text-shadow: 0 0 12px #ec4899; }
  .shield { color: #f87171; font-weight: 900; }
  body.class-mode .wrap { max-width: 1500px; }
  body.class-mode .q-text { font-size: clamp(1.7rem, 4vw, 3rem); }
  body.class-mode .choice { font-size: clamp(1.1rem, 2.4vw, 1.7rem); min-height: 86px; }
  body.class-mode .boss-svg { width: min(440px, 100%); }
  body.class-mode .page-title { display: none; }
  .tbar { height: 10px; border-radius: 999px; background: rgba(148,163,184,.2); overflow: hidden; margin-top: 12px; }
  .tbar > i { display: block; height: 100%; background: linear-gradient(90deg, #fbbf24, #f97316); width: 100%; transition: width .1s linear; }
  .tnum { font-family: var(--mono); font-weight: 700; font-size: 1.4rem; color: #fde047; }
  .teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
  .team { padding: 12px; border-radius: 16px; background: var(--card2); border: 2px solid color-mix(in srgb, var(--tc) 60%, transparent); text-align: center; }
  .team b { display: block; color: var(--tc); font-size: 1.05rem; }
  .team .pt { font-family: var(--mono); font-size: 1.6rem; color: var(--bright); font-weight: 700; }
  .team .str { font-size: .78rem; font-weight: 800; color: var(--dim); }
  .team-tg { cursor: pointer; font: inherit; color: var(--text); }
  .team-tg.on { background: color-mix(in srgb, var(--tc) 28%, transparent); border-color: var(--tc); box-shadow: 0 0 16px color-mix(in srgb, var(--tc) 50%, transparent); }
  .team-tg.on::after { content: "せいかい！"; display: block; color: var(--bright); font-weight: 900; font-size: .8rem; }
  .setup { display: grid; gap: 10px; }
  .setup .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .setup input { padding: 10px 12px; border-radius: 12px; border: 2px solid var(--tc); background: var(--bg2); color: var(--bright); font: inherit; font-weight: 800; width: 160px; }
  .rank-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; background: var(--card2); margin-top: 8px; }
  .rank-row .no { font-family: var(--mono); font-size: 1.4rem; font-weight: 700; width: 2em; color: var(--gold); }
  .rank-row b { color: var(--tc); flex: 1; text-align: left; }
  #print-area { display: none; }
  @media print { body > *:not(#print-area) { display: none !important; } #print-area { display: block !important; color: #000; text-align: center; font-family: "BIZ UDPGothic", sans-serif; }
    #print-area .cert { border: 6px double #000; padding: 40pt 30pt; margin: 20pt; } #print-area h1 { font-size: 34pt; letter-spacing: .3em; margin: 0 0 20pt; } #print-area p { font-size: 16pt; line-height: 2; } #print-area table { margin: 10pt auto; border-collapse: collapse; font-size: 14pt; } #print-area td { border: 1px solid #000; padding: 4pt 14pt; } }
  @media (max-width: 820px) { .arena { grid-template-columns: minmax(0, 1fr); } }
</style>
<main class="wrap">
  <div class="page-title" style="--c:#ec4899"><span class="ic"><i class="fa-solid fa-dragon"></i></span><h1><small>WEEKLY BOSS // 週替わりボス</small>週替わりボス戦</h1><p>毎週月曜日に新しいボスがあらわれます。正解でダメージ、連続正解でコンボ、5コンボからはクリティカル！ 教室の大画面では「みんなで」「チーム対戦」で、クラス全員で戦えます。</p></div>
  <div class="bs-top">
    <div class="seg" style="--c:#ec4899" id="mode"><button class="on" data-m="solo" type="button"><i class="fa-solid fa-user"></i> ひとりで</button><button data-m="class" type="button"><i class="fa-solid fa-people-group"></i> みんなで</button><button data-m="team" type="button"><i class="fa-solid fa-flag"></i> チーム対戦</button><button data-m="practice" type="button"><i class="fa-solid fa-dumbbell"></i> 練習</button></div>
    <span class="grow"></span>
    <button class="btn ghost sm" type="button" id="fs" hidden><i class="fa-solid fa-expand"></i> 全画面</button>
  </div>
  <div class="bs-top">
    <div class="seg" style="--c:#00e5ff" id="grade"></div>
    <div class="seg" style="--c:#a78bfa" id="subj"></div>
    <div class="seg" style="--c:#fbbf24" id="tsel" hidden></div>
  </div>
  <section class="panel"><div class="arena" id="arena"></div></section>
</main>
<div id="print-area"></div>
<script>
(function () {
  const { $, $$, esc, get, update, reward, question, renderChoice, weekNo, weekKey, checkTrophies, toast, myGrade, FX } = LAB;
  const BS = LAB_DATA.BOSSES, B = BS[((weekNo() % BS.length) + BS.length) % BS.length];
  const TC = ['#00e5ff', '#f472b6', '#fbbf24', '#34d399'];
  function svg(b) {
    const c = b.c, c2 = b.c2, eye = '<circle cx="-18" cy="0" r="9" fill="#fff"/><circle cx="18" cy="0" r="9" fill="#fff"/><circle cx="-16" cy="2" r="4.5" fill="#0b1020"/><circle cx="20" cy="2" r="4.5" fill="#0b1020"/><path d="M-30 -14l18 6M30 -14l-18 6" stroke="#0b1020" stroke-width="4" stroke-linecap="round"/>';
    const body = {
      dragon: `<path d="M40 120q-30-40 10-70l-30-30 50 18q30-20 60 0l50-18-30 30q40 30 10 70z" fill="${c}"/><path d="M60 150q50 20 100 0l-10-30h-80z" fill="${c2}"/><path d="M30 60l-28-24 10 40zM190 60l28-24-10 40z" fill="${c2}"/><g transform="translate(110 80)">${eye}</g><path d="M88 106q22 12 44 0" stroke="#fff" stroke-width="4" fill="none"/><path d="M94 106l4 8 4-8M118 106l4 8 4-8" fill="#fff"/>`,
      golem: `<rect x="40" y="40" width="140" height="120" rx="18" fill="${c}"/><rect x="18" y="80" width="30" height="70" rx="10" fill="${c2}"/><rect x="172" y="80" width="30" height="70" rx="10" fill="${c2}"/><path d="M60 60h30v12H60zM130 120h30v10h-30z" fill="${c2}" opacity=".6"/><g transform="translate(110 92)">${eye}</g><rect x="88" y="120" width="44" height="8" rx="4" fill="#0b1020"/>`,
      ghost: `<path d="M40 160V90a70 70 0 0 1 140 0v70l-20-14-20 14-20-14-20 14-20-14-20 14z" fill="${c}" opacity=".9"/><g transform="translate(110 92)">${eye}</g><ellipse cx="110" cy="124" rx="12" ry="9" fill="#0b1020"/>`,
      kraken: `<ellipse cx="110" cy="80" rx="70" ry="58" fill="${c}"/>${[30, 60, 90, 130, 160, 190].map((x, i) => `<path d="M${x} 120q${i % 2 ? 10 : -10} 30 ${i % 2 ? -6 : 6} 50" stroke="${c2}" stroke-width="14" fill="none" stroke-linecap="round"/>`).join('')}<g transform="translate(110 76)">${eye}</g><path d="M92 104q18 10 36 0" stroke="#0b1020" stroke-width="4" fill="none"/>`,
      mecha: `<rect x="50" y="34" width="120" height="96" rx="14" fill="${c}"/><rect x="66" y="56" width="88" height="40" rx="8" fill="#0b1020"/><circle cx="90" cy="76" r="9" fill="#ef4444"/><circle cx="130" cy="76" r="9" fill="#ef4444"/><rect x="104" y="12" width="12" height="24" fill="${c2}"/><circle cx="110" cy="10" r="7" fill="#fde047"/><rect x="60" y="132" width="100" height="34" rx="8" fill="${c2}"/><rect x="20" y="70" width="28" height="60" rx="8" fill="${c2}"/><rect x="172" y="70" width="28" height="60" rx="8" fill="${c2}"/><path d="M80 110h60" stroke="#00e5ff" stroke-width="4" stroke-dasharray="6 4"/>`,
      slime: `<path d="M30 160q0-110 80-110t80 110z" fill="${c}"/><path d="M80 34l10-22 20 16 20-16 10 22z" fill="#fbbf24"/><circle cx="70" cy="80" r="8" fill="#fff" opacity=".5"/><g transform="translate(110 108)">${eye}</g><path d="M96 134q14 8 28 0" stroke="#0b1020" stroke-width="4" fill="none"/>`
    }[b.type];
    return `<svg class="boss-svg" id="boss-svg" viewBox="0 0 220 180" role="img" aria-label="${esc(b.name)}">${body}</svg>`;
  }
  const RAGE = ['まだまだぁ！', 'ゆるさないぞ…！', '本気を見せてやる！'];
  let mode = 'solo', grade = 'mix', subj = null, combo = 0, hpv = B.hp, q = null, timer = null, limit = 20, asked = 0, okN = 0, teams = [], raged = false;
  const wk = weekKey();
  const W = () => get().boss[wk] || { dmg: 0, defeated: false, best: 0 };
  // ---- 上の選択
  $('#grade').innerHTML = [['mix', myGrade() ? `わたしの学年（${myGrade()}年）` : 'ミックス'], [1, '1年'], [2, '2年'], [3, '3年'], [4, '4年'], [5, '5年'], [6, '6年']].map(([g, n]) => `<button type="button" data-g="${g}" class="${g === 'mix' ? 'on' : ''}">${n}</button>`).join('');
  $$('#grade button').forEach(b => b.addEventListener('click', () => { grade = b.dataset.g === 'mix' ? 'mix' : +b.dataset.g; $$('#grade button').forEach(x => x.classList.toggle('on', x === b)); if (!$('#teamset')) next(); }));
  $('#subj').innerHTML = [['', 'ぜんぶの教科'], ...LAB_Q.SUBJ.map(s => [s, s])].map(([s, n]) => `<button type="button" data-s="${s}" class="${!s ? 'on' : ''}">${n}</button>`).join('');
  $$('#subj button').forEach(b => b.addEventListener('click', () => { subj = b.dataset.s ? [b.dataset.s] : null; $$('#subj button').forEach(x => x.classList.toggle('on', x === b)); if (!$('#teamset')) next(); }));
  $('#tsel').innerHTML = '<span class="note" style="margin:0 6px 0 4px">考える時間</span>' + [[10, '10秒'], [20, '20秒'], [30, '30秒'], [0, 'なし']].map(([t, n]) => `<button type="button" data-t="${t}" class="${t === 20 ? 'on' : ''}">${n}</button>`).join('');
  $$('#tsel button').forEach(b => b.addEventListener('click', () => { limit = +b.dataset.t; $$('#tsel button').forEach(x => x.classList.toggle('on', x === b)); }));
  $$('#mode button').forEach(b => b.addEventListener('click', () => { mode = b.dataset.m; $$('#mode button').forEach(x => x.classList.toggle('on', x === b)); FX().play('tap'); build(); }));
  $('#fs').addEventListener('click', () => FX().fullscreen());
  const opts = () => ({ choice: true, subj });
  const hpNow = () => mode === 'solo' ? Math.max(0, B.hp - W().dmg) : hpv;
  function build() {
    clearInterval(timer);
    const big = mode === 'class' || mode === 'team';
    document.body.classList.toggle('class-mode', big); $('#fs').hidden = !big; $('#tsel').hidden = !big;
    combo = 0; hpv = B.hp; asked = 0; okN = 0; raged = false;
    $('#arena').innerHTML = `<div class="boss-box" id="bbox" style="--bc:${B.c}"><p class="note" style="margin:0">今週のボス（${{ solo: 'ひとりで', class: 'みんなで', team: 'チーム対戦', practice: '練習・記録なし' }[mode]}）</p>${svg(B)}<div class="boss-name">${esc(B.name)}</div><div class="boss-line" id="bline">「${esc(B.line)}」</div><div class="hp"><b id="hp-b"></b><i id="hp-i"></i><span id="hp-t"></span></div><div class="combo" id="combo"></div><div id="tm-board"></div></div><div id="qarea"></div>`;
    hp(true); FX().play('boss');
    if (mode === 'solo' && W().defeated) return won(true);
    if (mode === 'team') return teamSetup();
    next();
  }
  function hp(init) {
    const h = hpNow(), pc = h / B.hp * 100;
    $('#hp-i').style.width = pc + '%'; if (init) $('#hp-b').style.width = pc + '%'; else setTimeout(() => { const b = $('#hp-b'); if (b) b.style.width = pc + '%'; }, 30);
    $('#hp-t').textContent = `HP ${h.toLocaleString()} / ${B.hp.toLocaleString()}`;
    const cb = $('#combo'); cb.className = 'combo' + (combo >= 5 ? ' big' : ''); cb.innerHTML = combo >= 2 ? `${combo} COMBO!${combo >= 5 ? ' <small>CRITICAL</small>' : ''}` : '';
    if (!raged && h > 0 && h <= B.hp / 2) { raged = true; $('#bbox').classList.add('rage'); $('#bline').textContent = `「${RAGE[weekNo() % RAGE.length]}」（怒りモード：HPが半分を切った！）`; FX().play('boss'); }
  }
  function hit(n, crit) {
    const s = $('#boss-svg'); s.classList.remove('hit'); void s.offsetWidth; s.classList.add('hit');
    FX().pop(s, (crit ? 'CRITICAL! ' : '') + '-' + n, null, crit ? 'big' : ''); FX().play(crit ? 'crit' : 'hit'); FX().shake($('#bbox')); if (crit) FX().flash('#fde047');
  }
  const dmgOf = (base, step, cap) => { const crit = combo >= 5; let n = Math.min(cap, base + (combo - 1) * step); if (crit) n = Math.round(n * 1.5); return [n, crit]; };
  function bossAttack(msg) { combo = 0; hp(); $('#combo').innerHTML = `<span class="shield">${msg}</span>`; FX().shake($('.wrap')); FX().flash('#ef4444'); }
  function next() {
    clearInterval(timer);
    if (hpNow() <= 0) return won();
    q = question(grade, opts());
    const qa = $('#qarea');
    if (mode === 'solo' || mode === 'practice') {
      renderChoice(qa, q, ok => {
        asked++;
        if (ok) {
          okN++; combo++; FX().play('combo', combo); const [n, crit] = dmgOf(100, 20, 300);
          if (mode === 'solo') update(d => { const x = d.boss[wk] || { dmg: 0, defeated: false, best: 0 }; x.dmg += n; x.best = Math.max(x.best || 0, combo); d.boss[wk] = x; d.bestCombo = Math.max(d.bestCombo || 0, combo); });
          else hpv = Math.max(0, hpv - n);
          hit(n, crit); hp(); if (mode === 'solo') LAB.track('boss'); if (combo === 10 || combo === 20) checkTrophies();
        } else bossAttack('ボスの反撃！ コンボがリセット');
        if (mode === 'practice' && hpv <= 0) { toast('練習でもボスをたおした！ もう一度出てくるよ', 'fa-crown'); FX().play('win'); hpv = B.hp; raged = false; $('#bbox').classList.remove('rage'); setTimeout(() => hp(true), 400); }
        setTimeout(next, ok ? 750 : 2200);
      }, { explainOk: false });
    } else bigQ(qa);
  }
  /* ---- 大画面（みんなで・チーム） */
  function bigQ(qa) {
    const isTeam = mode === 'team';
    qa.innerHTML = `<div class="q-box"><span class="q-tag">${esc(q.s)}${q.g ? `・${q.g}年` : ''}${q.un ? `<em>${esc(q.un)}</em>` : ''}</span><div class="q-text">${esc(q.q)}</div><div class="choices">${q.choices.map((c, i) => `<div class="choice" data-v="${esc(c)}"><span class="k">${'ABCD'[i]}</span>${esc(c)}</div>`).join('')}</div>
      ${limit ? `<div class="tbar"><i id="tb"></i></div><div class="tnum" id="tn">${limit}</div>` : ''}
      <div class="btns" style="justify-content:center;margin-top:14px" id="ctl"><button class="btn gold lg" type="button" id="reveal"><i class="fa-solid fa-eye"></i> 答えを見せる</button></div><div class="feedback" id="cfb"></div></div>`;
    if (limit) {
      let t = limit; const tb = $('#tb'), tn = $('#tn');
      timer = setInterval(() => { t = Math.max(0, t - .1); tb.style.width = (t / limit * 100) + '%'; const s = Math.ceil(t); if (tn.textContent != s) { tn.textContent = s; if (s <= 5 && s > 0) FX().play('tick'); } if (t <= 0) { clearInterval(timer); FX().play('go'); tn.textContent = 'そこまで！'; } }, 100);
    }
    $('#reveal').addEventListener('click', () => {
      clearInterval(timer); asked++; update(d => { d.classQ = (d.classQ || 0) + 1; });
      $$('#qarea .choice').forEach(x => { if (LAB.check(q, x.dataset.v)) x.classList.add('ok'); });
      FX().play('ok'); $('#cfb').innerHTML = `<span style="color:#34d399">答え：${esc(q.a)}</span>${q.e ? `<span class="ex">${esc(q.e)}</span>` : ''}`;
      if (!isTeam) {
        $('#ctl').innerHTML = `<button class="btn lg" type="button" id="cok"><i class="fa-solid fa-burst"></i> 正解が多かった！</button><button class="btn ghost" type="button" id="cng">まちがいが多かった</button>`;
        $('#cok').addEventListener('click', () => { okN++; combo++; const [n, crit] = dmgOf(150, 25, 400); hpv = Math.max(0, hpv - n); hit(n, crit); hp(); setTimeout(next, 900); });
        $('#cng').addEventListener('click', () => { bossAttack('ボスの反撃！ 次でとりかえそう'); setTimeout(next, 1300); });
      } else {
        $('#ctl').innerHTML = `<div style="width:100%"><p class="note" style="margin:0 0 6px">正解したチームをタッチして「ダメージ！」</p><div class="teams">${teams.map((t, i) => `<button type="button" class="team team-tg" style="--tc:${t.c}" data-i="${i}"><b>${esc(t.n)}</b></button>`).join('')}</div><div class="btns" style="justify-content:center;margin-top:12px"><button class="btn lg" type="button" id="tok"><i class="fa-solid fa-burst"></i> ダメージ！</button></div></div>`;
        $$('#ctl .team-tg').forEach(b => b.addEventListener('click', () => { b.classList.toggle('on'); FX().play('tap'); }));
        $('#tok').addEventListener('click', () => {
          const on = $$('#ctl .team-tg.on').map(b => +b.dataset.i); let total = 0, any = false;
          teams.forEach((t, i) => { if (on.includes(i)) { t.st++; t.ok++; const n = Math.min(300, 100 + (t.st - 1) * 25); t.pt += n; total += n; any = true; } else t.st = 0; });
          if (any) { okN++; combo++; hpv = Math.max(0, hpv - total); hit(total, on.length === teams.length); hp(); } else bossAttack('どのチームも正解できず…ボスの反撃！');
          board(); setTimeout(next, any ? 1000 : 1400);
        });
      }
    });
  }
  function board() {
    const el = $('#tm-board'); if (!el) return;
    el.innerHTML = mode === 'team' && teams.length ? `<div class="teams">${teams.map(t => `<div class="team" style="--tc:${t.c}"><b>${esc(t.n)}</b><div class="pt">${t.pt.toLocaleString()}</div><div class="str">${t.st >= 2 ? `${t.st}連続正解！` : '&nbsp;'}</div></div>`).join('')}</div>` : '';
  }
  function teamSetup() {
    const n0 = 4; teams = Array.from({ length: n0 }, (_, i) => ({ n: `チーム${'ABCD'[i]}`, c: TC[i], pt: 0, st: 0, ok: 0 }));
    const draw = () => {
      $('#qarea').innerHTML = `<div class="setup" id="teamset"><div class="h2" style="--c:#fbbf24"><i class="fa-solid fa-flag"></i>チーム対戦の準備</div>
        <div class="row"><span class="note" style="margin:0">チームの数</span><div class="seg" style="--c:#fbbf24" id="tn-sel">${[2, 3, 4].map(n => `<button type="button" data-n="${n}" class="${teams.length === n ? 'on' : ''}">${n}チーム</button>`).join('')}</div></div>
        ${teams.map((t, i) => `<div class="row" style="--tc:${t.c}"><i class="fa-solid fa-flag" style="color:${t.c}"></i><input data-i="${i}" value="${esc(t.n)}" maxlength="10" aria-label="チーム${i + 1}の名前"></div>`).join('')}
        <p class="note" style="margin:0">名前は自由に変えられます（班の名前など）。児童の名前は入れないでください。記録はこの画面の中だけです。</p>
        <div class="btns"><button class="btn lg" type="button" id="tgo"><i class="fa-solid fa-play"></i> 戦いをはじめる</button></div></div>`;
      $$('#tn-sel button').forEach(b => b.addEventListener('click', () => { const n = +b.dataset.n; teams = Array.from({ length: n }, (_, i) => teams[i] || { n: `チーム${'ABCD'[i]}`, c: TC[i], pt: 0, st: 0, ok: 0 }); draw(); }));
      $$('#teamset input').forEach(inp => inp.addEventListener('input', () => { teams[+inp.dataset.i].n = inp.value.trim() || `チーム${'ABCD'[+inp.dataset.i]}`; }));
      $('#tgo').addEventListener('click', () => { update(d => { d.teams = (d.teams || 0) + 1; }); board(); FX().play('go'); next(); });
    };
    draw();
  }
  function won(already) {
    clearInterval(timer);
    const s = $('#boss-svg'); if (s) s.classList.add('dead');
    if (!already) { FX().play('defeat'); FX().flash('#fff'); }
    const first = mode === 'solo' && !W().defeated;
    if (mode === 'solo' && first) { update(d => { const x = d.boss[wk] || { dmg: B.hp }; x.defeated = LAB.ymd(); d.boss[wk] = x; d.bossKills = (d.bossKills || 0) + 1; }); reward({ coins: 1000, exp: 50, reason: 'ボス撃破！' }); }
    if (mode === 'class' || mode === 'team') update(d => { d.classKills = (d.classKills || 0) + 1; });
    if (!already) setTimeout(() => FX().celebrate({ kicker: 'BOSS DEFEATED', title: `${esc(B.name)} をたおした！`, sub: mode === 'solo' ? '今週のボス撃破！ +1,000 C' : mode === 'team' ? 'チームの力で勝利！' : 'クラスのみんなの力で勝利！', icon: 'fa-crown', color: '#fbbf24', big: true }), 900);
    checkTrophies();
    const rate = asked ? Math.round(okN / asked * 100) : 0;
    const ranking = mode === 'team' ? teams.map((t, i) => Object.assign({ i }, t)).sort((a, b) => b.pt - a.pt) : [];
    $('#qarea').innerHTML = `<div class="q-box"><div class="q-text" style="font-size:1.8rem"><i class="fa-solid fa-crown" style="color:#fbbf24"></i> ${already ? '今週のボスは、もうたおしたよ！' : 'ボスをたおした！'}</div>
      ${asked ? `<p class="note">${asked}問中 ${okN}問 正解（${rate}%）</p>` : ''}
      ${ranking.map((t, k) => `<div class="rank-row" style="--tc:${t.c}"><span class="no">${k + 1}</span><b>${esc(t.n)}</b><span class="tnum">${t.pt.toLocaleString()}</span><span class="note" style="margin:0">正解${t.ok}</span></div>`).join('')}
      <p class="note">${mode === 'solo' ? '来週の月曜日に、新しいボスがあらわれます。' : ''}</p>
      <div class="btns" style="justify-content:center">${mode === 'solo' ? '<button class="btn ghost" type="button" id="prac">練習モードでつづける</button>' : '<button class="btn" type="button" id="again"><i class="fa-solid fa-rotate"></i> もう一度たたかう</button>'}${(mode === 'class' || mode === 'team') && !already ? '<button class="btn ghost" type="button" id="cert"><i class="fa-solid fa-print"></i> 認定証を印刷</button>' : ''}</div></div>`;
    const p = $('#prac'); if (p) p.addEventListener('click', () => { $$('#mode button').forEach(x => x.classList.toggle('on', x.dataset.m === 'practice')); mode = 'practice'; build(); });
    const a = $('#again'); if (a) a.addEventListener('click', build);
    const c = $('#cert'); if (c) c.addEventListener('click', () => {
      const d = new Date();
      $('#print-area').innerHTML = `<div class="cert"><h1>認 定 証</h1><p style="font-size:20pt">年　　組　のみなさん</p><p>あなたたちは、むんラボの週替わりボス<br><b style="font-size:22pt">「${esc(B.name)}」</b><br>をクラスの力をあわせてたおしました。<br>その知識とチームワークをたたえ、ここに認定します。</p>
        ${asked ? `<p>${asked}問中 ${okN}問 正解</p>` : ''}${ranking.length ? `<table>${ranking.map((t, k) => `<tr><td>${k + 1}位</td><td>${esc(t.n)}</td><td>${t.pt.toLocaleString()}ダメージ</td></tr>`).join('')}</table>` : ''}
        <p>${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日</p><p>むん先生の学習クエスト　むんラボ</p></div>`;
      setTimeout(() => print(), 50);
    });
  }
  build();
})();
</script>

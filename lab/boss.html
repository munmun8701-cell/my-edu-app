<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>週替わりボス戦｜むんラボ｜むん先生の学習クエスト</title>
  <meta name="description" content="問題に正解してボスにダメージ。大画面でクラス全員でも戦えます。">
  <link rel="canonical" href="https://www.munmungstudymax.com/lab/boss.html">
  <meta name="theme-color" content="#050914">
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta property="og:title" content="週替わりボス戦｜むんラボ｜むん先生の学習クエスト">
  <meta property="og:description" content="問題に正解してボスにダメージ。大画面でクラス全員でも戦えます。">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./lab.css">
  <script src="./lab-cards.js"></script>
  <script src="./lab-data.js"></script>
  <script src="./lab-avatar.js"></script>
  <script src="./lab-core.js"></script>
</head>
<body>
<script>LAB.header({ sub: "WEEKLY BOSS" });</script>
<style>
  .bs-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .arena { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 18px; align-items: center; }
  .boss-box { position: relative; text-align: center; padding: 10px; border-radius: 22px; background: radial-gradient(circle at 50% 60%, color-mix(in srgb, var(--bc) 25%, transparent), transparent 65%); }
  .boss-svg { width: min(320px, 100%); height: auto; animation: bob 2.6s ease-in-out infinite; transform-origin: 50% 80%; }
  .boss-svg.hit { animation: hit .35s; }
  .boss-svg.dead { animation: dead 1.2s forwards; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes hit { 0% { filter: brightness(3) saturate(0); transform: translateX(-8px) rotate(-3deg); } 50% { transform: translateX(8px) rotate(3deg); } 100% { filter: none; transform: none; } }
  @keyframes dead { to { transform: scale(.2) rotate(30deg); opacity: 0; filter: brightness(4); } }
  .boss-name { font-weight: 900; color: #fff; font-size: 1.2rem; }
  .boss-line { color: var(--dim); font-size: .85rem; margin: 2px 0 8px; }
  .hp { position: relative; height: 22px; border-radius: 999px; background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.5); overflow: hidden; }
  .hp > i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #ef4444, #f97316); transition: width .4s ease; }
  .hp span { position: relative; z-index: 1; display: block; text-align: center; font-family: var(--mono); font-weight: 700; font-size: .8rem; line-height: 22px; color: #fff; }
  .dmg { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); font-family: var(--mono); font-weight: 700; font-size: 2.4rem; color: #fde047; text-shadow: 0 0 14px #f97316; pointer-events: none; animation: pop .9s forwards; }
  @keyframes pop { from { opacity: 1; transform: translate(-50%, 0) scale(1.2); } to { opacity: 0; transform: translate(-50%, -60px) scale(.9); } }
  .combo { font-family: var(--mono); font-weight: 700; color: #fde047; font-size: 1.1rem; min-height: 1.4em; }
  .shield { color: #f87171; font-weight: 900; }
  body.class-mode .wrap { max-width: 1400px; }
  body.class-mode .q-text { font-size: clamp(1.6rem, 4vw, 2.6rem); }
  body.class-mode .choice { font-size: 1.4rem; min-height: 80px; }
  body.class-mode .boss-svg { width: min(420px, 100%); }
  .tbar { height: 8px; border-radius: 999px; background: rgba(148,163,184,.2); overflow: hidden; margin-top: 10px; }
  .tbar > i { display: block; height: 100%; background: var(--gold); width: 100%; }
  @media (max-width: 820px) { .arena { grid-template-columns: 1fr; } }
</style>
<main class="wrap">
  <div class="page-title" style="--c:#ec4899"><span class="ic"><i class="fa-solid fa-dragon"></i></span><h1><small>WEEKLY BOSS // 週替わりボス</small>週替わりボス戦</h1><p>毎週月曜日に新しいボスがあらわれます。問題に正解するとボスにダメージ、連続正解でコンボ！ 「みんなで」モードなら、教室の大画面でクラス全員で戦えます。</p></div>
  <div class="bs-top">
    <div class="seg" style="--c:#ec4899" id="mode"><button class="on" data-m="solo" type="button"><i class="fa-solid fa-user"></i> ひとりで</button><button data-m="class" type="button"><i class="fa-solid fa-people-group"></i> みんなで（大画面）</button></div>
    <div class="seg" style="--c:#00e5ff" id="grade"></div>
  </div>
  <section class="panel"><div class="arena" id="arena"></div></section>
</main>
<script>
(function () {
  const { $, $$, esc, get, update, reward, question, renderChoice, weekNo, weekKey, checkTrophies, toast } = LAB;
  const BS = LAB_DATA.BOSSES, B = BS[((weekNo() % BS.length) + BS.length) % BS.length];
  function svg(b) {
    const c = b.c, c2 = b.c2, eye = '<circle cx="-18" cy="0" r="9" fill="#fff"/><circle cx="18" cy="0" r="9" fill="#fff"/><circle cx="-16" cy="2" r="4.5" fill="#0b1020"/><circle cx="20" cy="2" r="4.5" fill="#0b1020"/><path d="M-30 -14l18 6M30 -14l-18 6" stroke="#0b1020" stroke-width="4" stroke-linecap="round"/>';
    const body = {
      dragon: `<path d="M40 120q-30-40 10-70l-30-30 50 18q30-20 60 0l50-18-30 30q40 30 10 70z" fill="${c}"/><path d="M60 150q50 20 100 0l-10-30h-80z" fill="${c2}"/><path d="M30 60l-28-24 10 40zM190 60l28-24-10 40z" fill="${c2}"/><g transform="translate(110 80)">${eye}</g><path d="M88 106q22 12 44 0" stroke="#fff" stroke-width="4" fill="none"/><path d="M94 106l4 8 4-8M118 106l4 8 4-8" fill="#fff"/>`,
      golem: `<rect x="40" y="40" width="140" height="120" rx="18" fill="${c}"/><rect x="18" y="80" width="30" height="70" rx="10" fill="${c2}"/><rect x="172" y="80" width="30" height="70" rx="10" fill="${c2}"/><path d="M60 60h30v12H60zM130 120h30v10h-30z" fill="${c2}" opacity=".6"/><g transform="translate(110 92)">${eye}</g><rect x="88" y="120" width="44" height="8" rx="4" fill="#0b1020"/>`,
      ghost: `<path d="M40 160V90a70 70 0 0 1 140 0v70l-20-14-20 14-20-14-20 14-20-14-20 14z" fill="${c}" opacity=".9"/><g transform="translate(110 92)">${eye}</g><ellipse cx="110" cy="124" rx="12" ry="9" fill="#0b1020"/>`,
      kraken: `<ellipse cx="110" cy="80" rx="70" ry="58" fill="${c}"/>${[30, 60, 90, 130, 160, 190].map((x, i) => `<path d="M${x} 120q${i % 2 ? 10 : -10} 30 ${i % 2 ? -6 : 6} 50" stroke="${c2}" stroke-width="14" fill="none" stroke-linecap="round"/>`).join('')}<g transform="translate(110 76)">${eye}</g><path d="M92 104q18 10 36 0" stroke="#0b1020" stroke-width="4" fill="none"/>`,
      mecha: `<rect x="50" y="34" width="120" height="96" rx="14" fill="${c}"/><rect x="66" y="56" width="88" height="40" rx="8" fill="#0b1020"/><circle cx="90" cy="76" r="9" fill="#ef4444"/><circle cx="130" cy="76" r="9" fill="#ef4444"/><rect x="104" y="12" width="12" height="24" fill="${c2}"/><circle cx="110" cy="10" r="7" fill="#fde047"/><rect x="60" y="132" width="100" height="34" rx="8" fill="${c2}"/><rect x="20" y="70" width="28" height="60" rx="8" fill="${c2}"/><rect x="172" y="70" width="28" height="60" rx="8" fill="${c2}"/><path d="M80 110h60" stroke="#00e5ff" stroke-width="4" stroke-dasharray="6 4"/>`,
      slime: `<path d="M30 160q0-110 80-110t80 110z" fill="${c}"/><path d="M80 34l10-22 20 16 20-16 10 22z" fill="#fbbf24"/><circle cx="70" cy="80" r="8" fill="#fff" opacity=".5"/><g transform="translate(110 108)">${eye}</g><path d="M96 134q14 8 28 0" stroke="#0b1020" stroke-width="4" fill="none"/>`
    }[b.type];
    return `<svg class="boss-svg" id="boss-svg" viewBox="0 0 220 180" role="img" aria-label="${esc(b.name)}">${body}</svg>`;
  }
  let mode = 'solo', grade = 'mix', combo = 0, classHP = B.hp, q = null, timer = null;
  const wk = weekKey();
  const W = () => get().boss[wk] || { dmg: 0, defeated: false, best: 0 };
  $('#grade').innerHTML = [['mix', 'ミックス'], [1, '1年'], [2, '2年'], [3, '3年'], [4, '4年'], [5, '5年'], [6, '6年']].map(([g, n]) => `<button type="button" data-g="${g}" class="${g === 'mix' ? 'on' : ''}">${n}</button>`).join('');
  $$('#grade button').forEach(b => b.addEventListener('click', () => { grade = b.dataset.g === 'mix' ? 'mix' : +b.dataset.g; $$('#grade button').forEach(x => x.classList.toggle('on', x === b)); next(); }));
  $$('#mode button').forEach(b => b.addEventListener('click', () => { mode = b.dataset.m; $$('#mode button').forEach(x => x.classList.toggle('on', x === b)); document.body.classList.toggle('class-mode', mode === 'class'); classHP = B.hp; combo = 0; build(); }));
  function hpNow() { return mode === 'solo' ? Math.max(0, B.hp - W().dmg) : classHP; }
  function build() {
    $('#arena').style.setProperty('--bc', B.c);
    $('#arena').innerHTML = `<div class="boss-box" style="--bc:${B.c}"><p class="note" style="margin:0">今週のボス（${mode === 'solo' ? 'ひとりで' : 'みんなで'}）</p>${svg(B)}<div class="boss-name">${esc(B.name)}</div><div class="boss-line">「${esc(B.line)}」</div><div class="hp"><i id="hp-i"></i><span id="hp-t"></span></div><div class="combo" id="combo"></div></div><div id="qarea"></div>`;
    hp();
    if (mode === 'solo' && W().defeated) return won(true);
    next();
  }
  function hp() { const h = hpNow(); $('#hp-i').style.width = (h / B.hp * 100) + '%'; $('#hp-t').textContent = `HP ${h.toLocaleString()} / ${B.hp.toLocaleString()}`; $('#combo').innerHTML = combo >= 2 ? `${combo} COMBO!` : ''; }
  function hit(n) {
    const s = $('#boss-svg'); s.classList.remove('hit'); void s.offsetWidth; s.classList.add('hit');
    const d = document.createElement('div'); d.className = 'dmg'; d.textContent = '-' + n; $('.boss-box').appendChild(d); setTimeout(() => d.remove(), 900);
  }
  function next() {
    clearInterval(timer);
    if (hpNow() <= 0) return won();
    q = question(grade, { choice: true });
    const qa = $('#qarea');
    if (mode === 'solo') {
      renderChoice(qa, q, ok => {
        if (ok) {
          combo++; const n = Math.min(300, 100 + (combo - 1) * 20);
          update(d => { const x = d.boss[wk] || { dmg: 0, defeated: false, best: 0 }; x.dmg += n; x.best = Math.max(x.best || 0, combo); d.boss[wk] = x; d.bestCombo = Math.max(d.bestCombo || 0, combo); });
          hit(n); hp(); if (combo === 10) checkTrophies();
        } else { combo = 0; hp(); $('#combo').innerHTML = '<span class="shield">ボスの反撃！ コンボがリセット</span>'; }
        setTimeout(next, ok ? 700 : 1500);
      });
    } else {
      qa.innerHTML = `<div class="q-box"><span class="q-tag">${esc(q.s)}${q.g ? `・${q.g}年` : ''}</span><div class="q-text">${esc(q.q)}</div><div class="choices">${q.choices.map((c, i) => `<div class="choice" data-v="${esc(c)}"><span class="k">${'ABCD'[i]}</span>${esc(c)}</div>`).join('')}</div><div class="tbar"><i id="tb"></i></div>
        <div class="btns" style="justify-content:center;margin-top:14px"><button class="btn gold" type="button" id="reveal"><i class="fa-solid fa-eye"></i> 答えを見せる</button></div><div class="feedback" id="cfb"></div></div>`;
      let t = 20; const tb = $('#tb'); timer = setInterval(() => { t -= .1; tb.style.width = Math.max(0, t / 20 * 100) + '%'; if (t <= 0) clearInterval(timer); }, 100);
      $('#reveal').addEventListener('click', () => {
        clearInterval(timer);
        $$('#qarea .choice').forEach(x => { if (LAB.check(q, x.dataset.v)) x.classList.add('ok'); });
        $('#reveal').parentElement.innerHTML = `<button class="btn" type="button" id="cok"><i class="fa-solid fa-burst"></i> クラスで正解！（ダメージ）</button><button class="btn ghost" type="button" id="cng">まちがいが多かった</button>`;
        $('#cok').addEventListener('click', () => { combo++; const n = Math.min(400, 150 + (combo - 1) * 25); classHP = Math.max(0, classHP - n); hit(n); hp(); setTimeout(next, 700); });
        $('#cng').addEventListener('click', () => { combo = 0; hp(); $('#combo').innerHTML = '<span class="shield">ボスの反撃！ 次でとりかえそう</span>'; setTimeout(next, 900); });
      });
    }
  }
  function won(already) {
    clearInterval(timer);
    const s = $('#boss-svg'); if (s) s.classList.add('dead');
    const first = mode === 'solo' && !W().defeated;
    if (mode === 'solo' && first) { update(d => { const x = d.boss[wk] || { dmg: B.hp }; x.defeated = LAB.ymd(); d.boss[wk] = x; d.bossKills = (d.bossKills || 0) + 1; }); reward({ coins: 1000, exp: 50, reason: 'ボス撃破！' }); checkTrophies(); }
    $('#qarea').innerHTML = `<div class="q-box"><div class="q-text" style="font-size:1.8rem"><i class="fa-solid fa-crown" style="color:#fbbf24"></i> ${already ? '今週のボスは、もうたおしたよ！' : 'ボスをたおした！'}</div><p class="note">${mode === 'solo' ? `来週の月曜日に、新しいボスがあらわれます。` : 'クラスのみんなの力で勝利！'}</p><div class="btns" style="justify-content:center">${mode === 'solo' ? '<button class="btn ghost" type="button" id="prac">練習モードでつづける</button>' : '<button class="btn" type="button" id="again">もう一度たたかう</button>'}</div></div>`;
    const p = $('#prac'); if (p) p.addEventListener('click', () => { mode = 'practice'; classHP = B.hp; combo = 0; $('#boss-svg').classList.remove('dead'); hp2(); });
    const a = $('#again'); if (a) a.addEventListener('click', () => { classHP = B.hp; combo = 0; build(); });
  }
  function hp2() { // 練習モード（記録しない）
    mode = 'class'; document.body.classList.remove('class-mode');
    const qa = $('#qarea'); classHP = B.hp; hp();
    const loop = () => { q = question(grade, { choice: true }); renderChoice(qa, q, ok => { if (ok) { combo++; const n = 100 + Math.min(200, (combo - 1) * 20); classHP = Math.max(0, classHP - n); hit(n); } else combo = 0; hp(); if (classHP <= 0) { toast('練習でもボスをたおした！', 'fa-crown'); classHP = B.hp; } setTimeout(loop, ok ? 700 : 1400); }); };
    loop();
  }
  build();
})();
</script>

</html>

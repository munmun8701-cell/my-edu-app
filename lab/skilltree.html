<body>
<script>LAB.header({ sub: "SKILL TREE" });</script>
<style>
  .lab-link { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; padding: 10px 12px; border-radius: 14px; background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.3); }
  .lab-link b { width: 100%; color: #fca5a5; font-size: .82rem; }
  .st-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .st-sum button { text-align: left; padding: 12px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); color: var(--text); font: inherit; cursor: pointer; }
  .st-sum button.on { border-color: var(--c); box-shadow: 0 0 0 1px var(--c) inset, 0 0 18px color-mix(in srgb, var(--c) 25%, transparent); }
  .st-sum b { display: flex; align-items: center; gap: 8px; color: var(--bright); font-size: .98rem; }
  .st-sum b i { color: var(--c); }
  .st-sum span { display: block; font-size: .76rem; font-weight: 800; margin: 4px 0 6px; color: var(--dim); }
  .st-sum .bar > i { background: var(--c); }
  .tree { position: relative; padding: 6px 4px 10px; }
  .tree svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .lines path { fill: none; stroke: rgba(148,163,184,.28); stroke-width: 2; }
  .lines path.lit { stroke: var(--c); stroke-width: 2.5; filter: drop-shadow(0 0 4px var(--c)); stroke-dasharray: 8 6; animation: flow 1.4s linear infinite; }
  .lines path.cross { stroke-dasharray: 3 5; stroke: rgba(251,191,36,.45); }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  .tier { position: relative; margin: 0 0 26px; }
  .tier-h { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; color: var(--bright); font-weight: 900; font-size: .95rem; }
  .tier-h small { font-family: var(--mono); font-size: .66rem; letter-spacing: .14em; color: var(--c); }
  .tier-h .cnt { margin-left: auto; font-size: .76rem; color: var(--dim); }
  .nodes { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 26px; }
  .node { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px 10px; border-radius: 18px; background: #0a1122; border: 1px solid rgba(148,163,184,.22); color: var(--text); font: inherit; cursor: pointer; text-align: center; transition: transform .15s, box-shadow .2s, border-color .2s; }
  .node:hover { transform: translateY(-2px); border-color: var(--c); }
  .node .ni { width: 48px; height: 48px; display: grid; place-items: center; font-size: 1.15rem; color: var(--dim); clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); background: rgba(148,163,184,.14); }
  .node .nt { font-size: .78rem; font-weight: 800; line-height: 1.4; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.8em; }
  .node .ns { font-size: .64rem; font-weight: 900; letter-spacing: .06em; padding: 1px 8px; border-radius: 999px; background: rgba(148,163,184,.12); color: var(--dim); }
  .node.try .ni { color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
  .node.try { border-color: color-mix(in srgb, var(--c) 45%, transparent); }
  .node.try .ns { color: var(--c); }
  .node.clear { border-color: var(--c); box-shadow: 0 0 16px color-mix(in srgb, var(--c) 35%, transparent); }
  .node.clear .ni { color: #04121a; background: var(--c); box-shadow: 0 0 14px var(--c); }
  .node.clear .nt { color: var(--bright); }
  .node.clear .ns { background: var(--c); color: #04121a; }
  .node.master { border-color: var(--gold); box-shadow: 0 0 22px rgba(251,191,36,.45); }
  .node.master .ni { color: #1a1200; background: linear-gradient(135deg, #fde047, var(--gold)); }
  .node.master .ns { background: var(--gold); color: #1a1200; }
  .node.master::after { content: "★"; position: absolute; top: -9px; right: -6px; color: var(--gold); font-size: 1.1rem; text-shadow: 0 0 8px rgba(251,191,36,.9); }
  .node.lock { opacity: .55; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .76rem; color: var(--dim); font-weight: 700; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i.d { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
  .detail .row { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
  .detail .ni2 { width: 56px; height: 56px; flex: none; border-radius: 16px; display: grid; place-items: center; font-size: 1.4rem; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); }
  @media print { .tree svg.lines path { stroke: #999 !important; filter: none !important; animation: none !important; } .node { break-inside: avoid; } }
  .st-next{margin:0 0 14px}.st-next .nx{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:16px;border:1px dashed var(--c,#00e5ff);background:color-mix(in srgb,var(--c,#00e5ff) 10%,transparent)}.st-next .nx b{color:var(--c,#00e5ff)}.st-next .nx a{margin-left:auto}
</style>
<main class="wrap">
  <div class="page-title" style="--c:#00e5ff"><span class="ic"><i class="fa-solid fa-diagram-project"></i></span><h1><small>SKILL TREE // 学びの地図</small>スキルツリー</h1><p>単元どうしのつながりを1枚の地図にしました。アプリで学習すると単元が光り、次の単元への道がのびていきます。黄色の点線は、学年をこえた「つながり」です。</p></div>
  <div class="st-sum" id="st-sum"></div>
  <div class="panel">
    <div class="h2" style="--c:#00e5ff"><i class="fa-solid fa-route"></i><span id="st-title">算数</span><small class="no-print"><button class="btn ghost sm" type="button" onclick="window.print()"><i class="fa-solid fa-print"></i> 地図を印刷</button></small></div>
    <div class="legend no-print" style="margin-bottom:14px;"><span><i class="d" style="background:rgba(148,163,184,.3)"></i>まだ</span><span><i class="d" style="background:#00e5ff;opacity:.5"></i>挑戦中（1回）</span><span><i class="d" style="background:#00e5ff"></i>クリア（3回 or 合格）</span><span><i class="d" style="background:#fbbf24"></i>マスター（8回 or ★6）</span></div>
    <div class="st-next" id="st-next"></div>
    <div class="tree" id="tree"></div>
  </div>
</main>
<script>
(function () {
  const { $, $$, esc, get, update, load, save, ymd, checkTrophies } = LAB;
  const C = window.LAB_CARDS || [];
  const kokugoHref = new Set(C.filter(c => c.cat === 'kokugo').map(c => c.href));
  const SUBJ = [
    { id: 'math', name: '算数', ic: 'fa-calculator', c: '#00e5ff', groups: [['math1', '1年'], ['math3', '3年'], ['math4', '4年'], ['math5', '5年'], ['math6', '6年']] },
    { id: 'kokugo', name: '国語', ic: 'fa-book', c: '#60a5fa', groups: [['kokugo', '国語']] },
    { id: 'social', name: '社会・歴史', ic: 'fa-landmark', c: '#e879f9', groups: [['social', '社会（3年）'], ['history', '歴史（6年）']] },
    { id: 'challenge', name: 'チャレンジ', ic: 'fa-gamepad', c: '#fb923c', groups: [['game', '学習ゲーム'], ['grade1', '1年生'], ['support', '支援学級']] }
  ];
  const KEYS = ['わり算', '分数', '小数', '面積', '体積', 'かけ算', '大きな数', '大きい数', '角', '図形', '比例', 'グラフ', '時間', '時こく', '長さ', '重さ', '円', '割合', '速さ'];
  const vis = load('mun_visits', {}), prog = load('mun_progress', {});
  function stateOf(c) {
    const n = (vis[c.id] || {}).n || 0;
    const seg = c.href.split('/').filter(Boolean); const folder = seg[seg.length - 2] || '';
    const p = prog[c.id] || prog[folder] || prog[c.href] || null;
    let lessons = 0, stars = 0; if (p && p.lessons) Object.values(p.lessons).forEach(l => { lessons++; stars += l.stars || 0; });
    if (stars >= 6 || n >= 8) return { s: 'master', n, lessons, stars };
    if (lessons >= 1 || n >= 3) return { s: 'clear', n, lessons, stars };
    if (n >= 1) return { s: 'try', n, lessons, stars };
    return { s: 'none', n, lessons, stars };
  }
  const ST = { none: 'まだ', try: '挑戦中', clear: 'クリア', master: 'マスター', lock: 'ロック' };
  const data = SUBJ.map(sj => ({ ...sj, groups: sj.groups.map(([cat, label]) => ({ cat, label, cards: C.filter(c => c.cat === cat && !(cat === 'game' && kokugoHref.has(c.href))) })).filter(g => g.cards.length) }));
  let total = 0, cleared = 0;
  data.forEach(sj => { sj.total = 0; sj.done = 0; sj.groups.forEach(g => g.cards.forEach(c => { c.st = stateOf(c); sj.total++; if (c.st.s === 'clear' || c.st.s === 'master') sj.done++; })); total += sj.total; cleared += sj.done; });
  update(d => { d.skillCleared = cleared; }); checkTrophies();
  let cur = (location.hash || '').slice(1); if (!data.some(s => s.id === cur)) cur = 'math';
  function sum() {
    $('#st-sum').innerHTML = data.map(sj => `<button type="button" class="${sj.id === cur ? 'on' : ''}" style="--c:${sj.c}" data-s="${sj.id}"><b><i class="fa-solid ${sj.ic}"></i>${sj.name}</b><span>クリア ${sj.done} / ${sj.total}</span><div class="bar"><i style="width:${sj.total ? Math.round(sj.done / sj.total * 100) : 0}%"></i></div></button>`).join('');
    $$('#st-sum button').forEach(b => b.addEventListener('click', () => { cur = b.dataset.s; history.replaceState(null, '', '#' + cur); sum(); draw(); }));
  }
  function draw() {
    const sj = data.find(s => s.id === cur);
    $('#st-title').textContent = `${sj.name}（クリア ${sj.done} / ${sj.total}）`;
    const tree = $('#tree'); tree.style.setProperty('--c', sj.c);
    tree.innerHTML = `<svg class="lines" aria-hidden="true"></svg>` + sj.groups.map((g, gi) => {
      let prevOk = true;
      return `<div class="tier"><div class="tier-h"><small>TIER ${gi + 1}</small>${esc(g.label)}<span class="cnt">${g.cards.filter(c => c.st.s === 'clear' || c.st.s === 'master').length} / ${g.cards.length}</span></div><div class="nodes">${g.cards.map((c, i) => {
        let s = c.st.s; if (s === 'none' && !prevOk) s = 'lock';
        prevOk = c.st.s === 'clear' || c.st.s === 'master' || (i === 0 && gi === 0) || c.st.s === 'try';
        return `<button type="button" class="node ${s}" data-id="${c.id}" data-g="${gi}" data-i="${i}" aria-label="${esc(c.title)}：${ST[s]}"><span class="ni"><i class="${esc(c.icon)}"></i></span><span class="nt">${esc(c.title)}</span><span class="ns">${ST[s]}</span></button>`;
      }).join('')}</div></div>`;
    }).join('');
    (function () {
      let rec = null, why = '';
      const all = sj.groups.flatMap(g => g.cards);
      rec = all.find(c => c.st.s === 'try'); if (rec) why = 'いま挑戦中です。あと少しでクリア！';
      if (!rec) { rec = all.find(c => c.st.s === 'none'); if (rec) why = 'まだやっていない単元です。ここから始めよう。'; }
      $('#st-next').innerHTML = rec ? `<div class="nx"><i class="fa-solid fa-flag" style="color:var(--c)"></i><span><b>つぎの一歩</b>：${esc(rec.title)}<br><small>${why}</small></span><a class="btn sm" href="${esc(rec.href)}"><i class="fa-solid fa-play"></i> ひらく</a></div>` : `<div class="nx"><i class="fa-solid fa-crown" style="color:var(--c)"></i><span><b>${esc(sj.name)}をコンプリート！</b><br><small>ほかの教科の地図も見てみよう。</small></span></div>`;
      if (rec) $$('#tree .node').forEach(b => { if (b.dataset.id === rec.id) b.style.outline = '2px dashed var(--c)'; });
    })();
    $$('#tree .node').forEach(b => b.addEventListener('click', () => detail(C.find(c => c.id === b.dataset.id), sj)));
    requestAnimationFrame(lines);
  }
  function lines() {
    const tree = $('#tree'), svg = $('svg.lines', tree); if (!svg) return;
    const r = tree.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${Math.round(r.width)} ${Math.round(r.height)}`);
    const pos = el => { const b = el.getBoundingClientRect(); return { x: b.left - r.left, y: b.top - r.top, w: b.width, h: b.height }; };
    const nodes = $$('.node', tree); let out = '';
    const lit = el => el.classList.contains('clear') || el.classList.contains('master');
    for (let k = 0; k < nodes.length - 1; k++) {
      const a = pos(nodes[k]), b = pos(nodes[k + 1]);
      const sameRow = Math.abs(a.y - b.y) < 4;
      let d;
      if (sameRow) d = `M${a.x + a.w} ${a.y + a.h / 2} L${b.x} ${b.y + b.h / 2}`;
      else { const x1 = a.x + a.w / 2, y1 = a.y + a.h, x2 = b.x + b.w / 2, y2 = b.y, my = (y1 + y2) / 2; d = `M${x1} ${y1} C${x1} ${my} ${x2} ${my} ${x2} ${y2}`; }
      out += `<path class="${lit(nodes[k]) ? 'lit' : ''}" d="${d}"/>`;
    }
    // 学年をこえたつながり（算数）
    if (cur === 'math') {
      const sj = data.find(s => s.id === 'math');
      for (let gi = 0; gi < sj.groups.length - 1; gi++) {
        sj.groups[gi].cards.forEach((c, i) => {
          const kw = KEYS.find(k => c.title.includes(k)); if (!kw) return;
          const j = sj.groups[gi + 1].cards.findIndex(x => x.title.includes(kw)); if (j < 0) return;
          const A = $(`.node[data-g="${gi}"][data-i="${i}"]`, tree), B = $(`.node[data-g="${gi + 1}"][data-i="${j}"]`, tree); if (!A || !B) return;
          const a = pos(A), b = pos(B), x1 = a.x + a.w / 2, y1 = a.y + a.h, x2 = b.x + b.w / 2, y2 = b.y;
          out += `<path class="cross" d="M${x1} ${y1} C${x1} ${y1 + 60} ${x2} ${y2 - 60} ${x2} ${y2}"/>`;
        });
      }
    }
    svg.innerHTML = out;
  }
  // この単元に合う「むんラボのミニテスト」をさがす（学年と単元名の言葉で）
  const GR = { math1: 1, math3: 3, math4: 4, math5: 5, math6: 6, history: 6 };
  function labUnits(c) {
    if (!window.LAB_Q) return [];
    const g = GR[c.cat] || (/低学年/.test(c.title) ? 2 : /中学年/.test(c.title) ? 4 : /高学年/.test(c.title) ? 6 : null);
    const subj = /^math/.test(c.cat) ? '算数' : c.cat === 'history' || c.cat === 'social' ? '社会' : c.cat === 'kokugo' ? '国語' : null;
    if (!subj) return [];
    return LAB_Q.units({ subj: [subj] }).filter(u => (g == null || u.g === g || (subj === '国語' && Math.abs(u.g - g) <= 1)) && u.kw.some(k => c.title.includes(k))).slice(0, 3);
  }
  function detail(c, sj) {
    const st = c.st, need = st.s === 'none' ? 'まず1回ひらいてみよう！' : st.s === 'try' ? `あと ${Math.max(1, 3 - st.n)} 回 学習するとクリア！` : st.s === 'clear' ? `あと ${Math.max(1, 8 - st.n)} 回でマスター！` : 'マスター達成！ほかの単元にも挑戦しよう。';
    const m = document.createElement('div'); m.className = 'lab-modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
    m.innerHTML = `<div class="box detail" style="--c:${sj.c}"><div class="row"><span class="ni2"><i class="${esc(c.icon)}"></i></span><div><small class="note">${esc(c.label)}</small><h2 style="margin:0">${esc(c.title)}</h2></div></div>
      ${c.unit ? `<p class="pill" style="margin:0 0 8px"><i class="fa-solid fa-book-bookmark"></i>${esc(c.unit)}</p>` : ''}<p>${esc(c.desc)}</p>
      <p class="note">ひらいた回数：${st.n} 回${st.lessons ? ` ／ クリアした回：${st.lessons}（★${st.stars}）` : ''}<br><b style="color: var(--bright)">${need}</b></p>
      ${(() => { const us = labUnits(c); if (!us.length) return ''; const dr = LAB.get().drill || {}; return `<div class="lab-link"><b><i class="fa-solid fa-bullseye"></i> むんラボのミニテスト</b>${us.map(u => { const b = (dr[u.id] || {}).best || 0, s = b >= 10 ? 3 : b >= 8 ? 2 : b >= 5 ? 1 : 0; return `<a class="btn sm ghost" href="./drill.html?u=${u.id}">${esc(u.name)} <span style="color:var(--gold)">${'★'.repeat(s)}${'☆'.repeat(3 - s)}</span></a>`; }).join('')}</div>`; })()}
      <div class="btns" style="justify-content:flex-end"><button class="btn ghost" type="button" data-x>とじる</button><a class="btn" href="../${esc(c.href)}" data-go><i class="fa-solid fa-play"></i> この単元をひらく</a></div></div>`;
    document.body.appendChild(m);
    const close = () => m.remove();
    m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-x]')) close(); });
    addEventListener('keydown', function k(e) { if (e.key === 'Escape') { close(); removeEventListener('keydown', k); } });
    $('[data-go]', m).addEventListener('click', () => {
      const v = load('mun_visits', {}); const x = v[c.id] || { n: 0 }; x.n++; x.last = Date.now(); v[c.id] = x; save('mun_visits', v);
      const dd = load('mun_visit_days', {}); const k = ymd(); const arr = dd[k] || []; if (!arr.includes(c.id)) arr.push(c.id); dd[k] = arr.slice(-40); save('mun_visit_days', dd);
    });
    $('[data-go]', m).focus();
  }
  addEventListener('resize', () => { clearTimeout(lines._t); lines._t = setTimeout(lines, 120); });
  sum(); draw();
  document.fonts && document.fonts.ready.then(lines);
})();
</script>

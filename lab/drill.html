<body>
<script>LAB.header({ sub: "DRILL" });</script>
<style>
  .gsel { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .weak { display: grid; gap: 8px; }
  .wk { display: grid; grid-template-columns: minmax(0, 1fr) 120px auto; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--card2); border: 1px solid rgba(248,113,113,.35); }
  .wk b { color: var(--bright); display: block; } .wk small { color: var(--dim); font-weight: 700; }
  .accbar { height: 10px; border-radius: 999px; background: rgba(148,163,184,.2); overflow: hidden; }
  .accbar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #f87171, #fbbf24); }
  .units { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .uc { display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 16px; background: var(--card2); border: 1px solid var(--line); color: var(--text); font: inherit; text-align: left; cursor: pointer; transition: transform .15s, border-color .15s; }
  .uc:hover { transform: translateY(-2px); border-color: var(--c, var(--cyan)); }
  .uc .t { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .uc b { color: var(--bright); font-size: .95rem; }
  .uc .st { color: var(--gold); letter-spacing: .08em; font-size: .9rem; white-space: nowrap; }
  .uc .meta { display: flex; gap: 8px; font-size: .74rem; font-weight: 800; color: var(--dim); }
  .uc .meta span { padding: 2px 8px; border-radius: 999px; background: var(--soft); }
  .uc .meta .w { color: #fca5a5; background: rgba(248,113,113,.12); }
  .dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; background: rgba(148,163,184,.25); border: 1px solid var(--line); }
  .dots i.ok { background: #34d399; border-color: #34d399; } .dots i.ng { background: #f87171; border-color: #f87171; } .dots i.now { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .res { text-align: center; }
  .res .big { font-family: var(--mono); font-size: 4rem; font-weight: 700; color: var(--bright); line-height: 1; }
  .res .stars { font-size: 2.4rem; color: var(--gold); letter-spacing: .15em; margin: 8px 0; }
  .review { display: grid; gap: 8px; text-align: left; margin-top: 16px; }
  .review div { padding: 12px 14px; border-radius: 14px; background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.3); }
  .review b { color: var(--bright); } .review p { margin: 4px 0 0; color: var(--text); font-size: .86rem; }
  #print-area { display: none; }
  @media print {
    body > *:not(#print-area) { display: none !important; }
    #print-area { display: block !important; color: #000; font-family: "UD Digi Kyokasho N-R", "BIZ UDPGothic", sans-serif; }
    #print-area h1 { font-size: 20pt; margin: 0 0 4pt; } #print-area .nm { display: flex; justify-content: space-between; border-bottom: 1px solid #000; padding: 6pt 0; margin-bottom: 10pt; font-size: 12pt; }
    #print-area ol { font-size: 14pt; line-height: 2.2; padding-left: 1.4em; } #print-area li { break-inside: avoid; }
    #print-area .ans { break-before: page; font-size: 11pt; } #print-area .ans li { line-height: 1.6; }
  }
  @media (max-width: 640px) { .wk { grid-template-columns: minmax(0, 1fr) auto; } .wk .accbar { grid-column: 1 / -1; grid-row: 2; } }
</style>
<main class="wrap">
  <div class="page-title" style="--c:#f87171"><span class="ic"><i class="fa-solid fa-bullseye"></i></span><h1><small>DRILL // にがて特訓</small>にがて特訓・単元ミニテスト</h1><p>単元を選んで10問のミニテスト。むんラボで答えた問題は単元ごとに記録され、正答率が低い単元が「にがて」として出てきます。にがてを★3にして、スキルツリーを光らせよう。</p></div>
  <section class="panel" style="--c:#00e5ff">
    <div class="gsel"><b style="color: var(--bright)"><i class="fa-solid fa-graduation-cap" style="color:var(--cyan)"></i> わたしの学年</b><div class="seg" id="mygrade" style="--c:#00e5ff"></div><span class="note" style="margin:0">ボス戦やイベントの問題も、この学年に合わせて出ます。</span></div>
  </section>
  <section class="panel" id="weak-panel" style="--c:#f87171"></section>
  <section class="panel">
    <div class="h2" style="--c:#00e5ff"><i class="fa-solid fa-layer-group"></i>単元から選ぶ<small id="u-count"></small></div>
    <div class="btns" style="margin-bottom:12px"><div class="seg" id="subj" style="--c:#00e5ff"></div><div class="seg" id="ugrade" style="--c:#a78bfa"></div></div>
    <div class="units" id="units"></div>
  </section>
</main>
<div id="print-area"></div>
<script>
(function () {
  const { $, $$, esc, get, update, reward, question, renderChoice, checkTrophies, unitAcc, weakUnits, myGrade, FX } = LAB;
  const SUBJ = LAB_Q.SUBJ, COLS = { '算数': '#00e5ff', '国語': '#f472b6', '社会': '#fbbf24', '理科': '#34d399', '英語': '#a78bfa' };
  let subj = '算数', ug = myGrade() || 3;
  const stars = id => { const b = (get().drill[id] || {}).best || 0; return b >= 10 ? 3 : b >= 8 ? 2 : b >= 5 ? 1 : 0; };
  const st = n => '★'.repeat(n) + '☆'.repeat(3 - n);
  function gradeUI() {
    const g = myGrade();
    $('#mygrade').innerHTML = [0, 1, 2, 3, 4, 5, 6].map(x => `<button type="button" data-g="${x}" class="${(g || 0) === x ? 'on' : ''}">${x ? x + '年' : 'えらばない'}</button>`).join('');
    $$('#mygrade button').forEach(b => b.addEventListener('click', () => { const x = +b.dataset.g; update(d => { d.grade = x || null; }); if (x) ug = x; FX().play('tap'); gradeUI(); render(); }));
  }
  function weakUI() {
    const w = weakUnits();
    $('#weak-panel').innerHTML = `<div class="h2" style="--c:#f87171"><i class="fa-solid fa-triangle-exclamation"></i>にがて単元<small>最近10問の正答率が70%未満</small></div>` + (w.length
      ? `<div class="weak">${w.slice(0, 6).map(x => `<div class="wk"><div><b>${esc(x.unit.name)}</b><small>${esc(x.unit.s)}・${x.unit.g}年 ／ これまで${x.n}問</small></div><div class="accbar" title="正答率 ${Math.round(x.acc * 100)}%"><i style="width:${Math.max(4, x.acc * 100)}%"></i></div><button class="btn sm pink" type="button" data-u="${x.id}"><i class="fa-solid fa-dumbbell"></i> 特訓</button></div>`).join('')}</div><div class="btns" style="margin-top:12px"><button class="btn" type="button" id="weakmix"><i class="fa-solid fa-shuffle"></i> にがてミックス10問</button></div>`
      : `<p class="note" style="margin:0">いまは、にがて単元はありません。ボス戦・イベント・ミニテストで問題に答えると、単元ごとの記録がたまっていきます。</p>`);
    $$('#weak-panel [data-u]').forEach(b => b.addEventListener('click', () => start([b.dataset.u])));
    const wm = $('#weakmix'); if (wm) wm.addEventListener('click', () => start(w.map(x => x.id), 'にがてミックス'));
  }
  function render() {
    weakUI();
    $('#subj').innerHTML = SUBJ.map(s => `<button type="button" class="${s === subj ? 'on' : ''}" data-s="${s}">${s}</button>`).join('');
    $$('#subj button').forEach(b => b.addEventListener('click', () => { subj = b.dataset.s; render(); }));
    const gs = [...new Set(LAB_Q.units({ subj: [subj] }).map(u => u.g))].sort();
    if (!gs.includes(ug)) ug = gs.reduce((a, b) => Math.abs(b - ug) < Math.abs(a - ug) ? b : a, gs[0]);
    $('#ugrade').innerHTML = gs.map(g => `<button type="button" class="${g === ug ? 'on' : ''}" data-g="${g}">${g}年</button>`).join('');
    $$('#ugrade button').forEach(b => b.addEventListener('click', () => { ug = +b.dataset.g; render(); }));
    const us = LAB_Q.units({ subj: [subj], g: ug });
    $('#u-count').textContent = `${subj}・${ug}年：${us.length}単元`;
    $('#units').innerHTML = us.map(u => { const a = unitAcc(u.id), s = stars(u.id); return `<button type="button" class="uc" style="--c:${COLS[u.s]}" data-u="${u.id}"><span class="t"><b>${esc(u.name)}</b><span class="st">${st(s)}</span></span><span class="meta"><span>${u.s}・${u.g}年</span>${a ? `<span class="${a.acc < .7 ? 'w' : ''}">最近の正答率 ${Math.round(a.acc * 100)}%</span>` : '<span>まだ記録なし</span>'}</span></button>`; }).join('');
    $$('#units .uc').forEach(b => b.addEventListener('click', () => start([b.dataset.u])));
  }
  /* ---------- 10問テスト ---------- */
  function start(ids, label) {
    const u = LAB_Q.BYID[ids[0]], title = label || u.name, N = 10, log = [];
    const m = document.createElement('div'); m.className = 'lab-modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-label', title);
    m.innerHTML = `<div class="box" style="width:min(720px,100%)"><div class="h2" style="--c:#f87171;margin-bottom:10px"><i class="fa-solid fa-bullseye"></i>${esc(title)}<small>10問ミニテスト</small></div><div class="dots" id="dt-dots"></div><div id="dt-q"></div><div class="btns" style="justify-content:space-between;margin-top:14px"><button class="btn ghost sm" type="button" id="dt-print"><i class="fa-solid fa-print"></i> この単元のプリント</button><button class="btn ghost sm" type="button" data-x>やめる</button></div></div>`;
    document.body.appendChild(m);
    const close = () => { m.remove(); render(); };
    m.addEventListener('click', e => { if (e.target.closest('[data-x]')) close(); });
    $('#dt-print', m).addEventListener('click', () => printSheet(ids, title));
    const dots = () => { $('#dt-dots', m).innerHTML = Array.from({ length: N }, (_, i) => `<i class="${log[i] ? (log[i].ok ? 'ok' : 'ng') : i === log.length ? 'now' : ''}"></i>`).join(''); };
    const one = () => {
      dots();
      if (log.length >= N) return done();
      const q = question(null, { units: ids, choice: true });
      renderChoice($('#dt-q', m), q, ok => { log.push({ ok, q }); dots(); setTimeout(one, ok ? 650 : 1900); });
    };
    const done = () => {
      const sc = log.filter(x => x.ok).length, s = sc >= 10 ? 3 : sc >= 8 ? 2 : sc >= 5 ? 1 : 0;
      const prev = ids.length === 1 ? ((get().drill[ids[0]] || {}).best || 0) : 0;
      if (ids.length === 1) update(d => { const x = d.drill[ids[0]] || { best: 0, n: 0 }; x.best = Math.max(x.best, sc); x.n++; x.t = LAB.ymd(); d.drill[ids[0]] = x; });
      LAB.track('drill');
      update(d => { d.drillRuns = (d.drillRuns || 0) + 1; if (sc === 10) d.drillPerfect = (d.drillPerfect || 0) + 1; if (label) d.weakRuns = (d.weakRuns || 0) + 1; });
      reward({ coins: sc * 20 + (sc === 10 ? 200 : 0) + (ids.length === 1 && sc === 10 && prev < 10 ? 300 : 0), exp: sc, reason: `ミニテスト ${sc}/10` });
      if (s === 3) FX().celebrate({ kicker: 'PERFECT', title: `${esc(title)} ★★★`, sub: '10問ぜんぶ正解！ この単元はマスターだ。', icon: 'fa-bullseye', color: '#fbbf24' }); else FX().play(s ? 'win' : 'ok');
      const miss = log.filter(x => !x.ok);
      $('#dt-q', m).innerHTML = `<div class="res"><div class="big">${sc}<small style="font-size:1.4rem;color:var(--dim)"> / 10</small></div><div class="stars">${st(s)}</div><p class="note">${s === 3 ? 'パーフェクト！' : s === 2 ? 'あと少しで★3！' : s === 1 ? 'もう一度チャレンジすると、もっとのびるよ。' : 'まずはまちがえた問題の説明を読んでみよう。'}</p>
        ${miss.length ? `<div class="review">${miss.map(x => `<div><b>${esc(x.q.q)}</b><p>答え：${esc(x.q.a)}${x.q.e ? `　${esc(x.q.e)}` : ''}</p></div>`).join('')}</div>` : ''}
        <div class="btns" style="justify-content:center;margin-top:16px"><button class="btn" type="button" id="dt-again"><i class="fa-solid fa-rotate"></i> もう一度</button><button class="btn ghost" type="button" data-x>もどる</button></div></div>`;
      $('#dt-again', m).addEventListener('click', () => { m.remove(); start(ids, label); });
      checkTrophies();
    };
    one();
  }
  /* ---------- 印刷用プリント（先生向け） ---------- */
  function printSheet(ids, title) {
    const qs = []; const seen = new Set();
    for (let k = 0; k < 80 && qs.length < 12; k++) { const q = question(null, { units: ids, choice: true }); if (seen.has(q.q)) continue; seen.add(q.q); qs.push(q); }
    $('#print-area').innerHTML = `<h1>${esc(title)}　ミニテスト</h1><div class="nm"><span>むん先生の学習クエスト ／ むんラボ</span><span>　月　日　名前（　　　　　　　　　　）</span></div>
      <ol>${qs.map(q => `<li>${esc(q.q)}${q.choices && (q.kind === 'choice' && !/^-?[\d.\/:]+$/.test(q.a)) ? `<br><small>（${q.choices.map((c, i) => `${'ア イ ウ エ'.split(' ')[i]} ${esc(c)}`).join('　')}）</small>` : '　答え（　　　　　　）'}</li>`).join('')}</ol>
      <div class="ans"><h2>答え</h2><ol>${qs.map(q => `<li>${esc(q.a)}${q.e ? `（${esc(q.e)}）` : ''}</li>`).join('')}</ol></div>`;
    setTimeout(() => print(), 50);
  }
  gradeUI(); render();
  const pu = new URLSearchParams(location.search).get('u');
  if (pu && LAB_Q.BYID[pu]) { const u = LAB_Q.BYID[pu]; subj = u.s; ug = u.g; render(); start([pu]); }
})();
</script>

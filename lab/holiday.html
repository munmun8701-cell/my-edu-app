<main class="wrap">
  <div class="page-title" style="--c:#fb923c"><span class="ic"><i class="fa-solid fa-umbrella-beach"></i></span><h1><small>HOLIDAY CHALLENGE // 夏・冬</small>夏休み・冬休みチャレンジ</h1><p>休みの間だけのスタンプラリー。毎日「ドリル」「せいかつ」「ひとこと」の3つのスタンプをあつめよう。記録はこの端末の中だけに保存されます。</p></div>
  <section class="hero" id="hero"></section>
  <section class="panel" id="gpanel" style="--c:#00e5ff"></section>
  <section class="panel" id="cal-panel"></section>
  <section class="panel" id="day-panel"></section>
  <section class="panel" id="ms-panel"></section>
  <section class="panel" id="memo-panel"></section>
</main>
<div id="print-area"></div>
<script>
(function () {
  const { $, $$, esc, get, update, reward, question, renderChoice, checkTrophies, myGrade, FX, ymd, today, p2, seedRand, shuffle } = LAB;
  const T0 = today(), TK = ymd(T0);
  const SEAS = {
    summer: { name: '夏休み', ic: 'fa-umbrella-beach', c: '#fb923c', ms: [[15, 300], [40, 800], [70, 1500], [100, 2500], [120, 4000]], msg: ['夏の風', 'ひまわり', 'かき氷', '花火', '夏のチャンピオン'] },
    winter: { name: '冬休み', ic: 'fa-snowman', c: '#38bdf8', ms: [[9, 300], [21, 800], [33, 1500], [42, 3000]], msg: ['雪のはじまり', 'こたつ', 'おもちつき', '冬のチャンピオン'] }
  };
  const dt = (y, m, d) => new Date(y, m - 1, d, 12);
  const periods = y => [
    { type: 'summer', key: 'summer' + y, a: dt(y, 7, 20), b: dt(y, 8, 31) },
    { type: 'winter', key: 'winter' + y, a: dt(y, 12, 25), b: dt(y + 1, 1, 7) }
  ];
  const all = [].concat(periods(T0.getFullYear() - 1), periods(T0.getFullYear()), periods(T0.getFullYear() + 1)).sort((x, y) => x.a - y.a);
  const live = all.find(p => T0 >= p.a && T0 <= p.b) || null;
  const nextP = live ? null : all.find(p => p.a > T0);
  const P = live || nextP, S = SEAS[P.type], isLive = !!live;
  const shift = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12); x.setDate(x.getDate() + n); return x; };
  const days = []; for (let d = P.a; d <= P.b; d = shift(d, 1)) days.push(ymd(d));
  const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
  const wd = '日月火水木金土';
  const HAB = [['fa-sun', 'はやおき・はやね'], ['fa-hands-bubbles', 'おてつだいをした'], ['fa-book-open', '本を15分 読んだ'], ['fa-person-running', '外であそぶ・うんどう'], ['fa-pencil', '宿題・自由研究を すすめた']];
  let sel = isLive ? TK : null;
  const rec = () => { const d = get(); d.hol = d.hol || {}; return d.hol[P.key] || { days: {}, claimed: [] }; };
  const dayRec = k => (rec().days || {})[k] || {};
  const stamps = r => (r.d ? 1 : 0) + (r.l ? 1 : 0) + (r.m ? 1 : 0);
  const total = () => Object.values(rec().days || {}).reduce((a, r) => a + stamps(r), 0);
  const fulls = () => Object.values(rec().days || {}).filter(r => stamps(r) === 3).length;
  function setDay(k, fn) {
    update(d => { d.hol = d.hol || {}; const h = d.hol[P.key] = d.hol[P.key] || { days: {}, claimed: [] }; h.days = h.days || {}; const r = h.days[k] = h.days[k] || {}; fn(r); });
  }
  function stampFx(k, before) {
    const r = dayRec(k), got = stamps(r) - before;
    if (got > 0) { FX().play('win'); reward({ coins: 20 * got, exp: got, reason: '休みスタンプ' }); if (stamps(r) === 3) { reward({ coins: 100, exp: 2, reason: '3つぜんぶ！', nocap: true }); FX().celebrate({ kicker: 'FULL STAMP', title: `${parse(k).getMonth() + 1}月${parse(k).getDate()}日 コンプリート！`, sub: '3つのスタンプがそろった。ボーナス100コイン！', icon: 'fa-star', color: '#fbbf24' }); } }
    checkTrophies(); render();
  }
  /* ---------- 見出し ---------- */
  function hero() {
    const left = isLive ? Math.round((P.b - T0) / 864e5) : Math.round((P.a - T0) / 864e5);
    $('#hero').style.setProperty('--c', S.c);
    $('#hero').innerHTML = `<div class="row"><div><h2><i class="fa-solid ${S.ic}"></i>${S.name}チャレンジ ${P.a.getFullYear()}</h2><div style="color:var(--text);font-weight:700">${P.a.getMonth() + 1}月${P.a.getDate()}日 〜 ${P.b.getMonth() + 1}月${P.b.getDate()}日（${days.length}日間）</div></div>
      <div style="text-align:right">${isLive ? `<div style="color:var(--dim);font-weight:800;font-size:.8rem">${S.name}の のこり</div><div class="cd">${left}<small>日</small></div>` : `<div style="color:var(--dim);font-weight:800;font-size:.8rem">${S.name}まで あと</div><div class="cd">${left}<small>日</small></div>`}</div></div>
      ${isLive ? `<div class="hsum"><div><b>${total()}</b><small>スタンプ（さいだい${days.length * 3}）</small></div><div><b>${fulls()}</b><small>3つそろった日</small></div><div><b>${Object.values(rec().days || {}).filter(r => stamps(r) > 0).length}</b><small>がんばった日</small></div></div>`
      : `<p style="margin:12px 0 0;color:var(--text)">${S.name}がはじまると、スタンプラリーが使えます。いまのうちに、下のカードで中身をたしかめておこう。先生は「スタンプカードを印刷」で、休みの前に配れます。</p>`}`;
  }
  function gradeUI() {
    const g = myGrade();
    $('#gpanel').innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"><b style="color:#fff"><i class="fa-solid fa-graduation-cap" style="color:var(--cyan)"></i> わたしの学年</b><div class="seg" id="mygrade" style="--c:#00e5ff">${[1, 2, 3, 4, 5, 6].map(x => `<button type="button" data-g="${x}" class="${g === x ? 'on' : ''}">${x}年</button>`).join('')}</div><span class="note" style="margin:0">休みドリルの問題が、この学年に合います。</span></div>`;
    $$('#mygrade button').forEach(b => b.addEventListener('click', () => { update(d => { d.grade = +b.dataset.g; }); FX().play('tap'); gradeUI(); render(); }));
  }
  /* ---------- カレンダー ---------- */
  function calendar() {
    const first = parse(days[0]), pad = (first.getDay() + 6) % 7;
    let h = '<div class="h2" style="--c:' + S.c + '"><i class="fa-solid fa-calendar-check"></i>スタンプカード<small>日にちをえらんでね</small></div><div class="cal">' + '月火水木金土日'.split('').map(x => `<div class="wd">${x}</div>`).join('') + '<div class="cd1 pad"></div>'.repeat(pad);
    days.forEach(k => {
      const d = parse(k), r = dayRec(k), n = stamps(r), future = k > TK, lock = !isLive || future;
      h += `<button type="button" class="cd1 ${n === 3 ? 'full' : ''} ${k === TK && isLive ? 'today' : ''} ${k === sel ? 'sel' : ''}" data-k="${k}" ${lock ? 'disabled' : ''} aria-label="${d.getMonth() + 1}月${d.getDate()}日 スタンプ${n}こ"><span class="n">${d.getDate()}${d.getDate() === 1 || k === days[0] ? `<small>${d.getMonth() + 1}月</small>` : ''}</span><span class="ds"><i class="${r.d ? 'on' : ''}"></i><i class="${r.l ? 'on' : ''}"></i><i class="${r.m ? 'on' : ''}"></i></span></button>`;
    });
    $('#cal-panel').style.setProperty('--c', S.c);
    $('#cal-panel').innerHTML = h + '</div><p class="note" style="margin:10px 0 0">● ドリル　● せいかつ　● ひとこと　（3つそろった日は★）。きのうまでの日は、あとからスタンプをおせます。</p><div class="btns" style="margin-top:10px"><button class="btn ghost" type="button" id="pr"><i class="fa-solid fa-print"></i> スタンプカードを印刷</button></div>';
    $$('#cal-panel .cd1[data-k]').forEach(b => b.addEventListener('click', () => { sel = b.dataset.k; FX().play('tap'); render(); }));
    $('#pr').addEventListener('click', printCard);
  }
  /* ---------- その日のミッション ---------- */
  function dayPanel() {
    const box = $('#day-panel'); box.style.setProperty('--c', S.c);
    if (!isLive || !sel) { box.innerHTML = `<div class="h2" style="--c:${S.c}"><i class="fa-solid fa-list-check"></i>毎日の3つのスタンプ</div><div class="tasks"><div class="tk"><span class="ti"><i class="fa-solid fa-bullseye"></i></span><div><b>① 休みドリル</b><p>学年に合わせた算数・国語などの10問。毎日ちがう単元が出ます。</p></div></div><div class="tk"><span class="ti"><i class="fa-solid fa-sun"></i></span><div><b>② せいかつチェック</b><p>はやおき・おてつだい・読書など、5つのうち3つできたらスタンプ。</p></div></div><div class="tk"><span class="ti"><i class="fa-solid fa-pen"></i></span><div><b>③ 今日のひとこと</b><p>今日あったことを1〜2文で書こう。休みの思い出カードにまとまります。</p></div></div></div>`; return; }
    const r = dayRec(sel), d = parse(sel), g = myGrade();
    const checks = r.c || [];
    box.innerHTML = `<div class="h2" style="--c:${S.c}"><i class="fa-solid fa-list-check"></i>${d.getMonth() + 1}月${d.getDate()}日（${wd[d.getDay()]}）の3つのスタンプ<small>${stamps(r)} / 3</small></div><div class="tasks">
      <div class="tk ${r.d ? 'done' : ''}"><span class="ti"><i class="fa-solid ${r.d ? 'fa-check' : 'fa-bullseye'}"></i></span><div><b>① 休みドリル ${r.d ? `<span style="color:#34d399">（${r.s}/10 クリア）</span>` : ''}</b><p>${g ? `${g}年の問題を10問。きょうの単元は、${unitNames(sel).map(esc).join('・')}です。` : 'まず、上で学年をえらんでね。'}</p><button class="btn" type="button" id="b-drill" ${g ? '' : 'disabled'}><i class="fa-solid fa-play"></i> ${r.d ? 'もう一度やる' : 'ドリルをはじめる'}</button></div></div>
      <div class="tk ${r.l ? 'done' : ''}"><span class="ti"><i class="fa-solid ${r.l ? 'fa-check' : 'fa-sun'}"></i></span><div><b>② せいかつチェック</b><p>できたことをタッチ。3つ以上でスタンプ。</p><div class="habits">${HAB.map(([ic, t], i) => `<button type="button" class="hb ${checks.includes(i) ? 'on' : ''}" data-i="${i}"><i class="fa-solid ${checks.includes(i) ? 'fa-circle-check' : ic}"></i>${t}</button>`).join('')}</div></div></div>
      <div class="tk ${r.m ? 'done' : ''}"><span class="ti"><i class="fa-solid ${r.m ? 'fa-check' : 'fa-pen'}"></i></span><div><b>③ 今日のひとこと</b><p>今日あったこと・思ったことを書こう（80字まで）。</p><textarea class="hm" id="hm" maxlength="80" placeholder="例：家族でスイカを食べた。たねとばしで負けた！">${esc(r.m || '')}</textarea><div class="btns" style="margin-top:8px"><button class="btn" type="button" id="b-memo"><i class="fa-solid fa-floppy-disk"></i> ほぞんしてスタンプ</button></div><p class="note" style="margin:6px 0 0">書いた内容はこの端末の中だけに残ります。</p></div></div></div>`;
    $('#b-drill').addEventListener('click', () => drill(sel));
    $$('#day-panel .hb').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.i, before = stamps(dayRec(sel)); FX().play('tap');
      setDay(sel, x => { const c = x.c || []; const j = c.indexOf(i); if (j >= 0) c.splice(j, 1); else c.push(i); x.c = c; x.l = c.length >= 3 ? 1 : 0; });
      stampFx(sel, before);
    }));
    $('#b-memo').addEventListener('click', () => {
      const v = $('#hm').value.trim(), before = stamps(dayRec(sel));
      setDay(sel, x => { x.m = v; });
      stampFx(sel, before);
    });
  }
  /* ---------- 休みドリル ---------- */
  function unitsFor(k) {
    const g = myGrade() || 3, rnd = seedRand('hol' + P.key + k), pool = LAB_Q.units({ g });
    const by = {}; pool.forEach(u => { (by[u.s] = by[u.s] || []).push(u); });
    const subs = LAB_Q.SUBJ.filter(s => by[s] && by[s].length), out = [];
    subs.sort(() => rnd() - .5);
    for (let i = 0; i < 4 && subs.length; i++) { const s = subs[i % subs.length]; const arr = by[s].filter(u => !out.includes(u)); if (arr.length) out.push(arr[Math.floor(rnd() * arr.length)]); }
    return out;
  }
  const unitNames = k => unitsFor(k).map(u => u.name);
  function drill(k) {
    const us = unitsFor(k); if (!us.length) return;
    const ids = us.map(u => u.id), N = 10, log = [];
    const m = document.createElement('div'); m.className = 'lab-modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-label', '休みドリル');
    m.innerHTML = `<div class="box" style="width:min(720px,100%)"><div class="h2" style="--c:${S.c};margin-bottom:10px"><i class="fa-solid fa-bullseye"></i>休みドリル<small>10問</small></div><div class="dots" id="hd-dots"></div><div id="hd-q"></div><div class="btns" style="justify-content:flex-end;margin-top:12px"><button class="btn ghost" type="button" data-x>やめる</button></div></div>`;
    document.body.appendChild(m);
    const close = () => { m.remove(); render(); };
    m.addEventListener('click', e => { if (e.target.closest('[data-x]')) close(); });
    const dots = () => { $('#hd-dots', m).innerHTML = Array.from({ length: N }, (_, i) => `<i class="${log[i] ? (log[i].ok ? 'ok' : 'ng') : i === log.length ? 'now' : ''}"></i>`).join(''); };
    const one = () => {
      dots(); if (log.length >= N) return done();
      const q = question(null, { units: ids, choice: true });
      renderChoice($('#hd-q', m), q, ok => { log.push({ ok, q }); dots(); setTimeout(one, ok ? 650 : 1800); });
    };
    const done = () => {
      const sc = log.filter(x => x.ok).length, before = stamps(dayRec(k));
      setDay(k, x => { x.d = 1; x.s = Math.max(x.s || 0, sc); });
      LAB.track('drill');
      reward({ coins: sc * 10, exp: sc, reason: `休みドリル ${sc}/10` });
      const miss = log.filter(x => !x.ok);
      $('#hd-q', m).innerHTML = `<div class="res"><div class="big">${sc}<small style="font-size:1.3rem;color:var(--dim)"> / 10</small></div><p class="note">${sc >= 8 ? 'すばらしい！' : sc >= 5 ? 'いいちょうし！ まちがえた問題を見なおそう。' : 'さいごまでやりきったことが えらい！ まちがいは、のびしろだよ。'} スタンプをゲット！</p>
        ${miss.length ? `<div class="review">${miss.map(x => `<div><b>${esc(x.q.q)}</b><p>答え：${esc(x.q.a)}${x.q.e ? `　${esc(x.q.e)}` : ''}</p></div>`).join('')}</div>` : ''}
        <div class="btns" style="justify-content:center;margin-top:14px"><button class="btn" type="button" data-x><i class="fa-solid fa-check"></i> とじる</button></div></div>`;
      stampFx(k, before);
    };
    one();
  }
  /* ---------- ごほうび ---------- */
  function milestones() {
    const t = total(), claimed = rec().claimed || [], box = $('#ms-panel'); box.style.setProperty('--c', '#fbbf24');
    const ms = S.ms.filter(([n]) => n <= days.length * 3);
    box.innerHTML = `<div class="h2" style="--c:#fbbf24"><i class="fa-solid fa-gift"></i>ごほうび<small>スタンプ ${t} こ</small></div><div class="ms">${ms.map(([n, c], i) => {
      const ok = t >= n, got = claimed.includes(n);
      return `<div class="m1 ${ok && !got ? 'ok' : ''} ${got ? 'got' : ''}"><small>${esc(S.msg[i])}</small><div class="big">${n}<span style="font-size:.9rem"> こ</span></div><div class="note" style="margin:4px 0 8px"><i class="fa-solid fa-coins" style="color:var(--gold)"></i> ${c.toLocaleString()} コイン</div>${got ? '<span class="note">うけとりずみ</span>' : `<button class="btn sm" type="button" data-n="${n}" ${ok && isLive ? '' : 'disabled'}>${ok ? 'うけとる' : `あと${n - t}こ`}</button>`}</div>`;
    }).join('')}</div>`;
    $$('#ms-panel [data-n]').forEach(b => b.addEventListener('click', () => {
      const n = +b.dataset.n, c = (S.ms.find(x => x[0] === n) || [0, 0])[1];
      let first = false; update(d => { d.hol = d.hol || {}; const h = d.hol[P.key] = d.hol[P.key] || { days: {}, claimed: [] }; h.claimed = h.claimed || []; if (!h.claimed.includes(n)) { h.claimed.push(n); first = true; } });
      if (first) { reward({ coins: c, exp: 5, reason: `${S.name}チャレンジ ${n}こ`, nocap: true }); FX().celebrate({ kicker: 'REWARD', title: `スタンプ ${n}こ たっせい！`, sub: `${c.toLocaleString()}コインをゲット`, icon: 'fa-gift', color: '#fbbf24' }); }
      checkTrophies(); render();
    }));
  }
  /* ---------- 思い出 ---------- */
  function memo() {
    const rows = days.map(k => [k, dayRec(k).m]).filter(x => x[1]);
    const box = $('#memo-panel'); box.style.setProperty('--c', S.c);
    box.innerHTML = `<div class="h2" style="--c:${S.c}"><i class="fa-solid fa-book-bookmark"></i>休みの思い出<small>${rows.length} 日ぶん</small></div>` + (rows.length ? `<div class="memo">${rows.map(([k, v]) => { const d = parse(k); return `<div><b>${d.getMonth() + 1}/${d.getDate()}</b>${esc(v)}</div>`; }).join('')}</div>` : '<p class="note" style="margin:0">「今日のひとこと」を書くと、ここに思い出がたまっていきます。</p>');
  }
  function printCard() {
    const first = parse(days[0]), pad = (first.getDay() + 6) % 7, rows = days.map(k => [k, dayRec(k).m]).filter(x => x[1]);
    $('#print-area').innerHTML = `<h1>${S.name}チャレンジ スタンプカード ${P.a.getFullYear()}</h1><div class="nm"><span>むん先生の学習クエスト ／ むんラボ</span><span>名前（　　　　　　　　　　　）</span></div>
      <div class="pc">${'月火水木金土日'.split('').map(x => `<div class="h">${x}</div>`).join('')}${'<div class="x"></div>'.repeat(pad)}${days.map(k => { const d = parse(k), r = dayRec(k); return `<div><b>${d.getDate() === 1 || k === days[0] ? `${d.getMonth() + 1}/` : ''}${d.getDate()}</b><span>${r.d ? '●' : '○'}${r.l ? '●' : '○'}${r.m ? '●' : '○'}</span></div>`; }).join('')}</div>
      <p style="font-size:9pt;margin:6pt 0 0">○のところ：左から ドリル／せいかつ／ひとこと。できたら ● に ぬろう。</p>
      <h2>${S.name}の思い出</h2>${rows.length ? `<ul>${rows.map(([k, v]) => { const d = parse(k); return `<li>${d.getMonth() + 1}/${d.getDate()}　${esc(v)}</li>`; }).join('')}</ul>` : '<div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div>'}`;
    update(d => { d.holPrint = (d.holPrint || 0) + 1; });
    setTimeout(() => print(), 50);
  }
  function render() { hero(); calendar(); dayPanel(); milestones(); memo(); }
  gradeUI(); render();
})();
</script>

<style>
  .ctl { display: grid; gap: 12px; }
  .ctl .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .ctl label.t { color: var(--bright); font-weight: 900; min-width: 5.5em; }
  .ctl input[type=text], .ctl select { font: inherit; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); color: var(--bright); min-width: 0; }
  .ctl input[type=text] { width: min(260px, 100%); }
  .ck { display: inline-flex; align-items: center; gap: 6px; color: var(--text); font-weight: 700; font-size: .9rem; cursor: pointer; }
  .ck input { width: 18px; height: 18px; accent-color: #fbbf24; }
  .ct-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .ct-sum div { padding: 10px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
  .ct-sum b { display: block; font-family: var(--mono); font-size: 1.35rem; color: var(--bright); }
  .ct-sum span { font-size: .74rem; font-weight: 800; color: var(--dim); }
  .ct-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; max-height: 460px; overflow: auto; padding: 4px; }
  .ci { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--card2); cursor: pointer; }
  .ci input { width: 18px; height: 18px; accent-color: #fbbf24; flex: none; }
  .ci .m { width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center; color: #0b1020; font-size: 1rem; background: radial-gradient(circle at 35% 30%, #fff, var(--rc)); }
  .ci b { display: block; color: var(--bright); font-size: .86rem; line-height: 1.35; }
  .ci small { display: block; color: var(--dim); font-size: .68rem; }
  .ci.on { border-color: var(--rc); box-shadow: 0 0 12px color-mix(in srgb, var(--rc) 30%, transparent); }
  /* ---- 賞状（紙） ---- */
  .cert-wrap { margin-top: 16px; }
  #certs { display: grid; gap: 18px; justify-content: center; }
  .cert { --ink: #2b2118; --rc: #b8860b; --rc2: #fde68a; width: 1123px; height: 794px; box-sizing: border-box; padding: 26px; background: #fffdf5; color: var(--ink); position: relative; box-shadow: 0 18px 50px var(--soft); font-family: "Yu Mincho", "Hiragino Mincho ProN", "BIZ UDPMincho", "MS PMincho", serif; overflow: hidden; }
  .cert .f1 { position: absolute; inset: 22px; border: 6px solid var(--rc); }
  .cert .f2 { position: absolute; inset: 36px; border: 2px solid var(--rc); }
  .cert .f3 { position: absolute; inset: 44px; border: 1px dashed color-mix(in srgb, var(--rc) 60%, #fff); }
  .cert .cn { position: absolute; width: 46px; height: 46px; border: 4px solid var(--rc); background: #fffdf5; transform: rotate(45deg); }
  .cert .cn::after { content: ""; position: absolute; inset: 8px; background: var(--rc2); border: 2px solid var(--rc); }
  .cert .c1 { left: 6px; top: 6px; } .cert .c2 { right: 6px; top: 6px; } .cert .c3 { left: 6px; bottom: 6px; } .cert .c4 { right: 6px; bottom: 6px; }
  .cert .in { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 62px 100px 70px; text-align: center; }
  .cert .kick { font-family: "Space Grotesk", sans-serif; font-size: 12px; letter-spacing: .34em; color: var(--rc); font-weight: 700; }
  .cert .ttl { font-size: 64px; font-weight: 900; letter-spacing: .5em; margin: 6px 0 4px .5em; line-height: 1.15; }
  .cert .who { font-size: 38px; font-weight: 700; margin: 4px 0 4px; min-width: 520px; border-bottom: 2px solid var(--ink); padding: 0 24px 4px; }
  .cert .who span { display: inline-block; min-width: 200px; }
  .cert .who small { font-size: 26px; font-weight: 700; margin-left: 10px; }
  .cert .aw { display: flex; align-items: center; gap: 22px; margin: 14px 0 4px; }
  .cert .aw svg { width: 100px; height: 117px; }
  .cert .aw svg { flex: none; }
  .cert .aw b { display: block; font-size: 46px; line-height: 1.3; color: var(--rc); text-shadow: 0 1px 0 #fff; }
  .cert .aw em { display: inline-block; margin-top: 4px; font-style: normal; font-size: 15px; letter-spacing: .3em; font-weight: 700; color: var(--bright); background: var(--rc); padding: 2px 16px; border-radius: 999px; }
  .cert .cond { margin: 10px 0 0; font-size: 24px; font-weight: 700; line-height: 1.7; max-width: 800px; }
  .cert .body { margin: 12px 0 0; font-size: 18px; line-height: 1.9; }
  .cert .foot { margin-top: auto; width: 100%; display: flex; justify-content: space-between; align-items: flex-end; font-size: 20px; }
  .cert .foot .fr { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 700; }
  .cert .seal { width: 58px; height: 58px; border-radius: 50%; border: 3px solid #c2410c; color: #c2410c; display: grid; place-items: center; font-size: 22px; font-weight: 900; transform: rotate(-8deg); }
  .cert .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 22px; margin: 10px 0 0; }
  .cert .stats div { border: 2px solid var(--rc); border-radius: 14px; padding: 4px 24px; background: #fff; }
  .cert .stats b { display: block; font-family: "Space Grotesk", sans-serif; font-size: 30px; color: var(--rc); line-height: 1.2; }
  .cert .stats span { font-size: 15px; font-weight: 700; }
  .ct-hint { color: var(--dim); font-size: .8rem; margin-top: 8px; }
  @page { size: A4 landscape; margin: 0; }
  @media print {
    html, body { background: #fff !important; }
    body > *:not(.paper-print) { display: none !important; }
    .paper-print { display: block !important; }
    .paper-print .wrap { max-width: none; padding: 0; margin: 0; }
    .no-print { display: none !important; }
    .cert-wrap { margin: 0; }
    #certs { display: block; zoom: 1 !important; }
    .cert { width: 297mm; height: 210mm; box-shadow: none; page-break-after: always; break-after: page; zoom: .9457; }
    .cert:last-child { page-break-after: auto; break-after: auto; }
    .cert, .cert * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .cert:nth-child(n+1) { display: block !important; }
  }
</style>
<div class="paper-print" style="display:contents">
<main class="wrap">
  <div class="page-title no-print" style="--c:#fbbf24"><span class="ic"><i class="fa-solid fa-award"></i></span><h1><small>CERTIFICATE // 賞状</small>賞状プリンター</h1><p>これまでの学びや記録を、名前入りの賞状にして印刷できます。家にかざったり、ほめてあげるきっかけに。記録はこの端末の中だけで使い、外には送りません。</p></div>
  <div class="ct-sum no-print" id="ct-sum"></div>
  <section class="panel no-print" style="--c:#fbbf24">
    <div class="ctl">
      <div class="row"><label class="t" for="c-name">なまえ</label><input type="text" id="c-name" maxlength="20" placeholder="（空のままなら、書きこみ用のせんになります）" autocomplete="off"></div>
      <div class="row"><label class="t" for="c-from">おくる人</label><input type="text" id="c-from" maxlength="16" placeholder="むん先生" autocomplete="off"></div>
      <div class="row"><label class="t" for="c-grp">しぼりこみ</label><select id="c-grp"></select><select id="c-rar"></select></div>
    </div>
  </section>
  <section class="panel no-print" style="--c:#fbbf24">
    <div class="h2"><i class="fa-solid fa-ranking-star"></i>もらえる賞状<small id="ct-n"></small></div>
    <div class="btns" style="margin-bottom:10px"><button class="btn ghost" type="button" id="c-all">ひょうじ中をぜんぶえらぶ</button><button class="btn ghost" type="button" id="c-none">えらびなおす</button></div>
    <div class="ct-list" id="ct-list"></div>
  </section>
  <section class="panel no-print" style="--c:#fbbf24">
    <div class="btns" style="align-items:center"><button class="btn" type="button" id="c-print"><i class="fa-solid fa-print"></i> <span id="c-pn">えらんだ賞状を印刷する</span></button><span class="note" style="margin:0">A4よこ・1まいに1つ。PDFにしたいときは、印刷画面で「PDFに保存」をえらびます。</span></div>
  </section>
  <div class="cert-wrap"><div id="certs"></div></div>
  <p class="ct-hint no-print" id="ct-hint"></p>
</main>
</div>
<script>
(function () {
  const { $, esc, get, update, checkTrophies, ctx, TROPHIES, RAR } = LAB;
  const RC = { bronze: ['#b45309', '#fcd9a8', 'ブロンズ'], silver: ['#64748b', '#e2e8f0', 'シルバー'], gold: ['#b8860b', '#fde68a', 'ゴールド'], platinum: ['#0e7490', '#a5f3fc', 'プラチナ'] };
  const RORD = ['bronze', 'silver', 'gold', 'platinum'];
  const fmt = s => { const m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s || ''); return m ? `${m[1]}年${+m[2]}月${+m[3]}日` : s || ''; };
  const today = () => LAB.ymd();
  const HOL = {
    summer: { name: '夏休み', ms: [15, 40, 70, 100, 120], msg: ['夏の風', 'ひまわり', 'かき氷', '花火', '夏のチャンピオン'] },
    winter: { name: '冬休み', ms: [9, 21, 33, 42], msg: ['雪のはじまり', 'こたつ', 'おもちつき', '冬のチャンピオン'] }
  };
  function awards() {
    const lab = get(), c = ctx(), out = [], tdy = today();
    TROPHIES.forEach(t => { const d = lab.trophies[t.id]; if (d) out.push({ id: 't:' + t.id, grp: t.g, r: t.r, title: t.t, text: t.d, date: d }); });
    // 学習日数・トロフィー数のまとめ
    [[10, 'bronze'], [30, 'silver'], [50, 'gold'], [100, 'platinum']].forEach(([n, r]) => { if (c.studyDays >= n) out.push({ id: 'd:' + n, grp: 'そうごう', r, title: `学習 ${n}日 たっせい`, text: `学習した日が、ぜんぶで ${n}日になった`, date: tdy }); });
    [[10, 'bronze'], [30, 'silver'], [60, 'gold'], [90, 'platinum']].forEach(([n, r]) => { if (c.trophyN >= n) out.push({ id: 'tr:' + n, grp: 'そうごう', r, title: `トロフィー ${n}こ`, text: `実績トロフィーを ${n}こ集めた`, date: tdy }); });
    [[50, 'bronze'], [150, 'silver'], [300, 'gold']].forEach(([n, r]) => { if (c.zukan >= n) out.push({ id: 'zk:' + n, grp: 'そうごう', r, title: `むんずかん ${n}まい`, text: `むんずかんのカードを ${n}まい集めた`, date: tdy }); });
    // 休みチャレンジ
    Object.entries(lab.hol || {}).forEach(([key, h]) => {
      const m = /^(summer|winter)(\d{4})$/.exec(key); if (!m || !h) return; const H = HOL[m[1]];
      const ds = Object.entries(h.days || {}).filter(([, x]) => x && (x.d || x.l || x.m)), n = ds.length; if (!n) return;
      const last = ds.map(x => x[0]).sort().pop();
      H.ms.forEach((need, i) => { if (n >= need) out.push({ id: `h:${key}:${i}`, grp: '休み', r: RORD[Math.min(3, Math.round(i * 3 / (H.ms.length - 1)))], title: `${H.name}チャレンジ「${H.msg[i]}」`, text: `${m[2]}年の${H.name}チャレンジで、${need}日ぶんのスタンプをあつめた`, date: last }); });
    });
    // 単元マスター
    Object.entries(lab.drill || {}).forEach(([id, x]) => { if (x && x.best >= 10 && window.LAB_Q && LAB_Q.BYID[id]) { const u = LAB_Q.BYID[id]; out.push({ id: 'u:' + id, grp: '単元', r: 'gold', title: `${u.name} マスター`, text: `${u.g}年「${u.name}」の単元ミニテストで、10問ぜんぶ正解した`, date: x.t || tdy }); } });
    // 謎解きの章
    (window.NAZO_CHAPTERS || []).forEach((ch, k) => { let ok = true, last = ''; for (let i = ch.from; i < ch.to; i++) { const r = lab.nazo['r' + (i + 1)]; if (!r || !r.cleared) { ok = false; break; } if (r.t && r.t > last) last = r.t; } if (ok) out.push({ id: 'n:' + k, grp: '謎解き', r: RORD[Math.min(3, k + 1)], title: `${ch.name}から脱出`, text: `謎解き「${ch.name}」の6つの部屋から、ぜんぶ脱出した`, date: last || tdy }); });
    // 総合
    out.unshift({ id: 'summary', grp: 'そうごう', r: 'gold', sp: 'summary', title: 'がんばり賞', text: 'これまでの学習のあゆみ', date: tdy });
    return out;
  }
  let list = [], sel = new Set();
  const GRPS = ['ぜんぶ', 'そうごう', '学習', 'ラボ', '休み', '単元', '謎解き', 'ひみつ'];
  const medal = (rc, rc2) => `<svg width="116" height="136" viewBox="0 0 116 136" aria-hidden="true"><path d="M30 0h22l8 42H34z" fill="${rc}"/><path d="M86 0H64l-8 42h26z" fill="${rc2}" stroke="${rc}" stroke-width="2"/><circle cx="58" cy="82" r="44" fill="${rc}"/><circle cx="58" cy="82" r="36" fill="${rc2}" stroke="#fff" stroke-width="3"/><polygon points="58,56 65,74 84,75 69,87 74,106 58,95 42,106 47,87 32,75 51,74" fill="${rc}"/></svg>`;
  function certHTML(a, name, from) {
    const [rc, rc2, rn] = RC[a.r], who = name ? esc(name) : '&nbsp;';
    const head = `<div class="f1"></div><div class="f2"></div><div class="f3"></div><i class="cn c1"></i><i class="cn c2"></i><i class="cn c3"></i><i class="cn c4"></i>`;
    const whoH = `<div class="who"><span>${who}</span><small>さん</small></div>`;
    const foot = `<div class="foot"><span>${esc(fmt(a.date))}</span><span class="fr">${esc(from)}<i class="seal">${esc((from || 'むん').slice(0, 2))}</i></span></div>`;
    if (a.sp === 'summary') {
      const c = ctx(), hrs = c.studyMin >= 60 ? `${Math.floor(c.studyMin / 60)}時間${c.studyMin % 60}分` : `${c.studyMin}分`;
      return `<div class="cert" style="--rc:${rc};--rc2:${rc2}">${head}<div class="in"><div class="kick">MUN-SENSEI GAKUSHU QUEST // CERTIFICATE</div><div class="ttl">賞　状</div>${whoH}<div class="aw">${medal(rc, rc2)}<div><b>学習クエスト がんばり賞</b><em>${rn}</em></div></div>
        <div class="stats"><div><b>${c.studyDays}<small style="font-size:18px">日</small></b><span>学習した日</span></div><div><b>${hrs}</b><span>学習した時間</span></div><div><b>${c.answered}<small style="font-size:18px">問</small></b><span>むんラボで答えた問題</span></div><div><b>${c.visited}</b><span>ひらいたアプリ</span></div><div><b>${c.trophyN}</b><span>あつめたトロフィー</span></div><div><b>${c.zukan}</b><span>むんずかんのカード</span></div></div>
        <p class="body" style="margin-top:10px">これまでの努力と成長をたたえ、この賞状をおくります。</p>${foot}</div></div>`;
    }
    return `<div class="cert" style="--rc:${rc};--rc2:${rc2}">${head}<div class="in"><div class="kick">MUN-SENSEI GAKUSHU QUEST // CERTIFICATE</div><div class="ttl">賞　状</div>${whoH}<div class="aw">${medal(rc, rc2)}<div><b>${esc(a.title)}</b><em>${rn}</em></div></div>
      <p class="cond">「${esc(a.text)}」</p><p class="body">あなたは、がんばって学びつづけ、すばらしい成果をあげました。<br>よって、ここにその努力をたたえ、この賞状をおくります。</p>${foot}</div></div>`;
  }
  const nameV = () => ($('#c-name').value || '').trim(), fromV = () => ($('#c-from').value || '').trim() || 'むん先生';
  function fit() { const w = $('.cert-wrap').clientWidth || 1123, z = Math.min(1, (w - 4) / 1123); $('#certs').style.zoom = z; }
  function view() { const g = $('#c-grp').value, r = $('#c-rar').value; return list.filter(a => (g === 'ぜんぶ' || a.grp === g) && (!r || a.r === r)); }
  function drawList() {
    const v = view();
    $('#ct-n').textContent = `　${list.length}まい もらえます`;
    $('#ct-list').innerHTML = v.map(a => `<label class="ci ${sel.has(a.id) ? 'on' : ''}" style="--rc:${RC[a.r][1] === '#fde68a' ? '#fbbf24' : RC[a.r][0]}"><input type="checkbox" data-id="${esc(a.id)}" ${sel.has(a.id) ? 'checked' : ''}><span class="m"><i class="fa-solid fa-award"></i></span><span><b>${esc(a.title)}</b><small>${RC[a.r][2]}　${esc(fmt(a.date))}</small></span></label>`).join('') || '<div class="empty">この条件の賞状はまだありません。むんラボで学ぶと、賞状が増えていきます。</div>';
  }
  function drawCerts() {
    const chosen = list.filter(a => sel.has(a.id));
    $('#certs').innerHTML = chosen.map(a => certHTML(a, nameV(), fromV())).join('');
    $('#c-pn').textContent = chosen.length ? `えらんだ賞状を印刷する（${chosen.length}まい）` : '賞状をえらんでください';
    $('#c-print').disabled = !chosen.length;
    $('#ct-hint').textContent = chosen.length ? `プレビューは ${chosen.length} まいぶん。スマートフォンでは小さく表示されます。` : '上の一覧から、印刷したい賞状にチェックを入れてください。';
    fit();
  }
  function sum() {
    const c = ctx(), by = r => list.filter(a => a.r === r).length;
    $('#ct-sum').innerHTML = `<div><b>${list.length}</b><span>もらえる賞状</span></div>` + RORD.map(r => `<div><b style="color:${RC[r][0] === '#b8860b' ? '#fbbf24' : RC[r][0] === '#64748b' ? '#cbd5e1' : RC[r][0] === '#b45309' ? '#d97706' : '#67e8f9'}">${by(r)}</b><span>${RC[r][2]}</span></div>`).join('');
  }
  function init() {
    checkTrophies(); list = awards();
    sel = new Set(['summary']);
    $('#c-grp').innerHTML = GRPS.map(g => `<option>${g}</option>`).join('');
    $('#c-rar').innerHTML = '<option value="">ぜんぶのランク</option>' + RORD.map(r => `<option value="${r}">${RC[r][2]}</option>`).join('');
    try { $('#c-name').value = localStorage.getItem('mun_report_name') || ''; $('#c-from').value = localStorage.getItem('mun_cert_from') || ''; } catch (e) {}
    sum(); drawList(); drawCerts();
  }
  $('#c-name').addEventListener('input', () => { try { localStorage.setItem('mun_report_name', nameV()); } catch (e) {} drawCerts(); });
  $('#c-from').addEventListener('input', () => { try { localStorage.setItem('mun_cert_from', ($('#c-from').value || '').trim()); } catch (e) {} drawCerts(); });
  $('#c-grp').addEventListener('change', drawList); $('#c-rar').addEventListener('change', drawList);
  $('#ct-list').addEventListener('change', e => { const i = e.target.closest('input[data-id]'); if (!i) return; i.checked ? sel.add(i.dataset.id) : sel.delete(i.dataset.id); i.closest('.ci').classList.toggle('on', i.checked); drawCerts(); });
  $('#c-all').addEventListener('click', () => { view().forEach(a => sel.add(a.id)); drawList(); drawCerts(); });
  $('#c-none').addEventListener('click', () => { sel.clear(); drawList(); drawCerts(); });
  $('#c-print').addEventListener('click', () => { if (!sel.size) return; update(d => { d.certs = (d.certs || 0) + 1; }); print(); setTimeout(() => { checkTrophies(); }, 400); });
  addEventListener('resize', fit);
  init();

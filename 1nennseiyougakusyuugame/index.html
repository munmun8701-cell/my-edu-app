<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>１ねんせいの おべんきょう - むん先生の学習クエスト</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    :root {
      --bg-deep: #02040a;
      --bg-card: rgba(10, 15, 30, 0.7);
      --border-cyan: rgba(0, 242, 255, 0.3);
      --accent-cyan: #00f2ff;
      --accent-pink: #ec4899;
      --accent-gold: #fbbf24;
      --text-main: #94a3b8;
      --glow-cyan: 0 0 20px rgba(0, 242, 255, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "M PLUS Rounded 1c", sans-serif;
      background-color: var(--bg-deep);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    /* 背景アニメーション */
    .cyber-grid {
      position: fixed; inset: 0; z-index: -2; pointer-events: none;
      background-image: linear-gradient(to right, rgba(0, 242, 255, 0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(0, 242, 255, 0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      transform: perspective(500px) rotateX(60deg);
      transform-origin: bottom; height: 200vh; top: -100vh;
      animation: gridMove 15s linear infinite;
    }
    @keyframes gridMove {
      from { transform: perspective(500px) rotateX(60deg) translateY(0); }
      to { transform: perspective(500px) rotateX(60deg) translateY(50px); }
    }
    
    .glow-orb {
      position: fixed; top: -10%; left: 20%; width: 500px; height: 500px;
      background: var(--accent-cyan); border-radius: 50%; filter: blur(150px);
      opacity: 0.15; z-index: -1; pointer-events: none;
    }

    /* ヘッダー */
    header {
      text-align: center;
      margin-bottom: 50px;
      z-index: 1;
    }
    .main-title {
      font-size: 2.5rem;
      font-weight: 900;
      color: #fff;
      text-shadow: var(--glow-cyan);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }
    .sub-title {
      color: var(--text-main);
      font-size: 1.1rem;
      font-weight: bold;
    }

    /* 戻るボタン */
    .back-btn {
      position: absolute;
      top: 30px;
      left: 30px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-cyan);
      color: var(--accent-cyan);
      padding: 12px 24px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.3s;
      z-index: 10;
      backdrop-filter: blur(10px);
    }
    .back-btn:hover {
      background: var(--accent-cyan);
      color: #000;
      box-shadow: var(--glow-cyan);
      transform: translateY(-2px);
    }

    /* アプリカードのグリッド */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
      width: 100%;
      max-width: 1000px;
      z-index: 1;
    }

    /* アプリカード */
    .app-card {
      background: var(--bg-card);
      border: 1px solid var(--border-cyan);
      border-radius: 24px;
      padding: 30px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }
    .app-card::before {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .app-card:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: var(--accent-cyan);
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(0, 242, 255, 0.2);
    }
    .app-card:hover::before { opacity: 1; }

    .card-icon {
      width: 80px;
      height: 80px;
      background: rgba(0, 242, 255, 0.1);
      border: 2px solid var(--accent-cyan);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: var(--accent-cyan);
      margin-bottom: 20px;
      box-shadow: inset 0 0 15px rgba(0, 242, 255, 0.2);
      transition: 0.3s;
    }
    .app-card:hover .card-icon {
      background: var(--accent-cyan);
      color: #000;
      box-shadow: 0 0 30px rgba(0, 242, 255, 0.6);
      transform: rotate(5deg) scale(1.1);
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: 12px;
    }
    .card-desc {
      font-size: 1rem;
      color: var(--text-main);
      line-height: 1.6;
      font-weight: bold;
      margin-bottom: 24px;
      flex-grow: 1;
    }

    .play-badge {
      background: rgba(0, 242, 255, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 242, 255, 0.5);
      padding: 10px 30px;
      border-radius: 30px;
      font-weight: 900;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.3s;
    }
    .app-card:hover .play-badge {
      background: var(--accent-cyan);
      color: #000;
      box-shadow: var(--glow-cyan);
      letter-spacing: 2px;
    }

    /* レスポンシブ */
    @media (max-width: 768px) {
      .main-title { font-size: 1.8rem; flex-direction: column; gap: 5px; }
      .back-btn { top: 15px; left: 15px; padding: 8px 16px; font-size: 0.9rem; }
      header { margin-top: 50px; }
    }
  </style>
</head>
<body>

  <!-- 背景要素 -->
  <div class="cyber-grid"></div>
  <div class="glow-orb"></div>

  <!-- 戻るボタン (1つ上の階層の index.html に戻る) -->
  <a href="../index.html" class="back-btn">
    <i class="fa-solid fa-arrow-left"></i> ポータルへもどる
  </a>

  <!-- ヘッダー -->
  <header>
    <h1 class="main-title">
      <i class="fa-solid fa-seedling" style="color: #10b981;"></i> 
      １ねんせいの おべんきょう
    </h1>
    <p class="sub-title">すきな ゲームを えらんで ぼうけんを はじめよう！</p>
  </header>

  <!-- アプリ一覧 -->
  <main class="card-grid">
    
    <!-- 追加いただいたフォルダへのリンク -->
    <a href="./tashizanhikizanhiragana/index.html" class="app-card">
      <div class="card-icon">
        <i class="fa-solid fa-pencil"></i>
      </div>
      <h2 class="card-title">たしざん・ひきざん・ひらがな</h2>
      <p class="card-desc">１ねんせいで ならう けいさんと もじの れんしゅうを ゲームで たのしく やろう！</p>
      <div class="play-badge">
        スタート <i class="fa-solid fa-play"></i>
      </div>
    </a>

    <!-- 今後アプリが増えた場合、ここに <a>タグのブロックを追加していきます -->

  </main>

  <script>
    // クリック時の効果音 (メインポータルと共通の演出)
    document.querySelectorAll('.app-card, .back-btn').forEach(el => {
      el.addEventListener('click', () => {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
        
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.1);
      });
    });
  </script>
</body>
</html>

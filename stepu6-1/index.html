<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>筆算　6時間目　①</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
    <div class="header-title">✨ 0〜9のカードで 式をつくろう！ ✨</div>

    <div id="phase-builder">
        <div class="nav-board" id="nav-board-build">
            <div class="nav-title">めあて：10まいのカードを使って、4けたの計算をつくろう</div>
            <div class="nav-msg">
                「たし算」か「ひき算」をえらんで、0〜9のカードを空いている四角（マス）に入れよう！<br>
                ※千の位に「0」は入れられないよ。
            </div>
        </div>

        <div class="builder-workspace">
            <div class="mode-tabs">
                <button class="mode-btn active" id="btn-mode-add" onclick="setMode('add')">➕ たし算をつくる</button>
                <button class="mode-btn" id="btn-mode-sub" onclick="setMode('sub')">➖ ひき算をつくる</button>
            </div>

            <div class="equation-builder">
                <div class="eq-group" id="eq-group-1">
                    <div class="eq-slot" onclick="returnCard(0)" id="slot-0"></div>
                    <div class="eq-slot" onclick="returnCard(1)" id="slot-1"></div>
                    <div class="eq-slot" onclick="returnCard(2)" id="slot-2"></div>
                    <div class="eq-slot" onclick="returnCard(3)" id="slot-3"></div>
                </div>
                <div class="eq-sign" id="eq-sign">＋</div>
                <div class="eq-group" id="eq-group-2">
                    <div class="eq-slot" onclick="returnCard(4)" id="slot-4"></div>
                    <div class="eq-slot" onclick="returnCard(5)" id="slot-5"></div>
                    <div class="eq-slot" onclick="returnCard(6)" id="slot-6"></div>
                    <div class="eq-slot" onclick="returnCard(7)" id="slot-7"></div>
                </div>
            </div>

            <div class="builder-alert" id="builder-alert">カードをえらんでね！</div>

            <div class="cards-pool" id="cards-pool">
                </div>

            <div class="action-btn-area">
                <button class="btn-primary" id="btn-start-hissan" onclick="startHissan()" disabled>
                    📝 この式で 筆算をする！
                </button>
            </div>
        </div>
    </div>

    <div id="phase-hissan" class="hidden">
        <div class="nav-board" id="nav-board-hissan" style="border-color: #f59e0b;">
            <div class="nav-title" style="background-color: #f59e0b;">自分たちでつくった式を、筆算でとこう！</div>
            <div class="nav-msg" id="nav-msg-hissan">
                位をそろえて計算しよう。むずかしい時は「💡 サポート」ボタンをおすと、くり上がりや くり下がりのメモを自動で書いてくれるよ！
            </div>
        </div>

        <div class="hissan-workspace">
            <div class="hissan-area">
                <div class="hissan-grid" id="hissan-grid">
                    <div class="cell blank"></div>
                    <div class="cell memo-wrapper"><input type="text" class="memo-input" id="memo-top-4"></div>
                    <div class="cell memo-wrapper"><input type="text" class="memo-input" id="memo-top-3"></div>
                    <div class="cell memo-wrapper"><input type="text" class="memo-input" id="memo-top-2"></div>
                    <div class="cell memo-wrapper"><input type="text" class="memo-input" id="memo-top-1"></div>
                    <div class="cell memo-wrapper"><input type="text" class="memo-input" id="memo-top-0"></div>

                    <div class="cell blank"></div>
                    <div class="cell memo-wrapper"><input type="text" class="memo-input" id="memo-mid-4"></div>
                    <div class="cell memo-wrapper"><input type="text" class="memo-input" id="memo-mid-3"></div>
                    <div class="cell memo-wrapper"><input type="text" class="memo-input" id="memo-mid-2"></div>
                    <div class="cell memo-wrapper"><input type="text" class="memo-input" id="memo-mid-1"></div>
                    <div class="cell memo-wrapper"><input type="text" class="memo-input" id="memo-mid-0"></div>

                    <div class="cell blank"></div>
                    <div class="cell blank"></div>
                    <div class="cell num-base" id="base-3"></div>
                    <div class="cell num-base" id="base-2"></div>
                    <div class="cell num-base" id="base-1"></div>
                    <div class="cell num-base" id="base-0"></div>

                    <div class="cell blank"></div>
                    <div class="cell sign" id="hissan-sign">＋</div>
                    <div class="cell num-sub line" id="sub-3"></div>
                    <div class="cell num-sub line" id="sub-2"></div>
                    <div class="cell num-sub line" id="sub-1"></div>
                    <div class="cell num-sub line" id="sub-0"></div>

                    <div class="cell blank"></div>
                    <div class="cell input-wrapper"><input type="text" inputmode="numeric" id="ans-4" class="ans-input" maxlength="1"></div>
                    <div class="cell input-wrapper"><input type="text" inputmode="numeric" id="ans-3" class="ans-input" maxlength="1"></div>
                    <div class="cell input-wrapper"><input type="text" inputmode="numeric" id="ans-2" class="ans-input" maxlength="1"></div>
                    <div class="cell input-wrapper"><input type="text" inputmode="numeric" id="ans-1" class="ans-input" maxlength="1"></div>
                    <div class="cell input-wrapper"><input type="text" inputmode="numeric" id="ans-0" class="ans-input" maxlength="1"></div>
                </div>

                <div class="hissan-controls">
                    <button class="btn-support" onclick="autoMemo()">💡 サポート：メモを自動で書く</button>
                    <button class="btn-primary" id="btn-check" onclick="checkAnswer()">答え合わせ</button>
                </div>
            </div>
        </div>
        
        <div class="footer-btns" style="margin-top: 20px;">
            <button class="btn-secondary" onclick="backToBuilder()">🔙 式づくりにもどる</button>
        </div>
    </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

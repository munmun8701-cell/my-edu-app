<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Simple Responsive Form</title>
    <meta name="viewport" content="width=device-width"><link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">
<link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app">
  <header class="topbar">
    <button type="button" class="icon-btn nav-toggle" id="nav-toggle" aria-label="メニューを開く">☰</button>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">📝</span>
      <div>
        <h1>所見・指導要録バインダー</h1>
        <div class="brand-sub" id="class-label"></div>
      </div>
    </div>
    <div class="top-actions">
      <button type="button" class="btn btn-ghost" id="mask-btn" data-act="toggle-mask" title="画面上の名前を出席番号に置き換えます">👁 名前を隠す</button>
      <button type="button" class="btn btn-outline" data-act="print-center">🖨 印刷</button>
      <button type="button" class="btn btn-outline" data-act="export-excel">📗 Excel出力</button>
    </div>
  </header>
  <div id="backup-banner" class="backup-banner" hidden></div>
  <div class="layout">
    <nav class="sidenav" id="sidenav" aria-label="メニュー"></nav>
    <main class="view" id="view"></main>
  </div>
</div>
<div class="nav-scrim" id="nav-scrim"></div>
<button type="button" class="fab" data-act="quick-memo" title="すぐメモ（キーボードの N でも開けます）">✏️<span>すぐメモ</span></button>
<div id="modal-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>
<div id="tooltip" class="tooltip" role="tooltip"></div>
<div id="print-area"></div>
    <script src='//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script><script  src="./script.js"></script>

  </body>
  
</html>

<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>成績　所見アプリ</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
  <header class="header">
    <h1>📝 所見・指導要録バインダー</h1>
    <button id="export-btn" class="btn btn-outline">📊 CSV出力 (バックアップ)</button>
  </header>

  <div class="main-content">
    <section class="input-panel">
      <h2>エピソード新規入力・編集</h2>
      <div id="episode-form">
        <input type="hidden" id="edit-id">
        
        <div class="form-group">
          <label for="student-name">児童名 <span class="required">*</span></label>
          <input type="text" id="student-name" placeholder="例: 山田 太郎" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="subject">教科</label>
            <select id="subject"></select>
          </div>
          <div class="form-group">
            <label for="unit">単元</label>
            <div class="unit-input-group">
              <select id="unit"></select>
            </div>
            <div class="add-unit-area">
              <input type="text" id="new-unit-name" placeholder="新しい単元名を追加">
              <button type="button" id="add-unit-btn" class="btn btn-secondary">追加</button>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="tag">評価観点・タグ</label>
            <select id="tag">
              <option value="主体性">主体性</option>
              <option value="協調性">協調性</option>
              <option value="思考・判断・表現">思考・判断・表現</option>
              <option value="知識・技能">知識・技能</option>
              <option value="タブレット活用">タブレット活用</option>
              <option value="係・委員会・行事">係・委員会・行事</option>
              <option value="その他">その他</option>
            </select>
          </div>
          <div class="form-group">
            <label for="date">記録日</label>
            <input type="date" id="date" required>
          </div>
        </div>

        <div class="form-group">
          <label for="content">エピソード本文 <span class="required">*</span></label>
          <textarea id="content" rows="5" placeholder="日々の様子や発言をメモ..." required></textarea>
          <div class="char-count" id="char-count">文字数: 0 文字</div>
        </div>

        <div class="quick-phrases">
          <span>時短入力:</span>
          <button type="button" class="phrase-btn" data-text="〜する姿が見られた。">〜する姿が...</button>
          <button type="button" class="phrase-btn" data-text="〜において主体的に取り組んだ。">主体的に...</button>
          <button type="button" class="phrase-btn" data-text="友達と協力して〜を成し遂げた。">協力して...</button>
          <button type="button" class="phrase-btn" data-text="試行錯誤しながら解決しようとした。">試行錯誤...</button>
        </div>

        <div class="form-actions">
          <button type="button" id="clear-btn" class="btn btn-text">🧹 クリア</button>
          <button type="button" id="save-btn" class="btn btn-primary">💾 保存する</button>
        </div>
      </div>
    </section>

    <section class="list-panel">
      <h2>🔍 検索・一覧</h2>
      <div class="search-bar">
        <input type="text" id="search-name" placeholder="児童名で検索...">
        <select id="search-subject">
          <option value="">すべての教科</option>
        </select>
        <select id="search-tag">
          <option value="">すべての観点</option>
          <option value="主体性">主体性</option>
          <option value="協調性">協調性</option>
          <option value="思考・判断・表現">思考・判断・表現</option>
          <option value="知識・技能">知識・技能</option>
          <option value="タブレット活用">タブレット活用</option>
          <option value="係・委員会・行事">係・委員会・行事</option>
        </select>
        <input type="text" id="search-keyword" placeholder="キーワード...">
      </div>

      <div class="table-container">
        <table id="episodes-table">
          <thead>
            <tr>
              <th>日付</th>
              <th>児童名</th>
              <th>教科・単元 / タグ</th>
              <th>内容（抜粋）</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="table-body">
            </tbody>
        </table>
      </div>
    </section>
  </div>
</div>

<div id="toast" class="toast"></div>
    <script  src="./script.js"></script>

  </body>
  
</html>

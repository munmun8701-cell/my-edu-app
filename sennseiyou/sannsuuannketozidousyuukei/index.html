<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>算数アンケート自動集計</title>
    <link rel="stylesheet" href="./style.css">

  <meta name="description" content="算数アンケート自動集計｜児童の算数アンケート結果を自動で集計します。先生の校務や学級経営をサポートするためのツールです。現役の小学校教員が、日々の仕事の中で「こんなツールがあったらいいな」と感じたことをもとに作っています。…">
<meta name="robots" content="noindex">
</head>
    
  <body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<div class="container">
  <h2>📊 算数アンケート 自動集計ツール (エクセル対応版)</h2>
  <p>アンケートのエクセルデータをアップロードして集計します。</p>

  <div class="control-panel">
    <div class="input-group">
      <label for="excel-file">1. エクセルファイルを選択:</label>
      <input type="file" id="excel-file" accept=".xlsx, .xls" />
    </div>

    <div class="input-group">
      <label for="class-select">2. 集計対象のクラス:</label>
      <select id="class-select">
        <option value="">※先にファイルを読み込んでください</option>
      </select>
    </div>

    <button id="calc-btn">集計を実行する</button>
  </div>

  <div id="table-container">
    </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

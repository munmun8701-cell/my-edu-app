<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>引き渡し訓練２</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="container">
  <h1>🏫 引き渡し訓練 データ整理アプリ</h1>
  <p class="description">
    「ファイルを選択」ボタンを押して、集計したエクセルのデータ（.xlsx または .csv）を読み込んでください。<br>
    検索窓でクラスを絞り込んでから「出力」ボタンを押すと、そのクラスだけの名簿がダウンロードできます。
  </p>

  <div class="input-section">
    <input type="file" id="file-input" accept=".xlsx, .xls, .csv" class="file-input">
    <label for="file-input" class="file-label">
      📁 エクセル・CSVファイルを選択してください
    </label>
    <div id="file-name-display" class="file-name"></div>
  </div>

  <div class="controls" id="controls" style="display: none;">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="🔍 クラス、名前、下校コース等で絞り込み">
      <div class="count-display">該当: <span id="count">0</span> 名</div>
    </div>
    <button id="download-btn" class="download-btn">📥 表示中の名簿をExcelで出力</button>
  </div>

  <div class="table-container">
    <table id="result-table" style="display: none;">
      <thead>
        <tr>
          <th>学年・クラス</th>
          <th>出席番号</th>
          <th>児童氏名</th>
          <th>参加可否</th>
          <th>続柄</th>
          <th>引き取り者氏名（ひらがな）</th>
          <th>集団下校コース</th>
          <th>その他連絡事項等</th>
        </tr>
      </thead>
      <tbody id="table-body">
      </tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script  src="./script.js"></script>

  </body>
  
</html>

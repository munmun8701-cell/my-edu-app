  <!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>見取りノート</title>
<style id="pageStyle">@page{size:A4 portrait;margin:12mm}</style>
<style>
:root{
  --font:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --bg:#f3f1ea;--surface:#ffffff;--surface-2:#f8f7f2;--line:#e5e1d6;--line-strong:#d3cdbf;
  --ink:#1c2630;--ink-2:#465260;--muted:#868c94;
  --primary:#1d6a57;--primary-ink:#ffffff;--primary-soft:#e2efea;
  --accent:#c98a12;--accent-soft:#fbf0d9;
  --danger:#bf3b2f;--danger-soft:#fbe8e5;
  --chalk:#2c5a4c;--chalk-ink:#eaf3ef;
  --l1:#d24d57;--l2:#ec8a3c;--l3:#e7bf3f;--l4:#4ea3c4;--l5:#2a649c;--l3-ink:#3a2e00;
  --g1:#e05a5a;--g2:#3d7fd9;--g3:#2e9e6a;--g4:#e0a02a;--g5:#8b5cc7;--g6:#d9558f;--g7:#2aa5a5;--g8:#7a8a2e;--g9:#c2703d;--g10:#5a6bd9;
  --shadow:0 1px 2px rgba(28,38,48,.05),0 6px 16px -6px rgba(28,38,48,.12);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11161b;--surface:#192028;--surface-2:#1e262f;--line:#2a333d;--line-strong:#38434f;
    --ink:#e6eaee;--ink-2:#b3bcc6;--muted:#7f8a96;
    --primary:#4db394;--primary-ink:#0d1b16;--primary-soft:#173329;
    --accent:#e3ac45;--accent-soft:#33290f;--danger:#e8695c;--danger-soft:#3a1d1a;
    --chalk:#21463b;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px -6px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#11161b;--surface:#192028;--surface-2:#1e262f;--line:#2a333d;--line-strong:#38434f;
  --ink:#e6eaee;--ink-2:#b3bcc6;--muted:#7f8a96;
  --primary:#4db394;--primary-ink:#0d1b16;--primary-soft:#173329;
  --accent:#e3ac45;--accent-soft:#33290f;--danger:#e8695c;--danger-soft:#3a1d1a;
  --chalk:#21463b;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px -6px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit}
.ic{width:17px;height:17px;flex:none;vertical-align:-3px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
h2{margin:0;font-size:21px}
h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
h4{margin:16px 0 8px;font-size:14px;color:var(--ink-2)}

/* header */
.app-head{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--chalk);color:var(--chalk-ink);display:grid;place-items:center;font-weight:800;font-size:19px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.brand-name{font-weight:800;font-size:17px;letter-spacing:.06em;line-height:1.2}
.brand-sub{font-size:11px;color:var(--muted)}
.class-select{font-weight:800;min-width:150px;width:auto!important;max-width:260px}
.tabs{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);padding:4px;border-radius:13px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:700;color:var(--ink-2);white-space:nowrap;cursor:pointer;display:flex;gap:6px;align-items:center}
.tabs button.on{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
.head-tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.save-state{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap}
.save-state.error{color:var(--danger);font-weight:700}
.icon-btn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.icon-btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
main{padding:16px 20px 90px;max-width:1500px;margin:0 auto;transition:padding .2s}
@media (min-width:1100px){body.sheet-open main{padding-right:450px}}

/* notices */
#notice{max-width:1500px;margin:0 auto;padding:0 20px}
.notice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);font-size:13.5px}
.notice.warn{background:var(--danger-soft);border-color:var(--danger)}
.notice.soft{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}

/* common controls */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);padding:8px 13px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;min-height:40px;white-space:nowrap;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);color:var(--primary-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.danger-fill{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:700;color:var(--ink-2);cursor:pointer;font-size:14px;display:inline-flex;gap:6px;align-items:center;min-height:36px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
.seg button .full{font-weight:500;font-size:12px;color:var(--muted)}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;cursor:pointer;min-height:32px}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.chip.accent.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-weight:700}
.pill.ok{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
.fld.grow{flex:1;min-width:220px}
input[type=text],input[type=date],select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:10px;padding:8px 10px;min-height:42px;width:100%}
textarea{resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 35%,transparent);outline-offset:1px;border-color:var(--primary)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;padding:4px 0}
.chk input{width:18px;height:18px;accent-color:var(--primary)}

/* 見取り */
.ctx{padding:14px 16px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.ctx .fld{min-width:120px}
.ctx-status{display:flex;align-items:center;gap:6px;padding-bottom:9px}
.mbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 10px}
.progress{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:10px;margin-bottom:14px}
.pg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
.pg.cur{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.pg-top{display:flex;align-items:baseline;gap:8px;font-size:12.5px;white-space:nowrap;overflow:hidden}
.pg-top b{font-size:15px}
.pg-top span{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.pg-top em{font-style:normal;margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.pg-bar{height:6px;background:var(--surface-2);border-radius:99px;margin-top:6px;overflow:hidden}
.pg-bar i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .25s}
@media (max-width:760px){.progress{grid-template-columns:1fr 1fr}.pg-top span{display:none}}

/* board */
.board-scroll{overflow-x:auto;padding:6px 4px 12px;-webkit-overflow-scrolling:touch}
.board{width:max-content;margin:0 auto;display:flex;flex-direction:column;gap:12px;--cw:110px;--aisle:22px}
.front{align-self:center;padding:7px 46px;border-radius:9px;background:var(--chalk);color:var(--chalk-ink);font-weight:700;font-size:13px;letter-spacing:.25em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.grid{display:grid;gap:10px}
.seat{min-height:88px;border-radius:12px;position:relative}
.seat.empty{border:2px dashed var(--line-strong);display:grid;place-items:center;color:var(--muted);font-size:12px}
.seat.empty.tappable{cursor:pointer}
.seat.empty.tappable:hover{border-color:var(--primary);background:var(--primary-soft)}
.seat.disabled{background:repeating-linear-gradient(45deg,transparent 0 7px,var(--line) 7px 8px);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px}
.seat.disabled.tappable{cursor:pointer}
.card-s{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);padding:8px 8px 8px 11px;cursor:pointer;display:flex;flex-direction:column;gap:5px;overflow:hidden;transition:transform .08s,border-color .15s,box-shadow .15s;user-select:none}
.card-s:hover{border-color:var(--primary)}
.card-s:active{transform:scale(.985)}
.gbar{position:absolute;left:0;top:0;bottom:0;width:5px}
.sc-top{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);min-height:16px}
.sc-no{font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.sc-g{font-weight:700}
.sc-name{font-weight:800;font-size:15px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.abs-tag{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:5px;padding:0 5px;font-weight:700;color:var(--ink-2)}
.memo-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.cov{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;font-size:11px;padding:0 6px;border-radius:5px;background:var(--surface-2)}
.minis{display:flex;gap:3px;margin-top:auto}
.mini{flex:1;text-align:center;font-size:11.5px;font-weight:800;border-radius:6px;padding:1px 2px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.mini.l1{background:var(--l1);color:#fff;border-color:transparent}.mini.l2{background:var(--l2);color:#fff;border-color:transparent}.mini.l3{background:var(--l3);color:var(--l3-ink);border-color:transparent}.mini.l4{background:var(--l4);color:#fff;border-color:transparent}.mini.l5{background:var(--l5);color:#fff;border-color:transparent}
.mini.cur{box-shadow:0 0 0 2px var(--primary)}
.card-s.absent{opacity:.5;background:var(--surface-2)}
.card-s.editing{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft),var(--shadow)}
.card-s.low{border:2px dashed var(--accent)}
.card-s.low .cov{background:var(--accent);color:#fff}
.card-s.sel{outline:3px solid var(--accent);outline-offset:2px}
.card-s.never::after{content:"初";position:absolute;top:5px;right:6px;font-size:10px;font-weight:800;background:var(--primary);color:var(--primary-ink);border-radius:5px;padding:0 4px}
.card-s .flags{margin-left:auto;display:flex;gap:3px}
.flag{font-size:10px;font-weight:800;border-radius:4px;padding:0 4px;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--ink-2)}

.lvrow{display:flex;gap:4px}
.lv{flex:1;min-width:0;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:8px;font-weight:800;cursor:pointer;padding:0;height:32px;color:var(--ink-2);font-variant-numeric:tabular-nums;transition:background .1s,transform .06s}
.lv:active{transform:scale(.92)}
.lv:hover{border-color:var(--ink-2)}
.lv.on.l1{background:var(--l1);border-color:var(--l1);color:#fff}
.lv.on.l2{background:var(--l2);border-color:var(--l2);color:#fff}
.lv.on.l3{background:var(--l3);border-color:var(--l3);color:var(--l3-ink)}
.lv.on.l4{background:var(--l4);border-color:var(--l4);color:#fff}
.lv.on.l5{background:var(--l5);border-color:var(--l5);color:#fff}
.lvrow.sm .lv{height:28px;font-size:13px;border-radius:6px}
.lvrow.lg{gap:7px}
.lvrow.lg .lv{height:54px;font-size:21px;border-radius:13px}

/* list view */
.list{overflow:hidden}
.lhead,.lrow{display:grid;grid-template-columns:48px 150px 1fr 240px;gap:12px;align-items:center;padding:8px 14px}
.lhead{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}
.lrow{border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow.absent{background:var(--surface-2)}
.lrow.absent .lvg{opacity:.35}
.lno{font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink-2);text-align:center}
.lname{border:0;background:transparent;text-align:left;font-weight:800;font-size:15px;cursor:pointer;padding:6px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lname:hover{color:var(--primary)}
.lvgroups{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lvg{display:flex;align-items:center;gap:5px;flex:1;min-width:190px}
.lvg-l{font-weight:800;font-size:13px;width:18px;color:var(--ink-2)}
.lvg .lv{height:36px;min-width:30px}
.lvgroups.single .lvg .lv{height:42px;font-size:17px}
.absbtn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;height:36px;padding:0 10px;font-weight:800;font-size:13px;cursor:pointer;color:var(--muted)}
.absbtn.on{background:var(--ink-2);color:var(--surface);border-color:var(--ink-2)}
.lmemo{min-height:38px!important;font-size:14px!important}
.empty-msg{padding:30px;text-align:center;color:var(--muted)}
@media (max-width:980px){
  .lhead{display:none}
  .lrow{grid-template-columns:40px 1fr;row-gap:8px}
  .lvgroups,.lmemo{grid-column:1 / -1}
}

/* sheet */
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-14px 0 40px rgba(0,0,0,.14);transform:translateX(105%);transition:transform .22s ease;z-index:80;display:flex;flex-direction:column}
.sheet.open{transform:none}
.sh-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sh-title{flex:1;min-width:0;text-align:center}
.sh-title b{display:block;font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-no{font-size:12px;color:var(--muted);font-weight:700}
.sh-body{flex:1;overflow-y:auto;padding:14px 16px 30px;display:flex;flex-direction:column;gap:16px}
.rate{display:flex;flex-direction:column;gap:6px}
.rate-l{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--ink-2)}
.rate-l b{font-size:16px;color:var(--ink)}
.rate-hint{font-size:12px;color:var(--muted);min-height:18px}
.rate-hint b{color:var(--ink)}
.sh-lab{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tagb{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
.tagb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sheet textarea{min-height:110px}
.abs-toggle{width:100%}
.hm{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.hm-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.hm-v{display:flex;gap:4px;margin:5px 0 0;max-width:200px}
.hm-memo{margin-top:5px;color:var(--ink-2);white-space:pre-wrap}
@media (max-width:700px){
  .sheet{top:auto;left:0;width:100%;height:86vh;border-radius:20px 20px 0 0;border-left:0;transform:translateY(105%)}
}

/* seating */
.seat-wrap{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
.side{padding:6px 16px 16px;position:sticky;top:76px;max-height:calc(100vh - 92px);overflow-y:auto}
.side-sec{padding:12px 0;border-bottom:1px solid var(--line)}
.side-sec:last-child{border-bottom:0}
.side-sec h4{margin:0 0 10px;font-size:12.5px;color:var(--muted);letter-spacing:.08em}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.stepper-row{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.stepper b{min-width:34px;text-align:center;font-size:18px;font-variant-numeric:tabular-nums}
.btn-col{display:flex;flex-direction:column;gap:7px}
.btn-col .btn{justify-content:flex-start}
.cap{font-size:13px;margin-top:10px;padding:7px 10px;border-radius:9px;background:var(--surface-2)}
.cap.warn{background:var(--danger-soft);color:var(--danger);font-weight:700}
.hint-bar{font-size:13px;color:var(--ink-2);padding:9px 14px;border-radius:11px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px;display:flex;gap:8px;align-items:center}
.hint-bar.edit{background:var(--accent-soft);border-color:var(--accent)}
.selinfo{padding:12px 14px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px;border-color:var(--accent)}
.si-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.gbtn{min-width:36px;height:32px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-weight:800;cursor:pointer;font-size:13px;position:relative;padding:0 8px}
.gbtn::before{content:"";position:absolute;left:4px;right:4px;bottom:3px;height:3px;border-radius:2px;background:var(--gc,transparent)}
.gbtn.on{background:var(--ink);color:var(--surface)}
.never-list{display:flex;flex-wrap:wrap;gap:5px}
.never-list span{font-size:12px;background:var(--primary-soft);color:var(--primary);border-radius:6px;padding:2px 8px;font-weight:700}
.pool{padding:12px 14px;margin-top:6px}
.pool-h{font-size:13px;font-weight:800;color:var(--ink-2);margin-bottom:8px}
.pool-list{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:9px;padding:7px 11px;font-weight:700;font-size:13.5px;cursor:pointer}
.pchip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
@media (max-width:960px){.seat-wrap{grid-template-columns:1fr}.side{position:static;max-height:none}}

/* modal */
.modal-wrap{position:fixed;inset:0;background:rgba(12,18,24,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;backdrop-filter:blur(3px)}
.modal-wrap.open{display:flex}
.modal{background:var(--surface);border-radius:18px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0}
.modal p{margin:0}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
.msec{border:1px solid var(--line);border-radius:12px;padding:12px}
.mlab{font-size:13px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mlab select{width:auto;min-height:32px;padding:3px 8px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:5px;max-height:160px;overflow-y:auto}
.sep-item{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:4px 0}

/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* records */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:6px 0 16px}
.page-head select{width:auto}
.month{font-weight:800;color:var(--muted);font-size:13px;margin:18px 0 8px;letter-spacing:.06em}
.rec{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;padding:12px 16px;margin-bottom:8px}
.rec-date b{display:block;font-size:16px}
.rec-date span{font-size:12px;color:var(--muted)}
.rec-title{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.subj{background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:800;padding:2px 9px;border-radius:6px}
.rec-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px;font-size:12.5px;color:var(--ink-2)}
.rs b{margin-right:3px}
.rec-act{display:flex;gap:6px}
@media (max-width:700px){.rec{grid-template-columns:1fr}.rec-act{justify-content:flex-end}}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted)}

/* karte */
.karte{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start}
.k-list{padding:6px;position:sticky;top:76px;max-height:calc(100vh - 92px);overflow-y:auto}
.k-item{display:flex;width:100%;gap:8px;align-items:center;border:0;background:transparent;padding:8px 10px;border-radius:9px;cursor:pointer;text-align:left}
.k-item:hover{background:var(--surface-2)}
.k-item.on{background:var(--primary-soft);color:var(--primary)}
.k-item .no{width:26px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.k-item .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-item .ct{font-size:12px;color:var(--muted)}
.k-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.k-sec{padding:16px}
.stat-table{width:100%;border-collapse:collapse;font-size:14px}
.stat-table th,.stat-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
.stat-table th{font-size:12px;color:var(--muted)}
.stat-table td:first-child,.stat-table th:first-child{text-align:left}
.avg{font-weight:800;font-size:16px}
.tl{overflow-x:auto}
.tl-row{display:flex;align-items:center;gap:3px;margin-bottom:4px}
.tl-row .tl-l{width:24px;font-weight:800;font-size:13px;flex:none}
.sq{width:20px;height:20px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);flex:none;font-size:10px;font-weight:800;display:grid;place-items:center;color:transparent}
.sq.l1{background:var(--l1);border-color:transparent;color:#fff}.sq.l2{background:var(--l2);border-color:transparent;color:#fff}.sq.l3{background:var(--l3);border-color:transparent;color:var(--l3-ink)}.sq.l4{background:var(--l4);border-color:transparent;color:#fff}.sq.l5{background:var(--l5);border-color:transparent;color:#fff}
.sq.ab{background:repeating-linear-gradient(45deg,var(--surface-2) 0 3px,var(--line-strong) 3px 4px)}
.tagcount{display:flex;flex-wrap:wrap;gap:6px}
.tagcount span{background:var(--accent-soft);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700}
.entry{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:110px 1fr;gap:12px}
.entry:first-child{border-top:0}
.entry-v{display:flex;gap:4px;max-width:210px;margin:4px 0}
.entry-memo{white-space:pre-wrap;color:var(--ink-2);font-size:14px}
@media (max-width:860px){.karte{grid-template-columns:1fr}.k-list{position:static;max-height:240px}}

/* settings */
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px;align-items:start}
@media (max-width:520px){.settings{grid-template-columns:1fr}}
.set-sec{padding:18px}
.class-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;flex-wrap:wrap}
.class-item.on{border-color:var(--primary);background:var(--primary-soft)}
.class-item b{display:block}
.class-item .muted{font-size:12px}
.vp-row,.lvl-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.vp-row .short{width:64px;text-align:center;font-weight:800;flex:none}
.lvdot{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;flex:none;color:#fff}
.lvdot.l1{background:var(--l1)}.lvdot.l2{background:var(--l2)}.lvdot.l3{background:var(--l3);color:var(--l3-ink)}.lvdot.l4{background:var(--l4)}.lvdot.l5{background:var(--l5)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:12px 0 14px}
.kv span{color:var(--muted)}

@media (max-width:700px){
  .app-head{padding:8px 12px;gap:8px}
  .brand-sub,.save-state span.t{display:none}
  main{padding:12px 12px 90px}
  #notice{padding:0 12px}
  .seg button .full{display:none}
}

/* print */
#printArea{display:none}
@media print{
  body.printing>*:not(#printArea){display:none!important}
  body.printing{background:#fff!important;color:#000}
  body.printing #printArea{display:block!important}
}
.p-doc{font-family:var(--font);color:#000;font-size:10pt;line-height:1.4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.p-doc+.p-doc{page-break-before:always}
.p-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:4px;margin-bottom:6px;gap:10px}
.p-head h1{font-size:15pt;margin:0}
.p-meta{display:flex;gap:14px;font-size:10.5pt;font-weight:700;flex-wrap:wrap;justify-content:flex-end}
.p-unit{font-size:10pt;margin:4px 0 8px;padding:4px 8px;border:1px solid #888}
.p-table{width:100%;border-collapse:collapse;table-layout:fixed}
.p-table th,.p-table td{border:1px solid #555;padding:3px 5px;vertical-align:middle;word-break:break-all}
.p-table th{background:#e9e9e9;font-size:9pt}
.p-table td.c{text-align:center}
.p-table td.lvc{text-align:center;font-weight:800;font-size:12.5pt}
.p-table td.memo{font-size:9pt}
.p-table tr{page-break-inside:avoid}
.p-table thead{display:table-header-group}
.p-table tr.ab td{background:#f2f2f2}
.p-foot{margin-top:8px;font-size:8.5pt;display:flex;flex-direction:column;gap:4px}
.p-dist{border-collapse:collapse;font-size:9pt}
.p-dist td,.p-dist th{border:1px solid #888;padding:2px 8px;text-align:center}
.p-small{font-size:8pt;color:#333}
.ps-front{text-align:center;margin:6px auto;width:40%;border:2px solid #000;padding:4px;font-weight:800;letter-spacing:.3em}
.ps{border-collapse:separate;border-spacing:6px;margin:0 auto}
.ps td.cell{border:1.5px solid #000;width:30mm;height:17mm;text-align:center;vertical-align:middle;border-radius:4px;padding:2px}
.ps td.cell.dis{border:1px dashed #bbb}
.ps td.cell.emp{border:1px dashed #777}
.ps td.aisle{width:6mm}
.ps-no{font-size:8.5pt;color:#333}
.ps-name{font-size:13pt;font-weight:800}
</style>
</head>
<body>
<header class="app-head">
  <div class="brand"><div class="logo">見</div><div><div class="brand-name">見取りノート</div><div class="brand-sub">座席表 × 観点別の見取り記録</div></div></div>
  <select id="classSelect" class="class-select" data-ch="class" aria-label="クラスを選ぶ"></select>
  <nav class="tabs" id="tabs"></nav>
  <div class="head-tools"><span id="saveState" class="save-state"></span><button id="namesBtn" class="icon-btn" data-act="toggleNames"></button></div>
</header>
<div id="notice"></div>
<main id="view"></main>
<aside id="sheet" class="sheet" aria-label="個別の記録"></aside>
<div id="modalWrap" class="modal-wrap"><div class="modal" id="modal" role="dialog"></div></div>
<div id="toast"></div>
<div id="printArea"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
'use strict';
/* ========== 基本 ========== */
const KEY='mitori-note-v2';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD='日月火水木金土';
function todayStr(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function parseD(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function fmtDate(s){if(!s)return '';const d=parseD(s);return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`;}
function fmtDateLong(s){if(!s)return '';const d=parseD(s);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`;}
const PERIODS=['朝','1時間目','2時間目','3時間目','4時間目','5時間目','6時間目','放課後'];
function guessPeriod(){const d=new Date(),m=d.getHours()*60+d.getMinutes();const t=[[0,'1時間目'],[570,'2時間目'],[625,'3時間目'],[685,'4時間目'],[740,'5時間目'],[860,'6時間目']];let p='1時間目';t.forEach(([s,n])=>{if(m>=s)p=n;});return p;}
const sessKey=s=>s.date+'_'+pad(PERIODS.indexOf(s.period)+1);
const numCmp=(a,b)=>{const x=parseFloat(a),y=parseFloat(b);if(!isNaN(x)&&!isNaN(y)&&x!==y)return x-y;return String(a).localeCompare(String(b),'ja',{numeric:true});};
const hasContent=e=>!!e&&(e.absent||(e.v||[]).some(x=>x)||!!e.memo||(e.tags||[]).length>0);
const splitList=t=>t.split(/[、,，\n]/).map(x=>x.trim()).filter(Boolean);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const avgOf=a=>{const v=a.filter(x=>x>0);return v.length?(v.reduce((s,x)=>s+x,0)/v.length):0;};
const f1=x=>x?x.toFixed(1):'–';

const P={
  eye:'<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeOff:'<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>',
  print:'<polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
  undo:'<polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/>',
  redo:'<polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/>',
  shuffle:'<polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/>',
  save:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',
  clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  minus:'<line x1="5" y1="12" x2="19" y2="12"/>',
  x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  chevL:'<polyline points="15 18 9 12 15 6"/>',chevR:'<polyline points="9 18 15 12 9 6"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
  list:'<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',
  zap:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
  alert:'<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'
};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]||''}</svg>`;

/* ========== 状態 ========== */
const DEFAULT_SETTINGS={
  vp:[{name:'知識・技能',short:'知'},{name:'思考・判断・表現',short:'思'},{name:'主体的に学習に取り組む態度',short:'主'}],
  levels:['努力を要する','やや努力を要する','おおむね満足できる','十分満足できる','特に優れている'],
  subjects:['国語','社会','算数','理科','生活','音楽','図画工作','家庭','体育','外国語','外国語活動','道徳','総合','学活'],
  tags:['発言・発表','よい気付き','工夫','協力・思いやり','粘り強さ','ノートが丁寧','個別支援','要声かけ'],
  hideNames:false,theme:'auto',autoNext:false,coverageDays:28
};
const SAMPLE=['相川 はると','石井 ゆい','上田 そうた','江口 めい','大野 りく','加藤 さくら','木村 ゆうと','工藤 ひな','小林 れん','斎藤 あおい','佐々木 こうき','清水 みお','鈴木 だいち','高橋 ゆな','田中 かいと','土屋 ことね','中村 しょう','西田 ほのか','野口 たくみ','長谷川 りん','林 けんと','藤井 まな','本田 ゆうき','前田 つむぎ','松本 そら','三浦 えま','村上 あきと','森 ここな','山口 はやと','山本 いろは','吉田 じん','渡辺 ゆずき'];
let storageOK=true;

function newClass(name,students,cols=6){
  const rows=Math.max(1,Math.ceil(students.length/cols));
  const c={id:uid(),name,students,layout:{cols,rows,aisle:cols%2===0?2:0,disabled:[],view:'teacher'},seats:new Array(cols*rows).fill(null),groups:{},history:[],front:[],frontRows:2,fixed:[],separate:[]};
  arrangeByNumber(c,'col');return c;
}
function freshState(){
  const c=newClass('サンプル 4年1組',SAMPLE.map((n,i)=>({id:uid(),no:i+1,name:n})));
  return {v:2,settings:clone(DEFAULT_SETTINGS),classes:[c],currentClassId:c.id,sessions:[],ui:{tab:'mitori',mview:'seat',focus:-1,lastSubject:'算数'},meta:{created:Date.now(),lastBackup:0,sample:true}};
}
function migrate(d){
  if(!d||!Array.isArray(d.classes)||!d.classes.length)throw new Error('invalid');
  d.settings=Object.assign(clone(DEFAULT_SETTINGS),d.settings||{});
  d.ui=Object.assign({tab:'mitori',mview:'seat',focus:-1,lastSubject:'算数'},d.ui||{});
  d.meta=Object.assign({lastBackup:0,sample:false},d.meta||{});
  d.sessions=(d.sessions||[]).filter(s=>s&&s.entries);
  d.sessions.forEach(s=>{Object.values(s.entries).forEach(e=>{e.v=[0,1,2].map(i=>(e.v||[])[i]||0);e.tags=e.tags||[];e.memo=e.memo||'';e.absent=!!e.absent;});});
  d.sessions=d.sessions.filter(s=>s.unit||Object.values(s.entries).some(hasContent));
  d.classes.forEach(c=>{
    c.layout=Object.assign({cols:6,rows:6,aisle:0,disabled:[],view:'teacher'},c.layout||{});
    c.students=c.students||[];c.groups=c.groups||{};c.history=c.history||[];c.front=c.front||[];c.frontRows=c.frontRows||2;c.fixed=c.fixed||[];c.separate=c.separate||[];
    const len=c.layout.cols*c.layout.rows,old=Array.isArray(c.seats)?c.seats:[];
    c.seats=Array.from({length:len},(_,i)=>old[i]??null);
  });
  if(!d.classes.find(c=>c.id===d.currentClassId))d.currentClassId=d.classes[0].id;
  return d;
}
function load(){
  try{const raw=localStorage.getItem(KEY);if(!raw)return null;
    try{return migrate(JSON.parse(raw));}catch(e){try{localStorage.setItem(KEY+'-broken-'+Date.now(),raw);}catch(_){}return null;}
  }catch(e){storageOK=false;return null;}
}

/* ========== 座席ロジック ========== */
function seatOrder(c,dir='col'){
  const L=c.layout,ks=[...Array(L.cols).keys()];if(L.view==='teacher')ks.reverse();
  const out=[];
  if(dir==='col')ks.forEach(k=>{for(let r=0;r<L.rows;r++)out.push(r*L.cols+k);});
  else for(let r=0;r<L.rows;r++)ks.forEach(k=>out.push(r*L.cols+k));
  return out.filter(i=>!L.disabled.includes(i));
}
function arrangeByNumber(c,dir){const L=c.layout;c.seats=new Array(L.cols*L.rows).fill(null);const order=seatOrder(c,dir);sorted(c).forEach((s,i)=>{if(i<order.length)c.seats[order[i]]=s.id;});}
function unplacedOf(c){const p=new Set(c.seats.filter(Boolean));return sorted(c).filter(s=>!p.has(s.id));}
function fillEmpty(c){const un=unplacedOf(c);const empt=seatOrder(c,'col').filter(i=>!c.seats[i]);un.forEach((s,j)=>{if(j<empt.length)c.seats[empt[j]]=s.id;});return Math.max(0,un.length-empt.length);}
function resizeLayout(c,cols,rows){
  const L=c.layout,ns=new Array(cols*rows).fill(null),nd=[];
  for(let r=0;r<L.rows;r++)for(let k=0;k<L.cols;k++){const i=r*L.cols+k;if(r<rows&&k<cols){ns[r*cols+k]=c.seats[i];if(L.disabled.includes(i))nd.push(r*cols+k);}}
  L.cols=cols;L.rows=rows;L.disabled=nd;c.seats=ns;
}
const pk=(a,b)=>a<b?a+'|'+b:b+'|'+a;
function forEachNeighborPair(seats,cols,rows,fn){
  for(let i=0;i<seats.length;i++){const a=seats[i];if(!a)continue;const r=Math.floor(i/cols),k=i%cols;
    for(const [dr,dk] of [[0,1],[1,-1],[1,0],[1,1]]){const r2=r+dr,k2=k+dk;if(r2<0||r2>=rows||k2<0||k2>=cols)continue;const b=seats[r2*cols+k2];if(b)fn(a,b);}}
}
function adjCounts(c){const m=new Map();c.history.forEach(h=>forEachNeighborPair(h.seats,h.cols,h.rows,(a,b)=>{const k=pk(a,b);m.set(k,(m.get(k)||0)+1);}));return m;}
function randomArrange(c,avoid){
  const L=c.layout,n=L.cols*L.rows;
  const usable=[...Array(n).keys()].filter(i=>!L.disabled.includes(i));
  const fixedSeats=new Map();
  c.fixed.forEach(sid=>{const i=c.seats.indexOf(sid);if(i>=0&&usable.includes(i))fixedSeats.set(i,sid);});
  const fixedIds=new Set(fixedSeats.values());
  const movers=sorted(c).map(s=>s.id).filter(id=>!fixedIds.has(id));
  const free=usable.filter(i=>!fixedSeats.has(i));
  const isFront=i=>Math.floor(i/L.cols)<c.frontRows;
  const frontIds=movers.filter(id=>c.front.includes(id)),otherIds=movers.filter(id=>!c.front.includes(id));
  const counts=adjCounts(c),cur=new Set();forEachNeighborPair(c.seats,L.cols,L.rows,(a,b)=>cur.add(pk(a,b)));
  const sep=new Set(c.separate.map(([a,b])=>pk(a,b)));
  let best=null,bestScore=Infinity,bestStats={sep:0,rep:0};
  for(let t=0;t<900;t++){
    const seats=new Array(n).fill(null);fixedSeats.forEach((sid,i)=>seats[i]=sid);
    const fs=shuffle(free.filter(isFront)),bs=shuffle(free.filter(i=>!isFront(i)));
    shuffle(frontIds.slice()).forEach(id=>{const i=fs.length?fs.shift():bs.shift();if(i!==undefined)seats[i]=id;});
    const rest=shuffle(fs.concat(bs));
    shuffle(otherIds.slice()).forEach(id=>{const i=rest.shift();if(i!==undefined)seats[i]=id;});
    let score=0,sh=0,rep=0;
    forEachNeighborPair(seats,L.cols,L.rows,(a,b)=>{const k=pk(a,b);if(sep.has(k)){score+=1000;sh++;}
      if(avoid){const h=counts.get(k)||0;if(cur.has(k))score+=8;if(h)score+=h*2;if(cur.has(k)||h)rep++;}});
    if(score<bestScore){bestScore=score;best=seats;bestStats={sep:sh,rep};if(score===0)break;}
  }
  return {seats:best,stats:bestStats};
}
function autoGroups(c,bw,bh){
  c.groups={};const L=c.layout;let g=0;
  const ks=[...Array(L.cols).keys()];if(L.view==='teacher')ks.reverse();
  for(let br=0;br<L.rows;br+=bh)for(let bi=0;bi<L.cols;bi+=bw){
    const mem=[];for(let r=br;r<Math.min(L.rows,br+bh);r++)for(let j=bi;j<Math.min(L.cols,bi+bw);j++){const s=c.seats[r*L.cols+ks[j]];if(s)mem.push(s);}
    if(mem.length){g++;mem.forEach(s=>c.groups[s]=g);}
  }
  return g;
}
const gColor=g=>g?`var(--g${((g-1)%10)+1})`:'transparent';

function computeCoverage(){
  const c=cls(),days=S.settings.coverageDays||28,from=todayStr(new Date(Date.now()-days*864e5)),m={};
  c.students.forEach(s=>m[s.id]=0);
  S.sessions.forEach(se=>{if(se.classId!==c.id||se.date<from||se.subject!==ui.subject)return;
    Object.entries(se.entries).forEach(([sid,e])=>{if(m[sid]!==undefined&&!e.absent&&(e.v.some(x=>x)||e.memo||e.tags.length))m[sid]++;});});
  ui.cov=m;const vals=Object.values(m);ui.covMin=vals.length?Math.min(...vals):0;
}
function lvBtn(sid,vi,l,e){return `<button class="lv l${l} ${e&&e.v[vi]===l?'on':''}" data-act="lv" data-sid="${sid}" data-vi="${vi}" data-lv="${l}" title="${l}：${esc(S.settings.levels[l-1])}">${l}</button>`;}

function mCardInner(s){
  const c=cls(),e=getEntry(findSession(),s.id),f=S.ui.focus,g=c.groups[s.id];
  let h=g?`<i class="gbar" style="background:${gColor(g)}"></i>`:'';
  h+=`<div class="sc-top"><span class="sc-no">${esc(s.no)}</span>${g?`<span class="sc-g">${g}班</span>`:''}${e&&e.absent?'<span class="abs-tag">欠席</span>':''}${e&&(e.memo||e.tags.length)?'<span class="memo-dot" title="メモ・様子あり"></span>':''}${ui.coverage?`<span class="cov" title="直近${S.settings.coverageDays}日の${esc(ui.subject)}で記録した回数">${ui.cov[s.id]||0}回</span>`:''}</div>`;
  h+=`<div class="sc-name">${esc(dispName(s))}</div>`;
  if(f>=0&&!(e&&e.absent))h+=`<div class="lvrow sm">${[1,2,3,4,5].map(l=>lvBtn(s.id,f,l,e)).join('')}</div>`;
  h+=minisHTML(e,f);
  return h;
}
function cardClasses(s,mode){
  const e=getEntry(findSession(),s.id);let k='seat card-s';
  if(mode==='mitori'){if(e&&e.absent)k+=' absent';if(ui.sheet===s.id)k+=' editing';if(ui.coverage&&(ui.cov[s.id]||0)===ui.covMin)k+=' low';}
  return k;
}
function seatBoard(mode,ctx={}){
  const c=cls(),L=c.layout,teacher=L.view==='teacher',map=byIdMap(c);
  const sc=dk=>teacher?L.cols-1-dk:dk,sr=dr=>teacher?L.rows-1-dr:dr;
  const tmpl=[],pos=[];let g=1,aisles=0;
  for(let dk=0;dk<L.cols;dk++){pos[dk]=g;tmpl.push('var(--cw)');g++;
    if(dk<L.cols-1&&L.aisle){const lo=Math.min(sc(dk),sc(dk+1));if((lo+1)%L.aisle===0){tmpl.push('var(--aisle)');g++;aisles++;}}}
  let cells='';
  for(let dr=0;dr<L.rows;dr++)for(let dk=0;dk<L.cols;dk++){
    const idx=sr(dr)*L.cols+sc(dk);
    cells+=`<div style="grid-row:${dr+1};grid-column:${pos[dk]}">${cellHTML(idx,mode,c,map,ctx)}</div>`;
  }
  const front=`<div class="front">${teacher?'教卓（先生側）':'黒板・教卓'}</div>`;
  return `<div class="board ${mode==='mitori'&&S.ui.focus>=0?'focus-on':''}" data-cols="${L.cols}" data-aisles="${aisles}">${teacher?'':front}<div class="grid" style="grid-template-columns:${tmpl.join(' ')}">${cells}</div>${teacher?front:''}</div>`;
}
function cellHTML(idx,mode,c,map,ctx){
  const L=c.layout,dis=L.disabled.includes(idx),s=map.get(c.seats[idx]);
  if(mode==='seat'){
    if(dis)return `<div class="seat disabled ${ui.layoutEdit?'tappable':''}" data-act="seatTap" data-idx="${idx}">${ui.layoutEdit?'使わない':''}</div>`;
    if(!s)return `<div class="seat empty tappable" data-act="seatTap" data-idx="${idx}">${ui.layoutEdit?'タップで「使わない」':'空席'}</div>`;
    const g=c.groups[s.id],sel=ui.sel&&ui.sel.kind==='seat'&&ui.sel.idx===idx;
    const never=ctx.never&&ctx.never.has(s.id);
    return `<div class="seat card-s ${sel?'sel':''} ${never?'never':''}" data-act="seatTap" data-idx="${idx}">${g?`<i class="gbar" style="background:${gColor(g)}"></i>`:''}
      <div class="sc-top"><span class="sc-no">${esc(s.no)}</span>${g?`<span class="sc-g">${g}班</span>`:''}<span class="flags">${c.front.includes(s.id)?'<span class="flag">前</span>':''}${c.fixed.includes(s.id)?'<span class="flag">固定</span>':''}</span></div>
      <div class="sc-name">${esc(dispName(s))}</div></div>`;
  }
  if(dis)return `<div class="seat disabled"></div>`;
  if(!s)return `<div class="seat empty"></div>`;
  return `<div class="${cardClasses(s,'mitori')}" data-act="openSheet" data-sid="${s.id}" data-paint="${s.id}">${mCardInner(s)}</div>`;
}
function fitBoard(){
  $$('.board').forEach(b=>{const w=b.parentElement.clientWidth-10,cols=+b.dataset.cols,ai=+b.dataset.aisles;
    const tracks=cols+ai,min=b.classList.contains('focus-on')?132:98;
    let cw=(w-ai*22-(tracks-1)*10)/cols;cw=Math.max(min,Math.min(180,cw));b.style.setProperty('--cw',cw+'px');});
}
function progressHTML(){
  const c=cls(),sess=findSession(),vp=S.settings.vp,cnt=[0,0,0];let abs=0;
  c.students.forEach(s=>{const e=getEntry(sess,s.id);if(e&&e.absent){abs++;return;}if(e)e.v.forEach((v,i)=>{if(v)cnt[i]++;});});
  const pres=c.students.length-abs;
  return vp.map((v,i)=>{const p=pres?Math.round(cnt[i]/pres*100):0;
    return `<div class="pg ${S.ui.focus===i?'cur':''}"><div class="pg-top"><b>${esc(v.short)}</b><span>${esc(v.name)}</span><em>${cnt[i]}/${pres}</em></div><div class="pg-bar"><i style="width:${p}%"></i></div></div>`;}).join('')

}

function sheetTagsHTML(s,e){return S.settings.tags.map(t=>`<button class="tagb ${e&&e.tags.includes(t)?'on':''}" data-act="tag" data-sid="${s.id}" data-tag="${esc(t)}">${esc(t)}</button>`).join('')||'<span class="muted small">設定でタグを追加できます</span>';}

  const past=S.sessions.filter(se=>se.classId===c.id&&se!==sess&&hasContent(se.entries[s.id])).sort((a,b)=>sessKey(b).localeCompare(sessKey(a))).slice(0,6);

    <button class="icon-btn" data-act="sheetNav" data-d="1" title="次の番号">${ic('chevR')}</button><button class="icon-btn" data-act="closeSheet" title="閉じる">${ic('x')}</button></div>

    <div id="shRatings" style="display:flex;flex-direction:column;gap:14px">${sheetRatingsHTML(s,e)}</div>

    <div><div class="sh-lab">これまでの記録</div>${past.map(se=>{const x=se.entries[s.id];return `<div class="hm"><div class="hm-top"><b>${fmtDate(se.date)}</b><span>${esc(se.subject)}</span><span class="muted">${esc(se.unit||'')}</span></div><div class="hm-v">${x.absent?'<span class="mini">欠席</span>':vp.map((v,i)=>`<span class="mini ${x.v[i]?'l'+x.v[i]:''}">${esc(v.short)}${x.v[i]||'–'}</span>`).join('')}</div>${x.memo?`<div class="hm-memo">${esc(x.memo)}</div>`:''}</div>`;}).join('')||'<p class="muted small" style="margin:0">まだ記録はありません。</p>'}</div>

function openSheet(sid){ui.sheet=sid;renderSheet();$('#sheet').classList.add('open');document.body.classList.add('sheet-open');
  $$('[data-paint]').forEach(el=>el.classList.toggle('editing',el.dataset.paint===sid));
  const card=$(`[data-paint="${sid}"]`);if(card)card.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
  setTimeout(fitBoard,240);}
function closeSheet(){ui.sheet=null;$('#sheet').classList.remove('open');document.body.classList.remove('sheet-open');$$('[data-paint].editing').forEach(el=>el.classList.remove('editing'));setTimeout(fitBoard,240);}
function navSheet(d){const st=sorted(cls());if(!st.length)return;let i=st.findIndex(s=>s.id===ui.sheet);i=(i+d+st.length)%st.length;openSheet(st[i].id);}

/* ========== 座席・席替え ========== */
function renderSeating(){
  const c=cls(),L=c.layout,map=byIdMap(c),pool=unplacedOf(c),usable=L.cols*L.rows-L.disabled.length,n=c.students.length;
  let ctx={},selInfo='';
  if(ui.sel){
    const sid=ui.sel.kind==='seat'?c.seats[ui.sel.idx]:ui.sel.sid,s=map.get(sid);
    if(!s)ui.sel=null;else{
      let never=null;
      if(c.history.length){const cnt=adjCounts(c);never=sorted(c).filter(o=>o.id!==sid&&!cnt.get(pk(sid,o.id)));ctx.never=new Set(never.map(o=>o.id));}
      const cg=c.groups[sid]||0;
      selInfo=`<div class="selinfo card"><div class="row wrap"><b>${esc(s.no)} ${esc(dispName(s))}</b><span class="muted small">を選択中 → ${ui.sel.kind==='seat'?'移動先の席をタップ（児童がいれば入れ替え）':'置きたい席をタップ'}</span><span class="sp"></span>${ui.sel.kind==='seat'?'<button class="btn sm" data-act="unseat">席から外す</button>':''}<button class="btn sm ghost" data-act="deselect">選択解除</button></div>
      <div class="si-row"><span class="muted small">班</span>${[...Array(Math.max(10,Math.max(0,...Object.values(c.groups))+2)).keys()].map(g=>`<button class="gbtn ${g===cg?'on':''}" style="--gc:${gColor(g)}" data-act="setGroup" data-g="${g}">${g||'なし'}</button>`).join('')}</div>
      ${never?`<div><div class="muted small" style="margin-bottom:5px">これまで近くの席になったことがない人（${never.length}人）<b style="color:var(--primary)">「初」</b>のカード</div><div class="never-list">${never.slice(0,24).map(o=>`<span>${esc(dispName(o))}</span>`).join('')}${never.length>24?'<span>…</span>':''}</div></div>`:'<div class="muted small">座席を「保存」しておくと、近くになったことがない人を表示できます。</div>'}</div>`;
    }
  }
  const hint=ui.layoutEdit?'机がない場所・使わない場所をタップして切り替えます。終わったら「完了」を押してください。':ui.sel?'移動先をタップしてください。':'児童をタップして選び、移動先の席をタップすると移動・入れ替えができます。';
  view().innerHTML=`<div class="seat-wrap">
  <aside class="side card">
    <div class="side-sec"><h4>レイアウト</h4>
      <div class="quick">${[4,5,6,7,8].map(k=>`<button class="chip ${L.cols===k?'on':''}" data-act="quickCols" data-n="${k}">${k}列</button>`).join('')}</div>
      <div class="stepper-row"><span>列（横の数）</span><div class="stepper"><button data-act="step" data-k="cols" data-d="-1">${ic('minus')}</button><b>${L.cols}</b><button data-act="step" data-k="cols" data-d="1">${ic('plus')}</button></div></div>
      <div class="stepper-row"><span>行（縦の数）</span><div class="stepper"><button data-act="step" data-k="rows" data-d="-1">${ic('minus')}</button><b>${L.rows}</b><button data-act="step" data-k="rows" data-d="1">${ic('plus')}</button></div></div>
      <div class="stepper-row"><span>通路</span><select data-ch="aisle" style="width:150px">${[[0,'なし'],[2,'2列ごと（ペア）'],[3,'3列ごと']].map(([v,l])=>`<option value="${v}" ${L.aisle===v?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="seg" style="width:100%;margin:6px 0"><button style="flex:1" class="${L.view==='teacher'?'on':''}" data-act="seatView" data-v="teacher">教師目線</button><button style="flex:1" class="${L.view==='student'?'on':''}" data-act="seatView" data-v="student">児童目線</button></div>
      <button class="btn ${ui.layoutEdit?'on':''}" style="width:100%" data-act="layoutEdit">${ui.layoutEdit?ic('check')+'完了':'使わない席を設定'}</button>
      <div class="cap ${usable<n?'warn':''}">座席 ${usable}席 ／ 児童 ${n}人${usable<n?`（${n-usable}席たりません）`:''}</div>
    </div>
    <div class="side-sec"><h4>配置</h4><div class="btn-col">
      <button class="btn primary" data-act="openRandom">${ic('shuffle')}ランダム席替え…</button>
      <button class="btn" data-act="arrange" data-dir="col">番号順に並べる（縦）</button>
      <button class="btn" data-act="arrange" data-dir="row">番号順に並べる（横）</button>
      <button class="btn ghost danger" data-act="clearSeats">すべて席から外す</button></div>
      <div class="row" style="margin-top:8px"><button class="btn" style="flex:1" data-act="undo" ${ui.undo.length?'':'disabled'}>${ic('undo')}戻す</button><button class="btn" style="flex:1" data-act="redo" ${ui.redo.length?'':'disabled'}>${ic('redo')}進む</button></div>
    </div>
    <div class="side-sec"><h4>班</h4>
      <select id="grpMode"><option value="2x2">2×2（4人班）</option><option value="2x3">縦3×横2（6人班）</option><option value="3x2">横3×縦2（6人班）</option><option value="1x1">1列ずつ（縦の列で班）</option></select>
      <div class="row" style="margin-top:8px"><button class="btn" style="flex:1" data-act="autoGroup">${ic('users')}自動で分ける</button><button class="btn ghost" data-act="clearGroups">消す</button></div>
    </div>
    <div class="side-sec"><h4>保存・印刷</h4><div class="btn-col">
      <button class="btn" data-act="openSaveSeats">${ic('save')}この座席を保存（履歴へ）</button>
      <button class="btn" data-act="openHistory">${ic('clock')}過去の座席（${c.history.length}）</button>
      <button class="btn" data-act="printSeats">${ic('print')}座席表を印刷</button></div>
    </div>
  </aside>
  <section style="min-width:0">
    <div class="hint-bar ${ui.layoutEdit?'edit':''}">${hint}</div>
    ${selInfo}
    <div class="board-scroll">${seatBoard('seat',ctx)}</div>
    <div class="pool card"><div class="pool-h">未配置の児童　${pool.length}人</div><div class="pool-list">${pool.map(s=>`<button class="pchip ${ui.sel&&ui.sel.kind==='pool'&&ui.sel.sid===s.id?'sel':''}" data-act="poolTap" data-sid="${s.id}">${esc(s.no)} ${esc(dispName(s))}</button>`).join('')||'<span class="muted small">全員が席についています。</span>'}</div></div>
  </section></div>`;
  fitBoard();
}
function seatTap(idx){
  const c=cls(),L=c.layout;
  if(ui.layoutEdit){pushUndo();const k=L.disabled.indexOf(idx);if(k>=0)L.disabled.splice(k,1);else{L.disabled.push(idx);c.seats[idx]=null;}save();renderSeating();return;}
  if(L.disabled.includes(idx))return;
  const sel=ui.sel;
  if(!sel){if(c.seats[idx])ui.sel={kind:'seat',idx};}
  else if(sel.kind==='seat'){if(sel.idx!==idx){pushUndo();[c.seats[sel.idx],c.seats[idx]]=[c.seats[idx],c.seats[sel.idx]];save();}ui.sel=null;}
  else{pushUndo();c.seats[idx]=sel.sid;ui.sel=null;save();}
  renderSeating();
}
function poolTap(sid){
  const c=cls(),sel=ui.sel;
  if(sel&&sel.kind==='pool'&&sel.sid===sid)ui.sel=null;
  else if(sel&&sel.kind==='seat'){pushUndo();c.seats[sel.idx]=sid;ui.sel=null;save();}
  else ui.sel={kind:'pool',sid};
  renderSeating();
}
function applyResize(cols,rows){
  const c=cls();cols=Math.max(1,Math.min(12,cols));rows=Math.max(1,Math.min(12,rows));
  if(cols===c.layout.cols&&rows===c.layout.rows)return;
  pushUndo();
  if(c.layout.aisle&&cols<=c.layout.aisle)c.layout.aisle=0;
  resizeLayout(c,cols,rows);const left=fillEmpty(c);ui.sel=null;save();renderSeating();
  if(left)toast(`席が足りず ${left}人が未配置です。行か列を増やしてください。`);
}

/* ========== 記録・印刷 ========== */
function sessStats(c,se){
  let abs=0,memo=0;const vals=[[],[],[]];
  c.students.forEach(s=>{const e=se.entries[s.id];if(!e)return;if(e.absent){abs++;return;}e.v.forEach((v,i)=>{if(v)vals[i].push(v);});if(e.memo)memo++;});
  return {abs,memo,pres:c.students.length-abs,vp:vals.map(a=>({n:a.length,avg:avgOf(a)}))};
}
function renderRecords(){
  const c=cls(),all=S.sessions.filter(s=>s.classId===c.id),subs=[...new Set(all.map(s=>s.subject))];
  if(ui.recFilter!=='all'&&!subs.includes(ui.recFilter))ui.recFilter='all';
  const list=all.filter(s=>ui.recFilter==='all'||s.subject===ui.recFilter).sort((a,b)=>sessKey(b).localeCompare(sessKey(a)));
  let last='',items='';const vp=S.settings.vp;
  list.forEach(se=>{const m=se.date.slice(0,7);if(m!==last){const d=parseD(se.date);items+=`<div class="month">${d.getFullYear()}年${d.getMonth()+1}月</div>`;last=m;}
    const st=sessStats(c,se);
    items+=`<div class="rec card"><div class="rec-date"><b>${fmtDate(se.date)}</b><span>${esc(se.period)}</span></div>
      <div><div class="rec-title"><span class="subj">${esc(se.subject)}</span>${esc(se.unit||'（単元未記入）')}</div>
      <div class="rec-stats">${vp.map((v,i)=>`<span class="rs"><b>${esc(v.short)}</b>${st.vp[i].n}/${st.pres}${st.vp[i].n?`（平均${f1(st.vp[i].avg)}）`:''}</span>`).join('')}${st.abs?`<span class="rs">欠席${st.abs}</span>`:''}${st.memo?`<span class="rs">メモ${st.memo}件</span>`:''}</div></div>
      <div class="rec-act"><button class="btn sm" data-act="openSession" data-id="${se.id}">${ic('pen')}開く</button><button class="btn sm" data-act="printSession" data-id="${se.id}">${ic('print')}印刷</button><button class="btn sm ghost danger" data-act="delSession" data-id="${se.id}" title="削除">${ic('trash')}</button></div></div>`;});
  view().innerHTML=`<div class="page-head"><div><h2>記録・印刷</h2><p class="muted" style="margin:4px 0 0">${esc(c.name)}の授業記録 ${list.length}件</p></div>
    <div class="row wrap"><select data-ch="recFilter"><option value="all">すべての教科</option>${subs.map(s=>`<option ${s===ui.recFilter?'selected':''}>${esc(s)}</option>`).join('')}</select>
    <button class="btn" data-act="openSummary">${ic('print')}期間の集計を印刷</button><button class="btn" data-act="printSeats">${ic('print')}座席表を印刷</button><button class="btn" data-act="exportCSV">${ic('download')}CSV（Excel用）</button></div></div>
    ${items||`<div class="card empty-state">${ic('book')}<p>まだ記録がありません。「見取り」タブで評価を入力すると、ここに授業ごとにたまっていきます。</p></div>`}`;
}

/* ========== 児童カルテ ========== */
function studentEntries(c,sid,subj){
  return S.sessions.filter(s=>s.classId===c.id&&(subj==='all'||s.subject===subj)&&hasContent(s.entries[sid])).sort((a,b)=>sessKey(a).localeCompare(sessKey(b))).map(s=>({s,e:s.entries[sid]}));
}
function karteData(c,sid,subj){
  const ents=studentEntries(c,sid,subj),bySub={},tagc={};
  studentEntries(c,sid,'all').forEach(({s,e})=>{const b=bySub[s.subject]||(bySub[s.subject]={n:0,abs:0,v:[[],[],[]]});if(e.absent){b.abs++;return;}b.n++;e.v.forEach((x,i)=>{if(x)b.v[i].push(x);});});
  ents.forEach(({e})=>e.tags.forEach(t=>tagc[t]=(tagc[t]||0)+1));
  return {ents,bySub,tagc};
}
function renderKarte(){
  const c=cls(),st=sorted(c);
  if(!st.length){view().innerHTML='<div class="card empty-state">名簿が登録されていません。</div>';return;}
  if(!st.find(s=>s.id===ui.karteSid))ui.karteSid=st[0].id;
  const s=st.find(x=>x.id===ui.karteSid),vp=S.settings.vp,subj=ui.karteSubj;
  const subsAll=[...new Set(S.sessions.filter(x=>x.classId===c.id).map(x=>x.subject))];
  const {ents,bySub,tagc}=karteData(c,s.id,subj);
  const counts={};S.sessions.forEach(se=>{if(se.classId!==c.id)return;st.forEach(o=>{if(hasContent(se.entries[o.id]))counts[o.id]=(counts[o.id]||0)+1;});});
  const subRows=Object.entries(bySub).map(([k,b])=>`<tr><td><b>${esc(k)}</b></td><td>${b.n}${b.abs?`<span class="muted small">（欠${b.abs}）</span>`:''}</td>${b.v.map(a=>`<td><span class="avg">${f1(avgOf(a))}</span><span class="muted small">（${a.length}）</span></td>`).join('')}</tr>`).join('');
  view().innerHTML=`<div class="karte">
  <aside class="k-list card">${st.map(o=>`<button class="k-item ${o.id===s.id?'on':''}" data-act="karteSel" data-sid="${o.id}"><span class="no">${esc(o.no)}</span><span class="nm">${esc(dispName(o))}</span><span class="ct">${counts[o.id]||0}</span></button>`).join('')}</aside>
  <section class="k-main">
    <div class="page-head" style="margin:0"><div><span class="muted">${esc(s.no)}番</span><h2>${esc(dispName(s))}</h2></div>
      <div class="row wrap"><select data-ch="karteSubj" style="width:auto"><option value="all">すべての教科</option>${subsAll.map(x=>`<option ${x===subj?'selected':''}>${esc(x)}</option>`).join('')}</select><button class="btn" data-act="printKarte">${ic('print')}このカルテを印刷</button></div></div>
    <div class="card k-sec"><h3>教科ごとの平均</h3>${subRows?`<table class="stat-table"><thead><tr><th>教科</th><th>記録</th>${vp.map(v=>`<th>${esc(v.short)}（${esc(v.name)}）</th>`).join('')}</tr></thead><tbody>${subRows}</tbody></table><p class="muted small" style="margin:8px 0 0">（ ）内は入力した回数です。</p>`:'<p class="muted" style="margin:0">まだ記録がありません。</p>'}</div>
    <div class="card k-sec"><h3>記録の推移${subj==='all'?'':`（${esc(subj)}）`}</h3>${ents.length?`<div class="tl">${vp.map((v,i)=>`<div class="tl-row"><span class="tl-l">${esc(v.short)}</span>${ents.map(({s:se,e})=>`<span class="sq ${e.absent?'ab':e.v[i]?'l'+e.v[i]:''}" title="${fmtDate(se.date)} ${esc(se.subject)}：${e.absent?'欠席':(e.v[i]||'未入力')}">${e.v[i]||''}</span>`).join('')}</div>`).join('')}</div><p class="muted small" style="margin:6px 0 0">左が古く、右が新しい記録です。四角にカーソルを合わせると日付が出ます。</p>`:'<p class="muted" style="margin:0">記録がありません。</p>'}</div>
    ${Object.keys(tagc).length?`<div class="card k-sec"><h3>様子タグの集計</h3><div class="tagcount">${Object.entries(tagc).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`<span>${esc(t)} ${n}</span>`).join('')}</div></div>`:''}
    <div class="card k-sec"><h3>記録とメモ（新しい順）</h3>${ents.slice().reverse().map(({s:se,e})=>`<div class="entry"><div><b>${fmtDate(se.date)}</b><div class="muted small">${esc(se.period)}</div></div><div><div class="rec-title"><span class="subj">${esc(se.subject)}</span>${esc(se.unit||'')}</div><div class="entry-v">${e.absent?'<span class="mini">欠席</span>':vp.map((v,i)=>`<span class="mini ${e.v[i]?'l'+e.v[i]:''}">${esc(v.short)}${e.v[i]||'–'}</span>`).join('')}</div>${e.tags.length?`<div class="muted small">${e.tags.map(esc).join('・')}</div>`:''}${e.memo?`<div class="entry-memo">${esc(e.memo)}</div>`:''}</div></div>`).join('')||'<p class="muted" style="margin:0">記録がありません。</p>'}</div>
  </section></div>`;
}

  view().innerHTML=`<div class="settings">

function parseRoster(text){
  const out=[];let auto=1;
  text.split(/\r?\n/).forEach(line=>{
    const t=line.replace(/\u3000/g,' ').trim();if(!t)return;
    const parts=t.split(/\t|,|，/).map(x=>x.trim()).filter(Boolean);
    if(/^(出席)?番号$|^no\.?$|^番$/i.test(parts[0]))return;
    let no,name;
    if(parts.length>=2&&/^\d+$/.test(parts[0])){no=+parts[0];name=parts.slice(1).join(' ');}
    else{const m=t.match(/^(\d+)[\s.．、:：番]+(.+)$/);if(m){no=+m[1];name=m[2].trim();}else{no=auto;name=parts.join(' ');}}
    while(out.some(o=>o.no===no))no++;
    out.push({no,name});auto=no+1;
  });
  return out;
}

  const vp=S.settings.vp,rows=[['クラス','日付','曜日','時限','教科','単元・めあて','出席番号','氏名',...vp.map(v=>v.name),'欠席','様子','メモ']];
  sessions.slice().sort((a,b)=>sessKey(a).localeCompare(sessKey(b))).forEach(se=>{const c=S.classes.find(k=>k.id===se.classId);if(!c)return;
    sorted(c).forEach(s=>{const e=se.entries[s.id];if(!hasContent(e))return;rows.push([c.name,se.date,WD[parseD(se.date).getDay()],se.period,se.subject,se.unit||'',s.no,s.name,...e.v.map(x=>x||''),e.absent?'欠':'',e.tags.join('・'),e.memo]);});});
  return '\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
}
const stamp=()=>todayStr().replace(/-/g,'');

/* ========== 操作 ========== */
const A={
  tab:t=>{S.ui.tab=t.dataset.tab;if(S.ui.tab!=='mitori')closeSheet();ui.sel=null;save();renderAll();window.scrollTo(0,0);},
  toggleNames:()=>{S.settings.hideNames=!S.settings.hideNames;save();renderAll();if(ui.sheet)renderSheet();},
  goSettings:()=>{S.ui.tab='settings';closeSheet();save();renderAll();setTimeout(()=>$('#rosterText')?.focus(),80);},
  dismissSample:()=>{S.meta.sample=false;save();renderNotice();},
  mview:t=>{S.ui.mview=t.dataset.v;save();renderMitori();},
  focus:t=>{S.ui.focus=+t.dataset.v;save();renderMitori();},
  coverage:()=>{ui.coverage=!ui.coverage;renderMitori();},
  onlyMissing:()=>{ui.onlyMissing=!ui.onlyMissing;renderMitori();},
  lv:t=>setLevel(t.dataset.sid,+t.dataset.vi,+t.dataset.lv),
  absent:t=>toggleAbsent(t.dataset.sid),
  openSheet:t=>openSheet(t.dataset.sid),
  closeSheet:()=>closeSheet(),
  sheetNav:t=>navSheet(+t.dataset.d),
  tag:t=>{const e=ensureEntry(t.dataset.sid),g=t.dataset.tag,i=e.tags.indexOf(g);if(i>=0)e.tags.splice(i,1);else e.tags.push(g);save();
    const s=cls().students.find(x=>x.id===t.dataset.sid);const el=$('#shTags');if(el)el.innerHTML=sheetTagsHTML(s,e);paintStudent(s.id);},
  openBulk:()=>openBulk(),
  bulkApply:()=>{const vi=+$('#bkVp').value,lv=+$('#bkLv').value,all=document.querySelector('input[name=bkMode]:checked').value==='all',sess0=findSession();let n=0;
    cls().students.forEach(s=>{const e0=getEntry(sess0,s.id);if(e0&&e0.absent)return;if(!all&&e0&&e0.v[vi])return;ensureEntry(s.id).v[vi]=lv;n++;});
    save();closeModal();renderMitori();toast(`${n}人に「${lv}」を入力しました`);},
  printCurrent:()=>{const se=findSession()||{classId:cls().id,date:ui.date,period:ui.period,subject:ui.subject,unit:ui.unit,entries:{}};printSessionObj(se);},
  // 座席
  seatTap:t=>seatTap(+t.dataset.idx),
  poolTap:t=>poolTap(t.dataset.sid),
  deselect:()=>{ui.sel=null;renderSeating();},
  unseat:()=>{const c=cls();if(ui.sel&&ui.sel.kind==='seat'){pushUndo();c.seats[ui.sel.idx]=null;ui.sel=null;save();renderSeating();}},
  setGroup:t=>{const c=cls(),sid=ui.sel.kind==='seat'?c.seats[ui.sel.idx]:ui.sel.sid,g=+t.dataset.g;pushUndo();if(g)c.groups[sid]=g;else delete c.groups[sid];save();renderSeating();},
  step:t=>{const L=cls().layout,d=+t.dataset.d;t.dataset.k==='cols'?applyResize(L.cols+d,L.rows):applyResize(L.cols,L.rows+d);},
  quickCols:t=>{const n=+t.dataset.n,c=cls();const need=c.students.length+c.layout.disabled.length;applyResize(n,Math.max(1,Math.ceil(need/n)));},
  seatView:t=>{cls().layout.view=t.dataset.v;save();renderSeating();},
  layoutEdit:()=>{ui.layoutEdit=!ui.layoutEdit;ui.sel=null;renderSeating();},
  arrange:t=>{pushUndo();arrangeByNumber(cls(),t.dataset.dir);ui.sel=null;save();renderSeating();const u=unplacedOf(cls()).length;if(u)toast(`席が足りず ${u}人が未配置です`);},
  clearSeats:()=>ask('すべての児童を席から外します（「戻す」で元に戻せます）。','外す',()=>{pushUndo();const c=cls();c.seats=c.seats.map(()=>null);ui.sel=null;save();renderSeating();}),
  undo:()=>{if(!ui.undo.length)return;ui.redo.push(snap());restoreSnap(ui.undo.pop());ui.sel=null;save();renderSeating();},
  redo:()=>{if(!ui.redo.length)return;ui.undo.push(snap());restoreSnap(ui.redo.pop());ui.sel=null;save();renderSeating();},
  openRandom:()=>openRandom(),
  chipToggle:t=>{const c=cls(),arr=c[t.dataset.set],i=arr.indexOf(t.dataset.sid);if(i>=0)arr.splice(i,1);else arr.push(t.dataset.sid);t.classList.toggle('on');save();},
  sepAdd:()=>{const c=cls(),a=$('#sepA').value,b=$('#sepB').value;if(a===b)return toast('別々の児童を選んでください');if(c.separate.some(p=>pk(p[0],p[1])===pk(a,b)))return;c.separate.push([a,b]);save();$('#sepList').innerHTML=sepListHTML(c);},
  sepDel:t=>{const c=cls();c.separate.splice(+t.dataset.i,1);save();$('#sepList').innerHTML=sepListHTML(c);},
  runRandom:()=>{const c=cls();c.frontRows=+$('#rFrontRows').value;const avoid=$('#rAvoid').checked;pushUndo();const r=randomArrange(c,avoid);c.seats=r.seats;ui.sel=null;save();closeModal();renderSeating();
    const left=unplacedOf(c).length;toast(`席替えしました。${avoid?`前に近くだった組み合わせ ${r.stats.rep}組`:''}${r.stats.sep?`／近くにしたくない組み合わせが${r.stats.sep}組残っています`:''}${left?`／${left}人が未配置`:''}`);},
  autoGroup:()=>{const [bw,bh]=$('#grpMode').value.split('x').map(Number);pushUndo();const c=cls();const n=bw===1&&bh===1?autoGroups(c,1,c.layout.rows):autoGroups(c,bw,bh);save();renderSeating();toast(`${n}班に分けました`);},
  clearGroups:()=>{pushUndo();cls().groups={};save();renderSeating();},
  openSaveSeats:()=>openSaveSeats(),
  saveSeatsOk:()=>{const c=cls();c.history.push({id:uid(),date:$('#svDate').value||todayStr(),label:$('#svLabel').value.trim(),cols:c.layout.cols,rows:c.layout.rows,disabled:[...c.layout.disabled],seats:[...c.seats]});c.history.sort((a,b)=>a.date.localeCompare(b.date));save();closeModal();renderSeating();toast('座席を履歴に保存しました');},
  openHistory:()=>openHistory(),
  loadHistory:t=>{const c=cls(),h=c.history.find(x=>x.id===t.dataset.id);if(!h)return;pushUndo();const ids=new Set(c.students.map(s=>s.id));
    c.layout.cols=h.cols;c.layout.rows=h.rows;c.layout.disabled=[...(h.disabled||[])];c.seats=h.seats.map(x=>ids.has(x)?x:null);closeModal();save();renderSeating();toast(`${fmtDate(h.date)}の座席を読み込みました（「戻す」で元に戻せます）`);},
  delHistory:t=>{const c=cls();ask('この座席の履歴を削除しますか？','削除',()=>{c.history=c.history.filter(x=>x.id!==t.dataset.id);save();renderSeating();openHistory();});},
  printSeats:()=>printSeats(),
  closeModal:()=>closeModal(),
  okAsk:()=>{const f=ui.askFn;ui.askFn=null;closeModal();if(f)f();},
  // 記録
  openSession:t=>{const s=S.sessions.find(x=>x.id===t.dataset.id);if(!s)return;S.currentClassId=s.classId;ui.date=s.date;ui.period=s.period;syncCtx();S.ui.tab='mitori';save();renderAll();window.scrollTo(0,0);},
  printSession:t=>{const s=S.sessions.find(x=>x.id===t.dataset.id);if(s)printSessionObj(s);},
  delSession:t=>{const s=S.sessions.find(x=>x.id===t.dataset.id);if(!s)return;ask(`${fmtDate(s.date)} ${s.period} ${s.subject} の記録を削除します。元に戻せません。`,'削除',()=>{S.sessions=S.sessions.filter(x=>x!==s);save();renderRecords();});},
  openSummary:()=>openSummary(),
  runSummary:()=>{const a=[$('#smSubj').value,$('#smFrom').value,$('#smTo').value,$('#smMemo').checked];closeModal();printSummary(...a);},
  exportCSV:()=>{const c=cls(),ss=S.sessions.filter(s=>s.classId===c.id);if(!ss.length)return toast('記録がありません');download(`見取り記録_${c.name}_${stamp()}.csv`,csvFor(ss),'text/csv;charset=utf-8');},
  exportCSVAll:()=>{if(!S.sessions.length)return toast('記録がありません');download(`見取り記録_全クラス_${stamp()}.csv`,csvFor(S.sessions),'text/csv;charset=utf-8');},
  karteSel:t=>{ui.karteSid=t.dataset.sid;renderKarte();},
  printKarte:()=>printKarte(),
  // 設定
  addClass:()=>addClassModal(),
  addClassOk:()=>{const name=$('#acName').value.trim()||`新しいクラス${S.classes.length+1}`,list=parseRoster($('#acRoster').value),cols=+$('#acCols').value;
    const c=newClass(name,list.map(p=>({id:uid(),no:p.no,name:p.name})),cols);S.classes.push(c);S.currentClassId=c.id;ui.undo=[];ui.redo=[];syncCtx();save();closeModal();renderAll();toast(`「${name}」を作成しました`);},
  switchClass:t=>{S.currentClassId=t.dataset.id;ui.undo=[];ui.redo=[];ui.sel=null;syncCtx();save();renderAll();},
  renameClass:t=>{const c=S.classes.find(k=>k.id===t.dataset.id);inputModal('クラス名の変更','クラス名',c.name,v=>{if(v){c.name=v;save();renderAll();}});},
  delClass:t=>{if(S.classes.length<=1)return toast('最後のクラスは削除できません');const c=S.classes.find(k=>k.id===t.dataset.id),n=S.sessions.filter(s=>s.classId===c.id).length;
    ask(`「${c.name}」と、このクラスの記録${n}件を削除します。元に戻せません。`,'削除する',()=>{S.classes=S.classes.filter(k=>k!==c);S.sessions=S.sessions.filter(s=>s.classId!==c.id);if(S.currentClassId===c.id)S.currentClassId=S.classes[0].id;syncCtx();save();renderAll();});},
  applyRoster:()=>{const c=cls(),parsed=parseRoster($('#rosterText').value);if(!parsed.length)return toast('名簿が空です');
    const old=new Map(c.students.map(s=>[String(s.no),s]));
    const next=parsed.map(p=>{const o=old.get(String(p.no));if(o){o.name=p.name;old.delete(String(p.no));return o;}return {id:uid(),no:p.no,name:p.name};});
    const removed=[...old.values()];
    const doit=()=>{c.students=next;const ids=new Set(next.map(s=>s.id));c.seats=c.seats.map(x=>ids.has(x)?x:null);
      c.front=c.front.filter(x=>ids.has(x));c.fixed=c.fixed.filter(x=>ids.has(x));c.separate=c.separate.filter(([a,b])=>ids.has(a)&&ids.has(b));Object.keys(c.groups).forEach(k=>{if(!ids.has(k))delete c.groups[k];});
      const left=fillEmpty(c);S.meta.sample=false;save();renderAll();toast(`名簿を反映しました（${next.length}人）${left?`／席が足りず${left}人が未配置です`:''}`);};
    if(removed.length)ask(`${removed.length}人（${removed.slice(0,3).map(s=>s.name).join('、')}${removed.length>3?' ほか':''}）が名簿から外れます。座席からは外れますが、過去の記録データは残ります。`,'反映する',doit,false);else doit();},
  exportJSON:()=>{S.meta.lastBackup=Date.now();flush();download(`見取りノート_バックアップ_${stamp()}.json`,JSON.stringify(S),'application/json');renderNotice();if(S.ui.tab==='settings')renderSettings();toast('バックアップを書き出しました');},
  importJSON:()=>$('#importFile').click(),
  wipe:()=>ask('すべてのクラス・名簿・記録を削除して、初期状態に戻します。先にバックアップを書き出しておくことをおすすめします。','すべて削除',()=>{S=freshState();ui.undo=[];ui.redo=[];closeSheet();syncCtx();save();renderAll();})
};
const C={
  class:t=>{S.currentClassId=t.value;ui.sel=null;ui.undo=[];ui.redo=[];closeSheet();syncCtx();save();renderAll();},
  ctxDate:t=>{ui.date=t.value||todayStr();closeSheet();syncCtx();renderMitori();},
  ctxPeriod:t=>{ui.period=t.value;closeSheet();syncCtx();renderMitori();},
  ctxSubject:t=>{ui.subject=t.value;S.ui.lastSubject=t.value;const s=findSession();if(s)s.subject=t.value;else ui.unit=lastUnitFor(t.value);save();renderMitori();},
  aisle:t=>{pushUndo();cls().layout.aisle=+t.value;save();renderSeating();},
  autoNext:t=>{S.settings.autoNext=t.checked;save();},
  recFilter:t=>{ui.recFilter=t.value;renderRecords();},
  karteSubj:t=>{ui.karteSubj=t.value;renderKarte();},
  vpShort:t=>{S.settings.vp[+t.dataset.i].short=t.value.trim()||'?';save();},
  vpName:t=>{S.settings.vp[+t.dataset.i].name=t.value.trim()||'観点';save();},
  levelName:t=>{S.settings.levels[+t.dataset.i]=t.value.trim();save();},
  subjects:t=>{const l=splitList(t.value);if(l.length){S.settings.subjects=l;save();}},
  tags:t=>{S.settings.tags=splitList(t.value);save();},
  theme:t=>{S.settings.theme=t.value;save();applyTheme();},
  hideNames:t=>{S.settings.hideNames=t.checked;save();renderHead();},
  covDays:t=>{S.settings.coverageDays=+t.value;save();}
};
const I={
  ctxUnit:t=>{ui.unit=t.value;const s=findSession();if(s){s.unit=t.value;save();}},
  memo:t=>{const sid=t.dataset.sid,e=ensureEntry(sid);e.memo=t.value;save();
    $$(`[data-in="memo"][data-sid="${sid}"]`).forEach(el=>{if(el!==t)el.value=t.value;});
    const s=cls().students.find(x=>x.id===sid);$$(`[data-paint="${sid}"]`).forEach(el=>el.innerHTML=mCardInner(s));
    const p=$('#ctxStatus');if(p)p.innerHTML=ctxStatusHTML();}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t,e);}});
document.addEventListener('change',e=>{const t=e.target.closest('[data-ch]');if(t&&C[t.dataset.ch])C[t.dataset.ch](t,e);});
document.addEventListener('input',e=>{const t=e.target.closest('[data-in]');if(t&&I[t.dataset.in])I[t.dataset.in](t,e);});
$('#modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap')closeModal();});
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=migrate(JSON.parse(r.result));ask(`バックアップ（クラス${d.classes.length}・記録${d.sessions.length}件）で今のデータを置き換えます。`,'復元する',()=>{S=d;S.meta.lastBackup=Date.now();ui.undo=[];ui.redo=[];closeSheet();syncCtx();flush();renderAll();toast('復元しました');},false);}catch(err){toast('このファイルは読み込めませんでした');}e.target.value='';};
  r.readAsText(f);});
document.addEventListener('keydown',e=>{
  if($('#modalWrap').classList.contains('open')){if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.id==='imVal')A.okAsk();return;}
  if(!ui.sheet)return;const tg=(e.target.tagName||'').toLowerCase();
  if(tg==='textarea'||tg==='input'||tg==='select'){if(e.key==='Escape')e.target.blur();return;}
  if(e.key==='Escape')closeSheet();
  else if(e.key==='ArrowRight'||e.key==='ArrowDown'){navSheet(1);e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){navSheet(-1);e.preventDefault();}
  else if(/^[1-5]$/.test(e.key)){const en=getEntry(findSession(),ui.sheet);let vi=S.ui.focus;if(vi<0){vi=en?en.v.findIndex(x=>!x):0;if(vi<0)return;}setLevel(ui.sheet,vi,+e.key);}
});
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(fitBoard,120);});
window.addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush();});

/* ========== 起動 ========== */
S=load()||freshState();ui.subject=S.ui.lastSubject||'算数';
syncCtx();renderAll();setSaveState(storageOK?'saved':'error');
</script>

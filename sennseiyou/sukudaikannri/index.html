<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宿題提出ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style id="page-size">@page { size: A4 portrait; margin: 0; }</style>
<style>
/* レイアウト：左に細いメニュー、右が作業面。方眼ノートの紙の上に教材カードを置くイメージ。ダークは黒板。 */
:root{
  --bg:#edf2f0; --paper:#ffffff; --paper-2:#f5f8f7; --grid:rgba(40,96,112,.075);
  --ink:#1b2631; --ink-2:#4c5c68; --ink-3:#7c8c97; --line:#d7e0e0; --line-strong:#b8c6c8;
  --accent:#2b4a9b; --accent-ink:#ffffff; --accent-soft:#e4eaf8;
  --done:#21804f; --done-soft:#e0f1e7; --late:#a36c0a; --late-soft:#fbefd6;
  --miss:#c93a33; --miss-soft:#fde7e4; --exempt:#5f6688; --exempt-soft:#eceef5;
  --hana:#e0476a;
  --shadow:0 1px 2px rgba(18,38,48,.06),0 6px 18px rgba(18,38,48,.07);
  --font-ui:"BIZ UDPGothic","BIZ UDPゴシック","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --font-hand:"Klee One","UD デジタル 教科書体 N-R","UD Digi Kyokasho N-R","Hiragino Mincho ProN","Yu Mincho",serif;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15211c; --paper:#1d2c26; --paper-2:#22332c; --grid:rgba(232,240,228,.035);
    --ink:#edf1e7; --ink-2:#b5c2b9; --ink-3:#86978c; --line:rgba(237,241,231,.12); --line-strong:rgba(237,241,231,.24);
    --accent:#a3c4f3; --accent-ink:#12201a; --accent-soft:rgba(163,196,243,.14);
    --done:#8bd9a0; --done-soft:rgba(139,217,160,.13); --late:#efc56c; --late-soft:rgba(239,197,108,.13);
    --miss:#ff9b90; --miss-soft:rgba(255,155,144,.13); --exempt:#b7bbd9; --exempt-soft:rgba(183,187,217,.11);
    --hana:#ff8fae; --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 22px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15211c; --paper:#1d2c26; --paper-2:#22332c; --grid:rgba(232,240,228,.035);
  --ink:#edf1e7; --ink-2:#b5c2b9; --ink-3:#86978c; --line:rgba(237,241,231,.12); --line-strong:rgba(237,241,231,.24);
  --accent:#a3c4f3; --accent-ink:#12201a; --accent-soft:rgba(163,196,243,.14);
  --done:#8bd9a0; --done-soft:rgba(139,217,160,.13); --late:#efc56c; --late-soft:rgba(239,197,108,.13);
  --miss:#ff9b90; --miss-soft:rgba(255,155,144,.13); --exempt:#b7bbd9; --exempt-soft:rgba(183,187,217,.11);
  --hana:#ff8fae; --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 22px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:var(--font-ui); font-size:15px; line-height:1.6; color:var(--ink);
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.ic{width:18px;height:18px;flex:none}
.muted{color:var(--ink-3)}
.grow{flex:1}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 骨組み ---------- */
#app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;padding:20px 14px 16px;background:var(--paper);border-right:1px solid var(--line);z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:2px solid var(--miss);color:var(--miss);font-family:var(--font-hand);font-weight:600;font-size:21px;transform:rotate(-10deg);flex:none}
.brand-txt{display:flex;flex-direction:column;min-width:0}
.brand-name{font-family:var(--font-hand);font-weight:600;font-size:17px;letter-spacing:.04em;line-height:1.3}
.brand-class{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sample-tag{font-style:normal;font-size:11px;font-weight:700;color:var(--late);border:1px solid currentColor;border-radius:999px;padding:0 6px;line-height:1.5}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:0;background:transparent;border-radius:9px;font-weight:700;font-size:14.5px;color:var(--ink-2);cursor:pointer;text-align:left;white-space:nowrap}
.nav-item:hover{background:var(--paper-2);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 4px}
.tools{display:flex;gap:4px}
.save-state{font-size:12px;color:var(--ink-3)}
.save-state.err{color:var(--miss);font-weight:700}
main{min-width:0;padding-block:26px 80px;padding-left:max(16px,3vw);padding-right:max(16px,3vw);max-width:1320px;width:100%}

@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr)}
  .side{height:auto;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand foot" "nav nav";gap:6px 10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line)}
  .brand{grid-area:brand;padding:0}
  .brand-mark{width:32px;height:32px;font-size:17px}
  .side-foot{grid-area:foot;margin:0;flex-direction:row;align-items:center;padding:0}
  .side-foot .save-state,.side-foot .btn-block{display:none}
  .nav{grid-area:nav;flex-direction:row;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
  .nav::-webkit-scrollbar{display:none}
  .nav-item{padding:9px 10px;font-size:13.5px;border-radius:9px 9px 0 0;gap:6px}
  .nav-item[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--accent)}
  main{padding-block:18px 64px}
}

/* ---------- 部品 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{color:var(--accent-ink);filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--paper-2);border-color:var(--line)}
.btn-danger{color:var(--miss);border-color:color-mix(in srgb,var(--miss) 45%,transparent)}
.btn-danger:hover{color:var(--miss);border-color:var(--miss);background:var(--miss-soft)}
.danger-text{color:var(--miss)}
.btn-sm{min-height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn-lg{min-height:48px;padding:0 22px;font-size:16px}
.btn-block{width:100%}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);cursor:pointer;font-size:18px;font-weight:700;flex:none}
.icon-btn:hover:not(:disabled){color:var(--accent);border-color:var(--accent)}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn.sm{width:30px;height:30px;font-size:16px}
.link{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;font-size:13.5px;padding:2px 0}
.linklike{border:0;background:none;padding:0;cursor:pointer;text-align:left;font-weight:700;color:var(--ink)}
.linklike:hover{color:var(--accent);text-decoration:underline}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{font-size:14px;background:var(--paper);border:1px solid var(--line-strong);border-radius:9px;padding:7px 10px;min-height:38px;color:var(--ink);max-width:100%}
textarea{line-height:1.6;resize:vertical;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:17px;height:17px;margin:0;flex:none}
.seg{display:inline-flex;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:700;color:var(--ink-2);cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.seg-sm button{padding:4px 10px;font-size:12.5px}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.badge{display:inline-block;font-size:12px;font-weight:700;color:var(--ink-2);border:1px solid var(--line-strong);border-radius:999px;padding:1px 10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--set,var(--ink-3));flex:none}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-family:var(--font-hand);font-weight:600;font-size:clamp(23px,3vw,30px);letter-spacing:.02em;line-height:1.3;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.page-head.compact{margin-bottom:14px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.1em;color:var(--ink-3);margin-bottom:2px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.h-item{font-size:.82em;color:var(--accent);border-bottom:3px solid var(--accent-soft)}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-head h2,.sec-title{font-size:16px;font-weight:700;letter-spacing:.02em}
.sec-title{margin:30px 0 12px;display:flex;gap:8px;align-items:baseline}
.banners{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.banner{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:11px 14px;border-radius:11px;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);background:var(--accent-soft);font-size:14px}
.banner p{flex:1 1 320px}
.banner.warm{border-color:color-mix(in srgb,var(--late) 40%,transparent);background:var(--late-soft)}
.banner.danger{border-color:color-mix(in srgb,var(--miss) 40%,transparent);background:var(--miss-soft)}
.tip{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:11px;background:var(--accent-soft);font-size:14px;margin-bottom:6px}
.tip .ic{color:var(--accent);margin-top:2px}
.empty-inline{padding:28px;text-align:center;color:var(--ink-2);border:1px dashed var(--line-strong);border-radius:var(--r);background:var(--paper)}
.empty-view{max-width:560px;margin:40px auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.empty-view h1{font-family:var(--font-hand);font-weight:600;font-size:26px}
.hanamaru{display:block;overflow:visible}
.hanamaru path{fill:none;stroke:var(--hana);stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
.hanamaru.draw path{stroke-dasharray:1200;stroke-dashoffset:1200;animation:hanaDraw 1.1s ease-out forwards}
.hanamaru.draw path:last-child{animation-delay:.35s}
@keyframes hanaDraw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.hanamaru.draw path{animation:none;stroke-dashoffset:0}.stamp.pop{animation:none!important}}
</style>
<style>
/* ---------- ホーム ---------- */
.summary{display:flex;flex-wrap:wrap;gap:12px 40px;padding:16px 22px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:26px}
.sum-item{display:flex;flex-direction:column}
.sum-num{font-family:var(--font-hand);font-weight:600;font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.sum-num small{font-size:15px;margin-left:3px;color:var(--ink-2)}
.sum-num.bad{color:var(--miss)}
.sum-label{font-size:12.5px;color:var(--ink-2);font-weight:700}
.home-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:1100px){.home-grid{grid-template-columns:minmax(0,1fr)}}
.set-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.set-card{display:flex;flex-direction:column;gap:10px;padding:16px 16px 14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);border-top:4px solid var(--set)}
.sc-top{display:flex;align-items:center;gap:8px}
.sc-top h3{font-size:16px;display:flex;align-items:baseline;gap:6px;flex:1;min-width:0}
.vol{display:inline-block;font-family:var(--font-hand);font-weight:600;font-size:13px;line-height:1.4;padding:0 7px;border-radius:5px;background:color-mix(in srgb,var(--set,var(--accent)) 16%,transparent);color:var(--ink)}
.tag{font-size:11.5px;font-weight:700;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:0 6px}
.sc-meta{font-size:13px;color:var(--ink-2)}
.sep{color:var(--line-strong);margin:0 4px}
.spark{display:flex;align-items:flex-end;gap:2px;height:30px;padding-bottom:1px;border-bottom:1px solid var(--line)}
.spark i{flex:1;max-width:12px;height:var(--h);min-height:2px;background:color-mix(in srgb,var(--miss) 55%,transparent);border-radius:2px 2px 0 0}
.spark i.full{background:color-mix(in srgb,var(--done) 70%,transparent)}
.rate{display:flex;align-items:center;gap:10px}
.rate-bar{flex:1;height:8px;border-radius:99px;background:var(--paper-2);border:1px solid var(--line);overflow:hidden}
.rate-bar i{display:block;height:100%;background:var(--done);border-radius:99px}
.rate b{font-variant-numeric:tabular-nums;font-size:14px;min-width:3.2em;text-align:right}
.sc-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sc-btns{display:flex;gap:6px;margin-left:auto}
.miss-pill,.ok-pill{font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px}
.miss-pill{color:var(--miss);background:var(--miss-soft)}
.ok-pill{color:var(--done);background:var(--done-soft)}
.sc-done{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border-radius:9px;background:var(--done-soft);font-size:13px;font-weight:700}
.arch-miss{margin-top:18px;display:flex;flex-direction:column;gap:6px}
.arch-miss h3{font-size:14px;color:var(--ink-2)}
.arch-row{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px dashed var(--line-strong);border-radius:10px;background:var(--paper);cursor:pointer;font-weight:700;text-align:left}
.arch-row .muted{margin-left:auto;font-weight:400;font-size:13px}
.arch-row:hover{border-color:var(--accent)}
.home-students{padding:16px}
.home-students input[type=search]{width:100%;margin-bottom:10px}
.stu-list{display:flex;flex-direction:column;max-height:70vh;overflow:auto;margin:0 -6px}
.stu-row{display:grid;grid-template-columns:2.2em minmax(5em,8em) 3.6em minmax(0,1fr);align-items:center;gap:6px 10px;padding:9px 8px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;border-radius:8px}
.stu-row:hover{background:var(--paper-2)}
.sr-no{font-family:var(--font-hand);font-weight:600;font-size:17px;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.sr-name{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-cnt{font-size:12.5px;font-weight:700;color:var(--miss);text-align:center;background:var(--miss-soft);border-radius:999px;padding:1px 0}
.sr-cnt.zero{color:var(--done);background:var(--done-soft)}
.sr-chips{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.chip{display:inline-flex;gap:4px;align-items:baseline;font-size:12px;padding:1px 8px;border-radius:6px;background:color-mix(in srgb,var(--set) 13%,transparent);border:1px solid color-mix(in srgb,var(--set) 30%,transparent);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip b{font-weight:700}
.all-clear{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 10px;font-weight:700;color:var(--ink-2)}
@media (max-width:560px){.stu-row{grid-template-columns:2em minmax(0,1fr) 3.4em}.sr-chips{grid-column:2 / -1}}

/* ---------- チェック ---------- */
.set-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:6px;align-items:center}
.set-tab{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1px solid var(--line-strong);background:var(--paper);font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;color:var(--ink-2)}
.set-tab .dot{background:var(--set)}
.set-tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.arch-select{min-height:34px;font-size:13px;border-style:dashed}
.item-bar{display:flex;flex-direction:column;gap:10px;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
.ib-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.np-strip{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:0}
.np-strip.scroll{flex-wrap:nowrap;overflow-x:auto;padding:4px 2px 6px}
.np{position:relative;min-width:38px;height:38px;padding:0 8px;border-radius:8px;border:1.5px solid var(--line-strong);background:var(--paper);font-family:var(--font-hand);font-weight:600;font-size:16px;cursor:pointer;color:var(--ink);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;justify-content:center;gap:3px;flex:none;white-space:nowrap}
.np small{font-family:var(--font-ui);font-size:11px;color:var(--ink-3);font-weight:700}
.np.nd{border-style:dashed;color:var(--ink-3);background:transparent}
.np.full{border-color:color-mix(in srgb,var(--done) 60%,transparent);background:var(--done-soft)}
.np.due:not(.full){border-color:color-mix(in srgb,var(--miss) 50%,transparent)}
.np sup{position:absolute;top:-7px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--miss);color:var(--paper);font-family:var(--font-ui);font-size:11px;line-height:18px;font-weight:700}
.np.edge{margin-right:12px}
.np.edge::after{content:"";position:absolute;right:-10px;top:-4px;bottom:-4px;border-right:2px solid var(--accent)}
.np.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.np.sel small{color:var(--accent-ink)}
.np.named{font-family:var(--font-ui);font-size:13.5px;font-weight:700}
.tool-label{font-size:12.5px;font-weight:700;color:var(--ink-3)}
.upto-num{font-family:var(--font-hand);font-weight:600;font-size:17px;min-width:5em;text-align:center}
.ib-row.add input[type=text]{flex:1 1 220px}
.note{padding:10px 14px;border-radius:10px;background:var(--late-soft);border:1px solid color-mix(in srgb,var(--late) 35%,transparent);font-size:13.5px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.check-tools{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin-bottom:14px}
.tool-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.numentry input{width:170px}
.mdot{width:9px;height:9px;border-radius:50%;display:inline-block;border:2px solid currentColor}
.mode-done{color:var(--done)!important}.mode-late{color:var(--late)!important}.mode-ex{color:var(--exempt)!important}.mode-clear{color:var(--ink-2)!important}
.mode-done[aria-pressed="true"] .mdot{background:var(--done)}.mode-late[aria-pressed="true"] .mdot{background:var(--late)}.mode-ex[aria-pressed="true"] .mdot{background:var(--exempt)}.mode-clear[aria-pressed="true"] .mdot{background:var(--ink-2)}
.tally{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:12px 18px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);margin-bottom:14px;position:relative}
.tally-main b{font-family:var(--font-hand);font-weight:600;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.tally-main span{font-weight:700;color:var(--ink-2);margin-left:6px}
.tally-detail{display:flex;gap:14px;font-size:13.5px;font-weight:700;flex-wrap:wrap}
.t-done{color:var(--done)}.t-late{color:var(--late)}.t-ex{color:var(--exempt)}.t-miss{color:var(--miss)}
.tally-miss{flex-basis:100%;font-size:13.5px;color:var(--miss);font-weight:700}
.tally-hana{display:flex;align-items:center;gap:8px;margin-left:auto;font-family:var(--font-hand);font-weight:600;font-size:18px;color:var(--hana)}
.tally.complete{border-color:color-mix(in srgb,var(--done) 45%,transparent)}
.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:10px}
.stu-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:86px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);text-align:left;cursor:pointer;color:var(--ink);transition:transform .08s,border-color .15s,background-color .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.stu-card:hover{border-color:var(--line-strong)}
.stu-card:active{transform:scale(.97)}
.sc-no{font-family:var(--font-hand);font-size:25px;font-weight:600;line-height:1;color:var(--ink-2);font-variant-numeric:tabular-nums}
.sc-name{font-size:14px;font-weight:700;line-height:1.35;word-break:break-all;padding-right:30px}
.sc-sub{font-size:11.5px;font-weight:700;color:var(--miss)}
.stu-card.miss{border-color:color-mix(in srgb,var(--miss) 50%,transparent);background:var(--miss-soft)}
.stu-card.done{border-color:color-mix(in srgb,var(--done) 45%,transparent);background:var(--done-soft)}
.stu-card.late{border-color:color-mix(in srgb,var(--late) 50%,transparent);background:var(--late-soft)}
.stu-card.exempt{border-color:color-mix(in srgb,var(--exempt) 40%,transparent);background:var(--exempt-soft)}
.stu-card.na{opacity:.55}.stu-card.na .sc-sub{color:var(--ink-3)}
.stamp{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:2.2px solid currentColor;display:grid;place-items:center;font-family:var(--font-hand);font-weight:600;font-size:17px;transform:rotate(-14deg);background:color-mix(in srgb,var(--paper) 55%,transparent)}
.stu-card.done .stamp{color:var(--done)}.stu-card.late .stamp{color:var(--late)}.stu-card.exempt .stamp{color:var(--exempt)}
.stamp.pop{animation:stampIn .24s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampIn{from{transform:rotate(-14deg) scale(1.9);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:1}}
.kbd-hint{margin-top:16px;font-size:12.5px;color:var(--ink-3)}

/* ---------- 一覧表 ---------- */
.mx-tools{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;margin-bottom:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{display:inline-grid;place-items:center;width:20px;height:18px;border:1px solid var(--line);border-radius:4px;font-style:normal;font-family:var(--font-hand);font-weight:600;font-size:12px}
.mx-wrap{overflow:auto;max-height:calc(100vh - 230px);border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
table.mx{border-collapse:separate;border-spacing:0;font-size:13px}
.mx th,.mx td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;white-space:nowrap}
.mx thead th{position:sticky;top:0;z-index:2;background:var(--paper-2);font-weight:700}
.mx tfoot td,.mx tfoot th{position:sticky;bottom:0;z-index:2;background:var(--paper-2);font-size:12px;color:var(--ink-2);text-align:center;padding:5px 0;font-variant-numeric:tabular-nums;font-weight:700}
.mx .c-no{position:sticky;left:0;z-index:1;background:var(--paper);width:42px;min-width:42px;text-align:center;font-family:var(--font-hand);font-weight:600;color:var(--ink-2)}
.mx .c-name{position:sticky;left:42px;z-index:1;background:var(--paper);min-width:118px;padding:0 10px;text-align:left;box-shadow:2px 0 0 var(--line)}
.mx thead .c-no,.mx thead .c-name,.mx tfoot .c-no,.mx tfoot .c-name{z-index:3;background:var(--paper-2)}
.mx thead th{padding:6px 0}
.mx .mh button{border:0;background:none;cursor:pointer;font-family:var(--font-hand);font-weight:600;font-size:13px;min-width:36px;padding:2px 4px;color:var(--ink);line-height:1.15}
.mx .mh button small{display:block;font-family:var(--font-ui);font-size:10px;color:var(--ink-3)}
.mx .mh.nd button{color:var(--ink-3)}
.mx .mh button:hover{color:var(--accent)}
.mx .mh.named button{font-family:var(--font-ui);font-size:12px;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.mx .edge{border-right:2px solid var(--accent)}
.mc button{display:block;width:100%;min-width:36px;height:32px;border:0;background:transparent;cursor:pointer;font-family:var(--font-hand);font-weight:600;font-size:15px;color:var(--ink)}
.mc button:hover{background:var(--accent-soft)}
.mc.done button{color:var(--done)}
.mc.late{background:var(--late-soft)}.mc.late button{color:var(--late);font-size:13px}
.mc.exempt{background:var(--exempt-soft)}.mc.exempt button{color:var(--exempt);font-size:13px}
.mc.miss{background:var(--miss-soft)}
.mc.miss button::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--miss)}
.mc.none{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--grid) 5px 6px)}
.mc.na button{color:var(--ink-3)}
.mx .c-sum{text-align:center;min-width:56px;font-weight:700;color:var(--ink-3);padding:0 6px}
.mx td.c-sum.miss{color:var(--miss)}
.mx tbody tr:hover .c-no,.mx tbody tr:hover .c-name{background:var(--paper-2)}

/* ---------- 教材 ---------- */
.set-rows{display:flex;flex-direction:column;gap:8px}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);flex-wrap:wrap;border-left:4px solid var(--set)}
.set-row.archived{border-left-style:dashed;background:var(--paper-2)}
.sr-main{flex:1 1 240px;display:flex;flex-direction:column;min-width:0}
.sr-main b{font-size:15px;display:flex;align-items:baseline;gap:6px}
.sr-main span{font-size:13px}
.sr-acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.preset{display:flex;flex-direction:column;gap:2px;padding:12px 14px;text-align:left;border:1px solid var(--line-strong);background:var(--paper);border-radius:var(--r);cursor:pointer}
.preset b{font-size:14.5px}
.preset span{font-size:12px;color:var(--ink-3)}
.preset:hover{border-color:var(--accent)}
.preset.custom{border-style:dashed}

/* ---------- 名簿 ---------- */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px 18px}
.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--ink-2);min-width:0}
.f.full{grid-column:1 / -1}
.f-label{font-size:13px;font-weight:700;color:var(--ink-2)}
.f-help{font-size:12px;font-weight:400;color:var(--ink-3)}
.f-quick{display:flex;gap:4px}
.chipbtn{border:1px solid var(--line-strong);background:var(--paper);border-radius:6px;padding:1px 9px;font-family:var(--font-hand);font-weight:600;cursor:pointer;font-size:13px}
.chipbtn:hover{border-color:var(--accent);color:var(--accent)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
table.roster{border-collapse:collapse;width:100%;min-width:680px;font-size:14px}
.roster th{font-size:12.5px;text-align:left;color:var(--ink-3);padding:9px 10px;border-bottom:1px solid var(--line);background:var(--paper-2);white-space:nowrap}
.roster td{padding:5px 8px;border-bottom:1px solid var(--line)}
.roster tr.inactive td{opacity:.5}
.roster input[type=number]{width:64px}
.roster input[type=text]{width:100%;min-width:120px}
.warn{color:var(--miss);font-weight:700;font-size:13px}
.section{margin-top:28px}

/* ---------- 印刷 ---------- */
.print-layout{display:grid;grid-template-columns:minmax(280px,370px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:980px){.print-layout{grid-template-columns:minmax(0,1fr)}}
.print-opts{display:flex;flex-direction:column;gap:16px}
.opt-h{font-size:13px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;margin-bottom:-6px}
.ptypes{display:flex;flex-direction:column;gap:6px}
.ptype{display:flex;flex-direction:column;gap:1px;text-align:left;padding:10px 13px;border-radius:10px;border:1px solid var(--line-strong);background:var(--paper);cursor:pointer}
.ptype b{font-size:14.5px}
.ptype span{font-size:12px;color:var(--ink-3)}
.ptype[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);background:var(--accent-soft)}
.pick-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 10px;max-height:260px;overflow:auto;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.pick{display:flex;align-items:center;gap:7px;font-size:13.5px;padding:4px 0;cursor:pointer;min-width:0}
.pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--miss);margin-left:auto}
.checks{display:flex;flex-direction:column;gap:6px}
.print-go{position:sticky;bottom:12px;display:flex;flex-direction:column;gap:6px;padding:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.print-go .hint{font-size:12px;color:var(--ink-3)}
.preview-stage{position:sticky;top:16px;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);padding:16px;max-height:calc(100vh - 32px);overflow:auto}
.preview-pages{display:flex;flex-direction:column;align-items:center;gap:16px}
.preview-pages .pp-page{box-shadow:0 2px 12px rgba(0,0,0,.18)}
.preview-empty{padding:60px 20px;text-align:center;color:var(--ink-2);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:10px}
.preview-cap{font-size:12.5px;color:var(--ink-3);font-weight:700;margin-bottom:10px;text-align:center}

/* ---------- データ ---------- */
.data-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.data-grid .panel{display:flex;flex-direction:column;gap:12px}
.data-grid h2{font-size:16px}
.ex-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.ex-row>div{flex:1 1 220px;display:flex;flex-direction:column;gap:3px}
.ex-row span{font-size:12.5px;color:var(--ink-3)}
.ex-row select{margin-top:4px;max-width:260px}
.danger-zone{border-color:color-mix(in srgb,var(--miss) 30%,transparent)}
.file-btn{position:relative}

/* ---------- 引き出し・モーダル・トースト ---------- */
.drawer-backdrop,.modal-backdrop{position:fixed;inset:0;background:rgba(10,20,25,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--paper);z-index:41;display:flex;flex-direction:column;gap:14px;padding:18px max(18px,env(safe-area-inset-right,0px)) 24px 20px;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.18);animation:slideIn .18s ease-out}
@keyframes slideIn{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.dr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dr-head>div{display:flex;gap:12px;align-items:center}
.dr-no{font-family:var(--font-hand);font-weight:600;font-size:30px;color:var(--ink-2);min-width:1.4em}
.dr-head h2{font-size:21px}
.dr-sum{display:flex;gap:18px;font-size:14px;flex-wrap:wrap}
.dr-sum b{font-size:19px;font-family:var(--font-hand)}
.dr-set{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.dr-set-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.dr-set-head .muted{margin-left:auto;font-weight:400;font-size:12.5px}
.dr-cells{display:flex;flex-wrap:wrap;gap:4px}
.dr-cell{display:flex;flex-direction:column;align-items:center;gap:0;min-width:40px;padding:3px 4px;border:1px solid var(--line);border-radius:7px;background:var(--paper);cursor:pointer;font-family:var(--font-hand);font-weight:600;font-size:15px;line-height:1.2;color:var(--ink)}
.dr-cell small{font-family:var(--font-ui);font-weight:700;font-size:10.5px;color:var(--ink-3);max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-cell.done{color:var(--done);background:var(--done-soft)}.dr-cell.late{color:var(--late);background:var(--late-soft)}.dr-cell.exempt{color:var(--exempt);background:var(--exempt-soft)}
.dr-cell.miss{background:var(--miss-soft);border-color:color-mix(in srgb,var(--miss) 45%,transparent)}
.dr-cell b{height:18px;display:block}
.dr-memo{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--ink-2)}
.modal-root-inner{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.modal{position:relative;z-index:51;width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--paper);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column}
.m-title{font-family:var(--font-hand);font-weight:600;font-size:21px;padding:20px 24px 4px}
.m-body{padding:12px 24px 8px;display:flex;flex-direction:column;gap:14px;font-size:14px}
.m-actions{display:flex;gap:8px;align-items:center;padding:14px 24px 20px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:8px;position:sticky;bottom:0;background:var(--paper)}
.type-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.type-opt{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;cursor:pointer;font-weight:400}
.type-opt input{position:absolute;opacity:0;pointer-events:none}
.type-opt b{font-size:14px;color:var(--ink)}
.type-opt span{font-size:12px;color:var(--ink-3)}
.type-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.type-opt.locked{cursor:not-allowed;opacity:.6}.type-opt.locked.on{opacity:1}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid var(--paper);box-shadow:0 0 0 1px var(--line-strong);cursor:pointer}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.ie-list{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto;padding:2px}
.ie-row{display:flex;gap:8px;align-items:center}
.ie-row input[type=text]{flex:1}
.ie-row label{display:flex;align-items:center;gap:5px;font-size:12.5px;white-space:nowrap}
.setup-presets{display:flex;flex-direction:column;gap:6px}
.sp-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.sp-row>label:first-child{display:flex;align-items:center;gap:8px;font-weight:700;min-width:9em}
.sp-row select,.sp-row input[type=number]{min-height:32px;padding:4px 8px}
.sp-row input[type=number]{width:70px}
.legacy-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.nv-status{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:10px;background:var(--done-soft)}
.nv-status.has{background:var(--late-soft)}
#toast-root{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:11px 14px 11px 16px;border-radius:12px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toastIn .2s ease-out;max-width:100%}
.toast.error{background:var(--miss)}
.toast button{border:0;background:transparent;color:var(--paper);text-decoration:underline;font-weight:700;cursor:pointer;white-space:nowrap;padding:2px 4px}
@keyframes toastIn{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}

/* ---------- 印刷用の紙面（画面のテーマに関係なく、いつも白い紙） ---------- */
#print-root{display:none}
#measure-root{position:absolute;left:-12000px;top:0;visibility:hidden;pointer-events:none}
.pp{font-family:var(--font-ui);color:#14191f;font-size:10.5pt;line-height:1.55;text-align:left}
.pp-page{width:210mm;height:296.5mm;padding:12mm;background:#fff;position:relative;overflow:hidden;flex:none}
.pp-page.landscape{width:297mm;height:209.5mm}
.pp-body{display:flex;flex-direction:column;gap:4mm;height:100%}
.pp-flow{display:flex;flex-direction:column;gap:var(--gap,8mm)}
.pp-block{display:flow-root;position:relative}
.pp-flow .pp-block.cut:not(:last-child)::after{content:"";position:absolute;left:-12mm;right:-12mm;bottom:calc(var(--gap) / -2);border-top:.6pt dashed #8a8f95}
.pp-flow .pp-block.cut:not(:last-child)::before{content:"✂";position:absolute;left:-10mm;bottom:calc(var(--gap) / -2 - 2.2mm);font-size:9pt;line-height:1;color:#7a8086;background:#fff;padding:0 1mm;z-index:1}
.pp-num{position:absolute;bottom:5mm;right:12mm;font-size:8pt;color:#777}
.pp p{margin:0}
.slip{border:1pt solid #2a3038;border-radius:3mm;padding:4mm 5mm 3.5mm}
.slip.kid{font-family:var(--font-hand)}
.slip-head{display:flex;justify-content:space-between;align-items:baseline;gap:4mm;border-bottom:.6pt solid #b7bcc2;padding-bottom:1.6mm;margin-bottom:2.4mm}
.slip-title{font-size:12.5pt;font-weight:600;letter-spacing:.12em}
.slip-date{font-size:9.5pt;color:#555;white-space:nowrap}
.slip-name{display:flex;align-items:baseline;gap:3mm;margin-bottom:2mm;flex-wrap:wrap}
.slip-name .cls{font-size:10pt;color:#444}
.slip-name .no{font-size:11.5pt}
.slip-name .nm{font-size:17pt;font-weight:600}
.slip-name rt{font-size:6.5pt;font-weight:400}
.slip-name .san{font-size:11pt}
.slip-msg{margin:0 0 2.4mm;font-size:10.5pt;white-space:pre-line}
.slip-items{width:100%;border-collapse:collapse;margin-bottom:1.5mm}
.slip-items th{text-align:left;font-weight:600;white-space:nowrap;vertical-align:top;padding:1.3mm 5mm 1.3mm 0;font-size:11pt;width:1%}
.slip-items td{padding:1.3mm 0;vertical-align:top;font-size:11pt;line-height:1.95}
.slip-items tr+tr th,.slip-items tr+tr td{border-top:.4pt dotted #a9afb5}
.bx{display:inline-flex;align-items:center;gap:1.2mm;margin-right:4mm;white-space:nowrap}
.bx i{display:inline-block;width:3.8mm;height:3.8mm;border:.8pt solid #222;border-radius:.6mm}
.bx-more{font-size:9.5pt;color:#444}
.slip-due{margin:1.6mm 0 0;font-weight:600;font-size:11.5pt}
.slip-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:2.6mm;font-size:9.5pt;color:#333;gap:4mm}
.sign-box{display:inline-block;width:34mm;height:9mm;border:.6pt solid #666;border-radius:1mm;margin-left:2mm;vertical-align:middle}
.slip-clear{display:flex;align-items:center;gap:5mm;font-size:12.5pt;padding:2mm 0}
.slip-clear .hanamaru path{stroke:#d23c5c}
.slip.parent{font-size:10.5pt}
.slip.parent .slip-title{letter-spacing:.06em;font-weight:700;font-size:12.5pt}
.slip .to{font-size:11.5pt;margin:0 0 2mm;font-weight:700}

<script>
'use strict';
/* =========================================================

   ========================================================= */
const KEY = 'shukudai-board.v1';
const LEGACY_KEY = 'homeworkData9_cyber';
const COLORS = ['#3d6fd6','#e07b2e','#239a8a','#c94b7c','#7a5bc7','#5f8f2c','#b35a3a','#3f8fb0'];
const TYPE_LABEL = { numbered:'番号', dated:'日付', named:'名前' };

const MODES = [

const DEFAULT_KID_MSG = 'まだ 出していない しゅくだいが あります。\nおわったら □に ✓を つけて、先生に 出しましょう。';
const DEFAULT_PARENT_MSG = 'いつも学習へのご協力をありがとうございます。\n下記の宿題がまだ提出されていません。ご家庭でもお声かけいただけますと幸いです。';
const SAMPLE_NAMES = [
  ['青木 蒼太','あおき そうた'],['石井 結衣','いしい ゆい'],['上田 陽翔','うえだ はると'],['遠藤 さくら','えんどう さくら'],
  ['大野 陸','おおの りく'],['加藤 芽依','かとう めい'],['木村 悠斗','きむら ゆうと'],['小林 陽向','こばやし ひなた'],
  ['斉藤 心春','さいとう こはる'],['佐々木 蓮','ささき れん'],['清水 葵','しみず あおい'],['杉山 空','すぎやま そら'],
  ['高橋 澪','たかはし みお'],['田中 樹','たなか いつき'],['中村 優奈','なかむら ゆな'],['西村 海斗','にしむら かいと'],
  ['野口 莉子','のぐち りこ'],['長谷川 匠','はせがわ たくみ'],['林 琴音','はやし ことね'],['原田 翔','はらだ しょう'],
  ['藤田 柚希','ふじた ゆずき'],['松本 朝陽','まつもと あさひ'],['三浦 日和','みうら ひより'],['村上 健太','むらかみ けんた'],
  ['森 灯','もり あかり'],['山口 大地','やまぐち だいち'],['山本 美月','やまもと みつき'],['吉田 晃生','よしだ こうき'],
  ['渡辺 恵麻','わたなべ えま'],['和田 駿','わだ しゅん']
];

/* ---------- 小さな道具 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const pad2 = n => String(n).padStart(2, '0');
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const WD = ['日','月','火','水','木','金','土'];
const isoOf = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const md = iso => { const d = parseISO(iso); return `${d.getMonth() + 1}/${d.getDate()}`; };
const mdw = iso => { const d = parseISO(iso); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };
const longDate = iso => { const d = parseISO(iso); return `${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}）`; };
const wareki = iso => { const d = parseISO(iso); const r = d.getFullYear() - 2018; return `令和${r === 1 ? '元' : r}年${d.getMonth() + 1}月${d.getDate()}日`; };
const schoolYearOf = (d = new Date()) => (d.getMonth() + 1 >= 4 ? d.getFullYear() : d.getFullYear() - 1);
const defaultVol = () => { const m = new Date().getMonth() + 1; return (m >= 4 && m <= 8) ? '上' : '下'; };
const toHalf = s => String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
const hhmm = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const stampName = () => { const d = new Date(); return `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}`; };
const safeName = s => String(s || '').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40) || 'クラス';
function fmtDateTime(iso){ const d = new Date(iso); if (isNaN(d)) return ''; return `${d.getMonth() + 1}月${d.getDate()}日 ${hhmm(d)}`; }
function daysSince(iso){ const t = new Date(iso).getTime(); return isNaN(t) ? Infinity : (Date.now() - t) / 86400000; }

function compressNums(nums){
  const a = [...new Set(nums)].sort((x, y) => x - y); const out = []; let i = 0;
  while (i < a.length){ let j = i; while (j + 1 < a.length && a[j + 1] === a[j] + 1) j++;
    if (j - i >= 2) out.push(`${a[i]}〜${a[j]}`); else for (let k = i; k <= j; k++) out.push(String(a[k]));
    i = j + 1; }
  return out.join('、');
}
function parseNums(str){
  const out = new Set();
  toHalf(str).split(/[\s,、，.．・]+/).forEach(tok => {
    if (!tok) return;
    const m = tok.match(/^(\d+)[-~〜ー－−](\d+)$/);
    if (m){ let a = +m[1], b = +m[2]; if (a > b) [a, b] = [b, a]; for (let i = a; i <= b && i - a < 100; i++) out.add(i); }
    else if (/^\d+$/.test(tok)) out.add(+tok);
  });
  return [...out];
}
function setPath(obj, path, val){
  const keys = path.split('.'); let o = obj;
  keys.slice(0, -1).forEach(k => { if (o[k] == null) o[k] = {}; o = o[k]; });
  o[keys.at(-1)] = val;
}
function mulberry32(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* はなまる（全員そろったときのしるし） */
const HANA_D = (() => {
  const p = []; for (let k = 0; k <= 520; k++){ const t = k / 520 * Math.PI * 2 * 1.02;
    p.push(`${(50 + 29 * Math.cos(t) + 10.5 * Math.cos(8 * t)).toFixed(1)},${(50 + 29 * Math.sin(t) - 10.5 * Math.sin(8 * t)).toFixed(1)}`); }
  const q = []; for (let k = 0; k <= 160; k++){ const t = k / 160 * Math.PI * 4.2; const r = 4 + 12 * (k / 160);
    q.push(`${(50 + r * Math.cos(t)).toFixed(1)},${(50 + r * Math.sin(t)).toFixed(1)}`); }
  return ['M' + q.join('L'), 'M' + p.join('L')];
})();
const hanamaru = (size = 48, cls = '') => `<svg class="hanamaru ${cls}" viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true"><path d="${HANA_D[0]}"/><path d="${HANA_D[1]}"/></svg>`;

const ICONS = {
  home:'<path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.8V20h13V9.8"/><path d="M10 20v-5h4v5"/>',
  check:'<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="m8 12.2 2.8 2.8L16.2 9"/>',
  grid:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9.5h18M3 14.8h18M8.5 4v16"/>',
  book:'<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9 7.5h6"/>',
  people:'<circle cx="9" cy="8.5" r="3.2"/><path d="M3.2 20c.4-3.3 2.8-5.6 5.8-5.6s5.4 2.3 5.8 5.6"/><circle cx="17" cy="9.5" r="2.4"/><path d="M15.8 14.5c2.6.2 4.5 2.3 4.9 5.5"/>',
  print:'<path d="M7 8.5V3.5h10v5"/><rect x="3" y="8.5" width="18" height="8.5" rx="2"/><path d="M7 14h10v6.5H7z"/>',
  data:'<ellipse cx="12" cy="5.5" rx="7.5" ry="2.7"/><path d="M4.5 5.5v13c0 1.5 3.4 2.7 7.5 2.7s7.5-1.2 7.5-2.7v-13"/><path d="M4.5 12c0 1.5 3.4 2.7 7.5 2.7s7.5-1.2 7.5-2.7"/>',
  undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  redo:'<path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>',
  theme:'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/>',
  save:'<path d="M12 3.5v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M4.5 19.5h15"/>',
  upload:'<path d="M12 15V4"/><path d="M7.5 8.5 12 4l4.5 4.5"/><path d="M4.5 19.5h15"/>',
  close:'<path d="M6 6l12 12M18 6 6 18"/>',
  left:'<path d="m14.5 6-6 6 6 6"/>', right:'<path d="m9.5 6 6 6-6 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  up:'<path d="m6 14.5 6-6 6 6"/>', down:'<path d="m6 9.5 6 6 6-6"/>',
  csv:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 15.5h6"/>'
};
const ic = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/* ---------- データのかたち ---------- */
function blankPrint(){
  return { type:'kid', target:'missing', selected:[], includeArchived:true, excludedSets:[], due:'',
    kidMsg:DEFAULT_KID_MSG, parentMsg:DEFAULT_PARENT_MSG, layout:'flow', sign:true, orient:'portrait',
    sheetSet:'', sheetFrom:1, sheetTo:20, sheetBlank:12, sheetFill:false, recordOnePage:true };
}
function blankState(){
  return { app:'shukudai-board', version:1, isSample:false, className:'', teacher:'', year:schoolYearOf(),
    students:[], sets:[], marks:{}, settings:{ theme:'system', lastBackup:'', legacyDismissed:false, legacyDone:false },
    print:blankPrint(), created:todayISO() };
}
function mkStudent(no, name = '', kana = ''){ return { id:uid(), no, name, kana, active:true, from:'', memo:'' }; }
function normSet(t = {}){
  return {
    id:t.id || uid(), name:String(t.name || '教材'), vol:String(t.vol ?? ''), short:String(t.short || ''),
    type:['numbered','dated','named'].includes(t.type) ? t.type : 'numbered',
    color:t.color || COLORS[0], archived:!!t.archived, track:t.track !== false,
    upTo:Math.max(0, Number(t.upTo) || 0),
    items:(Array.isArray(t.items) ? t.items : []).map(it => ({ id:it.id || uid(), label:String(it.label ?? ''), date:it.date || '', due:it.due !== false, made:it.made || '' })),
    created:t.created || todayISO(), archivedAt:t.archivedAt || ''
  };
}
function normalize(s){
  const d = blankState();
  if (!s || typeof s !== 'object') return d;
  const out = Object.assign(d, s);
  out.students = (Array.isArray(s.students) ? s.students : []).map((st, i) => ({
    id:st.id || uid(), no:Number(st.no) || (i + 1), name:String(st.name || ''), kana:String(st.kana || ''),
    active:st.active !== false, from:st.from || '', memo:String(st.memo || '') }));
  out.sets = (Array.isArray(s.sets) ? s.sets : []).map(normSet);
  out.sets.forEach(t => { if (t.type === 'numbered') t.upTo = Math.min(t.upTo, t.items.length); });
  out.marks = (s.marks && typeof s.marks === 'object') ? s.marks : {};
  out.settings = Object.assign(blankState().settings, s.settings || {});
  out.print = Object.assign(blankPrint(), s.print || {});
  if (!Array.isArray(out.print.selected)) out.print.selected = [];
  if (!Array.isArray(out.print.excludedSets)) out.print.excludedSets = [];
  return out;
}
function setMarkIn(state, setId, itemId, stuId, v){
  if (!setId || !itemId || !stuId) return;
  if (v){ (state.marks[setId] ||= {}); (state.marks[setId][itemId] ||= {}); state.marks[setId][itemId][stuId] = v; }
  else { const m = state.marks[setId]?.[itemId]; if (m){ delete m[stuId]; if (!Object.keys(m).length) delete state.marks[setId][itemId]; } }
}
function makeNumberedItems(n){ return Array.from({ length:n }, (_, i) => ({ id:uid(), label:String(i + 1), date:'', due:true, made:'' })); }

/* ---------- サンプル ---------- */
function lastWeekdays(n){
  const out = []; const d = new Date(); d.setDate(d.getDate() - 1);
  while (out.length < n){ if (d.getDay() !== 0 && d.getDay() !== 6) out.unshift(isoOf(d)); d.setDate(d.getDate() - 1); }
  return out;
}
function sampleState(){
  const s = blankState();
  s.isSample = true; s.className = '3年2組'; s.teacher = '山田 花子';
  s.students = SAMPLE_NAMES.map((n, i) => mkStudent(i + 1, n[0], n[1]));
  const rnd = mulberry32(20261018);
  const weak = new Set([7, 16, 24]);
  const days = lastWeekdays(8);
  const pdone = no => weak.has(no) ? 0.7 : 0.994;
  const fill = (set, upToIdx) => {
    set.items.forEach((it, i) => {
      if (set.type === 'numbered' && i >= upToIdx) return;
      const recent = i >= set.items.length - 1 && set.type !== 'numbered';
      s.students.forEach(st => {
        const r = rnd(); const p = pdone(st.no) - (recent ? 0.03 : 0);
        if (r < p) setMarkIn(s, set.id, it.id, st.id, rnd() < 0.04 ? 'l' : 'd');
      });
    });
  };
  const kU = normSet({ name:'漢字ドリル', vol:'上', short:'漢ド', type:'numbered', color:COLORS[0], upTo:22, archived:true, track:true });
  kU.items = makeNumberedItems(22); kU.archivedAt = days[0];
  kU.items.forEach(it => s.students.forEach(st => setMarkIn(s, kU.id, it.id, st.id, 'd')));
  [['16', [20, 21]], ['24', [22]]].forEach(([no, nums]) => { const st = s.students.find(x => x.no === +no); nums.forEach(n => setMarkIn(s, kU.id, kU.items[n - 1].id, st.id, '')); });
  const kD = normSet({ name:'漢字ドリル', vol:'下', short:'漢ド', type:'numbered', color:COLORS[0], upTo:8 }); kD.items = makeNumberedItems(24); fill(kD, 8);
  const cD = normSet({ name:'計算ドリル', vol:'下', short:'計ド', type:'numbered', color:COLORS[1], upTo:11 }); cD.items = makeNumberedItems(28); fill(cD, 11);
  const on = normSet({ name:'音読カード', short:'音読', type:'dated', color:COLORS[2] });
  on.items = days.map(d => ({ id:uid(), date:d, label:'', due:true, made:d })); fill(on);
  const kn = normSet({ name:'漢字ノート', short:'漢ノ', type:'dated', color:COLORS[3] });
  kn.items = days.slice(-5).map(d => ({ id:uid(), date:d, label:'', due:true, made:d })); fill(kn);
  const pr = normSet({ name:'プリント', short:'プリ', type:'named', color:COLORS[4] });
  pr.items = ['わり算のふくしゅう①','わり算のふくしゅう②','円と球','秋のことばあつめ'].map((l, i) => ({ id:uid(), label:l, date:'', due:true, made:days[Math.min(i * 2, days.length - 1)] })); fill(pr);
  const absent = s.students.find(x => x.no === 12);
  [on, kn].forEach(t => { const it = t.items.at(-3); if (it) setMarkIn(s, t.id, it.id, absent.id, 'x'); });

}
function legacyAvailable(){ try { return !!localStorage.getItem(LEGACY_KEY); } catch (e){ return false; } }
function legacyToState(L){

  const toISO = v => { const m = String(v).trim().match(/^(\d{1,2})\s*\/\s*(\d{1,2})$/); if (!m) return null; const mo = +m[1], d = +m[2]; if (mo < 1 || mo > 12 || d < 1 || d > 31) return null; return `${mo >= 4 ? sy : sy + 1}-${pad2(mo)}-${pad2(d)}`; };

    const byDate = Object.fromEntries(set.items.map(it => [it.date, it.id]));
    L.students.forEach((o, i) => (o[field] || []).forEach(x => { const iso = toISO(x); if (iso) setMarkIn(s, set.id, byDate[iso], idMap[i], 'd'); }));
    s.sets.push(set);
  });
  [['kanjiDrill','漢字ドリル','漢ド','kanjiDrillDone'], ['calcDrill','計算ドリル','計ド','calcDrillDone'], ['print','プリント','プリ','printDone']].forEach(([k, name, short, field]) => {
    const nums = (L.mods[k]?.nums || []).map(Number).filter(Number.isFinite);
    const doneNums = L.students.flatMap(o => o[field] || []).map(Number).filter(Number.isFinite);
    const count = Math.min(300, Math.max(0, ...nums, ...doneNums));
    if (!count && L.mods[k]?.active === false) return;
    const set = normSet({ name, short, type:'numbered', color:COLORS[ci++ % COLORS.length], vol: k === 'print' ? '' : '' });

/* ---------- 保存・元に戻す ---------- */
let S = null;
const undoStack = [], redoStack = [];
let lastSaved = null, saveErr = null, fileHandle = null, modalFn = null;

function persist(str){
  try { localStorage.setItem(KEY, str ?? JSON.stringify(S)); lastSaved = new Date(); saveErr = null; }
  catch (e){ saveErr = e; }
  paintSaveState();
}
const saveQuiet = () => persist();
function commit(label, fn, opts = {}){
  const before = JSON.stringify(S);
  fn();
  const after = JSON.stringify(S);
  if (before !== after){
    undoStack.push({ s:before, label }); if (undoStack.length > 80) undoStack.shift();
    redoStack.length = 0;
    persist(after);
  }
  if (opts.render === false) renderSide(); else render();
}
function undo(){
  const u = undoStack.pop(); if (!u){ toast('これ以上もどせません'); return; }
  redoStack.push({ s:JSON.stringify(S), label:u.label });
  S = normalize(JSON.parse(u.s)); persist(); render(); toast(`元に戻しました：${u.label}`);
}
function redo(){
  const r = redoStack.pop(); if (!r){ toast('やり直せる操作はありません'); return; }
  undoStack.push({ s:JSON.stringify(S), label:r.label });
  S = normalize(JSON.parse(r.s)); persist(); render(); toast(`やり直しました：${r.label}`);
}
function saveStateText(){
  if (saveErr) return '⚠ ブラウザに保存できませんでした';
  return lastSaved ? `自動保存しました ${hhmm(lastSaved)}` : 'このブラウザに自動保存されます';
}
function paintSaveState(){ const el = $('#save-state'); if (el){ el.textContent = saveStateText(); el.classList.toggle('err', !!saveErr); } }

/* ---------- 計算 ---------- */
const getSet = id => S.sets.find(t => t.id === id) || null;
const getStu = id => S.students.find(s => s.id === id) || null;
const activeStudents = () => S.students.filter(s => s.active).slice().sort((a, b) => a.no - b.no);
const setTitle = t => t.name + (t.vol ? ' ' + t.vol : '');
function shortTitle(t){ const p = PRESETS.find(x => x.name === t.name); return (t.short || (p ? p.short : t.name.slice(0, 3))) + (t.vol || ''); }
const getMark = (setId, itemId, stuId) => S.marks[setId]?.[itemId]?.[stuId] || '';
const setMark = (setId, itemId, stuId, v) => setMarkIn(S, setId, itemId, stuId, v);
function isDue(set, item, idx){ return set.type === 'numbered' ? idx < set.upTo : item.due !== false; }
function cellState(st, set, item, idx){
  const m = getMark(set.id, item.id, st.id);
  if (m === 'd') return 'done'; if (m === 'l') return 'late'; if (m === 'x') return 'exempt';
  if (!st.active || !isDue(set, item, idx)) return 'none';
  if (st.from){ const d = set.type === 'dated' ? item.date : set.type === 'named' ? item.made : ''; if (d && d < st.from) return 'na'; }
  return 'miss';
}
function itemLabelLong(set, it){ return set.type === 'numbered' ? `${it.label}番` : set.type === 'dated' ? mdw(it.date) : `「${it.label}」`; }
function shortItemLabel(set, it){ if (set.type === 'dated') return md(it.date); if (set.type === 'named') return it.label.length > 7 ? it.label.slice(0, 7) + '…' : it.label; return it.label; }
function textItems(set, items){
  if (set.type === 'numbered') return compressNums(items.map(x => Number(x.item.label)).filter(Number.isFinite)) + '番';
  if (set.type === 'dated'){ const l = items.map(x => md(x.item.date)); return l.length > 12 ? l.slice(0, 12).join('、') + ` ほか${l.length - 12}日分` : l.join('、') + '分'; }
  return items.map(x => `「${x.item.label}」`).join('、');
}
function relevantSets(includeArchived = true, allArchived = false){ return S.sets.filter(t => !t.archived || (includeArchived && (allArchived || t.track))); }
function missingGroups(st, sets){
  const out = [];
  sets.forEach(set => { const items = []; set.items.forEach((item, idx) => { if (cellState(st, set, item, idx) === 'miss') items.push({ item, idx }); }); if (items.length) out.push({ set, items }); });
  return out;
}
const groupCount = groups => groups.reduce((a, g) => a + g.items.length, 0);
function setStats(set, sts){
  let exp = 0, got = 0, missCnt = 0; const missStu = new Set(); const perItem = [];
  set.items.forEach((it, idx) => {
    if (!isDue(set, it, idx)) return; let e = 0, g = 0;
    sts.forEach(st => { const cs = cellState(st, set, it, idx);
      if (cs === 'done' || cs === 'late'){ e++; g++; } else if (cs === 'miss'){ e++; missCnt++; missStu.add(st.id); } });
    exp += e; got += g; perItem.push({ it, idx, e, g });
  });
  return { exp, got, missCnt, missStu:missStu.size, perItem };
}
function nextVol(v){
  v = String(v || '').trim();
  if (v === '上') return '下';
  const seqs = [['上','中','下'], ['前期','後期'], ['前','後'], ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'], ['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ'], ['一','二','三','四','五'], ['1学期','2学期','3学期']];
  for (const s of seqs){ const i = s.indexOf(v); if (i >= 0 && i < s.length - 1) return s[i + 1]; }
  const m = toHalf(v).match(/^(.*?)(\d+)(\D*)$/); if (m) return m[1] + (Number(m[2]) + 1) + m[3];
  return v ? '' : '2';
}
function resizeNumbered(set, n){
  while (set.items.length < n) set.items.push({ id:uid(), label:String(set.items.length + 1), date:'', due:true, made:'' });
  if (set.items.length > n){ set.items.slice(n).forEach(it => { if (S.marks[set.id]) delete S.marks[set.id][it.id]; }); set.items = set.items.slice(0, n); }
  set.upTo = Math.min(set.upTo, n);
}
const nextVolLabel = t => { const n = nextVol(t.vol); return n ? `「${esc(n)}」へ進む` : '次の冊へ進む'; };
function setHasMarks(set){ const m = S.marks[set.id]; return !!m && Object.values(m).some(o => Object.keys(o).length); }
function needBackupReminder(){
  if (S.isSample || !S.students.length || !Object.keys(S.marks).length) return false;
  return S.settings.lastBackup ? daysSince(S.settings.lastBackup) >= 7 : daysSince(S.created) >= 1;
}

function stuRow(r){

  return `<button class="stu-row" data-act="open-student" data-id="${r.st.id}"><span class="sr-no">${r.st.no}</span><span class="sr-name">${esc(r.st.name || '（名前なし）')}</span><span class="sr-cnt ${r.count ? '' : 'zero'}">${r.count ? r.count + '件' : 'なし'}</span><span class="sr-chips">${chips}</span></button>`;
}

/* ---------- チェック ---------- */
function checkContext(){
  let set = getSet(ui.check.setId);
  if (!set){ set = S.sets.find(t => !t.archived) || null; ui.check.setId = set ? set.id : null; ui.check.itemId = null; }
  if (!set) return { set:null, item:null, idx:-1 };
  let item = set.items.find(it => it.id === ui.check.itemId);
  if (!item){ item = defaultItem(set); ui.check.itemId = item ? item.id : null; }
  return { set, item, idx:item ? set.items.indexOf(item) : -1 };
}
function defaultItem(set){
  if (!set.items.length) return null;
  if (set.type === 'numbered') return set.items[Math.max(0, Math.min(set.upTo, set.items.length) - 1)];
  return set.items.filter(it => it.due !== false).at(-1) || set.items.at(-1);
}
function viewCheck(){
  const { set, item, idx } = checkContext();
  if (!set) return emptyView('チェックする教材がありません', '最初に教材（漢字ドリルや音読カードなど）を追加しましょう。', 'sets', '教材を追加する');
  const sts = activeStudents();
  const active = S.sets.filter(t => !t.archived), arch = S.sets.filter(t => t.archived);
  const tabs = active.map(t => `<button class="set-tab ${t.id === set.id ? 'on' : ''}" style="--set:${t.color}" data-act="check-set" data-set="${t.id}"><span class="dot"></span>${esc(setTitle(t))}</button>`).join('');
  const archSel = arch.length ? `<select id="check-arch" class="arch-select" data-change="check-arch" aria-label="前の冊・完了した教材"><option value="">前の冊・完了した教材…</option>${arch.map(t => `<option value="${t.id}" ${t.id === set.id ? 'selected' : ''}>${esc(setTitle(t))}</option>`).join('')}</select>` : '';
  let body;
  if (!sts.length) body = `<div class="empty-inline">名簿に児童がいません。<br><button class="btn btn-sm btn-primary" style="margin-top:10px" data-act="nav" data-view="roster">名簿を入力する</button></div>`;
  else if (!item){
    body = `<div class="empty-inline">${set.type === 'numbered' ? '番号がありません。「教材」で番号の数を決めてください。' : set.type === 'dated' ? 'まだ日付がありません。上の「今日の分」を押すと記録を始められます。' : 'まだプリントがありません。上で名前を入れて追加してください。'}</div>`;
  } else {
    const states = sts.map(st => ({ st, cs:cellState(st, set, item, idx) }));
    const c = { done:0, late:0, exempt:0, miss:0, none:0, na:0 }; states.forEach(x => c[x.cs]++);
    const due = isDue(set, item, idx);
    const expN = c.done + c.late + c.miss;
    const missList = states.filter(x => x.cs === 'miss');
    const shown = ui.onlyMissing && due ? missList : states;
    const complete = due && !c.miss && expN > 0;
    body = `
    ${!due ? `<div class="note">${set.type === 'numbered' ? `<span><b>${esc(item.label)}番は、まだ出題範囲に入っていません。</b>記録はできますが、未提出には数えません。</span><button class="btn btn-sm" data-act="upto-here" data-set="${set.id}">${esc(item.label)}番までを出題範囲にする</button>` : `<span><b>この回は「出題なし」にしています。</b>未提出には数えません。</span><button class="btn btn-sm" data-act="item-due" data-item="${item.id}">出題にもどす</button>`}</div>` : ''}
    <div class="check-tools">
      <div class="tool-group"><span class="tool-label">押したら</span><div class="seg" role="group" aria-label="押したときの記録">${MODES.map(m => `<button data-act="mode" data-m="${m.k}" aria-pressed="${ui.mode === m.k}" class="mode-${m.cls}"><i class="mdot"></i>${m.label}</button>`).join('')}</div></div>
      <div class="tool-group numentry"><label class="tool-label" for="num-entry">番号で入力</label><input id="num-entry" type="text" inputmode="numeric" autocomplete="off" placeholder="例：3 7 12-15"><button class="btn btn-sm" data-act="num-apply">記録</button></div>
      <div class="tool-group"><button class="btn btn-sm" data-act="all-done">${ic('check')}まだの子を全員済に</button><button class="btn btn-sm btn-ghost" data-act="all-clear">この回を全部未に戻す</button><label class="toggle"><input type="checkbox" id="only-missing" data-change="only-missing" ${ui.onlyMissing ? 'checked' : ''}><span>まだの子だけ表示</span></label></div>
    </div>
    <div class="tally ${complete ? 'complete' : ''}">
      <div class="tally-main"><b>${c.done + c.late}</b><span>/ ${due ? expN : '—'}人 提出</span></div>
      <div class="tally-detail"><span class="t-done">済 ${c.done}</span><span class="t-late">遅れ ${c.late}</span><span class="t-ex">免除 ${c.exempt}</span><span class="t-miss">まだ ${due ? c.miss : '—'}</span></div>
      ${complete ? `<div class="tally-hana">${hanamaru(56, 'draw')}<span>全員そろいました</span></div>` : ''}
      ${due && missList.length ? `<p class="tally-miss">まだ：${missList.map(x => `${x.st.no} ${esc(x.st.name)}`).join('、')}</p>` : ''}
    </div>
    <div class="stu-grid">${shown.map(x => stuCard(x.st, x.cs)).join('')}</div>
    <p class="kbd-hint">キーボードでも使えます：数字を打つと番号入力 ・ ← → で前後の回へ ・ Ctrl+Z で元に戻す ・ Ctrl+S でバックアップ</p>`;
  }
  return `
  <header class="page-head compact"><div><p class="eyebrow">提出チェック${set.archived ? '（完了した教材）' : ''}</p><h1>${esc(setTitle(set))}${item ? `<span class="h-item">${esc(itemLabelLong(set, item))}</span>` : ''}</h1></div></header>
  <div class="set-tabs" data-keep-scroll="settabs">${tabs}${archSel}</div>
  <div class="item-bar">${itemSelector(set, item, idx)}</div>
  ${body}`;
}
function stuCard(st, cs){
  const stamp = { done:'済', late:'遅', exempt:'免' }[cs];
  const sub = cs === 'na' ? '<span class="sc-sub">対象外</span>' : cs === 'miss' ? '<span class="sc-sub">まだ</span>' : '';
  return `<button class="stu-card ${cs}" data-act="tap-stu" data-id="${st.id}" aria-label="${st.no}番 ${esc(st.name)} ${STATE_JP[cs]}"><span class="sc-no">${st.no}</span><span class="sc-name">${esc(st.name || '（名前なし）')}</span>${sub}${stamp ? `<span class="stamp ${ui.pop === st.id ? 'pop' : ''}">${stamp}</span>` : ''}</button>`;
}
function uptoRow(set, item, idx){
  return `<div class="ib-row"><span class="tool-label">出題範囲</span><button class="icon-btn sm" data-act="upto" data-set="${set.id}" data-d="-1" aria-label="出題範囲を1つへらす">−</button><b class="upto-num">${set.upTo}番まで</b><button class="icon-btn sm" data-act="upto" data-set="${set.id}" data-d="1" aria-label="出題範囲を1つふやす">＋</button><span class="muted">／ 全${set.items.length}番</span></div>`;
}
function itemSelector(set, item, idx){
  const sts = activeStudents();
  const missOf = (it, i) => sts.filter(st => cellState(st, set, it, i) === 'miss').length;
  const step = d => `<button class="icon-btn" data-act="item-step" data-d="${d}" aria-label="${d < 0 ? '前の回' : '次の回'}">${ic(d < 0 ? 'left' : 'right')}</button>`;
  if (set.type === 'numbered'){
    const pills = set.items.map((it, i) => { const due = i < set.upTo; let cls = due ? 'due' : 'nd'; let badge = '';
      if (due){ const m = missOf(it, i); if (!m) cls += ' full'; else badge = `<sup>${m}</sup>`; }
      if (i === set.upTo - 1 && i < set.items.length - 1) cls += ' edge'; if (it === item) cls += ' sel';
      return `<button class="np ${cls}" data-act="pick-item" data-item="${it.id}" title="${esc(it.label)}番${due ? '' : '（出題範囲外）'}">${esc(it.label)}${badge}</button>`; }).join('');
    return `<div class="ib-row">${step(-1)}<div class="np-strip">${pills || '<span class="muted">番号がありません</span>'}</div>${step(1)}</div>${uptoRow(set, item, idx)}`;
  }
  const pills = set.items.map((it, i) => { const due = it.due !== false; let cls = due ? 'due' : 'nd'; let badge = '';
    if (due){ const m = missOf(it, i); if (!m) cls += ' full'; else badge = `<sup>${m}</sup>`; }
    if (it === item) cls += ' sel';
    const inner = set.type === 'dated' ? `${md(it.date)}<small>${WD[parseISO(it.date).getDay()]}</small>` : esc(it.label);
    return `<button class="np ${set.type === 'named' ? 'named' : ''} ${cls}" data-act="pick-item" data-item="${it.id}" id="np-${it.id}">${inner}${badge}</button>`; }).join('');
  const ops = item ? `<span class="grow"></span><button class="btn btn-sm btn-ghost" data-act="item-due" data-item="${item.id}">${item.due !== false ? 'この回を「出題なし」にする' : 'この回を出題にもどす'}</button><button class="btn btn-sm btn-ghost danger-text" data-act="item-del" data-item="${item.id}">この回を削除</button>` : '';
  if (set.type === 'dated'){
    return `<div class="ib-row">${step(-1)}<div class="np-strip scroll" id="np-strip" data-keep-scroll="npstrip">${pills || '<span class="muted">日付がありません</span>'}</div>${step(1)}</div>
    <div class="ib-row add"><button class="btn btn-sm btn-primary" data-act="add-today">${ic('plus')}今日（${md(todayISO())}）の分</button><input type="date" id="add-date" value="${todayISO()}" aria-label="追加する日付"><button class="btn btn-sm" data-act="add-date">この日を追加</button>${ops}</div>`;
  }
  return `<div class="ib-row"><div class="np-strip">${pills || '<span class="muted">まだプリントがありません</span>'}</div></div>
  <div class="ib-row add"><input type="text" id="add-named" placeholder="例：わり算プリント③" aria-label="追加するプリントの名前"><button class="btn btn-sm btn-primary" data-act="add-named">${ic('plus')}追加</button>${ops}</div>`;
}

/* ---------- 一覧表 ---------- */
function viewMatrix(){
  const active = S.sets.filter(t => !t.archived), arch = S.sets.filter(t => t.archived);
  const set = getSet(ui.matrixSet) || active[0] || S.sets[0];
  if (!set) return emptyView('教材がありません', '教材を追加すると、児童ごとの提出状況が表で見られます。', 'sets', '教材を追加する');
  ui.matrixSet = set.id;
  const sts = activeStudents();
  const tabs = active.map(t => `<button class="set-tab ${t.id === set.id ? 'on' : ''}" style="--set:${t.color}" data-act="matrix-set" data-set="${t.id}"><span class="dot"></span>${esc(setTitle(t))}</button>`).join('');
  const archSel = arch.length ? `<select id="matrix-arch" class="arch-select" data-change="matrix-arch" aria-label="前の冊・完了した教材"><option value="">前の冊・完了した教材…</option>${arch.map(t => `<option value="${t.id}" ${t.id === set.id ? 'selected' : ''}>${esc(setTitle(t))}</option>`).join('')}</select>` : '';
  const x = setStats(set, sts);
  const rowsSts = ui.matrixOnlyMissing ? sts.filter(st => set.items.some((it, i) => cellState(st, set, it, i) === 'miss')) : sts;
  const edgeI = set.type === 'numbered' ? set.upTo - 1 : -2;
  const head = set.items.map((it, i) => { const due = isDue(set, it, i);
    const lab = set.type === 'dated' ? `${md(it.date)}<small>${WD[parseISO(it.date).getDay()]}</small>` : esc(it.label);
    return `<th class="mh ${due ? '' : 'nd'} ${set.type === 'named' ? 'named' : ''} ${i === edgeI ? 'edge' : ''}"><button data-act="goto-check-item" data-set="${set.id}" data-item="${it.id}" title="${esc(itemLabelLong(set, it))} をチェック画面で開く">${lab}</button></th>`; }).join('');
  const body = rowsSts.map(st => { let miss = 0;
    const cells = set.items.map((it, i) => { const cs = cellState(st, set, it, i); if (cs === 'miss') miss++;
      return `<td class="mc ${cs} ${i === edgeI ? 'edge' : ''}"><button data-act="cycle" data-set="${set.id}" data-item="${it.id}" data-stu="${st.id}" aria-label="${st.no}番 ${esc(st.name)} ${esc(itemLabelLong(set, it))}：${STATE_JP[cs]}">${SYM[cs]}</button></td>`; }).join('');
    return `<tr><th class="c-no" scope="row">${st.no}</th><td class="c-name"><button class="linklike" data-act="open-student" data-id="${st.id}">${esc(st.name || '（名前なし）')}</button></td>${cells}<td class="c-sum ${miss ? 'miss' : ''}">${miss || ''}</td></tr>`; }).join('');
  const foot = set.items.map((it, i) => { const due = isDue(set, it, i); const n = sts.filter(st => { const c = cellState(st, set, it, i); return c === 'done' || c === 'late'; }).length; return `<td class="${i === edgeI ? 'edge' : ''}">${due ? n : ''}</td>`; }).join('');
  const pct = x.exp ? Math.round(x.got / x.exp * 100) : null;
  return `
  <header class="page-head compact"><div><p class="eyebrow">一覧表${set.archived ? '（完了した教材）' : ''}</p><h1>${esc(setTitle(set))}</h1></div>
    <div class="head-actions"><button class="btn btn-sm" data-act="csv-set-direct" data-set="${set.id}">${ic('csv')}この表をCSVで書き出す</button><button class="btn btn-sm" data-act="print-sheet" data-set="${set.id}">${ic('print')}チェック表を印刷</button></div></header>
  <div class="set-tabs" data-keep-scroll="mxtabs">${tabs}${archSel}</div>
  <div class="mx-tools">
    ${set.type === 'numbered' ? uptoRow(set) : ''}
    <span class="badge">提出率 ${pct === null ? '—' : pct + '%'} ・ 未提出 ${x.missStu}人 ${x.missCnt}件</span>
    <label class="toggle"><input type="checkbox" id="mx-only" data-change="matrix-only" ${ui.matrixOnlyMissing ? 'checked' : ''}><span>未提出がある児童だけ</span></label>
    <div class="legend"><span><i style="color:var(--done)">○</i>済</span><span><i style="color:var(--late);background:var(--late-soft)">遅</i>遅れて提出</span><span><i style="color:var(--exempt);background:var(--exempt-soft)">免</i>免除</span><span><i style="background:var(--miss-soft)"><b style="width:6px;height:6px;border-radius:50%;background:var(--miss);display:block"></b></i>未提出</span><span class="muted">マスを押すたびに 済→遅れ→免除→空欄 と変わります</span></div>
  </div>
  ${set.items.length && sts.length ? `<div class="mx-wrap" id="mx-wrap" data-keep-scroll="mx"><table class="mx"><thead><tr><th class="c-no">番号</th><th class="c-name">名前</th>${head}<th class="c-sum">未提出</th></tr></thead><tbody>${body || `<tr><td colspan="${set.items.length + 3}" style="padding:20px;text-align:center">未提出の児童はいません。</td></tr>`}</tbody><tfoot><tr><th class="c-no"></th><th class="c-name">提出数</th>${foot}<td class="c-sum"></td></tr></tfoot></table></div>`
    : `<div class="empty-inline">${!sts.length ? '名簿に児童がいません。' : set.type === 'numbered' ? '番号がありません。「教材」で番号の数を決めてください。' : 'まだ記録する回がありません。チェック画面で追加できます。'}</div>`}`;
}
</script>
<script>
/* ---------- 教材 ---------- */
function viewSets(){
  const sts = activeStudents();
  const active = S.sets.filter(t => !t.archived), arch = S.sets.filter(t => t.archived);
  const row = t => { const x = setStats(t, sts); const pct = x.exp ? Math.round(x.got / x.exp * 100) + '%' : '—';
    const meta = t.type === 'numbered' ? `${t.upTo}番まで出題／全${t.items.length}番` : `${t.items.length}回分`;
    return `<div class="set-row" style="--set:${t.color}">
      <div class="sr-main"><b>${esc(t.name)}${t.vol ? `<span class="vol">${esc(t.vol)}</span>` : ''}</b><span class="muted">${TYPE_LABEL[t.type]}で管理 ・ ${meta} ・ 提出率 ${pct}${x.missStu ? ` ・ 未提出 ${x.missStu}人` : ''}</span></div>
      <div class="sr-acts">
        <button class="icon-btn sm" data-act="move-set" data-set="${t.id}" data-d="-1" aria-label="上へ移動" title="上へ">${ic('up')}</button>
        <button class="icon-btn sm" data-act="move-set" data-set="${t.id}" data-d="1" aria-label="下へ移動" title="下へ">${ic('down')}</button>
        <button class="btn btn-sm" data-act="edit-set" data-set="${t.id}">設定</button>
        <button class="btn btn-sm" data-act="archive-set" data-set="${t.id}">完了にする</button>
        ${t.type === 'numbered' ? `<button class="btn btn-sm btn-primary" data-act="next-vol" data-set="${t.id}">${nextVolLabel(t)}</button>` : ''}
      </div></div>`; };
  const archRow = t => { const x = setStats(t, sts);
    return `<div class="set-row archived" style="--set:${t.color}">
      <div class="sr-main"><b>${esc(t.name)}${t.vol ? `<span class="vol">${esc(t.vol)}</span>` : ''}</b><span class="muted">${t.archivedAt ? longDate(t.archivedAt) + 'に完了 ・ ' : ''}${x.missCnt ? `未提出 ${x.missStu}人・${x.missCnt}件` : '未提出なし'}</span></div>
      <div class="sr-acts">
        <label class="toggle"><input type="checkbox" id="track-${t.id}" data-change="track" data-set="${t.id}" ${t.track ? 'checked' : ''}><span>未提出を追いかける</span></label>
        <button class="btn btn-sm" data-act="goto-matrix" data-set="${t.id}">一覧表</button>
        <button class="btn btn-sm" data-act="unarchive-set" data-set="${t.id}">使用中に戻す</button>
        <button class="btn btn-sm btn-ghost danger-text" data-act="delete-set" data-set="${t.id}">削除</button>
      </div></div>`; };
  return `
  <header class="page-head"><div><p class="eyebrow">教材</p><h1>教材の設定</h1></div></header>
  <div class="tip">${ic('book')}<p><b>ドリルの「上」が終わったら、「下へ進む」を押すだけ。</b>上の記録は消えずに「完了した教材」に残ります。上でまだ出していない子がいれば、ホームやお知らせ票でそのまま追いかけられます。</p></div>
  <h2 class="sec-title">使用中 <span class="muted">${active.length}</span></h2>
  <div class="set-rows">${active.map(row).join('') || '<p class="muted">使用中の教材はありません。下から追加してください。</p>'}</div>
  <h2 class="sec-title">教材を追加</h2>
  <div class="presets">${PRESETS.map(p => `<button class="preset" data-act="preset" data-key="${p.key}"><b>${p.name}</b><span>${TYPE_LABEL[p.type]}で管理${p.desc ? '・' + p.desc : ''}</span></button>`).join('')}<button class="preset custom" data-act="preset" data-key="custom"><b>＋ 自由に作る</b><span>名前と管理のしかたを自分で決める</span></button></div>
  <h2 class="sec-title">完了した教材 <span class="muted">${arch.length}</span></h2>
  ${arch.length ? `<div class="set-rows">${arch.map(archRow).join('')}</div>` : '<p class="muted">「下へ進む」や「完了にする」を使うと、ここに記録が残ります。</p>'}`;
}

/* ---------- 名簿 ---------- */
function viewRoster(){
  const counts = {}; S.students.filter(s => s.active).forEach(s => { counts[s.no] = (counts[s.no] || 0) + 1; });
  const dup = Object.keys(counts).filter(k => counts[k] > 1);
  const rows = S.students.map(st => `<tr class="${st.active ? '' : 'inactive'}">
    <td><input type="number" id="st-no-${st.id}" min="1" max="99" value="${st.no}" data-change="stu-field" data-id="${st.id}" data-field="no" aria-label="出席番号"></td>
    <td><input type="text" id="st-name-${st.id}" value="${esc(st.name)}" placeholder="名前" data-change="stu-field" data-id="${st.id}" data-field="name" aria-label="名前"></td>
    <td><input type="text" id="st-kana-${st.id}" value="${esc(st.kana)}" placeholder="ふりがな（なくてもOK）" data-change="stu-field" data-id="${st.id}" data-field="kana" aria-label="ふりがな"></td>
    <td><input type="date" id="st-from-${st.id}" value="${esc(st.from)}" data-change="stu-field" data-id="${st.id}" data-field="from" aria-label="転入日"></td>
    <td><label class="toggle"><input type="checkbox" id="st-act-${st.id}" ${st.active ? 'checked' : ''} data-change="stu-field" data-id="${st.id}" data-field="active"><span>在籍</span></label></td>
    <td><button class="btn btn-sm btn-ghost danger-text" data-act="del-student" data-id="${st.id}">削除</button></td></tr>`).join('');
  return `
  <header class="page-head"><div><p class="eyebrow">名簿</p><h1>クラスと名簿</h1></div></header>
  <section class="panel"><div class="form-grid">
    <label class="f">クラス名<input type="text" id="f-class" value="${esc(S.className)}" placeholder="例：3年2組" data-change="class-field" data-field="className"></label>

function parsePaste(text){
  return String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(line => {
    let no = null, name = '', kana = '';
    const cols = line.includes('\t') ? line.split('\t') : (line.includes(',') ? line.split(',') : null);
    if (cols){ let c = cols.map(x => x.trim().replace(/^"|"$/g, '')); if (/^\d+$/.test(toHalf(c[0]))){ no = +toHalf(c[0]); c = c.slice(1); } name = c[0] || ''; kana = c[1] || ''; }
    else { const h = toHalf(line); const m = h.match(/^(\d+)[\s.．、)）番]+(.+)$/); if (m){ no = +m[1]; name = line.slice(line.length - m[2].length).trim(); } else name = line; }
    return { no, name, kana };
  }).filter(r => r.name);
}

function renderDrawer(){
  const root = $('#drawer-root');
  const st = ui.drawer ? getStu(ui.drawer) : null;
  if (!st){ ui.drawer = null; root.innerHTML = ''; return; }
  const sets = relevantSets(true, true);
  let exp = 0, got = 0, miss = 0, late = 0;
  const secs = sets.map(t => { let se = 0, sg = 0, sm = 0;
    const cells = t.items.map((it, i) => { const cs = cellState(st, t, it, i); if (cs === 'none') return '';
      if (cs === 'done' || cs === 'late'){ se++; sg++; } if (cs === 'miss'){ se++; sm++; } if (cs === 'late') late++;
      return `<button class="dr-cell ${cs}" data-act="cycle" data-set="${t.id}" data-item="${it.id}" data-stu="${st.id}" title="${esc(itemLabelLong(t, it))}：${STATE_JP[cs]}（押すと変わります）"><b>${SYM[cs]}</b><small>${esc(shortItemLabel(t, it))}</small></button>`; }).join('');
    if (!cells) return ''; exp += se; got += sg; miss += sm;
    return `<div class="dr-set"><div class="dr-set-head"><span class="dot" style="--set:${t.color}"></span>${esc(setTitle(t))}${t.archived ? '<span class="badge">完了</span>' : ''}<span class="muted">${sg}/${se}${sm ? ` ・ 未提出 ${sm}` : ''}</span></div><div class="dr-cells">${cells}</div></div>`; }).join('');
  const pct = exp ? Math.round(got / exp * 100) + '%' : '—';
  root.innerHTML = `<div class="drawer-backdrop" data-act="drawer-close"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(st.name)}さんの記録">
    <header class="dr-head"><div><span class="dr-no">${st.no}</span><div><h2>${esc(st.name || '（名前なし）')}</h2>${st.kana ? `<p class="muted">${esc(st.kana)}</p>` : ''}</div></div><button class="icon-btn" data-act="drawer-close" aria-label="閉じる">${ic('close')}</button></header>
    <div class="dr-sum"><span>提出率 <b>${pct}</b></span><span>未提出 <b style="color:var(--miss)">${miss}</b>件</span><span>遅れて提出 <b>${late}</b>件</span></div>
    <p class="muted" style="font-size:12.5px">マスを押すと 済→遅れ→免除→空欄 と変わります。持ってきた宿題をその場で記録できます。</p>
    ${secs || '<p class="muted">まだ記録がありません。</p>'}

  </aside>`;
}

let PX_PER_MM = 0;
function pxPerMm(){
  if (!PX_PER_MM){ const d = document.createElement('div'); d.style.cssText = 'position:absolute;visibility:hidden;width:100mm;height:1px;left:-9999px'; document.body.appendChild(d); PX_PER_MM = d.getBoundingClientRect().width / 100 || 3.7795; d.remove(); }

function printSetsFor(type){

function pageHtml(orient, inner, i, n, num){

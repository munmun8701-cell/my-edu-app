}
function dims(orient){ return orient === 'landscape' ? { w:273, h:185 } : { w:186, h:272 }; }
function paginateBlocks({ orient, blocks, onePer = false, gapMm = 8, cut = false }){
  if (!blocks.length) return [];
  const { w, h } = dims(orient); const ppm = pxPerMm(); const mr = $('#measure-root');
  mr.innerHTML = `<div class="pp" style="width:${w}mm">${blocks.map(b => `<div class="pp-block">${b}</div>`).join('')}</div>`;
  const hs = $$('.pp-block', mr).map(e => e.getBoundingClientRect().height);
  mr.innerHTML = '';
  const avail = h * ppm - 6, gap = gapMm * ppm;
  const pages = []; let cur = [], used = 0;
  hs.forEach((hh, i) => {
    if (onePer){ pages.push([i]); return; }
    const need = cur.length ? used + gap + hh : hh;
    if (cur.length && need > avail){ pages.push(cur); cur = [i]; used = hh; } else { cur.push(i); used = need; }
  });

}
function paginateTable({ orient, head, thead, rows, tableClass }){

  const headH = $('.mh-b', mr).getBoundingClientRect().height;
  const theadH = $('thead', mr).getBoundingClientRect().height;
  const rh = $$('tbody > tr', mr).map(r => r.getBoundingClientRect().height);
  mr.innerHTML = '';
  const avail = h * ppm - headH - theadH - 4 * ppm - 8;
  const pages = []; let cur = [], used = 0;
  rh.forEach((x, i) => { if (cur.length && used + x > avail){ pages.push(cur); cur = []; used = 0; } cur.push(i); used += x; });

/* ---------- ファイル書き出し ---------- */
function downloadBlob(name, blob){
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function downloadCSV(name, rows){
  const csv = '﻿' + rows.map(r => r.map(c => { c = c == null ? '' : String(c); return /[",\r\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(',')).join('\r\n');
  downloadBlob(name, new Blob([csv], { type:'text/csv;charset=utf-8' }));
  toast(`「${name}」を書き出しました（Excelでそのまま開けます）`);
}
const fileBase = () => `${safeName(S.className)}_${stampName()}`;

function csvSet(setId){
  const set = getSet(setId); if (!set) return; const sts = activeStudents();
  const label = it => set.type === 'numbered' ? it.label + '番' : set.type === 'dated' ? md(it.date) : it.label;
  const word = { done:'済', late:'遅れ', exempt:'免除', miss:'未', none:'', na:'対象外' };
  const rows = [['番号','名前', ...set.items.map(label), '未提出の数']];
  sts.forEach(st => { let m = 0; const cells = set.items.map((it, i) => { const cs = cellState(st, set, it, i); if (cs === 'miss') m++; return word[cs]; }); rows.push([st.no, st.name, ...cells, m]); });
  rows.push(['', '提出数', ...set.items.map((it, i) => isDue(set, it, i) ? sts.filter(st => ['done','late'].includes(cellState(st, set, it, i))).length : ''), '']);
  downloadCSV(`${safeName(setTitle(set))}_${fileBase()}.csv`, rows);
}
function csvAll(){
  const rows = [['番号','名前','教材','冊','回（番号・日付・名前）','出題','状態']];
  const word = { done:'済', late:'遅れて提出', exempt:'免除', miss:'未提出', none:'', na:'対象外' };
  S.sets.forEach(set => set.items.forEach((it, i) => activeStudents().forEach(st => {
    rows.push([st.no, st.name, set.name, set.vol, set.type === 'numbered' ? it.label + '番' : set.type === 'dated' ? it.date : it.label, isDue(set, it, i) ? 'あり' : 'なし', word[cellState(st, set, it, i)]]); })));
  downloadCSV(`すべての記録_${fileBase()}.csv`, rows);
}
async function doBackup(forceNew = false){
  if (forceNew) fileHandle = null;
  const payload = JSON.stringify({ app:'shukudai-board', version:1, exported:new Date().toISOString(), data:S });
  const name = `宿題提出ボード_${fileBase()}.json`;
  const done = msg => { S.settings.lastBackup = new Date().toISOString(); saveQuiet(); render(); toast(msg); };
  if (fileHandle){
    try { const w = await fileHandle.createWritable(); await w.write(payload); await w.close(); done(`「${fileHandle.name}」に上書き保存しました`); return; }
    catch (e){ fileHandle = null; }
  }
  if (window.showSaveFilePicker){
    try {
      const h = await window.showSaveFilePicker({ suggestedName:name, types:[{ description:'宿題提出ボードのバックアップ', accept:{ 'application/json':['.json'] } }] });
      const w = await h.createWritable(); await w.write(payload); await w.close(); fileHandle = h;
      done(`「${h.name}」に保存しました。次からは同じファイルに上書きします`); return;
    } catch (e){ if (e && e.name === 'AbortError') return; }
  }
  downloadBlob(name, new Blob([payload], { type:'application/json' }));
  done('バックアップを保存しました（ダウンロードフォルダに入っています）');
}
async function importFile(file){
  try {
    const obj = JSON.parse(await file.text());
    const data = obj && obj.app === 'shukudai-board' && obj.data ? obj.data : obj;
    if (!data || !Array.isArray(data.students) || !Array.isArray(data.sets)) throw new Error('format');
    const ns = normalize(data); ns.settings.theme = S.settings.theme;
    confirmModal({ title:'バックアップから復元しますか？',
      message:`${ns.className || '（クラス名なし）'}・児童 ${ns.students.length}人・教材 ${ns.sets.length}${obj.exported ? `\n保存した日時：${fmtDateTime(obj.exported)}` : ''}\n\nいまの記録は、この内容に入れかわります。`,
      ok:'復元する', onOk(){ commit('バックアップから復元', () => { S = ns; ui.check = { setId:null, itemId:null }; ui.matrixSet = null; }); toast('復元しました', { undo:true }); } });
  } catch (e){ toast('このファイルは読み込めませんでした。宿題提出ボードで保存したバックアップ（.json）を選んでください。', { kind:'error' }); }
}
</script>
<script>
/* ---------- トースト ---------- */
function toast(msg, opts = {}){
  const root = $('#toast-root'); const el = document.createElement('div');
  el.className = 'toast' + (opts.kind === 'error' ? ' error' : '');
  el.innerHTML = `<span>${esc(msg)}</span>${opts.undo ? '<button type="button">元に戻す</button>' : ''}`;
  if (opts.undo) el.querySelector('button').addEventListener('click', () => { el.remove(); undo(); });
  root.appendChild(el); while (root.children.length > 3) root.firstChild.remove();
  setTimeout(() => el.remove(), opts.undo ? 6000 : 3800);
}

/* ---------- 操作 ---------- */
function stepItem(d){
  const { set, idx } = checkContext(); if (!set || !set.items.length) return;
  const j = clamp(idx + d, 0, set.items.length - 1); ui.check.itemId = set.items[j].id; render();
}
function cycleMark(setId, itemId, stuId){
  const set = getSet(setId); const item = set?.items.find(i => i.id === itemId); const st = getStu(stuId); if (!item || !st) return;
  const next = { '':'d', d:'l', l:'x', x:'' }[getMark(setId, itemId, stuId)] ?? '';
  commit(`${st.name || st.no + '番'} ${setTitle(set)} ${itemLabelLong(set, item)}`, () => setMark(setId, itemId, stuId, next));
}
function applyNumEntry(){
  const inp = $('#num-entry'); if (!inp) return;
  const raw = inp.value; const nums = parseNums(raw);
  if (!nums.length){ toast('出席番号を入れてください（例：3 7 12-15）'); return; }
  const { set, item } = checkContext(); if (!item) return;
  const sts = activeStudents(); const hit = [], miss = [];
  nums.forEach(n => { const st = sts.find(s => s.no === n); st ? hit.push(st) : miss.push(n); });
  inp.value = ''; ui.focusAfter = 'num-entry';
  if (hit.length) commit(`番号入力（${itemLabelLong(set, item)}）`, () => hit.forEach(st => setMark(set.id, item.id, st.id, ui.mode)));
  else render();
  toast(`${hit.length ? hit.map(s => s.no).join('・') + '番を' + MODE_VERB[ui.mode] : ''}${miss.length ? `（${miss.join('・')}番は名簿にいません）` : ''}`, { undo:!!hit.length });
}
function addDated(iso){
  const { set } = checkContext(); if (!set || set.type !== 'dated' || !iso) return;
  const ex = set.items.find(it => it.date === iso);
  if (ex){ ui.check.itemId = ex.id; render(); toast(`${md(iso)} の回はもうあります`); return; }
  const it = { id:uid(), date:iso, label:'', due:true, made:iso };
  commit(`${md(iso)} の回を追加`, () => { set.items.push(it); set.items.sort((a, b) => a.date.localeCompare(b.date)); ui.check.itemId = it.id; });
}
function addNamed(label){
  const { set } = checkContext(); if (!set || set.type !== 'named') return;
  const it = { id:uid(), label, date:'', due:true, made:todayISO() };
  commit(`「${label}」を追加`, () => { set.items.push(it); ui.check.itemId = it.id; });
}
function openSetEditor(set, preset){
  if (set){
    openModal({ type:'set', isNew:false, setId:set.id, hasMarks:setHasMarks(set),
      draft:{ name:set.name, vol:set.vol, short:set.short, type:set.type, count:set.items.length, upTo:set.upTo, color:set.color, items:set.items.map(it => ({ ...it })) } });
  } else {
    const p = preset || { name:'', short:'', type:'numbered', count:20 };
    const used = new Set(S.sets.filter(t => !t.archived).map(t => t.color));
    openModal({ type:'set', isNew:true, hasMarks:false,
      draft:{ name:p.name, vol:p.type === 'numbered' && p.name ? defaultVol() : '', short:p.short || '', type:p.type, count:p.count || 20, upTo:0, color:COLORS.find(c => !used.has(c)) || COLORS[0], items:[] } });
  }
}
function selectPrint(type, target, selected){
  S.print.type = type; if (target) S.print.target = target; if (selected) S.print.selected = selected; saveQuiet();
}

const ACT = {
  nav:el => go(el.dataset.view),
  undo:() => undo(), redo:() => redo(),
  theme(){ const o = ['system','light','dark']; S.settings.theme = o[(o.indexOf(S.settings.theme) + 1) % 3]; saveQuiet(); render(); toast(`画面の色：${THEME_LABEL[S.settings.theme]}`); },
  backup:() => doBackup(), 'backup-as':() => doBackup(true),
  'load-sample'(){ const th = S.settings.theme; commit('サンプルを読み込み', () => { S = sampleState(); S.settings.theme = th; }); },
  'start-setup'(){
    const p = {}; PRESETS.forEach(x => { p[x.key] = { on:['kanji','keisan','ondoku','print'].includes(x.key), vol:defaultVol(), count:x.count || 20 }; });
    openModal({ type:'setup', draft:{ className:S.isSample ? '' : S.className, teacher:S.isSample ? '' : S.teacher, count:30, paste:'', presets:p } });
  },
  'setup-ok'(){
    const d = ui.modal.draft; const ns = blankState();
    ns.className = d.className.trim(); ns.teacher = d.teacher.trim();
    ns.settings.theme = S.settings.theme; ns.settings.legacyDismissed = S.settings.legacyDismissed; ns.settings.legacyDone = S.settings.legacyDone;
    ns.print.kidMsg = S.print.kidMsg; ns.print.parentMsg = S.print.parentMsg;
    const pasted = parsePaste(d.paste);
    if (pasted.length){ let next = 1; ns.students = pasted.map(p => { const no = p.no ?? next; next = no + 1; return mkStudent(no, p.name, p.kana); }); }
    else ns.students = Array.from({ length:clamp(parseInt(d.count) || 0, 0, 60) }, (_, i) => mkStudent(i + 1));
    PRESETS.forEach(p => { const o = d.presets[p.key]; if (!o || !o.on) return;
      const set = normSet({ name:p.name, short:p.short, type:p.type, vol:p.type === 'numbered' ? o.vol : '', color:COLORS[ns.sets.length % COLORS.length] });
      if (p.type === 'numbered') set.items = makeNumberedItems(clamp(parseInt(o.count) || 20, 1, 300));
      ns.sets.push(set); });
    ui.modal = null; ui.check = { setId:null, itemId:null }; ui.matrixSet = null;
    commit('新しいクラスを作成', () => { S = ns; });
    toast(pasted.length || ns.students.some(s => s.name) ? 'クラスを作りました' : 'クラスを作りました。「名簿」で名前を入れましょう', { undo:true });
    go(ns.students.some(s => s.name) ? 'home' : 'roster');
  },
  'legacy-import'(){ openModal({ type:'legacy' }); },
  'legacy-dismiss'(){ S.settings.legacyDismissed = true; saveQuiet(); render(); },
  'legacy-ok'(){
    const L = readLegacy(); if (!L){ closeModal(); return; }
    const ns = legacyToState(L); ns.settings.theme = S.settings.theme; ns.settings.legacyDone = true;
    if (!S.isSample){ ns.className = S.className; ns.teacher = S.teacher; }
    ui.modal = null; ui.check = { setId:null, itemId:null }; ui.matrixSet = null;
    commit('以前のツールから取り込み', () => { S = ns; });
    toast('取り込みました。「名簿」でクラス名を、「教材」でドリルの冊（上・下）を設定できます', { undo:true });
    go('home');
  },
  'print-quick'(el){ selectPrint(el.dataset.type, 'missing'); go('print'); },
  'print-sheet'(el){ const set = getSet(el.dataset.set); S.print.type = 'sheet'; S.print.sheetSet = el.dataset.set; if (set && set.type === 'numbered'){ S.print.sheetFrom = Math.max(1, set.upTo + 1 > set.items.length ? 1 : set.upTo + 1); S.print.sheetTo = Math.min(set.items.length, S.print.sheetFrom + 14); } saveQuiet(); go('print'); },
  'home-only'(el){ ui.homeOnlyMissing = el.dataset.v === '1'; render(); },
  'goto-check'(el){ ui.check = { setId:el.dataset.set, itemId:null }; go('check'); },
  'goto-matrix'(el){ ui.matrixSet = el.dataset.set; go('matrix'); },
  'goto-check-item'(el){ ui.check = { setId:el.dataset.set, itemId:el.dataset.item }; go('check'); },
  'check-set'(el){ ui.check = { setId:el.dataset.set, itemId:null }; render(); },
  'pick-item'(el){ ui.check.itemId = el.dataset.item; render(); },
  'item-step'(el){ stepItem(+el.dataset.d); },
  upto(el){ const set = getSet(el.dataset.set) || checkContext().set; if (!set) return; const v = clamp(set.upTo + (+el.dataset.d), 0, set.items.length); if (v === set.upTo) return; commit(`出題範囲を${v}番まで`, () => { set.upTo = v; }); },
  'upto-here'(){ const { set, idx } = checkContext(); if (!set) return; commit(`出題範囲を${idx + 1}番まで`, () => { set.upTo = idx + 1; }); },
  mode(el){ ui.mode = el.dataset.m; render(); },
  'tap-stu'(el){
    const { set, item } = checkContext(); if (!item) return; const id = el.dataset.id; const st = getStu(id);
    const cur = getMark(set.id, item.id, id); const next = ui.mode === '' ? '' : (cur === ui.mode ? '' : ui.mode);
    if (next === cur) return; ui.pop = next ? id : null;
    commit(`${st.name || st.no + '番'} ${itemLabelLong(set, item)}`, () => setMark(set.id, item.id, id, next));
  },
  'num-apply':() => applyNumEntry(),
  'all-done'(){
    const { set, item, idx } = checkContext(); if (!item) return;
    const targets = activeStudents().filter(st => !getMark(set.id, item.id, st.id) && cellState(st, set, item, idx) !== 'na');
    if (!targets.length){ toast('まだの子はいません'); return; }
    commit(`まだの子を全員済（${itemLabelLong(set, item)}）`, () => targets.forEach(st => setMark(set.id, item.id, st.id, 'd')));
    toast(`${targets.length}人を済にしました。出していない子だけ押して戻してください`, { undo:true });
  },
  'all-clear'(){
    const { set, item } = checkContext(); if (!item || !S.marks[set.id]?.[item.id]) return;
    commit(`${itemLabelLong(set, item)} を全部未に`, () => { delete S.marks[set.id][item.id]; });
    toast('この回の記録をすべて未に戻しました', { undo:true });
  },
  'add-today':() => addDated(todayISO()),
  'add-date':() => addDated($('#add-date')?.value),
  'add-named'(){ const v = $('#add-named')?.value.trim(); if (!v){ toast('プリントの名前を入れてください'); $('#add-named')?.focus(); return; } addNamed(v); },
  'item-due'(el){ const { set } = checkContext(); const it = set?.items.find(i => i.id === el.dataset.item); if (!it) return; commit(it.due !== false ? 'この回を出題なしに' : 'この回を出題に', () => { it.due = it.due === false; }); },
  'item-del'(el){
    const { set } = checkContext(); const it = set?.items.find(i => i.id === el.dataset.item); if (!it) return;
    const n = Object.keys(S.marks[set.id]?.[it.id] || {}).length;
    confirmModal({ title:'この回を削除しますか？', message:`${setTitle(set)} ${itemLabelLong(set, it)}${n ? `\n${n}人分の記録も消えます。` : ''}\n（すぐ後なら「元に戻す」で戻せます）`, ok:'削除する', danger:true,
      onOk(){ commit(`${itemLabelLong(set, it)} を削除`, () => { set.items = set.items.filter(x => x.id !== it.id); if (S.marks[set.id]) delete S.marks[set.id][it.id]; ui.check.itemId = null; }); } });
  },
  'open-student'(el){ ui.drawer = el.dataset.id; renderDrawer(); $('.drawer .icon-btn')?.focus(); },
  'drawer-close'(){ ui.drawer = null; renderDrawer(); },
  'drawer-print'(el){ selectPrint(el.dataset.type, 'selected', [ui.drawer]); ui.drawer = null; go('print'); },
  cycle(el){ cycleMark(el.dataset.set, el.dataset.item, el.dataset.stu); },
  'matrix-set'(el){ ui.matrixSet = el.dataset.set; render(); },
  'csv-set-direct'(el){ csvSet(el.dataset.set); },
  preset(el){ const p = PRESETS.find(x => x.key === el.dataset.key); openSetEditor(null, p); },
  'edit-set'(el){ openSetEditor(getSet(el.dataset.set)); },
  'next-vol'(el){ const set = getSet(el.dataset.set); if (!set) return; openModal({ type:'nextvol', setId:set.id, draft:{ vol:nextVol(set.vol), count:set.items.length || 20, track:true } }); },
  'nv-ok'(){
    const m = ui.modal; const set = getSet(m.setId); if (!set) return closeModal(); const d = m.draft;
    const vol = String(d.vol || '').trim();
    if (!vol || vol === set.vol){ toast(vol ? `今と同じ「${vol}」以外の名前を入れてください` : '次の冊の名前を入れてください（例：下、2）'); $('#nv-vol')?.focus(); return; }
    const ns = normSet({ name:set.name, vol, short:set.short, type:set.type, color:set.color, upTo:0 });
    if (set.type === 'numbered') ns.items = makeNumberedItems(clamp(parseInt(d.count) || set.items.length || 20, 1, 300));
    ui.modal = null;
    commit(`「${setTitle(ns)}」へ進む`, () => { set.archived = true; set.track = !!d.track; set.archivedAt = todayISO(); S.sets.splice(S.sets.indexOf(set) + 1, 0, ns); ui.check = { setId:ns.id, itemId:null }; ui.matrixSet = ns.id; });
    toast(`「${setTitle(ns)}」を始めました。${set.vol || '前の冊'}の記録は「完了した教材」に残っています`, { undo:true });
  },
  'archive-set'(el){ const set = getSet(el.dataset.set); if (set) openModal({ type:'archive', setId:set.id, draft:{ track:true } }); },
  'ar-ok'(){ const m = ui.modal; const set = getSet(m.setId); ui.modal = null; if (!set) return render(); commit(`「${setTitle(set)}」を完了に`, () => { set.archived = true; set.track = !!m.draft.track; set.archivedAt = todayISO(); }); toast(`「${setTitle(set)}」を完了にしました`, { undo:true }); },
  'unarchive-set'(el){ const set = getSet(el.dataset.set); if (set) commit(`「${setTitle(set)}」を使用中に`, () => { set.archived = false; set.archivedAt = ''; }); },
  'delete-set'(el){ const set = getSet(el.dataset.set); if (!set) return;
    confirmModal({ title:`「${setTitle(set)}」を削除しますか？`, message:'この教材の記録もすべて消えます。\n記録を残したいときは「完了にする」を使ってください。', ok:'削除する', danger:true,
      onOk(){ commit(`「${setTitle(set)}」を削除`, () => { S.sets = S.sets.filter(t => t.id !== set.id); delete S.marks[set.id]; S.print.excludedSets = S.print.excludedSets.filter(x => x !== set.id); }); toast('削除しました', { undo:true }); } }); },
  'move-set'(el){ const i = S.sets.findIndex(t => t.id === el.dataset.set); const d = +el.dataset.d; let j = i + d;
    while (j >= 0 && j < S.sets.length && S.sets[j].archived) j += d;
    if (i < 0 || j < 0 || j >= S.sets.length) return; commit('教材の順番', () => { const [x] = S.sets.splice(i, 1); S.sets.splice(j, 0, x); }); },
  'se-vol'(el){ ui.modal.draft.vol = el.dataset.v; renderModal(); },
  'se-color'(el){ ui.modal.draft.color = el.dataset.c; renderModal(); },
  'se-add-item'(){ const d = ui.modal.draft; d.items.push(d.type === 'dated' ? { id:uid(), date:todayISO(), label:'', due:true, made:todayISO() } : { id:uid(), label:'', date:'', due:true, made:todayISO() }); ui.focusAfter = `se-it-${d.items.length - 1}`; renderModal(); },
  'se-del-item'(el){ ui.modal.draft.items.splice(+el.dataset.i, 1); renderModal(); },
  'se-delete'(){ const id = ui.modal.setId; ui.modal = null; ACT['delete-set']({ dataset:{ set:id } }); },
  'se-save'(){
    const m = ui.modal, d = m.draft; const name = String(d.name || '').trim();
    if (!name){ toast('教材名を入れてください'); $('#se-name')?.focus(); return; }
    ui.modal = null;
    commit(m.isNew ? `「${name}」を追加` : `「${name}」を変更`, () => {
      let set = m.isNew ? null : getSet(m.setId);
      if (!set){ set = normSet({ name, type:d.type }); const firstArch = S.sets.findIndex(t => t.archived); if (firstArch < 0) S.sets.push(set); else S.sets.splice(firstArch, 0, set); }
      set.name = name; set.vol = String(d.vol || '').trim(); set.short = String(d.short || '').trim(); set.color = d.color;
      if (!m.hasMarks) set.type = d.type;
      if (set.type === 'numbered'){ resizeNumbered(set, clamp(parseInt(d.count) || 0, 0, 300)); set.upTo = clamp(parseInt(d.upTo) || 0, 0, set.items.length); }
      else {
        const seen = new Set();
        const keep = d.items.filter(it => set.type === 'dated' ? (it.date && !seen.has(it.date) && seen.add(it.date)) : String(it.label || '').trim());
        const ids = new Set(keep.map(it => it.id));
        set.items.forEach(it => { if (!ids.has(it.id) && S.marks[set.id]) delete S.marks[set.id][it.id]; });
        set.items = keep.map(it => ({ id:it.id || uid(), label:String(it.label || '').trim(), date:it.date || '', due:it.due !== false, made:it.made || it.date || todayISO() }));
        if (set.type === 'dated') set.items.sort((a, b) => a.date.localeCompare(b.date));
      }
      if (m.isNew){ ui.check = { setId:set.id, itemId:null }; }
    });
    toast(m.isNew ? `「${name}」を追加しました` : '保存しました');
  },
  'add-student'(){ const no = Math.max(0, ...S.students.map(s => s.no)) + 1; const st = mkStudent(no); ui.focusAfter = `st-name-${st.id}`; commit(`${no}番を追加`, () => S.students.push(st)); },
  'del-student'(el){ const st = getStu(el.dataset.id); if (!st) return;
    confirmModal({ title:`${st.no}番 ${st.name || ''} を削除しますか？`, message:'この子の提出記録もすべて消えます。\n転出などで記録を残したいときは「在籍」のチェックを外してください。', ok:'削除する', danger:true,
      onOk(){ commit(`${st.no}番を削除`, () => { S.students = S.students.filter(s => s.id !== st.id); Object.values(S.marks).forEach(items => Object.values(items).forEach(o => { delete o[st.id]; })); }); toast('削除しました', { undo:true }); } }); },
  'sort-students'(){ commit('番号順に並べる', () => S.students.sort((a, b) => a.no - b.no)); },
  renumber(){ confirmModal({ title:'番号を1から振り直しますか？', message:'いまの並び順のまま、在籍している子に 1, 2, 3… と番号をつけ直します。', ok:'振り直す',
      onOk(){ commit('番号を振り直し', () => { let n = 1; S.students.filter(s => s.active).forEach(s => { s.no = n++; }); }); } }); },
  'paste-add'(){ const rows = parsePaste($('#paste-box')?.value); if (!rows.length){ toast('名前を貼り付けてください'); return; }
    let next = Math.max(0, ...S.students.map(s => s.no)) + 1;
    commit(`${rows.length}人を追加`, () => rows.forEach(r => { const no = r.no ?? next; next = Math.max(next, no) + 1; S.students.push(mkStudent(no, r.name, r.kana)); }));
    toast(`${rows.length}人を追加しました`, { undo:true }); },
  'paste-overwrite'(){ const rows = parsePaste($('#paste-box')?.value); if (!rows.length){ toast('名前を貼り付けてください'); return; }
    let up = 0, add = 0, next = 1;
    commit('名簿を書きかえ', () => rows.forEach(r => { const no = r.no ?? next; next = no + 1; const st = S.students.find(s => s.no === no && s.active);
      if (st){ st.name = r.name; if (r.kana) st.kana = r.kana; up++; } else { S.students.push(mkStudent(no, r.name, r.kana)); add++; } }));
    toast(`${up}人を書きかえ、${add}人を追加しました（記録はそのままです）`, { undo:true }); },
  'p-type'(el){ S.print.type = el.dataset.t; if (el.dataset.t === 'sheet' && !S.print.sheetSet){ const t = S.sets.find(x => !x.archived && x.type === 'numbered'); if (t) S.print.sheetSet = t.id; } saveQuiet(); render(); },
  'p-target'(el){ S.print.target = el.dataset.v; if (el.dataset.v === 'selected' && !S.print.selected.length){ const sets = printSetsFor(S.print.type); S.print.selected = activeStudents().filter(st => missingGroups(st, sets).length).map(st => st.id); } saveQuiet(); render(); },
  'p-sel'(el){ const v = el.dataset.v; const sts = activeStudents(); const sets = printSetsFor(S.print.type);
    S.print.selected = v === 'all' ? sts.map(s => s.id) : v === 'none' ? [] : sts.filter(st => missingGroups(st, sets).length).map(s => s.id); saveQuiet(); render(); },
  'p-layout'(el){ S.print.layout = el.dataset.v; saveQuiet(); render(); },
  'p-orient'(el){ S.print.orient = el.dataset.v; saveQuiet(); render(); },
  'p-msg-reset'(el){ S.print[el.dataset.key] = el.dataset.key === 'kidMsg' ? DEFAULT_KID_MSG : DEFAULT_PARENT_MSG; saveQuiet(); render(); },
  'p-print'(){ refreshPreview(); if (!$('#print-root').children.length){ toast('印刷するものがありません'); return; } window.print(); },
  'csv-missing':() => csvMissing(),
  'csv-set'(){ const id = $('#csv-set')?.value || ui.csvSet; if (id) csvSet(id); },
  'csv-all':() => csvAll(),
  wipe(){ confirmModal({ title:'すべてのデータを消しますか？', message:'名簿・教材・提出記録がすべて消えます。\n消す前にバックアップを保存しておくことをおすすめします。\n（このページを閉じると元に戻せません）', ok:'すべて消す', danger:true, typeToConfirm:'けす',
      onOk(){ const th = S.settings.theme; commit('すべて消去', () => { S = blankState(); S.settings.theme = th; S.settings.legacyDismissed = true; }); go('home'); toast('すべて消しました', { undo:true }); } }); },
  'm-cancel':() => closeModal(),
  'm-ok'(){ const fn = modalFn; closeModal(); fn?.(); }
};

const CHG = {
  'check-arch'(el){ if (el.value){ ui.check = { setId:el.value, itemId:null }; render(); } },
  'matrix-arch'(el){ if (el.value){ ui.matrixSet = el.value; render(); } },
  'only-missing'(el){ ui.onlyMissing = el.checked; render(); },
  'matrix-only'(el){ ui.matrixOnlyMissing = el.checked; render(); },
  track(el){ const set = getSet(el.dataset.set); if (set) commit(el.checked ? '未提出を追いかける' : '未提出を追いかけない', () => { set.track = el.checked; }); },
  'class-field'(el){ const f = el.dataset.field; const v = f === 'year' ? (parseInt(el.value) || schoolYearOf()) : el.value.trim(); commit('クラスの情報', () => { S[f] = v; if (f === 'className') S.isSample = false; }, { render:false }); },
  'stu-field'(el){ const st = getStu(el.dataset.id); if (!st) return; const f = el.dataset.field;
    let v = el.type === 'checkbox' ? el.checked : el.value; if (f === 'no') v = clamp(parseInt(toHalf(v)) || st.no, 1, 99); if (typeof v === 'string') v = v.trim();
    commit(`${st.no}番の${{ no:'番号', name:'名前', kana:'ふりがな', from:'転入日', active:'在籍' }[f]}`, () => { st[f] = v; }, { render:false });
    if (f === 'active') el.closest('tr')?.classList.toggle('inactive', !v); },
  memo(el){ const st = getStu(el.dataset.id); if (st) commit('メモ', () => { st.memo = el.value; }, { render:false }); },
  'import-file'(el){ const f = el.files && el.files[0]; if (f) importFile(f); el.value = ''; },
  'csv-set'(el){ ui.csvSet = el.value; },
  'p-stu'(el){ const s = new Set(S.print.selected); el.checked ? s.add(el.dataset.id) : s.delete(el.dataset.id); S.print.selected = [...s]; saveQuiet(); render(); },
  'p-set'(el){ const s = new Set(S.print.excludedSets); el.checked ? s.delete(el.dataset.set) : s.add(el.dataset.set); S.print.excludedSets = [...s]; saveQuiet(); render(); },
  'p-arch'(el){ S.print.includeArchived = el.checked; saveQuiet(); render(); },
  'p-due'(el){ S.print.due = el.value; saveQuiet(); render(); },
  'p-sign'(el){ S.print.sign = el.checked; saveQuiet(); render(); },
  'p-rec1'(el){ S.print.recordOnePage = el.checked; saveQuiet(); render(); },
  'p-fill'(el){ S.print.sheetFill = el.checked; saveQuiet(); render(); },
  'p-sheet-set'(el){ S.print.sheetSet = el.value; const t = getSet(el.value); if (t && t.type === 'numbered'){ S.print.sheetFrom = 1; S.print.sheetTo = Math.min(t.items.length, 20); } saveQuiet(); render(); },
  'p-num'(el){ S.print[el.dataset.key] = parseInt(el.value) || 1; saveQuiet(); render(); }
};
let previewTimer = null;
const INP = {
  'home-search'(el, e){ if (e && e.isComposing) return; ui.homeFilter = el.value; render(); },
  'confirm-type'(el){ const b = $('#m-ok'); if (b && ui.modal) b.disabled = el.value.trim() !== ui.modal.typeToConfirm; },
  'p-msg'(el){ S.print[el.dataset.key] = el.value; clearTimeout(previewTimer); previewTimer = setTimeout(() => { saveQuiet(); refreshPreview(); }, 350); }
};
function onDraft(el, e){
  if (!ui.modal || !ui.modal.draft) return;
  const v = el.type === 'checkbox' ? el.checked : el.value;
  setPath(ui.modal.draft, el.dataset.draft, v);
  if (el.dataset.rerender && e.type === 'change') renderModal();
}

/* ---------- イベント ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.draft){ onDraft(t, e); return; }
  const el = t.closest('[data-change]'); if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.draft){ onDraft(t, e); return; }
  const el = t.closest('[data-input]'); if (el && INP[el.dataset.input]) INP[el.dataset.input](el, e);
});
document.addEventListener('compositionend', e => {
  const el = e.target.closest && e.target.closest('[data-input]'); if (el && INP[el.dataset.input]) INP[el.dataset.input](el, e);
});
document.addEventListener('keydown', e => {
  const t = e.target; const editing = t && (['INPUT','TEXTAREA','SELECT'].includes(t.tagName) || t.isContentEditable);
  if (e.key === 'Escape'){ if (ui.modal){ closeModal(); e.preventDefault(); } else if (ui.drawer){ ui.drawer = null; renderDrawer(); e.preventDefault(); } return; }
  if ((e.ctrlKey || e.metaKey) && !e.altKey){
    const k = e.key.toLowerCase();
    if (k === 's'){ e.preventDefault(); doBackup(); return; }
    if (k === 'p' && ui.view !== 'print'){ return; }
    if (!editing && k === 'z' && !e.shiftKey){ e.preventDefault(); undo(); return; }
    if (!editing && (k === 'y' || (k === 'z' && e.shiftKey))){ e.preventDefault(); redo(); return; }
    return;
  }
  if (t && t.id === 'num-entry' && e.key === 'Enter' && !e.isComposing){ e.preventDefault(); applyNumEntry(); return; }
  if (t && t.id === 'add-named' && e.key === 'Enter' && !e.isComposing){ e.preventDefault(); ACT['add-named'](); return; }
  if (ui.view === 'check' && !editing && !ui.modal && !ui.drawer){
    if (e.key === 'ArrowLeft'){ e.preventDefault(); stepItem(-1); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); stepItem(1); }
    else if (/^[0-9０-９]$/.test(e.key)){ const inp = $('#num-entry'); if (inp) inp.focus(); }
  }
});
window.addEventListener('beforeprint', () => { if (!$('#print-root').children.length || ui.view !== 'print') preparePrint(); });
window.addEventListener('resize', () => { if (ui.view === 'print') fitPreview(S.print.orient && (S.print.type === 'list' || S.print.type === 'sheet') ? S.print.orient : 'portrait'); });
window.addEventListener('storage', e => {
  if (e.key !== KEY || !e.newValue) return;
  try { S = normalize(JSON.parse(e.newValue)); render(); toast('別のタブでの変更を読み込みました'); } catch (err){}
});

const VIEWS = { home:viewHome, check:viewCheck, matrix:viewMatrix, sets:viewSets, roster:viewRoster, print:viewPrint, data:viewData };
const AFTER = {
  check(){
    const strip = $('#np-strip'); const sel = strip && strip.querySelector('.np.sel');
    if (strip && sel && ui.stripScrolledFor !== ui.check.itemId){ strip.scrollLeft = sel.offsetLeft - strip.clientWidth / 2 + sel.offsetWidth / 2; ui.stripScrolledFor = ui.check.itemId; }
  },
  matrix(){
    const w = $('#mx-wrap'); const set = getSet(ui.matrixSet);
    if (w && set && ui.matrixScrolledFor !== set.id){ if (set.type === 'dated') w.scrollLeft = w.scrollWidth; ui.matrixScrolledFor = set.id; }
  },
  print(){ refreshPreview(); }
};

/* ---------- はじまり ---------- */
(function init(){
  let raw = null; try { raw = localStorage.getItem(KEY); } catch (e){}
  if (raw){ try { S = normalize(JSON.parse(raw)); } catch (e){ S = sampleState(); } }
  else S = sampleState();
  const h = location.hash.slice(1); ui.view = VIEWS[h] ? h : 'home';
  render();
  if (!raw && readLegacy()) openModal({ type:'legacy' });
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e){}
  if (document.fonts && document.fonts.load){
    Promise.all(['400 16px "BIZ UDPGothic"', '700 16px "BIZ UDPGothic"', '400 16px "Klee One"', '600 16px "Klee One"'].map(f => document.fonts.load(f).catch(() => null)))
      .then(() => document.fonts.ready).then(() => { if (ui.view === 'print') refreshPreview(); }).catch(() => {});
  }
})();
</script>
</body>

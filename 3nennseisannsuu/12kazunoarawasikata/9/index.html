<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>３年　数の表し方　９時間目</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
  <header>
    <h1>小数の筆算 ツールボックス</h1>
    <div class="notebook-prompt">
      ✏️ アプリでブロックを動かしながら、筆算を完成させよう！
    </div>
  </header>

  <div class="mission-bar">
    <span class="mission-label">📖 もんだい：</span>
    <button class="btn btn-outline" onclick="setProblem('add', 2.5, 1.8)">① 2.5 ＋ 1.8</button>
    <button class="btn btn-outline" onclick="setProblem('sub', 4.3, 1.8)">② 4.3 － 1.8</button>
    <button class="btn btn-outline" onclick="setProblem('sub', 5, 1.4)">③ 5 － 1.4 (0を補う)</button>
    <button class="btn btn-outline" onclick="setProblem('sub', 45, 3.5)">④ 45 － 3.5 (位をそろえる)</button>
    <div class="problem-display" id="problem-display">❓ 〇 ❓</div>
  </div>

  <main class="workspace">
    <div class="hissan-section">
      <div class="vis-header">
        📝 筆算ボード <small>（位をそろえて、小数点をタップで打とう）</small>
        <button class="btn btn-red outline small-btn" onclick="clearHissan()">消す</button>
      </div>
      
      <div class="hissan-board" id="hissan-board">
        <div class="h-grid">
          <div class="decimal-guideline"></div>
          
          <div class="h-row labels">
            <div class="h-cell empty"></div>
            <div class="h-cell">十</div>
            <div class="h-cell">一</div>
            <div class="h-cell dot-col"></div>
            <div class="h-cell">1/10</div>
          </div>
          
          <div class="h-row memo-row">
            <div class="h-cell empty"></div>
            <div class="h-cell"><input type="text" class="memo-in"></div>
            <div class="h-cell"><input type="text" class="memo-in"></div>
            <div class="h-cell dot-col"></div>
            <div class="h-cell"><input type="text" class="memo-in"></div>
          </div>

          <div class="h-row">
            <div class="h-cell empty"></div>
            <div class="h-cell"><input type="text" class="num-in"></div>
            <div class="h-cell"><input type="text" class="num-in"></div>
            <div class="h-cell dot-col"><button type="button" class="dot-btn" onclick="toggleDot(this)"></button></div>
            <div class="h-cell"><input type="text" class="num-in"></div>
          </div>

          <div class="h-row">
            <div class="h-cell sign" id="op-sign">＋</div>
            <div class="h-cell"><input type="text" class="num-in"></div>
            <div class="h-cell"><input type="text" class="num-in"></div>
            <div class="h-cell dot-col"><button type="button" class="dot-btn" onclick="toggleDot(this)"></button></div>
            <div class="h-cell"><input type="text" class="num-in"></div>
          </div>

          <div class="h-line"></div>

          <div class="h-row">
            <div class="h-cell empty"></div>
            <div class="h-cell"><input type="text" class="num-in ans-in"></div>
            <div class="h-cell"><input type="text" class="num-in ans-in"></div>
            <div class="h-cell dot-col"><button type="button" class="dot-btn ans-dot" onclick="toggleDot(this)"></button></div>
            <div class="h-cell"><input type="text" class="num-in ans-in"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="block-section">
      <div class="vis-header">
        🟦 ブロックでかくにん <small>（0.1をもとにして考えよう）</small>
        <button class="btn btn-yellow hint-btn" onclick="showHint()">💡 ヒント</button>
      </div>

      <div class="block-actions">
        <button id="btn-break" class="btn btn-red hidden" onclick="breakBlock()">⚠️ 1を 0.1×10こ にバラす</button>
        <button id="btn-break-ten" class="btn btn-red hidden" onclick="breakTenBlock()">⚠️ 10を 1×10こ にバラす</button>
        <button id="btn-merge" class="btn btn-green hidden" onclick="mergeBlock()">✨ 0.1×10こ を 1 にまとめる</button>
        <div id="block-message" class="block-msg">ボタンをおして問題を選ぼう</div>
      </div>

      <div class="block-stage">
        <div class="block-col" id="col-tens" style="display:none;">
          <div class="col-label">10</div>
          <div class="block-area" id="area-tens"></div>
        </div>
        <div class="block-col">
          <div class="col-label">1</div>
          <div class="block-area" id="area-ones"></div>
        </div>
        <div class="block-col">
          <div class="col-label">0.1</div>
          <div class="block-area" id="area-tenths"></div>
        </div>
      </div>
    </div>
  </main>

  <div class="notebook-guide">
    <h3>📓 ノートに筆算と「考え方」を書こう</h3>
    <div class="notebook-keywords">
      <span>「位をそろえて書き…」</span>
      <span>「上の小数点にそろえて 答えの小数点をうち…」</span>
      <span>「0.1が 〇こ分と考えて…」</span>
    </div>
  </div>

  <div id="hint-modal" class="modal hidden">
    <div class="modal-content">
      <h3>💡 考え方のヒント</h3>
      <p id="hint-text"></p>
      <button class="btn btn-gray mt-3" onclick="closeHint()">わかった！</button>
    </div>
  </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

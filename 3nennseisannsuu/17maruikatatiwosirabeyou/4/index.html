<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>３年　まるい形を調べよう　４時間目</title>
    <meta name="viewport" content="width=device-width"><link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">


  </head>
    
  <body>
  <!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>円と球 (第4時) コンパスを使った円のかき方 ツールボックス</title>
  <style>
    :root {
      --color-a: #4dabf7;
      /* ブルー */
      --bg-a: #e7f5ff;
      --color-b: #ff922b;
      /* オレンジ */
      --bg-b: #fff4e6;
      --color-c: #e03131;
      /* レッド */
      --success: #40c057;
      --warning: #fcc419;
      --danger: #fa5252;
      --bg: #f4f6f8;
      --border: #ced4da;
      --theme: #20c997;
      /* メインテーマ（緑系） */
      --theme-light: #e6fcf5;
      --text-main: #343a40;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      color: var(--text-main);
    }

    .app-container {
      background: white;
      max-width: 900px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    /* Header */
    header {
      background: var(--theme-light);
      padding: 15px;
      text-align: center;
      border-bottom: 3px solid var(--theme);
    }

    .sub-title {
      font-size: 0.9rem;
      color: #087f5b;
      font-weight: bold;
      margin: 0;
      background: #96f2d7;
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0 0 10px;
      color: #087f5b;
      font-size: 1.6rem;
    }

    .notebook-prompt {
      display: inline-block;
      background: white;
      border: 2px solid #38d9a9;
      color: #087f5b;
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: bold;
    }

    /* Tabs & Story */
    .mission-bar {
      background: #f8f9fa;
      padding: 15px;
      border-bottom: 1px solid var(--border);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 8px 15px;
      background: white;
      border: 2px solid #adb5bd;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      color: #495057;
      font-size: 1rem;
      transition: 0.2s;
    }

    .tab-btn:hover {
      background: #e9ecef;
    }

    .tab-btn.active {
      border-color: var(--theme);
      background: var(--theme);
      color: white;
    }

    .story-problem {
      background: white;
      border: 2px solid var(--theme);
      border-left: 8px solid var(--theme);
      padding: 15px;
      font-size: 1.2rem;
      line-height: 1.6;
      font-weight: bold;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .keyword {
      background: #fff3cd;
      border: 2px solid #ffeeba;
      color: #d9480f;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: bold;
      display: inline-block;
    }

    /* Controls */
    .global-controls {
      display: flex;
      gap: 15px;
      padding: 15px 20px;
      background: white;
      border-bottom: 3px dashed var(--border);
      justify-content: center;
      align-items: center;
      min-height: 80px;
      flex-wrap: wrap;
    }

    .btn-action {
      background: var(--color-a);
      color: white;
      font-size: 1.1rem;
      padding: 12px 25px;
      border-radius: 30px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(77, 171, 247, 0.3);
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-action:hover {
      background: #339af0;
      transform: translateY(-2px);
    }

    .btn-action:disabled {
      background: #adb5bd;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .btn-reset {
      background: white;
      border: 2px solid var(--border);
      color: #495057;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Visual Sandbox */
    .visual-container {
      padding: 20px;
      background: white;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 400px;
    }

    .stage-wrapper {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1 / 1;
      background: #fffdf0;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.05);
    }

    /* 方眼紙背景 */
    .grid-bg {
      background-size: 20px 20px;
      background-image:
        linear-gradient(to right, #e9ecef 1px, transparent 1px),
        linear-gradient(to bottom, #e9ecef 1px, transparent 1px);
    }

    svg.draw-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Message */
    .result-message {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--danger);
      background: #ffe3e3;
      padding: 10px 20px;
      border-radius: 30px;
      border: 2px dashed #ffa8a8;
      text-align: center;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .result-message.show {
      opacity: 1;
    }

    /* 話し合いボード */
    .discussion-area {
      background: #f8f9fa;
      padding: 20px;
      border-top: 3px dashed var(--border);
    }

    .discussion-topic {
      background: #e6fcf5;
      border: 2px solid #20c997;
      border-left: 8px solid #20c997;
      color: #087f5b;
      padding: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 6px;
      margin-bottom: 0;
    }

    .textbook-tip {
      font-size: 1.05rem;
      background: white;
      padding: 15px;
      border-radius: 6px;
      margin-top: 15px;
      border: 2px solid #ffc078;
      color: #495057;
      line-height: 1.8;
    }

    /* Practice Section */
    .free-progress-section {
      background: #e3fafc;
      padding: 20px;
      border-top: 5px solid #15aabf;
      border-radius: 0 0 12px 12px;
    }

    .fp-header h2 {
      color: #0b7285;
      margin-top: 0;
      font-size: 1.3rem;
      text-align: center;
    }

    .practice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
    }

    .practice-card {
      background: white;
      border: 2px solid #99e9f2;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .pc-title {
      font-weight: bold;
      color: #0b7285;
      margin-bottom: 10px;
      font-size: 1.1rem;
      border-bottom: 1px dashed #99e9f2;
      padding-bottom: 5px;
    }

    .pc-content {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .pc-select {
      height: 40px;
      font-size: 1.1rem;
      font-weight: bold;
      border: 2px solid #ced4da;
      border-radius: 6px;
      padding: 0 5px;
    }

    .pc-mark {
      font-size: 1.8rem;
      font-weight: bold;
      width: 30px;
      text-align: center;
      margin-left: auto;
    }

    .hidden {
      display: none !important;
    }

    /* Animations */
    .draw-anim {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawLine 1.5s forwards ease-in-out;
    }

    .draw-circle-anim {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawLine 2s forwards linear;
    }

    @keyframes drawLine {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* Compass parts tooltip */
    .tooltip-text {
      font-size: 14px;
      font-weight: bold;
      fill: #343a40;
      animation: fadeIn 0.3s forwards;
    }

    .tooltip-bg {
      fill: #fff9db;
      stroke: #fcc419;
      stroke-width: 2;
      rx: 8;
      animation: fadeIn 0.3s forwards;
    }
  </style>
</head>

<body>

  <div class="app-container">
    <header>
      <div class="sub-title">円と球 (第4時)</div>
      <h1>コンパスを使った 円のかき方</h1>
      <div class="notebook-prompt">
        ✏️ コンパスの正しい使い方をマスターして、きれいな円やもようをかこう！
      </div>
    </header>

    <div class="mission-bar">
      <div class="tabs">
        <button class="tab-btn active" onclick="setMode(1)">① コンパスのじゅんび</button>
        <button class="tab-btn" onclick="setMode(2)">② 円のかき方</button>
        <button class="tab-btn" onclick="setMode(3)">③ 【適応】もようづくり</button>
      </div>
      <div class="story-problem" id="story-text">
        <!-- JSで挿入 -->
      </div>
    </div>

    <div class="global-controls" id="controls-area">
      <!-- JSで挿入 -->
    </div>

    <main class="visual-sandbox">
      <div class="visual-container">
        <div class="stage-wrapper" id="stage">
          <svg class="draw-layer" id="draw-layer"></svg>
        </div>
        <div class="result-message" id="result-message">
          <!-- JSで結果を表示 -->
        </div>
      </div>

      <!-- 話し合いボード -->
      <div class="discussion-area">
        <div class="discussion-topic" id="discussion-topic"></div>
        <div class="textbook-tip" id="textbook-tip"></div>
      </div>
    </main>

    <!-- 練習問題 -->
    <div class="free-progress-section">
      <div class="fp-header">
        <h2>🌟 まとめと練習問題</h2>
      </div>

      <div class="practice-grid">
        <div class="practice-card">
          <div class="pc-title">① 円をかくとき、コンパスの幅が変わらないように どこを持ちますか。</div>
          <div class="pc-content">
            <select class="pc-select" id="prac1-sel" onchange="checkPrac(1, 'tsumami')">
              <option value="">えらぶ</option>
              <option value="hari">はり</option>
              <option value="enpitsu">えんぴつ</option>
              <option value="tsumami">つまみ</option>
            </select>
            <span class="pc-mark" id="prac1-mark"></span>
          </div>
        </div>

        <div class="practice-card">
          <div class="pc-title">② 中心からの長さが等しくなるように、コンパスの開いた長さを どうしますか。</div>
          <div class="pc-content">
            <select class="pc-select" id="prac2-sel" onchange="checkPrac(2, 'kaenaide')">
              <option value="">えらぶ</option>
              <option value="kaeru">かえながらかく</option>
              <option value="kaenaide">かえないでかく</option>
            </select>
            <span class="pc-mark" id="prac2-mark"></span>
          </div>
        </div>

        <div class="practice-card">
          <div class="pc-title">③ コンパスのはりが ずれてしまうときは、どこに力を入れますか。</div>
          <div class="pc-content">
            <select class="pc-select" id="prac3-sel" onchange="checkPrac(3, 'hari')">
              <option value="">えらぶ</option>
              <option value="hari">はりのほう</option>
              <option value="enpitsu">えんぴつのほう</option>
            </select>
            <span class="pc-mark" id="prac3-mark"></span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    let currentMode = 1;
    let stepCount = 0;
    const CX = 200;
    const CY = 200;
    document.addEventListener('DOMContentLoaded', () => {
      setMode(1);
    });

    function setMode(mode) {
      currentMode = mode;
      stepCount = 0;
      document.getElementById('result-message').classList.remove('show');
      document.getElementById('stage').className = 'stage-wrapper'; // reset grid
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        if (idx + 1 === mode) btn.classList.add('active');
        else btn.classList.remove('active');
      });
      const story = document.getElementById('story-text');
      const topic = document.getElementById('discussion-topic');
      const tip = document.getElementById('textbook-tip');
      const controls = document.getElementById('controls-area');
      const svg = document.getElementById('draw-layer');
      svg.innerHTML = '';
      if (mode === 1) {
        story.innerHTML = `円をかくときには、<span class="keyword">コンパス</span> を使うとべんりです。<br>まずは、コンパスの部分の名前をかくにんしよう。`;
        topic.innerHTML = `🗣️ コンパスを回すときは、どこを持つと じょうずに回せるかな？`;
        tip.innerHTML = `
          ・上の持つところを <strong>つまみ</strong> といいます。<br>
          ・紙にさすほうを <strong>はり</strong>、かくほうを <strong>えんぴつ（しん）</strong> といいます。<br>
          ・<strong>ねじ</strong> がゆるんでいると、かいているとちゅうで幅がかわってしまいます。
        `;
        controls.innerHTML = `
          <button class="btn-action" style="background:#e03131;" onclick="showPart('hari')">📍 はり</button>
          <button class="btn-action" style="background:#4dabf7;" onclick="showPart('enpitsu')">✏️ えんぴつ</button>
          <button class="btn-action" style="background:#ff922b;" onclick="showPart('tsumami')">👆 つまみ</button>
          <button class="btn-action" style="background:#845ef7;" onclick="showPart('neji')">🔩 ねじ</button>
        `;
        drawCompassBase();
      } else if (mode === 2) {
        story.innerHTML = `コンパスを使って、<span class="keyword">半径５cm の円</span> をかいてみよう。`;
        topic.innerHTML = `🗣️ かくときには、どんなことに気をつけたら いいだろう？`;
        tip.innerHTML = `
          💡 <strong>円のかき方：</strong><br>
          ① 開く：ものさしを使って、半径の長さにコンパスを開く。<br>
          ② さす：中心の場所を決めて、はりをさす。<br>
          ③ 回す：手首を自分のほうにひねり、つまみを持って 一気に回す。<br>
          <span style="color:#d9480f; font-weight:bold;">※中心からの長さが等しくなるように、コンパスの開いた長さを かえないでかくんだね。</span>
        `;
        controls.innerHTML = `
          <button class="btn-action" id="btn-step" onclick="progressMode2()">📏 ① 半径の長さに開く</button>
          <button class="btn-reset" onclick="setMode(2)">🔄 やりなおす</button>
        `;
      } else if (mode === 3) {
        document.getElementById('stage').classList.add('grid-bg');
        story.innerHTML = `コンパスを使って、もようをかきましょう。<br>かく前に、<span class="keyword">中心の場所</span> と <span class="keyword">半径の長さ</span> を調べるのがポイントだよ！`;
        topic.innerHTML = `🗣️ はりをさす場所（中心）は、どこになっているかな？`;
        tip.innerHTML = `
          💡 <strong>ポイント：</strong><br>
          もようの中に かくれている「円」を見つけよう！<br>
          マス目をかぞえて、円の中心（はりをさす場所）と、半径（何マス分開くか）をたしかめてから コンパスを回そう。
        `;
        controls.innerHTML = `
          <button class="btn-action" style="background:#4dabf7;" onclick="drawPattern1()">もよう① をかく</button>
          <button class="btn-action" style="background:#20c997;" onclick="drawPattern2()">もよう② をかく</button>
          <button class="btn-reset" onclick="setMode(3)">🔄 クリア</button>
        `;
      }
    }
    // --- Mode 1: コンパスのパーツ ---
    function drawCompassBase() {
      const svg = document.getElementById('draw-layer');
      // コンパスの簡略イラスト
      svg.innerHTML = `
        <!-- はり側 (左) -->
        <line x1="200" y1="100" x2="150" y2="280" stroke="#495057" stroke-width="8" stroke-linecap="round"/>
        <line x1="150" y1="280" x2="145" y2="310" stroke="#adb5bd" stroke-width="4" stroke-linecap="round"/>
        
        <!-- えんぴつ側 (右) -->
        <line x1="200" y1="100" x2="250" y2="280" stroke="#ff8787" stroke-width="12" stroke-linecap="round"/>
        <polygon points="244,280 256,280 250,310" fill="#343a40"/>
        
        <!-- つまみとねじ -->
        <rect x="190" y="50" width="20" height="40" fill="#343a40" rx="4"/>
        <circle cx="200" cy="100" r="12" fill="#495057"/>
        <circle cx="200" cy="100" r="5" fill="#f8f9fa"/>
        
        <!-- ツールチップ表示用のグループ -->
        <g id="tooltip-group"></g>
      `;
    }

    function showPart(part) {
      const tg = document.getElementById('tooltip-group');
      const msg = document.getElementById('result-message');
      tg.innerHTML = '';
      let x, y, text, detail;
      if (part === 'hari') {
        x = 100;
        y = 300;
        text = "📍 はり";
        detail = "ずれないように、はりのほうに 力を入れよう！";
      } else if (part === 'enpitsu') {
        x = 270;
        y = 300;
        text = "✏️ えんぴつ（しん）";
        detail = "えんぴつと同じように、先がとがっているか かくにんしよう。";
      } else if (part === 'tsumami') {
        x = 220;
        y = 60;
        text = "👆 つまみ";
        detail = "回すときは、ここを つまんで一気に回そう！";
      } else if (part === 'neji') {
        x = 230;
        y = 100;
        text = "🔩 ねじ";
        detail = "幅がかわってしまうときは、ねじを しめ直そう。";
      }
      tg.innerHTML = `
        <line x1="${x < 200 ? x+40 : x-10}" y1="${y}" x2="${part==='tsumami'?200 : (part==='neji'?200 : (part==='hari'?145:250))}" y2="${part==='tsumami'?70 : (part==='neji'?100 : 300)}" stroke="#fcc419" stroke-width="3" stroke-dasharray="4"/>
        <rect x="${x-10}" y="${y-20}" width="120" height="30" class="tooltip-bg"/>
        <text x="${x}" y="${y}" class="tooltip-text">${text}</text>
      `;
      msg.innerHTML = detail;
      msg.className = "result-message show";
    }
    // --- Mode 2: 円のかき方アニメーション ---
    function progressMode2() {
      const svg = document.getElementById('draw-layer');
      const btn = document.getElementById('btn-step');
      const msg = document.getElementById('result-message');
      if (stepCount === 0) {
        // Step 1: 半径を開く（ものさしと線を表示）
        svg.innerHTML = `
          <rect x="100" y="220" width="200" height="30" fill="#ffe8cc" stroke="#ff922b" stroke-width="2"/>
          <text x="110" y="240" font-size="14" font-weight="bold" fill="#d9480f">0</text>
          <text x="280" y="240" font-size="14" font-weight="bold" fill="#d9480f">5cm</text>
          <line x1="115" y1="210" x2="285" y2="210" stroke="#4dabf7" stroke-width="4" stroke-dasharray="8" class="draw-anim"/>
          <text x="170" y="195" font-size="16" font-weight="bold" fill="#4dabf7" style="animation: fadeIn 1s 1s forwards; opacity:0;">半径 5cm</text>
        `;
        msg.innerHTML = `コンパスの はりと えんぴつの先を、<span class="keyword">半径の長さ(5cm)</span> に開きます。`;
        msg.classList.add('show');
        btn.innerHTML = "📍 ② はりを 中心にさす";
        btn.style.background = "#e03131";
        stepCount++;
      } else if (stepCount === 1) {
        // Step 2: 中心にピンを刺す
        svg.innerHTML = `
          <circle cx="200" cy="200" r="4" fill="#e03131" style="animation: fadeIn 0.5s;"/>
          <text x="210" y="205" font-size="16" font-weight="bold" fill="#e03131" style="animation: fadeIn 0.5s;">中心</text>
          <line x1="200" y1="200" x2="300" y2="200" stroke="#4dabf7" stroke-width="3" stroke-dasharray="5"/>
          <text x="230" y="190" font-size="14" font-weight="bold" fill="#4dabf7">半径 5cm</text>
        `;
        msg.innerHTML = `かく場所を決めて、<span class="keyword">中心</span> に はりをさします。<br>（ずれないように はりの方に力を入れよう）`;
        btn.innerHTML = "🔄 ③ つまみを持って 一気に回す";
        btn.style.background = "#20c997";
        stepCount++;
      } else if (stepCount === 2) {
        // Step 3: 円をかく
        svg.innerHTML += `
          <circle cx="200" cy="200" r="100" fill="none" stroke="#343a40" stroke-width="3" class="draw-circle-anim" transform="rotate(-90 200 200)"/>
        `;
        msg.innerHTML = `手首をひねって、とちゅうで止めないで <span class="keyword">一気に</span> コンパスを回します。<br>きれいな円がかけたね！`;
        btn.disabled = true;
        btn.innerHTML = "✨ 完成！";
        btn.style.background = "#adb5bd";
      }
    }
    // --- Mode 3: もようづくり（適応問題） ---
    function drawPattern1() {
      const svg = document.getElementById('draw-layer');
      const msg = document.getElementById('result-message');
      // 3つの円が重なる模様。グリッドの交点を中心とする。
      // 半径を60 (3マス分) に設定。
      const c1 = {
        x: 140,
        y: 160
      };
      const c2 = {
        x: 260,
        y: 160
      };
      const c3 = {
        x: 200,
        y: 260
      };
      const r = 60;
      svg.innerHTML = `
        <!-- 中心点のヒント -->
        <circle cx="${c1.x}" cy="${c1.y}" r="6" fill="#e03131" style="animation: fadeIn 0.5s;"/>
        <circle cx="${c2.x}" cy="${c2.y}" r="6" fill="#e03131" style="animation: fadeIn 0.5s 0.2s backwards;"/>
        <circle cx="${c3.x}" cy="${c3.y}" r="6" fill="#e03131" style="animation: fadeIn 0.5s 0.4s backwards;"/>
        
        <!-- 円の描画 -->
        <circle cx="${c1.x}" cy="${c1.y}" r="${r}" fill="none" stroke="#343a40" stroke-width="3" class="draw-circle-anim" style="animation-delay: 1s;"/>
        <circle cx="${c2.x}" cy="${c2.y}" r="${r}" fill="none" stroke="#343a40" stroke-width="3" class="draw-circle-anim" style="animation-delay: 2.5s;"/>
        <circle cx="${c3.x}" cy="${c3.y}" r="${r}" fill="none" stroke="#343a40" stroke-width="3" class="draw-circle-anim" style="animation-delay: 4s;"/>
      `;
      msg.innerHTML = `中心が <span class="keyword">３つ</span> あるね！<br>半径は、３つとも同じ長さ（３マス分）になっているよ。`;
      msg.classList.add('show');
    }

    function drawPattern2() {
      const svg = document.getElementById('draw-layer');
      const msg = document.getElementById('result-message');
      // 枠線と、四隅を中心とした円弧
      const squareSize = 160;
      const startX = 120;
      const startY = 120;
      const r = squareSize / 2; // 80
      svg.innerHTML = `
        <!-- 四角形の枠 -->
        <rect x="${startX}" y="${startY}" width="${squareSize}" height="${squareSize}" fill="none" stroke="#4dabf7" stroke-width="2" style="animation: fadeIn 0.5s;"/>
        
        <!-- 中心点のヒント (四隅) -->
        <circle cx="${startX}" cy="${startY}" r="6" fill="#e03131" style="animation: fadeIn 0.5s 0.5s backwards;"/>
        <circle cx="${startX + squareSize}" cy="${startY}" r="6" fill="#e03131" style="animation: fadeIn 0.5s 0.7s backwards;"/>
        <circle cx="${startX}" cy="${startY + squareSize}" r="6" fill="#e03131" style="animation: fadeIn 0.5s 0.9s backwards;"/>
        <circle cx="${startX + squareSize}" cy="${startY + squareSize}" r="6" fill="#e03131" style="animation: fadeIn 0.5s 1.1s backwards;"/>

        <!-- 4つの円弧 (SVGパスで描画) -->
        <!-- 左上中心 -->
        <path d="M ${startX+r} ${startY} A ${r} ${r} 0 0 1 ${startX} ${startY+r}" fill="none" stroke="#343a40" stroke-width="3" class="draw-circle-anim" style="animation-delay: 1.5s;"/>
        <!-- 右上中心 -->
        <path d="M ${startX+squareSize} ${startY+r} A ${r} ${r} 0 0 1 ${startX+r} ${startY}" fill="none" stroke="#343a40" stroke-width="3" class="draw-circle-anim" style="animation-delay: 3s;"/>
        <!-- 左下中心 -->
        <path d="M ${startX} ${startY+r} A ${r} ${r} 0 0 1 ${startX+r} ${startY+squareSize}" fill="none" stroke="#343a40" stroke-width="3" class="draw-circle-anim" style="animation-delay: 4.5s;"/>
        <!-- 右下中心 -->
        <path d="M ${startX+r} ${startY+squareSize} A ${r} ${r} 0 0 1 ${startX+squareSize} ${startY+r}" fill="none" stroke="#343a40" stroke-width="3" class="draw-circle-anim" style="animation-delay: 6s;"/>
      `;
      msg.innerHTML = `正方形の <span class="keyword">四すみ</span> に はりをさしているよ！<br>円の一部（４分の１）を４つかいて、もようを作っているんだね。`;
      msg.classList.add('show');
    }
    // --- 練習問題判定 ---
    function checkPrac(num, correctVal) {
      const sel = document.getElementById(`prac${num}-sel`).value;
      const mark = document.getElementById(`prac${num}-mark`);
      if (sel === "") {
        mark.innerText = "";
        return;
      }
      if (sel === correctVal) {
        mark.innerText = "〇";
        mark.style.color = "#40c057";
      } else {
        mark.innerText = "✕";
        mark.style.color = "#fa5252";
      }
    }
  </script>

<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>３年　まるい形を調べよう　５時間目</title>
    <meta name="viewport" content="width=device-width"><link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">


  </head>
    
  <body>
  <!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>円と球 (第5時) 長さのくらべ方 ツールボックス</title>
  <style>
    :root {
      --color-a: #ff6b6b;
      /* 赤系（アの道） */
      --color-b: #339af0;
      /* 青系（イの道） */
      --color-c: #e03131;
      --success: #40c057;
      --warning: #fcc419;
      --danger: #fa5252;
      --bg: #f4f6f8;
      --border: #ced4da;
      --theme: #20c997;
      --theme-light: #e6fcf5;
      --text-main: #343a40;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      color: var(--text-main);
    }

    .app-container {
      background: white;
      max-width: 900px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    /* Header */
    header {
      background: var(--theme-light);
      padding: 15px;
      text-align: center;
      border-bottom: 3px solid var(--theme);
    }

    .sub-title {
      font-size: 0.9rem;
      color: #087f5b;
      font-weight: bold;
      margin: 0;
      background: #96f2d7;
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0 0 10px;
      color: #087f5b;
      font-size: 1.6rem;
    }

    .notebook-prompt {
      display: inline-block;
      background: white;
      border: 2px solid #38d9a9;
      color: #087f5b;
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: bold;
    }

    /* Tabs & Story */
    .mission-bar {
      background: #f8f9fa;
      padding: 15px;
      border-bottom: 1px solid var(--border);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 8px 15px;
      background: white;
      border: 2px solid #adb5bd;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      color: #495057;
      font-size: 1rem;
      transition: 0.2s;
    }

    .tab-btn:hover {
      background: #e9ecef;
    }

    .tab-btn.active {
      border-color: var(--theme);
      background: var(--theme);
      color: white;
    }

    .story-problem {
      background: white;
      border: 2px solid var(--theme);
      border-left: 8px solid var(--theme);
      padding: 15px;
      font-size: 1.2rem;
      line-height: 1.6;
      font-weight: bold;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .keyword {
      background: #fff3cd;
      border: 2px solid #ffeeba;
      color: #d9480f;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: bold;
      display: inline-block;
    }

    /* Controls */
    .global-controls {
      display: flex;
      gap: 15px;
      padding: 15px 20px;
      background: white;
      border-bottom: 3px dashed var(--border);
      justify-content: center;
      align-items: center;
      min-height: 80px;
      flex-wrap: wrap;
    }

    .btn-action {
      background: var(--color-a);
      color: white;
      font-size: 1.1rem;
      padding: 12px 25px;
      border-radius: 30px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-action:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }

    .btn-action:disabled {
      background: #adb5bd;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .btn-reset {
      background: white;
      border: 2px solid var(--border);
      color: #495057;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Visual Sandbox */
    .visual-container {
      padding: 20px;
      background: white;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 400px;
    }

    .stage-wrapper {
      width: 100%;
      max-width: 500px;
      aspect-ratio: 4 / 3;
      background: #ebfbee;
      /* 少し緑がかった地図風の背景 */
      border: 2px solid #e9ecef;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.05);
    }

    .grid-bg {
      background-size: 20px 20px;
      background-image:
        linear-gradient(to right, #e9ecef 1px, transparent 1px),
        linear-gradient(to bottom, #e9ecef 1px, transparent 1px);
      background-color: #fffdf0;
    }

    svg.draw-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Message */
    .result-message {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--danger);
      background: #ffe3e3;
      padding: 10px 20px;
      border-radius: 30px;
      border: 2px dashed #ffa8a8;
      text-align: center;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .result-message.show {
      opacity: 1;
    }

    /* 話し合いボード */
    .discussion-area {
      background: #f8f9fa;
      padding: 20px;
      border-top: 3px dashed var(--border);
    }

    .discussion-topic {
      background: #e6fcf5;
      border: 2px solid #20c997;
      border-left: 8px solid #20c997;
      color: #087f5b;
      padding: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 6px;
      margin-bottom: 0;
    }

    .textbook-tip {
      font-size: 1.05rem;
      background: white;
      padding: 15px;
      border-radius: 6px;
      margin-top: 15px;
      border: 2px solid #ffc078;
      color: #495057;
      line-height: 1.8;
    }

    /* Support Tool */
    .notebook-guide {
      background: #fff9db;
      padding: 20px;
      border-top: 3px dashed #fcc419;
    }

    .guide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .guide-header h3 {
      margin: 0;
      color: #d4a017;
    }

    .btn-support {
      background: #fff;
      border: 2px dashed #f59f00;
      color: #d9480f;
      padding: 8px 15px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .template-box {
      background: #fdfaf0;
      border: 2px solid #fcc419;
      border-radius: 8px;
      padding: 20px;
      font-size: 1.15rem;
      line-height: 2.2;
      color: #343a40;
      margin-top: 15px;
    }

    .sel-box {
      font-size: 1.1rem;
      padding: 5px;
      margin: 0 5px;
      border: 2px solid #ced4da;
      border-radius: 6px;
      background: #fff;
      font-weight: bold;
      color: #495057;
      cursor: pointer;
    }

    /* Presentation Board */
    .btn-presentation {
      background: #e67700;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      float: right;
      box-shadow: 0 2px 4px rgba(230, 119, 0, 0.3);
    }

    .presentation-board {
      background: #fff;
      border: 4px solid #e67700;
      border-radius: 12px;
      padding: 25px;
      margin: 0 20px 20px 20px;
      position: relative;
      animation: fadeIn 0.4s;
    }

    .presentation-board-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 2px dashed #ffd8a8;
      padding-bottom: 10px;
    }

    .presentation-board-header h3 {
      margin: 0;
      color: #e67700;
      font-size: 1.3rem;
    }

    .btn-close-board {
      background: #fff4e6;
      border: 2px solid #ffc078;
      color: #d9480f;
      padding: 5px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .presentation-text {
      font-size: 1.4rem;
      line-height: 1.8;
      color: #343a40;
      font-weight: bold;
    }

    .presentation-text span {
      color: #d9480f;
      border-bottom: 4px solid #fcc419;
      padding: 0 5px;
    }

    /* Practice Section */
    .free-progress-section {
      background: #e3fafc;
      padding: 20px;
      border-top: 5px solid #15aabf;
      border-radius: 0 0 12px 12px;
    }

    .fp-header h2 {
      color: #0b7285;
      margin-top: 0;
      font-size: 1.3rem;
      text-align: center;
    }

    .practice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
    }

    .practice-card {
      background: white;
      border: 2px solid #99e9f2;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .pc-title {
      font-weight: bold;
      color: #0b7285;
      margin-bottom: 10px;
      font-size: 1.1rem;
      border-bottom: 1px dashed #99e9f2;
      padding-bottom: 5px;
    }

    .pc-content {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .pc-select,
    .pc-input {
      height: 40px;
      font-size: 1.1rem;
      font-weight: bold;
      border: 2px solid #ced4da;
      border-radius: 6px;
      padding: 0 5px;
    }

    .pc-mark {
      font-size: 1.8rem;
      font-weight: bold;
      width: 30px;
      text-align: center;
      margin-left: auto;
    }

    .hidden {
      display: none !important;
    }

    /* Animations */
    .draw-anim {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawLine 1.5s forwards ease-in-out;
    }

    .fade-anim {
      opacity: 0;
      animation: fadeIn 0.8s forwards;
    }

    @keyframes drawLine {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div class="app-container">
    <header>
      <div class="sub-title">円と球 (第5時)</div>
      <h1>長さを くらべる方法（コンパス）</h1>
      <div class="notebook-prompt">
        ✏️ ものさしで はかれないときは、コンパスのひみつを使ってみよう！
      </div>
    </header>

    <div class="mission-bar">
      <div class="tabs">
        <button class="tab-btn active" onclick="setMode(1)">① どっちが近い？</button>
        <button class="tab-btn" onclick="setMode(2)">② 長さをうつしとる</button>
        <button class="tab-btn" onclick="setMode(3)">③ 【適応】３つの直線</button>
      </div>
      <div class="story-problem" id="story-text">
        <!-- JSで挿入 -->
      </div>
    </div>

    <div class="global-controls" id="controls-area">
      <!-- JSで挿入 -->
    </div>

    <main class="visual-sandbox">
      <div class="visual-container">
        <div class="stage-wrapper" id="stage">
          <svg class="draw-layer" id="draw-layer"></svg>
        </div>
        <div class="result-message" id="result-message">
          <!-- JSで結果を表示 -->
        </div>
      </div>

      <!-- はっぴょうボード -->
      <div id="presentation-board" class="presentation-board hidden">
        <div class="presentation-board-header">
          <h3>📢 わたしの考え（図をつかって説明しよう）</h3>
          <button class="btn-close-board" onclick="closePresentation()">✖ 閉じる</button>
        </div>
        <div class="presentation-text" id="presentation-text"></div>
      </div>

      <!-- 話し合いボード -->
      <div class="discussion-area">
        <div class="discussion-topic" id="discussion-topic"></div>
        <div class="textbook-tip" id="textbook-tip"></div>
      </div>

      <!-- サポートツール -->
      <div class="notebook-guide">
        <div class="guide-header">
          <h3>📓 ノートに 自分の言葉で まとめよう</h3>
          <button class="btn btn-support" onclick="toggleSupportTool()">🆘 言葉のヒント（せつめいメーカー）</button>
        </div>
        <div id="support-tool" class="template-box hidden">
          <button class="btn-presentation" onclick="showPresentation()">📢 発表ボードへ</button>
          <div id="template-content"></div>
        </div>
      </div>
    </main>

    <!-- 練習問題 -->
    <div class="free-progress-section">
      <div class="fp-header">
        <h2>🌟 まとめと練習問題</h2>
      </div>
      <div class="practice-grid">
        <div class="practice-card">
          <div class="pc-title">① コンパスを使うと、長さを どうすることができますか。</div>
          <div class="pc-content">
            <select class="pc-select" id="prac1-sel" onchange="checkPrac(1, 'utsushitoru')">
              <option value="">えらぶ</option>
              <option value="kieru">けすことができる</option>
              <option value="utsushitoru">うつしとれる</option>
              <option value="magaru">まげられる</option>
            </select>
            <span class="pc-mark" id="prac1-mark"></span>
          </div>
        </div>

        <div class="practice-card">
          <div class="pc-title">② 長さをうつしとる機能を使うと、何がなくても 長さがくらべられますか。</div>
          <div class="pc-content">
            <select class="pc-select" id="prac2-sel" onchange="checkPrac(2, 'monosashi')">
              <option value="">えらぶ</option>
              <option value="monosashi">ものさし</option>
              <option value="enpitsu">えんぴつ</option>
              <option value="keshigomu">けしゴム</option>
            </select>
            <span class="pc-mark" id="prac2-mark"></span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    let currentMode = 1;
    let stepCount = 0;
    // 地図の座標設定 (100% = 500px, 400px)
    const H_X = 50,
      H_Y = 320; // 家
    const PO_X = 350,
      PO_Y = 120; // 郵便局
    const PB_X = 450,
      PB_Y = 320; // ポスト
    const M_X = 180,
      M_Y = 180; // 曲がり角
    // 線分の長さ (計算用)
    const lenA1 = Math.sqrt(Math.pow(M_X - H_X, 2) + Math.pow(M_Y - H_Y, 2)); // 約191
    const lenA2 = Math.sqrt(Math.pow(PO_X - M_X, 2) + Math.pow(PO_Y - M_Y, 2)); // 約180
    const totalA = lenA1 + lenA2; // 約371
    const totalB = PB_X - H_X; // 400
    document.addEventListener('DOMContentLoaded', () => {
      setMode(1);
    });

    function setMode(mode) {
      currentMode = mode;
      stepCount = 0;
      document.getElementById('result-message').classList.remove('show');
      const stage = document.getElementById('stage');
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        if (idx + 1 === mode) btn.classList.add('active');
        else btn.classList.remove('active');
      });
      const story = document.getElementById('story-text');
      const topic = document.getElementById('discussion-topic');
      const tip = document.getElementById('textbook-tip');
      const controls = document.getElementById('controls-area');
      const svg = document.getElementById('draw-layer');
      svg.innerHTML = '';
      if (mode === 1) {
        stage.className = 'stage-wrapper';
        story.innerHTML = `だいきさんは、手紙を出しに行こうとしています。<br>家から <span style="color:var(--color-a);">ゆうびん局（㋐）</span> までと、<span style="color:var(--color-b);">ゆうびんポスト（㋑）</span> まででは、どちらが近いでしょうか。`;
        topic.innerHTML = `🗣️ 「㋐の道」は曲がっているから、ものさしで はかるのは たいへんだな。どうすればいい？`;
        tip.innerHTML = `
          ・㋑の道は、一直線だから 近そうに見えるね。<br>
          ・㋐の道は、曲がっているけれど、それぞれの道が短いから 近いかもしれないよ。<br>
          ・ものさしを使わずに くらべる方法はないかな？
        `;
        controls.innerHTML = `
          <button class="btn-action" style="background:#845ef7;" onclick="setMode(2)">💡 コンパスを使ってみよう！</button>
        `;
        drawMap(true);
      } else if (mode === 2) {
        stage.className = 'stage-wrapper';
        story.innerHTML = `コンパスを使って、<span style="color:var(--color-a);">㋐の長さ</span> を <span style="color:var(--color-b);">㋑の道</span> にうつしとり、長さをくらべましょう。`;
        topic.innerHTML = `🗣️ コンパスを使うと、どんなことが わかるかな？`;
        tip.innerHTML = `
          💡 <strong>まとめ：</strong><br>
          <span class="keyword">コンパスを使うと、長さをうつしとれる。</span><br>
          このことを使えば、ものさしではからなくても、長さをくらべられるよ。
        `;
        controls.innerHTML = `
          <button class="btn-action" id="btn-step" onclick="progressMode2()" style="background:var(--color-a);">📏 ㋐の１つ目の長さをとる</button>
          <button class="btn-reset" onclick="setMode(2)">🔄 やりなおす</button>
        `;
        drawMap(false);
      } else if (mode === 3) {
        stage.className = 'stage-wrapper grid-bg';
        story.innerHTML = `下の ウ、エ、オ の直線の長さをコンパスでくらべ、<span class="keyword">長いじゅん</span> にいいましょう。`;
        topic.innerHTML = `🗣️ まっすぐな線に コンパスで長さをうつしとって、くらべてみよう。`;
        tip.innerHTML = `
          💡 <strong>ヒント：</strong><br>
          それぞれの直線の長さをコンパスでとって、下の黒い線（スタート地点が同じ）に しるしをつけてみよう。
        `;
        controls.innerHTML = `
          <button class="btn-action" style="background:#845ef7;" id="btn-m3-u" onclick="measureLine3('u')">ウ をうつす</button>
          <button class="btn-action" style="background:#20c997;" id="btn-m3-e" onclick="measureLine3('e')">エ をうつす</button>
          <button class="btn-action" style="background:#ff922b;" id="btn-m3-o" onclick="measureLine3('o')">オ をうつす</button>
          <button class="btn-reset" onclick="setMode(3)">🔄 クリア</button>
        `;
        drawPracticeLines();
      }
      closePresentation();
      document.getElementById('support-tool').classList.add('hidden');
      buildTemplate();
    }
    // --- Mode 1 & 2: 地図の描画 ---
    function drawMap(showLabels) {
      const svg = document.getElementById('draw-layer');
      let html = `
        <!-- 建物 -->
        <rect x="${H_X-20}" y="${H_Y-20}" width="40" height="40" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
        <text x="${H_X-20}" y="${H_Y-30}" font-size="14" font-weight="bold">家</text>

        <rect x="${PO_X-30}" y="${PO_Y-20}" width="60" height="40" fill="#d8f5a2" stroke="#66a80f" stroke-width="2"/>
        <text x="${PO_X-10}" y="${PO_Y+5}" font-size="20">〒</text>
        <text x="${PO_X-30}" y="${PO_Y-30}" font-size="14" font-weight="bold">ゆうびん局</text>

        <rect x="${PB_X-15}" y="${PB_Y-20}" width="30" height="40" fill="#e03131" rx="4"/>
        <line x1="${PB_X-10}" y1="${PB_Y-10}" x2="${PB_X+10}" y2="${PB_Y-10}" stroke="white" stroke-width="3"/>
        <text x="${PB_X-15}" y="${PB_Y-30}" font-size="14" font-weight="bold">ポスト</text>

        <!-- 道のベース（白線） -->
        <polyline points="${H_X},${H_Y} ${M_X},${M_Y} ${PO_X},${PO_Y}" fill="none" stroke="white" stroke-width="12"/>
        <line x1="${H_X}" y1="${H_Y}" x2="${PB_X}" y2="${PB_Y}" stroke="white" stroke-width="12"/>

        <!-- ㋐の道 (赤) -->
        <polyline points="${H_X},${H_Y} ${M_X},${M_Y} ${PO_X},${PO_Y}" fill="none" stroke="var(--color-a)" stroke-width="4"/>
        
        <!-- ㋑の道 (青) -->
        <line x1="${H_X}" y1="${H_Y}" x2="${PB_X}" y2="${PB_Y}" stroke="var(--color-b)" stroke-width="4" id="path-i"/>
      `;
      if (showLabels) {
        html += `
          <circle cx="${M_X - 20}" cy="${M_Y + 50}" r="12" fill="white" stroke="var(--color-a)" stroke-width="2"/>
          <text x="${M_X - 27}" y="${M_Y + 55}" font-size="14" font-weight="bold" fill="var(--color-a)">㋐</text>
          
          <circle cx="${M_X}" cy="${H_Y + 20}" r="12" fill="white" stroke="var(--color-b)" stroke-width="2"/>
          <text x="${M_X - 7}" y="${H_Y + 25}" font-size="14" font-weight="bold" fill="var(--color-b)">㋑</text>
        `;
      }
      svg.innerHTML = html;
    }
    // --- Mode 2: コンパスでのうつしとりアニメーション ---
    function progressMode2() {
      const svg = document.getElementById('draw-layer');
      const btn = document.getElementById('btn-step');
      const msg = document.getElementById('result-message');
      if (stepCount === 0) {
        // Step 1: ㋐の1つ目をうつす
        svg.innerHTML += `
          <path d="M ${H_X+lenA1} ${H_Y-15} A ${lenA1} ${lenA1} 0 0 1 ${H_X+lenA1} ${H_Y+15}" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="4" class="fade-anim"/>
          <circle cx="${H_X+lenA1}" cy="${H_Y}" r="4" fill="#e03131" class="fade-anim"/>
        `;
        msg.innerHTML = `㋐の１つ目の長さを、㋑の線に しるしをつけたよ！`;
        msg.classList.add('show');
        btn.innerHTML = "📏 ㋐の２つ目の長さをとる";
        stepCount++;
      } else if (stepCount === 1) {
        // Step 2: ㋐の2つ目をうつす（1つ目の続きから）
        const newX = H_X + lenA1 + lenA2;
        svg.innerHTML += `
          <line x1="${H_X+lenA1}" y1="${H_Y}" x2="${newX}" y2="${H_Y}" stroke="#e03131" stroke-width="8" stroke-linecap="round" class="draw-anim" style="opacity:0.6;"/>
          <path d="M ${newX} ${H_Y-15} A ${lenA2} ${lenA2} 0 0 1 ${newX} ${H_Y+15}" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="4" class="fade-anim" style="animation-delay: 1.5s;"/>
          <text x="${newX - 40}" y="${H_Y - 10}" font-size="14" font-weight="bold" fill="#e03131" class="fade-anim" style="animation-delay: 1.8s;">㋐の合計</text>
        `;
        setTimeout(() => {
          msg.innerHTML = `㋐の長さをうつしとると、㋑のほうが少し あまるね。<br>だから、<span class="keyword">ゆうびん局（㋐）</span> のほうが近い！`;
        }, 1800);
        btn.disabled = true;
        btn.innerHTML = "✨ くらべられました";
        btn.style.background = "#adb5bd";
      }
    }
    // --- Mode 3: 3つの直線の比較 ---
    const linesM3 = {
      u: {
        id: 'u',
        name: 'ウ',
        color: '#845ef7',
        len: 120,
        btnId: 'btn-m3-u'
      },
      e: {
        id: 'e',
        name: 'エ',
        color: '#20c997',
        len: 180,
        btnId: 'btn-m3-e'
      },
      o: {
        id: 'o',
        name: 'オ',
        color: '#ff922b',
        len: 150,
        btnId: 'btn-m3-o'
      }
    };
    let m3Count = 0;

    function drawPracticeLines() {
      const svg = document.getElementById('draw-layer');
      m3Count = 0;
      // ウ (縦線)
      let html = `
        <line x1="200" y1="50" x2="200" y2="170" stroke="#495057" stroke-width="4"/>
        <text x="180" y="60" font-size="16" font-weight="bold">ウ</text>
      `;
      // エ (横線)
      html += `
        <line x1="220" y1="190" x2="400" y2="190" stroke="#495057" stroke-width="4"/>
        <text x="220" y="180" font-size="16" font-weight="bold">エ</text>
      `;
      // オ (ななめ線)
      html += `
        <line x1="250" y1="60" x2="356" y2="166" stroke="#495057" stroke-width="4"/>
        <text x="260" y="55" font-size="16" font-weight="bold">オ</text>
      `;
      // 基準線（下）
      html += `
        <line x1="80" y1="280" x2="450" y2="280" stroke="#343a40" stroke-width="2"/>
        <line x1="80" y1="270" x2="80" y2="290" stroke="#343a40" stroke-width="3"/>
        <text x="60" y="310" font-size="14" font-weight="bold">スタート</text>
      `;
      svg.innerHTML = html;
    }

    function measureLine3(key) {
      const d = linesM3[key];
      const btn = document.getElementById(d.btnId);
      const svg = document.getElementById('draw-layer');
      const msg = document.getElementById('result-message');
      if (btn.disabled) return;
      // コンパスでうつしとるアニメーション（基準線上に弧とラベルを描画）
      const endX = 80 + d.len;
      svg.innerHTML += `
        <!-- 長さを示すバー -->
        <line x1="80" y1="270" x2="${endX}" y2="270" stroke="${d.color}" stroke-width="6" class="draw-anim" style="opacity: 0.7;"/>
        <!-- コンパスのしるし -->
        <path d="M ${endX} 265 A ${d.len} ${d.len} 0 0 1 ${endX} 295" fill="none" stroke="${d.color}" stroke-width="3" class="fade-anim" style="animation-delay: 1.5s;"/>
        <!-- 文字ラベル -->
        <text x="${endX - 10}" y="310" font-size="16" font-weight="bold" fill="${d.color}" class="fade-anim" style="animation-delay: 1.5s;">${d.name}</text>
      `;
      btn.disabled = true;
      btn.style.opacity = "0.5";
      m3Count++;
      if (m3Count === 3) {
        setTimeout(() => {
          msg.innerHTML = `ぜんぶ うつしとれたね！<br>長いじゅんに ならべると <span class="keyword">エ、オ、ウ</span> になるよ。`;
          msg.classList.add('show');
        }, 1800);
      }
    }
    // --- せつめいメーカー ---
    function toggleSupportTool() {
      document.getElementById('support-tool').classList.toggle('hidden');
    }

    function buildTemplate() {
      const box = document.getElementById('template-content');
      if (currentMode === 1 || currentMode === 2) {
        box.innerHTML = `
          曲がっている ㋐の道を、コンパスを使って ㋑の直線に「<select id="sel-1" class="sel-box"></select>」と、<br>
          ㋑の道が 少しあまります。<br>
          「<select id="sel-2" class="sel-box"></select>」のほうが短いので、「<select id="sel-3" class="sel-box"></select>」までのほうが 近いです。<br>
          コンパスを使うと、ものさしがなくても 長さを「<select id="sel-4" class="sel-box"></select>」ことができます。
        `;
        populateSelect('sel-1', shuffleArray(['?', 'うつしとる', 'はかる', 'けす']));
        populateSelect('sel-2', shuffleArray(['?', '㋐', '㋑']));
        populateSelect('sel-3', shuffleArray(['?', 'ゆうびん局', 'ポスト', '家']));
        populateSelect('sel-4', shuffleArray(['?', 'くらべる', '長くする', '計算する']));
      } else if (currentMode === 3) {
        box.innerHTML = `
          ３つの直線を コンパスで「<select id="sel-1" class="sel-box"></select>」と、<br>
          いちばん遠くに しるしがついたのは「<select id="sel-2" class="sel-box"></select>」でした。<br>
          だから、長いじゅんに ならべると、「<select id="sel-3" class="sel-box"></select>」になります。
        `;
        populateSelect('sel-1', shuffleArray(['?', 'うつしとる', 'はかる']));
        populateSelect('sel-2', shuffleArray(['?', 'エ', 'オ', 'ウ']));
        populateSelect('sel-3', shuffleArray(['?', 'エ、オ、ウ', 'ウ、オ、エ', 'エ、ウ、オ']));
      }
    }

    function populateSelect(elementId, values) {
      const select = document.getElementById(elementId);
      if (!select) return;
      select.innerHTML = '';
      const defaultOpt = document.createElement('option');
      defaultOpt.value = "?";
      defaultOpt.innerText = "❓";
      select.appendChild(defaultOpt);
      values.forEach(val => {
        if (val !== '?') {
          let opt = document.createElement('option');
          opt.value = val;
          opt.innerText = val;
          select.appendChild(opt);
        }
      });
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }
    // --- はっぴょうボード ---
    function showPresentation() {
      let textHTML = "";
      if (currentMode === 1 || currentMode === 2) {
        let v1 = document.getElementById('sel-1').value;
        let v2 = document.getElementById('sel-2').value;
        let v3 = document.getElementById('sel-3').value;
        let v4 = document.getElementById('sel-4').value;
        textHTML = `
          曲がっている ㋐の道を、コンパスを使って ㋑の直線に「<span>${v1}</span>」と、<br>
          ㋑の道が少しあまります。<br>
          「<span>${v2}</span>」のほうが短いので、「<span>${v3}</span>」までのほうが近いです。<br>
          コンパスを使うと、ものさしがなくても長さを「<span>${v4}</span>」ことができます。
        `;
      } else if (currentMode === 3) {
        let v1 = document.getElementById('sel-1').value;
        let v2 = document.getElementById('sel-2').value;
        let v3 = document.getElementById('sel-3').value;
        textHTML = `
          ３つの直線を コンパスで「<span>${v1}</span>」と、<br>
          いちばん遠くにしるしがついたのは「<span>${v2}</span>」でした。<br>
          だから、長いじゅんにならべると、「<span>${v3}</span>」になります。
        `;
      }
      document.getElementById('presentation-text').innerHTML = textHTML;
      const board = document.getElementById('presentation-board');
      board.classList.remove('hidden');
      board.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
      });
    }

    function closePresentation() {
      document.getElementById('presentation-board').classList.add('hidden');
    }
    // --- 練習問題判定 ---
    function checkPrac(num, correctVal) {
      const sel = document.getElementById(`prac${num}-sel`).value;
      const mark = document.getElementById(`prac${num}-mark`);
      if (sel === "") {
        mark.innerText = "";
        return;
      }
      if (sel === correctVal) {
        mark.innerText = "〇";
        mark.style.color = "#40c057";
      } else {
        mark.innerText = "✕";
        mark.style.color = "#fa5252";
      }
    }
  </script>
</body>

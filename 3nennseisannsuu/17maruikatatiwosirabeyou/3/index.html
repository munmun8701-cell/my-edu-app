<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>３年　まるい形を調べよう　３時間目</title>
    <meta name="viewport" content="width=device-width"><link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">


  </head>
    
  <body>
  <!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>円と球 (第3時) 円の中心と直径 ツールボックス</title>
  <style>
    :root {
      --color-a: #4dabf7;
      /* ブルー */
      --bg-a: #e7f5ff;
      --color-b: #ff922b;
      /* オレンジ */
      --bg-b: #fff4e6;
      --color-c: #e03131;
      /* レッド（直径など強調） */
      --success: #40c057;
      --warning: #fcc419;
      --danger: #fa5252;
      --bg: #f4f6f8;
      --border: #ced4da;
      --theme: #20c997;
      /* メインテーマ（緑系） */
      --theme-light: #e6fcf5;
      --text-main: #343a40;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      color: var(--text-main);
    }

    .app-container {
      background: white;
      max-width: 900px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    /* Header */
    header {
      background: var(--theme-light);
      padding: 15px;
      text-align: center;
      border-bottom: 3px solid var(--theme);
    }

    .sub-title {
      font-size: 0.9rem;
      color: #087f5b;
      font-weight: bold;
      margin: 0;
      background: #96f2d7;
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0 0 10px;
      color: #087f5b;
      font-size: 1.6rem;
    }

    .notebook-prompt {
      display: inline-block;
      background: white;
      border: 2px solid #38d9a9;
      color: #087f5b;
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: bold;
    }

    /* Tabs & Story */
    .mission-bar {
      background: #f8f9fa;
      padding: 15px;
      border-bottom: 1px solid var(--border);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 8px 15px;
      background: white;
      border: 2px solid #adb5bd;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      color: #495057;
      font-size: 1rem;
      transition: 0.2s;
    }

    .tab-btn:hover {
      background: #e9ecef;
    }

    .tab-btn.active {
      border-color: var(--theme);
      background: var(--theme);
      color: white;
    }

    .story-problem {
      background: white;
      border: 2px solid var(--theme);
      border-left: 8px solid var(--theme);
      padding: 15px;
      font-size: 1.2rem;
      line-height: 1.6;
      font-weight: bold;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .keyword {
      background: #fff3cd;
      border: 2px solid #ffeeba;
      color: #d9480f;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: bold;
      display: inline-block;
    }

    /* Controls */
    .global-controls {
      display: flex;
      gap: 15px;
      padding: 15px 20px;
      background: white;
      border-bottom: 3px dashed var(--border);
      justify-content: center;
      align-items: center;
      min-height: 80px;
    }

    .btn-action {
      background: var(--color-a);
      color: white;
      font-size: 1.1rem;
      padding: 12px 25px;
      border-radius: 30px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(77, 171, 247, 0.3);
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-action:hover {
      background: #339af0;
      transform: translateY(-2px);
    }

    .btn-action:disabled {
      background: #adb5bd;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .btn-reset {
      background: white;
      border: 2px solid var(--border);
      color: #495057;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      margin-left: 10px;
    }

    /* Visual Sandbox */
    .visual-container {
      padding: 20px;
      background: white;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 400px;
    }

    .stage-wrapper {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1 / 1;
      background: #fffdf0;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.05);
    }

    svg.draw-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Message */
    .result-message {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--danger);
      background: #ffe3e3;
      padding: 10px 20px;
      border-radius: 30px;
      border: 2px dashed #ffa8a8;
      text-align: center;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .result-message.show {
      opacity: 1;
    }

    /* 話し合いボード */
    .discussion-area {
      background: #f8f9fa;
      padding: 20px;
      border-top: 3px dashed var(--border);
    }

    .discussion-topic {
      background: #e6fcf5;
      border: 2px solid #20c997;
      border-left: 8px solid #20c997;
      color: #087f5b;
      padding: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 6px;
      margin-bottom: 0;
    }

    .textbook-tip {
      font-size: 1.05rem;
      background: white;
      padding: 15px;
      border-radius: 6px;
      margin-top: 15px;
      border: 2px solid #ffc078;
      color: #495057;
      line-height: 1.8;
    }

    /* Support Tool */
    .notebook-guide {
      background: #fff9db;
      padding: 20px;
      border-top: 3px dashed #fcc419;
    }

    .guide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .guide-header h3 {
      margin: 0;
      color: #d4a017;
    }

    .btn-support {
      background: #fff;
      border: 2px dashed #f59f00;
      color: #d9480f;
      padding: 8px 15px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .template-box {
      background: #fdfaf0;
      border: 2px solid #fcc419;
      border-radius: 8px;
      padding: 20px;
      font-size: 1.15rem;
      line-height: 2.2;
      color: #343a40;
      margin-top: 15px;
    }

    .sel-box {
      font-size: 1.1rem;
      padding: 5px;
      margin: 0 5px;
      border: 2px solid #ced4da;
      border-radius: 6px;
      background: #fff;
      font-weight: bold;
      color: #495057;
      cursor: pointer;
    }

    /* Presentation Board */
    .btn-presentation {
      background: #e67700;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      float: right;
      box-shadow: 0 2px 4px rgba(230, 119, 0, 0.3);
    }

    .presentation-board {
      background: #fff;
      border: 4px solid #e67700;
      border-radius: 12px;
      padding: 25px;
      margin: 0 20px 20px 20px;
      position: relative;
      animation: fadeIn 0.4s;
    }

    .presentation-board-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 2px dashed #ffd8a8;
      padding-bottom: 10px;
    }

    .presentation-board-header h3 {
      margin: 0;
      color: #e67700;
      font-size: 1.3rem;
    }

    .btn-close-board {
      background: #fff4e6;
      border: 2px solid #ffc078;
      color: #d9480f;
      padding: 5px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .presentation-text {
      font-size: 1.4rem;
      line-height: 1.8;
      color: #343a40;
      font-weight: bold;
    }

    .presentation-text span {
      color: #d9480f;
      border-bottom: 4px solid #fcc419;
      padding: 0 5px;
    }

    /* Practice Section */
    .free-progress-section {
      background: #e3fafc;
      padding: 20px;
      border-top: 5px solid #15aabf;
      border-radius: 0 0 12px 12px;
    }

    .fp-header h2 {
      color: #0b7285;
      margin-top: 0;
      font-size: 1.3rem;
      text-align: center;
    }

    .practice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
    }

    .practice-card {
      background: white;
      border: 2px solid #99e9f2;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .pc-title {
      font-weight: bold;
      color: #0b7285;
      margin-bottom: 10px;
      font-size: 1.1rem;
      border-bottom: 1px dashed #99e9f2;
      padding-bottom: 5px;
    }

    .pc-content {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .pc-select,
    .pc-input {
      height: 40px;
      font-size: 1.1rem;
      font-weight: bold;
      border: 2px solid #ced4da;
      border-radius: 6px;
      padding: 0 5px;
    }

    .pc-mark {
      font-size: 1.8rem;
      font-weight: bold;
      width: 30px;
      text-align: center;
      margin-left: auto;
    }

    .hidden {
      display: none !important;
    }

    /* アニメーション用クラス */
    .draw-anim {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawLine 1s forwards ease-in-out;
    }

    @keyframes drawLine {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div class="app-container">
    <header>
      <div class="sub-title">円と球 (第3時)</div>
      <h1>円の中心と 直径 ツールボックス</h1>
      <div class="notebook-prompt">
        ✏️ 図を操作して、円の中心の見つけ方や、直線の長さを調べよう！
      </div>
    </header>

    <div class="mission-bar">
      <div class="tabs">
        <button class="tab-btn active" onclick="setMode(1)">① 中心を見つける</button>
        <button class="tab-btn" onclick="setMode(2)">② 直径と半径のカンケイ</button>
        <button class="tab-btn" onclick="setMode(3)">③ いちばん長い直線は？</button>
      </div>

      <div class="story-problem" id="story-text">
        <!-- JSで挿入 -->
      </div>
    </div>

    <div class="global-controls" id="controls-area">
      <!-- JSで挿入 -->
    </div>

    <main class="visual-sandbox">
      <div class="visual-container">

        <div class="stage-wrapper" id="stage">
          <svg class="draw-layer" id="draw-layer"></svg>
        </div>

        <div class="result-message" id="result-message">
          <!-- JSで結果を表示 -->
        </div>

      </div>

      <!-- はっぴょうボード -->
      <div id="presentation-board" class="presentation-board hidden">
        <div class="presentation-board-header">
          <h3>📢 わたしの考え（図をつかって説明しよう）</h3>
          <button class="btn-close-board" onclick="closePresentation()">✖ 閉じる</button>
        </div>
        <div class="presentation-text" id="presentation-text"></div>
      </div>

      <!-- 話し合いボード -->
      <div class="discussion-area">
        <div class="discussion-topic" id="discussion-topic"></div>
        <div class="textbook-tip" id="textbook-tip"></div>
      </div>

      <!-- サポートツール -->
      <div class="notebook-guide">
        <div class="guide-header">
          <h3>📓 ノートに 自分の言葉で まとめよう</h3>
          <button class="btn btn-support" onclick="toggleSupportTool()">🆘 言葉のヒント（せつめいメーカー）</button>
        </div>

        <div id="support-tool" class="template-box hidden">
          <button class="btn-presentation" onclick="showPresentation()">📢 発表ボードへ</button>
          <div id="template-content"></div>
        </div>
      </div>
    </main>

    <!-- 練習問題 -->
    <div class="free-progress-section">
      <div class="fp-header">
        <h2>🌟 練習問題（まとめのクイズ）</h2>
      </div>

      <div class="practice-grid">
        <div class="practice-card">
          <div class="pc-title">① 円の中心を通るように、円のまわりからまわりまでひいた直線を 何といいますか。</div>
          <div class="pc-content">
            <select class="pc-select" id="prac1-sel" onchange="checkPrac(1, 'diameter')">
              <option value="">えらぶ</option>
              <option value="radius">半径（はんけい）</option>
              <option value="center">中心（ちゅうしん）</option>
              <option value="diameter">直径（ちょっけい）</option>
            </select>
            <span class="pc-mark" id="prac1-mark"></span>
          </div>
        </div>

        <div class="practice-card">
          <div class="pc-title">② 半径が 3cm の円があります。この円の 直径の長さ は何cmですか。</div>
          <div class="pc-content">
            式： 3 × <input type="number" class="pc-input" style="width:60px;" id="prac2-eq" oninput="checkPrac2()" placeholder="？"><br>
            答え： <input type="number" class="pc-input" style="width:80px;" id="prac2-ans" oninput="checkPrac2()" placeholder="？"> cm
            <span class="pc-mark" id="prac2-mark"></span>
          </div>
        </div>

        <div class="practice-card">
          <div class="pc-title">③ 円の中にひいた直線の中で、いちばん長い直線 はどれですか。</div>
          <div class="pc-content">
            <select class="pc-select" id="prac3-sel" onchange="checkPrac(3, 'diameter')">
              <option value="">えらぶ</option>
              <option value="radius">半径（はんけい）</option>
              <option value="diameter">直径（ちょっけい）</option>
              <option value="other">中心を通らない直線</option>
            </select>
            <span class="pc-mark" id="prac3-mark"></span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // --- 状態管理 ---
    let currentMode = 1;
    let stepCount = 0; // 各モードの進行度
    // SVG用の定数
    const CX = 200; // SVGの中心X
    const CY = 200; // SVGの中心Y
    const R = 150; // 円の半径
    // --- 初期化 ---
    document.addEventListener('DOMContentLoaded', () => {
      setMode(1);
    });
    // --- モード切替 ---
    function setMode(mode) {
      currentMode = mode;
      stepCount = 0;
      document.getElementById('result-message').classList.remove('show');
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        if (idx + 1 === mode) btn.classList.add('active');
        else btn.classList.remove('active');
      });
      const story = document.getElementById('story-text');
      const topic = document.getElementById('discussion-topic');
      const tip = document.getElementById('textbook-tip');
      const controls = document.getElementById('controls-area');
      if (mode === 1) {
        story.innerHTML = `コップなどで紙に円をかいて切り取ったけれど、<span class="keyword">中心の場所</span> がわかりません。<br>どうすれば 中心を見つけられるかな？`;
        topic.innerHTML = `🗣️ 「紙を半分におる」と、中心がわかるのはなぜだろう？`;
        tip.innerHTML = `
          中心を通るように、円のまわりからまわりまでひいた直線を <span class="keyword">直径</span> といいます。<br>
          ・円を半分におると、おり目の直線は <strong>直径</strong> になります。<br>
          ・直径どうしは、<strong>中心</strong> で交わります。
        `;
        controls.innerHTML = `
          <button class="btn-action" id="btn-main" onclick="progressMode1()">📄 半分におって開く（1回目）</button>
          <button class="btn-reset" onclick="setMode(1)">🔄 最初から</button>
        `;
        drawBaseCircle(false); // 中心点なし
      } else if (mode === 2) {
        story.innerHTML = `直径の長さと、半径の長さには どんな関係があるか 調べましょう。`;
        topic.innerHTML = `🗣️ 直径は、半径のいくつ分になっているかな？`;
        tip.innerHTML = `💡 <strong>まとめ：</strong> 直径の長さは、<span class="keyword">半径の2倍</span> になります。`;
        controls.innerHTML = `
          <button class="btn-action" id="btn-main" onclick="progressMode2()" style="background:#ff922b;">📏 半径をひく</button>
          <button class="btn-reset" onclick="setMode(2)">🔄 最初から</button>
        `;
        drawBaseCircle(true); // 中心点あり
      } else if (mode === 3) {
        story.innerHTML = `左のはし（アの点）から、いろいろな直線をひいてみます。<br>いちばん長い直線は どれになるでしょうか。`;
        topic.innerHTML = `🗣️ いちばん長い直線には、どんなひみつがあるかな？`;
        tip.innerHTML = `💡 <strong>ポイント：</strong> 円の中にひいた直線の中で、<span class="keyword">中心を通る直線（直径）</span> がいちばん長くなります。`;
        controls.innerHTML = `
          <div style="display:flex; gap:10px;">
             <button class="btn-action" style="background:#845ef7; font-size:1rem;" onclick="measureLine(0)">イ の長さ</button>
             <button class="btn-action" style="background:#339af0; font-size:1rem;" onclick="measureLine(1)">ウ の長さ</button>
             <button class="btn-action" style="background:#20c997; font-size:1rem;" onclick="measureLine(2)">エ の長さ</button>
             <button class="btn-action" style="background:#fcc419; font-size:1rem; color:#333;" onclick="measureLine(3)">オ の長さ</button>
          </div>
          <button class="btn-reset" onclick="setMode(3)">🔄 リセット</button>
        `;
        drawBaseCircle(true);
        drawMode3Lines();
      }
      closePresentation();
      document.getElementById('support-tool').classList.add('hidden');
      buildTemplate();
    }
    // --- 共通: ベースの円を描画 ---
    function drawBaseCircle(showCenter) {
      const svg = document.getElementById('draw-layer');
      let html = `<circle cx="50%" cy="50%" r="${R}" fill="#f8f9fa" stroke="#343a40" stroke-width="3"></circle>`;
      if (showCenter) {
        html += `<circle cx="50%" cy="50%" r="4" fill="#e03131" id="center-dot"></circle>`;
        html += `<text x="52%" y="54%" font-size="14" font-weight="bold" fill="#e03131">中心</text>`;
      }
      svg.innerHTML = html;
    }
    // --- モード1: 中心を見つける (折り目) ---
    function progressMode1() {
      const svg = document.getElementById('draw-layer');
      const btn = document.getElementById('btn-main');
      const msg = document.getElementById('result-message');
      if (stepCount === 0) {
        // 1回目の折り目（縦）
        let line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', '50%');
        line.setAttribute('y1', `${CY - R}`);
        line.setAttribute('x2', '50%');
        line.setAttribute('y2', `${CY + R}`);
        line.setAttribute('stroke', '#4dabf7');
        line.setAttribute('stroke-width', '3');
        line.setAttribute('stroke-dasharray', '8'); // 破線（折り目）
        line.classList.add('draw-anim');
        svg.appendChild(line);
        btn.innerText = "📄 もう1回、ちがう向きにおって開く（2回目）";
        stepCount++;
        msg.classList.remove('show');
      } else if (stepCount === 1) {
        // 2回目の折り目（斜め）
        let angle = Math.PI / 6; // 30度
        let x1 = CX + R * Math.cos(angle);
        let y1 = CY + R * Math.sin(angle);
        let x2 = CX - R * Math.cos(angle);
        let y2 = CY - R * Math.sin(angle);
        let line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', `${x1}`);
        line.setAttribute('y1', `${y1}`);
        line.setAttribute('x2', `${x2}`);
        line.setAttribute('y2', `${y2}`);
        line.setAttribute('stroke', '#ff922b');
        line.setAttribute('stroke-width', '3');
        line.setAttribute('stroke-dasharray', '8');
        line.classList.add('draw-anim');
        svg.appendChild(line);
        // 交点（中心）を遅れて表示
        setTimeout(() => {
          let dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          dot.setAttribute('cx', '50%');
          dot.setAttribute('cy', '50%');
          dot.setAttribute('r', '6');
          dot.setAttribute('fill', '#e03131');
          dot.style.animation = 'fadeIn 0.5s';
          svg.appendChild(dot);
          let text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', '52%');
          text.setAttribute('y', '54%');
          text.setAttribute('font-size', '16');
          text.setAttribute('font-weight', 'bold');
          text.setAttribute('fill', '#e03131');
          text.textContent = '中心';
          text.style.animation = 'fadeIn 0.5s';
          svg.appendChild(text);
          msg.innerHTML = `おり目（<span class="keyword">直径</span>）が交わったところが <span class="keyword">中心</span> だね！`;
          msg.classList.add('show');
        }, 1000);
        btn.disabled = true;
        btn.innerText = "中心が見つかりました";
      }
    }
    // --- モード2: 半径と直径 ---
    function progressMode2() {
      const svg = document.getElementById('draw-layer');
      const btn = document.getElementById('btn-main');
      const msg = document.getElementById('result-message');
      if (stepCount === 0) {
        // 半径を引く
        let line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', '50%');
        line.setAttribute('y1', '50%');
        line.setAttribute('x2', `${CX + R}`);
        line.setAttribute('y2', '50%');
        line.setAttribute('stroke', '#ff922b');
        line.setAttribute('stroke-width', '4');
        line.classList.add('draw-anim');
        svg.appendChild(line);
        setTimeout(() => {
          let text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', `${CX + R/2 - 20}`);
          text.setAttribute('y', `${CY - 10}`);
          text.setAttribute('font-size', '14');
          text.setAttribute('font-weight', 'bold');
          text.setAttribute('fill', '#d9480f');
          text.textContent = '半径';
          svg.appendChild(text);
        }, 1000);
        btn.innerText = "📏 まっすぐ反対側にも 半径をひく";
        btn.style.background = "#e03131";
        stepCount++;
      } else if (stepCount === 1) {
        // 反対側の半径（合わせて直径に）
        let line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', '50%');
        line.setAttribute('y1', '50%');
        line.setAttribute('x2', `${CX - R}`);
        line.setAttribute('y2', '50%');
        line.setAttribute('stroke', '#ff922b');
        line.setAttribute('stroke-width', '4');
        line.classList.add('draw-anim');
        svg.appendChild(line);
        setTimeout(() => {
          let text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', `${CX - R/2 - 20}`);
          text.setAttribute('y', `${CY - 10}`);
          text.setAttribute('font-size', '14');
          text.setAttribute('font-weight', 'bold');
          text.setAttribute('fill', '#d9480f');
          text.textContent = '半径';
          svg.appendChild(text);
          msg.innerHTML = `半径が２つ まっすぐ並ぶと <span class="keyword">直径</span> になる！<br>つまり、直径は <span style="color:#fa5252;">半径の２倍</span> だね。`;
          msg.classList.add('show');
        }, 1000);
        btn.disabled = true;
        btn.innerText = "直径ができました";
      }
    }
    // --- モード3: 一番長い直線 ---
    const linesData = [{
        id: 'i',
        angle: -Math.PI / 4,
        name: 'イ',
        color: '#845ef7',
        lengthVal: 8
      },
      {
        id: 'u',
        angle: 0,
        name: 'ウ',
        color: '#339af0',
        lengthVal: 10,
        isDiameter: true
      },
      {
        id: 'e',
        angle: Math.PI / 6,
        name: 'エ',
        color: '#20c997',
        lengthVal: 9
      },
      {
        id: 'o',
        angle: Math.PI / 3,
        name: 'オ',
        color: '#fcc419',
        lengthVal: 7
      }
    ];

    function drawMode3Lines() {
      const svg = document.getElementById('draw-layer');
      // 左端の点 (ア)
      const startX = CX - R;
      const startY = CY;
      let dotA = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dotA.setAttribute('cx', startX);
      dotA.setAttribute('cy', startY);
      dotA.setAttribute('r', '5');
      dotA.setAttribute('fill', '#343a40');
      svg.appendChild(dotA);
      let textA = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      textA.setAttribute('x', startX - 20);
      textA.setAttribute('y', startY + 5);
      textA.setAttribute('font-size', '16');
      textA.setAttribute('font-weight', 'bold');
      textA.textContent = 'ア';
      svg.appendChild(textA);
      // 各線の描画（最初はグレー）
      linesData.forEach((d, idx) => {
        // 円周上の点の方程式： (x-cx)^2 + (y-cy)^2 = R^2
        // アを原点とすると、極座標で円の方程式は r = 2*R*cos(θ)  ※中心が(R,0)の場合
        let r_len = 2 * R * Math.cos(d.angle);
        let endX = startX + r_len * Math.cos(d.angle);
        let endY = startY + r_len * Math.sin(d.angle);
        let line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', startX);
        line.setAttribute('y1', startY);
        line.setAttribute('x2', endX);
        line.setAttribute('y2', endY);
        line.setAttribute('stroke', '#ced4da'); // 初期グレー
        line.setAttribute('stroke-width', '3');
        line.id = `line-m3-${idx}`;
        svg.appendChild(line);
        let textEnd = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        textEnd.setAttribute('x', endX + 10);
        textEnd.setAttribute('y', endY + 5);
        textEnd.setAttribute('font-size', '16');
        textEnd.setAttribute('font-weight', 'bold');
        textEnd.textContent = d.name;
        svg.appendChild(textEnd);
        // 長さ表示用テキスト（最初は非表示）
        let textLen = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        textLen.setAttribute('x', startX + r_len / 2 - 10);
        textLen.setAttribute('y', startY + (endY - startY) / 2 - 10);
        textLen.setAttribute('font-size', '14');
        textLen.setAttribute('font-weight', 'bold');
        textLen.setAttribute('fill', d.color);
        textLen.id = `text-len-${idx}`;
        textLen.style.opacity = '0';
        svg.appendChild(textLen);
      });
      // 中心を再描画（線の上に）
      let centerDot = document.getElementById('center-dot');
      if (centerDot) svg.appendChild(centerDot);
    }
    let measuredCount = 0;

    function measureLine(idx) {
      const d = linesData[idx];
      const line = document.getElementById(`line-m3-${idx}`);
      const textLen = document.getElementById(`text-len-${idx}`);
      const msg = document.getElementById('result-message');
      if (line.getAttribute('stroke') !== '#ced4da') return; // 測定済み
      // 色付けアニメーション
      line.setAttribute('stroke', d.color);
      line.setAttribute('stroke-width', '5');
      textLen.textContent = `${d.lengthVal} cm`;
      textLen.style.opacity = '1';
      textLen.style.animation = 'fadeIn 0.5s';
      measuredCount++;
      if (d.isDiameter) {
        msg.innerHTML = `「ウ」の直線は <span class="keyword">中心</span> を通っているね！`;
        msg.classList.add('show');
      } else {
        msg.classList.remove('show');
      }
      if (measuredCount === 4) {
        setTimeout(() => {
          msg.innerHTML = `ぜんぶ測れたね！<br>いちばん長い直線（ウ）は <span class="keyword">直径</span> になっているよ。`;
          msg.classList.add('show');
        }, 1500);
      }
    }
    // --- せつめいメーカー ---
    function toggleSupportTool() {
      document.getElementById('support-tool').classList.toggle('hidden');
    }

    function buildTemplate() {
      const box = document.getElementById('template-content');
      if (currentMode === 1) {
        box.innerHTML = `
          円を半分におると、おり目の直線は「<select id="sel-1" class="sel-box"></select>」になります。<br>
          それは、円の「<select id="sel-2" class="sel-box"></select>」を通るからです。<br>
          だから、おり目を「<select id="sel-3" class="sel-box"></select>」つければ、交わったところが 中心になります。
        `;
        populateSelect('sel-1', shuffleArray(['?', '直径', '半径']));
        populateSelect('sel-2', shuffleArray(['?', '中心', 'まわり']));
        populateSelect('sel-3', shuffleArray(['?', '2回', '1回']));
      } else if (currentMode === 2) {
        box.innerHTML = `
          中心を通るように、円のまわりからまわりまでひいた直線を「<select id="sel-1" class="sel-box"></select>」といいます。<br>
          図を見ると、直径は「<select id="sel-2" class="sel-box"></select>」が まっすぐ ２つならんでいます。<br>
          だから、直径の長さは 半径の「<select id="sel-3" class="sel-box"></select>」倍になります。
        `;
        populateSelect('sel-1', shuffleArray(['?', '直径', '半径']));
        populateSelect('sel-2', shuffleArray(['?', '半径', '中心']));
        populateSelect('sel-3', shuffleArray(['?', '2', '3']));
      } else if (currentMode === 3) {
        box.innerHTML = `
          円の中にひいた直線の中で、いちばん長い直線は「<select id="sel-1" class="sel-box"></select>」です。<br>
          なぜなら、いちばん長い直線は 必ず円の「<select id="sel-2" class="sel-box"></select>」を通るからです。
        `;
        populateSelect('sel-1', shuffleArray(['?', 'アウの直線（直径）', 'アイの直線']));
        populateSelect('sel-2', shuffleArray(['?', '中心', 'はし']));
      }
    }

    function populateSelect(elementId, values) {
      const select = document.getElementById(elementId);
      if (!select) return;
      select.innerHTML = '';
      const defaultOpt = document.createElement('option');
      defaultOpt.value = "?";
      defaultOpt.innerText = "❓";
      select.appendChild(defaultOpt);
      values.forEach(val => {
        if (val !== '?') {
          let opt = document.createElement('option');
          opt.value = val;
          opt.innerText = val;
          select.appendChild(opt);
        }
      });
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }
    // --- はっぴょうボード ---
    function showPresentation() {
      let textHTML = "";
      if (currentMode === 1) {
        let v1 = document.getElementById('sel-1').value;
        let v2 = document.getElementById('sel-2').value;
        let v3 = document.getElementById('sel-3').value;
        textHTML = `
          円を半分におると、おり目の直線は「<span>${v1}</span>」になります。<br>
          それは、円の「<span>${v2}</span>」を通るからです。<br>
          だから、おり目を「<span>${v3}</span>」つければ、交わったところが中心になります。
        `;
      } else if (currentMode === 2) {
        let v1 = document.getElementById('sel-1').value;
        let v2 = document.getElementById('sel-2').value;
        let v3 = document.getElementById('sel-3').value;
        textHTML = `
          中心を通るようにひいた直線を「<span>${v1}</span>」といいます。<br>
          図を見ると、直径は「<span>${v2}</span>」がまっすぐ２つならんでいます。<br>
          だから、直径の長さは半径の「<span>${v3}</span>」倍になります。
        `;
      } else if (currentMode === 3) {
        let v1 = document.getElementById('sel-1').value;
        let v2 = document.getElementById('sel-2').value;
        textHTML = `
          円の中にひいた直線の中で、いちばん長い直線は「<span>${v1}</span>」です。<br>
          なぜなら、いちばん長い直線は必ず円の「<span>${v2}</span>」を通るからです。
        `;
      }
      document.getElementById('presentation-text').innerHTML = textHTML;
      const board = document.getElementById('presentation-board');
      board.classList.remove('hidden');
      board.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
      });
    }

    function closePresentation() {
      document.getElementById('presentation-board').classList.add('hidden');
    }
    // --- クイズ判定 ---
    function checkPrac(num, correctVal) {
      const sel = document.getElementById(`prac${num}-sel`).value;
      const mark = document.getElementById(`prac${num}-mark`);
      if (sel === "") {
        mark.innerText = "";
        return;
      }
      if (sel === correctVal) {
        mark.innerText = "〇";
        mark.style.color = "#40c057";
      } else {
        mark.innerText = "✕";
        mark.style.color = "#fa5252";
      }
    }

    function checkPrac2() {
      const eq = parseInt(document.getElementById('prac2-eq').value);
      const ans = parseInt(document.getElementById('prac2-ans').value);
      const mark = document.getElementById('prac2-mark');
      if (isNaN(ans)) {
        mark.innerText = "";
        return;
      }
      if (ans === 6 && eq === 2) {
        mark.innerText = "〇";
        mark.style.color = "#40c057";
      } else if (ans === 6) {
        mark.innerText = "〇";
        mark.style.color = "#40c057"; // 答え合ってればOK
      } else {
        mark.innerText = "✕";
        mark.style.color = "#fa5252";
      }
    }
  </script>

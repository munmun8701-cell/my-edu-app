<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>０８　割り算を考えよう　4時間目　②</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div id="app">
  <header>
    <h1>わり算 探偵！ まちがいを 見つけよう</h1>
    <div class="step-indicator" id="progress-text">じけん 1 / 6</div>
  </header>

  <section class="visualizer">
    <div class="area-label">
      <span><ruby>証拠<rt>しょうこ</rt></ruby>のおはじき（ぜんぶで <span id="total-count">0</span>こ）</span>
      <button id="btn-reset" class="btn-small">🔄 はじめにもどす</button>
    </div>
    
    <div class="pool-container">
      <div class="pool" id="pool"></div>
    </div>
    
    <div class="area-label" style="margin-top: 15px;">
      <span>分ける場所（1つに <span id="divisor-count">0</span>こ ずつ）</span>
      <button id="btn-auto-group" class="btn-small btn-magic">🪄 1グループを 自動でつくる</button>
    </div>
    <div class="groups" id="groups"></div>
  </section>

  <section class="detective-board">
    <div class="question-card">
      <h2 id="q-title">🔍 じけん ファイル</h2>
      <p id="q-text" class="question-text"></p>
      
      <div class="suspect-answer" id="suspect-answer">
        <span class="label">こたえ：</span>
        <span id="eq-display" class="eq-display"></span>
      </div>

      <div id="judgment-area" class="judgment-area">
        <p>この こたえは 正しい？ まちがい？</p>
        <div class="action-buttons">
          <button id="btn-correct" class="btn-judge btn-circle">⭕ 正しい</button>
          <button id="btn-wrong" class="btn-judge btn-cross">❌ まちがい</button>
        </div>
      </div>

      <div id="correction-area" class="correction-area hidden">
        <p class="correction-prompt">探偵さん、正しい こたえを 入力してね！</p>
        <div class="answer-box">
          <span id="correct-eq-display"></span>
          <input type="text" inputmode="numeric" id="input-q" placeholder="？"> あまり 
          <input type="text" inputmode="numeric" id="input-r" placeholder="？">
        </div>
        <button id="btn-check-correction" class="btn-primary">こたえあわせ ✨</button>
      </div>

      <div id="msg" class="msg hidden"></div>
      
      <button id="btn-next" class="btn-next hidden">つぎの じけんへ ➡</button>
    </div>
  </section>

  <section id="clear-screen" class="clear-screen hidden">
    <div class="clear-content">
      <div class="crown">🕵️‍♂️✨</div>
      <h2>名探偵、ぜんぶ 解決！！</h2>
      <p>あまりの 大きさや、九九の まちがいを<br>しっかり 見つけられたね！すばらしい！</p>
      <button onclick="location.reload()" class="btn-primary" style="margin-top: 30px;">もういちど ちょうさする</button>
    </div>
  </section>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>０８　割り算を考えよう</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div id="app-container">
  <div class="header">
    <h1>あまりのある わり<ruby>算<rt>ざん</rt></ruby></h1>
    <div class="progress" id="progress-text">もんだい 1 / 5</div>
  </div>
  
  <div class="question-box" id="question-box">
    <!-- 問題文がここに入ります -->
  </div>

  <div class="controls">
    <button id="hint-btn" class="btn hint-btn">💡 ヒントをみる</button>
    <button id="reset-btn" class="btn reset-btn">🔄 はじめから</button>
  </div>

  <div id="hint-box" class="hint-box hidden">
    <p id="hint-text"></p>
  </div>

  <!-- 具体物エリア -->
  <div class="area-label" id="pool-label">ぜんぶの数（タップして わけてみよう）</div>
  <div id="pool-area" class="pool-area"></div>

  <!-- グループ（お皿や箱など）エリア -->
  <div class="area-label" id="group-label">わける場所</div>
  <div id="groups-area" class="groups-area"></div>

  <!-- 解答エリア -->
  <div class="equation-box">
    <div class="type-check">
      <p>この けいさんは…</p>
      <label><input type="radio" name="divisibility" value="divisible"> わりきれる</label>
      <label><input type="radio" name="divisibility" value="indivisible"> わりきれない</label>
    </div>
    
    <div class="equation-text">
      <span id="eq-dividend"></span> ÷ <span id="eq-divisor"></span> ＝
      <input type="number" id="ans-quotient" class="ans-input" placeholder="？">
      あまり
      <input type="number" id="ans-remainder" class="ans-input" placeholder="？">
      <div class="small-notice">※あまりがないときは「0」と かこう</div>
    </div>
    
    <button id="check-btn" class="btn check-btn">こたえあわせ ✨</button>
    <button id="next-btn" class="btn next-btn hidden">つぎの もんだいへ ➡</button>
  </div>

  <!-- メッセージ表示 -->
  <div id="message" class="message hidden"></div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

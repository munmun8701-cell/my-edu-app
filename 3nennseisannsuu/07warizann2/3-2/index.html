<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>０８　割り算を考えよう　３時間目　②</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div id="app">
  <header>
    <h1>わり算 文章もんだい マスター！</h1>
    <div class="step-indicator" id="progress-text">もんだい 1 / 2</div>
  </header>

  <section class="visualizer">
    <div class="area-label">
      <span>くばるもの（ぜんぶで <span id="total-count">0</span> まい）</span>
      <div class="vis-controls">
        <button id="btn-distribute" class="btn-small btn-magic">🪄 全員に 1まいずつ 配る</button>
        <button id="btn-reset-items" class="btn-small">🔄 はじめにもどす</button>
      </div>
    </div>
    
    <div class="pool-container">
      <div class="pool-status">のこり： <strong id="pool-num">0</strong> まい</div>
      <div class="pool" id="pool"></div>
    </div>
    
    <div class="area-label" style="margin-top: 15px;">分ける人（<span id="divisor-count">0</span> 人で 同じ数ずつ）</div>
    <div class="groups" id="groups">
      </div>
  </section>

  <section class="question-board">
    <div class="question-card">
      <h2 id="q-title">📝 もんだい</h2>
      <p id="q-text" class="question-text"></p>
      
      <div class="hint-area hidden" id="hint-area">
        <strong>💡 ヒント：</strong> <span id="hint-text"></span>
      </div>

      <div class="input-section">
        <h3>① 式と 答えを 書こう</h3>
        <div class="answer-box">
          <span class="label">式：</span>
          <input type="text" inputmode="numeric" id="s1-div" placeholder="？" class="input-dividend"> ÷ 
          <input type="text" inputmode="numeric" id="s1-dsr" placeholder="？" class="input-divisor"> ＝ 
          <input type="text" inputmode="numeric" id="s1-q" placeholder="？" class="input-quotient"> あまり 
          <input type="text" inputmode="numeric" id="s1-r" placeholder="？" class="input-remainder">
        </div>
      </div>

      <div class="input-section highlight-section">
        <h3>② 本当に 合っているかな？ たしかめの 式を 書こう</h3>
        <p class="sub-text">「わる数 × 答え ＋ あまり ＝ ぜんぶの数」だったね！</p>
        <div class="answer-box">
          <span class="label">たしかめ：</span>
          <input type="text" inputmode="numeric" id="s2-chk-div" placeholder="わる数" class="input-divisor"> × 
          <input type="text" inputmode="numeric" id="s2-chk-q" placeholder="答え" class="input-quotient"> ＋ 
          <input type="text" inputmode="numeric" id="s2-chk-r" placeholder="あまり" class="input-remainder"> ＝ 
          <input type="text" inputmode="numeric" id="s2-chk-tot" placeholder="ぜんぶの数" class="input-dividend">
        </div>
      </div>

      <div class="action-buttons">
        <button id="btn-hint" class="btn-hint">💡 ヒントをみる</button>
        <button id="btn-check" class="btn-primary">こたえあわせ ✨</button>
        <button id="btn-next" class="btn-next hidden">つぎの もんだいへ ➡</button>
      </div>

      <div id="msg" class="msg hidden"></div>
    </div>
  </section>

  <section id="clear-screen" class="clear-screen hidden">
    <div class="clear-content">
      <div class="crown">🏅</div>
      <h2>クエスト 完全クリア！！</h2>
      <p>文章を よく読んで、正しい 式が つくれたね！<br>「たしかめ」の 技も 身につけた 君は、もう わり算マスターだ！</p>
      <button onclick="location.reload()" class="btn-primary" style="margin-top: 30px;">もういちど ちょうせんする</button>
    </div>
  </section>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

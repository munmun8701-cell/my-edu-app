<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>０８　割り算を考えよう</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div id="app">
  <header>
    <h1>あまりのある わり算（れんしゅう）</h1>
    <div class="step-indicator" id="progress-text">もんだい 1 / 6</div>
  </header>

  <section class="visualizer">
    <div class="area-label">
      <span>ぜんぶの数：<span id="total-count">0</span></span>
      <button id="btn-reset" class="btn-small">🔄 はじめにもどす</button>
    </div>
    
    <div class="pool-container">
      <div class="pool" id="pool"></div>
    </div>
    
    <div class="area-label" style="margin-top: 15px;">
      <span>分ける場所（<ruby>1<rt>ひと</rt></ruby>つに <span id="divisor-count">0</span> ずつ）</span>
      <button id="btn-auto-group" class="btn-small btn-magic">🪄 1グループを 自動でつくる</button>
    </div>
    <div class="groups" id="groups"></div>
  </section>

  <section class="question-section">
    <div class="question-card">
      <h2 id="q-title">もんだい</h2>
      <p id="q-text" class="question-text"></p>
      
      <div class="hint-area hidden" id="hint-area">
        <strong>💡 ヒント：</strong> <span id="hint-text"></span>
      </div>

      <div class="answer-box">
        <span id="eq-display" class="eq-display"></span>
        <input type="text" inputmode="numeric" id="input-q" placeholder="？"> あまり 
        <input type="text" inputmode="numeric" id="input-r" placeholder="？">
      </div>
      
      <div class="action-buttons">
        <button id="btn-hint" class="btn-hint">💡 ヒントをみる</button>
        <button id="btn-check" class="btn-check">こたえあわせ ✨</button>
        <button id="btn-next" class="btn-next hidden">つぎの もんだいへ ➡</button>
      </div>
      
      <div id="msg" class="msg hidden"></div>
    </div>
  </section>

  <section id="clear-screen" class="clear-screen hidden">
    <div class="clear-content">
      <div class="crown">👑</div>
      <h2>ぜんぶ クリア！！</h2>
      <p>「あまりは わる数より 小さくなる」ルールを<br>しっかり マスターできたね！すばらしい！</p>
      <button onclick="location.reload()" class="btn-check" style="margin-top: 30px;">もういちど はじめから</button>
    </div>
  </section>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>たしかめよう</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
  
  <div id="start-screen" class="screen active">
    <h1>わり算 まとめテスト</h1>
    <p>ぜんぶで 18もん あります。<br>文章もんだいは、図をかいて 式をたてよう！</p>
    <button id="start-btn" class="primary-btn">テストを はじめる</button>
  </div>

  <div id="quiz-screen" class="screen">
    <div class="header">
      <span id="progress-text">もんだい 1 / 18</span>
      <span id="category-badge" class="badge">計算</span>
    </div>

    <div id="question-container">
      <h2 id="question-text">24 ÷ 4 =</h2>
      
      <div id="options-area" class="hidden"></div>
    </div>

    <div id="canvas-area" class="canvas-container hidden">
      <div class="canvas-header">
        <span>✍️ 図や メモを かこう</span>
        <button id="clear-canvas-btn">けす</button>
      </div>
      <canvas id="memo-canvas"></canvas>
    </div>

    <div id="answer-area">
      
      <div id="calc-input-area" class="input-display hidden">
        <span>こたえ：</span>
        <div id="calc-answer" class="answer-box active-input" data-target="calc"></div>
      </div>
      
      <div id="word-input-area" class="word-input-display hidden">
        <div class="input-row">
          <span>式：</span>
          <div id="word-formula" class="answer-box formula-box active-input" data-target="formula"></div>
        </div>
        <div class="input-row">
          <span>答え：</span>
          <div id="word-answer" class="answer-box" data-target="answer"></div>
        </div>
      </div>
      
      <div id="numpad" class="numpad">
        <button class="num-btn">1</button><button class="num-btn">2</button><button class="num-btn">3</button><button class="num-btn op-btn">÷</button>
        <button class="num-btn">4</button><button class="num-btn">5</button><button class="num-btn">6</button><button class="num-btn clear-btn">けす</button>
        <button class="num-btn">7</button><button class="num-btn">8</button><button class="num-btn">9</button><button class="num-btn">0</button>
        <button id="submit-btn" class="submit-btn">決定</button>
      </div>
    </div>
    
    <button id="submit-choice-btn" class="primary-btn hidden" style="width:100%; margin-top:15px;">これで 決定！</button>
  </div>

  <div id="result-screen" class="screen">
    <h1>テスト けっか</h1>
    <div class="score-circle">
      <span id="score-text">100</span><span class="percent">%</span>
    </div>
    
    <h2 id="feedback-message">よく がんばりました！</h2>
    
    <div class="analysis-box">
      <h3>📊 にがて ぶんせき</h3>
      <p id="analysis-text"></p>
    </div>

    <div id="mistake-list" class="mistake-list">
      <h3>まちがえた もんだい</h3>
      <ul id="mistake-ul"></ul>
    </div>

    <button id="retry-btn" class="primary-btn hidden">まちがえた 問題を やりなおす</button>
    <button id="home-btn" class="secondary-btn">さいしょから やる</button>
  </div>

</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

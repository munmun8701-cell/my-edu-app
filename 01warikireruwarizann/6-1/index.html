<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>わり算　６時間目</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="container">
  <h1>クッキーを 4人で 同じ数ずつ 分けよう</h1>
  
  <div class="tabs">
    <button class="tab-btn active" data-problem="8">(1) 8こ 入っているとき</button>
    <button class="tab-btn" data-problem="4">(2) 4こ 入っているとき</button>
    <button class="tab-btn" data-problem="0">(3) 入っていないとき (0こ)</button>
  </div>

  <p id="message">クッキーを ドラッグして、4つの おさらに わけてね。</p>

  <div id="pool" class="box-area drop-zone">
    </div>

  <button id="zero-btn" style="display: none;">わけてみる</button>

  <div class="plates-container">
    <div class="plate drop-zone"></div>
    <div class="plate drop-zone"></div>
    <div class="plate drop-zone"></div>
    <div class="plate drop-zone"></div>
  </div>

  <div class="equation-area">
    <span id="eq-total" class="eq-box">?</span>
    <span class="eq-symbol">÷ 4 =</span>
    <span id="eq-answer" class="eq-box answer-box">?</span>
  </div>

  <button id="reset-btn">やりなおす</button>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

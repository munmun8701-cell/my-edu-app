<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>わり算３時間目ー３</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="container">
  <h1>ボールを かごに わけよう</h1>
  <p id="message">ボールを ドラッグして、4こずつ かごに いれてね。かごは いくつ ひつようかな？</p>
  
  <div id="pool" class="drop-zone pool-area">
    <h2>ボールの プール</h2>
  </div>
  
  <div class="baskets-container">
    <div class="basket drop-zone"><span>かご 1</span></div>
    <div class="basket drop-zone"><span>かご 2</span></div>
    <div class="basket drop-zone"><span>かご 3</span></div>
    <div class="basket drop-zone"><span>かご 4</span></div>
    <div class="basket drop-zone"><span>かご 5</span></div>
    <div class="basket drop-zone"><span>かご 6</span></div>
    <div class="basket drop-zone"><span>かご 7</span></div>
    <div class="basket drop-zone"><span>かご 8</span></div>
  </div>
  
  <button id="reset-btn">やりなおす</button>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>わり算４時間目</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
    <div class="header-title">✨ 20まいを5まいずつ 分けよう ✨</div>

    <div class="nav-board" id="nav-board">
        <div class="nav-title" id="nav-title">めあて：20まいの中に、5まいの「たば」はいくつ？</div>
        <div class="nav-msg" id="nav-msg">
            バラバラのカードを **5まいずつ** 選んで、「たば」を作ってみよう！<br>
            カードをクリックして選んでね。
        </div>
    </div>

    <div class="workspace">
        <div class="stock-area">
            <div class="stock-header">
                <span class="stock-title">🃏 まだ配っていないカード</span>
                <span class="stock-count"><strong id="stock-num">20</strong> / 20 まい</span>
            </div>
            <div class="cards-grid" id="cards-grid">
                </div>
        </div>

        <div class="selection-control">
            <div class="selection-status">
                えらんだ数： <span id="select-count">0</span> / 5 まい
            </div>
            <button class="btn-action" id="btn-make-bundle" onclick="makeBundle()" disabled>
                👤 この5まいを 1人に配る
            </button>
        </div>

        <div class="result-area" id="result-area">
            <div class="result-title">🎁 配り終わった「たば」</div>
            <div class="bundles-container" id="bundles-container">
                </div>
        </div>
    </div>

    <div class="answer-section locked-section" id="answer-section">
        <div class="step-title">わり算の式を完成させよう</div>
        <div class="calc-row">
            <input type="text" id="ans-total" class="num-input" placeholder="全部"> ÷ 
            <input type="text" id="ans-per" class="num-input" placeholder="1人分"> ＝ 
            <input type="text" id="ans-group" class="num-input" placeholder="人数">
        </div>
        <div class="calc-row mt-15">
            答え： <input type="text" id="ans-final" class="num-input ans-highlight"> 人
        </div>
        <div class="action-area mt-15">
            <button class="btn-check" id="btn-check" onclick="checkAnswer()">答え合わせ</button>
        </div>
    </div>

    <div class="footer-btns">
        <button class="btn-reset" onclick="resetApp()">最初からやりなおす</button>
    </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

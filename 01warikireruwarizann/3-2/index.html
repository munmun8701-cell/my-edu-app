<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>わり算　３時間目ー２</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
    <div class="header-title">✨ おはじき操作：いくつできるかな？ ✨</div>

    <div class="tabs">
        <button class="tab-btn active" id="tab-btn-1" onclick="loadProblem(1)">問 １（花たばを作る）</button>
        <button class="tab-btn" id="tab-btn-2" onclick="loadProblem(2)">問 ２（かごに入れる）</button>
    </div>

    <div class="nav-board" id="nav-board">
        <div class="nav-title" id="nav-title">めあて：同じ数のまとまりを作ろう</div>
        <div class="nav-msg" id="nav-msg">
            まずはボタンをおして、おはじきを入れる「まとまり」を1つ出そう。
        </div>
    </div>

    <div class="question-box" id="problem-text">
        </div>

    <div class="workspace">
        <div class="stock-area">
            <div class="stock-header">
                <span class="stock-title">📦 のこりのおはじき</span>
                <span class="stock-count"><strong id="stock-num">18</strong></span>
            </div>
            <div class="stock-items" id="stock-items">
                </div>
        </div>

        <div class="action-area">
            <button class="btn-action" id="btn-add-group" onclick="addGroup()">
                <span id="btn-add-text">💐 1つめの花たばを作る</span>
            </button>
        </div>
        
        <div class="plates-instruction">おはじきか「まとまり」をクリックすると移動するよ！（まとまりのおはじきを押すと戻せます）</div>
        <div class="plates-area" id="groups-area">
            </div>
    </div>

    <div class="answer-section locked-section" id="answer-section">
        <div class="step-title">いくつできたかを求める計算</div>
        <div class="calc-row">
            <input type="text" id="ans-total" class="num-input" placeholder="全部"> ÷ 
            <input type="text" id="ans-per" class="num-input" placeholder="1つ分"> ＝ 
            <input type="text" id="ans-group" class="num-input" placeholder="いくつ分">
        </div>
        <div class="calc-row mt-15">
            答え： 
            <input type="text" id="ans-final" class="num-input ans-highlight"> <span id="ans-unit">たば</span>
        </div>
        <div class="action-area mt-15">
            <button class="btn-check" id="btn-check" onclick="checkAnswer()">答え合わせ</button>
        </div>
    </div>

    <div class="matome-box hidden" id="matome-box">
        <div class="matome-label">まとめ</div>
        全部おなじ数ずつ分けられるまで、まとまりを作ればいいね。<br>
        「いくつできるか」をもとめる時も <strong>わり算</strong> の式になるよ！
    </div>

    <div class="footer-btns">
        <button class="btn-reset" onclick="resetCurrent()">やりなおす</button>
    </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

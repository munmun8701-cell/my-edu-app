<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>わり算５時間目</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="container">
  <h1>下の2つの問題を くらべましょう</h1>
  <button id="reset-btn">さいしょから やる</button>

  <div class="problem-section kouta-bg">
    <h2>👦 こうた：6この あめを、2人で おなじかずずつ わけると、1人分は何こに なりますか。</h2>
    
    <div id="pool-kouta" class="pool drop-zone" data-owner="kouta"></div>
    
    <div class="trays-container">
      <div class="tray drop-zone" data-owner="kouta"><span>1人め</span></div>
      <div class="tray drop-zone" data-owner="kouta"><span>2人め</span></div>
    </div>
    
    <div class="message-area">
      <p id="msg-kouta" class="message"></p>
    </div>
  </div>

  <div class="problem-section shiho-bg">
    <h2>👧 しほ：6この あめを、1人に 2こずつ わけると、何人に わけられますか。</h2>
    
    <div id="pool-shiho" class="pool drop-zone" data-owner="shiho"></div>
    
    <div class="trays-container">
      <div class="tray drop-zone" data-owner="shiho" data-max="2"><span>1人め</span></div>
      <div class="tray drop-zone" data-owner="shiho" data-max="2"><span>2人め</span></div>
      <div class="tray drop-zone" data-owner="shiho" data-max="2"><span>3人め</span></div>
      <div class="tray drop-zone" data-owner="shiho" data-max="2"><span>4人め</span></div>
      <div class="tray drop-zone" data-owner="shiho" data-max="2"><span>5人め</span></div>
    </div>
    
    <div class="message-area">
      <p id="msg-shiho" class="message"></p>
    </div>
  </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

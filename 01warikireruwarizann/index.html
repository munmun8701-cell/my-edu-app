<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>わり算（あまりなし） — 学習アプリ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --sidebar-width: 25%;
      --bg-main: #f0f8f4;
      --text: #3d4f5f;
      --text-muted: #6b7f92;
      --accent: #7dd3a8;
      --shadow: 0 4px 14px rgba(100, 160, 130, 0.15);
      --radius-lg: 20px;
      --radius-btn: 18px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic UI", sans-serif;
      color: var(--text);
      background: var(--bg-main);
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      display: flex;
      height: 100%;
      height: 100dvh;
    }

    .sidebar {
      flex: 0 0 var(--sidebar-width);
      min-width: 220px;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #eef9f3 0%, #e3f5ec 100%);
      border-right: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 4px 0 24px rgba(120, 180, 150, 0.08);
      z-index: 10;
    }

    .sidebar-header {
      padding: 1.25rem 1rem 1rem;
      text-align: center;
      background: linear-gradient(135deg, #b8ebd4 0%, #c9f5e4 50%, #d4ece8 100%);
      border-bottom: 2px solid rgba(255, 255, 255, 0.6);
    }

    .sidebar-header .logo {
      font-size: 2rem;
      line-height: 1;
      margin-bottom: 0.35rem;
    }

    .sidebar-header h1 {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #2d5e4a;
      line-height: 1.35;
    }

    .sidebar-header p {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .portal-link {
      display: block;
      margin-top: 0.6rem;
      font-size: 0.72rem;
      font-weight: 700;
      color: #2d5e4a;
      text-decoration: none;
      opacity: 0.85;
    }

    .portal-link:hover {
      text-decoration: underline;
    }

    .menu-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0.75rem 0.85rem 1.25rem;
      -webkit-overflow-scrolling: touch;
    }

    .menu-scroll::-webkit-scrollbar {
      width: 6px;
    }

    .menu-scroll::-webkit-scrollbar-thumb {
      background: rgba(125, 211, 168, 0.45);
      border-radius: 3px;
    }

    .menu-group {
      margin-bottom: 1rem;
    }

    .menu-group-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0.35rem 0.5rem 0.5rem;
      letter-spacing: 0.08em;
    }

    .menu-btn {
      display: block;
      width: 100%;
      margin-bottom: 0.55rem;
      padding: 0.85rem 1rem;
      border: none;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      color: #2d5e4a;
      background: #fff;
      box-shadow: var(--shadow);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
      line-height: 1.3;
      min-height: 52px;
    }

    .menu-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(100, 160, 130, 0.2);
    }

    .menu-btn:active {
      transform: scale(0.98);
    }

    .menu-btn.active {
      background: linear-gradient(135deg, #7dd3a8 0%, #9ae6b8 100%);
      color: #fff;
      box-shadow: 0 4px 16px rgba(94, 200, 150, 0.45);
    }

    .menu-btn .sub {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      opacity: 0.85;
      margin-top: 0.15rem;
    }

    .menu-btn[data-hour="1"] { border-left: 5px solid #ffb3ba; }
    .menu-btn[data-hour="2"] { border-left: 5px solid #ffdfba; }
    .menu-btn[data-hour="3"] { border-left: 5px solid #ffffba; }
    .menu-btn[data-hour="4"] { border-left: 5px solid #baffc9; }
    .menu-btn[data-hour="5"] { border-left: 5px solid #bae1ff; }
    .menu-btn[data-hour="6"] { border-left: 5px solid #d4baff; }
    .menu-btn[data-hour="review"] { border-left: 5px solid #ffc8e8; }

    .menu-btn.active[data-hour] {
      border-left-color: rgba(255, 255, 255, 0.5);
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: linear-gradient(160deg, #f8fcfa 0%, #eef5f0 40%, #f0f8f5 100%);
      padding: 0.75rem;
      padding-left: 0.5rem;
    }

    .content-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem 0.65rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .content-bar .current-title {
      color: var(--text);
      font-size: 0.95rem;
    }

    .iframe-wrap {
      flex: 1;
      min-height: 0;
      background: #fff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow), inset 0 0 0 1px rgba(200, 235, 215, 0.5);
      overflow: hidden;
    }

    .iframe-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #fff;
    }

    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 2rem;
      text-align: center;
      background: linear-gradient(180deg, #fafefc 0%, #f0fcf7 100%);
    }

    .welcome.hidden {
      display: none;
    }

    .welcome .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    .welcome h2 {
      font-size: 1.4rem;
      font-weight: 800;
      color: #2d5e4a;
      margin-bottom: 0.5rem;
    }

    .welcome p {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 300px;
      line-height: 1.6;
    }

    @media (max-width: 768px) {
      :root {
        --sidebar-width: 38%;
      }

      .sidebar {
        min-width: 140px;
      }

      .sidebar-header h1 {
        font-size: 0.85rem;
      }

      .menu-btn {
        font-size: 0.8rem;
        padding: 0.7rem 0.75rem;
        min-height: 48px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="メニュー">
      <header class="sidebar-header">
        <div class="logo" aria-hidden="true">➗✨</div>
        <h1>わり算（あまりなし）</h1>
        <p>つぎにとりくむプリントをえらんでね</p>
        <!-- 修正箇所：javascript:history.back() を使用してエラーを防ぎます -->
        <a class="portal-link" href="javascript:history.back()">← ポータルにもどる</a>
      </header>

      <nav class="menu-scroll" id="menu">
        <div class="menu-group">
          <div class="menu-group-label">１時間目</div>
          <button type="button" class="menu-btn" data-hour="1" data-src="1-1/index.html" data-title="わり算 １時間目">１時間目<span class="sub">おなじかずずつ わけよう</span></button>
        </div>

        <div class="menu-group">
          <div class="menu-group-label">２時間目</div>
          <button type="button" class="menu-btn" data-hour="2" data-src="2-1/index.html" data-title="わり算 ２時間目">２時間目<span class="sub">ゼリーを わけよう</span></button>
        </div>

        <div class="menu-group">
          <div class="menu-group-label">３時間目</div>
          <button type="button" class="menu-btn" data-hour="3" data-src="3-1/index.html" data-title="わり算 ３時間目 ①">３時間目 ①</button>
          <button type="button" class="menu-btn" data-hour="3" data-src="3-2/index.html" data-title="わり算 ３時間目 ②">３時間目 ②</button>
          <button type="button" class="menu-btn" data-hour="3" data-src="3-3/index.html" data-title="わり算 ３時間目 ③">３時間目 ③</button>
        </div>

        <div class="menu-group">
          <div class="menu-group-label">４時間目</div>
          <button type="button" class="menu-btn" data-hour="4" data-src="4-1/index.html" data-title="わり算 ４時間目 ①">４時間目 ①</button>
          <button type="button" class="menu-btn" data-hour="4" data-src="4-2/index.html" data-title="わり算 ４時間目 ②">４時間目 ②</button>
          <button type="button" class="menu-btn" data-hour="4" data-src="4-3/index.html" data-title="わり算 ４時間目 ③">４時間目 ③</button>
        </div>

        <div class="menu-group">
          <div class="menu-group-label">５時間目</div>
          <button type="button" class="menu-btn" data-hour="5" data-src="5-1/index.html" data-title="わり算 ５時間目">５時間目</button>
        </div>

        <div class="menu-group">
          <div class="menu-group-label">６時間目</div>
          <button type="button" class="menu-btn" data-hour="6" data-src="6-1/index.html" data-title="わり算 ６時間目">６時間目</button>
        </div>

        <div class="menu-group">
          <div class="menu-group-label">まとめ</div>
          <button type="button" class="menu-btn" data-hour="review" data-src="tasikameyou/index.html" data-title="わり算 たしかめよう">たしかめよう 🌟</button>
        </div>
      </nav>
    </aside>

    <main class="content">
      <div class="content-bar">
        <span>いまのページ：</span>
        <span class="current-title" id="currentTitle">（左のボタンをおしてね）</span>
      </div>
      <div class="iframe-wrap">
        <div class="welcome" id="welcome">
          <div class="icon" aria-hidden="true">➗</div>
          <h2>ようこそ！</h2>
          <p>左のメニューから、とりくむ時間のボタンをおして、学習をはじめてね。</p>
        </div>
        <iframe id="lessonFrame" title="教材表示" hidden></iframe>
      </div>
    </main>
  </div>

  <script>
    const frame = document.getElementById("lessonFrame");
    const welcome = document.getElementById("welcome");
    const currentTitle = document.getElementById("currentTitle");
    const buttons = document.querySelectorAll(".menu-btn");

    function loadLesson(btn) {
      const src = btn.dataset.src;
      const title = btn.dataset.title || btn.textContent.trim();

      buttons.forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");

      currentTitle.textContent = title;
      welcome.classList.add("hidden");
      frame.hidden = false;
      frame.src = src;

      btn.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    buttons.forEach((btn) => {
      btn.addEventListener("click", () => loadLesson(btn));
    });
  </script>
</body>
</html>

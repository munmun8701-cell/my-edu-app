<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>わり算４時間目ー３</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="container">
  <h1>ジュースを わけて みよう</h1>
  <p id="message">15dLの ジュースが あります。「3dL つぐ」ボタンを おしてね。</p>
  
  <div class="main-container-area">
    <div id="jug" class="jug">
      <div id="juice-level" class="juice"></div>
      <span id="jug-label">15dL</span>
    </div>
  </div>

  <div class="controls">
    <button id="pour-btn">🥤 3dL つぐ</button>
    <button id="reset-btn">やりなおす</button>
  </div>
  
  <div id="cups-container" class="cups-area">
    </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

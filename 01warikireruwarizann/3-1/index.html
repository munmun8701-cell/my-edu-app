<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>わり算　３時間目</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
    <div class="header-title">✨ おはじき操作：何人に分けられるかな？ ✨</div>

    <div class="tabs">
        <button class="tab-btn active" id="tab-btn-1" onclick="loadProblem(1)">問 １（12こを3こずつ）</button>
        <button class="tab-btn" id="tab-btn-2" onclick="loadProblem(2)">問 ２（15こを5こずつ）</button>
    </div>

    <!-- 思考を促すナビボード -->
    <div class="nav-board" id="nav-board">
        <div class="nav-title" id="nav-title">めあて：1人分（同じ数）のまとまりを作ろう</div>
        <div class="nav-msg" id="nav-msg">
            まずは「1人分のお皿を出す」ボタンをおして、お皿をじゅんびしよう。
        </div>
    </div>

    <div class="question-box" id="problem-text">
        <!-- JSでセット -->
    </div>

    <div class="workspace">
        <!-- ストックエリア -->
        <div class="stock-area">
            <div class="stock-header">
                <span class="stock-title">📦 のこりのおはじき</span>
                <span class="stock-count"><strong id="stock-num">12</strong> こ</span>
            </div>
            <div class="stock-items" id="stock-items">
                <!-- おはじき -->
            </div>
        </div>

        <!-- お皿操作エリア -->
        <div class="action-area">
            <button class="btn-action" id="btn-add-plate" onclick="addPlate()">
                🍽️ 1人分のお皿を出す
            </button>
        </div>
        
        <div class="plates-instruction">おはじきかお皿をクリックすると、お皿に入るよ！（お皿のおはじきを押すと戻せます）</div>
        <div class="plates-area" id="plates-area">
            <!-- お皿と吹き出しが追加されていく -->
        </div>
    </div>

    <!-- 式の入力エリア（条件を満たすまでロック） -->
    <div class="answer-section locked-section" id="answer-section">
        <div class="step-title">何人に分けられるかを求める計算</div>
        <div class="calc-row">
            <input type="text" id="ans-total" class="num-input" placeholder="全部"> ÷ 
            <input type="text" id="ans-per" class="num-input" placeholder="1人分"> ＝ 
            <input type="text" id="ans-group" class="num-input" placeholder="人数">
        </div>
        <div class="calc-row mt-15">
            答え： 
            <input type="text" id="ans-final" class="num-input ans-highlight"> <span id="ans-unit">人</span>
        </div>
        <div class="action-area mt-15">
            <button class="btn-check" id="btn-check" onclick="checkAnswer()">答え合わせ</button>
        </div>
    </div>

    <!-- まとめ -->
    <div class="matome-box hidden" id="matome-box">
        <div class="matome-label">まとめ</div>
        全部おなじ数ずつ分けられるまで配ればいいね。<br>
        この計算も <strong>わり算</strong> の式で書くことができるよ！
    </div>

    <div class="footer-btns">
        <button class="btn-reset" onclick="resetCurrent()">やりなおす</button>
    </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

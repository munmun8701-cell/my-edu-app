<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小数うのしくみをしらべよう</title>
  <style>
    body {
      margin: 0;
      display: flex;
      height: 100vh;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: #f0f8ff;
    }
    #sidebar {
      width: 25%;
      background-color: #e6f2ff;
      padding: 20px;
      overflow-y: auto;
      border-right: 3px solid #b3d9ff;
      box-sizing: border-box;
    }
    #content {
      width: 75%;
      height: 100vh;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    h2 {
      text-align: center;
      color: #0066cc;
      font-size: 1.1rem;
      margin-bottom: 20px;
    }
    .menu-btn {
      display: block;
      padding: 12px;
      margin-bottom: 10px;
      background: #ffffff;
      border: 2px solid #99ccff;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      color: #333333;
      font-weight: bold;
      transition: background-color 0.2s, transform 0.1s;
    }
    .menu-btn:hover {
      background: #99ccff;
      color: #ffffff;
    }
    .menu-btn:active {
      transform: scale(0.98);
    }
    .back-btn {
      background: #b3d9ff;
      margin-top: 30px;
    }
    .back-btn:hover {
      background: #80bfff;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <h2>小数うのしくみをしらべよう</h2>
    
    <a href="./1/index.html" target="content-frame" class="menu-btn">1時間目</a>
    <a href="./2/index.html" target="content-frame" class="menu-btn">2時間目</a>
    <a href="./3/index.html" target="content-frame" class="menu-btn">3時間目</a>
    <a href="./4/index.html" target="content-frame" class="menu-btn">4時間目</a>
    <a href="./5/index.html" target="content-frame" class="menu-btn">5時間目</a>
    <a href="./6/index.html" target="content-frame" class="menu-btn">6時間目</a>
    <a href="./7/index.html" target="content-frame" class="menu-btn">7時間目</a>
    <a href="./8/index.html" target="content-frame" class="menu-btn">8時間目</a>
    <a href="./9/index.html" target="content-frame" class="menu-btn">9時間目</a>
    <a href="./10/index.html" target="content-frame" class="menu-btn">10時間目</a>
    <a href="./tashikameyou/index.html" target="content-frame" class="menu-btn">たしかめよう</a>

    <!-- target="_top" を追加し、../../ で2つ上の階層（トップページ）に戻るように修正 -->
    <a href="../../index.html" target="_top" class="menu-btn back-btn">🏠 もどる</a>
  </div>
  
  <div id="content">
    <iframe name="content-frame" src="./1/index.html"></iframe>
  </div>
</body>
</html>

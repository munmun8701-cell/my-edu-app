<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>4年生　　そろばん　2時間目</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
  <header>
    <div class="title-area">
      <div class="icon">🧮</div>
      <h1>そろばん学習：小数のたし算とひき算</h1>
    </div>
    <div class="mode-selectors">
      <button class="mode-btn active" onclick="setMode('examples')">教科書の例題（やり方）</button>
      <button class="mode-btn" onclick="setMode('practice')">練習問題</button>
      <button class="mode-btn" onclick="setMode('free')">自由に使う</button>
    </div>
  </header>
  
  <main>
    <div id="problem-area" class="problem-area">
      <div class="question-header">
        <h2 id="section-title">問題を選ぼう</h2>
      </div>
      <div id="problem-list" class="problem-content">
        </div>
    </div>
    
    <div class="soroban-section">
      <div class="soroban-wrapper">
        <div class="soroban" id="soroban">
          <div class="beam" id="beam"></div>
          <div class="rods-container" id="rods-container"></div>
        </div>
      </div>
      <div class="display-box">
        <span class="display-label">そろばんの数：</span>
        <span id="current-val" class="current-number">0</span>
      </div>
    </div>
    
    <div id="action-area" class="action-area">
      <div class="instruction-box" id="instruction-box">
        <h3 id="step-instruction">左から問題を選んでね。</h3>
        <p id="step-hint" class="hint-text"></p>
      </div>
      
      <div id="free-input-area" class="input-form-area hidden">
        <label>好きな数を入れてみよう（全角・半角OK）:</label>
        <div class="input-group">
          <input type="text" id="free-input" placeholder="例: 3.14" onchange="handleFreeInput()">
          <button class="action-btn" onclick="handleFreeInput()">設定</button>
        </div>
      </div>

      <button id="btn-check" class="action-btn check-btn hidden" onclick="checkAnswer()">できた！</button>
    </div>
  </main>
  
  <div id="success-overlay" class="success-overlay hidden">
    <div class="success-box">
      <h3>🎉 ばっちり！ 🎉</h3>
      <p id="success-message">次のステップにすすもう！</p>
      <button class="action-btn" onclick="closeSuccessOverlay()">OK</button>
    </div>
  </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>グラフや表を使って考えよう - 4年生 算数</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    :root {
      --bg-deep: #02040a;
      --bg-surface: rgba(15, 23, 42, 0.65);
      --bg-card: rgba(10, 15, 30, 0.7);
      --border-cyan: rgba(0, 242, 255, 0.25);
      --border-purple: rgba(168, 85, 247, 0.3);
      --accent-cyan: #00f2ff;
      --accent-purple: #a855f7;
      --accent-pink: #ec4899;
      --accent-gold: #fbbf24;
      --accent-emerald: #10b981;
      --text-main: #94a3b8;
      --text-bright: #f8fafc;
      --radius-card: 16px;
      --glow-cyan: 0 0 20px rgba(0, 242, 255, 0.5);
      --glow-purple: 0 0 20px rgba(168, 85, 247, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif;
      background-color: var(--bg-deep); 
      color: var(--text-main);
      min-height: 100vh; 
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(0, 242, 255, 0.05), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.05), transparent 25%);
    }

    /* 背景のアニメーショングリッド */
    .cyber-grid {
      position: fixed; inset: 0; z-index: -2; pointer-events: none;
      background-image: 
        linear-gradient(to right, rgba(0, 242, 255, 0.03) 1px, transparent 1px), 
        linear-gradient(to bottom, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px; 
      transform: perspective(500px) rotateX(60deg);
      transform-origin: bottom; height: 200vh; top: -100vh;
      animation: gridMove 15s linear infinite;
    }
    @keyframes gridMove { 
      from { transform: perspective(500px) rotateX(60deg) translateY(0); } 
      to { transform: perspective(500px) rotateX(60deg) translateY(50px); } 
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
      position: relative;
      z-index: 1;
    }

    /* ヘッダー周り */
    .header-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 50px;
      animation: fadeInDown 0.8s ease forwards;
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .back-btn {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      margin-bottom: 20px;
    }
    .back-btn:hover {
      background: rgba(0,242,255,0.15);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: var(--glow-cyan);
      transform: translateX(-5px);
    }

    .unit-badge {
      display: inline-block;
      background: rgba(168, 85, 247, 0.15);
      color: var(--accent-purple);
      border: 1px solid var(--border-purple);
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 1px;
      margin-bottom: 16px;
      box-shadow: var(--glow-purple);
    }

    .main-title {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 900;
      background: linear-gradient(to right, #fff, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(0,242,255,0.3));
      margin-bottom: 16px;
    }

    .sub-title {
      color: #cbd5e1;
      font-size: 1.1rem;
      max-width: 600px;
      line-height: 1.6;
    }

    /* レッスングリッド */
    .lesson-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 24px;
    }

    .lesson-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-cyan);
      border-radius: var(--radius-card);
      padding: 30px 24px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(30px);
      animation: popIn 0.6s ease forwards;
    }

    @keyframes popIn {
      to { opacity: 1; transform: translateY(0); }
    }

    /* アニメーション遅延 */
    .lesson-card:nth-child(1) { animation-delay: 0.1s; }
    .lesson-card:nth-child(2) { animation-delay: 0.2s; }
    .lesson-card:nth-child(3) { animation-delay: 0.3s; }
    .lesson-card:nth-child(4) { animation-delay: 0.4s; }
    .lesson-card:nth-child(5) { animation-delay: 0.5s; }
    .lesson-card:nth-child(6) { animation-delay: 0.6s; }
    .lesson-card:nth-child(7) { animation-delay: 0.7s; }
    .lesson-card:nth-child(8) { animation-delay: 0.8s; }

    .lesson-card::before {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
      opacity: 0; transition: opacity 0.3s; pointer-events: none; mix-blend-mode: overlay;
    }

    .lesson-card:hover {
      border-color: var(--accent-cyan);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 242, 255, 0.15);
      transform: translateY(-10px) scale(1.02);
      z-index: 10;
    }
    .lesson-card:hover::before { opacity: 1; }

    .card-icon {
      width: 70px;
      height: 70px;
      border-radius: 20px;
      background: rgba(0, 242, 255, 0.1);
      border: 1px solid rgba(0, 242, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: var(--accent-cyan);
      margin-bottom: 20px;
      transition: all 0.4s ease;
    }
    .lesson-card:hover .card-icon {
      background: var(--accent-cyan);
      color: var(--bg-deep);
      box-shadow: 0 0 25px rgba(0, 242, 255, 0.8);
      transform: rotate(5deg) scale(1.1);
    }

    .lesson-num {
      color: var(--accent-gold);
      font-size: 0.85rem;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .lesson-title {
      color: #fff;
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .play-text {
      color: var(--accent-cyan);
      font-weight: 800;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: auto;
      opacity: 0.8;
      transition: 0.3s;
    }
    .lesson-card:hover .play-text {
      opacity: 1;
      letter-spacing: 1px;
    }

    /* 「たしかめよう」の特別スタイル */
    .card-special {
      border-color: var(--border-pink);
    }
    .card-special .card-icon {
      background: rgba(236, 72, 153, 0.1);
      border-color: rgba(236, 72, 153, 0.4);
      color: var(--accent-pink);
    }
    .lesson-card.card-special:hover {
      border-color: var(--accent-pink);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(236, 72, 153, 0.15);
    }
    .lesson-card.card-special:hover .card-icon {
      background: var(--accent-pink);
      color: var(--bg-deep);
      box-shadow: 0 0 25px rgba(236, 72, 153, 0.8);
    }
    .card-special .play-text { color: var(--accent-pink); }
    .card-special .lesson-num { color: var(--accent-pink); }

    @media (max-width: 600px) {
      .lesson-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="cyber-grid"></div>

  <div class="container">
    <a href="../../index.html" class="back-btn sfx-click"><i class="fa-solid fa-arrow-left"></i> ポータルへもどる</a>

    <div class="header-section">
      <div class="unit-badge"><i class="fa-solid fa-calculator"></i> 4年生 算数</div>
      <h1 class="main-title">グラフや表を使って考えよう</h1>
      <p class="sub-title">折れ線グラフの読み方やかき方、変化のようすの調べ方を学習しよう！1時間目から順番に進めてね。</p>
    </div>

    <div class="lesson-grid">
      <!-- 1時間目 -->
      <a href="./1/index.html" class="lesson-card sfx-click">
        <div class="card-icon"><i class="fa-solid fa-chart-line"></i></div>
        <div class="lesson-num">第 1 時</div>
        <h2 class="lesson-title">折れ線グラフの<br>読み方</h2>
        <div class="play-text">学習する <i class="fa-solid fa-circle-play"></i></div>
      </a>

      <!-- 2時間目 -->
      <a href="./2/index.html" class="lesson-card sfx-click">
        <div class="card-icon"><i class="fa-solid fa-arrow-trend-up"></i></div>
        <div class="lesson-num">第 2 時</div>
        <h2 class="lesson-title">折れ線グラフの<br>特ちょう</h2>
        <div class="play-text">学習する <i class="fa-solid fa-circle-play"></i></div>
      </a>

      <!-- 3時間目 -->
      <a href="./3/index.html" class="lesson-card sfx-click">
        <div class="card-icon"><i class="fa-solid fa-pen-ruler"></i></div>
        <div class="lesson-num">第 3 時</div>
        <h2 class="lesson-title">折れ線グラフの<br>かき方</h2>
        <div class="play-text">学習する <i class="fa-solid fa-circle-play"></i></div>
      </a>

      <!-- 4時間目 -->
      <a href="./4/index.html" class="lesson-card sfx-click">
        <div class="card-icon"><i class="fa-solid fa-water"></i></div>
        <div class="lesson-num">第 4 時</div>
        <h2 class="lesson-title">波線（省略）を<br>使ったグラフ</h2>
        <div class="play-text">学習する <i class="fa-solid fa-circle-play"></i></div>
      </a>

      <!-- 5時間目 -->
      <a href="./5/index.html" class="lesson-card sfx-click">
        <div class="card-icon"><i class="fa-solid fa-chart-area"></i></div>
        <div class="lesson-num">第 5 時</div>
        <h2 class="lesson-title">２つの折れ線<br>グラフ</h2>
        <div class="play-text">学習する <i class="fa-solid fa-circle-play"></i></div>
      </a>

      <!-- 6時間目 -->
      <a href="./6/index.html" class="lesson-card sfx-click">
        <div class="card-icon"><i class="fa-solid fa-table-list"></i></div>
        <div class="lesson-num">第 6 時</div>
        <h2 class="lesson-title">表の整理と<br>まとめ方</h2>
        <div class="play-text">学習する <i class="fa-solid fa-circle-play"></i></div>
      </a>

      <!-- 7時間目 -->
      <a href="./7/index.html" class="lesson-card sfx-click">
        <div class="card-icon"><i class="fa-solid fa-magnifying-glass-chart"></i></div>
        <div class="lesson-num">第 7 時</div>
        <h2 class="lesson-title">グラフと表の<br>まとめ</h2>
        <div class="play-text">学習する <i class="fa-solid fa-circle-play"></i></div>
      </a>

      <!-- たしかめよう -->
      <a href="./tashikameyou/index.html" class="lesson-card card-special sfx-click">
        <div class="card-icon"><i class="fa-solid fa-check-double"></i></div>
        <div class="lesson-num">まとめテスト</div>
        <h2 class="lesson-title">たしかめよう</h2>
        <div class="play-text">ちょうせんする <i class="fa-solid fa-flag-checkered"></i></div>
      </a>
    </div>
  </div>

  <script>
    // 効果音（SFX）の簡易ロジック（ポータル共通の操作感のため）
    let audioCtx;
    async function playClickSFX() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      osc.type = 'square';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
    }

    document.querySelectorAll('.sfx-click').forEach(el => {
      el.addEventListener('click', (e) => {
        // 別ページへの遷移の場合、音が鳴る余裕を持たせるなら少し遅延させる方法もありますが、
        // ここではクリックと同時に発音させるのみとします。
        playClickSFX();
      });
    });
  </script>
</body>
</html>

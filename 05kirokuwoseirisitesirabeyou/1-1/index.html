<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>記録を整理して調べよう　１時間目　①</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="school-app">
  <header>
    <h1><i class="fas fa-hospital-user"></i> けが調べ・集計アプリ</h1>
    <p class="guide">先生が読み上げる言葉に合わせて、あてはまるボタンを押してみよう！</p>
  </header>

  <div class="main-layout">
    <section class="tally-section">
      <h2>1. 正の字で かこう</h2>
      <div id="category-list"></div>
    </section>

    <section class="result-section">
      <h2>2. 数を 数字にかこう</h2>
      <table id="result-table">
        <thead>
          <tr>
            <th>じかん</th>
            <th>人数（人）</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
        <tfoot>
          <tr class="total-row">
            <td>合計（ごうけい）</td>
            <td id="total-val">0</td>
          </tr>
        </tfoot>
      </table>

      <div class="poster-analysis">
        <h3><i class="fas fa-lightbulb"></i> ポスターに 何をかく？</h3>
        <p id="analysis-text">データを集めて、ポスターの作戦をたてよう！</p>
        <div class="hint-box" id="hint-box" style="display:none;">
          <p><strong>ヒント：</strong>一番多いのは「<span id="top-cat"></span>」だね！<br>ポスターには「<span id="top-msg"></span>」ってかくと伝わりやすいよ！</p>
        </div>
      </div>
    </section>
  </div>

  <div class="footer-actions">
    <button class="reset-btn" onclick="resetAll()"><i class="fas fa-undo"></i> 最初からやりなおす</button>
  </div>
</div>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script  src="./script.js"></script>

  </body>
  
</html>

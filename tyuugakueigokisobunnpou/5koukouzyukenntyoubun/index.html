<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>むん先生の英語クエスト｜長文読解</title>
<link rel="stylesheet" href="style.css">
<style>
  .passage{background:#08102a;border:1px solid var(--line);border-radius:12px;padding:14px;line-height:1.9;font-size:1.05rem;margin-bottom:14px}
  .col1{grid-template-columns:1fr !important}
  .eq-q{font-size:1.1rem;font-weight:700;margin:6px 0 10px}
  .lvcard .info small{line-height:1.5}
</style>
</head>
<body>
<header class="top">
  <div class="logo">むん先生の英語クエスト<small>長文読解 ｜ 通信なし・きろくはこの端末だけに保存</small></div>
  <div class="score">★ <span id="totalStars">0</span></div>
</header>

<main>
  <section id="scr-home" class="screen">
    <div class="card">
      <div class="kicker">READING</div>
      <h2>長文読解トレーニング</h2>
      <p class="muted">本文を読んで、設問に答える練習です。★1から順に、本文の長さと設問の難しさが上がります。<br>まちがえた設問の種類は「苦手マップ」で確認できます。</p>
    </div>
    <div id="levelList"></div>
    <div class="btn-row"><button id="toMap">🗺 苦手マップ</button></div>
    <div class="btn-row"><button class="ghost" id="resetBtn">きろくをリセット</button></div>
  </section>

  <section id="scr-quiz" class="screen">
    <div class="qhead"><span id="qLabel" class="kicker"></span><button class="ghost" id="quitBtn">やめる</button></div>
    <div class="qhead"><span class="muted" id="qCount"></span></div>
    <div class="progress"><span id="qProg"></span></div>
    <div class="card" id="qBox"></div>
  </section>

  <section id="scr-result" class="screen"><div id="resultBody"></div></section>

  <section id="scr-map" class="screen"><div id="mapBody"></div></section>
</main>

<p class="foot">むん先生の学習クエスト ｜ 長文読解 ｜ 通信は使いません</p>

<script src="data1.js"></script>
<script src="data2.js"></script>
<script src="data3.js"></script>
<script src="app.js"></script>
</body>
</html>

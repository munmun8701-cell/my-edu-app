<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>むん先生の英語クエスト｜高校受験</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="logo">むん先生の英語クエスト<small>高校受験 ｜ 通信なし・きろくはこの端末だけに保存</small></div>
  <div class="score">★ <span id="totalStars">0</span></div>
</header>

<main>
  <section id="scr-home" class="screen">
    <div class="card">
      <div class="kicker">EXAM</div>
      <h2>高校受験</h2>
      <p class="muted">be動詞からはじまる英語の冒険。ステージを1つずつクリアして、最後のボスにいどもう！<br>まちがえた所は「苦手マップ」で見つけられるよ。</p>
    </div>
    <div id="stageList"></div>
    <div class="btn-row"><button id="toMap">🗺 苦手マップ</button></div>
    <div class="btn-row"><button class="ghost" id="resetBtn">きろくをリセット</button></div>
  </section>

  <section id="scr-stage" class="screen"><div id="stageBody"></div></section>

  <section id="scr-learn" class="screen"><div id="learnBody"></div></section>

  <section id="scr-quiz" class="screen">
    <div class="qhead"><span id="qLabel" class="kicker"></span><button class="ghost" id="quitBtn">やめる</button></div>
    <div class="qhead"><span class="muted" id="qCount"></span></div>
    <div class="progress"><span id="qProg"></span></div>
    <div class="card" id="qBox"></div>
  </section>

  <section id="scr-result" class="screen"><div id="resultBody"></div></section>

  <section id="scr-map" class="screen"><div id="mapBody"></div></section>
</main>

<p class="foot">むん先生の学習クエスト ｜ 英語（高校受験）｜ 通信は使いません</p>

<script src="data1.js"></script>
<script src="data2.js"></script>
<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>大きな数の筆算　２時間目　②</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
    <div class="header-title">🌟 たし算の筆算れんしゅう 🌟</div>

    <div class="problem-selector">
        もんだいをえらぼう：
        <select id="prob-select" onchange="loadProblem()">
            <option value="1">① 196 ＋ 739</option>
            <option value="2">② 264 ＋ 148</option>
            <option value="3">③ 379 ＋ 62</option>
            <option value="4">④ 26 ＋ 785</option>
            <option value="5">⑤ 205 ＋ 398</option>
            <option value="6">⑥ 487 ＋ 17</option>
            <option value="7">⑦ 623 ＋ 514</option>
            <option value="8">⑧ 407 ＋ 834</option>
            <option value="9">⑨ 942 ＋ 58</option>
        </select>
    </div>

    <div class="nav-board" id="nav-board">
        <div class="nav-title" id="nav-title">ステップ ①：式をたてよう</div>
        <div class="nav-msg" id="nav-msg">
            上の問題を見て、マスに数字を入れよう。<br>
            <strong>右はし（一の位）をピタッとそろえる</strong>のがポイントだよ！<br>
            何もない位（くらい）は空っぽのままにしてね。
        </div>
    </div>

    <div class="split-layout">
        <div class="calc-workspace">
            <div class="grid-paper">
                <div class="cell blank"></div>
                <div class="cell carry-wrapper"><input type="text" id="carry-1000" class="carry-input hidden" maxlength="1" placeholder="1" disabled></div>
                <div class="cell carry-wrapper"><input type="text" id="carry-100" class="carry-input hidden" maxlength="1" placeholder="1" disabled></div>
                <div class="cell carry-wrapper"><input type="text" id="carry-10" class="carry-input hidden" maxlength="1" placeholder="1" disabled></div>
                <div class="cell blank"></div>

                <div class="cell blank"></div>
                <div class="cell blank"></div>
                <div class="cell input-wrapper"><input type="text" id="op1-100" class="ans-input col-100" maxlength="1"></div>
                <div class="cell input-wrapper"><input type="text" id="op1-10" class="ans-input col-10" maxlength="1"></div>
                <div class="cell input-wrapper"><input type="text" id="op1-1" class="ans-input col-1" maxlength="1"></div>

                <div class="cell sign">＋</div>
                <div class="cell blank line"></div>
                <div class="cell input-wrapper line"><input type="text" id="op2-100" class="ans-input col-100" maxlength="1"></div>
                <div class="cell input-wrapper line"><input type="text" id="op2-10" class="ans-input col-10" maxlength="1"></div>
                <div class="cell input-wrapper line"><input type="text" id="op2-1" class="ans-input col-1" maxlength="1"></div>

                <div class="cell blank"></div>
                <div class="cell input-wrapper" id="wrap-1000"><input type="text" id="ans-1000" class="ans-input col-1000 hidden" maxlength="1" disabled></div>
                <div class="cell input-wrapper" id="wrap-100"><input type="text" id="ans-100" class="ans-input col-100" maxlength="1" disabled></div>
                <div class="cell input-wrapper" id="wrap-10"><input type="text" id="ans-10" class="ans-input col-10" maxlength="1" disabled></div>
                <div class="cell input-wrapper" id="wrap-1"><input type="text" id="ans-1" class="ans-input col-1" maxlength="1" disabled></div>
            </div>

            <button class="btn-check mt-15" id="btn-calc" onclick="processStep()">かくにん</button>
        </div>

        <div class="blocks-workspace">
            <div class="blocks-title">お金のブロックで考えよう</div>
            
            <div class="block-row">
                <div class="block-label">千の位</div>
                <div class="block-area" id="blocks-1000"></div>
            </div>

            <div class="block-row">
                <div class="block-label">百の位</div>
                <div class="block-area" id="blocks-100"></div>
            </div>

            <div class="block-row">
                <div class="block-label">十の位</div>
                <div class="block-area" id="blocks-10"></div>
            </div>

            <div class="block-row">
                <div class="block-label">一の位</div>
                <div class="block-area" id="blocks-1"></div>
            </div>

            <button class="btn-action hidden" id="btn-group" onclick="doGroup()">
                🔄 10こ集まったよ！両がえしよう！
            </button>
        </div>
    </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>長さ　たしかめよう　①</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="app-container">
    <div id="start-screen" class="screen">
        <h1>道のり・きょり・長さのたんい マスタークイズ</h1>
        <p>ぜんぶで 30問 あるよ！<br>さいごに 君の「とくい」と「ニガテ」がわかるよ。</p>
        <button id="start-btn" class="main-btn">クイズを スタート！</button>
    </div>

    <div id="quiz-screen" class="screen hidden">
        <div class="progress-container">
            <span id="q-number">第 1 問 / 30</span>
            <div class="progress-bar-bg"><div id="progress-bar"></div></div>
        </div>
        
        <div class="question-container">
            <h2 id="question-text">もんだい文がここに入ります</h2>
            
            <button id="hint-btn" class="hint-btn">💡 ヒントをみる</button>
            <div id="hint-box" class="hint-box hidden">
                <p id="hint-text">ここにヒントが出ます</p>
            </div>
            
            <div id="options-container" class="options-grid">
                </div>
        </div>
    </div>

    <div id="result-screen" class="screen hidden">
        <h1>クイズ しゅうりょう！</h1>
        <div class="score-box">
            <p>あなたの せいかい数は…</p>
            <h2 class="score-text"><span id="final-score">0</span> / 30 問</h2>
        </div>
        
        <div class="feedback-box">
            <h3>📊 君の レーダーチャート（とくちょう）</h3>
            <ul id="category-results" class="category-list">
                </ul>
            
            <div class="advice-box">
                <h3>👨‍🏫 先生からの アドバイス</h3>
                <p id="advice-text"></p>
            </div>
        </div>
        
        <button id="retry-btn" class="main-btn">もういちど ちょうせんする</button>
    </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>きょりと長さ</title>
  <style>
    body {
      margin: 0;
      display: flex;
      height: 100vh;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: #fffdf5; /* 温かみのある薄い黄色 */
    }
    #sidebar {
      width: 25%;
      background-color: #fff3e0; /* パステルオレンジ */
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
      border-right: 3px solid #ffd8a8;
    }
    #content {
      width: 75%;
      height: 100vh;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    h2 {
      text-align: center;
      color: #e67e22; /* 濃いオレンジ色 */
      font-size: 1.2rem;
      margin-bottom: 20px;
    }
    .menu-btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      background-color: white;
      border: 2px solid #ffb347; /* オレンジ色の枠線 */
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      color: #333;
      font-weight: bold;
      cursor: pointer;
      box-sizing: border-box;
      transition: all 0.2s;
    }
    .menu-btn:hover {
      background-color: #ffb347;
      color: white;
      transform: translateY(-2px);
    }
    .back-btn {
      background-color: #ffb6c1;
      border-color: #ff69b4;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>きょりと長さ</h2>
    
    <a href="./1-1/index.html" target="content-frame" class="menu-btn">1時間目</a>
    <a href="./2-1/index.html" target="content-frame" class="menu-btn">2時間目①</a>
    <a href="./2-2/index.html" target="content-frame" class="menu-btn">2時間目②</a>
    <a href="./tasikameyou1/index.html" target="content-frame" class="menu-btn">たしかめよう①</a>
    <a href="./tasikameyou2/index.html" target="content-frame" class="menu-btn">たしかめよう②</a>


    <a href="../index.html" class="menu-btn back-btn">🏠 もどる</a>
  </div>

  <div id="content">
    <iframe name="content-frame" src="./1-1/index.html"></iframe>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>長さ　２時間目　①</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="container">
    <h1>はかり方をえらんで、式を立ててみよう！</h1>
    <p class="instruction">地図の上の丸（●）をじゅんばんにタッチして道をつなぎ、長さを計算しよう。</p>
    
    <div class="controls">
        <button id="mode-kyori">まっすぐはかる（きょり）</button>
        <button id="mode-michinori" class="active-michinori">道にそってはかる（道のり）</button>
        <button id="reset-btn" class="reset-btn">やりなおす</button>
    </div>

    <div class="map-container" id="map">
        <canvas id="linesCanvas" width="800" height="480"></canvas>
    </div>

    <div class="equation-box" id="equation-area">
        <span style="color: #666; font-size: 18px;">地図をタッチして、道をえらんでね。</span>
    </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>
